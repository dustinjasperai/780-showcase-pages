<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Galloway Mix — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Cabin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2ea;      /* their cream page ground (brand.json, 24 uses) */
    --panel:#f4ece0;   /* warm bronze-tinted sand panel, from their bronze accent family */
    --ink:#2a373e;     /* their dominant body slate (67 uses) */
    --ink-soft:#52606a;
    --rule:#2a373e;
    --accent:#af8c6b;  /* their second-ranked warm bronze (38 uses) */
    --accent-deep:#8f6f4f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Cabin',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid rgba(42,55,62,.12);border-radius:4px;
    padding:56px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(42,55,62,.04)}
  .kicker{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:13px;color:var(--accent-deep);margin-bottom:22px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:58px;line-height:1.02;letter-spacing:.005em;margin-bottom:20px}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:38px;line-height:1.08;margin-bottom:18px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink-soft);max-width:62ch}
  p{font-size:18px;line-height:1.6;max-width:62ch;margin-bottom:14px}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:2px;margin:0 0 26px}
  .big{font-size:30px;line-height:1.3;font-weight:500;max-width:60ch}
  ul{list-style:none;margin:8px 0 0}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 46px;position:relative;border-top:1px solid rgba(42,55,62,.1);max-width:64ch}
  li:first-child{border-top:none}
  li .num{position:absolute;left:0;top:13px;font-family:'Oswald',sans-serif;font-weight:700;color:var(--accent);font-size:20px}
  li b{font-weight:600}
  .block{display:flex;gap:18px;align-items:flex-start;margin-top:10px}
  .block .tag{font-family:'Oswald',sans-serif;font-weight:700;font-size:22px;color:var(--accent);min-width:44px}
  .muted{color:var(--ink-soft);font-size:16px}
  .quote{font-family:'Oswald',sans-serif;font-weight:400;font-size:30px;line-height:1.3;max-width:56ch}
  .cite{margin-top:18px;font-size:16px;color:var(--ink-soft);letter-spacing:.02em}
  .cta-card{background:var(--ink);color:var(--bg);border-radius:4px;padding:56px 60px}
  .cta-card .kicker{color:var(--accent)}
  .cta-card h2{color:var(--bg)}
  .cta-card p{color:#d8d2c7}
  .cta-step{font-family:'Oswald',sans-serif;font-weight:600;font-size:22px;color:var(--bg);margin-top:18px}
  .disc{font-size:13px;line-height:1.5;color:#b9b1a2;margin-top:30px;max-width:70ch}
  .foot{font-family:'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--ink-soft);margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
   k:'A live masterclass with Jack Galloway',
   h:'The Galloway Mix',
   s:'The 6 building blocks of a business that keeps growing without breaking the thing that made it work: your people.'},

  {t:'who',
   k:'Who this is for',
   h:'You grew. Now the team feels thinner than the revenue.',
   body:['This is for CEOs and owners of a company that is genuinely growing, where the numbers are up and yet something underneath feels stretched.',
         'Maybe the team you trusted at ten people is straining at thirty. Maybe a past win is quietly turning into a culture you no longer recognize. Maybe there is one problem right now that will not wait.',
         'You do not need a pep talk. You need the building blocks a growing company has to get right, in the order they have to get them right.']},

  {t:'hook',
   k:'The uncomfortable part',
   big:'Growth is not what saves most companies. Growth is what exposes them.',
   body:['Every weak seam you could hide at your old size gets pulled wide open by scale. The vague vision. The person in the wrong seat. The process that only worked because you were watching it.',
         'Revenue climbs, so you assume the machine is fine. It is not the machine. It is the six blocks underneath it.']},

  {t:'part',
   k:'Part One',
   h:'The real problem is not effort. It is structure.',
   body:['Most owners respond to strain by working harder and asking the team to do the same. For a while it holds. Then it does not.',
         'The companies that keep growing are not the ones that hustle hardest. They are the ones built on a small number of blocks that stay solid while everything around them changes.',
         'I spent 22 years watching exactly which blocks hold and which ones crack under growth. I put the ones that matter into one model.']},

  {t:'part',
   k:'Part One',
   h:'Almost every growth problem traces back to one loose block.',
   body:['When an owner tells me the team is burning out, or the quality slipped, or a great hire is suddenly underperforming, we do not start with the symptom. We find the block it is sitting on.',
         'Burnout is often a seating problem. Slipping quality is usually a process problem. A stalled plan is frequently a vision that was never clear enough to plan from. Name the block and the fix stops being a guess.']},

  {t:'intro',
   k:'Part Two: the framework',
   h:'The Galloway Mix',
   lead:'Six building blocks of a healthy, growing business. Not six things to admire. Six things to check, in order, whenever growth starts to hurt.'},

  {t:'block', tag:'01', h:'A Vision We Are Excited About',
   body:['A destination the team actually wants to run toward, stated plainly enough that a new hire could repeat it back.',
         'When the vision is fuzzy, every decision becomes a negotiation. When it is clear, the team starts making your calls for you.']},

  {t:'block', tag:'02', h:'A Plan to Get Us There',
   body:['The bridge between the vision and Monday morning. The handful of moves, this quarter, that actually close the gap.',
         'A vision without a plan is a poster. A plan without a vision is busywork. Growing companies need both pointed at the same place.']},

  {t:'block', tag:'03', h:'The Right People in the Right Seats',
   body:['The block most growing owners get wrong, and the one that costs the most. Not just good people. The right people, doing the work that fits them, in a seat that actually exists.',
         'Half of what feels like a strategy problem at scale is a seating problem wearing a strategy costume.']},

  {t:'block', tag:'04', h:'Products & Services We Are Proud Of',
   body:['An offer the team can stand behind without flinching. Pride is not a soft metric. It is what lets your best people sell without apologizing.',
         'If the team quietly does not believe in what you ship, no amount of marketing outruns it.']},

  {t:'block', tag:'05', h:'Reliable & Consistent Processes',
   body:['The operating discipline that keeps quality steady as volume climbs. The parts of the business that should run the same whether or not you are in the room.',
         'Process is how you turn one good result into a hundred. Without it, every new customer is a new emergency.']},

  {t:'block', tag:'06', h:'Profits That Allow Us to Reinvest',
   body:['Profit treated as fuel for the next stage, not an afterthought you hope is there at year end. Healthy margin is what buys you the right people and the better product.',
         'This is also where paying your team well stops being a cost and starts being the engine, when the plan for it scales with the business instead of breaking it.']},

  {t:'part',
   k:'Part Three: when it holds',
   h:'When the Mix holds, growth stops hurting.',
   body:['You feel it first in the calendar. The problems that used to land on you start getting solved one level down, because the vision is clear, the seats are right, and the process holds.',
         'The company gets bigger and you get less cornered, not more. That is the whole point. Growth should buy you room, not take it away.']},

  {t:'part',
   k:'Part Three: when it holds',
   h:'The blocks compound. So do the cracks.',
   body:['Here is the part owners feel but rarely name: these six are not a checklist you clear once. They lean on each other.',
         'The right people make the process stick. The process protects the product. The product funds the profit. The profit pays for better people. Fix one block well and the next one gets easier. Ignore one and the strain shows up two blocks over, looking like a different problem entirely.']},

  {t:'part',
   k:'Part Three: when it holds',
   h:'What actually changes for you.',
   body:['Your best people stop waiting on you to make calls they are closer to than you are. Your week stops being a string of emergencies you personally defuse.',
         'And the growth you already earned stops feeling like a risk you are managing, and starts feeling like a foundation you are building on. Same company. Very different to run.']},

  {t:'why',
   k:'Why I can say this',
   quote:'I did not read about this. I helped build it, from a startup to a national brand.',
   body:['I joined Dave Ramsey early and spent 22 years there, leading five business units as they grew into a company doing hundreds of millions in revenue. Roughly 50,000 hours solving the exact problems a growing company runs into.',
         'The Galloway Mix is not a theory I admired from the outside. It is the set of blocks I watched decide which growth held and which growth broke.'],
   cite:'Dave Ramsey: Jack was among the leaders who grew our little company into a national brand.'},

  {t:'recap',
   k:'The six blocks, together',
   h:'One mix. Check it in order.',
   list:[['Vision','a destination the team wants'],
         ['Plan','the moves that close the gap'],
         ['Right people, right seats','the block most growth breaks on'],
         ['Products you are proud of','an offer the team believes in'],
         ['Reliable processes','quality that holds at volume'],
         ['Profit to reinvest','fuel for the next stage']]},

  {t:'cta',
   k:'Your next step',
   h:'Let us look at your six blocks together.',
   body:['If your company is growing and something underneath feels stretched, the fastest way to find the loose block is to walk through the Mix with someone who has seen it break a hundred ways.',
         'Book a free call with me and we will find the one block costing you the most right now, and what it takes to make it hold.'],
   step:'Book your free call with Jack',
   disc:'Educational content only. Every business is different and results vary; nothing here is a guarantee of any specific financial or business outcome. Examples describe general principles, not promised results.'}
];

const deck=document.getElementById('deck');
function esc(x){return x}
S.forEach(function(sl){
  const el=document.createElement('section');
  el.className='slide'+(sl.t==='cta'?' cta-card':'');
  let h='';
  if(sl.k) h+='<div class="kicker">'+sl.k+'</div>';
  if(sl.t==='title'){ h+='<h1>'+sl.h+'</h1><div class="rule"></div><p class="lead">'+sl.s+'</p>'; }
  else if(sl.t==='hook'){ h+='<div class="rule"></div><p class="big">'+sl.big+'</p>'; sl.body.forEach(function(p){h+='<p>'+p+'</p>'}); }
  else if(sl.t==='intro'){ h+='<h2>'+sl.h+'</h2><div class="rule"></div><p class="lead">'+sl.lead+'</p>'; }
  else if(sl.t==='block'){ h+='<div class="block"><span class="tag">'+sl.tag+'</span><div><h2>'+sl.h+'</h2>'; sl.body.forEach(function(p){h+='<p>'+p+'</p>'}); h+='</div></div>'; }
  else if(sl.t==='why'){ h+='<p class="quote">'+sl.quote+'</p><div class="rule"></div>'; sl.body.forEach(function(p){h+='<p>'+p+'</p>'}); h+='<p class="cite">'+sl.cite+'</p>'; }
  else if(sl.t==='recap'){ h+='<h2>'+sl.h+'</h2><div class="rule"></div><ul>'; sl.list.forEach(function(r,i){h+='<li><span class="num">'+String(i+1).padStart(2,'0')+'</span><b>'+r[0]+'</b> : '+r[1]+'</li>'}); h+='</ul>'; }
  else if(sl.t==='cta'){ h+='<h2>'+sl.h+'</h2><div class="rule"></div>'; sl.body.forEach(function(p){h+='<p>'+p+'</p>'}); h+='<p class="cta-step">'+sl.step+'</p><p class="disc">'+sl.disc+'</p>'; }
  else { h+='<h2>'+sl.h+'</h2><div class="rule"></div>'; if(sl.lead)h+='<p class="lead">'+sl.lead+'</p>'; if(sl.body)sl.body.forEach(function(p){h+='<p>'+p+'</p>'}); }
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
