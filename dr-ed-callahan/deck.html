<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Chaos to Confidence | Dr. Ed Callahan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Merriweather:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f5f0;        /* warm paper, their light scheme */
    --panel:#eef1ef;     /* soft panel */
    --rule:#d7dedd;      /* hairline */
    --ink:#1c2838;       /* their dominant text hex */
    --ink-soft:#3c4654;
    --ink-muted:#6c7682;
    --accent:#446666;    /* their slate-teal brand color */
    --accent-soft:#6a8a8a;
  }
  html,body{height:100%}
  body{
    font-family:'Merriweather',Georgia,serif;
    background:var(--bg);color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  #stage{width:100vw;height:100vh;position:relative}
  .slide{
    position:absolute;inset:0;display:none;
    flex-direction:column;justify-content:center;
    padding:8vh 10vw;
  }
  .slide.on{display:flex}
  .kicker{font-family:'Merriweather',serif;font-weight:700;font-size:13px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:clamp(34px,6vw,68px);
    line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin-bottom:24px}
  h2{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(28px,4.4vw,48px);
    line-height:1.14;color:var(--ink);margin-bottom:22px}
  p{font-size:clamp(17px,2vw,23px);line-height:1.6;color:var(--ink-soft);max-width:60ch;margin-bottom:16px;font-weight:300}
  p strong{color:var(--ink);font-weight:700}
  .lede{font-size:clamp(19px,2.3vw,27px);color:var(--ink-soft)}
  ul{list-style:none;margin-top:10px}
  li{font-size:clamp(16px,1.9vw,22px);line-height:1.5;color:var(--ink-soft);
    padding-left:30px;position:relative;margin-bottom:16px;max-width:58ch;font-weight:300}
  li::before{content:"";position:absolute;left:0;top:.6em;width:12px;height:2px;background:var(--accent)}
  li b{color:var(--ink);font-weight:700}
  .num{font-family:'Playfair Display',serif;font-size:clamp(40px,7vw,86px);color:var(--accent-soft);
    font-weight:600;line-height:1;margin-bottom:14px}
  .panel{background:var(--panel);border-left:3px solid var(--accent);padding:28px 32px;max-width:62ch;border-radius:2px}
  .panel p{margin-bottom:0}
  .credit{font-size:clamp(15px,1.7vw,19px);color:var(--ink-muted);margin-top:26px;font-weight:300}
  .disclaimer{font-size:13px;color:var(--ink-muted);margin-top:30px;max-width:64ch;font-weight:300;line-height:1.5}
  .cta-step{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(20px,2.6vw,30px);
    color:var(--accent);margin-top:18px}
  footer{position:fixed;bottom:22px;left:0;right:0;display:flex;justify-content:space-between;
    align-items:center;padding:0 40px;font-family:'Merriweather',serif;font-size:12px;color:var(--ink-muted);
    letter-spacing:.04em}
  .nav-hint{font-weight:300}
  .dot{font-weight:700;color:var(--accent)}
  @media(max-width:640px){.slide{padding:10vh 8vw}footer{padding:0 20px}}
</style>
</head>
<body>
<div id="stage"></div>
<footer>
  <span>Dr. Ed Callahan, Ph.D. &nbsp;&middot;&nbsp; Neurodiversity University</span>
  <span class="nav-hint">Use arrow keys &nbsp;<span class="dot">&rarr;</span></span>
</footer>
<script>
const S = [
  {t:'title',
    kicker:'A Masterclass for Parents',
    h:'From Chaos to Confidence',
    p:'A new approach for parenting neurodivergent teens and young adults, so your child can move toward an independent, thriving adulthood.',
    credit:'With Dr. Ed Callahan, Ph.D., Licensed Marriage &amp; Family Therapist'},

  {t:'who',
    kicker:'Who this is for',
    h:'You have tried everything the books told you to try.',
    p:'Rewards charts. Consequences. Firmer boundaries. Calmer tones. And somehow every one of them seems to make things worse, not better.',
    p2:'If you are the parent of a neurodivergent teen or young adult with ADHD, autism, a nonverbal learning difference, or PDA, and the standard playbook keeps backfiring, this hour is for you.'},

  {t:'trap',
    kicker:'The trap',
    h:'The advice is not wrong. It is aimed at the wrong brain.',
    p:'Traditional parenting assumes a young person can reason while they are upset, that tomorrow’s consequence will steer today’s behavior, and that refusing is a choice.',
    p2:'For a neurodivergent teen, all three assumptions quietly fail. And each failed attempt adds another layer of overwhelm.'},

  {t:'hook',
    kicker:'The hard truth',
    h:'Most of what looks like defiance is a child who has run out of road.',
    p:'Not manipulation. Not laziness. Not a character problem you failed to correct. A nervous system that hit its limit and had no words for it.',
    p2:'Once you can see that, almost everything about the next conversation changes.'},

  {t:'part',
    kicker:'Part One',
    h:'The Vicious Cycle',
    p:'Why well-meaning parents, and even well-trained professionals, end up making things harder without ever meaning to.'},

  {t:'cycle',
    kicker:'The Vicious Cycle',
    h:'How it builds',
    items:[
      '<b>The attempt.</b> You apply the method the way it is written: a clear consequence, a firm line.',
      '<b>The misfire.</b> The teen cannot access it in the moment, so compliance never comes.',
      '<b>The read.</b> It looks like defiance, so you push harder and they shut down further.',
      '<b>The cost.</b> Overwhelm rises, trust erodes, and the relationship takes the damage.'
    ]},

  {t:'stakes',
    kicker:'Why it matters',
    h:'Left running, the cycle has a destination.',
    p:'It is the road that ends in a crisis, a placement, a teen sent somewhere else because home stopped feeling workable.',
    panel:'I spent years running one of the first therapeutic boarding schools built for neurodiverse teens. I met these families at the end of that road. Almost none of them needed to arrive there.'},

  {t:'part',
    kicker:'Part Two',
    h:'A Different Operating Manual',
    p:'Three shifts that work with your teen’s brain instead of against it. None of them require you to be a therapist. All of them require you to change what you do first.'},

  {t:'pillar',
    num:'01',
    kicker:'Pillar One',
    h:'Behavior Is Communication',
    p:'Stop asking “how do I make this stop?” and start asking “what is my child telling me they cannot handle right now?”',
    p2:'The outburst, the refusal, the shutdown, each one is a message from a young person who cannot yet put the struggle into words. Answer the message and the behavior loses its job.'},

  {t:'pillar',
    num:'02',
    kicker:'Pillar Two',
    h:'Work With the Brain, Not Against It',
    p:'A neurodivergent brain is not a neurotypical brain running slow. It processes differently, and that difference is permanent.',
    p2:'So we build strategies that fit how your teen actually thinks: meeting them where they are developmentally, not where the calendar says a 16-year-old should be.'},

  {t:'pillar',
    num:'03',
    kicker:'Pillar Three',
    h:'Accommodation Is Not Enabling',
    p:'The fear that quietly runs most homes: if I make it easier, am I just making them weaker?',
    p2:'There is a line. On one side, support builds capacity. On the other, it removes it. Learning to tell the two apart, situation by situation, is the skill that changes everything.'},

  {t:'tools',
    kicker:'In practice',
    h:'The same hard night, handled differently',
    items:[
      '<b>A safe home base.</b> Before any strategy works, the house has to feel safe enough to try.',
      '<b>Parents aligned first.</b> Both adults on the same page before a single approach reaches the teen.',
      '<b>The hot wash.</b> After an incident, you unpack it together to pull out the learning, instead of relitigating who was right.',
      '<b>Small, repeatable wins.</b> Confidence is rebuilt in evidence, not pep talks.'
    ]},

  {t:'part',
    kicker:'Part Three',
    h:'What Changes',
    p:'Not a perfect teen. A home that is no longer braced for the next explosion, and a young person building a real path toward independence.'},

  {t:'picture',
    kicker:'The other side',
    h:'Confidence is what is left when the chaos stops running the house.',
    items:[
      'Conversations that solve something instead of escalating.',
      'A teen who starts trusting their own ability to handle hard moments.',
      'Parents who can tell when to step in and when to step back.',
      'A realistic, hopeful line of sight to adulthood that does not run through a crisis.'
    ]},

  {t:'why',
    kicker:'Why me',
    h:'I was the last resort. Now I help parents never need one.',
    p:'Licensed Marriage &amp; Family Therapist, 30-plus years. Co-founder and CEO of one of the first therapeutic boarding schools designed for neurodiverse adolescents. Hundreds of families guided through reintegration and launch.',
    p2:'I have seen exactly where the Vicious Cycle ends. This hour is how I help families turn around long before it gets there.'},

  {t:'cta',
    kicker:'Your next step',
    h:'If this is the approach you have been missing,',
    step:'Talk with Dr. Ed Callahan about how it would work for your family.',
    p:'Bring the situation that keeps you up at night. We will look at where your teen actually is, and what the first changes would be.',
    disclaimer:'This masterclass is educational and reflects Dr. Ed Callahan’s clinical experience. It is not therapy, diagnosis, or medical advice, and it is not a substitute for care from your own providers. Every family and every neurodivergent teen is different; results vary and no specific outcome is guaranteed.'}
];

const stage = document.getElementById('stage');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide' + (i===0?' on':'');
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.num) html += `<div class="num">${s.num}</div>`;
  if(s.h && s.t==='title') html += `<h1>${s.h}</h1>`;
  else if(s.h) html += `<h2>${s.h}</h2>`;
  if(s.p) html += `<p class="${s.t==='title'||s.t==='part'?'lede':''}">${s.p}</p>`;
  if(s.p2) html += `<p>${s.p2}</p>`;
  if(s.items){ html += '<ul>'; s.items.forEach(it=> html += `<li>${it}</li>`); html += '</ul>'; }
  if(s.panel) html += `<div class="panel"><p>${s.panel}</p></div>`;
  if(s.step) html += `<div class="cta-step">${s.step}</div>`;
  if(s.credit) html += `<div class="credit">${s.credit}</div>`;
  if(s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  d.innerHTML = html;
  stage.appendChild(d);
});

let cur = 0;
const slides = document.querySelectorAll('.slide');
function go(n){ slides[cur].classList.remove('on'); cur = Math.max(0,Math.min(slides.length-1,n)); slides[cur].classList.add('on'); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') { go(cur+1); e.preventDefault(); }
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') { go(cur-1); e.preventDefault(); }
});
stage.addEventListener('click', ()=> go(cur+1));
</script>
</body>
</html>
