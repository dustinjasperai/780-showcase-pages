<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Changing the System You're In — a working session with Charley Johnson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f8f5;        /* their dominant warm off-white ground */
    --ink:#1d1b17;       /* warm charcoal */
    --muted:#6a655c;
    --accent:#f1ce67;    /* their gold — WEAVER artwork highlight */
    --clay:#f1b0b0;      /* their clay-pink, used sparingly */
    --rule:#e4e0d6;
    --panel:#ffffff;
    --serif:"Noto Serif",Georgia,serif;
    --sans:"Public Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #stage{position:relative;height:100vh;width:100%;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vh 9vw;opacity:0;transition:opacity .4s ease}
  .slide.on{display:flex;opacity:1}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:clamp(11px,1.1vw,14px);color:var(--muted);margin-bottom:22px}
  .eyebrow .dot{color:var(--ink);background:var(--accent);padding:2px 9px;border-radius:999px;margin-right:10px}
  h1{font-family:var(--serif);font-weight:700;line-height:1.04;font-size:clamp(34px,6vw,76px);letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;line-height:1.08;font-size:clamp(28px,4.4vw,52px);letter-spacing:-.01em}
  .lede{font-size:clamp(17px,1.9vw,26px);line-height:1.5;max-width:60ch;color:var(--ink);margin-top:26px}
  .lede.muted{color:var(--muted)}
  .sub{font-size:clamp(15px,1.4vw,20px);color:var(--muted);margin-top:18px;max-width:62ch;line-height:1.55}
  .big{font-family:var(--serif);font-size:clamp(30px,5.2vw,64px);line-height:1.1;max-width:20ch;font-weight:700}
  .accentbar{width:68px;height:8px;background:var(--accent);border-radius:999px;margin-bottom:30px}
  ul{list-style:none;margin-top:30px;display:grid;gap:16px;max-width:64ch}
  li{position:relative;padding-left:34px;font-size:clamp(16px,1.6vw,22px);line-height:1.45}
  li:before{content:"";position:absolute;left:0;top:.55em;width:14px;height:14px;background:var(--accent);
    border-radius:3px;transform:rotate(45deg)}
  .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:18px 40px;margin-top:34px;max-width:1000px}
  .step{display:flex;gap:18px;align-items:flex-start}
  .glyph{font-family:var(--serif);font-weight:700;font-size:clamp(26px,3vw,40px);color:var(--ink);
    background:var(--accent);min-width:1.9em;height:1.9em;display:flex;align-items:center;justify-content:center;
    border-radius:12px;flex:none}
  .step .t{font-weight:700;font-size:clamp(16px,1.5vw,21px)}
  .step .d{color:var(--muted);font-size:clamp(13px,1.2vw,16px);line-height:1.4;margin-top:3px}
  .foot{position:absolute;left:9vw;right:9vw;bottom:4vh;display:flex;justify-content:space-between;
    align-items:center;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .foot .brand{font-family:var(--serif);font-weight:600;letter-spacing:0;text-transform:none;font-size:15px;color:var(--ink)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:30px;max-width:66ch;line-height:1.5}
  .cta-steps{margin-top:26px;display:grid;gap:12px;max-width:52ch}
  .cta-steps div{font-size:clamp(16px,1.6vw,21px);padding-left:30px;position:relative}
  .cta-steps div:before{content:"→";position:absolute;left:0;color:var(--accent);font-weight:700}
  .pull{font-family:var(--serif);font-style:italic;font-size:clamp(22px,3vw,38px);line-height:1.3;max-width:24ch}
  .nav{position:fixed;right:18px;bottom:16px;z-index:9;display:flex;gap:8px}
  .nav button{font-family:var(--sans);border:1px solid var(--rule);background:var(--panel);color:var(--ink);
    width:40px;height:40px;border-radius:10px;font-size:18px;cursor:pointer}
  .count{position:fixed;left:18px;bottom:22px;z-index:9;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .kicker{color:var(--clay);font-weight:700}
</style>
</head>
<body>
<div id="stage"></div>
<div class="count"><span id="cur">1</span> / <span id="tot">1</span></div>
<div class="nav"><button id="prev" aria-label="previous">‹</button><button id="next" aria-label="next">›</button></div>
<script>
const S=[
  {t:'title',eyebrow:'A free working session',h:"Changing the System You're In",
   lede:"A practical hour for mission-driven leaders on seeing your system clearly, and changing it, in the age of AI.",
   brand:"Charley Johnson · Untangled"},

  {t:'who',eyebrow:'Who this is for',h:"You lead change at the intersection of technology and society.",
   bullets:[
     "Executive directors, founders, and funders at mission-driven organizations.",
     "Policy, product, and partnership leaders trying to shift the status quo from inside.",
     "Strategists and ecosystem builders who think in systems but want tools to intervene."]},

  {t:'trap',eyebrow:'The trap',h:"Everyone is being told to build an “AI strategy.”",
   lede:"So teams rush to adopt tools, launch pilots, and write policies. A year later the same dynamics are still in place, now with more software bolted on.",
   sub:"The vertigo is real. The response is usually aimed at the wrong target."},

  {t:'reframe',eyebrow:'The reframe',big:"“AI strategy” is the wrong question.",
   sub:"The better one: what future do we want to realize, and what has to change in our system to move toward it?"},

  {t:'part',eyebrow:'Part one',h:"Four shifts in how you see the problem."},

  {t:'list',eyebrow:'Shift one & two',h:"Problems are made, not found.",
   bullets:[
     "Every strategy starts from a problem statement, but someone framed that problem first, and the framing hides as much as it reveals.",
     "There is no such thing as a “tech problem.” Every one is tangled up in people, power, and norms."]},

  {t:'list',eyebrow:'Shift three & four',h:"There are no tech solutions.",
   bullets:[
     "Only sociotechnical interventions, each with consequences for which communities benefit and how power is redistributed.",
     "Changing a system means thinking backward from the future you want, not forward from the tools you already have."]},

  {t:'pull',eyebrow:'Why it matters',pull:"If you intervene without seeing how power actually flows, you reproduce the past and call it progress."},

  {t:'part',eyebrow:'Part two',h:"WEAVER: a lens for seeing your system, and a process for changing it."},

  {t:'intro',eyebrow:'The idea',h:"A weaver turns discrete threads into coherent patterns.",
   lede:"WEAVER moves you away from prediction and control, and toward stewardship, learning, and adaptive capacity. Six moves, in order.",
   sub:"We will walk one real system of yours through all six in the session."},

  {t:'steps',eyebrow:'The framework',h:"The six moves",
   steps:[
     {g:'W',t:'Widen the lens',d:'Surface how the system is being seen, and the assumptions that make the status quo feel inevitable.'},
     {g:'E',t:'Examine the frames',d:'Name the stories and frames shaping what feels normal or obvious inside the system.'},
     {g:'A',t:'Align directional futures',d:'Move from forecasting to shared orientations that guide decisions under uncertainty.'},
     {g:'V',t:'Visualize the actor network',d:'Map how power, trust, and relationships actually flow between the players.'},
     {g:'E',t:'Enact new interactions',d:'Design small, concrete interventions that shift behavior inside the system.'},
     {g:'R',t:'Reinforce relational infrastructure',d:'Build the trust and routines that let the system keep evolving after you step back.'}]},

  {t:'list',eyebrow:'Move one · Widen the lens',h:"See the whole board first.",
   bullets:[
     "Most teams start from the problem as it has already been defined, inheriting linear cause-and-effect thinking.",
     "Widening the lens makes visible the assumptions, frames, and narratives that decide what feels inevitable."]},

  {t:'list',eyebrow:'Move four · Visualize the network',h:"Follow the power, not the org chart.",
   bullets:[
     "Map the actors, the relationships, and where trust and leverage really sit.",
     "You cannot shift a dynamic you cannot see, and the real one is rarely the one on the slide deck."]},

  {t:'list',eyebrow:'Moves five & six · Enact and reinforce',h:"Intervene small, then make it hold.",
   bullets:[
     "Redesign the routines, incentives, and feedback loops that reproduce the outcomes you are stuck with.",
     "Then reinforce the relational infrastructure so change compounds instead of snapping back."]},

  {t:'part',eyebrow:'Part three',h:"What it looks like when you do this well."},

  {t:'list',eyebrow:'The payoff',h:"From vertigo to a plan you can defend.",
   bullets:[
     "A clear read of the system you are actually in, not the one on paper.",
     "A directional future your stakeholders can align around under uncertainty.",
     "A short list of interventions you can start on Monday, and a way to tell if they are working."]},

  {t:'why',eyebrow:'Why me',h:"I have been in the room for this work.",
   lede:"I write Untangled to roughly ten thousand readers, and I have taught these frameworks with leaders and teams across public-interest technology, philanthropy, and government.",
   sub:"The method draws on science and technology studies, complex adaptive systems, and futures thinking, turned into tools you can use."},

  {t:'pull',eyebrow:'One belief',pull:"There is no inevitability as long as there is a willingness to contemplate what is happening."},

  {t:'cta',eyebrow:'Start with one system',h:"Bring one real system to a session.",
   steps:[
     "Pick one system you are trying to change right now.",
     "Reach out through Untangled and we will widen the lens on it together.",
     "Leave with a first draft of where the leverage actually is."],
   disclaimer:"This session is educational. It shares frameworks and perspective for changing complex systems. It is not a guarantee of any particular organizational, funding, or career outcome; results depend on your own context and work.",
   brand:"Charley Johnson · Untangled"}
];

const stage=document.getElementById('stage');
function esc(s){return (s||'')}
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const el=document.createElement('section');el.className='slide';el.dataset.i=i;
    let inner='';
    const eye = s.eyebrow?`<div class="eyebrow"><span class="dot">&nbsp;</span>${esc(s.eyebrow)}</div>`:'';
    if(s.t==='title'){
      inner=`${eye}<div class="accentbar"></div><h1>${esc(s.h)}</h1><p class="lede">${esc(s.lede)}</p>`;
    }else if(s.t==='reframe'){
      inner=`${eye}<div class="big">${esc(s.big)}</div><p class="sub">${esc(s.sub)}</p>`;
    }else if(s.t==='pull'){
      inner=`${eye}<div class="pull">${esc(s.pull)}</div>`;
    }else if(s.t==='part'){
      inner=`${eye}<div class="accentbar"></div><h2>${esc(s.h)}</h2>`;
    }else if(s.t==='steps'){
      let g=s.steps.map(x=>`<div class="step"><div class="glyph">${esc(x.g)}</div><div><div class="t">${esc(x.t)}</div><div class="d">${esc(x.d)}</div></div></div>`).join('');
      inner=`${eye}<h2>${esc(s.h)}</h2><div class="steps">${g}</div>`;
    }else if(s.t==='cta'){
      let st=s.steps.map(x=>`<div>${esc(x)}</div>`).join('');
      inner=`${eye}<div class="accentbar"></div><h2>${esc(s.h)}</h2><div class="cta-steps">${st}</div><p class="disclaimer">${esc(s.disclaimer)}</p>`;
    }else{ // who / trap / list / intro / why
      let b = s.bullets?`<ul>${s.bullets.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`:'';
      let l = s.lede?`<p class="lede">${esc(s.lede)}</p>`:'';
      let sub = s.sub?`<p class="sub">${esc(s.sub)}</p>`:'';
      inner=`${eye}<h2>${esc(s.h)}</h2>${l}${b}${sub}`;
    }
    const brand = s.brand?s.brand:'Untangled';
    inner+=`<div class="foot"><span class="brand">${esc(brand)}</span><span>Changing the System You're In</span></div>`;
    el.innerHTML=inner;
    stage.appendChild(el);
  });
  document.getElementById('tot').textContent=S.length;
}
let cur=0;
function show(n){
  cur=Math.max(0,Math.min(S.length-1,n));
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('on',+el.dataset.i===cur));
  document.getElementById('cur').textContent=cur+1;
}
render();show(0);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
</script>
</body>
</html>
