<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Pulpit to Payroll — a live masterclass with Todd Linder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5; --panel:#f1ece4; --ink:#232528; --muted:#6b655c;
    --rule:#dcd3c6; --accent:#cf641d; --deep:#7a3d12;
    --display:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:900px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:44px 46px;margin:0 0 22px;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;height:5px;width:100%;
    background:linear-gradient(90deg,var(--accent),var(--deep))}
  .kick{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.05;margin:0 0 16px}
  h2{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.12;margin:0 0 14px}
  p{font-size:18px;line-height:1.55;margin:0 0 12px;color:var(--ink)}
  p.lead{font-size:20px;color:var(--muted)}
  .big{font-family:var(--display);font-weight:700;font-size:40px;color:var(--accent);margin:0 0 10px}
  ul{margin:10px 0 0;padding:0;list-style:none}
  li{font-size:18px;line-height:1.5;padding:12px 0 12px 42px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li .n{position:absolute;left:0;top:11px;font-family:var(--display);font-weight:700;color:var(--accent);font-size:18px}
  li b{font-family:var(--display);font-weight:600}
  .tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:13px;color:var(--deep);
    background:#f6e6d6;border:1px solid #e9c9ab;border-radius:999px;padding:5px 12px;margin:0 6px 8px 0}
  .quote{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.3}
  .foot{font-size:13px;color:var(--muted);margin-top:16px}
  .disc{font-size:13px;color:var(--muted);border-top:1px solid var(--rule);margin-top:20px;padding-top:14px}
  .cta .big{font-size:34px}
  .pagefoot{max-width:900px;margin:10px auto 0;padding:0 22px;color:var(--muted);
    font-family:var(--display);font-size:12px;letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="pagefoot">Ministry to Marketplace · a live masterclass with Todd Linder</div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <p class="kick">A live masterclass with Todd Linder</p>
    <h1>From Pulpit to Payroll</h1>
    <p class="lead">How ministry leaders land a marketplace job by translating what they already did, not starting over.</p>
    <p class="foot">Ministry to Marketplace</p>`},

  {t:'who', html:`
    <p class="kick">Who this is for</p>
    <h2>If you have given years to ministry and the next step feels impossible, this is for you.</h2>
    <p>Pastors, missionaries, campus and parachurch leaders, and church-office staff who need a role that supports their family and still uses their gifts.</p>
    <div style="margin-top:14px">
      <span class="tag">Pastors</span><span class="tag">Missionaries</span>
      <span class="tag">Campus ministers</span><span class="tag">Church staff</span>
    </div>`},

  {t:'trap', html:`
    <p class="kick">The trap</p>
    <h2>You send resumes into the void and hear nothing back.</h2>
    <p>So you assume the problem is you, that marketplace work means starting at the bottom and that your ministry years do not count. None of that is true.</p>`},

  {t:'reframe', html:`
    <p class="kick">The reframe</p>
    <p class="quote">You do not have a lack-of-experience problem. You have a translation problem.</p>
    <p style="margin-top:16px">Hiring managers never learned to read ministry on a resume. The work now is to say what you did in words they already understand.</p>`},

  {t:'part', html:`
    <p class="kick">Part one</p>
    <h2>Why the old job search fails ministry leaders</h2>
    <ul>
      <li><span class="n">1</span>You apply cold, so a system screens you out before a human ever reads you.</li>
      <li><span class="n">2</span>Your resume describes a calling, not a role a company is trying to fill.</li>
      <li><span class="n">3</span>You chase openings instead of the people who open doors.</li>
    </ul>`},

  {t:'part', html:`
    <p class="kick">Part two</p>
    <h2>The Ministry to Marketplace Method</h2>
    <p class="lead">Five steps. The same system that has moved 167 ministry leaders into marketplace roles.</p>`},

  {t:'step', html:`
    <p class="kick">Step one</p>
    <h2>Find the job titles you are actually built for</h2>
    <p>Stop guessing. We start from your gifts and your family's needs and name a short list of marketplace titles that fit, so you finally have a target.</p>`},

  {t:'step', html:`
    <p class="kick">Step two</p>
    <h2>Write your Impact Bullets</h2>
    <p>Take 5 to 15 things you did in each ministry role and rewrite them as quantified accomplishments. "Shepherded a congregation" becomes "led and grew a community of 1,200."</p>`},

  {t:'step', html:`
    <p class="kick">Step three</p>
    <h2>Develop your Next Step Statement</h2>
    <p>One short, clear statement of the role you want and the story behind it, so every introduction and interview hears the same confident message instead of a vague calling.</p>`},

  {t:'step', html:`
    <p class="kick">Step four</p>
    <h2>Generate 27 internal introductions</h2>
    <p>This is where ministry leaders win. You already know how to build trust and ask well. We turn your network into 27 warm introductions, not cold applications.</p>`},

  {t:'step', html:`
    <p class="kick">Step five</p>
    <h2>Land 9 interviews at different organizations</h2>
    <p>Enough real conversations that you are choosing between offers instead of waiting by the phone. The math works because relationships, not job boards, carry it.</p>`},

  {t:'engine', html:`
    <p class="kick">The engine</p>
    <p class="big">27 introductions. 9 interviews. 0 cold applications.</p>
    <p>A pastor's relational skill is not a soft extra in this process. It is the whole engine.</p>`},

  {t:'part', html:`
    <p class="kick">Part three</p>
    <h2>What it looks like when it works</h2>
    <p>Clarity on the role in weeks, a resume a hiring manager reads to the end, warm introductions replacing silence, and real interviews on the calendar.</p>`},

  {t:'proof', html:`
    <p class="kick">Why me</p>
    <h2>I made this jump, then built the path</h2>
    <p>I spent seven years on staff at a large church, moved into corporate HR, and have since helped 167 ministry leaders translate their experience and land marketplace roles.</p>`},

  {t:'who2', html:`
    <p class="kick">Is this you</p>
    <h2>This works if you are willing to translate, not start over.</h2>
    <ul>
      <li><span class="n">&#10003;</span>You have real leadership experience from ministry.</li>
      <li><span class="n">&#10003;</span>You need a role that supports your family.</li>
      <li><span class="n">&#10003;</span>You are ready to do the work, with a system to follow.</li>
    </ul>`},

  {t:'cta', cls:'cta', html:`
    <p class="kick">Your next step</p>
    <p class="big">Find out what is hindering your job search.</p>
    <p>Take the free 2-minute quiz, then book a call to see whether the Interview Accelerator is the right fit to walk you through all five steps.</p>
    <p class="foot">Start at ministrytomarketplace.co</p>
    <p class="disc">Educational only. No income, role, placement, or result is guaranteed; outcomes vary with each person's effort, background, and market. The 167 figure reflects past participants and is not a promise of your results.</p>`}
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const d = document.createElement('section');
  d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
