<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Contracted to Chosen — A Prospology Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,600;0,700;1,400&family=Mulish:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9eaef; --panel:#ffffff; --ink:#363644; --rule:#e4e1da;
    --accent:#30aabc; --muted:#6b6b79;
    --display:'Petrona',Georgia,serif; --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 58px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(54,54,68,.03)}
  .slide.title{min-height:520px}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.14;margin:0 0 14px}
  .lead{font-size:20px;line-height:1.5;color:var(--ink);margin:0 0 10px}
  .sub{font-size:18px;line-height:1.55;color:var(--muted);margin:0 0 8px}
  .hr{height:2px;width:72px;background:var(--accent);border:0;margin:14px 0 22px}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{position:relative;padding:0 0 14px 26px;font-size:18px;line-height:1.5}
  li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .partnum{font-family:var(--display);font-style:italic;font-size:20px;color:var(--accent);margin:0 0 6px}
  .big{font-size:30px;line-height:1.25;font-family:var(--display);font-weight:600}
  .stat{font-family:var(--display);font-weight:700;font-size:40px;color:var(--accent)}
  .cta .btn{display:inline-block;margin:18px 0 22px;background:var(--accent);color:#fff;
    font-weight:700;padding:14px 26px;border-radius:9px;font-size:18px}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin:18px 0 0;max-width:620px}
  .pg{font-size:13px;color:var(--muted);text-align:right;margin-top:18px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', kicker:'A Prospology Masterclass with Sophie Ash',
   h:'From Contracted to Chosen',
   sub:'How clinically-trained professionals build a freelance medical-writing career they actually choose'},

  {t:'promise', kicker:'What this hour gives you',
   h:'You will leave with a map, not a pep talk',
   list:['Why the thing keeping you in clinical work is not a skills gap',
         'The three shifts that move you from stuck to self-directed',
         'How the inner work and the business work fit together',
         'What the first ninety days of a freelance practice really look like']},

  {t:'who', kicker:'Who this is for',
   h:'The over-qualified and under-chosen',
   sub:'Physicians, pharmacists, physical therapists, nurses and PhD scientists who are good at the work and quietly done with the setting.',
   list:['You keep a tab open for "freelance medical writer" and close it again',
         'You are told you are too qualified to be this unhappy',
         'You have the credentials and none of the permission']},

  {t:'trap', kicker:'The trap',
   h:'The golden handcuffs are not made of money',
   lead:'The salary is real. So is the security. But the thing that keeps most clinicians in place is not the paycheck.',
   sub:'It is the quiet belief that the version of you who leaves has not been built yet. So you wait to feel ready, and ready never arrives on its own.'},

  {t:'hook', kicker:'The reframe',
   big:'You are not under-qualified to go freelance. You are under-convinced.',
   sub:'That is a different problem, and it has a different solution. Credentials you already have. Conviction is the work.'},

  {t:'part', partnum:'Part One',
   h:'Why waiting to feel ready keeps you contracted',
   sub:'The honest look at what actually holds a trained professional in place.'},

  {t:'problem', kicker:'The core problem',
   h:'Imposter syndrome and perfectionism are a team',
   list:['Imposter syndrome says you are not allowed to charge for this yet',
         'Perfectionism says the portfolio is never quite good enough to send',
         'Together they produce a career that is always almost starting',
         'The fix is not more proof of competence. You have plenty. It is a decision.']},

  {t:'part', partnum:'Part Two',
   h:'The three shifts',
   sub:'This is the spine of the Thriving and Free method: three moves, in order, from contracted to chosen.'},

  {t:'shift', partnum:'Shift One',
   h:'Contracted to Convicted',
   lead:'Identity before tactics.',
   sub:'You decide you are a freelance medical writer, and you get clear on why, before a single pitch goes out. Conviction is what carries you through the first quiet weeks that break most people.'},

  {t:'shift', partnum:'Shift Two',
   h:'Invisible to Inevitable',
   lead:'Say what you do so the right people see it.',
   sub:'With no agency behind you, visibility is a skill you build on purpose: a positioning that makes the clients you want see you as the obvious choice rather than one of many.'},

  {t:'shift', partnum:'Shift Three',
   h:'Chasing to Choosing',
   lead:'From taking whatever comes to selecting on your terms.',
   sub:'You choose a niche, choose the projects that fit your life, and set the rates that make the freedom real. This is the point of the whole thing, and it is a learnable position, not luck.'},

  {t:'method', kicker:'Why this order works',
   h:'The mind and the mechanics, together',
   lead:'Most programs teach one or the other. Pitch templates with no permission to use them, or mindset work with no business attached.',
   sub:'The shifts interlock on purpose: conviction makes the visibility work feel honest, and visibility is what makes choosing possible. Skip the inner work and the tactics stall.'},

  {t:'work', kicker:'What the work actually is',
   h:'Real deliverables, real clients',
   sub:'Freelance medical writing is concrete work for pharma, agencies and publishers, and it pays like the expertise it requires.',
   list:['The business skills: finding clients, pricing, cold outreach, steady cash flow',
         'The positioning: a niche you choose and a brand that fits it',
         'The craft you already have, pointed at paying work instead of a salary']},

  {t:'part', partnum:'Part Three',
   h:'The view from a calendar you own',
   sub:'Not a fantasy. A different ordinary.'},

  {t:'life', kicker:'The different ordinary',
   h:'Work you choose, on a calendar you own',
   list:['You pick the projects that match the life you want, and decline the ones that do not',
         'You bill for your judgement, not your hours in a building',
         'The imposter voice gets quieter every time you deliver and get paid',
         'You are part of a community of writers who have made the same leap']},

  {t:'proof', kicker:'The community effect',
   h:'You are not the first to do this',
   stat:'98%',
   sub:'of Prospology alumni gained at least three clients within their first year, and most refer the overflow to one another. The leap is lonely alone and ordinary in a room of people doing it.'},

  {t:'why', kicker:'Why learn this from me',
   h:'I made this exact leap',
   sub:'I am Sophie Ash. I left to build my own freelance medical-writing business, and then built Prospology to coach other clinically-trained professionals through the same transition. I work with the top tier of applicants and I am an active member of the American Medical Writers Association.'},

  {t:'recap', kicker:'The map, in one slide',
   h:'Three shifts, in order',
   list:['Contracted to Convicted: decide, and know why',
         'Invisible to Inevitable: be seen by the right clients on purpose',
         'Chasing to Choosing: select your niche, projects and rates',
         'The inner work and the business work, built together']},

  {t:'cta', cls:'cta', kicker:'Your next step',
   h:'Start the leap, with a plan',
   lead:'If today named something you have been circling for a while, the next step is a structured path rather than another open tab.',
   btn:'Explore the Freelance Medical Writing Academy',
   sub:'Begin with the Academy, or apply for the Thriving and Free Medical Writer Program for 1:1 coaching through all three shifts.',
   disc:'This masterclass is educational. No income, role, or result is guaranteed, and nothing here is medical, financial or career advice. Freelance outcomes vary and depend on your own effort, market and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  let h = '';
  if (s.kicker) h += '<p class="kicker">' + s.kicker + '</p>';
  if (s.partnum) h += '<p class="partnum">' + s.partnum + '</p>';
  if (s.h) h += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
  if (s.t === 'title' || s.t === 'part') h += '<hr class="hr">';
  if (s.big) h += '<p class="big">' + s.big + '</p>';
  if (s.stat) h += '<p class="stat">' + s.stat + '</p>';
  if (s.lead) h += '<p class="lead">' + s.lead + '</p>';
  if (s.sub) h += '<p class="sub">' + s.sub + '</p>';
  if (s.btn) h += '<span class="btn">' + s.btn + '</span>';
  if (s.list) { h += '<ul>'; s.list.forEach(x => h += '<li>' + x + '</li>'); h += '</ul>'; }
  if (s.disc) h += '<p class="disc">' + s.disc + '</p>';
  h += '<p class="pg">' + (i + 1) + ' / ' + S.length + '</p>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
