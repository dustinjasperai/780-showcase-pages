<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Culture of Abundance Masterclass · Dr. Joel Small</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F7F3EC; --panel:#EDE2D3; --rule:#DCD0BC;
    --accent:#ff3300; --ink:#2b2b2b; --grey:#5d5753; --dim:#8C8368;
  }
  html,body{height:100%}
  body{background:#1a1917;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#1a1917}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.4vw}
  .t-normal h1{font-size:3vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.4vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#3a2620 0%,#201512 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.1vw;max-width:82%;font-style:italic;color:#F4EFE2;font-weight:400}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2E241B 0%,#1a1917 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:82%;color:#F7F1E3}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:#F0C9BE;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#9C9484}
  .t-title .disc,.t-normal .disc{text-align:left}
  .sight-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-sight{right:7.5%;bottom:9%;width:19vw}
  .corner-sight{right:6%;bottom:7.5%;width:8vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#B8AF9A;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#B8AF9A;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#B8AF9A;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5.2vw}.t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Line of Sight Coaching</div>
<div class="hint" id="hint">→ click or arrow keys</div>

<!-- sight-line / crosshair motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sight" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <line x1="18" y1="80" x2="242" y2="80" stroke="#ff3300" opacity="0.85"/>
    <circle cx="130" cy="80" r="22" stroke="#ff3300" opacity="0.85"/>
    <circle cx="130" cy="80" r="4.5" fill="#ff3300" stroke="none" opacity="0.85"/>
    <line x1="130" y1="46" x2="130" y2="58" stroke="#5d5753" opacity="0.6"/>
    <line x1="130" y1="102" x2="130" y2="114" stroke="#5d5753" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Culture of Abundance Masterclass',sub:'What endodontist practice owners actually need to lead: a culture that does not depend on the owner being in the room, questions that surface the real problem, and a practice that reaches its goals without consuming the person who built it.',brand:true,sight:'title'},
 {t:'normal',k:'Who this is for',title:'Endodontist practice owners growing case volume with no one to talk to about leading it.',body:'Solo and small-group specialists, referral-dependent, usually the top producer in the building, and almost never trained to lead the people around them.'},
 {t:'normal',k:'What you’ll walk away with',title:'A clear, honest read on where endodontic-practice leadership actually breaks.',body:'The same principles from Face to Face, narrowed to the endodontist-specific version: what leadership cannot be delegated, what a Culture of Abundance replaces, and how the right questions surface both.'},
 {t:'normal',k:'An honest note',title:'This is education, not a guarantee.',body:'Every practice, team, and referral base is different. What matters is the version of this that fits yours.',disc:'Educational content. Nothing here is a promise of income, hours, or business results. Results vary and no outcome is guaranteed.'},
 {t:'normal',k:'Who’s teaching this',title:'Dr. Joel Small. 40 years running an endodontic practice, then Board Certified as an executive coach.',body:'DDS and endodontic residency, University of Texas School of Dentistry. Co-founder of North Texas Endodontic Associates and Phase II Associates, a dental consultancy and brokerage. MBA in healthcare management. Board Certified Executive Leadership Coach, University of Texas at Dallas.'},

 {t:'section',idx:'Part One',title:'Leadership Cannot Be Delegated'},
 {t:'normal',k:'Where it actually breaks',title:'The culture of your practice already has an author. It is you, whether you chose that or not.',body:'An office manager can run the schedule. A practice culture is set by whoever the team watches most closely, and in a specialist practice that is almost always the doctor whose name is on the door.'},
 {t:'normal',k:'What most owners try first',title:'A better office manager, not a different relationship to leading.',body:'The instinct is to hire the problem away. The actual fix is recognizing that culture was never a delegable task in the first place, it was always yours.'},
 {t:'dark',title:'A practice that treats culture as someone else’s job already has an answer. It is just not the one the owner wanted.'},
 {t:'normal',k:'The real cost',title:'A referral-based specialty practice runs on relationships, not just chairside skill.',body:'Referring dentists, staff, and patients all read the culture of the practice before they decide how much to trust it. A leadership gap shows up as a referral gap long before it shows up on a P&L.'},

 {t:'section',idx:'Part Two',title:'The Culture of Abundance'},
 {t:'normal',k:'What it replaces',title:'A scarcity mindset that treats every decision as a competition.',body:'The Culture of Abundance, the philosophy at the center of Face to Face, starts from a different premise: that the most powerful leadership begins inside the leader and transforms everything the practice touches from there.'},
 {t:'normal',k:'What it builds',title:'A team, and a referral network, that trusts the practice beyond the chair.',body:'This is not a soft-skills add-on. It is the operating philosophy behind moving a practice from surviving its own growth to genuinely thriving inside it.'},
 {t:'dark',title:'The practices that grow past the founder are the ones the founder built a culture for, not just a schedule.'},

 {t:'section',idx:'Part Three',title:'The Laser-Sharp-Questions Method'},
 {t:'normal',k:'The shift',title:'Coaching is not advice. It is the right question, asked at the right moment.',body:'Built on neuroscience-of-leadership study and Team Coaching Foundations training, the method is designed to move a practice owner to their own insight, not hand them someone else’s answer.'},
 {t:'normal',k:'What that looks like',title:'A practice owner who finally sees the pattern they were too close to see.',body:'Not a script. Not a franchise system. A set of pointed, specific questions built for the exact structure of a specialty referral practice.'},
 {t:'dark',title:'The goal was never a better answer. It was a practice owner who could finally ask the right question themselves.'},

 {t:'section',idx:'The next step',title:'Lead the Practice You Built'},
 {t:'normal',k:'Free, then deeper',title:'Start with the masterclass. Go deeper with the book and a real conversation.',body:'Then, for endodontist practice owners who want it directly: 1-on-1 executive coaching, a leader-to-leader cohort, or team coaching, through the contact page you already have.'},
 {t:'cta',title:'Build the practice. Build the life.',chips:['Read Face to Face','Get in touch'],disc:'Educational content only. No income, hours, or business result is guaranteed. Results vary by practice and market.'},
];

const deck=document.getElementById('deck');
function sightMotif(kind){return `<svg class="sight-motif ${kind==='title'?'title-sight':'corner-sight'}"><use href="#sight"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Line of Sight <b>Coaching</b> · Dr. Joel Small</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.sight) h+=sightMotif(s.sight);
  else if(s.t==='title') h+=sightMotif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
