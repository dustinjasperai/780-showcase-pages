<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Relationship Landscape Others Miss - Uncommon Resilience</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1f1d1b; --panel:#2e2b28; --rule:#46403a; --accent:#ffbd59; --ink:#f2efe9; --muted:#b7afa4;
    --display:'Fira Sans',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#141311;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.title{background:linear-gradient(145deg,#1f1d1b 0%,#2a211a 100%)}
  .kick{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;margin-bottom:16px}
  .lead{font-size:20px;color:var(--muted);max-width:40ch}
  p{font-size:18px;margin-bottom:12px;max-width:54ch}
  .big{font-family:var(--display);font-weight:500;font-size:30px;line-height:1.25;max-width:30ch}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;background:var(--accent);border-radius:50%}
  li b{font-family:var(--display);color:var(--ink)}
  .num{font-family:var(--display);color:var(--accent);font-weight:700}
  .foot{position:absolute;bottom:20px;left:56px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .pill{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;padding:6px 14px;font-size:13px;font-family:var(--display);margin-top:8px}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .cta h2{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', cls:'title', kick:'A live masterclass with Dr. Joan Lawrence-Ross', h:'The Relationship Landscape Others Miss',
   lead:'How senior leaders read the room before the room reads them.'},

  {t:'list', kick:'Who this hour is for', h:'You lead at a level where relationships decide outcomes.',
   list:['<b>Directors, VPs, and C-suite</b> steering high-stakes initiatives','Leaders who feel the politics but cannot always name them','Anyone whose next move depends on people they do not control']},

  {t:'quote', kick:'The trap', h:'You were promoted for your results.',
   body:'And now the thing slowing you down is not the work. It is a blocking stakeholder, a board that will not align, a peer who smiles and resists. Nobody taught you this part.'},

  {t:'big', kick:'A reframe', big:'What you think makes you <span class="a">wrong</span> is often what makes you most <span class="a">effective</span>.'},

  {t:'quote', kick:'Part one - the real problem', h:'The politics you cannot see are the ones that decide.',
   body:'Most leaders manage the relationships that are loud. The ones that quietly make or break a career are the ones they never mapped. The skill is not charisma. It is reading the landscape.'},

  {t:'quote', kick:'Where this comes from', h:'Thirty years in a mask.',
   body:'A retiring executive once told me he spent three decades suppressing his instincts about people, because the playbook said to. He read every room correctly and trusted himself in none of them. That regret is avoidable.'},

  {t:'list', kick:'The cost of misreading', h:'When the read is wrong, it is expensive.',
   list:['The initiative stalls and no one tells you why','The promotion goes to someone who managed the room','You win the argument and lose the relationship']},

  {t:'big', kick:'Part two - the method', big:'The <span class="a">4C Framework</span> for High-Stakes Relationship Mastery.'},

  {t:'quote', kick:'1. Clarity', h:'See the relationship landscape others miss.',
   body:'Identify the true power holders, each stakeholder’s real motivation, the hidden landmines, and the handful of relationships that are genuinely make-or-break before you act.'},

  {t:'quote', kick:'2. Courage', h:'Act strategically despite uncertainty.',
   body:'Engage the difficult conversation. Challenge a resistant stakeholder without burning the bridge. Speak truth to power in a way that is heard, not punished.'},

  {t:'quote', kick:'3. Confidence', h:'Trust your judgment under pressure.',
   body:'Trust your read of a situation, speak with authority when you are challenged, and project calm competence when the political pressure is highest.'},

  {t:'quote', kick:'4. Commitment', h:'Sustain results through disciplined execution.',
   body:'Follow through on the relationship strategy, hold your boundaries, and execute the plan with discipline long after the first conversation.'},

  {t:'big', kick:'The shift', big:'High-stakes relationships are a <span class="a">read</span>, not a personality.'},

  {t:'quote', kick:'Part three - navigating the room on purpose', h:'From reacting to navigating.',
   body:'Before: you walk into the room and respond to what happens. After: you walk in having already mapped who holds the real power, what they need, and the first two moves you will make. The meeting stops happening to you.'},

  {t:'list', kick:'A worked read', h:'Three relationships most leaders are not managing.',
   list:['<b>The sponsor</b> who went quiet and you have not asked why','<b>The blocker</b> whose real objection you have never named','<b>The quiet decider</b> everyone underestimates, including you']},

  {t:'quote', kick:'Why trust this', h:'Twenty-five years inside the politics.',
   body:'I spent my career as a Fortune 500 Chief Learning Officer and senior executive at AIG, Citigroup, and AXA Equitable. Dual Ph.D. in organizational psychology and performance. I navigated the board rooms I now teach leaders to read.'},

  {t:'quote', kick:'Your first move', h:'Start by seeing where you actually stand.',
   body:'Before any strategy, map your current landscape honestly. The free High-Stakes Relationship Audit scores where you are and surfaces the relationships quietly at risk. That is where the work begins.'},

  {t:'cta', cls:'cta', kick:'Next step', h:'Ready to master the relationships that decide your next move?',
   body:'Take the free High-Stakes Relationship Audit, then schedule a discovery call to see whether the Academy or 1:1 coaching fits where you are.',
   pill:'uncomonresilience.com',
   disc:'Educational content only. No income, role, promotion, or result is guaranteed. Results vary based on each leader’s situation, context, and effort.'}
];
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide '+(s.cls||'');
  let h='';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.h) h+= (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.lead) h+='<div class="lead">'+s.lead+'</div>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.body) h+='<p>'+s.body+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.pill) h+='<div class="pill">'+s.pill+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="foot">Uncommon Resilience &middot; The 4C Framework for High-Stakes Relationship Mastery</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
