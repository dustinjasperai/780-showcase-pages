<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>The Calm Leader: a masterclass with Barbara Morris-Blake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141618;        /* their dominant charcoal ground */
    --panel:#1d2126;
    --rule:#2c323a;
    --ink:#eef1f5;
    --muted:#9aa6b4;
    --accent:#f89829;    /* their 36-use brand amber */
    --steel:#527392;     /* their secondary steel blue */
    --display:'Raleway',system-ui,sans-serif;
    --body:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 120px}
  .slide{
    background:linear-gradient(180deg,var(--panel),#171a1e);
    border:1px solid var(--rule);border-radius:16px;
    padding:52px 48px;margin:22px 0;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:48px;top:40px;width:54px;height:3px;
    background:var(--accent);border-radius:2px}
  .num{position:absolute;right:30px;top:28px;font-family:var(--display);font-weight:600;
    font-size:13px;letter-spacing:.14em;color:var(--muted)}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:26px 0 14px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.06;letter-spacing:-.01em;margin-bottom:16px}
  h2{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.12;margin-bottom:14px}
  .lead{font-size:21px;line-height:1.5;color:#dfe5ec;max-width:58ch}
  p.body{font-size:18px;line-height:1.6;color:#cdd5de;max-width:60ch;margin-top:10px}
  .kicker{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--steel);margin-bottom:10px}
  ul{list-style:none;margin-top:18px;max-width:62ch}
  li{position:relative;padding-left:26px;margin:14px 0;font-size:18px;line-height:1.5;color:#d4dbe3}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .part h1{color:var(--ink)}
  .part .partno{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.2em;
    color:var(--accent);text-transform:uppercase;margin-bottom:8px}
  .stat{font-family:var(--display);font-weight:800;font-size:64px;color:var(--accent);line-height:1}
  .pillar h2 span{color:var(--accent)}
  .byline{font-family:var(--display);font-weight:600;font-size:16px;color:var(--muted);margin-top:22px}
  .cta h1{font-size:40px}
  .nextstep{font-family:var(--display);font-weight:700;font-size:20px;color:var(--ink);
    background:var(--accent);color:#1a1205;display:inline-block;padding:14px 26px;border-radius:10px;margin-top:18px}
  .disclaimer{font-size:13.5px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:66ch;font-style:italic}
  .foot{max-width:960px;margin:0 auto;padding:0 22px 60px;color:var(--muted);
    font-family:var(--display);font-size:12.5px;letter-spacing:.08em;text-align:center}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Elevate Organizations &middot; Barbara Morris-Blake &middot; A live masterclass</div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass',h1:'The Calm Leader',lead:'How brain-based self-management drives real team performance, without burning out the leader or the team.',by:'Barbara Morris-Blake &middot; Elevate Organizations'},
  {t:'who',kicker:'Who this is for',h2:'For the leader who is performing, and quietly paying for it.',body:'Emerging leaders, senior managers, and executives who were promoted for their output and now feel it cracking under the weight of the team they carry.'},
  {t:'trap',kicker:'The trap',h2:'You were promoted for your output. Now your output is the problem.',body:'The harder you push, the more fragile the room gets. People go quiet, decisions pile on you, and your best person starts updating their resume. It reads like a workload problem. It is not.'},
  {t:'reframe',eyebrow:'The reframe',h1:'Burnout is not a workload problem. It is a self-management problem.',lead:'How a leader regulates their own brain under pressure becomes the climate the whole team breathes.'},
  {t:'part',partno:'Part One',h1:'Why composure is the hidden performance lever.'},
  {t:'content',kicker:'The brain under pressure',h2:'A dysregulated leader narrows the room.',body:'Under threat the brain trades range for speed. Thinking gets smaller, tone gets sharper, and the people around you start managing your state instead of the work. Your nervous system sets the ceiling on the team.'},
  {t:'stat',kicker:'What the research shows',stat:'50 to 70%',body:'The lift in work performance, time management, and team effectiveness we see when leaders are genuinely engaged and self-managed. Composure is not soft. It is the multiplier.'},
  {t:'content',kicker:'The cost of the gap',h2:'Quiet people and a revolving door.',body:'When leaders cannot regulate, teams stop speaking up and the strongest performers leave first. You lose the exact people you built the business around, and you call it a retention problem.'},
  {t:'part',partno:'Part Two',h1:'The Elevate self-management system.'},
  {t:'pillar',kicker:'Pillar one',h2:'<span>Self-awareness.</span> Know your own leadership.',body:'Using the Lumina Spark portrait, you map your leadership style, your triggers, and your preferences, and turn them into a toolkit for building strong relationships on purpose.'},
  {t:'pillar',kicker:'Pillar two',h2:'<span>Self-management.</span> Regulate before you lead.',body:'The brain-science practices for composure, stress, and delegation, so your words, actions, and decisions land the way you intend instead of the way the moment pulls them.'},
  {t:'pillar',kicker:'Pillar three',h2:'<span>Communication under load.</span>',body:'Strategic communication and constructive feedback that hold up when the pressure is on, so clarity survives the hard conversations instead of dissolving in them.'},
  {t:'pillar',kicker:'Pillar four',h2:'<span>Leadership skill mastery.</span>',body:'Bias-aware, strategic decision-making and the coaching habits that cultivate a team, so you make better calls that align with where the organization is going.'},
  {t:'content',kicker:'The throughline',h2:'Psychological safety, built on purpose.',body:'Every pillar serves one outcome: a room where people feel safe enough to think, speak, and commit. Listen, engage, motivate. That is how you keep your best people and earn their best work.'},
  {t:'part',partno:'Part Three',h1:'Ninety days of leading calm.'},
  {t:'content',kicker:'For the leader',h2:'Composure you can feel.',body:'You walk into the hard meeting steadier. You delegate without white-knuckling it. You stop absorbing every decision, and the mental load finally drops.'},
  {t:'content',kicker:'For the team',h2:'Safety, engagement, retention.',body:'People start speaking up again. Ownership spreads. The strong performers you were worried about re-engage, because the climate they report into changed at the source.'},
  {t:'why',kicker:'Why me',h2:'Barbara Morris-Blake.',body:'Certified professional coach, MBA in leadership, and 25 years turning companies into communities that communicate. Author of Hey There, High Flyer. Founder of Elevate Organizations, where I coach leaders and teams to perform at their peak without losing themselves to the pace.'},
  {t:'cta',eyebrow:'Your next step',h1:'Lead calm. Keep your best people.',body:'If this is the leadership you want to build, let us start. Work through the Elevate Your Leadership journey, or book a conversation with me to tailor it to your team.',next:'Start with Elevate Organizations',
   disclaimer:'This masterclass is provided for educational purposes only. Leadership and organizational results vary by individual, team, and context, and no specific performance, retention, or financial outcome is guaranteed.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide '+(s.t==='part'?'part ':'')+(s.t==='cta'?'cta ':'')+(s.t==='pillar'?'pillar ':'');
  let h='<span class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.partno) h+='<div class="partno">'+s.partno+'</div>';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.stat) h+='<div class="stat">'+s.stat+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.body) h+='<p class="body">'+s.body+'</p>';
  if(s.by) h+='<div class="byline">'+s.by+'</div>';
  if(s.next) h+='<div class="nextstep">'+s.next+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  sec.innerHTML=h;
  deck.appendChild(sec);
});
</script>
</body>
</html>
