<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Becoming a Sound Healer, a live masterclass with Hoppi Wimbush</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Figtree:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6ef;        /* warm cream ground (brand body bg) */
    --panel:#f2ebdd;     /* deeper cream panel */
    --ink:#2f2b28;       /* deepened heading grey #474747 */
    --muted:#6c6c6c;     /* brand body grey */
    --accent:#7c282a;    /* clay-red, dominant brand accent */
    --sage:#79a6a3;      /* secondary brand hue */
    --rule:#e0d7c5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#efe7d8;color:var(--ink);font-family:"Figtree",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:14px;padding:64px 60px;margin:0 0 26px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .slide.center{align-items:center;text-align:center}
  .eyebrow{font-family:"Figtree";font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:"Marcellus";font-weight:600;font-size:60px;line-height:1.04;letter-spacing:.3px}
  h2{font-family:"Marcellus";font-weight:600;font-size:40px;line-height:1.08;margin-bottom:20px}
  .lede{font-family:"Marcellus";font-style:italic;font-size:26px;line-height:1.4;color:var(--accent)}
  p.body{font-size:18px;line-height:1.65;color:var(--ink);max-width:62ch;margin-top:14px}
  p.sub{font-size:17px;line-height:1.6;color:var(--muted);margin-top:18px;max-width:60ch}
  ul{list-style:none;margin-top:22px;max-width:64ch}
  li{position:relative;padding-left:30px;margin:0 0 16px;font-size:18px;line-height:1.55}
  li:before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:50%;
    border:2px solid var(--accent)}
  li b{font-weight:700}
  .part{font-family:"Marcellus";font-size:16px;letter-spacing:.2em;text-transform:uppercase;
    color:var(--sage);font-weight:600;margin-bottom:14px}
  .big{font-size:72px}
  .rings{position:absolute;right:-70px;top:-70px;opacity:.5;pointer-events:none}
  .rings.bl{right:auto;top:auto;left:-80px;bottom:-80px;opacity:.35}
  .foot{position:absolute;left:60px;bottom:26px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:#b9ac92;font-weight:600}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .cta-line{font-family:"Marcellus";font-size:28px;color:var(--accent);margin-top:10px}
  @media(max-width:640px){
    .slide{padding:40px 26px;min-height:0}
    h1{font-size:40px}.big{font-size:48px}h2{font-size:30px}.lede{font-size:21px}
    .foot{left:26px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<svg width="0" height="0"><defs>
  <g id="ring">
    <circle cx="110" cy="110" r="30" fill="none" stroke="#7c282a" stroke-width="1.4"/>
    <circle cx="110" cy="110" r="55" fill="none" stroke="#7c282a" stroke-width="1.2"/>
    <circle cx="110" cy="110" r="82" fill="none" stroke="#7c282a" stroke-width="1"/>
    <circle cx="110" cy="110" r="108" fill="none" stroke="#7c282a" stroke-width=".8"/>
  </g>
</defs></svg>
<script>
const RINGS = '<svg class="rings" width="220" height="220" viewBox="0 0 220 220"><use href="#ring"/></svg>';
const RINGS_BL = '<svg class="rings bl" width="220" height="220" viewBox="0 0 220 220"><use href="#ring"/></svg>';

const S = [
  {t:'title',
    h:'Becoming a Sound Healer',
    lede:'The living instruments, and the natural-shamanic path into real practice',
    sub:'A live masterclass with Hoppi Wimbush, School of Natural Shamanism' },

  {t:'content', eyebrow:'What this hour is',
    h:'By the end of the next hour',
    bullets:[
      'What sound healing actually is, past the weekend-certificate version',
      'The instruments you would learn, and the order they are learned in',
      'The path from your first session to insured, confident practice' ] },

  {t:'content', eyebrow:'Who this is for',
    h:'You feel the pull',
    body:'You have sat inside a sound bath and felt something move that words could not reach. Maybe you already hold space as a yoga teacher, a therapist, a bodyworker, or a friend people come to. Something keeps turning you toward the drum, the bowl, the voice.',
    sub:'This hour is for the person who wants to carry that work properly, not dabble in it.' },

  {t:'content', eyebrow:'The trap',
    h:'Then you went looking',
    body:'You typed "how to become a sound healer" and found a wall of noise. A weekend certificate here. A forty-pound download there. A dozen teachers all saying something different, and no honest answer to the only question that matters: how do I actually do this, safely, for real people?',
    sub:'So the pull stays a pull. It never becomes a practice.' },

  {t:'statement',
    lede:'A weekend with a singing bowl does not make a healer.',
    big:'And that is good news.',
    sub:'Because it means this is a craft. And a craft can be learned.' },

  {t:'part', part:'Part One', h:'Why most sound training leaves you stuck' },

  {t:'content', eyebrow:'The real problem',
    h:'Technique without a path',
    body:'Most courses hand you one instrument and a playlist of techniques. Nobody shows you how the instruments fit together, how to hold a room when something big surfaces, or how to turn a gift into a practice people trust and pay for.',
    bullets:[
      'Isolated instruments, never an orchestra',
      'No trauma-informed container when emotion rises',
      'No path, no supervision, no certification people recognise' ] },

  {t:'part', part:'Part Two', h:'Natural Shamanism, the path I teach' },

  {t:'content', eyebrow:'The ground it grows from',
    h:'Natural Shamanism',
    body:'I did not borrow this from one distant lineage. Natural Shamanism is rooted in the living land, taught from our off-grid ecovillage in Pembrokeshire, where the seasons, the fire and the earth are part of the teaching. Sound is not a trick you perform. It is a relationship you build.',
    sub:'This is the ground the whole practitioner path grows from.' },

  {t:'content', eyebrow:'The living instruments',
    h:'You learn an orchestra, in order',
    body:'In the training the instruments are learned as a progression, each one opening the next, until you can read a room and reach for the right voice at the right moment.',
    bullets:[
      '<b>Voice and tuning forks</b>, the first and most intimate instruments',
      '<b>Himalayan and crystal bowls</b>, holding and moving the field',
      '<b>Shamanic drum and gong</b>, the heartbeat and the wave' ] },

  {t:'content', eyebrow:'Instrument, one',
    h:'Voice and tuning forks',
    body:'We begin with the instrument you already carry. The voice teaches presence, pitch and listening. Tuning forks teach precision: where sound lands in the body, and how to follow it rather than impose it.' },

  {t:'content', eyebrow:'Instrument, two',
    h:'Himalayan and crystal bowls',
    body:'The bowls are how you hold and move a field of sound around a person. You learn to build a container slowly, to let it deepen, and to bring someone back gently rather than leaving them cracked open.' },

  {t:'content', eyebrow:'Instrument, three',
    h:'Shamanic drum and gong',
    body:'The drum is the heartbeat, the oldest way we have of gathering and settling a nervous system. The gong is the wave, the biggest release in the room. These are learned last, because they ask the most of you as the one holding the space.' },

  {t:'content', eyebrow:'The part nobody teaches',
    h:'Trauma-informed presence',
    body:'Sound reaches people underneath their words, which is exactly why it can surface grief, memory and fear. A real practitioner knows what to do when that happens. We train this directly: how to stay regulated, how to keep someone safe, when to soften and when to stop.',
    sub:'This is the difference between a nice session and a practice you can stand behind.' },

  {t:'content', eyebrow:'Holding the room',
    h:'Healing sound baths',
    body:'Everything comes together in the sound bath: reading the room, choosing the instruments, building and releasing, closing with care. You learn to design and hold a full session for one person or for a circle, start to finish.' },

  {t:'part', part:'Part Three', h:'From first session to real practice' },

  {t:'content', eyebrow:'The path',
    h:'How you actually become a practitioner',
    body:'Knowledge becomes practice through repetition and feedback. Across the year you work with real people and bring the sessions back to the circle.',
    bullets:[
      '<b>Case studies with real clients</b>, three a month, so you graduate experienced',
      '<b>Monthly live circles</b>, where your questions and sessions are held',
      '<b>Accredited, insured certification</b> through the IPHM, so your work is recognised' ] },

  {t:'content', eyebrow:'Why learn this with me',
    h:'Hoppi Wimbush',
    body:'I have been healing, teaching and transforming lives for close to thirty years, working with sound, cellular healing, creativity, spiritual counselling, emotional intelligence and nature. I founded the School of Natural Shamanism and co-founded the Lammas Earth Centre, where all of this is taught from the land itself.',
    sub:'I teach the path I actually walk, every day, where I live.' },

  {t:'content', eyebrow:'The year ahead',
    h:'A year, a circle, live',
    body:'The Sound Healer Practitioner Training is a twelve-month journey you can take in person at Lammas or live online from anywhere. Live monthly calls, high quality teachings, real practice, and a circle of people becoming practitioners alongside you.',
    sub:'It is live, it is held, and you are never doing it alone.' },

  {t:'cta',
    h:'Your next step',
    body:'If something in this hour recognised itself in you, that is worth following. The next Sound Healer Practitioner Training cohort opens soon, in person and online.',
    cta:'Come and train with me at the School of Natural Shamanism.',
    disclaimer:'This masterclass is educational. Sound healing supports wellbeing and is not a substitute for medical or psychological treatment. No specific income, outcome or result is guaranteed. Results vary from person to person and depend on your own practice.' }
];

const deck = document.getElementById('deck');
function esc(s){return s||''}
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='title'||s.t==='statement'||s.t==='cta'||s.t==='part'?' center':'');
  let html='';
  html += RINGS;
  if(s.t==='title'){
    html += `<div class="eyebrow">Live masterclass</div>`;
    html += `<h1>${esc(s.h)}</h1>`;
    if(s.lede) html += `<p class="lede" style="margin-top:22px">${esc(s.lede)}</p>`;
    if(s.sub) html += `<p class="sub" style="margin-left:auto;margin-right:auto">${esc(s.sub)}</p>`;
  } else if(s.t==='part'){
    html += `<div class="part">${esc(s.part)}</div>`;
    html += `<h1 style="font-size:50px">${esc(s.h)}</h1>`;
  } else if(s.t==='statement'){
    html += `<p class="lede" style="font-size:34px;color:var(--ink);font-style:normal">${esc(s.lede)}</p>`;
    if(s.big) html += `<h1 class="big" style="color:var(--accent);margin-top:12px">${esc(s.big)}</h1>`;
    if(s.sub) html += `<p class="sub" style="margin-left:auto;margin-right:auto;font-size:20px">${esc(s.sub)}</p>`;
  } else if(s.t==='cta'){
    html += `<div class="eyebrow">Where to go from here</div>`;
    html += `<h1 style="font-size:52px">${esc(s.h)}</h1>`;
    if(s.body) html += `<p class="sub" style="margin-left:auto;margin-right:auto;font-size:19px">${esc(s.body)}</p>`;
    if(s.cta) html += `<p class="cta-line">${esc(s.cta)}</p>`;
    if(s.disclaimer) html += `<p class="disclaimer" style="margin-left:auto;margin-right:auto">${esc(s.disclaimer)}</p>`;
  } else {
    if(s.eyebrow) html += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
    if(s.h) html += `<h2>${esc(s.h)}</h2>`;
    if(s.body) html += `<p class="body">${esc(s.body)}</p>`;
    if(s.bullets){ html += '<ul>'; s.bullets.forEach(b=> html += `<li>${b}</li>`); html += '</ul>'; }
    if(s.sub) html += `<p class="sub">${esc(s.sub)}</p>`;
  }
  html += RINGS_BL;
  html += `<div class="foot">Lammas Earth Centre &middot; School of Natural Shamanism</div>`;
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
