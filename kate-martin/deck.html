<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Get Known Without Becoming an Influencer · Kate Martin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf6f8; --panel:#ffffff; --rule:#ecdfe6;
    --accent:#c2186f; --ink:#2a2426; --dim:#6e6268;
  }
  html,body{height:100%}
  body{background:#efe4ea;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe4ea}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Poppins',sans-serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.01em}
  .t-title h1{font-size:4.7vw;font-weight:700}
  .t-title h1 b{color:var(--accent);font-weight:700}
  .t-normal h1{font-size:3.2vw;max-width:87%}
  .t-normal h1 b{color:var(--accent);font-weight:700}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.5vw;color:var(--dim);margin-top:2.6vh;max-width:77%;line-height:1.58;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.8vw;color:var(--dim);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.28vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.5vw;max-width:88%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#ffffff 0%,#f6eaf1 100%);align-items:center;text-align:center;border-top:none}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--ink)}
  .t-dark h1 b{color:var(--accent)}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#ffffff 0%,#f6eaf1 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:85%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Poppins',sans-serif;border:1.5px solid var(--accent);color:var(--accent);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:600;background:#fff}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .link-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-link{right:6.5%;bottom:8%;width:23vw}
  .corner-link{right:6%;bottom:7.2%;width:10vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.3vw;color:var(--dim);margin-top:3.4vh;font-weight:600;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.7vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Get Known As Yourself</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- relationship motif: two people joined by a real conversation, not a funnel -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="link" viewBox="0 0 280 150">
  <g fill="none" stroke="#c2186f" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 104 C 96 44, 184 44, 220 104" opacity="0.85"/>
    <circle cx="60" cy="104" r="15" fill="#c2186f" opacity="0.14" stroke="#c2186f" stroke-width="2.6"/>
    <circle cx="220" cy="104" r="15" fill="#c2186f" opacity="0.14" stroke="#c2186f" stroke-width="2.6"/>
    <circle cx="140" cy="59" r="6" fill="#c2186f" opacity="0.9" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Get Known Without Becoming an <b>Influencer</b>',sub:'The masterclass for health and wellness coaches. How to get known, get booked, and enrol clients through real relationships and your genius zone.',brand:true,ledger:'title'},
 {t:'normal',k:'Who this is for',title:'You are a brilliant coach. Almost nobody knows it.',body:'You get real results for the clients lucky enough to find you. And still the calendar has gaps, the income plateaus, and the people who need you most have never heard your name. If that is the frustrating part, this hour is for you.'},
 {t:'dark',title:'You do not have a coaching problem. You have a <b>being known</b> problem.'},

 {t:'section',idx:'Part One',title:'Why Great Coaches Stay Invisible'},
 {t:'normal',k:'The bad advice',title:'You were told to be <b>louder</b>, not to be found.',body:'Post more, go viral, slide into DMs, chase every lead ten times, act like an influencer. It is exhausting, it is not you, and it quietly teaches your audience that you are one more person selling at them instead of the coach they can trust.'},
 {t:'normal',k:'The real cost',title:'Louder marketers keep filling calendars you should own.',body:'Coaches with a fraction of your skill get booked because they are visible and you are not. Being the best kept secret does not pay you. Talent that nobody can find loses every time to talent that is simply known.'},
 {t:'dark',title:'You were told to build a funnel. What you needed was to build <b>trust</b>.'},

 {t:'section',idx:'Part Two',title:'The Influence Formula'},
 {t:'normal',k:'Pillar one',title:'Nail the <b>one message</b> only you can own.',body:'Before any tactic, get crisp on the one thing your people cannot unhear, in plain words, not clever ones. A clear message is what makes a stranger stop and think she is talking about me, which is where every enrolment actually begins.'},
 {t:'normal',k:'Pillar two',title:'Build <b>rapid authority</b> in your genius zone.',body:'Become the obvious choice by teaching what you already know best, on your podcast and in your community, as yourself. Authority is not a follower count. It is being the person who is clearly helpful before anyone has paid you a cent.'},
 {t:'normal',k:'Pillar three',title:'Package and price so there is a <b>yes</b> at every level.',body:'Structure your offers into varied-price packages, from a simple starting point to full mentoring, so the right people can say yes where they are today. Most coaches have one price and lose everyone it does not fit.'},
 {t:'normal',k:'Pillar four',title:'Sell by <b>serving</b>, through real conversations.',body:'Skillful selling is not cold pitching or following up ten times. It is a genuine conversation where enrolling is the natural next step because the trust is already there. This is the part that isnt something AI can replicate.'},
 {t:'normal',k:'The extra door',title:'The Script: your first <b>corporate</b> gig.',body:'There is a whole channel most coaches never open. My exact method for landing a first free corporate wellness gig through real relationships, no cold pitching and no proposals, which then turns into long-term paid workplace programs.'},
 {t:'dark',title:'Zero paid ads to start. Just your genius zone, made <b>visible</b>.'},

 {t:'section',idx:'Part Three',title:'What It Actually Looks Like'},
 {t:'normal',k:'The new rhythm',title:'A business that runs on <b>relationships</b>, not hustle.',body:'When the message is clear, the authority is real, and the offers fit, enrolments start coming from people who already trust you. Income goes up, hours come down, and you spend your week in the work only you can do.'},
 {t:'normal',k:'Why I can teach this',title:'Twenty-seven years, not a theory.',body:'I have been a coach since 1998 and have mentored coaches since 2004. I built multiple health businesses from zero to over a hundred clients, ran up to 140 sessions a week, and wrote a bestselling book. I teach this because I have lived every step of it.'},
 {t:'dark',title:'You can be a genuinely good person, care about your clients, <b>and</b> make great money.'},

 {t:'section',idx:'Your next step',title:'Keep Going With Me'},
 {t:'normal',k:'How I can help',title:'The Influence Formula.',body:'This is where the four pillars become how you actually run your week: personal mentoring to get you known, get you paid, and get your time back, working in your genius zone. The podcast and community get you started, and the Influence Formula is where it sticks.'},
 {t:'cta',title:'Ready to get known as yourself?',chips:['Join the Influence Formula','Book a call with Kate'],disc:'Educational content for health and wellness coaches. No income, revenue, or business result is guaranteed. Results vary by coach, offer, and market.'},
];

const deck=document.getElementById('deck');
function ledger(kind){return `<svg class="link-motif ${kind==='title'?'title-link':'corner-link'}"><use href="#link"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Kate Martin Mentor · <b>The Coaches Coach</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.ledger) h+=ledger(s.ledger);
  else if(s.t==='title') h+=ledger('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
