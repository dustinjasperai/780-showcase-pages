<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Your Reactive Dog Isn't Broken - A Cog Dog Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4f2;       /* warm paper, light scheme per brand.json */
    --panel:#efe8f1;    /* pale lavender from #d3a7f1 */
    --ink:#281528;      /* deep plum, brand dominant 29 uses */
    --rule:#2b3852;     /* navy, brand 18 uses */
    --accent:#c07fea;   /* lavender, brand link/highlight 24 uses */
    --muted:#6b5c6b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--rule);font-family:'Open Sans',sans-serif;color:var(--ink);}
  #stage{max-width:960px;margin:0 auto;}
  .slide{
    background:var(--bg);
    min-height:min(92vh,720px);
    aspect-ratio:16/10;
    padding:64px 72px;
    display:none;
    flex-direction:column;
    justify-content:center;
    border-bottom:1px solid rgba(40,21,40,.06);
    position:relative;
  }
  .slide.on{display:flex}
  h1{font-family:'Zilla Slab',serif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.5px;color:var(--ink)}
  h2{font-family:'Zilla Slab',serif;font-weight:700;font-size:40px;line-height:1.1;color:var(--ink)}
  .eyebrow{font-family:'Open Sans';font-weight:700;text-transform:uppercase;letter-spacing:3px;font-size:13px;color:var(--accent);margin-bottom:22px}
  p.lead{font-size:23px;line-height:1.5;color:var(--ink);margin-top:22px;max-width:46ch}
  p.body{font-size:19px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:52ch}
  .promise{font-size:20px;color:var(--rule);margin-top:26px;font-weight:600}
  .brandline{position:absolute;bottom:34px;left:72px;font-size:13px;letter-spacing:2px;text-transform:uppercase;color:var(--muted);font-weight:600}
  .pillars{display:flex;gap:16px;margin-top:34px;flex-wrap:wrap}
  .pill{background:var(--panel);border-left:4px solid var(--accent);padding:16px 20px;font-family:'Zilla Slab';font-weight:600;font-size:20px;color:var(--ink);min-width:150px}
  .big{font-family:'Zilla Slab';font-weight:700;font-size:120px;color:var(--accent);line-height:1}
  ul.clean{margin-top:22px;list-style:none;max-width:52ch}
  ul.clean li{font-size:19px;line-height:1.5;color:var(--ink);padding-left:26px;position:relative;margin-bottom:14px}
  ul.clean li:before{content:"";position:absolute;left:0;top:10px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .num{font-family:'Zilla Slab';font-weight:700;font-size:22px;color:var(--accent)}
  .disc{font-size:14px;color:var(--muted);margin-top:30px;max-width:56ch;line-height:1.5}
  .cta-steps{margin-top:26px}
  .cta-steps div{font-size:21px;color:var(--ink);margin-bottom:12px;font-weight:600}
  .cta-steps span{color:var(--accent)}
  #nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;background:rgba(40,21,40,.85);padding:8px 16px;border-radius:40px;z-index:10}
  #nav button{background:none;border:none;color:#fff;font-size:18px;cursor:pointer;padding:4px 8px}
  #count{color:#fff;font-size:13px;font-family:'Open Sans';letter-spacing:1px}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">&#8592;</button><span id="count"></span><button id="next">&#8594;</button></div>
<script>
const S=[
  {t:'title',
   eyebrow:'A Live Masterclass with Sarah Stremming',
   h:"Why Your Reactive Dog Isn't Broken",
   promise:"The four pillars of behavioral wellness that calm reactivity, lunging and aggression from the inside out."},

  {t:'who',
   eyebrow:'Who this is for',
   h:"You love your dog. You just want the walks back.",
   body:"This is for the guardian whose dog barks, lunges, or reacts, and who is tired of being told to add one more command. If you have a dog who struggles and a willingness to do the work, you are in the right room."},

  {t:'trap',
   eyebrow:'The trap',
   h:"A minefield of hacks, tips and advice.",
   body:"Most of what the feed offers a reactive-dog guardian is useless at best and harmful at worst. Quick fixes suppress the signal and leave the cause untouched, so the behavior comes back, usually worse."},

  {t:'reframe',
   eyebrow:'The reframe',
   h:"Your dog is not being stubborn.",
   lead:"Reactivity is not disobedience. It is a dog telling you, in the only language it has, that something in its world is not working."},

  {t:'part',num:'Part One',
   h:"Where the behavior actually comes from",
   body:"Problems like excessive barking, chewing, digging, and even reactivity and aggression are born when a dog's basic needs are not being met. Fix the life, and the behavior changes with it."},

  {t:'bullets',
   eyebrow:'The shift',
   h:"From managing symptoms to building wellness",
   items:["Correction manages the moment and teaches the dog to hide the signal.",
          "Wellness removes the pressure that created the signal in the first place.",
          "A well dog has far less to react to, so training finally sticks."]},

  {t:'part',num:'Part Two',
   h:"The Four Pillars of Behavioral Wellness",
   body:"These four areas are badly underused as problem-prevention. Get them right and most behavior problems lose their fuel."},

  {t:'pillars',
   eyebrow:'The framework',
   h:"Four pillars, one well dog",
   pills:['Exercise','Enrichment','Nutrition','Communication']},

  {t:'pillar',num:'01',
   h:"Exercise",
   body:"Not just more walking. The right kind of physical outlet for this dog's body and breed, so arousal has somewhere to go instead of spilling into reactivity."},

  {t:'pillar',num:'02',
   h:"Enrichment",
   body:"A dog with an under-used brain invents its own jobs, and most of them look like behavior problems. Enrichment gives the mind legitimate work."},

  {t:'pillar',num:'03',
   h:"Nutrition",
   body:"What goes in shapes how a dog feels and copes. Gut and diet sit underneath more behavior than most guardians are ever told."},

  {t:'pillar',num:'04',
   h:"Communication",
   body:"Clear, consistent communication lowers a dog's uncertainty, and uncertainty is where most reactivity lives. The dog that understands you has less to fear."},

  {t:'signature',
   eyebrow:'Your first practice',
   h:"The decompression walk",
   body:"The single practice I would hand you first. A true decompression walk is not a training session. It is unstructured, low-pressure time that lets an over-aroused nervous system actually settle. Most dogs who 'don't decompress' were never given a real one."},

  {t:'part',num:'Part Three',
   h:"The walks you stopped expecting",
   body:"You stop bracing for the walk. The reactions get shorter, then rarer. The dog you pictured when you first brought it home starts showing up, because its needs are finally being met."},

  {t:'bullets',
   eyebrow:'What changes',
   h:"The relationship you pictured, back on the table",
   items:["Walks become something you look forward to again.",
          "You respond to a signal early instead of a meltdown late.",
          "You have a framework you can run for the life of the dog, not a trick for today."]},

  {t:'why',
   eyebrow:'Why me',
   h:"Walking dogs and their people into wellness since 2012",
   body:"I am Sarah Stremming, a certified dog behavior consultant and the voice behind Cog Dog Radio, which reaches guardians across 50 countries. I founded The Cognitive Canine in 2011 and I have spent every day since trying to understand dogs a little better than the day before."},

  {t:'cta',
   eyebrow:'Keep walking into wellness',
   h:"Keep going with me",
   steps:[["Join the ","Cog Dog Membership"," for the full library and a live community."],
          ["Or ","request private coaching"," if you are ready for the deep, dedicated work."]],
   disc:"This masterclass is educational. Every dog and every household is different and results vary. Nothing here is a promise or guarantee of a specific behavioral outcome. For dogs with serious aggression, work alongside a qualified professional."}
];

const stage=document.getElementById('stage');
let i=0;
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(){
  stage.innerHTML='';
  S.forEach((s,idx)=>{
    const d=document.createElement('section');
    d.className='slide'+(idx===i?' on':'');
    let html='';
    if(s.eyebrow) html+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
    if(s.num && (s.t==='part'||s.t==='pillar')) html+='<div class="num">'+esc(s.num)+'</div>';
    if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>');
    if(s.promise) html+='<p class="promise">'+esc(s.promise)+'</p>';
    if(s.lead) html+='<p class="lead">'+esc(s.lead)+'</p>';
    if(s.body) html+='<p class="body">'+esc(s.body)+'</p>';
    if(s.pills){html+='<div class="pillars">';s.pills.forEach(p=>html+='<div class="pill">'+esc(p)+'</div>');html+='</div>';}
    if(s.items){html+='<ul class="clean">';s.items.forEach(it=>html+='<li>'+esc(it)+'</li>');html+='</ul>';}
    if(s.steps){html+='<div class="cta-steps">';s.steps.forEach(st=>html+='<div>'+esc(st[0])+'<span>'+esc(st[1])+'</span>'+esc(st[2])+'</div>');html+='</div>';}
    if(s.disc) html+='<div class="disc">'+esc(s.disc)+'</div>';
    html+='<div class="brandline">Cog Dog with Sarah Stremming</div>';
    d.innerHTML=html;
    stage.appendChild(d);
  });
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
render();
</script>
</body>
</html>
