<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Without Self-Abandonment, with Nataisha Revoy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Open+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efe6dc; --panel:#fcf9f5; --rule:#e3d7c9;
    --accent:#345168; --taupe:#cdb6a6; --ink:#2b2b2b; --muted:#6b6459;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Open Sans',sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:64px 60px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(52,81,104,.04)}
  .slide.title{background:var(--accent);color:#f7f3ee;border-color:var(--accent);min-height:520px}
  .eyebrow{font-family:'Open Sans';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--taupe);margin-bottom:22px}
  .slide.title .eyebrow{color:#cdb6a6}
  h1{font-family:'Lora';font-weight:600;font-size:52px;line-height:1.08;margin-bottom:20px}
  h2{font-family:'Lora';font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px;color:var(--accent)}
  .slide.title h1{font-size:60px}
  .lead{font-family:'Lora';font-weight:400;font-style:italic;font-size:24px;color:var(--muted);margin-bottom:10px}
  .slide.title .lead{color:#e4d8cc}
  p{font-size:19px;margin-bottom:14px;max-width:42em}
  .muted{color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;
    border-radius:50%;background:var(--taupe)}
  .pillar{font-family:'Lora';font-weight:600;color:var(--accent)}
  .big{font-family:'Lora';font-weight:500;font-size:40px;line-height:1.16;color:var(--accent)}
  .presenter{margin-top:34px;font-size:17px;color:#e4d8cc}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:46em;border-top:1px solid var(--rule);padding-top:16px}
  .n{font-family:'Lora';font-weight:600;color:var(--taupe);font-size:17px;margin-bottom:10px;display:block}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   eyebrow:'A live masterclass',
   h1:'Lead Without Self-Abandonment',
   lead:'How people-centered leaders keep leading through constant change without losing themselves.',
   presenter:'with Nataisha Revoy, Leadership Coach (ICF PCC)'},

  {t:'promise',
   eyebrow:'What this hour is',
   h2:'A pause, not another strategy',
   p:["In the next hour you will step back from the pace of leading, look honestly at what has been driving you, and leave with one grounded way to lead that doesn't cost you your wellbeing.",
      "This is built on one belief: strong leadership does not require self-abandonment."]},

  {t:'who',
   eyebrow:'Who this is for',
   h2:'You care deeply, and you are carrying a lot',
   p:["You take your responsibilities seriously. You want to support your team. And lately you've wondered how long you can keep up the pace, the constant change, and the growing expectations.",
      "Your days are full. Your mind rarely stops. You're constantly busy, yet it never feels like enough."]},

  {t:'trap',
   eyebrow:'The trap',
   big:'So you try harder. And trying harder is exactly what's wearing you down.'},

  {t:'reframe',
   eyebrow:'A different way',
   h2:'Most leaders don't need more information',
   p:["You already know what good leadership looks like. What's missing isn't another framework to read.",
      "What's missing are different conditions: the space to slow down long enough to notice what has been driving you, and a deliberate way to lead from that instead of from pressure."]},

  {t:'part',
   n:'Part One',
   h2:'Why change doesn't come from information',
   p:["Three beliefs sit underneath everything we'll do today."]},

  {t:'belief',
   eyebrow:'Belief one',
   h2:'Experience changes us differently than information',
   p:["Reading about leadership isn't the same as experiencing it. Real insight comes when we slow down long enough to notice the patterns we've been leading from all along."]},

  {t:'belief',
   eyebrow:'Belief two',
   h2:'We discover more together than alone',
   p:["Leadership can be isolating. When thoughtful leaders reflect together, they realize they aren't alone and they see possibilities they couldn't see by themselves."]},

  {t:'belief',
   eyebrow:'Belief three',
   h2:'New thinking requires different conditions',
   p:["It's hard to see new possibilities while operating under constant pressure. Create space to slow down and reconnect, and a different way of leading becomes possible."]},

  {t:'part',
   n:'Part Two',
   h2:'The Zoom In, Zoom Out method',
   p:["Sustainable leadership is a deliberate movement between the inner work and the outer behaviour. Here is how that works."]},

  {t:'zoom',
   eyebrow:'Zoom In',
   h2:'Steady yourself first',
   ul:['Identify the patterns shaping how you lead',
       'Clarify your values and what actually drives your decisions',
       'Strengthen your emotional regulation and your boundaries']},

  {t:'zoom',
   eyebrow:'Zoom Out',
   h2:'Then steady the room',
   ul:['Support team dynamics and build psychological safety',
       'Strengthen your communication and leadership presence',
       'Lead through change without absorbing all of it yourself']},

  {t:'pillars',
   eyebrow:'The through-line',
   h2:'Three pillars hold it together',
   ul:['<span class="pillar">Lead with clarity</span>: decide from direction, not from noise',
       '<span class="pillar">Protect your energy</span>: lead with energy, not exhaustion',
       '<span class="pillar">Stay true to your values</span>: let them make the hard calls']},

  {t:'practice',
   n:'Part Three',
   h2:'A hard week, led from your values',
   p:["Health and wellbeing get blocked in first, not last. Energizing people and work get scheduled on purpose. The draining obligations get a clear time limit instead of your whole day.",
      "You stop asking the day to hold everything, and you start leading it from your values."]},

  {t:'why',
   eyebrow:'Why me',
   h2:'I coach people-centered leaders for a living',
   p:["I'm Nataisha Revoy, a leadership coach with over 1,600 hours of coaching. I work with capable, committed leaders who are carrying more than they can sustain, and I help them lead in a way that is honest, grounded, and true to who they are.",
      "Every week I host the Leadership Pause, a live space to slow down and lead differently."]},

  {t:'recap',
   eyebrow:'To carry forward',
   big:'Lead with clarity. Protect your energy. Stay true to your values.'},

  {t:'action',
   eyebrow:'One intentional action',
   h2:'Pick the one shift',
   p:["Before you leave, choose one thing you will do differently this week. Not ten. One. That is how change actually holds for leaders who are already full."]},

  {t:'cta',
   eyebrow:'If today gave you room to breathe',
   h2:'Keep leading this way, with support',
   p:["If today gave you a little more room to breathe, the next step is a conversation. Book a free Discovery Conversation and we'll look at how you lead, the pressure points, and what needs to shift.",
      "You're also welcome in the Leadership Circle, monthly group support with other leaders on the same path."],
   disclaimer:'This masterclass is educational. It shares leadership and wellbeing practices, not guaranteed outcomes. Results vary from person to person, and nothing here is medical or mental-health advice.'}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t||'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.n) h+='<span class="n">'+s.n+'</span>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.lead) h+='<div class="lead">'+s.lead+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.p) s.p.forEach(x=>h+='<p>'+x+'</p>');
  if(s.ul){h+='<ul>';s.ul.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.presenter) h+='<div class="presenter">'+s.presenter+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
