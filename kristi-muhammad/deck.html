<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Five Pillars of a Profitable Coaching Business - Women CEO Project</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f6f1;
    --ink:#254822;
    --accent:#f0a8ad;
    --muted:#5e5e5e;
    --panel:#ffffff;
    --rule:#dfe4da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Raleway",sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:64px 60px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(37,72,34,0.04)}
  .slide.ground{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.ground .eyebrow{color:var(--accent)}
  .slide.ground .num{color:rgba(248,246,241,0.5)}
  .eyebrow{font-family:"Raleway",sans-serif;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;font-size:12px;color:var(--muted);margin-bottom:22px}
  h1{font-family:"Rufina",serif;font-weight:700;font-size:46px;line-height:1.12;letter-spacing:-0.01em}
  h2{font-family:"Rufina",serif;font-weight:700;font-size:34px;line-height:1.18}
  p{font-family:"Raleway",sans-serif;font-weight:400;font-size:19px;line-height:1.6;color:var(--muted);margin-top:18px;max-width:40em}
  .slide.ground p{color:rgba(248,246,241,0.82)}
  .lead{font-size:22px;color:var(--ink)}
  .slide.ground .lead{color:var(--bg)}
  .promise{font-family:"Raleway";font-weight:600;font-size:20px;color:var(--ink);margin-top:26px}
  .pillarnum{font-family:"Rufina",serif;font-size:60px;color:var(--accent);line-height:1}
  ul{margin-top:22px;list-style:none}
  li{font-family:"Raleway";font-weight:400;font-size:19px;line-height:1.5;color:var(--muted);padding-left:26px;position:relative;margin-bottom:12px}
  li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--accent);border-radius:50%}
  .cols{display:flex;gap:16px;margin-top:28px;flex-wrap:wrap}
  .col{flex:1;min-width:120px;border-top:3px solid var(--accent);padding-top:14px}
  .col b{font-family:"Rufina",serif;font-weight:700;font-size:17px;color:var(--ink);display:block}
  .col span{font-size:14px;color:var(--muted);display:block;margin-top:6px}
  .num{font-family:"Raleway";font-weight:600;font-size:13px;color:var(--rule);margin-top:34px;letter-spacing:0.1em}
  .stat{font-family:"Rufina",serif;font-size:40px;color:var(--ink);line-height:1.1}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:30px;max-width:46em;line-height:1.5}
  .cta-step{font-family:"Rufina",serif;font-size:26px;color:var(--ink);margin-top:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", eyebrow:"A Women CEO Project Masterclass",
   h:"The Five Pillars of a Profitable Coaching Business",
   promise:"How women coaches build a business that actually pays, by getting niching, positioning, pricing, funnels and follow-up right."},

  {t:"who", eyebrow:"Who this is for",
   h:"You have the gift. The business is the hard part.",
   p:"This is for the coach who is good at the work. You change lives in the room. And still the months feel like starting from zero, the pricing feels like a guess, and the income does not match the impact. If that is you, you are in the right place."},

  {t:"trap", eyebrow:"The trap",
   h:"More clients is the wrong goal.",
   p:"So you chase more. More posts, more free calls, more discounts to get a yes. You end up busy and still broke, trading hours for scraps, because the business was never built to hold the clients you already have."},

  {t:"hook", ground:true, eyebrow:"The reframe",
   h:"You do not have a traffic problem. You have a pricing problem.",
   p:"Almost every stuck coach I meet is missing the same thing. Not clients. Not talent. A structure: a niche, a price she is not afraid of, tiers people can climb, and a follow-up that does not let people fall through the floor."},

  {t:"part", ground:true, eyebrow:"Part One",
   h:"Why good coaches stay broke."},

  {t:"body", eyebrow:"The core problem",
   h:"An undefined coach is an unpaid coach.",
   p:"When you serve everyone, you are chosen by no one and priced like everyone. The market cannot tell what you are worth because you have not told it who you are for. Vague is expensive. It is the single most costly habit in this field."},

  {t:"body", eyebrow:"The core problem",
   h:"Impact without a system does not compound.",
   p:"A great month followed by a dead one is not a business, it is a hobby with stress. Without a repeatable way to find, enroll and keep clients, every month you burn your energy winning back ground you already won."},

  {t:"part", ground:true, eyebrow:"Part Two",
   h:"The Five Pillars."},

  {t:"pillar", eyebrow:"Pillar One", num:"1",
   h:"Niche",
   p:"Choose the woman you are for and the result you get her. A clear niche is not a cage, it is a magnet. It makes your marketing obvious and your price defensible."},

  {t:"pillar", eyebrow:"Pillar Two", num:"2",
   h:"Position",
   p:"Build expert status on purpose. Your content, your proof and your point of view should make you the obvious choice in your corner, not one more coach in the scroll."},

  {t:"pillar", eyebrow:"Pillar Three", num:"3",
   h:"Price",
   p:"Get paid your worth. Set real prices, build tiers people can climb, and learn to pitch and present a proposal without shrinking. This is the pillar that changes the bank account, and the one most coaches skip."},

  {t:"pillar", eyebrow:"Pillar Four", num:"4",
   h:"Funnel",
   p:"Build one clear path a stranger walks from first hello to paying client. Not ten tactics you dabble in, one funnel you run on repeat so new clients stop being an accident."},

  {t:"pillar", eyebrow:"Pillar Five", num:"5",
   h:"Follow-up",
   p:"The money is in the follow-up. Most sales happen after the first no. A simple, kind, consistent follow-up keeps the people who already raised a hand from quietly disappearing."},

  {t:"body", eyebrow:"The through-line",
   h:"Pricing, tiers and the pitch run through all five.",
   p:"Niche sets your price. Positioning defends it. The funnel delivers people to it. Follow-up protects it. The coaches who win are not the loudest. They are the ones who built the revenue machinery under the gift."},

  {t:"part", ground:true, eyebrow:"Part Three",
   h:"When the gift finally pays."},

  {t:"body", eyebrow:"The twelve month view",
   h:"A year that compounds instead of resets.",
   p:"When the five pillars are in place, you plan offers, launches and follow-up across the whole year. Each month builds on the last. Your calendar stops being a scramble and starts being a strategy.",
   cols:[{b:"Niche + offer",s:"who and what"},{b:"Pricing + tiers",s:"paid your worth"},{b:"Proposals",s:"pitch and close"},{b:"Funnel",s:"one clear path"},{b:"Follow-up",s:"keep the hands"}]},

  {t:"body", eyebrow:"A week in the business",
   h:"Fewer free calls. More of the right ones.",
   p:"You spend less time convincing strangers to book and more time serving clients who already climbed the first tier. The business holds what you build, so the impact and the income finally match."},

  {t:"why", eyebrow:"Why me",
   h:"I have spent fifteen years on exactly this.",
   p:"I am Kristi, founder of Women CEO Project. Since 2010 I have taught, coached and reached over 300,000 women entrepreneurs through courses, private coaching and the Global Power Tour, and I was recognized by the White House as a Citizen Innovator for the work. The Five Pillars are what I build with every private client.",
   stat:"300,000+ women reached"},

  {t:"body", eyebrow:"The recap",
   h:"Niche. Position. Price. Funnel. Follow up.",
   p:"That is the whole machine. Get these five right and a coaching business stops being a monthly gamble and becomes something that pays you what the work is worth."},

  {t:"cta", eyebrow:"Your next step",
   h:"Ready to build your Five Pillars?",
   step:"Book a call with me and we will map which pillar is costing you the most right now, and the plan to fix it.",
   disclaimer:"This masterclass is for education only. It is not a guarantee of income or results. Coaching outcomes vary and depend on your own effort, market and execution."}
];

const deck = document.getElementById("deck");
S.forEach((s,i)=>{
  const el = document.createElement("section");
  el.className = "slide" + (s.ground ? " ground" : "");
  let html = "";
  if(s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.num) html += '<div class="pillarnum">'+s.num+'</div>';
  if(s.t==="title"){ html += '<h1>'+s.h+'</h1>'; if(s.promise) html += '<div class="promise">'+s.promise+'</div>'; }
  else { html += '<h2>'+s.h+'</h2>'; }
  if(s.p) html += '<p'+(i===1||s.t==="who"?' class="lead"':'')+'>'+s.p+'</p>';
  if(s.cols){ html += '<div class="cols">'; s.cols.forEach(c=>{ html += '<div class="col"><b>'+c.b+'</b><span>'+c.s+'</span></div>'; }); html += '</div>'; }
  if(s.stat) html += '<div class="stat" style="margin-top:22px">'+s.stat+'</div>';
  if(s.step) html += '<div class="cta-step">'+s.step+'</div>';
  if(s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  html += '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
