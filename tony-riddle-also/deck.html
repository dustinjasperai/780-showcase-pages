<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wellness as a Way of Being — The Natural Lifestyle Coaching Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf5f5;        /* their warm near-white ground */
    --panel:#ffffff;
    --ink:#1d1d1d;       /* their body ink */
    --muted:#5f6b5c;     /* muted sage-grey */
    --rule:#d9c7c2;      /* warm hairline */
    --accent:#40763d;    /* their forest green */
    --accent-soft:#bad8d3;
    --display:"Playfair Display",Georgia,serif;
    --body:"Rubik",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;display:flex;align-items:center;justify-content:center}
  #stage{width:min(1040px,94vw);aspect-ratio:16/9;background:var(--panel);
    border:1px solid var(--rule);border-radius:10px;position:relative;overflow:hidden;
    box-shadow:0 18px 50px rgba(29,29,29,.10)}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;flex-direction:column;
    justify-content:center}
  .slide.on{display:flex;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;margin-bottom:18px}
  h3{font-family:var(--display);font-weight:500;font-size:25px;margin:2px 0 6px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:40ch}
  p.lead{font-size:23px;color:var(--muted);margin-top:18px;max-width:46ch}
  .sub{font-size:19px;color:var(--muted);margin-top:14px;max-width:48ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding-left:26px;position:relative;margin:11px 0;max-width:44ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;
    background:var(--accent)}
  .big{font-family:var(--display);font-size:40px;line-height:1.12;max-width:24ch}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px;margin-top:20px}
  .card{border:1px solid var(--rule);border-left:3px solid var(--accent);border-radius:8px;
    padding:16px 18px;background:var(--bg)}
  .card h3{font-size:21px;color:var(--accent);margin:0 0 4px}
  .card p{font-size:16px;color:var(--muted);line-height:1.4}
  .foot{position:absolute;bottom:22px;left:72px;right:72px;display:flex;justify-content:space-between;
    font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);
    border-top:1px solid var(--rule);padding-top:12px}
  .pill{display:inline-block;border:1px solid var(--accent);color:var(--accent);border-radius:999px;
    padding:6px 14px;font-size:13px;letter-spacing:.1em;text-transform:uppercase;font-weight:500}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:62ch;line-height:1.5}
  .cta-line{font-size:22px;color:var(--ink);margin-top:10px}
  #nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:16px;
    align-items:center;font-size:13px;color:var(--muted);font-family:var(--body)}
  #nav button{font:inherit;background:var(--panel);border:1px solid var(--rule);color:var(--ink);
    border-radius:6px;padding:6px 12px;cursor:pointer}
  .em{color:var(--accent);font-style:italic}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></div>
<script>
const S=[
  {t:'title',k:'A masterclass with Tony Riddle, The Natural Lifestylist',
   h:'Wellness as a Way of Being',
   lead:'How to coach a whole natural lifestyle, not a single modality, and build a longevity-lifestyle coaching career that holds.'},

  {t:'who',k:'Who this is for',
   h:'You want to coach people back to thriving',
   body:'You feel the pull to help people live naturally. Maybe you already teach movement, or breathwork, or food. But you keep running into the same wall.',
   lead:'This is for the aspiring coach who wants to guide a whole human, not sell one more plan.'},

  {t:'trap',k:'The trap',
   h:'The wellness industry sells pieces',
   body:'A nutrition cert here. A breathwork weekend there. A movement badge over there.',
   lead:'So new coaches end up fluent in one piece and lost the moment a client needs the rest of their life to change with it.'},

  {t:'reframe',k:'The reframe',
   big:'Wellness became an industry. It was meant to be a way of being.',
   sub:'We can’t all live in nature. That doesn’t mean we can’t live naturally. The coach’s job is to carry that whole, not a fragment of it.'},

  {t:'part',k:'Part one',h:'Why single-modality coaching breaks',
   body:'A client who fixes their diet but never moves, sleeps, or steps into cold stays stuck. The body is one system. Coach one lever and the others quietly pull it back.',
   lead:'The question is not which modality. It is how to hold all of them in one lifestyle a client can actually keep.'},

  {t:'stakes',k:'What is at stake',
   big:'A fragmented coach gets short bursts. A whole-life coach gets a client for the long game.',
   sub:'Longevity is not one intervention. It is a way of living that the client keeps for years, which is also how you build a coaching career that lasts.'},

  {t:'framework',k:'Part two: the method',h:'The Natural Lifestyle Philosophy',
   body:'One framework across the whole human: our Physical, Social and Spiritual needs, coached together so change holds.',
   cards:[
     {h:'Physical',p:'Move, eat, sleep and recover the way the body evolved to.'},
     {h:'Social',p:'Connection, play and community as part of health, not extras.'},
     {h:'Spiritual',p:'Meaning, nature and stillness: thriving, not just surviving.'}]},

  {t:'pillar',k:'Pillar one',h:'NATLIFEMOVE',
   body:'Natural human movement and play. You coach posture, mobility, barefoot and primal patterns, and how to offset the chair and the screen that fight the body all day.',
   lead:'Movement stops being a workout and becomes the way a client lives in their body.'},

  {t:'pillar',k:'Pillar two',h:'NATLIFEEVOLVE',
   body:'The evolution of the human diet, digestive and immune and nervous systems, natural nutrition, hormones, sleep and rest.',
   lead:'You teach a client to eat and recover the way the body was shaped to, not the way the latest plan says to.'},

  {t:'pillar',k:'Pillar three',h:'NATLIFETHERAPY',
   body:'Nature therapy and immersion, hot and cold contrast with sauna and ice, and breathwork for self-regulation.',
   lead:'Controlled discomfort builds a client who can meet stress instead of hiding from it.'},

  {t:'pillar',k:'Pillar four',h:'NATLIFEGROW',
   body:'How to build, market and launch a longevity-lifestyle business: the mentoring skills, the coach’s ear, and how to hold space well enough for real change.',
   lead:'The craft of coaching, and the craft of making a living from it, taught together.'},

  {t:'depth',k:'The coach’s craft',h:'Developing a coach’s ear',
   body:'Most of coaching is not the plan. It is hearing the one obstacle underneath what the client says, and holding a safe enough space for them to meet it.',
   lead:'You learn to signpost the thinking and behaviour to release, then let the client walk through it themselves.'},

  {t:'space',k:'The craft of space',h:'Holding a safe container',
   body:'A client only changes as fast as they feel safe. You learn to build the container first, so the hard work can happen inside it.',
   lead:'This is the part no nutrition module teaches, and the part clients remember.'},

  {t:'part',k:'Part three',h:'Reading the whole life',
   body:'A client arrives wanting to "get fit." You don’t hand them a program. You read the whole life: the chair, the screen, the missing sunlight, the shallow breath, the lost community.',
   lead:'You coach small, natural shifts across every pillar, and the body does what it was always built to do.'},

  {t:'day',k:'A session, in practice',h:'Small shifts, every pillar',
   cards:[
     {h:'Move',p:'One barefoot walk and a floor-sitting habit before any workout talk.'},
     {h:'Evolve',p:'Light in the morning, food that digests, a real wind-down for sleep.'},
     {h:'Therapy',p:'A cold finish to the shower and two minutes of slow breathing.'},
     {h:'Grow',p:'A client who feels held comes back, refers, and stays for years.'}]},

  {t:'whyme',k:'Why learn this from me',h:'I had to live it to teach it',
   body:'I became a barefoot runner at 44 and broke age-related endurance records. I wrote Be More Human, made a documentary, and coach this every day.',
   lead:'I don’t teach wellness as theory. I teach it as the way I live, and the way I train other coaches to live and coach.'},

  {t:'promise',k:'The promise',
   big:'I can’t promise you’ll add days to your life. I can promise you’ll add life to your years.',
   sub:'That is the promise you learn to deliver to your own clients as a Natural Lifestyle Coach.'},

  {t:'cta',k:'Your next step',h:'Become a NATLIFECOACH',
   ctaline:'Train in the Natural Lifestyle Philosophy with me: a Level 1 certification that equips you to coach the whole human and build a longevity-lifestyle career.',
   disc:'Educational content only. Coaching and lifestyle outcomes vary by individual; nothing here is medical advice or a guarantee of any health, income or business result. The NATLIFECOACH Certification is a professional training, not a promise of earnings.'}
];

const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===cur?' on':'');
    let inner='';
    if(s.k) inner+=`<div class="kicker">${s.k}</div>`;
    if(s.h) inner+= s.t==='title'?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`;
    if(s.big) inner+=`<div class="big">${s.big}</div>`;
    if(s.body) inner+=`<p>${s.body}</p>`;
    if(s.cards){inner+='<div class="grid">';s.cards.forEach(c=>inner+=`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`);inner+='</div>';}
    if(s.sub) inner+=`<p class="sub">${s.sub}</p>`;
    if(s.lead) inner+=`<p class="lead">${s.lead}</p>`;
    if(s.ctaline) inner+=`<p class="cta-line">${s.ctaline}</p>`;
    if(s.disc) inner+=`<div class="disc">${s.disc}</div>`;
    inner+=`<div class="foot"><span>The Natural Lifestylist</span><span>${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span></div>`;
    d.innerHTML=inner;
    stage.appendChild(d);
  });
  document.getElementById('count').textContent=(cur+1)+' / '+S.length;
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,cur+n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
