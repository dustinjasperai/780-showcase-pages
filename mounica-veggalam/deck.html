<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Analytical Mind's Blind Spot — a masterclass with Mounica Veggalam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f3;        /* her cream ground */
    --panel:#f2eee6;     /* her paper panel */
    --ink:#24211c;       /* her dominant ink */
    --muted:#6a6153;     /* her warm taupe */
    --rule:#e0dad0;      /* derived from taupe/cream family */
    --accent:#b23a22;    /* her terracotta */
    --head:'Newsreader', Georgia, serif;
    --body:'Instrument Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .num{position:absolute;top:5vh;right:9vw;font-family:var(--body);font-size:13px;
    letter-spacing:.08em;color:var(--muted)}
  .num::before{content:"";display:inline-block;width:22px;height:1px;background:var(--accent);
    vertical-align:middle;margin-right:8px}
  .k{font-family:var(--body);font-size:13px;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:500;font-size:clamp(34px,6vw,76px);line-height:1.04;
    letter-spacing:-.01em;max-width:16ch}
  h2{font-family:var(--head);font-weight:500;font-size:clamp(28px,4.4vw,52px);line-height:1.1;
    max-width:20ch}
  .lede{font-family:var(--head);font-weight:400;font-style:italic;font-size:clamp(20px,2.6vw,30px);
    color:var(--muted);max-width:30ch;margin-top:26px}
  p.b{font-size:clamp(17px,1.5vw,21px);max-width:46ch;margin-top:22px;color:var(--ink)}
  .big{font-family:var(--head);font-weight:500;font-size:clamp(30px,5vw,60px);line-height:1.08;
    max-width:18ch}
  .big u{text-decoration:none;border-bottom:3px solid var(--accent);padding-bottom:2px}
  ul{list-style:none;margin-top:30px;max-width:40ch}
  li{position:relative;padding-left:30px;margin:18px 0;font-size:clamp(17px,1.6vw,22px)}
  li::before{content:"";position:absolute;left:0;top:.6em;width:14px;height:2px;background:var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:.84em;margin-top:4px}
  .el{display:flex;gap:26px;align-items:baseline;margin-top:16px}
  .el .no{font-family:var(--head);font-size:clamp(40px,6vw,86px);color:var(--accent);
    font-weight:500;line-height:1}
  .el .tx h2{margin-bottom:8px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:clamp(26px,4vw,44px);max-width:52ch;margin-top:30px}
  .cta h1{max-width:18ch}
  .step{font-size:clamp(18px,1.8vw,24px);margin-top:26px;max-width:40ch}
  .step b{color:var(--accent)}
  .disc{font-size:12.5px;color:var(--muted);margin-top:40px;max-width:50ch;line-height:1.5}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:34px;margin-top:30px;max-width:60ch}
  .who h3{font-family:var(--body);font-size:13px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--muted);margin-bottom:14px}
  .who p{font-size:16px;margin:8px 0}
  @media(max-width:680px){.who{grid-template-columns:1fr}.el{gap:16px}}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', k:'A live masterclass for analytical people',
   h:"The Analytical Mind's Blind Spot",
   lede:'Why the thinking that built your career cannot make your next move, and the three elements that can.'},

  {t:'lede', k:'Who this is for',
   h:'You can solve almost anything. Except this.',
   b:"You are an engineer, a PM, or a leader. You debug systems, model tradeoffs, and ship under pressure. And yet the question of whether to take the promotion, make the pivot, or finally build the thing has been open in a browser tab for a year."},

  {t:'hook', big:"You don't have a decision problem. You have a <u>looking-away</u> problem."},

  {t:'part', k:'Part one', h:'Analysis is armor.',
   b:'More data feels like progress, so you gather more. But the questions that run a career are not information problems. The spreadsheet was never going to answer them, and some part of you already knows that.'},

  {t:'list', k:'The three places analysis cannot reach', h:'What the model leaves out.',
   items:[
     {b:'The default moves you cannot see.', s:'The mental patterns you run on autopilot, because they are you.'},
     {b:'The strengths you discount.', s:'The capacities that come so easily you assume they do not count.'},
     {b:'The feeling underneath the logic.', s:'The emotion quietly steering every rational-looking choice.'}
   ]},

  {t:'part', k:'Part two', h:'The Three Elements.',
   b:'This is the method. We work all three in a structured partnership, because the block is almost never the one you came in naming.'},

  {t:'el', no:'01', h:'Entrenched decision patterns.',
   b:'The way you have always decided, mapped and made visible. You cannot change a pattern you cannot see, and the smartest people have the most invisible ones.'},

  {t:'el', no:'02', h:'Underutilized strengths.',
   b:'The capacities you have been treating as table stakes. We name them, and we build the next move on them instead of on the parts of you that are already tired.'},

  {t:'el', no:'03', h:'Emotions creating blindspots.',
   b:'Not to indulge them, to read them. The fear, the loyalty, the quiet resentment that is bending your analysis without asking permission. Named, it stops steering.'},

  {t:'lede', k:'Why it compounds', h:'Three small distortions, one stuck career.',
   b:'Each element alone is manageable. Together they form a loop: a blind pattern protected by a discounted strength, defended by an unread feeling. Analysis spins faster and the loop holds. The work is to step out of it, not to think harder inside it.'},

  {t:'part', k:'The deeper shift', h:'A possibility partnership, not a mindset fix.',
   b:'Durable change does not come from a better improvement plan or a list of limiting beliefs to argue with. It comes from shifting how you interpret the whole situation, so a different version of you becomes available.'},

  {t:'hook', big:'Change comes from shifting your <u>worldview</u>, not from trying harder inside the old one.'},

  {t:'lede', k:'What shifts', h:'You experience a different possibility of yourself.',
   b:'When the pattern is visible, the strength is in play, and the feeling is read instead of obeyed, the decision you were grinding on often stops being a decision. The next move becomes obvious, and the energy you were spending on the loop comes back.'},

  {t:'part', k:'Part three', h:'Where the loop shows up in a real career.',
   b:'Three transitions bring most analytical professionals to this work. The method is the same; the move is yours.'},

  {t:'list', k:'The move you keep researching', h:'Promotion. Pivot. Launch.',
   items:[
     {b:'The promotion you keep qualifying.', s:'You are ready, and you keep finding reasons to wait for ready.'},
     {b:'The pivot you keep modeling.', s:'Every path analyzed, none chosen, the window quietly narrowing.'},
     {b:'The thing you keep meaning to build.', s:'The side venture that lives in a doc, never in the world.'}
   ]},

  {t:'who', k:'Honesty first', h:'Who this is, and is not, for.',
   forr:['You are analytical and self-aware, and tired of being stuck anyway.',
         'You want to understand the mechanism, not just be cheered on.',
         'You are facing a real, specific move.'],
   nott:['You want someone to make the decision for you.',
         'You are looking for tactics without looking at yourself.',
         'You are not actually willing to change anything.']},

  {t:'why', k:'Who is teaching this', h:'Mounica Veggalam.',
   b:'A former Microsoft software engineer who now coaches leaders at companies like Meta, Nvidia, Airbnb and ServiceNow. Trained in ICF-approved transformational methods and a long-time student of Eastern contemplative practice. She works with analytical people because she is one, and because she has made every one of these moves herself.'},

  {t:'lede', k:'The partnership', h:'Three months, one on one.',
   b:'Monthly private sessions over Zoom, with access between sessions, worksheets, and practices built for an analytical mind. A structured container for working the three elements on the move that matters to you now.'},

  {t:'cta', k:'If this is your moment', h:'Apply to work with Mounica.',
   step:'The next step is a short application and a conversation. We decide together whether this is the right work, for the right move, at the right time.',
   disc:'Educational content only. This masterclass and the coaching described are developmental, not therapy or financial advice. Individual results vary and are not guaranteed; nothing here promises a specific career, income, or outcome.'}
];

const deck = document.getElementById('deck');
function esc(x){return x==null?'':String(x);}
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.t==='cta'?' cta':'');
  let inner='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.k) inner+='<div class="k">'+esc(s.k)+'</div>';
  if(s.t==='title'){ inner+='<h1>'+esc(s.h)+'</h1>'; if(s.lede) inner+='<div class="lede">'+esc(s.lede)+'</div>'; }
  else if(s.t==='hook'){ inner+='<div class="big">'+esc(s.big)+'</div>'; }
  else if(s.t==='el'){ inner+='<div class="el"><div class="no">'+esc(s.no)+'</div><div class="tx"><h2>'+esc(s.h)+'</h2><p class="b">'+esc(s.b)+'</p></div></div>'; }
  else if(s.t==='list'){ inner+='<h2>'+esc(s.h)+'</h2><ul>'; s.items.forEach(it=>{inner+='<li><b>'+esc(it.b)+'</b><span>'+esc(it.s)+'</span></li>';}); inner+='</ul>'; }
  else if(s.t==='who'){ inner+='<h2>'+esc(s.h)+'</h2><div class="who"><div><h3>This is for you if</h3>'+s.forr.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div><div><h3>This is not for you if</h3>'+s.nott.map(x=>'<p>'+esc(x)+'</p>').join('')+'</div></div>'; }
  else if(s.t==='cta'){ inner+='<h1>'+esc(s.h)+'</h1><div class="step">'+esc(s.step)+'</div><div class="disc">'+esc(s.disc)+'</div>'; }
  else { if(s.h) inner+='<h2>'+esc(s.h)+'</h2>'; if(s.b) inner+='<p class="b">'+esc(s.b)+'</p>'; }
  sec.innerHTML=inner;
  deck.appendChild(sec);
});
</script>
</body>
</html>
