<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hired in 60 Days - The Recruiter's Playbook | Career Growth With Lucy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f5ef;      /* brand cream, exact (brand.json ranked hex) */
    --panel:#fffdf8;    /* warm near-white tint of the cream */
    --rule:#e4ded0;
    --ink:#111111;      /* brand dominant text hex */
    --muted:#5d5666;    /* brand mauve-grey */
    --accent:#1b022f;   /* brand deep aubergine */
    --gold:#b68f39;     /* brand muted gold */
    --head:'Libre Baskerville',Georgia,serif;
    --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--accent);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 16px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:64px 64px;margin:0 0 26px;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--gold);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:36px;line-height:1.14;margin-bottom:10px}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;max-width:40ch}
  p.lead{font-size:21px;line-height:1.5;max-width:52ch;margin-top:10px}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:56ch}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:16px;height:9px;
    border-left:2px solid var(--gold);border-bottom:2px solid var(--gold);transform:rotate(-45deg)}
  .big{font-family:var(--head);font-weight:700;font-size:72px;line-height:1;color:var(--accent)}
  .step-no{font-family:var(--head);font-weight:700;font-size:20px;color:var(--panel);
    background:var(--accent);width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:16px}
  .section .kicker{color:var(--panel)}
  .section{background:var(--accent);border-color:var(--accent)}
  .section h2{color:var(--panel)}
  .section .sub{color:#d8cfe0}
  .rule{height:2px;width:72px;background:var(--gold);margin:22px 0}
  .foot{position:absolute;bottom:26px;left:64px;font-size:13px;color:var(--muted);letter-spacing:.02em}
  .cta{background:var(--accent);border-color:var(--accent)}
  .cta h2,.cta h1{color:var(--panel)}
  .cta p,.cta .sub{color:#e7dff0}
  .disc{font-size:13px;color:#b9aec6;margin-top:26px;max-width:62ch;line-height:1.5}
  .grid{display:flex;gap:40px;flex-wrap:wrap;margin-top:24px}
  .grid div{flex:1;min-width:200px}
  .grid .big{font-size:44px}
  .grid span{display:block;color:var(--muted);font-size:16px;margin-top:6px}
  .quote{font-family:var(--head);font-size:24px;line-height:1.35;color:var(--ink);max-width:52ch}
  .quote cite{display:block;font-family:var(--body);font-style:normal;font-size:16px;color:var(--muted);margin-top:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A Live Masterclass with Lucy Gilmour',h:'Hired in 60 Days',sub:'The recruiter’s playbook for getting hired without applying online.',foot:'Career Growth With Lucy'},
 {t:'content',kicker:'Who this is for',h:'You have done the work. The job search has not kept up.',body:'This is for experienced directors, VPs and senior leaders who have not had to job search in years, and who are done sending applications into a void.',list:['You are senior, capable, and strangely invisible online','You are applying to roles you could do in your sleep, and hearing nothing','You want the next role to be a step up, not a lucky break']},
 {t:'content',kicker:'The trap',h:'More applications, less response.',body:'It feels logical: apply to more roles, get more chances. For senior candidates it works the other way. The more you pour into the portal, the more invisible you get.',list:['The online form was built to filter people out, not to find the best one','At senior level the best roles are filled before they are ever posted','Volume is a tell: it reads as availability, not value']},
 {t:'content',kicker:'The reframe',h:'Senior roles are not won in the portal.',body:'They are won in a conversation with the person who owns the problem. Everything in this masterclass is about getting you into that conversation, faster, using the exact moves recruiters use.',q:'I spent ten years on the hiring side. The candidates who got hired were almost never the ones with the most applications in.'},
 {t:'section',kicker:'Part One',h:'Why the portal keeps you stuck',sub:'And what actually fills a senior role.'},
 {t:'content',kicker:'The black hole',h:'What happens after you hit submit.',body:'Your application joins a stack, gets screened against a keyword filter, and in most cases is never seen by the person who would actually want to hire you. Nothing you do inside that system fixes a system designed to say no.',list:['Keyword filters reward the obvious, not the strong','One generic resume competes against hundreds of near-identical ones','You are a line in a queue, not a person with a track record']},
 {t:'content',kicker:'The other side of the desk',h:'How senior roles really get filled.',body:'A hiring manager has a problem and a deadline. They want the lowest-risk person who can solve it now. That decision is made by a human, and it can be reached directly, long before the role is a job post.',list:['The decision maker is findable, and reachable','Being relevant to one problem beats being qualified in general','Reaching them early puts you ahead of the queue, not in it']},
 {t:'section',kicker:'Part Two',h:'The five-step system',sub:'The same sequence I run with Accelerator clients.'},
 {t:'step',no:'1',kicker:'Step one',h:'Clarity',body:'Pick the specific roles you are targeting before you touch a resume. One clear target makes every other step sharper. Trying to be right for everything is why senior searches stall.'},
 {t:'step',no:'2',kicker:'Step two',h:'The shop window',body:'Your resume and LinkedIn are a shop window for one target role, not a life history. Positioning, clarity and relevance, so the right person sees value in ten seconds. Understand your audience. Explain your value.'},
 {t:'step',no:'3',kicker:'Step three',h:'Hiring Manager First',body:'This is the move the rest of the market misses. Instead of applying, you identify the hiring manager and reach them directly, the way a recruiter would put a candidate in front of a decision maker. It is how you get a conversation before there is a queue.'},
 {t:'content',kicker:'Step three, in practice',h:'The message that gets a reply.',body:'It is short, it is about their problem, and it offers something specific. Not "I am looking for opportunities." Something closer to the real conversation:',q:'Saw you are hiring a VP of Operations. I have run ops for two scale-ups through the exact growth stage you are in. Worth a short call?'},
 {t:'step',no:'4',kicker:'Step four',h:'Interview like a senior hire',body:'A senior interview is not a quiz, it is a risk conversation. You prepare to show you understand their problem, you reduce their sense of risk, and you lead the conversation the way you would lead the role.'},
 {t:'step',no:'5',kicker:'Step five',h:'Negotiate from the hiring side',body:'Knowing how offers are really built changes the conversation. You negotiate on the things that move, at the moment they move, without putting the offer at risk. This is where a recruiter’s view pays for itself.'},
 {t:'section',kicker:'Part Three',h:'What 60 days looks like',sub:'From first outreach to a signed offer.'},
 {t:'content',kicker:'The arc',h:'A plan, not a wait.',body:'You are not refreshing a job board for three months. You are running a short, deliberate campaign at a handful of right-fit companies.',list:['Weeks 1 to 2: clarity and the shop window','Weeks 2 to 5: Hiring Manager First outreach and first calls','Weeks 4 to 7: final interviews','Weeks 6 to 8: offer and negotiation']},
 {t:'content',kicker:'Why listen to me',h:'I built this from the hiring side.',body:'I ran an executive-search firm for ten years, recruiting across more than fifty countries into technical, professional and executive roles. I have now helped more than a thousand mid-to-senior professionals get hired. This is the method I used as a recruiter, taught back to you.',list:['10 years running an executive-search firm','1,000+ professionals helped into roles','LinkedIn Top Voice in Job Search Strategies']},
 {t:'proof',kicker:'In their words',h:'What happens when you stop applying.',quotes:[['Found a role I wanted within 60 days.','Colm, Accelerator client'],['The first company I reached out to hired me in two months.','Kris, Accelerator client']]},
 {t:'content',kicker:'The shift',h:'Stop applying. Start reaching.',body:'The portal rewards volume and punishes senior candidates for it. The recruiter’s playbook rewards clarity, positioning and a direct conversation with the person who owns the problem. That is the whole difference.',list:['One clear target, not fifty','A shop window, not a history','Hiring Manager First, not form after form']},
 {t:'cta',kicker:'Your next step',h:'Work through it with me.',body:'If you want the full five-step system, two live group coaching calls a week, the community and my Lucy AI feedback tool, the Career Growth Accelerator is where we do it together. Apply to see if it is a fit for your search.',cta:'Apply for the Career Growth Accelerator',disc:'Educational only. This masterclass shares a method and client experiences; it is not a guarantee of a job, a timeline, or any particular outcome. Results vary with role, market and effort.'}
];
const el=document.getElementById('deck');
for(const s of S){
 const d=document.createElement('section');
 d.className='slide '+(s.t==='section'?'section':s.t==='cta'?'cta':'');
 let h='';
 if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
 if(s.t==='title'){h+='<h1>'+s.h+'</h1><div class="rule"></div><p class="sub">'+s.sub+'</p>';}
 else if(s.t==='section'){h+='<h2>'+s.h+'</h2><div class="rule"></div>'+(s.sub?'<p class="sub">'+s.sub+'</p>':'');}
 else if(s.t==='step'){h+='<div class="step-no">'+s.no+'</div><h2>'+s.h+'</h2><p class="lead">'+s.body+'</p>';}
 else if(s.t==='proof'){h+='<h2>'+s.h+'</h2><div class="rule"></div>';for(const q of s.quotes){h+='<p class="quote">“'+q[0]+'”<cite>'+q[1]+'</cite></p><br>';}}
 else if(s.t==='cta'){h+='<h2>'+s.h+'</h2><p class="lead">'+s.body+'</p><div class="rule"></div><p class="sub" style="color:var(--gold);font-weight:600">'+s.cta+'</p><p class="disc">'+s.disc+'</p>';}
 else {h+='<h2>'+s.h+'</h2>'+(s.body?'<p class="lead">'+s.body+'</p>':'');
   if(s.list){h+='<ul>';for(const i of s.list)h+='<li>'+i+'</li>';h+='</ul>';}
   if(s.q){h+='<div class="rule"></div><p class="quote">“'+s.q+'”</p>';}}
 if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
 d.innerHTML=h;
 el.appendChild(d);
}
</script>
</body>
</html>
