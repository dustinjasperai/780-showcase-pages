<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Integrative Symptom Management — Delia Chiaramonte, MD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171a16;        /* near-black #161616 warmed toward brand olive #3e4a36 */
    --panel:#21271e;     /* dark tint of brand olive #3e4a36 */
    --rule:#3e4a36;      /* brand dark olive, verbatim */
    --accent:#687a5c;    /* dominant brand hex (72 uses), verbatim */
    --accent-2:#7c926d;  /* brand H1 sage, verbatim */
    --text:#f1efe9;      /* warm off-white */
    --muted:#b8bdb0;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --serif:'Newsreader',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--serif)}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:linear-gradient(180deg,var(--panel),#1b2018);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px 52px;
    margin:0 0 30px;
    min-height:430px;
    position:relative;
    overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:var(--accent-2);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:31px;line-height:1.14;margin-bottom:16px}
  p{font-size:20px;line-height:1.55;color:var(--text);margin-bottom:14px;max-width:70ch}
  p.lead{font-size:23px;color:var(--text)}
  .sub{color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19.5px;line-height:1.5;padding:10px 0 10px 30px;position:relative;border-bottom:1px solid rgba(62,74,54,.5)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:20px}
  .quad div{background:rgba(104,122,92,.1);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
  .quad h3{font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent-2);margin-bottom:6px}
  .quad p{font-size:16.5px;color:var(--muted);margin:0}
  .big{font-family:var(--display);font-weight:700;font-size:56px;color:var(--accent-2);line-height:1;margin:8px 0 14px}
  .cta{border-color:var(--accent)}
  .cta::before{background:var(--accent-2)}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:26px;border-top:1px solid var(--rule);padding-top:16px;max-width:none}
  .pagefoot{font-family:var(--display);font-size:12px;letter-spacing:.1em;color:var(--muted);text-transform:uppercase;position:absolute;right:30px;bottom:20px}
  .present{font-family:var(--display);font-weight:600;font-size:18px;color:var(--accent-2);margin-top:28px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A masterclass for physicians',
   h:'Integrative Symptom Management',
   p:'Evidence-based, non-drug tools to relieve the suffering that medication alone cannot reach.',
   present:'Delia Chiaramonte, MD  ·  Integrative Palliative Institute'},

  {t:'who',
   kicker:'Who this is for',
   h:'You care for seriously ill patients',
   p:'Oncologists, palliative care physicians, geriatricians, rheumatologists, cancer surgeons, PM&R. The patients whose charts say the pain is controlled.',
   list:['Their pain score looks managed, and they are still suffering.',
         'You have maxed the medication and the distress has not moved.',
         'You went into medicine to relieve suffering, and the tools you were trained in have run out.']},

  {t:'hook',
   kicker:'The reframe',
   h:'More medication is not more relief',
   p:'When a seriously ill patient keeps suffering on a full regimen, the problem is usually not the dose. The suffering that is left is not pharmacologic. It lives in the parts of the person the prescription never touches.'},

  {t:'part',
   kicker:'Part one',
   h:'Suffering has four domains',
   p:'Whole-person suffering is physical, emotional, social, and existential. Conventional symptom care reaches the first one well and the other three barely at all. That gap is why patients stay in distress on a correct drug plan.',
   quad:[['Physical','Pain, nausea, breathlessness, insomnia, fatigue.'],
         ['Emotional','Anxiety, fear, grief, the dread between appointments.'],
         ['Social','Isolation, role loss, being a burden, strained family.'],
         ['Existential','Meaning, dignity, faith, who am I now.']]},

  {t:'part',
   kicker:'Part one',
   h:'The three domains drugs leave untreated',
   p:'An opioid can lower a pain number without lowering the fear that makes the pain louder. Anxiety amplifies pain; isolation amplifies anxiety; a loss of meaning amplifies all of it. Treat one domain and the others keep the suffering alive.'},

  {t:'cost',
   kicker:'The quiet cost',
   h:'This is where physicians burn out',
   p:'Standing at the bedside out of tools, watching a patient suffer you cannot reach, is one of the most corrosive experiences in medicine. The helplessness is not a character flaw. It is a training gap.'},

  {t:'part',
   kicker:'Part two',
   h:'The method: Integrative Symptom Management',
   p:'A practical, evidence-supported set of non-pharmacologic tools that treat all four domains, used alongside the medicine you already prescribe. Not instead of. Alongside. This is what I teach physicians to do Monday morning.'},

  {t:'pillar',
   kicker:'Part two  ·  the tools',
   h:'Mind-body and contemplative practice',
   p:'Guided breath, relaxation, and focused attention measurably lower pain intensity and anxiety by changing how the nervous system processes the signal. Short, teachable, and something the patient can carry home and reuse.'},

  {t:'pillar',
   kicker:'Part two  ·  the tools',
   h:'Touch, acupressure, and the body',
   p:'Simple pressure-point and touch techniques, safe to teach to a patient or a family caregiver, that ease nausea, pain, and agitation without adding to the drug burden on an already fragile system.'},

  {t:'pillar',
   kicker:'Part two  ·  the tools',
   h:'Movement, nutrition, and sleep',
   p:'Even in advanced illness, small, deliberate shifts in movement, nourishment, and sleep architecture change the symptom picture. These are levers most symptom plans never pull.'},

  {t:'pillar',
   kicker:'Part two  ·  the tools',
   h:'Communication that itself relieves suffering',
   p:'The conversation is a clinical intervention. Naming fear, restoring a sense of control, and sitting with what cannot be fixed lowers distress as reliably as a medication, and it is the one tool you always have.'},

  {t:'evidence',
   kicker:'Not alternative. Evidence-based.',
   h:'You can defend every one of these',
   p:'These are not fringe practices. Each tool here rests on peer-reviewed evidence in serious illness. Integrative means adding what the data supports to what you already do, so you have more ways to help and nothing to apologize for.'},

  {t:'part',
   kicker:'Part three',
   h:'The same patient, now seen whole',
   p:'The same patient, seen across four domains: the pain plan stays, and now the fear has a breath practice, the isolation has a family trained in touch, and the meaning has a conversation. The suffering that medication could not move finally starts to move.'},

  {t:'sage',
   kicker:'Part three',
   h:'The physician gets their work back',
   p:'When you have tools for the whole person, the bedside stops being a place of helplessness. This is the heart of The Sage Physician: reconnecting with why you chose medicine while adding what your training left out, so you deliver hard care without being hollowed out by it.'},

  {t:'why',
   kicker:'Why learn this from me',
   h:'Delia Chiaramonte, MD',
   list:['Board-certified in both palliative medicine and integrative medicine.',
         'Faculty at Johns Hopkins, the University of Maryland, and UC Irvine.',
         'Founder of the Integrative Palliative Institute and host of The Integrative Palliative Podcast.',
         'Author of Coping Courageously, and a teacher physicians say reshaped how they practice.']},

  {t:'cta',
   kicker:'Your next step',
   h:'Bring this into your practice',
   p:'If you want more ways to relieve your patients’ suffering, and more meaning in your own work, this is the training I built for you.',
   list:['Watch the full Integrative Symptom Management training and earn CME.',
         'Join The Sage Physician for ongoing mentoring with other physicians.',
         'Start where you are: pick one tool and use it with one patient this week.'],
   disclaimer:'Educational content for licensed clinicians. Nothing here is individual medical advice or a guarantee of any clinical or financial outcome. Integrative tools are used alongside, not instead of, appropriate medical care. Results vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let html = '';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.t === 'title') { html += '<h1>' + s.h + '</h1>'; }
  else { html += '<h2>' + s.h + '</h2>'; }
  if (s.p) html += '<p class="' + (s.t==='title'?'lead':'') + '">' + s.p + '</p>';
  if (s.present) html += '<div class="present">' + s.present + '</div>';
  if (s.list) { html += '<ul>' + s.list.map(x => '<li>' + x + '</li>').join('') + '</ul>'; }
  if (s.quad) { html += '<div class="quad">' + s.quad.map(q => '<div><h3>' + q[0] + '</h3><p>' + q[1] + '</p></div>').join('') + '</div>'; }
  if (s.disclaimer) html += '<div class="disclaimer">' + s.disclaimer + '</div>';
  html += '<div class="pagefoot">Integrative Palliative Institute · ' + (i+1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
