<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Switch On: Finish the Novel You've Been Carrying for Years — Nikki Vallance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf4ea; --panel:#fffdf9; --ink:#23201c; --muted:#6a6358;
    --rule:#e7dfd4; --accent:#f18530; --spark:#3ec1cd;
    --serif:'EB Garamond',Georgia,serif; --sans:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100vw;height:100vh;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .kick{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:clamp(11px,1.1vw,14px);color:var(--accent);margin-bottom:1.6rem;display:flex;align-items:center;gap:.6rem}
  .kick::before{content:"";width:26px;height:3px;background:var(--accent);display:inline-block;border-radius:2px}
  h1{font-family:var(--serif);font-weight:600;line-height:1.04;font-size:clamp(34px,6.4vw,78px);letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;line-height:1.08;font-size:clamp(28px,4.6vw,56px)}
  .promise{font-family:var(--serif);font-style:italic;color:var(--muted);font-size:clamp(18px,2.4vw,30px);margin-top:1.8rem;max-width:22ch}
  p.body{font-size:clamp(16px,1.6vw,22px);line-height:1.5;color:var(--ink);max-width:40ch;margin-top:1.4rem}
  p.body.wide{max-width:52ch}
  .muted{color:var(--muted)}
  ul{list-style:none;margin-top:1.8rem;display:flex;flex-direction:column;gap:1rem;max-width:46ch}
  ul li{font-size:clamp(16px,1.6vw,22px);line-height:1.4;padding-left:1.6rem;position:relative}
  ul li::before{content:"";position:absolute;left:0;top:.55em;width:9px;height:9px;border-radius:50%;background:var(--spark)}
  .pill{display:flex;align-items:baseline;gap:1.4rem}
  .pill .num{font-family:var(--serif);font-size:clamp(44px,8vw,110px);color:var(--accent);line-height:.9;font-weight:600}
  .pill .body{margin-top:.3rem}
  .big{font-family:var(--serif);font-size:clamp(30px,5vw,60px);line-height:1.1;max-width:20ch}
  .footer{position:absolute;left:9vw;bottom:5vh;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .disclaimer{margin-top:2rem;font-size:13px;color:var(--muted);max-width:52ch;line-height:1.5}
  .cta-line{font-family:var(--serif);font-size:clamp(22px,2.8vw,34px);margin-top:1.4rem;color:var(--accent)}
  .nav{position:absolute;right:9vw;bottom:5vh;display:flex;gap:.6rem;align-items:center;z-index:5}
  .nav button{border:1px solid var(--rule);background:var(--panel);color:var(--ink);font-family:var(--sans);
    font-size:14px;width:40px;height:40px;border-radius:50%;cursor:pointer}
  .count{font-size:12px;color:var(--muted);letter-spacing:.1em}
  .brandmark{position:absolute;top:5vh;right:9vw;font-family:var(--serif);font-style:italic;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><span class="count" id="count"></span>
  <button id="prev" aria-label="Previous">&larr;</button>
  <button id="next" aria-label="Next">&rarr;</button></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Nikki Vallance',
   h:'Switch On',
   promise:'Finish the novel you have been carrying for years.'},

  {t:'who', k:'Who this is for',
   h:'The sensibly successful',
   body:'You took the safe, sensible path and it worked. But there is a novel in you that you keep not writing. Not because you cannot. Because nothing in your week ever makes room for it.'},

  {t:'reframe', k:'The real problem',
   big:'You were never missing the talent. You were missing a system.'},

  {t:'part', k:'Part one', h:'Why sensible people stop creating'},

  {t:'content', k:'The safe path has a cost', h:'Permission, quietly withdrawn',
   body:'Years of being the reliable one teach you that creative work is the thing you do once everything important is done. So it never gets done. The draft becomes a someday, and someday keeps moving.'},

  {t:'content', k:'The three stories', h:'What keeps the draft unfinished',
   items:['"I am not really talented enough." You do not need more talent. You need a repeatable practice.',
          '"I do not have the time." You do not need more time. You need better triggers.',
          '"I will start when life is calmer." It will not get calmer. You start inside the life you have.']},

  {t:'part', k:'Part two', h:'The 6 Pillars of Creative Life'},

  {t:'pill', num:'1', h:'Belief',
   body:'Seeing yourself as someone who creates, before the proof arrives. The identity comes first, the pages follow.'},
  {t:'pill', num:'2', h:'Support',
   body:'A small circle who expects the work from you. Creativity is not a solo act, it is a supported one.'},
  {t:'pill', num:'3', h:'Purpose',
   body:'Knowing why this book, for you, now. Purpose is what carries you past the messy middle.'},
  {t:'pill', num:'4', h:'Balance',
   body:'Protecting rest and processing time, not just writing time. The subconscious does half the work while you step away.'},
  {t:'pill', num:'5', h:'Triggers',
   body:'The cues and conditions that reliably switch you on. Same chair, same time, same small ritual, and the resistance drops.'},
  {t:'pill', num:'6', h:'Boldness',
   body:'The courage to let the work be seen while it is still imperfect. Boldness is a muscle, and it is trainable.'},

  {t:'part', k:'Part three', h:'Inside a switched-on writing week'},

  {t:'content', k:'A real writing week', h:'Small, repeatable, protected',
   body:'Not a heroic retreat. Three protected sessions, a trigger you can keep, one reader who is waiting for the next pages, and a weekly check against the pillar you are weakest on. That is the whole machine.'},

  {t:'content', k:'The arc', h:'From blank page to a finished first draft',
   body:'With structure, support and accountability in place, a first draft is a timeline, not a mystery. The question stops being "will I ever finish" and becomes "which chapter this week".'},

  {t:'why', k:'Why me', h:'I did this myself',
   body:'I spent years on the sensible path before I wrote my debut novel, Pivotal, a 2020 finalist for both The People’s Book Prize and the Page Turner Awards. I now host The Creative Switch podcast and write The Bold Types, and I mentor writers through exactly this system.'},

  {t:'cta', k:'Your next step', h:'Let us finish it together',
   cta:'One-to-one mentoring: structure, support and accountability to finish your book.',
   disclaimer:'This masterclass is educational. Creative outcomes vary by person and effort. Nothing here is a guarantee of publication, income, or any specific result.'}
];

const stage = document.getElementById('stage');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(sl){
  let h = '';
  if(sl.k) h += `<div class="kick">${esc(sl.k)}</div>`;
  if(sl.t==='title'){ h += `<h1>${esc(sl.h)}</h1>`; if(sl.promise) h+=`<div class="promise">${esc(sl.promise)}</div>`; h+=`<div class="footer">The Creative Switch</div>`; }
  else if(sl.t==='reframe'){ h += `<div class="big">${esc(sl.big)}</div>`; }
  else if(sl.t==='part'){ h += `<h1>${esc(sl.h)}</h1>`; }
  else if(sl.t==='pill'){ h += `<div class="pill"><div class="num">${esc(sl.num)}</div><div><h2>${esc(sl.h)}</h2><p class="body">${esc(sl.body)}</p></div></div>`; }
  else if(sl.t==='cta'){ h += `<h1>${esc(sl.h)}</h1>`; if(sl.cta) h+=`<div class="cta-line">${esc(sl.cta)}</div>`; if(sl.disclaimer) h+=`<div class="disclaimer">${esc(sl.disclaimer)}</div>`; }
  else { if(sl.h) h += `<h2>${esc(sl.h)}</h2>`;
    if(sl.body) h += `<p class="body wide">${esc(sl.body)}</p>`;
    if(sl.items){ h += '<ul>'+sl.items.map(i=>`<li>${esc(i)}</li>`).join('')+'</ul>'; } }
  h += `<div class="brandmark">Nikki Vallance</div>`;
  return h;
}
let i = 0; const slides = [];
S.forEach((sl,idx)=>{ const d=document.createElement('section'); d.className='slide'; d.innerHTML=render(sl); stage.appendChild(d); slides.push(d); });
function show(n){ i=Math.max(0,Math.min(S.length-1,n)); slides.forEach((d,idx)=>d.classList.toggle('on',idx===i));
  document.getElementById('count').textContent = (i+1)+' / '+S.length; }
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(i+1); if(e.key==='ArrowLeft')show(i-1); });
show(0);
</script>
</body>
</html>
