<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Selling Tires Through Trust, Not Tactics · Darren McLea</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;1,400&family=Assistant:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0A2438; --panel:#122E48; --rule:#274A66;
    --acc:#3E8EFF; --idx:#8FB6DE; --chalk:#F4F7FB; --grey:#C3D2E2; --dim:#6E8AA6;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Assistant',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.1vw;max-width:88%}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-size:1.44vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.7vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Assistant',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#173A57 0%,#061626 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:86%;font-style:italic;color:#EFF4FA}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#173A57 0%,#061626 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#CFE2FA;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .tread-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-tread{right:6%;bottom:6%;width:20vw}
  .corner-tread{right:5%;bottom:6.5%;width:9vw;opacity:.4}
  .brandline{font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">DJM Solutions</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- tread motif: concentric partial rings, tire-tread-inspired -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="tread" viewBox="0 0 260 260">
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <circle cx="130" cy="130" r="108" stroke="#3E8EFF" opacity="0.85" stroke-dasharray="14 10"/>
    <circle cx="130" cy="130" r="78" stroke="#8FB6DE" opacity="0.4" stroke-dasharray="10 8"/>
    <circle cx="130" cy="130" r="48" stroke="#F4F7FB" opacity="0.15" stroke-dasharray="6 6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Selling Tires Through Trust, Not Tactics',sub:'A conversation-first sales and communication masterclass for tire and auto shop owners and their teams.',brand:true,tread:'title'},
 {t:'normal',k:'Who this is for',title:'You already know how to sell a tire. The trap is how your team does it.',body:'Many shops run on scripts built for one thing: closing the ticket in front of you. Those scripts work once. They rarely bring the customer back for the next set, the next rotation, the next referral.'},
 {t:'dark',title:'A customer who feels sold to buys once. A customer who feels heard buys for life.'},

 {t:'section',idx:'Part One',title:'Why Scripts Stop Working'},
 {t:'normal',k:'The close that costs the next visit',title:'Pressure gets the sale and loses the relationship.',body:'A hard close can move today\'s ticket. It also tells the customer exactly what kind of shop they walked into, and that verdict travels with them to the next oil change, the next set of tires, the next friend who asks where to go.'},
 {t:'normal',k:'The payment conversation is a trust test',title:'How you talk about the bill matters as much as the bill.',body:'Payment plans get handled two ways: as a script to get through, or as a real conversation about what the customer can do right now. Customers remember which one they got, long after they forget the price.'},
 {t:'dark',title:'Every tire sale is also an audition for the next one.'},

 {t:'section',idx:'Part Two',title:'The Conversation-First Pillars'},
 {t:'normal',k:'Sales & Communication',title:'Confidence comes from connection, not pressure.',body:'The foundation: teams learn to build genuine rapport, read what the customer actually needs, and let that understanding do the selling instead of a memorized pitch.'},
 {t:'normal',k:'Payment Plan Training',title:'Present the options like you\'re on their side.',body:'A specific way to walk a customer through payment options and answer the concerns underneath them, so the conversation builds the relationship instead of straining it.'},
 {t:'normal',k:'Call Listening & Feedback',title:'The loop that actually changes behavior.',body:'Real calls get listened to and reviewed, with specific feedback the rep can use going forward. Not a one-off session that fades by Friday.'},
 {t:'normal',k:'Specialized Tire Sales Strategies',title:'Become the shop people choose, not just the shop that\'s open.',body:'Positioning and conversation approaches built specifically around tires, not generic retail sales advice repurposed for a different industry.'},
 {t:'dark',title:'Teach the conversation, and the close gets easier.'},

 {t:'section',idx:'Part Three',title:'The Shop This Builds'},
 {t:'normal',k:'The team this builds',title:'Reps who sound like they belong there.',body:'A team that can talk through a payment plan without flinching, and leave a customer feeling like they were helped, not handled.'},
 {t:'normal',k:'Why Darren McLea',title:'Three generations in the bay, not a theory from outside it.',body:'Darren grew up in his family\'s tire business, McLea\'s Tire and Automotive, and helped grow it from one location to seven before the company was acquired by AAA. He has served on the Independent Tire Dealer Group board and founded ITDG Next-Gen, and DJM Solutions has sponsored the California Tire Dealers Association.'},

 {t:'section',idx:'Your Next Step',title:'Bring The Conversation To Your Shop'},
 {t:'normal',k:'How it\'s delivered',title:'Online classes, in-person training, or one-on-one coaching.',body:'DJM Solutions runs online and onsite: live group training, individual coaching built around specific challenges, call listening and feedback, and customized solutions for what your shop actually needs.'},
 {t:'cta',title:'Ready to build a team that sells through trust?',chips:['Free Consultation','DJM Solutions Training'],disc:'Educational content for tire and auto shop owners and their teams. No income or sales result is guaranteed. Results vary by shop, market, and team.'},
];

const deck=document.getElementById('deck');
function tread(kind){return `<svg class="tread-motif ${kind==='title'?'title-tread':'corner-tread'}"><use href="#tread"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">DJM <b>Solutions</b> &middot; Darren McLea</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.tread) h+=tread(s.tread);
  else if(s.t==='title') h+=tread('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
