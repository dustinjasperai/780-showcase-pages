<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spitfire Elite — Precision Interview Coaching Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4ef;        /* warm paper (light-scheme brand) */
    --panel:#e7e9f0;     /* pale slate tint, from #313c53 */
    --ink:#0b0d27;       /* deep navy, brand dominant text */
    --rule:#313c53;      /* slate-blue brand hex */
    --accent:#e8680a;    /* ignition orange, brand hex */
    --muted:#55607a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--rule);font-family:'Urbanist',system-ui,sans-serif;color:var(--ink)}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border-radius:14px;margin:0 0 22px;padding:54px 60px;
    min-height:540px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(11,13,39,.06);position:relative;overflow:hidden;
  }
  .tag{font-size:13px;font-weight:800;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .num{position:absolute;top:26px;right:34px;font-size:12px;font-weight:600;letter-spacing:.15em;color:var(--muted)}
  h1{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-.02em;max-width:18ch}
  h2{font-size:36px;font-weight:800;line-height:1.1;letter-spacing:-.01em;max-width:20ch}
  .lede{font-size:21px;font-weight:400;color:var(--muted);margin-top:20px;max-width:46ch;line-height:1.5}
  p.body{font-size:19px;line-height:1.55;color:var(--ink);max-width:52ch;margin-top:16px;font-weight:400}
  .accentbar{height:6px;width:72px;background:var(--accent);border-radius:3px;margin-top:28px}
  ul.checklist{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:14px;max-width:54ch}
  ul.checklist li{position:relative;padding:14px 18px 14px 50px;background:var(--panel);border-radius:10px;font-size:18px;line-height:1.4;font-weight:600}
  ul.checklist li:before{content:"";position:absolute;left:18px;top:50%;transform:translateY(-50%);width:16px;height:16px;border:3px solid var(--accent);border-radius:4px}
  ul.checklist li span{display:block;font-weight:400;font-size:15px;color:var(--muted);margin-top:4px}
  .stat{font-size:64px;font-weight:800;color:var(--accent);line-height:1}
  .statrow{display:flex;gap:48px;margin-top:30px;flex-wrap:wrap}
  .statrow .lab{font-size:15px;color:var(--muted);max-width:16ch;margin-top:8px;font-weight:600}
  .cta-steps{display:flex;flex-direction:column;gap:12px;margin-top:24px;max-width:48ch}
  .cta-steps div{font-size:19px;font-weight:600;padding-left:40px;position:relative}
  .cta-steps div b{color:var(--accent);position:absolute;left:0;font-weight:800}
  .disc{font-size:13px;color:var(--muted);margin-top:34px;max-width:60ch;line-height:1.5;font-weight:400}
  .brandline{font-size:15px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--rule);margin-top:40px}
  @media (max-width:720px){.slide{padding:38px 28px;min-height:auto}h1{font-size:38px}h2{font-size:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', c:`<div class="tag">Precision Interview Coaching</div>
   <h1>The Rubric Behind the Airline Interview</h1>
   <p class="lede">How major-airline interviewers are actually trained to score you, and how to fly the room like a checkride.</p>
   <div class="accentbar"></div>
   <div class="brandline">Spitfire Elite</div>`},

 {t:'who', c:`<div class="tag">Who this is for</div>
   <h2>You can fly. That was never the question.</h2>
   <p class="body">You have the hours, the ratings, and the logbook. You are a military aviator transitioning, a regional pilot going for a major, or a time-builder with one shot at a class date you cannot afford to miss.</p>
   <p class="body">The interview is the one part of your career nobody trained you to fly. And it is the one part that decides everything.</p>`},

 {t:'reframe', c:`<div class="tag">The trap</div>
   <h2>Most pilots prep for a conversation. The airline runs a scored evaluation.</h2>
   <p class="body">You walk in ready to "be yourself and tell your story." Across the table, a trained panel is filling in a rubric: specific competencies, scored on specific anchors, line by line.</p>
   <p class="body">Being likeable is not a score. When you do not know what is on the sheet, you leave points on the table in a room where two or three points is the difference between a conditional offer and a thank-you email.</p>`},

 {t:'p1head', c:`<div class="tag">Part One</div>
   <h1>The interview is a checkride you were never briefed on.</h1>
   <div class="accentbar"></div>`},

 {t:'p1cost', c:`<div class="tag">What it costs</div>
   <h2>A missed interview is not a do-over next week.</h2>
   <p class="body">Carriers interview in waves. Miss the score and you wait months for the next window, watch a seniority number you will carry for thirty years slide down the list, and sometimes forfeit a training contract you already signed.</p>
   <p class="body">Pilots do not fail these for lack of flying. They fail for walking in unbriefed on how the room is graded.</p>`},

 {t:'p2head', c:`<div class="tag">Part Two</div>
   <h1>So we brief you on the sheet, then drill it.</h1>
   <p class="lede">Precision Interview Coaching teaches the interview from the interviewer's side of the table, then reps it until it is automatic.</p>
   <div class="accentbar"></div>`},

 {t:'pic', c:`<div class="tag">The method</div>
   <h2>Start with how the panel is trained to score.</h2>
   <p class="body">We break down the competencies airline panels grade, the anchors that move a score up or down, and why two pilots with identical logbooks walk out with different results.</p>
   <p class="body">Once you can see the sheet, every answer has a target. Coaching is live over Zoom with current airline pilots, line check airmen, CRM facilitators, and HR professionals who have sat on the hiring side.</p>`},

 {t:'tmaat', c:`<div class="tag">Structure under pressure</div>
   <h2>Build TMAAT stories that score, not stories that ramble.</h2>
   <p class="body">"Tell Me About A Time" questions are where most pilots sink. We build your real experiences into tight, structured stories that hit the competency the panel is listening for, and we drill answering them with structure under pressure instead of talking in circles.</p>`},

 {t:'fdle', c:`<div class="tag">Flight Deck Leadership Exercise</div>
   <h2>Chair-fly the scenario with the interview team.</h2>
   <p class="body">Situational and line-oriented interviews put you on a crew in a problem with no clean answer. Through 25+ SBI and LOI scenarios run over video, you practice the leadership and CRM the evaluators are scoring, the same style FedEx, Southwest and others run, until decision-making under ambiguity looks calm.</p>`},

 {t:'sim', c:`<div class="tag">Spitfire Interview Sim</div>
   <h2>Train on the questions carriers are asking right now.</h2>
   <p class="body">Interviews drift. What a carrier asked last year is not always what they ask this month. The Spitfire Interview Sim drills you on current trip reports pulled from pilots who just sat the real thing, so your prep matches the room you are actually walking into.</p>`},

 {t:'blaze', c:`<div class="tag">Blaze AI Coach</div>
   <h2>Get your reps in between live sessions.</h2>
   <p class="body">Blaze asks airline-specific questions, listens to your spoken answers, and gives feedback on delivery: pacing, filler words, and the pauses that read as uncertainty. Unlimited reps on your schedule, browser and a microphone only. The pilots who do best use Blaze for volume and live coaching for the nuance.</p>`},

 {t:'p3head', c:`<div class="tag">Part Three</div>
   <h1>The week before you fly the real interview.</h1>
   <div class="accentbar"></div>`},

 {t:'capstone', c:`<div class="tag">The capstone</div>
   <h2>Pre-Mock, then a recorded 1-on-1 Mock.</h2>
   <p class="body">First a Pre-Mock in the one-way video format airlines actually use, so the camera stops being strange. Then a 90-minute 1-on-1 Mock Capstone over Zoom with a Spitfire coach, recorded so you can review every answer. You walk into the real interview having already flown it clean once.</p>`},

 {t:'whyus', c:`<div class="tag">Who is coaching you</div>
   <h2>People who have sat on the hiring side.</h2>
   <p class="body">Spitfire coaches are current airline pilots at major carriers, line check airmen, CRM facilitators, and HR professionals. Live over Zoom, not a phone call and not a script. You are briefed by the people who know what the panel is trained to look for because they have been the panel.</p>`},

 {t:'proof', c:`<div class="tag">The record</div>
   <h2>This is what preparing on the rubric does.</h2>
   <div class="statrow">
     <div><div class="stat">3,063</div><div class="lab">conditional job offers since January 2022</div></div>
     <div><div class="stat">570+</div><div class="lab">pilots placed in the last year</div></div>
     <div><div class="stat">60%</div><div class="lab">hiring success rate across all carriers</div></div>
   </div>
   <p class="body">Numbers reported by Spitfire Elite. Your result depends on your record, your prep, and the hiring climate.</p>`},

 {t:'map', c:`<div class="tag">The path</div>
   <h2>From unbriefed to interview-ready.</h2>
   <ul class="checklist">
     <li>See the sheet<span>How airline panels are trained to score</span></li>
     <li>Build your stories<span>TMAAT answers structured to the competency</span></li>
     <li>Chair-fly the scenarios<span>FDLE leadership and CRM reps over video</span></li>
     <li>Drill the current questions<span>Spitfire Interview Sim plus Blaze AI reps</span></li>
     <li>Fly the mock<span>Recorded 1-on-1 capstone before the real thing</span></li>
   </ul>`},

 {t:'cta', c:`<div class="tag">Your next step</div>
   <h2>Brief the interview before it briefs you.</h2>
   <p class="body">If you have an interview on the calendar or you are lining one up, do not walk in guessing what the panel wants. Start with Spitfire Elite and prep the one part of your career nobody trained you to fly.</p>
   <div class="cta-steps">
     <div><b>&rarr;</b> Visit spitfireelite.com</div>
     <div><b>&rarr;</b> Pick the program that fits your timeline</div>
     <div><b>&rarr;</b> Get briefed, drilled, and mock-flown before interview day</div>
   </div>
   <p class="disc">Educational content only. No specific hiring result is guaranteed. Results vary with each pilot's experience, preparation, and carrier hiring conditions. A job offer or placement is never promised. Figures shown are reported by Spitfire Elite and are not a promise of results.</p>
   <div class="brandline">Spitfire Elite</div>`}
];

const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  el.innerHTML=`<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`+(s.c||'');
  d.appendChild(el);
});
</script>
</body>
</html>
