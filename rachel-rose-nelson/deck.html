<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Business Worth More Than You — Rachel Rose Nelson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f1ec;        /* warm stone ground, from her light site scheme */
    --ink:#161e2a;       /* her headline navy */
    --muted:#595959;     /* her body grey */
    --panel:#161e2a;     /* dominant navy panels */
    --rule:#161e2a;
    --accent:#2980b9;    /* her own brand blue */
    --paper:#ffffff;
    --display:'EB Garamond', Georgia, serif;
    --body:'Lato', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0e141d;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    position:relative;background:var(--bg);border-radius:10px;
    aspect-ratio:16/9;width:100%;margin:22px 0;overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,.35);
    display:flex;flex-direction:column;justify-content:center;
    padding:7% 8%;
  }
  .slide .kicker{font-family:var(--body);font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;font-size:.72rem;color:var(--accent);margin-bottom:1.1rem}
  .slide h1{font-family:var(--display);font-weight:600;line-height:1.04;
    font-size:3.5rem;color:var(--ink);letter-spacing:-.01em}
  .slide h2{font-family:var(--display);font-weight:600;line-height:1.08;
    font-size:2.5rem;color:var(--ink)}
  .slide p{font-family:var(--body);font-weight:400;font-size:1.3rem;line-height:1.55;
    color:var(--muted);max-width:40ch;margin-top:1.1rem}
  .slide p.lead{font-size:1.5rem;color:var(--ink);max-width:34ch}
  .sub{font-family:var(--display);font-style:italic;font-size:1.5rem;color:var(--accent);margin-top:1.2rem}
  .ascent{position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;opacity:.9}
  .num{font-family:var(--display);font-size:1.1rem;color:var(--accent);font-weight:600}
  ul.pts{list-style:none;margin-top:1.3rem}
  ul.pts li{font-size:1.25rem;line-height:1.5;color:var(--ink);padding:.42rem 0 .42rem 1.6rem;position:relative;max-width:46ch}
  ul.pts li::before{content:"";position:absolute;left:0;top:.95rem;width:.7rem;height:.7rem;
    background:var(--accent);transform:rotate(45deg)}
  /* dark panel slides */
  .slide.dark{background:var(--panel)}
  .slide.dark h1,.slide.dark h2{color:#fff}
  .slide.dark p{color:#c7d0dc}
  .slide.dark p.lead{color:#fff}
  .slide.dark .kicker{color:#8fc0e4}
  .slide.dark .sub{color:#8fc0e4}
  /* principle grid */
  .pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:1.4rem}
  .pcard{background:var(--paper);border-top:3px solid var(--accent);border-radius:6px;padding:16px 18px}
  .pcard .pn{font-family:var(--display);font-size:1.35rem;color:var(--ink);font-weight:600}
  .pcard .pd{font-size:.98rem;color:var(--muted);margin-top:.3rem;line-height:1.4}
  .drivers{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 30px;margin-top:1.2rem;max-width:40ch}
  .drivers div{font-size:1.1rem;color:var(--ink);padding-left:1.3rem;position:relative}
  .drivers div::before{content:"\2191";position:absolute;left:0;color:var(--accent);font-weight:700}
  .path{display:flex;align-items:center;gap:10px;margin-top:1.6rem;flex-wrap:wrap}
  .path .step{background:var(--paper);border:1px solid #d8d3ca;border-radius:999px;padding:9px 16px;font-size:1rem;color:var(--ink)}
  .path .arrow{color:var(--accent);font-size:1.2rem}
  .why{margin-top:1.3rem}
  .why li{font-size:1.2rem;color:var(--ink);line-height:1.5;list-style:none;padding:.3rem 0 .3rem 1.6rem;position:relative;max-width:46ch}
  .why li::before{content:"\2714";position:absolute;left:0;color:var(--accent)}
  .disclaimer{font-size:.82rem;color:var(--muted);margin-top:1.6rem;max-width:60ch;line-height:1.4}
  .ctabtn{display:inline-block;margin-top:1.4rem;background:var(--accent);color:#fff;
    font-family:var(--body);font-weight:700;letter-spacing:.03em;padding:14px 26px;border-radius:6px;font-size:1.05rem}
  .slidecount{position:absolute;right:26px;bottom:20px;font-size:.78rem;color:#9aa3af;font-family:var(--body)}
  .slide.dark .slidecount{color:#5c6b7d}
  @media(max-width:720px){
    .slide h1{font-size:2.2rem}.slide h2{font-size:1.6rem}.slide p{font-size:1.05rem}
    .pgrid{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
/* Masterclass deck — Rachel Rose Nelson. Her content, her CTA. No external pitch. */
const S=[
  {t:'title',
   kicker:'A live masterclass with Rachel Rose Nelson',
   h1:'Build a Business Worth More Than You',
   sub:'The faith-driven path to a self-managing company you can scale, step back from, or sell.'},

  {t:'who',
   kicker:'Who this is for',
   h2:'For the faith-driven CEO who built something real and became its bottleneck',
   pts:['You own a profitable company with a good team and real purpose.',
        'And almost every important decision still runs through you.',
        'You want scale, freedom, and a business that honors your mission, not one that owns you.']},

  {t:'trap',dark:true,
   kicker:'The trap',
   h2:'You cannot take two weeks off without the wheels starting to wobble',
   lead:'If the company needs you in the room to run well, it is worth less, and you are not as free as you have earned the right to be.'},

  {t:'reframe',dark:true,
   kicker:'The reframe',
   h1:'You did not build a business. You built a very demanding job.',
   sub:'Enterprise value is what your company is worth without you in it.'},

  {t:'part',kicker:'Part One',h2:'The real problem is owner-dependence'},

  {t:'points',
   kicker:'Why it costs you',
   h2:'Revenue is not the same as value',
   pts:['A profitable company that depends on the founder is hard to transfer and hard to sell.',
        'Buyers, successors, and even your own team discount a business that lives in one head.',
        'Freedom, impact, and a clean exit all require the same thing: a company that runs without you.']},

  {t:'points',
   kicker:'The hidden scoreboard',
   h2:'Two owners, same revenue, very different outcomes',
   pts:['Owner A is the operating system. Growth stops the day she steps back.',
        'Owner B built the operating system into the company. The business compounds without her.',
        'This masterclass is about becoming Owner B, on purpose, with your values intact.']},

  {t:'part',kicker:'Part Two',h2:'The Pinnacle operating system: Five Principles plus Prayer'},

  {t:'principles',
   kicker:'The Five Pinnacle Principles',
   h2:'Five levers that move a business from owner-run to self-managing',
   cards:[
     ['People','The right leaders in the right seats, accountable and able to decide without you.'],
     ['Purpose','A clear mission and vision your whole team can run toward on their own.'],
     ['Playbooks','The way you work, written down, so results do not depend on you being in the room.'],
     ['Performance','Simple scorecards and rhythms that keep the team on track quarter after quarter.'],
     ['Profit','Healthy margins and cash that fund growth instead of depending on heroics.']]},

  {t:'prayer',dark:true,
   kicker:'The sixth principle',
   h2:'Prayer',
   lead:'For a faith-driven leader, Prayer is not separate from strategy. It guides the priorities, steadies the hard decisions, and keeps the mission at the center while the business grows.'},

  {t:'part',kicker:'Part Two, continued',h2:'The Value Builder drivers: what actually raises the number'},

  {t:'drivers',
   kicker:'Transferable value',
   h2:'Your Value Builder Score measures what a buyer or successor really pays for',
   items:['Recurring, predictable revenue','Low dependence on the owner','A growth story that is credible',
          'Customers who would be hard to lose','Clean financials and healthy cash','A team that can run the play'],
   note:'We score where you stand today, then build the drivers that are lowest, one principle at a time.'},

  {t:'points',
   kicker:'The shift',
   h2:'From operator to owner',
   pts:['Decisions move from your desk to clear playbooks and accountable leaders.',
        'Your calendar opens up because the system, not you, carries the week.',
        'The valuation climbs because the company finally works without you.']},

  {t:'part',kicker:'Part Three',h2:'What the path looks like'},

  {t:'path',
   kicker:'The engagement, step by step',
   h2:'A guided climb, not a binder on a shelf',
   steps:['Pinnacle Priority','Basecamp (3 days)','Quarterly Sessions','Annual Summit'],
   note:'We find the one priority that matters most, install the system together, then keep the team climbing with quarterly rhythm and annual strategy. 80+ Pinnacle tools support the work.'},

  {t:'why',dark:true,
   kicker:'Why me',
   h2:'I have built this, sold this, and guided it',
   items:['Built and sold a company of my own.',
          'Guided 40+ leaders, from solo founders to 400-employee firms preparing for liquidity events.',
          'Certified Pinnacle Business Guide and Value Builder advisor.',
          'Faith-driven strategy, so your values lead the plan instead of getting left at the door.']},

  {t:'cta',dark:true,
   kicker:'Your next step',
   h1:'See where your business stands today',
   sub:'Start with the Pinnacle Assessment, then book a Discovery Call to map your climb.',
   btn:'Take the Pinnacle Assessment',
   disclaimer:'This masterclass is educational. It describes the Pinnacle operating system and the Value Builder approach to enterprise value. It is not a guarantee of any financial result, valuation, or sale. Outcomes vary and depend on your business, market, and execution.'}
];

const stage=document.getElementById('stage');
const ascentSVG=`<svg class="ascent" viewBox="0 0 1120 210" preserveAspectRatio="none" xmlns="http://www.w3.org/2000/svg"><polyline points="0,200 220,170 440,150 660,105 880,70 1120,20" fill="none" stroke="#2980b9" stroke-width="2" opacity="0.45"/><circle cx="1120" cy="20" r="5" fill="#2980b9"/></svg>`;
function esc(s){return s}
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.dark?' dark':'');
  let html='';
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.h1) html+=`<h1>${s.h1}</h1>`;
  if(s.h2) html+=`<h2>${s.h2}</h2>`;
  if(s.sub) html+=`<div class="sub">${s.sub}</div>`;
  if(s.lead) html+=`<p class="lead">${s.lead}</p>`;
  if(s.pts){html+='<ul class="pts">';s.pts.forEach(p=>html+=`<li>${p}</li>`);html+='</ul>';}
  if(s.cards){html+='<div class="pgrid">';s.cards.forEach(c=>html+=`<div class="pcard"><div class="pn">${c[0]}</div><div class="pd">${c[1]}</div></div>`);html+='</div>';}
  if(s.items && s.t==='drivers'){html+='<div class="drivers">';s.items.forEach(it=>html+=`<div>${it}</div>`);html+='</div>';}
  if(s.items && s.t==='why'){html+='<ul class="why">';s.items.forEach(it=>html+=`<li>${it}</li>`);html+='</ul>';}
  if(s.steps){html+='<div class="path">';s.steps.forEach((st,k)=>{html+=`<span class="step">${st}</span>`;if(k<s.steps.length-1)html+='<span class="arrow">&#8599;</span>';});html+='</div>';}
  if(s.note) html+=`<p>${s.note}</p>`;
  if(s.btn) html+=`<span class="ctabtn">${s.btn}</span>`;
  if(s.disclaimer) html+=`<div class="disclaimer">${s.disclaimer}</div>`;
  if(s.t==='title'||s.t==='part') html+=ascentSVG;
  html+=`<div class="slidecount">${i+1} / ${S.length}</div>`;
  d.innerHTML=html;
  stage.appendChild(d);
});
</script>
</body>
</html>
