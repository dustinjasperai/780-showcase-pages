<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Design Your Life — The House-Building Method | Jeanne Collins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Catamaran:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f2f5f8; --panel:#ffffff; --rule:#dde4ec;
    --ink:#242424; --ink-soft:#4a4a4a; --ink-muted:#7f8795;
    --accent:#6e8fac;
  }
  html,body{height:100%}
  body{
    font-family:'Catamaran',-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:100%;max-width:960px;padding:60px 72px}
  .slide.active{display:block}
  .kicker{font-family:'Catamaran',sans-serif;font-size:13px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:62px;line-height:1.06;letter-spacing:-.01em;color:var(--ink);margin-bottom:22px}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:500;font-size:44px;line-height:1.12;color:var(--ink);margin-bottom:20px}
  .lede{font-size:21px;font-weight:300;line-height:1.6;color:var(--ink-soft);max-width:34em}
  p.body{font-size:19px;font-weight:300;line-height:1.65;color:var(--ink-soft);max-width:36em;margin-bottom:14px}
  ul{list-style:none;margin-top:10px}
  ul li{font-size:19px;font-weight:300;line-height:1.5;color:var(--ink-soft);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:36em}
  ul li:before{content:"";position:absolute;left:0;top:21px;width:9px;height:9px;background:var(--accent)}
  ul li b{font-weight:600;color:var(--ink)}
  .stage-row{display:flex;gap:18px;margin-top:26px;flex-wrap:wrap}
  .stage-card{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--accent);padding:22px}
  .stage-card .n{font-family:'Cormorant Garamond',serif;font-size:30px;color:var(--accent);margin-bottom:6px}
  .stage-card .t{font-weight:600;font-size:17px;margin-bottom:6px}
  .stage-card .d{font-size:15px;font-weight:300;color:var(--ink-muted);line-height:1.45}
  .big{font-family:'Cormorant Garamond',serif;font-weight:500;font-size:52px;line-height:1.12;color:var(--ink);max-width:20em}
  .big .accent{color:var(--accent);font-style:italic}
  .credit{font-size:18px;font-weight:300;color:var(--ink-soft);line-height:1.6;max-width:34em;margin-bottom:12px}
  .credit b{font-weight:600;color:var(--ink)}
  .cta-box{margin-top:24px;background:var(--panel);border:1px solid var(--rule);padding:26px 30px;max-width:30em}
  .cta-box .step{font-size:20px;font-weight:600;color:var(--ink);margin-bottom:6px}
  .cta-box .sub{font-size:16px;font-weight:300;color:var(--ink-muted)}
  .disclaimer{margin-top:26px;font-size:12px;font-weight:300;color:var(--ink-muted);max-width:40em;line-height:1.5}
  .footer-mark{position:fixed;left:40px;bottom:28px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-muted)}
  .nav{position:fixed;right:40px;bottom:24px;display:flex;align-items:center;gap:16px;font-family:'Catamaran',sans-serif;font-size:13px;color:var(--ink-muted)}
  .nav button{font-family:inherit;font-size:13px;background:none;border:1px solid var(--rule);color:var(--ink-soft);padding:7px 14px;cursor:pointer;letter-spacing:.04em}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:40px}h2{font-size:32px}.big{font-size:34px}.lede,p.body,ul li{font-size:17px}.footer-mark{display:none}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="footer-mark">House of JerMar</div>
<div class="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S=[
  {t:'title',kicker:'A Live Masterclass with Jeanne Collins',h1:'Design Your Life',lede:'The House-Building Method for women who are standing at a crossroads and ready to live all in.'},

  {t:'content',kicker:'The promise',h2:'By the end of this hour.',bullets:['You will see why fixing one part of your life at a time never holds','You will have the four-stage method I use to rebuild a life from the foundation up','You will know the very first room to start on, and why it is almost never the one you expected']},

  {t:'content',kicker:'Who this is for',h2:'You built an impressive life. It just stopped feeling like yours.',bullets:['You are the woman everyone counts on, and quietly wondering <b>"is this it?"</b>','You have the title, the family, the resume, and almost no idea what you actually want next','You keep waiting for the right moment to put yourself first, and the moment never arrives']},

  {t:'quote',big:'The problem was never that you lack drive. It is that no one ever taught you to <span class="accent">design</span> the life you work so hard to hold up.'},

  {t:'content',kicker:'Part One, the core problem',h2:'Most women try to fix a life one room at a time.',body:['A new job here. A health kick there. A weekend away to feel like yourself again.','But a life is a structure, not a to-do list. When the foundation is cracked, redecorating a single room never holds. You feel the wobble everywhere, and then you blame yourself for it.','There is a reason an interior designer never starts with the throw pillows.']},

  {t:'content',kicker:'Part One, the reframe',h2:'From "work-life balance" to life-work balance.',body:['Balance is not splitting yourself evenly between work and everything else. That is how you end up last on your own list.','You design the life first. Then you build work to fit inside it, not the other way around.','Your home, your body, your relationships, your mind: each is a room you get to design on purpose.']},

  {t:'framework',kicker:'Part Two, the House-Building Method',h2:'A life is built the way a home is built.',stages:[{n:'01',t:'Foundation',d:'Who you are and what you value, underneath the noise.'},{n:'02',t:'Framing',d:'The mindset and boundaries that hold the structure up.'},{n:'03',t:'Finish',d:'The daily habits and spaces that make it livable.'},{n:'04',t:'Design',d:'The intentional choices that make the life unmistakably yours.'}]},

  {t:'content',kicker:'Stage one, foundation',h2:'Pour the foundation before you build anything else.',body:['We quiet the noise and name what you actually value, not what you were handed or told to want.','This is the "put your own oxygen mask on first" work. Every decision after this gets easier, because you finally have something true to measure it against.']},

  {t:'content',kicker:'Stage two, framing',h2:'Frame the structure with mindset and boundaries.',body:['The frame is what keeps a house standing in a storm. For your life, that frame is your mindset and your boundaries.','We trade fear-based decisions for grounded ones, and we set boundaries from a place of self-worth instead of guilt. This is where "I cannot" quietly becomes "I choose to."']},

  {t:'content',kicker:'Stage three, finish',h2:'Finish the rooms you actually live in.',body:['The finish work is where a house becomes a home, and where a life starts to feel like yours again. We design the rooms you live in every day:'],bullets:['<b>Health</b> and personal wellness, so your body can carry the life you want','<b>Environment</b>, because the spaces around you either drain your energy or fuel it','<b>Spirituality</b> and meaning, the quiet center most high-achievers skip']},

  {t:'content',kicker:'Stage four, design',h2:'Make yourself the Designer of Your Own Life.',body:['Design is the part everyone can see and no one else can copy: the intentional choices that make a life unmistakably yours.','You stop living a life that looks right from the outside and start building one that feels right from the inside. Living your best life starts within, so we tap into how you feel in it.']},

  {t:'quote',big:'Your clarity is not lost. It is just <span class="accent">waiting to be uncovered.</span>'},

  {t:'content',kicker:'The fear underneath it',h2:'Most of your decisions are quietly made by fear.',body:['Fear of letting someone down. Fear of missing out. Fear of not being enough.','Women I coach describe the same turning point: realizing how much of their decision-making was rooted in fear rather than desire.','Framing your mindset is how you take that pen back, and start choosing from what you want instead of what you are afraid of.']},

  {t:'content',kicker:'Part Three, the result',h2:'On the other side of the build.',bullets:['You stop making decisions from fear of letting people down or missing out','You wake up energized about your work instead of dreading it','You can answer "what are your passions?" without a knot in your stomach','You move forward on real change with excitement instead of overwhelm']},

  {t:'credit',kicker:'Why me',h2:'I did not read about this. I lived it.',credit:['When I lost the job that defined me, I realized I had also lost myself. I could not even answer what my passions were, because I had spent years ignoring my own needs.','That unraveling is what led me to build the method I teach now, first for myself, then for the women I coach.','<b>Jeanne Collins</b>, founder of House of JerMar, TEDx speaker, author of <i>Two Feet In</i>, and host of <i>Building the Best You</i>. Executive MBA (UConn), design training (Parsons and NYIAD), ICF member completing PCC certification.']},

  {t:'quote',big:'Do not look back someday and wish you had <span class="accent">chosen yourself.</span>'},

  {t:'content',kicker:'The method in one line',h2:'Stop redecorating. Start building.',body:['Foundation, framing, finish, design. One structure, built on purpose, in the order that actually holds.','That is the whole method, and it is the same path I walk every woman through inside Design Your Life.']},

  {t:'cta',kicker:'Your next step',h2:'Ready to design the life you actually want?',step:'Book a Design Your Life discovery call',sub:'We will look at where your foundation is cracked and map the first room to build. Bring the question you are afraid to ask out loud.',disclaimer:'This masterclass is educational. Coaching supports personal growth and is not therapy or medical, financial, or mental-health advice. No specific result is guaranteed. Results vary and depend on individual circumstances and effort.'}
];

const stage=document.getElementById('stage');
function render(i){
  const s=S[i];
  let h='';
  if(s.t==='title'){h=`<div class="slide active"><div class="kicker">${s.kicker}</div><h1>${s.h1}</h1><p class="lede">${s.lede}</p></div>`;}
  else if(s.t==='quote'){h=`<div class="slide active"><p class="big">${s.big}</p></div>`;}
  else if(s.t==='framework'){let c=s.stages.map(x=>`<div class="stage-card"><div class="n">${x.n}</div><div class="t">${x.t}</div><div class="d">${x.d}</div></div>`).join('');h=`<div class="slide active"><div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="stage-row">${c}</div></div>`;}
  else if(s.t==='credit'){let b=s.credit.map(x=>`<p class="credit">${x}</p>`).join('');h=`<div class="slide active"><div class="kicker">${s.kicker}</div><h2>${s.h2}</h2>${b}</div>`;}
  else if(s.t==='cta'){h=`<div class="slide active"><div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><div class="cta-box"><div class="step">${s.step}</div><div class="sub">${s.sub}</div></div><p class="disclaimer">${s.disclaimer}</p></div>`;}
  else{let parts=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2>`;if(s.body){parts+=s.body.map(x=>`<p class="body">${x}</p>`).join('');}if(s.bullets){parts+='<ul>'+s.bullets.map(x=>`<li>${x}</li>`).join('')+'</ul>';}h=`<div class="slide active">${parts}</div>`;}
  stage.innerHTML=h;
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
let idx=0;render(idx);
function go(d){idx=Math.max(0,Math.min(S.length-1,idx+d));render(idx);}
document.getElementById('prev').onclick=()=>go(-1);
document.getElementById('next').onclick=()=>go(1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
</script>
</body>
</html>
