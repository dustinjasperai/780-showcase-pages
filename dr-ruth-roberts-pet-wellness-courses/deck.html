<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Root-Cause Method for Chronic Pet Illness — Dr. Ruth Roberts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5ef;        /* warm cream ground (light-scheme brand -> light deck) */
    --panel:#efe9dd;     /* panel, a shade of the cream */
    --rule:#dfd8c8;      /* hairline */
    --ink:#2e2a39;       /* her dominant brand ink, verbatim from brand.json */
    --ink-soft:#5c5766;  /* muted ink */
    --accent:#efa316;    /* her CTA button amber, verbatim from brand.json */
    --deep:#1f4f45;      /* her forest/teal deep (#002e29), lightened for contrast on cream */
    --serif:'Newsreader',Georgia,serif;
    --sans:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#e7e1d3;font-family:var(--sans);color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vmin 9vmin;background:var(--bg);opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .kicker{font-family:var(--sans);font-weight:600;font-size:clamp(11px,1.5vmin,15px);
    letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:2.2vmin}
  .kicker .num{color:var(--ink-soft);letter-spacing:.1em}
  h1{font-family:var(--serif);font-weight:500;line-height:1.04;letter-spacing:-.01em;
    font-size:clamp(30px,7.2vmin,80px);max-width:20ch}
  h2{font-family:var(--serif);font-weight:500;line-height:1.08;letter-spacing:-.01em;
    font-size:clamp(26px,5.4vmin,58px);max-width:22ch}
  h2 em,h1 em{font-style:italic;color:var(--deep)}
  .lede{font-size:clamp(15px,2.5vmin,26px);line-height:1.5;color:var(--ink-soft);
    max-width:34ch;margin-top:3vmin;font-weight:300}
  .lede.wide{max-width:44ch}
  ul{list-style:none;margin-top:4vmin;display:flex;flex-direction:column;gap:2.2vmin;max-width:40ch}
  ul li{position:relative;padding-left:4vmin;font-size:clamp(15px,2.5vmin,25px);line-height:1.4;font-weight:300}
  ul li b{font-weight:600;color:var(--ink)}
  ul li:before{content:"";position:absolute;left:0;top:.7em;width:2.2vmin;height:2.2vmin;
    border-radius:50%;background:var(--accent)}
  .systems{display:flex;flex-wrap:wrap;gap:1.4vmin;margin-top:4vmin;max-width:52ch}
  .chip{font-family:var(--sans);font-weight:500;font-size:clamp(12px,1.9vmin,19px);
    padding:1.1vmin 2.2vmin;border:1px solid var(--rule);border-radius:999px;background:var(--panel);color:var(--ink)}
  .chip.hot{background:var(--deep);color:#f7f5ef;border-color:var(--deep)}
  .flow{display:flex;align-items:center;gap:2vmin;flex-wrap:wrap;margin-top:4vmin}
  .flow .step{font-family:var(--serif);font-size:clamp(16px,3vmin,32px);color:var(--ink)}
  .flow .arw{color:var(--accent);font-size:clamp(16px,3vmin,30px)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:6vmin;align-items:start;margin-top:2vmin}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:4vmin}
  .card h3{font-family:var(--serif);font-weight:500;font-size:clamp(18px,3vmin,30px);margin-bottom:1.6vmin}
  .card p{font-size:clamp(13px,2vmin,19px);line-height:1.45;color:var(--ink-soft);font-weight:300}
  .credit{display:flex;flex-direction:column;gap:1.4vmin;margin-top:3vmin;max-width:44ch}
  .credit .row{display:flex;gap:2vmin;font-size:clamp(13px,2vmin,20px);font-weight:300}
  .credit .row b{color:var(--accent);font-weight:600;min-width:9ch}
  .url{margin-top:2vmin;color:var(--deep);font-weight:500;font-size:clamp(15px,2.4vmin,24px)}
  .disc{margin-top:5vmin;font-size:clamp(10px,1.4vmin,13px);color:var(--ink-soft);max-width:62ch;
    line-height:1.5;font-weight:300;border-top:1px solid var(--rule);padding-top:2.4vmin}
  .brandline{position:absolute;left:9vmin;bottom:5vmin;font-family:var(--sans);font-weight:500;
    font-size:clamp(10px,1.4vmin,13px);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft)}
  .brandline span{color:var(--accent)}
  .nav{position:fixed;right:3vmin;bottom:3vmin;display:flex;gap:1.2vmin;z-index:20}
  .nav button{width:44px;height:44px;border-radius:50%;border:1px solid var(--rule);background:var(--panel);
    color:var(--ink);font-size:20px;cursor:pointer;font-family:var(--sans)}
  .nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  .count{position:fixed;left:3vmin;bottom:3.4vmin;font-size:12px;letter-spacing:.1em;color:var(--ink-soft);z-index:20}
  @media (max-width:720px){.two{grid-template-columns:1fr}.slide{padding:9vmin 7vmin}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="count"><span id="cur">1</span> / <span id="tot">1</span></div>
<div class="nav"><button id="prev" aria-label="Previous">&larr;</button><button id="next" aria-label="Next">&rarr;</button></div>

<script>
/* Masterclass deck — Dr. Ruth Roberts. Slides are data; the renderer builds them. */
const BRAND = 'Dr. Ruth Roberts <span>&middot;</span> The Original Holistic Pet Health Coach';
const S = [
  {t:'title', k:'A live masterclass with Dr. Ruth Roberts, DVM',
    h:'The root-cause method for <em>chronic pet illness</em>',
    sub:'Why the itching, the gut trouble, and the flare-ups keep coming back, and the whole-body way to actually turn them around.' },

  {t:'point', k:'Who this is for', h:'You have done everything the label told you to.',
    list:['You switched foods, twice, and the itching came back.',
          'You have a shelf of prescriptions that quiet the symptom for a while.',
          'Every visit treats the flare-up. <b>Nobody treats the cause.</b>'] },

  {t:'statement', k:'The reframe', h:'A symptom is not the problem. It is the <em>body asking for help.</em>',
    sub:'Suppress the itch and the body finds another way to speak: the gut, the skin, the kidneys. The goal is not a quieter symptom. It is an animal that no longer needs to make one.' },

  {t:'statement', k:'Part one', h:'Why the same problem keeps coming back',
    sub:'Chronic illness is rarely one broken part. It is a chain: a stressed gut that inflames the skin, a liver working overtime, a diet that never gave the body what it needed to repair. Treat one link and the chain still pulls.' },

  {t:'two', k:'The pattern', h:'Symptom-chasing has a ceiling.',
    cards:[{h:'The quick-fix loop', p:'Name the symptom, match it to a product or a pill, wait for the next flare. It feels like action. The animal does not get well, it gets managed.'},
           {h:'The root-cause loop', p:'Ask what the body is missing or fighting, correct that, and the symptoms fall away because the reason for them is gone.'}] },

  {t:'statement', k:'Part two &nbsp;&middot;&nbsp; the method', h:'The <em>iPets Approach</em>: read the whole animal, not one part',
    sub:'My integrative method blends functional medicine with Traditional Chinese Veterinary Medicine. Instead of chasing one symptom, we read the pet across its body systems and across physical, mental, and emotional health, then trace the trouble back to where it began.' },

  {t:'systems', k:'The systems map', h:'Every chronic case starts in one of these.',
    chips:[['Food',1],['Gut',1],['Liver',0],['Kidney',0],['Endocrine',0],['Skin',0],['Musculoskeletal',0],['Brain &amp; behavior',0],['Cancer support',0],['Autoimmune',0]],
    sub:'Follow the systems in order and the story of the illness usually tells itself. It almost always begins with food and the gut.' },

  {t:'statement', k:'Where it usually begins', h:'The gut is the door to the rest of the body.',
    sub:'Most of the immune system lives around the gut. When digestion is off, inflammation leaks outward as skin flares, ear infections, and reactivity. Settle the gut first and problems three systems away often quiet down on their own.' },

  {t:'statement', k:'The food-first fix', h:'The <em>Original CrockPET Diet</em>',
    sub:'My whole-food, home-cooked protocol, built to be made in a slow cooker from real ingredients. It is not a brand of kibble. It is a balanced, repeatable way to feed the body what it needs to repair, and it is where nearly every healing plan I build starts.' },

  {t:'flow', k:'The healing sequence', h:'Order matters more than intensity.',
    steps:['Feed','Settle the gut','Support the organ','Rebuild resilience'],
    sub:'A dozen supplements thrown at a sick animal at once tells you nothing. One change at a time, in the right order, lets the body show you what it actually needed.' },

  {t:'point', k:'How a plan gets built', h:'A plan built for one animal, not a category.',
    list:['<b>Read the systems.</b> Where did this really start?',
          '<b>Rebuild the diet.</b> CrockPET as the foundation.',
          '<b>Support, in order.</b> Targeted, one change at a time.',
          '<b>Re-check and adjust.</b> The body is the feedback.'] },

  {t:'statement', k:'The whole animal', h:'Behavior and mood are health signals too.',
    sub:'Anxiety, reactivity, and low mood are not separate from the body. Pain, gut trouble, and hormones show up as behavior. Reading the emotional layer alongside the physical is what makes the picture whole, and what the quick-fix approach always misses.' },

  {t:'credit', k:'Why trust this method', h:'Thirty years of cases, one consistent method.',
    rows:[['Vet','Licensed, integrative veterinarian, 30+ years in practice.'],
          ['Trained','Functional medicine and Traditional Chinese Veterinary Medicine.'],
          ['Accredited','My coach curriculum carries 40 RACE CE credits for veterinary professionals.'],
          ['Built','The CrockPET Diet and the iPets Approach, refined on real animals.']] },

  {t:'point', k:'Part three &nbsp;&middot;&nbsp; what changes', h:'What a well-run body looks like',
    list:['Skin and coat that settle and stay settled.',
          'Digestion you stop thinking about.',
          'Steadier energy and a steadier mood.',
          'Fewer flares, fewer emergencies, fewer prescriptions.'] },

  {t:'statement', k:'The shift', h:'From managing a sick animal to <em>growing a well one.</em>',
    sub:'Once you can read the systems and feed the body properly, you stop reacting to your pet’s health and start directing it. That is the whole point of the method, and it is learnable.' },

  {t:'point', k:'The method, in one screen', h:'The root-cause method',
    list:['<b>Symptoms are messages,</b> not the problem.',
          '<b>Read the systems</b> with the iPets Approach.',
          '<b>Start with food</b> using the CrockPET Diet.',
          '<b>Support in order,</b> then rebuild resilience.'] },

  {t:'cta', k:'Where to go from here', h:'Learn the method. <em>Or learn to teach it.</em>',
    sub:'If today made sense, there is a next step for you: go deeper into the method for your own animal, or train with me to guide other pet parents as a Certified Holistic Pet Health Coach.',
    url:'drruthroberts.com',
    disc:'Educational content only. Nothing here is veterinary diagnosis, treatment, or a substitute for care from your own veterinarian. Individual animals respond differently and no specific health outcome or result is promised or guaranteed. Always work with a qualified veterinarian before changing your pet’s diet, supplements, or medication.' }
];

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function build(s){
  let inner = '<div class="kicker"><span class="num">'+String(idx(s)).padStart(2,'0')+'</span> &nbsp; '+s.k+'</div>';
  const tag = (s.t==='title'||s.t==='cta') ? 'h1' : 'h2';
  inner += '<'+tag+'>'+s.h+'</'+tag+'>';
  if(s.sub) inner += '<p class="lede wide">'+s.sub+'</p>';
  if(s.list){ inner += '<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.cards){ inner += '<div class="two">'+s.cards.map(c=>'<div class="card"><h3>'+c.h+'</h3><p>'+c.p+'</p></div>').join('')+'</div>'; }
  if(s.chips){ inner += '<div class="systems">'+s.chips.map(c=>'<span class="chip'+(c[1]?' hot':'')+'">'+c[0]+'</span>').join('')+'</div>'; }
  if(s.steps){ inner += '<div class="flow">'+s.steps.map((x,n)=>'<span class="step">'+x+'</span>'+(n<s.steps.length-1?'<span class="arw">&rarr;</span>':'')).join('')+'</div>'; }
  if(s.rows){ inner += '<div class="credit">'+s.rows.map(r=>'<div class="row"><b>'+r[0]+'</b><span>'+r[1]+'</span></div>').join('')+'</div>'; }
  if(s.url){ inner += '<p class="url">'+s.url+'</p>'; }
  if(s.sub && s.t==='cta'){} // sub already added
  if(s.disc){ inner += '<p class="disc">'+s.disc+'</p>'; }
  inner += '<div class="brandline">'+BRAND+'</div>';
  const sec = document.createElement('section');
  sec.className='slide';
  sec.innerHTML=inner;
  return sec;
}
let _i=0; function idx(s){ return S.indexOf(s)+1; }
const deck=document.getElementById('deck');
S.forEach(s=>deck.appendChild(build(s)));
const slides=[].slice.call(document.querySelectorAll('.slide'));
document.getElementById('tot').textContent=slides.length;
let i=0; const cur=document.getElementById('cur');
function show(n){ slides[i].classList.remove('on'); i=(n+slides.length)%slides.length; slides[i].classList.add('on'); cur.textContent=i+1; }
slides[0].classList.add('on');
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')show(i+1); if(e.key==='ArrowLeft')show(i-1); });
</script>
</body>
</html>
