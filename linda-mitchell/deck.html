<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why You Keep Starting Over — a live masterclass with Linda Mitchell</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F8F4;      /* soft green-tinted warm white */
    --panel:#FFFFFF;
    --rule:#E2E8DE;
    --ink:#1E2A22;
    --muted:#55685C;
    --accent:#267A48;  /* brand green, from the live sisterhoodofsweat/chickfit site mark */
    --deep:#1C5B37;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Nunito',sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:44px 44px;margin:16px 0;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(30,42,34,.03)}
  .kicker{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:14px}
  h1,h2{font-family:'Montserrat',sans-serif;color:var(--ink)}
  h1{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-.01em}
  h2{font-size:28px;font-weight:700;line-height:1.15}
  .sub{font-size:19px;color:var(--muted);margin-top:16px;max-width:46ch}
  .big{font-family:'Montserrat',sans-serif;font-weight:700;font-size:30px;line-height:1.25;
    color:var(--deep);max-width:30ch}
  .note{margin-top:18px;color:var(--muted);font-size:15px}
  ul{list-style:none;margin-top:22px;display:grid;gap:12px}
  li{position:relative;padding-left:30px;font-size:18px;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;
    border-radius:50%;background:var(--accent);opacity:.9}
  .title-slide{background:linear-gradient(135deg,#F6F8F4 0%,#EAF2EC 100%);
    border-color:var(--rule)}
  .title-slide h1{font-size:48px}
  .section{background:var(--deep);border-color:var(--deep)}
  .section .kicker{color:#CFE8D8}
  .section h2{color:#FFFFFF;font-size:34px}
  .cta{background:var(--accent);border-color:var(--accent)}
  .cta .kicker{color:#DCF1E4}
  .cta h2{color:#FFFFFF}
  .cta .sub{color:#EAF7EF}
  .disc{margin-top:26px;font-size:12.5px;color:#DCF1E4;max-width:62ch;line-height:1.5}
  .define h2{color:var(--deep)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', cls:'title-slide', kicker:'A live masterclass with Linda Mitchell',
   h:"Why You Keep Starting Over", sub:"And the plan and sisterhood that finally make it stick."},

  {t:'who', kicker:'Who this is for',
   h:"For the woman who has started over more times than she can count",
   list:["You have tried the apps, the challenges, the January resets",
         "You get a few weeks in, life happens, and you are back to square one",
         "You are not lazy and you are not broken. You have been doing it alone, without a real plan"]},

  {t:'reframe', kicker:'The hard truth', h:"It was never your willpower",
   sub:"92% of people fail for the same two reasons: no plan, and no one in it with them."},

  {t:'section', cls:'section', kicker:'Part one', h:"Why quick fixes always quit on you"},

  {t:'list', kicker:'The quick-fix trap',
   h:"The 5-moves-for-great-glutes promise is the problem",
   list:["Random workouts with no week-to-week plan",
         "All body, no mindset, so the first hard week wins",
         "No one notices whether you show up",
         "So you start over on Monday, again"]},

  {t:'quote', big:"\"Little things do not work. If you want to achieve something, you have to jump in with both feet.\"",
   note:"What my members learn in week one"},

  {t:'section', cls:'section', kicker:'Part two', h:"The Sisterhood of S.W.E.A.T. method"},

  {t:'define', cls:'define', kicker:'S.W.E.A.T.', h:"Strong Women Empowering Achieving Together",
   sub:"The method is built on one idea: women change faster, and keep it, together."},

  {t:'list', kicker:'Pillar one', h:"A real plan, not a workout dump",
   list:["A coached, week-by-week path",
         "Built around your real life, not a template",
         "You always know the next step"]},

  {t:'list', kicker:'Pillar two', h:"Nutrition you can actually live with",
   list:["Integrative nutrition, not a crash diet",
         "Fuel for the training, not punishment",
         "Habits that survive a busy week"]},

  {t:'list', kicker:'Pillar three', h:"The mindset work everyone else skips",
   list:["The reframe for the week you want to quit",
         "Confidence built from showing up, not the scale",
         "It is okay to be uncomfortable. You push through"]},

  {t:'list', kicker:'The multiplier', h:"The sisterhood",
   list:["A group of like-minded women in it with you",
         "People who notice when you go quiet",
         "More power, support, and fun than going it alone"]},

  {t:'section', cls:'section', kicker:'Part three', h:"What eight weeks actually looks like"},

  {t:'list', kicker:'The arc', h:"From starting over to staying",
   list:["Weeks 1 and 2: the plan and the first wins",
         "Weeks 3 to 5: nutrition and the mindset reframes",
         "Weeks 6 to 8: it becomes who you are, with the sisterhood holding it"]},

  {t:'quote', big:"\"You can go to any gym. Come to us and you will have a plan.\"",
   note:"The difference my members feel on day one"},

  {t:'why', kicker:'Why me', h:"I have been the woman starting over",
   sub:"Fitness pro, Integrative Nutrition graduate, award-winning competitor, and author of The Sisterhood of S.W.E.A.T. I found this to survive my own hard years, then built it for other women."},

  {t:'list', kicker:'What you leave with today', h:"Your first plan",
   list:["The two reasons you keep restarting, and how to end them",
         "The three pillars, and the one most programs drop",
         "How the sisterhood changes your odds"]},

  {t:'cta', cls:'cta', kicker:'Your next step', h:"Join the Sisterhood of Sweat",
   sub:"Come do the next eight weeks with a plan and a room full of women in it with you.",
   disc:"For education only. No income or result is guaranteed. Results vary from person to person, and nothing here is medical advice. Talk to your doctor before starting any fitness or nutrition program."}
];

const deck=document.getElementById('deck');
S.forEach(function(s){
  const el=document.createElement('section');
  el.className='slide'+(s.cls?' '+s.cls:'');
  let html='';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h){ html+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>'); }
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.list){ html+='<ul>'; s.list.forEach(function(i){html+='<li>'+i+'</li>';}); html+='</ul>'; }
  if(s.note) html+='<div class="note">'+s.note+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
