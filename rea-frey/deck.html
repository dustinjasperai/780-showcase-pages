<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booked Without the 'Gram — a masterclass with Rea Frey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf4f3; --panel:#fbfdfd; --ink:#1a1a1a; --muted:#6f6f6f;
    --rule:#e4ddd0; --accent:#0388a6; --accent-deep:#036c84;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--accent-deep);font-family:'Mulish',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;}
  #stage{max-width:1120px;margin:0 auto;padding:28px 20px 70px;}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:6px;
    aspect-ratio:16/9;width:100%;margin:0 auto 26px;padding:58px 64px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
    box-shadow:0 10px 40px rgba(0,0,0,.14);
  }
  .kick{font-size:13px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:62px;line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:40px;line-height:1.1;margin-bottom:20px;}
  .lead{font-size:23px;line-height:1.5;color:var(--muted);max-width:46ch;}
  .big{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:46px;line-height:1.15;max-width:20ch;}
  .big .a{color:var(--accent);font-style:italic;}
  p.body{font-size:21px;line-height:1.55;color:#2c2c2c;max-width:52ch;margin-bottom:14px;}
  ul{list-style:none;margin-top:10px;}
  ul li{font-size:21px;line-height:1.4;color:#2c2c2c;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:56ch;}
  ul li:before{content:"";position:absolute;left:0;top:21px;width:11px;height:11px;background:var(--accent);border-radius:50%;}
  ul li b{font-weight:700;color:var(--ink);}
  .part{font-family:'Playfair Display',Georgia,serif;font-size:19px;font-weight:600;letter-spacing:.04em;color:var(--accent);text-transform:uppercase;margin-bottom:14px;}
  .pres{margin-top:30px;font-size:18px;color:var(--muted);}
  .pres b{color:var(--ink);font-weight:700;}
  .path{display:flex;gap:14px;margin-top:14px;flex-wrap:wrap;}
  .path .step{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:18px 16px;}
  .path .step .n{font-family:'Playfair Display',serif;font-size:15px;color:var(--accent);font-weight:700;}
  .path .step .t{font-size:19px;font-weight:700;margin:6px 0 4px;}
  .path .step .d{font-size:15px;color:var(--muted);line-height:1.35;}
  .quietnum{font-family:'Playfair Display',serif;font-weight:700;font-size:150px;color:var(--accent);line-height:.9;}
  .disc{font-size:15px;color:var(--muted);line-height:1.5;max-width:60ch;margin-top:24px;border-top:1px solid var(--rule);padding-top:16px;}
  .cta-line{font-size:24px;color:var(--ink);margin-top:10px;font-weight:600;}
  .cta-line b{color:var(--accent-deep);}
  .foot{position:absolute;bottom:20px;right:28px;font-size:13px;color:var(--muted);letter-spacing:.04em;}
  .pageno{position:absolute;bottom:20px;left:28px;font-size:13px;color:var(--muted);}
  @media(max-width:760px){.slide{padding:34px 26px;}h1{font-size:38px;}h2{font-size:28px;}.big{font-size:30px;}.lead,p.body,ul li{font-size:17px;}.quietnum{font-size:92px;}}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S=[
  {t:'title', html:`<div class="kick">A free live masterclass</div>
    <h1>Booked Without the 'Gram</h1>
    <p class="lead">How to get seen and land a book deal without selling your soul to the algorithm.</p>
    <div class="pres"><b>Rea Frey</b> &middot; #1 bestselling author and book doula</div>`},

  {t:'intro', html:`<div class="kick">Who this is for</div>
    <h2>You have a book in you. Not a following.</h2>
    <p class="body">This is for writers with a finished manuscript, a half-draft, or just a stubborn idea who have been told the same thing over and over: no platform, no deal.</p>
    <p class="body">You did not start writing so you could become a content creator. Good. Neither did I.</p>`},

  {t:'trap', html:`<div class="kick">The trap</div>
    <h2>The platform treadmill</h2>
    <p class="body">Post daily. Go viral. Hit 10k followers. Then maybe an agent will notice you.</p>
    <p class="body">So you pour months into reels and threads, your word count stalls, and the book that made you a writer sits untouched. The algorithm got your best hours. Your manuscript got the leftovers.</p>`},

  {t:'reframe', html:`<div class="kick">The uncomfortable truth</div>
    <div class="big">A big following does not sell a book. <span class="a">The right readers do.</span></div>
    <p class="body" style="margin-top:22px">Agents and editors are not counting your followers. They are asking one question: can this writer reach the readers who will actually buy this book? You can answer yes without a single post.</p>`},

  {t:'part', html:`<div class="part">Part One</div>
    <h2>Why the algorithm is the wrong job</h2>
    <p class="lead">Before the system, the mindset shift that frees up your calendar and your energy.</p>`},

  {t:'list', html:`<div class="kick">What chasing followers really costs</div>
    <h2>Loud is not the same as read</h2>
    <ul>
      <li><b>Borrowed ground.</b> A platform you rent from an app can change the rules or vanish overnight.</li>
      <li><b>Vanity over value.</b> Likes feel like progress. They rarely turn into a pre-order.</li>
      <li><b>Burnout.</b> The writers who quit are almost never out of ideas. They are out of energy they spent performing.</li>
    </ul>`},

  {t:'goal', html:`<div class="kick">The real goal</div>
    <h2>A readership you own</h2>
    <p class="body">Not followers who scroll past. A small, real audience that opens your emails, shows up for your work, and buys the book the week it lands.</p>
    <p class="body">That is what makes an agent lean in, and it is completely buildable in quiet.</p>`},

  {t:'part', html:`<div class="part">Part Two</div>
    <h2>The Soul-First System</h2>
    <p class="lead">Four pillars for getting seen and getting signed, none of which require an account you dread opening.</p>`},

  {t:'pillar', html:`<div class="kick">Pillar one</div>
    <h2>The Quiet 100</h2>
    <p class="body">You do not need a hundred thousand followers. You need your first one hundred true readers, the people who would tell a friend about your book without being asked.</p>
    <p class="body">We find them, name them, and tend them. One hundred real fans beats ten thousand strangers every time a book goes on sale.</p>`},

  {t:'pillar', html:`<div class="kick">Pillar two</div>
    <h2>The Visibility Map</h2>
    <p class="body">A simple weekly plan that puts you in front of readers through channels you control: your newsletter, guest essays, podcast conversations, and the rooms where your readers already gather.</p>
    <p class="body">Sustainable, repeatable, and quiet. No dancing required.</p>`},

  {t:'pillar', html:`<div class="kick">Pillar three</div>
    <h2>The Pitch That Lands</h2>
    <p class="body">Visibility is useless if you freeze when it is time to ask. You will leave with pitch templates that get you onto podcasts and pages, so the right readers and the right editors keep finding you on purpose.</p>`},

  {t:'pillar', html:`<div class="kick">Pillar four</div>
    <h2>From Draft to Deal</h2>
    <p class="body">Getting seen is half of it. The other half is having something an agent can sell.</p>
    <div class="path">
      <div class="step"><div class="n">01</div><div class="t">The Skeleton</div><div class="d">Structure the bones before you write.</div></div>
      <div class="step"><div class="n">02</div><div class="t">The Proposal</div><div class="d">The document editors fall for.</div></div>
      <div class="step"><div class="n">03</div><div class="t">The Query</div><div class="d">The pitch that opens the door.</div></div>
      <div class="step"><div class="n">04</div><div class="t">The Agent</div><div class="d">The call every writer wants.</div></div>
    </div>`},

  {t:'together', html:`<div class="kick">How it fits</div>
    <h2>Quiet in, signed out</h2>
    <p class="body">The Quiet 100 and the Visibility Map build a readership you own. The Pitch and the Draft-to-Deal path turn that readership into the thing agents cannot ignore: a writer with a real audience and a book ready to sell.</p>
    <p class="body">None of it lives on a feed.</p>`},

  {t:'part', html:`<div class="part">Part Three</div>
    <h2>What it actually looks like</h2>
    <p class="lead">A week of soul-first visibility, and the writer behind the method.</p>`},

  {t:'week', html:`<div class="kick">A quiet week that compounds</div>
    <h2>Three hours, not thirty</h2>
    <ul>
      <li><b>One letter.</b> A short note to your Quiet 100 that sounds like you, not a brand.</li>
      <li><b>One ask.</b> A single pitch to a podcast or publication your readers already trust.</li>
      <li><b>One page.</b> Steady progress on the proposal or manuscript that carries the deal.</li>
    </ul>`},

  {t:'why', html:`<div class="kick">Why listen to me</div>
    <h2>I built a career this way</h2>
    <p class="body">I am Rea Frey, a #1 bestselling author of around a dozen books across suspense, fiction, and nonfiction. My work has been optioned for film and featured on Good Morning America, CBS Saturday Mornings, and in The New York Times.</p>
    <p class="body">As a book doula, I have helped nearly a thousand first-time authors land agents and publishing deals. Most of them are not loud online. They just had a plan.</p>`},

  {t:'objection', html:`<div class="kick">The objection</div>
    <div class="big">"But don't I have to be <span class="a">everywhere?</span>"</div>
    <p class="body" style="margin-top:22px">No. You have to be somewhere, consistently, for the right one hundred people. Quiet and deliberate beats loud and scattered, especially when a book is on the line.</p>`},

  {t:'invite', html:`<div class="kick">Let's talk about your book</div>
    <h2>Let's build your plan</h2>
    <p class="body">If you want help turning this into your own Quiet 100, your visibility map, and a path to a deal, the next step is a conversation.</p>
    <p class="body">Book a free idea chat with me, and we will map where your book is and what it needs next.</p>`},

  {t:'cta', html:`<div class="kick">Your next step</div>
    <h1>Book your idea chat</h1>
    <p class="cta-line">Start at <b>reafrey.com</b> &middot; then the Authorpreneur Mastermind</p>
    <p class="body" style="margin-top:14px">Bring your book, your idea, or your stuck point. We will find the quiet path forward.</p>
    <div class="disc">This masterclass is educational. No income, publishing outcome, agent, or result is guaranteed. Results vary and depend on your manuscript, your effort, and the market.</div>`}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.cls?(' '+s.cls):'');
  d.innerHTML=s.html+'<div class="pageno">'+(i+1)+' / '+S.length+'</div><div class="foot">Rea Frey &middot; Booked Without the ’Gram</div>';
  stage.appendChild(d);
});
</script>
</body>
</html>
