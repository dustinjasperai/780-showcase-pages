<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Fix the Money Side First · Ralph Estep, Jr.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f5ef; --panel:#efe9db; --rule:#ddd4bf;
    --ink:#162345; --accent:#b3954b; --grey:#45506d; --dim:#8a86a0;
  }
  html,body{height:100%}
  body{background:#e9e4d7;font-family:'Nunito Sans',-apple-system,sans-serif;color:var(--grey);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e4d7}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Nunito Sans',sans-serif;font-size:1.0vw;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.12;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:95%}
  .t-normal h1{font-size:3.2vw;max-width:93%}
  .t-normal .body{font-family:'Nunito Sans',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.0vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-family:'Nunito Sans',sans-serif;font-size:1.65vw;color:var(--ink);margin-top:3.4vh;max-width:88%;line-height:1.5;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Nunito Sans',sans-serif;font-size:1.1vw;font-weight:800;color:var(--accent);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.6vh}
  .t-dark{background:linear-gradient(150% 130% at 50% 12%,#1b294f 0%,#0f1830 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:90%;color:#f5f1e6}
  .t-cta{background:linear-gradient(150% 130% at 50% 100%,#22315a 0%,#111a34 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:88%;color:#f7f2e6}
  .t-cta .body{font-family:'Nunito Sans',sans-serif;color:#ded6c2;font-size:1.4vw;margin-top:3vh;max-width:76%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:#f7f2e6;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:#b9c0d6;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo{position:absolute;pointer-events:none}
  .title-mo{right:7.5%;bottom:9%;width:24vw;opacity:.9}
  .corner-mo{right:6.5%;bottom:8%;width:11vw;opacity:.45}
  .brandline{font-family:'Nunito Sans',sans-serif;font-size:1.15vw;color:var(--ink);margin-top:3.8vh;font-weight:700;letter-spacing:.03em}
  .brandline b{color:var(--accent);font-weight:800}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(22,35,69,.08);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#d8c48a);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:800}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.7vw}.t-section h1{font-size:7.8vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Grit and Growth Business</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: three flat ledger lines that resolve into a rising step, structure made visible -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 150 90">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#162345" stroke-width="1.5" opacity="0.35">
      <line x1="14" y1="30" x2="96" y2="30"/>
      <line x1="14" y1="46" x2="110" y2="46"/>
      <line x1="14" y1="62" x2="82" y2="62"/>
    </g>
    <g stroke="#b3954b" stroke-width="2.4" opacity="0.95">
      <path d="M14 74 L54 74 L54 56 L94 56 L94 36 L134 36"/>
    </g>
    <circle cx="134" cy="36" r="4" fill="#b3954b" stroke="none" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Fix the Money Side First',sub:'A live masterclass for small business owners who are working harder than ever and still cannot see it in the bank. Taught by Ralph Estep, Jr., a licensed accountant of thirty years.',brand:true,mo:'title'},

 {t:'normal',k:'Who this is for',title:'You built this business from nothing. The numbers are the part nobody ever sat you down and taught.',body:'Revenue is up. Your hours are up. Somehow the bank balance and your peace of mind are not. You are good at the work and good with your customers. What was never handed to you is the money side, the pricing, the cash flow, and the plan, so you run it on instinct and hope the month works out.'},

 {t:'dark',title:'Most money stress is not a character flaw. It is a system that was never built.'},

 {t:'section',idx:'Part One',title:'Why Working Harder Stopped Moving the Number'},
 {t:'normal',k:'The real problem',title:'You are running the business on feel, not on figures.',body:'When you cannot see the numbers clearly, every decision becomes a guess. You guess at your prices, you guess at what you can afford, and you guess at whether this month was actually good. Effort covers for a lot, but it cannot fix a math problem, and a business run on feel eventually hits a ceiling that no amount of hustle can push through.'},
 {t:'normal',k:'The three blind spots',title:'Three questions most owners cannot answer on the spot.',body:'What does it actually cost you to serve one customer. Which part of your work makes real money and which part only looks busy. And how much is genuinely safe to pay yourself this month. If those answers are fuzzy, the business is steering you instead of the other way around, and that is true no matter how hard you work.'},
 {t:'dark',title:'You cannot out-hustle a pricing mistake. You can only out-hustle it into a bigger one.'},

 {t:'section',idx:'Part Two',title:'Money Mastery: The Accountant’s Order of Operations'},
 {t:'normal',k:'Pillar one',title:'Know your numbers before you touch your strategy.',body:'You do not need a finance degree, you need one simple dashboard you actually look at: what is coming in, what is going out, and what is left. Clarity comes first because you cannot fix, price, or grow anything you cannot see. This is the step almost everyone skips, and it is the one that changes the most.'},
 {t:'normal',k:'Pillar two',title:'Price for profit, not for staying busy.',body:'Most owners price by looking sideways at what everyone else charges, then wonder why a full calendar still does not pay. Once you can see the true cost of delivering your work, you can set prices that leave a profit on purpose, raise them without fear, and stop trading your life for revenue that never reaches your pocket.'},
 {t:'normal',k:'Pillar three',title:'Give your cash flow a rhythm.',body:'Feast-and-famine is not your income being unpredictable, it is money moving without a plan. When you pay yourself first, set aside what you owe before you owe it, and give every dollar a job on a schedule, the month-end scramble goes quiet. The money stops being a source of dread and starts being something you manage.'},
 {t:'normal',k:'Pillar four',title:'Build the system so the business holds without you in the middle of it.',body:'Once the numbers are clear and the pricing is right, you put the boring, reliable structure around them: the simple habits, the checklist, the few tools that do the remembering so you do not have to. A business that depends on you carrying every number in your head is fragile. One built on a system is calm, and it is yours.'},
 {t:'normal',k:'The plan',title:'Turn the clarity into a dated ninety-day plan.',body:'Understanding your money and acting on it are two different things, and inspiration fades by Monday. So the method ends where it should, with a ninety-day plan: the specific next steps, in order, with dates. It is how clarity becomes something you did, not just something you understood, and how the next right move is always in front of you.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Money Side Is Fixed'},
 {t:'normal',k:'The business this builds',title:'Predictable, calm, and finally paying you first.',body:'When you can see the numbers, price with confidence, and run cash flow on a rhythm, the fog lifts. You stop lying awake doing math in the dark. You know which months are strong and why, you know what you can afford, and you pay yourself like the owner instead of last in line. The business starts funding the life you built it for.'},
 {t:'dark',title:'Clarity beats confusion. The next right step is always closer than it feels.'},
 {t:'normal',k:'Why Ralph Estep, Jr.',title:'Thirty years of books, two businesses, a working farm, and a lot of hard lessons.',body:'Ralph is a licensed accountant who has spent three decades inside the numbers of real small businesses through his firm, Saggio Accounting. He also raises cattle on Estep Farm and has lived the highs and lows of owning it himself. He wrote Mastering Your Finances and Gospel of Entrepreneurship for exactly the owner in this room. This is the order he uses.'},
 {t:'normal',k:'The principle',title:'Build a business that funds your life, not one that quietly drains it.',body:'None of this is about hype or overnight success. It is about honest structure and consistent habits, the unglamorous work that makes a business steady and a life livable. Fix the money side first, and everything you build on top of it, the marketing, the team, the growth, finally has solid ground to stand on.'},

 {t:'cta',title:'Ready to fix the money side of your business?',body:'Take the next step with Ralph and Grit and Growth Business.',chips:['Watch Grit & Growth Business LIVE','Start the twelve-week coaching'],disc:'Educational content for small business owners. No specific financial or business result is guaranteed. Any examples describe general principles and past experience, not a promise of your results, which vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Grit and <b>Growth</b> Business · Ralph Estep, Jr.</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
