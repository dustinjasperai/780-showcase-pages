<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be the Gateway — A Live Masterclass with Dan Blank</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef0f1;      /* cool paper, from site greys #f0f0f0 / #f1f1f1 */
    --panel:#fbfcfd;
    --rule:#d8dcde;    /* from site #d1d1d1 */
    --ink:#232a2e;     /* deep slate */
    --muted:#6b7378;
    --accent:#1f6f93;  /* derived from site link blue #21759b */
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Montserrat',system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 64px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:10px;
    padding:44px 48px;margin:0 0 20px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .gateway{position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .dots{position:absolute;right:30px;top:26px;display:flex;gap:7px}
  .dots i{width:7px;height:7px;border-radius:50%;background:var(--accent);opacity:.28}
  .dots i:last-child{opacity:1}
  .eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin:0 0 14px}
  h1{font-family:'Merriweather',Georgia,serif;font-weight:900;font-size:46px;
    line-height:1.12;margin:0 0 16px}
  h2{font-family:'Merriweather',Georgia,serif;font-weight:700;font-size:32px;
    line-height:1.18;margin:0 0 14px}
  p{font-size:19px;margin:0 0 14px;max-width:62ch}
  .lead{font-size:22px;color:var(--ink)}
  .muted{color:var(--muted)}
  ul{margin:8px 0 0;padding:0 0 0 22px}
  li{font-size:19px;margin:0 0 12px}
  .big{font-family:'Merriweather',Georgia,serif;font-size:30px;font-weight:700;
    line-height:1.25;max-width:24ch}
  .pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:10px}
  .pillar{border:1px solid var(--rule);border-radius:8px;padding:16px 12px;text-align:center}
  .pillar .n{font-family:'Merriweather',serif;font-size:13px;color:var(--accent);
    font-weight:700}
  .pillar .t{font-size:15px;font-weight:600;margin-top:6px}
  .arrow{text-align:center;color:var(--accent);font-size:15px;margin:10px 0 0}
  .num{font-family:'Merriweather',serif;color:var(--accent);font-weight:700;
    font-size:15px;letter-spacing:.14em}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch}
  .foot{position:absolute;bottom:16px;left:48px;font-size:12px;color:var(--muted);
    letter-spacing:.08em;text-transform:uppercase}
  @media(max-width:640px){.slide{padding:30px 24px}h1{font-size:34px}h2{font-size:26px}
    .pillars{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Dan Blank', h1:'Be the Gateway',
   lead:'How to grow your readership by connecting to a person, not an audience.',
   foot:'WeGrowMedia'},

  {t:'promise', eyebrow:'What this hour gives you',
   h2:'By the end of today you will know',
   bullets:['Why connection, not reach, is what actually grows a writing life.',
     'The one reframe that makes sharing your work feel human again.',
     'A simple path from a blank page to the readers who will love it.']},

  {t:'who', eyebrow:'Who this is for',
   h2:'You are a writer or creator who',
   bullets:['Has real work to share but feels invisible doing it.',
     'Wants readers, but hates the idea of "selling yourself".',
     'Is tired of chasing follower counts that never turn into anything.']},

  {t:'trap', eyebrow:'The trap',
   big:'You were told marketing means shouting louder at a bigger crowd. So you either shout, or you go quiet.'},

  {t:'reframe', eyebrow:'The reframe',
   h2:'You do not have a marketing problem.',
   lead:'You have a connection problem. And connection is something writers are already built for.'},

  {t:'section', num:'PART ONE', h2:'Why reach keeps failing you'},

  {t:'point', eyebrow:'The crowd myth',
   h2:'An audience is an abstraction.',
   p:'Nobody is moved by being one of ten thousand. A number cannot feel seen. When you market to an audience, you make work for no one in particular, and it lands that way.'},

  {t:'point', eyebrow:'The cost',
   h2:'Chasing reach burns the exact fuel you need.',
   p:'The energy you spend performing for strangers is energy you are not spending making the thing, or reaching the one reader who would carry it to the next ten.'},

  {t:'section', num:'PART TWO', h2:'Be the Gateway: the human-centered method'},

  {t:'point', eyebrow:'The core idea',
   big:'You are the gateway between your work and the reader. Your job is not to broadcast. It is to connect to a person.'},

  {t:'pillars', eyebrow:'The arc', h2:'How the shift actually happens',
   pillars:[['01','Identity'],['02','Habits'],['03','Systems'],['04','Audience'],['05','Growth']],
   note:'Growth is the last step, not the first. It is what happens after the other four are in place.'},

  {t:'point', eyebrow:'Step one: Identity', h2:'Know what you make and who it is for.',
   p:'Clarity Cards walk you through it: what you most want to create, the one reader it is for, and the next small step you can actually keep. Clarity comes before any tactic.'},

  {t:'point', eyebrow:'Step two: Habits', h2:'Name the Creativity Cave Trolls.',
   p:'The fears and quiet habits that stall the work. You name them, then you build anchor habits that are small enough to survive a busy week and keep you showing up.'},

  {t:'point', eyebrow:'Step three: Systems', h2:'Make connection repeatable.',
   p:'A simple, sustainable way to share and to listen, so reaching readers is no longer a mood you wait for. It becomes something your week already holds.'},

  {t:'point', eyebrow:'Step four: Audience', h2:'Find the readers who will love it.',
   p:'Not everyone. The right people. You build a Reader Connection Roadmap: a clear, customized plan for reaching and engaging your true readers, one real person at a time.'},

  {t:'point', eyebrow:'Step five: Growth', h2:'Let the work travel.',
   p:'When a reader feels genuinely met, they do the thing no ad can buy. They tell someone. Growth stops being a hustle and becomes a consequence of connection.'},

  {t:'section', num:'PART THREE', h2:'When connection replaces performance'},

  {t:'point', eyebrow:'The feeling that changes',
   big:'Sharing stops feeling like self-promotion and starts feeling like generosity.'},

  {t:'why', eyebrow:'Why trust this approach',
   h2:'Fifteen years, thousands of writers',
   p:'I have worked full-time with writers and creative people for over fifteen years, and with organizations like Penguin Random House, Hachette, and Sesame Workshop. I wrote the book Be the Gateway, and I have taught this human-centered approach to thousands of writers finding their readers.'},

  {t:'cta', eyebrow:'Your next step',
   h2:'Do this work with me, in a small group',
   p:'The Creative Shift Mastermind is a small cohort of writers moving through this whole arc together over three months, with daily prompts, weekly focus, and a private group. If today resonated, that is where we go deeper.',
   disc:'Educational only. Every writing life is different and individual results vary. Nothing here is a guarantee of audience size, sales, or income.',
   foot:'Dan Blank, WeGrowMedia'}
];

const deck = document.getElementById('deck');
function chrome(s){
  const g = '<div class="gateway"></div><div class="dots"><i></i><i></i><i></i></div>';
  const f = s.foot ? '<div class="foot">'+s.foot+'</div>' : '';
  return {g, f};
}
S.forEach(s=>{
  const {g,f} = chrome(s);
  let inner = '';
  if(s.eyebrow) inner += '<p class="eyebrow">'+s.eyebrow+'</p>';
  if(s.num) inner += '<p class="num">'+s.num+'</p>';
  if(s.h1) inner += '<h1>'+s.h1+'</h1>';
  if(s.h2) inner += '<h2>'+s.h2+'</h2>';
  if(s.lead) inner += '<p class="lead">'+s.lead+'</p>';
  if(s.big) inner += '<p class="big">'+s.big+'</p>';
  if(s.p) inner += '<p>'+s.p+'</p>';
  if(s.bullets){ inner += '<ul>'; s.bullets.forEach(b=> inner += '<li>'+b+'</li>'); inner += '</ul>'; }
  if(s.pillars){
    inner += '<div class="pillars">';
    s.pillars.forEach(p=> inner += '<div class="pillar"><div class="n">'+p[0]+'</div><div class="t">'+p[1]+'</div></div>');
    inner += '</div>';
    if(s.note) inner += '<p class="arrow">'+s.note+'</p>';
  }
  if(s.disc) inner += '<p class="disc">'+s.disc+'</p>';
  deck.insertAdjacentHTML('beforeend','<section class="slide">'+g+inner+f+'</section>');
});
</script>
</body>
</html>
