<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Steady Reset — John R. Christy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Titillium+Web:wght@400;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f4; --panel:#ffffff; --rule:#d3dee1;
    --accent:#0d749b; --ink:#14201f; --muted:#56696b;
    --head:"Titillium Web",system-ui,sans-serif; --body:"Lora",Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:900px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 50px;margin:0 0 26px;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(20,32,31,.03)}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.1;margin-bottom:16px}
  .sub{font-size:22px;color:var(--muted);margin-top:20px;line-height:1.4;font-style:italic}
  p.body{font-size:21px;line-height:1.55;color:var(--ink);max-width:40ch}
  .n{font-family:var(--head);font-weight:700;font-size:64px;color:var(--accent);
    line-height:1;margin-bottom:10px;opacity:.9}
  .step h2{margin-top:4px}
  .recap p{font-size:26px;line-height:1.7}
  .cta{background:var(--ink);border-color:var(--ink)}
  .cta .k{color:#6fc3dd}
  .cta h2,.cta p{color:#f3f8f9}
  .disc{font-family:var(--head);font-size:13px;color:#9fb6b9;margin-top:26px;line-height:1.5;max-width:60ch}
  .foot{font-family:var(--head);font-size:12px;color:var(--muted);letter-spacing:.04em;margin-top:28px}
  .tag{font-family:var(--head);font-size:12.5px;color:var(--muted);text-align:center;padding:10px 0 0}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<div class="tag">The Steady Reset &middot; a live masterclass by John R. Christy</div>
<script>
const S = [
  {t:"title", k:"A field manual for real pressure", h:"The Steady Reset",
   sub:"How to be the steadiest person in the room when the stakes are real."},
  {t:"who", k:"Who this is for", h:"Leaders who carry real responsibility",
   body:"The people who have to keep their head when more is on them than anyone else can see. You lead a team, a room, or a call where the decision actually matters."},
  {t:"trap", k:"The trap", h:"Your body moves before your mind does",
   body:"Under pressure you answer fast to make the feeling stop, and you call it being decisive. Most of the time it is not a decision. It is relief."},
  {t:"reframe", k:"The hard truth", h:"Certainty is often fear in a good suit",
   body:"Certainty feels like strength. Most of the time it is fear with a good argument. Being right feels like being ready. It is not."},
  {t:"part", k:"Part one", h:"The real problem is reactivity",
   body:"The weight is not what breaks leaders. Carrying it alone, and moving before you are ready, is what breaks them."},
  {t:"where", k:"Where this comes from", h:"Thirty years on the worst day of someone's life",
   body:"Firefighter-paramedic, captain, peer support team leader. Life-and-death calls on the street for three decades. The reset is what let me keep deciding clearly when it counted, and what I rebuilt in my own recovery."},
  {t:"part", k:"Part two", h:"The Steady Reset, five steps",
   body:"About five minutes. A debrief you can run alone or with your team in the middle of the pressure, not after it."},
  {t:"step", n:"01", h:"Physiological Reset",
   body:"Breathe in for four. Out for six. The longer exhale signals safety to your nervous system before any thinking begins. You cannot decide well from a hijacked body."},
  {t:"step", n:"02", h:"Name Reality",
   body:"Say only the facts out loud. Strip the story off them. The facts are almost always smaller than the flood."},
  {t:"step", n:"03", h:"Identify Your Single Action",
   body:"Not the ten things pulling at you. The single thing that is actually in your hands right now. Do that one."},
  {t:"step", n:"04", h:"The Golden Second",
   body:"Before a consequential move, pause and ask: am I moving because it is right, or because I cannot stand the feeling? That second is where leaders are made."},
  {t:"step", n:"05", h:"Share the Burden",
   body:"Tell one trusted person the real thing. Carrying it alone is the part that breaks people, not the weight."},
  {t:"concept", k:"A concept you will meet", h:"Meet Street John",
   body:"The part of you that kept you alive is not meant to run everything. Name it, thank it, and keep it out of the driver's seat when the decision needs calm."},
  {t:"concept", k:"A concept you will meet", h:"Your body knows first",
   body:"The early signal shows up in the body before the mind catches it. Reading it is a trained skill, not willpower."},
  {t:"part", k:"Part three", h:"When a team runs the reset together",
   body:"They disagree out loud before a bad call, not after it. Fewer reactive decisions. Faster alignment. Trust that holds when the pressure is on."},
  {t:"why", k:"Why me", h:"Field-tested, not motivational",
   body:"I do not teach composure from theory. I built this to survive the job and rebuilt it in recovery. It is a method you can run under real load, not a talk you forget by Monday."},
  {t:"recap", k:"The whole thing", h:"The five steps", cls:"recap",
   body:"Breathe. Name reality. Single action. The Golden Second. Share the burden."},
  {t:"cta", k:"Next step", h:"Bring the reset to your team", cls:"cta",
   body:"If you want the reset in your hands and your team's, book a discovery call and we will map it to your world.",
   disc:"Educational only. No income, role, outcome, or result is guaranteed. Results vary. The Steady Reset supports leadership decision-making and is not therapy or medical or mental-health treatment."}
];
const wrap = document.getElementById("wrap");
S.forEach(s => {
  const d = document.createElement("section");
  d.className = "slide" + (s.cls ? " " + s.cls : "") + (s.t === "step" ? " step" : "");
  let html = "";
  if (s.k) html += '<div class="k">' + s.k + '</div>';
  if (s.n) html += '<div class="n">' + s.n + '</div>';
  if (s.t === "title") {
    html += '<h1>' + s.h + '</h1>';
    if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  } else {
    html += '<h2>' + s.h + '</h2>';
    if (s.body) html += '<p class="body">' + s.body + '</p>';
  }
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  if (s.t === "cta") html += '<div class="foot">John R. Christy &middot; johnrchristy.com</div>';
  d.innerHTML = html;
  wrap.appendChild(d);
});
</script>
</body>
</html>
