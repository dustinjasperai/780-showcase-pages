<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 10 Universal Laws of Iconic Leadership — Karissa Adkins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f4f0;      /* warm ivory ground (brand evidence hex) */
    --panel:#ffffff;   /* body bg evidence */
    --ink:#33373d;     /* near-black evidence hex */
    --muted:#69727d;   /* muted grey evidence hex */
    --accent:#cc3366;  /* her signature rose, 46 uses */
    --gold:#b49360;    /* regal gold secondary, brand evidence */
    --rule:#e7ddd4;
    --head:'Playfair Display',Georgia,serif;
    --body:'Barlow',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(51,55,61,.03)}
  .slide.title{background:linear-gradient(180deg,#fff 0%,#faf6f2 100%);
    border-top:5px solid var(--accent);text-align:center;align-items:center}
  .kick{font:600 13px/1.4 var(--body);letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);margin-bottom:22px}
  .part-kick{color:var(--gold)}
  h1{font:700 52px/1.08 var(--head);letter-spacing:.01em;margin-bottom:18px}
  h2{font:600 38px/1.14 var(--head);margin-bottom:22px}
  .promise{font:500 22px/1.5 var(--head);color:var(--muted);max-width:640px}
  .present{margin-top:30px;font:600 15px/1.4 var(--body);letter-spacing:.04em;color:var(--ink)}
  p.body{font:400 20px/1.6 var(--body);color:#444;max-width:680px;margin-bottom:14px}
  ul{list-style:none;margin-top:8px}
  li{font:400 20px/1.5 var(--body);color:#3a3f45;padding:12px 0 12px 34px;position:relative;
    border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .law{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule)}
  .law:last-child{border-bottom:none}
  .law .num{font:700 30px/1 var(--head);color:var(--gold);min-width:52px}
  .law .txt{font:500 20px/1.4 var(--body)}
  .law .txt small{display:block;font:400 16px/1.5 var(--body);color:var(--muted);margin-top:4px}
  .part h2{color:var(--accent)}
  .cta{background:linear-gradient(180deg,#fff 0%,#f7eef1 100%);border-top:5px solid var(--accent);
    text-align:center;align-items:center}
  .btn{display:inline-block;margin-top:18px;background:var(--accent);color:#fff;font:600 17px/1 var(--body);
    padding:18px 34px;border-radius:999px;letter-spacing:.02em}
  .disclaimer{margin-top:30px;font:400 13px/1.6 var(--body);color:var(--muted);max-width:620px}
  .pg{font:600 12px/1 var(--body);color:var(--muted);letter-spacing:.14em;margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', k:'A Live Masterclass', h:'The 10 Universal Laws of Iconic Leadership',
   promise:'Why identity, not tactics, is what actually scales a woman’s business.',
   present:'With Karissa Adkins, founder of Alpha Queen Collective'},

  {t:'body1', k:'Today', h:'What we are going to do in the next hour',
   body:['Name the real reason your growth feels capped, in plain language.',
         'Walk a working subset of the 10 Universal Laws of Iconic Leadership.',
         'Leave with one identity shift you can make this week, before any new tactic.']},

  {t:'who', k:'Who this is for', h:'You already lead. You are ready to lead at a higher level.',
   items:[
     'You run a coaching or consulting business and you are good at the work.',
     'You have bought the courses and watched the launches, and something still feels capped.',
     'You want confidence, sales and leadership to feel like who you are, not a role you perform.']},

  {t:'trap', k:'The trap', h:'You were told it was a tactics problem.',
   body:['So you bought another funnel, another launch plan, another content calendar.',
         'The feed is full of it. Build the course. Batch the reels. Run the webinar.',
         'You did the work, and the ceiling did not move. That is the tell.']},

  {t:'reframe', k:'The hard truth', h:'The ceiling was never the strategy.',
   body:['The next level does not ask for more tactics. It asks for a different woman to run them.',
         'When your identity and self image lag behind your ambition, you quietly protect the version of you that feels safe. You underprice. You hedge. You wait to be ready.',
         'Tactics cannot out run an identity that is playing small.']},

  {t:'part', k:'Part One', h:'The identity ceiling'},
  {t:'body2', k:'Part One', h:'What an identity ceiling actually looks like',
   items:[
     'You discount your own offer before the client ever could.',
     'You chase approval in rooms you have already outgrown.',
     'You treat selling as something you do to people instead of for them.',
     'You wait for permission that is never coming.']},
  {t:'body1', k:'Part One', h:'The myth that keeps you stuck',
   body:['The myth is that the next tool will finally unlock it.',
         'So the search becomes the comfort. One more program, one more framework, one more guru.',
         'The search lets you feel like you are working on it while the real work stays untouched.']},
  {t:'body1', k:'Part One', h:'Why more information will not fix it',
   body:['You do not have an information gap. You have an identity gap.',
         'Every woman who scales past this point rebuilt her self image on purpose, not by accident.',
         'That rebuild is teachable. It follows laws. That is what the next section is.']},

  {t:'part', k:'Part Two', h:'The 10 Universal Laws of Iconic Leadership'},
  {t:'laws', k:'Part Two', h:'The laws that govern how iconic women rise',
   note:'A working subset we will go deep on today.',
   laws:[
     ['I','Identity leads strategy','Who you are becoming decides which tactics can even work.'],
     ['II','Sovereignty over approval','You stop outsourcing your worth to the room.'],
     ['III','Wealth is neutral','Money stops being charged, so you can ask and receive cleanly.'],
     ['IV','Sell from embodiment','You sell as a service, from presence, not from scripts and pressure.'],
     ['V','Lead the room you want to enter','You hold the standard of the next level before you arrive.'],
     ['VI','Expansion is the default','Growth becomes the baseline, not the exception you brace for.']]},

  {t:'body1', k:'Part Two', h:'Law I in practice: Identity before strategy',
   body:['Before we touch an offer or a funnel, we name the woman who runs them with ease.',
         'This is the Alpha Queen Activation System. We shift self image first, then the strategy you already know starts to convert.']},
  {t:'body1', k:'Part Two', h:'Law II in practice: Sovereignty over approval',
   body:['Approval seeking is expensive. It shows up as hedged offers, soft prices and slow decisions.',
         'Sovereignty is the opposite posture. You make the call, you hold the standard, and you stop waiting for the room to agree first.']},
  {t:'body1', k:'Part Two', h:'Law IV in practice: Selling from embodiment',
   body:['High offers do not close on better scripts. They close on a seller who is settled.',
         'The Million Dollar Sales Matrix is how a woman founder holds a 10K to 100K conversation from presence instead of pressure.']},

  {t:'part', k:'Part Three', h:'Your Alpha Queen era, in practice'},
  {t:'body2', k:'Part Three', h:'When the queen leads',
   items:[
     'You price to your value and feel calm saying the number.',
     'You lead your clients and your team from standards, not from fear.',
     'Wealth becomes neutral. Power becomes safe. Expansion becomes inevitable.',
     'The strategy you already own finally does what it promised.']},
  {t:'body1', k:'Part Three', h:'Identity first, then the income',
   body:['Notice the order. The income follows the identity, never the other way around.',
         'This is why two women run the same playbook and get different results. One rebuilt who she is first.']},

  {t:'why', k:'Why Karissa', h:'Why learn this from me',
   body:['I spent twenty plus years in corporate marketing, business development and sales before I built Alpha Queen Collective into a seven figure brand.',
         'I have taught sales and marketing to hundreds of coaches and mentored thousands of women through the exact identity work in these laws.',
         'I am an Identity and Self Image Architect, and this is the whole of what I do.']},

  {t:'cta', k:'Your next step', h:'Step into your Alpha Queen era',
   body:'If this is the level you are ready for, the next step is a short Clarity Call to see whether the ICONIC Leadership Mastermind is your room.',
   btn:'Book your Clarity Call',
   disclaimer:'This masterclass is for education only. It is not a guarantee of income or business results. Outcomes vary and depend on your own effort, market and circumstances.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach(function(s,i){
  const d=el('div','slide '+(s.t==='title'?'title':(s.t==='cta'?'cta':(s.t==='part'?'part':''))));
  if(s.k){const kk=el('div','kick'+(s.t==='part'?' part-kick':''),s.k);d.appendChild(kk);}
  if(s.t==='title'){d.appendChild(el('h1',null,s.h));d.appendChild(el('div','promise',s.promise));d.appendChild(el('div','present',s.present));}
  else if(s.t==='part'){d.appendChild(el('h2',null,s.h));}
  else if(s.t==='cta'){d.appendChild(el('h2',null,s.h));d.appendChild(el('p','body',s.body));d.appendChild(el('span','btn',s.btn));d.appendChild(el('div','disclaimer',s.disclaimer));}
  else if(s.t==='laws'){
    d.appendChild(el('h2',null,s.h));
    if(s.note)d.appendChild(el('p','body',s.note));
    s.laws.forEach(function(l){const row=el('div','law');row.appendChild(el('div','num',l[0]));
      row.appendChild(el('div','txt',l[1]+'<small>'+l[2]+'</small>'));d.appendChild(row);});
  }
  else{
    d.appendChild(el('h2',null,s.h));
    if(s.body)s.body.forEach(function(p){d.appendChild(el('p','body',p));});
    if(s.items){const ul=el('ul');s.items.forEach(function(it){ul.appendChild(el('li',null,it));});d.appendChild(ul);}
  }
  d.appendChild(el('div','pg','ALPHA QUEEN COLLECTIVE   '+(i+1)+' / '+S.length));
  deck.appendChild(d);
});
</script>
</body>
</html>
