<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Lead Yourself First · Kevin DeShazo · Be Better Leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F8FBF9; --panel:#ECF3EE; --deep:#0C1512; --rule:#123B29;
    --acc:#75f3a2; --ink:#0C1512; --chalk:#EAF3EE; --grey:#4A574F; --dim:#8A968F;
  }
  html,body{height:100%}
  body{background:#0a100d;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a100d}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Hanken Grotesk',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--rule);margin-bottom:2.4vh}
  h1{font-family:'Archivo',sans-serif;font-weight:700;color:var(--ink);line-height:1.08;letter-spacing:-.018em}
  .t-title h1{font-size:5.2vw;max-width:92%;font-weight:800}
  .t-normal h1{font-size:3.25vw;max-width:85%}
  .t-normal .body{font-family:'Hanken Grotesk',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:75%;line-height:1.55;font-weight:400}
  .sub{font-family:'Hanken Grotesk',sans-serif;font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Hanken Grotesk',sans-serif;font-size:1.3vw;font-weight:700;color:var(--rule);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:5.0vw;max-width:90%;font-weight:800}
  .t-section .rule{width:16vw;height:6px;background:var(--acc);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:var(--deep);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-weight:600;color:var(--chalk);letter-spacing:-.01em}
  .t-dark h1 .a{color:var(--acc)}
  .t-cta{background:var(--deep);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--chalk)}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--chalk);border-radius:100px;padding:1.3vh 1.8vw;font-size:1.2vw;font-weight:600;letter-spacing:.01em}
  .chip.solid{background:var(--acc);color:var(--deep)}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Hanken Grotesk',sans-serif;font-size:.9vw;color:var(--dim);font-style:normal;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-cta .disc{color:#5f6d64}
  .brandline{font-family:'Hanken Grotesk',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.6vh;font-weight:500;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--rule);font-weight:700}
  .court-motif{position:absolute;pointer-events:none}
  .title-court{right:6.5%;bottom:7%;width:22vw;opacity:.9}
  .corner-court{right:6%;bottom:7%;width:10vw;opacity:.55}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(18,59,41,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Hanken Grotesk',sans-serif;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Hanken Grotesk',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Hanken Grotesk',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}.brandline{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">BE BETTER LEADERS</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a whiteboard play reframed, the leader is the node at the center of the system -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="court" viewBox="0 0 200 140">
  <g fill="none" stroke="#123B29" stroke-width="2.2" stroke-linecap="round">
    <rect x="10" y="10" width="180" height="120" rx="6" opacity=".45"/>
    <line x1="100" y1="10" x2="100" y2="130" opacity=".3"/>
    <path d="M40 118 C60 92 78 92 100 70" stroke-dasharray="3 6"/>
    <path d="M160 118 C140 92 122 92 100 70" stroke-dasharray="3 6"/>
    <path d="M100 40 L100 70" />
    <path d="M92 52 L100 40 L108 52"/>
  </g>
  <circle cx="100" cy="70" r="6" fill="#75f3a2" stroke="#123B29" stroke-width="2"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Lead Yourself First',sub:'How to build a championship culture that holds, in the age of NIL, the portal, and constant change. For coaches and athletic directors.',brand:true,court:'title'},
 {t:'normal',k:'Who this is for',title:'You have the talent, the schemes, the facilities. The culture still feels fragile.',body:'Rosters turn over every year. Buy-in resets every August. One bad stretch, one locker-room rumor, one transfer-portal exit, and the room you spent a season building can crack in a week.'},
 {t:'dark',title:'You cannot out-recruit or out-scheme a culture that starts with a leader running on <span class="a">empty</span>.'},

 {t:'section',idx:'Part One',title:'Why Culture Breaks'},
 {t:'normal',k:'The whiteboard trap',title:'Culture is not a slogan on the locker-room wall.',body:'Values posters, mission statements, a fired-up speech in August. They slide right off by October, because they were never modeled by the person holding the marker. Players do not do what you say. They copy what you are.'},
 {t:'normal',k:'The mirror test',title:'Your program will not out-grow the way you lead yourself.',body:'A coach who is anxious, reactive, and depleted transmits exactly that, no matter what the plan on the board says. The room reads your regulation before it hears your words. Fix the source, and the culture stops leaking.'},
 {t:'dark',title:'Real change does not start with the playbook. It starts with the <span class="a">person holding it</span>.'},

 {t:'section',idx:'Part Two',title:'The BETTER System'},
 {t:'normal',k:'Lead yourself first',title:'Before you lead the room, lead the person in the mirror.',body:'Self-leadership is the daily work under the visible work: resolve, emotional regulation, and a clear sense of who you are when the scoreboard is against you. Get that steady, and everything you build on top of it holds.'},
 {t:'normal',k:'Think and communicate better',title:'Communication is the culture, one hard conversation at a time.',body:'Trust in the locker room is not built at the team meeting. It is built in the bench conversation, the correction, the moment you tell a player the truth and they still feel valued. Clear, calm, direct, repeatable.'},
 {t:'normal',k:'Perform under pressure',title:'Turn stress into fuel, and adversity into an advantage.',body:'NIL, the portal, conference realignment, a losing streak. The pressure is not going away. The BETTER System trains a leader to metabolize it into focus instead of leaking it onto the team on the worst possible night.'},
 {t:'normal',k:'Better, every single day',title:'Think better. Lead better. Communicate better. Perform better.',body:'BETTER is a verb before it is a result. Not a one-time retreat or a motivational high, but a small, repeatable discipline you run every day. Often inconvenient. That is exactly why most programs never build it.'},
 {t:'dark',title:'Getting better is often inconvenient. It is <span class="a">always worth it</span>.'},

 {t:'section',idx:'Part Three',title:'What This Builds'},
 {t:'normal',k:'The program this builds',title:'A locker room that holds when everything else is moving.',body:'Players who buy in because they trust the person leading them. A staff that is aligned instead of guessing. A culture that survives roster turnover because it lives in people and habits, not in a poster that gets taken down in May.'},
 {t:'dark',title:'You do not build a championship culture from a whiteboard. You build it from the <span class="a">inside out</span>.'},
 {t:'normal',k:'Why Kevin, why Be Better Leaders',title:'Taught by someone in the room with championship programs.',body:'Kevin DeShazo is the bestselling author of Lead Yourself First, a certified Mental Performance Mastery coach who has presented on 400+ campuses and at the NCAA Convention, and the builder of the Culture Playbook now used by 1,200+ programs.'},

 {t:'section',idx:'Your Next Step',title:'Keep Getting Better'},
 {t:'normal',k:'Inside the Culture Playbook',title:'A private room for coaches and ADs who take culture seriously.',body:'Proven culture playbooks, live coaching calls, courses on leadership, mindset and performance, and a community of coaches who are done piecing together generic advice from random sources. The system behind 1,200+ programs.'},
 {t:'cta',title:'Ready to build a culture from the inside out?',chips:['Join the Culture Playbook','Start with the free newsletter'],disc:'Educational content for coaches and athletic directors. No wins, recruiting, or performance result is guaranteed. Outcomes vary by program, staff, and effort.'},
];

const deck=document.getElementById('deck');
function court(kind){return `<svg class="court-motif ${kind==='title'?'title-court':'corner-court'}" viewBox="0 0 200 140"><use href="#court"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">BE BETTER LEADERS &middot; <b>Kevin DeShazo</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map((c,ci)=>`<div class="chip${ci===0?' solid':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.court) h+=court(s.court);
  else if(s.t==='title') h+=court('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
