<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 25-Hour Workweek · Brooke Plack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf6f1; --panel:#f3eae6; --rule:#e5d8d3;
    --ink:#2f2f3f; --accent:#c25a76; --accent-deep:#9c3f5c; --muted:#61616f;
  }
  html,body{height:100%}
  body{background:#efe7df;font-family:'Mulish',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#efe7df}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Mulish',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.08;letter-spacing:.002em}
  .t-title h1{font-size:5.4vw;max-width:94%}
  .t-normal h1{font-size:3.5vw;max-width:88%}
  .t-normal .body{font-size:1.46vw;color:var(--muted);margin-top:2.6vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-size:1.58vw;color:var(--muted);margin-top:3.2vh;max-width:84%;line-height:1.54;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Mulish',sans-serif;font-size:1.24vw;font-weight:700;color:var(--accent-deep);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:5vw;max-width:92%}
  .t-section .rule{width:16vw;height:4px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:#2b2532;align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:90%;font-style:italic;font-weight:500;color:#f7efe9}
  .t-cta{background:radial-gradient(140% 140% at 50% 0%,#3a3040 0%,#241d2b 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:90%;color:#f9f2ec;font-weight:600}
  .t-cta .sub{color:#e6d5cf}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.6px solid var(--accent);color:#f4cdd6;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.18vw;font-weight:600}
  .steps{display:flex;gap:0;margin-top:3.6vh;flex-wrap:wrap;max-width:96%}
  .step{display:flex;align-items:center;font-size:1.08vw;font-weight:600;color:var(--ink)}
  .step .n{display:inline-flex;align-items:center;justify-content:center;width:2.2vw;height:2.2vw;border-radius:50%;background:var(--accent);color:#fff;font-size:1vw;margin-right:.7vw}
  .step .arw{color:var(--accent-deep);margin:0 .9vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:#9a8f92;font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#c7b6b0}
  .motif{position:absolute;pointer-events:none;opacity:.95}
  .title-motif{right:7.4%;bottom:9%;width:19vw}
  .corner-motif{right:6.2%;bottom:7.6%;width:8.2vw;opacity:.55}
  .brandline{font-size:1.22vw;color:var(--muted);margin-top:3.4vh;font-weight:500;letter-spacing:.01em}
  .brandline b{color:var(--accent-deep);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(47,47,63,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8.4vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.6vw}.chip{font-size:2.6vw}.step{font-size:2.6vw}.step .n{width:5vw;height:5vw;font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Brooke Plack</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a clock face with one protected arc - the reclaimed hours made visible -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="clk" viewBox="0 0 200 200">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="72" stroke="#61616f" stroke-width="2.4" opacity="0.34"/>
    <path d="M100 100 L100 34 A66 66 0 0 1 157 71 Z" fill="#c25a76" opacity="0.16"/>
    <path d="M100 34 A66 66 0 0 1 157 71" stroke="#c25a76" stroke-width="4" opacity="0.9"/>
    <line x1="100" y1="100" x2="100" y2="52" stroke="#2f2f3f" stroke-width="3.4" opacity="0.9"/>
    <line x1="100" y1="100" x2="138" y2="112" stroke="#9c3f5c" stroke-width="3.4" opacity="0.9"/>
    <circle cx="100" cy="100" r="5" fill="#2f2f3f"/>
    <circle cx="100" cy="34" r="3.4" fill="#c25a76"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The 25-Hour Workweek',sub:'A live masterclass for women who built a 6 or 7-figure business: how to run the whole thing in about 25 hours a week and step back from the day to day, without it falling apart the moment you do.',brand:true,motif:'title'},

 {t:'normal',k:'Who this is for',title:'You built the business. You hit the goals. So why does it still feel harder than it should?',body:'You are the founder other founders ask for advice. The revenue is real, the team is real, the reputation is real. And you are still the person the whole thing runs through, still answering messages on a Sunday, still the reason it works. From the outside it looks like freedom. From the inside it feels like a job you can never clock out of.'},
 {t:'dark',title:'You do not have a revenue problem. You have an operating problem wearing a success story.'},

 {t:'section',idx:'Part One',title:'Why Success Stops Feeling Like Freedom'},
 {t:'normal',k:'The founder is the bottleneck',title:'The business grew. Your role never did.',body:'You still make most of the decisions, hold most of the context, and get pulled into most of the fires. Growth added people and revenue, but it did not remove you from the middle. So the bigger it gets, the more of you it needs, and the less of your life you get back.'},
 {t:'normal',k:'The busy trap',title:'A full calendar is not the same as a working business.',body:'Most owners measure the week in hours worked and things handled. But being needed for everything is not a sign the business is healthy. It is a sign the business cannot run without you standing in the middle of it. Hard work built this. More hard work will not free you from it.'},
 {t:'normal',k:'High-income burnout',title:'When you quietly start to resent the thing you built.',body:'It is a specific kind of tired: the money is good, so you feel you have no right to be exhausted, so you say nothing and push harder. That is high-income burnout. It is not a character flaw and it is not fixed by a vacation. It is fixed by changing how the business is built to hold you.'},
 {t:'dark',title:'The goal was never to work less at a business you hate. It was to love a business that runs without you.'},

 {t:'section',idx:'Part Two',title:'The 25-Hour Workweek System'},
 {t:'normal',k:'The idea',title:'Design the business around the life first, then fit the work inside it.',body:'Most owners do it backwards: they let the business take whatever it wants and try to protect scraps of life around the edges. The 25-Hour Workweek System reverses it. You decide the hours and the role you actually want, then build the operating system that makes the business run inside those hours, on purpose.'},
 {t:'normal',k:'Pillar one',title:'The Executive Time System: protect the hours only you can spend.',body:'Not every hour is equal. A handful of them are yours alone, the decisions and direction nobody else can make. We block those first and defend them, then time-block the rest of the week around them so the calendar runs you toward the important work instead of away from it. This is how you stop working weekends without dropping a single ball.'},
 {t:'normal',k:'Pillar two',title:'Step back from daily operations in 90 days.',body:'Stepping back is not one big handoff you brace for. It is a 90-day sequence: name what only you can do, build the rhythm and the people to carry the rest, and hand it over in deliberate stages so nothing breaks. Done in order, the business keeps running while you slowly remove yourself from the middle of it.'},
 {t:'normal',k:'Pillar three',title:'The 6 and 7-Figure Formula: pay the owner like the business exists for her.',body:'A business that cannot pay its founder well is not a success you can keep. We look at the real numbers and answer the question most owners avoid: how much should you actually pay yourself, and what does the business need to produce to make that normal. The business is supposed to fund your life, not consume it.'},
 {t:'normal',k:'The four moves',title:'Underneath it, the same four moves, run on repeat.',body:'The system is not complicated. It is these four, done consistently, until the business holds a shape it did not have before.',steps:['Protect the time','Build the rhythm','Hand it off','Pay the owner']},
 {t:'dark',title:'GRIT is just getting real in the trenches: honest about what only you can do, and honest about what you are finally ready to let go.'},

 {t:'section',idx:'Part Three',title:'What The 25-Hour Week Looks Like'},
 {t:'normal',k:'The week this builds',title:'The business keeps running on the days you are not in it.',body:'Decisions get made without waiting on you. The team knows the rhythm because the rhythm is built, not held in your head. You spend your protected hours on the few things only you can do, and the rest of the week is actually yours. Stepping away for a week stops being a risk you manage and starts being a thing you just do.'},
 {t:'normal',k:'Why me',title:'I have built and run the businesses, not just talked about them.',body:'I am a founder and small-business owner who built companies across childcare, coworking, and community, and I coach 6 and 7-figure women through the same shift I had to make myself: from being needed for everything to building something that runs without me. Every part of this system was tested inside real businesses with real payrolls before it ever became a lesson.'},

 {t:'section',idx:'Your Next Step',title:'Run The Business In 25 Hours'},
 {t:'cta',title:'Ready to build a business that runs without you in the middle of it?',sub:'Book a call with me to map your own 25-hour week and the 90-day step-back for your business, or start with the Navigating Personal Growth podcast and my weekly emails.',chips:['Book a call with Brooke','Start with Navigating Personal Growth'],disc:'Educational content for business owners. No specific income, revenue, or outcome is guaranteed. Results vary by business, effort, and circumstances.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#clk"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.steps) h+=`<div class="steps">`+s.steps.map((c,j)=>`<div class="step"><span class="n">${j+1}</span>${c}</div>`+(j<s.steps.length-1?`<span class="arw">&rarr;</span>`:``)).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">Navigating Personal Growth &middot; <b>Brooke Plack</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
