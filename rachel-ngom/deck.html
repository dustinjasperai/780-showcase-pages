<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Building on God's Blueprint - A Kingdom Business Masterclass with Rachel Ngom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1a1a;
    --panel:#23201c;
    --rule:#3a342c;
    --ink:#f9f6f2;
    --muted:#c7beb0;
    --accent:#c9a96e;
    --coral:#ef4155;
    --head:'Fjalla One', sans-serif;
    --body:'Inter', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1000px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px;
    margin:0 0 26px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);
  }
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--head);font-weight:400;font-size:clamp(34px,5.4vw,60px);line-height:1.04;letter-spacing:.01em}
  h2{font-family:var(--head);font-weight:400;font-size:clamp(28px,4vw,44px);line-height:1.08}
  .promise{font-family:var(--body);font-size:clamp(17px,2.1vw,22px);color:var(--muted);margin-top:22px;max-width:40ch;line-height:1.5}
  .body{font-size:clamp(16px,1.9vw,20px);line-height:1.6;color:var(--ink);margin-top:18px;max-width:52ch}
  .body.muted{color:var(--muted)}
  ul.list{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:60ch}
  ul.list li{padding-left:30px;position:relative;font-size:clamp(15px,1.8vw,19px);line-height:1.5}
  ul.list li::before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .step{display:flex;gap:22px;align-items:baseline;margin-top:8px}
  .step .n{font-family:var(--head);font-size:clamp(40px,7vw,80px);color:var(--accent);line-height:.9}
  .big{font-family:var(--head);font-size:clamp(30px,4.6vw,52px);line-height:1.05;margin-top:6px}
  .accent{color:var(--accent)}
  .coral{color:var(--coral)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:26px}
  .trap{border:1px solid var(--rule);border-radius:10px;padding:22px;background:rgba(0,0,0,.18)}
  .trap h3{font-family:var(--head);font-weight:400;font-size:22px;color:var(--ink);margin-bottom:8px}
  .trap p{color:var(--muted);font-size:15px;line-height:1.5}
  .third{margin-top:22px;border:1px solid var(--accent);border-radius:10px;padding:22px;background:rgba(201,169,110,.08)}
  .third h3{font-family:var(--head);font-weight:400;font-size:24px;color:var(--accent)}
  .stat{display:flex;gap:40px;flex-wrap:wrap;margin-top:28px}
  .stat div .v{font-family:var(--head);font-size:clamp(30px,4.4vw,48px);color:var(--accent)}
  .stat div .l{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:6px}
  .pagefoot{max-width:1000px;margin:0 auto;padding:0 24px 60px;color:var(--muted);font-size:13px;text-align:center}
  .disc{color:var(--muted);font-size:13px;line-height:1.5;margin-top:26px;max-width:60ch}
  .cta h1{max-width:20ch}
  .cta .do{display:inline-block;margin-top:26px;font-family:var(--head);font-size:22px;color:var(--bg);background:var(--accent);padding:14px 26px;border-radius:8px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="pagefoot">Called to Build International &middot; Rachel Ngom &middot; A Kingdom business masterclass</div>
<script>
const S = [
  {t:'title',
    kicker:'A Kingdom Business Masterclass with Rachel Ngom',
    h:'Building on God’s Blueprint',
    promise:'How to build a high-ticket, Kingdom-funding business without hustle culture or New Age shortcuts.'},

  {t:'list',
    kicker:'Who this is for',
    h:'You already said yes to the calling.',
    body:'This is for the Christian entrepreneur who is already in motion, and still feels stuck:',
    list:[
      'You have a business and you are making some money, but the fruit does not match the labor.',
      'You have been posting, launching, and learning, yet there is still no clear plan that works.',
      'You are tired of strategies that feel manipulative or hype driven.',
      'You believe business can be ministry, and you refuse to compromise your faith to grow.'
    ]},

  {t:'two',
    kicker:'The trap',
    h:'Right now you are caught between two traps.',
    trapA_h:'Trap one: Hustle culture',
    trapA_p:'More content, more launches, more hours, more caffeine. The world says grind harder, so you do, until your health, your marriage, or your joy starts to crack.',
    trapB_h:'Trap two: Christian-flavored New Age',
    trapB_p:'Manifesting. Scripting. Calling in your ideal client. It sounds spiritual, but it is not rooted in Scripture, and something about it feels off.'},

  {t:'reframe',
    kicker:'The real problem',
    h:'Neither trap leads where God is taking you.',
    body:'The problem is not your effort and it is not your faith. You have been building without a blueprint. There is a third way, and it starts with letting God lead your business the way He leads everything else.'},

  {t:'quote',
    kicker:'The shift',
    big:'God is the <span class="accent">CEO</span>. You are the <span class="accent">steward</span>.',
    body:'Kingdom entrepreneurship is not hustle and it is not manifestation. It is stewardship. You stop chasing every opportunity, because good is the enemy of called.'},

  {t:'part',
    kicker:'Part one',
    h:'The core problem: you are building on everybody else’s blueprint.',
    body:'When the plan is borrowed from the loudest voice in the feed, more effort just gets you more of the wrong thing, faster. A blueprint built on the right foundation changes what your effort produces.'},

  {t:'list',
    kicker:'The cost of no blueprint',
    h:'What building without a blueprint actually costs you.',
    list:[
      'Years of effort that never compound into anything that lasts.',
      'A business so tied to you that stepping away means it stops.',
      'A quiet resentment toward the calling you once felt so sure about.',
      'The sense that you are busy, but you are not actually being faithful.'
    ]},

  {t:'part',
    kicker:'Part two',
    h:'The Kingdom Legacy Method',
    body:'Four steps that take you from calling to a business that outlasts you. This is the framework we build everything on.'},

  {t:'step',
    kicker:'Step one',
    n:'1',
    big:'Lead',
    body:'Get clarity on what God has actually called you to build, and stop chasing every opportunity that comes your way. Good is the enemy of called.'},

  {t:'step',
    kicker:'Step two',
    n:'2',
    big:'Launch',
    body:'Package what you know into one clear high-ticket offer that sells, priced at what it is worth and positioned for the people who need it most.'},

  {t:'step',
    kicker:'Step three',
    n:'3',
    big:'Leverage',
    body:'Set up systems so your business does not depend on you being online every hour. Build something that works even when you are not working.'},

  {t:'step',
    kicker:'Step four',
    n:'4',
    big:'Legacy',
    body:'Build something that outlasts you: generational wealth, Kingdom impact, and a business that blesses your family and community for decades.'},

  {t:'list',
    kicker:'The four pillars',
    h:'How the method gets built, over six months.',
    list:[
      'Kingdom Foundation and Leadership: clarify your calling, your leadership mindset, and who you are for.',
      'High-Ticket Offers and Sales: build premium offers and master sales conversations rooted in service.',
      'Stewardship and Scalable Systems: profit-first financials, simple systems, and a hiring roadmap.',
      'Community and Accountability: you were never meant to build this alone.'
    ]},

  {t:'quote',
    kicker:'The principle underneath it',
    big:'Built to <span class="accent">duplicate</span>, not built to drain you.',
    body:'Everything in the method is designed to scale without requiring your personal presence in every task. That is what makes room for legacy instead of just more hustle.'},

  {t:'part',
    kicker:'Part three',
    h:'A week inside a Kingdom-funding business.',
    body:'One clear high-ticket offer instead of ten scattered ones. A calendar with room to breathe. Revenue that funds your family and the Kingdom, from a business that is built to duplicate, not built to drain you.'},

  {t:'quote',
    kicker:'The objection',
    big:'Charging high-ticket is not unspiritual. <span class="accent">Underpricing your calling is.</span>',
    body:'When your offer is worth it, premium pricing is how you serve deeply, stay out of hustle, and have margin to give.'},

  {t:'why',
    kicker:'Why listen to me',
    h:'I built it the world’s way first. Then I laid it down.',
    body:'I went from food stamps and a negative four hundred dollar bank account to a seven figure online education company by thirty four, working about twenty hours a week. In 2023 God told me to lay most of it down, so I did, and I rebuilt it on Scripture. Now I teach what I rebuilt.',
    stat:[['7 figures','by age 34'],['~20 hrs','work week'],['580+','podcast episodes'],['10,000+','courses sold']]},

  {t:'recap',
    kicker:'The whole thing in one line',
    big:'Lead. Launch. Leverage. <span class="accent">Legacy.</span>',
    body:'Build on God’s blueprint, not the world’s, and let your business fund the calling instead of consuming it.'},

  {t:'cta',
    kicker:'Your next step',
    h:'You were called to build. Now let’s build it right.',
    body:'If you are ready for the blueprint, the community, and the accountability to actually execute it, the next step is to apply for the Called to Build Academy and start the work.',
    cta:'Apply for the Called to Build Academy',
    disc:'Educational content only. No income, role, or result is guaranteed. Results vary based on effort, market, and the work you put in. This masterclass teaches a framework; it is not a promise of earnings.'}
];

const deck = document.getElementById('deck');
function esc(x){return x==null?'':x;}
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.t==='title'){ h+='<h1>'+esc(s.h)+'</h1>'; if(s.promise) h+='<p class="promise">'+esc(s.promise)+'</p>'; }
  else if(s.t==='two'){
    h+='<h2>'+esc(s.h)+'</h2>';
    h+='<div class="two"><div class="trap"><h3>'+esc(s.trapA_h)+'</h3><p>'+esc(s.trapA_p)+'</p></div>';
    h+='<div class="trap"><h3>'+esc(s.trapB_h)+'</h3><p>'+esc(s.trapB_p)+'</p></div></div>';
    h+='<div class="third"><h3>There is a third way.</h3></div>';
  }
  else if(s.t==='step'){
    h+='<div class="step"><div class="n">'+esc(s.n)+'</div><div><div class="big">'+esc(s.big)+'</div></div></div>';
    if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
  }
  else if(s.t==='quote'||s.t==='recap'){
    h+='<div class="big">'+esc(s.big)+'</div>';
    if(s.body) h+='<p class="body muted">'+esc(s.body)+'</p>';
  }
  else if(s.t==='why'){
    h+='<h2>'+esc(s.h)+'</h2>';
    if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
    if(s.stat){ h+='<div class="stat">'; s.stat.forEach(p=>{ h+='<div><div class="v">'+esc(p[0])+'</div><div class="l">'+esc(p[1])+'</div></div>'; }); h+='</div>'; }
  }
  else if(s.t==='cta'){
    h+='<h1>'+esc(s.h)+'</h1>';
    if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
    if(s.cta) h+='<span class="do">'+esc(s.cta)+'</span>';
    if(s.disc) h+='<p class="disc">'+esc(s.disc)+'</p>';
  }
  else { // list, reframe, part
    if(s.h) h+='<h2>'+esc(s.h)+'</h2>';
    if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
    if(s.list){ h+='<ul class="list">'; s.list.forEach(li=>{ h+='<li>'+esc(li)+'</li>'; }); h+='</ul>'; }
  }
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
