<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Art of Philanthropic Advising - A Daylight Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF6EC;        /* warm daylight paper */
    --panel:#FFFDF6;     /* near-white card */
    --rule:#E6D9B8;      /* soft gold rule */
    --ink:#2A2320;       /* warm near-black */
    --muted:#6E6354;     /* warm grey ink */
    --accent:#960F70;    /* brand plum */
    --gold:#FEC907;      /* brand gold */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:34px;line-height:1.14;
    margin-bottom:16px}
  .sub{font-family:'Newsreader',Georgia,serif;font-style:italic;font-size:22px;color:var(--muted);
    line-height:1.35;margin-bottom:14px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin-bottom:14px;max-width:66ch}
  p.muted{color:var(--muted)}
  ul{list-style:none;margin:10px 0 6px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:21px;width:10px;height:10px;
    background:var(--gold);border-radius:2px;transform:rotate(45deg)}
  li b{font-weight:600}
  .big{font-family:'Newsreader',Georgia,serif;font-size:64px;font-weight:600;color:var(--accent);
    line-height:1;margin-bottom:10px}
  .cover{background:linear-gradient(160deg,#FFFDF6 0%,#FBEFC9 100%)}
  .cover h1{font-size:54px}
  .brandline{display:flex;align-items:center;gap:10px;margin-top:28px;font-weight:600;
    letter-spacing:.04em;color:var(--ink)}
  .dot{width:14px;height:14px;background:var(--gold);border-radius:50%;box-shadow:0 0 0 4px rgba(254,201,7,.28)}
  .pill{display:inline-block;background:rgba(150,15,112,.08);color:var(--accent);font-weight:600;
    font-size:14px;padding:6px 14px;border-radius:999px;margin-bottom:20px}
  .cta{background:linear-gradient(160deg,#2A2320 0%,#4A2240 100%);color:#FBF4E2}
  .cta::before{background:var(--gold)}
  .cta .kick{color:var(--gold)}
  .cta h2{color:#FFFDF6}
  .cta p{color:#EDE3D6}
  .cta .step{font-size:21px;font-weight:600;color:#FFFDF6;margin:6px 0}
  .disc{font-size:13px;line-height:1.5;color:#C9BBAE;margin-top:22px;max-width:70ch}
  .num{font-family:'Newsreader',serif;font-size:20px;color:var(--accent);font-weight:600;margin-right:8px}
  footer{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.04em;padding-top:8px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'cover', cls:'cover',
   kick:'A Daylight Masterclass with Dien Yuen',
   h:'The Art of Philanthropic Advising',
   sub:'How the giving conversation becomes your deepest, most durable client relationship.',
   brand:'Daylight Advisors'},

  {t:'who',
   kick:'Who this is for',
   h:'For the advisor who senses the conversation is changing.',
   p:'Financial advisors, wealth advisors, gift planners, estate attorneys and accountants who already serve successful clients, and who keep hearing a new kind of question: not just how do I grow it, but what is it all for.',
   list:['You are technically excellent and your clients trust you with the numbers.',
         'You want to be the advisor a family turns to for the whole of their wealth, not one slice of it.',
         'You sense the next generation judges you on something the spreadsheet never measured.']},

  {t:'trap',
   kick:'The trap',
   h:'Being the best at the money is no longer enough to keep the family.',
   p:'Amidst a historic $124 trillion transfer of wealth, clients are turning to advisors for more than investments and tax planning. The advisor who can only talk vehicles and deductions gets kept for this generation, and quietly replaced by the next.',
   pill:'$124 trillion is changing hands. The relationship, not the return, decides who holds it.'},

  {t:'reframe',
   kick:'The reframe',
   h:'Philanthropy is not a tax event. It is the most revealing conversation you will ever have with a client.',
   p:'When a client talks about what they want to give, they tell you who they are, what they fear, what they want remembered, and who they want shaped by their wealth. Most advisors treat that moment as a deduction to optimize. It is actually the door into the entire family.'},

  {t:'section',
   kick:'Part One',
   h:'Why the technical answer loses the client.',
   sub:'The problem is not that advisors lack knowledge. It is where they start.'},

  {t:'point',
   kick:'Part One',
   h:'Three ways the giving conversation gets lost.',
   list:['<b>You lead with the vehicle.</b> A donor-advised fund, a CRT, a private foundation, offered before you understand what the client actually cares about.',
         '<b>You solve the tax, not the meaning.</b> The client gets an efficient gift and an unfinished feeling, and takes the feeling to someone else.',
         '<b>You never meet the next generation.</b> The giving decision is where heirs first form a view of you. Skip it and you are a stranger when the wealth transfers.']},

  {t:'point',
   kick:'Part One',
   h:'What the client is really asking.',
   p:'Behind every philanthropic question is a human one. The skill is hearing it.',
   list:['"What should I do with the donor-advised fund" often means "I want my children to share my values and I do not know how."',
         '"Is this gift deductible" often means "I want this to matter, and I am not sure it will."',
         '"Can we set up a foundation" often means "I want to be remembered for more than what I earned."']},

  {t:'section',
   kick:'Part Two',
   h:'The three capabilities of a philanthropic advisor.',
   sub:'The Daylight model: technical, relational, and practical, working together.'},

  {t:'framework',
   kick:'Part Two - Capability 1',
   h:'Technical: command of the vehicles.',
   p:'The ground floor, not the finished house. You can assess giving strategies, integrate philanthropy with the wealth plan, and match the right vehicle to the client objective.',
   list:['Charitable tax planning and the timing of the gift.',
         'Foundations, donor-advised funds, and modern DAF advising.',
         'Legacy and gift planning, impact investing, and alternative tools.']},

  {t:'framework',
   kick:'Part Two - Capability 2',
   h:'Relational: the art of the conversation.',
   p:'This is the capability almost no one is trained in, and the one that decides whether you keep the family. You learn to elicit a client’s values and motivations, and to facilitate a real conversation among spouses, children and stakeholders.',
   list:['Draw out what a client actually cares about before naming a single vehicle.',
         'Hold a values conversation across two or three generations in one room.',
         'Turn a transaction into a relationship the family does not want to leave.']},

  {t:'framework',
   kick:'Part Two - Capability 3',
   h:'Practical: judgment under real complexity.',
   p:'Translating goals into action while knowing the edges of your own expertise. Real families are messy. The skilled advisor moves from intention to a workable plan, and knows when to bring in the specialist.',
   list:['Turn a stated intention into a concrete, sequenced plan.',
         'Recognize ethical boundaries and the limits of your expertise.',
         'Coordinate the attorney, the accountant and the family as one team.']},

  {t:'point',
   kick:'Part Two',
   h:'Cultural dexterity: the capability that wins the next generation.',
   p:'Families give differently across generations and cultures. One generation gives to institutions; the next gives to causes and to impact. The advisor who can move between those worlds, without judgment, is the advisor the heirs keep.',
   pill:'The heirs are watching how you handle giving. That is the audition for the next forty years.'},

  {t:'section',
   kick:'Part Three',
   h:'The giving conversation, start to finish.',
   sub:'From the first values question to the plan the whole family owns.'},

  {t:'point',
   kick:'Part Three',
   h:'The shift, in one client.',
   list:['<b>Before:</b> the client asks about a DAF. You explain the mechanics, set it up, and the relationship stays exactly where it was.',
         '<b>The question that changes it:</b> "Before we choose anything, what would you most want your wealth to make possible?"',
         '<b>After:</b> the spouse and two adult children are in the room, the plan reflects what the family actually values, and you are now the advisor to three generations, not one.']},

  {t:'point',
   kick:'Part Three',
   h:'Why this is the growth strategy, not the soft skill.',
   list:['Deeper relationships are stickier relationships. Families do not leave the advisor who understood what mattered.',
         'The giving conversation is how you meet, and keep, the heirs before the transfer.',
         'Values-led advice is the one thing a robo-advisor and a rate cut can never commoditize.']},

  {t:'why',
   kick:'Why Daylight',
   h:'This is a profession now, and Daylight built the standard for it.',
   p:'Daylight Advisors is the education and professional-standards home for philanthropic advising. Our Impact Philanthropy Advisor certification has credentialed 494 practitioners across 27 countries, through twelve modules, live cohort conversations, and real case work.',
   list:['Led by Dien Yuen, JD, LLM, CAP®, AEP®, 2026 Forbes 50 Over 50 Impact honoree.',
         'A curriculum built where formal certification had been missing.',
         'A community of practitioners, not a one-off course.']},

  {t:'recap',
   kick:'The one idea',
   h:'Master the conversation, and you become the advisor the family cannot replace.',
   p:'Technical skill gets you the account. The art of philanthropic advising gets you the family, the heirs, and the next forty years of the relationship.'},

  {t:'cta', cls:'cta',
   kick:'Your next step',
   h:'Bring the art into your practice.',
   p:'If this is the advisor you want to be, Daylight will take you there, from a single certificate to the full Impact Philanthropy Advisor certification.',
   steps:['Join a live Daylight info session to see the program.',
          'Start with the Introduction to Philanthropic Planning certificate.',
          'Earn the Impact Philanthropy Advisor (IPA) certification.'],
   disc:'This masterclass is educational. It is not legal, tax, investment, or financial advice, and it does not create an advisory relationship. No income, client-retention, growth, or professional result is guaranteed; outcomes vary with each advisor and client. Consult qualified professionals before acting.'}
];

const app = document.getElementById('app');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let h = '';
  if (s.pill && s.t==='trap') { /* pill after body */ }
  if (s.kick) h += '<div class="kick">' + s.kick + '</div>';
  if (s.t === 'cover') {
    h += '<h1>' + s.h + '</h1>';
    if (s.sub) h += '<div class="sub">' + s.sub + '</div>';
    h += '<div class="brandline"><span class="dot"></span>' + s.brand + '</div>';
  } else if (s.t === 'section') {
    h += '<h2>' + s.h + '</h2>';
    if (s.sub) h += '<div class="sub">' + s.sub + '</div>';
  } else if (s.t === 'cta') {
    h += '<h2>' + s.h + '</h2>';
    if (s.p) h += '<p>' + s.p + '</p>';
    if (s.steps) h += s.steps.map((x,n)=>'<div class="step"><span class="num">'+(n+1)+'</span>'+x+'</div>').join('');
    if (s.disc) h += '<div class="disc">' + s.disc + '</div>';
  } else {
    h += '<h2>' + s.h + '</h2>';
    if (s.sub) h += '<div class="sub">' + s.sub + '</div>';
    if (s.p) h += '<p>' + s.p + '</p>';
    if (s.list) h += '<ul>' + s.list.map(x=>'<li>'+x+'</li>').join('') + '</ul>';
    if (s.pill) h += '<div class="pill">' + s.pill + '</div>';
  }
  el.innerHTML = h;
  app.appendChild(el);
});
const f = document.createElement('footer');
f.textContent = 'Daylight Advisors - The Art of Philanthropic Advising';
app.appendChild(f);
</script>
</body>
</html>
