<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea to Finished Script - A Story and Plot Masterclass with Tom Vaughan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f4f0;        /* brand.json ground, 6 uses */
    --panel:#ffffff;
    --panel-2:#ece9e2;
    --ink:#201a17;        /* warm near-black */
    --muted:#5f574f;
    --accent:#912519;     /* brand dominant oxblood, 15 uses */
    --accent-deep:#550004;/* brand dark maroon, 4 uses */
    --rule:#d9d4c8;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--panel-2);color:var(--ink);
    font-family:"Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:6px;
    padding:52px 54px;margin:22px 0;min-height:430px;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .slug{font-family:"Roboto Slab",serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin:0 0 22px}
  .slug::before{content:"";display:inline-block;width:26px;height:2px;
    background:var(--accent);vertical-align:middle;margin-right:10px}
  h1{font-family:"Roboto Slab",serif;font-weight:800;font-size:52px;line-height:1.03;
    margin:0 0 18px;color:var(--accent-deep)}
  h2{font-family:"Roboto Slab",serif;font-weight:700;font-size:34px;line-height:1.08;
    margin:0 0 16px;color:var(--ink)}
  p{font-size:20px;line-height:1.5;margin:0 0 16px;max-width:60ch;color:var(--ink)}
  .lead{font-size:23px;color:var(--muted)}
  .big{font-size:27px;font-weight:600;color:var(--accent-deep);max-width:56ch}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 30px;position:relative;
    border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
    background:var(--accent);border-radius:1px}
  .step{font-family:"Roboto Slab",serif;color:var(--accent);font-weight:700;
    font-size:15px;letter-spacing:.06em;margin:0 0 14px}
  .meta{position:absolute;left:54px;bottom:26px;font-size:12px;color:var(--muted);
    letter-spacing:.04em}
  .byline{font-size:19px;color:var(--muted);margin-top:26px}
  .byline b{color:var(--ink);font-weight:600}
  .credits{font-size:18px;color:var(--muted);line-height:1.6;max-width:62ch}
  .cta{background:var(--accent-deep);color:#f6efe6;border-color:var(--accent-deep)}
  .cta .slug{color:#e7b7ac}
  .cta h2,.cta h1{color:#fdf6ee}
  .cta p{color:#f0e5da}
  .cta b{color:#fdf6ee}
  .disc{font-size:13px;color:#d8c3b8;margin-top:26px;max-width:64ch;line-height:1.5}
  .kbd{color:var(--muted);font-size:12px;text-align:center;margin:4px 0 22px;
    letter-spacing:.05em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:"title", cls:"", slug:"A Story and Plot Masterclass",
  h1:"Idea to Finished Script",
  lead:"How a working screenwriter turns a raw idea into a structured, readable script that people finish and want to make.",
  byline:"with <b>Tom Vaughan</b> &nbsp;/&nbsp; 29 years writing produced features, 23 years teaching the craft."},

 {t:"forwho", slug:"Who this is for",
  h2:"You have the idea. You just cannot get it to hold together.",
  p:["You have pages, notebooks, a concept you believe in. But every time you push into the middle of the story it sags, drifts, or quietly dies around the same place."],
  big:"The problem is almost never the idea. It is what happens between the idea and the outline."},

 {t:"trap", slug:"The trap",
  h2:"Most advice hands you a template and calls it structure.",
  p:["Fifteen beats. A page count for each act. Fill in the blanks. It feels like progress, and then you read it back and it is lifeless.",
     "A template tells you where a beat goes. It never tells you why that beat has to exist, or what happens to the reader when it does."]},

 {t:"reframe", slug:"The reframe",
  h2:"Structure is not a shape. It is an effect on the person reading.",
  big:"A story's structure is not impeccable because of how it is arranged. It is impeccable because of the effect that arrangement has on the audience.",
  p:["Once you can see structure as effect, you stop copying diagrams and start making decisions the way a working writer actually does."]},

 {t:"p1head", slug:"Part one",
  h1:"Why scripts fall apart",
  lead:"The three places a promising idea usually breaks, and why none of them are about talent."},

 {t:"p1a", slug:"Part one",
  h2:"The break happens before page one.",
  li:["The concept was never sharpened into something a reader leans toward.",
      "The structure was borrowed from a template, so the middle has no engine.",
      "The pages read like a document, not like a movie playing in someone's head."]},

 {t:"dq", slug:"Part one / the engine",
  h2:"The Dramatic Question is what keeps a reader in the seat.",
  p:["Every scene that works is quietly asking one question the reader wants answered, and refusing to answer it yet."],
  big:"When the middle sags, it is almost always because the dramatic question went quiet. Find it, and the second act has a job again."},

 {t:"act2", slug:"Part one / the middle",
  h2:"Act two has a purpose, not just a length.",
  p:["The middle is not filler between a strong opening and a big ending. It is where the reader watches the want collide with the cost, again and again.",
     "Give the middle its actual purpose and the page count stops mattering. The story pulls itself forward."]},

 {t:"p2head", slug:"Part two",
  h1:"Idea to Outline",
  lead:"The step by step process I use on my own scripts to get from a raw concept to an outline I can actually write from."},

 {t:"s1", step:"Step 1",
  h2:"Sharpen the concept until it does the selling.",
  p:["Concept is king. Before any structure, the idea has to earn a reader's interest on its own, in a sentence. If the logline does not lean the reader in, no outline will save it."]},

 {t:"s2", step:"Step 2",
  h2:"See the structure in a finished film first.",
  p:["You learn to read structure off movies that already work: where the question is posed, where the middle turns, what each move does to the audience. Then you have a real model instead of a template."]},

 {t:"s3", step:"Step 3",
  h2:"Build the outline as a sequence of decisions.",
  p:["Now the outline writes itself, because each beat is a choice with a reason behind it. You are not guessing at act breaks. You are placing them where the effect needs them."]},

 {t:"s4", step:"Step 4",
  h2:"Write so they feel they watched a movie.",
  p:["The last job is on the page itself: scene to scene progression and readability that make a reader forget they are reading. The best note you can get is that it played like a film in their head."]},

 {t:"p3head", slug:"Part three",
  h1:"What changes when it works"},

 {t:"whatlike", slug:"Part three",
  h2:"You stop starting over.",
  li:["The middle has an engine, so you finish the draft instead of abandoning it.",
      "You can say what every scene is doing, which makes rewrites fast instead of frightening.",
      "Readers finish the script and ask what is next, which is the only reaction that moves a career."]},

 {t:"whyme", slug:"Why listen to me",
  h2:"I teach the process I still use to get paid.",
  credits:"I have written professionally for 29 years, with eight produced features including WINCHESTER with Helen Mirren, THE HAUNTING OF THE QUEEN MARY, and DADDY'S GIRL now in production. I have developed material for Phoenix Pictures, Sony, Warner Brothers and Disney. I have taught the craft for 23 years, currently at the University of Houston. There is very little theory here. What I teach is next steps: how to create, how to find what is not working, and how to fix it."},

 {t:"recap", slug:"The whole path",
  h2:"Concept. Structure you can see. Outline. A script that plays.",
  li:["Sharpen the concept so the idea does the selling.",
      "Read structure off films that work, as effect and not template.",
      "Turn it into an outline built from decisions with reasons.",
      "Write the pages so a reader feels they watched a movie."]},

 {t:"cta", cls:"cta", slug:"Where to start",
  h2:"Start with the structure.",
  p:["If this is the way you want to work, begin with <b>Mastering Structure</b> and then <b>Idea to Outline</b> at storyandplot.com. When you are developing a script you mean to sell or produce, Story and Plot Pro is where we do that work together, live."],
  disc:"Educational only. No specific result is guaranteed. Results vary and depend on your own work, market conditions, and factors outside any course's control. Nothing here is a promise of representation, sale, production, or income."}
];

function esc(x){return x;}
function render(s){
  let h="";
  if(s.slug) h+='<p class="slug">'+s.slug+'</p>';
  if(s.step) h+='<p class="step">'+s.step+'</p>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.big) h+='<p class="big">'+s.big+'</p>';
  if(s.p) s.p.forEach(function(x){h+='<p>'+x+'</p>';});
  if(s.credits) h+='<p class="credits">'+s.credits+'</p>';
  if(s.li){h+='<ul>';s.li.forEach(function(x){h+='<li>'+x+'</li>';});h+='</ul>';}
  if(s.byline) h+='<p class="byline">'+s.byline+'</p>';
  if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
  return h;
}
const el=document.getElementById("deck");
const nav=document.createElement("p");
nav.className="kbd";
nav.textContent="Story and Plot masterclass sample. Scroll through the "+S.length+" slides.";
el.appendChild(nav);
S.forEach(function(s,i){
  const d=document.createElement("section");
  d.className="slide"+(s.cls?" "+s.cls:"");
  d.innerHTML=render(s)+'<div class="meta">Story and Plot &nbsp;/&nbsp; Tom Vaughan &nbsp;/&nbsp; '+(i+1)+' of '+S.length+'</div>';
  el.appendChild(d);
});
</script>
</body>
</html>
