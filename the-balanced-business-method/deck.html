<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Defined Leader: A Masterclass with Lauren DiCredico</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1eee9;        /* dominant harvested ivory */
    --panel:#e8e3d9;     /* tint of the ivory */
    --rule:#d3cabb;      /* tint of the ivory */
    --ink:#1c1a17;       /* evidenced near-black, warmed */
    --muted:#5b5347;     /* ink at lower emphasis */
    --accent:#6b5842;    /* deepened shade of the ivory family */
    --serif:'Spectral',Georgia,serif;
    --sans:'Hanken Grotesk',system-ui,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 120px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:6px;padding:64px 68px;margin:0 0 26px;min-height:560px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  /* branching-hairline motif: a single rule that splits */
  .slide::before{content:"";position:absolute;left:68px;top:52px;width:38px;height:1px;background:var(--accent)}
  .kicker{font-family:var(--sans);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;font-weight:600}
  h1{font-family:var(--serif);font-weight:500;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:500;font-size:44px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  .lede{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.35;color:var(--muted);margin-top:20px;max-width:24em}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:34em;margin-top:14px}
  p.sub{color:var(--muted)}
  .big{font-family:var(--serif);font-size:34px;line-height:1.2;max-width:20em;margin-top:6px}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px;max-width:36em}
  li{position:relative;padding-left:26px;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:1px;background:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px;margin-top:26px;max-width:100%}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:5px;padding:26px 28px}
  .card .n{font-family:var(--serif);font-size:22px;color:var(--accent)}
  .card h3{font-family:var(--sans);font-weight:600;font-size:18px;margin:8px 0 8px}
  .card p{font-size:15.5px;margin:0;color:var(--muted)}
  .steps{display:flex;flex-direction:column;gap:16px;margin-top:26px;max-width:40em}
  .step{display:flex;gap:20px;align-items:flex-start}
  .step .idx{font-family:var(--serif);font-size:30px;color:var(--accent);min-width:52px}
  .step h3{font-size:18px;font-weight:600;margin-bottom:4px}
  .step p{margin:0;font-size:16px;color:var(--muted)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:26px}
  .two h3{font-family:var(--sans);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .quote{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.3;max-width:22em}
  .foot{position:absolute;left:68px;right:68px;bottom:26px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .cta h1{font-size:52px}
  .disc{margin-top:30px;font-size:13px;line-height:1.5;color:var(--muted);max-width:44em;border-top:1px solid var(--rule);padding-top:16px}
  .cta-line{display:inline-block;margin-top:24px;font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);border:1px solid var(--accent);border-radius:4px;padding:14px 26px}
  @media(max-width:720px){.slide{padding:44px 28px;min-height:auto}.grid,.two{grid-template-columns:1fr}h1{font-size:40px}h2{font-size:32px}.cta h1{font-size:36px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND="The Balanced Business Method";
const S=[
 {t:'title',
  kicker:'A live masterclass with Lauren DiCredico',
  h1:'The Defined Leader',
  lede:'How to build a team that thinks, decides, and takes ownership, so the business stops depending on you.'},

 {t:'whofor',
  kicker:'Who this is for',
  h2:'You built something real. And it still can’t run without you.',
  bullets:['You’re a profitable owner or leader, past the startup scramble.',
           'The business works, because you are in every decision.',
           'You’ve hired good people and still feel like the only adult in the room.',
           'You want to step back without watching quality slip.']},

 {t:'trap',
  kicker:'The trap',
  h2:'Every owner is told the same two fixes.',
  big:'“Get better systems.” “Just delegate more.”',
  sub:'So you write the SOPs and hand off the tasks. Three weeks later it all routes back to you. The tools were never the problem.'},

 {t:'hook',
  kicker:'The reframe',
  quote:'The problem isn’t your team. It’s that no one ever taught you how to lead them.',
  sub:'Delegation is a leadership skill, not a software feature. Most owners were promoted into leading people without ever being trained to.'},

 {t:'part',part:'Part One',h2:'Why the business keeps coming back to you.'},

 {t:'body',
  kicker:'The real problem',
  h2:'You are the single point of failure, by design.',
  p:'When every judgment call needs your sign-off, the team learns to wait for you. That is not a discipline problem or a hiring problem. It is what happens when ownership was never actually transferred, only tasks were.',
  bullets:['Tasks were delegated. Decisions never were.',
           'The team is measured on doing, not on owning outcomes.',
           'Your calendar becomes the bottleneck for the whole company.']},

 {t:'body',
  kicker:'What it costs',
  h2:'The ceiling isn’t your market. It’s your bandwidth.',
  p:'A company can only grow as fast as its owner can make decisions. Revenue plateaus, good people leave because they never get to lead, and the owner burns out carrying a team that is fully capable of carrying itself.',
  sub:'The exhaustion is the symptom. The missing leadership layer is the root.'},

 {t:'body',
  kicker:'The false fix',
  h2:'More systems on an unled team just makes a tidier bottleneck.',
  p:'Systems and operations matter, but they are the structure that holds delegation in place, not the thing that creates it. Hand a process to someone who was never taught to own the result, and you have documented the way work still flows back to you.'},

 {t:'part',part:'Part Two',h2:'The Balanced Business Method.'},

 {t:'body',
  kicker:'The method',
  h2:'Four capabilities, kept in balance.',
  p:'Most owners over-index on one lever, usually hustle or systems, and starve the others. A business scales smarter, not harder, when all four are built at once. This is the balance the method is named for.'},

 {t:'pillars',
  kicker:'The four pillars',
  h2:'What we build, in balance.',
  cards:[
   {n:'01',h:'Leadership & Management',p:'Leading people toward outcomes, not managing them through tasks. The layer most owners were never trained in.'},
   {n:'02',h:'Systems & Operations',p:'The structure that makes delegation hold, so a transferred decision stays transferred.'},
   {n:'03',h:'Mindset',p:'The owner’s own psychology of letting go: trusting judgment other than your own without losing the standard.'},
   {n:'04',h:'Communication',p:'Clear, purposeful communication that turns instructions into ownership the team actually feels.'}]},

 {t:'body',
  kicker:'Why balance',
  h2:'Any one pillar alone breaks.',
  bullets:['Leadership without systems is charisma that doesn’t scale.',
           'Systems without leadership is a tidy bottleneck.',
           'Mindset without communication stays stuck in your head.',
           'Communication without leadership is noise.'],
  sub:'Built together, they compound. That is the whole thesis.'},

 {t:'steps',
  kicker:'How the work runs',
  h2:'Three steps to fix the real problem.',
  steps:[
   {i:'01',h:'Diagnose the root',p:'Find the underlying issue, not the symptom you can see. Most owners are solving the wrong problem well.'},
   {i:'02',h:'Build the strategy and skills',p:'Leadership, communication, and the operating structure, customized to you and your team, not a template.'},
   {i:'03',h:'Implement with guidance',p:'Ongoing partnership and accountability while it takes hold in the real business, not just on a slide.'}]},

 {t:'part',part:'Part Three',h2:'What changes when the team can carry it.'},

 {t:'body',
  kicker:'The outcome',
  h2:'A-players who think, decide, and own it.',
  p:'The goal isn’t a team that follows instructions faster. It is a team that solves problems before they reach you, and makes the call you would have made, and stands behind it.',
  bullets:['Decisions get made without you in the room.',
           'Quality holds because standards are owned, not policed.',
           'You move from firefighting IN the business to working ON it.']},

 {t:'two',
  kicker:'The shift',
  h2:'From bottleneck to defined leader.',
  before:['Every decision waits for you','Tasks handed off, outcomes still yours','Growth capped by your calendar','You are the hardest-working employee'],
  after:['The team decides inside clear guardrails','Outcomes owned by the people closest to them','Growth capped by strategy, not bandwidth','You lead the leaders']},

 {t:'cred',
  kicker:'Why Lauren',
  h2:'Leadership, studied and lived.',
  p:'A graduate degree in psychology focused on high performers and organizational psychology. A decade coaching elite military operators, C-suite executives, and business owners. A two-sport NCAA athlete who has spent a career on what makes teams perform under pressure.',
  sub:'The Balanced Business Method is that training, built into a system an owner can actually run.'},

 {t:'body',
  kicker:'The proof',
  h2:'When leadership gets built, the numbers move.',
  p:'One Defined Leader client moved sales conversion from 65% to 90% as the team took ownership of the process. Owners describe it as the highest-ROI coaching they’ve done, in the shortest time, because the change compounds through the whole team, not just the owner.',
  sub:'Results vary by owner and business; this is one client’s outcome, not a promise.'},

 {t:'body',
  kicker:'The path',
  h2:'Build your A-player team.',
  p:'The work is a guided build: diagnose the real bottleneck, install the leadership and the structure to remove it, and stay in it together until the team is carrying the load. Not a course you watch alone. A partnership until it holds.'},

 {t:'cta',
  kicker:'Your next step',
  h1:'Stop being the bottleneck.',
  p:'If you’re ready to build a team you can actually trust to run the business, the next step is a conversation about where your real bottleneck is and whether the Defined Leader program is the right fit.',
  ctaLine:'Apply for a consult with Lauren',
  disc:'Educational content only. No income, revenue, or specific-result guarantee is made or implied. Outcomes depend on your business, your team, and your own implementation, and will vary. The client result shown is illustrative of one engagement, not a typical or promised outcome.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sl=el('div','slide'+(s.t==='cta'?' cta':''));
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.part){ sl.appendChild(el('div','kicker',s.part)); }
  if(s.h1) sl.appendChild(el('h1',null,s.h1));
  if(s.h2) sl.appendChild(el('h2',null,s.h2));
  if(s.lede) sl.appendChild(el('div','lede',s.lede));
  if(s.quote) sl.appendChild(el('div','quote',s.quote));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.p) sl.appendChild(el('p',null,s.p));
  if(s.bullets){const ul=el('ul');s.bullets.forEach(b=>ul.appendChild(el('li',null,b)));sl.appendChild(ul);}
  if(s.cards){const g=el('div','grid');s.cards.forEach(c=>{const cd=el('div','card');cd.appendChild(el('div','n',c.n));cd.appendChild(el('h3',null,c.h));cd.appendChild(el('p',null,c.p));g.appendChild(cd);});sl.appendChild(g);}
  if(s.steps){const st=el('div','steps');s.steps.forEach(x=>{const r=el('div','step');r.appendChild(el('div','idx',x.i));const b=el('div');b.appendChild(el('h3',null,x.h));b.appendChild(el('p',null,x.p));r.appendChild(b);st.appendChild(r);});sl.appendChild(st);}
  if(s.before){const t=el('div','two');const a=el('div');a.appendChild(el('h3',null,'Today'));const ua=el('ul');s.before.forEach(b=>ua.appendChild(el('li',null,b)));a.appendChild(ua);const c=el('div');c.appendChild(el('h3',null,'The Defined Leader'));const uc=el('ul');s.after.forEach(b=>uc.appendChild(el('li',null,b)));c.appendChild(uc);t.appendChild(a);t.appendChild(c);sl.appendChild(t);}
  if(s.sub) sl.appendChild(el('p','sub',s.sub));
  if(s.ctaLine) sl.appendChild(el('div','cta-line',s.ctaLine));
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','foot','<span>'+BRAND+'</span><span>'+(i+1)+' / '+S.length+'</span>'));
  deck.appendChild(sl);
});
</script>
</body>
</html>
