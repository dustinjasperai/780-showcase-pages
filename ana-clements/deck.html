<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Working Narrator's Path, a masterclass with Ana Clements</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e6eef7;        /* ~11% tint of Ana's brand blue #0056a7 (brand.json) */
    --panel:#fbfdff;
    --wash:#dde9f6;      /* deeper tint of the same brand blue */
    --rule:#c9d9ec;
    --ink:#1c2530;
    --muted:#55606e;
    --accent:#0056a7;    /* Ana's dominant brand blue (brand.json) */
    --accent2:#2373b8;   /* secondary brand blue (brand.json) */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 66px;margin:22px 0;box-shadow:0 10px 30px rgba(28,37,48,.06);position:relative;overflow:hidden}
  .slide.title{background:linear-gradient(160deg,#ffffff 0%,var(--wash) 100%)}
  .k{font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:58px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:40px;line-height:1.12;margin-bottom:10px}
  .lede{font-size:23px;color:var(--muted);margin-top:22px;max-width:40ch}
  .present{margin-top:40px;font-size:19px;color:var(--ink);font-weight:600}
  .present span{color:var(--accent)}
  p.body{font-size:21px;color:var(--ink);margin-top:14px;max-width:62ch}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:21px;color:var(--ink);padding:14px 0 14px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:22px;width:16px;height:16px;border-radius:5px;
    border:2.5px solid var(--accent)}
  .pillarno{font-family:'Spectral',serif;font-style:italic;font-weight:600;color:var(--accent2);font-size:22px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
  .cell{background:var(--wash);border:1px solid var(--rule);border-radius:12px;padding:24px 26px}
  .cell h3{font-family:'Spectral',serif;font-size:24px;margin-bottom:8px}
  .cell p{font-size:18px;color:var(--muted)}
  .wave{display:block;margin-top:40px}
  .disclaimer{margin-top:28px;font-size:15px;color:var(--muted);border-top:1px solid var(--rule);padding-top:18px;max-width:70ch}
  .cta-line{font-size:23px;color:var(--ink);margin-top:18px;font-weight:600}
  @media(max-width:720px){.slide{padding:40px 28px}h1{font-size:40px}h2{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass', h:"The Working Narrator's Path",
    lede:"How to break in, get on rosters, and build a real career in audiobooks.",
    present:"with Ana Clements, audiobook narrator of 100+ titles" },

  {t:'point', k:'Who this is for',
    h:"You want a career, not a hobby mic.",
    body:"This is for narrators at the start of the road and working narrators who want more consistent casting. If you have ever wondered whether you are doing this the right way, you are in the right room." },

  {t:'point', k:'The trap',
    h:"You keep recording and hearing nothing back.",
    body:"You tidy your demo again. You audition into silence. And slowly you start to believe the problem is your voice. That belief is where most narration careers quietly stall." },

  {t:'point', k:'The reframe',
    h:"It was never your voice.",
    body:"It is that nobody showed you the actual path into audiobooks. The work is a roster business with its own rules, and those rules are learnable. Once you see them, the silence starts to make sense." },

  {t:'point', k:'Part one, the real problem',
    h:"Audiobooks are a roster business.",
    body:"Publishers and producers mostly cast from people they already know, by genre, off demos that prove you can carry a specific kind of book. Auditioning blind into the void is not the game. Getting onto the right rosters is." },

  {t:'list', k:'Part one',
    h:"Three things that actually stall new narrators",
    items:[
      "Generic demos built on famous books that arrive with everyone's preconceived idea of how they should sound.",
      "No clear sense of the genre niche that fits your real voice.",
      "Reaching out to authors and publishers at the wrong time, in the wrong way, with nothing to back it up." ] },

  {t:'point', k:'Part two, the path',
    h:"Four pillars of a working narrator.",
    body:"This is the frame I coach narrators through. None of it is mystical. It is the set of things I had to learn to narrate for Hachette, Harper and Penguin Random House, broken into four parts you can build in order." },

  {t:'pillar', k:'Pillar one', no:"01",
    h:"The roster path and demos that get you cast",
    body:"Original, genre-right demos instead of famous content. Finding the niche that fits your actual voice. And timing your outreach to authors and publishers so it lands as a professional, not a hopeful." },

  {t:'pillar', k:'Pillar two', no:"02",
    h:"The working-narrator craft",
    body:"Character and book preparation, pacing, and recording efficiently enough to make a living at it. The honest intensity the work takes, and how to practise it on public-domain books before a title is ever on the line." },

  {t:'pillar', k:'Pillar three', no:"03",
    h:"The business and brand behind the booth",
    body:"Your elevator pitch for casting directors and casting sites. The social presence that gets you remembered. Managing your time like a business. And protecting yourself by verifying author rights so you never record a book that cannot be sold." },

  {t:'pillar', k:'Pillar four', no:"04",
    h:"Mindset and clarity",
    body:"Getting clear on who you are as a creative professional, so you stop chasing every genre and start owning yours. This is the through-line under the other three. The narrators who last are the ones who get honest about this early." },

  {t:'point', k:'Part three, in practice',
    h:"What the first ninety days look like.",
    body:"One genre chosen on purpose. Two original demos built for it. A short, specific outreach list. A recording setup you can actually sustain. Not everything at once. The right few things, in the right order, done well." },

  {t:'grid', k:'Part three',
    h:"The difference it makes",
    cells:[
      { h:"Before", p:"Auditioning blind, demo after demo, into silence." },
      { h:"After", p:"On the right rosters, cast in the genre that fits your voice." },
      { h:"Before", p:"Guessing at the business side and hoping it works out." },
      { h:"After", p:"Running your narration like the career it is." } ] },

  {t:'point', k:'Why me',
    h:"I coach this from the chair, not the sidelines.",
    body:"I am an award-nominated, bilingual narrator with 100+ audiobooks for Hachette, Harper and Penguin Random House. I founded the Audiobooks on Clubhouse community, and I have coached narrators one to one since 2022. Everything here is what the work actually taught me.",
    wave:true },

  {t:'list', k:'Before you go',
    h:"What not to do",
    items:[
      "Do not build your demo on a famous book. You will be compared to a version everyone already loves.",
      "Do not chase every genre. Clarity casts; scatter does not.",
      "Do not skip verifying rights. A beautifully narrated book that cannot be sold is a loss, not a credit." ] },

  {t:'point', k:'Recap',
    h:"The path, in one breath.",
    body:"Choose your genre. Build demos that prove it. Learn the craft well enough to sustain it. Run the business behind it. Stay clear on who you are. That is how a hobby mic becomes a working narrator." },

  {t:'cta', k:'Work with me',
    h:"Let's build your path together.",
    cta:"If you want help putting this to work for your own career, reach out for an online meet and greet and we will talk about where you are and what to do next.",
    disclaimer:"This masterclass is educational. No casting, income, or specific result is guaranteed. Results vary with effort, genre, market and experience." }
];

const deck = document.getElementById('deck');
const esc = s => (s||'');
const WAVE = `<svg class="wave" width="260" height="60" viewBox="0 0 260 60" fill="none" aria-hidden="true">
  <path d="M4 30 h30" stroke="#0056a7" stroke-width="3" stroke-linecap="round"/>
  <path d="M46 30 C54 8 62 52 70 30 S86 8 94 30 118 52 126 30 150 8 158 30" stroke="#0056a7" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M166 30 h18 a10 10 0 0 1 10 10 v6 a10 10 0 0 0 10 10 h40" stroke="#2373b8" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`;
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title':'');
  let h = '';
  if (s.k) h += `<div class="k">${esc(s.k)}</div>`;
  if (s.t==='title'){
    h += `<h1>${esc(s.h)}</h1>`;
    if (s.lede) h += `<div class="lede">${esc(s.lede)}</div>`;
    if (s.present) h += `<div class="present">${esc(s.present).replace('Ana Clements','<span>Ana Clements</span>')}</div>`;
  } else {
    if (s.t==='pillar' && s.no) h += `<div class="pillarno">${s.no}</div>`;
    h += `<h2>${esc(s.h)}</h2>`;
    if (s.body) h += `<p class="body">${esc(s.body)}</p>`;
    if (s.items){ h += '<ul>'; for (const it of s.items) h += `<li>${esc(it)}</li>`; h += '</ul>'; }
    if (s.cells){ h += '<div class="grid">'; for (const c of s.cells) h += `<div class="cell"><h3>${esc(c.h)}</h3><p>${esc(c.p)}</p></div>`; h += '</div>'; }
    if (s.wave) h += WAVE;
    if (s.cta) h += `<div class="cta-line">${esc(s.cta)}</div>`;
    if (s.disclaimer) h += `<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  }
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
