<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write to Heal — a masterclass with Christine Wolf</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:ital,wght@0,400;0,500;0,700;0,800;1,400;1,500&family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efeae0;        /* warm paper (light-scheme brand -> light deck) */
    --panel:#ffffff;     /* her true site ground (brand.json bg #ffffff) */
    --rule:#ddd6c8;      /* thin literary rule */
    --ink:#272727;       /* her button near-black */
    --ink-soft:#54504a;
    --accent:#00d4db;    /* her documented teal (brand.json, 62 uses) */
    --accent-deep:#0b8f99; /* same hue, deepened for text on light ground */
    --serif:"Alegreya",Georgia,serif;
    --sans:"Alegreya Sans","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:60px 64px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .slide .kick{font-family:var(--sans);font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;font-size:12px;color:var(--accent-deep);margin-bottom:18px}
  .slide h1{font-family:var(--serif);font-weight:800;font-size:52px;line-height:1.05;
    letter-spacing:-.01em}
  .slide h2{font-family:var(--serif);font-weight:700;font-size:34px;line-height:1.12;
    margin-bottom:14px}
  .slide .sub{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink-soft);
    margin-top:18px;line-height:1.3}
  .slide p{font-family:var(--sans);font-size:19px;line-height:1.6;color:var(--ink);
    margin-top:14px;max-width:46ch}
  .slide p.lead{font-size:22px}
  .slide ul{list-style:none;margin-top:22px}
  .slide li{font-family:var(--sans);font-size:19px;line-height:1.5;padding:12px 0 12px 26px;
    border-top:1px solid var(--rule);position:relative;max-width:52ch}
  .slide li:first-child{border-top:none}
  .slide li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:2px;
    background:var(--accent)}
  .slide .mark{display:inline-block;width:64px;height:3px;background:var(--accent);
    margin-top:8px}
  .slide .note{font-family:var(--sans);font-size:14px;color:var(--ink-soft);margin-top:26px}
  .slide .present{font-family:var(--serif);font-size:20px;color:var(--ink-soft);margin-top:30px}
  .title{background:var(--ink);color:var(--panel);border-color:var(--ink)}
  .title h1{color:var(--panel);font-size:62px}
  .title .kick{color:var(--accent)}
  .title .sub{color:#d9d4cc}
  .title .present{color:#cfe9ea}
  .part{background:var(--ink);color:var(--panel);border-color:var(--ink);text-align:left}
  .part h2{color:var(--panel);font-size:40px}
  .part .kick{color:var(--accent)}
  .cta{border:2px solid var(--accent-deep)}
  .cta .disc{font-family:var(--sans);font-size:13px;color:var(--ink-soft);margin-top:30px;
    line-height:1.5;max-width:60ch}
  .snum{font-family:var(--sans);font-size:12px;color:var(--ink-soft);
    letter-spacing:.1em;margin-bottom:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"title", kick:"A live masterclass", h:"Write to Heal",
   sub:"How to finally write the true story you were once told to keep quiet.",
   present:"with Christine Wolf, author and trauma-informed memoir coach"},

  {t:"promise", kick:"What this hour gives you", h:"You leave with a way in.",
   body:"Not another lecture on story structure. A safe, specific first step for turning the memory you keep circling into pages you can actually keep writing.",
   list:["Why your memoir keeps stalling at the hard part","A trauma-informed way to approach a painful memory on the page","One writing practice you can use the same day, on your own"]},

  {t:"who", kick:"Who this is for", h:"You have a real story. You just can't get it out.",
   body:"You have started your memoir three, five, maybe ten times. You know the story that matters. Grief. A family secret. A season that changed you. And every time you reach the center of it, you close the laptop.",
   note:"If that is you, you are in the right room."},

  {t:"trap", kick:"The trap", h:"You think the problem is your writing.",
   body:"So you buy another craft book. Another course on scene and structure. They are good books. They are not the thing that is stopping you.",
   sub:"The page is not where you are stuck. The memory is."},

  {t:"hook", cls:"part", kick:"The reframe", h:"Craft advice assumes the memory is safe to touch. Yours might not be yet.",
   body:"Push-through advice works for a travel essay. It backfires on the chapter about the worst year of your life, because the body does not know the difference between remembering and reliving."},

  {t:"part", cls:"part", kick:"Part one", h:"Why the story stays silenced"},

  {t:"why", kick:"The three locks", h:"Three things hold the hardest story down.",
   list:["Shame: the quiet belief that your story is too much, or not enough","Loyalty: the fear of hurting someone you love by telling the truth","The freeze: your nervous system pulling you out the moment you get close"]},

  {t:"why2", kick:"The cost of waiting", h:"An untold story does not get quieter.",
   body:"It waits. It leaks into the writing you are willing to do. The way through is not to force it or to wait for it to feel safe on its own. It is to build the safety on purpose, a page at a time."},

  {t:"part", cls:"part", kick:"Part two", h:"The trauma-informed method"},

  {t:"method", kick:"The ground rule", h:"This is not therapy. It is a safer way to write.",
   body:"I am not a therapist, and this is not treatment. It is memoir work that respects what the material is made of. Four things hold the room steady:",
   list:["Emotional safety: you decide what goes on the page and what stays off it","Writer autonomy: your story, your pace, your choices, always","Pacing: we approach the hard parts in layers, never all at once","Storytelling choices: craft used in service of the writer, not the other way around"]},

  {t:"expressive", kick:"Pillar one", h:"Expressive writing: get it onto the page before you shape it.",
   body:"Built on the evidence-based practice Dr. James Pennebaker pioneered in 1986. You write toward the troubling memory with no reader and no rules, to create a framework of language that moves the unresolved thought out of your head and onto the page.",
   note:"First we move it out. Only then do we shape it."},

  {t:"pacing", kick:"Pillar two", h:"Pace is the technique.",
   body:"We do not write the whole wound in one sitting. We find the edge of what is workable today, write to there, and stop while you are still steady. Next time the edge has moved. That is how the center becomes reachable."},

  {t:"craft", kick:"Pillar three", h:"Turn raw memory into a scene a reader can hold.",
   body:"Once the memory is safely on the page, craft does its real job. We find the moment, the detail, the turn, so a stranger feels what you felt without needing it explained. That is where private pain becomes a story that reaches someone.",
   sub:"My role is to witness, support, and help shape your experience into language."},

  {t:"part", cls:"part", kick:"Part three", h:"What changes when you write this way"},

  {t:"arc", kick:"The arc", h:"From a frozen first line to a chapter you are proud of.",
   list:["You stop avoiding the hard scene and start approaching it on purpose","You build a writing practice that holds instead of overwhelms","You shape the memory into pages a reader can actually feel","You end up with a story told on your terms, at your pace"]},

  {t:"home", kick:"You are not doing this alone", h:"A home for those ready to say what was once silenced.",
   body:"This work goes better in company. Writers' Haven is the community and coworking space I built for exactly this: writers approaching true, tender material, with people who understand the weight of it."},

  {t:"why-me", kick:"Why me", h:"I have spent a career helping people say the hard thing.",
   list:["Trauma-informed memoir coach and developmental editor","Moth StorySLAM champion and former Chicago Tribune and Sun-Times columnist","Writing and entrepreneurship instructor at Northwestern University","Certified Mental Health First Aid responder","Chosen to conduct the first live-streamed interview with President Obama from the White House"]},

  {t:"recap", kick:"The method in one breath", h:"Safety first. Then the page. Then the story.",
   list:["Expressive writing to get it out of your body and onto the page","Pacing so the hard parts stay workable","Craft so the memory becomes a story someone can hold"]},

  {t:"cta", cls:"cta", kick:"If you are ready to begin", h:"Write the story you were told to keep quiet.",
   body:"If today gave you a way in, the next step is a conversation. Book a one-on-one consult and we will map the first safe scene of your memoir together, at your pace.",
   present:"Christine Wolf, author and trauma-informed memoir coach, christinewolf.com",
   disc:"This masterclass is for educational purposes only. It is not therapy, counseling, or mental-health treatment, and it is not a substitute for care from a licensed professional. No specific outcome, publication, or result is guaranteed. Every writer's path is different and results vary."}
];

const deck = document.getElementById("deck");
S.forEach(function(s, i){
  const el = document.createElement("section");
  el.className = "slide " + (s.cls || "");
  let h = "";
  h += '<div class="snum">' + String(i+1).padStart(2,"0") + " / " + String(S.length).padStart(2,"0") + "</div>";
  if(s.kick){ h += '<div class="kick">' + s.kick + "</div>"; }
  if(s.h){ h += (s.cls==="title" ? "<h1>" + s.h + "</h1>" : "<h2>" + s.h + "</h2>"); }
  if(s.cls==="title" || s.cls==="part"){ h += '<span class="mark"></span>'; }
  if(s.sub){ h += '<div class="sub">' + s.sub + "</div>"; }
  if(s.body){ h += "<p class='lead'>" + s.body + "</p>"; }
  if(s.list){ h += "<ul>" + s.list.map(function(x){return "<li>" + x + "</li>";}).join("") + "</ul>"; }
  if(s.note){ h += '<div class="note">' + s.note + "</div>"; }
  if(s.present){ h += '<div class="present">' + s.present + "</div>"; }
  if(s.disc){ h += '<div class="disc">' + s.disc + "</div>"; }
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
