<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak Honey — Train the Voice That Competes For You</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Epilogue:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9eef9;      /* pale royal-blue tint, derived from their dominant #1e439b */
    --panel:#fbfcfe;   /* faint blue-white, not pure white */
    --ink:#16306b;     /* deep royal blue, their dominant hue */
    --muted:#48537a;
    --rule:#d7deef;
    --accent:#d9a441;  /* their gold accent (brand.json) */
    --head:'Playfair Display', serif;
    --body:'Epilogue', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(22,48,107,.03)}
  .slide.title{background:linear-gradient(180deg,#ffffff 0%,#f3f6fd 100%);
    border-top:4px solid var(--accent)}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.14;margin-bottom:16px}
  h3{font-family:var(--head);font-weight:600;font-size:23px;margin-bottom:8px}
  p{font-size:18px;line-height:1.6;color:var(--muted);max-width:60ch}
  p.lead{font-size:21px;color:var(--ink)}
  .goldline{width:64px;height:3px;background:var(--accent);border:0;margin:0 0 22px}
  ul{list-style:none;margin:14px 0 0}
  li{font-size:18px;line-height:1.5;color:var(--ink);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:19px;width:14px;height:3px;background:var(--accent)}
  .meta{margin-top:26px;font-size:15px;color:var(--muted);font-weight:500}
  .tag{font-family:var(--head);font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.04em}
  .part .num{font-family:var(--head);font-size:70px;font-weight:800;color:var(--accent);line-height:1}
  .big{font-family:var(--head);font-size:40px;font-weight:700;line-height:1.1;color:var(--ink);max-width:22ch}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:62ch;line-height:1.5}
  .n{display:inline-block;font-family:var(--head);font-weight:700;color:var(--accent);margin-right:10px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
   kick:'A live masterclass · Faith. Mindset. Performance.',
   h:'Speak Honey: Train the Voice That Competes For You',
   p:'How the words you speak over yourself rewire your subconscious and decide how you perform when it matters most.',
   meta:'With Courtney Delks · 2010 Indiana Miss Basketball, WNBA trainer, bestselling author of Speak Honey'},

  {t:'promise',
   kick:'What you will leave with',
   h:'One trained voice, carried onto the floor',
   bullets:[
     'Why your self-talk is already coaching every rep, whether you trained it or not',
     'The Speak Honey system for replacing the untrained voice with words that compete for you',
     'A daily practice simple enough to still be running on a Tuesday in February']},

  {t:'who',
   kick:'Who this is for',
   h:'The competitor who has out-worked everyone and still gets in their own way',
   p:'For athletes, leaders, and high performers who have the talent and the reps, and know the gap is not physical. The trap is believing the fix is more effort, when the thing talking you out of the moment is a voice you never trained.'},

  {t:'reframe',
   kick:'The reframe',
   big:'Your toughest opponent has your voice.',
   p:'It knows every doubt, shows up right before the moment, and you have been letting it call the game. Nobody taught you it could be trained. It can.'},

  {t:'part', num:'One', h:'The core problem: an untrained inner voice',
   p:'Under pressure you do not rise to the occasion. You fall to the level of the words you have practiced the most. For most competitors those words were never chosen on purpose.'},

  {t:'content',
   kick:'Part one',
   h:'Talent is loud. The untrained voice is louder',
   bullets:[
     'The words you repeat become the beliefs you hold, and the beliefs you hold set the ceiling',
     'Quick-fix motivation fades by the second quarter because it was never wired in',
     'You cannot out-train a voice that is working against you every rep']},

  {t:'part', num:'Two', h:'The Speak Honey word-power system',
   p:'Speak Honey is the practice of choosing the words you speak over yourself on purpose, so the voice in the hard moment is one you built, not one you inherited. Five steps, trained like any other skill.'},

  {t:'step', n:'1', h:'Catch',
   p:'Notice the exact words the untrained voice uses under pressure. You cannot change a sentence you have never heard yourself say.'},

  {t:'step', n:'2', h:'Challenge',
   p:'Hold that sentence up to the truth. The untrained voice is confident, not correct. Most of what it says would not survive being said out loud.'},

  {t:'step', n:'3', h:'Change',
   p:'Replace it with the trained word. Speak Honey is not hype or fake positivity. It is a true, specific sentence you can stand on when the moment gets loud.'},

  {t:'step', n:'4', h:'Consistency',
   p:'This is the Consistency Code. The trained word only competes for you once it is repeated past the point of motivation, until it is the automatic one.'},

  {t:'step', n:'5', h:'Compete',
   p:'Carry it onto the floor. The Compete Mentality is competing fully regardless of the scoreboard, because the voice deciding your next play is one you trained.'},

  {t:'content',
   kick:'The daily operating model',
   h:'Five things elite competitors run every day',
   bullets:[
     'Clarity and energy to start the day on purpose, not on autopilot',
     'Necessity and influence to decide the moment matters and own your words in it',
     'Courage to speak the trained word when the untrained one is louder']},

  {t:'content',
   kick:'Part three',
   h:'When the voice is trained, the hard moment gets quiet',
   bullets:[
     'The mistake happens and the next word is "next play," not a spiral',
     'The pressure moment arrives and you have a sentence to stand on',
     'The habit holds on the days nobody is watching, which is where it is actually built']},

  {t:'why',
   kick:'Why me',
   h:'I have lived this at the highest level',
   p:'2010 Indiana Miss Basketball and Gatorade Player of the Year, an All-Big Ten career at Purdue, a WNBA trainer, and bestselling author of Speak Honey. With my husband Jordan I have coached high school athletes, NBA and WNBA players, CEOs, and entrepreneurs on the same thing: the mind, body, and spirit it takes to compete.'},

  {t:'cta',
   kick:'Your next step',
   h:'Train the voice that competes for you',
   p:'If you are ready to stop letting an untrained voice call your game, book a session with me and we will start building the one that competes for you.',
   action:'Book a session at competetrainingacademy.org',
   disc:'This masterclass is educational. It shares a mindset and performance method; it is not medical, psychological, or financial advice. Individual results vary and are not guaranteed.'}
];

const deck = document.getElementById('deck');
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function slideHTML(s){
  const kick = s.kick ? `<div class="kick">${esc(s.kick)}</div>` : '';
  if(s.t==='title'){
    return `<section class="slide title">${kick}<h1>${esc(s.h)}</h1><hr class="goldline"><p class="lead">${esc(s.p)}</p><div class="meta">${esc(s.meta)}</div></section>`;
  }
  if(s.t==='reframe'){
    return `<section class="slide">${kick}<div class="big">${esc(s.big)}</div><hr class="goldline" style="margin-top:22px"><p>${esc(s.p)}</p></section>`;
  }
  if(s.t==='part'){
    return `<section class="slide part"><div class="num">${esc(s.num)}</div><hr class="goldline" style="margin:16px 0 20px"><h2>${esc(s.h)}</h2><p>${esc(s.p)}</p></section>`;
  }
  if(s.t==='step'){
    return `<section class="slide">${kick}<h2><span class="n">${esc(s.n)}</span>${esc(s.h)}</h2><hr class="goldline"><p>${esc(s.p)}</p></section>`;
  }
  if(s.t==='cta'){
    return `<section class="slide">${kick}<h2>${esc(s.h)}</h2><hr class="goldline"><p class="lead">${esc(s.p)}</p><div class="meta tag">${esc(s.action)}</div><div class="disc">${esc(s.disc)}</div></section>`;
  }
  // promise / who / content / why
  let body = '';
  if(s.h) body += `<h2>${esc(s.h)}</h2><hr class="goldline">`;
  if(s.p) body += `<p class="lead">${esc(s.p)}</p>`;
  if(s.bullets){ body += '<ul>' + s.bullets.map(b=>`<li>${esc(b)}</li>`).join('') + '</ul>'; }
  return `<section class="slide">${kick}${body}</section>`;
}
deck.innerHTML = S.map(slideHTML).join('');
</script>
</body>
</html>
