<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Real Odds — CRNA School Prep Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@500;600;700;800&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f9fa;        /* from brand #f0f8fa light tint */
    --panel:#ffffff;
    --ink:#0e2333;       /* brand dominant navy (91 uses) */
    --muted:#4a5c69;
    --rule:#cce6ed;      /* brand pale clinical blue */
    --accent:#19aa99;    /* brand signature teal (79 uses) */
    --head:'Figtree',system-ui,sans-serif;
    --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 1px 0 rgba(14,35,51,.03)}
  .slide::before{content:"";position:absolute;left:0;top:34px;bottom:34px;width:5px;border-radius:5px;background:var(--accent)}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.05;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.01em;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);line-height:1.5;max-width:30em;margin-bottom:10px}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:16px;height:16px;border-radius:5px;border:2px solid var(--accent)}
  .big{font-family:var(--head);font-weight:800;font-size:92px;line-height:1;color:var(--accent);letter-spacing:-.03em}
  .by{margin-top:26px;font-family:var(--head);font-weight:600;font-size:17px;color:var(--ink)}
  .by span{color:var(--muted);font-weight:500}
  .divider .k{color:var(--accent)}
  .divider h2{font-size:40px}
  .note{margin-top:16px;font-size:15px;color:var(--muted);max-width:40em}
  .disc{margin-top:22px;font-size:13px;color:var(--muted);line-height:1.5;max-width:44em;border-top:1px dashed var(--rule);padding-top:14px}
  .pill{display:inline-block;font-family:var(--head);font-weight:700;font-size:14px;color:var(--panel);background:var(--accent);padding:6px 14px;border-radius:999px;margin-top:4px}
  @media(max-width:640px){.slide{padding:38px 26px}h1{font-size:36px}h2{font-size:27px}.big{font-size:64px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A Live Masterclass for ICU Nurses', h:'Know Your Real Odds', s:'The 4 readiness gaps that decide CRNA school acceptance, and how to close them.', by:'Jenny Finnell, MSN, CRNA | Founder, CRNA School Prep Academy'},

  {t:'promise', k:'What you will walk away with', h:'A number, not a guess', s:'By the end of this hour you will know exactly where your application stands today and the specific gaps to close before you apply.', b:['The four factors CRNA program faculty actually score','An honest read on your current readiness','A long-game plan to close the gaps, in order']},

  {t:'who', k:'Who this is for', h:'The hardest-working nurse on the unit', s:'You picked up the overtime, chased the certifications, and told yourself you would apply when you were ready. You are still not sure what ready means.', b:['ICU and critical-care RNs who want into nurse anesthesia school','Nurses applying for the first time, and nurses reapplying after a no','Anyone tired of guessing at their odds']},

  {t:'trap', k:'The trap', h:'"Get your CCRN and apply"', s:'It is the advice everyone gives. So you do it, you submit, and you wait. Then a rejection lands with no feedback and no idea what went wrong.', b:['Generic advice treats every applicant the same','You cannot fix a gap you were never shown','One cycle lost is a year lost']},

  {t:'hook', k:'The reframe', h:'Schools do not reject weak nurses', s:'They reject unmeasured applications. Most strong ICU nurses get turned away not because they are not good enough, but because no one scored their application the way the committee does, in time to fix it.'},

  {t:'problem', k:'The real problem', h:'About 12% get in', s:'Nationally, roughly one in eight applicants is accepted. The difference between the ones who get in and the ones who do not is rarely effort. It is readiness you cannot see from the inside.', b:['Effort is invisible to a committee; evidence is not','The gaps that sink applications are specific and predictable','They are also closeable, if you find them early enough']},

  {t:'divider', k:'Part One', h:'The Readiness Gap'},

  {t:'content', k:'Why good nurses get rejected', h:'The gap you cannot see', s:'Every rejected application has a reason. It is almost never "not good enough." It is a science GPA recalculated lower than you thought, ICU hours that do not show acuity, a flat personal statement, or an interview you walked into cold.', b:['The reasons are knowable before you apply','Programs weigh the same handful of factors','You can be scored on them in advance']},

  {t:'divider', k:'Part Two', h:'The 4 Gaps Faculty Actually Score'},

  {t:'gap', k:'Gap 1', h:'GPA, the way programs recalculate it', s:'Committees do not read the GPA on your transcript. They recalculate your science GPA and your last 60 credits, and that number is usually lower than the one you have been quoting. Knowing your real number changes your whole strategy.'},

  {t:'gap', k:'Gap 2', h:'ICU experience that actually counts', s:'Two years in a low-acuity unit is not the same as one in a high-acuity one. Programs read for the kind of critical care, the drips, the devices, the independence. The right experience, described the right way, is a lever most applicants waste.'},

  {t:'gap', k:'Gap 3', h:'Leadership and certifications', s:'The CCRN is the floor, not the ceiling. Charge shifts, preceptor roles, committee work, and the certifications beyond the minimum are what separate a safe application from a standout one. Most nurses have more of this than they put on paper.'},

  {t:'gap', k:'Gap 4', h:'The panel interview', s:'This is where most acceptances are won or lost, and where the least preparation happens. A clinical and behavioral panel can undo a strong file in twenty minutes. It is also the most coachable gap of the four.'},

  {t:'score', k:'Put them together', h:'Your readiness score', s:'Each gap is a factor. Scored honestly and together, they give you one thing nobody else will: a clear, data-informed read on how competitive you are right now, and exactly where to spend your time.', b:['Strengths you can lean on','Gaps you must close first','A plan that fits your real timeline']},

  {t:'divider', k:'Part Three', h:'Closing the Gaps, the Long Game'},

  {t:'content', k:'How accepted nurses do it', h:'Built over months, not crammed', s:'Our strongest accepted students did not sprint. They started early and worked a plan: raise the number that can be raised, add the experience that counts, build the leadership story, and drill the interview until it is routine.', b:['A month-by-month readiness plan','Mentorship from people who have scored applications','Mock interviews until the panel feels familiar']},

  {t:'why', k:'Why learn this from us', h:'Taught by the people who score it', s:'CRNA School Prep Academy is built with practicing CRNAs and CRNA program faculty, including former program and assistant program directors. You learn what the committee looks for from the people who have sat on the committee.', b:['Trusted by 10,000+ ICU nurses','An 80% acceptance rate among our students','Backed by our money-back acceptance guarantee']},

  {t:'content', k:'The pattern in our own data', h:'The ones who start early get in', s:'Across our accepted students, 70% engaged with the Academy for at least eight months and more than half completed the majority of the coursework. Readiness compounds. The earlier you start measuring, the more you can close.'},

  {t:'recap', k:'Recap', h:'The 4 gaps that decide it', b:['GPA, recalculated the way programs do','ICU experience that shows acuity','Leadership and certifications beyond the floor','The panel interview']},

  {t:'cta', k:'Your next step', h:'Find out where you stand', s:'Take the CRNA Applicant Readiness Quiz to get your score, then join CRNA School Prep Academy to close the gaps with faculty mentorship and a plan built for your timeline.', b:['Start with the free readiness quiz','Join the Academy and start your plan','Apply as a standout, not a guess'], disc:'This masterclass is educational. It does not guarantee admission to any program, and outcomes vary by applicant. Acceptance rate and program details reflect CRNA School Prep Academy student data as published by CSPA.'}
];

const deck = document.getElementById('deck');
S.forEach(function(s){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='divider'?' divider':'');
  let html = '';
  if(s.k) html += '<div class="k">'+s.k+'</div>';
  if(s.t==='title'){ html += '<h1>'+s.h+'</h1>'; if(s.s) html += '<p class="sub">'+s.s+'</p>'; if(s.by) html += '<div class="by">'+s.by.replace('|','<span> | </span>')+'</div>'; }
  else { if(s.h) html += '<h2>'+s.h+'</h2>'; if(s.s) html += '<p class="sub">'+s.s+'</p>'; }
  if(s.b){ html += '<ul>'; s.b.forEach(function(x){ html += '<li>'+x+'</li>'; }); html += '</ul>'; }
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
