<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wild Training System Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#0F1412;   /* gym-black ground (brand-world, dark scheme confirmed by probe) */
    --panel:#19211D;    /* raised panel */
    --rule:#2B332E;     /* hairline / barbell rule */
    --accent:#9BE15D;   /* electric lime - energy / outdoor / "wild" */
    --ink:#F4F6F2;      /* off-white text */
    --muted:#A9B4AC;    /* muted text */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:52px 56px;
    margin:18px 0;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .kick{font-family:'Inter';font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent)}
  .kick:after{content:"";display:block;width:64px;height:4px;background:var(--accent);margin-top:12px;border-radius:2px}
  h1{font-family:'Archivo Black';font-size:52px;line-height:1.02;letter-spacing:-.01em;margin:22px 0 14px}
  h2{font-family:'Archivo Black';font-size:38px;line-height:1.06;margin:18px 0 12px}
  .sub{font-size:20px;color:var(--muted);font-weight:500;max-width:46ch}
  .body{font-size:19px;line-height:1.5;color:var(--ink);max-width:58ch;margin-top:10px}
  ul{list-style:none;margin-top:18px}
  li{font-size:19px;line-height:1.45;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:20px;width:14px;height:14px;background:var(--accent);border-radius:3px}
  li b{font-family:'Archivo Black';font-weight:400}
  .big{font-family:'Archivo Black';font-size:40px;line-height:1.08;color:var(--ink);max-width:22ch}
  .big .hl{color:var(--accent)}
  .foot{position:absolute;bottom:18px;right:24px;font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
  .pres{font-size:17px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:700}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:60ch}
  .cta-line{font-family:'Archivo Black';font-size:26px;color:var(--accent);margin-top:18px}
  .quote{font-family:'Archivo Black';font-size:34px;line-height:1.14;max-width:24ch}
  .quote .hl{color:var(--accent)}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:360px}h1{font-size:36px}h2{font-size:28px}.big,.quote{font-size:28px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A Wild Training Masterclass',
    h:'The Business That Doesn’t Fail',
    sub:'How to build an independent fitness business on the Wild Training System.',
    pres:'Presented by <b>James Griffiths</b>, Founder of Wild Training'},

  {t:'promise',
    kick:'What you’ll walk away with',
    h:'A system, not a hustle',
    bullets:[
      '<b>Why</b> being a brilliant trainer is not the same as owning a business that lasts.',
      '<b>The</b> Wild Training System, the exact process behind every Wild Training business.',
      '<b>The</b> path from your first outdoor class to your own studio.']},

  {t:'who',
    kick:'Who this is for',
    h:'You already coach. You want your own thing.',
    body:'Personal trainers, instructors and gym owners who are great with clients but tired of trading every hour for money, chasing the next sign-up, and building a business that stops the moment they stop.'},

  {t:'hook',
    kick:'The hard truth',
    big:'Nobody pays you for how much you <span class="hl">know</span>. They pay you for the <span class="hl">result</span> you can repeat.'},

  {t:'section',
    kick:'Part One',
    h:'Why good trainers stay stuck',
    body:'The skill got you clients. It will not get you a business. Three things keep most independent trainers on the treadmill.'},

  {t:'problem',
    kick:'The three leaks',
    h:'Where the money and the time go',
    bullets:[
      '<b>No product</b> of your own, just sessions anyone can copy and undercut.',
      '<b>No model</b>, so income is one-to-one and capped by your diary.',
      '<b>No pipeline</b>, so every quiet month starts from zero again.']},

  {t:'section',
    kick:'Part Two',
    h:'The Wild Training System',
    body:'One repeatable process with four parts. Each one removes a leak. Together they build a business that runs on a system instead of on your willpower.'},

  {t:'pillar',
    kick:'Part One of the system: The Method',
    h:'A product only you can deliver',
    body:'Full range of natural movement, trained through strength, bodyweight and sport-inspired work. BTB Exercise and Wild Jump give you signature sessions, with certifications nobody else in your town can offer. You stop competing on price because you are not selling the same thing.'},

  {t:'pillar',
    kick:'Part Two of the system: The Model',
    h:'Off the diary, onto recurring income',
    body:'Wild In the Park group classes and membership move you from one-to-one sessions to one-to-many. Fun, effective, and built to include everyone, so a class fills and keeps filling instead of resetting every time a client drops off.'},

  {t:'pillar',
    kick:'Part Three of the system: The Marketing',
    h:'A predictable way to fill the room',
    body:'A simple, repeatable way to put the method in front of new people and turn them into members, so growth stops depending on referrals and lucky months.'},

  {t:'pillar',
    kick:'Part Four of the system: The Development',
    h:'You never run it alone',
    body:'Over 80 hours of training a year, quarterly days at Lilleshall National Sports Centre, monthly workshops with the master-trainer team, and a coaching community that has already solved the problem you are about to hit.'},

  {t:'quote',
    kick:'Why it works',
    quote:'The system has worked for <span class="hl">every</span> business that followed it. It only works <span class="hl">if you do</span>.'},

  {t:'section',
    kick:'Part Three',
    h:'From first class to full studio',
    body:'This is not theory. It is a path with clear steps, each one earning while it builds the next.'},

  {t:'path',
    kick:'The path',
    h:'From first class to your own studio',
    bullets:[
      '<b>Certify</b> in the Wild Training method and run your first outdoor classes.',
      '<b>Grow</b> membership and add sessions as demand builds.',
      '<b>Open</b> your own studio with the system, the brand and the support behind you.']},

  {t:'who2',
    kick:'Who thrives here',
    h:'Right fit, honest fit',
    bullets:[
      '<b>For</b> trainers who want to own something, not just be employed by a gym.',
      '<b>For</b> people who will follow a proven process instead of reinventing it.',
      '<b>Not</b> for anyone looking for passive income without the work.']},

  {t:'why',
    kick:'Why me',
    h:'Built in the real world',
    body:'I founded Wild Training and built the gym that the Independent Gym Owners group voted the best independent gym in the UK. My own creed is a life with no limit: the highest-altitude workout ever recorded, 1,000 kettlebell snatches in under an hour. The system I teach is the one I actually run.'},

  {t:'recap',
    kick:'The whole thing in one view',
    h:'Method. Model. Marketing. Mentorship.',
    body:'A product only you can deliver, income that is not chained to your diary, a predictable way to fill it, and a team behind you the whole way. That is a fitness business that does not fail.'},

  {t:'cta',
    kick:'Your next step',
    h:'Build yours with us',
    body:'If you want the method, the model and the support behind your own fitness business, the next step is a conversation about becoming a Wild Training Affiliate.',
    cta:'Apply to become a Wild Training Affiliate',
    disc:'This masterclass is educational. It shares the Wild Training approach and is not a guarantee of income or results. Outcomes depend on your effort, market and how fully you follow the process.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kick) html += '<div class="kick">' + s.kick + '</div>';
  if (s.h)    html += (s.t === 'title' ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>');
  if (s.sub)  html += '<div class="sub">' + s.sub + '</div>';
  if (s.big)  html += '<div class="big">' + s.big + '</div>';
  if (s.quote)html += '<div class="quote">' + s.quote + '</div>';
  if (s.body) html += '<div class="body">' + s.body + '</div>';
  if (s.bullets){ html += '<ul>'; s.bullets.forEach(b => html += '<li>' + b + '</li>'); html += '</ul>'; }
  if (s.cta)  html += '<div class="cta-line">' + s.cta + '</div>';
  if (s.pres) html += '<div class="pres">' + s.pres + '</div>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  html += '<div class="foot">Wild Training &middot; ' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
