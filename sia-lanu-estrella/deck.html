<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Rainbow Pyramid: Becoming the Master Creator of Your Reality</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+Pro:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0A0E1A;        /* deep cosmic indigo-black (brand dominant + dark scheme) */
    --panel:#141A2E;     /* lifted indigo panel */
    --rule:#2A3350;      /* muted indigo hairline */
    --accent:#BAAC97;    /* warm gold (brand.json rank 3) — single dominant accent */
    --accent2:#4C92A3;   /* teal (brand.json rank 2) — secondary starlight */
    --ink:#F3EEE4;       /* warm off-white */
    --muted:#9AA3B8;     /* muted indigo-grey */
    --display:'Cormorant Garamond', Georgia, serif;
    --body:'Source Sans Pro', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 60px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden}
  .slide::before{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(1px 1px at 20% 30%, rgba(243,238,228,.25), transparent 60%),
      radial-gradient(1px 1px at 70% 20%, rgba(243,238,228,.20), transparent 60%),
      radial-gradient(1px 1px at 82% 68%, rgba(186,172,151,.30), transparent 60%),
      radial-gradient(1px 1px at 38% 80%, rgba(76,146,163,.25), transparent 60%),
      radial-gradient(1px 1px at 55% 50%, rgba(243,238,228,.15), transparent 60%);}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.04;letter-spacing:.3px}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.08}
  .sub{font-family:var(--display);font-style:italic;font-size:26px;color:var(--muted);margin-top:18px}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch;margin-top:18px}
  .big{font-family:var(--display);font-size:72px;line-height:1.02;font-weight:600}
  ul{margin-top:24px;list-style:none;max-width:48ch}
  li{font-size:21px;line-height:1.5;padding-left:28px;position:relative;margin-bottom:16px}
  li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;
    transform:rotate(45deg);border:1.5px solid var(--accent)}
  .label-n{font-family:var(--display);font-size:20px;color:var(--accent2);letter-spacing:.1em;margin-bottom:10px}
  .present{margin-top:36px;font-size:17px;color:var(--muted)}
  .tri{width:0;height:0;border-left:26px solid transparent;border-right:26px solid transparent;
    border-bottom:44px solid var(--accent);margin:0 0 26px;opacity:.9}
  .disc{margin-top:28px;font-size:13px;line-height:1.5;color:var(--muted);max-width:62ch;
    border-top:1px solid var(--rule);padding-top:18px}
  .foot{position:absolute;bottom:22px;left:60px;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass',
    h:'The Rainbow Pyramid',
    sub:'Becoming the Master Creator of Your Reality',
    present:'with Sia-Lanu Estrella, author and channel of the Rainbow Tablets' },

  {t:'promise', kick:'What you will leave with',
    h:'One daily practice, and a new way to hold your life',
    body:'By the end of this hour you will understand why so much manifestation work stalls, and you will have the Rainbow Pyramid: a simple morning practice you can keep.' },

  {t:'who', kick:'Who this is for',
    h:'The seeker who has done the work',
    body:'You have read the books. You have sat in the courses. And still, the life you can feel is possible stays just out of reach. This is for you.' },

  {t:'trap', kick:'The story you were handed',
    h:'You were told manifesting is about wanting it more',
    body:'Vision boards. Affirmations. Trying to feel positive on command. When it does not work, you are told you simply did not believe hard enough.' },

  {t:'hook',
    big:'You are not blocked. You are unprotected.',
    sub:'The field you create from matters more than the wish you send.' },

  {t:'part', n:'Part One', h:'Why manifesting stalls' },

  {t:'content', kick:'Three reasons', h:'It is rarely about belief',
    items:['No daily practice, so the state never holds past the morning.',
           'No energetic container, so you absorb everyone else’s field.',
           'Chasing the outcome instead of becoming the person who creates it.'] },

  {t:'content', kick:'The shift', h:'Creation is a state you hold',
    body:'Not a wish you send once and wait on. The question stops being what do I want, and becomes who am I being, every morning, before the day touches me.' },

  {t:'part', n:'Part Two', h:'The Rainbow Pyramid' },

  {t:'content', kick:'The practice', h:'A five-minute morning practice',
    body:'The Rainbow Pyramid is the daily protection and sovereignty practice at the center of the Rainbow Tablets work. You run it first thing, before the inbox, before the news.' },

  {t:'content', kick:'How it moves', h:'Protect, stand, create',
    items:['Protect the field, so what is not yours stops running your day.',
           'Stand sovereign inside it, rooted and clear.',
           'Create from that place, as the one choosing, not the one reacting.'] },

  {t:'content', kick:'Where it comes from', h:'Inside the Rainbow Tablets',
    body:'The practice sits within a larger cosmology: sacred geometry, the elements, the streams of consciousness and the creator force. The Pyramid is simply the doorway you walk through each morning.' },

  {t:'content', kick:'The identity', h:'From reactor to creator',
    body:'The Master Creator is not a person who gets everything they want. It is a person who meets the day already whole, and creates from that wholeness instead of from lack.' },

  {t:'part', n:'Part Three', h:'Living it, morning by morning' },

  {t:'content', kick:'The rhythm', h:'Small, daily, kept',
    body:'Five minutes a morning. A weekly live journey to go deeper. A practice simple enough that you actually keep it, which is the only reason any of it works.' },

  {t:'content', kick:'Honestly', h:'Who this is, and is not, for',
    items:['For you if you are ready to practice daily, not just read about it.',
           'For you if you want depth, not a quick fix.',
           'Not for you if you want someone to do the holding for you.'] },

  {t:'why', kick:'Why me', h:'From corporate to the Rainbow Tablets',
    body:'I spent a decade succeeding at a life that looked right and felt hollow. Three years in Peru and the channeling of the Rainbow Tablets changed that. Today I teach the practice that brought me home to myself.' },

  {t:'content', kick:'Recap', h:'The three things to take',
    items:['Manifesting stalls without a daily practice and a protected field.',
           'The Rainbow Pyramid is that practice, five minutes a morning.',
           'The Master Creator creates from wholeness, not from wanting.'] },

  {t:'cta', kick:'Your doorway in', h:'Join the Rainbow Tablets Mystery School',
    body:'If the practice spoke to you, the Mystery School is where we take it all the way: seven live weekly sessions, the full Rainbow Tablets cosmology, and a community walking it with you. Doors and details are on the enrollment page.',
    disc:'This masterclass is offered for educational and personal-growth purposes only. Spiritual and personal-development practices are experienced differently by every individual. Nothing here is a promise or guarantee of any particular result, and your experience is your own.' }
];

const deck = document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kick) html += `<div class="kick">${esc(s.kick)}</div>`;
  if (s.t==='title'){ html += `<h1>${esc(s.h)}</h1><div class="sub">${esc(s.sub)}</div><div class="present">${esc(s.present)}</div>`; }
  else if (s.t==='hook'){ html = `<div class="tri"></div><div class="big">${esc(s.big)}</div><div class="sub">${esc(s.sub)}</div>`; }
  else if (s.t==='part'){ html += `<div class="label-n">${esc(s.n)}</div><h2>${esc(s.h)}</h2>`; }
  else { html += `<h2>${esc(s.h)}</h2>`; }
  if (s.body) html += `<p>${esc(s.body)}</p>`;
  if (s.items){ html += '<ul>' + s.items.map(x=>`<li>${esc(x)}</li>`).join('') + '</ul>'; }
  if (s.disc) html += `<div class="disc">${esc(s.disc)}</div>`;
  html += `<div class="foot">Sia-Lanu Estrella &middot; The Rainbow Tablets</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
