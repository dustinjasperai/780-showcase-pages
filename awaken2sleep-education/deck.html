<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sleep PIVOT — a masterclass for dentist-owners</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#091526;
    --panel:#161e2a;
    --rule:#2c4373;
    --chalk:#f4f1e8;
    --dim:#9fb3c9;
    --accent:#ffd20a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--chalk);font-family:"Quattrocento Sans",sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 54px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .num{position:absolute;top:20px;right:26px;font-size:13px;color:var(--dim);letter-spacing:.14em}
  .kick{font-size:14px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:"PT Serif",serif;font-weight:700;font-size:52px;line-height:1.08;margin-bottom:18px}
  h2{font-family:"PT Serif",serif;font-weight:700;font-size:36px;line-height:1.14;margin-bottom:14px}
  p{font-size:20px;line-height:1.55;color:var(--chalk);max-width:40em}
  p.sub{color:var(--dim);font-size:19px;margin-top:10px}
  .lead{font-size:26px;line-height:1.4}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:2px;background:var(--accent)}
  .big{font-family:"PT Serif",serif;font-size:60px;color:var(--accent);line-height:1}
  .strike{color:var(--dim);text-decoration:line-through}
  .gold{color:var(--accent)}
  .part .kick{color:var(--accent)}
  .part h1{font-size:44px}
  .rule{height:2px;background:var(--rule);width:72px;margin:20px 0}
  .disc{color:var(--dim);font-size:15px;line-height:1.5;margin-top:22px;max-width:44em}
  .foot{position:absolute;bottom:18px;left:54px;font-size:12px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', kick:'A live masterclass for dentist-owners', h:'The Sleep PIVOT', p:'How a dental practice turns a 5-year goal into a 2-year reality by making sleep the point, not a side service.'},
  {t:'who', kick:'Who this is for', h:'You already believe in sleep.', p:'You have treated a few patients. You own the appliance. You know the medicine matters. And every year the sleep side stays small, squeezed between crowns and hygiene.', sub:'This hour is for the owner who keeps meaning to do more sleep and never quite commits.'},
  {t:'trap', kick:'The honest part', h:'Dabbling in sleep never changes the practice.', p:'A case here and there does not build a sleep practice. It builds a hobby that competes with your schedule and loses. The problem was never your clinical skill.'},
  {t:'reframe', kick:'The reframe', h:'The practices that win do not add sleep.', p:'They pivot to it. They decide sleep is the point, then build the team, the schedule, and the systems around that decision. That one choice is what separates a sleep practice from a practice that sometimes does sleep.'},
  {t:'part', kick:'Part One', h:'Why a little sleep on the side stalls'},
  {t:'point', kick:'The stall', h:'Sleep loses every calendar fight.', p:'When sleep shares the schedule with restorative, restorative always wins the block. The sleep patient waits, reschedules, and drifts. Growth that depends on leftover time never compounds.'},
  {t:'point', kick:'The real cost', h:'A general practice treats sleep like a favor.', p:'Favors do not get a dedicated room, a trained coordinator, or a follow-up system. So outcomes stay uneven, and uneven outcomes keep you from going all in. The loop feeds itself.'},
  {t:'point', kick:'The bottleneck', h:'It is commitment and a system, not more CE.', p:'Most owners already know enough medicine to start. What is missing is the decision to make sleep the practice, and the operating system that makes the decision real.'},
  {t:'part', kick:'Part Two', h:'The PIVOT blueprint'},
  {t:'framework', kick:'The blueprint', h:'Four moves turn a dabble into a practice.', items:['The signs your practice is ready to go sleep-only','The earnings a sleep-focused model actually makes','How to structure the sleep team and operations','Real transformations from dentists who pivoted']},
  {t:'point', kick:'Move one', h:'The signs you are ready.', p:'Patient demand you keep turning away. A team member who lights up on sleep. Referral relationships you have never fully worked. We name the readiness signals so the decision stops feeling like a leap.'},
  {t:'point', kick:'Move two', h:'The math of a sleep-focused model.', p:'A sleep case carries a different value and a different schedule than a filling. When you model a week built around sleep instead of around leftover slots, the earnings picture changes before you add a single new patient.'},
  {t:'point', kick:'Move three', h:'The team and the operating system.', p:'A dedicated coordinator, a screening rhythm the whole practice runs, and a follow-up path that does not depend on you remembering. The system is what makes the outcomes repeatable.'},
  {t:'point', kick:'Move four', h:'What the pivot looks like when it works.', p:'Awaken2Sleep has guided over 1,000 dental professionals and helped generate more than $4 million in new practice revenue across the practices that made the move. The transformation is a different practice, not a better side hustle.'},
  {t:'part', kick:'Part Three', h:'Life after the pivot'},
  {t:'point', kick:'A normal week', h:'Mornings blocked for sleep.', p:'A dedicated room. A coordinator who owns the schedule. Screening built into every hygiene visit. The sleep patient is no longer the exception you fit in, they are who you built the week for.'},
  {t:'point', kick:'You do not build it alone', h:'Founder-led implementation.', p:'The pivot is done with you, not handed to you as a binder. Testing interpretation, telemedicine support, and the team training sit behind you, so the clinical weight of running sleep does not land on one owner.'},
  {t:'cred', kick:'Why listen to this', h:'Michael Cowen has lived both sides of sleep.', p:'Twenty-plus years in sleep medicine, starting as a pediatric sleep technician. The training let him help save his own infant daughter from obstructive sleep apnea. He went on to build and run sleep centers nationwide, then founded Awaken2Sleep to bring that business-of-sleep expertise to dental practices.'},
  {t:'recap', kick:'The whole thing in one line', h:'Decide sleep is the point.', p:'Name the signs, model the earnings, build the team and the system, and let founder-led support carry the clinical load. That is the pivot.'},
  {t:'cta', kick:'Your next step', h:'Ready to map your pivot?', p:'Book a call with the Awaken2Sleep team and we will walk through where your practice is, where it could go, and the next three steps to get there.', disc:'This masterclass is educational. No specific financial result is guaranteed. Results vary by practice, market, team, and effort. Nothing here is medical, legal, or financial advice.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='part'?'part':'');
  let inner='<div class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</div>';
  if(s.kick) inner+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='title'){inner+='<h1>'+s.h+'</h1><p class="lead">'+s.p+'</p>';}
  else if(s.t==='part'){inner+='<h1>'+s.h+'</h1><div class="rule"></div>';}
  else if(s.t==='framework'){inner+='<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  else {inner+='<h2>'+s.h+'</h2>'; if(s.p) inner+='<p>'+s.p+'</p>'; if(s.sub) inner+='<p class="sub">'+s.sub+'</p>';}
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  inner+='<div class="foot">Awaken2Sleep &middot; The Sleep PIVOT</div>';
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
