<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Keep What You Make · Billy Hofacker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lato:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c0d0f; --panel:#15171b; --rule:#2b2f36;
    --accent:#fcfc0d; --chalk:#f4f4f2; --dim:#a8adb5;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Lato',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:700;color:var(--chalk);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:5vw;font-weight:800}
  .t-title h1 b{color:var(--accent);font-weight:800}
  .t-normal h1{font-size:3.3vw;max-width:86%}
  .t-normal h1 b{color:var(--accent);font-weight:700}
  .t-normal .body{font-family:'Lato',sans-serif;font-size:1.5vw;color:var(--dim);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:400}
  .sub{font-family:'Lato',sans-serif;font-size:1.85vw;color:var(--dim);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.3vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#191b1f 0%,#0a0b0c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:#f7f7f2}
  .t-dark h1 b{color:var(--accent)}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#191b1f 0%,#0a0b0c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Montserrat',sans-serif;border:1.5px solid var(--accent);color:var(--accent);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .ledger-motif{position:absolute;pointer-events:none;opacity:.92}
  .title-ledger{right:7%;bottom:8%;width:24vw}
  .corner-ledger{right:6%;bottom:7.2%;width:11vw;opacity:.42}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.3vw;color:var(--dim);margin-top:3.4vh;font-weight:600;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.7vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Keep What You Make</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- money motif: a ledger baseline with the take-home bar finally climbing to a node -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 280 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="16" y1="132" x2="264" y2="132" stroke="#a8adb5" opacity="0.35"/>
    <rect x="40" y="112" width="26" height="20" rx="3" fill="#fcfc0d" opacity="0.18" stroke="none"/>
    <rect x="86" y="98" width="26" height="34" rx="3" fill="#fcfc0d" opacity="0.28" stroke="none"/>
    <rect x="132" y="80" width="26" height="52" rx="3" fill="#fcfc0d" opacity="0.42" stroke="none"/>
    <rect x="178" y="54" width="26" height="78" rx="3" fill="#fcfc0d" opacity="0.62" stroke="none"/>
    <path d="M40 118 L99 104 L145 86 L191 58" stroke="#fcfc0d" opacity="0.95"/>
    <circle cx="191" cy="58" r="5.5" fill="none" stroke="#fcfc0d" stroke-width="2.8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Keep What You <b>Make</b>',sub:'The money masterclass for gym and studio owners. How to turn a full gym into take-home pay you can count on.',brand:true,ledger:'title'},
 {t:'normal',k:'Who this is for',title:'Your gym is full. Your bank account is not.',body:'You are booked, the classes are packed, the revenue looks healthy. And still, at the end of the month, there is almost nothing left for you. If that gap is the frustrating part, this hour is for you.'},
 {t:'dark',title:'You do not have a revenue problem. You have a <b>money</b> problem.'},

 {t:'section',idx:'Part One',title:'The Owner Who Pays Themselves Last'},
 {t:'normal',k:'Why it happens',title:'A gym runs on revenue and gets rich on <b>profit</b>.',body:'Nobody taught fit pros the difference. So we chase the top line, add members, add classes, add hours, and assume the money will follow. It does not follow on its own. Profit is built on purpose or it does not show up.'},
 {t:'normal',k:'The real cost',title:'You built a job that pays everyone but you.',body:'Rent, equipment, staff, software, taxes. They all get paid first, and the owner takes whatever is left, which is often nothing. That is not a business you own. That is a business that owns you.'},
 {t:'dark',title:'More members will not fix a money system that <b>leaks</b>.'},

 {t:'section',idx:'Part Two',title:'The Four Moves: Keep What You Make'},
 {t:'normal',k:'Move one',title:'Get a <b>vision</b> for the money.',body:'Before a single number changes, decide what the money is actually for. The debt-free date, the salary you take home, the life outside the gym. A plan with no destination gets abandoned by February.'},
 {t:'normal',k:'Move two',title:'Build a gym owner\'s <b>spending plan</b>.',body:'Give every dollar a job, business and personal, before the month starts. This is the move that flips the order so you are no longer paid last. It is a plan you actually run, not a budget you feel guilty about.'},
 {t:'normal',k:'Move three',title:'Knock out debt, <b>smallest first</b>.',body:'The debt snowball is the method that got me out. You attack the smallest balance first for the win and the momentum, then roll it into the next. For a stressed owner, momentum beats math every time.'},
 {t:'normal',k:'Move four',title:'Finally <b>pay yourself</b>.',body:'Your pay is built into the plan, not scraped from the leftovers. When paying yourself is a line item instead of a hope, take-home pay stops being the thing that never happens.'},
 {t:'dark',title:'Vision, spending plan, debt, pay yourself. That is how the money <b>stays</b>.'},

 {t:'section',idx:'Part Three',title:'What Actually Changes'},
 {t:'normal',k:'The monthly rhythm',title:'Profit becomes a <b>decision</b>, not a surprise.',body:'Once the four moves run every month, you know your numbers before the month ends, you pay yourself on schedule, and profit is something you chose in the plan rather than something you hope is there at year end.'},
 {t:'normal',k:'Why I can teach this',title:'I dug my own gym out of six figures of debt.',body:'I have trained for over twenty years and run Total Body Boot Camp on Long Island. I carried well past six figures in debt, worked my way out with these exact moves, and have since helped hundreds of fit pros do the same. This is lived, not theory.'},
 {t:'dark',title:'The goal was never a busier gym. It was a <b>freer you</b>.'},

 {t:'section',idx:'Your next step',title:'Keep Going With Me'},
 {t:'normal',k:'How I can help',title:'The Profit Growth Mastermind.',body:'This is where the four moves become a habit: community, accountability, and coaching built for fitness owners who want to keep what they make. The Financial Freedom course and my book Fitness Profits are there to get you started, and the mastermind is where it sticks.'},
 {t:'cta',title:'Ready to keep what your gym makes?',chips:['Join the Profit Growth Mastermind','Book a call with Billy'],disc:'Educational content for gym and studio owners. No income, revenue, or financial result is guaranteed. Results vary by owner, business, and market.'},
];

const deck=document.getElementById('deck');
function ledger(kind){return `<svg class="ledger-motif ${kind==='title'?'title-ledger':'corner-ledger'}"><use href="#ledger"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Your Fitness Money Coach · <b>Billy Hofacker</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.ledger) h+=ledger(s.ledger);
  else if(s.t==='title') h+=ledger('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
