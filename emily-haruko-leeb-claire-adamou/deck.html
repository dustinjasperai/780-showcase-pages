<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trust Index — Saroca Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1ea;      /* warm cream ground (brand body bg) */
    --panel:#e0d9d1;   /* brand dominant cream */
    --rule:#244233;    /* brand forest green */
    --accent:#eeb32b;  /* brand gold */
    --ink:#2a2622;     /* brand ink */
    --muted:#6a6459;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--rule);color:var(--ink);font-family:'Poppins',sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--bg);border-radius:14px;margin:0 0 22px;padding:56px 60px;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;
    position:relative;box-shadow:0 1px 0 rgba(0,0,0,.05);overflow:hidden;
  }
  .kicker{font-family:'Poppins';font-weight:600;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--rule);margin-bottom:18px}
  .kicker b{color:var(--accent)}
  h1{font-family:'Lora';font-weight:600;font-size:52px;line-height:1.08;color:var(--rule);margin-bottom:18px}
  h2{font-family:'Lora';font-weight:600;font-size:38px;line-height:1.14;color:var(--rule);margin-bottom:16px}
  h3{font-family:'Lora';font-weight:600;font-size:27px;line-height:1.2;color:var(--ink);margin-bottom:10px}
  p{font-size:19px;line-height:1.62;color:var(--ink);max-width:46ch;margin-bottom:12px}
  p.lead{font-size:22px;color:var(--ink)}
  .sub{font-size:19px;color:var(--muted);max-width:52ch}
  .rulebar{width:64px;height:5px;background:var(--accent);border-radius:3px;margin:2px 0 26px}
  .who{font-size:20px;color:var(--ink);line-height:1.7;max-width:50ch}
  .who li{margin:0 0 8px 22px}
  .facets{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px}
  .facet{background:var(--panel);border-radius:10px;padding:18px 20px}
  .facet .l{font-family:'Lora';font-weight:600;font-size:22px;color:var(--rule)}
  .facet .l b{color:var(--accent)}
  .facet .d{font-size:14.5px;color:var(--muted);margin-top:4px;line-height:1.45}
  .big{font-family:'Lora';font-weight:600;font-size:104px;color:var(--accent);line-height:1}
  .letterwrap{display:flex;align-items:center;gap:34px}
  .metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:26px}
  .metric .n{font-family:'Lora';font-weight:600;font-size:44px;color:var(--rule)}
  .metric .n span{color:var(--accent)}
  .metric .c{font-size:15px;color:var(--muted);margin-top:2px;line-height:1.4}
  .step{display:flex;gap:16px;align-items:baseline;margin:0 0 14px}
  .step .k{font-family:'Lora';font-weight:600;color:var(--accent);font-size:24px;min-width:34px}
  .step .t{font-size:19px;color:var(--ink);line-height:1.5;max-width:44ch}
  .cta h2{font-size:44px}
  .cta .btn{display:inline-block;margin-top:14px;background:var(--rule);color:var(--bg);
    font-family:'Poppins';font-weight:600;font-size:18px;padding:15px 30px;border-radius:9px}
  .disclaimer{position:absolute;left:60px;right:60px;bottom:22px;font-size:12.5px;color:var(--muted);
    line-height:1.5;max-width:none}
  .pagen{position:absolute;top:26px;right:32px;font-size:12px;color:var(--muted);letter-spacing:.1em}
  .brandmark{position:absolute;top:26px;left:32px;font-family:'Lora';font-weight:600;font-size:15px;
    letter-spacing:.22em;color:var(--rule);text-transform:uppercase}
  @media(max-width:720px){
    .slide{padding:38px 26px;min-height:auto}
    h1{font-size:36px}h2{font-size:28px}.facets,.metrics{grid-template-columns:1fr}
    .big{font-size:72px}.disclaimer{position:static;margin-top:22px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',
  kicker:'A Saroca Masterclass for Gaming Leaders',
  h:'The Trust Index',
  sub:'How the best gaming leaders build teams that perform under 24/7 pressure, without burning out the people who carry the floor.',
  foot:'Presented by Emily Haruko, CEO &amp; Executive Coach, Saroca'},

 {t:'statement',
  kicker:'What you will leave with',
  h:'A way to actually see your floor.',
  p:'By the end of this hour you will be able to score your own operation on the six dimensions that decide whether it performs, and name the single one that is costing you the most right now.'},

 {t:'who',
  kicker:'Who this is for',
  h:'You lead a floor that never closes.',
  bullets:[
   'VPs, directors, and operations leaders in the gaming industry',
   'Teams that run 24/7, where a bad night still has to become a good morning',
   'Leaders who were promoted for their numbers and now own the culture too'],
  sub:'If your title changed but nobody handed you a way to lead the people, this hour is for you.'},

 {t:'statement',
  kicker:'The trap',
  h:'You were measured on KPIs, so you learned to lead by KPIs.',
  p:'It works, until it does not. The floor optimizes whatever you count. Hit the number, protect the number, hide anything that threatens the number. The dashboard looks healthy while the culture quietly comes apart underneath it.'},

 {t:'statement',
  kicker:'The reframe',
  h:'Your best people do not leave over pay.',
  p:'They leave over trust. The silence in your one-to-ones, the escalation that came a shift too late, the quiet quitting no report will ever flag. Those are culture signals, and a KPI dashboard is built to miss every one of them.'},

 {t:'part',
  kicker:'Part one',
  h:'Performance and culture are not two things.',
  p:'In a 24/7 operation they are the same system. When trust is high, information moves fast and problems surface early. When trust is low, everything routes around the leader, and you find out last.'},

 {t:'statement',
  kicker:'What low trust costs a floor',
  h:'The bill arrives quietly, then all at once.',
  p:'Hidden attrition you only see at exit. Escalations that arrive after the guest already walked. Decisions made in fear of being blamed. None of it shows up in a nightly report, and all of it shows up in your results a quarter later.'},

 {t:'framework-intro',
  kicker:'Part two, the framework',
  h:'The SAROCA INDEX',
  sub:'Six dimensions of a high-trust operation. Score honestly on each and you can see exactly where your floor is strong and where it is leaking.'},

 {t:'facets',
  kicker:'The six dimensions',
  h:'What a high-trust floor is actually made of',
  facets:[
   {l:'<b>S</b>afety',d:'People raise a problem before it hits the floor, not after.'},
   {l:'<b>A</b>lignment',d:'Every leader can name the same three priorities this quarter.'},
   {l:'<b>R</b>esilience',d:'The team recovers from a bad night without burning out.'},
   {l:'<b>O</b>ptimization',d:'Improvement is continuous and owned by the team, not imposed.'},
   {l:'<b>C</b>amaraderie',d:'Relationships are the real retention engine, not the pay band.'},
   {l:'<b>A</b>ccountability',d:'Standards are held with respect, never with fear.'}]},

 {t:'letter',
  kicker:'Dimension one',
  letter:'S',
  h:'Safety',
  p:'The first question is not whether your people are capable. It is whether they will tell you the truth when something is wrong. On a high-trust floor, bad news travels toward the leader. On a low-trust floor, it travels around them.'},

 {t:'letter',
  kicker:'Dimension two',
  letter:'A',
  h:'Alignment',
  p:'Alignment is when every leader on the floor can name the same three priorities this quarter without checking a slide. Without it, everyone is busy, and busy in a slightly different direction.'},

 {t:'letter',
  kicker:'Dimension three',
  letter:'R',
  h:'Resilience',
  p:'Resilience is what lets a team absorb a brutal shift and still show up steady the next one. It is built in the calm, not the crisis, through how you debrief and how you protect recovery.'},

 {t:'letter',
  kicker:'Dimension four',
  letter:'O',
  h:'Optimization',
  p:'Optimization is improvement the team owns instead of dreading. When people trust that a better idea will actually be heard, they bring you the fix before you have to go looking for the problem.'},

 {t:'letter',
  kicker:'Dimension five',
  letter:'C',
  h:'Camaraderie',
  p:'Camaraderie is the relationship layer that keeps good people through a hard year. It is not pizza nights. It is whether people feel known, and whether they would choose these colleagues again.'},

 {t:'letter',
  kicker:'Dimension six',
  letter:'A',
  h:'Accountability',
  p:'Accountability is holding the line with respect, so standards feel like care rather than surveillance. Held well, it raises the floor for everyone. Held badly, it just teaches people to hide.'},

 {t:'steps',
  kicker:'How to use it',
  h:'Empathize, Customize, Activate',
  steps:[
   {k:'1',t:'Empathize. Score where your floor actually sits on each of the six dimensions, honestly, before you fix anything.'},
   {k:'2',t:'Customize. Choose the one or two dimensions that are costing you the most right now, not all six at once.'},
   {k:'3',t:'Activate. Build the habit into how your leaders run a shift, so the change survives past the workshop.'}]},

 {t:'part',
  kicker:'Part three',
  h:'What a high-trust floor feels like',
  p:'Problems surface early enough to fix. Feedback is a normal part of a shift, not an annual event. People stay, and the ones who stay get better. The numbers you were chasing start following the culture, instead of fighting it.'},

 {t:'metrics',
  kicker:'Why this, why me',
  h:'This is the work Saroca does with gaming leaders.',
  sub:'Emily Haruko has coached corporate transformation since 2013, building equitable, diverse leaders inside the gaming industry. From the leaders who have been through the program:',
  metrics:[
   {n:'<span>89</span>',c:'Net Promoter Score from program participants'},
   {n:'<span>48%</span>',c:'increase in ability to deliver feedback'},
   {n:'<span>30%</span>',c:'reduction in reported imposter syndrome'}]},

 {t:'statement',
  kicker:'The first step',
  h:'You cannot fix what you have not measured.',
  p:'Before you change a single meeting, score your floor on the six dimensions. Most leaders already suspect where the leak is. The index just makes it clear enough to act on.'},

 {t:'cta',
  kicker:'Start with your own floor',
  h:'Run your own SAROCA INDEX.',
  p:'Take the assessment, see where your floor sits on the six dimensions, and if it is useful, register your interest in the next Transformational Leadership Program cohort for gaming leaders.',
  btn:'Take the SAROCA INDEX',
  disclaimer:'This masterclass is for educational purposes only. It shares a leadership framework and is not a guarantee of any specific business, financial, or career result. Outcomes vary by leader, team, and organization.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let inner='<div class="brandmark">Saroca</div><div class="pagen">'+(i+1)+' / '+S.length+'</div>';
  if(s.kicker) inner+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){
    inner+='<h1>'+s.h+'</h1><div class="rulebar"></div><p class="sub">'+s.sub+'</p><p class="sub" style="margin-top:26px;color:var(--rule);font-weight:500">'+s.foot+'</p>';
  } else if(s.t==='who'){
    inner+='<h2>'+s.h+'</h2><ul class="who">'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul><p class="sub" style="margin-top:18px">'+s.sub+'</p>';
  } else if(s.t==='statement'||s.t==='part'){
    inner+='<h2>'+s.h+'</h2><div class="rulebar"></div><p class="lead">'+s.p+'</p>';
  } else if(s.t==='framework-intro'){
    inner+='<h1>'+s.h+'</h1><div class="rulebar"></div><p class="sub">'+s.sub+'</p>';
  } else if(s.t==='facets'){
    inner+='<h2>'+s.h+'</h2><div class="facets">'+s.facets.map(f=>'<div class="facet"><div class="l">'+f.l+'</div><div class="d">'+f.d+'</div></div>').join('')+'</div>';
  } else if(s.t==='letter'){
    inner+='<div class="letterwrap"><div class="big">'+s.letter+'</div><div><h3>'+s.h+'</h3><p>'+s.p+'</p></div></div>';
  } else if(s.t==='steps'){
    inner+='<h2>'+s.h+'</h2><div class="rulebar"></div>'+s.steps.map(st=>'<div class="step"><div class="k">'+st.k+'</div><div class="t">'+st.t+'</div></div>').join('');
  } else if(s.t==='metrics'){
    inner+='<h2>'+s.h+'</h2><p class="sub">'+s.sub+'</p><div class="metrics">'+s.metrics.map(m=>'<div class="metric"><div class="n">'+m.n+'</div><div class="c">'+m.c+'</div></div>').join('')+'</div>';
  } else if(s.t==='cta'){
    inner+='<h2>'+s.h+'</h2><div class="rulebar"></div><p class="lead">'+s.p+'</p><div class="btn">'+s.btn+'</div><div class="disclaimer">'+s.disclaimer+'</div>';
  }
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
