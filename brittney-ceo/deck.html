<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Big Assets | Brittney CEO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#f7f6f5;        /* her cream */
    --panel:#ffffff;
    --ink:#1a1a1a;       /* her near-black */
    --ink-soft:#3b3b38;
    --ink-muted:#7a7873;
    --accent:#183d2e;    /* her brand emerald */
    --rule:#e4e1da;
  }
  html,body { height:100%; }
  body {
    font-family:'Lora', Georgia, serif;
    background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
  }
  #stage { width:100vw; height:100vh; position:relative; }
  .slide {
    position:absolute; inset:0; display:none;
    flex-direction:column; justify-content:center;
    padding:8vh 10vw;
  }
  .slide.active { display:flex; }
  .kicker {
    font-family:'Montserrat', sans-serif; font-weight:600;
    font-size:13px; letter-spacing:.22em; text-transform:uppercase;
    color:var(--accent); margin-bottom:22px;
  }
  .num {
    font-family:'Montserrat', sans-serif; font-weight:700;
    font-size:clamp(48px,9vw,120px); line-height:.9; color:var(--accent);
    opacity:.16; position:absolute; top:7vh; right:9vw;
  }
  h1 {
    font-family:'Montserrat', sans-serif; font-weight:700;
    font-size:clamp(34px,6vw,76px); line-height:1.04; letter-spacing:-.01em;
    color:var(--ink); margin-bottom:24px;
  }
  h2 {
    font-family:'Montserrat', sans-serif; font-weight:700;
    font-size:clamp(28px,4.6vw,52px); line-height:1.08;
    color:var(--ink); margin-bottom:20px;
  }
  .lede { font-size:clamp(19px,2.3vw,30px); color:var(--ink-soft); max-width:60ch; line-height:1.5; }
  .lede.em { color:var(--ink); }
  p.body { font-size:clamp(17px,1.9vw,23px); color:var(--ink-soft); max-width:62ch; line-height:1.6; margin-top:14px; }
  .rule { width:64px; height:3px; background:var(--accent); margin:0 0 28px; }
  .brand { font-family:'Montserrat', sans-serif; font-weight:600; letter-spacing:.2em; text-transform:uppercase; font-size:14px; color:var(--ink-muted); margin-top:40px; }
  ul.pillars { list-style:none; margin-top:10px; display:flex; flex-direction:column; gap:20px; max-width:64ch; }
  ul.pillars li { display:flex; gap:18px; align-items:flex-start; }
  ul.pillars .n { font-family:'Montserrat',sans-serif; font-weight:700; color:var(--accent); font-size:22px; min-width:34px; }
  ul.pillars .t { font-size:clamp(17px,1.9vw,22px); color:var(--ink-soft); line-height:1.5; }
  ul.pillars .t b { color:var(--ink); font-weight:600; }
  .two { display:flex; gap:48px; flex-wrap:wrap; margin-top:10px; }
  .card { flex:1 1 240px; background:var(--panel); border:1px solid var(--rule); border-left:4px solid var(--accent); padding:26px 28px; }
  .card h3 { font-family:'Montserrat',sans-serif; font-weight:600; font-size:19px; color:var(--ink); margin-bottom:10px; }
  .card p { font-size:17px; color:var(--ink-soft); line-height:1.5; }
  .big-stat { font-family:'Montserrat',sans-serif; font-weight:700; font-size:clamp(40px,7vw,84px); color:var(--accent); line-height:1; margin-top:10px; }
  .cta-box { margin-top:10px; background:var(--panel); border:1px solid var(--rule); padding:34px 36px; max-width:60ch; }
  .cta-box h3 { font-family:'Montserrat',sans-serif; font-weight:700; font-size:22px; margin-bottom:12px; }
  .cta-box p { font-size:18px; color:var(--ink-soft); line-height:1.55; }
  .disclaimer { font-family:'Montserrat',sans-serif; font-size:12px; color:var(--ink-muted); margin-top:26px; max-width:68ch; line-height:1.5; letter-spacing:.01em; }
  .nav { position:fixed; bottom:22px; right:28px; font-family:'Montserrat',sans-serif; font-size:13px; color:var(--ink-muted); display:flex; align-items:center; gap:16px; z-index:10; }
  .nav button { font-family:inherit; font-size:13px; border:1px solid var(--rule); background:var(--panel); color:var(--ink); padding:7px 14px; cursor:pointer; letter-spacing:.06em; }
  .nav button:hover { border-color:var(--accent); color:var(--accent); }
  .progress { position:fixed; top:0; left:0; height:3px; background:var(--accent); transition:width .25s ease; z-index:10; }
  @media (max-width:640px){ .slide{ padding:7vh 8vw; } .num{ display:none; } }
</style>
</head>
<body>
<div class="progress" id="prog"></div>
<div id="stage"></div>
<div class="nav"><span id="count"></span><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>

<script>
const S = [
  {t:'title', html:`
    <div class="kicker">A Masterclass with Brittney CEO</div>
    <h1>The Big Assets</h1>
    <p class="lede em">How women build six and seven figure incomes online without the hustle.</p>
    <div class="brand">Brittney CEO</div>`},
  {t:'promise', html:`
    <div class="num">01</div><div class="kicker">What you'll walk away with</div>
    <div class="rule"></div>
    <h2>By the end of this hour</h2>
    <ul class="pillars">
      <li><span class="n">&bull;</span><span class="t">The <b>three assets</b> every high income woman online leans on, and which one you're missing.</span></li>
      <li><span class="n">&bull;</span><span class="t">Why your income isn't matching your effort, and the quiet shift that changes it.</span></li>
      <li><span class="n">&bull;</span><span class="t">A way to grow that doesn't ask you to post more, launch more, or work more.</span></li>
    </ul>`},
  {t:'forwhom', html:`
    <div class="num">02</div><div class="kicker">If this is you</div>
    <div class="rule"></div>
    <h2>You're doing everything right and it still feels heavy</h2>
    <p class="body">You show up every day. You launch, you post, you pour yourself into it. The audience is growing. But the income keeps lagging behind the effort, and somewhere along the way "more" became the only lever you had left to pull.</p>
    <p class="body">That's the trap. And it has nothing to do with how hard you work.</p>`},
  {t:'reframe', html:`
    <div class="num">03</div><div class="kicker">The real problem</div>
    <div class="rule"></div>
    <h2>The problem was never your work ethic.</h2>
    <p class="body">It's that you've been building a business on effort instead of assets. Effort has a ceiling, the number of hours in your day. Assets don't. The women earning the most online aren't working the hardest. They've built things that sell while they sleep.</p>`},
  {t:'p1head', html:`
    <div class="num">04</div><div class="kicker">Part One</div>
    <div class="rule"></div>
    <h1>The hustle ceiling</h1>
    <p class="lede">Why "just do more" quietly caps your income, no matter how good you are.</p>`},
  {t:'p1body', html:`
    <div class="num">04</div><div class="kicker">Part One</div>
    <div class="rule"></div>
    <h2>Trading hours for income is a losing game</h2>
    <p class="body">Every launch asks for another launch. Every post has to be followed by the next one. When growth depends on your energy and your calendar, the business is only ever as big as your stamina, and burnout becomes the business model.</p>
    <p class="body">The fix isn't a better launch. It's a different foundation.</p>`},
  {t:'shift', html:`
    <div class="num">05</div><div class="kicker">The shift</div>
    <div class="rule"></div>
    <h2>Income follows assets, not effort</h2>
    <p class="body">An asset is anything that keeps selling for you after the work is done, your content, your positioning, the way you show up, the offers that convert on their own. Build the right ones and the hours stop being the thing that limits you.</p>`},
  {t:'frameworkhead', html:`
    <div class="num">06</div><div class="kicker">Part Two &middot; The Framework</div>
    <div class="rule"></div>
    <h1>The Big Assets</h1>
    <p class="lede">The three assets high income women leverage, in the order they actually matter.</p>`},
  {t:'asset1', html:`
    <div class="num">06</div><div class="kicker">Asset One</div>
    <div class="rule"></div>
    <h2>The social assets that drive sales</h2>
    <p class="body">Not content for the algorithm, content that sells. The handful of posts, stories, and positioning pieces that do the convincing for you, so you're not relaunching from zero every time. This is how you sell every day without it feeling like a launch.</p>`},
  {t:'asset2', html:`
    <div class="num">07</div><div class="kicker">Asset Two</div>
    <div class="rule"></div>
    <h2>The energy you show up with</h2>
    <p class="body">The way you hold yourself in your business changes what people are willing to pay. The energy shift from chasing to receiving, from proving to leading, is not a soft extra. It's the asset that makes every other one land.</p>`},
  {t:'asset3', html:`
    <div class="num">08</div><div class="kicker">Asset Three</div>
    <div class="rule"></div>
    <h2>The strategy and mindset tools</h2>
    <p class="body">The money mindset and the simple strategic moves that fuel the big months, raising your own ceiling on what's possible, then backing it with decisions a seven figure CEO would actually make. Strategy without the mindset stalls. Mindset without the strategy stays a dream.</p>`},
  {t:'threehour', html:`
    <div class="num">09</div><div class="kicker">The operating system</div>
    <div class="rule"></div>
    <h2>The 3 Hour Work Day</h2>
    <p class="body">Once the assets carry the selling, the work shrinks. This is the system I run my own business on, roughly three focused hours a day. Not because I cut corners, because the assets do the heavy lifting the hustle used to.</p>
    <div class="big-stat">3 hrs</div>`},
  {t:'newway', html:`
    <div class="num">10</div><div class="kicker">The New Way</div>
    <div class="rule"></div>
    <h2>Change the model, not the volume</h2>
    <p class="body">Doubling your income usually doesn't mean doubling your output. It means changing how the business is built, which offers lead, how they stack, and how a new person moves from never heard of you to all in. That's the shift that holds.</p>`},
  {t:'week', html:`
    <div class="num">11</div><div class="kicker">Part Three &middot; In practice</div>
    <div class="rule"></div>
    <h2>What a week actually looks like</h2>
    <div class="two">
      <div class="card"><h3>Monday</h3><p>The assets do the selling. You check in, you lead the room, you make the few decisions that matter.</p></div>
      <div class="card"><h3>Midweek</h3><p>A short pocket of focused creation. One strong asset beats ten reactive posts.</p></div>
      <div class="card"><h3>The rest</h3><p>Life. The business keeps enrolling people whether or not you're online that afternoon.</p></div>
    </div>`},
  {t:'standard', html:`
    <div class="num">12</div><div class="kicker">The standard</div>
    <div class="rule"></div>
    <h2>Become the Millionairess version of you</h2>
    <p class="body">The biggest asset is the identity you operate from. When you hold yourself to the standard of the woman you're becoming, the strategy gets easier, the pricing gets braver, and the results start matching the vision you had all along.</p>`},
  {t:'whyme', html:`
    <div class="num">13</div><div class="kicker">Why listen to me</div>
    <div class="rule"></div>
    <h2>I built this the way I'm teaching it</h2>
    <p class="body">I'm Brittney. I went from a professional banking job to two thousand dollar months online, then to twenty thousand dollar months that felt like overnight, then to seven figures, working fewer hours than I did at the start. I've spoken on stages across North America and I talk about money and energy openly on my podcast, because women deserve to know what's actually possible for them.</p>`},
  {t:'different', html:`
    <div class="num">14</div><div class="kicker">What makes this different</div>
    <div class="rule"></div>
    <h2>Strategy and energy, together</h2>
    <p class="body">Most coaching gives you one half. The launch mechanics without the inner game, or the mindset work without a real plan to sell. The Big Assets is both, held to a standard that expects you to actually win, not just stay busy.</p>`},
  {t:'cta', html:`
    <div class="num">15</div><div class="kicker">Your next step</div>
    <div class="rule"></div>
    <h2>Ready to build your Big Assets?</h2>
    <p class="body">If you want the room, the strategy, and the standard that go with all of this, there are two ways in. <b>The Growth Lounge</b> is where powerhouse women build big incomes together. <b>The Inner Circle</b> is my intimate, application only space for the next up and coming women ready for the multi six and seven figure version of themselves.</p>
    <div class="cta-box"><h3>Apply for the Inner Circle</h3><p>Or join us inside The Growth Lounge. Come build the version of your business that runs on assets, not exhaustion.</p></div>
    <p class="disclaimer">This masterclass is educational. It shares what has worked in my business and for women I've coached. No income or result is guaranteed. Results vary based on your own effort, market, and circumstances.</p>`}
];

let i = 0;
const stage = document.getElementById('stage');
S.forEach((s, idx) => {
  const d = document.createElement('div');
  d.className = 'slide' + (idx === 0 ? ' active' : '');
  d.innerHTML = s.html || '';
  stage.appendChild(d);
});
const slides = [...document.querySelectorAll('.slide')];
const prog = document.getElementById('prog');
const count = document.getElementById('count');
function show(){
  slides.forEach((s,idx)=>s.classList.toggle('active', idx===i));
  prog.style.width = ((i+1)/slides.length*100) + '%';
  count.textContent = (i+1) + ' / ' + slides.length;
}
function go(n){ i = Math.max(0, Math.min(slides.length-1, i+n)); show(); }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') go(1);
  if(e.key==='ArrowLeft') go(-1);
});
stage.addEventListener('click', e=>{ if(!e.target.closest('.nav')) go(1); });
show();
</script>
</body>
</html>
