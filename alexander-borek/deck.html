<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Build an Agentic Organization — A Live Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#131b1e; --panel:#16181d; --rule:#31353f;
    --accent:#ddb65e; --accent-deep:#cba54d; --ink:#f5f3ef; --muted:#9aa2a6;
    --head:'Oswald',system-ui,sans-serif; --body:'Rubik',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0c1113;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1120px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:16px;margin:26px 0;padding:72px 76px;min-height:560px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:'';position:absolute;top:0;left:0;width:6px;height:100%;background:var(--accent)}
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-size:15px;margin-bottom:26px}
  h1{font-family:var(--head);font-weight:700;font-size:62px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:44px;line-height:1.1;margin-bottom:22px}
  .lead{font-size:24px;line-height:1.5;color:#dce1e4;margin-top:24px;max-width:48ch}
  p{font-size:21px;line-height:1.55;color:#cdd3d6;max-width:56ch;margin-top:16px}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px;max-width:62ch}
  li{position:relative;padding-left:40px;font-size:21px;line-height:1.45;color:#dce1e4}
  li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:4px;background:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;margin-top:30px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:28px}
  .card h3{font-family:var(--head);font-weight:600;font-size:24px;color:var(--ink);margin-bottom:10px}
  .card p{font-size:18px;margin-top:0;color:var(--muted)}
  .big{font-family:var(--head);font-weight:700;font-size:120px;color:var(--accent);line-height:1}
  .num{font-family:var(--head);color:var(--accent-deep);font-size:20px;letter-spacing:.2em}
  .disclaimer{font-size:14px;color:var(--muted);line-height:1.5;margin-top:34px;max-width:70ch;border-top:1px solid var(--rule);padding-top:18px}
  .foot{position:absolute;bottom:24px;right:40px;font-family:var(--head);letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:#5c6468}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Live Masterclass for Data & AI Leaders',
   h:'How to Build an <span class="accent">Agentic</span> Organization',
   lead:'Your organization was designed for people doing the work. In one live hour, build the operating model, roles, and roadmap for when AI agents join the team.'},

  {t:'who', kicker:'Who this is for',
   h2:'If this is your desk, this hour is for you.',
   bullets:['You are a Head of Data, VP of Data, Director of Analytics, or CDO at an enterprise.',
     'Your team was built for pipelines and reports. Now it is expected to deploy agents.',
     'You are asked to move fast while the organization, the budget, and the works council are not ready.',
     'You are leading the change while still learning it yourself.']},

  {t:'trap', kicker:'The trap',
   h2:'The same people. The same budget. A different job.',
   p:'The AI engineer profile you need is scarce and expensive. Product management, analytics, and build capability are merging into one role. Three jobs are becoming one, and that is exciting for the person growing into it and frightening for those who are not. As the leader, you have to hold both reactions in the same room.'},

  {t:'reframe', kicker:'The reframe',
   h:'Stop reorganizing. <span class="accent">Start re-roling.</span>',
   lead:'Most reorganizations still choose between centralised and federated. Agents end that debate. The question is no longer where the box sits on the chart. It is which step of the work is human, and which is agent.'},

  {t:'part', num:'PART ONE', h2:'Why the old org chart breaks.',
   p:'An org built around functions assumes a human owns every step end to end. Agents break that assumption quietly. Work that used to define a role becomes a step an agent can take, and the role has to be redrawn around what only a person should still do.'},

  {t:'part', num:'PART TWO', h2:'The Agentic Organization operating model.',
   lead:'One target model you can draw on a single page. Two moving parts, and the discipline to keep them honest.'},

  {t:'grid', kicker:'The operating model',
   h2:'Two parts, one page.',
   cards:[
     {h:'Embedded talent', p:'Cross-functional teams with data & AI talent embedded in the business functions that own the outcome.'},
     {h:'One central spine', p:'A single central team that owns the platform, the guardrails, and the governance underneath all of them.'},
     {h:'Beyond the debate', p:'This moves the conversation past centralised vs federated and toward the reality agents create.'},
     {h:'Drawable', p:'If your leadership team cannot draw the model, they cannot run it. One page is the test.'}]},

  {t:'roles', kicker:'The framework',
   h2:'The five role shifts.',
   bullets:['Data engineers become platform engineers.',
     'Data scientists may become forward deployed AI engineers.',
     'Analysts own the semantic layer, or stay analysts by choice.',
     'Governance managers take on AI, while data governance stays relevant.',
     'Product managers keep bridging business and technology.']},

  {t:'fde', kicker:'The role that did not exist',
   h2:'The Forward Deployed AI Engineer.',
   p:'Product manager, engineer, and analyst used to be three people. With AI support they become one role that talks to the business, builds and rebuilds the process, and owns the context behind it. It is one of the scarcest profiles on the market, so most leaders will grow their own rather than buy one.'},

  {t:'map', kicker:'The method',
   h2:'Map the work, step by step.',
   bullets:['Take one real workflow your team runs today.',
     'Mark every step across four categories: human-only, AI-assisted, agent-led, agent-only.',
     'Then budget for agents the way you budget for people.',
     'Apply it to roles, skills, and processes, never to people themselves.']},

  {t:'quote', kicker:'The shift in one line',
   h:'"Will AI replace roles?" becomes <span class="accent">"which step, and who decides?"</span>'},

  {t:'part', num:'PART THREE', h2:'Ninety days out of strategy theater.',
   p:'From AI strategy theater to a 90-day execution roadmap. Not a slide deck of ambitions, but a sequence your board can hold you to and your team can start on Monday.'},

  {t:'grid', kicker:'What you build',
   h2:'Five board-defensible deliverables.',
   cards:[
     {h:'The operating model', p:'Your one-page target model, drawn for your company.'},
     {h:'The role map', p:'Which roles shift, which stay, and in what order.'},
     {h:'The human/agent split', p:'Your priority workflow, mapped step by step.'},
     {h:'The 90-day roadmap', p:'The sequence that gets you out of strategy theater.'},
     {h:'The talent plan', p:'Who you grow into the FDE role, and how.'},
     {h:'The governance line', p:'What the central team owns, and what it does not.'}]},

  {t:'why', kicker:'Why learn this here',
   h2:'Built in the room, not the slideware.',
   p:'Dr. Alexander Borek led data & AI at Volkswagen Group and Zalando, and now works with 500+ senior Data & AI leaders across Europe at companies like Scout24, Deutsche Bahn, and Swiss Post. The model in this masterclass comes from real transformations, not a framework drawn in the abstract.'},

  {t:'takeaway', kicker:'What you leave with',
   h2:'One hour. One page you can draw.',
   bullets:['A clear operating model for an agentic organization.',
     'Language for the role shifts your team is already feeling.',
     'A method to decide human vs agent without guessing.',
     'The first move of a 90-day roadmap you can start this week.']},

  {t:'cta', kicker:'Your next step',
   h:'Save your seat.',
   lead:'Join the next live session of How to Build an Agentic Organization, then take the operating model, the role map, and the 90-day roadmap into your own team.',
   disclaimer:'This masterclass is educational. It shares frameworks and operating models for building data & AI organizations; it is not a guarantee of any specific business, hiring, or financial result. Outcomes depend on your own organization, decisions, and execution.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.num) html += `<div class="num">${s.num}</div>`;
  if(s.h) html += `<h1>${s.h}</h1>`;
  if(s.h2) html += `<h2>${s.h2}</h2>`;
  if(s.lead) html += `<div class="lead">${s.lead}</div>`;
  if(s.p) html += `<p>${s.p}</p>`;
  if(s.bullets){ html += '<ul>' + s.bullets.map(b=>`<li>${b}</li>`).join('') + '</ul>'; }
  if(s.cards){ html += '<div class="grid">' + s.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('') + '</div>'; }
  if(s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  html += `<div class="foot">Data Masterclass · Dr. Alexander Borek</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
