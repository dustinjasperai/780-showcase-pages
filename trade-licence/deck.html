<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Yourself First, a Self-Leadership masterclass with Andrew Bryant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;600;700&family=Karla:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f2; --panel:#ffffff; --ink:#2c3e50; --accent:#f39d39; --deep:#0f3971;
  --rule:#d9dee1; --grey:#5b6b7a; --dim:#8a97a3;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Karla",system-ui,sans-serif}
.deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
  padding:54px 56px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;
  justify-content:center;box-shadow:0 1px 2px rgba(44,62,80,.04)}
.kicker{font-family:"Fraunces",Georgia,serif;font-weight:800;letter-spacing:.14em;
  text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
h1{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:54px;line-height:1.05;
  color:var(--ink);letter-spacing:-.01em}
h2{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:38px;line-height:1.1;
  color:var(--ink);margin-bottom:14px}
.sub{font-size:22px;line-height:1.5;color:var(--grey);margin-top:20px;max-width:30em}
p{font-size:21px;line-height:1.6;color:var(--ink);max-width:33em;margin-top:14px}
.big{font-size:34px;line-height:1.3;color:var(--ink);font-weight:500;max-width:24em}
.part .num{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:17px;color:var(--deep);
  letter-spacing:.1em}
.part h2{font-size:46px;margin-top:8px}
ul{margin-top:22px;list-style:none}
li{font-size:21px;line-height:1.5;color:var(--ink);padding-left:30px;position:relative;
  margin:12px 0;max-width:32em}
li::before{content:"";position:absolute;left:0;top:12px;width:12px;height:12px;
  border-radius:3px;background:var(--accent)}
.pill h2{color:var(--deep)}
.pillnum{font-family:"Fraunces",Georgia,serif;font-weight:800;font-size:60px;color:var(--accent);
  opacity:.9;line-height:1}
.rule{height:4px;width:66px;background:var(--accent);border-radius:2px;margin:26px 0 6px}
.cta{background:var(--deep);border-color:var(--deep)}
.cta .kicker{color:var(--accent)}
.cta h2,.cta p,.cta .sub{color:#ffffff}
.cta .step{font-family:"Fraunces",Georgia,serif;font-weight:700;font-size:22px;color:#ffffff;
  margin-top:18px}
.disc{font-family:"Fraunces",Georgia,serif;font-size:13px;line-height:1.5;color:#c6d2e2;
  margin-top:30px;max-width:40em}
.foot{font-family:"Fraunces",Georgia,serif;font-size:12px;letter-spacing:.12em;
  text-transform:uppercase;color:var(--dim);text-align:center;margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live Self-Leadership masterclass with Andrew Bryant',
   h:'Lead Yourself First',
   sub:'The one skill that separates leaders who perform under pressure from leaders who only look the part.'},

  {t:'who', kicker:'Who this is for',
   h:'Leaders and leadership teams carrying more than they can process',
   body:'If you are a senior leader, or you run a team of them, and the pace has outrun the old playbook, this hour is built for you. Not theory. The operating system underneath how you actually lead.'},

  {t:'trap', kicker:'The trap',
   big:'You already know what good leadership looks like. Knowing it has never been the problem.'},

  {t:'reframe', kicker:'The reframe',
   h:'The gap is not in your team. It is the distance between what you know and what you do under load.',
   sub:'That distance has a name. It is a self-leadership gap, and it is closable.'},

  {t:'part', num:'PART ONE', h:'Why capable leaders stall'},

  {t:'point', kicker:'The cost of autopilot',
   h:'Under pressure, you do not rise to your intentions. You fall to your defaults.',
   body:'The reactive email. The meeting you dominated. The decision you made to kill the discomfort rather than the problem. None of it is a knowledge gap. It is a regulation gap.'},

  {t:'point', kicker:'Why more team training does not fix it',
   h:'You cannot lead others through something you cannot lead yourself through.',
   body:'Every framework you hand the team routes back through you first. If the leader runs on defaults, the system inherits them. The leverage point is the leader, not another workshop for the room.'},

  {t:'part', num:'PART TWO', h:'The Self-Leadership Model'},

  {t:'framework', kicker:'The model',
   h:'Self-leadership is intentionally influencing your thinking, feeling and actions toward your objective.',
   body:'It rests on three competencies that compound. Research validated, cited in over 200 papers, and the same model behind leaders at Microsoft, Airbus and Deloitte.'},

  {t:'pillar', pillnum:'01', kicker:'Competency one',
   h:'Self-Awareness',
   body:'The habit of noticing your own psychological processes in the moment, your reactions, your stories, your effect on the room, before they drive the behaviour.'},

  {t:'pillar', pillnum:'02', kicker:'Competency two',
   h:'Self-Regulation',
   body:'Modulating attention, emotion and behaviour to the situation in front of you. Not suppressing the reaction. Naming it, then choosing the response that serves the objective.'},

  {t:'pillar', pillnum:'03', kicker:'Competency three',
   h:'Self-Learning',
   body:'Taking the initiative to diagnose your own learning needs and close them deliberately, so every hard season leaves you more capable instead of more defended.'},

  {t:'point', kicker:'How they compound',
   h:'Trait times situation, moderated by awareness, equals behaviour.',
   body:'Behaviour is contextual. The same leader is steady in one room and reactive in another. Awareness is the moderator you can actually train, and it is what turns the three competencies into one practice.'},

  {t:'part', num:'PART THREE', h:'What this becomes in practice'},

  {t:'point', kicker:'Inside a leadership team',
   h:'A team of self-led leaders argues better and recovers faster.',
   body:'Disagreement stops being a threat to manage and becomes information to use. People say the hard thing earlier, the regulated leader keeps the room safe enough to hear it, and decisions get made on reality instead of on relief.'},

  {t:'point', kicker:'Leading in the age of AI',
   h:'When the tools change monthly, the durable advantage is the leader who can regulate and relearn.',
   body:'Capability you can automate is no longer the moat. The inside-out skills, awareness, regulation, learning, are exactly what does not commoditise, and what lets a leader unlock the potential of people working alongside the machines.'},

  {t:'proof', kicker:'Why Andrew',
   h:'I did not borrow this field. I helped build it.',
   body:'When I realised what I was doing for clients was teaching self-leadership, I built the methodology and the research behind it. The work is cited in over 200 academic papers, has taken me to leaders in 40 countries, and into the boardrooms of Microsoft, SAP, Singapore Airlines and Deloitte.'},

  {t:'point', kicker:'Your first step',
   h:'You cannot change what you have not measured.',
   body:'Self-leadership is a set of behaviours, so the honest place to start is a read on your own. That is what the Self-Leadership Diagnostic gives you, before we ever talk about a program.'},

  {t:'recap', kicker:'The one idea',
   big:'Lead yourself first, on purpose, and the team you are trying to fix starts to look very different.'},

  {t:'cta', kicker:'Where to from here',
   h:'Bring this to your leadership',
   sub:'If you want the model installed in you or your team, the next step is a short conversation to see what fits.',
   step:'Take the Self-Leadership Diagnostic, then book a strategy call with Andrew at selfleadership.com.',
   disc:'This masterclass is educational. No specific result, outcome or performance is guaranteed. Results vary with the leader, the team and the context. Nothing here is individual professional advice.',
   foot:'Self Leadership International'}
];

const d = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + s.t + (s.t==='part'?' part':'') + (s.t==='pillar'?' pill':'') + (s.t==='cta'?' cta':'');
  let html = '';
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.pillnum) html += '<div class="pillnum">'+s.pillnum+'</div>';
  if (s.h) html += (s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if (s.big) html += '<div class="rule"></div><div class="big">'+s.big+'</div>';
  if (s.body) html += '<p>'+s.body+'</p>';
  if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if (s.step) html += '<div class="step">'+s.step+'</div>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  if (s.foot) html += '<div class="foot">'+s.foot+'</div>';
  el.innerHTML = html;
  d.appendChild(el);
}
</script>
</body>
</html>
