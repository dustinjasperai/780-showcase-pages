<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Side Hustler to CEO · Allie Siarto, Photo Field Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4efe8; --panel:#eae2d6; --rule:#d8d0c2;
    --acc:#2f6690; --ink:#272727; --body:#4a4642; --dim:#8a857f; --cream:#f7f4f3;
  }
  html,body{height:100%}
  body{background:#e8e0d3;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e8e0d3}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:.002em}
  .t-title h1{font-size:4.6vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.0vw;max-width:90%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Libre Baskerville',serif;font-style:italic;font-size:1.9vw;color:var(--acc);margin-top:3.6vh;max-width:84%;line-height:1.45;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#22303c 0%,#151f27 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:88%;color:var(--cream);font-weight:400}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#22303c 0%,#151f27 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#dbe4ec;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .gr-motif{position:absolute;pointer-events:none}
  .title-gr{right:7.5%;bottom:8.5%;width:17vw;opacity:.92}
  .corner-gr{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(39,39,39,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.8vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Photo Field Notes</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: an ascending profit line over a baseline, drawn in slate. the CEO/numbers world, not a viewfinder -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gr" viewBox="0 0 120 120">
  <g fill="none" stroke="#2f6690" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M20 100 H104" opacity="0.55"/>
    <path d="M20 100 V20" opacity="0.55"/>
    <path d="M28 84 L52 66 L70 74 L100 34" opacity="0.95"/>
    <circle cx="28" cy="84" r="3.2" fill="#2f6690" stroke="none" opacity="0.9"/>
    <circle cx="52" cy="66" r="3.2" fill="#2f6690" stroke="none" opacity="0.9"/>
    <circle cx="70" cy="74" r="3.2" fill="#2f6690" stroke="none" opacity="0.9"/>
    <circle cx="100" cy="34" r="3.6" fill="#2f6690" stroke="none"/>
    <path d="M92 34 H100 V42" opacity="0.8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Side Hustler to CEO',sub:'How a photographer steps out of the technician’s chair and runs the business like a CEO, so profit goes up while the hours come down.',brand:true,gr:'title'},
 {t:'normal',k:'Who this is for',title:'You built a business you can shoot. Running every other part of it by hand was never the plan.',body:'You are a photographer whose calendar fills and whose clients are happy. But the whole business lives in your head, and every part of it, the shooting, the editing, the marketing, the money, still runs through you. Growth just means more nights at the computer.'},
 {t:'dark',title:'A calendar full of shoots is not the same as a business that runs like a company.'},

 {t:'section',idx:'Part One',title:'Why More Shoots Stops Working'},
 {t:'normal',k:'The technician trap',title:'When you are the business, growing it just means adding hours you do not have.',body:'You are the photographer, the editor, the marketer, the bookkeeper, and the front desk. Every new client lands on an already full week, so your income is capped by the number of hours in it. There is a ceiling, and you are pressed against it.'},
 {t:'normal',k:'Busy is not profitable',title:'Revenue went up this year. Somehow there is not more money, and there is not more time.',body:'Without a clear view of the numbers, a busy month and a profitable month feel identical. Revenue, profit, and what you actually pay yourself are three different things, and when they blur together you cannot tell which work funds the business and which just fills the calendar.'},
 {t:'dark',title:'You cannot out-hustle a business that depends on you for every single thing.'},

 {t:'section',idx:'Part Two',title:'Taking the CEO Seat'},
 {t:'normal',k:'Move one, take the CEO seat',title:'The first shift is working on the business, not only in it.',body:'A CEO carves out real time away from client work to decide where the business goes, instead of only reacting to the next inquiry. Your job stops being do every shoot and becomes build the thing that books them. That one change is what makes everything after it possible.'},
 {t:'normal',k:'Move two, know your numbers',title:'A CEO runs on the numbers, not on how the month happened to feel.',body:'You separate revenue, profit, and your own pay, and you keep a simple financial view you actually look at. Now you can see which packages and which kinds of work truly pay, and you price and cut from what is real rather than from a gut feeling in a slow week.'},
 {t:'normal',k:'Move three, build the engine',title:'Marketing that keeps working whether or not you are behind the camera.',body:'The last piece is a steady, repeatable marketing system, your email and a clear path for new people to find you, so the right clients arrive on their own instead of in a scramble every slow season. Client flow becomes something the business does, not something you chase.'},
 {t:'dark',title:'The aim is a business that grows on systems and numbers, not on you working more nights.'},

 {t:'section',idx:'Part Three',title:'What a CEO Year Looks Like'},
 {t:'normal',k:'The photographer this builds',title:'Fewer fires, higher profit, and a business that does not stop the moment you do.',body:'You take a real week off and the bookings still come, because the marketing is a system and not just you. Your margins climb because you can finally see where the money goes. And the work you keep is the work that pays, because now you know which work that is.'},
 {t:'dark',title:'The point was never more shoots. It was to own the business instead of being owned by it.'},
 {t:'normal',k:'Why Allie Siarto',title:'A photographer who teaches the business side like the instructor and business writer she is.',body:'Allie runs Allie and Co. Photography and hosts the Photo Field Notes podcast for photographers. She also teaches in Michigan State University’s Advertising and Public Relations department, and her business advice has appeared in Forbes, The Washington Post, and VentureBeat. Side Hustler to CEO is that playbook, built for photographers.'},

 {t:'section',idx:'Your Next Step',title:'Step Into the CEO Seat'},
 {t:'normal',k:'Keep going with Allie',title:'The full path from side hustler to CEO of your photography business.',body:'Start free with Your Six Figure Year, Allie’s three step crash course on building a six figure photography business. Then step into Side Hustler to CEO to put the CEO seat, the numbers, and the marketing system in place with Allie beside you.'},
 {t:'cta',title:'Ready to run your photography business like a CEO?',body:'Take the next step with Allie Siarto and Photo Field Notes.',chips:['Start Your Six Figure Year, free','Join Side Hustler to CEO'],disc:'Educational content for photographers building a business. No income or profit result is guaranteed. Results vary by photographer, market, and season.'},
];

const deck=document.getElementById('deck');
function gr(kind){return `<svg class="gr-motif ${kind==='title'?'title-gr':'corner-gr'}"><use href="#gr"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Photo Field <b>Notes</b> · Allie Siarto</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.gr) h+=gr(s.gr);
  else if(s.t==='title') h+=gr('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
