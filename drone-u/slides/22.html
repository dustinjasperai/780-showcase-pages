<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Drone Business Breakthrough | Drone U | Slide 22</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette traceable to brand.json (## Palette in 01-deep-research.md):
     ground navy from #001b26/#0a3c55, accent burnt-orange #cc4a00, cream ink. */
  :root{
    --bg:#072330; --panel:#0d3041; --ink:#f4ede3; --muted:#b5c8d3;
    --accent:#cc4a00; --accent2:#ff7a00; --line:#1d4357;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:#04161f; color:var(--ink); font-family:"Mulish",system-ui,sans-serif;}
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:4vh 4vw;}
  .slide{display:none; width:100%; max-width:1120px; aspect-ratio:16/9; background:linear-gradient(160deg,var(--bg),var(--panel));
    border:1px solid var(--line); border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.45);
    padding:6% 7%; flex-direction:column; justify-content:center; overflow:hidden; position:relative;}
  .slide.on{display:flex;}
  .kick{font-family:"Montserrat",sans-serif; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    font-size:14px; color:var(--accent2); margin-bottom:14px;}
  h1{font-family:"Montserrat",sans-serif; font-weight:800; font-size:clamp(28px,4.4vw,52px); line-height:1.08; margin-bottom:16px;}
  h2{font-family:"Montserrat",sans-serif; font-weight:700; font-size:clamp(24px,3.4vw,40px); line-height:1.12; margin-bottom:16px;}
  h1 em,h2 em{font-style:normal; color:var(--accent2);}
  p{font-size:clamp(16px,1.7vw,22px); color:var(--ink); margin-bottom:12px; max-width:40ch;}
  p.sub{color:var(--muted);}
  ul{list-style:none; margin-top:8px;}
  li{position:relative; padding:9px 0 9px 34px; font-size:clamp(15px,1.7vw,21px); color:var(--ink);}
  li:before{content:""; position:absolute; left:4px; top:17px; width:12px; height:12px; border-radius:3px;
    background:var(--accent); transform:rotate(45deg);}
  li b{color:var(--accent2); font-family:"Montserrat",sans-serif;}
  .big{font-family:"Montserrat",sans-serif; font-weight:800; font-size:clamp(30px,5vw,60px); line-height:1.05;}
  .host{display:flex; gap:28px; align-items:center;}
  .cta h1{color:var(--accent2);}
  .disc{font-size:clamp(13px,1.4vw,17px); color:var(--muted); max-width:62ch; line-height:1.5;}
  .pageno{position:absolute; right:26px; bottom:18px; font-family:"Montserrat",sans-serif; font-size:13px; color:var(--muted);}
  .brandmark{position:absolute; left:26px; bottom:18px; font-family:"Montserrat",sans-serif; font-weight:700; font-size:13px; color:var(--muted); letter-spacing:.08em;}
  .nav{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:10;}
  .nav button{font-family:"Montserrat",sans-serif; font-weight:600; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:7px 14px; cursor:pointer; font-size:14px;}
  .nav button:hover{background:var(--accent); border-color:var(--accent);}
</style>
<style>.slide{display:flex !important;} .stage{position:static;} body{min-height:100vh;}</style>
</head>
<body>
<div class="stage">
<div class="slide on cta" data-i="21"><div class="kick">Your next step</div>
    <h1>Book your free Drone Business Coaching Call</h1>
    <p class="sub">Bring the bottleneck you picked today and we'll map your 90 days on the call.</p>
  <div class="brandmark">DRONE U</div><div class="pageno">22 / 24</div></div>
</div>
</body>
</html>
