<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Drone Business Breakthrough | Drone U</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette traceable to brand.json (## Palette in 01-deep-research.md):
     ground navy from #001b26/#0a3c55, accent burnt-orange #cc4a00, cream ink. */
  :root{
    --bg:#072330; --panel:#0d3041; --ink:#f4ede3; --muted:#b5c8d3;
    --accent:#cc4a00; --accent2:#ff7a00; --line:#1d4357;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  html,body{height:100%;}
  body{background:#04161f; color:var(--ink); font-family:"Mulish",system-ui,sans-serif;}
  .stage{position:fixed; inset:0; display:flex; align-items:center; justify-content:center; padding:4vh 4vw;}
  .slide{display:none; width:100%; max-width:1120px; aspect-ratio:16/9; background:linear-gradient(160deg,var(--bg),var(--panel));
    border:1px solid var(--line); border-radius:18px; box-shadow:0 20px 60px rgba(0,0,0,.45);
    padding:6% 7%; flex-direction:column; justify-content:center; overflow:hidden; position:relative;}
  .slide.on{display:flex;}
  .kick{font-family:"Montserrat",sans-serif; font-weight:700; letter-spacing:.14em; text-transform:uppercase;
    font-size:14px; color:var(--accent2); margin-bottom:14px;}
  h1{font-family:"Montserrat",sans-serif; font-weight:800; font-size:clamp(28px,4.4vw,52px); line-height:1.08; margin-bottom:16px;}
  h2{font-family:"Montserrat",sans-serif; font-weight:700; font-size:clamp(24px,3.4vw,40px); line-height:1.12; margin-bottom:16px;}
  h1 em,h2 em{font-style:normal; color:var(--accent2);}
  p{font-size:clamp(16px,1.7vw,22px); color:var(--ink); margin-bottom:12px; max-width:40ch;}
  p.sub{color:var(--muted);}
  ul{list-style:none; margin-top:8px;}
  li{position:relative; padding:9px 0 9px 34px; font-size:clamp(15px,1.7vw,21px); color:var(--ink);}
  li:before{content:""; position:absolute; left:4px; top:17px; width:12px; height:12px; border-radius:3px;
    background:var(--accent); transform:rotate(45deg);}
  li b{color:var(--accent2); font-family:"Montserrat",sans-serif;}
  .big{font-family:"Montserrat",sans-serif; font-weight:800; font-size:clamp(30px,5vw,60px); line-height:1.05;}
  .host{display:flex; gap:28px; align-items:center;}
  .cta h1{color:var(--accent2);}
  .disc{font-size:clamp(13px,1.4vw,17px); color:var(--muted); max-width:62ch; line-height:1.5;}
  .pageno{position:absolute; right:26px; bottom:18px; font-family:"Montserrat",sans-serif; font-size:13px; color:var(--muted);}
  .brandmark{position:absolute; left:26px; bottom:18px; font-family:"Montserrat",sans-serif; font-weight:700; font-size:13px; color:var(--muted); letter-spacing:.08em;}
  .nav{position:fixed; bottom:14px; left:50%; transform:translateX(-50%); display:flex; gap:10px; z-index:10;}
  .nav button{font-family:"Montserrat",sans-serif; font-weight:600; background:var(--panel); color:var(--ink);
    border:1px solid var(--line); border-radius:8px; padding:7px 14px; cursor:pointer; font-size:14px;}
  .nav button:hover{background:var(--accent); border-color:var(--accent);}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="nav"><button onclick="go(-1)">&larr; Prev</button><button onclick="go(1)">Next &rarr;</button></div>
<script>
const S = [
  {t:'title', cls:'', html:`<div class="kick">A live training with Paul Aitken, Drone U</div>
    <h1>The Drone Business <em>Breakthrough</em></h1>
    <p class="sub">The 5 bottlenecks keeping skilled pilots stuck under six figures, and how to spot the one costing you the most right now.</p>`},

  {t:'host', cls:'', html:`<div class="kick">Your host</div>
    <h2>Paul Aitken</h2>
    <ul>
      <li>Co-founder, CEO and Chief Mentor at <b>Drone U</b></li>
      <li>Helped sell more than <b>$250M</b> in real estate using drones</li>
      <li>Wrote the industry's <b>first Part 107 study guide</b></li>
      <li>DJI-sponsored pilot for roughly <b>11 years</b></li>
      <li>Host of <b>Ask Drone U</b>, 6M-plus downloads</li>
    </ul>`},

  {t:'promise', cls:'', html:`<div class="kick">What you'll leave with</div>
    <h2>Three things, in the next hour</h2>
    <ul>
      <li>The <b>one bottleneck</b> that is actually capping your income</li>
      <li>The specific <b>shift</b> that releases it</li>
      <li>A <b>90-day plan</b> to act on it, starting this week</li>
    </ul>`},

  {t:'reframe', cls:'', html:`<div class="kick">The real problem</div>
    <p class="big">Flying is not the bottleneck.<br><em>The business is.</em></p>
    <p class="sub">Most stuck drone businesses are run by excellent pilots. The skill is there. The money is stuck somewhere else, and almost always in the same five places.</p>`},

  {t:'map', cls:'', html:`<div class="kick">The map</div>
    <h2>The 5 bottlenecks</h2>
    <ul>
      <li><b>1.</b> The Generalist Trap</li>
      <li><b>2.</b> The Race to the Bottom</li>
      <li><b>3.</b> The Feast-or-Famine Pipeline</li>
      <li><b>4.</b> The One-Shot Deliverable</li>
      <li><b>5.</b> The Pretty-Pictures Ceiling</li>
    </ul>`},

  {t:'b1', cls:'', html:`<div class="kick">Bottleneck 1</div>
    <h2>The <em>Generalist Trap</em></h2>
    <p>You fly everything and own nothing. No defined buyer, so every job is a cold start and every quote is a coin flip.</p>`},
  {t:'b1fix', cls:'', html:`<div class="kick">The shift</div>
    <h2>Pick one buyer, own one outcome</h2>
    <ul>
      <li>Define and deeply understand <b>one</b> ideal client</li>
      <li>Frame the exact problem your work solves for them</li>
      <li>Become the obvious choice in one lane before you add a second</li>
    </ul>`},

  {t:'b2', cls:'', html:`<div class="kick">Bottleneck 2</div>
    <h2>The <em>Race to the Bottom</em></h2>
    <p>You price by the hour or by the flight. So does everyone racing you down, and the buyer has no reason to pick you.</p>`},
  {t:'b2fix', cls:'', html:`<div class="kick">The shift</div>
    <h2>Price the outcome, not the hour</h2>
    <ul>
      <li>Sell the <b>deliverable and the decision it unlocks</b>, not flight time</li>
      <li>Package the data, the report, the turnaround</li>
      <li>The same flight is worth far more when it is sold as a result</li>
    </ul>`},

  {t:'b3', cls:'', html:`<div class="kick">Bottleneck 3</div>
    <h2>The <em>Feast-or-Famine Pipeline</em></h2>
    <p>No outbound system. You wait for referrals and job portals, so revenue swings between flooded and silent.</p>`},
  {t:'b3fix', cls:'', html:`<div class="kick">The shift</div>
    <h2>One repeatable outreach system</h2>
    <ul>
      <li>Build outreach that finds the right contacts at the right time</li>
      <li>Get in front of your ideal clients on purpose, not by luck</li>
      <li>Aim at inbound that generates clients for the long term</li>
    </ul>`},

  {t:'b4', cls:'', html:`<div class="kick">Bottleneck 4</div>
    <h2>The <em>One-Shot Deliverable</em></h2>
    <p>Every job ends the day you land. No recurring revenue means you start from zero every single month.</p>`},
  {t:'b4fix', cls:'', html:`<div class="kick">The shift</div>
    <h2>Turn single flights into programs</h2>
    <ul>
      <li>Move toward work that <b>recurs</b>: mapping, progress docs, inspections</li>
      <li>Put systems around delivery so it scales without more hours</li>
      <li>Trade one-off shoots for retained accounts</li>
    </ul>`},

  {t:'b5', cls:'', html:`<div class="kick">Bottleneck 5</div>
    <h2>The <em>Pretty-Pictures Ceiling</em></h2>
    <p>You can fly, but you can't yet deliver the mapping and inspection data commercial buyers pay a premium for. So you stay capped at low-value media work.</p>`},
  {t:'b5fix', cls:'', html:`<div class="kick">The shift</div>
    <h2>Deliver the data they pay premium for</h2>
    <ul>
      <li>Learn the high-value deliverables: mapping and photogrammetry</li>
      <li>Roof, facade and cell-tower inspection reporting</li>
      <li>Construction documentation that a project actually runs on</li>
    </ul>`},

  {t:'diagnose', cls:'', html:`<div class="kick">Your turn</div>
    <h2>Which one is costing you most?</h2>
    <p>Rank all five for your business today. Be honest about where the money is actually leaking. The one at the top is your next 90 days.</p>`},

  {t:'wrongfix', cls:'', html:`<div class="kick">The common mistake</div>
    <h2>Most owners fix the <em>wrong</em> one first</h2>
    <p>They buy another drone when the real gap is outreach. They chase a new niche when the real gap is pricing. Fixing the top bottleneck first is what changes the number.</p>`},

  {t:'plan', cls:'', html:`<div class="kick">The 90-day execution plan</div>
    <h2>Focus, System, Scale</h2>
    <ul>
      <li><b>Days 1-30 Focus:</b> lock one buyer and one priced outcome</li>
      <li><b>Days 31-60 System:</b> stand up one outreach engine</li>
      <li><b>Days 61-90 Scale:</b> add a recurring, higher-value deliverable</li>
    </ul>`},

  {t:'proof', cls:'', html:`<div class="kick">Why this works</div>
    <h2>The business is the leverage</h2>
    <p>These are the same principles Paul used to help sell more than $250M in real estate with drones, and that the Drone U community works through every week on the Ask Drone U calls.</p>`},

  {t:'path', cls:'', html:`<div class="kick">If you want to go deeper</div>
    <h2>The Drone U path</h2>
    <ul>
      <li>Pro membership and the full course library</li>
      <li>Hands-on boot camps and the Elite experiential week</li>
      <li>Business and sales coaching built on the same frameworks</li>
    </ul>`},

  {t:'qa', cls:'', html:`<div class="kick">Open floor</div>
    <h1>Live Q&amp;A</h1>
    <p class="sub">Bring your bottleneck. We'll work it live.</p>`},

  {t:'cta', cls:'cta', html:`<div class="kick">Your next step</div>
    <h1>Book your free Drone Business Coaching Call</h1>
    <p class="sub">Bring the bottleneck you picked today and we'll map your 90 days on the call.</p>`},

  {t:'disclaimer', cls:'', html:`<div class="kick">Please read</div>
    <h2>A quick note</h2>
    <p class="disc">This training is educational. No income, role, or result is guaranteed. Results vary and depend on your effort, market, skill, and many factors outside anyone's control. Nothing here is financial, legal, or tax advice. Any figures mentioned describe past experience and are not a promise of your results.</p>`},

  {t:'thanks', cls:'', html:`<div class="kick">Thank you</div>
    <h1>See you in the room</h1>
    <p class="sub">Drone U, with Paul Aitken.</p>`}
];

const stage = document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>`<div class="slide ${s.cls||''}" data-i="${i}">${s.html}
  <div class="brandmark">DRONE U</div><div class="pageno">${i+1} / ${S.length}</div></div>`).join('');
let idx=0;
const slides=[...document.querySelectorAll('.slide')];
function show(n){ idx=Math.max(0,Math.min(S.length-1,n)); slides.forEach((el,i)=>el.classList.toggle('on',i===idx)); }
function go(d){ show(idx+d); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
show(0);
</script>
</body>
</html>
