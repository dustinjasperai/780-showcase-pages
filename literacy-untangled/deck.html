<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untangling Dyslexia - A Masterclass for Parents</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alice&family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a1f4d;        /* derived from brand dominant #002b79, deepened */
    --panel:#122a5e;
    --rule:#2a3f72;
    --accent:#e56e65;    /* brand secondary, verbatim */
    --ink:#eef2fb;
    --muted:#aab6d6;
    --display:'Alice', Georgia, serif;
    --body:'Open Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html,body{background:#060f27;color:var(--ink);font-family:var(--body);}
  .deck{max-width:960px;margin:0 auto;padding:40px 18px 80px;}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px 52px;
    margin:0 0 26px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);
  }
  .thread{position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:2px solid var(--rule);border-radius:50%;opacity:.5;}
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px;}
  h1{font-family:var(--display);font-size:52px;line-height:1.08;font-weight:400;margin-bottom:20px;}
  h2{font-family:var(--display);font-size:38px;line-height:1.12;font-weight:400;margin-bottom:18px;}
  p{font-size:19px;line-height:1.6;color:var(--ink);margin-bottom:14px;max-width:62ch;}
  p.sub{color:var(--muted);font-size:18px;}
  .big{font-family:var(--display);font-size:34px;line-height:1.25;color:var(--ink);max-width:24ch;}
  ul{list-style:none;margin:10px 0 0;}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:58ch;}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;border-radius:50%;background:var(--accent);}
  .phase{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule);}
  .phase:last-child{border-bottom:none;}
  .pn{font-family:var(--display);font-size:30px;color:var(--accent);min-width:48px;}
  .phase div p{margin-bottom:4px;}
  .num{font-family:var(--display);font-size:16px;color:var(--muted);position:absolute;bottom:20px;right:28px;}
  .tag{position:absolute;bottom:20px;left:56px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);}
  .cta-box{background:var(--panel);border:1px solid var(--accent);border-radius:12px;padding:26px 30px;margin-top:8px;}
  .disclaimer{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:70ch;}
  @media(max-width:640px){.slide{padding:38px 26px;}h1{font-size:36px;}h2{font-size:28px;}.big{font-size:26px;}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A free live masterclass for parents',h1:'Untangling Dyslexia',p:'From the first red flag to an IEP that actually works. The path most parents are never handed.',tag:'Literacy Untangled'},
 {t:'who',eyebrow:'Who this is for',h2:'Your child is bright. They still can’t read.',p:'You have heard the words struggling reader, maybe even dyslexia. You have also heard let’s wait and see. And every month you wait, your child falls a little further behind the class.',sub:'If that is you, this hour is for you.'},
 {t:'stakes',eyebrow:'Why this hour matters now',h2:'Waiting is not neutral',p:'Reading gaps do not close on their own. They widen. The confident kindergartner who loved stories becomes the fourth grader who calls themselves dumb. The cost of waiting is measured in your child’s own sense of who they are.',sub:'The good news: that curve can bend the moment the right support starts.'},
 {t:'hook',eyebrow:'The hard truth',big:'The school system will not advocate for your child on its own. It is built to wait. You are the one person in the room who cannot.'},
 {t:'p1',eyebrow:'Part one: the real problem',h2:'It was never that you didn’t care enough.',p:'Most parents of dyslexic kids are not short on love or effort. They are short on one thing: a map. Nobody tells you which tests to ask for, what a report means, or that the law is already on your side.',sub:'Dyslexia is common and well understood. The system around it is not.'},
 {t:'myth',eyebrow:'What no one tells you',h2:'Three things that quietly cost your child time',ul:['“Wait and see” is a choice, and it is rarely the right one','You can request a formal evaluation in writing, today','Many school staff do not fully understand dyslexia or the laws that protect your child']},
 {t:'rights',eyebrow:'A door most parents never try',h2:'The law is already on your side',p:'Public schools have a duty to identify and support kids who are struggling. There is a formal process to ask for an evaluation, and a timeline the school has to follow. You do not have to earn it or fight for it. You just have to know how to ask.',sub:'Knowing the door exists is half the battle.'},
 {t:'section',eyebrow:'The path',h1:'Together Through Dyslexia',p:'A three-phase way to move from confused and powerless to the calm, prepared parent your child needs in the room.'},
 {t:'phases',eyebrow:'The three phases',h2:'Confused to confident',phases:[['1','Know the problem','Move from confusion to clarity on what your child actually needs, and name it in plain language.'],['2','Assessments and reports','Walk into the meeting prepared. Know which tests to ask for and how to read the report you get back.'],['3','Ongoing progress','Learn to speak the school’s language so the services actually happen, and keep happening.']]},
 {t:'stages',eyebrow:'Inside phase one and two',h2:'From identification to IEP',ul:['Understanding dyslexia: what it is and how it shows up','Evaluation: the exact assessment to request, and how','Report analysis: reading the findings without the jargon fog','IEP development: building real services with the school, not against it']},
 {t:'blueprint',eyebrow:'Your first move',h2:'The evaluation request, in three steps',ul:['Put the request in writing, the right way','Ask for the specific evaluation your child needs','Start the clock the law gives you'],sub:'This is the step that turns “wait and see” into a date on the calendar.'},
 {t:'report',eyebrow:'The part parents dread',h2:'Reading the report without the fear',p:'An evaluation comes back as pages of scores, percentiles, and acronyms. Left alone, it is overwhelming. With a little translation, it becomes the clearest picture you have ever had of how your child learns, and the exact evidence you need to ask for services.',sub:'The report is not the verdict. It is your ammunition.'},
 {t:'p3',eyebrow:'Part three: the meeting, led by you',h2:'The prepared parent in the IEP meeting',p:'You sit down already knowing the report, the terms, and what strong support means. You ask for services by name. The meeting stops being something that happens to you and becomes something you lead.',sub:'That shift is the whole point.'},
 {t:'child',eyebrow:'What changes',h2:'What your child feels',p:'They stop being the kid who is behind and quietly start getting the help that fits. The dread around reading eases. Slowly, the story they tell about themselves changes from I can’t to I’m getting there.',sub:'That is what all of this is for.'},
 {t:'quote',eyebrow:'A reframe to keep',big:'Advocating for your child isn’t being difficult. It’s being the exact parent your child needs.'},
 {t:'know',eyebrow:'The one belief to hold',h2:'You know your child best',p:'You do not need a degree in special education to advocate well. You need the map, the right words, and the confidence that the parent in the room who refuses to wait is the parent every dyslexic child deserves.'},
 {t:'whyme',eyebrow:'Who is teaching this',h2:'A teacher, trained, and a parent too',p:'I spent years as a special education teacher in self-contained classrooms, and I am Orton-Gillingham trained. I am also the parent of a dyslexic child, so I have sat on your side of the table. Literacy Untangled exists to hand parents the map I wish every family had.',sub:'This is the work, untangled.'},
 {t:'recap',eyebrow:'What you leave with',h2:'By the end of this hour',ul:['Why “wait and see” is costing your child','The exact first request to make of the school','The three phases from confused to confident advocate']},
 {t:'cta',eyebrow:'Your next step',h2:'Ready to stop waiting?',p:'If you want the full path walked with you, Together Through Dyslexia is the six-month mentorship where we do this together, step by step, meeting by meeting.',cta:'Start at literacyuntangled.com',disclaimer:'This masterclass is educational and reflects one experienced educator’s approach. It is not legal, medical, or psychological advice, and it does not guarantee any specific evaluation result, IEP outcome, or reading progress. Every child and school district is different. Results vary.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='<span class="thread"></span>';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.h1) h+=`<h1>${s.h1}</h1>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.big) h+=`<p class="big">${s.big}</p>`;
  if(s.p) h+=`<p>${s.p}</p>`;
  if(s.phases){h+='<div>';s.phases.forEach(pp=>{h+=`<div class="phase"><div class="pn">${pp[0]}</div><div><p style="font-weight:700">${pp[1]}</p><p class="sub">${pp[2]}</p></div></div>`;});h+='</div>';}
  if(s.ul){h+='<ul>';s.ul.forEach(li=>{h+=`<li>${li}</li>`;});h+='</ul>';}
  if(s.sub) h+=`<p class="sub">${s.sub}</p>`;
  if(s.cta) h+=`<div class="cta-box"><p style="margin:0;font-weight:700;font-size:21px">${s.cta}</p></div>`;
  if(s.disclaimer) h+=`<p class="disclaimer">${s.disclaimer}</p>`;
  if(s.tag) h+=`<div class="tag">${s.tag}</div>`;
  h+=`<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
