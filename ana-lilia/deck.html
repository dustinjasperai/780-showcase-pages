<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Signature Gathering — a masterclass with Ana Lilia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#241a15;
    --panel:#30231c;
    --rule:#4a362b;
    --accent:#48aecb;
    --bronze:#9c6b48;
    --ink:#f4ede6;
    --muted:#c9b7a6;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Montserrat',-apple-system,sans-serif;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:900px;animation:fade .5s ease;}
  .slide.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .kicker{font-family:'Montserrat';font-size:12px;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Marcellus';font-weight:700;font-size:clamp(38px,7vw,74px);line-height:1.04;letter-spacing:-.01em;margin-bottom:24px;}
  h2{font-family:'Marcellus';font-weight:600;font-size:clamp(30px,5vw,52px);line-height:1.1;margin-bottom:22px;}
  .lede{font-size:clamp(17px,2.2vw,22px);line-height:1.6;color:var(--muted);max-width:40ch;}
  p.body{font-size:clamp(16px,2vw,20px);line-height:1.65;color:var(--ink);max-width:46ch;margin-bottom:16px;}
  .big{font-family:'Marcellus';font-size:clamp(44px,9vw,96px);font-weight:700;color:var(--accent);line-height:1;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:clamp(16px,2vw,21px);line-height:1.5;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;color:var(--ink);max-width:48ch;}
  li::before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%;}
  .steps{display:flex;gap:18px;flex-wrap:wrap;margin-top:14px;}
  .step{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--rule);border-left:3px solid var(--accent);padding:22px;border-radius:4px;}
  .step .n{font-family:'Marcellus';font-size:26px;color:var(--bronze);margin-bottom:8px;}
  .step .t{font-weight:600;font-size:17px;margin-bottom:6px;}
  .step .d{font-size:14px;color:var(--muted);line-height:1.5;}
  .math{background:var(--panel);border:1px solid var(--rule);border-radius:6px;padding:26px 28px;max-width:52ch;}
  .math .row{display:flex;justify-content:space-between;gap:16px;padding:12px 0;border-bottom:1px solid var(--rule);font-size:clamp(15px,1.9vw,19px);}
  .math .row:last-child{border-bottom:none;}
  .math .row span:last-child{color:var(--accent);font-weight:600;white-space:nowrap;}
  .math .tot{font-family:'Marcellus';font-size:24px;color:var(--ink);font-weight:700;margin-top:14px;}
  .proof{font-size:clamp(15px,1.9vw,19px);line-height:1.7;color:var(--ink);max-width:48ch;}
  .proof b{color:var(--accent);}
  .disc{margin-top:24px;font-size:13px;color:var(--muted);line-height:1.5;max-width:52ch;font-style:italic;}
  .cta-line{font-size:clamp(18px,2.4vw,26px);color:var(--bronze);font-family:'Marcellus';margin-top:8px;}
  #hud{position:fixed;bottom:18px;right:24px;font-size:12px;letter-spacing:.1em;color:var(--muted);font-family:'Montserrat';}
  #hud b{color:var(--accent);}
  #bar{position:fixed;left:0;bottom:0;height:3px;background:var(--accent);transition:width .3s;}
  .foot{position:fixed;bottom:18px;left:24px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:'Montserrat';}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div class="foot">Ana Lilia &middot; Dream Bigger</div>
<div id="hud"><b id="cur">1</b> / <span id="tot">1</span> &nbsp; &larr; &rarr;</div>
<script>
const S=[
 {t:'title',k:'A live masterclass with Ana Lilia',h:'The Signature Gathering',l:'How soulful coaches and healers build a repeatable $5 to 10K month, without paid ads and without a bigger audience.'},
 {t:'who',k:'Who this is for',h:'You have real gifts. The income just does not reflect them yet.',l:'For coaches, healers and creatives making $1 to 5K months who know they are meant for more consistency, more ease, and more impact.'},
 {t:'trap',k:'The story you have been sold',h:'"Grow your audience. Post more. Go viral."',l:'So you chase followers and a bigger list, the content treadmill never ends, and the income still arrives in feast-or-famine waves.'},
 {t:'reframe',k:'The reframe',h:'You do not need a bigger audience. You need a gathering and a ladder.',l:'More followers will not fix an income that was never given a structure. A small, warm room run well out-earns a big cold list.'},
 {t:'part',k:'Part one',h:'Why impact does not equal income yet.'},
 {t:'content',k:'The real problem',h:'No repeatable container.',b:['One-off sessions that end the moment they end.','Launches that start from scratch every single time.','A calendar that is full one month and empty the next.'],l:''},
 {t:'content',k:'The hidden lever',h:'Your nervous system is running the business.',b:['Undercharging and over-giving come from a dysregulated, scarcity state.','Hiding and "I will launch when it is perfect" are protection, not strategy.','Regulate the body first and the bold decisions get easy.'],l:''},
 {t:'part',k:'Part two',h:'The Dream Bigger method.'},
 {t:'framework',k:'The engine',h:'The Community Revenue Engine',steps:[{n:'01',t:'Signature Gathering',d:'One live room you can fill on repeat.'},{n:'02',t:'Offer Ladder',d:'A clear path from free to flagship.'},{n:'03',t:'Repeatable Revenue',d:'A model you run again every month.'}]},
 {t:'content',k:'Step one',h:'The Signature Gathering.',b:['A live workshop or circle that sells itself.','It becomes your front door, not a one-time event.','People feel your work instead of just reading about it.'],l:''},
 {t:'content',k:'Step two',h:'The Offer Ladder that converts.',b:['Workshop invites people in.','Group program deepens the work.','Retreat or 1:1 carries the ones ready for more.'],l:''},
 {t:'math',k:'What one cycle can hold',h:'None of this needs a bigger audience.',rows:[['25 people at a $55 workshop','$1,375'],['10 people in a $995 group program','$9,950'],['8 retreat deposits at $1,500','$12,000']],tot:'It needs a signature gathering and a ladder that converts.'},
 {t:'framework',k:'The inner work',h:'The Dream Bigger Framework',steps:[{n:'A',t:'Awareness',d:'Surface the belief quietly running the show.'},{n:'A',t:'Actualization',d:'Compromise with yourself and take aligned action.'},{n:'A',t:'Achievement',d:'Consistent small steps over perfectionism.'}]},
 {t:'content',k:'Awareness',h:'Name what you actually believe.',b:['Your subconscious beliefs decide what feels possible.','"It is selfish to want more" quietly caps your prices.','You cannot shift a block you have not yet seen.'],l:''},
 {t:'content',k:'Actualization',h:'Stop forcing. Start compromising.',b:['All-or-nothing is why most goals stall.','Get aligned support instead of white-knuckling it alone.','Make the next step small enough to actually take.'],l:''},
 {t:'content',k:'Achievement',h:'Consistency beats intensity.',b:['One small step at a time, repeated, compounds.','Momentum, not a perfect plan, is what fills the room.','You become the person the bigger income belongs to.'],l:''},
 {t:'content',k:'The magnetism piece',h:'Regulate, then show up.',b:['Reset your nervous system in minutes, not months.','A calm, grounded presence is what feels magnetic.','You charge your worth because you finally believe it.'],l:''},
 {t:'part',k:'Part three',h:'What six months can look like.'},
 {t:'proof',k:'Why me',h:'I built this without paid ads.',proof:'In eight years I have generated <b>over $1,000,000 in sales</b>, filled sold-out retreats seven years running, and done it without paid ads. My work has been featured on <b>NBC Nightly News, the Los Angeles Times, and Harper\'s Bazaar</b>. Inside this method, Rebecca, a yoga teacher, rebuilt her messaging and <b>sold 8 spots for $32,000</b>. Norma, a relationship coach, filled her first paid group and <b>brought in $6,000</b> at launch.'},
 {t:'cta',k:'Your next step',h:'Dream Bigger.',l:'If you are ready to build your signature gathering and a ladder that pays you on repeat, let us talk. Book a free connection call with me and we will map your first cycle.',cta:'Apply for Dream Bigger',disc:'No specific income or result is guaranteed. Results vary and depend on your offers, your audience, and the work you put in. This masterclass is educational and reflects one coach\'s experience.'}
];
const stage=document.getElementById('stage');
function esc(s){return s;}
function render(){
 stage.innerHTML='';
 S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===cur?' on':'');
  let inner='';
  if(s.k)inner+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='title'||s.t==='cta'){inner+=`<h1>${s.h}</h1>`;}else{inner+=`<h2>${s.h}</h2>`;}
  if(s.b){inner+='<ul>'+s.b.map(x=>`<li>${x}</li>`).join('')+'</ul>';}
  if(s.steps){inner+='<div class="steps">'+s.steps.map(x=>`<div class="step"><div class="n">${x.n}</div><div class="t">${x.t}</div><div class="d">${x.d}</div></div>`).join('')+'</div>';}
  if(s.rows){inner+='<div class="math">'+s.rows.map(r=>`<div class="row"><span>${r[0]}</span><span>${r[1]}</span></div>`).join('')+`<div class="tot">${s.tot}</div></div>`;}
  if(s.proof){inner+=`<p class="proof">${s.proof}</p>`;}
  if(s.l)inner+=`<p class="lede">${s.l}</p>`;
  if(s.cta)inner+=`<div class="cta-line">${s.cta}</div>`;
  if(s.disc)inner+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=inner;stage.appendChild(d);
 });
 document.getElementById('cur').textContent=cur+1;
 document.getElementById('tot').textContent=S.length;
 document.getElementById('bar').style.width=((cur+1)/S.length*100)+'%';
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
document.addEventListener('click',e=>{go(cur+1);});
render();
</script>
</body>
</html>
