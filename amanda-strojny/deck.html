<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Yoga Inspired Money Design · Amanda Strojny</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Spectral:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f8fe; --panel:#eef1fb; --rule:#324a86;
    --acc:#516390; --idx:#324a86; --ink:#081359; --grey:#414a73; --dim:#8891b5; --cream:#f6f8fe;
  }
  html,body{height:100%}
  body{background:#05082a;font-family:'Spectral',Georgia,serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#05082a}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',sans-serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:-.01em}
  .t-title h1{font-size:4.4vw;max-width:90%;font-weight:700}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-family:'Spectral',serif;font-size:1.55vw;color:var(--grey);margin-top:2.6vh;max-width:78%;line-height:1.6;font-weight:400}
  .sub{font-family:'Spectral',serif;font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.35vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:90%;font-weight:700}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1a2666 0%,#05082a 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:88%;font-weight:500;color:var(--cream);letter-spacing:-.005em}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1a2666 0%,#05082a 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:84%;font-weight:700;color:var(--cream)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #9fb0dd;color:#dbe2f5;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.22vw;font-weight:500;font-family:'Montserrat',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#8f99c4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .path{position:absolute;pointer-events:none;opacity:.9}
  .title-path{right:7%;bottom:8%;width:24vw}
  .corner-path{right:6%;bottom:7%;width:11vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(8,19,89,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Yoga Inspired Money Design</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a single quiet line that rises from a base, a financial roadmap drawn like a breath -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="path" viewBox="0 0 240 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="26" y1="128" x2="214" y2="128" stroke="#324a86" opacity="0.28"/>
    <path d="M30 118 C78 118 92 66 132 58 C170 50 184 30 210 28" stroke="#516390" opacity="0.95"/>
    <circle cx="210" cy="28" r="6.5" fill="#516390" opacity="0.95"/>
    <path d="M30 118 C70 112 86 92 108 96 C132 100 150 84 176 70" stroke="#324a86" opacity="0.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Yoga Inspired Money Design',sub:'A live masterclass for yoga teachers and healers who want an honest, guilt free relationship with money, without betraying the reason they started teaching.',brand:true,path:'title'},
 {t:'normal',k:'Who this is for',title:'You teach from the heart. Money is where it gets complicated.',body:'You trained for years to hold space, guide a room, and help people change. Nobody trained you to price that work, ask for it, or talk about money without a knot in your stomach. So the teaching grows and the money quietly stays a problem.'},
 {t:'dark',title:'You were never bad with money. You were taught that wanting it makes you a lesser healer.'},

 {t:'section',idx:'Part One',title:'The Money Story Underneath It All'},
 {t:'normal',k:'The scarcity story',title:'Charge less, over give, and apologise for the price.',body:'Round the number down. Add the extra session for free. Say yes to the student who cannot really pay. Each choice feels generous, and together they build a practice that cannot hold you, let alone the people you most want to serve.'},
 {t:'normal',k:'The cost of undercharging',title:'A price set from guilt teaches people to value you less.',body:'When the number apologises for itself, the room feels it. Underpricing does not attract your people, it attracts the ones who were never going to stay. You carry the shortfall in unpaid hours, resentment, and the slow drift toward burnout.'},
 {t:'dark',title:'An empty bank account is not spiritual. It is a devoted teacher heading for burnout.'},

 {t:'section',idx:'Part Two',title:'Yoga Inspired Money Design'},
 {t:'normal',k:'Step one, your money story',title:'Name the story that has been running the show.',body:'Every one of us inherited a set of beliefs about money, usually before we could question them. The first move is not a spreadsheet. It is seeing clearly what you actually believe about money and worth, so the old story stops making the decisions for you.'},
 {t:'normal',k:'Step two, your real numbers',title:'Look at the numbers honestly, without flinching.',body:'Money is energy you can count. What does your work truly cost to offer, what do you need it to earn, and what would enough actually look like? Real numbers, faced with steadiness instead of fear, turn a vague worry into something you can work with.'},
 {t:'normal',k:'Step three, the Rules of Money',title:'Live the Rules of Money and prosper through your gifts.',body:'A few plain principles, practised consistently, change everything: do not spend money you do not have, receive without shame, and let transparency, authenticity and commitment guide each decision. Lived daily, they build trust with money the same way practice builds trust in the body.'},
 {t:'normal',k:'Step four, your financial roadmap',title:'Design a plan that is aligned to your values.',body:'Not a generic budget handed down by an expert who does not know your life. A roadmap built from your money design, your habits, and what genuinely matters to you, so the plan is one you will actually keep because it sounds like you.'},
 {t:'normal',k:'The through line',title:'Power, purpose and potential, held together.',body:'The inner work and the practical work are not two projects. Clearing the shame is what lets you set a fair price and hold it. Facing the numbers is what makes the mindset real. Done together, they support your power, your purpose, and your potential at once.'},
 {t:'dark',title:'Money handled as a practice stops draining the teaching. It becomes what protects it.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The teacher this builds',title:'Fair pay, full presence, and a practice that runs on your values.',body:'You set prices that let you keep teaching for decades. You take the students and clients who are right for you. Money stops being the anxious thing in the corner and becomes quiet fuel for the work, so you can serve from a full cup instead of an empty one.'},
 {t:'dark',title:'Abundance is not less yoga. It is more of you, reaching more of the people who need you.'},
 {t:'normal',k:'Why Amanda Strojny',title:'Eight years in financial services, then the mat.',body:'Amanda Strojny spent eight years in corporate financial services before training as a yoga teacher and transformational coach. She is an ERYT 200 Registered Yoga Teacher and a Certified Transformational Coach, and hosts the Untapped Power podcast. She teaches the whole picture, the mindset and the mechanics of money, together.'},

 {t:'section',idx:'Your Next Step',title:'Design Your Relationship With Money'},
 {t:'normal',k:'Where to begin',title:'Start by finding your money pattern, then go deeper.',body:'The Rules of Money quiz shows you the one pattern quietly shaping your decisions. From there, the Spiritual Money Mindset work and one to one Growth Coaching take you all the way to a values aligned money life, with the accountability to actually get there.'},
 {t:'cta',title:'Ready to design a money life that fits your values?',chips:['Take the Rules of Money quiz','Book a free discovery call'],disc:'Educational content for yoga teachers and holistic practitioners. No income or financial result is guaranteed. Results vary by person, practice, and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="path ${kind==='title'?'title-path':'corner-path'}"><use href="#path"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Amanda Strojny · <b>Yoga Inspired Money Design</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.path) h+=motif(s.path);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
