<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Wise Feminine Leader, a masterclass with Lisa Malia Norman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2a130b;
    --panel:#3a1a0f;
    --rule:#5a2e1e;
    --ink:#ede8e0;
    --muted:#c9b3a4;
    --accent:#c5532d;
    --accent2:#d8a37e;
    --head:'Cormorant Garamond',Georgia,serif;
    --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(0,0,0,.35);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* motif: a ceremonial arc, the crescent of the wise feminine, drawn once in terracotta */
  .slide::before{content:'';position:absolute;top:-120px;right:-120px;width:280px;height:280px;border-radius:50%;
    border:2px solid var(--accent);opacity:.5}
  .slide::after{content:'';position:absolute;top:0;left:0;height:4px;width:120px;background:var(--accent);border-radius:0 0 6px 0}
  .kick{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent2);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:64px;line-height:1.03;margin:0 0 18px;letter-spacing:-0.01em}
  h2{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;margin:0 0 20px;letter-spacing:-0.01em}
  h3{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.52;color:var(--muted);margin:0 0 14px;max-width:46ch}
  .lead{font-size:28px;color:var(--ink);font-family:var(--body)}
  .em{color:var(--accent2);font-style:italic;font-family:var(--head)}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .big{font-family:var(--head);font-size:118px;line-height:1.0;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:2px #ede8e055;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:210px;background:#22100a;border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent2);font-size:26px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:auto}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent2)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:32px}.big{font-size:68px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Evoke Leadership Institute · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Wise Feminine Leader',p:'How to grow your influence, impact, and income from your feminine archetype, without the hustle that empties you.',pres:'With <b>Lisa Malia Norman</b>, Evoke Leadership Institute'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why growth keeps costing you','The extractive default that quietly runs most women leaders down.'],['Your feminine leadership archetype','The way you actually lead best, instead of a borrowed one.'],['A regenerative way to lead','Growing influence and income while honoring your life force, not spending it.']]},
 {t:'audience',kick:'Who this is for',h:'You built the thing. It is quietly eating you.',p:'Purpose-driven women founders, entrepreneurs and nonprofit leaders who have grown something real and can feel the way they got here is not the way to keep going.',who:'<b>The trap:</b> you push harder, hold more, and hit the goals, and there is less and less of you left at the end of it.'},
 {t:'reframe',kick:'The reframe',big1:'Borrowed hustle.',big2:'The <span class="em">wise feminine</span>.',p:'The extractive model treats you like a resource to spend down. Regenerative leadership treats you like a source to tend. One burns bright and burns out. The other lasts, and it grows.'},
 {t:'part',kick:'Part one',h:'Why the growth keeps costing you.'},
 {t:'point',kick:'The core problem',h:'You were handed one way to lead.',p:'Most leadership training is built on an extractive template: push, produce, override the body, repeat. It can build a business. It cannot be run on forever, and it was never designed for the way many women actually lead best.'},
 {t:'framework',kick:'The core problem',h:'Extractive vs. regenerative.',row:[['Extractive','Spends your energy, attention and health to hit the number, then asks for more. Growth on borrowed life force.'],['Regenerative','Grows influence and income in a way that honors life, restores you, and can be sustained. Growth that gives back.']],p:'The question is not whether you can push harder. It is whether the way you are leading gives life back or takes it.'},
 {t:'point',kick:'The core problem',h:'You cannot out-hustle depletion.',p:'When the tank is empty, more effort does not create more impact. It creates resentment, foggy decisions, and a leader who is present in body and gone everywhere else. Depletion is not a discipline problem. It is a design problem.'},
 {t:'part',kick:'Part two',h:'Leading from your archetype.'},
 {t:'point',kick:'The shift',h:'There is not one right way to lead.',p:'The most grounded women leaders are not copying someone else. They lead from their own archetype, the particular way they see, protect, hold and move. Naming yours is where regenerative leadership starts.'},
 {t:'skills',kick:'The Feminine Leadership Archetypes',h:'Find the way you actually lead best.',li:[['The Midwife','Leads by holding space and drawing out what is already there in others.'],['The Protector','Leads by keeping the people, the standards and the mission safe.'],['The Visionary','Leads by seeing what is possible and calling it into being.']],who:'<b>The work:</b> lead from your archetype instead of a template that drains you.'},
 {t:'cycle',kick:'The Feminine Framework',h:'How regenerative leadership works in practice.',steps:['Become a resourced woman: lead from fullness, not from fumes','Cultivate limitless possibility: widen what you believe is available to you','Practice regenerative business: grow revenue in a way that honors life force','Lead from soul-aligned vision: build the legacy you are actually here for'],p:'Not a hustle plan. A way of leading and building that restores you while it grows what you carry.'},
 {t:'point',kick:'The heart of it',h:'Resourced, not depleted.',p:'A resourced woman makes clearer decisions, holds bigger rooms, and leads from presence instead of pressure. Tending your own life force is not indulgent. It is the source your whole enterprise runs on.'},
 {t:'part',kick:'Part three',h:'What your next season can look like.'},
 {t:'truefans',kick:'The thesis',h:'Influence that honors your life.',p:'You do not have to choose between the impact you want and the woman you are becoming. Regenerative leadership is how you grow both at once, on purpose, over years, without the crash at the end.',who:'<b>Principle:</b> tend the source, and the influence, income and legacy grow from it.'},
 {t:'looks',kick:'The outcome',h:'What a regenerative leader looks like.',li:[['Growth that does not cost you yourself','Influence and income that rise while you stay whole.'],['Decisions from presence','Leading from a resourced center, not from depletion.'],['A legacy you are proud of','Building something that honors life, yours and everyone it touches.']]},
 {t:'whyme',kick:'Why Lisa',h:'A woman who has held this ground for 30 years.',li:[['A midwife who has tended women through their biggest thresholds','Three decades of holding space for women in transformation.'],['Founder of Evoke Leadership Institute','And CEO of the nonprofit For The Love Of Cups.'],['Creator of the Feminine Leadership Archetypes and the Feminine Framework','A whole system for regenerative, life-honoring leadership.']]},
 {t:'cta',kick:'Your next step',h:'Ready to lead from the wise feminine?',ctas:['<b>Apply to the Abundant Leaders Mastermind</b> for the full nine-month journey of coaching, retreats and circle.','<b>Start with the EVOKE Feminine Leadership Collective</b> if you want a first step into the work today.'],disc:'This masterclass is educational. It shares frameworks and approaches for feminine leadership and personal growth; it is not advice for your specific situation, not medical or mental-health care, and not a guarantee of any particular result. Outcomes vary by person.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`+(s.who?`<div class="who">${s.who}</div>`:'')}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
