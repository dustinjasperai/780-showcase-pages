<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Conscious Leadership for Hospitality Teams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Urbanist:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf3f2;      /* pale teal-tinted ground, lightened from brand #0c5561 (site_scheme: light) */
    --panel:#fcfefe;   /* near-white teal-white panel, same brand family */
    --ink:#0f2b30;     /* deep teal-ink */
    --muted:#5c7175;
    --accent:#0c5561;  /* brand dominant teal, from brand.json ranked_colors */
    --rule:#e4e0d8;
    --head:'Poppins', system-ui, sans-serif;
    --body:'Urbanist', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 56px;margin:22px 0;min-height:360px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(15,43,48,.03);
  }
  .eyebrow{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.14;letter-spacing:-.01em}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);margin-top:18px;max-width:40ch}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);margin-top:16px;max-width:52ch}
  p.body{font-size:18px;line-height:1.6;color:var(--ink);margin-top:14px;max-width:56ch}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:18px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:58ch}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li b{font-family:var(--head);font-weight:600}
  .big{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.12;color:var(--accent);max-width:22ch}
  .cta h2{font-size:34px}
  .step{font-family:var(--head);font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.04em}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);line-height:1.5;max-width:60ch}
  .kicker{font-family:var(--head);font-weight:600;color:var(--accent);font-size:15px}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:13px;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;padding:5px 14px;margin-top:22px}
  .title-slide{background:linear-gradient(180deg,#0c5561 0%,#0a4752 100%);color:#fff;border:0}
  .title-slide .eyebrow{color:#bfe3e6}
  .title-slide h1{color:#fff}
  .title-slide .sub{color:#d6eced}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass', h:'Conscious Leadership for Hospitality Teams',
   sub:'How presence, not another service script, builds teams your guests can feel.'},

  {t:'who', eyebrow:'Who this is for', h:'For hospitality leaders whose teams show up, but are not really there.',
   body:'You run a good operation. Standards are written, training is done, the schedule is covered. And still, something is missing in how your people show up for each other and for the guest.'},

  {t:'trap', eyebrow:'The trap', h:'You keep adding standards. Presence keeps slipping.',
   body:'The instinct is to add another checklist, another script, another incentive. Those manage behaviour. They do not create a team that is genuinely present, and guests can always tell the difference.'},

  {t:'reframe', eyebrow:'A harder truth', big:'About 95% of what we do runs on the subconscious. Your team runs on your state before it runs on your standards.'},

  {t:'part', eyebrow:'Part one', h:'Presence cannot be scripted.',
   body:'Conscious leadership means leading with awareness, intention, and empathy: being fully present, understanding how your energy lands on the people around you, and aligning your actions with a sense of purpose. That is the lever nothing on the org chart can replace.'},

  {t:'list', eyebrow:'Part one', h:'Routine is not ritual.',
   items:['<b>A routine</b> is something you do over and over again.',
          '<b>A ritual</b> is something you do over and over again with tons of intention.',
          'The difference is where your attention goes, and your team feels the difference every shift.']},

  {t:'part', eyebrow:'Part two: the framework', h:'The ritual structure.',
   body:'Presence is a practice, and a practice needs structure. Three rituals hold the leader steady enough to be present for a whole team, all day, every day.'},

  {t:'list', eyebrow:'Ritual one', h:'The morning ritual.',
   items:['Meditation with a gratitude visualisation before the day takes you.',
          'You set your own state first, on purpose, instead of inheriting the first problem that walks in.',
          'A present leader is made before the shift, not during it.']},

  {t:'list', eyebrow:'Ritual two', h:'The evening ritual.',
   items:['A deliberate close to the day: reflect, acknowledge, and reset.',
          'You separate what happened from what you carry into tomorrow.',
          'This is how leaders stay in the work for years without hollowing out.']},

  {t:'list', eyebrow:'Ritual three', h:'The weekly ritual.',
   items:['A regular point to reconnect the team to why the work matters.',
          'Individual goals get aligned to a greater mission, out loud.',
          'Rhythm, not reaction, becomes how the team is led.']},

  {t:'list', eyebrow:'Part two', h:'Human-centered leadership.',
   items:['Build roles around people, instead of forcing people into predetermined boxes.',
          'Make each person feel genuinely seen, heard, and valued.',
          'That is what turns a staffed rota into an empowered, engaged team.']},

  {t:'part', eyebrow:'Part two', h:'Influence by attachment, not by information.',
   body:'Technology has given everyone the same information, so knowing more is no longer the leader’s edge. The edge now is relationship: the trust and connection that make people want to follow you through a hard night.'},

  {t:'list', eyebrow:'Part three: the payoff', h:'A purpose-driven culture.',
   items:['A sense of pride in the work itself.',
          'A sense of community between the people doing it.',
          'A sense of belonging that keeps good people from leaving.']},

  {t:'part', eyebrow:'Part three', h:'Hospitality as an inner practice.',
   body:'This is conscious hospitality: a practice rooted in mindfulness, presence, and intentionality that goes beyond service to create genuine, lasting human connection. The guest experience is the visible edge of the leader’s inner work.'},

  {t:'why', eyebrow:'Why me', h:'David Arraya',
   body:'Twenty plus years in luxury hospitality, including The Pierre and Six Senses Ibiza, now leading at the level of a world-class wellbeing destination. Author of Conscious Hospitality and host of The Conscious Hospitality Podcast. Conscious Hospitality Unlimited is where that practice becomes your team’s.'},

  {t:'recap', eyebrow:'In one line', big:'Set your own state with ritual, lead people as people, and the guest experience follows.'},

  {t:'cta', eyebrow:'Your next step', h:'Bring conscious leadership to your team.',
   step:'Book a consultation with Conscious Hospitality Unlimited to design the practice for your own leaders and teams.',
   disclaimer:'This masterclass is for educational purposes only. It shares a leadership practice and makes no guarantee of any specific business, financial, or performance result. Outcomes vary with context and execution.'}
];

const deck = document.getElementById('deck');
function esc(s){return s;}
S.forEach(function(s){
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){ h += '<h1>'+s.h+'</h1>'; if(s.sub) h += '<div class="sub">'+s.sub+'</div>'; }
  else if(s.big){ h += '<div class="big">'+s.big+'</div>'; }
  else { if(s.h) h += '<h2>'+s.h+'</h2>'; }
  if(s.lede) h += '<div class="lede">'+s.lede+'</div>';
  if(s.body) h += '<p class="body">'+s.body+'</p>';
  if(s.items){ h += '<ul>'; s.items.forEach(function(it){ h += '<li>'+it+'</li>'; }); h += '</ul>'; }
  if(s.step) h += '<p class="body">'+s.step+'</p>';
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  d.innerHTML = h;
  deck.appendChild(d);
});
</script>
</body>
</html>
