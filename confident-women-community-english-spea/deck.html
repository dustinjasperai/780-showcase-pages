<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Freeze: A Live Masterclass with Annemarie Fowler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  /* Palette derived from speakconfidentenglish.com live CSS (see 01-deep-research ## Palette):
     ground #fbf9f4, panel #f5efea, rule #ecdfd6, ink #20015a, accent #8b42ac, gold #d99a4e */
  :root{
    --bg:#fbf9f4;
    --panel:#f5efea;
    --rule:#ecdfd6;
    --ink:#20015a;
    --ink-soft:#4a3a63;
    --accent:#8b42ac;
    --gold:#d99a4e;
    --head:'Playfair Display',Georgia,serif;
    --body:'Lato',-apple-system,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 52px;
    margin:22px 0;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(32,1,90,0.03);
  }
  .slide.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.panel{background:var(--panel)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  .slide.dark .kicker{color:var(--gold)}
  h1{font-family:var(--head);font-weight:800;font-size:58px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.1}
  h3{font-family:var(--head);font-weight:600;font-size:27px;line-height:1.15;margin-bottom:10px}
  p{font-size:20px;color:var(--ink-soft);margin-top:16px;max-width:40em}
  .slide.dark p{color:#d8cfe6}
  .lead{font-size:24px;color:var(--ink)}
  .slide.dark .lead{color:var(--bg)}
  .em{color:var(--accent);font-style:italic}
  .slide.dark .em{color:var(--gold)}
  .rule{height:2px;width:64px;background:var(--gold);margin:22px 0;border:0}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:20px;color:var(--ink-soft);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li b{color:var(--ink);font-weight:700}
  .num{font-family:var(--head);font-weight:700;font-size:18px;color:var(--accent);letter-spacing:.1em}
  .credit{font-size:16px;color:var(--ink-soft);margin-top:8px}
  .foot{font-family:var(--body);font-size:13px;color:var(--ink-soft);margin-top:28px;letter-spacing:.03em}
  .cta-box{margin-top:24px;padding:20px 24px;background:var(--panel);border-left:4px solid var(--accent);border-radius:6px}
  .cta-box .lead{font-weight:700}
  .disclaimer{font-size:13px;color:var(--ink-soft);margin-top:26px;line-height:1.5;max-width:46em}
  .pagetag{font-family:var(--body);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-soft);opacity:.7;margin-bottom:8px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Annemarie Fowler',
    h:'The Freeze',
    lead:'How to speak English with confidence in the moment, even if you are shy and have studied for years.' },

  {t:'who', kicker:'If this is you',
    h:'You understand every word. Then it is your turn, and you go silent.',
    p:'You have studied for years. Classes, private teachers, apps, podcasts. You understand almost everything you hear. But the moment someone turns to you, your thoughts scatter and the words are gone.' },

  {t:'hook', dark:true, kicker:'The reframe',
    h:'You do not have an English problem. You have a freeze problem.',
    p:'The English is already inside you. What stops you is the freeze, the pause between understanding and speaking. That is a different problem, and it has a different solution.' },

  {t:'section', panel:true, num:'PART ONE', h:'What the freeze really is' },

  {t:'body', kicker:'It is not a lack of English',
    h:'I froze too, after twenty years of teaching.',
    p:'When I moved to France I had studied French for years. Then I stood in a bakery, could not order bread, and went home discouraged. I was a language teacher who could not speak. If more study fixed the freeze, it would have fixed mine.' },

  {t:'body', kicker:'What is happening in the moment',
    h:'Your brain is translating, and translation is slow.',
    p:'In real conversation there is no time to translate. While you search for the perfect word, the moment passes, someone else speaks, and the fear grows. The freeze is a habit of the moment, not a gap in your grammar.' },

  {t:'body', panel:true, kicker:'Why more grammar does not help',
    h:'You cannot study your way out of a speaking habit.',
    p:'Grammar drills and vocabulary lists build knowledge you already have. Speaking with confidence is a skill you build by speaking, with the right method and real practice. That is what the next part is.' },

  {t:'section', panel:true, num:'PART TWO', h:'The method: how to speak in the moment' },

  {t:'pillar', num:'01', h:'Think in English, stop translating',
    p:'Train yourself to reach for meaning directly instead of running every sentence through your first language. This is the single change that removes the pause before you speak.' },

  {t:'pillar', num:'02', h:'Buy time and answer without freezing',
    p:'Confident speakers are not faster, they have natural ways to hold the floor while they think. A handful of simple phrases keeps you in the conversation instead of frozen outside it.' },

  {t:'pillar', num:'03', h:'Keep speaking when you lose a word',
    p:'You will forget words. Everyone does, in every language. The skill is staying in motion, describing your way around the gap so the conversation never stops for it.' },

  {t:'pillar', num:'04', h:'Organize your thoughts so you stop rambling',
    p:'When several ideas arrive at once, you freeze or you ramble. A simple structure lets you choose what to say first and keep your point clear, so people follow you and you sound sure.' },

  {t:'pillar', panel:true, num:'05', h:'Practice that transfers to real life',
    p:'Skills only become confidence through real speaking practice with feedback. Small, focused, regular practice is what turns knowing English into speaking it, at work and in daily life.' },

  {t:'section', panel:true, num:'PART THREE', h:'What changes when the freeze goes' },

  {t:'body', kicker:'The shift',
    h:'From silent and stressed to free.',
    p:'Students describe the same thing in different words. Some call it freedom. Some call it the click, a new way of speaking. What they share is that the English they had all along finally starts working for them, in meetings, at appointments, and in the conversations that matter.' },

  {t:'body', panel:true, kicker:'Is this you',
    h:'Two kinds of people this is for.',
    p:'Newcomers who want to feel at home in daily life in English, and professionals who want to speak up in meetings, interview well, and share their expertise without hesitation. If you are shy or introverted, this was built with you in mind.' },

  {t:'why', kicker:'Who is teaching this',
    h:'Annemarie Fowler',
    credit:'Founder of Speak Confident English. Creator of Fluency School and the Confident Women Community. MA in TESOL from The New School, teaching since 1996. Since 2016, Fluency School has helped thousands of students from more than 90 countries speak English with clarity and confidence.' },

  {t:'cta', kicker:'Your next step',
    h:'Come do this with me, live.',
    p:'Fluency School is my live, eight week program where we build these skills together with real practice, feedback, and support. It opens for enrollment twice a year.',
    cta:'Get your invitation to join the next live round of Fluency School at speakconfidentenglish.com.',
    disclaimer:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your own practice and circumstances.' },
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.dark?' dark':'') + (s.panel?' panel':'');
  let html = '';
  html += '<div class="pagetag">The Freeze · Speak Confident English · '+(i+1)+' / '+S.length+'</div>';
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if (s.num && s.t==='section') html += '<div class="num">'+s.num+'</div>';
  if (s.t==='title'){ html += '<h1>'+s.h+'</h1><hr class="rule"><p class="lead">'+s.lead+'</p>'; }
  else if (s.t==='section'){ html += '<h2>'+s.h+'</h2>'; }
  else if (s.t==='pillar'){ html += '<div class="num">'+s.num+'</div><h2>'+s.h+'</h2><p>'+s.p+'</p>'; }
  else if (s.t==='why'){ html += '<h1>'+s.h+'</h1><hr class="rule"><p class="credit">'+s.credit+'</p>'; }
  else if (s.t==='cta'){
    html += '<h2>'+s.h+'</h2><p>'+s.p+'</p>';
    html += '<div class="cta-box"><p class="lead">'+s.cta+'</p></div>';
    html += '<p class="disclaimer">'+s.disclaimer+'</p>';
  }
  else { if(s.h) html += '<h2>'+s.h+'</h2>'; if(s.p) html += '<p>'+s.p+'</p>'; }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
