<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Your Hygiene Department Is Your Biggest Asset · Debbie Seidel-Bittke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#171B24; --panel:#1F2530; --rule:#313847;
    --copper:#C98A4B; --sage:#8CA98F; --chalk:#F2EEE6; --grey:#C7CCD6; --dim:#6E7686;
  }
  html,body{height:100%}
  body{background:#000;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--copper);margin-bottom:2.4vh}
  h1{font-family:'Petrona',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.6vw}
  .t-normal h1{font-size:3.3vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'IBM Plex Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sage);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--copper),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#232B39 0%,#0B0E14 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-style:italic;color:#F1EEE6}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#232B39 0%,#0B0E14 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--copper);color:#F0D2AC;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .gauge-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-gauge{right:7.5%;bottom:8%;width:20vw}
  .corner-gauge{right:6%;bottom:7.5%;width:9vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--copper);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--copper);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.3vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Hygiene Profit Systems</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ascending dashboard bars rising to a small node: the "financial dashboard" motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gauge" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="136" x2="246" y2="136" stroke="#8CA98F" opacity="0.4"/>
    <rect x="34" y="100" width="26" height="36" fill="none" stroke="#C98A4B" opacity="0.85"/>
    <rect x="86" y="76" width="26" height="60" fill="none" stroke="#C98A4B" opacity="0.85"/>
    <rect x="138" y="48" width="26" height="88" fill="none" stroke="#C98A4B" opacity="0.85"/>
    <rect x="190" y="24" width="26" height="112" fill="none" stroke="#F2EEE6" opacity="0.16"/>
    <circle cx="203" cy="24" r="5" fill="none" stroke="#C98A4B" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Your Hygiene Department Is Your Biggest Asset',sub:'How dental practice owners find the profit already sitting in their hygiene schedule, without adding chair time, doctor hours, or headcount.',brand:true,gauge:'title'},
 {t:'normal',k:'Who this is for',title:'You already trust your hygiene department. You just cannot see what it is actually producing.',body:'You know the chairs are full most days. What you do not have is a clear number for what a full schedule should be worth, or where it is quietly falling short.'},
 {t:'normal',k:'The trap',title:'So you reach for more: another hour, another hygienist, more marketing spend.',body:'Every one of those costs money. None of them touch the leak that is already sitting in the schedule, the diagnosis, and the numbers you have today.'},
 {t:'dark',title:'The fastest growth in your practice is not a new patient. It is the exam chair you already fill every day.'},

 {t:'section',idx:'Part One',title:'Where the Profit Actually Hides'},
 {t:'normal',k:'The scheduling leak',title:'Under-scheduling quietly costs more than a slow month.',body:'When appointment intervals are guessed instead of built around what each patient type actually needs, the practice loses production every single day, not just on the days it feels slow.'},
 {t:'normal',k:'The case acceptance stall',title:'A treatment plan dies the moment the doctor and hygienist disagree in front of the patient.',body:'A patient can feel it when the two of you are not reading from the same page. That hesitation is often the real reason a diagnosed treatment plan never gets scheduled, not the price.'},
 {t:'normal',k:'The blind spot',title:'Most practices have no monthly number that catches either problem early.',body:'Without a simple, regular look at production, follow-through, and cancellations, a small leak has months to become a bad quarter before anyone notices it.'},
 {t:'dark',title:'You do not have a hygiene problem. You have a visibility problem.'},

 {t:'section',idx:'Part Two',title:'The Three Systems'},
 {t:'normal',k:'System one','title':'The "Down-to-a-Science" Time Management System.',body:'A scheduling protocol that defines the correct appointment interval and service length for each hygiene patient type, so production is not lost to guesswork on the book.'},
 {t:'normal',k:'System two',title:'Calibration Exercises.',body:'A short, structured routine that gets the hygienist and the doctor diagnostically aligned on how a patient is classified, so the treatment plan you raise and the plan the doctor confirms never contradict each other in front of the patient.'},
 {t:'normal',k:'System three',title:'Financial Dashboard Monitoring.',body:'A monthly tracking system for hygiene production, treatment-plan follow-through, and cancellations, so a leak gets caught while it is still small.'},
 {t:'normal',k:'Built on a standard',title:'Protocols anchored to AAP, ADA, and ADHA guidelines.',body:'A case presentation holds up to a skeptical patient, and to your own doctor, when it is visibly built on a real professional standard, not a script.'},
 {t:'dark',title:'Three systems. One clear number that finally tells you the truth about your hygiene department.'},

 {t:'section',idx:'Part Three',title:'What This Looks Like In Your Practice'},
 {t:'normal',k:'The result',title:'Productivity without working harder or increasing overhead.',body:'Same chairs, same hours, same team. What changes is how much of what is already possible in your schedule actually gets captured.'},
 {t:'normal',k:'Who is teaching this',title:'Debbie Seidel-Bittke, RDH, BS.',body:'Founder of Dental Practice Solutions and Dental Hygiene Solutions. Named a top dental consultant by Dentistry Today for 15+ years, former assistant professor and hygiene-department program director, national speaker, and contributing author for dental trade publications.'},
 {t:'dark',title:'You already own the asset. These systems are how you finally see what it is worth.'},

 {t:'section',idx:'Your next step',title:'Start With a Discovery Session'},
 {t:'cta',title:'Ready to see what your hygiene department is really producing?',chips:['Book a Discovery Session','Explore Hygiene Department Optimization'],disc:'Educational content for dental practice owners. No production, revenue, or business result is guaranteed. Results vary by practice.'},
];

const deck=document.getElementById('deck');
function gauge(kind){return `<svg class="gauge-motif ${kind==='title'?'title-gauge':'corner-gauge'}"><use href="#gauge"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Hygiene Profit <b>Systems</b> · Debbie Seidel-Bittke, RDH</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.gauge) h+=gauge(s.gauge);
  else if(s.t==='title') h+=gauge('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
