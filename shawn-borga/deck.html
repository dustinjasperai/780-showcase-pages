<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 5X Exit &middot; Shawn Borga</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#011627; --panel:#04213b; --rule:#173049; --deep:#000321;
    --acc:#ff7f02; --chalk:#e9edf2; --body:#a9b7c4; --dim:#5f7186;
  }
  html,body{height:100%}
  body{background:#000914;font-family:'Inter',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000914}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .slide::before,.slide::after{content:'';position:absolute;width:1.1vw;height:1.1vw;border:1.5px solid var(--rule);opacity:.8}
  .slide::before{top:4%;left:4%;border-right:none;border-bottom:none}
  .slide::after{bottom:4%;right:4%;border-left:none;border-top:none}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Poppins',Arial,sans-serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:3.7vw;max-width:82%}
  .t-normal h1{font-size:2.9vw;max-width:82%}
  .t-normal .body{font-size:1.4vw;color:var(--body);margin-top:2.6vh;max-width:72%;line-height:1.58;font-weight:300}
  .sub{font-size:1.5vw;color:var(--body);margin-top:3.2vh;max-width:72%;line-height:1.48;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.32vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4vw;max-width:86%;color:var(--chalk)}
  .t-section .rule{width:14vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:var(--deep);align-items:center;text-align:center}
  .t-dark::before,.t-dark::after{border-color:rgba(233,237,242,.28)}
  .t-dark h1{font-size:3vw;max-width:80%;color:var(--chalk);font-style:italic}
  .t-cta{background:var(--deep);align-items:center;text-align:center}
  .t-cta::before,.t-cta::after{border-color:rgba(233,237,242,.28)}
  .t-cta h1{font-size:3.3vw;max-width:78%;color:var(--chalk)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:var(--chalk);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.14vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .badge{display:inline-flex;align-items:center;justify-content:center;width:2.4vw;height:2.4vw;border:1.5px solid var(--acc);border-radius:50%;
    font-family:'Poppins',sans-serif;font-size:1.2vw;color:var(--chalk);margin-bottom:1.6vh}
  .brandline{font-size:1.2vw;color:var(--body);margin-top:3.2vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .t-normal,.t-title{background:linear-gradient(180deg,var(--bg),var(--panel))}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(233,237,242,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.6vw}.badge{width:7vw;height:7vw;font-size:3.2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Your Biz Coach</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The 5X Exit',sub:'A live masterclass for sign, print, and apparel shop owners, built from the Five Times Exit track of Shawn Borga\'s Freedom Biz Framework.',brand:true},

 {t:'normal',k:'Who this is for',title:'You didn\'t get into the sign business to run it forever.',body:'Most sign, print, and apparel-decoration owners doing seven figures a year are still the person every big bid gets run past, every production problem lands on, and every buyer relationship depends on. That was fine in year three. By year fifteen it\'s the whole business sitting on one set of shoulders.'},

 {t:'dark',title:'You can hit seven figures and still own a business nobody would pay a dollar for.'},

 {t:'section',idx:'Part One',title:'Why Growth Alone Never Makes a Shop Sellable'},
 {t:'normal',k:'The trap',title:'Revenue goes up. The owner\'s hours don\'t go down.',body:'More jobs usually means more pricing decisions only the owner trusts, more vendor relationships only the owner holds, and more production calls only the owner can make. Growth without a plan just builds a bigger version of the same dependency.'},
 {t:'normal',k:'What it costs',title:'A shop that only runs with you in it is a shop you can\'t leave.',body:'Whether the goal is stepping back, bringing in a partner, or eventually selling, none of it is possible while the business only works correctly with the owner physically in it every day.'},

 {t:'dark',title:'Most owners find this out the hard way, at a burnout year, a health scare, or an appraisal that comes back lower than they expected.'},

 {t:'section',idx:'Part Two',title:'The Freedom Biz Framework'},
 {t:'normal',k:'The 70-Hour Prison',title:'The more you work, the less it seems to pay.',body:'Fifty to seventy hour weeks that don\'t move the number they\'re supposed to move. The pattern shows up almost everywhere in this trade: more hours in the shop, and the income barely moves, sometimes it even drops.'},
 {t:'normal',k:'Operator to Orchestrator',title:'Stop being the one every job depends on.',body:'The shift from operator, trapped running the business day to day, to orchestrator, leading it strategically so it runs whether you\'re in the building or not. This isn\'t theory. It\'s the shift that let one owner\'s shop keep running for months during a family health crisis that pulled him out completely.'},
 {t:'normal',k:'Track One, Growth',title:'Profit acceleration, a real team, and processes that hold without you.',body:'For owners not planning to exit for three to ten years: the systems that build operational freedom now, so the business is worth more and easier to run every year that passes.'},
 {t:'normal',k:'Track Two, Five Times Exit',title:'Build toward a 5X valuation multiple, on purpose.',body:'For owners planning to sell: a structured track built around what actually moves a sign shop\'s sale price, not a guess at what a buyer might pay.'},

 {t:'dark',title:'The difference between an accidental sale and a designed one is whether you built toward it on purpose.'},

 {t:'section',idx:'Part Three',title:'How The System Actually Runs'},
 {t:'normal',k:'The diagnostics',title:'Two assessments show you exactly where the value is leaking.',body:'A profit-side assessment and a digital-marketing-side assessment, each producing a customized roadmap and a detailed report. Not a generic checklist. A read on this specific shop, this specific trade.'},
 {t:'normal',k:'Why Shawn Borga',title:'Built, scaled, and sold two businesses in this exact trade.',body:'22 years in print, sign, and apparel decoration. Two completed exits, the first at 49 after staying on 15 months post-sale to see it through right. Two failed partnerships along the way that taught him what the successes never could.'},

 {t:'section',idx:'Your Next Step',title:'Find Out Where Your Shop\'s Value Is Leaking'},
 {t:'normal',k:'How it works',title:'A short conversation, not a sales pitch.',body:'The call is built to figure out where your business actually is today, growth track or exit track, and which part of the Freedom Biz Framework matches that.'},

 {t:'cta',title:'Ready to build toward a 5X exit on purpose?',chips:['Book a Call','Your Biz Coach'],disc:'Educational content for sign, print, and apparel-decoration shop owners. No income or business result is guaranteed. Results vary by market, business, and operator.'},
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    if(s.k){
      h+=`<div class="kicker">${s.k}</div>`;
    }
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Shawn <b>Borga</b> &middot; Your Biz Coach</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
