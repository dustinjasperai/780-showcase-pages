<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prepare to Race -a JYT Training masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#0b0b0d;
    --panel:#17171b;
    --rule:#2b2b30;
    --ink:#f4f4f2;
    --ink-soft:#b9b9b6;
    --accent:#d5d5d5;
  }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Open Sans',-apple-system,sans-serif;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .slide{display:none;width:min(1120px,92vw);min-height:min(630px,86vh);padding:72px;border:1px solid var(--rule);background:linear-gradient(160deg,var(--panel),var(--bg));flex-direction:column;justify-content:center;}
  .slide.on{display:flex;}
  .eyebrow{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.28em;text-transform:uppercase;font-size:14px;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;text-transform:uppercase;line-height:1.02;letter-spacing:.01em;font-size:66px;color:var(--ink);}
  h2{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;line-height:1.08;font-size:40px;color:var(--ink);margin-bottom:26px;}
  .lead{font-size:23px;line-height:1.5;color:var(--ink-soft);max-width:40ch;margin-top:24px;}
  .body{font-size:20px;line-height:1.6;color:var(--ink-soft);max-width:48ch;}
  .body strong{color:var(--ink);font-weight:600;}
  ul{list-style:none;margin-top:14px;}
  li{font-size:20px;line-height:1.5;color:var(--ink-soft);padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px;}
  li:first-child{border-top:none;}
  li b{font-family:'Oswald',sans-serif;font-weight:600;color:var(--accent);min-width:40px;}
  li span strong{color:var(--ink);font-weight:600;}
  .kicker{font-family:'Oswald',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.14em;font-size:15px;color:var(--accent);margin-top:30px;}
  .brandline{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.2em;text-transform:uppercase;font-size:15px;color:var(--ink-soft);margin-top:34px;}
  .disclaimer{font-size:13px;line-height:1.5;color:#7d7d7a;margin-top:28px;max-width:52ch;}
  .nav{position:fixed;bottom:22px;right:28px;font-family:'Oswald',sans-serif;letter-spacing:.1em;font-size:13px;color:var(--ink-soft);}
  .hint{position:fixed;bottom:22px;left:28px;font-family:'Oswald',sans-serif;letter-spacing:.1em;font-size:12px;color:#55555a;text-transform:uppercase;}
  @media(max-width:640px){.slide{padding:38px;}h1{font-size:40px;}h2{font-size:28px;}.lead{font-size:19px;}.body{font-size:17px;}li{font-size:17px;}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav" id="nav"></div>
<div class="hint">Arrow keys or click to advance</div>
<script>
const S=[
 {t:'title',eyebrow:'A JYT Training Masterclass',title:'Prepare to Race',lead:'The complete race-day system for motocross: how to get a rider to the gate ready in body and mind.',brand:'JYT Training'},
 {t:'promise',eyebrow:'What this session covers',h2:'By the end you will know',bullets:['Why race day is won in the week before, not at the gate','What racing strength is, and why gym strength is not it','How to train the mental side so nerves do not decide the moto','The one plan that ties physical and mental prep together']},
 {t:'for',eyebrow:'Who this is for',h2:'Riders and the families behind them',body:'Amateur to pro motocross, dirt bike, ATV and trials racers who put in the work, and the parents who shape the environment around them. If you train hard and still feel like race day is a coin flip, this is for you.'},
 {t:'trap',eyebrow:'The trap',h2:'You train all week. Then you hope.',body:'Most riders grind through workouts, show up to race, and leave the actual performance to chance. The body is tired in the wrong way, the mind is loud at the gate, and there is no plan for the days that matter most.'},
 {t:'reframe',eyebrow:'The reframe',h1:'Race day is not a talent test. It is a preparation test.',lead:'The fastest riders are not the ones who want it more on Saturday. They are the ones who prepared for Saturday.'},
 {t:'part',eyebrow:'Part One',h2:'The core problem',body:'Two things quietly cost riders results: training that was built for a gym instead of a bike, and a mental game that is never actually practiced. Fix both and the same rider finishes stronger.'},
 {t:'point',eyebrow:'Problem one',h2:'Gym strength is not racing strength',body:'Bodybuilding workouts add the wrong weight and fatigue. Racing strength builds a rider who can push the bike harder and longer, hold form deep into a moto, and recover faster between races and practices.'},
 {t:'point',eyebrow:'Problem two',h2:'The gate is mental, and nobody practices it',body:'A rider who tightens up at the gate does not have a talent problem. They have an unpracticed mind. Focus, nerves and self-talk are skills, and skills can be trained on purpose.'},
 {t:'part',eyebrow:'Part Two',h2:'The JYT system',body:'Everything in JYT coaching runs on four parts that work as one. This is what "prepare to race" actually means.'},
 {t:'pillar',eyebrow:'Pillar 1 - The JYT Moto Method',h2:'Racing strength, built for the bike',body:'Strength and conditioning designed for motocross, not the weight room. The goal is simple: push the bike harder and longer than you ever have, with fewer injuries and faster recovery.'},
 {t:'pillar',eyebrow:'Pillar 2 - Prepare to Race',h2:'The planning week',body:'A structured plan for the days before the gate: training, recovery, nutrition and race-day logistics mapped out, so nothing is improvised when it counts.'},
 {t:'pillar',eyebrow:'Pillar 3 - Mental Performance Pathway',h2:'Train the mind in three phases',bullets:['Awareness: see your patterns in mindset, emotion and behavior','Tracking: thought logs, race-day reflections, family check-ins','Focused change: calming techniques, perspective shifts, pressure skills']},
 {t:'point',eyebrow:'Pillar 3 - the tools',h2:'What the mental work looks like',body:'The Pre-Race and Reset Ritual, visualization, breathing to settle the nervous system, and the Rider Reflection Sheet before and after every race. Small, repeatable, built for the gate.'},
 {t:'pillar',eyebrow:'Pillar 4 - The racing family',h2:'Parents are part of the performance',body:'The adults around a rider shape pressure, communication and how failure gets read. A race result is information, not an identity. The best environments develop the athlete, not just chase the podium.'},
 {t:'part',eyebrow:'Part Three',h2:'What a prepared rider looks like',body:'Same track, same competition. One rider is guessing. The other arrives with strength built for the bike, a plan for the week, and a mind that has already been to the gate a hundred times in practice.'},
 {t:'point',eyebrow:'In practice',h2:'The week before the gate',bullets:['Early week: racing strength and conditioning','Mid week: sharpen and recover','Race eve: the pre-race reset ritual','Race morning: visualization and routine','At the gate: one prepared rider']},
 {t:'why',eyebrow:'Why JYT',h2:'Who is coaching you',body:'Joel Younkins has coached racers, athletes and powerlifters since 2010, with an exercise-science background. Kelly Younkins, a clinical therapist and mental-performance coach, leads the mental side. Physical and mental, under one roof in Mineral Ridge, Ohio.'},
 {t:'recap',eyebrow:'The whole idea',h1:'Prepare the rider, not just the workout.',lead:'Racing strength, a planned week, a trained mind, and a family that develops the athlete. One system, aimed at the gate.'},
 {t:'cta',eyebrow:'Your next step',h2:'Work with JYT',body:'If you want this built around your rider, apply for coaching at jytraining.com. We run a limited roster so each athlete gets high-touch, individualized coaching, physical and mental.',kicker:'Apply for coaching at jytraining.com',disclaimer:'This masterclass is educational. Results vary by rider, effort, health and circumstance, and nothing here is a guarantee of race results or placement.'}
];
const stage=document.getElementById('stage');
const nav=document.getElementById('nav');
let i=0;
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
 stage.innerHTML='';
 const s=S[i];
 const d=document.createElement('div');
 d.className='slide on';
 let h='';
 if(s.eyebrow)h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
 if(s.title)h+='<h1>'+esc(s.title)+'</h1>';
 if(s.h1)h+='<h1>'+esc(s.h1)+'</h1>';
 if(s.h2)h+='<h2>'+esc(s.h2)+'</h2>';
 if(s.lead)h+='<div class="lead">'+esc(s.lead)+'</div>';
 if(s.body)h+='<div class="body">'+esc(s.body)+'</div>';
 if(s.bullets){h+='<ul>';s.bullets.forEach((b,n)=>{h+='<li><b>0'+(n+1)+'</b><span>'+esc(b)+'</span></li>';});h+='</ul>';}
 if(s.kicker)h+='<div class="kicker">'+esc(s.kicker)+'</div>';
 if(s.brand)h+='<div class="brandline">'+esc(s.brand)+'</div>';
 if(s.disclaimer)h+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
 d.innerHTML=h;
 stage.appendChild(d);
 nav.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1);});
document.addEventListener('click',()=>go(i+1));
render();
</script>
</body>
</html>
