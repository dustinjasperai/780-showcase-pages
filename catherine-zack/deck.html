<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Power Without the Armor - A Live Masterclass with Catherine Zack</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2E3A2F;        /* deep moss - her grounded, Hudson Valley brand world */
    --panel:#39463A;     /* panel */
    --rule:#51604F;      /* hairline */
    --accent:#C2714B;    /* warm clay - grounded, not corporate */
    --ink:#F3EEE4;       /* warm sand text */
    --muted:#B9BEAE;
    --disp:'Lora',Georgia,serif;
    --body:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .kicker{font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:1.4rem}
  h1{font-family:var(--disp);font-weight:500;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--disp);font-weight:500;font-size:clamp(1.9rem,4.4vw,3.1rem);line-height:1.1}
  .promise{font-family:var(--disp);font-style:italic;font-size:clamp(1.15rem,2.3vw,1.6rem);color:var(--ink);margin-top:1.8rem;max-width:30ch;opacity:.92}
  p.body{font-size:clamp(1.05rem,1.8vw,1.3rem);max-width:40ch;margin-top:1.4rem;color:var(--ink)}
  .num{font-family:var(--disp);font-size:1rem;color:var(--muted);position:absolute;top:7vh;right:8vw;letter-spacing:.1em}
  ul{list-style:none;margin-top:1.8rem;max-width:42ch}
  li{font-size:clamp(1.02rem,1.7vw,1.25rem);padding:.7rem 0 .7rem 1.6rem;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:1.25rem;width:.5rem;height:.5rem;background:var(--accent);border-radius:50%}
  .step{display:flex;align-items:baseline;gap:1.4rem;margin-top:1rem}
  .step .letter{font-family:var(--disp);font-size:clamp(3rem,8vw,6rem);color:var(--accent);line-height:1;font-weight:600}
  .step .word{font-family:var(--disp);font-size:clamp(1.6rem,3.2vw,2.4rem)}
  .accent{color:var(--accent)}
  .part{color:var(--muted)}
  .disc{font-size:.82rem;color:var(--muted);max-width:56ch;margin-top:2.4rem;line-height:1.5}
  .cta-next{font-size:clamp(1.1rem,2vw,1.4rem);margin-top:1.5rem;max-width:40ch}
  footer{padding:5vh 8vw;color:var(--muted);font-size:.85rem;font-family:var(--disp);font-style:italic}
</style>
</head>
<body>
<div id="deck"></div>
<footer id="foot"></footer>
<script>
const S=[
  {t:'title', kicker:'A live masterclass with Catherine Zack',
   h:'Power Without the Armor',
   promise:'For high-achieving lawyers who are exhausted by the very thing that got them to the top. Lead without the burnout the armor creates.'},

  {t:'who', kicker:'Who this is for',
   h:'You look like you have it handled.',
   list:['You are excellent at your work and the hours prove it',
         'You cannot actually switch off, even on the rare night you are home',
         'You run on adrenaline and call it drive',
         'Something quieter keeps asking how long you can keep this up']},

  {t:'trap', kicker:'The trap',
   h:'You were trained to push through.',
   body:'Law rewards control, stamina, and never letting them see you rattled. It works, right up until the cost of keeping the armor on becomes the thing wearing you down.'},

  {t:'hook', kicker:'The reframe',
   h:'The armor that got you here is what is burning you out.',
   body:'The control and the overdrive are not character strengths you can discipline harder. They are a nervous system that never got the signal that the threat is over.'},

  {t:'part', kicker:'Part One', h:'Why discipline keeps failing you.'},

  {t:'point', kicker:'The core problem',
   h:'Willpower treats the symptom.',
   body:'Better time management, a harder morning routine, one more productivity system. They all assume the problem is your behavior. The problem is underneath the behavior, in a nervous system stuck in high alert.'},

  {t:'split', kicker:'The distinction at the heart of this work',
   h:'Manage, or regulate.',
   list:['Manage: fight the symptom, lean on willpower, and it comes back tomorrow',
         'Regulate: change the baseline the whole system is running from',
         'Management is exhausting because it never ends. Regulation is what ends it.']},

  {t:'part', kicker:'Part Two', h:'The nervous-system-first path.'},

  {t:'point', kicker:'Nervous-system-first',
   h:'Regulate the system first. Everything else second.',
   body:'This is gradual, supported change that honors both who you have been and who you are becoming. It is drawn from ancient contemplative traditions and confirmed by current research on stress and nervous-system regulation. You do not have to become someone else. You have to come back to yourself.'},

  {t:'point', kicker:'The practice',
   h:'SALT: a practice you can run in the middle of a hard day.',
   body:'Not twenty quiet minutes you do not have. Four steps, sixty seconds, inside the moment that is actually stressing you. Named for the way salt makes food taste more like itself. The practice helps you feel more like yourself.'},

  {t:'step', kicker:'SALT', letter:'S', word:'Stop',
   body:'One deep breath to put a boundary between what is happening and your habitual reaction. The pause is the whole beginning.'},

  {t:'step', kicker:'SALT', letter:'A', word:'Allow',
   body:'Let the discomfort be there instead of bracing against it. You are not agreeing with it. You are remembering you still have a choice in how you respond.'},

  {t:'step', kicker:'SALT', letter:'L', word:'Listen',
   body:'Tune in to what the sensation and the emotion are telling you. Underneath the reaction is a pattern, and the pattern is the information.'},

  {t:'step', kicker:'SALT', letter:'T', word:'Touch',
   body:'Hand to heart, feet on the earth. Physical sensation is how you come back into the body and resolve the moment instead of carrying it into the next one.'},

  {t:'point', kicker:'Why it works',
   h:'The practice meets you where the stress actually is.',
   body:'Most of what you were offered happens away from the pressure, on a cushion, after hours, when the day is already over. SALT happens inside the deposition, the call, the inbox. That is the only place regulation ever has to live.'},

  {t:'part', kicker:'Part Three', h:'What changes when you stop bracing.'},

  {t:'point', kicker:'The shift',
   h:'Authentic power, not protective armor.',
   body:'You still walk into the highest-stakes rooms. You just do it from a regulated baseline instead of a braced one, sourcing your power from wisdom rather than from how hard you can push. That is the move from burnout to something sustainable.'},

  {t:'why', kicker:'Why me',
   h:'I built the armor before I took it off.',
   body:'I practiced corporate litigation at a firm in Washington, D.C., and I left the partnership track because the cost had become the whole story. I have spent the last dozen years as a meditation teacher and executive coach helping high-achieving professionals, many of them lawyers, do this exact work. I am not asking you to leave the law. I am offering a way to stay in it as yourself.'},

  {t:'cta', kicker:'Staying with the work',
   h:'Keep going, with support.',
   cta:'If this landed, the next step is to work together directly, through coaching built around your nervous system and the life you actually have, or at the next live retreat.',
   disc:'This masterclass is educational. It is not medical, psychological, or legal advice, and it is not a substitute for care from a licensed professional. No specific outcome or result is promised or guaranteed. Individual results vary.'}
];

function esc(x){return (x||'').toString();}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let inner='<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  if(s.kicker) inner+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.t==='title'){ inner+='<h1>'+esc(s.h)+'</h1>'; if(s.promise) inner+='<div class="promise">'+esc(s.promise)+'</div>'; }
  else if(s.t==='part'){ inner+='<h1 class="part">'+esc(s.h)+'</h1>'; }
  else if(s.t==='step'){
    inner+='<div class="step"><div class="letter">'+esc(s.letter)+'</div><div class="word">'+esc(s.word)+'</div></div>';
    if(s.body) inner+='<p class="body">'+esc(s.body)+'</p>';
  }
  else {
    if(s.h) inner+='<h2>'+esc(s.h)+'</h2>';
    if(s.body) inner+='<p class="body">'+esc(s.body)+'</p>';
    if(s.list){ inner+='<ul>'; s.list.forEach(x=>inner+='<li>'+esc(x)+'</li>'); inner+='</ul>'; }
    if(s.cta) inner+='<p class="cta-next">'+esc(s.cta)+'</p>';
    if(s.disc) inner+='<p class="disc">'+esc(s.disc)+'</p>';
  }
  el.innerHTML=inner;
  deck.appendChild(el);
});
document.getElementById('foot').textContent='Catherine Zack - Contemplative Practice & the Practice of Law';
</script>
</body>
</html>
