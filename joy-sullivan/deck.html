<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write What You Wish You Didn't Know — a masterclass with Joy Sullivan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0d0d;        /* her dominant near-black (brand.json, 22 uses) */
    --panel:#17120f;     /* warm-shifted lift toward her rust/brick family */
    --rule:#3a2b26;      /* muted brick, from the #8e1a1c family */
    --accent:#c93c27;    /* her exact terracotta accent (brand.json, h2) */
    --ink:#f6f3eb;       /* her exact bone/cream h1 color */
    --muted:#b7ac9f;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
    padding:64px 60px;margin:0 0 22px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent);opacity:.0}
  .slide.part::before,.slide.title::before,.slide.cta::before{opacity:1}
  .kick{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:700;font-size:60px;line-height:1.04;margin-bottom:20px}
  h2{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.08;margin-bottom:18px}
  .lede{font-family:var(--serif);font-style:italic;font-size:27px;line-height:1.4;color:var(--ink)}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:64ch;margin-top:14px}
  .big{font-family:var(--serif);font-size:38px;line-height:1.25;color:var(--ink);max-width:24ch}
  .ghost{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:21px;line-height:1.5;color:var(--ink);padding:14px 0 14px 30px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:24px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  li span{display:block;font-size:16px;color:var(--muted);margin-top:5px}
  .num{font-family:var(--serif);font-size:20px;color:var(--accent);margin-bottom:10px}
  .pair{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:26px}
  .pair .box{border:1px solid var(--rule);border-radius:10px;padding:24px}
  .pair .box h3{font-family:var(--sans);font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .pair .box .q{font-family:var(--serif);font-style:italic;font-size:22px;color:var(--ink);line-height:1.35}
  .foot{font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:30px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:70ch;line-height:1.5}
  .num-tag{position:absolute;right:26px;bottom:20px;font-family:var(--sans);font-size:12px;color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', cls:'title', kick:'A live masterclass with Joy Sullivan',
   h1:'Write What You Wish You Didn’t Know',
   lede:'The poem hiding in the thing you’re afraid to say.',
   p:'One live hour. You leave with a draft that finally tells the truth.'},

  {t:'who', kick:'Who this is for',
   h2:'You can write. That was never the problem.',
   p:'This hour is for poets and essayists who sit down to write something true and watch it come out careful, tidy, and strangely like everyone else’s. You are not short on craft. You are being polite on the page.'},

  {t:'trap', kick:'The trap',
   big:'You were taught to <em>write what you know</em>. So you write the version that makes you look wise.'},

  {t:'hook', cls:'part',
   big:'The safe draft is the one nobody remembers. The stories worth reading are the ones you were afraid to say out loud.'},

  {t:'part', cls:'part', num:'Part One', h2:'Why “write what you know” keeps you safe'},

  {t:'body', kick:'The instinct',
   h2:'We reach for the lesson.',
   p:'When a poem gets close to something tender, the instinct is to zoom out and offer advice: here is what I learned, here is the takeaway. It feels generous. It is actually a way to leave the room before it gets uncomfortable.'},

  {t:'quote',
   lede:'“A poet’s true job is not to offer advice, but rather to aptly name the ache.”',
   foot:'The whole method turns on that sentence.'},

  {t:'part', cls:'part', num:'Part Two', h2:'The method: write what you wish you didn’t know'},

  {t:'pillar', kick:'Pillar one', h2:'Name the ache, not the lesson',
   p:'Skip the moral. Say the confusing, exhausting, specific thing underneath it. The reader does not need your advice. They need to feel less alone, and that only happens when you name what actually hurts.'},

  {t:'pillar', kick:'Pillar two', h2:'Write from the body',
   p:'Language lands through sensation before intellect. A word like whoosh does work an idea cannot. Get out of your head and onto the skin of the moment, and the poem stops explaining and starts happening.'},

  {t:'pillar', kick:'Pillar three', h2:'Drop the hero',
   p:'Stop trying to be impressive. Catalog the insecurities, the loneliness, all the ways you are ordinary and human. That is not oversharing. That is the material, and it is the only thing a reader cannot get anywhere else.'},

  {t:'pillar', kick:'Pillar four', h2:'Write it now, not someday',
   p:'The desire to write does not wait for the sabbatical that never comes. The work happens in stolen minutes, honestly and quickly, or it does not happen. Urgency is a craft decision.'},

  {t:'part', cls:'part', num:'Part Three', h2:'What it looks like on the page'},

  {t:'demo', kick:'The turn',
   h2:'From careful to true',
   pair:[
     {h:'The safe line', q:'I learned that grief makes you stronger in the end.'},
     {h:'Named from the ache', q:'I kept setting two plates. My hands knew before I did.'}
   ],
   p:'Same moment. The first explains a feeling. The second lets you have it. In the live hour, we make that turn on a line of your own.'},

  {t:'session', kick:'The live hour',
   h2:'How the session runs',
   li:[
     ['Find the thing you have been writing around'],
     ['Name the ache underneath it, in one plain line'],
     ['Rewrite it from the body'],
     ['Cut the hero and the lesson'],
     ['Read it back out loud, together']
   ]},

  {t:'why', kick:'Who’s teaching',
   h2:'Joy Sullivan',
   p:'Poet and teacher, author of the national bestseller Instructions for Traveling West (Penguin Random House). Former poet-in-residence at the Wexner Center for the Arts, with a Master’s in poetry, guest lectures at Stanford and Florida International University, and work in Oprah Daily. Founder of Sustenance, a writing community of roughly 250 poets and essayists.'},

  {t:'change', kick:'What changes',
   h2:'You stop performing and start telling the truth.',
   p:'Once you can name the ache, the blank page stops being a stage. You write faster, you write braver, and the work finally sounds like you instead of like a writer being good.'},

  {t:'cta', cls:'cta', kick:'Come write with us',
   h2:'Keep writing with us.',
   p:'If this hour cracked something open, that is exactly what Sustenance is for: twice-monthly generative sessions, radically loving feedback, and a room of writers doing this work alongside you. Join the waitlist and come write.',
   foot:'joysullivanpoet.com/sustenance',
   disc:'This masterclass is educational. Craft outcomes vary from writer to writer and no publishing or income result is guaranteed.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.cls||'');
  let html='';
  if(s.num) html+='<div class="num">'+s.num+'</div>';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.h1) html+='<h1>'+s.h1+'</h1>';
  if(s.h2) html+='<h2>'+s.h2+'</h2>';
  if(s.lede) html+='<div class="lede">'+s.lede+'</div>';
  if(s.big) html+='<div class="big">'+s.big.replace(/<em>/g,'<span class="ghost">').replace(/<\/em>/g,'</span>')+'</div>';
  if(s.pair){html+='<div class="pair">';s.pair.forEach(b=>{html+='<div class="box"><h3>'+b.h+'</h3><div class="q">'+b.q+'</div></div>';});html+='</div>';}
  if(s.li){html+='<ul>';s.li.forEach(x=>{html+='<li>'+x[0]+(x[1]?'<span>'+x[1]+'</span>':'')+'</li>';});html+='</ul>';}
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.foot) html+='<div class="foot">'+s.foot+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  html+='<div class="num-tag">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
