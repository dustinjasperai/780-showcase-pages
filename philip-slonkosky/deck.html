<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The TEAM-Driven Pediatric Practice — Pediatric Dental Directions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6F1E9;        /* warm cream ground (brand: approachable pediatric warmth) */
    --panel:#FFFDF8;     /* warm white panel */
    --rule:#E7DDD0;
    --ink:#1C2B33;       /* deep slate */
    --muted:#5C6B73;
    --accent:#E8792B;    /* coral-amber: the "Heart" value */
    --deep:#0E7C86;      /* clinical teal: trust */
    --head:'Baloo 2',system-ui,sans-serif;
    --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;
    -webkit-font-smoothing:antialiased;padding:40px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:26px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:54px 56px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--deep);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:48px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px}
  .lede{font-size:21px;color:var(--muted);margin-top:22px;max-width:40ch}
  p{font-size:19px;margin-top:14px;max-width:54ch}
  ul{margin:18px 0 0 0;list-style:none;display:flex;flex-direction:column;gap:14px}
  li{font-size:19px;padding-left:34px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .pillar li::before{background:var(--deep)}
  .big{font-size:30px;font-family:var(--head);font-weight:600;line-height:1.2;color:var(--ink)}
  .accent{color:var(--accent)}
  .deepc{color:var(--deep)}
  .cover{background:var(--ink);color:#fff}
  .cover::before{background:var(--accent)}
  .cover .kick{color:#F2C9A0}
  .cover h1{font-size:54px}
  .cover .lede{color:#CDD7DB}
  .brand{font-family:var(--head);font-weight:600;margin-top:40px;color:#fff;font-size:17px}
  .sig{display:flex;gap:14px;align-items:baseline;margin-top:26px}
  .num{font-family:var(--head);font-weight:700;font-size:15px;color:var(--muted)}
  .disc{font-size:14px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
  .foot{position:absolute;right:26px;bottom:20px;font-family:var(--head);font-size:12px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
  @media(max-width:640px){.slide{padding:38px 28px;min-height:auto}h1{font-size:36px}.cover h1{font-size:40px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover', kick:'A live masterclass for pediatric dentists',
   h:'The TEAM-Driven Pediatric Practice',
   lede:'How to build a practice that runs with low stress, without leading every part of it yourself.',
   brand:'Pediatric Dental Directions'},

  {t:'content', kick:'What you will leave with',
   h:'A different way to carry your practice',
   items:['Why a thriving practice is TEAM driven, not doctor led',
          'The four pillars that let the practice run without you in the middle of everything',
          'A clear first step you can take with your team next Monday']},

  {t:'content', kick:'Who this is for',
   h:'The pediatric dentist who is doing well, and still exhausted',
   items:['You built a real practice and you are proud of it',
          'You are also the bottleneck, every decision and every fire comes back to you',
          'You want the growth to stop costing you your evenings and your weekends']},

  {t:'big', kick:'The trap',
   h:'You became a pediatric dentist to treat kids',
   big:'Not to be the person every problem in the building has to route through.'},

  {t:'big', kick:'The hook',
   h:'Working harder is making it worse',
   big:'The more the practice depends on you, the less it can grow, and the more it wears you down.'},

  {t:'part', kick:'Part one', h:'The real problem',
   lede:'It is not effort, and it is not your numbers. It is that the whole practice still runs on you.'},

  {t:'content', kick:'Part one', h:'The doctor as the single point of failure',
   items:['Decisions wait for you, so the day backs up the moment you are in a long case',
          'The team asks instead of owns, because nothing has made ownership their job',
          'When you are out, the practice holds its breath until you are back']},

  {t:'content', kick:'Part one', h:'Why hustle cannot fix a structure problem',
   items:['More hours buys a little room, then the practice grows back into them',
          'The fix is not you doing more, it is the team being built to carry more',
          'Work smarter, not harder, is a structure, not a slogan']},

  {t:'part', kick:'Part two', h:'The shift: TEAM driven, not doctor led',
   lede:'The practices that run with low stress are the ones where the team owns the culture, the schedule, and the day, with the doctor leading, not carrying.'},

  {t:'pillar', kick:'Pillar one', h:'Business systems for success and low stress',
   items:['The practice runs on written systems, not on your memory',
          'A new team member can find the answer without finding you',
          'Low stress is a by-product of a practice that is built to run']},

  {t:'pillar', kick:'Pillar two', h:'KPIs and the numbers',
   items:['A handful of numbers tell you whether the practice is healthy',
          'When the team can see the scoreboard, you are not the only one watching it',
          'You lead from the numbers instead of from your gut and your worry']},

  {t:'pillar', kick:'Pillar three', h:'Scheduling for a better work-life balance',
   items:['The schedule is your single biggest lever over your own time',
          'Build it for the life you want first, then fit the chairs around it',
          'A protected calendar is what makes the rest of this sustainable']},

  {t:'pillar', kick:'Pillar four', h:'HR, leadership, team building and culture',
   items:['Hire, correct, and have the hard conversations without blowing up the culture',
          'Culture is not a poster, it is what the team does when you are not in the room',
          'A team that owns the culture is a team that owns the practice']},

  {t:'content', kick:'The daily rhythm', h:'The Morning Huddle',
   items:['The smallest unit of a well-run practice is a good morning huddle',
          'Ten minutes that set the day, surface the risks, and align the team',
          'Done right, the day runs on the huddle instead of on you']},

  {t:'part', kick:'Part three', h:'A completely different Tuesday',
   lede:'Same practice, same team, a day that runs on the system instead of on you.'},

  {t:'content', kick:'A team-driven day', h:'The practice runs, and you practice',
   items:['The day starts on the huddle, not on a scramble',
          'The team solves the small problems before they ever reach you',
          'You spend your energy on dentistry and leadership, not on being the glue']},

  {t:'content', kick:'Why us', h:'Taught by pediatric dentists, in the trenches',
   items:['Dr. Phil Slonkosky and Dr. Bobby Elliott have built and run their own practices',
          'Pediatric Dental Directions has taught this curriculum since 2014',
          'Real life pediatric dentistry, from people who still do it every day']},

  {t:'content', kick:'Recap', h:'The four pillars, together',
   items:['Business systems for low stress',
          'KPIs and the numbers',
          'Scheduling for your life',
          'Team, leadership and culture']},

  {t:'cta', kick:'Your next step', h:'Build the team that runs it with you',
   lede:'If this is the practice you want, the next step is to go deeper on the pillars with us.',
   step:'Join us at the next PDDx Bootcamp, or start a conversation about coaching for your practice.',
   disc:'This masterclass is educational. It shares frameworks and experience, not guarantees. Every practice is different, and no specific financial, growth, or practice outcome is promised or implied. Results vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cover'?' cover':'') + (s.t==='pillar'?' pillar':'');
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.t==='cover'){
    html += '<h1>'+s.h+'</h1>';
    if(s.lede) html += '<div class="lede">'+s.lede+'</div>';
    if(s.brand) html += '<div class="brand">'+s.brand+'</div>';
  } else {
    html += '<h2>'+s.h+'</h2>';
    if(s.big) html += '<div class="big">'+s.big+'</div>';
    if(s.lede) html += '<div class="lede">'+s.lede+'</div>';
    if(s.items){ html += '<ul>'; s.items.forEach(it=>html+='<li>'+it+'</li>'); html += '</ul>'; }
    if(s.step) html += '<p class="big" style="margin-top:22px">'+s.step+'</p>';
    if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  }
  html += '<div class="foot">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
