<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Second Seat, a masterclass with Jenny Mitchell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4f1;          /* warm off-white ground (brand #f6f6f6, warmed toward copper) */
    --panel:#ffffff;
    --ink:#1a323c;         /* Chavender H1 slate-teal */
    --body:#2b2b2b;
    --accent:#008791;      /* Chavender dominant brand teal */
    --accent2:#905334;     /* Chavender copper */
    --rule:#1a323c;
    --muted:#5c6b70;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--body);font-family:"Montserrat",system-ui,sans-serif;font-weight:300;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 96px}
  .slide{
    background:var(--panel);border-radius:4px;padding:64px 64px;margin:22px 0;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(26,50,60,.06),0 18px 40px -30px rgba(26,50,60,.5);
    position:relative;overflow:hidden;
  }
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:"Prata",Georgia,serif;font-weight:400;color:var(--ink);font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Prata",Georgia,serif;font-weight:400;color:var(--ink);font-size:38px;line-height:1.12;margin-bottom:20px}
  h3{font-family:"Prata",Georgia,serif;font-weight:400;color:var(--ink);font-size:26px;margin-bottom:10px}
  p{font-size:19px;color:var(--body);max-width:60ch;margin-top:14px}
  p.lead{font-size:22px;color:var(--ink);font-weight:400}
  .sub{margin-top:26px;font-size:15px;color:var(--muted);letter-spacing:.02em}
  ul{list-style:none;margin-top:22px;max-width:64ch}
  li{position:relative;padding-left:30px;margin:16px 0;font-size:19px;color:var(--body)}
  li::before{content:"";position:absolute;left:0;top:12px;width:14px;height:2px;background:var(--accent)}
  .steps{display:flex;gap:8px;margin-bottom:26px}
  .steps span{height:3px;width:34px;background:#dfe4e5;border-radius:2px}
  .steps span.on{background:var(--accent)}
  .big{font-family:"Prata",Georgia,serif;font-size:40px;color:var(--ink);line-height:1.15;max-width:20ch}
  .accentword{color:var(--accent)}
  .copper{color:var(--accent2)}
  .part .kicker{color:var(--accent2)}
  .part h1{font-size:44px}
  .rulebar{height:2px;width:64px;background:var(--rule);margin:26px 0 0}
  .cta{background:var(--ink);color:#eef3f3}
  .cta .kicker{color:#7fd0d6}
  .cta h1{color:#ffffff}
  .cta p{color:#cdd8da}
  .cta .disc{margin-top:34px;font-size:13px;color:#9fb0b3;max-width:70ch;line-height:1.5}
  .whyrow{display:flex;flex-wrap:wrap;gap:14px 34px;margin-top:24px}
  .whyrow div{font-size:16px;color:var(--body)}
  .whyrow b{color:var(--ink);font-weight:600}
  .slidenum{position:absolute;top:22px;right:26px;font-size:12px;color:#b7c1c3;letter-spacing:.1em}
  @media(max-width:720px){.slide{padding:40px 26px;min-height:auto}h1{font-size:36px}h2{font-size:30px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Jenny Mitchell',
   h:'The Second Seat',
   p:'How the most capable woman in the room steps out, gets seen, and leads from the front.',
   sub:'Jenny Mitchell, CFRE, CEC, DMA. Founder of Chavender. Author of Embracing Ambition. Host of the Underdog Leadership Podcast.'},

  {t:'who', kicker:'Who this room is for',
   h:'You already run half of it.',
   bullets:[
     'You are the trusted number two. The one who holds it together when it matters.',
     'You have earned more than the title you carry, and you know it.',
     'You keep waiting for the moment someone finally taps you on the shoulder.'],
   p:'If that is you, this hour was built for you.'},

  {t:'trap', kicker:'The quiet lie',
   h:'"Do great work and someone will notice."',
   p:'It is the story most talented women were handed. It rewards you for staying heads-down, over-delivering, and waiting to be chosen. It is also the reason so many brilliant number twos never make it to number one.'},

  {t:'hook',
   big:'No one is coming to tap you on the shoulder. The senior table is <span class="accentword">claimed</span>, not granted.'},

  {t:'part', kicker:'Part One', h:'Why the best number twos get stuck.',
   steps:1},

  {t:'content', kicker:'The pattern', h:'Ambition gets mislabeled.',
   bullets:[
     'You were praised for being reliable, not for being hungry, so you learned to hide the hunger.',
     'Typecasting sets in. The room decides what you are "good at" and stops imagining you anywhere else.',
     'You start asking for permission instead of asking for the role.'],
   p:'This is not a confidence problem. It is a positioning problem.'},

  {t:'content', kicker:'The cost', h:'Over-delivering in a seat you have outgrown.',
   bullets:[
     'You take on more to prove you are ready, and the proving never ends.',
     'You are told to chase "balance," which quietly means do the same work and feel guilty about all of it.',
     'The result is burnout dressed up as dedication.'],
   p:'Ambition spent on proving is ambition that never compounds.'},

  {t:'hook',
   big:'The shift is from ambition that <span class="copper">proves</span> to ambition that comes from <span class="accentword">fullness</span>.'},

  {t:'part', kicker:'Part Two', h:'The Step Out, Be Seen, and Lead framework.',
   steps:2},

  {t:'content', kicker:'One. Step Out', h:'Name what you actually want.',
   bullets:[
     'Ambition from a place of inner fullness, not from a need for outside approval.',
     'Say the number out loud. Ask for the money and the promotion you have already earned.',
     'Empowerment, not victimhood. You are not waiting to be rescued from the second seat.']},

  {t:'content', kicker:'Two. Be Seen', h:'Visibility is a practice, not a personality.',
   bullets:[
     'Discomfort and fear are signals you are growing, not signs you should stop.',
     'Ask for feedback on purpose, then act on it in public.',
     'Lead with meaningful conversations. The people who decide the top seat need to hear you think.']},

  {t:'content', kicker:'Three. Lead', h:'Prepare for the table before you reach it.',
   bullets:[
     'Know the obstacles waiting on the way to the senior leadership table, and rehearse them.',
     'Lead adaptably. Strong and flexible at once, not rigid and not fragile.',
     'Carry the room by conviction, not by working the longest hours in it.']},

  {t:'content', kicker:'Why the name', h:'The Chavender.',
   p:'Chavender is named after a saltwater fish that survived climate change, overfishing, and disaster by adapting. That is the whole thesis of leadership here. The women who reach the first seat are not the most rigid or the loudest. They are the ones strong enough to hold their ground and adaptable enough to change shape when the water does.'},

  {t:'part', kicker:'Part Three', h:'What the next ninety days can look like.',
   steps:3},

  {t:'content', kicker:'What changes', h:'You stop waiting to be chosen.',
   bullets:[
     'The conversations you start, instead of the ones you wait to be invited into.',
     'The rooms where your name comes up when you are not there.',
     'The roles you are considered for, because you finally asked to be.']},

  {t:'content', kicker:'Integration, not balance', h:'A life that holds the ambition.',
   p:'This is not about doing more. It is about integrating the ambition into a life you can sustain, so the climb to the first seat does not cost you everything you were climbing for.'},

  {t:'why', kicker:'Why me', h:'I have made this exact climb.',
   whyrow:[
     ['Ten years as a fundraiser','I raised millions for mission-driven organizations before I ever called myself a coach.'],
     ['CFRE, CEC, DMA','A fundraising executive designation, an executive coaching credential, and a doctorate in performance.'],
     ['Embracing Ambition','My book brings together twelve women leaders on what it actually feels like to lead.'],
     ['Underdog Leadership','A podcast in its sixth season on the leaders the room underestimated.']]},

  {t:'content', kicker:'What you leave with', h:'Language for the leap.',
   bullets:[
     'A clear name for the ambition you have been managing quietly.',
     'The three moves, Step Out, Be Seen, Lead, mapped to your own next role.',
     'A first meaningful conversation to have this week, with the person who holds the door.']},

  {t:'cta', kicker:'Your next step', h:'Ready to step out?',
   p:'If this is the year you move from the second seat to the first, let us have a conversation about what that climb looks like for you. Reach out to Chavender and we will find a time to talk.',
   disc:'This masterclass is educational. It shares a leadership framework and personal experience. It is not a promise or guarantee of any specific promotion, title, income, or outcome. Results vary from person to person.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t||'');
  let inner='<div class="slidenum">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.steps){inner+='<div class="steps">'+[1,2,3].map(n=>'<span class="'+(n<=s.steps?'on':'')+'"></span>').join('')+'</div>';}
  if(s.kicker){inner+='<div class="kicker">'+s.kicker+'</div>';}
  if(s.big){inner+='<div class="big">'+s.big+'</div>';}
  if(s.h){inner+=(s.t==='title'?'<h1>'+s.h+'</h1>':(s.t==='part'||s.t==='cta'?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>'));}
  if(s.p){inner+='<p'+(s.t==='title'?' class="lead"':'')+'>'+s.p+'</p>';}
  if(s.bullets){inner+='<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';}
  if(s.whyrow){inner+='<div class="whyrow">'+s.whyrow.map(r=>'<div><b>'+r[0]+'</b><br>'+r[1]+'</div>').join('')+'</div>';}
  if(s.sub){inner+='<div class="sub">'+s.sub+'</div>';}
  if(s.t==='title'||s.t==='part'){inner+='<div class="rulebar"></div>';}
  if(s.disc){inner+='<div class="disc">'+s.disc+'</div>';}
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
