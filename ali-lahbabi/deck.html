<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masterclass - Pouvoir Interieur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf5ec;      /* their warm off-white ground */
    --panel:#f3e8cf;   /* derived from their cream #e8ddc0 */
    --rule:#e0d4b4;
    --ink:#1f2a44;     /* their deep navy */
    --muted:#5c6378;
    --accent:#c89b3e;  /* their gold, dominant harvested hex */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:"Inter Tight";font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:"EB Garamond",serif;font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"EB Garamond",serif;font-weight:600;font-size:38px;line-height:1.14;margin-bottom:14px}
  .lead{font-family:"EB Garamond",serif;font-size:25px;line-height:1.4;color:var(--ink);margin-top:18px}
  p.body{font-size:18px;color:var(--muted);margin-top:14px;max-width:62ch}
  .statement{font-family:"EB Garamond",serif;font-size:40px;line-height:1.22;font-weight:500}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:30px;font-size:19px;color:var(--ink);max-width:64ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .dimnum{font-family:"EB Garamond",serif;font-size:72px;font-weight:600;color:var(--accent);opacity:.55;line-height:1}
  .quote{font-family:"EB Garamond",serif;font-style:italic;font-size:30px;line-height:1.35}
  .cite{margin-top:18px;font-size:15px;color:var(--muted);letter-spacing:.02em}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:24px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px}
  .card .n{font-family:"EB Garamond",serif;font-size:30px;color:var(--accent);font-weight:600}
  .card .l{font-size:15px;color:var(--muted);margin-top:6px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:64ch;line-height:1.5}
  .ctabtn{display:inline-block;margin-top:26px;background:var(--accent);color:#1f1a0e;font-weight:600;font-size:18px;padding:15px 30px;border-radius:999px;font-family:"Inter Tight"}
  .foot{position:absolute;right:26px;bottom:20px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:"Masterclass - Pouvoir Interieur",
   h:"Creer et vendre depuis la Presence",
   lead:"Comment batir un business aligne et rentable sans te cramer dans le stress, le mental et le controle."},

  {t:'statement', kicker:"Pour qui",
   big:"Tu crees ou tu entreprends, mais souvent dans le bruit mental, la pression et le sentiment de devoir tout controler.",
   body:"Cette heure est pour les solopreneurs et createurs qui sentent qu'il existe une facon plus calme et plus juste d'avancer, et qui veulent relier leur vie interieure a leur vie de createur."},

  {t:'statement', kicker:"Le vrai probleme",
   big:"Aucune strategie business ne fonctionne durablement sur un terrain interieur fragile.",
   body:"On empile les tactiques, les tunnels, les to-do. Et pourtant ca force, ca s'epuise, ca se desaligne. Le probleme n'est presque jamais la strategie. C'est le terrain sur lequel elle est posee."},

  {t:'statement', kicker:"Partie 1 - Le piege",
   big:"Le mode hustle te coupe de ta meilleure source de decisions : ton intuition.",
   body:"Plus le mental crie, moins tu entends la voix fine qui sait vraiment quoi creer, quoi dire oui, quoi lacher. La volonte seule ne remplace pas cette boussole la."},

  {t:'list', kicker:"Partie 1 - Les symptomes",
   h:"Ce que ca donne au quotidien",
   items:[
     "Tu avances vite, mais dans la tension, et le repos devient suspect.",
     "Tes offres sortent du mental, pas de ce qui te traverse vraiment.",
     "Tu doutes au moment de vendre, parce que tu n'es pas pleinement derriere.",
     "Le business grandit, mais toi tu te vides."]},

  {t:'statement', kicker:"Partie 2 - La methode",
   big:"La Renaissance : cinq dimensions, dans l'ordre, du terrain interieur jusqu'a la croissance.",
   body:"On ne commence pas par la tactique. On apaise d'abord le terrain, puis on construit la strategie dessus. C'est ce qui la rend durable."},

  {t:'dim', kicker:"Dimension 1", num:"01",
   h:"Le corps et le systeme nerveux",
   body:"Apaiser ce qui est sur-sollicite. Reapprendre a sentir ton corps comme une boussole plutot que comme une machine a pousser. Un systeme nerveux regule, c'est la base de toute decision juste."},

  {t:'dim', kicker:"Dimension 2", num:"02",
   h:"Les croyances et l'identite",
   body:"Reperer les croyances qui te limitent et incarner une identite alignee. Tu ne construis plus un business malgre qui tu es, mais a partir de qui tu es vraiment."},

  {t:'dim', kicker:"Dimension 3", num:"03",
   h:"Le sens et la spiritualite",
   body:"Revenir a la Presence comme source de ta creation, et reecouter ton intuition comme guide. Inspire du travail de Michael Brown (The Presence Process) et de Michael Singer (The Surrender Experiment)."},

  {t:'dim', kicker:"Dimension 4", num:"04",
   h:"Les fondamentaux du business",
   body:"Clarifier ton positionnement, construire tes offres, developper ton image de marque. La strategie concrete, mais posee sur un terrain enfin stable."},

  {t:'dim', kicker:"Dimension 5", num:"05",
   h:"Le deploiement et la croissance alignee",
   body:"Visibilite, contenu, strategie de vente et economie durable. Une croissance qui se deploie sans te couper de toi ni te vider."},

  {t:'quote', kicker:"Le coeur de la demarche",
   q:"Revenir a la Presence, reecouter ton intuition, et oser entreprendre en faisant confiance a la vie plutot qu'en forcant.",
   cite:"C'est le condense de ce que j'ai appris en 7 ans a accompagner des createurs."},

  {t:'list', kicker:"Partie 3 - A quoi ca ressemble",
   h:"Un createur qui travaille depuis la Presence",
   items:[
     "Il decide plus vite, parce qu'il entend son intuition au lieu de la couvrir.",
     "Il vend sans se trahir, parce que l'offre vient de ce qui le traverse.",
     "Il garde de l'energie, parce que la croissance ne se paie plus en epuisement.",
     "Il construit un business qui lui ressemble, pas une copie de celui des autres."]},

  {t:'cards', kicker:"Ce qui soutient le chemin",
   h:"Un ecosysteme, pas une simple formation",
   cards:[
     {n:"Renaissance", l:"L'accompagnement individuel, 3 a 5 mois"},
     {n:"L'Atelier des createurs", l:"La communaute vivante d'entrepreneurs en chemin"},
     {n:"Kinesiologie", l:"Le travail sur le corps et les emotions"},
     {n:"Conference du mois", l:"Une heure de partage, chaque mois, en direct"}]},

  {t:'credibility', kicker:"Qui anime",
   h:"Ali Lahbabi",
   body:"Kinesiologue holistique et coach de Renaissance. Depuis plus de 7 ans, j'accompagne des entrepreneurs et createurs a traverser leur transformation interieure et a batir un business qui leur ressemble. Ma particularite : relier la spiritualite incarnee, le travail sur le corps et les emotions, et la strategie business concrete.",
   cards:[
     {n:"7+ ans", l:"a accompagner des createurs"},
     {n:"2 700", l:"lecteurs de la newsletter"},
     {n:"5/5", l:"note moyenne sur Trustpilot"},
     {n:"Auteur", l:"publie (Vuibert)"}]},

  {t:'quote', kicker:"Ils ont chemine",
   q:"Ce fut une veritable traversee, a la fois morale, spirituelle et finalement physique. C'est une renaissance.",
   cite:"Nour Ab - avis verifie Trustpilot"},

  {t:'quote', kicker:"Ils ont chemine",
   q:"Il m'a aide a clarifier mes valeurs, ma mission, ma vision, et a transformer quelque chose de tres flou en quelque chose de concret et fonctionnel.",
   cite:"Jalil Bouab - avis verifie Trustpilot"},

  {t:'statement', kicker:"La methode en une ligne",
   big:"Apaise le terrain interieur, puis construis la strategie dessus. Dans cet ordre, ca tient.",
   body:"C'est ce que travaille la Renaissance, dimension apres dimension."},

  {t:'cta', kicker:"La prochaine etape",
   h:"Ta Renaissance commence ici",
   body:"Si tu sens que c'est ton moment, on en parle lors d'un appel decouverte : on regarde ou tu en es, ce que tu veux creer, et si le programme Renaissance est juste pour toi.",
   btn:"Reserver mon appel decouverte",
   disc:"A visee educative uniquement. No income, role, or result is guaranteed. Results vary by person, market, and effort. Rien ici ne constitue un conseil medical, psychologique ou financier."}
];

const deck = document.getElementById('deck');
function esc(x){return (x||"")}
S.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'slide';
  let inner = '';
  if(s.kicker) inner += '<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.t==='title'){
    inner += '<h1>'+esc(s.h)+'</h1>';
    if(s.lead) inner += '<div class="lead">'+esc(s.lead)+'</div>';
  } else if(s.t==='statement'){
    inner += '<div class="statement">'+esc(s.big)+'</div>';
    if(s.body) inner += '<p class="body">'+esc(s.body)+'</p>';
  } else if(s.t==='list'){
    if(s.h) inner += '<h2>'+esc(s.h)+'</h2>';
    inner += '<ul>'+s.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';
  } else if(s.t==='dim'){
    inner += '<div class="dimnum">'+esc(s.num)+'</div>';
    inner += '<h2>'+esc(s.h)+'</h2>';
    if(s.body) inner += '<p class="body">'+esc(s.body)+'</p>';
  } else if(s.t==='quote'){
    inner += '<div class="quote">&laquo; '+esc(s.q)+' &raquo;</div>';
    if(s.cite) inner += '<div class="cite">'+esc(s.cite)+'</div>';
  } else if(s.t==='cards'){
    if(s.h) inner += '<h2>'+esc(s.h)+'</h2>';
    inner += '<div class="grid">'+s.cards.map(c=>'<div class="card"><div class="n">'+esc(c.n)+'</div><div class="l">'+esc(c.l)+'</div></div>').join('')+'</div>';
  } else if(s.t==='credibility'){
    inner += '<h2>'+esc(s.h)+'</h2>';
    if(s.body) inner += '<p class="body">'+esc(s.body)+'</p>';
    inner += '<div class="grid">'+s.cards.map(c=>'<div class="card"><div class="n">'+esc(c.n)+'</div><div class="l">'+esc(c.l)+'</div></div>').join('')+'</div>';
  } else if(s.t==='cta'){
    inner += '<h2>'+esc(s.h)+'</h2>';
    if(s.body) inner += '<p class="body">'+esc(s.body)+'</p>';
    inner += '<div class="ctabtn">'+esc(s.btn)+'</div>';
    inner += '<div class="disc">'+esc(s.disc)+'</div>';
  }
  inner += '<div class="foot">Pouvoir Interieur</div>';
  d.innerHTML = inner;
  deck.appendChild(d);
});
</script>
</body>
</html>
