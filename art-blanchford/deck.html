<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Midlife Pivot — Art Blanchford</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700;800&family=Chivo:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6ea; --panel:#ffffff; --ink:#474747; --muted:#6c6c6c;
    --accent:#fea30b; --rule:rgba(71,71,71,.14);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Chivo",system-ui,sans-serif;line-height:1.5;}
  #deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px;}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(0,0,0,.03);}
  .kicker{font-family:"Urbanist";font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px;}
  h1{font-family:"Urbanist";font-weight:800;font-size:54px;line-height:1.04;color:var(--ink);letter-spacing:-.01em;}
  h2{font-family:"Urbanist";font-weight:700;font-size:34px;line-height:1.12;color:var(--ink);margin-bottom:14px;}
  .lead{font-size:21px;color:var(--muted);margin-top:18px;max-width:42ch;}
  p.body{font-size:18px;color:var(--muted);margin-top:14px;max-width:56ch;}
  .by{margin-top:34px;font-family:"Urbanist";font-weight:600;font-size:17px;color:var(--ink);}
  .by span{color:var(--accent);}
  ul{list-style:none;margin-top:22px;}
  li{position:relative;padding-left:30px;font-size:19px;color:var(--ink);margin:13px 0;max-width:54ch;}
  li::before{content:"";position:absolute;left:0;top:9px;width:10px;height:10px;border-radius:50%;
    background:var(--accent);}
  .steps{display:grid;grid-template-columns:repeat(2,1fr);gap:14px 30px;margin-top:24px;}
  .step{display:flex;gap:14px;align-items:flex-start;}
  .num{font-family:"Urbanist";font-weight:800;font-size:19px;color:var(--panel);background:var(--accent);
    min-width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .step b{font-family:"Urbanist";font-weight:700;font-size:18px;color:var(--ink);display:block;}
  .step small{font-size:14.5px;color:var(--muted);}
  .big{font-family:"Urbanist";font-weight:800;font-size:40px;line-height:1.1;color:var(--ink);max-width:20ch;}
  .cta .lead{color:var(--ink);}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;max-width:60ch;}
  .pill{display:inline-block;font-family:"Urbanist";font-weight:700;font-size:13px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--ink);border:1px solid var(--accent);border-radius:999px;padding:7px 15px;margin-top:26px;}
  .ladder{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px;}
  .ladder span{font-family:"Urbanist";font-weight:600;font-size:15px;color:var(--muted);
    border:1px solid var(--rule);border-radius:8px;padding:9px 14px;}
  .ladder span.on{color:var(--ink);border-color:var(--accent);}
  .count{font-family:"Urbanist";font-weight:700;font-size:13px;color:var(--muted);text-align:right;margin-top:8px;}
  @media(max-width:720px){.slide{padding:34px 26px}h1{font-size:38px}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Midlife Transition Masterclass',
   h1:'The Midlife Pivot',
   lead:'How to move through any transition as an adventure, not a crisis.',
   by:'with <span>Art Blanchford</span>, Life in Transition'},

  {t:'content', kicker:'What you will walk away with',
   h2:'By the end of this hour',
   bullets:[
     'A clear way to name the transition you are actually in',
     'The one move that shrinks the fear instead of feeding it',
     'A repeatable 8 step path you can start today, not someday',
     'A way to tell a real next step apart from a reaction']},

  {t:'content', kicker:'Who this is for',
   h2:'You are standing at a threshold',
   body:'The kids have left, the role you built your identity on is changing, a marriage or a career is turning a corner. You are not broken. You are in transition, and nobody handed you a map for this part.',
   bullets:['Empty nesters asking "so what now"','People leaving a long career or role','Anyone who feels the old life ending and the new one not yet begun']},

  {t:'hook', kicker:'The trap',
   big:'We were taught to call this a crisis, so we treat it like something to survive.'},

  {t:'hook', kicker:'The reframe',
   big:'The transition is not the problem. The story that it is a crisis is the problem.'},

  {t:'content', kicker:'Part one, the core problem',
   h2:'Fear is driving, and fear cannot plan',
   body:'In every stuck transition, fear is at the wheel. Fear is loud, it is vague, and it insists the worst case is the only case. So we freeze, or we grab the first exit we see. Neither one is a decision. Both are reactions.',
   bullets:['Freezing feels safe and costs you years','Reacting feels like movement and lands you nowhere']},

  {t:'content', kicker:'Part one',
   h2:'Why "just ride it out" does not work',
   body:'Willpower and waiting both assume the transition will resolve itself. It will not. A transition is a doorway, not a weather system. You get to the other side by walking through it deliberately, one step at a time.'},

  {t:'part', kicker:'Part two, the method',
   h2:'The 8 Steps to Mastering a Midlife Transition',
   body:'This is the sequence I have used in my own transitions and with the people I coach. It takes you from fear and paralysis to deliberate, confident action.'},

  {t:'steps', kicker:'The sequence',
   h2:'From paralysis to action',
   steps:[
     ['1','Accept What Is','Stop arguing with reality. Name exactly where you are.'],
     ['2','Let Go','Release the version of life you were holding onto.'],
     ['3','Meet Fear with Data','Replace the worst case story with real facts.'],
     ['4','Be Curious','Treat the next chapter as a question, not a verdict.'],
     ['5','Seek Advice','Borrow the map from people who have crossed before.'],
     ['6','Plan','Turn the open question into a route you can follow.'],
     ['7','Focus on What You Control','Spend your energy only where it moves you.'],
     ['8','Do Something','Take the first real step. Momentum does the rest.']]},

  {t:'hook', kicker:'Step three, the hinge',
   big:'Meet fear with data, and the monster shrinks to the size of a problem.'},

  {t:'content', kicker:'Step three in practice',
   h2:'The executive move, applied to your life',
   body:'For years I ran on data at work and on fear at home. The pivot was simple. When a fear shows up, write down exactly what you are afraid of, then go gather the facts about it. Nine times out of ten the real situation is smaller, slower, and more workable than the story in your head.'},

  {t:'content', kicker:'Steps four and five',
   h2:'Open the door before you plan the trip',
   body:'Curiosity and good counsel come before the plan on purpose. You cannot plan a route you refuse to look at, and you do not have to draw the map alone. The people who have already crossed this threshold are the fastest shortcut you have.'},

  {t:'content', kicker:'Steps six and seven',
   h2:'Take the reins',
   body:'Now you plan, and you plan around what is actually yours to move. Most of the weight people carry in a transition is other people and outcomes they were never holding in the first place. Set those down. Act on your side of the line.'},

  {t:'hook', kicker:'Step eight',
   big:'You do not think your way across a threshold. You step across it.'},

  {t:'content', kicker:'Part three, the other side',
   h2:'What the far side of the threshold looks like',
   body:'People do not just "get over" the empty nest or the career exit. They come out the other side with a next chapter they chose on purpose. The fear becomes a plan, the plan becomes a first step, and the transition they dreaded becomes the most alive stretch of their life.',
   bullets:['Clarity on what the next chapter is actually for','Decisions made from facts, not fear','A life that is chosen, not defaulted into']},

  {t:'content', kicker:'Why me',
   h2:'I have walked this',
   body:'Father, executive, adventurer, and for a long stretch a committed workaholic. I moved through my own midlife transitions the hard way before I found a sequence that worked. I wrote Purposeful Living, I host the Life in Transition podcast, and I built Mid-Life Transition Mastery so nobody has to cross this threshold without a map.'},

  {t:'content', kicker:'The path',
   h2:'You do not climb a mountain alone',
   body:'This masterclass is the trailhead. From here, people go as far as they want to with support that matches the commitment.',
   ladder:['Explorer','Adventurer Circle','Pinnacle','Summit']},

  {t:'cta', kicker:'Your next step',
   h2:'Start the climb',
   lead:'Download the free 8 Steps guide and, when you are ready, come join the next conversation inside the Adventurer Circle. The map is yours.',
   pill:'Life in Transition, with Art Blanchford',
   disclaimer:'This masterclass is for education only. It is not therapy, medical, or financial advice. No particular result is guaranteed. Results vary from person to person depending on their own circumstances and the work they put in.'}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let h = '';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.lead) h += '<div class="lead">'+s.lead+'</div>';
  if(s.body) h += '<p class="body">'+s.body+'</p>';
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=>h+='<li>'+b+'</li>'); h += '</ul>'; }
  if(s.steps){ h += '<div class="steps">'; s.steps.forEach(st=>{
    h += '<div class="step"><div class="num">'+st[0]+'</div><div><b>'+st[1]+'</b><small>'+st[2]+'</small></div></div>';
  }); h += '</div>'; }
  if(s.ladder){ h += '<div class="ladder">'; s.ladder.forEach((l,i)=>h+='<span class="'+(i===0?'on':'')+'">'+l+'</span>'); h += '</div>'; }
  if(s.pill) h += '<div class="pill">'+s.pill+'</div>';
  if(s.by) h += '<div class="by">'+s.by+'</div>';
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
