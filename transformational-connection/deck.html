<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Surrendered Leadership — A Live Masterclass | Transformational Connection</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Vollkorn:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#29282d;        /* brand footer near-black (brand.json) */
    --panel:#34333a;     /* warm charcoal panel tint */
    --rule:rgba(236,240,241,0.14);
    --ink:#ecf0f1;       /* brand near-white */
    --muted:#c4c4c4;     /* brand grey */
    --accent:#ad2622;    /* brand brick-red accent (brand.json ranked_colors) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Vollkorn",Georgia,serif;
       -webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;width:100%;display:flex;flex-direction:column;justify-content:center;
         padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .eyebrow{font-family:"Poppins",sans-serif;font-weight:600;letter-spacing:.22em;
           text-transform:uppercase;font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:"Poppins",sans-serif;font-weight:700;font-size:clamp(2.1rem,6vw,4.3rem);
     line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Poppins",sans-serif;font-weight:600;font-size:clamp(1.7rem,4.2vw,3rem);
     line-height:1.1;letter-spacing:-.01em}
  h3{font-family:"Poppins",sans-serif;font-weight:600;font-size:1.15rem;color:var(--ink)}
  p{font-size:clamp(1.05rem,1.7vw,1.4rem);line-height:1.6;color:var(--muted);max-width:46ch;
    margin-top:1.3rem}
  p strong{color:var(--ink);font-weight:600}
  .lead{color:var(--ink);max-width:40ch}
  .big{font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.35;color:var(--ink);max-width:30ch;
       font-style:italic;margin-top:1.3rem}
  .num{font-family:"Poppins",sans-serif;font-weight:700;color:var(--accent);font-size:1rem;
       letter-spacing:.1em;margin-bottom:1rem}
  .ring{position:absolute;right:7vw;top:8vh;width:84px;height:84px;opacity:.5}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:2.4rem;margin-top:2rem;max-width:62ch}
  .cols h3{color:var(--accent);margin-bottom:.6rem}
  .cols p{margin-top:.3rem;font-size:1.02rem}
  .foot{position:absolute;bottom:3.4vh;left:8vw;font-family:"Poppins",sans-serif;font-size:.7rem;
        letter-spacing:.18em;text-transform:uppercase;color:var(--muted);opacity:.7}
  .count{position:absolute;bottom:3.4vh;right:8vw;font-family:"Poppins",sans-serif;font-size:.7rem;
         letter-spacing:.12em;color:var(--muted);opacity:.7}
  .cta-box{margin-top:2.2rem;display:inline-flex;align-items:center;gap:.7rem;
           font-family:"Poppins",sans-serif;font-weight:600;background:var(--accent);color:#fff;
           padding:.9rem 1.6rem;border-radius:999px;font-size:1.05rem}
  .disclaimer{margin-top:2.4rem;font-size:.82rem;color:var(--muted);max-width:52ch;opacity:.75;
              line-height:1.5;font-family:"Poppins",sans-serif}
  .rulebar{width:62px;height:3px;background:var(--accent);margin:1.6rem 0}
</style>
</head>
<body>
<div id="deck"></div>
<svg style="display:none"><symbol id="rings" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#ad2622" stroke-width="1.3"/><circle cx="50" cy="50" r="31" fill="none" stroke="#ecf0f1" stroke-width="1" opacity=".5"/><circle cx="50" cy="50" r="16" fill="none" stroke="#ad2622" stroke-width="1.3"/></symbol></svg>
<script>
const S=[
  {t:'title', ring:1, eyebrow:'A Live Masterclass', h1:'Surrendered Leadership', lead:'How to lead without performing certainty. A live 60-minute session on leading from presence, not control.', tail:'With Transformational Connection'},
  {t:'statement', eyebrow:'In the next hour', h:'You will leave with a different idea of what leadership is.', p:'Not another framework to perform. A way of being in a room that lets the room do what you have been straining to do alone. We will practice one piece of it live.'},
  {t:'statement', eyebrow:'Who this is for', h:'Anyone who carries a room.', p:'Facilitators, coaches, consultants and leaders who are good at holding things together, and tired of it. People drawn to deeper connection who want to lead from there.'},
  {t:'quote', eyebrow:'The trap', big:'"If I let go of the reins, even for a moment, it will all fall apart. So I hold tighter."', p:'It is the most reasonable belief in the room. It is also the thing keeping your leadership small and your presence absent.'},
  {t:'statement', ring:1, eyebrow:'A harder truth', h:'Control is often just fear wearing a role.', p:'What we habitually call leadership, projecting authority and directing others, can be a way of hiding our own uncertainty behind a position. Surrender is not weakness. It requires more of you than control does, because control is often a way of avoiding something.'},
  {t:'part', num:'PART ONE', h:'The problem is not that you need to lead better.', p:'It is that most of what we call leadership is performance. Projecting authority. Having the answer ready. Directing the room. It looks like strength, and it quietly costs you everything.'},
  {t:'statement', num:'THE COST', h:'The room can feel it.', p:'When a leader manages every moment, people shrink to fit the management. They wait. They defer. The collective intelligence you most need goes quiet, because there is no room for it to speak.'},
  {t:'quote', eyebrow:'The move underneath', big:'Underneath the need to control is almost always something we do not want to feel.', p:'Name that, and the grip loosens on its own. That is where this work begins.'},
  {t:'part', num:'PART TWO', h:'A different paradigm: Surrendered Leadership.', p:'Leadership built not on control, but on surrender. On trusting what emerges when a group of sovereign people meet each other honestly. It asks more of you than control ever did.'},
  {t:'statement', num:'SURRENDER 01', h:'Surrender to yourself.', p:'Stop managing your inner experience and fully allow what is actually here in you: the fear, the uncertainty, the aliveness. You cannot lead a room into presence from a place you are hiding from in yourself.'},
  {t:'statement', num:'SURRENDER 02', h:'Surrender to others.', p:'Trust that the people in the room have their own intelligence, their own capacity, their own sovereign process. Your job is not to interfere with that, but to meet it.'},
  {t:'statement', num:'SURRENDER 03', h:'Surrender to something greater.', p:'Release the grip of individual will toward life itself, toward what is emerging and larger than your plan. Every deep tradition points here. It is the ground the other two stand on.'},
  {t:'statement', eyebrow:'What becomes possible', h:'A group that organises itself.', p:'When the leader meets the room instead of overriding it, solutions emerge that no one person held. Health in a group, like health in a body, is many parts doing their own work well, together.'},
  {t:'twocol', eyebrow:'Holding the tension', h:'Lead from the middle of the polarities.', cols:[['Structure','Enough form to feel safe.'],['Chaos','Enough openness to let something new arrive.'],['Autonomy','Each person fully themselves.'],['Communion','And still, deeply together.']]},
  {t:'part', num:'PART THREE', h:'In a real room, something moves that no one scripted.', p:'The leader stops managing the outcome. The group feels trusted, and starts bringing its own intelligence. Something moves that no one scripted. In the words we return to often: when it works, the people say they did it themselves.'},
  {t:'twocol', eyebrow:'The shift', h:'', cols:[['From','Holding it all together. Performing certainty. A quiet room that waits for you.'],['To','Trusting the field. Leading from presence. A room that brings its own aliveness.']]},
  {t:'statement', ring:1, eyebrow:'Why learn this with us', h:'We have practised this for over a decade.', p:'Transformational Connection, founded in 2012 as Circling Europe, is where Surrendered Leadership was created and refined with thousands of people across Europe and online. This is not borrowed theory. It is the body of work itself.'},
  {t:'cta', eyebrow:'Continue the practice', h:'Go deeper in the SAS Facilitator Training.', p:'If today moved something in you, the six-month SAS Facilitator Training is where you learn to lead this way in your own rooms. It begins with a simple intake call so we can meet you.', cta:'Book your intake call', disclaimer:'This masterclass is for educational purposes only. Transformational Connection teaches a relational and leadership practice; it is not therapy or a substitute for professional care. No income, outcome, or result is guaranteed, and results vary from person to person.'}
];
const ICON='<svg class="ring"><use href="#rings"/></svg>';
function foot(i){return '<div class="foot">Surrendered Leadership</div><div class="count">'+(i+1)+' / '+S.length+'</div>';}
function render(s,i){
  const ring = s.ring ? ICON : '';
  const eb = s.eyebrow ? '<div class="eyebrow">'+s.eyebrow+'</div>' : '';
  const nm = s.num ? '<div class="num">'+s.num+'</div>' : '';
  let body='';
  if(s.t==='title'){ body = '<h1>'+s.h1+'</h1><p class="lead">'+s.lead+'</p><div class="rulebar"></div><p>'+s.tail+'</p>'; }
  else if(s.t==='quote'){ body = '<p class="big">'+s.big+'</p><p>'+s.p+'</p>'; }
  else if(s.t==='twocol'){ body = (s.h?'<h2>'+s.h+'</h2>':'') + '<div class="cols">'+s.cols.map(c=>'<div><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>').join('')+'</div>'; }
  else if(s.t==='cta'){ body = '<h2>'+s.h+'</h2><p>'+s.p+'</p><div class="cta-box">'+s.cta+' &rarr;</div><div class="disclaimer">'+s.disclaimer+'</div>'; }
  else { body = '<h2>'+s.h+'</h2>' + (s.p?'<p>'+s.p+'</p>':''); }
  return ring + nm + eb + body + foot(i);
}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  el.innerHTML = render(s,i);
  deck.appendChild(el);
});
</script>
</body>
</html>
