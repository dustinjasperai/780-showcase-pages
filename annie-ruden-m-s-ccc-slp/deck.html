<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hidden Rules of American English — Pronunciation Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7f9;      /* light ground, from brand light blue-grey body bg */
    --panel:#ffffff;
    --rule:#d4dee5;    /* light slate, from #4d6c7e family */
    --ink:#032f40;     /* brand dominant navy (30 uses) */
    --body:#3f4a50;
    --accent:#dd6d2e;  /* brand orange link/accent (10 uses) */
    --slate:#4d6c7e;   /* brand slate */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:"Open Sans",system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:48px 44px;margin:0 0 22px;box-shadow:0 1px 2px rgba(3,47,64,.04)}
  .slide.dark{background:var(--ink);border-color:var(--ink)}
  .slide.dark *{color:#eef3f6}
  .slide.dark .ey{color:var(--accent)}
  .slide.dark .rulebar{background:var(--accent)}
  h1,h2,h3{font-family:"Roboto Slab",Georgia,serif;color:var(--ink);line-height:1.15}
  h1{font-size:38px;font-weight:700;letter-spacing:-.4px}
  h2{font-size:28px;font-weight:600;margin-bottom:14px}
  h3{font-size:20px;font-weight:600}
  .ey{font-family:"Open Sans";font-weight:600;font-size:12px;letter-spacing:2.4px;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  .rulebar{width:52px;height:4px;background:var(--accent);border-radius:3px;margin:18px 0 22px}
  p.lead{font-size:19px;color:var(--ink);margin-top:12px}
  p{font-size:16px;margin-top:12px}
  ul{margin:16px 0 0 2px;list-style:none}
  li{position:relative;padding:8px 0 8px 30px;font-size:16px;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:16px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillar{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
  .pillar:last-child{border-bottom:0}
  .pnum{font-family:"Roboto Slab",serif;font-size:26px;font-weight:700;color:var(--accent);min-width:42px}
  .step{font-family:"Roboto Slab",serif;color:var(--slate);font-size:15px;font-weight:600;letter-spacing:1px;text-transform:uppercase}
  .cta-line{font-size:20px;color:var(--ink);font-weight:600;margin-top:10px}
  .btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-family:"Open Sans";font-weight:600;font-size:16px;padding:14px 30px;border-radius:9px;text-decoration:none}
  .disclaimer{margin-top:26px;font-size:12px;color:var(--slate);line-height:1.5}
  .kicker{font-size:15px;color:var(--slate);margin-top:8px}
  .present{margin-top:30px;font-size:15px;color:var(--slate)}
  .present strong{color:var(--ink);font-family:"Roboto Slab",serif}
  @media(max-width:640px){.slide{padding:32px 24px}h1{font-size:30px}h2{font-size:23px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass',h1:'The Hidden Rules of American English',
  lead:'Be understood the first time, and feel confident every time you speak.',
  present:'Annie Ruden, M.S., CCC-SLP &middot; Founder, Pronunciation Pro'},

 {t:'who',eyebrow:'Who this is for',h2:'You speak English every day. You still get asked to repeat yourself.',
  body:'You are a professional. Your vocabulary is strong, your grammar is solid, and you still feel the pause in a meeting when someone says "sorry, can you say that again?" This hour is for you.'},

 {t:'trap',eyebrow:'The trap',h2:'You studied the words for years. No one taught you the sounds.',
  body:'Classes drill grammar and vocabulary. Almost none of them teach how American English actually sounds: the rhythm, the stress, the specific sounds that decide whether a native understands you the first time.'},

 {t:'reframe',dark:true,eyebrow:'The reframe',h2:'Your accent is not the problem. The missing rules are.',
  body:'There is nothing wrong with how you speak. You were simply never shown the rules that native speakers use without thinking. Rules can be learned.'},

 {t:'part',eyebrow:'Part one',h2:'Why natives mishear you'},

 {t:'content',h3:'Your ear hears what it was trained to hear',
  body:'You cannot produce a sound your ear does not yet notice. The first move is not your mouth, it is your ear. We train perception first, so you can finally hear the difference that natives hear.'},

 {t:'content',h3:'It is rules, not talent',
  body:'American English follows patterns: which syllable gets the stress, how words link together, which sounds carry meaning. These patterns are consistent and teachable. You do not need a "gift" for languages. You need the rules.'},

 {t:'content',h3:'This is speech science',
  body:'Diagnosing exactly which sounds break your clarity is what a licensed Speech-Language Pathologist is trained to do. That is the difference between guessing and knowing what to fix.'},

 {t:'part',eyebrow:'Part two',h2:'The hidden rules: the Pronunciation Pro method'},

 {t:'method',eyebrow:'The method',h2:'Ear. Mouth. Mind.',
  body:'Every lasting change moves through three stages. We train your ear to hear new sounds, your mouth to move in a new way, and your mind to think more confidently.'},

 {t:'pillar',step:'Stage one, the ear',n:'1',h3:'Hear it first',
  body:'Learn to distinguish the sounds you currently miss. Once you can hear it, you can fix it.'},

 {t:'pillar',step:'Stage two, the mouth',n:'2',h3:'The sound and rhythm rules',
  body:'The hidden rules of American English: the handful of sounds, the word stress, and the rhythm that make you understood the first time. This is the core of the twelve module Pronunciation Pro Course.'},

 {t:'pillar',step:'Stage three, the mind',n:'3',h3:'Build habits that last',
  body:'New speech becomes permanent through practice, repetition, and feedback from certified trainers. A few focused minutes a day beats hours of unfocused effort.'},

 {t:'content',dark:true,h3:'The part most programs skip: confidence',
  body:'Fear of making a mistake keeps the old habit locked in. The Confident ProMindset work runs alongside the sounds so you stop worrying about other people’s opinions and actually use your new voice.'},

 {t:'part',eyebrow:'Part three',h2:'When the rules finally click'},

 {t:'list',h2:'When the rules click',
  items:['You are understood the first time, without repeating yourself',
         'You speak up in meetings instead of staying quiet',
         'You present and network without the fear',
         'You sound like the professional you already are']},

 {t:'list',h2:'The path forward',
  items:['The Pronunciation Pro Course: the twelve module foundation',
         'The Confident ProMindset Course: the confidence to use it',
         'The Advanced Alumni Course: presentations, leadership, and public speaking']},

 {t:'why',eyebrow:'Why learn this with us',h2:'Taught by certified speech pathologists',
  body:'Annie Ruden has taught English pronunciation and the American accent since 2008. Every Pronunciation Pro trainer is a licensed, ASHA certified Speech-Language Pathologist, with live weekly feedback, an accent assessment, and a community of professionals learning right alongside you.'},

 {t:'cta',eyebrow:'Your next step',h2:'Start speaking clearly and confidently',
  ctaLine:'Begin with a 7 day trial of the Pronunciation Pro membership.',
  body:'Join the course, meet your certified trainers, and take your first lesson this week.',
  btn:'Start your 7 day trial',
  disclaimer:'Educational information only. No specific career, income, employment, or speaking result is guaranteed. Results vary with each student’s effort, practice, and consistency.'}
];

const deck=document.getElementById('deck');
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
S.forEach(s=>{
  const d=el('div','slide'+(s.dark?' dark':''));
  if(s.eyebrow)d.appendChild(el('div','ey',s.eyebrow));
  if(s.h1){d.appendChild(el('h1',null,s.h1));}
  if(s.h2){d.appendChild(el('h2',null,s.h2));}
  if(s.h3){d.appendChild(el('h3',null,s.h3));}
  if(s.t==='title'||s.t==='part'||s.t==='method')d.appendChild(el('div','rulebar'));
  if(s.lead)d.appendChild(el('p','lead',s.lead));
  if(s.body)d.appendChild(el('p',null,s.body));
  if(s.t==='pillar'){
     const row=el('div','pillar');
     row.appendChild(el('div','pnum',s.n));
     const col=el('div');
     col.appendChild(el('div','step',s.step));
     col.appendChild(el('h3',null,s.h3));
     col.appendChild(el('p',null,s.body));
     d.innerHTML='';if(s.eyebrow)d.appendChild(el('div','ey',s.eyebrow));
     d.appendChild(row);
  }
  if(s.items){const ul=el('ul');s.items.forEach(i=>ul.appendChild(el('li',null,i)));d.appendChild(ul);}
  if(s.ctaLine)d.appendChild(el('div','cta-line',s.ctaLine));
  if(s.btn)d.appendChild(el('a','btn',s.btn));
  if(s.present)d.appendChild(el('div','present',s.present));
  if(s.disclaimer)d.appendChild(el('div','disclaimer',s.disclaimer));
  deck.appendChild(d);
});
</script>
</body>
</html>
