<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Growth Factor for Dermatology · Addo Aesthetics</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0F1817; --panel:#162321; --rule:#20302C;
    --teal:#4FA893; --sage:#8FB3AA; --chalk:#F1EFE6; --grey:#C8D2CE; --dim:#7A9089;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Instrument Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--teal);margin-bottom:2.4vh}
  h1{font-family:'Spectral',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.5vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.46vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Instrument Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sage);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.5vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--teal),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1B2D28 0%,#08100E 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:86%;font-style:italic;color:#EDF2EE}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1B2D28 0%,#08100E 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--teal);color:#C9E6DC;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .conv-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-conv{right:6.5%;bottom:9%;width:23vw}
  .corner-conv{right:6%;bottom:7.5%;width:10.5vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--teal);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--teal);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 22</div>
<div class="brand-foot">Addo Aesthetics</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- convergence motif: two paths (clinical + aesthetics) merging into one forward path -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="conv" viewBox="0 0 260 150">
  <g fill="none" stroke-linecap="round">
    <path d="M18,32 L150,72" stroke="#8FB3AA" stroke-width="2.5" opacity="0.7"/>
    <path d="M18,118 L150,72" stroke="#4FA893" stroke-width="2.5" opacity="0.85"/>
    <path d="M150,72 L242,72" stroke="#4FA893" stroke-width="3"/>
  </g>
  <circle cx="18" cy="32" r="7" fill="none" stroke="#8FB3AA" stroke-width="2.5"/>
  <circle cx="18" cy="118" r="7" fill="none" stroke="#4FA893" stroke-width="2.5"/>
  <circle cx="150" cy="72" r="8" fill="#4FA893"/>
  <circle cx="242" cy="72" r="6" fill="#4FA893"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Growth Factor&reg; for Dermatology',sub:'How a dermatology practice adds a profitable medical aesthetics service line, without losing what already works, in one hour.',brand:true,climb:'title'},
 {t:'normal',k:'Who this is for',title:'You run an excellent dermatology practice. Aesthetics feels like a different business.',body:'You see the opportunity. Patients ask about injectables and skin treatments already. The catch is that adding aesthetics means new patients, new financial questions, and a new team, layered onto a clinical practice that already runs well.'},
 {t:'normal',k:'The trap',title:'Bolting on aesthetics without a plan puts the whole practice at risk.',body:'Buy the device, hire an injector, hope it works: that is how an aesthetics line quietly loses money, confuses the clinical brand, and burns staff time that the dermatology side needed. A plan changes the outcome.'},
 {t:'dark',title:'You do not have a demand problem. You have a second business starting inside your first one, with no plan for it.'},

 {t:'section',idx:'Part One',title:'The Practice Adding Aesthetics With No Plan'},
 {t:'normal',k:'The real cost',title:'An aesthetics line without financial separation is a guess, not a business.',body:'When aesthetics revenue and clinical revenue blur together, you cannot tell if the new line is actually profitable, or which treatments are worth keeping. The numbers have to be split out from day one.'},
 {t:'normal',k:'The shift',title:'Stop treating aesthetics as a side project. Build it as its own line.',body:'The dermatologists who make this work do not add aesthetics as an afterthought squeezed into the clinical schedule. They plan the patient acquisition, the team, and the treatment lineup as a real second line, on purpose.'},
 {t:'dark',title:'Adding aesthetics is not a marketing decision. It is six decisions, made in order.'},

 {t:'section',idx:'Part Two',title:'Growth Factor&reg; for Dermatology'},
 {t:'normal',k:'Area one',title:'Patient attraction and retention.',body:'Bringing in and keeping aesthetics patients alongside your existing dermatology patient base, without cannibalizing the clinical schedule.'},
 {t:'normal',k:'Area two',title:'Financial metrics navigation.',body:'Understanding the revenue mix and unit economics of the aesthetics line separately from the clinical dermatology business, so you know what is actually working.'},
 {t:'normal',k:'Area three',title:'Hiring and talent retention.',body:'Building the aesthetics-side team, injectors, estheticians, coordinators, a clinical dermatology practice does not already have on staff.'},
 {t:'normal',k:'Area four',title:'Operational efficiency.',body:'Running aesthetics treatment rooms and scheduling alongside a clinical dermatology schedule, without either side slowing the other down.'},
 {t:'normal',k:'Area five',title:'Reputation management and social media.',body:'Building an aesthetics-specific reputation and social presence, distinct from the clinical dermatology brand patients already know you for.'},
 {t:'normal',k:'Area six',title:'Treatment and product lineup optimization.',body:'Choosing which aesthetic treatments, devices, and product lines to add, and in what order, instead of adding everything at once.'},
 {t:'dark',title:'Six areas, worked in order, are what let aesthetics become a real second line instead of an expensive experiment.'},

 {t:'section',idx:'Part Three',title:'What This Looks Like'},
 {t:'normal',k:'The result',title:'The same dermatology practice you built, plus a second line that pays for itself.',body:'Your clinical reputation and standards stay exactly as they are. What is new is a planned, profitable aesthetics line running alongside it, with its own patients, its own numbers, and its own team.'},
 {t:'normal',k:'Why me',title:'Nearly 20 years building an aesthetics business from the ground up.',body:'I am Daniela Woerner, founder of Addo Aesthetics and creator of the Growth Factor&reg; Framework. I started as a solo aesthetician in 2006 and have since helped 600+ spa and practice owners work through this same framework.'},

 {t:'section',idx:'Your next step',title:'A Clarity Call'},
 {t:'normal',k:'How we begin',title:'A conversation about where your aesthetics expansion actually stands.',body:'We look at which of the six areas your practice needs first, whether that is financial separation, the first hire, or choosing your opening treatment lineup, and map the plan from there.'},
 {t:'cta',title:'Book a Clarity Call.',chips:['Book a Clarity Call','Explore Addo Aesthetics'],disc:'Educational content for dermatology practice owners only. No income, revenue, or business result is guaranteed. Results vary by owner, practice, and market.'},
];

const deck=document.getElementById('deck');
function conv(kind){return `<svg class="conv-motif ${kind==='title'?'title-conv':'corner-conv'}"><use href="#conv"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Addo Aesthetics &middot; <b>Daniela Woerner</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.climb) h+=conv(s.climb);
  else if(s.t==='title') h+=conv('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
