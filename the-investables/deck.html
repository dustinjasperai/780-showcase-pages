<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Investable Proposition — A Masterclass by The Investables</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1940;        /* deepened form of brand navy #253478 (dominant, site_scheme dark) */
    --panel:#182a63;     /* lighter navy from the same #253478 family */
    --rule:rgba(136,255,239,.20); /* low-opacity tint of brand teal accent */
    --accent:#88ffef;    /* exact brand teal from ranked_colors */
    --ink:#ffffff;
    --body:#c7d2f0;
    --muted:#8ea0cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--body);
    font-family:'Open Sans',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:1120px;margin:0 auto;padding:0 28px}
  .slide{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:88px 0;border-bottom:1px solid var(--rule);position:relative;
  }
  .kicker{
    font-family:'Rubik',sans-serif;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px;
  }
  h1{font-family:'Rubik',sans-serif;font-weight:700;color:var(--ink);
    font-size:clamp(34px,6vw,68px);line-height:1.04;letter-spacing:-.01em;}
  h2{font-family:'Rubik',sans-serif;font-weight:600;color:var(--ink);
    font-size:clamp(27px,4.4vw,46px);line-height:1.1;letter-spacing:-.01em;}
  .lede{font-size:clamp(18px,2.2vw,24px);line-height:1.5;color:var(--body);
    max-width:46ch;margin-top:26px;}
  .sub{font-size:clamp(16px,1.8vw,19px);line-height:1.6;color:var(--muted);
    max-width:52ch;margin-top:18px;}
  .big-num{font-family:'Rubik',sans-serif;font-weight:700;color:var(--accent);
    font-size:clamp(46px,8vw,96px);line-height:1;opacity:.9}
  ul.points{list-style:none;margin-top:30px;max-width:60ch}
  ul.points li{position:relative;padding:16px 0 16px 40px;font-size:clamp(16px,1.9vw,20px);
    line-height:1.5;border-top:1px solid var(--rule);color:var(--body)}
  ul.points li:first-child{border-top:none}
  ul.points li::before{content:"";position:absolute;left:0;top:24px;width:14px;height:14px;
    border-radius:50%;border:2px solid var(--accent)}
  .stagegrid{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:38px}
  .stage{background:var(--panel);border-radius:14px;padding:24px;border:1px solid var(--rule)}
  .stage .n{font-family:'Rubik',sans-serif;font-weight:700;color:var(--accent);font-size:20px}
  .stage h3{font-family:'Rubik',sans-serif;font-weight:600;color:var(--ink);
    font-size:19px;margin:10px 0 8px}
  .stage p{font-size:15px;line-height:1.5;color:var(--muted)}
  .ladder{display:flex;flex-direction:column;gap:14px;margin-top:34px;max-width:60ch}
  .rung{display:flex;align-items:center;gap:20px;background:var(--panel);
    border:1px solid var(--rule);border-radius:12px;padding:18px 22px}
  .rung .step{font-family:'Rubik',sans-serif;font-weight:700;color:var(--accent);
    font-size:26px;min-width:52px}
  .rung .txt strong{color:var(--ink);font-family:'Rubik',sans-serif;font-weight:600;
    display:block;font-size:19px;margin-bottom:3px}
  .rung .txt span{color:var(--muted);font-size:15px;line-height:1.45}
  .who{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:36px}
  .who .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px}
  .who .card h3{font-family:'Rubik',sans-serif;color:var(--ink);font-size:22px;margin-bottom:10px}
  .who .card p{color:var(--muted);font-size:16px;line-height:1.55}
  .cta-box{margin-top:34px;background:var(--panel);border:1px solid var(--accent);
    border-radius:16px;padding:32px}
  .cta-box .go{font-family:'Rubik',sans-serif;font-weight:700;color:var(--accent);font-size:20px}
  .disclaimer{margin-top:30px;font-size:13px;line-height:1.6;color:var(--muted);max-width:70ch}
  .count{position:fixed;right:18px;bottom:16px;font-size:12px;color:var(--muted);
    font-family:'Rubik',sans-serif;letter-spacing:.08em;background:rgba(15,25,64,.7);
    padding:6px 12px;border-radius:20px;border:1px solid var(--rule)}
  .brandline{position:absolute;top:34px;left:0;font-family:'Rubik',sans-serif;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  @media(max-width:720px){.stagegrid{grid-template-columns:1fr}.who{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="count" id="count"></div>
<script>
const S = [
  {t:'title',
   brand:'The Investables',
   kicker:'A Live Masterclass',
   h1:'The Investable Proposition',
   lede:'How UK property investors and developers raise their next 6-figure investor, compliantly, without spammy or salesy tactics.',
   sub:'With Caryn Yuen and Antoine Dufresne'},

  {t:'audience',
   kicker:'Who this is for',
   h2:'You have found the deal. The numbers work. The money is the missing piece.',
   sub:'For property investors and developers who are ready to fund the next project with private investor finance, not another maxed-out mortgage or a favour called in.'},

  {t:'trap',
   kicker:'The trap',
   h2:'The usual advice is to pitch louder.',
   lede:'Post the deal everywhere. Chase anyone with money. Lean on no-money-down tactics and hope one lands.',
   sub:'It feels active, and it quietly puts your reputation, and sometimes your compliance, at risk. It also treats every raise as a one-off scramble that starts again from zero.'},

  {t:'reframe',
   kicker:'The reframe',
   h2:'People with money are not short of places to put it. They are short of people they trust.',
   sub:'The issue is rarely that you cannot find investors. It is that you are not yet, on paper and in the conversation, an investable proposition.'},

  {t:'part',
   num:'Part One',
   h2:'Raising finance is a relationship, not a pitch.',
   sub:'A stranger does not wire six figures because a deal looks good. They commit because trust was built, stage by stage, and the ask arrived as the natural next step.'},

  {t:'points',
   kicker:'What that means',
   h2:'Three things an investor decides before the deal',
   points:[
     'Are you someone I trust with my money, not just this project.',
     'Have you shown me, clearly, what I am putting money into and what I get back.',
     'Do I feel moved along at my pace, or pushed for a yes I am not ready to give.'
   ]},

  {t:'points',
   kicker:'The cost of getting it wrong',
   h2:'What the scramble actually costs you',
   points:[
     'Every raise starts again from zero, because no relationship was kept warm.',
     'Good investors walk when the ask comes too hard and too soon.',
     'A careless promotion can create compliance risk that outlives the deal.'
   ]},

  {t:'part',
   num:'Part Two',
   h2:'The Fundraising Roadmap',
   sub:'The full journey, from no investors and no track record to a base of investors who fund project after project. Six stages, in order.'},

  {t:'stages',
   kicker:'The six stages',
   h2:'Getting Ready to Retaining',
   stages:[
     {n:'01',h:'Getting Ready',p:'Become an investable proposition before you pitch: your Investor Pack and the positioning an investor needs to see.'},
     {n:'02',h:'Finding Investors',p:'Where 6-figure investors actually are, and the compliant way to open the conversation.'},
     {n:'03',h:'Onboarding Investors',p:'Turning early interest into a first commitment, cleanly and on the right footing.'},
     {n:'04',h:'Nurturing Investors',p:'Keeping investors warm between deals so the next raise is a conversation, not a cold start.'},
     {n:'05',h:'Convincing Investors',p:'Presenting the deal so the yes is the obvious next step, never a hard push.'},
     {n:'06',h:'Retaining Investors',p:'The repeat: investors who fund you again, and introduce you to the next one.'}
   ]},

  {t:'reframe',
   kicker:'Stage 01, in practice',
   h2:'Before you ask for a penny, you become worth backing.',
   lede:'Getting Ready is the stage most people skip straight past.',
   sub:'It is also the one that decides whether Finding Investors is a warm conversation or a cold chase. Skip it and every later stage gets harder.'},

  {t:'part',
   num:'The core skill',
   h2:'Moving one investor from curious to committed',
   sub:'Inside the Roadmap sits a four-part relationship framework. It is how a single conversation travels, in order, from a first flicker of interest to a wire transfer.'},

  {t:'ladder',
   kicker:'The 4-part relationship framework',
   h2:'Curious to ready to invest',
   rungs:[
     {s:'1',t:'Curious',d:'They know who you are and that you raise for property. Attention earned, not chased.'},
     {s:'2',t:'Interested',d:'They understand what you do and see themselves in it. The Investor Pack does the heavy lifting here.'},
     {s:'3',t:'Confident',d:'Their questions are answered before they ask. Trust, track record, and terms are clear.'},
     {s:'4',t:'Ready to invest',d:'The ask lands as the obvious next step, at their pace, so the yes feels like their idea.'}
   ]},

  {t:'reframe',
   kicker:'The Investor Pack',
   h2:'The one document that does the convincing when you are not in the room.',
   sub:'Not a brochure and not a pitch deck of promises. The pack an investor needs to feel confident: who you are, what the opportunity is, the numbers, and how their money is protected.'},

  {t:'edge',
   kicker:'The difference',
   h2:'Raise it right.',
   lede:'Most property education teaches you to raise money faster. Almost none teaches you to raise it in a way that keeps you on the right side of the line.',
   sub:'Promoting an investment is regulated. Done carelessly it creates real risk for you and your investors. The whole method here is built to be relationship-led and compliant, so the money you raise never becomes the problem you inherit.'},

  {t:'points',
   kicker:'Test before you send',
   h2:'How good is your Investor Pack, really?',
   points:[
     'Does it answer the questions an investor asks before they ask them.',
     'Are the opportunity and the downside both stated plainly.',
     'Would someone who has never met you understand exactly what they are backing.'
   ]},

  {t:'part',
   num:'Part Three',
   h2:'A base of investors who fund the next project, and the one after.',
   sub:'Not one heroic raise and then silence. Investors who know you, trust you, and come back because the last project was handled the right way.'},

  {t:'who',
   kicker:'Why learn this from us',
   h2:'We teach from the investor side of the table.',
   cards:[
     {h:'Caryn Yuen',p:'Former barrister and solicitor with 11+ years in FCA compliance, in property since 2014. The reason this method is built to be done the right way.'},
     {h:'Antoine Dufresne',p:'11+ years in investment banking across Paris, New York and London before moving into property full time in 2019. Sees a raise the way a funder sees it.'}
  ]},

  {t:'cta',
   kicker:'Your next step',
   h2:'Work the full Roadmap with us.',
   sub:'This masterclass covers the front of the journey. Inside The Investables membership you work all six stages with the community, the templates, and direct feedback on your own Investor Pack.',
   go:'Join The Investables membership community. Get on the waitlist at theinvestables.com.',
   disclaimer:'Educational content only. Nothing here is financial, investment, or legal advice, and no specific result, return, or amount raised is promised or guaranteed. Raising investment is regulated; take your own professional and compliance advice before acting. Individual outcomes vary and depend on your own circumstances, market conditions, and effort.'}
];

const deck=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide';
  let inner='';
  if(s.brand){inner+=`<div class="brandline">${s.brand}</div>`;}
  if(s.kicker){inner+=`<div class="kicker">${s.kicker}</div>`;}
  if(s.num){inner+=`<div class="kicker">${s.num}</div>`;}
  if(s.h1){inner+=`<h1>${s.h1}</h1>`;}
  if(s.h2){inner+=`<h2>${s.h2}</h2>`;}
  if(s.lede){inner+=`<p class="lede">${s.lede}</p>`;}
  if(s.sub){inner+=`<p class="sub">${s.sub}</p>`;}
  if(s.points){inner+='<ul class="points">'+s.points.map(p=>`<li>${p}</li>`).join('')+'</ul>';}
  if(s.stages){inner+='<div class="stagegrid">'+s.stages.map(x=>`<div class="stage"><div class="n">${x.n}</div><h3>${x.h}</h3><p>${x.p}</p></div>`).join('')+'</div>';}
  if(s.rungs){inner+='<div class="ladder">'+s.rungs.map(x=>`<div class="rung"><div class="step">${x.s}</div><div class="txt"><strong>${x.t}</strong><span>${x.d}</span></div></div>`).join('')+'</div>';}
  if(s.cards){inner+='<div class="who">'+s.cards.map(x=>`<div class="card"><h3>${x.h}</h3><p>${x.p}</p></div>`).join('')+'</div>';}
  if(s.go){inner+=`<div class="cta-box"><div class="go">${s.go}</div></div>`;}
  if(s.disclaimer){inner+=`<p class="disclaimer">${s.disclaimer}</p>`;}
  el.innerHTML=inner;
  deck.appendChild(el);
});

const count=document.getElementById('count');
const total=S.length;
function upd(){
  const idx=Math.round(window.scrollY/window.innerHeight)+1;
  count.textContent=Math.min(idx,total)+' / '+total;
}
window.addEventListener('scroll',upd);window.addEventListener('resize',upd);upd();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='ArrowRight'||e.key===' '){e.preventDefault();window.scrollBy({top:window.innerHeight,behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){e.preventDefault();window.scrollBy({top:-window.innerHeight,behavior:'smooth'});}
});
</script>
</body>
</html>
