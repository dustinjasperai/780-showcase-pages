<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sponsorship Wheel - Creator Wizard Masterclass</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&display=swap" rel="stylesheet">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf8;        /* light editorial ground (brand site_scheme: light) */
    --ink:#231f1f;       /* brand near-black heading/body ink (brand.json, 28 uses) */
    --muted:#6b6560;
    --rule:#e7e3dd;      /* warm hairline */
    --panel:#f3efe9;
    --accent:#e51717;    /* magnet-red brand accent (brand.json, 7 uses) */
    --sans:"Satoshi","Helvetica Neue",Arial,sans-serif;
    --hand:"Kalam","Segoe Print",cursive;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:#fff;border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .kicker{font-family:var(--hand);color:var(--accent);font-size:22px;margin-bottom:14px}
  .num{position:absolute;top:22px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em}
  h1{font-size:52px;line-height:1.04;font-weight:900;letter-spacing:-.02em;max-width:18ch}
  h2{font-size:38px;line-height:1.08;font-weight:800;letter-spacing:-.015em;max-width:20ch}
  .lede{font-size:22px;line-height:1.45;color:var(--muted);margin-top:18px;max-width:46ch}
  .big{font-size:30px;line-height:1.3;font-weight:500;max-width:30ch}
  .underline{box-shadow:inset 0 -14px 0 rgba(229,23,23,.16)}
  ul{list-style:none;margin-top:26px;display:grid;gap:16px}
  li{font-size:21px;line-height:1.4;padding-left:30px;position:relative;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:3px}
  .letter{font-family:var(--sans);font-weight:900;color:var(--accent)}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:26px}
  .cardbox{background:var(--panel);border-radius:10px;padding:22px}
  .cardbox h3{font-size:19px;font-weight:800;margin-bottom:8px}
  .cardbox p{font-size:15px;color:var(--muted);line-height:1.4}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:60ch}
  .eye{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px}
  .wheel{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:24px}
  .wheel div{background:var(--panel);border-radius:8px;padding:14px 12px;font-size:14px;font-weight:700;text-align:center}
  .brandline{font-family:var(--hand);font-size:20px;color:var(--accent);margin-top:28px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:auto}h1{font-size:34px}h2{font-size:26px}.grid3,.wheel{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'Creator Wizard Masterclass',h:'The Sponsorship Wheel',lede:'How creators land paid brand deals on purpose, not by luck.'},
  {t:'who',eye:'Who this is for',h:'Creators with 10,000 to 150,000 followers',lede:'Big enough that brands want you. Small enough that no agency is pitching deals for you yet. So the money is sitting right there, and most of it slips past.'},
  {t:'trap',eye:'The trap',h:'The inbox full of "free product"',items:['A brand offers to "gift" you product in exchange for a post, and you say yes because it feels like progress.','You guess at a rate, quote low, and hope they do not ghost you.','You wait to get noticed instead of pitching, so the good budgets go to creators who asked first.']},
  {t:'hook',big:'Brands are not ignoring you. Your pitch is giving them nothing to say yes to.',brandline:'Let us fix the pitch.'},
  {t:'trap',eye:'The cost',h:'What guessing your rate really costs',lede:'Quote low once and you anchor every future deal to that number. The creator beside you with the same audience is charging three times as much, not because they are bigger, but because they know how to scope and ask.'},
  {t:'part',eye:'Part one',h:'Sponsorship is a system, not a lucky email',lede:'Every paid deal runs the same loop. Once you can see the loop, you can run it on purpose and repeat it with every brand.'},
  {t:'frame',eye:'Framework 1',h:'A.R.C.: read what the brand is actually buying',items:['<span class="letter">A</span>wareness: a launch or a new market, where reach is the goal.','<span class="letter">R</span>epurposing: your content becomes their ad, used across their own channels.','<span class="letter">C</span>onversion: clicks, installs, sales. The number they report to their boss.'],lede:'Match your pitch to the one they want, and you stop sounding like every other creator.'},
  {t:'frame',eye:'Framework 2',h:'R.O.P.E.: the pitch that gets a yes',big:'Relevant first.',lede:'Anchor the pitch to a campaign the brand is running right now or ran last quarter. It reads as tailored, not spray and pray, and that is the whole difference between a reply and silence.'},
  {t:'frame',eye:'Pitch example',h:'What "Relevant" sounds like',big:'"I saw your spring campaign leaned on short-form demos. Here is how I would make that land with my audience."',lede:'Thirty seconds of real research beats a template every time. The brand feels seen, and your name moves to the top of the pile.'},
  {t:'frame',eye:'Framework 3',h:'D.U.E.: scope the deal so you stop underpricing',grid:[['Deliverables','Exactly what you will make, and how many.'],['Usage rights','Where they can run it, and for how long. This is where the real money is.'],['Exclusivity','What you agree not to do, and what that is worth.']]},
  {t:'frame',eye:'The money hides here',h:'Usage rights are the line creators give away for free',lede:'Brands will quietly ask to run your content as paid ads, on their channels, forever. That is a separate line item worth real money. Name a term and a price for it, and one deal can double without making a single extra video.'},
  {t:'frame',eye:'The move',h:'Gifted to paid',big:'A free-product offer is not a dead end. It is a warm lead.',lede:'There is a specific reply that turns "we will send you product" into a scoped, paid partnership. Most creators never learn it, so they post for free.'},
  {t:'frame',eye:'Framework 4',h:'P.I.N.O.T.: follow up without being annoying',lede:'Most deals do not die because the brand said no. They die because the first pitch went unanswered and the creator never followed up. A structured sequence keeps the deal alive without you feeling like a pest.'},
  {t:'wheel',eye:'Part two',h:'The full Sponsorship Wheel',wheel:['Find','Pitch','Price','Negotiate','Execute','Report','Re-sign','Repeat'],lede:'Each step feeds the next. The report you send after one deal is the pitch that wins the next one.'},
  {t:'part',eye:'Part three',h:'What a real deal looks like',lede:'Not a gifted post. A scoped set of deliverables, usage rights with a term, a defensible rate, and a report that turns one campaign into an annual partnership.'},
  {t:'frame',eye:'The quiet multiplier',h:'The report is the next pitch',lede:'Most creators finish a campaign and go quiet. Send a short report tying your content to what the brand cares about, and you are no longer a one-off. You are the first name they call next quarter, at a higher rate.'},
  {t:'cred',eye:'Why learn this from me',h:'I have been on both sides of the table',items:['Over $5M in my own brand partnerships as a creator.','Years running an influencer agency, so I know what the brand side actually approves and why.','Members have landed real deals fast: one creator reported $13,000 in deals in her first two weeks, another over $17,000 from opportunities she found through my newsletter.']},
  {t:'recap',eye:'Recap',h:'The loop, in one breath',items:['A.R.C. to read the brand.','R.O.P.E. to write the pitch.','D.U.E. to scope and price the deal.','P.I.N.O.T. to follow up and close.']},
  {t:'cta',kicker:'Your next step',h:'Come run the Wheel with us',lede:'If you want the templates, the rate calculator, and live deal reviews, the next step is to apply to join the Wizard’s Guild and bring a real brand conversation you are working on.',disc:'This masterclass is educational. It shares frameworks and examples from real brand partnerships. It is not a guarantee of income or results. What you earn depends on your work, your audience, and your market.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  h+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.kicker)h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.eye)h+='<div class="eye">'+s.eye+'</div>';
  if(s.t==='title'||s.t==='cta'){h+='<h1 class="underline">'+s.h+'</h1>';}
  else{h+='<h2>'+s.h+'</h2>';}
  if(s.big)h+='<p class="big" style="margin-top:22px">'+s.big+'</p>';
  if(s.lede)h+='<p class="lede">'+s.lede+'</p>';
  if(s.items){h+='<ul>';s.items.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.grid){h+='<div class="grid3">';s.grid.forEach(g=>h+='<div class="cardbox"><h3>'+g[0]+'</h3><p>'+g[1]+'</p></div>');h+='</div>';}
  if(s.wheel){h+='<div class="wheel">';s.wheel.forEach(w=>h+='<div>'+w+'</div>');h+='</div>';}
  if(s.brandline)h+='<div class="brandline">'+s.brandline+'</div>';
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
