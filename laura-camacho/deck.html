<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Quiet Authority Method — Laura Camacho</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe8; --panel:#fffdf9; --rule:#e4ddd0;
    --ink:#2a2724; --muted:#686666;
    --accent:#b6151f; --gold:#af9046;
    --display:'Archivo',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  .num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--gold);letter-spacing:.08em;margin-bottom:14px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.04;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.08;letter-spacing:-.01em;margin-bottom:16px}
  .promise{font-size:20px;line-height:1.5;color:var(--muted);max-width:40ch}
  .lead{font-size:20px;line-height:1.55;max-width:46ch}
  p.body{font-size:18px;line-height:1.6;color:var(--ink);max-width:48ch;margin-top:10px}
  ul{list-style:none;margin-top:12px}
  li{font-size:18px;line-height:1.5;padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px;align-items:baseline}
  li:first-child{border-top:none}
  li .mk{font-family:var(--display);font-weight:800;color:var(--accent);min-width:26px}
  .pillar b{font-family:var(--display);font-weight:700;display:block;font-size:19px;margin-bottom:3px}
  .pillar span{color:var(--muted);font-size:17px}
  .by{margin-top:26px;font-family:var(--display);font-weight:600;font-size:16px;color:var(--ink)}
  .by small{display:block;color:var(--muted);font-weight:400;font-family:var(--body);margin-top:4px;font-size:14px}
  .cta h2{color:var(--accent)}
  .disclaimer{margin-top:22px;font-size:13px;line-height:1.5;color:var(--muted);max-width:52ch}
  .foot{font-size:13px;color:var(--muted);margin-top:18px;font-family:var(--display);letter-spacing:.04em}
  @media(max-width:620px){.slide{padding:38px 26px}h1{font-size:34px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
    kicker:'A Speak Up Masterclass',
    h:'The Quiet Authority Method',
    promise:'How high-performing introverts build executive presence that makes a room listen, without pretending to be the loudest person in it.',
    by:'Laura Camacho, PhD',
    bysub:'Executive Communication Coach · Host of the Speak Up podcast'},

  {t:'section',kicker:'Who this is for',
    h:'You are excellent at the work. You are still being overlooked.',
    body:'This is for the senior individual contributor, the technical expert, the quiet high performer who delivers more than anyone and still watches louder colleagues get the room, the credit, and the promotion.'},

  {t:'section',kicker:'The trap',
    h:'Every presence tip you have been given was written for extroverts.',
    body:'Speak up more. Be more confident. Command the room. For an introvert that advice does not land, it just feels like being asked to be someone else. So you stay quiet, and quiet gets read as not ready.'},

  {t:'hook',kicker:'The reframe',
    h:'The problem was never that you are too quiet.',
    body:'It is that nobody taught you a form of presence that runs on how you are actually wired. Done right, being measured and deliberate is not a weakness to fix. It is the most credible kind of authority there is.'},

  {t:'part',num:'PART ONE',h:'Why talented people get passed over'},

  {t:'section',kicker:'The visibility gap',
    h:'Execution is noticed. Influence is rewarded.',
    body:'Most overlooked leaders are valued only for execution. The work speaks, but the person does not, so decisions about their career get made in rooms where their voice is not present. Presence is what closes that gap.'},

  {t:'section',kicker:'The louder-is-better myth',
    h:'Volume is not authority.',
    body:'The people who dominate meetings are often the least trusted with the hardest calls. Senior rooms run on something quieter: clarity, composure, and the sense that this person has already thought it through.'},

  {t:'part',num:'PART TWO',h:'The Executive Presence Mastery System'},

  {t:'pillars',kicker:'The 4 pillars',
    h:'Presence, built on four things you can learn.',
    items:[
      {n:'01',b:'Premium Professional Personal Brand',s:'A clear, premium read on who you are that leaves a lasting impression in senior rooms.'},
      {n:'02',b:'Executive Meeting Influence & Impact',s:'Shaping the discussion and the decision from wherever you sit at the table.'},
      {n:'03',b:'Executive Presentations',s:'Presenting so it resonates with executive audiences instead of drowning them in detail.'},
      {n:'04',b:'Leadership Visibility',s:'Being seen for the right work so the people who decide your future already know it.'}
    ]},

  {t:'section',kicker:'The 7 Executive Presence Archetypes',
    h:'Amplify your strengths. Stop copying someone else.',
    body:'Successful leaders influence in completely different ways. The seven archetypes let you find the one that is already yours, then build presence on top of your natural wiring, rather than impersonating the extrovert across the table.'},

  {t:'section',kicker:'The PAAB framework',
    h:'Pause. Acknowledge. Answer. Bridge.',
    body:'When you get challenged in an executive meeting, this is the four-beat move that keeps you composed and answers the real concern, instead of getting flustered or going silent. The pause is where the authority lives.'},

  {t:'section',kicker:'The Affirm and Add move',
    h:'Disagree with senior leaders and keep the room.',
    body:'A Swiss-army-knife way to push back on someone more senior without losing respect or candor. You affirm what is true in their point, then add the thing they are missing, so you are seen as sharp rather than difficult.'},

  {t:'section',kicker:'The 7-minute rule',
    h:'Your presence is set in the first seven minutes.',
    body:'Contribute something genuinely useful inside the first seven minutes of an important meeting and senior leaders file you as a contributor for the rest of it. Wait until you feel ready and the room has already decided you are furniture.'},

  {t:'part',num:'PART THREE',h:'The same room, a different read on you'},

  {t:'section',kicker:'The shift',
    h:'You say less and land more.',
    body:'You walk into the board meeting knowing your archetype, you contribute early, you hold your pause when challenged. You are not performing confidence. You are simply the most composed and most prepared person there, and everyone can feel it.'},

  {t:'section',kicker:'Why learn this from me',
    h:'Twenty years inside the rooms where this is decided.',
    body:'I am Laura Camacho, PhD, a certified introvert who has had more than 5,000 executive coaching conversations over two decades, with leaders at companies like AstraZeneca, Comcast, Nestle and The LEGO Group. This is the first coaching process built for the introvert, not adapted from one built for someone else.'},

  {t:'recap',kicker:'The method, in one line',
    h:'Quiet authority is a skill, not a personality.',
    body:'Four pillars, your archetype, and a handful of precise moves for the moments that matter. That is executive presence an introvert can actually sustain, because it is finally built on who you are.'},

  {t:'cta',kicker:'Your next step',
    h:'Ready to be impossible to overlook?',
    body:'If you are a high performer who is done watching louder people advance, let us map what your executive presence could look like. Book a short strategy call and we will build the plan around your archetype.',
    foot:'Speak Up · speakupwithlaura.com',
    disclaimer:'Educational content only. Individual results vary and are not guaranteed; nothing here promises a specific promotion, outcome, or income.'}
];

const deck=document.getElementById('deck');
for(const s of S){
  const el=document.createElement('section');
  el.className='slide '+s.t;
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.t==='title'){
    h+='<h1>'+s.h+'</h1><div class="promise">'+s.promise+'</div>';
    h+='<div class="by">'+s.by+'<small>'+s.bysub+'</small></div>';
  } else if(s.t==='part'){
    h+='<h2>'+s.h+'</h2>';
  } else if(s.t==='pillars'){
    h+='<h2>'+s.h+'</h2><ul>';
    for(const it of s.items){h+='<li class="pillar"><span class="mk">'+it.n+'</span><span><b>'+it.b+'</b><span>'+it.s+'</span></span></li>';}
    h+='</ul>';
  } else if(s.t==='cta'){
    h+='<h2>'+s.h+'</h2><p class="body">'+s.body+'</p>';
    h+='<div class="foot">'+s.foot+'</div>';
    h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  } else {
    if(s.h) h+='<h2>'+s.h+'</h2>';
    if(s.body) h+='<p class="body">'+s.body+'</p>';
  }
  el.innerHTML=h;
  deck.appendChild(el);
}
</script>
</body>
</html>
