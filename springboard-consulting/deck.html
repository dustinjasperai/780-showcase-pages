<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>READY, Set, Change! A Masterclass with April Callis-Birchmeier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,600;6..72,700&family=Lato:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#01155d;      /* their dominant navy */
    --panel:#0a2065;   /* lifted navy card */
    --rule:#3a4a86;    /* desaturated navy */
    --accent:#c72b41;  /* their crimson link color */
    --chalk:#ecf0f1;   /* their pale */
    --dim:#9fb0d8;     /* muted navy-tint */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#060d2e;color:var(--chalk);font-family:'Lato',system-ui,sans-serif}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 22px 120px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:16px;
    padding:60px 58px;margin:0 0 26px;min-height:470px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .ey{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:900;margin-bottom:18px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:54px;line-height:1.08;margin-bottom:18px}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:40px;line-height:1.12;margin-bottom:16px}
  p{font-size:21px;line-height:1.55;color:var(--chalk);max-width:40ch;margin-bottom:14px}
  p.lead{font-size:24px;color:var(--dim)}
  .big{font-family:'Newsreader',Georgia,serif;font-size:44px;line-height:1.14;font-weight:600;max-width:24ch}
  ul{list-style:none;margin-top:12px}
  li{font-size:21px;line-height:1.5;padding:12px 0 12px 42px;position:relative;border-bottom:1px solid var(--rule);max-width:46ch}
  li:last-child{border-bottom:0}
  li .k{position:absolute;left:0;top:11px;color:var(--accent);font-family:'Newsreader',serif;font-weight:700;font-size:24px}
  .step{display:flex;align-items:baseline;gap:18px;margin-bottom:6px}
  .step .letter{font-family:'Newsreader',serif;font-size:72px;font-weight:700;color:var(--accent);line-height:1}
  .step .word{font-family:'Newsreader',serif;font-size:34px;font-weight:600}
  .foot{position:absolute;right:26px;bottom:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .disc{font-size:14px;color:var(--dim);max-width:60ch;margin-top:22px;line-height:1.5}
  .cta h1{color:var(--chalk)}
  .pill{display:inline-block;margin-top:8px;padding:12px 22px;border:1px solid var(--accent);border-radius:999px;color:var(--chalk);font-weight:700;font-size:18px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', ey:'A live masterclass with April Callis-Birchmeier', h:'Change, Simplified.', p:'How to lead a change that actually sticks, using the R.E.A.D.Y. five-step framework. Simplify it, accelerate it, and bring your people with you.'},
  {t:'who', ey:'Who this is for', h:'You lead change for a living.', p:'You are a change manager, an HR or OD professional, or a project manager asked to roll out a new system, process, or way of working. You know the plan is only half the job. The other half is people.'},
  {t:'trap', ey:'The trap', h:'The models are too big to use.', p:'Most change frameworks read like a textbook. By the time you have mapped every stage, the project has already moved on, and your team is already resisting. Complexity is not rigor. It is friction.'},
  {t:'hook', big:'Change does not fail because the plan is wrong. It fails because the plan is too complicated for anyone to follow.'},
  {t:'section', ey:'Part one', h:'Why change rolls out and nobody adopts it.'},
  {t:'point', ey:'The real failure point', h:'Resistance is not a people problem.', p:'When adoption stalls, we blame the people. But people resist what they do not understand the reason for. Resistance is almost always a why problem wearing a people costume.'},
  {t:'point', ey:'The cost', h:'A stalled change is expensive twice.', p:'Once for the money and time already spent, and again for the trust you lose with the next change you ask your people to make. Every poorly managed change makes the following one harder.'},
  {t:'section', ey:'Part two', h:'The R.E.A.D.Y. framework.', p:'Five steps. In order. Simple enough to actually run on a real project, on a real timeline.'},
  {t:'step', letter:'R', word:'Relevant, relatable story of change', p:'Start with a story people can see themselves in. Not the business case for leadership, the human reason this change matters to the person being asked to change.'},
  {t:'step', letter:'E', word:'Engage your leaders', p:'Sponsors and leaders have to be visible and active, not just named on a slide. People watch what leaders do, not what the memo says.'},
  {t:'step', letter:'A', word:'Advance communication', p:'Communicate ahead of the change, on purpose and on a schedule, not as an afterthought once something has already gone live. Advance means early.'},
  {t:'step', letter:'D', word:'Develop and support your people', p:'Give people the training and the support to build real capability. Confidence is what turns a mandate into an adoption.'},
  {t:'step', letter:'Y', word:'The Why that reduces resistance', p:'Keep returning to the why. Every time resistance rises, it is usually a signal that the why has gone quiet. Say it again, clearly.'},
  {t:'recap', ey:'The whole framework, one screen', h:'R.E.A.D.Y.', items:[
     ['R','Relevant, relatable story of change'],
     ['E','Engage your leaders'],
     ['A','Advance communication'],
     ['D','Develop and support your people'],
     ['Y','The Why that reduces resistance']]},
  {t:'section', ey:'Part three', h:'What a READY change looks like.'},
  {t:'point', ey:'On the ground', h:'People move with you, not against you.', p:'The story lands, leaders show up, communication is early, support is real, and the why stays loud. Adoption stops being a fight and starts being the default.'},
  {t:'point', ey:'The outcome', h:'Organized and fast, not chaotic and slow.', p:'That is the whole promise of READY, Set, Change. Change that is simplified and accelerated, so your next rollout is the one people point to as the good one.'},
  {t:'cred', ey:'Why April', h:'Twenty years of leading change.', p:'April Callis-Birchmeier is the author of the number one bestseller READY, Set, Change, one of the First 100 Certified Change Management Professionals, a PMP and a Certified Speaking Professional, and the 2026 Trailblazer in Change Management. She has led change for government, health care, higher education, and corporate teams.'},
  {t:'bridge', ey:'The next step in your career', h:'Make it official. Get CCMP-certified.', p:'The same framework that runs your change is the fastest honest route to the CCMP credential. The READY, Set, Change academy takes you from where you are to certified, one clear step at a time.'},
  {t:'cta', ey:'Your next step', h:'Lead your next change the READY way.', p:'Join the next live READY, Set, Change! training and earn your CCMP. Visit springboard-consult.com to find the session that fits you.', pill:'springboard-consult.com', disc:'This masterclass is educational. No specific exam result, certification outcome, or professional result is guaranteed. Results vary by individual and effort.'}
];

const deck = document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
S.forEach((s,i)=>{
  const d = document.createElement('div');
  d.className = 'slide' + (s.t==='cta'?' cta':'');
  let html = '';
  if(s.ey) html += '<div class="ey">'+esc(s.ey)+'</div>';
  if(s.t==='hook'){ html += '<div class="big">'+esc(s.big)+'</div>'; }
  else if(s.t==='step'){
     html += '<div class="step"><span class="letter">'+esc(s.letter)+'</span><span class="word">'+esc(s.word)+'</span></div>';
     if(s.p) html += '<p class="lead">'+esc(s.p)+'</p>';
  }
  else if(s.t==='recap'){
     html += '<h2>'+esc(s.h)+'</h2><ul>';
     s.items.forEach(it=>{ html += '<li><span class="k">'+esc(it[0])+'</span>'+esc(it[1])+'</li>'; });
     html += '</ul>';
  }
  else {
     if(s.h) html += (s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>');
     if(s.p) html += '<p'+(s.t==='title'||s.t==='section'?' class="lead"':'')+'>'+esc(s.p)+'</p>';
     if(s.pill) html += '<div><span class="pill">'+esc(s.pill)+'</span></div>';
     if(s.disc) html += '<div class="disc">'+esc(s.disc)+'</div>';
  }
  html += '<div class="foot">READY, Set, Change! &middot; '+(i+1)+' / '+S.length+'</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
