<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Breakaway Hour - A Live Masterclass with Paulette Bodeman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;600;700&family=Karla:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3f7;        /* near-white tinted toward her lake-blue accent #1c6aa4 */
    --panel:#fbfdff;     /* faint-cool panel, same blue family */
    --rule:#d4deea;
    --ink:#2d3748;       /* brand dominant ink (ranked #1) */
    --muted:#4a5568;     /* brand mid slate (ranked #3) */
    --accent:#1c6aa4;    /* brand link blue (ranked #4) */
    --head:'Roboto Slab',Georgia,serif;
    --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(45,55,72,.04)}
  .eyebrow{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.1;color:var(--ink);margin-bottom:14px}
  h2{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.15;color:var(--ink);margin-bottom:16px}
  .lede{font-size:20px;color:var(--muted);max-width:60ch}
  p.body{font-size:19px;color:var(--ink);max-width:62ch;margin-top:10px}
  ul{margin:14px 0 0 0;max-width:62ch}
  li{font-size:18px;color:var(--ink);margin:0 0 10px 22px;line-height:1.45}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:14px;color:#fff;
    background:var(--accent);border-radius:999px;padding:6px 16px;margin-bottom:18px;letter-spacing:.02em}
  .part h2{font-size:40px}
  .quote{font-family:var(--head);font-weight:400;font-size:28px;font-style:italic;color:var(--ink);
    border-left:3px solid var(--accent);padding-left:22px;max-width:58ch}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12;max-width:20ch}
  .three{display:flex;gap:18px;flex-wrap:wrap;margin-top:22px}
  .three .c{flex:1 1 220px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px}
  .three .c h3{font-family:var(--head);font-weight:600;font-size:22px;color:var(--accent);margin-bottom:6px}
  .three .c p{font-size:16px;color:var(--muted)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:24px;max-width:60ch}
  .cta-steps{font-size:19px;color:var(--ink);margin-top:8px}
  .cta-steps b{color:var(--accent)}
  .foot{font-size:14px;color:var(--muted);margin-top:18px}
  .num{position:absolute}
  .slide{position:relative}
  .slide .idx{position:absolute;top:18px;right:24px;font-size:12px;color:var(--rule);font-weight:600}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Paulette Bodeman',
   h:'The Breakaway Hour',
   lede:'Meeting your life when everything changes. One grounded, live hour for women standing at a threshold.'},

  {t:'promise', eyebrow:'What this hour is',
   h:'A different way through change',
   body:'Not another five-step plan to fix yourself. In the next hour you will learn how to meet a season of change consciously, using three movements you can practice the moment we finish: Story, Depth, and Discernment.'},

  {t:'who', eyebrow:'Who this is for',
   h:'You are standing somewhere new',
   body:'Maybe a marriage ended, a parent died, the kids are gone, the career no longer fits, or a faith you leaned on has gone quiet. You are not in crisis. You are in transition, and the old map does not work anymore.'},

  {t:'trap', eyebrow:'The trap',
   h:'The quick-fix playbook',
   body:'You have been handed it a hundred times: the morning routine, the mindset hack, the "just think positive." It is loud, it is everywhere, and it has not touched the real thing. That is not your failure. It is the wrong tool.'},

  {t:'reframe', eyebrow:'The reframe',
   quote:'The problem was never that you are broken. You were taught to manage your life instead of meet it.'},

  {t:'part', pill:'Part One', h:'Why fixing keeps you stuck'},

  {t:'content', eyebrow:'Part One',
   h:'A season is not a malfunction',
   body:'Fixing treats change like something that went wrong, so it rushes you past the one thing that matters: what this season is actually asking of you. Speed is the enemy of meaning here.'},

  {t:'content', eyebrow:'Part One',
   h:'Because life is messy',
   body:'The mess is not the mistake. Grief, longing, confusion, and reinvention are the material you are working with, not evidence that you are doing it wrong. We stop trying to tidy it and start listening to it.'},

  {t:'part', pill:'Part Two', h:'The method: Story, Depth, Discernment'},

  {t:'three', eyebrow:'Part Two',
   h:'Three movements',
   cards:[
     {h:'Story', p:'Your life as narrative. You are its author, not its problem.'},
     {h:'Depth', p:'Choosing honesty over quick answers. The real question underneath.'},
     {h:'Discernment', p:'Separating what is noise from what is true.'}
   ]},

  {t:'content', eyebrow:'Story',
   h:'You are the author',
   quote:'I am not the black sheep of the family. I am a breakaway girl.',
   body:'The story you tell about who you are decides what you can do next. We practice re-authoring the sentence you have been living inside.'},

  {t:'content', eyebrow:'Depth',
   h:'Honesty over quick answers',
   body:'Under the urge to feel better fast is a truer question. Depth is the willingness to stay with it long enough to hear it, instead of reaching for the first exit.'},

  {t:'content', eyebrow:'Discernment',
   h:'Noise, and what is true',
   body:'A hard season is loud with other people’s shoulds and your own fear. Discernment is a practice for telling the signal from the noise, so the next choice is yours and not the room’s.'},

  {t:'content', eyebrow:'A practice you can use tonight',
   h:'Meet it, do not fix it',
   body:'A short, grounded practice drawn from decades of yoga and meditation: come to stillness, ask the season one honest question, and welcome the part of you that answers, even the part you usually push away.'},

  {t:'part', pill:'Part Three', h:'Living it, not managing it'},

  {t:'content', eyebrow:'Part Three',
   h:'Clearer, and more your own',
   body:'When you meet your life instead of managing it, decisions get quieter and clearer. You stop outsourcing your next step to the loudest voice, and you start trusting your own discernment again.'},

  {t:'why', eyebrow:'Why me',
   h:'Who is teaching this',
   body:'Paulette Bodeman is a certified integrative coach and Anusara-certified yoga teacher with more than thirty years in yoga, meditation, and contemplative practice. She is the author of the memoir The BreakAway Girl: Secrets of a Tantric Yogi, and writes Because Life is Messy. This is lived work, not a theory.'},

  {t:'recap', eyebrow:'The hour, in three words',
   h:'Story. Depth. Discernment.',
   body:'A way to meet change consciously, grounded in practice you can keep using long after this hour ends.'},

  {t:'cta', eyebrow:'Continue the work together',
   h:'Keep going',
   steps:'If this hour opened something, the next step is to keep going together in the <b>Sage 3-Month Deluxe Experience</b>, a three-month 1:1 mentorship for women navigating change.',
   foot:'Learn more and begin at paulettebodeman.com',
   disclaimer:'This masterclass is educational and reflective in nature. It is not therapy, counseling, or medical advice, and it offers no guarantee of any particular outcome. Results vary from person to person.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='part'?'part':'');
  let inner = '<span class="idx">'+(i+1)+' / '+S.length+'</span>';
  if(s.eyebrow) inner += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.pill) inner += '<span class="pill">'+s.pill+'</span>';
  if(s.h && s.t==='title') inner += '<h1>'+s.h+'</h1>';
  else if(s.h) inner += '<h2>'+s.h+'</h2>';
  if(s.lede) inner += '<p class="lede">'+s.lede+'</p>';
  if(s.quote) inner += '<p class="quote">'+s.quote+'</p>';
  if(s.body) inner += '<p class="body">'+s.body+'</p>';
  if(s.cards){
    inner += '<div class="three">';
    s.cards.forEach(c=>{ inner += '<div class="c"><h3>'+c.h+'</h3><p>'+c.p+'</p></div>'; });
    inner += '</div>';
  }
  if(s.steps) inner += '<p class="cta-steps">'+s.steps+'</p>';
  if(s.foot) inner += '<p class="foot">'+s.foot+'</p>';
  if(s.disclaimer) inner += '<p class="disclaimer">'+s.disclaimer+'</p>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
