<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trust-Based Leadership — a live masterclass with Mike Ettore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a;        /* his deep-navy h2 ground (brand.json) */
    --panel:#1e2838;     /* one step up, same hue */
    --rule:#33404f;      /* muted hue-matched hairline */
    --accent:#e74b3d;    /* his button red (brand.json, 10 uses) */
    --ink:#f4f6f8;
    --muted:#9fb0c3;
    --display:'Alegreya Sans',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0c121b;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:420px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(255,255,255,.02) inset;
  }
  .num{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .eyebrow{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:800;font-size:54px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:800;font-size:38px;line-height:1.08;margin-bottom:14px}
  .sub{font-size:21px;color:var(--muted);margin-top:18px;max-width:34ch}
  p.lead{font-size:20px;margin-top:10px;max-width:60ch}
  .part-kicker{font-family:var(--display);text-transform:uppercase;letter-spacing:.28em;font-size:15px;color:var(--accent);font-weight:700;margin-bottom:10px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .concept{display:flex;gap:18px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
  .concept:last-child{border-bottom:0}
  .concept .k{font-family:var(--display);font-weight:800;color:var(--accent);font-size:22px;min-width:52px}
  .concept .t{font-family:var(--display);font-weight:700;font-size:20px}
  .concept .d{color:var(--muted);font-size:16px;margin-top:3px}
  .big{font-family:var(--display);font-weight:800;font-size:40px;line-height:1.12;max-width:24ch}
  .quote{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.25;max-width:26ch}
  .cite{color:var(--muted);margin-top:18px;font-size:17px}
  .cta h2{font-size:44px}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .accentbar{width:64px;height:5px;background:var(--accent);border-radius:3px;margin:0 0 26px}
  .credrow{display:grid;grid-template-columns:1fr 1fr;gap:14px 34px;margin-top:18px}
  .credrow div{font-size:17px;padding-left:16px;border-left:3px solid var(--accent)}
  @media(max-width:620px){.slide{padding:34px 26px}h1{font-size:38px}h2{font-size:30px}.credrow{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Mike Ettore, USMC (ret.)',
  title:'Trust-Based Leadership',
  sub:'The Marine Corps system for a team that executes without you in the room.'},

 {t:'who',title:'Who this hour is for',
  lead:'If you lead a team and you are honest about it, you already suspect the truth:',
  items:[
   'Executives whose team stalls the moment they step away',
   'Leaders who were promoted for doing the work, not for handing it off',
   'C-suite and senior leaders inheriting a team that waits to be told',
   'High-potential leaders who want to scale their judgment, not just their hours']},

 {t:'trap',big:'You did not get promoted to answer the same three questions all day. But that is exactly where your week goes.',
  lead:'Every decision routes back to you. You are the smartest person in the room and the slowest bottleneck in the building, at the same time.'},

 {t:'reframe',quote:'"Hire better people" will not fix this. You can hire brilliant people and still own every decision. The problem was never the people. It is that no one ever gave them the system.',
  cite:'That system has a name, and the Marine Corps has run it under fire for two centuries.'},

 {t:'part',kicker:'Part One',title:'Why your team keeps handing the decision back'},

 {t:'body',h:'Three costs you are already paying',
  items:[
   'Speed: nothing moves faster than your inbox can clear',
   'Judgment: your people never build it, because they never get to use it',
   'You: the better you are at deciding, the more you guarantee you will never stop']},

 {t:'body',h:'The real question is not "how do I delegate more?"',
  lead:'Delegating tasks still leaves you holding every decision. The question is how a team learns to decide the way you would decide, without a meeting. That is a leadership system, not a to-do list.'},

 {t:'part',kicker:'Part Two',title:'The Trust-Based Leadership Model'},

 {t:'body',h:'Marine doctrine, rebuilt for the corporate team',
  lead:'Trust-Based Leadership adapts how elite units move fast and correctly without a commander in every decision. Ten enabling concepts. These four carry the most weight for a business team.'},

 {t:'concepts',h:'The engine: Commander’s Intent & Mission Tactics',
  rows:[
   {k:'01',t:'Commander’s Intent',d:'You define the outcome and the why, clearly enough that a leader two levels down can act on it when the plan meets reality.'},
   {k:'02',t:'Mission Tactics',d:'You assign the mission, not the method. People closest to the problem choose how, inside your intent. Decisions happen where the information is.'}]},

 {t:'concepts',h:'The friction you are actually fighting',
  rows:[
   {k:'03',t:'The Two Types of Friction',d:'External friction is the market and the competition. Internal friction is confusion, mixed signals, and rework you created yourself. Most teams lose to the second kind.'},
   {k:'04',t:'Standard Operating Procedures',d:'The decisions that should never be improvised get written down once, so judgment is saved for the decisions that actually need it.'}]},

 {t:'concepts',h:'How a team moves as one',
  rows:[
   {k:'05',t:'Common Operating Language',d:'When "done," "urgent," and "good" mean the same thing to everyone, people stop checking with you to be sure. Shared language is what lets trust scale.'}]},

 {t:'body',h:'Why it is called Trust-Based',
  lead:'None of this works on org charts. It works because the leader has earned the trust to let go, and built the clarity that makes letting go safe. Clarity first, then trust, then speed. In that order.'},

 {t:'part',kicker:'Part Three',title:'What a self-executing team looks like'},

 {t:'body',h:'The week on the other side',
  items:[
   'Your people decide inside your intent and tell you after, not before',
   'The questions you get are the hard ones, because the easy ones already have answers',
   'You spend your hours on strategy and on growing leaders, not on triage',
   'The team is faster when you are in the room and when you are not']},

 {t:'cred',h:'Why learn this from me',
  lead:'I did not read this in a book. I lived it on both battlefields.',
  rows:[
   'Enlisted Marine at 17; the Corps’ youngest Drill Instructor at 20',
   'Infantry officer and combat unit commander; Bronze Star for Valor',
   '1992 Leftwich Trophy for outstanding leadership',
   '15 years in the C-suite of a public company, ending as Chief Services Officer',
   'Author of Trust-Based Leadership and three more leadership books',
   'Founder of Fidelis Leadership; host of the Fidelis Leadership Podcast']},

 {t:'body',h:'What to hold onto from this hour',
  items:[
   'You are the bottleneck because no one gave your team the system, not because they are weak',
   'Clarity of intent is what makes trust safe to give',
   'Assign the mission, not the method, and decisions move to where the information is']},

 {t:'cta',eyebrow:'Your next step',
  title:'Build the team that runs without you.',
  lead:'If you want to install Trust-Based Leadership inside your own team, the next step is a direct conversation about executive and team coaching with Fidelis Leadership.',
  disclaimer:'This masterclass is for educational purposes only. It describes leadership principles and frameworks, not guaranteed outcomes. Every organization is different and results vary with your context, team, and execution.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='<span class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</span>';
  if(s.t==='title'){
    h+='<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.title+'</h1><div class="sub">'+s.sub+'</div>';
  }else if(s.t==='part'){
    h+='<div class="part-kicker">'+s.kicker+'</div><div class="accentbar"></div><h2>'+s.title+'</h2>';
  }else if(s.t==='who'){
    h+='<h2>'+s.title+'</h2><p class="lead">'+s.lead+'</p><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  }else if(s.t==='trap'){
    h+='<div class="big">'+s.big+'</div><p class="lead">'+s.lead+'</p>';
  }else if(s.t==='reframe'){
    h+='<div class="quote">'+s.quote+'</div><div class="cite">'+s.cite+'</div>';
  }else if(s.t==='body'){
    h+='<h2>'+s.h+'</h2>'+(s.lead?'<p class="lead">'+s.lead+'</p>':'')+(s.items?'<ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>':'');
  }else if(s.t==='concepts'){
    h+='<h2>'+s.h+'</h2>'+s.rows.map(r=>'<div class="concept"><div class="k">'+r.k+'</div><div><div class="t">'+r.t+'</div><div class="d">'+r.d+'</div></div></div>').join('');
  }else if(s.t==='cred'){
    h+='<h2>'+s.h+'</h2><p class="lead">'+s.lead+'</p><div class="credrow">'+s.rows.map(x=>'<div>'+x+'</div>').join('')+'</div>';
  }else if(s.t==='cta'){
    h+='<div class="eyebrow">'+s.eyebrow+'</div><h2>'+s.title+'</h2><p class="lead">'+s.lead+'</p><div class="disclaimer">'+s.disclaimer+'</div>';
  }
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
