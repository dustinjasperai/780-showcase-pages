<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 5 Freedoms Masterclass: Vacation Rental Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c0d1f;        /* brand navy ground */
    --panel:#15172e;     /* navy lifted one step */
    --rule:#2b2d4a;      /* muted navy hairline */
    --coral:#fa7161;     /* brand button coral (dominant accent) */
    --gold:#d7bc7e;      /* brand link gold/sand (secondary accent) */
    --ink:#f3efe7;       /* warm paper ink on dark */
    --muted:#9ea2c0;     /* muted lavender-grey */
    --head:'Red Hat Display',system-ui,sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#05060f;color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:14px;padding:54px 58px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;right:0;top:0;height:5px;
    background:linear-gradient(90deg,var(--coral),var(--gold));
  }
  .horizon{height:2px;width:72px;background:linear-gradient(90deg,var(--coral),var(--gold));
    border-radius:2px;margin:0 0 20px}
  .eyebrow{font-family:var(--head);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--gold);margin-bottom:14px}
  h1{font-family:var(--head);font-weight:900;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.1;margin-bottom:8px}
  .sub{font-size:21px;color:var(--muted);margin-top:18px;max-width:40ch;line-height:1.45}
  p.body{font-size:19px;line-height:1.55;color:var(--ink);max-width:46ch;margin-top:14px}
  .lead{font-size:27px;line-height:1.3;font-family:var(--head);font-weight:500;max-width:30ch}
  .kicker{font-family:var(--head);font-weight:900;font-size:66px;color:var(--coral);line-height:1}
  ul{list-style:none;margin-top:22px}
  li{font-size:19px;line-height:1.4;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:11px;height:11px;border-radius:50%;
    background:var(--coral)}
  li b{font-family:var(--head);color:var(--gold);font-weight:700}
  .part{font-family:var(--head);font-weight:900;font-size:16px;color:var(--gold);letter-spacing:.2em;text-transform:uppercase}
  .big{font-size:46px;font-family:var(--head);font-weight:900;line-height:1.08;max-width:24ch}
  .foot{position:absolute;left:58px;bottom:26px;font-family:var(--head);font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .pagenum{position:absolute;right:30px;bottom:24px;font-size:13px;color:var(--rule)}
  .cta h1{font-size:46px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .brandline{font-family:var(--head);font-weight:700;color:var(--ink);margin-top:30px;font-size:17px}
  .brandline span{color:var(--coral)}
  @media(max-width:680px){.slide{padding:38px 26px}h1{font-size:36px}.big{font-size:32px}.kicker{font-size:48px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND="Vacation Rental Mastery";
const S=[
  {t:'title',eyebrow:'A live masterclass with Karan Narang',h1:'The 5 Freedoms',sub:'How one short-term rental buys back your time, your location, and your income.'},
  {t:'who',eyebrow:'Who this is for',lead:'You are a high earner. The money is good. The hours are not yours, and they never have been.'},
  {t:'statement',big:'You earn well. You still trade every hour of it for the money.'},
  {t:'statement',big:'A bigger paycheck is still a paycheck. It stops the day you do.'},
  {t:'part',part:'Part One',h2:'Why income never becomes freedom'},
  {t:'content',h2:'The ceiling nobody mentions',body:'Climbing pays more per hour. It never pays you for zero hours. The salary is the handcuff, and promotions only make it heavier.'},
  {t:'content',h2:'Most "investments" pay you. They do not free you.',body:'A brokerage balance grows while your calendar stays full. Freedom is not just more money. It is money that arrives whether or not you show up.'},
  {t:'part',part:'Part Two',h2:'The 5 Freedoms, through short-term rentals'},
  {t:'list',h2:'One asset, five freedoms',items:[
     '<b>Financial</b>: cash flow that lands every month, plus the tax advantages most earners never claim.',
     '<b>Time</b>: a system and a team run the property, so the income is not another job.',
     '<b>Location</b>: the asset runs from anywhere you happen to be.',
     '<b>Relational</b>: the hours you buy back get spent on the people they were meant for.',
     '<b>Impact</b>: freedom is only the start. What you build with it is the point.']},
  {t:'content',h2:'Freedom 1: Financial',body:'A short-term rental can out-earn a long-term lease many times over. Paired with the deductions and depreciation a rental property allows, the first one can work harder for a high earner than almost anything on a pay stub.',foot:'Educational, not tax advice'},
  {t:'content',h2:'Freedom 2: Time',body:'The difference between a rental and a second job is the operating system: the standard procedures, the guest templates, the team. Built once, the property runs without living in your inbox.'},
  {t:'content',h2:'Freedom 3: Location',body:'When the system runs the property, you are no longer tied to it. The income follows you to the next city, the next country, the next season of your life.'},
  {t:'content',h2:'Freedom 4: Relational',body:'Time and money bought back are only worth what you spend them on. The whole point of the first four freedoms is presence with the people who matter.'},
  {t:'content',h2:'Freedom 5: Impact',body:'Once the income is handled and the calendar is yours, the question changes from "how do I earn" to "what do I build." That is where the 5 Freedoms are actually going.'},
  {t:'part',part:'Part Three',h2:'Your first property in 90 days'},
  {t:'content',h2:'Buy the market, not the hype',body:'The first decision is the market, not the listing. A short-term rental only delivers the freedoms if the numbers work before you ever close. Pick a market that cash-flows, then pick the property.'},
  {t:'content',h2:'Finance it, launch it, systemize it',body:'Structure the purchase, stand the listing up, and hand the operations to a repeatable system from day one. The SOP and guest-communication library is the difference between an asset and an obligation.'},
  {t:'content',h2:'Why Karan',body:'Karan Narang is an investor, operator, property manager and coach in short-term rentals, with 20+ years of experience and the host of The Vacation Rental Mastery Podcast and community. This is the path he walks and teaches, not theory.'},
  {t:'content',h2:'What the path looks like',body:'The 12-Week Accelerator turns this into a build: pre-recorded modules, weekly live group coaching, 1:1 sessions, and the full SOP and template library, so you are not figuring out the first property alone.'},
  {t:'cta',eyebrow:'The next step',h1:'Ready to build your 5 Freedoms?',sub:'Book a call with Karan, or join the 12-Week Accelerator, and map your first property.',disc:'Educational only. No income or result is guaranteed. Results vary. Nothing in this presentation is financial, tax, or investment advice. Consult a qualified professional before making any investment or tax decision.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.t==='title'){h=`<div class="horizon"></div><div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><div class="sub">${s.sub}</div><div class="brandline"><span>${BRAND}</span></div>`;}
  else if(s.t==='who'){h=`<div class="eyebrow">${s.eyebrow}</div><div class="horizon"></div><div class="lead">${s.lead}</div>`;}
  else if(s.t==='statement'){h=`<div class="horizon"></div><div class="big">${s.big}</div>`;}
  else if(s.t==='part'){h=`<div class="part">${s.part}</div><div class="horizon"></div><h2>${s.h2}</h2>`;}
  else if(s.t==='content'){h=`<h2>${s.h2}</h2><div class="horizon"></div><p class="body">${s.body}</p>`+(s.foot?`<div class="foot">${s.foot}</div>`:'');}
  else if(s.t==='list'){h=`<h2>${s.h2}</h2><div class="horizon"></div><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;}
  else if(s.t==='cta'){h=`<div class="horizon"></div><div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><div class="sub">${s.sub}</div><div class="brandline"><span>${BRAND}</span></div><div class="disc">${s.disc}</div>`;}
  h+=`<div class="pagenum">${i+1} / ${S.length}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
