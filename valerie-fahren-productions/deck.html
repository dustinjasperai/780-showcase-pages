<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Artist Development Path: A Live Masterclass with Valerie Fahren</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&family=Syncopate:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f4f3f0;      /* warm paper ground (her light scheme) */
    --ink:#1b1a1a;        /* near-black, dominant (brand.json) */
    --accent:#1b1a1a;     /* near-black, traceable to brand.json #1b1a1a */
    --grey:#d9d9d9;       /* brand grey (brand.json), panels/rules */
    --panel:#e5e4e1;      /* light panel from the grey */
    --disp:'Syncopate',sans-serif;  /* her display face */
    --body:'Rubik',sans-serif;      /* her body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#2a2928;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--paper);border:1px solid var(--grey);
    aspect-ratio:16/9;margin:0 0 22px;padding:56px 64px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
  }
  .kicker{font-family:var(--disp);font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink);opacity:.62;margin-bottom:22px}
  h1{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1.12;letter-spacing:.01em;text-transform:uppercase}
  h2{font-family:var(--disp);font-weight:700;font-size:30px;line-height:1.16;text-transform:uppercase}
  .sub{font-size:19px;line-height:1.5;margin-top:20px;max-width:40ch}
  .body{font-size:18px;line-height:1.6;margin-top:16px;max-width:46ch}
  .num{font-family:var(--disp);font-size:13px;letter-spacing:.2em;color:var(--ink);opacity:.5;position:absolute;top:26px;right:30px}
  .tag{position:absolute;top:26px;left:30px;font-family:var(--disp);font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.5}
  .rule{height:2px;width:64px;background:var(--accent);margin:22px 0}
  ul{margin-top:18px;list-style:none}
  li{font-size:18px;line-height:1.5;padding:11px 0 11px 26px;border-bottom:1px solid var(--grey);position:relative;max-width:52ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:9px;height:9px;background:var(--accent)}
  .big{font-family:var(--disp);font-weight:700;font-size:34px;line-height:1.18;text-transform:uppercase}
  .strike{text-decoration:line-through;opacity:.4}
  .pill{display:inline-block;font-family:var(--disp);font-size:12px;letter-spacing:.2em;text-transform:uppercase;border:1px solid var(--ink);padding:8px 14px;margin-top:26px}
  .section{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .section .kicker,.section .num,.section .tag{color:var(--paper);opacity:.7}
  .section h1{color:var(--paper)}
  .section .rule{background:var(--paper)}
  .credit{font-size:15px;line-height:1.6;margin-top:16px;max-width:50ch;opacity:.85}
  .disc{font-size:12.5px;line-height:1.5;opacity:.6;margin-top:24px;max-width:56ch}
  .cta h1{font-size:44px}
  .panel{background:var(--panel);border:1px solid var(--grey);padding:22px 24px;margin-top:22px;max-width:48ch}
  .panel .l{font-family:var(--disp);font-size:12px;letter-spacing:.18em;text-transform:uppercase;opacity:.6}
  .panel .v{font-size:20px;line-height:1.4;margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Valerie Fahren',
    h:'The Artist Development Path',
    sub:'Why talented singers still don\'t get signed, and the five part path that turns a good voice into a real career.' },

  {t:'content', tag:'Who this is for', h:'You can already sing. That was never the problem.',
    body:'This is for singers, singer actors, and recording artists who have taken the lessons, done the practice, and still aren\'t booking, getting cast, or getting signed. You don\'t need another warm up. You need to be developed.' },

  {t:'content', tag:'The trap', h:'You were told the answer was more lessons.',
    body:'So you bought the course, watched the videos, drilled the scales. And your voice got a little better while your career stayed exactly where it was. More technique was never going to fix a development problem.' },

  {t:'reframe', tag:'The reframe', big:'Talent gets you noticed. Development gets you signed.',
    body:'Most singers are being taught. Almost none are being developed. That gap is the whole reason the room stays closed.' },

  {t:'section', kicker:'Part one', h:'The real problem' },

  {t:'content', tag:'Part one', h:'Consuming information is not the same as being developed.',
    body:'There is a fundamental difference between watching general content and being professionally developed. One fills your head with tips. The other builds an artist, decision by decision, over time.' },

  {t:'content', tag:'Part one', h:'Every voice is a different instrument.',
    body:'Every singer has a unique instrument, unique habits, and unique challenges. Without a customized approach, progress is slow, inconsistent, and sometimes damaging to the voice. Cookie cutter online training builds hobbyists. Private development builds careers.' },

  {t:'section', kicker:'Part two', h:'The five part path' },

  {t:'pillar', tag:'Pillar 01', h:'A technique plan built to your instrument',
    body:'It starts by rapidly assessing your primary vocal issues and isolating the fundamentals that actually move your quality, control, strength, and range. Then a technique plan tailored to your voice, with targeted exercises that strengthen and protect your instrument.' },

  {t:'pillar', tag:'Pillar 02', h:'Audition and performance preparation',
    body:'Technique is private. Auditions are public. You learn to carry the voice into the room: song choice, interpretation, nerves, and the performance craft that makes industry people lean in instead of look away.' },

  {t:'pillar', tag:'Pillar 03', h:'Songwriting and music theory',
    body:'An artist with their own material and a working knowledge of theory is a different kind of prospect. You develop the writing and the musicianship that let you create, collaborate, and hold your own in a studio.' },

  {t:'pillar', tag:'Pillar 04', h:'The industry showcase',
    body:'Twice a year, developed artists perform in front of 25 to 50 industry professionals: managers, A and R, and music people. The intense rehearsal, the preparation, and the performance itself are where readiness becomes real, and where artists get seen.' },

  {t:'pillar', tag:'Pillar 05', h:'The record company pitch and positioning',
    body:'A voice is not a pitch. You develop the positioning, the story, and the materials that make a label or a manager able to say yes. This is the step almost no singing program ever touches.' },

  {t:'content', tag:'Part two', h:'The pillars compound.',
    body:'None of these works alone. Developed together, privately, intensively, and consistently, they turn a talented singer into an artist a professional can actually move. That is what development means.' },

  {t:'section', kicker:'Part three', h:'Walking in ready' },

  {t:'content', tag:'Part three', h:'You walk into the room ready.',
    body:'A developed artist doesn\'t hope to be discovered. They arrive prepared: the right song, a voice built for it, the performance rehearsed, and a clear story about who they are. That is what the industry is actually looking for.' },

  {t:'credit', tag:'Why me', h:'Three decades in the room.',
    credit:'Valerie Fahren is a Los Angeles artist development specialist, celebrity vocal coach, and record producer with over 30 years in the music industry. She has worked with artists including Alison Sudol, Edgar Winter, Neil Diamond, and Juliette Lewis, and with Grammy winning producers and A and R. Her students have signed with Virgin and Geffen Records and been cast in Broadway productions and national tours.' },

  {t:'content', tag:'The standard', h:'By audition only. A limited number of artists a year.',
    body:'Real development takes real attention, so only a small number of artists are taken on each year. The work is private, structured, and built entirely around you.' },

  {t:'content', tag:'Recap', h:'The path, in one view.',
    bullets:['A technique plan built to your instrument','Audition and performance preparation','Songwriting and music theory','The twice yearly industry showcase','The record company pitch and positioning'] },

  {t:'cta', kicker:'Your next step', h:'Ready to be developed?',
    sub:'If you\'re serious about the career and not just the voice, request an interview. A limited number of artists are taken on each year.',
    pill:'Request an interview at valeriefahren.com',
    disc:'This masterclass is educational. It describes an artist development process, not a promise of a specific outcome. Results depend on the individual artist; no recording deal, casting, or income result is guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('div');
  el.className = 'slide' + (s.t==='section' ? ' section':'') + (s.t==='cta' ? ' cta':'');
  let h = '';
  if(s.tag) h += '<div class="tag">'+s.tag+'</div>';
  h += '<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='reframe'){
    h += '<div class="big">'+s.big+'</div><div class="rule"></div>';
    if(s.body) h += '<div class="body">'+s.body+'</div>';
  } else if(s.t==='credit'){
    if(s.h) h += '<h2>'+s.h+'</h2><div class="rule"></div>';
    if(s.credit) h += '<div class="credit">'+s.credit+'</div>';
  } else {
    if(s.h) h += (s.t==='title'||s.t==='cta'||s.t==='section' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
    if(s.t==='title'||s.t==='section') h += '<div class="rule"></div>';
    if(s.sub) h += '<div class="sub">'+s.sub+'</div>';
    if(s.body) h += '<div class="body">'+s.body+'</div>';
    if(s.bullets){ h += '<ul>'; s.bullets.forEach(b=>h+='<li>'+b+'</li>'); h += '</ul>'; }
    if(s.pill) h += '<div class="pill">'+s.pill+'</div>';
    if(s.disc) h += '<div class="disc">'+s.disc+'</div>';
  }
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
