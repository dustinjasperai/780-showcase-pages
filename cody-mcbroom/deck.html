<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Your Diet Stopped Working | Tailored Coaching Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Work+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCFAF4; --panel:#FFFFFF; --rule:#E7E0D2;
    --ink:#17130b; --accent:#f1c04a; --secondary:#bda07b; --muted:#6a6a6a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,Arial,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 52px;margin:0 0 22px;box-shadow:0 1px 0 rgba(0,0,0,.03)}
  .kicker{font-family:"Work Sans";font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--secondary);margin-bottom:16px}
  h1{font-family:"Anton",sans-serif;font-weight:400;line-height:.98;letter-spacing:.01em;
    font-size:clamp(38px,6vw,68px);text-transform:uppercase}
  h2{font-family:"Anton",sans-serif;font-weight:400;line-height:1.02;
    font-size:clamp(28px,4.4vw,46px);text-transform:uppercase}
  .lede{font-size:clamp(17px,2.1vw,21px);line-height:1.5;color:var(--ink);margin-top:18px;max-width:62ch}
  .sub{font-size:16px;line-height:1.55;color:var(--muted);margin-top:14px;max-width:64ch}
  .accentbar{height:8px;width:96px;background:var(--accent);border-radius:6px;margin:0 0 26px}
  ul{list-style:none;margin-top:22px}
  li{position:relative;padding:14px 0 14px 40px;border-top:1px solid var(--rule);
    font-size:17px;line-height:1.45}
  li:before{content:"";position:absolute;left:0;top:20px;width:16px;height:16px;border-radius:4px;
    background:var(--accent)}
  .phase{display:flex;gap:14px;flex-wrap:wrap;margin-top:26px}
  .chip{flex:1 1 180px;border:1px solid var(--rule);border-radius:10px;padding:18px 18px;background:var(--bg)}
  .chip .n{font-family:"Anton";font-size:30px;color:var(--secondary)}
  .chip h3{font-family:"Anton";font-weight:400;text-transform:uppercase;font-size:22px;margin:4px 0 8px}
  .chip p{font-size:14.5px;color:var(--muted);line-height:1.45}
  .big{font-family:"Anton";font-size:clamp(30px,5vw,52px);text-transform:uppercase;color:var(--accent)}
  .disc{font-size:12.5px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:70ch}
  .cta{font-size:19px;font-weight:600;margin-top:20px}
  .page{font-size:12px;color:var(--secondary);letter-spacing:.12em;text-transform:uppercase;margin-top:8px}
  .brand{font-family:"Anton";text-transform:uppercase;letter-spacing:.02em;color:var(--secondary);font-size:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:"A Tailored Coaching Method Masterclass",
    h:"Why Your Diet Stopped Working",
    lede:"The science of metabolic adaptation, and the three-phase method for losing fat in a way that actually lasts.",
    foot:"Presented live by Cody McBroom"},

  {t:'who',
    kick:"Who this is for",
    h:"You've Dieted Before. It Worked. Then It Didn't.",
    lede:"This is for the lifter who has lost the weight once, watched it come back, and is tired of starting over.",
    l:["You count calories and macros, or you have before",
       "You train hard but the scale and the mirror have stalled",
       "Every plan works for a few weeks, then stops",
       "You want a method you can run for life, not another 12-week crash"]},

  {t:'trap',
    kick:"The trap",
    h:"The Problem Is Not Your Willpower",
    lede:"You were told fat loss is simple: eat less, move more, push harder. So when it stops working, you assume you failed.",
    sub:"You did not fail. You ran a plan that was designed to stop working. Cutting harder and harder is the exact thing that shuts your results down."},

  {t:'reframe',
    kick:"The reframe",
    h:"Your Body Adapts On Purpose",
    big:"Dieting harder makes you better at dieting, not leaner.",
    sub:"Every week in a deficit, your body defends itself: metabolism slows, hunger rises, energy drops, output falls. This is metabolic adaptation. It is not a malfunction. It is biology doing its job, and it is the real reason your diet stopped working."},

  {t:'part',
    kick:"Part One",
    h:"The Core Problem: Metabolic Adaptation",
    lede:"Fat loss is not one long deficit. It is a game of managing how fast your body adapts against it."},

  {t:'list',
    kick:"Part One",
    h:"What Adaptation Actually Does",
    l:["Your maintenance calories fall as you lose weight",
       "Non-exercise movement quietly drops, so you burn less all day",
       "Hunger and cravings climb while fullness signals fade",
       "The same deficit that worked in week 2 does nothing by week 10"]},

  {t:'list',
    kick:"Part One",
    h:"So Most People Do The Worst Thing",
    lede:"When results stall, the instinct is to punish harder.",
    l:["Cut calories again, then again",
       "Add more cardio on top of more cardio",
       "White-knuckle it until the binge, then start over Monday",
       "Repeat until the metabolism is beaten down and trust is gone"]},

  {t:'part',
    kick:"Part Two",
    h:"The Method: Prime, Progress, Prosper",
    lede:"Instead of fighting adaptation, you sequence your nutrition in three phases so your body stays willing to let the fat go."},

  {t:'phases',
    kick:"Part Two",
    h:"Three Phases, One System",
    phases:[
      {n:"01",title:"Prime",p:"Before any deficit, build the metabolism up. Eat at or above maintenance, lift with intent, and raise the ceiling you will diet down from."},
      {n:"02",title:"Progress",p:"Now run the fat-loss phase. A measured deficit, adjusted to real data, held only as long as it keeps producing. Pull back before the body digs in."},
      {n:"03",title:"Prosper",p:"Reverse out on purpose. Walk calories back up, hold the result, and keep the physique without living in a permanent diet."}]},

  {t:'list',
    kick:"Part Two",
    h:"Why The Order Matters",
    l:["A primed metabolism loses fat faster on more food",
       "Shorter, sharper deficits beat endless slow starvation",
       "Planned reverses protect the result you worked for",
       "You spend most of the year not dieting, which is the point"]},

  {t:'list',
    kick:"Part Two",
    h:"Metric-Based, Not Meal-Plan-Based",
    lede:"The method is individualized to you with real numbers, not a printout someone handed a thousand people.",
    l:["Macros set from your bodyweight, training and lifestyle",
       "Adjusted off weekly data: weight trend, measurements, performance, hunger",
       "Flexible foods you actually eat, so adherence holds",
       "Built from your history, not a menu"]},

  {t:'part',
    kick:"Part Three",
    h:"Run It For Life, Not For Twelve Weeks",
    lede:"A method you can hold through travel, busy weeks, holidays and plateaus, for years."},

  {t:'list',
    kick:"Part Three",
    h:"The Shift",
    l:["From chasing the scale to reading the full picture",
       "From all-or-nothing to adjust-and-continue",
       "From dreading maintenance to using it as a tool",
       "From another restart to a method you keep for life"]},

  {t:'why',
    kick:"Why learn it here",
    h:"Who Is Teaching This",
    lede:"Cody McBroom, founder of the Tailored Coaching Method and host of the Choose Hard podcast.",
    l:["13+ years coaching, credentialed sports nutritionist and strength coach",
       "A podcast with more than 5 million downloads",
       "Thousands of everyday clients and documented transformations",
       "A coach who lives the method, down 45+ pounds himself and still training as a hybrid athlete"]},

  {t:'recap',
    kick:"Recap",
    h:"The Whole Method In One Breath",
    l:["Your diet stalled because your body adapted, not because you are weak",
       "Dieting harder speeds the adaptation and shuts results down",
       "Prime the metabolism, progress through a measured deficit, prosper on the reverse",
       "Run it with real numbers, individualized to you, for life"]},

  {t:'cta',
    kick:"Your next step",
    h:"Want This Built Around You?",
    lede:"If you want the Prime, Progress, Prosper method individualized to your body, your training and your life, the next step is a free Strategy Call with a Tailored Coaching Method coach. We map your starting point and show you exactly how your plan would run.",
    cta:"Apply for a free Strategy Call at tailoredcoachingmethod.com",
    disc:"Educational content only. No income or result is guaranteed. Results vary by individual, effort, consistency and starting point. Nutrition and training information presented here is general and is not medical advice; consult your physician before beginning any program."}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s,i){
  var d=el('div','slide');
  if(s.kick)d.appendChild(el('div','kicker',s.kick));
  if(s.t==='title'){d.appendChild(el('div','accentbar'));}
  if(s.h){d.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));}
  if(s.big)d.appendChild(el('div','big',s.big));
  if(s.lede)d.appendChild(el('div','lede',s.lede));
  if(s.sub)d.appendChild(el('div','sub',s.sub));
  if(s.l){var ul=el('ul');s.l.forEach(function(x){ul.appendChild(el('li',null,x));});d.appendChild(ul);}
  if(s.phases){var w=el('div','phase');s.phases.forEach(function(p){
    var c=el('div','chip');c.appendChild(el('div','n',p.n));c.appendChild(el('h3',null,p.title));
    c.appendChild(el('p',null,p.p));w.appendChild(c);});d.appendChild(w);}
  if(s.cta)d.appendChild(el('div','cta',s.cta));
  if(s.foot)d.appendChild(el('div','sub',s.foot));
  if(s.disc)d.appendChild(el('div','disc',s.disc));
  d.appendChild(el('div','page',(i+1)+' / '+S.length));
  deck.appendChild(d);
});
</script>
</body>
</html>
