<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Extraordinary Mix - Samantha Leith</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a;        /* her dominant dark navy (brand.json ranked hex) */
    --panel:#1f2a3a;     /* lifted navy */
    --rule:#33415a;
    --accent:#cd188d;    /* her magenta, the sparkle signal (brand.json ranked hex) */
    --accent-soft:#f4c9e6;
    --ink:#f4f0ea;
    --muted:#aeb7c6;
    --display:'Abril Fatface',Georgia,serif;
    --body:'Jost',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 120px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:64px 60px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:66px;line-height:1.02;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:600;font-size:46px;line-height:1.08;margin-bottom:20px}
  .sub{font-size:21px;color:var(--muted);font-weight:300;line-height:1.5;max-width:42ch}
  p.lead{font-size:22px;line-height:1.55;font-weight:300;max-width:48ch;margin-bottom:14px}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;font-weight:400;padding-left:30px;position:relative;margin-bottom:16px;max-width:54ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:50%}
  .cline{font-family:var(--display);font-size:34px;font-weight:600;color:var(--accent-soft);margin-top:12px}
  .title-slide{align-items:flex-start}
  .title-slide h1{font-size:74px}
  .num{position:absolute;right:46px;bottom:28px;font-family:var(--display);font-size:17px;color:var(--muted)}
  .disclaimer{font-size:14px;color:var(--muted);font-weight:300;line-height:1.5;max-width:62ch;margin-top:26px}
  .cta-steps{font-size:20px;line-height:1.65;margin-top:10px}
  .cta-steps b{color:var(--accent-soft)}
  @media(max-width:640px){.slide{padding:42px 28px;min-height:auto}h1,.title-slide h1{font-size:44px}h2{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A masterclass with Samantha Leith',h:'Ordinary to Extraordinary',sub:'How women step back into real confidence after 45, using the Extraordinary Mix.'},
 {t:'for',kicker:'Who this is for',h:'You have already achieved a lot.',body:['You remember your childhood dreams and quietly wonder what happened.','People say you have done so much, but they cannot hear the nagging inside your head.','You know in your bones your story still feels unfinished.']},
 {t:'for2',kicker:'Who this is for',h:'And life has moved the goalposts.',body:['Maybe you are a CEO. Maybe you are an empty nester.','Maybe you are navigating menopause, ADHD, or just wondering what is next at 45 plus.','Even the most capable women wobble, especially stuck in a comparison loop online.']},
 {t:'trap',kicker:'The trap',h:'The messy middle.',lead:'Somewhere after the origin story, the spark dims. Self-doubt, hormones, old habits and the noise of everyday life quietly convince you the best chapters are behind you.',note:'They are not. The story just feels unfinished.'},
 {t:'cost',kicker:'The cost',h:'Ordinary is comfortable, and expensive.',body:['Another year of shrinking your goals to fit the room.','Another decision you circle but never make.','Another version of you the world never gets to meet.']},
 {t:'reframe',kicker:'The reframe',h:'Confidence is not what you think it is.',lead:'It is not about your age, your weight, your bank balance or your likes.',cline:'It is about embracing who you are and living unapologetically.'},
 {t:'p1',kicker:'Part one, the real problem',h:'You did not lose your confidence. You buried it.',body:['We are all born Extraordinary, but most of us lose the spark along the way.','More motivation and another pep talk do not dig it back up.','It comes back when you rebuild four things, on purpose, in the right order.']},
 {t:'p1b',kicker:'Part one, the real problem',h:'Why willpower keeps failing you.',lead:'You cannot think your way into confidence while clarity, courage and charisma are still missing. Work one C in isolation and the others pull you back to ordinary.',note:'The fix is a blend, not a single fix.'},
 {t:'p2head',kicker:'Part two, the method',h:'The Extraordinary Mix',sub:'Four Cs that, blended together, turn Ordinary back into Extraordinary.'},
 {t:'c',kicker:'The Extraordinary Mix, 1 of 4',h:'Confidence',lead:'So you go after your biggest goals instead of shrinking them to fit the room.',cline:'Built, not waited for.'},
 {t:'c',kicker:'The Extraordinary Mix, 2 of 4',h:'Clarity',lead:'So you can actually decide what you want next, instead of drifting in the messy middle.',cline:'Name it to claim it.'},
 {t:'c',kicker:'The Extraordinary Mix, 3 of 4',h:'Courage',lead:'So you can face whatever life throws at you and take the next step anyway.',cline:'Scared, and moving.'},
 {t:'c',kicker:'The Extraordinary Mix, 4 of 4',h:'Charisma',lead:'So you share who you are with the world and people pay attention.',cline:'Your leading lady energy.'},
 {t:'mix',kicker:'The mix',h:'The two pairs that do the work.',lead:'Confidence and Charisma so people pay attention. Clarity and Courage so you go after what you really want.',note:'Blended, that is the Extraordinary Mix. No single C does it alone.'},
 {t:'p3',kicker:'Part three, your Extraordinary week',h:'What changes when the mix comes back.',body:['You speak up in the room you used to shrink in.','You make the decision you have circled for a year.','You stop waiting to feel ready, and start, in sequins if you like.']},
 {t:'p3b',kicker:'Part three, your Extraordinary week',h:'It compounds.',lead:'Each small act of confidence makes the next one easier. Clarity sharpens, courage grows, and your charisma stops being something you fake and starts being something people feel.'},
 {t:'why',kicker:'Why me',h:'I have lived the reinvention.',body:['ADHD, perimenopause, single motherhood, weight battles, career reinventions, heartbreak and high heels.','I believe in you until you believe in yourself.','I know transformation is possible at every age and for everybody.'],note:'Samantha Leith, speaker and coach for midlife women.'},
 {t:'recap',kicker:'The one thing to remember',h:'You were born Extraordinary.',lead:'Confidence, Clarity, Courage and Charisma are not gone. They are buried, and they are yours to rebuild, starting now.'},
 {t:'cta',kicker:'Your next step',h:'Ready for your Extraordinary life?',steps:['Start with <b>The Club</b>, my coaching community for dreamers, believers and action takers.','Or go deeper with <b>one-on-one coaching</b> and build your own Extraordinary Mix.','Find it all at <b>samanthaleith.com</b>.'],disclaimer:'This masterclass is for education and inspiration only. It is not therapy or medical advice, and it makes no guarantee of any specific result. Your outcomes depend on your own effort and circumstances.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='title'?' title-slide':'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h) h+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.cline) h+='<div class="cline">'+s.cline+'</div>';
  if(s.body){h+='<ul>';s.body.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.steps){h+='<div class="cta-steps">';s.steps.forEach(b=>h+='<div>'+b+'</div>');h+='</div>';}
  if(s.note) h+='<p class="lead" style="color:var(--accent-soft);font-size:18px;margin-top:18px">'+s.note+'</p>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
