<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Truck Isn't The Business &middot; Kyle Landwehr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F7F4EC; --panel:#FFFFFF; --rule:#E2DCC8;
    --acc:#8A6423; --idx:#6B4C18; --chalk:#211C14; --grey:#544B3B; --dim:#8C816C;
  }
  html,body{height:100%}
  body{background:#161209;font-family:'Archivo',Arial,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#161209}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Archivo',Arial,sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.6vw;max-width:88%}
  .t-normal h1{font-size:2.7vw;max-width:84%}
  .t-normal .body{font-family:'Archivo',Arial,sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.6;font-weight:400}
  .sub{font-family:'Archivo',Arial,sans-serif;font-size:1.5vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Archivo',sans-serif;font-size:1.3vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#2E2411 0%,#161209 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Zilla Slab',Georgia,serif;font-size:2.7vw;max-width:78%;font-style:italic;font-weight:500;color:#F3EFE3}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2E2411 0%,#161209 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.3vw;max-width:82%;color:#F3EFE3}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#F0E1BF;border-radius:100px;padding:1.3vh 1.6vw;font-family:'Archivo',sans-serif;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Archivo',Arial,sans-serif;font-size:.88vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-dark .disc,.t-cta .disc{color:#9C8F73}
  .cut-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-cut{right:6%;bottom:9%;width:17vw}
  .corner-cut{right:5%;bottom:8%;width:9vw;opacity:.5}
  .brandline{font-family:'Archivo',sans-serif;font-size:1.2vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.14em;color:#C8BEA5;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Archivo',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#C8BEA5;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Archivo',sans-serif;font-size:11px;color:#C8BEA5;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.8vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Junk Academy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- cut-line motif: a carbon-copy job-ticket tear line with perforation dots -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="cutline" viewBox="0 0 260 40">
  <circle cx="8" cy="20" r="4.5" fill="#8A6423"/>
  <line x1="20" y1="20" x2="240" y2="20" stroke="#8A6423" stroke-width="3" stroke-dasharray="13 10" stroke-linecap="round"/>
  <circle cx="252" cy="20" r="4.5" fill="#8A6423" opacity="0.55"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Truck Isn\'t The Business',sub:'A live masterclass for junk removal business owners ready to stop trading time for money, built from Kyle Landwehr\'s own teaching.',brand:true,signal:'title'},
 {t:'normal',k:'Who this is for',title:'You can run any job. Right now the company only runs when you\'re driving.',body:'You quote the job, run the crew, drive the truck, and chase the invoice. That makes you good at junk removal. It does not make you the owner of a company yet, it makes you the most important employee in it.'},
 {t:'dark',title:'A truck earns money when you\'re driving it. A company earns money whether you are or not.'},

 {t:'section',idx:'Part One',title:'The Job That\'s Just You'},
 {t:'normal',k:'The trap',title:'Busy every day and still one slow month from broke.',body:'Every quote that only you can write, every account only you can manage, is a ceiling on how big this gets. Junk removal is seasonal by nature. If marketing only happens when the phone goes quiet, you are always chasing the last slow month instead of getting ahead of the next one.'},
 {t:'normal',k:'What full trucks actually cost',title:'A full schedule is not the same as a company that is worth something.',body:'Revenue that requires you personally on every job is wages with a truck payment attached. A company is worth something to someone else, which means it has to run without you standing in the driveway.'},
 {t:'dark',title:'A company that only works when you\'re in it is not a company. It is a job with a truck payment.'},

 {t:'section',idx:'Part Two',title:'The Three-Module Shift'},
 {t:'normal',k:'Module one, foundations',title:'Get the basics right before you scale a mistake.',body:'What truck to actually buy, what manpower to hire or outsource, and what to charge so a job pays for itself and then some. Getting this wrong early just means scaling the same mistake faster later.'},
 {t:'normal',k:'Module two, lead generation',title:'Stay busy in every season, not just the easy ones.',body:'Junk removal demand swings hard by time of year. Owners who only market when the calendar goes quiet are always a step behind. This module is built specifically to keep leads coming year-round, not just during the predictable rush.'},
 {t:'normal',k:'Module three, systems and structure',title:'Stop trading time for money.',body:'This is Kyle\'s own framing for the module: building the structure underneath the company so it stops depending on your personal hours. Crew structure, dispatch, and pricing systems that work whether or not you\'re the one behind the wheel that day.'},
 {t:'dark',title:'None of this makes you a bigger hauler. All of it makes you a real owner.'},

 {t:'section',idx:'Part Three',title:'Inside A Small Junk Removal Company'},
 {t:'normal',k:'What the community is for',title:'A private group and weekly calls, not a course you finish alone.',body:'Access to a private Facebook community of other junk removal owners plus weekly bonus group coaching calls. The point is not a certificate, it is somewhere to bring the actual problem in your business that week and work through it with people doing the same job.'},
 {t:'normal',k:'Why Kyle Landwehr',title:'He scaled his own company first, then built the room he wished existed.',body:'Kyle owns Slam Dunkin Junk, a St. Louis junk removal company he took from $0 to past $1 million in revenue in roughly two years. He built The Junk Academy in 2022 to teach other owners the same path, and has enrolled 250 to 330-plus students since.'},

 {t:'section',idx:'Your Next Step',title:'Bring This Into Your Business'},
 {t:'normal',k:'How it\'s delivered',title:'The Junk Academy: three modules, a private community, and weekly calls.',body:'Foundations, lead generation, and systems and structure, taught by an owner who ran the exact playbook on his own trucks first. Enrollment includes the private Facebook community and weekly bonus group coaching calls.'},
 {t:'normal',k:'What actually happens',title:'Work through your own business, not a generic case study.',body:'The modules are built around real junk removal operations: what to charge, how to keep the phone ringing in a slow month, and how to build the systems that let the company run without you on every job.'},

 {t:'cta',title:'Ready to stop trading time for money?',chips:['Join The Junk Academy','The Junk Academy'],disc:'Educational content for junk removal business owners. No income or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="cut-motif ${kind==='title'?'title-cut':'corner-cut'}"><use href="#cutline"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Junk <b>Academy</b> &middot; Kyle Landwehr</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.signal) h+=motif(s.signal);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
