<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>You Didn't Buy a Job - A Masterclass with April Porter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display+SC:wght@400;700;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17130d; --panel:#211a10; --rule:#3a2f1e;
  --accent:#b69865; --chalk:#f2ebdd; --dim:#b3a892;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--chalk);font-family:"Inter",system-ui,sans-serif}
.deck{max-width:1040px;margin:0 auto;padding:48px 24px 120px}
.slide{position:relative;min-height:74vh;display:flex;flex-direction:column;justify-content:center;
  padding:56px 52px;margin:0 0 30px;background:
    radial-gradient(130% 100% at 0% 0%, var(--panel) 0%, var(--bg) 70%);
  border:1px solid var(--rule);border-radius:18px;overflow:hidden}
.slide::after{content:"";position:absolute;inset:0;pointer-events:none;opacity:.05;
  background-image:radial-gradient(var(--chalk) .5px,transparent .5px);background-size:4px 4px}
.kick{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
  font-weight:600;margin-bottom:22px}
.disp{font-family:"Playfair Display SC",Georgia,serif;line-height:1.04;font-weight:900;
  letter-spacing:.01em}
h1.disp{font-size:clamp(34px,6vw,68px)}
h2.disp{font-size:clamp(28px,4.4vw,48px);font-weight:700}
.lead{font-size:clamp(18px,2.2vw,24px);color:var(--dim);margin-top:24px;max-width:40ch;line-height:1.5}
.sig{margin-top:30px;font-size:15px;color:var(--dim)}
.sig b{color:var(--chalk);font-weight:600}
.big{font-family:"Playfair Display SC",Georgia,serif;font-size:clamp(60px,12vw,150px);
  color:var(--accent);font-weight:900;line-height:1}
.row{display:flex;gap:20px;flex-wrap:wrap;margin-top:30px}
.col{flex:1 1 220px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px}
.col .n{font-family:"Playfair Display SC",serif;color:var(--accent);font-size:22px;margin-bottom:10px}
.col p{color:var(--dim);font-size:16px;line-height:1.5}
.list{margin-top:26px;list-style:none;max-width:52ch}
.list li{position:relative;padding:14px 0 14px 34px;border-bottom:1px solid var(--rule);
  font-size:clamp(17px,2vw,21px)}
.list li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
  background:var(--accent);border-radius:2px;transform:rotate(45deg)}
.part .big{opacity:.9}
.seats{display:flex;gap:18px;margin-top:30px;flex-wrap:wrap}
.seat{flex:1 1 260px;border:1px solid var(--rule);border-radius:14px;padding:26px;background:var(--panel)}
.seat h3{font-family:"Playfair Display SC",serif;font-size:20px;margin-bottom:12px}
.seat.e h3{color:var(--dim)} .seat.c h3{color:var(--accent)}
.seat p{color:var(--dim);font-size:15px;line-height:1.55}
.ladder{display:flex;gap:10px;margin-top:30px;flex-wrap:wrap}
.rung{flex:1 1 150px;border:1px solid var(--rule);border-radius:12px;padding:18px;background:var(--panel)}
.rung b{display:block;color:var(--accent);font-family:"Playfair Display SC",serif;margin-bottom:6px}
.rung span{color:var(--dim);font-size:14px}
.rung.last{background:var(--accent);color:var(--bg)} .rung.last b,.rung.last span{color:var(--bg)}
.disc{margin-top:28px;font-size:13px;color:var(--dim);max-width:60ch;line-height:1.5}
.pagenum{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--dim);letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with April Porter',
   h:"You Didn't Buy a Job.<br>You Bought a Business.",
   lead:'The jump from employee to CEO that your franchisor never trained you to make.'},

  {t:'who', kick:'Who this is for',
   h:'You signed. You opened. You run it.',
   lead:'This hour is for the franchise owner who did everything right and still ended up being the hardest-working employee in their own building.'},

  {t:'reframe', kick:'The trap',
   h:'You followed the playbook.',
   lead:'So why are you still the one unlocking the door at 5am, covering shifts, and answering every question yourself?'},

  {t:'stat', kick:'The number nobody mentions at discovery day',
   big:'~50%',
   lead:'of franchises close within five years, about the same rate as independent small businesses. The brand is not the problem. The seat you are sitting in is.'},

  {t:'reframe', kick:'The real gap',
   h:'Franchisors are built to sell units.',
   lead:'Not to grow owners. Opening day is where their training ends and the real job begins, and almost no one hands you that curriculum.'},

  {t:'part', kick:'Part one', big:'The two seats',
   lead:'Why working harder has never once fixed this.'},

  {t:'seats', kick:'It was never about hours',
   h:'Employee seat vs CEO seat',
   e:{h:'The employee seat', p:'You are the best worker in the building. Every decision routes through you. The business cannot run a day without you in it.'},
   c:{h:'The CEO seat', p:'You own the numbers, the team, and the time. The business runs on systems you built, so it keeps running when you step out.'}},

  {t:'list', kick:'Signs you never left the employee seat',
   h:'Be honest about the chair.',
   items:['You cannot take a full week off without the store wobbling.',
          'You are still the one who closes, covers, and fixes.',
          'Your income went up, but your hours went up faster.',
          'Every new problem lands on your desk by default.']},

  {t:'part', kick:'Part two', big:'The method',
   lead:'The Infinite Franchisee Program, in one hour.'},

  {t:'framework', kick:'The Infinite Franchisee Program',
   h:'A sequential 12-month curriculum.',
   lead:'Not a shelf of random webinars. Each month builds on the last, moving you deliberately from the employee seat to the CEO seat.'},

  {t:'ladder', kick:'The path',
   h:'Employee to CEO, in order.',
   rungs:[{b:'Mo 1-3', s:'See the numbers'},{b:'Mo 4-6', s:'Build the team'},
          {b:'Mo 7-9', s:'Buy back your time'},{b:'Mo 10-12', s:'Scale as the CEO'}]},

  {t:'row', kick:'The three moves off the wheel',
   h:'What the CEO seat actually requires.',
   cols:[{n:'See the numbers', p:'Run the unit on business intelligence, not vibes. Know your real drivers before you make a single decision.'},
         {n:'Build the team', p:'Hire and develop a manager who runs the floor, so the floor stops running you.'},
         {n:'Buy back your time', p:'Install the systems that let the business operate without you unlocking the door.'}]},

  {t:'framework', kick:'The scoreboard',
   h:'Sanity, Wealth, and Gratitude.',
   lead:'Revenue is one number. SWAG is the scoreboard that keeps you in the business long enough to actually win it.'},

  {t:'row', kick:'The SWAG scoreboard',
   h:'What winning really measures.',
   cols:[{n:'Sanity', p:'A business that does not cost you your health, your evenings, or your family.'},
         {n:'Wealth', p:'Profit and equity you can feel, not just top-line revenue you report.'},
         {n:'Gratitude', p:'Still glad you bought it, because you own a business instead of a second job.'}]},

  {t:'part', kick:'Part three', big:'Two owners, one brand',
   lead:'Same market, same system to buy. Different seat.'},

  {t:'seats', kick:'A week in each seat',
   h:'Same business, different chair.',
   e:{h:'Still the employee', p:'Six opens a week. On call for every issue. Growth means one more thing on your own plate.'},
   c:{h:'Finally the CEO', p:'In twice a week by design. The manager runs the day. Growth means opening the next unit, not adding hours.'}},

  {t:'proof', kick:'Why me',
   h:'I ran the numbers before I ran the unit.',
   lead:'Former criminal judge and prosecutor. I opened my first fitness franchise, scaled to four units into the brand's top 20% in under three years on minimal weekly hours, then sold. The Infinite Franchisee Program is the exact path I used.'},

  {t:'reframe', kick:'The decision',
   h:'You can keep grinding.',
   lead:'Or you can change seats. The business will not do it for you, and the franchisor will not either. That part is yours.'},

  {t:'cta', kick:'Your next step',
   h:'Ready to change seats?',
   lead:'If you want the 12-month path mapped to your business, the next step is a conversation with my team. Apply through the page you came in on and we will take it from there.',
   disc:'This masterclass is educational. No specific result, revenue, or income is guaranteed. Results vary and depend on your own work, your market, your brand, and factors outside anyone's control.'}
];

const D = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.t==='title'){ html += '<h1 class="disp">'+s.h+'</h1><p class="lead">'+s.lead+'</p>'+
    '<div class="sig">with <b>April Porter</b> &middot; Ask April Porter</div>'; }
  else if(s.t==='stat'){ html += '<div class="big">'+s.big+'</div><p class="lead">'+s.lead+'</p>'; }
  else if(s.t==='part'){ html += '<div class="big">'+s.big+'</div><p class="lead">'+(s.lead||'')+'</p>'; }
  else if(s.t==='seats'){ html += '<h2 class="disp">'+s.h+'</h2><div class="seats">'+
    '<div class="seat e"><h3>'+s.e.h+'</h3><p>'+s.e.p+'</p></div>'+
    '<div class="seat c"><h3>'+s.c.h+'</h3><p>'+s.c.p+'</p></div></div>'; }
  else if(s.t==='list'){ html += '<h2 class="disp">'+s.h+'</h2><ul class="list">'+
    s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  else if(s.t==='row'){ html += '<h2 class="disp">'+s.h+'</h2><div class="row">'+
    s.cols.map(c=>'<div class="col"><div class="n">'+c.n+'</div><p>'+c.p+'</p></div>').join('')+'</div>'; }
  else if(s.t==='ladder'){ html += '<h2 class="disp">'+s.h+'</h2><div class="ladder">'+
    s.rungs.map((r,j)=>'<div class="rung'+(j===s.rungs.length-1?' last':'')+'"><b>'+r.b+'</b><span>'+r.s+'</span></div>').join('')+'</div>'; }
  else if(s.t==='cta'){ html += '<h1 class="disp">'+s.h+'</h1><p class="lead">'+s.lead+'</p>'+
    '<p class="disc">'+s.disc+'</p>'; }
  else { html += '<h2 class="disp">'+s.h+'</h2>'+(s.lead?'<p class="lead">'+s.lead+'</p>':''); }
  html += '<div class="pagenum">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  el.innerHTML = html;
  D.appendChild(el);
});
</script>
</body>
</html>
