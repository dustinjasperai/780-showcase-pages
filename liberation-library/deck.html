<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Classroom as a Site of Liberation — a masterclass with Evalaurene Jean-Charles</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Saira+Stencil+One&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3ef;        /* light bone ground, from site light scheme */
    --panel:#ffffff;
    --rule:#d8d2c8;
    --ink:#1a1420;       /* warm near-black */
    --muted:#5a5460;
    --accent:#4a0e6d;    /* deep purple, from brand.json (rank 2) */
    --accent-soft:#ede4f3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Courier Prime",monospace;
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);
    border-radius:4px;padding:56px 56px 52px;margin:0 0 22px;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;
    position:relative;box-shadow:0 1px 0 rgba(0,0,0,.02);
  }
  .kicker{
    font-family:"Courier Prime",monospace;font-weight:700;
    letter-spacing:.22em;text-transform:uppercase;font-size:12px;
    color:var(--accent);margin-bottom:22px;
  }
  h1{
    font-family:"Saira Stencil One",system-ui;font-weight:400;
    font-size:clamp(34px,5.4vw,58px);line-height:1.02;letter-spacing:.01em;
    text-transform:uppercase;margin-bottom:20px;
  }
  h2{
    font-family:"Saira Stencil One",system-ui;font-weight:400;
    font-size:clamp(26px,3.6vw,40px);line-height:1.06;text-transform:uppercase;
    margin-bottom:18px;
  }
  p{font-size:18px;line-height:1.6;max-width:60ch;margin-bottom:14px;color:var(--ink)}
  p.lead{font-size:21px}
  .muted{color:var(--muted)}
  .accentbar{width:64px;height:6px;background:var(--accent);margin:0 0 26px}
  ul{list-style:none;margin:8px 0 0}
  li{
    font-size:18px;line-height:1.5;padding:12px 0 12px 26px;position:relative;
    border-top:1px solid var(--rule);max-width:64ch;
  }
  li:first-child{border-top:none}
  li:before{content:"//";position:absolute;left:0;color:var(--accent);font-weight:700}
  .pill{
    display:inline-block;font-weight:700;text-transform:uppercase;letter-spacing:.16em;
    font-size:11px;color:#fff;background:var(--accent);padding:6px 12px;border-radius:2px;
    margin-bottom:22px;
  }
  .big{font-family:"Saira Stencil One",system-ui;font-size:clamp(40px,6vw,72px);
    text-transform:uppercase;line-height:1;color:var(--accent)}
  .pillar-n{font-family:"Saira Stencil One",system-ui;
    -webkit-text-stroke:1.4px var(--accent);color:transparent;
    font-size:clamp(56px,9vw,120px);line-height:.9;margin-bottom:10px}
  .foot{position:absolute;bottom:18px;left:56px;right:56px;display:flex;
    justify-content:space-between;font-size:11px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .disclaimer{font-size:12px;color:var(--muted);line-height:1.5;margin-top:22px;
    border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .cta-list li:before{content:"→"}
  @media(max-width:620px){.slide{padding:36px 24px 44px;min-height:auto}.foot{position:static;margin-top:28px;padding:0}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'agenda', k:'What today gives you', h:'Three shifts, one hour.', body:[
    'A way to run the room that does not run on your last nerve.',
    'A way to raise rigor and raise joy at the same time, instead of trading one for the other.',
    'A way to stay in this work without letting it hollow you out.'
  ]},
  {t:'content', k:'Who this is for', h:'You did not sign up to be a warden.', body:[
    'You got into this to change lives. To make a room where young people think hard, feel seen, and want to come back.',
    'Instead you spend your energy managing behavior, defending your standards, and quietly wondering how long you can keep this up.',
    'This is for two teachers: the new one building a revolutionary classroom with no support, and the veteran who still believes in it and is running on empty.'
  ]},
  {t:'content', k:'The trap', h:'The false choice they hand you.', body:[
    'Control the room and you kill the joy. Keep the joy and you lose the rigor. Try to do both by sheer will and you burn out.',
    'So most classrooms quietly settle for compliance. Quiet gets mistaken for learning. And the teacher pays for that quiet twice.'
  ]},
  {t:'content', k:'The reframe', h:'Burnout is not a you problem.', body:[
    'It is a system doing exactly what it was built to do.',
    'The way out is not working harder inside it. It is teaching differently: building your classroom as a site of liberation, where rigor and joy hold each other up instead of fighting.'
  ]},
  {t:'section', part:'Part One', h:'Why good teachers break.'},
  {t:'content', k:'The core problem', h:'Compliance costs you twice.', body:[
    'A compliance classroom runs on your energy. You are the battery. The second you step back, it stalls.',
    'Students disengage because nothing in the room belongs to them. You exhaust yourself policing a room that was never designed to run on their investment.',
    'Rigor and joy get treated as opposites. They are not. They are the same engine.'
  ]},
  {t:'section', part:'Part Two', h:'The three sites of liberation.'},
  {t:'pillar', n:'01', k:'Pillar One', h:'Restorative classroom management.', body:[
    'Chaos ain\'t cute. Structure is what makes freedom safe.',
    'Repeatable systems and structures so the room runs without you holding it up, plus restorative responses instead of punitive ones. The rules serve the students, not the other way around.'
  ]},
  {t:'pillar', n:'02', k:'Pillar Two', h:'Engaging and collaborative instruction.', body:[
    'Start from the question every student is really asking: why would I care?',
    'Socratic seminars, real student choice, collaborative work students actually want to do. Rigor goes up when the work belongs to them, not down.'
  ]},
  {t:'pillar', n:'03', k:'Pillar Three', h:'Embodying the revolutionary teacher.', body:[
    'You cannot pour liberation from an empty cup.',
    'Boundaries: say no so you can say yes. Self-care systems built into the week, not bolted on when you crash. This is the pillar every other program skips.'
  ]},
  {t:'content', k:'The starting point', h:'The revolution starts with you.', body:[
    'Before the seating chart, before the unit plan, there is Revolutionary Educator Identity Mapping: naming your own values and who you are in the room.',
    'Almost every classroom-management program starts with the students. This one starts with the teacher, because a classroom can only be as free as the person leading it.'
  ]},
  {t:'section', part:'Part Three', h:'A Tuesday in a liberated classroom.'},
  {t:'content', k:'In practice', h:'A room that runs on their investment.', body:[
    'Students lead the seminar. Feedback loops shape the next lesson. The systems hold, so you are teaching instead of refereeing.',
    'Rigor is high because the work is real. Joy is high because the room is theirs. And you go home with something left in the tank.'
  ]},
  {t:'big', k:'The whole idea in one line', big:'Rigor and joy are resistance.', body:[
    'Not a reward for good behavior. Not a trade-off. The refusal to accept that young people must be bored or controlled in order to learn is itself the political act.'
  ]},
  {t:'bio', k:'Why me', h:'Who is teaching this.', body:[
    'Evalaurene Jean-Charles. History teacher in the Bronx. M.A.T. with Distinctions from Relay Graduate School of Education. 30 Under 30 (Ignite Caribbean, 2021).',
    'Founder of Black on Black Education and host of The Resistance Podcast. I teach this because I am still in the classroom living it.'
  ]},
  {t:'content', k:'The shift', h:'From surviving the system to building the site.', body:[
    'You stop asking how to last one more year inside a broken system.',
    'You start building the one room in that system that runs on liberation, and it turns out to be the most sustainable way to teach.'
  ]},
  {t:'cta', k:'Where to go from here', h:'Keep building with us.',
    lead:'If today gave you one thing to try Monday, the Liberation Library is where we keep going, together.',
    items:[
      'Two group coaching calls every month, working your real classroom challenges',
      'Weekly responsive PD on what teachers in the community are facing right now',
      'A community of aligned educators, so you stop doing this alone',
      'Want the full method first? Start with the self-paced Revolutionary Teaching course'
    ],
    disclaimer:'Educational content only. No specific outcome, income, or job result is guaranteed. Results vary by educator, classroom, and school context. Take what serves your students and your setting.'}
];

function slideHTML(s, i, n){
  if(s.t==='title'){
    return `<section class="slide">
      <div class="kicker">A live masterclass &middot; Black on Black Education</div>
      <div class="accentbar"></div>
      <h1>The classroom as a<br>site of liberation</h1>
      <p class="lead">How to teach with high rigor and high joy, without burning out.</p>
      <p class="muted">With Evalaurene Jean-Charles</p>
      <div class="foot"><span>The Resistance</span><span>${i+1} / ${n}</span></div>
    </section>`;
  }
  if(s.t==='section'){
    return `<section class="slide">
      <div class="pill">${s.part}</div>
      <h2>${s.h}</h2>
      <div class="accentbar"></div>
      <div class="foot"><span>Sites of Liberation</span><span>${i+1} / ${n}</span></div>
    </section>`;
  }
  if(s.t==='cta'){
    return `<section class="slide">
      <div class="kicker">${s.k}</div>
      <h2>${s.h}</h2>
      <div class="accentbar"></div>
      <p class="lead">${s.lead}</p>
      <ul class="cta-list">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>
      <p class="disclaimer">${s.disclaimer}</p>
      <div class="foot"><span>blackonblackeducation.com</span><span>${i+1} / ${n}</span></div>
    </section>`;
  }
  let inner = '';
  if(s.n) inner += `<div class="pillar-n">${s.n}</div>`;
  if(s.k) inner += `<div class="kicker">${s.k}</div>`;
  if(s.big){ inner += `<div class="big">${s.big}</div><div class="accentbar" style="margin-top:22px"></div>`; }
  else if(s.h){ inner += `<h2>${s.h}</h2><div class="accentbar"></div>`; }
  if(s.body){ inner += s.body.map(p=>`<p>${p}</p>`).join(''); }
  return `<section class="slide">${inner}<div class="foot"><span>Sites of Liberation</span><span>${i+1} / ${n}</span></div></section>`;
}

const deck = document.getElementById('deck');
deck.innerHTML = S.map((s,i)=>slideHTML(s,i,S.length)).join('');
</script>
</body>
</html>
