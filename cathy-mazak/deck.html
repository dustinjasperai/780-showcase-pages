<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Power Pipeline: A Masterclass with Cathy Mazak, PhD</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f6;        /* light paper ground (brand site_scheme: light) */
    --panel:#f4eef0;     /* soft pink-tinted panel */
    --rule:#e7dde1;      /* hairline rule */
    --ink:#2a2430;       /* near-black ink */
    --accent:#f92b75;    /* Scholar's Voice brand pink (dominant) */
    --marker:#3b29ff;    /* electric blue, small section markers only */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Poppins",system-ui,sans-serif;font-weight:300;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
  }
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:rgba(42,36,48,.35);font-weight:400}
  .eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--marker);font-weight:500;margin-bottom:18px}
  h1{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:48px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Playfair Display",Georgia,serif;font-weight:600;font-size:34px;line-height:1.14;margin-bottom:16px}
  .lead{font-size:20px;font-weight:300;max-width:62ch}
  .lead.big{font-size:26px;line-height:1.35}
  .accentbar{width:60px;height:4px;background:var(--accent);border-radius:3px;margin:0 0 26px}
  ul{list-style:none;margin:14px 0 0}
  li{position:relative;padding-left:26px;margin:0 0 14px;font-size:18px;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .step{display:flex;align-items:center;gap:14px;margin:10px 0;font-size:18px}
  .step .dot{min-width:30px;height:30px;border-radius:50%;background:var(--panel);border:1px solid var(--accent);display:flex;align-items:center;justify-content:center;font-weight:600;color:var(--accent);font-size:14px}
  .arrow{color:var(--accent);font-weight:600;margin:0 2px}
  .pipeline{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:18px;font-size:17px;font-weight:500}
  .pipeline span{background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:8px 16px}
  .kicker{font-size:17px;color:var(--accent);font-weight:500;margin-bottom:10px}
  .credit{font-size:17px;max-width:60ch;margin-top:10px}
  .disclaimer{font-size:13px;color:rgba(42,36,48,.55);font-weight:300;margin-top:26px;max-width:66ch;line-height:1.5}
  .cta-step{font-size:22px;font-weight:500;margin-top:8px}
  .host{font-size:16px;color:rgba(42,36,48,.6);margin-top:24px;font-weight:400}
  .panel{background:var(--panel);border-radius:12px;padding:26px 28px;margin-top:18px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title",
    eyebrow:"A free live masterclass",
    h1:"The Power Pipeline",
    lead:"How to publish your backlog of papers by building a pipeline, not by buying into the overwork.",
    host:"With Cathy Mazak, PhD, of Scholar's Voice" },

  {t:"content",
    eyebrow:"The promise",
    h2:"What you will walk away with",
    bullets:["A clear picture of why your papers stall, that has nothing to do with discipline",
             "The Power Pipeline, so several papers move at once instead of one at a time",
             "A way to protect writing time first, inside a real teaching load",
             "A next step to turn all of it into a personalized plan"],
    lead:"Sixty minutes, live, with time for your questions." },

  {t:"audience",
    eyebrow:"Who this is for",
    h2:"For the professor with a folder full of half-finished papers",
    lead:"You are a woman or non-binary professor on the tenure track. You are not short on ideas or ability. You have four papers started and you keep opening a fifth, and the finished ones are the exception, not the rule.",
    bullets:["You write in the cracks between teaching, service, and admin",
             "Your best research keeps waiting for a quieter month that never comes",
             "You have been told the answer is more discipline, earlier mornings, one more weekend"] },

  {t:"reframe",
    eyebrow:"The reframe",
    h2:"The backlog is not a discipline problem.",
    lead:"It is a pipeline problem. Papers are not stalling because you are not working hard enough. They are stalling because they move one at a time, and the system around them rewards the work that is loudest, not the writing that matters most.",
    kicker:"You do not publish more by grinding harder. You publish more by protecting your writing and killing the hustle." },

  {t:"part",
    eyebrow:"Part one",
    h2:"Why one paper at a time keeps you stuck",
    lead:"The one-paper-at-a-time stall is the core problem. When a single article is your whole writing life, one rejection, one hard reviewer, or one busy semester stops everything." },

  {t:"content",
    h2:"The three things that stall a paper",
    bullets:["It has no defined next task, so it waits for a block of time that is never long enough",
             "It competes with teaching and service, and loses, because those have deadlines and writing does not",
             "It carries all the pressure alone, so a single setback stalls the entire record"],
    lead:"Working harder on a stalled paper does not fix any of these. A different structure does." },

  {t:"reframe",
    eyebrow:"What it costs",
    h2:"A stalled paper is silenced research",
    lead:"Every paper sitting in a draft folder is work your field never hears, a voice that stays quiet. The cost of the stall is not just a thinner record. It is the contribution you are here to make, waiting.",
    kicker:"Finishing is not vanity. It is how the work that matters actually reaches the people it is for." },

  {t:"part",
    eyebrow:"Part two",
    h2:"The Power Pipeline Method",
    lead:"A pipeline is a set of papers moving continuously, from draft to submission to published, so your record never rests on a single article. Here is how the pieces fit together." },

  {t:"pipeline",
    h2:"Papers move, continuously",
    stages:["Draft","In revision","Submitted","Under review","Published"],
    lead:"When several papers sit at different stages at once, a setback on one never stops the whole line. Something is always moving forward." },

  {t:"pillar",
    eyebrow:"Pillar one",
    h2:"The Project Prediction Plan",
    lead:"Treat an article as a set of estimable tasks, not one giant block called writing. When you can name the next concrete task and roughly how long it takes, you can predict when a paper will actually be done, and you can schedule it like anything else that matters." },

  {t:"pillar",
    eyebrow:"Pillar two",
    h2:"Activities Alignment",
    lead:"Build the week around protected writing first, then fit teaching, service, and admin around it. Writing stops being the thing that gets cut when the week gets full, because it is no longer the most moveable thing on the calendar." },

  {t:"pillar",
    eyebrow:"Pillar three",
    h2:"The Mission Method",
    lead:"Define your scholarly mission, the work that matters to your field and your voice. Your mission decides which papers enter the pipeline, so your limited writing time centers your real contribution instead of other people's fires." },

  {t:"pillar",
    eyebrow:"Pillar four",
    h2:"The Write Goals Method",
    lead:"Set clear article-submission goals, then refine them against what the pipeline can actually carry. Goals you can meet build momentum. Goals disconnected from the pipeline just become one more way to feel behind." },

  {t:"part",
    eyebrow:"Part three",
    h2:"What a year on the pipeline looks like",
    lead:"Not heroic months and crashes. A steady line of papers moving, a record that grows whether or not any single week goes to plan." },

  {t:"content",
    h2:"The shift, in plain terms",
    bullets:["From one paper owning your whole writing life, to several papers each moving a little",
             "From writing when there is finally time, to a week built so there is time",
             "From a record that depends on your best months, to a record that compounds through the ordinary ones"],
    lead:"This is the Your Writing Roadmap method: a personalized plan that installs these systems in the order that fits your real semester." },

  {t:"content",
    eyebrow:"In practice",
    h2:"One week on the pipeline",
    bullets:["Two protected writing blocks go on the calendar before anything else",
             "Each block has one named task, predicted from the Project Prediction Plan, not just time to write",
             "Teaching and service fill the space around the blocks, not through them",
             "By Friday, two or three papers have each moved one concrete step"],
    lead:"No heroics. A week you could actually repeat, which is the whole point." },

  {t:"whyme",
    eyebrow:"Why me",
    h2:"I built this on a 4/4 load",
    credit:"I am Cathy Mazak, PhD. I am a tenured full professor and I published prolifically while teaching a 4/4 load, because I ran a pipeline instead of grinding. I host the Academic Writing Amplified podcast and wrote Making Time To Write: How to Resist the Patriarchy and Take Control of Your Academic Career Through Writing. I have coached academic writers full time since 2019.",
    kicker:"My work is to disrupt the system of academia from the bottom up, and make space for those of us who have long been silenced." },

  {t:"cta",
    eyebrow:"Your next step",
    h2:"Build your roadmap in Navigate",
    lead:"If you want this as a personalized 12-week plan, with live coaching and co-writing, that is exactly what Navigate: Your Writing Roadmap is.",
    step:"Join Navigate and build your own publication pipeline, so your backlog finally moves.",
    disclaimer:"This masterclass is for education only. No specific publication, career, or tenure result is guaranteed. Results vary by your field, situation, and the work you put in, and your experience may differ. Nothing here is professional, legal, or employment advice." }
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  let html = '<span class="num">' + String(i+1).padStart(2,"0") + " / " + String(S.length).padStart(2,"0") + "</span>";
  if (s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + "</div>";
  if (s.t === "title") {
    html += '<h1>' + s.h1 + "</h1>";
    html += '<div class="accentbar"></div>';
    html += '<p class="lead big">' + s.lead + "</p>";
    if (s.host) html += '<p class="host">' + s.host + "</p>";
  } else {
    if (s.h2) html += '<h2>' + s.h2 + "</h2>";
    if (s.t !== "content" && s.t !== "pipeline") html += '<div class="accentbar"></div>';
    if (s.lead) html += '<p class="lead">' + s.lead + "</p>";
    if (s.kicker) html += '<p class="kicker">' + s.kicker + "</p>";
    if (s.credit) html += '<p class="credit">' + s.credit + "</p>";
    if (s.bullets) { html += "<ul>"; s.bullets.forEach(b => html += "<li>" + b + "</li>"); html += "</ul>"; }
    if (s.stages) {
      html += '<div class="pipeline">';
      s.stages.forEach((st, k) => { html += "<span>" + st + "</span>"; if (k < s.stages.length-1) html += '<em class="arrow">&rsaquo;</em>'; });
      html += "</div>";
    }
    if (s.step) html += '<p class="cta-step">' + s.step + "</p>";
    if (s.disclaimer) html += '<p class="disclaimer">' + s.disclaimer + "</p>";
  }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
