<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSAT Kung Fu | Velocity LSAT Prep</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700;800;900&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0e1520;
    --panel: #16202e;
    --accent: #27ae60;
    --ink: #eef3f1;
    --muted: #9fb0b8;
    --rule: #26384a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;line-height:1.5}
  #deck{width:100%}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:.78rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:900;font-size:clamp(2.4rem,7vw,5rem);line-height:1.02;letter-spacing:-.01em}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:clamp(1.8rem,4.6vw,3.1rem);line-height:1.08;letter-spacing:-.01em}
  p{font-size:clamp(1.05rem,2.1vw,1.4rem);color:var(--ink);max-width:52ch;margin-top:1.1rem}
  p.lead{color:var(--muted)}
  .big{font-family:'Barlow Condensed',sans-serif;font-weight:900;color:var(--accent);font-size:clamp(3rem,10vw,7rem);line-height:1}
  ul{margin:1.4rem 0 0 1.1rem;max-width:54ch}
  li{font-size:clamp(1.02rem,2vw,1.3rem);margin:.7rem 0}
  li b{color:var(--accent)}
  .pillar{display:flex;gap:1rem;align-items:baseline}
  .num{font-family:'Barlow Condensed',sans-serif;font-weight:900;color:var(--accent);font-size:2.4rem;min-width:2.4rem}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:2rem;margin-top:1.6rem;max-width:60ch}
  .quote{font-size:clamp(1.2rem,2.6vw,1.8rem);font-weight:600;max-width:46ch}
  .cite{color:var(--muted);margin-top:.7rem;font-size:1rem}
  .kpis{display:flex;flex-wrap:wrap;gap:2.4rem;margin-top:1.8rem}
  .kpi .big{font-size:clamp(2.4rem,7vw,4.2rem)}
  .kpi span{display:block;color:var(--muted);font-size:.95rem;margin-top:.3rem}
  .foot{position:absolute;bottom:3vh;left:8vw;color:var(--muted);font-size:.8rem;letter-spacing:.04em}
  .disc{color:var(--muted);font-size:.9rem;max-width:60ch;margin-top:1.6rem}
  .cta-box{background:var(--accent);color:#07140c;border-radius:16px;padding:1.3rem 1.8rem;display:inline-block;
    font-family:'Barlow Condensed',sans-serif;font-weight:800;font-size:1.3rem;margin-top:1.6rem}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'Velocity LSAT Prep with Dave Hall', h:'LSAT Kung Fu', p:'How to stop studying harder and start seeing the test the way it was built, so your score finally moves.'},
  {t:'promise', eyebrow:'What this session gives you', h:'A new way to look at the test', p:'By the end you will see the LSAT as a finite set of repeating patterns you can learn to attack on reflex, not a verdict on how smart you are.'},
  {t:'who', eyebrow:'Who this is for', h:'You, right now', p:'You are pre-law. You have a target school and a date circled. You are putting in the hours, and the score is not moving the way the hours say it should.'},
  {t:'trap', eyebrow:'The trap', h:'More practice tests, same score', p:'You take another timed test, miss the same kinds of questions, review the answer key, and feel like you are memorizing explanations instead of getting faster. That plateau is not about effort.'},
  {t:'reframe', eyebrow:'The reframe', h:'The LSAT is not an IQ test', p:'It is a reasoning skills test, and every skill it rewards is learnable. The people who jump ten points did not get smarter. They learned to recognize what the test keeps doing.'},
  {t:'part', eyebrow:'Part one', h:'The real problem', p:'You are treating the LSAT like a knowledge test when it is a pattern test.'},
  {t:'body', eyebrow:'Part one', h:'Content is not the bottleneck', p:'There is almost nothing to memorize. The questions reuse the same argument structures, the same flaws, the same trap answers, test after test, since 2000. If you cannot see the pattern, you solve every question from scratch, and you run out of time.'},
  {t:'body', eyebrow:'Part one', h:'Why scores plateau', p:'A plateau means you have learned the content and are still solving blind. The next ten points do not come from more drills. They come from a method for seeing the pattern before you read the answers.'},
  {t:'part', eyebrow:'Part two', h:'The method: LSAT Kung Fu', p:'Three pillars. This is how Velocity turns an overwhelming test into a sequence you can train.'},
  {t:'pillar', n:'1', h:'Logic expertise', p:'First you own the reasoning the test is built on: how an argument is put together, what a conclusion actually depends on, what counts as proof. Once the logic is second nature, the test stops hiding.'},
  {t:'pillar', n:'2', h:'Pattern recognition', p:'The LSAT is pattern-dependent. We drill the recurring shapes until you name them on sight, so a question you have never seen still feels like one you have solved a hundred times.'},
  {t:'pillar', n:'3', h:'Tactical execution', p:'Then the attack plan: a hardcore, take-no-prisoners approach to every question type, so under the clock you are executing a move you have rehearsed, not improvising.'},
  {t:'loop', eyebrow:'How it is taught', h:'Theory, then real questions', p:'Every question type gets two passes. First a theory video where I introduce the pattern. Then a practice video where we solve actual released LSAT questions on the whiteboard, step by step, so you see the move land on the real thing.'},
  {t:'body', eyebrow:'Logical reasoning', h:'Break the flaw, every time', p:'Most of the test is logical reasoning. We go flaw type by flaw type until you can spot the broken link in an argument before you even reach the question stem. Name the flaw and the right answer stops hiding.'},
  {t:'body', eyebrow:'Reading comprehension', h:'Read for structure, not detail', p:'You stop trying to absorb every fact and start mapping what the passage is doing: whose view, what shifts, where the author tips their hand. The questions are about structure, so that is what we train you to read for.'},
  {t:'body', eyebrow:'Timing', h:'A plan for every single day', p:'Velocity hands you a guided daily calendar: exactly which lessons to watch and which questions to drill each day, plus the speed and timing work, so prep stops being a pile you stare at and becomes a path you walk.'},
  {t:'part', eyebrow:'Part three', h:'What mastery looks like', p:'Not a harder grind. A calmer, faster one.'},
  {t:'body', eyebrow:'Part three', h:'Recognition on reflex', h2:true, p:'You open a section and the questions sort themselves. You see the flaw, you see the trap answer, you move. The clock stops being the enemy because you are not solving from scratch anymore. That is what the belt progression is for.'},
  {t:'why', eyebrow:'Why learn it here', h:'Taught by a three-time 180', p:'I have scored a perfect 180 on the LSAT three times and put in thousands of teaching hours. Velocity students have gone on to Yale, Harvard, Stanford, and NYU. The method is the thing I would want if I were sitting where you are.'},
  {t:'proof', eyebrow:'What students report', h:'The jumps are real', kpis:[['158 to 170','Aaron F.'],['164 to 174','Sara'],['10 pts','improvement or keep working with me']]},
  {t:'next', eyebrow:'Your next step', h:'Try the first week free', p:'The entire first week of the guided course is open, free, so you can feel the method on real questions before you decide anything. If it clicks, the all-access pass and one-on-one tutoring are there when you want to go deeper.'},
  {t:'cta', eyebrow:'Start today', h:'Learn Kung Fu', p:'Start your free week at velocitylsat.com and see the patterns for yourself.', disc:'Educational information only. No score increase or law school admissions result is guaranteed. Results vary by student, effort, and starting point. Past student outcomes do not predict your result.'}
];

const d = document.getElementById('deck');
S.forEach(function(s){
  const sec = document.createElement('section');
  sec.className = 'slide';
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.t === 'title' || s.t === 'cta') html += '<h1>'+s.h+'</h1>';
  else html += '<h2>'+s.h+'</h2>';
  if (s.t === 'pillar') { html = '<div class="eyebrow">'+(s.eyebrow||'The method')+'</div><div class="pillar"><div class="num">'+s.n+'</div><h2>'+s.h+'</h2></div>'; }
  if (s.p) html += '<p'+((s.t==='who'||s.t==='trap'||s.t==='reframe'||s.t==='promise')?' class="lead"':'')+'>'+s.p+'</p>';
  if (s.kpis) {
    html += '<div class="kpis">';
    s.kpis.forEach(function(k){ html += '<div class="kpi"><div class="big">'+k[0]+'</div><span>'+k[1]+'</span></div>'; });
    html += '</div>';
  }
  if (s.t === 'cta') html += '<div class="cta-box">Start free at velocitylsat.com</div>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  sec.innerHTML = html;
  d.appendChild(sec);
});
</script>
</body>
</html>
