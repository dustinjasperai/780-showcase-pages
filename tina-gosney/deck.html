<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Begin Inside - A Masterclass with Tina Gosney</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Nanum+Myeongjo:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1f4ec;        /* her dominant sage ground, verbatim (16 uses) */
    --panel:#fcfdf8;     /* warm off-white derived from the sage ground */
    --sage:#e7ebdb;      /* a deeper cut of her sage */
    --rule:#d6ddc7;
    --accent:#616c40;    /* her olive, verbatim */
    --deep:#3f471f;
    --ink:#2e3123;
    --muted:#6b705a;
    --head:'Nanum Myeongjo', Georgia, serif;   /* her serif */
    --body:'Figtree', system-ui, sans-serif;    /* her sans */
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(63,71,31,.03)}
  .slide.title{background:var(--sage)}
  .slide.part{background:var(--accent);color:#f7f8f2;border-color:var(--deep)}
  .slide.cta{background:var(--sage);border-color:var(--rule)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  .slide.part .kick{color:#e7ead9}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;margin:0 0 16px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin:0 0 14px}
  .slide.part h2{font-size:40px}
  p{font-size:19px;line-height:1.6;margin:0 0 12px;max-width:52ch}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-family:var(--head);font-size:30px;line-height:1.25;color:var(--deep)}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none;max-width:54ch}
  li{font-size:19px;line-height:1.5;margin:0 0 14px;padding-left:30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;
    border-radius:50%;background:var(--accent)}
  .stage{font-family:var(--head);font-weight:800;color:var(--accent);font-size:22px}
  .foot{font-family:var(--body);font-size:12px;color:var(--muted);letter-spacing:.04em;
    margin-top:28px}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:60ch}
  .n{font-family:var(--body);font-size:12px;color:var(--muted);text-align:right;margin:-8px 2px 0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', kick:'A live masterclass with Tina Gosney',
  h:'Begin Inside',
  p:'How to reopen the door with your adult child without waiting for them to change.'},

 {t:'who', kick:'Who this is for',
  h:'You are the parent of a grown child who has gone distant.',
  list:['Maybe the calls stopped, or every conversation turns into conflict.',
        'Maybe you are walking on eggshells, choosing every word.',
        'You have tried reaching out, explaining, apologizing, and the silence stays.']},

 {t:'who', kick:'The trap',
  h:'You have been waiting for them to change first.',
  p:'It is the most natural thing in the world. If they would just call, just listen, just come back, everything would settle. So you wait, and you manage, and you brace for the next hard moment.',
  lead:'And the waiting keeps you stuck in the one seat you cannot control: theirs.'},

 {t:'hook', kick:'The reframe',
  h:'The door does not open from their side first.',
  big:'It opens from yours. The work does not begin with getting them to change. It begins inside of you.'},

 {t:'part', kick:'Part one',
  h:'The problem underneath the problem'},

 {t:'body', kick:'The pattern',
  h:'Conflict, distance, and anxiety are not the problem. They are the symptoms.',
  p:'Underneath them is a pattern: how your family reacts, what everyone expects, how each person protects themselves. When you can see the pattern, you stop fighting the symptom.',
  lead:'The goal is not to assign blame. It is to find exactly where change becomes possible.'},

 {t:'body', kick:'Why tactics stall',
  h:'A better script aimed at your child keeps you reacting.',
  list:['Scripts put the outcome back in their hands.',
        'They keep you performing calm instead of being grounded.',
        'Your child can feel the difference between the two instantly.']},

 {t:'part', kick:'Part two',
  h:'The model: Know, Love, Grow'},

 {t:'body', kick:'Stage one',
  stage:'Know',
  h:'Come home to yourself first.',
  p:'Before anything changes between you, you get to know yourself again: your reactions, your expectations, the story you have been carrying. In the masterclass I share the questions I use to start this.'},

 {t:'body', kick:'Stage two',
  stage:'Love',
  h:'Steady your own nervous system.',
  p:'You cannot lead a hard conversation from a body that is bracing for attack. Love is the work of calming your own reactive body so you can stay present instead of defending or disappearing.'},

 {t:'body', kick:'Stage three',
  stage:'Grow',
  h:'Lead the room back toward connection.',
  p:'From a steadier place you can take one grounded step, hold a boundary without a wall, and let the relationship have room to change. This is how you spiral up, and how that carries into your family.'},

 {t:'body', kick:'The in-the-moment tool',
  h:'Three sources of knowledge: mind, body, heart.',
  list:['Your thinking mind, your reactive body, and your emotional heart each hold part of the truth.',
        'Most of us react from only one of them under stress.',
        'The repair happens when you learn to listen to all three before you respond.']},

 {t:'body', kick:'Putting it together',
  h:'When the next text stings.',
  p:'The text that stings. The holiday that went sideways. Instead of reacting from fear or firing back, you pause, read all three sources, and choose the next grounded sentence. One steadier moment at a time.'},

 {t:'part', kick:'Part three',
  h:'What a steadier conversation looks like'},

 {t:'body', kick:'The shift',
  h:'Your adult child does not need a perfect parent.',
  big:'They need a grounded one. That is something you can become on your own, starting today.'},

 {t:'body', kick:'One real conversation',
  h:'It usually starts smaller than you think.',
  list:['A soft opening instead of a case to argue.',
        'Owning your own part without taking the blame for everything.',
        'Leaving the door open, then letting the silence be okay.']},

 {t:'body', kick:'Why me',
  h:'I have lived this and I have studied it.',
  p:'I am a mother of four grown children and I hold a graduate degree in Applied Family Science. My work is built on decades of research into how families actually heal, not on guesswork. And I had to learn, in my own family, that the change had to start with me.'},

 {t:'body', kick:'What changes',
  h:'From walking on eggshells to leading the room.',
  list:['You stop managing every word and start trusting yourself in hard moments.',
        'You stop waiting for an apology to feel steady.',
        'You give the relationship the one thing it needs to change: a grounded you.']},

 {t:'body', kick:'The path, in three words',
  h:'Know. Love. Grow.',
  p:'Know yourself. Love yourself steady. Grow the relationship from there. That is the whole journey, and it begins inside of you.'},

 {t:'cta', kick:'Your next step with me',
  h:'Take the next step with me.',
  list:['Start free: the Coaching Your Family Relationships podcast and the free reconnection guide.',
        'Go deeper together: join the Bridge to Connection group, or book a call to talk about 1:1 coaching.'],
  p:'If today gave you one steadier moment, that is where it begins.',
  disc:'This masterclass is educational. Every family and every relationship is different; results vary and no specific outcome or reconciliation is guaranteed. It is not therapy or a substitute for professional mental health care.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='title'?'title':s.t==='part'?'part':s.t==='cta'?'cta':'');
  let html='';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.stage) html+='<div class="stage">'+s.stage+'</div>';
  if(s.t==='title'||s.t==='hook'){ html+='<h1>'+s.h+'</h1>'; }
  else { html+='<h2>'+s.h+'</h2>'; }
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.p) html+='<p>'+s.p+'</p>';
  if(s.big) html+='<p class="big">'+s.big+'</p>';
  if(s.list){ html+='<ul>'; s.list.forEach(x=>html+='<li>'+x+'</li>'); html+='</ul>'; }
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  if(s.t==='cta') html+='<div class="foot">Tina Gosney Coaching</div>';
  d.innerHTML=html;
  deck.appendChild(d);
  const n=document.createElement('div'); n.className='n'; n.textContent=(i+1)+' / '+S.length;
  deck.appendChild(n);
});
</script>
</body>
</html>
