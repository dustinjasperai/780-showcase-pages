<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Prepared Home — A Live Masterclass with Jeanne-Marie Paynel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F1; --panel:#F1E8DC; --rule:#E6D8C6;
    --ink:#663411; --body:#4a3a2c; --muted:#8a7a68;
    --accent:#f37021; --teal:#5cc4b7;
    --serif:'Bitter',Georgia,serif; --sans:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:attr(data-n);position:absolute;top:20px;right:26px;
    font-size:12px;letter-spacing:.14em;color:var(--muted);font-weight:600}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;color:var(--ink);font-size:34px;line-height:1.12;margin-bottom:18px}
  .lead{font-size:21px;line-height:1.5;color:var(--body);margin-top:20px;max-width:40ch}
  p.body{font-size:18px;line-height:1.6;color:var(--body);margin-top:14px;max-width:46ch}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{font-size:18px;line-height:1.45;color:var(--body);padding-left:30px;position:relative;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:9px;width:14px;height:14px;
    border-radius:3px;background:var(--accent);opacity:.9}
  li b{color:var(--ink);font-weight:600}
  .part{font-family:var(--serif);font-size:19px;color:var(--accent);font-weight:600;margin-bottom:8px}
  .pillar-no{font-family:var(--serif);font-size:15px;color:var(--teal);font-weight:700;letter-spacing:.1em;margin-bottom:10px}
  .shelf{display:flex;gap:10px;margin-top:30px}
  .shelf i{display:block;height:46px;border-radius:4px 4px 0 0;background:var(--rule);flex:1}
  .shelf i:nth-child(2){background:var(--teal);opacity:.6}
  .shelf i:nth-child(3){background:var(--accent);opacity:.55}
  .shelf-base{height:7px;background:var(--ink);border-radius:3px;margin-top:0}
  .credit{font-size:15px;color:var(--muted);margin-top:28px}
  .cta h1{font-size:44px}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:54ch;border-top:1px solid var(--rule);padding-top:16px}
  .foot{font-size:14px;color:var(--muted);text-align:center;margin-top:10px}
  @media(max-width:640px){.slide{padding:36px 26px;min-height:380px}h1{font-size:36px}.cta h1{font-size:32px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<p class="foot">The Prepared Home &middot; a live masterclass with Jeanne-Marie Paynel, M.Ed, AMI</p>
<script>
const S=[
  {t:'title',
    kicker:'A Live Masterclass',
    h:'The Prepared Home',
    lead:'How to set up your home so your young child can actually do it themselves, and why that is the calmest parenting there is.',
    credit:'With Jeanne-Marie Paynel, M.Ed. Two AMI Montessori diplomas, birth to age six.'},

  {t:'list',
    kicker:'Who this is for',
    h:'If your days feel like non stop managing',
    list:[
      'You love your child and you are also exhausted by dressing, feeding, tidying, and refereeing all day long.',
      'You have read the books and you still feel like you are the one doing everything.',
      'You want calm and cooperation without yelling, bribing, or sticker charts.',
      'Your child is somewhere between birth and six, the years that shape the most.']},

  {t:'body',
    kicker:'The trap',
    h:'We were sold the wrong job',
    body:"Somewhere along the way parenting became a performance. More toys, more activities, more correcting, more hovering. You are busy every minute and your child still melts down, still cannot find anything, still waits for you to do the next thing. It is not because you are doing too little. It is because the home is set up for you to run it, not for your child to live in it."},

  {t:'body',
    kicker:'The reframe',
    h:'Your child is not giving you a hard time',
    body:'A young child is driven by one quiet urge, to do it by myself. When the environment blocks that urge, you get frustration, clinginess, and tantrums. When the environment invites it, you get a focused, capable, surprisingly calm child. The behavior you want is downstream of the room you set up.'},

  {t:'part', part:'Part One', h:'Why more backfires',
    body:'The modern home is loud, cluttered, and built at adult height. A child who cannot reach, cannot choose, and cannot succeed on their own will ask you for everything, or fight you on everything. Abundance looks generous. To a developing child it reads as noise.'},

  {t:'list',
    kicker:'What gets in the way',
    h:'Three things quietly working against you',
    list:[
      '<b>Too much.</b> A full toy bin is not choice, it is overwhelm. The child dumps and wanders instead of settling.',
      '<b>Too high.</b> Water, snacks, coats, and toys live where only you can reach them, so you become the bottleneck for every need.',
      '<b>Too much help.</b> Every time we do for a child what they could do themselves, we quietly teach them they are not capable yet.']},

  {t:'body',
    kicker:'The Montessori shift',
    h:'Help me to do it myself',
    body:'Dr. Montessori watched children choose real, purposeful work over toys again and again when the environment allowed it. The goal is not to entertain the child. It is to prepare a home where the child can meet their own needs, and then to step back far enough to let them.'},

  {t:'part', part:'Part Two', h:'The Prepared Home method',
    body:'This is the heart of the masterclass, the four pillars I use with families in my private mentoring and in The Parenting School. Together they turn a house that runs on you into a home your child can run themselves.'},

  {t:'pillar', no:'Pillar One', h:'The Prepared Environment',
    body:'Fewer, better things, on low open shelves, at the child\'s height. A short rotation of activities the child can see, reach, and return on their own. The nursery and the main rooms get set up so the child can succeed without asking. This is the single change that calms a home the fastest.'},

  {t:'pillar', no:'Pillar Two', h:'Freedom within Limits',
    body:'Respectful, positive discipline without punishments or rewards. Clear, kind limits the child can count on, and real choices inside them. My 21 respectful discipline tools give you something concrete to say and do in the hard moments, so you stay firm and warm at the same time.'},

  {t:'pillar', no:'Pillar Three', h:'Practical Life and Real Work',
    body:'Children build confidence by doing real things, pouring, wiping, dressing, preparing a snack, caring for a plant. My collection of self directed purposeful tasks turns everyday life into the curriculum, so competence comes from doing, not from being managed.'},

  {t:'pillar', no:'Pillar Four', h:'The Observing Parent',
    body:'Do less, observe more, enjoy most. Your calm is the thermostat for the whole home. We practice stepping back, watching what your child is actually ready for, and modeling the regulation we want them to learn. This is the pillar that changes you, not just the room.'},

  {t:'part', part:'Part Three', h:'A calm Tuesday in a prepared home',
    body:'None of this is theory. It is a Tuesday morning that works. Here is how the four pillars show up in an ordinary day once the home is prepared.'},

  {t:'list',
    kicker:'A morning in a prepared home',
    h:'Small, ordinary, and calm',
    list:[
      'Your toddler reaches their own cup and pours their own water from a small pitcher you set out.',
      'Getting dressed is a low hook and two choices, not a battle.',
      'When the big feeling comes, you have a tool ready, and the limit holds without a fight.',
      'You get a stretch of quiet because your child is absorbed in real work they chose.']},

  {t:'body',
    kicker:'The dividend',
    h:'A calmer child, and a calmer you',
    body:'When a child can meet their own needs, the whining, the power struggles, and the constant asking drop away. Independence is not something you wait for. It is something the prepared home gives back to both of you, a little more every week.'},

  {t:'body',
    kicker:'Why learn this from me',
    h:'Twenty years in the classroom and the home',
    body:'I hold two AMI Montessori diplomas for birth to age six and a Master of Education, I spent six years guiding a primary classroom, and I have mentored families on three continents. I host The Art of Parenting Podcast. I do not believe in cookie cutter advice. I believe in preparing the one home your child is actually growing up in.'},

  {t:'list',
    kicker:'Common worries',
    h:'You might be thinking',
    list:[
      '<b>My home is small.</b> Good. The method is about less, not more, it suits small spaces beautifully.',
      '<b>My child is strong willed.</b> Freedom within limits was built for exactly this child.',
      '<b>I am not crafty or perfect.</b> You do not need to be. You need a few intentional changes and a willingness to observe.']},

  {t:'list',
    kicker:'Recap',
    h:'The Prepared Home, in four pillars',
    list:[
      '<b>The Prepared Environment,</b> fewer things, child height, within reach.',
      '<b>Freedom within Limits,</b> kind, firm, positive discipline.',
      '<b>Practical Life,</b> real work that builds real confidence.',
      '<b>The Observing Parent,</b> do less, observe more, model calm.']},

  {t:'cta',
    kicker:'Your next step',
    h:'Prepare your home with me',
    body:'If you want help turning this into your home and your child, the next step is simple. Book a complimentary session with me, or join the next session of The Parenting School, and we will prepare it together.',
    disc:'This masterclass is educational. No income or result is guaranteed. Results vary from family to family and depend on your own circumstances and effort. Nothing here is medical, psychological, or developmental advice for an individual child.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var deck=document.getElementById('deck');
S.forEach(function(s,i){
  var d=el('div','slide'+(s.t==='cta'?' cta':''));
  d.setAttribute('data-n',(i+1)+' / '+S.length);
  if(s.kicker)d.appendChild(el('div','kicker',s.kicker));
  if(s.part)d.appendChild(el('div','part',s.part));
  if(s.no)d.appendChild(el('div','pillar-no',s.no));
  if(s.t==='title'){
    d.appendChild(el('h1',null,s.h));
    if(s.lead)d.appendChild(el('p','lead',s.lead));
    if(s.credit)d.appendChild(el('p','credit',s.credit));
    var sh=el('div','shelf');sh.appendChild(el('i'));sh.appendChild(el('i'));sh.appendChild(el('i'));
    d.appendChild(sh);d.appendChild(el('div','shelf-base'));
  } else {
    d.appendChild(el('h2',null,s.h));
    if(s.lead)d.appendChild(el('p','lead',s.lead));
    if(s.body)d.appendChild(el('p','body',s.body));
    if(s.list){var ul=el('ul');s.list.forEach(function(x){ul.appendChild(el('li',null,x));});d.appendChild(ul);}
    if(s.credit)d.appendChild(el('p','credit',s.credit));
    if(s.disc)d.appendChild(el('p','disc',s.disc));
  }
  deck.appendChild(d);
});
</script>
</body>
</html>
