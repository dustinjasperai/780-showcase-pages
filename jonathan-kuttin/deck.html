<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>From Solo Advisor to Elite Organization · Jon Kuttin, Kuttin Consulting Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#eaf0f8; --panel:#ffffff; --rule:#cdd9ec;
    --navy:#063076; --acc:#00abe9; --ink:#0f2144; --body:#38465f; --dim:#8290a8;
  }
  html,body{height:100%}
  body{background:#dbe4f1;font-family:'Figtree',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dbe4f1}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Figtree',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title{background:linear-gradient(160deg,#f3f7fc 0%,#e2ebf7 100%)}
  .t-title h1{font-size:4.7vw;max-width:95%;color:var(--navy)}
  .t-normal h1{font-size:3.15vw;max-width:90%}
  .t-normal .body{font-family:'Figtree',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:80%;line-height:1.66;font-weight:400}
  .sub{font-family:'Newsreader',serif;font-style:italic;font-size:2.0vw;color:var(--navy);margin-top:3.4vh;max-width:88%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--navy)}
  .t-section .idx{font-family:'Figtree',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.5vw;max-width:92%;color:#ffffff}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#0b3f86 0%,#041b41 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:92%;color:#ffffff}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0b3f86 0%,#041b41 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:88%;color:#ffffff}
  .t-cta .body{font-family:'Figtree',sans-serif;color:#cfe1f6;font-size:1.4vw;margin-top:3vh;max-width:76%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:#ffffff;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:#a9c4e6;text-align:center;line-height:1.45}
  .brandline{font-family:'Figtree',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--navy);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(6,48,118,.14);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.0vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Kuttin Consulting Group</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'From Solo Advisor to Elite Organization',sub:'How top advisors stop carrying every client themselves and build a practice that keeps growing without them.',brand:true},
 {t:'normal',k:'Who this is for',title:'You are the best producer in your practice, and that is the problem.',body:'You built a real book. The clients trust you, the revenue is good, and almost all of it still runs through you. Every new relationship, every plan, every hard conversation lands on your calendar. Growth now means working more hours you do not have, and the practice cannot get much bigger than one very good advisor can personally carry.'},
 {t:'dark',title:'Your practice is not too small. It is too dependent on you.'},
 {t:'section',idx:'Part One',title:'Why great advisors hit a ceiling.'},
 {t:'normal',k:'The ceiling of complexity',title:'Every advisor eventually hits a ceiling of complexity.',body:'The same instincts that got you to a strong solo book, doing it all yourself, saying yes to every client, keeping every detail in your head, are the exact instincts that cap you. Past a certain point more clients do not mean more freedom. They mean more nights, a fuller inbox, and a business that gets more fragile the more it grows.'},
 {t:'normal',k:'The real cost',title:'A practice built entirely around you is worth less and stresses you more.',body:'When you are the product, time off is a risk, a good associate has nowhere to grow, and a buyer sees a book that leaves when you do. The plateau is not a marketing problem or an effort problem. It is a structure problem, and no amount of extra hours fixes a structure that was only ever designed for one person.'},
 {t:'dark',title:'You do not have a production problem. You have a structure problem.'},
 {t:'section',idx:'Part Two',title:'The path from solo to elite organization.'},
 {t:'normal',k:'The critical inch',title:'First, protect the few activities that actually produce.',body:'Growth to the first million in production is won on a handful of activities, not a longer to-do list. You map them to a model calendar, defend that calendar, and stop letting reactive work spend the hours that only you can make money in. The skill of this stage is choosing what to stop doing before you try to do more.'},
 {t:'normal',k:'Your first real hire',title:'Learn the difference between delegating and empowering.',body:'The move off the solo treadmill is your first true hire, an assistant and then an associate. Most advisors delegate tasks and still own every decision, so they stay the bottleneck. Empowering is handing over outcomes, standards, and the authority to meet them. That shift, from doing the work to owning the result, is what lets a second person actually take weight off you.'},
 {t:'normal',k:'Build the organization',title:'Past two million, you are building a company, not a bigger to-do list.',body:'Now the work is roles, standards, and the few numbers that tell you the truth about the business. You hire and fire on clear values, you write down the systems you used to run on instinct, and you lead the people who serve the clients instead of serving every client yourself. This is where a book of business turns into an organization.'},
 {t:'normal',k:'Professional alliances',title:'Turn accountants and attorneys into a referral engine.',body:'The advisors who scale fastest rarely do it on cold marketing. They build real professional alliances, the CPA and attorney relationships that send qualified clients on purpose and consistently. Done right, an alliance strategy becomes a growth channel your competitors cannot copy, because it is built on trust and a shared process, not an ad budget.'},
 {t:'normal',k:'Growth by acquisition',title:'The fastest way to add production is to acquire it, not chase it.',body:'An elite organization grows two ways at once, organically and through acquisition and recruiting. Buying a retiring advisor\'s book, or bringing an advisor under your platform, adds production in months rather than years, when you have the structure and the leadership to absorb it well. Most advisors never learn this game. It is one of the biggest levers in the profession.'},
 {t:'normal',k:'The mindset layer',title:'Ten times thinking is a decision about who runs the business.',body:'None of the structure sticks without a shift in how you lead yourself. Thinking about ten times growth instead of ten percent forces a different set of choices, and self-leadership is the discipline that carries you through the uncomfortable stretch between being the top producer and becoming the person who leads producers. The mindset is not decoration. It is the engine.'},
 {t:'dark',title:'Every stage is the same shift in disguise: stop being the practice, start leading the organization.'},
 {t:'section',idx:'Part Three',title:'What an elite organization feels like.'},
 {t:'normal',k:'In practice',title:'A business that runs to a standard you set, not a calendar you fill.',body:'You still grow, but the growth no longer costs you every evening. There is a team that serves clients to your standard, an alliance network sending qualified relationships, and a clear path for the next advisor to plug in. The book keeps compounding whether or not you personally sit in every meeting, and for the first time the value of the business is not the same thing as your stamina.'},
 {t:'normal',k:'The shift',title:'From the top producer in the building to the person who leads it.',body:'The old version of you took every client because the practice could not run otherwise. The organization version sets the direction, builds the team, and trusts a standard to deliver it. Same expertise, a very different life, and a business that is finally worth what you put into it, to you now and to a buyer later.'},
 {t:'normal',k:'Why listen to me',title:'I built one of the largest advisory organizations in the country, and I coach advisors to do the same.',body:'I am a Barron\'s Hall of Fame advisor with more than twenty five years spent leading and growing an advisory practice through the exact stages in this presentation, including team building, professional alliances, recruiting, and acquisition. Today I coach advisors and teams on quantum growth, and the whole approach is to turn what worked into a path you can actually follow in your own business.'},
 {t:'cta',title:'Find your next stage.',body:'If this is the business you want to build, the next step is a conversation. Book a call with our team and we will look at which stage your practice is in and the single move that takes you toward an organization from where you are now. This presentation is educational. No specific business or income result is guaranteed, and results vary with your practice, your market, and the work you put in.',brand:true}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide t-' + s.t + (i === 0 ? ' active' : '');
  let html = '';
  if (s.k) html += '<div class="kicker">' + s.k + '</div>';
  if (s.idx) html += '<div class="idx">' + s.idx + '</div>';
  if (s.title) html += '<h1>' + s.title + '</h1>';
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.body) html += '<div class="body">' + s.body + '</div>';
  if (s.t === 'section') html += '<div class="rule"></div>';
  if (s.brand) html += '<div class="brandline">Jon Kuttin &middot; <b>Kuttin Consulting Group</b></div>';
  if (s.t === 'cta') html += '<div class="disc">Educational content. No specific business or income result is guaranteed. Results vary.</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const bar = document.getElementById('bar');
const count = document.getElementById('count');
const hint = document.getElementById('hint');
const pad = n => String(n).padStart(2, '0');
function show(n){
  cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('active', i === cur));
  bar.style.width = ((cur + 1) / slides.length * 100) + '%';
  count.textContent = pad(cur + 1) + ' / ' + pad(slides.length);
  if (cur > 0 && hint) hint.style.opacity = 0;
}
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('prev').onclick = () => show(cur - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
show(0);
</script>
</body>
</html>
