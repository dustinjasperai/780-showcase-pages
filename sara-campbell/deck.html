<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Biz, Brain, and Bandwidth · Savvy Music Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Josefin+Sans:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf5f8; --panel:#ffffff; --rule:#ecdfe6;
    --acc:#b8177a; --acc2:#31bba5; --idx:#a25c86;
    --ink:#0f0d0e; --soft:#4a4147; --dim:#8a7f85;
  }
  html,body{height:100%}
  body{background:#e7dbe1;font-family:'Poppins',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7dbe1}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Josefin Sans',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:4.6vw;max-width:92%;font-weight:700}
  .t-normal h1{font-size:2.8vw;max-width:84%;font-weight:600}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.4vw;color:var(--soft);margin-top:2.8vh;max-width:78%;line-height:1.62;font-weight:300}
  .sub{font-family:'Poppins',sans-serif;font-size:1.5vw;color:var(--soft);margin-top:3.2vh;max-width:82%;line-height:1.55;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.2vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.18em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%;font-weight:700}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),var(--acc2));margin-top:3.6vh;border-radius:2px}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#5c0c3c 0%,#2a0620 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.2vw;max-width:84%;font-style:normal;color:#fbeef5;font-weight:500}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0d3b36 0%,#062420 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.4vw;max-width:82%;font-weight:700;color:#f1fbf8}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc2);color:#dff6f0;border-radius:100px;padding:1.5vh 2vw;font-size:1.2vw;font-weight:600;font-family:'Poppins',sans-serif}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-family:'Poppins',sans-serif;font-size:.86vw;color:var(--dim);font-style:normal;text-align:center;line-height:1.45}
  .t-cta .disc{color:#7fa39c}
  .t-title .disc,.t-normal .disc{text-align:left}
  .bars-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-bars{right:7.5%;bottom:10%;width:17vw}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.2vw;color:var(--soft);margin-top:3.6vh;font-weight:300;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(15,13,14,.08);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--acc),var(--acc2));width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Savvy Music Studio</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- 3 B's motif: three ascending rounded bars, biz / brain / bandwidth -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="bars" viewBox="0 0 200 140">
  <g stroke-linecap="round" fill="none">
    <line x1="34" y1="120" x2="34" y2="86" stroke="#b8177a" stroke-width="14"/>
    <line x1="100" y1="120" x2="100" y2="56" stroke="#8a4f8f" stroke-width="14"/>
    <line x1="166" y1="120" x2="166" y2="24" stroke="#31bba5" stroke-width="14"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Biz, Brain, and Bandwidth',sub:'A live masterclass for independent music teachers on growing a studio that stays awesome and authentic, without a one-size-fits-all formula.',brand:true},
 {t:'normal',k:'Who this is for',title:'You love teaching. It is the business side that feels like someone else’s job.',body:'You got into this to teach music, and you are good at it. Growing the studio is the part that feels like it belongs to a marketer you are not, and every guru’s answer is to copy their exact model.'},
 {t:'dark',title:'A full studio is not a formula you copy. It is the fit between your business, your mind, and your time.'},

 {t:'section',idx:'Part One',title:'Why Copy-My-Model Advice Keeps Failing'},
 {t:'normal',k:'The one-size-fits-all trap',title:'A stamped plan ignores the one thing that matters: your studio.',body:'Every studio is different in market, instruments, the season of life you are in, and what you actually want. A plan built to be resold to everyone fits the person selling it and almost no one else.'},
 {t:'normal',k:'The comparison trap',title:'Comparison is the thief of joy, and of good decisions.',body:'Measuring your studio against someone else’s highlight reel pushes you to copy their tactics instead of building your own. The tactics were answers to their studio’s questions, not yours.'},
 {t:'normal',k:'The passive-income mirage',title:'"Scale and chase passive income" usually just buys you a second job.',body:'It sounds like freedom. In practice it is more funnels, more content, and more hours stacked on top of the teaching you already do, until the thing meant to free you is the thing running you.'},
 {t:'dark',title:'You do not need a bigger funnel. You need a studio built to fit the teacher running it.'},

 {t:'section',idx:'Part Two',title:'The 3 B’s'},
 {t:'normal',k:'The first B, Biz',title:'Biz: the right few business moves, chosen for where your studio actually is.',body:'Your offers, your pricing, your positioning, and marketing that sounds like your studio. Not more tactics for their own sake. The handful that fit the studio in front of you, in the order that makes sense for it.'},
 {t:'normal',k:'The second B, Brain',title:'Brain: the mindset the business is built on.',body:'Confidence in the value of what you do, and quieting the comparison and impostor voices that keep you undercharging and playing small. This B decides what you will even let yourself attempt.'},
 {t:'normal',k:'The third B, Bandwidth',title:'Bandwidth: your time and energy are the real budget.',body:'Growth that ignores bandwidth just trades a fuller roster for a burned-out teacher. This B protects your capacity on purpose, so a bigger studio does not cost you the life you built it around.'},
 {t:'normal',k:'Why all three, together',title:'The three only work as a set.',body:'Most advice fixes one B and quietly breaks another: a marketing plan that eats your evenings, a mindset shift with no business behind it. Move biz, brain, and bandwidth together and the studio grows without taking over your life.'},
 {t:'normal',k:'Awesome and authentic',title:'The goal is the go-to studio that still sounds like you.',body:'Growth you are proud of, in your own voice, is the kind that lasts. You do not have to become an internet marketer to build a studio people seek out. You have to build it as yourself.'},
 {t:'dark',title:'Tailored beats templated. Every time.'},

 {t:'section',idx:'Part Three',title:'The Studio That Fits You'},
 {t:'normal',k:'The first months',title:'Not an overnight full roster. A studio that finally feels like yours to run.',body:'Clearer offers, prices you can say out loud without flinching, and a marketing rhythm that fits your week instead of fighting it. The studio starts to feel like something you run, not something you survive.'},
 {t:'normal',k:'Who is teaching this',title:'A plan she actually used, not one she read about.',body:'Sara Campbell has run her own voice and piano studio for 15 years, taught music for more than 20, and spent the last 10 coaching hundreds of independent teachers. Savvy Music Studio grew from the same 3 B’s she teaches.'},
 {t:'cta',title:'Ready to build the studio that fits you?',chips:['Book a strategy session with Sara'],disc:'Educational content for independent music teachers and studio owners. This is business coaching, not financial, legal, or tax advice. No specific income or outcome is guaranteed, and results vary by studio, market, and effort.'},
];

const deck=document.getElementById('deck');
function barsSvg(){return `<svg class="bars-motif title-bars"><use href="#bars"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Savvy <b>Music Studio</b> &middot; Sara Campbell</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=barsSvg();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
