<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signature As You — The Signature Coach Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f3;        /* her warm off-white footer/panel ground */
    --ink:#181816;       /* her dominant ink */
    --panel:#181816;     /* dark feature panel */
    --rule:#e3ddd4;      /* derived low-chroma tint of the ground */
    --accent:#8d6f57;    /* her warm bronze secondary */
    --muted:#6f6a63;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--rule);color:var(--ink);font-family:'Montserrat',sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:4px;padding:64px 64px;margin:0 0 22px;min-height:520px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.dark{background:var(--panel);color:var(--bg)}
  .slide.dark .kicker,.slide.dark .num{color:#c9b29c}
  .slide.dark .rule-ink{background:#3a342d}
  .kicker{font-family:'Montserrat';font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .num{font-family:'Montserrat';font-weight:700;font-size:13px;letter-spacing:.14em;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Noto Serif Display',serif;font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'Noto Serif Display',serif;font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:'Noto Serif Display',serif;font-weight:600;font-size:27px;line-height:1.2;margin-bottom:10px}
  p{font-size:19px;line-height:1.6;color:var(--muted);max-width:46ch}
  .slide.dark p{color:#d9d2c9}
  .lead{font-size:23px;color:var(--ink);max-width:48ch}
  .slide.dark .lead{color:var(--bg)}
  .sig{display:inline-block;margin-top:26px}
  .sig svg{display:block}
  ul{list-style:none;margin-top:8px}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px;align-items:baseline}
  .slide.dark li{color:var(--bg);border-top:1px solid #3a342d}
  li .b{font-family:'Noto Serif Display',serif;color:var(--accent);font-weight:700;font-size:18px;min-width:30px}
  .big{font-size:33px;line-height:1.28;font-family:'Noto Serif Display',serif;font-weight:500;max-width:22ch;color:var(--ink)}
  .slide.dark .big{color:var(--bg)}
  .foot{position:absolute;bottom:26px;left:64px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:52ch;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:600;font-size:16px;letter-spacing:.02em;padding:16px 30px;border-radius:3px;text-decoration:none}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  @media(max-width:720px){.slide{padding:40px 28px;min-height:auto}h1{font-size:40px}h2{font-size:30px}.two{grid-template-columns:1fr}.foot{left:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* S = the masterclass, slide by slide. KellyAnne's content only. */
var STROKE='<span class="sig"><svg width="190" height="16" viewBox="0 0 190 16" fill="none"><path d="M3 11C40 4 92 3 140 7c18 1.6 34 3 47 5" stroke="#8d6f57" stroke-width="3" stroke-linecap="round"/></svg></span>';
const S=[
  {t:'title'},
  {t:'for'},
  {t:'trap'},
  {t:'reframe'},
  {t:'p1'},
  {t:'cost'},
  {t:'p2intro'},
  {t:'step',n:'01',h:'Signature Identity',p:'Before any tactic, you define who you are as a coach at your highest standard. The BEING before the DOING. A premium program then feels like the most natural expression of who you already are.'},
  {t:'step',n:'02',h:'Signature Energy',p:'Your "It" Factor. The difference that makes the difference, and what sets your coaching apart. We name it so your ideal client takes one look and thinks, finally, someone who gets it.'},
  {t:'step',n:'03',h:'Signature Program',p:'We take your lived experience, results and wisdom and shape them into a one-of-a-kind methodology the market cannot replicate, because it is built from you.'},
  {t:'step',n:'04',h:'Package It To Sell',p:'Structure, package, price and position the program so it is a clear, sellable offer, not a pile of scattered ideas. A complete program and the messaging to sell it.'},
  {t:'step',n:'05',h:'The Evergreen Engine',p:'One piece of long-form content a week that ranks for years, repurposed across your platforms. A repeatable marketing system that brings the right coaches to you around the clock.'},
  {t:'step',n:'06',h:'A Sales System That Runs',p:'A simple, repeatable sales process so enrolment keeps happening long after you have logged off. Structure, profitability and peace of mind, built in.'},
  {t:'after'},
  {t:'whome'},
  {t:'recap'},
  {t:'cta',disc:'This masterclass is educational. No income or specific result is guaranteed. Results vary and depend on your own work, market and effort.'}
];
function render(){
  var d=document.getElementById('deck');
  S.forEach(function(s){
    var el=document.createElement('section');
    el.className='slide';
    var h='';
    switch(s.t){
      case 'title':
        el.className+=' dark';
        h='<div class="kicker">The Signature Coach Masterclass</div>'+
          '<h1>Signature<br>As You.</h1>'+
          '<p class="lead" style="margin-top:22px">How to turn your lived experience into a one-of-a-kind coaching program the market cannot copy. Live, in 75 minutes, with KellyAnne Zielinski.</p>'+STROKE;
        break;
      case 'for':
        h='<div class="kicker">Who this is for</div>'+
          '<h2>You have clients.<br>You do not have an offer you can name.</h2>'+
          '<p style="margin-top:20px">You are not a big-box coach with cookie-cutter advice for everyone. You run a transformational, boutique experience only you can deliver. But your marketing still sounds like every other coach, and the work has never been packaged into one clear, sellable program.</p>';
        break;
      case 'trap':
        h='<div class="kicker">The trap</div>'+
          '<div class="big">You keep adding tactics. Another funnel, another platform, another launch. And you still sound like everyone else.</div>';
        break;
      case 'reframe':
        el.className+=' dark';
        h='<div class="kicker">The reframe</div>'+
          '<div class="big">More tactics will not fix a me-too offer. Your distinction was never a marketing problem. It is an identity you have not packaged yet.</div>'+STROKE;
        break;
      case 'p1':
        h='<div class="num">Part one</div>'+
          '<h2>The real problem is positioning from features, not from self.</h2>'+
          '<p style="margin-top:20px">Most coaches describe what they do: the sessions, the modules, the deliverables. Buyers cannot tell you apart on features, because features are copyable. What is not copyable is the signature identity underneath the work. That is the asset we have not built yet.</p>';
        break;
      case 'cost':
        h='<div class="kicker">What the gap costs</div>'+
          '<div class="big">Coaches with less experience out-earn you, not because they are better, but because they packaged and positioned their work and you have not.</div>';
        break;
      case 'p2intro':
        el.className+=' dark';
        h='<div class="num">Part two</div>'+
          '<h2>The 6-Step Signature Coach System</h2>'+
          '<p style="margin-top:20px">The path from scattered genius to a signature program packaged to sell, built from who you already are. Six steps.</p>'+STROKE;
        break;
      case 'step':
        h='<div class="num">Step '+s.n+'</div><h3>'+s.h+'</h3><p>'+s.p+'</p>';
        break;
      case 'after':
        h='<div class="num">Part three</div>'+
          '<h2>Your signature program, in market.</h2>'+
          '<ul>'+
          '<li><span class="b">01</span><span>A signature program packaged to sell that the market cannot replicate.</span></li>'+
          '<li><span class="b">02</span><span>Signature brand language that is unduplicated, so the right client self-selects.</span></li>'+
          '<li><span class="b">03</span><span>A repeatable marketing system that is simple to run.</span></li>'+
          '<li><span class="b">04</span><span>A business that runs with structure, profitability and peace of mind.</span></li>'+
          '</ul>';
        break;
      case 'whome':
        h='<div class="two"><div>'+
          '<div class="kicker">Why listen to me</div>'+
          '<h2>KellyAnne Zielinski</h2>'+
          '<p style="margin-top:16px">I have been in the coaching industry since 2013 and have built, and rebuilt, my own business enough times to know what creates impact, income and time freedom. The model I teach: a signature program as the foundation, evergreen marketing as the engine, and digital products to scale.</p>'+
          '</div><div>'+
          '<div class="big" style="font-size:27px">6,000+ coaches in 10 countries have done this work.</div>'+STROKE+
          '</div></div>';
        break;
      case 'recap':
        h='<div class="kicker">The one idea</div>'+
          '<div class="big">You do not need to be louder. You need to be unmistakably you, and then package it. That is a signature program.</div>';
        break;
      case 'cta':
        el.className+=' dark';
        h='<div class="kicker">Your next step</div>'+
          '<h2>Ready to build a program as signature as you are?</h2>'+
          '<p style="margin-top:18px">If you want to go deeper, the Signature Coach program walks you through all six steps with coaching, templates and a done-with-you path to a complete, sellable signature program.</p>'+
          '<a class="cta-btn" href="https://www.selfleadershipglobal.com/SLG-Services">Learn more &amp; apply</a>'+
          '<div class="disc">'+s.disc+'</div>';
        break;
    }
    el.innerHTML=h+'<div class="foot">Self Leadership Global · KellyAnne Zielinski</div>';
    d.appendChild(el);
  });
}
render();
</script>
</body>
</html>
