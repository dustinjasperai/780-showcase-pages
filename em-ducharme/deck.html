<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Scalable Signature Offer: a masterclass with Em Ducharme</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gentium+Book+Basic:ital,wght@0,400;0,700;1,400&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f6;        /* from brand footer off-white #f0eff0, lifted */
    --panel:#f0eff0;     /* her footer bg */
    --ink:#303030;       /* her charcoal body/header */
    --muted:#6f6763;
    --accent:#9a8684;    /* her dominant brand hex (h1/h2/button) */
    --rule:#9a868455;
    --head:'Gentium Book Basic', Georgia, serif;
    --body:'Jost', system-ui, sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e8e3df;font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    position:relative;background:var(--bg);aspect-ratio:16/9;width:100%;
    border-radius:14px;margin:0 0 26px;padding:70px 76px;overflow:hidden;
    box-shadow:0 18px 50px rgba(90,64,40,.14);display:flex;flex-direction:column;
  }
  .slide::before{content:'';position:absolute;top:0;left:0;width:100%;height:6px;background:var(--accent)}
  .kick{font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:26px}
  h1{font-family:var(--head);font-weight:700;font-size:64px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.1;margin-bottom:22px}
  .lede{font-size:26px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:84%}
  .big{font-family:var(--head);font-size:56px;line-height:1.14;font-weight:700;max-width:92%}
  .big .a{color:var(--accent);font-style:italic}
  p.body{font-size:24px;line-height:1.55;color:var(--ink);max-width:82%;margin-top:14px}
  ul{list-style:none;margin-top:18px}
  li{font-size:24px;line-height:1.5;color:var(--ink);padding-left:38px;position:relative;margin-bottom:18px;max-width:84%}
  li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border:2.4px solid var(--accent);border-radius:5px}
  .mark{font-size:14px;letter-spacing:.3em;color:var(--accent)}
  .center{justify-content:center}
  .num{position:absolute;right:70px;bottom:52px;font-family:var(--head);font-size:20px;color:var(--rule);font-weight:700}
  .part-n{font-family:var(--head);font-size:150px;color:var(--accent);opacity:.16;font-weight:700;line-height:.8}
  .foot-note{font-size:16px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:86%;border-top:1px solid var(--rule);padding-top:20px}
  .cta-steps{margin-top:24px}
  .cta-steps li::before{border-radius:50%}
  .brandline{font-family:var(--head);font-size:22px;color:var(--accent);margin-top:28px;font-weight:700}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:20px 40px;margin-top:22px}
  .cardlet{background:var(--panel);border-radius:12px;padding:26px 28px}
  .cardlet h3{font-family:var(--head);font-size:26px;margin-bottom:8px}
  .cardlet p{font-size:18px;line-height:1.45;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A live masterclass with Em Ducharme',
    h1:'The Scalable Signature Offer',
    lede:'How to build one group offer that sells itself, so your income stops being capped by your hours.' },

  {t:'who',
    kick:'Who this is for',
    h2:'If you are a coach, therapist, or expert who is fully booked and still stuck',
    body:'You are good at what you do. Clients get results. And yet growth means squeezing more calls into a week that is already full. This masterclass is for you.' },

  {t:'trap',
    kick:'The trap',
    big:'More clients will not fix a model that trades <span class="a">hours for dollars</span>.',
    body:'Adding one-to-one clients adds work, not freedom. Launching harder adds noise, not a system. The ceiling is the model, not your effort.' },

  {t:'reframe',
    kick:'The reframe',
    big:'You do not need a bigger audience. You need one <span class="a">scalable</span> offer.',
    body:'One signature group offer, built on real foundations, carried by a funnel that fills it while you sleep. That is what scaling actually looks like.' },

  {t:'part', n:'1', kick:'Part one', h2:'Why launching harder stops working' },

  {t:'content',
    kick:'The real problem',
    h2:'Effort is not the bottleneck',
    list:[
      'Your calendar is the cap. Every dollar is tied to an hour you personally work.',
      'Every launch starts from zero because there is no always-on way in.',
      'A crowded market makes a generic offer invisible, no matter how good you are.' ] },

  {t:'content',
    kick:'What scaling really means',
    h2:'Leverage, not more labour',
    body:'Scaling a group offer means one thing you teach reaches many people at once, on your terms. The work goes into building the offer once, not delivering it one body at a time.' },

  {t:'part', n:'2', kick:'Part two', h2:'The Scalable method' },

  {t:'framework',
    kick:'The four foundations',
    h2:'What a scalable offer is built on',
    cards:[
      { h:'Scale', p:'What it actually means to scale a group offer, and the model that makes it possible.' },
      { h:'Foundations', p:'The pieces your offer needs in place before it can sell on repeat.' },
      { h:'Saturated', p:'How to stand out and be chosen in a market full of people who sound the same.' },
      { h:'No-brainer', p:'Turning your offer into something that sells easily, whatever the competition.' } ] },

  {t:'content',
    kick:'Foundation one: Scale',
    h2:'Design the offer for many, from day one',
    body:'A scalable offer is shaped as a group container, not a one-to-one package with extra seats bolted on. We start from the outcome and build the model backwards.' },

  {t:'content',
    kick:'Foundation two: Foundations',
    h2:'The pieces that make it sell on repeat',
    list:[
      'A single, specific transformation your buyer can name.',
      'Proof of the path, drawn from the results you already create.',
      'A price and a promise that match the value, not the hours.' ] },

  {t:'content',
    kick:'Foundation three: Saturated',
    h2:'Be the obvious choice in a crowded feed',
    body:'In a saturated market, the generalist disappears. You win by owning one angle so clearly that the right person feels you are speaking only to them.' },

  {t:'content',
    kick:'Foundation four: No-brainer',
    h2:'Make the yes easy',
    body:'When the outcome is specific, the proof is real, and the offer is shaped for how your buyer actually decides, the sale stops feeling like persuasion.' },

  {t:'content',
    kick:'The funnel: Feminine Funnels',
    h2:'Selling that feels aligned, not pushy',
    body:'The mechanics stay simple: an opt-in, a nurture, and the offer. What changes is the energy behind them. Feminine Funnels pairs the structure with a way of selling that feels like you.' },

  {t:'part', n:'3', kick:'Part three', h2:'Your calendar, once one offer scales' },

  {t:'content',
    kick:'The picture',
    h2:'One offer, filled on repeat',
    list:[
      'A signature group offer you are proud of and can deliver at scale.',
      'An always-on path that brings in people who have never heard of you.',
      'Revenue that grows without another hour added to your week.' ] },

  {t:'why',
    kick:'Why me',
    h2:'Em Ducharme',
    body:'I spent fourteen years building and scaling businesses, first as a sales and strategy consultant, then scaling my own past the multiple six and seven figure mark. I teach coaches, therapists, and experts to do it with one scalable offer and funnels that feel aligned.',
    brand:'Featured in Forbes and Entrepreneur.' },

  {t:'recap',
    kick:'The one thing',
    big:'Stop selling your hours. Build one <span class="a">scalable</span> offer, and fill it on repeat.' },

  {t:'cta',
    kick:'Your next step',
    h2:'Ready to build yours?',
    body:'If you want help turning your expertise into one scalable signature offer, this is exactly what we do inside my programs.',
    steps:[
      'Join Zero to CEO to build and scale your signature offer with me.',
      'Or step into the Energetic Empires for ongoing, high-level support.' ],
    disclaimer:'This masterclass is for educational purposes only. It is not a guarantee of income or results. Building a business takes work, and outcomes vary from person to person.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (['title','trap','reframe','recap','part'].includes(s.t) ? ' center' : '');
  let html = '';
  if (s.kick) html += `<div class="kick">${s.kick}</div>`;
  if (s.t === 'part') {
    html = `<div class="kick">${s.kick}</div><div class="part-n">${s.n}</div><h2 style="margin-top:12px">${s.h2}</h2>`;
  } else {
    if (s.h1) html += `<h1>${s.h1}</h1>`;
    if (s.big) html += `<div class="big">${s.big}</div>`;
    if (s.h2) html += `<h2>${s.h2}</h2>`;
    if (s.lede) html += `<div class="lede">${s.lede}</div>`;
    if (s.body) html += `<p class="body">${s.body}</p>`;
    if (s.list) html += '<ul>' + s.list.map(x => `<li>${x}</li>`).join('') + '</ul>';
    if (s.cards) html += '<div class="grid2">' + s.cards.map(c => `<div class="cardlet"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('') + '</div>';
    if (s.steps) html += '<ul class="cta-steps">' + s.steps.map(x => `<li>${x}</li>`).join('') + '</ul>';
    if (s.brand) html += `<div class="brandline">${s.brand}</div>`;
    if (s.disclaimer) html += `<div class="foot-note">${s.disclaimer}</div>`;
  }
  html += `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
