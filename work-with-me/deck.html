<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Adventurepreneur Course Map — Courtney Burton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3f0;        /* her cream ground (brand.json) */
    --panel:#eae9e9;     /* her light-grey body bg */
    --ink:#1a1814;       /* her body ink */
    --muted:#55615f;     /* muted teal-grey derived from accent */
    --accent:#2e4447;    /* her deep pine-teal footer brand color */
    --accent2:#3f5c60;   /* her lighter teal */
    --gold:#ffdc56;      /* her trail-marker gold, used once */
    --rule:#cfd6d2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--panel);font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink)}
  .deck{max-width:1040px;margin:0 auto}
  .slide{
    position:relative;background:var(--bg);min-height:86vh;margin:28px 18px;border-radius:14px;
    padding:68px 72px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 var(--rule),0 18px 40px rgba(26,24,20,.06);overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .eyebrow{font-family:'Bebas Neue',sans-serif;letter-spacing:.14em;font-size:19px;color:var(--accent);text-transform:uppercase;margin-bottom:22px}
  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em;line-height:.98;font-size:72px;margin-bottom:22px}
  h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em;line-height:1.02;font-size:52px;margin-bottom:20px}
  p{font-size:22px;line-height:1.55;max-width:34em;color:var(--ink)}
  p.lede{font-size:26px;color:var(--muted)}
  .sub{font-size:24px;color:var(--muted);line-height:1.5;max-width:34em;margin-top:6px}
  ul{list-style:none;margin-top:14px}
  li{font-size:23px;line-height:1.5;padding:14px 0 14px 40px;position:relative;border-bottom:1px solid var(--rule);max-width:36em}
  li::before{content:"";position:absolute;left:4px;top:24px;width:14px;height:14px;background:var(--accent);border-radius:3px;transform:rotate(45deg)}
  li b{font-weight:700}
  .step{display:flex;gap:22px;align-items:flex-start;margin:16px 0;max-width:40em}
  .step .n{font-family:'Bebas Neue',sans-serif;font-size:46px;line-height:.9;color:var(--accent);min-width:58px}
  .step .b{font-size:22px;line-height:1.5}
  .step .b b{font-size:24px;display:block;margin-bottom:3px}
  .reframe h1{font-size:60px;max-width:16em}
  .pill{display:inline-block;font-family:'Bebas Neue',sans-serif;letter-spacing:.1em;background:var(--accent);color:var(--bg);padding:6px 16px;border-radius:6px;font-size:20px;margin-bottom:26px}
  .cta h1{font-size:64px}
  .disclaimer{margin-top:30px;font-size:15px;color:var(--muted);max-width:40em;line-height:1.5}
  .foot{position:absolute;right:30px;bottom:22px;font-family:'Bebas Neue',sans-serif;letter-spacing:.12em;font-size:15px;color:var(--muted)}
  .count{position:absolute;left:30px;bottom:22px;font-size:13px;color:var(--muted)}
  .gold{color:var(--accent);border-bottom:3px solid var(--gold);padding-bottom:2px}
  @media (max-width:720px){
    .slide{padding:44px 30px}h1{font-size:48px}h2{font-size:38px}.reframe h1,.cta h1{font-size:42px}p,li,.step .b{font-size:19px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title'},
  {t:'list',eyebrow:'What you\'ll walk out with',h:'The map, not the guesswork.',items:[
    ['A clear idea','the one transformation your course should sell, pulled out of everything you know.'],
    ['A real structure','how to shape your expertise into a course anyone can follow without you in the room.'],
    ['A business model','how to build high-ticket and recurring revenue in from day one, not bolt it on later.']
  ]},
  {t:'section',eyebrow:'Who this is for',h:'You have the expertise. You just can\'t clone yourself.',sub:'This is for the coach, practitioner, or seasonal-business owner who already has a proven offer, a waitlist, and no more hours left to sell.'},
  {t:'point',eyebrow:'The trap',h:'Your best work is trapped in your calendar.',p:'Every dollar you make still costs you an hour of your life. Grow, and you work more. Travel, and the revenue stops. The thing you are genuinely great at is the exact thing keeping you stuck.'},
  {t:'reframe',eyebrow:'The reframe',h:'You don\'t have a time problem. You have a packaging problem.'},
  {t:'point',eyebrow:'Part one',h:'Why "someday" never comes.',p:'Most experts never ship the course because the knowledge lives in their head as instinct, not as a system. You can do it in your sleep, which is exactly why it feels impossible to teach. So it stays a someday project. For years.'},
  {t:'list',eyebrow:'The three "someday" blockers',h:'What actually stops the course.',items:[
    ['Too much to teach','you try to pour in everything you know instead of the one transformation.'],
    ['The tech fear','you think you need a studio and a stack of software. You don\'t.'],
    ['One-off thinking','you price it like a product instead of building recurring revenue in from the start.']
  ]},
  {t:'point',eyebrow:'The myth',h:'The tech is not the hard part.',p:'Cameras, funnels, and software are the easiest thing to learn and the last thing that matters. The hard part is deciding what to teach and in what order. Get that right and the tech takes an afternoon.'},
  {t:'section',eyebrow:'Part two',h:'The Adventurepreneur Course Map.',sub:'Three moves that turn what you already know into a course anyone can follow, and a business that runs while you are off-grid.'},
  {t:'steps',eyebrow:'The method',h:'Extract. Structure. Autopilot.',steps:[
    ['01','Extract','We pull the expertise out of your head and name the one transformation you deliver. Instinct becomes a method you can point at.'],
    ['02','Structure','That method becomes a repeatable, professionally structured curriculum anyone can follow, without you in the room.'],
    ['03','Autopilot','The course is built to deliver and enroll on its own, so it keeps working while you are on the trail.']
  ]},
  {t:'point',eyebrow:'Move one, up close',h:'Start with one transformation.',p:'Not everything you know. One before, one after, one person you take from here to there. When the promise is that clear, the outline writes itself and the student actually finishes.'},
  {t:'point',eyebrow:'The difference',h:'Build it like the top 1%, not like a hobby.',p:'A hobby launch sells a cheap course once and hopes for the next one. A top-1% launch has three things engineered in from day one.'},
  {t:'list',eyebrow:'Built in from day one',h:'The three pillars.',items:[
    ['High-ticket strategy','the course is the front door to a premium offer, not the whole business.'],
    ['Marketing structure','a repeatable path from stranger to student, so enrollment is a system, not a scramble.'],
    ['Recurring revenue','monthly income designed in from the first launch, not bolted on later.']
  ]},
  {t:'point',eyebrow:'The pillar most people skip',h:'Recurring revenue is a design choice.',p:'You decide it at the start, not after the launch. A membership, a next-step container, a reason to stay. That is the difference between a payday and a business that pays you every month.'},
  {t:'point',eyebrow:'Part three',h:'What this actually looks like.',p:'A course that keeps enrolling students while you are hiking. A calendar that is finally yours. Income that grows when you are away, not only when you are logged on.'},
  {t:'point',eyebrow:'Why me',h:'I built a business I run from anywhere, then mapped how.',p:'I am an adventurepreneur and business coach. I turned my own expertise into courses and a mastermind, and I reverse-engineered the exact roadmap so adventure-loving women can do the same. That roadmap is what I teach inside the Academy.'},
  {t:'point',eyebrow:'My promise to you',h:'A roadmap with accountability, not a folder of videos.',p:'Inside the Academy the work is guided and the structure holds you to it. That is why it carries a real ROI guarantee rather than a vague satisfaction promise.'},
  {t:'point',eyebrow:'The promise',h:'Invest upfront. Save time. Scale.',p:'The work is real and it is front-loaded. You build the map once. Then it gives you back the one thing you cannot make more of, for the rest of your business.'},
  {t:'cta'}
];

const EL=document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='reframe'?'reframe':s.t==='cta'?'cta':'');
  let h='';
  if(s.t==='title'){
    h=`<div class="pill">Adventurepreneur Course Academy</div>
       <h1>The <span class="gold">Adventurepreneur</span><br>Course Map</h1>
       <p class="lede">How to turn what you already know into a course that funds the life you actually want.</p>
       <p class="sub">A live masterclass with Courtney Burton.</p>`;
  }else if(s.t==='section'){
    h=`<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.h)}</h1><p class="sub">${esc(s.sub)}</p>`;
  }else if(s.t==='point'){
    h=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2>${esc(s.h)}</h2><p>${esc(s.p)}</p>`;
  }else if(s.t==='reframe'){
    h=`<div class="eyebrow">${esc(s.eyebrow)}</div><h1>${esc(s.h)}</h1>`;
  }else if(s.t==='list'){
    h=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2>${esc(s.h)}</h2><ul>`+
      s.items.map(it=>`<li><b>${esc(it[0])}:</b> ${esc(it[1])}</li>`).join('')+`</ul>`;
  }else if(s.t==='steps'){
    h=`<div class="eyebrow">${esc(s.eyebrow)}</div><h2>${esc(s.h)}</h2>`+
      s.steps.map(st=>`<div class="step"><div class="n">${esc(st[0])}</div><div class="b"><b>${esc(st[1])}</b>${esc(st[2])}</div></div>`).join('');
  }else if(s.t==='cta'){
    h=`<div class="pill">Your next step</div>
       <h1>Ready to build your map?</h1>
       <p class="sub">Apply to the Adventurepreneur Course Academy. Six months of high-touch coaching and mastermind to build, launch, and scale your course, backed by a real ROI guarantee.</p>
       <p style="margin-top:18px;font-size:23px"><b>coachcourtneyburton.com</b> &nbsp;&middot;&nbsp; Apply to work with Courtney.</p>
       <div class="disclaimer">This masterclass is educational. No specific result or income is guaranteed. Results vary and depend on your own work, market, and effort.</div>`;
  }
  d.innerHTML=h+`<div class="foot">Courtney Burton</div><div class="count">${i+1} / ${S.length}</div>`;
  EL.appendChild(d);
});
</script>
</body>
</html>
