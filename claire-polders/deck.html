<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trusted Narrator, a masterclass by Claire Polders</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2e9; --panel:#efe6d6; --rule:#2a2520; --ink:#2a2520; --accent:#9c5a3c;
    --head:'Cormorant Garamond',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e7ddcc;color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 16px}
  .slide{background:var(--bg);border:1px solid #d8ccb6;border-radius:10px;padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 #fff inset}
  .slide .kick{font-family:var(--body);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.08;margin-bottom:14px}
  .lede{font-family:var(--head);font-weight:400;font-style:italic;font-size:24px;color:#4b4139;margin-top:10px}
  p{font-size:18px;margin-top:12px;max-width:62ch}
  ul{margin:16px 0 0 0;padding:0;list-style:none}
  li{font-size:18px;padding:10px 0 10px 26px;position:relative;border-top:1px solid #e0d4bf;max-width:62ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:2px;background:var(--accent)}
  .big{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.14;letter-spacing:-.01em}
  .accent{color:var(--accent)}
  .foot{margin-top:28px;font-size:14px;color:#6a5f54}
  .disc{font-size:14px;color:#6a5f54;margin-top:22px;max-width:70ch}
  .num{font-family:var(--head);font-size:15px;color:var(--accent);font-weight:600;margin-bottom:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', html:`<div class="kick">A live masterclass for writers</div>
    <h1>The Trusted Narrator</h1>
    <div class="lede">How to write a voice readers follow anywhere.</div>
    <div class="foot">with Claire Polders, author of six books</div>`},

  {t:'who', html:`<div class="kick">Who this is for</div>
    <h2>You have written something real.</h2>
    <p>You are working on a novel, a memoir, or a collection, and the pages are good. But the responses keep landing in the same place: "close, but not quite for us." You have revised the plot twice. It did not move the needle.</p>`},

  {t:'trap', html:`<div class="kick">The trap</div>
    <h2>So you keep fixing the story.</h2>
    <p>More structure. A tighter outline. Another beat sheet. The advice everywhere tells you the problem is the plot, so you keep rebuilding the plot. And the manuscript keeps getting passed on for a reason no rejection letter ever names.</p>`},

  {t:'reframe', html:`<div class="kick">The real reason</div>
    <div class="big">Readers rarely quit because the story is weak. They quit the moment they stop <span class="accent">trusting the voice</span> telling it.</div>`},

  {t:'part', html:`<div class="num">Part one</div>
    <h2>Trust is decided early, and on the sentence.</h2>
    <p>An agent, an editor, a browsing reader. They all make the same small decision in the first pages: do I believe the person telling me this? That decision is made in the prose long before the plot has a chance to pay off.</p>`},

  {t:'body', html:`<div class="kick">What losing trust looks like</div>
    <h2>The small tells that break the spell.</h2>
    <ul>
      <li>The cliche that tells the reader you reached for the nearest words.</li>
      <li>The metaphor that decorates instead of revealing.</li>
      <li>The overwriting that says the same thing three times.</li>
      <li>The unearned detail that the narrator could not actually know.</li>
    </ul>`},

  {t:'part', html:`<div class="num">Part two</div>
    <h2>Three craft moves that build a trusted narrator.</h2>
    <p>This is the core of the class. Not plot mechanics. The handful of decisions on the page that make a reader lean in and stay.</p>`},

  {t:'move', html:`<div class="num">Move one</div>
    <h2>Treat the narrator as a character.</h2>
    <p>A narrator is not a neutral camera. It has a distance, a temperature, a set of things it notices and things it refuses to say. When you choose those on purpose, the voice stops wobbling and the reader settles in.</p>`},

  {t:'move', html:`<div class="num">Move two</div>
    <h2>Style matters, line by line.</h2>
    <p>Trust is rebuilt or lost in every sentence. Cut the cliche. Earn the metaphor or delete it. Cure the overwriting. This is the self edit that separates a manuscript that reads like a book from one that reads like a draft.</p>`},

  {t:'move', html:`<div class="num">Move three</div>
    <h2>Make every word earn its place.</h2>
    <p>A story under a thousand words has nowhere to hide weak writing. The discipline of compression, learned from the flash masters, is the fastest way to hear the dead weight in a long manuscript and lift it out.</p>`},

  {t:'apply', html:`<div class="kick">Putting it to work</div>
    <h2>The trust pass.</h2>
    <p>One read of your own pages with a single question in hand: where would a stranger stop believing this narrator? You mark those places first. You fix the voice there before you touch another plot point.</p>`},

  {t:'show', html:`<div class="kick">What changes</div>
    <h2>Same story, different book.</h2>
    <p>Nothing in the plot has to move. The narrator simply becomes someone a reader wants to follow into the dark. That is usually the difference between a pass and a yes, and it is almost always a matter of the prose.</p>`},

  {t:'part', html:`<div class="num">Part three</div>
    <h2>Why I teach it this way.</h2>
    <p>I am the author of six books and more than a hundred stories, essays, and flash fictions. I learned voice the hard way: by writing literary English as a second language, where no sentence can run on autopilot and every word has to be chosen.</p>`},

  {t:'why', html:`<div class="kick">The background behind the method</div>
    <ul>
      <li>Six published books, including a flash-fiction collection of fifty tales.</li>
      <li>Years of close reading the masters of compression and voice.</li>
      <li>Teaching writers revision, style, and submission strategy.</li>
      <li>A working author's self-edit, not a theory of one.</li>
    </ul>`},

  {t:'path', html:`<div class="kick">And then the part most classes skip</div>
    <h2>A trusted narrator is also easier to submit.</h2>
    <p>When the voice holds, the pitch gets simpler and the rejections start to teach you something. Submission becomes a craft you run on purpose instead of a lottery you dread.</p>`},

  {t:'recap', html:`<div class="kick">The one thing to keep</div>
    <div class="big">You do not have a story problem. You have a <span class="accent">trust</span> problem. And trust is built on the page, one sentence at a time.</div>`},

  {t:'cta', cls:'cta', html:`<div class="kick">Where to go from here</div>
    <h2>Bring me your manuscript.</h2>
    <p>If you want a working author's read of where your narrator wins and loses a reader's trust, book a manuscript consultation with me. You will get one close read and a clear plan for the voice, not just notes.</p>
    <p class="foot">Book a manuscript consultation at clairepolders.com</p>
    <p class="disc">Educational only. This masterclass teaches craft. No publication, representation, income, or result is guaranteed. Outcomes vary by writer and project.</p>`}
];
const d=document.getElementById('deck');
S.forEach(s=>{const el=document.createElement('section');el.className='slide'+(s.cls?' '+s.cls:'');el.innerHTML=s.html;d.appendChild(el);});
</script>
</body>
</html>
