<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Third Brain - A Masterclass with Jack Myers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Oswald:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe4;      /* warm parchment ground: brand site_scheme light + his Taoist ancient-wisdom book aesthetic */
    --panel:#fbf7ef;
    --rule:#e6ddcc;
    --ink:#1c1a17;     /* near-black (from brand text grays) */
    --muted:#6b655c;
    --accent:#ac151a;  /* Jack Myers signal red, brand.json */
    --head:'Oswald', system-ui, sans-serif;
    --body:'EB Garamond', Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  #deck{max-width:960px;margin:0 auto}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 7vw;border-bottom:1px solid var(--rule);position:relative}
  .kick{font-family:var(--head);text-transform:uppercase;letter-spacing:.18em;
    font-weight:600;font-size:.82rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--head);font-weight:700;line-height:1.02;font-size:clamp(2.6rem,7vw,5rem);
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;line-height:1.06;font-size:clamp(1.9rem,4.4vw,3rem)}
  .lede{font-size:clamp(1.25rem,2.5vw,1.7rem);line-height:1.5;margin-top:1.4rem;max-width:38ch;color:var(--ink)}
  .sub{font-size:1.15rem;line-height:1.55;margin-top:1.1rem;max-width:46ch;color:var(--muted)}
  .num{font-family:var(--head);font-weight:700;font-size:clamp(3rem,9vw,6rem);color:var(--accent);line-height:1}
  .quote{font-size:clamp(1.6rem,3.4vw,2.5rem);line-height:1.32;font-style:italic;max-width:30ch}
  .by{margin-top:2rem;font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;font-size:.8rem;color:var(--muted)}
  ul{list-style:none;margin-top:1.8rem;display:grid;gap:1rem;max-width:52ch}
  li{padding-left:1.4rem;position:relative;font-size:1.18rem;line-height:1.5}
  li:before{content:"";position:absolute;left:0;top:.6em;width:.55rem;height:.55rem;background:var(--accent)}
  .chips{display:flex;flex-wrap:wrap;gap:.7rem;margin-top:1.8rem}
  .chip{font-family:var(--head);text-transform:uppercase;letter-spacing:.1em;font-size:.95rem;
    border:1px solid var(--accent);color:var(--accent);padding:.55rem 1rem}
  .cap h2{color:var(--ink)} .cap .num{margin-bottom:.6rem}
  .rule{width:3.2rem;height:3px;background:var(--accent);margin:1.6rem 0}
  .disc{margin-top:2.4rem;font-size:.95rem;color:var(--muted);max-width:54ch;line-height:1.5}
  .cta h1{color:var(--accent)}
  .foot{position:absolute;bottom:3.5vh;left:7vw;font-family:var(--head);text-transform:uppercase;
    letter-spacing:.14em;font-size:.72rem;color:var(--muted)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A Masterclass with Jack Myers',
    h:'Your Third Brain',
    lede:'How leaders think, decide, and lead in the age of intelligent machines.',
    by:'Jack Myers'},

  {t:'who', kick:'Who this is for',
    h:'The leaders who have to decide.',
    sub:'CEOs, C-suite executives, and board members who know AI is reshaping their organization this year, and who refuse to hand their judgment to a machine to figure it out.'},

  {t:'trap', kick:'The trap',
    h:'More tools. More speed. Less clarity.',
    sub:'Every week brings another model, another mandate, another dashboard. The instinct is to adopt faster. But adopting faster without thinking harder is how good leaders quietly stop leading.'},

  {t:'reframe', kick:'The real risk',
    quote:'"The risk was never that AI replaces you. It is that, surrounded by it, you slowly stop thinking for yourself."'},

  {t:'part', kick:'Part One', num:'01', h:'Why judgment erodes.'},

  {t:'point', kick:'The core problem',
    h:'Abundance outruns discernment.',
    sub:'When answers are infinite and instant, the scarce resource is no longer information. It is the judgment to know which answer matters, and the nerve to own the call.'},

  {t:'point', kick:'What you already run',
    h:'You lead with two brains.',
    list:['First Brain: instinct and intuition, fast and ancient.',
      'Second Brain: the accumulated civilization you inherited, your institutions, memory, knowledge, and culture.',
      'Both were built for a world that changed slower than you did.']},

  {t:'part', kick:'Part Two', num:'02', h:'The Third Brain.'},

  {t:'point', kick:'The definition',
    h:'A layer you build on purpose.',
    sub:'The Third Brain is the intentional, co-intelligent infrastructure a leader builds in the space between their own judgment and the AI environment now surrounding them. It is not a tool. It is a discipline.'},

  {t:'cap', kick:'Capacity one', num:'01', h:'Discernment.',
    sub:'Pulling signal from noise without freezing. Deciding what deserves your attention when everything demands it.'},

  {t:'cap', kick:'Capacity two', num:'02', h:'Integration.',
    sub:'Holding complexity without forcing a premature answer. Letting tension stay useful instead of collapsing it to feel decisive.'},

  {t:'cap', kick:'Capacity three', num:'03', h:'Accountability.',
    sub:'An existential commitment to the outcome. The machine can draft the decision. It cannot own the consequence. You do.'},

  {t:'quote', kick:'The thesis',
    quote:'"You cannot build judgment infrastructure in an organization whose leaders have not built it in themselves."'},

  {t:'part', kick:'Part Three', num:'03', h:'The Tao of leading it.'},

  {t:'principles', kick:'The Myers Blueprint',
    h:'Five principles that keep it human.',
    sub:'Drawn from The Tao of Leadership. They let you move fast on innovation without losing the stability your people stand on.',
    chips:['Harmony','Flexibility','Balance','Simplicity','Integrity']},

  {t:'point', kick:'FusionFlow',
    h:'Harmonize the machine and the human.',
    sub:'A working method for integrating AI and rapid innovation into how your teams operate, without sacrificing creativity, empathy, or the organization you have to keep standing.'},

  {t:'point', kick:'The first ninety days',
    h:'A quarter of building it.',
    list:['Name the decisions only a human should own, and defend them.',
      'Put the five principles against your real roadmap, not a slide.',
      'Build the shared judgment layer so it survives the next model release.']},

  {t:'why', kick:'Why learn this from me',
    h:'Fifty years reading what comes next.',
    sub:'I have advised leaders at General Motors, The Walt Disney Company, Microsoft, Comcast NBCUniversal, and CBS, founded The Myers Report, and written The Tao of Leadership and Your Third Brain. I have watched every media and technology shift of the last five decades arrive early and loud. This one is different, and leaders are the variable.'},

  {t:'recap', kick:'In one breath',
    h:'Discernment. Integration. Accountability.',
    sub:'Three capacities, five principles, one leader who still does the thinking. That is the Third Brain.'},

  {t:'cta', cls:'cta', kick:'Your next step',
    h:'Build it with me.',
    sub:'Bring the Third Brain to your leadership team. Reach out through jackmyers.com to start a conversation about advisory and coaching for you and your executives.',
    disc:'Educational content only. No income, role, performance, or business result is guaranteed. Results vary with each leader and each organization.'}
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' '+s.cls : '') + (s.t==='cap'?' cap':'');
  let h = '';
  if(s.kick) h += '<div class="kick">'+s.kick+'</div>';
  if(s.num) h += '<div class="num">'+s.num+'</div>';
  if(s.h) h += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.quote) h += '<p class="quote">'+s.quote+'</p>';
  if(s.lede) h += '<p class="lede">'+s.lede+'</p>';
  if(s.chips){ h += '<div class="rule"></div><div class="chips">'+s.chips.map(c=>'<span class="chip">'+c+'</span>').join('')+'</div>'; }
  if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if(s.list){ h += '<ul>'+s.list.map(i=>'<li>'+i+'</li>').join('')+'</ul>'; }
  if(s.by) h += '<div class="by">'+s.by+'</div>';
  if(s.disc) h += '<p class="disc">'+s.disc+'</p>';
  h += '<div class="foot">Your Third Brain / Jack Myers</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
