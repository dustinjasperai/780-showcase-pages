<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Somatic Secret to Secure Love — a live masterclass with Becky Aste</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aboreto&family=Abhaya+Libre:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ec;      /* warm cream, from her #f5f3e7 */
    --ink:#2a4472;     /* deep navy, her dominant */
    --accent:#5f81be;  /* soft blue, her button */
    --muted:#6b7488;
    --panel:#ece7da;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Abhaya Libre',Georgia,serif;}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px;}
  .slide{background:var(--bg);border:1px solid rgba(42,68,114,.14);border-radius:14px;
    padding:60px 58px;margin:22px 0;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(42,68,114,.05);}
  .kicker{font-family:'Aboreto',serif;letter-spacing:.22em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 20px;}
  h1{font-family:'Aboreto',serif;font-weight:400;font-size:46px;line-height:1.12;margin:0 0 18px;
    letter-spacing:.01em;}
  h2{font-family:'Aboreto',serif;font-weight:400;font-size:33px;line-height:1.18;margin:0 0 16px;}
  p{font-size:21px;line-height:1.5;margin:0 0 14px;max-width:46ch;}
  .lede{font-size:24px;color:var(--ink);}
  .sub{color:var(--muted);font-size:19px;}
  .rule{width:64px;height:3px;background:var(--accent);border:0;margin:0 0 26px;}
  ol{font-size:21px;line-height:1.55;padding-left:1.1em;max-width:52ch;}
  ol li{margin:0 0 10px;}
  .num{font-family:'Aboreto',serif;color:var(--accent);font-size:15px;letter-spacing:.2em;}
  .presenter{color:var(--muted);font-size:18px;margin-top:10px;}
  .disclaimer{color:var(--muted);font-size:15px;line-height:1.5;margin-top:26px;max-width:60ch;}
  .cta{background:var(--ink);color:var(--bg);border-radius:14px;}
  .cta .kicker{color:#aebfe0;}
  .cta p{color:#e7ecf6;}
  .foot{color:var(--muted);font-size:13px;text-align:center;margin-top:30px;
    font-family:'Aboreto',serif;letter-spacing:.14em;text-transform:uppercase;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Root to Rise &middot; I Do Breakthrough</div>
<script>
const S=[
  {t:'title', k:'A live masterclass', h:'The Somatic Secret to Secure Love',
   s:'How a marriage starts healing through your own body, even before he is on board.',
   p:'With Becky Aste, trauma-informed somatic marriage coach'},

  {t:'who', k:'Who this is for', h:'For the wife who has already tried everything in her head.',
   s:'Ambitious. High-functioning. Capable in every other room of her life. And quietly carrying a marriage that feels further away every year.'},

  {t:'trap', k:'The trap', h:'You read the books. You did the therapy. You had the hard talks.',
   s:'And the distance is still there. On the outside you are holding it all together. Underneath, you are the only one still trying.'},

  {t:'hook', k:'A different way in', h:'You cannot talk your way back to intimacy.',
   s:'Connection is not a thought you can reason your way into. The body keeps the score, and the body is where repair actually begins.'},

  {t:'part', k:'Part One', h:'Why nothing has worked yet'},

  {t:'point', k:'The ceiling of talk', h:'Your mind has run out of road.',
   s:'You have analyzed this marriage from every angle. Insight has not moved it, because the thing holding the distance in place does not live in your thinking.'},

  {t:'point', k:'What therapy misses', h:'Talk therapy can keep you stuck at best.',
   s:'Re-telling the story in your head can keep the nervous system locked in the same loop, and for some women it quietly re-opens the wound instead of closing it.'},

  {t:'part', k:'Part Two', h:'The body-first foundation'},

  {t:'point', k:'The mechanism', h:'About 80% of your nervous system talks body to brain.',
   s:'Only a small part of the signal runs the other way. So if you start in the mind, you are working with a fraction of the loop. Start in the body and you reach the rest.'},

  {t:'point', k:'The stance', h:'Trade judgment for curiosity.',
   s:'The Curious Explorer meets a tight chest or a flash of anger with a question instead of a verdict. Curiosity is what lets a guarded body feel safe enough to soften.'},

  {t:'secrets', k:'The method', h:'The Somatic Secret to Secure Love',
   s:'Four pieces, taught live, in the order a real repair actually happens.'},

  {t:'point', k:'Secret One', h:'The communication nobody taught you.',
   s:'Not scripts and not fair-fighting rules. A way of being in your own body first, so the words that come out can finally be received.'},

  {t:'point', k:'Secret Two', h:'Why more therapy was not the answer.',
   s:'Understanding why the usual path kept you stuck, so you can stop blaming yourself for the fact that it did not work.'},

  {t:'point', k:'Secret Three', h:'You can move first, even if he is not on board.',
   s:'One regulated nervous system changes the dynamic in the room. You do not need him in a chair across from you to begin.'},

  {t:'point', k:'Secret Four', h:'Restoring intimacy by reading your body signals.',
   s:'Your body already knows the difference between bracing and opening. Learning to read its signals is the fastest route back to desire and closeness.'},

  {t:'part', k:'Part Three', h:'What coming home to each other feels like'},

  {t:'point', k:'The on-ramp', h:'Three practices you can start with.',
   s:'Somatic mindfulness to notice what is really happening. Grounding to steady it. And releasing the stuck energy your body has been holding for years.'},

  {t:'point', k:'The shift', h:'From surviving the marriage to thriving intimacy.',
   s:'Not a performance of being fine. A marriage that feels safe and alive again, built from the inside out.'},

  {t:'why', k:'Why me', h:'Becky Aste',
   s:'Trauma-informed somatic marriage coach, founder of I Do Breakthrough and the Root to Rise collective, and host of the Your Breakthrough Blueprint podcast. I took my own marriage from the brink of divorce to thriving intimacy, and this is the path I now teach.'},

  {t:'cta', k:'Your next step', h:'Come do this work inside Root to Rise.',
   s:'If something here landed, the next step is to apply to work with me and my team in the Root to Rise collective, and we will see if it is the right fit for where your marriage is now.',
   d:'This masterclass is education, not therapy or medical advice. Nothing here is a promise of any specific outcome. No result is guaranteed. Results vary from person to person.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach(function(sl){
  const d=el('div','slide'+(sl.t==='cta'?' cta':''));
  if(sl.k)d.appendChild(el('div','kicker',sl.k));
  if(sl.t==='part'){
    d.appendChild(el('hr','rule'));
    d.appendChild(el('h1',null,sl.h));
  } else if(sl.t==='title'){
    d.appendChild(el('h1',null,sl.h));
    if(sl.s)d.appendChild(el('p','lede',sl.s));
    if(sl.p)d.appendChild(el('div','presenter',sl.p));
  } else {
    d.appendChild(el('hr','rule'));
    d.appendChild(el('h2',null,sl.h));
    if(sl.s)d.appendChild(el('p','sub',sl.s));
  }
  if(sl.d)d.appendChild(el('div','disclaimer',sl.d));
  deck.appendChild(d);
});
</script>
</body>
</html>
