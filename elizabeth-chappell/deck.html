<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Quilt to Pattern Business — a Quilters Candy masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Martel:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5;
    --panel:#efeae3;
    --rule:#a6b5bc;
    --ink:#465159;
    --accent:#e9a195;
    --display:'Montserrat',system-ui,sans-serif;
    --serif:'Martel',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  #deck{max-width:960px;margin:0 auto}
  .slide{
    min-height:88vh;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 6vw;border-bottom:1px solid var(--rule);position:relative;
  }
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:.72rem;color:var(--accent);margin-bottom:1.2rem}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(1.9rem,4.6vw,3.3rem);
    line-height:1.08;color:var(--ink);margin-bottom:1rem}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(1.4rem,3.2vw,2.2rem);
    line-height:1.15;margin-bottom:1rem}
  p{font-size:clamp(1.02rem,1.7vw,1.22rem);line-height:1.6;max-width:60ch;margin-bottom:.8rem}
  .sub{color:#5f6b73}
  ul{list-style:none;max-width:60ch}
  li{font-size:clamp(1rem,1.6vw,1.18rem);line-height:1.5;padding:.55rem 0 .55rem 1.6rem;
    position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:'';position:absolute;left:0;top:1.05rem;width:.7rem;height:.7rem;
    background:var(--accent);transform:rotate(45deg)}
  .quilt{position:absolute;top:6vh;right:6vw;display:grid;grid-template-columns:repeat(3,18px);
    grid-template-rows:repeat(3,18px);gap:3px;opacity:.9}
  .quilt span{display:block}
  .big{font-family:var(--display);font-weight:700;font-size:clamp(3rem,9vw,6rem);
    color:var(--accent);line-height:1}
  .disc{font-size:.82rem;color:#7b858c;max-width:62ch;margin-top:1.4rem}
  .foot{position:absolute;bottom:3vh;left:6vw;font-family:var(--display);font-size:.7rem;
    letter-spacing:.12em;text-transform:uppercase;color:var(--rule)}
  .nav{position:fixed;bottom:14px;right:18px;font-family:var(--display);font-size:.75rem;
    color:var(--ink);background:var(--panel);border:1px solid var(--rule);
    border-radius:999px;padding:6px 12px}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav" id="nav"></div>
<script>
  const S = [
    {t:'title', k:'A Quilters Candy masterclass', h:'From Quilt to Pattern Business', s:'Turn one design into income that repeats, with Elizabeth Chappell.'},
    {t:'promise', k:'What you will walk away with', h:'A real plan for your first sellable pattern', b:['How a single design becomes a product that keeps earning','The full path from sketch to a written, professional pattern','How finished patterns get into distribution so they sell on their own']},
    {t:'who', k:'Who this is for', h:'Quilters with designs and no business yet', s:'You already make quilts people admire. What you do not have yet is a way to turn those designs into patterns other quilters pay for, again and again.'},
    {t:'trap', k:'The drawer problem', h:'Your best designs are sitting in a drawer', s:'A beautiful quilt is a gift or a one off. A few free PDFs float around and earn nothing. The craft is real. The business was never built.'},
    {t:'reframe', k:'The reframe', h:'The design is not the business', s:'The written, tested, distributed pattern is the business. That is the gap between a hobby and income, and it is a skill you can learn.'},
    {t:'part', k:'Part one', h:'Why great designs never sell'},
    {t:'reasons', k:'The three reasons', h:'It is almost never the design', b:['No professional pattern is written, so no one can actually make it','No niche or positioning, so no one knows it is for them','No distribution, so it never reaches the quilters who would buy it']},
    {t:'part', k:'Part two', h:'The Craft to Career pipeline', s:'The system I teach, one pillar at a time.'},
    {t:'pillar', k:'Pillar one', h:'Business basics and your niche', s:'Before you draw anything, decide who the line is for and what makes it recognisable. The positioning is the product as much as the quilt is.'},
    {t:'pillar', k:'Pillar two', h:'The design to vector pipeline', s:'Design the quilt top in EQ8, then rebuild it to a professional, print ready standard in Adobe Illustrator and InDesign. This is the step most quilters never cross.'},
    {t:'pillar', k:'Pillar three', h:'Writing a pattern quilters love', s:'Instructions another quilter can actually follow: tested, graded, diagrammed. A polished pattern is what people come back and buy again.'},
    {t:'pillar', k:'Pillar four', h:'Distribution and recurring revenue', s:'Create once, sell forever. Getting patterns into distribution accounts is how one design keeps earning while you sleep.'},
    {t:'pillar', k:'Pillar five', h:'Growing the business', s:'From the first pattern into a full line, a membership, fabric, teaching. This is the Craft to Career arc.'},
    {t:'inside', k:'Inside a pattern business', h:'What a week starts to look like', b:['A new pattern drafted and tested, not just dreamed about','Orders coming in on patterns you wrote months ago','A shop or distributor carrying your line for you']},
    {t:'why', k:'Why me', h:'I build patterns for a living', s:'I design fabric for Art Gallery Fabrics, wrote a published quilt book, and have run Quilters Candy for ten years. I teach the exact pipeline I use.'},
    {t:'proof', k:'The track record', h:'What this path has produced', b:['1,232 quilters taught through the course','125 alumni now holding distribution accounts','45 alumni earning six or more figures a year']},
    {t:'recap', k:'The whole idea in one line', h:'You have the designs. Let us build the business.', s:'Write it once, write it well, and get it where quilters can buy it.'},
    {t:'cta', k:'Your next step', h:'Come to the free live masterclass', s:'I run a live session walking through this pipeline and open the Quilt Pattern Writing Course once a year. Join the free training and start your first sellable pattern.', disc:'No income or business result is guaranteed. Results vary and depend on your own work, designs, and market.'}
  ];

  const deck = document.getElementById('deck');
  const sq = () => {
    let cells = '';
    const cols = ['var(--accent)','var(--rule)','var(--ink)'];
    for(let i=0;i<9;i++){ cells += '<span style="background:'+cols[(i*2+1)%3]+'"></span>'; }
    return '<div class="quilt">'+cells+'</div>';
  };
  S.forEach((s,i)=>{
    const el = document.createElement('section');
    el.className = 'slide';
    let html = '';
    if(i>0) html += sq();
    if(s.k) html += '<div class="kicker">'+s.k+'</div>';
    if(s.t==='title'){ html += '<h1>'+s.h+'</h1>'; if(s.s) html += '<p class="sub">'+s.s+'</p>'; }
    else { html += '<h2>'+s.h+'</h2>'; }
    if(s.s && s.t!=='title') html += '<p>'+s.s+'</p>';
    if(s.b){ html += '<ul>'; s.b.forEach(x=> html += '<li>'+x+'</li>'); html += '</ul>'; }
    if(s.t==='proof'){ html += '<div class="big" style="margin-top:1rem">45</div>'; }
    if(s.disc) html += '<p class="disc">'+s.disc+'</p>';
    html += '<div class="foot">Quilters Candy'+'  '+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
    el.innerHTML = html;
    deck.appendChild(el);
  });

  const nav = document.getElementById('nav');
  const sections = Array.from(document.querySelectorAll('.slide'));
  function cur(){
    const mid = window.innerHeight/2;
    let idx = 0;
    sections.forEach((sec,i)=>{ const r = sec.getBoundingClientRect(); if(r.top < mid) idx = i; });
    return idx;
  }
  function paint(){ nav.textContent = (cur()+1)+' / '+sections.length; }
  window.addEventListener('scroll', paint); paint();
  document.addEventListener('keydown', e=>{
    if(e.key==='ArrowRight'||e.key==='ArrowDown'){ const n=Math.min(cur()+1,sections.length-1); sections[n].scrollIntoView({behavior:'smooth'});}
    if(e.key==='ArrowLeft'||e.key==='ArrowUp'){ const n=Math.max(cur()-1,0); sections[n].scrollIntoView({behavior:'smooth'});}
  });
</script>
</body>
</html>
