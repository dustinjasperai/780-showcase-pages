<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connection Before Curriculum — A Masterclass with Jackie Wiebe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#221E52; --panel:#2C2868; --rule:#3A3680; --accent:#12b1e6; --ink:#F4F3FB;
    --muted:#B9B6D8; --deep:#161436;
    --head:'Spectral', Georgia, serif; --body:'Open Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:18px;padding:56px 56px 52px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.12}
  .sub{font-size:21px;color:var(--muted);margin-top:18px;max-width:40ch;line-height:1.5}
  .body{font-size:22px;line-height:1.55;margin-top:20px;max-width:52ch}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  li{position:relative;padding-left:30px;font-size:21px;line-height:1.5;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .partnum{font-family:var(--head);font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .pill{display:flex;align-items:baseline;gap:22px}
  .pn{font-family:var(--head);font-size:64px;font-weight:700;color:var(--accent);opacity:.85;line-height:1}
  .cta{background:var(--panel);border:1px solid var(--accent)}
  .ctaline{margin-top:24px;font-size:20px;font-weight:700;color:var(--accent)}
  .disc{margin-top:28px;font-size:13px;color:var(--muted);line-height:1.5;max-width:60ch}
  .foot{position:absolute;right:28px;bottom:20px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .n{position:absolute;left:28px;bottom:20px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:'title', kicker:'A live masterclass with Jackie Wiebe', h:'Connection Before Curriculum', sub:'How to stop the daily struggle and build a homeschool that actually works for your family.'},
  {t:'audience', h:'This is for you if', list:['You are thinking about homeschooling and feel unsure','You started, and it is turning into a daily fight','You are drowning in curriculum choices and still feel behind']},
  {t:'reframe', kicker:'The reframe', h:'The problem was never the curriculum', body:'A disconnected home cannot be fixed by a better workbook. A connected one makes almost any curriculum work.'},
  {t:'promise', kicker:'What you will leave with', h:'A calmer, clearer way to homeschool', body:'By the end of this hour you will know what to fix first, why the daily power struggles happen, and how to build days that fit your real family.'},
  {t:'part', num:'Part One', h:'Why homeschooling feels so hard'},
  {t:'problem', h:'The curriculum-first trap', body:'Most parents start by choosing a program, then try to make their child fit it. When it does not work, they blame themselves or buy another one.'},
  {t:'problem', h:'Overwhelm is the real curriculum', body:'The guilt, the comparison, the pressure to recreate school at home. That is what derails a homeschool day, not the lesson plan.'},
  {t:'problem', h:'What you were sold', body:'Buy the right curriculum and homeschooling will click. For most families it does not, because the hard part was never academic.'},
  {t:'part', num:'Part Two', h:'Connection Before Curriculum'},
  {t:'framework', kicker:'The idea in one line', h:'Relationship first, learning follows', body:'Nurture the relationship first, then let the learning follow. Homeschooling is about life, not school.'},
  {t:'pillar', pn:'01', h:'Connect before you correct', body:'Repair the relationship before you worry about the workbook. A child who feels safe will learn. A child in a power struggle will not.'},
  {t:'pillar', pn:'02', h:'Live and learn your way', body:'There is no one right way to homeschool. Clarify your family goals and build days that fit your real life, not a classroom calendar.'},
  {t:'pillar', pn:'03', h:'Find the learning already there', body:'Children are out in the world learning every day. Spot it, name it, and count it, instead of forcing it.'},
  {t:'pillar', pn:'04', h:'Coach the parent, not only the child', body:'Future-focused mindset work for you: routines, boundaries, and emotional regulation, because you set the weather in the home.'},
  {t:'part', num:'Part Three', h:'A real homeschool week, connection first'},
  {t:'example', h:'A calmer Tuesday', body:'Ten minutes of connection before any correction. Follow one real interest. End the day having learned something together, not having won a fight.'},
  {t:'example', h:'From surviving to connecting', body:'The goal is not a perfect transcript. It is a child who still wants to learn and a parent who is not running on empty.'},
  {t:'whyme', kicker:'Why listen to me', h:'Jackie Wiebe', body:'A licensed educator, certified life coach, and homeschool mom of 15+ years. I run HomeSchool ThinkTank and the parenting podcast families in over 100 countries listen to.'},
  {t:'cta', kicker:'Your next step', h:'Let us talk about your family', body:'If this is the way you want to homeschool, book a free consultation with me. A calm conversation about where you are and what would help, not a sales pitch.', ctaline:'Book a free consultation at homeschoolthinktank.com', disc:'Educational content only. No income or result is guaranteed. Results vary by family and circumstances.'}
];
const el=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let html='';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='part'){ html+='<div class="partnum">'+s.num+'</div><h1 style="margin-top:12px">'+s.h+'</h1>'; }
  else if(s.t==='pillar'){ html+='<div class="pill"><div class="pn">'+s.pn+'</div><div><h2>'+s.h+'</h2><div class="body">'+s.body+'</div></div></div>'; }
  else if(s.t==='title'){ html+='<h1>'+s.h+'</h1>'; if(s.sub) html+='<div class="sub">'+s.sub+'</div>'; }
  else { html+='<h2>'+s.h+'</h2>'; }
  if(s.list){ html+='<ul>'; s.list.forEach(x=>html+='<li>'+x+'</li>'); html+='</ul>'; }
  if(s.body && s.t!=='pillar') html+='<div class="body">'+s.body+'</div>';
  if(s.ctaline) html+='<div class="ctaline">'+s.ctaline+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  html+='<span class="n">'+(i+1)+' / '+S.length+'</span><span class="foot">HomeSchool ThinkTank</span>';
  d.innerHTML=html;
  el.appendChild(d);
});
</script>
</body>
</html>
