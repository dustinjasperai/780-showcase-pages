<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The EUREKA Onboarding Playbook, Ramli John</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf8f7;       /* warm-white ground (brand light scheme) */
    --panel:#eff1f6;    /* brand panel */
    --ink:#1f2e54;      /* brand dominant navy */
    --muted:#6e7891;    /* brand slate */
    --accent:#ffc200;   /* brand gold button */
    --head:"Space Grotesk", system-ui, sans-serif;
    --body:"IBM Plex Sans", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 64px}
  .slide{
    background:#fffdfb;border:1px solid #e7e3df;border-radius:18px;
    padding:52px 54px;margin:18px 0;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(31,46,84,.04);position:relative;overflow:hidden
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--muted)}
  .rail{font-family:var(--head);font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.04em}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;margin:14px 0 10px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.14;margin:10px 0 14px;letter-spacing:-.01em}
  .lead{font-size:20px;color:var(--muted);max-width:48ch}
  .big{font-size:30px;line-height:1.28;font-weight:500;max-width:30ch}
  .big b{color:var(--ink);background:linear-gradient(transparent 62%, #ffe483 62%)}
  ul{list-style:none;margin:16px 0 0}
  li{font-size:19px;padding:11px 0 11px 34px;position:relative;border-top:1px solid #efece8;max-width:60ch}
  li:first-child{border-top:0}
  li::before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .step{display:flex;align-items:baseline;gap:18px}
  .glyph{font-family:var(--head);font-weight:700;font-size:64px;color:var(--ink)}
  .glyph span{color:var(--accent)}
  .note{margin-top:18px;font-size:16px;color:var(--muted);max-width:56ch}
  .present{margin-top:20px;font-size:16px;color:var(--ink);font-weight:500}
  .cta h1{font-size:40px}
  .btn{display:inline-block;margin-top:22px;background:var(--accent);color:var(--ink);
    font-family:var(--head);font-weight:700;font-size:18px;padding:15px 26px;border-radius:12px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .pg{position:absolute;right:22px;bottom:16px;font-size:12px;color:#b9bccb;font-family:var(--head)}
  .rowtiles{display:flex;gap:14px;flex-wrap:wrap;margin-top:18px}
  .tile{background:var(--panel);border-radius:12px;padding:16px 18px;font-weight:600;color:var(--ink);font-size:16px}
  @media(max-width:620px){.slide{padding:34px 26px}h1{font-size:34px}h2{font-size:26px}.glyph{font-size:46px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass with Ramli John',
    title:'The EUREKA Onboarding Playbook',
    lead:'How B2B product teams cut time-to-first-value from days to minutes, and turn new users into lifelong customers.',
    present:'Ramli John, author of Product-Led Onboarding, founder of Delight Path' },

  {t:'content', rail:'Who this is for',
    title:'If you own activation, this is for you',
    points:[
      'VPs, Directors, and Heads of Product in B2B SaaS',
      'Teams past product-market fit, now trying to scale activation',
      'Anyone watching sign-ups stay healthy while usage stalls in week one' ] },

  {t:'content', rail:'The trap',
    title:'You shipped a great product. Activation is still flat.',
    lead:'More features did not move it. A redesigned dashboard did not move it. The problem is not the product. It is the first run.' },

  {t:'big', rail:'The reframe',
    title:'Where new users are really lost',
    big:'Most B2B products do not lose new users after the free trial. They lose them in the <b>first session</b>, before they ever reach value.' },

  {t:'content', rail:'Part one, the problem',
    title:'The hierarchy of B2B user friction',
    lead:'Friction is not one thing. It stacks, and you have to remove it in order.',
    points:[
      'Mechanical friction: steps, fields, and setup that slow the first win',
      'Cognitive friction: the user cannot tell what to do next, or why',
      'Emotional friction: they do not yet believe this will work for them' ] },

  {t:'content', rail:'Part one, the problem',
    title:'Why more features never fix it',
    lead:'Every feature you add is one more thing a brand-new user has to understand. Onboarding is the one place where less is the growth lever.' },

  {t:'glyph', rail:'Part two, the method',
    title:'The EUREKA framework',
    lead:'Five steps that fast-growing B2B companies follow to get users to value fast.',
    glyph:'EUREKA' },

  {t:'step', rail:'E', glyph:'E',
    title:'Establish a cross-functional onboarding team',
    lead:'Onboarding fails when it belongs to no one. Name the owners across product, design, and customer success before you touch a flow.' },

  {t:'step', rail:'U', glyph:'U',
    title:'Understand what user success actually means',
    lead:'Not the feature you want adopted. The outcome the user hired your product for. Define that moment precisely enough to measure it.' },

  {t:'step', rail:'RE', glyph:'RE',
    title:'REverse journey-map to that success moment',
    lead:'Start at the win and map backwards to the first click. Every step that does not move the user toward the win is a candidate to cut.' },

  {t:'step', rail:'K', glyph:'K',
    title:'Keep new users engaged early',
    lead:'The first days decide the next year. Use the right nudges, in-product and over email, to pull users back to the next step, not to every feature.' },

  {t:'step', rail:'A', glyph:'A',
    title:'Apply, analyze, and repeat',
    lead:'Treat onboarding as a product, not a project. Instrument it, read where users stall, and ship the next change. The loop never closes.' },

  {t:'content', rail:'The engine',
    title:'Reverse journey-mapping, in practice',
    lead:'Most teams map forward from sign-up and bury the user in setup. Mapping backward from the success moment forces a shorter, truer path.',
    points:[
      'Write the sentence: "The user is successful when ______"',
      'List only the steps that are strictly required to get there',
      'Delete, defer, or automate everything else out of the first session' ] },

  {t:'big', rail:'The promise',
    title:'Time to first value',
    big:'Done right, time-to-first-value drops from <b>days to minutes</b>. That single number moves activation, retention, and expansion behind it.' },

  {t:'content', rail:'Part three, in practice',
    title:'A week-one that works',
    lead:'A new user reaches their first real outcome inside the first session, gets a reason to come back the next day, and sees progress by the end of week one. Nothing in that sequence is an accident.' },

  {t:'content', rail:'The AI layer',
    title:'Where AI actually helps onboarding',
    lead:'AI will not fix why users quit. It will let a small team do the parts that used to need headcount.',
    points:[
      'Draft and personalize onboarding emails per use case',
      'Summarize where real users stall, from session data',
      'Prototype a better first-run flow in hours, not sprints' ] },

  {t:'content', rail:'Why listen to me',
    title:'This is not theory',
    lead:'I wrote Product-Led Onboarding, over 40,000 copies sold, and EUREKA, the onboarding playbook for high-growth B2B. The framework was built with companies like Zapier, Mixpanel, Outsystems, and Vidyard.' },

  {t:'content', rail:'Recap',
    title:'What to take back to your team',
    points:[
      'Activation is won or lost in the first session, not the trial',
      'Remove friction in order: mechanical, cognitive, emotional',
      'Run EUREKA: establish, understand, reverse-map, keep, apply',
      'Measure one number first, time to first value' ] },

  {t:'cta', rail:'Your next step',
    title:'Figure out AI and activation with peers at your level',
    lead:'The Product Leaders Lab is a private, application-only community of VPs, Directors, and Heads of Product working through this together. I review every application personally.',
    btn:'Apply to the Product Leaders Lab',
    disc:'This masterclass is educational. It is not a guarantee of any specific result. Outcomes depend on your product, team, and execution.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let h = '';
  if (s.kicker) h += `<div class="kick">${s.kicker}</div>`;
  if (s.rail)   h += `<div class="rail">${s.rail}</div>`;
  if (s.t === 'glyph') h += `<div class="glyph">${s.glyph.replace('RE','R<span>E</span>').replace(/^E$/,'<span>E</span>')}</div>`;
  if (s.t === 'step') h += `<div class="step"><div class="glyph"><span>${s.glyph}</span></div><div><h2>${s.title}</h2>${s.lead?`<div class="lead">${s.lead}</div>`:''}</div></div>`;
  if (s.t === 'title') h += `<h1>${s.title}</h1>`;
  if (s.t !== 'title' && s.t !== 'step' && s.title) h += `<h2>${s.title}</h2>`;
  if (s.t === 'title' && s.lead) h += `<div class="lead">${s.lead}</div>`;
  if (s.t === 'big') h += `<div class="big">${s.big}</div>`;
  if (s.lead && s.t!=='title' && s.t!=='step') h += `<div class="lead">${s.lead}</div>`;
  if (s.points){ h += '<ul>' + s.points.map(p=>`<li>${p}</li>`).join('') + '</ul>'; }
  if (s.tiles){ h += '<div class="rowtiles">' + s.tiles.map(t=>`<div class="tile">${t}</div>`).join('') + '</div>'; }
  if (s.present) h += `<div class="present">${s.present}</div>`;
  if (s.btn) h += `<div><span class="btn">${s.btn}</span></div>`;
  if (s.disc) h += `<div class="disc">${s.disc}</div>`;
  h += `<div class="pg">${i+1} / ${S.length}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
