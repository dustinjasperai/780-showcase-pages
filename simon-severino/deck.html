<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Repeatable Sale - Live Masterclass with Simon Severino</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans+Extra+Condensed:wght@500;700;800&family=Rubik:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a;        /* brand footer navy */
    --panel:#1d2736;     /* lifted navy */
    --rule:#2b3a4f;
    --accent:#1a53e6;    /* brand electric blue, 28 uses */
    --highlight:#f7eb2d; /* brand yellow */
    --ink:#eef2f7;
    --muted:#9fb0c3;
    --head:'Fira Sans Extra Condensed', sans-serif;
    --body:'Rubik', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0d131d;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;color:var(--accent);font-weight:700;font-size:15px;margin-bottom:18px}
  .num{position:absolute;right:28px;top:22px;font-family:var(--head);color:var(--muted);font-size:13px;letter-spacing:.1em}
  h1{font-family:var(--head);font-weight:800;font-size:60px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.05}
  .sub{color:var(--muted);font-size:21px;margin-top:20px;font-weight:300;max-width:42ch}
  p.lead{font-size:23px;line-height:1.5;margin-top:10px;max-width:46ch}
  .big{font-size:30px;line-height:1.35;font-weight:500;max-width:42ch}
  .big .hl{color:var(--highlight)}
  .big .ac{color:var(--accent);font-weight:600}
  ul{margin:26px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.4;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  li b{font-family:var(--head);font-weight:700;letter-spacing:.01em}
  li span{color:var(--muted);font-weight:300}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .col{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px 22px}
  .col h3{font-family:var(--head);font-weight:700;font-size:17px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
  .col.a h3{color:var(--muted)}
  .col.b h3{color:var(--accent)}
  .col p{font-size:16px;line-height:1.5;color:var(--muted);padding:6px 0}
  .levers{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:30px}
  .lever{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:24px 20px;text-align:center}
  .lever .k{font-family:var(--head);font-weight:800;font-size:26px;color:var(--highlight)}
  .lever .d{color:var(--muted);font-size:15px;margin-top:8px}
  .week{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:30px}
  .day{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 10px;text-align:center}
  .day .dn{font-family:var(--head);font-weight:700;color:var(--muted);font-size:15px;letter-spacing:.08em}
  .day.on{border-color:var(--accent)}
  .day.on .dn{color:var(--accent)}
  .day .da{font-size:13px;color:var(--ink);margin-top:8px;min-height:30px}
  .cred{margin-top:24px;font-size:20px;line-height:1.6}
  .cred b{color:var(--ink);font-family:var(--head);font-weight:700}
  .stat{display:inline-block;color:var(--highlight);font-family:var(--head);font-weight:800}
  .disclaimer{color:var(--muted);font-size:13px;margin-top:30px;max-width:60ch;line-height:1.5;font-weight:300}
  .ctaline{font-family:var(--head);font-weight:700;font-size:24px;color:var(--accent);margin-top:26px}
  .brandbar{font-family:var(--head);letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'Live Masterclass',h1:'The Repeatable Sale',sub:'How B2B founders close bigger deals without being the only closer.',brand:'Strategy Sprints with Simon Severino'},
  {t:'who',eyebrow:'Who this is for',h2:'You lead the company and you still lead every deal',lead:'B2B founders in consulting, software and financial services. The revenue works, but it runs through you. When you are busy closing, nobody is prospecting, and the pipeline goes quiet.'},
  {t:'trap',eyebrow:'The trap',h2:'You are the best closer in the building',big:'And that is exactly the problem. <span class="ac">Feast or famine</span>. Deals that go quiet after the proposal. Great months you cannot repeat on purpose.'},
  {t:'hook',eyebrow:'The reframe',h2:'More activity will not fix this',big:'More cold emails will not fix it. More AI follow-ups will not fix it. <span class="hl">A sales system will.</span> One your team can run without you in the room.'},
  {t:'part',eyebrow:'Part One',h2:'Why founder-led sales stalls'},
  {t:'list',eyebrow:'The three leaks',h2:'It is never a motivation problem',items:[
    ['No repeatable process','every call is improvised, so results cannot compound'],
    ['You are the bottleneck','the deal needs you, so growth is capped at your calendar'],
    ['Price lands before value','you quote before the buyer has named the cost of doing nothing']]},
  {t:'levers',eyebrow:'What actually moves B2B sales',h2:'Three levers, not a hundred activities',levers:[
    ['Win rate','more of the right deals closed'],
    ['Profit','bigger deals, fewer discounts'],
    ['Sales velocity','less time from first call to signed']]},
  {t:'part',eyebrow:'Part Two',h2:'The Strategy Sprints method'},
  {t:'cadence',eyebrow:'The operating rhythm',h2:'Set the week Monday. Score it Friday.',week:[
    ['Mon','Set the week',true],['Tue','',false],['Wed','',false],['Thu','',false],['Fri','Score it',true]],
    foot:'Run in 90 day cycles. Small improvements, many times a week, until the engine compounds. Double the money for half the work.'},
  {t:'framework',eyebrow:'The core framework',h2:'The 8 Steps of the Repeatable Sale',lead:'The right things, in the right order, on every call, until you lead the conversation instead of chasing it.'},
  {t:'list',eyebrow:'Steps 1 to 4',h2:'Lead the conversation',items:[
    ['Visualize','picture what they want, then lead toward it'],
    ['Frustration','name what is not working and what they have tried'],
    ['Importance','why this matters, and why now'],
    ['Cost of Inaction','they say out loud what doing nothing costs']]},
  {t:'list',eyebrow:'Steps 5 to 8',h2:'Close in their words',items:[
    ['Deliverables','they define what success looks like'],
    ['Investment','time, then people, then money'],
    ['Starting Date','a real date, not "soon"'],
    ['Statement of Work','ready to sign, written in their words']]},
  {t:'list',eyebrow:'So the team runs it, not just you',h2:'Two meetings install the habit',items:[
    ['The Pipeline Meeting','the whole team spots and creates opportunities'],
    ['The Deal-Review Meeting','every live deal scored against the 8 Steps'],
    ['New hires lead from week one','they run the process instead of inventing one']]},
  {t:'part',eyebrow:'Part Three',h2:'Your first 90 day cycle'},
  {t:'cols',eyebrow:'The shift',h2:'From this, to this',cola:['Before',['Begging and chasing buyers','Losing deals to competitors','Feast or famine revenue','The business cannot run without you']],colb:['After',['Leading every sales conversation','Winning at the prices you want','A pipeline you actually trust','A system that works harder than you']]},
  {t:'cred',eyebrow:'Why this method',h2:'Built with founders, in the field',credhtml:'<p class="cred">Simon Severino, author of <b>Strategy Sprints</b> (Kogan Page) and <b>Time Freedom</b> with Jay Abraham. Host of the Strategy Sprints Podcast.</p><p class="cred"><span class="stat">2,400+</span> B2B founders have run these programs, from consultancies to software and finance firms, averaging <span class="stat">130%+</span> revenue growth across a 90 day cycle.</p>'},
  {t:'recap',eyebrow:'The whole method in one line',h2:'Install the repeatable sale',big:'A weekly scored system, the <span class="ac">8 Steps</span> on every call, run in 90 day cycles, so your <span class="hl">team closes, not just you</span>.'},
  {t:'cta',eyebrow:'Your next step',h1:'Run your first Sprint',sub:'Book a 1:1 Strategy Sprint with Simon, or join the 200K Club and train with founders every week.',cta:'strategysprints.com',disclaimer:'This masterclass is educational. It is not a guarantee of income or results. Outcomes depend on your market, your offer, and the work you put in. Past client results are examples, not promises.'}
];
const deck=document.getElementById('deck');
function li(items){return '<ul>'+items.map(function(x){return '<li><b>'+x[0]+'</b> <span>'+x[1]+'</span></li>'}).join('')+'</ul>'}
S.forEach(function(s,i){
  const d=document.createElement('div');d.className='slide';
  let h='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.eyebrow)h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1)h+='<h1>'+s.h1+'</h1>';
  if(s.h2)h+='<h2>'+s.h2+'</h2>';
  if(s.sub)h+='<div class="sub">'+s.sub+'</div>';
  if(s.lead)h+='<p class="lead">'+s.lead+'</p>';
  if(s.big)h+='<p class="big">'+s.big+'</p>';
  if(s.items)h+=li(s.items);
  if(s.levers)h+='<div class="levers">'+s.levers.map(function(l){return '<div class="lever"><div class="k">'+l[0]+'</div><div class="d">'+l[1]+'</div></div>'}).join('')+'</div>';
  if(s.week){h+='<div class="week">'+s.week.map(function(w){return '<div class="day'+(w[2]?' on':'')+'"><div class="dn">'+w[0]+'</div><div class="da">'+w[1]+'</div></div>'}).join('')+'</div>';if(s.foot)h+='<p class="sub">'+s.foot+'</p>'}
  if(s.cola){h+='<div class="cols"><div class="col a"><h3>'+s.cola[0]+'</h3>'+s.cola[1].map(function(x){return '<p>'+x+'</p>'}).join('')+'</div><div class="col b"><h3>'+s.colb[0]+'</h3>'+s.colb[1].map(function(x){return '<p>'+x+'</p>'}).join('')+'</div></div>'}
  if(s.credhtml)h+=s.credhtml;
  if(s.cta)h+='<div class="ctaline">'+s.cta+'</div>';
  if(s.brand)h+='<div class="brandbar">'+s.brand+'</div>';
  if(s.disclaimer)h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  d.innerHTML=h;deck.appendChild(d);
});
</script>
</body>
</html>
