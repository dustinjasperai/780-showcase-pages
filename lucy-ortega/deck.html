<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First-Gen CEO Method — Lucy Ortega</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Karla:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF4EC; --panel:#F3E7D7; --rule:#E2CDB4; --ink:#2A1F18;
    --muted:#6E5C4C; --accent:#B5472D;
    --head:'Newsreader',Georgia,serif; --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 64px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:0 0 20px;min-height:340px;display:flex;flex-direction:column;
    justify-content:center}
  .kick{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin:0 0 14px}
  h1{font-family:var(--head);font-weight:600;font-size:46px;line-height:1.08;margin:0 0 16px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.12;margin:0 0 14px}
  .sub{font-size:19px;line-height:1.5;color:var(--muted);margin:0;max-width:62ch}
  p.body{font-size:18px;line-height:1.55;margin:10px 0 0;max-width:64ch}
  .big{font-family:var(--head);font-size:30px;line-height:1.2;font-weight:500;max-width:60ch}
  ul{margin:14px 0 0;padding:0;list-style:none;max-width:64ch}
  li{position:relative;padding:10px 0 10px 30px;font-size:18px;line-height:1.45;
    border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;
    background:var(--accent);border-radius:2px}
  .num{font-family:var(--head);font-size:15px;color:var(--accent);font-weight:600;
    letter-spacing:.04em;margin:0 0 6px}
  .quote{font-family:var(--head);font-size:34px;line-height:1.22;font-weight:500;max-width:22ch}
  .quote .es{color:var(--accent)}
  .foot{font-size:12px;color:var(--muted);letter-spacing:.14em;text-transform:uppercase;
    margin-top:auto;padding-top:22px}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:18px;max-width:60ch}
  .cta-step{font-size:20px;line-height:1.5;margin:6px 0 0;max-width:60ch}
  @media(max-width:560px){.slide{padding:32px 24px}h1{font-size:34px}h2{font-size:27px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title',
   kick:'A live masterclass with Lucy Ortega',
   h:"The First-Gen CEO Method",
   sub:"Turn your money story and your culture into a business that pays you. For first-gen Latina women building something no one in the family has built before."},

  {t:'who',
   kick:'Who this is for',
   h:"You are the first",
   body:"First in your family to start a business. No one at the dinner table to ask about pricing, risk, or payroll. You carry the dream and the doubt at the same time, and most business advice was never written for where you come from."},

  {t:'hook',
   kick:'The real reason it feels stuck',
   big:"It is not your strategy that is capping your business. It is the money story you inherited before you ever opened the doors."},

  {t:'part',
   num:'Part One',
   h:"The money story you were handed",
   body:"Growing up first-gen, money was scarce, stressful, sometimes shameful. That story does not disappear when you become a founder. It shows up as underpricing, as fear of the next bet, as guilt every time you earn more than the people who raised you."},

  {t:'list',
   kick:'How the inherited story shows up',
   h:"You might recognize these",
   list:[
     "You discount before anyone even asks.",
     "You wait to feel ready instead of taking the bet.",
     "You feel guilty charging what the work is worth.",
     "You shrink the dream so it does not scare the family."
   ]},

  {t:'quote',
   kick:'The doctrine I teach',
   quote:['“El que no arriesga, ','no gana.”'],
   body:"He who does not risk does not gain. Calculated risk early is how you learn fast and build sooner, instead of waiting for a certainty that never comes."},

  {t:'part',
   num:'Part Two',
   h:"The First-Gen CEO Method",
   body:"Four moves, in order. Each one takes the thing you thought was holding you back and turns it into the engine of the business."},

  {t:'pillar',
   num:'Pillar 1',
   h:"Reframe the money wound",
   body:"Name the inherited story out loud, then separate it from today's facts. When money stops being shameful, you price from value instead of fear, and you let yourself receive."},

  {t:'pillar',
   num:'Pillar 2',
   h:"Take the calculated bet",
   body:"El que no arriesga, no gana. Pick the smallest real bet that moves the business, make it fast, and let the result teach you. Speed of learning beats the illusion of being ready."},

  {t:'pillar',
   num:'Pillar 3',
   h:"Your story is the offer",
   body:"Your culture and your family story are not a side note, they are the thing that makes you magnetic. Learn to tell it so the right people feel seen and choose you over the generic option."},

  {t:'pillar',
   num:'Pillar 4',
   h:"Build the CEO identity",
   body:"Confidence is a skill, not a personality trait. Daily habits and CEO-level self-talk move you from running a side project to running a company that can hold your ambition."},

  {t:'list',
   kick:'The quiet multiplier',
   h:"Celebrate on the way up",
   body:"The habit most first-gen founders skip:",
   list:[
     "Mark the wins in real time, not only at the finish line.",
     "Let your family see the proof as it happens.",
     "Build on momentum instead of waiting to feel worthy."
   ]},

  {t:'part',
   num:'Part Three',
   h:"On the other side of the old money story",
   body:"Not a different person, the same you, running the business from a different story."},

  {t:'list',
   kick:'The shift',
   h:"From the old story to the CEO",
   list:[
     "You price from value and say the number without flinching.",
     "You make the bet this quarter instead of next year.",
     "Your story becomes your marketing, in your own voice.",
     "You lead the business instead of apologizing for it."
   ]},

  {t:'why',
   kick:'Why me',
   h:"I have lived both sides of this",
   body:"Raised in South Central LA with financial instability, I became the first in my family to build businesses, from Sierra Mexican Cuisine to coaching first-gen Latina founders. I host The First-Gen CEO Podcast because I needed this map and no one handed it to me."},

  {t:'recap',
   kick:'The method, in one line',
   big:"Reframe the money. Take the bet. Tell your story. Lead like a CEO."},

  {t:'cta',
   kick:'Your next step',
   h:"Let's build your First-Gen CEO year",
   step:"If you are ready to stop letting the old money story set your prices, book a strategy session with me and we will map your next calculated bet together.",
   disc:"Educational only. No income or result is guaranteed. Results vary and depend on your offer, your effort, and your market."}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  const root=document.getElementById('deck');
  S.forEach(function(s){
    const d=document.createElement('section'); d.className='slide';
    let html='';
    if(s.kick) html+='<p class="kick">'+esc(s.kick)+'</p>';
    if(s.num) html+='<p class="num">'+esc(s.num)+'</p>';
    if(s.t==='title'||s.t==='cta'||s.t==='who'||s.t==='part'||s.t==='pillar'||s.t==='why'){
      if(s.h) html+='<h1>'+esc(s.h)+'</h1>';
    } else if(s.h){ html+='<h2>'+esc(s.h)+'</h2>'; }
    if(s.sub) html+='<p class="sub">'+esc(s.sub)+'</p>';
    if(s.big) html+='<p class="big">'+esc(s.big)+'</p>';
    if(s.quote) html+='<p class="quote">'+esc(s.quote[0])+'<span class="es">'+esc(s.quote[1])+'</span></p>';
    if(s.body) html+='<p class="body">'+esc(s.body)+'</p>';
    if(s.list){ html+='<ul>'; s.list.forEach(function(i){html+='<li>'+esc(i)+'</li>';}); html+='</ul>'; }
    if(s.step) html+='<p class="cta-step">'+esc(s.step)+'</p>';
    if(s.disc) html+='<p class="disc">'+esc(s.disc)+'</p>';
    html+='<p class="foot">By Lucy Ortega &middot; The First-Gen CEO Method</p>';
    d.innerHTML=html; root.appendChild(d);
  });
}
render();
</script>
</body>
</html>
