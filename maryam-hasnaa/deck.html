<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trained Sensitive, a Live Masterclass with Maryam Hasnaa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Forum&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241611;      /* warm cocoa ground, from brand terracotta family */
    --panel:#332019;   /* raised panel */
    --rule:#4a2f25;    /* hairline rule */
    --accent:#c17272;  /* dominant dusty-rose, brand.json 130 uses */
    --ink:#f0e0d3;      /* warm cream text, brand footer bg */
    --muted:#c9b0a2;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Work Sans",system-ui,sans-serif;font-weight:300}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .eyebrow{font-family:"Work Sans";font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:"Forum",serif;font-weight:400;font-size:52px;line-height:1.08;letter-spacing:.01em}
  h2{font-family:"Forum",serif;font-weight:400;font-size:38px;line-height:1.15;margin-bottom:18px}
  p{font-size:20px;line-height:1.6;max-width:62ch;color:var(--ink)}
  p+p{margin-top:16px}
  .lead{font-size:24px}
  .big{font-family:"Forum",serif;font-size:44px;line-height:1.2;color:var(--accent)}
  ul{list-style:none;margin-top:18px}
  li{font-size:21px;line-height:1.5;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pill{display:inline-block;font-family:"Work Sans";font-weight:600;font-size:13px;letter-spacing:.06em;color:var(--bg);background:var(--accent);padding:7px 16px;border-radius:999px;margin-bottom:24px;align-self:flex-start}
  .foot{position:absolute;bottom:20px;left:52px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .num{position:absolute;bottom:20px;right:52px;font-size:12px;color:var(--muted)}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:26px;max-width:66ch;font-weight:300}
  .cta-step{font-size:22px;line-height:1.5;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:"A Live Masterclass with Maryam Hasnaa",
    h1:"The Trained Sensitive",
    p:"How to stop drowning in everyone else's energy and start reading it on purpose." },

  {t:'who',
    eyebrow:"Who this is for",
    h2:"You feel everything, and it is a lot",
    bullets:[
      "You walk into a room and you already know who is upset, who is pretending, who is in pain.",
      "You carry moods home that were never yours to begin with.",
      "You have been called too much, too sensitive, too intense since you were small.",
      "You suspect your sensitivity is actually a gift, but no one ever taught you how to use it." ] },

  {t:'trap',
    eyebrow:"The trap",
    h2:"You were handed a radio and no dial",
    p:"Most highly sensitive people are given one piece of advice: toughen up, build a wall, feel less. So you spend years trying to shrink the one thing that makes you who you are.",
    p2:"It does not work. You cannot numb your sensitivity without numbing your intuition, your empathy and your creativity along with it." },

  {t:'cost', eyebrow:"What it costs",
    h2:"The quiet price of staying untrained",
    bullets:[
      "Years of people-pleasing, because you feel the other person's disappointment before it lands.",
      "Overstimulation you treat as a personal failing instead of a nervous system doing its job.",
      "Dimming yourself in rooms, relationships and work until you forget what your own frequency even feels like." ] },

  {t:'reframe',
    eyebrow:"The reframe",
    h2:"Sensitivity is not a flaw. It is an untrained signal.",
    big:"The goal was never to feel less. It is to learn to read what you feel, on purpose." },

  {t:'bridge', eyebrow:"The good news",
    h2:"This is a craft, not a personality you are stuck with",
    p:"Everything you are about to see can be learned. Sensitivity is the raw material. The training is what turns it into something you can actually live from.",
    p2:"That is the whole purpose of New Earth Mystery School, and here is how the work is built." },

  {t:'part', pill:"Part One", eyebrow:"The core problem",
    h2:"Your nervous system is doing exactly what it was built to do",
    p:"Roughly fifteen to twenty percent of people are born with a more sensitive nervous system. It takes in more information, more quickly, and holds onto it longer.",
    p2:"Unmanaged, that looks like overwhelm and burnout. Trained, it becomes discernment, deep empathy and a kind of knowing most people never access." },

  {t:'part', pill:"Part Two", eyebrow:"The method",
    h2:"The four things a trained sensitive learns",
    p:"Inside New Earth Mystery School this is the work. Four pillars, in order." },

  {t:'pillar', eyebrow:"Pillar one", h2:"Energy work",
    p:"Meditation, energetic shielding and clearing, so you can be in a crowded, charged room and still come home to your own frequency instead of carrying everyone else's." },

  {t:'pillar', eyebrow:"Pillar two", h2:"Nervous-system training",
    p:"Practices built specifically for the highly sensitive body: how to regulate, how to hold equanimity when the room spikes, how to break rapport and set a boundary while staying open and neutral." },

  {t:'pillar', eyebrow:"Pillar three", h2:"Subtle-body liberation",
    p:"We find the old relational patterns, the templates, running quietly underneath your reactions, and we update them. This is where feeling everything stops meaning being run by everything." },

  {t:'pillar', eyebrow:"Pillar four", h2:"Intuition and discernment",
    p:"Cultivating inner knowing you can trust without needing external proof, and the discernment to tell the difference between a real signal and an old fear wearing its clothes." },

  {t:'signature', eyebrow:"Where it begins", h2:"Your energy signature",
    p:"None of this is one size fits all. Before the pillars, we name how your particular sensitivity runs: your Energetic Archetype, your home frequency, the specific way your signal comes through.",
    p2:"When you know your signature, the practices stop being generic and start being yours." },

  {t:'apothecary', eyebrow:"The support",
    h2:"Subtle plant medicine for subtle work",
    p:"Alongside the practices, we work with subtle plant medicine: flower essences, holy waters, resin blends and herbal baths from Resonance Apothecary. These are gentle allies for the energetic and nervous-system work, not medicine in the clinical sense.",
    p2:"They help the body remember the frequency the practices are pointing it toward." },

  {t:'part', pill:"Part Three", eyebrow:"What becomes possible",
    h2:"What changes when a sensitive gets trained",
    bullets:[
      "The moods in a room become information you can use, not weather you get caught in.",
      "You can stay close to people in pain without taking it home in your body.",
      "Your intuition becomes a tool you consult on purpose, not a surprise that arrives at 3am.",
      "The trait you were taught to apologize for becomes the center of how you live and work." ] },

  {t:'path', eyebrow:"How the work is held",
    h2:"A path you walk with others, not a weekend you forget",
    p:"The training lives in live monthly classes on Zoom, a members portal, and a community of other sensitives walking the same path. Each year follows the energetic themes as they come through.",
    p2:"You are not meant to do this alone, and you are not meant to do it once." },

  {t:'recap', eyebrow:"What you walk away with",
    h2:"By the end, sensitivity works for you",
    bullets:[
      "A named energy signature and the practices that fit it.",
      "The four pillars: energy work, nervous-system training, subtle-body liberation, intuition.",
      "A home frequency you can return to on purpose, in any room." ] },

  {t:'why', eyebrow:"Why me", h2:"I have lived in this my whole life",
    p:"I was raised by two spiritual teachers, in a world of ceremony and the unseen, from before I was born. I am an initiated priestess, an energy worker and a flower practitioner.",
    p2:"New Earth Mystery School and Resonance Apothecary exist because I needed this training to exist, and it did not yet. Now thousands of sensitives learn it here." },

  {t:'cta', eyebrow:"Come train your sensitivity", h2:"Your next step",
    step:"Start by finding your energy signature with the Energetic Archetypes quiz, then join us inside New Earth Mystery School. If you want deeper, one-on-one guidance, the three-month mentorship is where we go all the way in.",
    disclaimer:"This masterclass is educational and spiritual in nature. It is not medical, psychological or mental-health treatment, and it is not a substitute for professional care. No specific result is guaranteed. Results vary from person to person." }
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  let h = "";
  if (s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.pill) h += `<span class="pill">${s.pill}</span>`;
  if (s.h1) h += `<h1>${s.h1}</h1>`;
  if (s.h2) h += `<h2>${s.h2}</h2>`;
  if (s.big) h += `<p class="big">${s.big}</p>`;
  if (s.p) h += `<p class="lead">${s.p}</p>`;
  if (s.p2) h += `<p>${s.p2}</p>`;
  if (s.bullets) h += "<ul>" + s.bullets.map(b => `<li>${b}</li>`).join("") + "</ul>";
  if (s.step) h += `<p class="cta-step">${s.step}</p>`;
  if (s.disclaimer) h += `<p class="disclaimer">${s.disclaimer}</p>`;
  h += `<div class="foot">New Earth Mystery School</div><div class="num">${i+1} / ${S.length}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
