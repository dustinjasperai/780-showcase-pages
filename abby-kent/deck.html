<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Beyond Survival Mode — a masterclass with Abby Kent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#2b3350;        /* deepened form of her dominant slate-blue #3a4468 */
    --panel:#3a4468;     /* her exact site ground */
    --rule:#4a5578;      /* slate-blue tint */
    --accent:#c5d3c0;    /* her sage-green button color */
    --ink:#f5f2eb;       /* her warm-cream heading color */
    --ink-soft:#d7d9cf;
    --ink-muted:#9aa3bd;
  }
  html,body{height:100%}
  body{
    font-family:'Karla',-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vmin}
  .slide{display:none;width:100%;max-width:980px}
  .slide.on{display:block;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:clamp(40px,8vmin,78px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'EB Garamond',Georgia,serif;font-weight:600;font-size:clamp(30px,5.4vmin,52px);line-height:1.1;margin-bottom:26px}
  .sub{font-family:'EB Garamond',Georgia,serif;font-size:clamp(20px,3.3vmin,30px);color:var(--ink-soft);margin-top:24px;line-height:1.4;font-weight:400}
  p{font-size:clamp(16px,2.3vmin,21px);color:var(--ink-soft);line-height:1.6;max-width:40ch}
  .part{font-family:'EB Garamond',Georgia,serif;font-size:clamp(16px,2.4vmin,20px);letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:600}
  ul{list-style:none;margin-top:14px}
  li{font-size:clamp(16px,2.4vmin,22px);color:var(--ink-soft);line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:46ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .lead{font-size:clamp(22px,3.6vmin,34px);font-family:'EB Garamond',Georgia,serif;color:var(--ink);line-height:1.3;max-width:24ch}
  .pillar-no{font-family:'EB Garamond',Georgia,serif;font-size:clamp(60px,12vmin,120px);color:var(--accent);line-height:.8;font-weight:500}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:clamp(28px,5vmin,52px)}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--ink-muted);max-width:60ch;line-height:1.5}
  .credit{margin-top:30px;font-size:15px;color:var(--ink-muted)}
  .horizon{width:64px;height:3px;background:var(--accent);margin:26px 0;border-radius:2px}
  #nav{position:fixed;bottom:22px;right:26px;font-size:12px;color:var(--ink-muted);letter-spacing:.05em;z-index:5}
  #bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);transition:width .3s ease;z-index:5}
  .hint{position:fixed;bottom:22px;left:26px;font-size:12px;color:var(--ink-muted);z-index:5}
  @media(max-width:640px){#stage{padding:8vmin 7vmin}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="nav"></div>
<div class="hint">Use arrow keys &rarr;</div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass with Abby Kent, BSN, RN, NC-BC',
    h1:'Beyond Survival Mode',
    sub:'The nurse’s path back to a life that actually feels like yours.'},

  {t:'promise',
    kicker:'What this hour gives you',
    h2:'By the end, you will have:',
    items:[
      'A clear name for the survival-mode pattern you have been living in, and why willpower never fixed it.',
      'The four-part method I use with nurses to move from running on empty to living on purpose.',
      'One grounded, honest next step you can take this week, at a pace that will not break you.']},

  {t:'who',
    kicker:'Who this is for',
    h2:'You are the one who holds it together.',
    p:'The fixer. The helper. The nurse everyone leans on. You have been told you are too much, too sensitive, too intense, too outside-the-box. And somewhere along the way, holding it all together became the only speed you know.'},

  {t:'trap',
    kicker:'The quiet trap',
    h2:'You are running your whole life on autopilot.',
    items:[
      'You give everything to the shift, the family, the people who need you.',
      'You get home with nothing left for the life that is supposed to be yours.',
      'You call it being strong, and you do it again tomorrow.']},

  {t:'hook',
    kicker:'A harder truth',
    lead:'You are not burned out because you are weak. You are burned out because you have been strong inside a system that never once told you it was okay to stop.'},

  {t:'part', part:'Part One', h2:'What survival mode actually is'},

  {t:'point',
    kicker:'The core problem',
    h2:'Survival mode is not a bad week. It is a setting.',
    p:'It is the nervous system deciding that rest is not safe, that your needs come last, that slowing down means letting someone down. It kept you functioning through the hardest years of nursing. The problem is it never switched off.'},

  {t:'point',
    kicker:'What it quietly costs',
    h2:'The bill comes due in the places no one sees.',
    items:[
      'Your energy, long before your shift is over.',
      'Your relationships, because there is nothing left to give at home.',
      'Your sense of who you are underneath the role.']},

  {t:'point',
    kicker:'Why the usual fixes fail',
    h2:'Another self-care tip will not reach this.',
    p:'A bath, a planner, one more stretch of PTO. They treat the exhaustion like a scheduling problem. Survival mode is not a scheduling problem. It is a whole-self problem, and it needs a whole-self answer.'},

  {t:'part', part:'Part Two', h2:'The four-part method'},

  {t:'pillar', no:'01', kicker:'The method', h2:'Whole-self exploration',
    p:'We stop treating one symptom in isolation. We look at your mindset, your relationships, and your values as one connected system, because that is how your life actually works.'},

  {t:'pillar', no:'02', kicker:'The method', h2:'Clarifying what matters',
    p:'We make intentional space to name what you care about at the deepest level, before we touch a single to-do. Clarity first. Everything downstream gets easier when you know what you are actually for.'},

  {t:'pillar', no:'03', kicker:'The method', h2:'Practical tools you can use',
    p:'Simple, embodied skills for communication, boundaries, prioritization, and decision-making. Not theory. Things you can use on your next shift and in your next hard conversation at home.'},

  {t:'pillar', no:'04', kicker:'The method', h2:'Designing aligned action',
    p:'We turn clarity into creative, purposefully paced steps. Change that is sustainable, instead of one more sprint that lands you right back in the exhaustion you started in.'},

  {t:'ethos',
    kicker:'The heart of it',
    lead:'This work is not about fixing you. It is about helping you uncover the wholeness that is already there.'},

  {t:'part', part:'Part Three', h2:'When the autopilot finally switches off'},

  {t:'point',
    kicker:'A different kind of week',
    h2:'Not a perfect life. A life that feels like yours.',
    items:[
      'You still care deeply, but you are no longer running on empty to do it.',
      'You set a boundary without the guilt spiral that used to follow.',
      'You make decisions from your values instead of from the fear of letting someone down.']},

  {t:'why',
    kicker:'Why trust me with this',
    h2:'I have lived this exact road.',
    p:'I spent nearly fifteen years as a registered nurse, including a nontraditional role as an RN for the North Carolina Highway Patrol. I am a recovering high-achiever who knows what it is like to run life on autopilot. Now, as a Board-Certified Nurse Coach, I walk nurses back out of survival mode the way I had to walk myself.'},

  {t:'cta',
    kicker:'Your next step',
    h2:'Start with one honest conversation.',
    p:'If something here landed, the next step is a first coaching session with me. We look at where you are, name what matters, and find the one grounded move that is actually yours to make. The first session is on me.',
    credit:'Abby Kent, BSN, RN, NC-BC · Abby Kent Coaching · abbykentcoaching.com',
    disclaimer:'This masterclass is for educational purposes only. Coaching is not medical advice, diagnosis, or treatment, and is not psychotherapy, counseling, or a substitute for licensed healthcare or mental health care. Individual results vary; nothing here is a guarantee of any specific outcome.'}
];

const stage=document.getElementById('stage');
const nav=document.getElementById('nav');
const bar=document.getElementById('bar');
let i=0;

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(s){
  let h='<div class="slide on">';
  if(s.kicker) h+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.part){h+=`<div class="part">${esc(s.part)}</div><div class="horizon"></div>`;}
  if(s.h1) h+=`<h1>${esc(s.h1)}</h1>`;
  if(s.pillar_no){}
  if(s.no) h+=`<div class="pillar-no">${esc(s.no)}</div><div class="horizon"></div>`;
  if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
  if(s.lead) h+=`<div class="card"><p class="lead">${esc(s.lead)}</p></div>`;
  if(s.sub) h+=`<div class="sub">${esc(s.sub)}</div>`;
  if(s.p) h+=`<p>${esc(s.p)}</p>`;
  if(s.items){h+='<ul>';s.items.forEach(x=>h+=`<li>${esc(x)}</li>`);h+='</ul>';}
  if(s.credit) h+=`<div class="credit">${esc(s.credit)}</div>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  h+='</div>';
  stage.innerHTML=h;
  nav.textContent=(i+1)+' / '+S.length;
  bar.style.width=((i+1)/S.length*100)+'%';
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render(S[i]);}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ')go(i+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp')go(i-1);
});
document.addEventListener('click',()=>go(i+1));
go(0);
</script>
</body>
</html>
