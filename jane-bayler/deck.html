<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Chosen First Method — Jane Bayler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700;800&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbfc;
    --panel:#f6edf1;
    --rule:#e4ccd6;
    --accent:#cc3366;
    --ink:#2a2328;
    --muted:#6b5b63;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Quicksand',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px;
    margin:0 0 28px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .slide.title{background:var(--panel)}
  .slide.part{background:var(--panel)}
  .eyebrow{font-family:'Montserrat',sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Montserrat',sans-serif;font-weight:800;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Montserrat',sans-serif;font-weight:700;font-size:34px;line-height:1.14;
    margin-bottom:16px}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:46ch}
  p.lead{font-size:23px;color:var(--muted)}
  .big{font-family:'Montserrat',sans-serif;font-weight:800;font-size:40px;line-height:1.12;
    color:var(--accent);max-width:20ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 26px;position:relative;
    border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;
    background:var(--accent);border-radius:3px}
  .num{font-family:'Montserrat',sans-serif;font-weight:800;font-size:15px;color:var(--accent);
    margin-bottom:12px;letter-spacing:.1em}
  .byline{margin-top:26px;font-family:'Montserrat',sans-serif;font-weight:600;
    font-size:16px;color:var(--muted)}
  .disclaimer{margin-top:22px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-note{font-size:20px;color:var(--ink);margin-top:10px}
  .foot{position:absolute;bottom:18px;right:24px;font-family:'Montserrat',sans-serif;
    font-size:12px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'Ideal Client Success, a live masterclass',
   h:'The Chosen First Method',
   lead:'How B2B consultants and experts become the only logical choice, and attract the top 5% of their market.',
   byline:'With Jane Bayler'},

  {t:'who', eyebrow:'Who this is for',
   h:'You are brilliant at the work. You are invisible in the market.',
   p:'This is for the consultant, coach or expert service provider who delivers real results, yet keeps meeting prospects who only ask one question: what does it cost?'},

  {t:'trap', eyebrow:'The trap',
   h:'You sound like every other expert in your category.',
   p:'When buyers cannot tell you apart from the next consultant, they fall back on the one thing they can compare. Price. So you discount, you over deliver, and you chase the wrong clients.'},

  {t:'reframe',
   big:'You do not have a lead problem. You have a positioning problem.'},

  {t:'part', num:'PART ONE',
   h:'Why great experts stay invisible'},

  {t:'point', eyebrow:'The sea of sameness',
   h:'Expertise alone is not a position.',
   p:'Everyone in your field says the same words: trusted, results driven, bespoke, partner. Sameness is what commoditises you. The market cannot value what it cannot distinguish.'},

  {t:'point', eyebrow:'The cost',
   h:'The Harder Hustle Loop',
   p:'Working all hours just to pay the bills. Talking to the wrong people. Being in every room yourself. It is exhausting, and it caps you, because it all depends on your time.'},

  {t:'part', num:'PART TWO',
   h:'The Chosen First System'},

  {t:'pillar', num:'PILLAR 01',
   h:'Dial in your true value',
   p:'Get precise about the outcome you create and the exact people who value it most. Not everyone. The top 5% who will pay what you are worth.'},

  {t:'pillar', num:'PILLAR 02',
   h:'Package it into a category of one',
   p:'Productise your expertise into a named, compelling, irresistible offer. When you are the only one who does this particular thing, there is nothing to compare you to.'},

  {t:'pillar', num:'PILLAR 03',
   h:'Let the system do the convincing',
   p:'Build an inbound and outbound client getting system so it is the system, not you, that educates prospects about your value and filters out the poor fit tyre kickers.'},

  {t:'pillar', num:'PILLAR 04',
   h:'Convert the people who value you',
   p:'Only the highest quality prospects reach a conversation, already understanding why you are the right choice. You hold your prices, and you stop giving draining extras.'},

  {t:'recap', eyebrow:'The method, in one view',
   h:'Chosen First',
   list:['Dial in your true value','Package it into a category of one','Let the system do the convincing','Convert the people who value you']},

  {t:'part', num:'PART THREE',
   h:'What changes once you are chosen first'},

  {t:'point', eyebrow:'The shift',
   h:'The Path of Powerful Expansion',
   p:'Ideal clients choose you before they compare. Premium prices hold. Your growth stops depending on your hours, because your positioning and your system carry the load.'},

  {t:'why', eyebrow:'Why learn this from me',
   h:'Fortune 500 brand building, applied to you',
   p:'I spent two decades building brands for Coca-Cola, British Airways, ITV and Discovery, and I was Managing Director of FutureBrand after my brand business was acquired by Interpublic. The Chosen First Method brings that same discipline to individual experts.'},

  {t:'recap', eyebrow:'Remember this',
   h:'Stop competing on price. Become the only logical choice.',
   p:'That is the whole game. Position first, and the right clients, and the right prices, follow.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Join the live Ideal Client Success masterclass',
   cta:'Bring your current positioning. Leave with a clear plan to become the category of one in your market, and attract the top 5% of the clients you actually want.',
   disclaimer:'This masterclass is educational. No specific income or result is guaranteed. Results vary and depend on your market, your offer and your own effort.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.num) html += '<div class="num">'+s.num+'</div>';
  if (s.big) html += '<div class="big">'+s.big+'</div>';
  if (s.h) html += '<h1>'+s.h+'</h1>';
  if (s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if (s.p) html += '<p>'+s.p+'</p>';
  if (s.cta) html += '<p class="cta-note">'+s.cta+'</p>';
  if (s.list) { html += '<ul>'; s.list.forEach(x => html += '<li>'+x+'</li>'); html += '</ul>'; }
  if (s.byline) html += '<div class="byline">'+s.byline+'</div>';
  if (s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  html += '<div class="foot">Ideal Client Success</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
