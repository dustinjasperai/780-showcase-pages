<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale Without Scaling Yourself Into the Ground - Emily McDowell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Spectral:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf5ff;      /* lilac wash, from her body bg #f1d6fd */
    --panel:#ffffff;
    --soft:#fdf2f2;    /* her pink-white */
    --rule:#e9d8f5;    /* muted lilac hairline */
    --accent:#338fe4;  /* her dominant blue, 50 uses */
    --coral:#e06649;   /* her coral, 23 uses */
    --ink:#2a2535;
    --muted:#6b6577;
    --head:'Spectral',Georgia,serif;
    --body:'Libre Franklin',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(42,37,53,.03)}
  .slide.alt{background:var(--soft)}
  .slide.ground{background:linear-gradient(170deg,#f1d6fd 0%,#faf5ff 70%)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  .kicker.coral{color:var(--coral)}
  h1{font-family:var(--head);font-weight:700;font-size:48px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  .sub{font-size:19px;color:var(--muted);margin-top:18px;max-width:40ch}
  .big{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.3}
  .body{font-size:18px;margin-top:16px;max-width:52ch;color:#3b3545}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:19px;padding:12px 0 12px 34px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  li.coral::before{background:var(--coral)}
  .step{font-family:var(--head);font-size:22px;font-weight:600}
  .step span{color:var(--muted);font-family:var(--body);font-size:16px;font-weight:400;display:block;margin-top:2px}
  .cred{font-size:18px;margin-top:14px;max-width:54ch;color:#3b3545}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;border-top:1px solid var(--rule);padding-top:16px}
  .cta-line{font-family:var(--head);font-size:24px;font-weight:600;color:var(--accent);margin-top:18px}
  .num{font-family:var(--head);color:var(--coral);font-size:15px;font-weight:600;margin-bottom:10px;letter-spacing:.12em}
  .foot{text-align:center;color:var(--muted);font-size:13px;margin-top:30px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', cls:'ground', kicker:'A live masterclass with Emily McDowell',
    h:"Scale Without Scaling Yourself Into the Ground",
    sub:"How to grow a product brand that lasts, without growing yourself into burnout."},

  {t:'who', kicker:'Who this is for',
    h:"You built something real. Now it is running you.",
    body:"This is for product-based business owners, makers, and creative founders who have proven the thing works, and who quietly suspect the way they are growing it is not sustainable for the person at the center of it."},

  {t:'point', cls:'alt', kicker:'The trap', kc:true,
    h:"You hit your biggest year, and felt worse than ever.",
    body:"Revenue went up. So did the knot in your stomach. Everyone congratulates you and you cannot say out loud that you are not sure you can keep doing this. That gap is not a character flaw. It is a structural problem, and it has a cause."},

  {t:'quote', cls:'ground',
    h:"If your growth trajectory is not sustainable for you, it is ultimately destructive.",
    sub:"Not eventually. Ultimately. It takes down the founder, and then it takes down the business the founder was holding up."},

  {t:'part', num:'Part One', h:"The upside-down order"},

  {t:'point', kicker:'The core problem',
    h:"Most founders run the order backwards.",
    body:"Customers first. The business second. Themselves last, if at all. It feels noble and it feels like what a good owner does. It is also exactly the sequence that ends in resentment, exhaustion, and a brand you cannot step away from."},

  {t:'list', cls:'alt', kicker:'What it costs', kc:true,
    h:"What the backwards order actually buys you",
    items:[
      ["Burnout dressed up as dedication","You call it hustle until your body sends the invoice."],
      ["A brand that traps you","Tie your identity to the company and you cannot evolve, delegate, or exit."],
      ["Growth you secretly dread","Every new win adds weight instead of freedom."]
    ]},

  {t:'part', num:'Part Two', h:"The needs-first method"},

  {t:'hierarchy', kicker:'The method', h:"Put the order back the right way",
    steps:[
      ["1. Your needs","What the human running this actually requires to keep going."],
      ["2. The needs of your business","What the company needs to be healthy, not just bigger."],
      ["3. The needs and wants of your customers","Served best by an owner and a business that are not depleted."]
    ],
    body:"Serving customers is not last because they matter least. It is last because you cannot pour from an empty founder or a fragile business."},

  {t:'point', cls:'alt',
    h:"What changes when you run it in this order",
    body:"You make decisions from capacity instead of fear. You price for sustainability, not just competitiveness. You design the business around the life you actually want, and the growth that remains is growth you can carry."},

  {t:'list', kicker:'The three legs', h:"A product business stands on three legs",
    items:[
      ["Strategic","Sales, ops, pricing, manufacturing, the real mechanics of a product company."],
      ["Creative","Product, brand, and the voice that made people feel something in the first place."],
      ["Emotional","The inner work of the owner, because the business cannot outrun the person running it."]
    ],
    body:"Advice that only handles one leg is why so much good counsel still leaves founders stuck. You need all three held at once."},

  {t:'point', cls:'alt', kicker:'Before you scale',
    h:"Define success on your own terms first.",
    body:"Get clear on exactly what success means to you, and what you actually want, not just for your business, but for your life. Scale toward that. Scaling toward someone else's definition is how you win a race you never wanted to run."},

  {t:'point', kicker:'Decouple', kc:true,
    h:"You are not the company.",
    body:"When your worth is fused to the brand, every dip feels like a verdict on you, and growth becomes impossible to hand off. Separating the two is what makes it safe to bring people in, change direction, or one day walk away whole."},

  {t:'part', num:'Part Three', h:"Growth you can actually carry"},

  {t:'point', cls:'alt', kicker:'A different rhythm',
    h:"Growth as a rhythm, not a sprint.",
    body:"Plan the year around sustainable pace instead of permanent crunch. The goal is a business that still exists, and a founder who still wants to run it, three years from now. Durable beats dramatic."},

  {t:'cred', cls:'ground', kicker:'Why me',
    h:"I built the thing, and I learned this the hard way.",
    cred:"I founded Em & Friends and created the Empathy Cards that reshaped an entire category, selling tens of millions of products across wholesale and direct to consumer. I also scaled past what was sustainable for me, and exited. Now I help product founders get the growth without the part that nearly cost me everything."},

  {t:'list', kicker:'The recap', h:"The needs-first method, in one page",
    items:[
      ["Put the order back","You, then the business, then your customers."],
      ["Hold all three legs","Strategic, creative, and emotional, together."],
      ["Grow toward your real definition","Of success, and of a life you want."]
    ]},

  {t:'cta', cls:'ground', kicker:'Work with me',
    h:"Build the brand. Keep yourself.",
    cta:"Come work with me on a product business that grows without grinding you down.",
    sub:"Learn more and start the conversation at emilyonlife.com",
    disc:"Educational content only. No income, role, or business result is guaranteed. Results vary and depend on many factors outside anyone's control."}
];

function esc(x){return x;}
const app = document.getElementById('app');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.cls?(' '+s.cls):'');
  let h='';
  if(s.kicker) h+='<div class="kicker'+(s.kc?' coral':'')+'">'+s.kicker+'</div>';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.t==='title'){ h+='<h1>'+s.h+'</h1>'; if(s.sub) h+='<p class="sub">'+s.sub+'</p>'; }
  else if(s.t==='part'){ h+='<h1>'+s.h+'</h1>'; }
  else if(s.t==='quote'){ h+='<p class="big">'+s.h+'</p>'; if(s.sub) h+='<p class="sub">'+s.sub+'</p>'; }
  else if(s.t==='hierarchy'){
    h+='<h2>'+s.h+'</h2><ul>';
    s.steps.forEach(st=>{ h+='<li class="coral"><span class="step">'+st[0]+'<span>'+st[1]+'</span></span></li>'; });
    h+='</ul>'; if(s.body) h+='<p class="body">'+s.body+'</p>';
  }
  else if(s.t==='list'){
    h+='<h2>'+s.h+'</h2><ul>';
    s.items.forEach((it,i)=>{ h+='<li'+((i%2)?' class="coral"':'')+'><span class="step">'+it[0]+'<span>'+it[1]+'</span></span></li>'; });
    h+='</ul>'; if(s.body) h+='<p class="body">'+s.body+'</p>';
  }
  else if(s.t==='cred'){ h+='<h2>'+s.h+'</h2><p class="cred">'+s.cred+'</p>'; }
  else if(s.t==='cta'){
    h+='<h1>'+s.h+'</h1>';
    if(s.cta) h+='<p class="cta-line">'+s.cta+'</p>';
    if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
    if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
  }
  else { h+='<h2>'+s.h+'</h2>'; if(s.body) h+='<p class="body">'+s.body+'</p>'; }
  d.innerHTML=h;
  app.appendChild(d);
});
const f=document.createElement('div');
f.className='foot';
f.textContent='Emily McDowell  |  emilyonlife.com';
app.appendChild(f);
</script>
</body>
</html>
