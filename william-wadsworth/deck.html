<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Science of Studying Smarter | Exam Study Expert</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3f6fb;
    --panel:#eef3fa;
    --stage:#062a54;
    --accent:#053a70;
    --gold:#e2a82b;
    --ink:#12222f;
    --ink-soft:#3f5163;
    --muted:#8595a6;
    --rule:#d5deeb;
  }
  html,body{height:100%}
  body{background:var(--stage);font-family:'Source Sans 3',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:8.5vh 9vw;opacity:0;transition:opacity .5s ease;pointer-events:none;background:var(--bg)}
  .slide.active{opacity:1;pointer-events:auto}
  .kicker{font-family:'Source Sans 3',sans-serif;font-size:1.05vw;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3.2vh}
  h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:4.2vw;line-height:1.1;
    letter-spacing:-.012em;color:var(--ink);max-width:21ch}
  .sub{font-family:'Source Sans 3',sans-serif;font-weight:500;font-size:1.7vw;line-height:1.5;
    color:var(--ink-soft);margin-top:3.4vh;max-width:34ch}
  .body{font-family:'Source Sans 3',sans-serif;font-weight:400;font-size:1.55vw;line-height:1.62;
    color:var(--ink-soft);margin-top:3.4vh;max-width:42ch}
  .brandline{font-family:'Source Serif 4',Georgia,serif;font-size:1.2vw;font-weight:600;letter-spacing:.02em;
    color:var(--accent);margin-top:5vh}
  .brandline b{font-weight:700}
  /* section slides */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Source Sans 3',sans-serif;font-size:1.15vw;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--gold);margin-bottom:2.6vh}
  .t-section h1{font-size:5vw}
  .t-section .rule{width:8.5vw;height:4px;background:var(--gold);border-radius:3px;margin-top:4vh}
  /* dark reframe slides */
  .t-dark{background:var(--stage)}
  .t-dark h1{color:#eef3fa;font-weight:600;font-size:3.8vw;max-width:26ch}
  .t-dark .kicker{color:var(--gold)}
  .t-dark .em{color:var(--gold);font-style:italic}
  /* cta */
  .t-cta{background:var(--panel)}
  .chips{display:flex;gap:1.4vw;margin-top:4.6vh;flex-wrap:wrap}
  .chip{font-family:'Source Sans 3',sans-serif;font-weight:600;font-size:1.3vw;color:#fff;background:var(--accent);
    border-radius:100px;padding:1.5vh 2.2vw}
  .disc{font-family:'Source Sans 3',sans-serif;font-size:.95vw;line-height:1.5;color:var(--muted);
    margin-top:6vh;max-width:56ch}
  h1 .a{color:var(--accent);font-style:italic}
  /* memory-curve motif */
  .mc{position:absolute;right:7vw;bottom:8.5vh;width:17vw;height:9vw;opacity:.95}
  .t-title .mc{right:8vw;bottom:11vh;width:22vw;height:11.5vw;opacity:1}
  /* chrome */
  #hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;
    padding:16px 26px;z-index:20;pointer-events:none}
  #track{flex:1;height:3px;background:rgba(5,58,112,.14);border-radius:3px;overflow:hidden}
  #bar{height:100%;width:0;background:var(--gold);transition:width .5s ease}
  #count{font-family:'Source Sans 3',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
  .nav{position:fixed;top:0;height:100vh;width:14vw;z-index:15;cursor:pointer;background:transparent;border:0}
  #prev{left:0}#next{right:0}
  #hint{position:fixed;right:26px;bottom:34px;font-family:'Source Sans 3',sans-serif;font-size:12px;
    letter-spacing:.08em;color:var(--muted);z-index:20;transition:opacity .4s}
  @media(max-width:760px){h1{font-size:7.2vw}.sub,.body{font-size:3.4vw}.kicker{font-size:2.6vw}
    .t-section h1{font-size:8.4vw}.chip{font-size:3vw}.disc{font-size:2.4vw}.mc{display:none}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="memcurve" viewBox="0 0 260 140">
  <line x1="18" y1="118" x2="248" y2="118" stroke="#c4d1e2" stroke-width="2"/>
  <line x1="18" y1="118" x2="18" y2="14" stroke="#c4d1e2" stroke-width="2"/>
  <path d="M22 26 C70 40 120 92 244 116" fill="none" stroke="#9fb0c6" stroke-width="3.5" stroke-dasharray="6 7" stroke-linecap="round"/>
  <path d="M22 30 L70 30 L70 54 L118 54 L118 40 L166 40 L166 60 L214 60 L214 46 L244 46" fill="none" stroke="#e2a82b" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="22" cy="30" r="5" fill="#053a70"/>
  <circle cx="244" cy="46" r="5" fill="#e2a82b"/>
</symbol></svg>

<div id="deck"></div>
<div id="hud"><div id="track"><div id="bar"></div></div><div id="count">01 / 01</div></div>
<button id="prev" class="nav" aria-label="Previous"></button>
<button id="next" class="nav" aria-label="Next"></button>
<div id="hint">Use arrow keys &rarr;</div>
<script>
const S = [
 {t:'title',title:'The Science of Studying Smarter',sub:'How top students earn better marks in fewer hours, by studying the way memory actually works instead of just working harder.',brand:true,mc:true},
 {t:'normal',k:'Who this is for',title:'You are putting in the hours, and the marks still will not move.',body:'You read the chapter again. You highlight, you re-copy your notes, you sit at the desk for longer. It feels like effort, it feels like studying, and yet the grade in the mock comes back the same. The problem is almost never how hard you are trying.'},
 {t:'normal',k:'The real cost',title:'Re-reading feels productive. That is exactly the trap.',body:'The more you re-read a page, the more familiar it looks, and familiarity feels like knowing. So you close the book convinced it has gone in. Then the question is in front of you in the exam hall and the page is a blur. Feeling like you know it and being able to retrieve it are two different things.'},
 {t:'dark',title:'Your brain does not remember what you <span class="em">read</span>. It remembers what you make it <span class="em">retrieve</span>.'},

 {t:'section',idx:'Part One',title:'Why Re-Reading Lies to You'},
 {t:'normal',k:'The illusion of fluency',title:'Smooth is not the same as learned.',body:'When words flow easily off the page, your mind reads that ease as mastery. Researchers call it the illusion of fluency, and it is the single most common reason bright, hard-working students underperform. The methods that feel best while you do them are usually the ones that teach you the least.'},
 {t:'normal',k:'What forgetting really does',title:'Everything you learn starts fading the moment you learn it.',body:'Memory has a curve, and it slopes downward on its own. Passive review barely touches that curve. This is why a topic you understood perfectly in October is gone by the mock in January, and why one long cram the night before leaves so little standing by the time it matters.'},
 {t:'dark',title:'If your study method feels comfortable, it is probably the method quietly costing you marks.'},

 {t:'section',idx:'Part Two',title:'The Science of Studying Smarter'},
 {t:'normal',k:'The core technique',title:'Retrieval practice: close the book and pull it back out.',body:'The most reliable finding in the science of learning is also the simplest. Every time you force yourself to recall something from memory, without looking, you make that memory stronger and easier to find under pressure. Self-testing is not how you check what you learned. It is how you learn it.'},
 {t:'normal',k:'Beating the forgetting curve',title:'Space the recall, and the curve flattens.',body:'Retrieve a fact once and it fades slower. Retrieve it again a few days later, then a week later, and the fade almost stops. Spacing your reviews across time, instead of massing them in one session, is what turns a topic you crammed into a topic you own on exam day.'},
 {t:'normal',k:'Study to your wiring',title:'Match the method to how you actually learn.',body:'Two students can put in the same hours and walk out with very different grades, because one built the plan around how they focus and remember, and the other copied a generic timetable. A diagnostic of where you really lose marks, and a plan built around it, is worth more than another hundred passive hours.'},
 {t:'normal',k:'The mindset underneath',title:'Calm, deliberate practice beats anxious volume.',body:'The students who thrive are not the ones grinding in a panic. They study on purpose, they trust the method because they can feel it working, and they walk in steady. Mindset is not a motivational poster here. It is the difference between practice that compounds and practice that just exhausts you.'},
 {t:'dark',title:'Same hours. Same brain. A method that works <span class="em">with</span> your memory instead of against it.'},

 {t:'section',idx:'Part Three',title:'Exam Day, By Design'},
 {t:'normal',k:'A plan for the paper',title:'Decide how you will attack the paper before you sit down.',body:'Which questions you take first, how long you let one hold you, when you move on and come back: those are decisions to make in advance, not in a spike of adrenaline at question three. A calm, pre-planned sequence is worth marks on its own, and it is the part most students never rehearse.'},
 {t:'normal',k:'Why learn this from me',title:'I rebuilt how I study on the science, and it changed everything.',body:'I read Psychology at Cambridge, where my old school methods fell apart until the science of learning gave me a better way. I interview for Oxford, I have written two books on exam and revision technique, and the Exam Study Expert podcast has reached students around the world. Everything I coach is the method I wish I had been taught first.'},
 {t:'dark',title:'Study smarter, remember more, and walk in ready. That is a skill, and it can be taught.'},

 {t:'section',idx:'Your next step',title:'Learn the Method With Me'},
 {t:'normal',k:'How the coaching helps',title:'A plan built around you, with a coach beside you.',body:'In 1:1 exam coaching we run a diagnostic of where you are losing marks, rebuild your study around retrieval and spacing, and get your mindset and exam-day plan ready. It starts with a short, no-obligation call to work out whether it is the right fit and what your plan would look like.'},
 {t:'cta',title:'Ready to study smarter, not harder?',chips:['Book your free 15-minute consultation','Start 1:1 exam coaching'],disc:'Educational content on study technique for students preparing for exams. No specific grade, result, or exam outcome is guaranteed. Results vary by student, starting point, subject, and effort.'},
];

const deck=document.getElementById('deck');
function mc(){return '<svg class="mc"><use href="#memcurve"/></svg>'}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Exam <b>Study Expert</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mc||s.t==='title') h+=mc();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
