<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Teach to Learn &middot; A Samyak Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caudex:ital,wght@0,400;0,700;1,400&family=Mukta:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faece1;        /* warm cream ground (brand.json, 13 uses) */
    --panel:#fffbf3;     /* near-white warm panel */
    --ink:#1d0e03;       /* espresso ink (brand.json, 40 uses) */
    --accent:#90292b;    /* brick / tilaka red (brand.json, 17 uses) */
    --rule:#a03d1b;      /* terracotta (brand.json, 14 uses) */
    --sage:#3f7652;      /* muted sage (brand.json, 3 uses) */
    --muted:#6b5546;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:'Mukta',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid #ecd9c6;border-radius:14px;
    padding:54px 56px;margin:0 0 22px;min-height:460px;position:relative;
    box-shadow:0 1px 0 #ecd9c6, 0 18px 40px -34px rgba(29,14,3,.5);
    display:flex;flex-direction:column;justify-content:center}
  .slide::before{content:'';position:absolute;left:0;top:28px;bottom:28px;width:4px;
    background:var(--rule);border-radius:4px}
  .kicker{font-family:'Mukta';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:'Caudex',serif;font-weight:700;font-size:clamp(34px,6vw,62px);
    line-height:1.04;margin:0 0 18px}
  h2{font-family:'Caudex',serif;font-weight:700;font-size:clamp(26px,4vw,40px);
    line-height:1.1;margin:0 0 14px}
  p{font-size:clamp(17px,2vw,21px);line-height:1.6;max-width:62ch;margin:0 0 14px;color:#3a2a1d}
  .lead{font-size:clamp(20px,2.4vw,26px);color:var(--ink)}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none;max-width:64ch}
  li{font-size:clamp(16px,1.9vw,20px);line-height:1.5;padding:10px 0 10px 30px;position:relative;
    border-top:1px solid #efe0d1;color:#3a2a1d}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:4px;top:19px;width:9px;height:9px;
    background:var(--accent);border-radius:50%}
  li b{font-family:'Caudex',serif;color:var(--ink)}
  .schedule{display:grid;grid-template-columns:120px 1fr;gap:0;max-width:60ch;
    border-top:1px solid #efe0d1}
  .schedule div{padding:9px 6px;border-bottom:1px solid #efe0d1;font-size:16px}
  .schedule .t{font-family:'Caudex',serif;color:var(--accent);font-weight:700}
  .big{font-family:'Caudex',serif;font-size:clamp(40px,8vw,88px);line-height:1;margin:0 0 10px}
  .foot{color:var(--muted);font-size:14px;margin-top:22px;font-weight:400}
  .num{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--muted);
    font-family:'Caudex',serif;letter-spacing:.1em}
  .brandline{font-family:'Caudex',serif;color:var(--accent);font-size:18px;margin-top:26px}
  .disc{color:var(--muted);font-size:13px;line-height:1.5;margin-top:20px;max-width:70ch}
  .sage{color:var(--sage);font-weight:600}
  @media(max-width:620px){.slide{padding:34px 24px;min-height:auto}.schedule{grid-template-columns:96px 1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Masterclass deck copy lives in const S (Samyak's own masterclass to aspiring teachers). */
const S = [
  {t:'title',
   kicker:'A Samyak live masterclass',
   h:'Teach to Learn',
   lead:'How to become a yoga teacher who can hold a room, not just hold a certificate.',
   foot:'Samyak Institute of Yoga &amp; Ayurveda &middot; Mysore, India &middot; with Yogacharya Rakesh'},

  {t:'who',
   kicker:'Who this is for',
   h:'You can do the practice. You freeze when it is time to lead it.',
   p:['This is for the dedicated practitioner who dreams of teaching, and for the recent graduate who holds a card but still does not feel like a teacher.',
      'You do not need to be advanced. You need to be willing to practice, study, and teach every single day.']},

  {t:'trap',
   kicker:'The trap',
   h:'A month of sunrise photos, a certificate, and then silence.',
   p:['Most teacher trainings hand you a syllabus, a certificate, and a plane ticket home.',
      'A few weeks later the postures fade, the notes close, and the question returns: can I actually teach this to someone else?']},

  {t:'reframe',
   kicker:'The reframe',
   big:'A certificate does not make you a teacher.',
   lead:'A living practice does. Everything in this masterclass follows from that one idea.'},

  {t:'part',
   kicker:'Part one',
   h:'The real problem',
   p:['You were taught the poses. You were rarely taught how to transmit them.',
      'Knowledge without a daily Self Practice evaporates. You cannot give away a practice you do not own.']},

  {t:'part',
   kicker:'Part two &middot; the Samyak way',
   h:'Four things that turn a practitioner into a teacher',
   p:['Not a longer syllabus. A living tradition, taught in the order a teacher actually grows.'],
   ul:['<b>Self Practice (Sadhana).</b> You can only teach what you live. The 100-Hour Sadhana is where it begins.',
       '<b>The Gurukula immersion.</b> Learning inside a lineage, from a teacher, not from a slide deck.',
       '<b>Teach to Learn.</b> You teach from Day 2, every day, under guidance, until leading a room is second nature.',
       '<b>Dinacharya and Ayurveda.</b> The daily rhythm and the doshas that keep a teacher steady for life.']},

  {t:'pillar',
   kicker:'Pillar one',
   h:'Self Practice comes first',
   p:['Before you ever cue another body, you build your own Sadhana: a daily, unhurried practice that becomes the ground you teach from.',
      'This is why we begin with the 100-Hour Yoga Sadhana. The teacher is the practice, made visible.']},

  {t:'pillar',
   kicker:'Pillar two',
   h:'The Gurukula, not a classroom',
   p:['In the Gurukula system, rooted in the Veda Vijnana Gurukulam lineage, you do not consume a course. You live alongside your teachers.',
      'Philosophy, breath, and posture are transmitted the way they always have been: in person, in sequence, over a full month of immersion.']},

  {t:'pillar',
   kicker:'Pillar three',
   h:'You teach from Day 2',
   p:['The fastest way to become a teacher is to teach. From the second day, you lead, you are corrected, and you lead again.',
      'By the time you graduate, standing in front of a room is familiar, not frightening. That is the whole point of Teach to Learn.']},

  {t:'pillar',
   kicker:'Pillar four',
   h:'Dinacharya keeps you teaching for decades',
   p:['A teacher who burns out helps no one. The Dinacharya rhythm, paired with the Ayurvedic doshas and Ritucharya, is how you stay well while you give.',
      'You leave with a daily structure, not just a set of poses.']},

  {t:'detail',
   kicker:'The grounding',
   h:'Depth, from the classical texts',
   p:['Eighty-four classical asanas drawn from the Hatha Pradipika, Gheranda Samhita, and Shiva Samhita. Philosophy from the Yoga Sutras: the chakras, nadis, and koshas.'],
   ul:['Traditional Hatha practice and the Yoga Kriyas (Jala Neti, Trataka)',
       'Pranayama and meditation, daily',
       'Yoga anatomy for safe, intelligent teaching',
       'Teaching methodology: sequencing, Sanskrit, adjustments']},

  {t:'part',
   kicker:'Part three',
   h:'What a month actually looks like',
   p:['Not a retreat. A disciplined, joyful day, repeated until it becomes who you are.']},

  {t:'detail',
   kicker:'A day in the Gurukula',
   h:'Dinacharya',
   schedule:[['6:00','Hatha asana practice'],
             ['7:30','Pranayama and meditation'],
             ['9:30','Yoga philosophy'],
             ['11:00','Asana clinic'],
             ['12:00','Teaching methodology'],
             ['16:00','Theme practice and clinic'],
             ['18:00','Anatomy, Ayurveda, kirtan'],
             ['20:00','Svadhyaya: study and reflection']]},

  {t:'detail',
   kicker:'Who you become',
   h:'A teacher, not a certificate holder',
   ul:['You can hold a room and read a body, not just recite a sequence',
       'You carry a daily Self Practice that is yours for life',
       'You understand the tradition deeply enough to teach it honestly',
       'You belong to a lineage and a community, the Samyak Kulam']},

  {t:'why',
   kicker:'Why Samyak',
   h:'Where teachers have trained since 2011',
   ul:['More than 3,500 teachers trained across 165+ courses',
       'A residential ashram in Mysore, the home of modern yoga',
       'Yoga Alliance registered school: RYS 200 and RYS 300',
       'Led by Yogacharya Rakesh, teaching teachers since 2011']},

  {t:'why',
   kicker:'You are not alone after',
   h:'The Samyak Kulam',
   p:['Your training does not end on graduation day. Through the Samyak Kulam community and the Purvabhyasa preparation, you arrive ready and you leave supported.',
      'A lineage is a relationship, not a transaction.']},

  {t:'cta',
   kicker:'Your next step',
   h:'Come train where the teachers learn.',
   lead:'Join the next live masterclass, then apply for the 100, 200, or 300-hour training in Mysore.',
   brand:'Samyak Institute of Yoga &amp; Ayurveda &middot; samyakyoga.org',
   disc:'This masterclass is educational only and is not a substitute for individual guidance. Certification requires completing the residential training and its assessment. Results vary from student to student and no specific teaching, certification, or income outcome is guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.big)    html += '<div class="big">'+s.big+'</div>';
  if(s.h)      html += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.lead)   html += '<p class="lead">'+s.lead+'</p>';
  if(s.p)      s.p.forEach(x=> html += '<p>'+x+'</p>');
  if(s.ul){    html += '<ul>'; s.ul.forEach(x=> html += '<li>'+x+'</li>'); html += '</ul>'; }
  if(s.schedule){ html += '<div class="schedule">'; s.schedule.forEach(r=>{ html += '<div class="t">'+r[0]+'</div><div>'+r[1]+'</div>'; }); html += '</div>'; }
  if(s.brand)  html += '<div class="brandline">'+s.brand+'</div>';
  if(s.foot)   html += '<div class="foot">'+s.foot+'</div>';
  if(s.disc)   html += '<div class="disc">'+s.disc+'</div>';
  html += '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
