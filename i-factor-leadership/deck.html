<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raise Your Profile Without Raising Your Voice - A Masterclass for Introverts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,600;0,700;1,400&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7;
    --panel:#f3eef7;
    --ink:#2b2733;
    --muted:#5c5668;
    --rule:#ddd4e6;
    --accent:#6460aa;
    --accent2:#ffb548;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 1px 0 rgba(100,96,170,.04)}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:34px;line-height:1.14}
  h3{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:26px;line-height:1.2;color:var(--accent)}
  p{font-size:19px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:40em}
  .lead{font-size:22px;color:var(--ink)}
  .big{font-family:'Newsreader',Georgia,serif;font-weight:700;font-size:40px;line-height:1.14;color:var(--ink)}
  .num{font-family:'Newsreader',Georgia,serif;font-size:20px;color:var(--accent2);font-weight:700}
  ul{margin-top:22px;list-style:none;display:grid;gap:14px;max-width:44em}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding-left:22px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:17px;margin-top:3px}
  .kicker{font-family:'Newsreader',serif;font-style:italic;font-size:21px;color:var(--accent);margin-top:0;margin-bottom:10px}
  .tag{position:absolute;top:26px;right:30px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .section-divider{background:var(--panel);border-color:var(--rule)}
  .section-divider h2{color:var(--accent)}
  .cta-slide{background:var(--panel)}
  .cta-slide h2{color:var(--ink)}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:600;font-size:18px;padding:16px 30px;border-radius:999px;text-decoration:none}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:46em;line-height:1.5}
  .brandline{font-size:14px;color:var(--muted);margin-top:30px;letter-spacing:.02em}
  .footer{text-align:center;color:var(--muted);font-size:13px;padding:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="footer">I-Factor Leadership &middot; Stacey Chazin, MPH, MSODL</div>
<script>
const S = [
  {t:'title',
   eyebrow:'A live masterclass for introverts',
   h1:'Raise Your Profile Without Raising Your Voice',
   p:'How introverts get seen, promoted, and paid as leaders, without pretending to be someone they are not.',
   brand:'With Stacey Chazin, MPH, MSODL'},

  {t:'who',
   eyebrow:'Who this is for',
   h2:'You do great work. Somehow, the room keeps missing it.',
   p:'You are the one who listens before speaking, thinks three steps ahead, and catches what everyone else rushed past. And yet the recognition, the promotion, and the raise keep going to louder people with weaker ideas. This hour is for you.'},

  {t:'reframe',
   eyebrow:'The reframe',
   kicker:'Here is the shift that changes everything:',
   big:'You do not have a visibility problem. You have a translation problem.',
   p:'Your quiet strengths are real leadership strengths. They have just never been translated into the moments where people decide who leads. We fix that today.'},

  {t:'section', h2:'Part One', sub:'Why your best work stays invisible'},

  {t:'body',
   eyebrow:'The core problem',
   h2:'The workplace was built to reward the loudest voice, not the best one.',
   p:'Open-plan rooms, fast meetings, and self-promotion norms were all designed around extroversion. So introverts learn a quiet rule: do excellent work and hope someone notices. Hope is not a visibility strategy, and the people deciding promotions are not mind readers.'},

  {t:'body',
   eyebrow:'The cost',
   h2:'What invisibility actually costs you.',
   p:'A missed promotion is not one bad quarter. It compounds. Lower title, lower pay, less interesting work, and a growing belief that advancement belongs to a personality you do not have. Meanwhile the work keeps being excellent, which somehow makes it hurt more.'},

  {t:'body',
   eyebrow:'The false fix',
   h2:'The advice you have been given makes it worse.',
   p:'Speak up more. Network the room. Sell yourself. Fake the confidence. Every bit of it asks you to perform a personality that drains you, and people can feel the performance. The answer was never to become an extrovert. It is to lead as the introvert you already are.'},

  {t:'section', h2:'Part Two', sub:'The I-Factor: your four quiet strengths'},

  {t:'framework',
   eyebrow:'The framework',
   h2:'The I-Factor.',
   p:'Your introversion is not something to overcome. It is the rich, fertile ground that exceptional leadership grows from. Four innate capabilities set you apart. Named, understood, and put to work, they become your edge.'},

  {t:'pillar', num:'01', h3:'Profound listening',
   p:'You hear what is actually being said, and what is not. In a culture of people waiting to talk, the leader who truly listens builds the deepest trust in the room, and trust is what people follow.'},

  {t:'pillar', num:'02', h3:'Strategic thinking',
   p:'You turn complexity into clarity. While the room reacts, you see the pattern and the second-order consequence. That is not quietness. That is the thinking leadership is supposed to provide.'},

  {t:'pillar', num:'03', h3:'Analytical insight',
   p:'You cut through surface-level noise to the thing that matters. The question nobody asked, the risk nobody named. Insight like this is rare, and it is yours by default.'},

  {t:'pillar', num:'04', h3:'Authentic presence',
   p:'You inspire trust without demanding attention. You do not need the biggest voice to be the steadiest one. In a loud room, calm authority is the most magnetic thing there is.'},

  {t:'section', h2:'Part Three', sub:'Turning strengths into visibility'},

  {t:'lanes',
   eyebrow:'The three visibility lanes',
   h2:'You do not get louder. You get seen on purpose.',
   items:[
     {b:'Confident, not cringey', s:'Talk about your work without feeling braggy. Self-promotion reframed as a leadership duty, with everyday language and scripts that feel like you.'},
     {b:'Lead with your value', s:'A repeatable way to say what you do, why it matters, and why you have earned the next step, in a meeting, an intro, or a review.'},
     {b:'Raise your profile without raising your voice', s:'Three visibility tools introverts excel at naturally, so the right people see your contribution before the decision, not after.'}
   ]},

  {t:'body',
   eyebrow:'The after, in practice',
   h2:'A quiet leader who is finally impossible to overlook.',
   p:'You walk into the review with your value already understood. Your ideas carry your name. The promotion conversation starts with your manager, not with you begging for it. Nothing about who you are changed. Everything about how you are seen did.'},

  {t:'whyme',
   eyebrow:'Why learn this from me',
   h2:'I built this because I needed it first.',
   p:'I am Stacey Chazin. I hold an MPH and a Master of Science in Organizational Development and Leadership, and I am a certified MBTI practitioner. I am also an introvert who spent years believing I had to become louder to lead. I did not. I learned to translate my quiet strengths into recognition, and the I-Factor is the method I now teach introverted professionals.'},

  {t:'cta',
   eyebrow:'Your next step',
   h2:'Let us find your I-Factor together.',
   p:'If today named something you have felt for years, the next step is a free Strengths Discovery Call. We will look at your natural leadership strengths and the one visibility lane that will move your career fastest.',
   btn:'Book your free Strengths Discovery Call',
   disclaimer:'This masterclass is educational. It shares frameworks and strategies for professional growth. It is not a guarantee of any specific promotion, salary, title, or career outcome. Results depend on your own situation, effort, and workplace, and will vary from person to person.',
   brand:'I-Factor Leadership &middot; ifactorleadership.com'}
];

const deck = document.getElementById('deck');
function el(html){const d=document.createElement('div');d.innerHTML=html.trim();return d.firstChild;}
S.forEach((s,i)=>{
  let cls='slide';
  if(s.t==='section') cls+=' section-divider';
  if(s.t==='cta') cls+=' cta-slide';
  const sec=document.createElement('section');
  sec.className=cls;
  let h='';
  h+='<span class="tag">I-Factor Leadership</span>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){
    h+='<h1>'+s.h1+'</h1>';
    if(s.p) h+='<p class="lead">'+s.p+'</p>';
    if(s.brand) h+='<div class="brandline">'+s.brand+'</div>';
  } else if(s.t==='section'){
    h+='<h2>'+s.h2+'</h2>';
    if(s.sub) h+='<p class="lead">'+s.sub+'</p>';
  } else if(s.t==='reframe'){
    if(s.kicker) h+='<p class="kicker">'+s.kicker+'</p>';
    h+='<p class="big">'+s.big+'</p>';
    if(s.p) h+='<p>'+s.p+'</p>';
  } else if(s.t==='pillar'){
    if(s.num) h+='<div class="num">'+s.num+'</div>';
    h+='<h3>'+s.h3+'</h3>';
    if(s.p) h+='<p>'+s.p+'</p>';
  } else if(s.t==='lanes'){
    h+='<h2>'+s.h2+'</h2>';
    h+='<ul>'+s.items.map(it=>'<li><b>'+it.b+'</b><span>'+it.s+'</span></li>').join('')+'</ul>';
  } else if(s.t==='cta'){
    h+='<h2>'+s.h2+'</h2>';
    if(s.p) h+='<p>'+s.p+'</p>';
    if(s.btn) h+='<a class="cta-btn" href="https://ifactorleadership.com/discoverycall/">'+s.btn+'</a>';
    if(s.disclaimer) h+='<p class="disclaimer">'+s.disclaimer+'</p>';
    if(s.brand) h+='<div class="brandline">'+s.brand+'</div>';
  } else {
    if(s.h2) h+='<h2>'+s.h2+'</h2>';
    if(s.p) h+='<p>'+s.p+'</p>';
  }
  sec.innerHTML=h;
  deck.appendChild(sec);
});
</script>
</body>
</html>
