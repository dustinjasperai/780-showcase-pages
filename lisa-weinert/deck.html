<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write From the Body — Narrative Healing Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF9FC;        /* her lavender #E8E8F7 lightened to a cool paper */
    --panel:#FFFFFF;
    --ink:#1A1A1A;
    --muted:#55566b;
    --accent:#2D3192;    /* her link indigo, from brand.json */
    --tint:#E8E8F7;      /* her ranked lavender */
    --rule:#1A1A1A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Hanken Grotesk",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:960px;margin:0 auto;padding:40px 24px 120px}
  .slide{
    background:var(--panel);
    border:1px solid #e7e6ef;
    border-radius:14px;
    padding:64px 60px;
    margin:0 0 26px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 2px rgba(26,26,50,.04);
  }
  .kicker{
    font-family:"Hanken Grotesk";font-weight:800;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px;
  }
  h1{font-family:"Petrona";font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Petrona";font-weight:600;font-size:38px;line-height:1.14;letter-spacing:-.01em}
  .lede{font-family:"Petrona";font-weight:400;font-size:24px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  .big{font-family:"Petrona";font-weight:500;font-size:34px;line-height:1.3;max-width:24ch}
  p.body{font-size:19px;line-height:1.65;color:var(--muted);margin-top:18px;max-width:54ch}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
  li{display:flex;gap:16px;align-items:flex-start;font-size:19px;line-height:1.5}
  li .n{
    flex:none;width:30px;height:30px;border-radius:50%;background:var(--tint);
    color:var(--accent);font-weight:800;font-size:14px;
    display:flex;align-items:center;justify-content:center;margin-top:2px;
  }
  li .n.plain{background:var(--accent);color:#fff}
  li b{font-weight:800;color:var(--ink)}
  li span.t{color:var(--muted)}
  .quote{font-family:"Petrona";font-style:italic;font-weight:400;font-size:30px;line-height:1.45;max-width:34ch}
  .attrib{margin-top:24px;font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--accent)}
  .foot{position:absolute;left:60px;bottom:26px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:#a6a6bd;font-weight:700}
  .pg{position:absolute;right:60px;bottom:26px;font-size:12px;color:#a6a6bd;font-weight:700}
  .cta h2{font-size:42px}
  .cta .step{margin-top:28px;display:flex;flex-direction:column;gap:12px}
  .cta .step a,.cta .step span{font-size:20px;font-weight:700;color:var(--accent)}
  .disc{margin-top:34px;font-size:13px;line-height:1.55;color:#8a8a9e;max-width:60ch}
  .rule{width:64px;height:3px;background:var(--accent);margin-top:28px;border-radius:2px}
  @media(max-width:640px){
    .slide{padding:40px 26px;min-height:auto}
    h1{font-size:34px}h2{font-size:28px}.big{font-size:25px}.quote{font-size:23px}
    .foot,.pg{position:static;margin-top:28px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Narrative Healing Masterclass with Lisa Weinert',
   h:'Write From the Body',
   lede:'How to finally write the book inside you, using the method that starts where the story actually lives.'},

  {t:'statement', kicker:'Who this is for',
   big:'You have carried this book for years. You know it matters. You still have not written it.',
   body:'This is for writers and leaders with a real story to tell, memoirists, founders, teachers, who have tried the courses, the outlines, and the solo attempts, and keep stalling at the same place.'},

  {t:'statement', kicker:'The trap',
   big:'You have been told the problem is discipline, structure, or a better outline.',
   body:'So you buy another template and push harder from the neck up. The page stays blank, and now you believe the block is a flaw in you. It is not.'},

  {t:'statement', kicker:'The reframe',
   big:'The block is not in your head. It is in your body.',
   body:'The story you most need to write is held in the nervous system, in tension, in breath, in the things that are hard to say. Force makes the body brace, and a braced body cannot write freely. That is why willpower keeps failing you.'},

  {t:'statement', kicker:'Part one · the real problem',
   big:'Most writing advice skips the only step that matters first: feeling safe enough to tell the truth.',
   body:'Technique on top of a shut-down body produces competent, lifeless pages. The work is to open the channel first, then shape the craft. Narrative Healing is built in that order on purpose.'},

  {t:'statement', kicker:'Part two · the method',
   big:'Narrative Healing is a mindfulness-based, somatic, and trauma-informed way into your story.',
   body:'It is the practice behind my book and my coaching. It moves you through six steps, each one a way of meeting the story in the body before you ask it onto the page.'},

  {t:'list', kicker:'The six steps',
   h:'The arc of Narrative Healing',
   plain:true,
   items:[
     ['Awaken','Notice where the story is living in the body, and wake up the voice that has gone quiet.'],
     ['Listen','Listen to it with compassion instead of judgment, so it stops hiding from you.'],
     ['Express','Put it on the page through somatic prompts, not forced outlines.'],
     ['Inspire','Let the writing move you, and let it be moved by what you read and witness.'],
     ['Connect','Shape it so a reader feels it in their body too.'],
     ['Grow','Build a sustainable practice so the writing keeps going after the rush fades.']
   ]},

  {t:'statement', kicker:'The first step, up close',
   big:'Awaken: before you write a word, you locate the story in the body.',
   body:'A simple breath and a body scan tell you where the charge is. That is your material. We start there, gently, because the body will only hand over what it trusts you to hold.'},

  {t:'statement', kicker:'The turn',
   big:'Listen and Express: the prompt replaces the outline.',
   body:'Instead of asking what should come next, you ask the body what is already here. A somatic prompt lowers the guard, and the truest sentences arrive when you are not bracing for them.'},

  {t:'quote',
   quote:'Your story begins in the body. When you learn to listen to it there, the writing stops being a fight.',
   attrib:'The Narrative Healing premise'},

  {t:'statement', kicker:'Part three · from practice to book',
   big:'A practice becomes a book when it meets a path.',
   body:'The somatic work opens the writing. Then it needs a structure that respects both your vision and the realities of your life. That is the five-phase path I take coaching clients through.'},

  {t:'list', kicker:'The five-phase path',
   h:'From blank page to published book',
   items:[
     ['Awaken your voice','Find the real voice through prompts and mindfulness, not imitation.'],
     ['Your book as a start-up','Understand the marketplace and the shape your book needs to take.'],
     ['Write with support','Custom prompts, developmental edits, and steady accountability.'],
     ['Design your publishing path','Choose traditional, hybrid, or self-publishing with clear eyes.'],
     ['Share and connect','Reach the reader who needs this book and keep them close.']
   ]},

  {t:'statement', kicker:'What changes',
   big:'The writing stops being a thing you dread and becomes a place you return to.',
   body:'Clients who could not finish a chapter in years start writing most days, because the practice meets them where the resistance actually is. The book gets written because the writer is no longer at war with the page.'},

  {t:'statement', kicker:'Why this works',
   big:'This is not another productivity system. It is the body, the craft, and the path, in the right order.',
   body:'Open the channel, shape the craft, design the route to a reader. Skip the first and the other two never hold.'},

  {t:'credibility', kicker:'Why me',
   h:'Twenty years on both sides of the book',
   items:[
     'Founder of Narrative Healing and author of Narrative Healing: Awaken the Power of Your Story.',
     'Twenty years in publishing, as a Penguin Random House publicist, then editor and literary coach.',
     'Licensed social worker (LMSW) and registered yoga teacher (RYT), trained in trauma-informed and restorative practice.',
     'I bring the craft of publishing and the care of the body to the same table, which almost no one does.'
   ]},

  {t:'statement', kicker:'A caution',
   big:'Going slow at the body is how you go fast at the book.',
   body:'The writers who try to skip the somatic step to save time are the ones still stuck a year later. Trust the order. The practice is the shortcut.'},

  {t:'quote',
   quote:'You do not have to earn your story. You have to learn how to listen to it.',
   attrib:'Narrative Healing'},

  {t:'statement', kicker:'The invitation',
   big:'If the book has been waiting in you, let us write it from the body.',
   body:'Bring the story you keep carrying. I will bring the method, the craft, and twenty years of helping writers get it onto the page and out into the world.'},

  {t:'cta', kicker:'Your next step',
   h:'Let us write your book, starting with your body',
   steps:[
     ['step','Begin free with The Writing Body, my weekly body-based writing practice.'],
     ['step','Join the Narrative Healing Studio to write live alongside a community each week.'],
     ['step','Ready for the book itself? Book a call to explore working together one to one.']
   ],
   disc:'No income, role, or publishing result is guaranteed. Results vary and depend on your own practice, writing, and circumstances. This masterclass is educational and reflects one approach to writing and publishing.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${s.kicker}</div>`;
  if(s.h) inner+=`<h1 ${s.t!=='title'?'style="font-size:38px"':''}>${s.h}</h1>`;
  if(s.lede) inner+=`<div class="lede">${s.lede}</div>`;
  if(s.big) inner+=`<div class="big">${s.big}</div>`;
  if(s.body) inner+=`<p class="body">${s.body}</p>`;
  if(s.quote) inner+=`<div class="quote">${s.quote}</div><div class="attrib">${s.attrib||''}</div>`;
  if(s.items && s.t==='list'){
    inner+='<ul>';
    s.items.forEach((it,n)=>{inner+=`<li><span class="n ${s.plain?'plain':''}">${n+1}</span><span><b>${it[0]}.</b> <span class="t">${it[1]}</span></span></li>`;});
    inner+='</ul>';
  }
  if(s.items && s.t==='credibility'){
    inner+='<ul>';
    s.items.forEach(it=>{inner+=`<li><span class="n plain">&bull;</span><span class="t">${it}</span></li>`;});
    inner+='</ul>';
  }
  if(s.steps){
    inner+='<div class="step">';
    s.steps.forEach(st=>{inner+=`<span>${st[1]}</span>`;});
    inner+='</div>';
    inner+='<div class="rule"></div>';
  }
  if(s.disc) inner+=`<div class="disc">${s.disc}</div>`;
  if(s.t!=='title'&&s.t!=='cta') inner+=`<div class="foot">Narrative Healing</div>`;
  inner+=`<div class="pg">${i+1} / ${S.length}</div>`;
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
