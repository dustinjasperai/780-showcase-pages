<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Why Your Power Zones Are Lying To You · EVOQ.BIKE Cycling Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fjalla+One&family=Libre+Franklin:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3fafa; --panel:#ffffff; --rule:#dbeaea;
    --accent:#2f9ba1; --teal:#7bc8cc; --pink:#f2d4eb;
    --ink:#16303a; --body:#3d4a4f; --dim:#7c8a8e;
  }
  html,body{height:100%}
  body{background:#e3eded;font-family:'Libre Franklin',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e3eded}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Libre Franklin',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Fjalla One',Impact,sans-serif;font-weight:400;color:var(--ink);line-height:1.12;letter-spacing:.004em}
  .t-title h1{font-size:5.1vw;max-width:93%}
  .t-normal h1{font-size:3.35vw;max-width:90%}
  .t-normal .body{font-family:'Libre Franklin',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.62;font-weight:400}
  .sub{font-family:'Libre Franklin',sans-serif;font-size:1.7vw;color:var(--accent);margin-top:3.4vh;max-width:82%;line-height:1.44;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Libre Franklin',sans-serif;font-size:1.1vw;font-weight:700;color:var(--accent);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),var(--teal),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#12363a 0%,#08201f 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:#eafafa}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#12363a 0%,#08201f 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:#eafafa}
  .t-cta .body{font-family:'Libre Franklin',sans-serif;color:#bfe4e5;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--teal);color:#eafafa;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7%;bottom:9%;width:24vw;opacity:.95}
  .corner-mo{right:6.5%;bottom:7.5%;width:11vw;opacity:.55}
  .brandline{font-family:'Libre Franklin',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(22,48,58,.08);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--teal));width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.6vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">EVOQ.BIKE Cycling Coaching</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a power curve rising then holding, plotted in teal, from the power-file world -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 90">
  <g fill="none" stroke="#7bc8cc" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M6 82 H114" opacity="0.35"/>
    <path d="M6 82 V6" opacity="0.35"/>
    <path d="M10 74 C 34 70, 40 34, 58 30 S 82 40, 92 22 106 20 112 18" opacity="0.9"/>
    <circle cx="58" cy="30" r="4.5" fill="#2f9ba1" stroke="none" opacity="0.95"/>
    <circle cx="92" cy="22" r="4" fill="#2f9ba1" stroke="none" opacity="0.9"/>
    <path d="M46 82 V30 M78 82 V27" stroke="#2f9ba1" opacity="0.28"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Why Your Power Zones Are Lying To You',sub:'How to read what your power data is actually doing to your body, so every hour on the bike trains the system you think it does.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You hit your numbers every ride. So why has your fitness stopped moving?',body:'You do the intervals, you stay in the right zone, the file looks clean. And yet the form curve flattens out. The problem is almost never effort or discipline. It is that the zone on your screen and the training effect in your body are two different things, and nobody ever showed you the gap.'},
 {t:'dark',title:'The number on your screen is not the training effect it promises to be.'},

 {t:'section',idx:'Part One',title:'The Zone Trap'},
 {t:'normal',k:'A label is not a physiology',title:'Power zones are a map. They are not the territory.',body:'Zones were built to make training simple, and they do. But a percentage of FTP is a label pasted onto a number. It does not know how long you held the effort, how rested you were, or what your heart and your aerobic system were actually doing while you rode. Two rides in the same zone can train two completely different things.'},
 {t:'normal',k:'The example everyone gets wrong',title:'You can ride in the VO2max zone and never train VO2max.',body:'If you are riding at 105 to 120 percent of FTP but only in quick blips, the aerobic processes that drive your maximal oxygen uptake were never stressed long enough to adapt. The screen says VO2max. Your body trained something else. This is the single most common way hard work gets wasted.'},
 {t:'dark',title:'You can spend an entire block in the right zone and train the wrong system.'},

 {t:'section',idx:'Part Two',title:'Reading What The Data Actually Says'},
 {t:'normal',k:'Train above the zone',title:'Short, sharp efforts labelled anaerobic can be your best VO2max work.',body:'Formats like 30 on, 30 off, or 40 on, 20 off, keep your heart rate and oxygen demand pinned high across the whole set, even though each rep looks anaerobic on paper. Done right, they stress the exact system the labelled VO2max effort failed to reach. The label said anaerobic. The effect was aerobic.'},
 {t:'normal',k:'Train below the zone',title:'Threshold work can build VO2max too, when it is held long enough.',body:'Sustained efforts under the classic VO2max power can still lift your heart rate to the same place, given enough time at the effort. The point is not the wattage bracket. The point is the physiological load you create and hold. That is what the body adapts to, and that is what a good coach reads in the file.'},
 {t:'normal',k:'The power file analysis',title:'The whole story is in the file. Most riders only read the headline.',body:'A power file is not a scorecard, it is a session in detail: what you actually stressed, where you faded, what recovered and what did not. Reading it properly is how you see the full picture instead of the average number. It is why EVOQ opens with a free Power File Analysis, a short video walking through exactly what your own data is telling you.'},
 {t:'normal',k:'Built for one rider',title:'Every rider is different, so the plan is built from your file, not a template.',body:'The EVOQ IGNITE approach starts with your history and your questionnaire, then a coach analyses your power files and builds the plan around what your data shows, not around a plan sold to ten thousand other people. The same effort, aimed at the system that will actually move for you.'},
 {t:'normal',k:'The head is half the watts',title:'The file cannot see your mind, but your racing lives there too.',body:'Process goals, repetition, the one percent gains, the small wins that keep you consistent through a long build. Physical training and mental training are coached together, because the strongest engine still needs a rider who shows up on the days that decide the season.'},
 {t:'dark',title:'Two riders, identical watts, opposite training. The file tells you which is which.'},

 {t:'section',idx:'Part Three',title:'What This Changes For You'},
 {t:'normal',k:'The riding this builds',title:'Every session earns its place, and the fitness starts moving again.',body:'When the training effect matches the intention, the wasted efforts disappear. You do less guessing, your hard days are genuinely hard in the way you meant, your easy days stay easy, and the form curve climbs again because nothing is being left on the table. That is the whole promise of coaching off the data instead of the label.'},
 {t:'normal',k:'Why EVOQ',title:'Coaches who race with power, and have coached with it for over a decade.',body:'EVOQ is a team of active and former professional racers, led by Brendan Housler, a three time Masters National Champion and ten time Category 1 State Champion, alongside pro road racer Keegan Swirbul. Each coach has more than a decade of training, racing, and coaching with power. This is the way they read every file.'},
 {t:'dark',title:'You do not need to train more. You need to train what you think you are training.'},

 {t:'section',idx:'Your Next Step',title:'See What Your Own Data Is Actually Saying'},
 {t:'normal',k:'Start with your file',title:'Send one power file, and get a coach&#39;s read on what it is really doing.',body:'The free Power File Analysis is the simplest place to start: a short video breaking down your own data, the same way a coach would in your first week. From there, semi custom plans and full one to one coaching are built from what your file shows.'},
 {t:'cta',title:'Ready to see what your power data is really telling you?',body:'Start with a free Power File Analysis, or talk to an EVOQ coach about a plan built from your own data.',chips:['Get your free Power File Analysis','Talk to an EVOQ coach'],disc:'Educational content for cyclists of all levels. No performance, placing, or fitness result is guaranteed. Results vary by rider, history, health, and consistency.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">EVOQ<b>.BIKE</b> · Cycling Coaching</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='title') h+=mo('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
