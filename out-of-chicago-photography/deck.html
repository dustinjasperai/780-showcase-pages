<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Right Place, Right Time — Out of Chicago</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito+Sans:ital,opsz,wght@0,6..12,700;0,6..12,800;0,6..12,900&family=Source+Sans+3:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaf3f8;        /* pale wash of brand sky-blue #6ec1e4 (light-scheme brand) */
    --panel:#f8fcfe;     /* near-white panel, faint blue cast from brand #6ec1e4 */
    --ink:#20303a;       /* deep slate text (brand text #444444 deepened for AA) */
    --mute:#55666f;
    --rule:#d7e4ec;      /* soft blue-grey rule, from brand #e7e7e7 tinted to accent */
    --accent:#0f6f9e;    /* deepened sky-blue, from brand #6ec1e4 / #0274be */
    --accent-soft:#e6f1f7;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  h1,h2,h3,.kick{font-family:"Nunito Sans",system-ui,sans-serif}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:44px 48px;margin:0 0 22px;box-shadow:0 1px 0 rgba(20,40,55,.03);
    position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;
    background:var(--accent)}
  .horizon{height:1px;background:linear-gradient(90deg,var(--accent),transparent);
    margin:14px 0 0;opacity:.5}
  .kick{letter-spacing:.14em;text-transform:uppercase;font-size:12px;font-weight:800;
    color:var(--accent);margin:0 0 10px}
  h1{font-size:46px;line-height:1.04;font-weight:900;margin:0 0 14px;letter-spacing:-.01em}
  h2{font-size:30px;line-height:1.1;font-weight:800;margin:0 0 12px}
  h3{font-size:20px;font-weight:800;margin:0 0 6px}
  p{font-size:18px;margin:0 0 12px;max-width:68ch}
  .lead{font-size:21px;color:var(--mute)}
  .big{font-size:34px;line-height:1.15;font-weight:800;max-width:24ch}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:18px;padding:10px 0 10px 30px;border-bottom:1px solid var(--rule);
    position:relative}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;
    border-radius:50%;background:var(--accent)}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:10px}
  .pill{display:inline-block;background:var(--accent-soft);color:var(--accent);
    font-weight:700;font-size:14px;padding:4px 12px;border-radius:999px;margin-bottom:12px}
  .brand{font-family:"Nunito Sans";font-weight:800;color:var(--mute);font-size:15px;
    letter-spacing:.02em;margin-top:18px}
  .num{font-family:"Nunito Sans";font-weight:900;font-size:15px;color:var(--accent)}
  .disc{font-size:14px;color:var(--mute);border-top:1px solid var(--rule);
    margin-top:22px;padding-top:14px;max-width:72ch}
  .cta h1{color:var(--accent)}
  @media(max-width:680px){.cols{grid-template-columns:1fr}.slide{padding:30px 24px}h1{font-size:34px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A live masterclass from Out of Chicago',
    h1:'Right Place, Right Time',
    lead:'How to come home from any trip with portfolio images, not just a full memory card.',
    brand:'Out of Chicago' },

  {t:'promise',
    kick:'What you will walk away with',
    h2:'By the end of this session',
    bullets:[
      'A simple way to plan a location so you arrive ready instead of hoping.',
      'How working photographers actually work a scene in the field.',
      'The habit that turns a good trip into a better next one.' ] },

  {t:'who',
    kick:'Who this is for',
    h2:'If you travel to shoot, this is for you',
    p:'Landscape, wildlife, and bird photographers who book the trip, drive before sunrise, shoot hundreds of frames, and still come home with only a few images you are proud of.' },

  {t:'trap',
    kick:'The trap',
    big:'You did everything right. You booked the trip, woke up early, and shot 800 frames. Three of them are keepers.',
    p:'It feels like the answer is a better camera, a longer lens, or one more trip. So you buy the gear and book the next trip, and the ratio barely moves.' },

  {t:'reframe',
    kick:'The reframe',
    big:'The trip was never the problem.',
    p:'The keepers were not luck. They happened when you were in the right place, at the right time, making the right decision on location. The rest of the card is everything that happened when one of those three was missing.' },

  {t:'part', num:'Part One', h2:'Why most trips underdeliver' },

  {t:'content',
    kick:'Problem one',
    h3:'You arrive hoping, not planning',
    p:'You show up to a famous spot at a random hour and wait for something to happen. The light, the tide, the animals, and the weather were all decided before you arrived. Hope is not a plan, and the camera cannot fix a bad time of day.' },

  {t:'content',
    kick:'Problem two',
    h3:'You shoot alone',
    p:'Alone, you repeat the compositions you already know. Nobody is standing beside you saying move three feet left, wait for that bird to turn, or drop lower. The fastest learning in photography happens shoulder to shoulder with someone who has already solved the scene.' },

  {t:'content',
    kick:'Problem three',
    h3:'You never close the loop',
    p:'You get home, dump the card, pick a couple of frames, and move on. You never ask why the keepers worked and the rest did not, so the next trip starts from zero instead of from what you just learned.' },

  {t:'part', num:'Part Two', h2:'The Out of Chicago method' },

  {t:'content',
    kick:'Pillar one',
    h3:'Right Place, Right Time',
    p:'Planning is the craft nobody teaches. Scout the location before you go. Learn its light, its seasons, and its conditions. Decide the exact window when the place is at its best, and build the day around arriving ready.',
    tag:'The difference between a snapshot trip and a portfolio trip' },

  {t:'content',
    kick:'Pillar one in practice',
    h3:'What planning actually looks like',
    bullets:[
      'Read the location the way a local pro reads it: light angle, time of year, access.',
      'Pick your window first, then build the rest of the day around it.',
      'Arrive early enough to work the scene, not scramble for it.' ] },

  {t:'content',
    kick:'Pillar two',
    h3:'Shoot Side-by-Side',
    p:'In the field, in a small group, next to someone who has photographed this place many times. You watch the decisions a pro makes in real time, try them while the light is still there, and get corrected on the spot. That is how a technique becomes yours.',
    tag:'Learn and shoot side-by-side with the pros' },

  {t:'content',
    kick:'Pillar two in practice',
    h3:'Working a scene, not grabbing it',
    bullets:[
      'Patience over frame count: stay with the scene until it gives you the shot.',
      'Composition decisions made on location, not fixed later.',
      'Small groups so you actually get time beside the instructor.' ] },

  {t:'content',
    kick:'Pillar three',
    h3:'The Review Loop',
    p:'The growth continues after the shutter. Prep before you go, shoot in the field, then review the work with people who can tell you why a frame did or did not land. A community that keeps shooting together is the reason your ratio climbs trip after trip.',
    tag:'Prep, field, review: the rhythm that compounds' },

  {t:'content',
    kick:'Pillar three in practice',
    h3:'How the loop runs',
    bullets:[
      'Pre-trip sessions so you arrive knowing what you are chasing.',
      'Honest critique that names why the keepers worked.',
      'A community you keep learning with long after you get home.' ] },

  {t:'part', num:'Part Three', h2:'In the field: one location, start to finish' },

  {t:'content',
    kick:'One location, start to finish',
    h3:'From scout to keeper',
    p:'We take a single real location and walk it end to end: how we scouted it, why we chose that window, how we worked the scene in the field, and how the review afterward made the next shot better. One place, every decision visible.' },

  {t:'why',
    kick:'Who is teaching this',
    h2:'Out of Chicago',
    p:'Founded by Chris Smith, a former physics teacher who started photographing Chicago in 2011 and wrote The Photographer’s Guide to Chicago. Since 2014, Out of Chicago has run immersive, hands-on photography conferences at epic locations like Grand Teton, Yosemite, Acadia, and Moab, where photographers learn and shoot side-by-side with world-class instructors.',
    brand:'Epic locations. World-class photographers. Hands-on instruction.' },

  {t:'cta',
    kick:'Your next step',
    h1:'Come do this in the field with us',
    p:'This session gives you the method. The portfolio images come when you put it to work in a place worth photographing, beside photographers who have been there. Reserve your spot at the next Out of Chicago conference: Grand Teton, Yosemite, or Merritt Island.',
    brand:'Out of Chicago',
    disc:'This masterclass is educational. Photography results vary with practice, location, conditions, and effort, and no specific outcome is guaranteed.' }
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let h = '';
  if (s.kick) h += '<div class="kick">'+s.kick+'</div>';
  if (s.num)  h += '<div class="pill">'+s.num+'</div>';
  if (s.h1)   h += '<h1>'+s.h1+'</h1>';
  if (s.h2)   h += '<h2>'+s.h2+'</h2>';
  if (s.h3)   h += '<h3>'+s.h3+'</h3>';
  if (s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if (s.big)  h += '<p class="big">'+s.big+'</p>';
  if (s.p)    h += '<p>'+s.p+'</p>';
  if (s.bullets){ h += '<ul>'; for(const b of s.bullets) h += '<li>'+b+'</li>'; h += '</ul>'; }
  if (s.tag)  h += '<div class="horizon"></div><div class="brand">'+s.tag+'</div>';
  if (s.brand && !s.tag) h += '<div class="brand">'+s.brand+'</div>';
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
