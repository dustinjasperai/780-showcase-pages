<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Growth Culture Masterclass — Gene Hammett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700;900&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8f9;      /* Gene's own light body ground */
    --panel:#ffffff;
    --ink:#233b5f;     /* his dominant navy */
    --ink-soft:#4a5b78;
    --rule:#233b5f;
    --accent:#b34b08;  /* his burnt-orange link color */
    --hair:#d8dde4;
    --display:'Lato',system-ui,sans-serif;
    --serif:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  body{padding:40px 18px;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:34px}
  .slide{
    background:var(--panel);border:1px solid var(--hair);border-radius:6px;
    padding:64px 68px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(35,59,95,.05);position:relative;
  }
  .kick{font-family:var(--display);font-weight:900;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:20px}
  .part{font-family:var(--display);font-weight:900;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--ink-soft);margin-bottom:14px}
  .hair{width:56px;height:3px;background:var(--rule);margin:22px 0}
  h1{font-family:var(--display);font-weight:900;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:900;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;margin-bottom:8px}
  p{font-size:21px;line-height:1.55;color:var(--ink-soft);max-width:60ch}
  p.lead{font-size:24px;color:var(--ink)}
  .u{background:linear-gradient(transparent 62%, rgba(179,75,8,.22) 62%);padding:0 2px;color:var(--ink);font-weight:600}
  ul{list-style:none;display:flex;flex-direction:column;gap:16px;margin-top:14px}
  li{font-size:20px;line-height:1.45;color:var(--ink-soft);padding-left:30px;position:relative;max-width:62ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  .num{font-family:var(--display);font-weight:900;font-size:20px;color:var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin-top:18px}
  .card{background:var(--bg);border:1px solid var(--hair);border-radius:6px;padding:26px}
  .card h3{font-size:20px;color:var(--ink)}
  .card p{font-size:17px}
  .foot{position:absolute;bottom:26px;left:68px;right:68px;display:flex;justify-content:space-between;
    font-family:var(--display);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:#9aa4b2}
  .cta h2{color:var(--ink)}
  .cta .step{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);margin-top:18px}
  .disc{margin-top:30px;font-size:14px;line-height:1.5;color:#8a94a3;max-width:70ch;font-style:italic}
  .stat{font-family:var(--display);font-weight:900;font-size:64px;color:var(--ink);line-height:1}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
    kick:'A Growth Think Tank Masterclass',
    h1:'Managers to Leaders',
    lead:'How the fastest-growing companies build a culture that grows itself, so the business stops depending on you for every decision.',
    foot:'Gene Hammett' },

  {t:'who',
    part:'Who this is for',
    h2:'You built it. Now it runs through you.',
    p:'This is for founders and CEOs of companies that are already growing, where the team is good, the demand is real, and yet almost every real decision still lands back on your desk.',
    bullets:[
      'You are the bottleneck, and you know it.',
      'Your best managers execute tasks but do not yet own outcomes.',
      'Growth keeps adding weight instead of taking it off your shoulders.'
    ] },

  {t:'trap',
    part:'The trap',
    h2:'The trap of success',
    lead:'The very habits that got you here are the ones keeping you stuck.',
    p:'Being the person with every answer built the company. Past a certain size it quietly caps it. The comfort of control becomes the ceiling on growth, and no one on the team is allowed to grow past you.' },

  {t:'reframe',
    part:'The reframe',
    h2:'Fast-growth CEOs lead the opposite way',
    p:'After studying hundreds of Inc. 5000 founders on Growth Think Tank, one pattern showed up again and again: the fastest-growing leaders do not hold tighter. They deliberately give their people more control, and growth follows.',
    bullets:[
      'They treat culture as a growth engine, not a perk.',
      'They push decisions down until managers own results.',
      'They grow leaders inside the building instead of buying them.'
    ] },

  {t:'part', part:'Part One', h2:'Why more control does not scale', num:'01' },

  {t:'body',
    h3:'Control feels safe and quietly starves growth',
    p:'When every decision needs your sign-off, three things happen at once, and all three get worse as you grow.',
    bullets:[
      'Speed dies. Good people wait on you instead of moving.',
      'Ownership never forms. If you decide, they never learn to.',
      'Your best people leave to find a place they can actually lead.'
    ] },

  {t:'body',
    h3:'Engagement is the number that predicts growth',
    p:'In the fast-growth companies I studied, the leaders were not chasing engagement scores for their own sake. Engaged people simply make better decisions faster, and that compounds. When people feel genuinely valued, they bring motivation, meaning, and judgment you cannot buy or mandate.',
    bullets:[
      'Valued people act like owners.',
      'Owners do not need to be managed, they need to be trusted.'
    ] },

  {t:'body',
    h3:'The real cost is the people you cannot afford to lose',
    p:'The quiet price of holding control is not slower decisions. It is that your most capable people, the ones you most want to keep, are the first to leave when they cannot grow. Ambitious people do not stay where they are not trusted to lead.',
    bullets:[
      'A players want ownership, not just a bigger to-do list.',
      'If they cannot lead under you, they will lead somewhere else.'
    ] },

  {t:'part', part:'Part Two', h2:'The Growth Culture system', num:'02' },

  {t:'body',
    h3:'A growth culture values every element of growth, not just the money',
    p:'A growth culture is one where people, leadership, and results are all treated as things that grow together. It is the operating layer underneath every fast-growth company I have studied, and it is teachable. Three parts make it real.' },

  {t:'framework',
    part:'Pillar one',
    h3:'The 331 Empowerment Framework',
    p:'Give control to get control. Instead of approving decisions, you build the conditions for your team to make them, starting with the small ones and widening the circle deliberately as trust is earned.',
    bullets:[
      'Name the decisions that no longer need you.',
      'Hand them over with the context, not just the task.',
      'Let people be wrong on the small things so they can be right on the big ones.'
    ] },

  {t:'framework',
    part:'Pillar two',
    h3:'Internal Brand Ambassadors',
    p:'Your next layer of leaders is already on the payroll. Internal Brand Ambassadors are the managers you deliberately develop into internal thought leaders, so leadership scales beyond the founder instead of staying trapped inside you.',
    bullets:[
      'Identify the people others already follow.',
      'Give them a platform and a real mandate, not just a title.',
      'Let them carry the culture into their own teams.'
    ] },

  {t:'framework',
    part:'Pillar three',
    h3:'Beyond execution',
    p:'Execution gets you to good. Ownership gets you to great. The shift is moving your team from doing the tasks they are handed to owning the outcomes they are responsible for, and that shift is a leadership decision before it is a hiring one.',
    bullets:[
      'Set the outcome, not the checklist.',
      'Measure whether people own the result, not just the activity.',
      'Reward the judgment, so more of it shows up.'
    ] },

  {t:'body',
    h3:'The 6 stages of culture maturity',
    p:'Most leadership teams cannot fix their culture because they cannot see where it actually is. Naming the stage you are in is what makes the next move obvious, and it turns a vague people problem into a concrete plan.',
    bullets:[
      'Diagnose the stage honestly, without flattering yourself.',
      'Work the one shift that stage needs, not all six at once.'
    ] },

  {t:'part', part:'Part Three', h2:'When the culture carries the weight', num:'03' },

  {t:'body',
    h3:'The business stops depending on you',
    p:'When a growth culture is real, the change shows up in your calendar first and then in your numbers.',
    bullets:[
      'Decisions get made well without you in the room.',
      'Managers bring you solved problems, not open ones.',
      'Growth adds capacity to the team instead of weight to you.'
    ] },

  {t:'body',
    h3:'Where to start this week',
    p:'You do not rebuild a culture in a quarter. You start it with one decision you have been holding and one person ready to own it.',
    bullets:[
      'Pick one recurring decision that no longer needs you.',
      'Hand it to the manager closest to it, with the full context.',
      'Watch what they do with it, and widen the circle from there.'
    ] },

  {t:'why',
    part:'Why me',
    h2:'I have spent years reverse-engineering this',
    p:'I am Gene Hammett. I built two seven-figure businesses, took one from zero to seven million in four years, and then spent a decade studying the leadership of fast-growth companies on Growth Think Tank. More than a million founders, CEOs, and leaders have used these growth strategies.',
    bullets:[
      'Host of Growth Think Tank and Inc. columnist.',
      'Author of The Trap of Success and Tough Conversations.',
      'Executive coach to CEOs and their teams at fast-growth companies.'
    ] },

  {t:'cta',
    part:'Your next step',
    h2:'Build a culture that grows itself',
    p:'If you are ready to stop being the bottleneck and start building leaders inside your company, the next step is a short conversation about where your culture is today and the one shift that would move it.',
    step:'Book a discovery call with Gene at genehammett.com',
    disc:'This masterclass is educational. It shares frameworks and principles, not promises. Results depend on your team, your market, and your own execution, and no specific outcome, revenue, or result is guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
  let h = '';
  if (s.kick) h += `<div class="kick">${s.kick}</div>`;
  if (s.part) h += `<div class="part">${s.part}</div>`;
  if (s.num) h += `<div class="num">${s.num}</div>`;
  if (s.h1) h += `<h1>${s.h1}</h1>`;
  if (s.h2) h += `<h2>${s.h2}</h2>`;
  if (s.h3) h += `<h3>${s.h3}</h3>`;
  if (s.t === 'title' || s.t === 'part') h += `<div class="hair"></div>`;
  if (s.lead) h += `<p class="lead">${s.lead}</p>`;
  if (s.p) h += `<p>${s.p}</p>`;
  if (s.bullets) h += '<ul>' + s.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
  if (s.step) h += `<div class="step">${s.step}</div>`;
  if (s.disc) h += `<div class="disc">${s.disc}</div>`;
  h += `<div class="foot"><span>Growth Think Tank</span><span>${i + 1} / ${S.length}</span></div>`;
  d.innerHTML = h;
  deck.appendChild(d);
});
</script>
</body>
</html>
