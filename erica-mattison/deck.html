<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Career Clarity Masterclass — Erica Mattison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rokkitt:wght@400;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a; --panel:#1e2a3a; --rule:#2f3e52;
    --accent:#28a6a5; --ink:#eef2f6; --muted:#9fb0c0;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0d141d;color:var(--ink);font-family:'Lato',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{text-transform:uppercase;letter-spacing:.18em;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Rokkitt';font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Rokkitt';font-weight:700;font-size:38px;line-height:1.12;margin-bottom:18px}
  .promise{font-size:22px;color:var(--muted);margin-top:22px;max-width:40ch}
  p.body{font-size:20px;color:var(--ink);max-width:48ch;margin-top:14px}
  p.body.muted{color:var(--muted)}
  ul{list-style:none;margin-top:18px}
  li{font-size:20px;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:52ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillar-name{font-family:'Rokkitt';font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px}
  .arc{display:flex;gap:16px;margin-top:26px;flex-wrap:wrap}
  .arc div{flex:1;min-width:180px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px}
  .arc h3{font-family:'Rokkitt';font-size:22px;color:var(--accent);margin-bottom:8px}
  .arc p{font-size:16px;color:var(--muted)}
  .presenter{margin-top:34px;font-size:16px;color:var(--muted)}
  .presenter b{color:var(--ink);font-weight:700}
  .cta-steps{font-size:21px;margin-top:10px;max-width:50ch}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;max-width:60ch}
  .kicker{font-family:'Rokkitt';font-size:120px;font-weight:700;color:var(--rule);position:absolute;right:30px;bottom:-24px;line-height:1}
  .slide.part{background:var(--panel)}
  .slide.part h1{color:var(--accent)}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:'A live, two-part masterclass', h:'Clarity Before Momentum',
   promise:'How to find your next career move with confidence, without guessing your way through another job search.',
   presenter:'with <b>Erica Mattison</b>, MPA, JD &middot; Gallup-Certified Strengths Coach'},

  {t:'audience', eyebrow:'Who this is for', h:'You are good at your work. You are just not sure it still fits.',
   bullets:[
     'You have accomplished a lot, and quietly wonder if this is still the right path.',
     'You feel stuck, restless, or ready for something, but cannot name what.',
     'You are growing into leadership, or weighing a real change.',
     'You want the next move to be the right one, not just the fast one.'
   ]},

  {t:'content', eyebrow:'The trap', h:'So you keep polishing the resume.',
   body:[
     'You update LinkedIn. You scroll the job boards at 11pm. You take the call with the recruiter. And underneath all of it, the real question is still sitting there unanswered: what do I actually want more of?',
     'Activity feels like progress. It is not the same thing as direction.'
   ]},

  {t:'reframe', eyebrow:'The reframe', h:'The problem was never a shortage of options.', kicker:'01',
   body:['It is a shortage of clarity. When you are not clear, every option looks equally plausible and equally risky, so you freeze or you leap. Clarity is what makes the right door obvious.']},

  {t:'part', h:'Part One', promise:'Why working harder on the search makes the fog worse.'},

  {t:'content', h:'Momentum without clarity just moves you faster in the wrong direction.',
   body:['Most career advice is tactical: fix the resume, network more, apply widely. Tactics are useful once you know where you are going. Applied too early, they lock you into someone else’s definition of your next step.']},

  {t:'content', h:'Clarity is a decision you make, not a feeling you wait for.',
   body:['You will not wake up one morning simply knowing. Clarity comes from asking better questions of yourself, in a structured way, with your strengths and values in the room.']},

  {t:'part', h:'Part Two', promise:'The Career Clarity Method: a strengths-first way to find your direction.'},

  {t:'pillar', pillar:'Pillar One &middot; The deeper question', h:'Find the real question behind the restlessness.',
   body:['"Should I change jobs?" is rarely the real question. We surface what is actually driving the uncertainty, so you are solving the right problem instead of the obvious one.']},

  {t:'pillar', pillar:'Pillar Two &middot; Strengths', h:'Build on what you are genuinely great at.',
   body:['Using CliftonStrengths, we name your natural talents in plain language. Direction that ignores your strengths never holds. Direction that is built on them feels like relief.']},

  {t:'pillar', pillar:'Pillar Three &middot; Values', h:'Get honest about what actually matters now.',
   body:['Values quietly shift across a career. We make yours explicit, so the next move fits the life you are actually living, not the one you planned at 25.']},

  {t:'pillar', pillar:'Pillar Four &middot; More of, less of', h:'Name what you want more of, and less of.',
   body:['Clarity gets concrete here. Not a job title, but the texture of your days: the work that energizes you, and the work that drains you. This is the filter you will run every opportunity through.']},

  {t:'arc', eyebrow:'From clarity to momentum', h:'Then, and only then, you move.',
   arc:[
     {h:'Foundation', p:'Clarify priorities, surface patterns, and establish direction.'},
     {h:'Application', p:'Apply the insight in real time and refine the strategy as you go.'},
     {h:'Integration', p:'Reinforce progress so the change is durable, not a short-lived burst.'}
   ]},

  {t:'part', h:'Part Three', promise:'What clarity actually looks like in your week.'},

  {t:'audience', h:'You stop auditioning for roles that were never right.',
   bullets:[
     'You can say what you want in one clear sentence.',
     'You evaluate opportunities against your own filter, not the market’s noise.',
     'You make the next decision from confidence, not anxiety.',
     'Momentum follows, because it finally has somewhere to go.'
   ]},

  {t:'why', eyebrow:'Why work with me', h:'I have sat on both sides of the career table.',
   body:['I spent years in law and public service leadership before becoming a coach. I hold an MPA and a JD, I am a Gallup-Certified Strengths Coach, and I wrote <i>Clarifying What Matters: Creating Direction for Your Career</i>. My whole approach is holistic and strengths-based, because your work and your life are not separate problems.']},

  {t:'reframe', eyebrow:'In one line', h:'Clarity before momentum.',
   body:['Find the real question. Build on your strengths and values. Name what you want more of. Then move, with confidence.']},

  {t:'cta', eyebrow:'Your next step', h:'Ready to find your direction?',
   steps:'Join the live Career Clarity Masterclass, or book a consultation to talk through your situation one on one.',
   presenter:'Erica Mattison &middot; <b>ericamattison.com</b>',
   disclaimer:'This masterclass is offered for educational and informational purposes only. Coaching supports your own decision-making; it does not guarantee any particular career, income, or hiring outcome. Results vary by individual.'}
];

function esc(s){return s;}
function render(){
  const deck = document.getElementById('deck');
  deck.innerHTML = S.map(s=>{
    let cls = 'slide' + (s.t==='part'?' part':'');
    let inner = '';
    if(s.eyebrow) inner += '<div class="eyebrow">'+s.eyebrow+'</div>';
    if(s.pillar) inner += '<div class="pillar-name">'+s.pillar+'</div>';
    if(s.t==='title'||s.t==='part'){ inner += '<h1>'+s.h+'</h1>'; }
    else { inner += '<h2>'+s.h+'</h2>'; }
    if(s.promise) inner += '<p class="promise">'+s.promise+'</p>';
    if(s.body){ s.body.forEach((b,i)=>{ inner += '<p class="body'+(i>0?' muted':'')+'">'+b+'</p>'; }); }
    if(s.bullets){ inner += '<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>'; }
    if(s.arc){ inner += '<div class="arc">'+s.arc.map(a=>'<div><h3>'+a.h+'</h3><p>'+a.p+'</p></div>').join('')+'</div>'; }
    if(s.steps) inner += '<p class="cta-steps">'+s.steps+'</p>';
    if(s.presenter) inner += '<div class="presenter">'+s.presenter+'</div>';
    if(s.disclaimer) inner += '<p class="disclaimer">'+s.disclaimer+'</p>';
    if(s.kicker) inner += '<span class="kicker">'+s.kicker+'</span>';
    return '<section class="'+cls+'">'+inner+'</section>';
  }).join('');
}
render();
</script>
</body>
</html>
