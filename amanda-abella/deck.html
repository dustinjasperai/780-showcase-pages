<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Effortless Revenue Engine — Amanda Abella</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f5;
    --panel:#f3e3e2;
    --ink:#390e04;
    --muted:#6b5047;
    --accent:#008fff;
    --rule:#e4d2cf;
    --head:'Archivo Black',system-ui,sans-serif;
    --body:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:#fffdfc;border:1px solid var(--rule);border-radius:18px;padding:52px 54px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(57,14,4,0.03)}
  .slide.hero{background:var(--panel);border-color:var(--panel)}
  .slide.dark{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.dark .muted{color:#d8bdb5}
  .slide.dark .k{color:#8fd0ff}
  .k{font-family:var(--head);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-size:52px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-size:36px;line-height:1.08;margin-bottom:16px}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);max-width:40ch}
  .slide.dark .sub{color:#e9d6cf}
  .big{font-size:30px;line-height:1.3;font-weight:600;max-width:24ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;line-height:1.4;padding:14px 0 14px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
  .slide.dark li{border-color:#5a2a1c}
  .step{display:flex;align-items:baseline;gap:18px}
  .num{font-family:var(--head);font-size:40px;color:var(--accent);line-height:1}
  .pillars{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px}
  .pill{flex:1;min-width:200px;background:var(--panel);border-radius:14px;padding:22px}
  .pill h3{font-family:var(--head);font-size:19px;margin-bottom:8px}
  .pill p{color:var(--muted);font-size:16px;line-height:1.4}
  .cta .btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-family:var(--head);font-size:18px;padding:16px 30px;border-radius:12px;text-decoration:none}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:52ch}
  .foot{max-width:960px;margin:0 auto;padding:0 20px 60px;color:var(--muted);font-size:13px;text-align:center}
  .count{font-family:var(--head);font-size:12px;color:var(--muted);letter-spacing:.1em;margin-bottom:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Make Money Your Honey &middot; Amanda Abella</div>
<script>
const S = [
  {t:'title', cls:'hero', k:'A live masterclass with Amanda Abella', h:'The Effortless Revenue Engine', sub:'How to scale your coaching revenue without scaling your hours.'},
  {t:'who', k:'Who this is for', h:'You are the reason it works. That is also the problem.', sub:'For six and seven figure coaches, consultants and service providers who have hit a ceiling because every bit of growth costs more of your hours.'},
  {t:'big', k:'The trap', big:'Right now, you are the funnel. Every lead waits on you. Every sale needs your energy. So growing the business means growing your week.'},
  {t:'reframe', cls:'dark', k:'The reframe', h:'More effort is not the next level.', sub:'Revenue that depends on your hours has a hard ceiling, and the ceiling is the hours. The fix is not working harder. It is building a system that does the selling for you.'},
  {t:'part', k:'Part one', h:'Why revenue stalls near the top'},
  {t:'list', k:'The three leaks', h:'Where the growth quietly drains out', items:['Follow up is manual, so warm leads go cold while you are busy delivering','Lead flow is feast or famine, tied to how much you post that week','You are the bottleneck, so nothing moves when you step away']},
  {t:'list', k:'What it costs', h:'The price of running on effort', items:['Burnout you keep pushing through','Discounting to close when the pipeline is thin','A business you cannot step away from, even for a week']},
  {t:'part', k:'Part two', h:'The Effortless Revenue Roadmap'},
  {t:'step', k:'Step one', n:'1', h:'Mindset and goal setting', sub:'Design the life first, then build the business to support it. The lifestyle is the spec the system is built to.'},
  {t:'step', k:'Step two', n:'2', h:'Understand your audience', sub:'Know exactly who you serve and the words they use, so the message pulls the right people in on its own.'},
  {t:'step', k:'Step three', n:'3', h:'Profitable offers', sub:'Package and streamline delivery so each sale carries healthy margin and does not cost you more time to fulfill.'},
  {t:'step', k:'Step four', n:'4', h:'Build the sales engine', sub:'Email, text and voicemail sequences carry a lead from first touch to booked call without you working each one by hand. This is where effortless revenue comes from.'},
  {t:'step', k:'Step five', n:'5', h:'The inbound lead generation trifecta', sub:'Three compounding sources running together, YouTube, referrals and mass media, so leads arrive whether or not you posted today.'},
  {t:'step', k:'Step six', n:'6', h:'Maintain the engine', sub:'Read the data, refine the weak step, and let the system keep improving instead of starting over each launch.'},
  {t:'part', k:'Part three', h:'A week with the engine live'},
  {t:'list', k:'A week on the engine', h:'The business works while you coach', items:['Ads and inbound bring strangers in, every day','A live masterclass does the teaching at scale','Automated follow up does the nudging and the booking','You show up for the booked call, which is the part only you can do']},
  {t:'pillars', k:'The operating system', h:'Three pillars hold it up', pills:[['Marketing messaging','The words that pull the right buyer in before they ever meet you.'],['Sales training','A clear, proven process for the conversation that closes.'],['Sales systems','The automation that runs it all without you in every step.']]},
  {t:'who', k:'Why me', h:'I built this the long way so you do not have to', sub:'I am Amanda Abella, bestselling author of Make Money Your Honey and host of the top ranked podcast by the same name. I have spent fifteen plus years in digital marketing and sales, and the Effortless Revenue system is what I use to run a business from anywhere without living in my inbox.'},
  {t:'big', cls:'hero', k:'The whole idea', big:'Build the engine once. Then it sells while you sleep, while you travel, while you coach the clients you already have.'},
  {t:'cta', cls:'dark', k:'Your next step', h:'Ready to build your engine?', sub:'If you want help installing the Effortless Revenue Engine in your business, the next step is a short application so we can see if the mastermind is the right fit.', btn:'Apply to the Effortless Revenue Mastermind', disclaimer:'Educational content only. Results vary and are not guaranteed. Nothing here is a promise of income or specific earnings.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let html = '<div class="count">' + (i+1) + ' / ' + S.length + '</div>';
  if (s.k) html += '<div class="k">' + s.k + '</div>';
  if (s.t === 'title') { html += '<h1>' + s.h + '</h1><p class="sub">' + s.sub + '</p>'; }
  else if (s.t === 'big') { html += '<p class="big">' + s.big + '</p>'; }
  else if (s.t === 'part') { html += '<h1>' + s.h + '</h1>'; }
  else if (s.t === 'reframe' || s.t === 'who') { html += '<h2>' + s.h + '</h2><p class="sub">' + s.sub + '</p>'; }
  else if (s.t === 'list') {
    html += '<h2>' + s.h + '</h2><ul>';
    s.items.forEach(it => html += '<li>' + it + '</li>');
    html += '</ul>';
  }
  else if (s.t === 'step') {
    html += '<div class="step"><div class="num">' + s.n + '</div><div><h2>' + s.h + '</h2><p class="sub">' + s.sub + '</p></div></div>';
  }
  else if (s.t === 'pillars') {
    html += '<h2>' + s.h + '</h2><div class="pillars">';
    s.pills.forEach(p => html += '<div class="pill"><h3>' + p[0] + '</h3><p>' + p[1] + '</p></div>');
    html += '</div>';
  }
  else if (s.t === 'cta') {
    html += '<h1>' + s.h + '</h1><p class="sub">' + s.sub + '</p>';
    html += '<a class="btn" href="#">' + s.btn + '</a>';
    html += '<p class="disclaimer">' + s.disclaimer + '</p>';
  }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
