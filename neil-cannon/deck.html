<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Root-Cause Reset | A Masterclass with Neil Cannon</title>
<link href="https://fonts.googleapis.com/css2?family=Rufina:wght@400;700&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f3ec; --panel:#ece9e2; --ink:#33373d; --muted:#6b6f78;
  --rule:#36686b; --accent:#2babb2; --accent2:#cdaa59; --head:#36686b;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);
  font-family:'Montserrat',system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased}
.deck{max-width:1000px;margin:0 auto;padding:0 22px}
.slide{position:relative;padding:76px 60px;margin:26px 0;background:#fffdf9;
  border:1px solid rgba(54,104,107,.16);border-radius:18px;
  box-shadow:0 14px 40px rgba(90,80,60,.07);min-height:460px;
  display:flex;flex-direction:column;justify-content:center}
.slide.sec{background:var(--head);color:#fff;border-color:var(--head)}
.slide.title{background:linear-gradient(160deg,#fffdf9 0%,var(--panel) 100%)}
.k{font-family:'Montserrat';font-size:14px;font-weight:700;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);margin-bottom:22px}
.slide.sec .k{color:var(--accent2)}
h1{font-family:'Rufina',Georgia,serif;font-weight:700;font-size:58px;line-height:1.06;
  color:var(--head);letter-spacing:-.01em}
h2{font-family:'Rufina',Georgia,serif;font-weight:700;font-size:42px;line-height:1.12;
  color:var(--head)}
.slide.sec h2,.slide.sec h1{color:#fff}
.promise{font-size:24px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:84%}
.lead{font-size:23px;line-height:1.55;color:var(--ink);margin-top:24px;max-width:88%}
.slide.sec .lead{color:rgba(255,255,255,.92)}
ul{list-style:none;margin-top:28px}
li{font-size:21px;line-height:1.5;color:var(--ink);padding-left:34px;position:relative;margin-bottom:18px;max-width:88%}
li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:4px;
  border:2.5px solid var(--accent)}
.pill-no{font-family:'Rufina',Georgia,serif;font-size:22px;color:var(--accent);font-weight:700;
  letter-spacing:.04em;margin-bottom:10px}
.tag{display:inline-block;margin-top:26px;font-size:15px;font-weight:600;letter-spacing:.04em;
  color:var(--head);background:var(--panel);border-radius:100px;padding:10px 20px}
.foot{position:absolute;left:60px;bottom:26px;font-size:13px;letter-spacing:.06em;
  color:#9a938a;font-weight:600}
.slide.sec .foot{color:rgba(255,255,255,.6)}
.num{position:absolute;right:60px;bottom:26px;font-size:13px;color:#b7b0a5;font-weight:600}
.slide.sec .num{color:rgba(255,255,255,.5)}
.disc{margin-top:30px;font-size:14px;line-height:1.55;color:var(--muted);max-width:92%;
  border-top:1px solid rgba(54,104,107,.2);padding-top:18px}
.cta-line{font-size:26px;font-weight:600;color:var(--head);margin-top:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Neil Cannon',
    h:'The Root-Cause Reset',
    promise:'Why chronic symptoms keep coming back, and the four pillars that let the body heal itself.' },

  {t:'content', k:'Who this is for',
    h:'You have tried everything.',
    lead:'The diets. The supplements. The tests that come back "normal" while you still feel exhausted, inflamed, and not like yourself. This hour is for you.' },

  {t:'content', k:'The trap',
    h:'Chasing the symptom.',
    body:['A new symptom appears, so you treat the symptom.',
          'It quiets down, then it returns, often louder or somewhere new.',
          'You are told to manage it, cope with it, live with it.',
          'The cause was never found, so the loop never ends.'] },

  {t:'sec', k:'The reframe',
    h:'Your symptoms are signals, not the problem.',
    lead:'A symptom is the body asking for something. Silencing the signal is exactly why it keeps coming back.' },

  {t:'sec', k:'Part one',
    h:'Why it keeps coming back.' },

  {t:'content', k:'The core problem',
    h:'The body is out of balance, in more than one place.',
    lead:'Chronic illness is rarely one broken part. It is the end state of imbalance building up across several systems at once, until the body can no longer absorb it quietly.',
    tag:'Treat the system, not the symptom' },

  {t:'sec', k:'Part two',
    h:'The 4 Pillars of Vitality.' },

  {t:'content', k:'The framework',
    h:'Four pillars decide how you feel.',
    lead:'Balance all four and the body does the healing on its own. Here is what each pillar covers.' },

  {t:'pillar', k:'Pillar one', no:'01',
    h:'Physical',
    body:['Gut health and how well you actually absorb food.',
          'Nutrition that fits your body, not a generic plan.',
          'Movement and the body’s ability to clear and detox.'] },

  {t:'pillar', k:'Pillar two', no:'02',
    h:'Mental',
    body:['Clarity and a vision of being well again.',
          'The limiting beliefs that keep you stuck in the sick role.',
          'The placebo and nocebo effect, and how belief shapes biology.'] },

  {t:'pillar', k:'Pillar three', no:'03',
    h:'Emotional',
    body:['Chronic stress as a driver of physical illness.',
          'Trapped emotions the body holds onto for years.',
          'Why calming the nervous system changes symptoms.'] },

  {t:'pillar', k:'Pillar four', no:'04',
    h:'Energetic',
    body:['The body runs on energy, and that energy can be read and rebalanced.',
          'Energy work, meditation, and energy medicine.',
          'Bioresonance and the Body Electric, worked remotely.'],
    tag:'The pillar almost everyone skips' },

  {t:'content', k:'The missing piece',
    h:'Why the energetic root gets skipped.',
    lead:'Most approaches stop at diet and supplements because the energetic layer is harder to see and harder to sell. It is also where many stubborn, "nothing works" cases finally shift.' },

  {t:'sec', k:'Part three',
    h:'What a root-cause plan looks like.' },

  {t:'content', k:'In practice',
    h:'One plan, across all four pillars.',
    body:['Start by finding the root, not naming the symptom.',
          'Rebalance the physical foundation first.',
          'Clear the mental and emotional load that keeps it locked in.',
          'Work the energetic layer so the change holds.'] },

  {t:'content', k:'What changes',
    h:'The body stops fighting itself.',
    lead:'When the four pillars come back into balance, the signals calm down because they are no longer needed. Energy returns, and you start to feel like you again.' },

  {t:'content', k:'Why me',
    h:'This is the work I do every day.',
    body:['Author of The Vitality Secret, a number one bestseller.',
          'Author of The Vitality Code and Mojo Multiplier.',
          'Host of The Vitality Podcast.',
          'Years of root-cause work with people told nothing more could be done.'] },

  {t:'content', k:'Recap',
    h:'Four pillars. One root cause.',
    body:['Physical: the foundation.',
          'Mental: the beliefs.',
          'Emotional: the load.',
          'Energetic: the piece most people never check.'] },

  {t:'cta', k:'Your next step',
    h:'Map your own four pillars.',
    ctaLine:'Book a private Vitality Consulting call and we will find your root cause together.',
    disc:'This masterclass is educational and is not medical advice or a diagnosis. Individual results vary, and nothing here is a promise or guarantee of any specific health outcome. Always work with a qualified professional for your own care.' }
];

const deck = document.getElementById('deck');
const esc = (s)=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
S.forEach((s, i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t==='sec'?'sec':s.t==='title'?'title':'');
  let html = '';
  if (s.k) html += `<div class="k">${esc(s.k)}</div>`;
  if (s.t==='pillar' && s.no) html += `<div class="pill-no">${esc(s.no)}</div>`;
  if (s.h) html += (s.t==='sec' || s.t==='pillar') ? `<h2>${esc(s.h)}</h2>` : `<h1>${esc(s.h)}</h1>`;
  if (s.promise) html += `<div class="promise">${esc(s.promise)}</div>`;
  if (s.lead) html += `<div class="lead">${esc(s.lead)}</div>`;
  if (s.ctaLine) html += `<div class="cta-line">${esc(s.ctaLine)}</div>`;
  if (s.body) html += '<ul>' + s.body.map(b=>`<li>${esc(b)}</li>`).join('') + '</ul>';
  if (s.tag) html += `<div class="tag">${esc(s.tag)}</div>`;
  if (s.disc) html += `<div class="disc">${esc(s.disc)}</div>`;
  html += `<div class="foot">Neil Cannon &middot; The Vitality Secret</div>`;
  html += `<div class="num">${i+1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
