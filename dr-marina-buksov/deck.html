<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Evidence-Informed Herbalist · Dr. Marina Buksov</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf6ef; --panel:#f3e9de; --rule:#d8c7bb;
    --acc:#490716; --acc2:#bf9b98; --ink:#2a1a17; --body:#4c3a34; --dim:#927e72; --cream:#f6ede0;
  }
  html,body{height:100%}
  body{background:#ece1d0;font-family:'Lato',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ece1d0}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Lato',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:5.6vw;max-width:94%}
  .t-normal h1{font-size:3.6vw;max-width:90%}
  .t-normal .body{font-family:'Lato',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Cormorant Garamond',serif;font-size:2.2vw;color:var(--acc);margin-top:3.2vh;max-width:84%;line-height:1.36;font-weight:500;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.05vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#3a0d15 0%,#2a0a10 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.0vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#3a0d15 0%,#2a0a10 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.2vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Lato',sans-serif;color:#eaddcb;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.62}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc2);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.5}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .sprig{position:absolute;pointer-events:none}
  .title-sprig{right:7%;bottom:8%;width:15vw;opacity:.92}
  .corner-sprig{right:6.2%;bottom:7%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Lato',sans-serif;font-size:1.12vw;color:var(--body);margin-top:3.8vh;font-weight:700;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(42,26,23,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.2vw}.t-normal h1{font-size:6.0vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.2vw}.t-section h1{font-size:7.8vw}.t-dark h1{font-size:6.4vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">Dr. Marina Buksov</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- botanical motif: an herb sprig, drawn in oxblood -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sprig" viewBox="0 0 120 120">
  <g fill="none" stroke="#490716" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 108 C60 84 60 60 60 30" opacity="0.9"/>
    <path d="M60 84 C44 80 34 70 32 54 C50 54 58 66 60 82" fill="#bf9b98" fill-opacity="0.25" opacity="0.9"/>
    <path d="M60 72 C76 68 86 58 88 42 C70 42 62 54 60 70" fill="#bf9b98" fill-opacity="0.25" opacity="0.9"/>
    <path d="M60 56 C46 52 38 44 36 30 C52 30 58 40 60 54" fill="#bf9b98" fill-opacity="0.25" opacity="0.9"/>
    <circle cx="60" cy="26" r="5" fill="#490716" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Evidence-Informed Herbalist',sub:'How a licensed clinician brings clinical herbalism into practice, with the same rigor they already trust.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You trained for years to help people heal. Somewhere along the way, the toolkit got narrow.',body:'You are a pharmacist, nurse, or clinician whose patients trust you. But more and more of them walk in already taking herbs and supplements, asking questions your training never covered, and the honest answer is that no one taught you how to guide them well.'},
 {t:'dark',title:'You did not spend years in clinical training just to say "I am not sure, ask your doctor."'},

 {t:'section',idx:'Part One',title:'The Tool That Was Taken Out of Your Training'},
 {t:'normal',k:'A gap by design',title:'Herbal medicine is the oldest system we have, and the one your education left out.',body:'People used plants as medicine for thousands of years before the modern pharmacy existed. Clinical herbalism was quietly removed from most medical and pharmacy curricula, not because it stopped working, but because a garden is hard to patent. The knowledge did not disappear. It just stopped being taught to the people patients trust most.'},
 {t:'normal',k:'Supplements are not herbalism',title:'Handing someone a bottle is not the same as a clinical herbal workup.',body:'Recommending a popular supplement off a shelf is guesswork. Clinical herbalism is a method: matching the plant to the person through physiology, energetics, and traditional use, checking it against their medications, and knowing your legal scope while you do it. That is a skill, and it can be learned properly.'},
 {t:'dark',title:'Your patients are already using herbs. Right now, almost no one clinically trained is guiding them.'},

 {t:'section',idx:'Part Two',title:'The HEIM Method'},
 {t:'normal',k:'The framework, three parts',title:'HEIM: Herbal Education, Implementation, and Monetization.',body:'Heim means "home" in several languages, and the method is about coming home to the roots of medicine. It is a step-by-step path: first learn herbalism the way a clinician needs to, then apply it under guidance until it is second nature, then build a real and legal practice around it. The three parts always run in that order.'},
 {t:'normal',k:'Part One, Herbal Education',title:'Learn plants the way a clinician thinks, not the way a blog post reads.',body:'You organize herbal knowledge by phytochemistry, botany, energetics, physiology, and traditional use, then run clinical workups drawing on Western, Ayurvedic, and Traditional Chinese approaches. It is structured, cross-referenced, and evidence-informed, so it sits comfortably next to everything you already know.'},
 {t:'normal',k:'Part Two, Implementation',title:'Knowledge you have not applied is not yet a skill.',body:'You practice through weekly casework and a full clinical project before you ever sit across from a paying client. That is how theory turns into competence and confidence, so that when a real person is in front of you, the workup is a habit, not a scramble.'},
 {t:'normal',k:'Part Three, Monetization',title:'A practice that is compliant, protected, and actually yours.',body:'The business layer is concrete: choose your specialty, define your scope and legal disclosures, set up a compliant client system, and learn how to reach and onboard the people you are meant to serve. For some this is a focused side practice. For others it becomes the whole thing.'},
 {t:'dark',title:'Evidence-informed, not evidence-free. That single distinction is the entire point.'},

 {t:'section',idx:'Part Three',title:'Inside a Real Herbal Practice'},
 {t:'normal',k:'A workup, briefly',title:'The same patient, seen through a wider lens.',body:'Take a common complaint like poor sleep and low energy. Instead of one default answer, you read the whole picture, physiology, current medications, constitution, and match a small, safe set of plants to that specific person, inside your scope. You are not replacing anything you already do. You are adding a tool you were never handed.'},
 {t:'normal',k:'Why Dr. Marina Buksov',title:'A PharmD who left the counter to build the practice she wished existed.',body:'Marina earned her PharmD, graduated Summa Cum Laude, then left retail pharmacy to become a clinical herbalist and holistic consultant. She now mentors other healthcare professionals through this exact method, and her graduates include practicing PharmDs who have added herbal care to how they serve patients.'},

 {t:'section',idx:'Your Next Step',title:'Bring This Medicine Back Into Your Practice'},
 {t:'normal',k:'Keep going with Marina',title:'The full path, from your first plant to your first client.',body:'Build Your Holistic Herbal Practice is the six-month immersion behind everything in this masterclass: the complete HEIM Method, live coaching, clinical materia medica, and the legal and business scaffolding to practice for real. Start with the free evidence-based herbal guide, and apply when you are ready to build the whole thing.'},
 {t:'cta',title:'Ready to practice the medicine you actually believe in?',body:'Take the next step with Dr. Marina Buksov.',chips:['Read the free evidence-based herbal guide','Apply for Build Your Holistic Herbal Practice'],disc:'Educational content for licensed and training healthcare professionals. Nothing here is medical advice, and no health, income, or practice result is guaranteed. Herbs can interact with medications; always work within your legal scope of practice. Results vary by professional, effort, and market.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="sprig ${kind==='title'?'title-sprig':'corner-sprig'}"><use href="#sprig"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Dr. Marina <b>Buksov</b> · Holistic Pharmacy</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
