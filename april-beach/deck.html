<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>License to Scale — A Masterclass with April Beach</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Newsreader:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f4f1;        /* her page ground */
    --panel:#eceae4;     /* deeper off-white panel */
    --ink:#174557;       /* her dominant deep teal */
    --teal:#0596a6;      /* her bright ocean teal */
    --accent:#d19482;    /* her CTA dusty-rose */
    --muted:#5d6b70;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ink);font-family:'Newsreader',Georgia,serif;color:var(--ink)}
  .deck{max-width:1040px;margin:0 auto}
  .slide{background:var(--bg);min-height:620px;padding:72px 76px;display:flex;flex-direction:column;justify-content:center;position:relative;border-bottom:1px solid rgba(23,69,87,.12)}
  .slide.dark{background:var(--ink);color:var(--bg)}
  .slide.teal{background:var(--teal);color:#fff}
  .eyebrow{font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .slide.dark .eyebrow,.slide.teal .eyebrow{color:var(--accent)}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:38px;line-height:1.14;margin-bottom:18px}
  p.lead{font-size:23px;line-height:1.5;max-width:40ch;color:var(--muted)}
  .slide.dark p.lead,.slide.teal p.lead{color:rgba(244,244,241,.82)}
  p.body{font-size:20px;line-height:1.55;max-width:46ch;margin-top:10px}
  .slide.dark p.body{color:rgba(244,244,241,.9)}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding-left:30px;position:relative;margin-bottom:14px;max-width:48ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .steps{display:flex;flex-direction:column;gap:14px;margin-top:10px}
  .step{display:flex;gap:18px;align-items:flex-start}
  .num{font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;color:#fff;background:var(--teal);min-width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center}
  .step .t{font-size:19px;line-height:1.45;max-width:44ch;padding-top:6px}
  .step .t b{font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink)}
  .kick{font-family:'Poppins',sans-serif;font-weight:600;font-size:26px;color:var(--teal);margin-bottom:10px}
  .pagefoot{position:absolute;bottom:26px;left:76px;font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .slide.dark .pagefoot,.slide.teal .pagefoot{color:rgba(244,244,241,.6)}
  .brandmark{position:absolute;bottom:26px;right:76px;font-family:'Poppins',sans-serif;font-size:12px;letter-spacing:.12em;color:var(--accent);text-transform:uppercase}
  .disc{font-size:14px;line-height:1.5;color:var(--muted);max-width:60ch;margin-top:26px;font-style:italic}
  .cta-btn{display:inline-block;margin-top:26px;font-family:'Poppins',sans-serif;font-weight:600;font-size:18px;background:var(--accent);color:#fff;padding:16px 30px;border-radius:8px;letter-spacing:.02em}
  .big{font-size:60px}
  @media(max-width:720px){.slide{padding:52px 32px;min-height:auto}h1{font-size:36px}h2{font-size:28px}.pagefoot,.brandmark{position:static;margin-top:28px;padding:0}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A Live Masterclass with April Beach',h:'License to Scale',lead:'The leverage model for experts who have already built the thing. How to turn your course, method or framework into revenue companies pay for in bulk.'},

 {t:'who',eyebrow:'Who this is for',h:'You have already built something that works.',body:'You are a coach, consultant or expert with a proven method, framework, training or course. You have real results and real clients. And you are still trading your time for every dollar you make.',foot:'The trap'},

 {t:'dark',eyebrow:'The honest part',h:'The problem is not your offer. It is your business model.',lead:'You are selling retail when your work is worth wholesale. One person at a time, one launch at a time, forever.'},

 {t:'point',eyebrow:'Part one · the volume trap',h:'Why the launch treadmill never ends',list:['Your income is capped by your calendar and your personal bandwidth.','Every new month starts at zero and asks for another launch.','You rebuild funnels, write emails and run ads to sell the same thing again.','The better it works, the more delivery lands back on you.']},

 {t:'kick',eyebrow:'The reframe',kick:'There is a second way to sell what you already made.',h:'Instead of selling your training to one customer at a time, you sell the right to use it to companies that already serve your audience.',body:'They pay you. They deliver it to their people. They handle the CRM, the support, the customer relationship. You focus on what you do best, which is creating the work.'},

 {t:'teal',eyebrow:'What licensing actually is',h:'Leverage instead of volume.',lead:'Long-term contracts instead of short-term campaigns. Intellectual property instead of personal bandwidth. One agreement can replace months of launches, and often outlasts them.'},

 {t:'point',eyebrow:'The leverage math',h:'Sell it once. Get paid in bulk.',body:'When you sell retail, one hundred customers means one hundred sales conversations and one hundred deliveries. When you license, one agreement puts your method in front of hundreds of people inside another company, and they do the delivering.',foot:'One method, many rooms'},

 {t:'point',eyebrow:'Part two · the Content Licensing Model',h:'The four levels of buyers for your work',steps:[['1','<b>Your own clients.</b> The fastest sales cycle. People who already trust your method.'],['2','<b>Peers and competitors.</b> Other coaches and experts who would rather license yours than build their own.'],['3','<b>Agencies, nonprofits and mid-sized organizations.</b> Groups who need to train their people.'],['4','<b>Corporations, universities and government.</b> Larger deals, longer cycles, lasting contracts.']]},

 {t:'point',eyebrow:'Part two · your assets',h:'You are further along than you think',body:'Most experts assume they have nothing to license, or that they need to build something new first. Neither is true. Before anything else, we map the top three things you have already built that another company would pay to use.',list:['Your signature course or program','Your named method, system or framework','Your trainings, workshops and processes']},

 {t:'point',eyebrow:'Part two · the offer',h:'Five ways to package a licensing offer',list:['The simple license: they use your content as is.','Train-the-trainer: they deliver your method under guidance.','Certification: they earn the right to teach it in your name.','Hybrid: your content plus a layer of your consulting.','Enterprise: a custom build for a large organization.']},

 {t:'point',eyebrow:'Part two · the seven levers',h:'What you control, and what it is worth',body:'Branding, where your content lives, how many people can access it, for how long, in what format, with what support, and at what price. The Seven Levers of Licensing decide your brand reach, your thought leadership, your scalability and your fee.',foot:'The Licensing Offer Plan'},

 {t:'point',eyebrow:'Part two · pricing',h:'Price it like an asset, not an hour',body:'Licensing is not priced by your time. It is priced by the value it creates inside the buyer and the market they serve. We use a repeatable pricing method to set your fee by industry, from a quick-sell to an enterprise agreement, so you never guess again.',foot:'The Amplify ROI Pricing Formula'},

 {t:'point',eyebrow:'A common worry',h:'Will I lose control of my work?',body:'No. Licensing is the opposite of giving it away. You keep ownership of your intellectual property and you write the rules of the agreement. The buyer gets permission to use it on the terms you set, and nothing more.',list:['You decide who can use it, and who cannot.','You decide for how long, and in what format.','You decide what carries your name and what does not.']},

 {t:'kick',eyebrow:'Part three · inside the model',kick:'Stay in control of everything you built.',h:'Others promote your content under your name and build your brand for you.',body:'You keep ownership and set the rules of who uses it, when, where and how, while you work on the projects that matter and your work keeps reaching new rooms.'},

 {t:'point',eyebrow:'Part three · the shift',h:'The retail year and the licensing year',steps:[['A','<b>The retail year.</b> Launch, cart open, deliver, cart close, then start over. Your income resets every month.'],['B','<b>The licensing year.</b> A handful of agreements that pay across quarters, while your delivery load goes down, not up.']]},

 {t:'dark',eyebrow:'Why me',h:'This is the model I have run for over a decade.',lead:'I have licensed my own content, courses and programs to companies in more than thirteen countries. License to Scale is the exact method I use, turned into a path you can follow for your own work.'},

 {t:'point',eyebrow:'Is this you',h:'This is the next move, not the first one',body:'Licensing is for experts who already have proof. If you have a method, framework, training or course that has produced real results with real clients, you have what a buyer is looking for. If you are brand new, build that proof first.',foot:'Proof first, leverage next'},

 {t:'point',eyebrow:'Where you are now',h:'The business roadmap',body:'Most experts move through three phases: Launch, where you sell your offer directly. Growth, where you expand reach and revenue. And Freedom, where your intellectual property earns for you through licensing. This masterclass is about the move into Freedom.',foot:'Launch · Growth · Freedom'},

 {t:'cta',eyebrow:'Your next step',h:'Build your first licensing offer with me',body:'If you are ready to turn what you have already built into an asset companies pay to use, License to Scale is where we plan, package and price your first licensing offer together.',cta:'Explore License to Scale',disc:'This masterclass is educational. No income or specific result is guaranteed. Results vary and depend on your market, your offer and your own execution.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const cls = s.t==='dark'?'slide dark': s.t==='teal'?'slide teal':'slide';
  let inner = '';
  if(s.eyebrow) inner += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if(s.t==='title'){ inner += `<h1 class="big">${s.h}</h1>`; }
  else if(s.h){ inner += `<h2>${s.h}</h2>`; }
  if(s.lead) inner += `<p class="lead">${s.lead}</p>`;
  if(s.body) inner += `<p class="body">${s.body}</p>`;
  if(s.list){ inner += '<ul>'+s.list.map(x=>`<li>${x}</li>`).join('')+'</ul>'; }
  if(s.steps){ inner += '<div class="steps">'+s.steps.map(x=>`<div class="step"><div class="num">${x[0]}</div><div class="t">${x[1]}</div></div>`).join('')+'</div>'; }
  if(s.cta) inner += `<span class="cta-btn">${s.cta}</span>`;
  if(s.disc) inner += `<p class="disc">${s.disc}</p>`;
  inner += `<div class="pagefoot">${s.foot?s.foot+' · ':''}${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  inner += `<div class="brandmark">April Beach · License to Scale</div>`;
  const el=document.createElement('section');
  el.className=cls; el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
