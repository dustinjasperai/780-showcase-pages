<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Hidden Treasure Method | A Masterclass with Liz Hamlet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#17130f;
    --panel:#211b15;
    --rule:#3a2f2a;
    --accent:#e8c061;
    --spark:#ff66c4;
    --text:#f4efe8;
    --muted:#b8ab99;
  }
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1000px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-family:'Archivo',sans-serif;font-weight:700;font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;display:flex;align-items:center;gap:10px}
  .kicker::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 14px 2px var(--accent)}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(30px,5.4vw,60px);line-height:1.05;letter-spacing:-.015em;color:var(--text)}
  h1 .hl{color:var(--accent)}
  h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(24px,3.8vw,40px);line-height:1.12;letter-spacing:-.01em;margin-bottom:20px}
  h2 .hl{color:var(--accent)}
  .lead{font-size:clamp(17px,2vw,22px);line-height:1.55;color:var(--muted);max-width:36ch;margin-top:22px}
  .lead.wide{max-width:52ch}
  p.body{font-size:clamp(16px,1.7vw,19px);line-height:1.62;color:var(--muted);max-width:56ch;margin-top:14px}
  ul{list-style:none;margin-top:22px;max-width:60ch}
  ul li{position:relative;padding-left:30px;margin-bottom:16px;font-size:clamp(16px,1.7vw,19px);line-height:1.5;color:var(--text)}
  ul li::before{content:"";position:absolute;left:2px;top:9px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  ul li span{color:var(--muted)}
  .big{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(40px,8vw,92px);color:var(--accent);line-height:1;letter-spacing:-.02em}
  .pillar-no{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(46px,9vw,110px);color:var(--panel);-webkit-text-stroke:2px var(--accent);line-height:.9;margin-bottom:10px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:30px 34px;margin-top:24px}
  .quote{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(22px,3.4vw,38px);line-height:1.2;color:var(--text);max-width:22ch}
  .quote .hl{color:var(--spark)}
  .credit{margin-top:24px;color:var(--muted);font-size:15px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
  .grid .cell{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .grid .cell b{font-family:'Archivo',sans-serif;color:var(--accent);font-size:15px;letter-spacing:.04em;text-transform:uppercase;display:block;margin-bottom:8px}
  .grid .cell span{color:var(--muted);font-size:16px;line-height:1.5}
  .cta-box{margin-top:28px;display:inline-block;font-family:'Archivo',sans-serif;font-weight:700;font-size:18px;color:var(--bg);background:var(--accent);padding:16px 30px;border-radius:10px}
  .disclaimer{margin-top:30px;font-size:12.5px;line-height:1.5;color:#8c8073;max-width:60ch}
  #nav{position:fixed;bottom:22px;right:26px;display:flex;align-items:center;gap:16px;font-family:'Inter';font-size:13px;color:var(--muted);z-index:5}
  #nav button{background:var(--panel);border:1px solid var(--rule);color:var(--text);width:38px;height:38px;border-radius:9px;font-size:16px;cursor:pointer}
  #nav button:hover{border-color:var(--accent);color:var(--accent)}
  #count{min-width:52px;text-align:center;letter-spacing:.1em}
  #bar{position:fixed;left:0;top:0;height:3px;background:var(--accent);width:0;transition:width .3s ease;z-index:5;box-shadow:0 0 10px var(--accent)}
  .foot{position:fixed;bottom:22px;left:26px;font-family:'Archivo';font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--muted);z-index:5}
  .foot b{color:var(--accent)}
  @media(max-width:640px){#stage{padding:8vh 8vw}.grid{grid-template-columns:1fr}.foot{display:none}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div class="foot">SPARK <b>SUCCEED</b></div>
<div id="nav"><button id="prev">&#8249;</button><span id="count"></span><button id="next">&#8250;</button></div>

<script>
const S = [
  {t:'title', k:'A live masterclass with Liz Hamlet', h:'The Hidden <span class="hl">Treasure</span> Method', lead:'How high-potential founders stop second-guessing, get strategic, and make the one brave move that changes the year.'},
  {t:'audience', k:'Who this is for', h:'The founder <span class="hl">bursting</span> with ideas', body:'You are past six figures. You are capable, ambitious, and full of ideas. And that is exactly the problem: there are so many good moves that you keep circling instead of choosing. This hour is for you.'},
  {t:'symptoms', k:'Sound familiar', h:'The <span class="hl">signs</span>', items:[['A notes app full of ideas','and not enough of them finished.'],['A calendar that is full','but a plan that is fuzzy.'],['Revenue that grew','faster than your systems did.'],['A brave move you keep','circling but never quite making.']]},
  {t:'trap', k:'The trap', h:'Busy is not the same as <span class="hl">strategic</span>', body:'The people with the most potential are often the ones doing the most second-guessing. You stay busy because busy feels safe. But a full calendar hides the fact that the business is running you, not the other way around.'},
  {t:'reframe', k:'The uncomfortable truth', h:'', quote:'Your next level is not another idea. It is the <span class="hl">brave move</span> you keep talking yourself out of.', credit:'The cost of playing small is not failure. It is a good business that quietly stays smaller than it should.'},
  {t:'problem', k:'Part one', h:'Why more ideas make it <span class="hl">worse</span>', body:'Every new idea feels like progress, so you collect them. But ten half-started directions do not add up to one finished one. The founder who wins is not the one with the most ideas. It is the one who can look at the pile and calmly say what matters now, and what waits.'},
  {t:'problem', k:'Part one', h:'From do-er to <span class="hl">strategist</span>', body:'Early on, doing everything yourself is why it worked. Past six figures, it is the ceiling. The shift is not about working more hours. It is about changing the job: from the person who does the work to the person who decides what work is worth doing.'},
  {t:'framework', k:'Part two', h:'The <span class="hl">Hidden Treasure</span> Method', body:'You do not need to invent something new. In almost every business I coach, the next level is already sitting there, unspotted. The method has three moves: find the treasure, get strategic, be brave.'},
  {t:'pillar', no:'01', k:'The method', h:'Find the <span class="hl">treasure</span>', body:'The highest-leverage asset you own is usually one you have stopped seeing: a client type that always says yes, an offer people keep asking for, a strength you treat as ordinary. We surface it deliberately, because you cannot build a strategy on value you have not named.'},
  {t:'pillar', no:'02', k:'The method', h:'Get <span class="hl">strategic</span>', body:'This is where strategic calm replaces the noise. We take the pile of ideas and turn it into a six month plan with one clear priority at a time. Not more to do. Less, chosen on purpose, so the business has sustainable revenue and systems instead of adrenaline.'},
  {t:'pillar', no:'03', k:'The method', h:'Be <span class="hl">brave</span>', body:'A plan only counts once you act on it. The brave move is usually the one you already know: raise the price, drop the offer that drains you, say the thing on stage. We make it a decision with a date, not a someday. Clarity is what makes brave feel possible.'},
  {t:'grid', k:'What changes', h:'Before and <span class="hl">after</span>', cells:[['Before','Reacting to whatever is loudest that week.'],['After','One priority at a time, chosen on purpose.'],['Before','More ideas, more open loops, more busy.'],['After','Fewer moves, finished, and paying off.']]},
  {t:'network', k:'The part most founders dread', h:'Visibility on <span class="hl">your</span> terms', body:'You do not have to become a different person to be seen. Non-traditional networking means getting known through the way you already work best, whether that is writing, speaking, or one real conversation at a time. Brave and strategic applies to how you show up, too.'},
  {t:'reframe', k:'What strategic calm means', h:'', quote:'Strategic calm is not doing less. It is knowing, on a Monday, the <span class="hl">one thing</span> that matters.', credit:'The noise does not go away because you found more time. It goes away because you finally chose.'},
  {t:'proof', k:'Part three', h:'Why listen to <span class="hl">me</span>', body:'I have spent two decades coaching founders and leaders, from bootstrapped teams to FTSE-listed companies, and inside brands like SpaceNK, Sony Music and Universal Music. I was named among LinkedIn\'s 1000 women who inspire, and I host the How to Spark Success podcast. I am not here to add to your idea pile. I am here to help you choose.'},
  {t:'apply', k:'Your next quarter', h:'A calmer, <span class="hl">braver</span> quarter', body:'Imagine opening your laptop and knowing the one thing that matters this week. The retreat, the Strategy Hour, and the Strategic Founder programme all do the same job: take a mind full of ideas and leave you with a plan you actually believe in, and the nerve to run it.'},
  {t:'symptoms', k:'What you leave with', h:'On the <span class="hl">other side</span>', items:[['Your hidden treasure named','and pointed at on purpose.'],['A six month plan','with one priority at a time.'],['One brave move','chosen, dated, and underway.'],['A way to be seen','that still feels like you.']]},
  {t:'reframe', k:'Remember this', h:'', quote:'Scale and find your <span class="hl">hidden treasure</span>, without burning the house down.', credit:'Strategic calm is not slower. It is what lets you move faster on the things that count.'},
  {t:'cta', k:'Your next move', h:'Let\'s find <span class="hl">yours</span>', body:'If this is the year you stop second-guessing, the next step is a conversation. Book a Strategy Hour or ask about The Strategic Founder, and we will find the one brave, strategic move worth making now.', box:'Book a Strategy Hour with Liz', disclaimer:'This masterclass is educational. Nothing here is a promise of income or results, and no specific outcome is guaranteed. Results vary from founder to founder and depend on your own market, offer and effort.'}
];

const stage = document.getElementById('stage');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide'+(i===0?' on':'');
  let inner = '';
  if(s.k) inner += `<div class="kicker">${s.k}</div>`;
  if(s.t==='title'){
    inner += `<h1>${s.h}</h1><p class="lead wide">${s.lead}</p>`;
  } else if(s.t==='reframe'){
    inner += `<blockquote class="quote">${s.quote}</blockquote><p class="credit">${s.credit}</p>`;
  } else if(s.t==='pillar'){
    inner += `<div class="pillar-no">${s.no}</div><h2>${s.h}</h2><p class="body">${s.body}</p>`;
  } else if(s.t==='grid'){
    inner += `<h2>${s.h}</h2><div class="grid">`+s.cells.map(c=>`<div class="cell"><b>${c[0]}</b><span>${c[1]}</span></div>`).join('')+`</div>`;
  } else if(s.t==='cta'){
    inner += `<h2>${s.h}</h2><p class="body">${s.body}</p><div class="cta-box">${s.box}</div><p class="disclaimer">${s.disclaimer}</p>`;
  } else {
    inner += `<h2>${s.h}</h2>`+(s.body?`<p class="body">${s.body}</p>`:'')+(s.lead?`<p class="lead">${s.lead}</p>`:'');
  }
  el.innerHTML = inner;
  stage.appendChild(el);
});

let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const count=document.getElementById('count');
const bar=document.getElementById('bar');
function show(n){
  cur=Math.max(0,Math.min(S.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('on',i===cur));
  count.textContent=(cur+1)+' / '+S.length;
  bar.style.width=((cur+1)/S.length*100)+'%';
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
document.getElementById('stage').addEventListener('click',e=>{ if(!e.target.closest('#nav')) show(cur+1); });
show(0);
</script>
</body>
</html>
