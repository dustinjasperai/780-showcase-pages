<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Championship Communication for Coaches | Betsy Butterick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0c1413;
    --panel:#13201f;
    --ink:#f3f4f0;
    --ink-soft:#c3ccc8;
    --ink-muted:#7f908b;
    --accent:#ffcc00;
    --rule:#36c0cb;
  }
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',-apple-system,sans-serif;overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1040px}
  .slide.on{display:block;animation:f .35s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:'Inter',sans-serif;font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:54px;line-height:1.08;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:38px;line-height:1.15;margin-bottom:20px}
  .promise{font-size:23px;color:var(--ink-soft);max-width:760px}
  p.lead{font-size:22px;color:var(--ink-soft);max-width:800px;margin-bottom:16px}
  ul{list-style:none;margin-top:14px}
  li{font-size:21px;color:var(--ink-soft);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid rgba(54,192,203,.16)}
  li::before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .part-num{font-family:'Poppins',sans-serif;font-size:15px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--rule);margin-bottom:14px}
  .big{font-family:'Poppins',sans-serif;font-weight:700;font-size:46px;line-height:1.12;max-width:900px}
  .accent{color:var(--accent)}
  .card{background:var(--panel);border:1px solid rgba(54,192,203,.22);border-radius:14px;padding:34px 38px;margin-top:10px}
  .quote{font-family:'Poppins',sans-serif;font-weight:600;font-size:30px;line-height:1.25;color:var(--ink)}
  .who-line{font-size:20px;color:var(--ink-soft);margin:7px 0}
  .disclaimer{font-size:14px;color:var(--ink-muted);margin-top:26px;max-width:760px;line-height:1.5}
  .cta-steps{font-size:22px;color:var(--ink-soft);margin-top:10px}
  .cta-steps strong{color:var(--accent);font-weight:600}
  footer{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:center;padding:16px 28px;font-family:'Inter',sans-serif;font-size:12px;color:var(--ink-muted);border-top:1px solid rgba(54,192,203,.14)}
  .brandmark{color:var(--ink-soft);font-weight:600;letter-spacing:.04em}
  .count{letter-spacing:.08em}
  .hint{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--ink-muted)}
  @media(max-width:720px){h1{font-size:34px}h2{font-size:27px}.big{font-size:30px}.promise,p.lead,li{font-size:17px}.quote{font-size:21px}}
</style>
</head>
<body>
<div id="stage"></div>
<footer><span class="brandmark">Betsy Butterick &middot; The Coaches' Coach</span><span class="count" id="count"></span></footer>
<div class="hint">Use &larr; &rarr; to move through the slides</div>
<script>
const S = [
  {t:'title', html:`<div class="eyebrow">A live masterclass for coaches</div><h1>Championship Communication<br><span class="accent">for Coaches</span></h1><p class="promise">Win the locker room and you give yourself a chance to win the season. The skill that gets you there is not on the whiteboard. It is in what you say, and how you say it.</p>`},
  {t:'who', html:`<div class="eyebrow">Who this is for</div><h2>You can coach the game. The hard part is the people.</h2><div class="who-line">High school, club and college coaches who feel like they are reaching players less than they used to.</div><div class="who-line">Coaches of a roster that is talented but tuned out.</div><div class="who-line">Leaders who know a hard conversation is coming and keep putting it off.</div>`},
  {t:'trap', html:`<div class="eyebrow">The trap</div><h2>Nobody taught us this part.</h2><p class="lead">We study offenses, defenses, periodization and film. We spend almost no time learning the one thing athletes actually respond to: clear, honest, human communication.</p><p class="lead">So we repeat what was said to us, and hope it lands.</p>`},
  {t:'reframe', html:`<div class="part-num">The reframe</div><div class="big">Most athletes do not quit the sport. They quit the <span class="accent">conversation</span> that was never had, or was had badly.</div>`},
  {t:'part', html:`<div class="part-num">Part One</div><h1>The four moments it breaks.</h1><p class="promise">Communication rarely fails in the easy times. It fails in a handful of predictable, high-stakes moments. Name them and you can prepare for them.</p>`},
  {t:'moments', html:`<div class="eyebrow">Where it breaks</div><h2>The four conversations coaches avoid.</h2><ul><li>Giving feedback that an athlete actually hears instead of defends against.</li><li>Talking after failure, a loss or a benching, without losing the room.</li><li>The difficult one on one: playing time, effort, accountability.</li><li>The parent in the parking lot.</li></ul>`},
  {t:'genz', html:`<div class="eyebrow">What changed</div><h2>Today's athlete is wired differently.</h2><p class="lead">Motivation, attention and the way feedback lands have all shifted for this generation of student-athletes. The standard does not drop. The delivery has to change.</p><p class="lead">Coaching the Gen Z athlete well is a learnable skill, not a personality you were or were not born with.</p>`},
  {t:'part', html:`<div class="part-num">Part Two</div><h1>Winning With Words.</h1><p class="promise">A set of concrete, situation-by-situation tools, not vague talk about culture. Here are the pillars we work from.</p>`},
  {t:'pillar', html:`<div class="eyebrow">Pillar one</div><h2>Winning with feedback.</h2><p class="lead">The difference between feedback an athlete absorbs and feedback they brace against is almost never the content. It is the framing, the timing and the first seven words. We build a repeatable way to deliver the hard note.</p>`},
  {t:'pillar', html:`<div class="eyebrow">Pillar two</div><h2>Winning with difficult conversations.</h2><p class="lead">Playing time. Effort. A captain who is not leading. We walk through how to go into the conversation you have been avoiding with a plan, so you lead it instead of reacting to it.</p>`},
  {t:'pillar', html:`<div class="eyebrow">Pillar three</div><h2>Winning with failure and adversity.</h2><p class="lead">What you say in the ninety seconds after a loss sets the tone for the next two weeks. We cover how to be honest about a result without crushing the people who produced it.</p>`},
  {t:'pillar', html:`<div class="eyebrow">Pillar four</div><h2>Winning with the individual athlete.</h2><p class="lead">A team is a set of individuals who each hear you differently. We cover how to read what a specific athlete needs, especially the Gen Z athlete, and adjust without playing favorites.</p>`},
  {t:'pillar', html:`<div class="eyebrow">Pillar five</div><h2>Winning with small shifts.</h2><p class="lead">You do not need a new personality. You need a handful of small, deliberate changes in your language and delivery. Small shifts, run consistently, change how a room responds to you.</p>`},
  {t:'part', html:`<div class="part-num">Part Three</div><h1>What it looks like at practice.</h1>`},
  {t:'example', html:`<div class="eyebrow">One conversation, two ways</div><h2>The benching talk.</h2><div class="card"><div class="who-line">The reflex version shuts a player down and they check out for a month.</div><div class="who-line" style="margin-top:14px">The prepared version names the standard, names the path back, and keeps the athlete bought in.</div></div><p class="lead" style="margin-top:18px">Same decision. Completely different season.</p>`},
  {t:'why', html:`<div class="eyebrow">Why listen to me</div><h2>I coached, and I got this wrong first.</h2><p class="lead">I spent years coaching college basketball across Division I, II and III, and worked in the WNBA with the Seattle Storm. I learned the communication side the hard way, on the floor, and I have spent the years since turning it into tools other coaches can use.</p>`},
  {t:'recap', html:`<div class="eyebrow">The whole system</div><h2>One page.</h2><ul><li>Know the four moments it breaks.</li><li>Have a plan for feedback, failure and the hard conversation.</li><li>Read the individual, especially this generation.</li><li>Run the small shifts until they are habit.</li></ul>`},
  {t:'next', html:`<div class="eyebrow">Where to go from here</div><h2>Keep the momentum.</h2><p class="lead">If this gave you one thing to use tomorrow, there is a full version of it waiting for you: the complete Championship Communication for Coaches course, and ways to bring this work to your whole staff or program.</p>`},
  {t:'cta', html:`<div class="eyebrow">Your next step</div><h1>Let's win with words.</h1><div class="cta-steps"><strong>1.</strong> Enroll in Championship Communication for Coaches at betsybutterick.com.</div><div class="cta-steps"><strong>2.</strong> Bring it to your staff or team: reach out about coaching and program work.</div><p class="disclaimer">This masterclass is for educational purposes only. No result is guaranteed, and results vary from coach to coach depending on your team, your effort and your situation.</p>`}
];
const stage=document.getElementById('stage');
const countEl=document.getElementById('count');
let i=0;
function render(){
  stage.innerHTML='';
  const s=S[i];
  const d=document.createElement('div');
  d.className='slide on';
  d.innerHTML=s.html;
  stage.appendChild(d);
  countEl.textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(1);
  else if(e.key==='ArrowLeft')go(-1);
});
document.addEventListener('click',e=>{go(e.clientX<window.innerWidth*0.3?-1:1);});
render();
</script>
</body>
</html>
