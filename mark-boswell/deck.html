<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Where Process Meets Profit · Mark Boswell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:wght@400;700&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#050e18; --panel:#0d2137; --rule:#1c344d;
    --ink:#f5f0e8; --accent:#d4ac0d; --grey:#b8b0a0; --dim:#8a8172; --data:#e9c65c;
  }
  html,body{height:100%}
  body{background:#000;font-family:'DM Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Libre Baskerville',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.2;letter-spacing:-.005em}
  .t-title h1{font-size:3.5vw;max-width:88%}
  .t-normal h1{font-size:2.6vw;max-width:84%}
  .t-normal .body{font-family:'DM Sans',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-family:'DM Sans',sans-serif;font-size:1.6vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'DM Sans',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.75vw;max-width:82%;font-style:italic;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .cross-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-cross{right:6%;bottom:8%;width:15vw}
  .corner-cross{right:6%;bottom:7%;width:6.4vw;opacity:.5}
  .brandline{font-family:'DM Sans',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'DM Sans',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'DM Sans',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'DM Sans',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">Crossroads of America Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- crossroads motif: two roads crossing at a point, gold marking the accent road, echoing the
     firm's own name (Crossroads) and its tagline (Where Process Meets Profit) over a generic
     growth-arrow or dial -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="cross" viewBox="0 0 260 140">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M20,20 L240,120" stroke="#1c344d" opacity="0.9"/>
    <path d="M240,20 L20,120" stroke="#d4ac0d" opacity="0.95"/>
    <circle cx="130" cy="70" r="7" fill="#d4ac0d" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Where Process Meets Profit',sub:'A masterclass for RV and Marine dealership owners on turning Fixed Operations into a measured, controlled profit center, not a support department that hides its own leaks.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You are chasing new unit sales while your Fixed Ops department quietly leaks six figures a year.',body:'Most growth advice sold to RV and Marine dealership owners is about moving more units: better financing, faster closes, bigger lots. Meanwhile the department already inside your four walls, service and parts, runs on whatever process has always been there, unmeasured and unaccountable.'},
 {t:'dark',title:'More unit sales does not fix a leak you cannot see.'},

 {t:'section',idx:'Part One',title:'Why the Leak Stays Invisible'},
 {t:'normal',k:'Clocked hours vs. billed hours',title:'A technician clocked for 8 hours who only bills 4 to 5 is leaving $200 an hour of billable capacity on the table, at a $200 effective labor rate.',body:'That gap rarely gets questioned because nobody is tracking clocked-versus-billed as a daily number. It just becomes "how the shop has always run," and it compounds every single day the shop is open.'},
 {t:'normal',k:'No real KPI visibility',title:'Managers stay busy without ever being accountable to a number, and the DMS reads like a transaction log instead of a profit tool.',body:'Warranty claims get denied for sloppy documentation. Advisors turn into order-takers instead of running a real sales process on every repair order. Dispatch turns into chaos: ROs stacking up, technicians waiting on assignments, parts, or approvals.'},
 {t:'dark',title:'You do not need more sales leads. You need to see where the labor hours already went.'},

 {t:'section',idx:'Part Two',title:'The Fixed Ops Blueprint'},
 {t:'normal',k:'The 4-Step Blueprint for Fixed Ops Performance',title:'Operational audit, custom strategy, onsite coaching, and performance tracking, run as one connected process, not four separate consulting products.',body:'An onsite audit surfaces the actual profit leaks and workflow bottlenecks before anything is recommended. Custom SOPs and accountability frameworks get built around the team and the DMS already in place. Then it is shoulder-to-shoulder coaching on the shop floor, not classroom theory, followed by ongoing KPI tracking so the results compound instead of fading after the consultant leaves.'},
 {t:'normal',k:'The 9-step Road to the Sale',title:'Advisors execute the same process on every repair order, not just when they feel like it.',body:'Rapport-building, objection handling, and CSI, taught as a repeatable system rather than left to whichever advisor happens to be good at it that day. The goal is advisors who are profit-drivers, not order-takers.'},
 {t:'normal',k:'Dispatch & Workflow Control',title:'RO flow, dispatch systems, cycle-time reduction, and capacity planning, rebuilt so technicians are never standing around waiting.',body:'Fixing the chaos in the service lane, not with more headcount, but with dispatch discipline and throughput controls, has cut cycle time by up to 50% in real engagements.'},
 {t:'dark',title:'Proven inside the shop floor, not taught from a slide deck.'},

 {t:'section',idx:'Part Three',title:'Proof It Works'},
 {t:'normal',k:'$1.2M+ identified, not projected',title:'Profit identified inside real dealership engagements across the country.',body:'Found through improved technician billing accountability, dispatch control, workflow efficiency, and warranty process improvement, the same combination behind a 30%+ average service-profit improvement and up to 50% cycle-time reduction in the dealerships already worked with.'},
 {t:'normal',k:'Why Mark Boswell',title:'He is not a consultant who studied dealerships from the outside. He ran them.',body:'Service Advisor, Parts Manager, Fixed Operations Director, then Regional Director over multi-rooftop groups, then national Fixed Ops consultant for two industry organizations, before founding Crossroads. 30+ years, RV and Marine exclusive. Published in RV PRO, RV Business, and RV Executive Today. Active RVDA member.'},

 {t:'section',idx:'Your Next Step',title:'Find Your Leak'},
 {t:'normal',k:'How it works',title:'A free strategy call finds your top 3 profit leaks. The engagement builds the SOPs, coaching, and accountability that make the fix stick.',body:'Every engagement is scoped to your dealership size, complexity, and urgency, whether a targeted audit, an ongoing consulting relationship, or a structured onsite training program, discussed openly on the first call.'},
 {t:'cta',title:'Ready to find the profit that is already inside your building?',chips:['Book the Free Fixed Ops Strategy Call'],disc:'Educational content for RV and Marine dealership owners. No income, growth, or business result is guaranteed. Results vary by dealership, market, and effort.'},
];

const deck=document.getElementById('deck');
function crossSvg(kind){return `<svg class="cross-motif ${kind==='title'?'title-cross':'corner-cross'}"><use href="#cross"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Crossroads of America <b>Consulting</b> &middot; Mark Boswell</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=crossSvg(s.arc);
  else if(s.t==='title') h+=crossSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
