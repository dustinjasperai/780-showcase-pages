<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Premium Shift - Go Premium Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700;900&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f0ef; --panel:#fdfefe; --ink:#1f2a2e; --muted:#55636f;
    --accent:#0a4754; --rule:#cfe0dc;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:"Open Sans",system-ui,sans-serif;line-height:1.55}
  #stage{max-width:1040px;margin:0 auto;padding:40px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 26px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(31,42,46,.03)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:"Merriweather",Georgia,serif;font-weight:900;font-size:46px;line-height:1.1;letter-spacing:-.01em}
  h2{font-family:"Merriweather",Georgia,serif;font-weight:700;font-size:33px;line-height:1.15}
  .sub{color:var(--muted);font-size:20px;margin-top:18px;max-width:60ch}
  p.body{font-size:19px;margin-top:16px;max-width:62ch}
  .brandline{margin-top:34px;font-weight:700;color:var(--accent);letter-spacing:.04em}
  .hair{width:64px;height:3px;background:var(--accent);border-radius:2px;margin:6px 0 2px}
  ul{margin:20px 0 0 0;list-style:none}
  ul li{position:relative;padding-left:30px;margin:14px 0;font-size:19px;max-width:60ch}
  ul li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;
    border:3px solid var(--accent);border-radius:50%}
  .pillarnum{font-family:"Merriweather",serif;font-weight:900;font-size:22px;color:var(--accent);
    border:2px solid var(--accent);border-radius:50%;width:52px;height:52px;display:flex;
    align-items:center;justify-content:center;margin-bottom:20px}
  .part{font-family:"Merriweather",serif;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .big{font-family:"Merriweather",serif;font-weight:900;font-size:40px;line-height:1.12;margin-top:10px}
  .two{display:flex;gap:40px;flex-wrap:wrap;margin-top:22px}
  .two .col{flex:1;min-width:230px}
  .col h3{font-family:"Merriweather",serif;font-size:17px;color:var(--accent);margin-bottom:8px;letter-spacing:.04em}
  .stat{font-family:"Merriweather",serif;font-weight:900;font-size:40px;color:var(--accent)}
  .statrow{display:flex;gap:46px;flex-wrap:wrap;margin-top:24px}
  .disclaimer{color:var(--muted);font-size:14px;margin-top:26px;max-width:66ch;line-height:1.5}
  .ctabtn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-weight:700;
    padding:15px 30px;border-radius:9px;font-size:17px;letter-spacing:.02em}
  .foot{position:fixed;bottom:0;left:0;right:0;text-align:center;color:var(--muted);
    font-size:12.5px;padding:10px;background:linear-gradient(transparent,var(--bg) 40%)}
  @media(max-width:640px){.slide{padding:38px 26px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot">Go Premium - Premium coaching for coaches - Fabiola Skriver</div>
<script>
const S = [
  {t:"title", eyebrow:"A free live masterclass", h1:"The Premium Shift",
   sub:"How to become the number-one coach premium clients seek out, without grinding yourself out.",
   brand:"Go Premium with Fabiola Skriver"},

  {t:"promise", eyebrow:"What you will walk away with", h2:"By the end of this session you will have:",
   items:["A clear picture of why skilled coaches stay the best-kept secret",
          "The mindset to price premium with confidence",
          "A positioning that makes you the obvious choice",
          "A way to create demand instead of chasing clients"]},

  {t:"who", eyebrow:"Who this is for", h2:"You are brilliant at the work.",
   sub:"You are a skilled coach or expert. Your clients get real results. And yet you are underpriced, under-booked, and still the best-kept secret in your field."},

  {t:"trap", eyebrow:"The trap", h2:"You think the answer is to work harder.",
   body:"More posts. More free calls. More hours. So you grind, your rates stay low out of fear, and the premium clients you are made for never even see you."},

  {t:"reframe", part:"The reframe", big:"It is not more hustle you need. The block is in your head, not in your tactics.",
   sub:"80 percent of your branding comes from your mindset: the courage to take action, to show who you are, and to charge what your work is worth."},

  {t:"parthead", part:"Part one", h2:"Why most coaches stay the best-kept secret"},

  {t:"content", eyebrow:"Demand is built", h2:"Premium clients do not arrive by waiting.",
   body:"Great work alone does not get seen. Demand is created on purpose, through positioning and language, so the right people come to you of their own free will."},

  {t:"content", eyebrow:"Chase vs attract", h2:"Chasing repels. Positioning attracts.",
   body:"When you chase clients, you discount, over-explain, and take whoever says yes. When you position, premium clients self-select and arrive ready to pay premium."},

  {t:"parthead", part:"Part two", h2:"The Go Premium Method"},

  {t:"pillar", n:"1", h2:"A simple plan to premium",
   body:"A focused, sustainable business model built around one clear premium goal, so you can grow toward real income without knokling yourself out."},

  {t:"pillar", n:"2", h2:"Premium pricing with confidence",
   body:"The inner work of charging premium: dissolving the who-am-I-to-charge-this voice so you can price at your real worth. This is where 80 percent of the shift happens."},

  {t:"pillar", n:"3", h2:"Premium positioning",
   body:"Becoming number one in your field: crystal clear on the exact premium client you want, and the business form that makes you the obvious choice for them."},

  {t:"pillar", n:"4", h2:"Create demand",
   body:"Building a business premium clients come to of their own free will, so booking them feels simple and enjoyable instead of a constant chase."},

  {t:"pillar", n:"5", h2:"Words that attract premium clients",
   body:"Premium messaging: saying what you do in language that signals premium, pulls the right buyer in, and lets the wrong-fit clients opt themselves out."},

  {t:"parthead", part:"Part three", h2:"What the premium shift looks like"},

  {t:"beforeafter", eyebrow:"The shift", h2:"From best-kept secret to first choice",
   cols:[{h:"Before",lines:["Underpriced and over-delivering","Chasing, discounting, over-explaining","Invisible to premium clients"]},
         {h:"After",lines:["Priced at your real worth","Premium clients coming to you","Known as the number-one choice"]}]},

  {t:"why", eyebrow:"Why learn this from me", h2:"Fabiola Skriver, Go Premium",
   sub:"16 plus years in personal branding for lifestyle coaches, and the Go Premium method behind it.",
   stats:[{n:"16+",l:"years in personal branding"},{n:"5,000+",l:"coaches helped to clients"},{n:"1,500+",l:"through the free bootcamp"}]},

  {t:"recap", eyebrow:"The method, in one view", h2:"Your premium shift, five pillars",
   items:["A simple plan to premium","Premium pricing with confidence","Premium positioning","Create demand","Words that attract premium clients"]},

  {t:"cta", eyebrow:"Your next step", h2:"Ready to make the premium shift?",
   sub:"If you want the full method and weekly support to do this in your own business, the Go Premium Mastermind is where we do it together, in a small group, over three months.",
   cta:"Apply for the Go Premium Mastermind",
   disclaimer:"This masterclass is educational. Results vary and depend on your own work and market. Nothing here is a promise or guarantee of any specific income or result."}
];

const stage = document.getElementById("stage");
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
S.forEach(s=>{
  const d=el("div","slide");
  if(s.eyebrow)d.appendChild(el("div","eyebrow",s.eyebrow));
  if(s.part)d.appendChild(el("div","part",s.part));
  if(s.t==="title"){d.appendChild(el("h1",null,s.h1));d.appendChild(el("div","hair"));if(s.sub)d.appendChild(el("div","sub",s.sub));if(s.brand)d.appendChild(el("div","brandline",s.brand));}
  else if(s.t==="pillar"){d.appendChild(el("div","pillarnum",s.n));d.appendChild(el("h2",null,s.h2));if(s.body)d.appendChild(el("p","body",s.body));}
  else if(s.t==="reframe"){d.appendChild(el("div","big",s.big));if(s.sub)d.appendChild(el("div","sub",s.sub));}
  else if(s.t==="beforeafter"){d.appendChild(el("h2",null,s.h2));const two=el("div","two");s.cols.forEach(c=>{const col=el("div","col");col.appendChild(el("h3",null,c.h));const ul=el("ul");c.lines.forEach(x=>ul.appendChild(el("li",null,x)));col.appendChild(ul);two.appendChild(col);});d.appendChild(two);}
  else if(s.t==="why"){d.appendChild(el("h2",null,s.h2));if(s.sub)d.appendChild(el("div","sub",s.sub));const row=el("div","statrow");s.stats.forEach(st=>{const c=el("div");c.appendChild(el("div","stat",st.n));c.appendChild(el("div","sub",st.l));row.appendChild(c);});d.appendChild(row);}
  else if(s.t==="cta"){d.appendChild(el("h2",null,s.h2));if(s.sub)d.appendChild(el("div","sub",s.sub));d.appendChild(el("div","ctabtn",s.cta));if(s.disclaimer)d.appendChild(el("div","disclaimer",s.disclaimer));}
  else {if(s.h2)d.appendChild(el("h2",null,s.h2));if(s.sub)d.appendChild(el("div","sub",s.sub));if(s.body)d.appendChild(el("p","body",s.body));if(s.items){const ul=el("ul");s.items.forEach(x=>ul.appendChild(el("li",null,x)));d.appendChild(ul);}}
  stage.appendChild(d);
});
</script>
</body>
</html>
