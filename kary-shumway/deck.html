<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Numbers a Profitable Brewery Runs On: Your CFO Dashboard in 60 Minutes · Kary Shumway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0b2e4a; --panel:#07223a; --rule:#22587f;
    --ink:#f4efe4; --accent:#f77002; --accent2:#e0a13a; --dim:#7f9bb4; --grey:#c4d3e0;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Oswald',Impact,sans-serif;font-weight:600;color:var(--ink);line-height:1.08;letter-spacing:.005em;text-transform:uppercase}
  .t-title h1{font-size:4.3vw;max-width:94%}
  .t-normal h1{font-size:3.05vw;max-width:90%;text-transform:none}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.32vw;color:var(--grey);margin-top:2.6vh;max-width:78%;line-height:1.64;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.42vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.52;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.2vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:92%}
  .t-section .rule{width:14vw;height:3px;background:var(--accent2);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.2vw;max-width:86%;font-style:normal;color:var(--ink);text-transform:none}
  .t-dark h1 .amber{color:var(--accent2)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:84%;color:var(--ink);text-transform:none}
  .t-cta .kicker{color:var(--accent2)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.08vw;font-weight:600;font-family:'Oswald',sans-serif;letter-spacing:.04em;text-transform:uppercase}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Open Sans',sans-serif;font-size:.82vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.16vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .gauge{position:absolute;pointer-events:none}
  .title-gauge{right:6.5%;bottom:9%;width:15vw;opacity:.95}
  .corner-gauge{right:6.8%;bottom:8%;width:6vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600;font-family:'Oswald',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Oswald',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Open Sans',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Craft Brewery Financial Training</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- fine-line barrel-gauge motif: one clean data mark (a filling barrel), never clip-art beer mugs -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gauge" viewBox="0 0 120 200">
  <g fill="none" stroke="#f77002" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 34 C30 24 90 24 90 34 L90 166 C90 176 30 176 30 166 Z"/>
    <ellipse cx="60" cy="34" rx="30" ry="9"/>
    <path d="M28 78 L92 78" opacity=".5"/>
    <path d="M28 122 L92 122" opacity=".5"/>
  </g>
  <path d="M30 122 C30 132 90 132 90 122 L90 166 C90 176 30 176 30 166 Z" fill="#e0a13a" opacity=".55" stroke="none"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Numbers a Profitable Brewery Runs On',sub:'A live masterclass for brewery owners on the three numbers a beer-industry CFO watches, and how to build the one-page dashboard that tells you if this month made money before your accountant does.',brand:true,arc:'title'},

 {t:'normal',k:'Who this is for',title:'You can brew world-class beer. The part that keeps you up at night is whether any of it is actually making money.',body:'You know your recipes cold. What you do not have is a clear read on your margin per barrel, where the cash actually goes, or whether the taproom is carrying the distribution or the other way around. The beer was never the problem. The numbers are a black box.'},
 {t:'dark',title:'Most breweries do not fail because the beer is bad. They fail because they run out of <span class="amber">cash</span> while the P&L still looks fine.'},

 {t:'section',idx:'Part One',title:'Why Good Beer Still Runs Out Of Money'},
 {t:'normal',k:'The black box',title:'You find out how the month went weeks after it is over, from a tax-style report you did not build.',body:'By the time the year-end statements land, the decisions that made or lost the money are long gone. Running a brewery on last year’s tax return is like tasting the batch after it is already kegged. The owners who get ahead are the ones watching a live number every week, not a report every spring.'},
 {t:'normal',k:'The per-barrel blind spot',title:'Total revenue tells you almost nothing. Profit per barrel tells you everything.',body:'Two breweries can pour the same volume and one is thriving while the other is drowning, because the money is made or lost inside each barrel: the gross margin and the EBITDA that barrel throws off after the true cost of making and selling it. If you do not know that number, you are guessing on every pricing, packaging, and channel decision.'},
 {t:'dark',title:'Revenue is vanity. <span class="amber">Margin per barrel</span> and the cash it produces are the whole game.'},

 {t:'section',idx:'Part Two',title:'The Dashboard A Brewery CFO Actually Watches'},
 {t:'normal',k:'One · The three numbers',title:'Revenue, gross margin, and EBITDA per barrel. Those three, watched weekly, run the business.',body:'The Brewery Key Metrics Dashboard puts the numbers a CFO lives by on one page: revenue, gross margin, and EBITDA per brewer barrel. Not forty metrics you will never look at, three you check every week, so you see a problem while you can still fix it instead of at tax time.'},
 {t:'normal',k:'Two · Follow the cash, not the profit',title:'Profit is an opinion. Cash is a fact, and it is what actually keeps the doors open.',body:'A growing brewery can be profitable on paper and still miss payroll, because tanks, cans, and inventory eat cash long before a sale pays it back. You learn the real drivers of brewery cash flow and run a rolling forecast, so you see the squeeze coming months out and manage it on purpose instead of by overdraft.'},
 {t:'normal',k:'Three · Know which channel pays',title:'Taproom or distribution: one of them is subsidizing the other, and most owners do not know which.',body:'A pint poured in your own taproom and a case sold to a distributor are not the same dollar. We put the real margin on each channel side by side, so you can see where the profit actually comes from and stop pouring effort into the volume that looks big and pays little.'},
 {t:'normal',k:'Four · Set the number, then manage to it',title:'A budget you built and a forecast you update turn hope into a plan you can steer.',body:'A simple annual budget from your own forecasts for volume, margin, and expenses, updated month by month. Now the dashboard is not just a scoreboard. It tells you whether you are ahead or behind the plan while there is still time to do something about it.'},
 {t:'dark',title:'One page, three numbers, updated every week. That is the difference between <span class="amber">running the brewery</span> and hoping it runs itself.'},

 {t:'section',idx:'Part Three',title:'From Guessing To Running The Numbers'},
 {t:'normal',k:'From black box to one page',title:'The shift is from waiting on a report you did not build to steering off a number you check every week.',body:'You are not becoming an accountant. You are getting the same one-page read a beer-industry CFO would keep on your business, in plain language, so every pricing, packaging, and channel call is made on a number instead of a hunch.'},
 {t:'normal',k:'Why Kary Shumway',title:'Twenty-plus years in beer finance as a CPA and a working brewery and beer-distributor CFO.',body:'Kary has been the CFO who built these dashboards and cash-flow forecasts for real breweries and distributors, teaches brewery finance for the Brewers Association, UVM, and the University of Richmond, and writes the weekly brewery-finance newsletter owners across the industry read. This is taught from the numbers he has actually run, which is why it is built around what a brewery owner really needs to see.'},

 {t:'section',idx:'Your Next Step',title:'Run Your Brewery On The Numbers'},
 {t:'normal',k:'Where the method lives',title:'The full system, from the dashboard to cash-flow forecasting to channel margin, is Craft Brewery Financial Training.',body:'It is the membership where the whole brewery team gets the on-demand courses, the financial models and templates, and the weekly newsletter and live trainings that turn these three numbers into a habit, so the dashboard is not a one-time exercise but the way you run the place from now on.'},
 {t:'cta',k:'Craft Brewery Financial Training',title:'Ready to know, every week, whether your brewery is actually making money?',chips:['Explore the membership','Get the weekly newsletter'],disc:'Educational content for brewery owners and operators. No income, profit, or business result is guaranteed. Results vary by brewery, market, and effort.'},
];

const deck=document.getElementById('deck');
function gaugeSvg(kind){return `<svg class="gauge ${kind==='title'?'title-gauge':'corner-gauge'}" viewBox="0 0 120 200"><use href="#gauge"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Craft Brewery <b>Financial Training</b> &middot; Kary Shumway</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=gaugeSvg('title');
  else if(s.t==='normal' && (i%3===0)) h+=gaugeSvg('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
