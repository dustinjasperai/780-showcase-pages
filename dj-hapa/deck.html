<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Bedroom to Booked — The DJ Coach Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a14;
  --panel:#15131f;
  --rule:#2a2740;
  --chalk:#f5f5fa;
  --dim:#9aa0b5;
  --accent:#00aabb;
  --gold:#ffca38;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--bg);color:var(--chalk);
  font-family:'Inter',system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
.slide{display:none;width:100%;max-width:1040px;animation:fade .4s ease}
.slide.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.kick{font-family:'Lato';font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--accent)}
h1{font-family:'Lato';font-weight:900;line-height:1.02;letter-spacing:-.01em;font-size:clamp(34px,6.4vw,72px);margin:.28em 0}
h2{font-family:'Lato';font-weight:900;line-height:1.05;font-size:clamp(28px,4.8vw,52px);margin:.1em 0 .4em}
p{font-size:clamp(16px,1.9vw,21px);line-height:1.5;color:var(--dim);max-width:46ch}
.lead{color:var(--chalk)}
.big{color:var(--chalk);font-size:clamp(20px,2.4vw,26px)}
.accent{color:var(--accent)}
.gold{color:var(--gold)}
.sub{margin-top:.2em}
ul{list-style:none;margin-top:1.1em}
li{position:relative;padding:.5em 0 .5em 1.5em;border-bottom:1px solid var(--rule);color:var(--chalk);font-size:clamp(16px,1.9vw,21px)}
li:before{content:"";position:absolute;left:0;top:1.05em;width:10px;height:10px;background:var(--accent);border-radius:2px}
li span{color:var(--dim)}
.ladder{display:grid;gap:12px;margin-top:1.1em}
.rung{display:flex;align-items:center;gap:16px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);padding:14px 18px;border-radius:10px}
.rung .n{font-family:'Lato';font-weight:900;color:var(--gold);font-size:26px;min-width:38px}
.rung b{font-family:'Lato';font-weight:700}
.rung em{color:var(--dim);font-style:normal;display:block;font-size:15px;margin-top:2px}
.eq{display:flex;align-items:flex-end;gap:7px;height:76px;margin-bottom:26px}
.eq i{width:14px;background:linear-gradient(var(--accent),var(--gold));border-radius:3px;display:block}
.two{display:grid;grid-template-columns:1fr 1fr;gap:34px;align-items:center}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px}
.quietnum{font-family:'Lato';font-weight:900;font-size:clamp(40px,7vw,78px);color:var(--accent);line-height:1}
.foot{position:fixed;left:7vw;bottom:3.4vh;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.count{position:fixed;right:7vw;bottom:3.4vh;font-size:12px;letter-spacing:.14em;color:var(--dim)}
.disc{font-size:13px;color:var(--dim);max-width:60ch;margin-top:1.4em;line-height:1.5}
.cta-btn{display:inline-block;margin-top:1.1em;background:var(--accent);color:#04121a;font-family:'Lato';font-weight:700;padding:14px 26px;border-radius:10px;text-decoration:none}
.nav{position:fixed;inset:0;display:flex;z-index:5}
.nav div{flex:1;cursor:pointer}
@media(max-width:760px){.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><div id="prev"></div><div id="next"></div></div>
<div class="foot">THE DJ COACH &middot; DJ HAPA</div>
<div class="count" id="count"></div>
<script>
const S=[
 {t:'title', kick:'A masterclass with DJ Hapa', h:'From Bedroom to Booked', p:'How to turn thousands of hours of practice into paid gigs people actually book you for.'},
 {t:'promise', h:'What you will leave with', p:'A clear picture of why skill alone does not get you booked, and the exact path that turns a hobby DJ into a working, paid one.'},
 {t:'forwho', kick:'Who this is for', h:'You can mix. You are just not getting the gigs.', p:'You have put in the hours in your room. Your transitions are clean. But the bookings are not coming, and you are not sure what is actually standing in the way.'},
 {t:'trap', kick:'The trap', h:'You think you need more gear or more tutorials', p:'So you buy another controller, watch another transition breakdown, and practice the same hour again. None of it moves you closer to a paid Saturday night.'},
 {t:'reframe', kick:'The reframe', h:'Nobody gets booked for knowing more transitions', p:'People book a DJ they trust to read a room and carry a night. That trust is a skill of its own, and almost no one teaches it.'},
 {t:'problem', kick:'Part one', h:'The real gap is not a skills gap. It is a booked gap.', p:'Skill gets you ready. Three other things get you booked, and they are the part the tutorials skip.'},
 {t:'three', h:'What actually stands between practice and paid', list:[['A set that reads a room','not a playlist you rehearsed'],['A brand people can find and trust','so a stranger can say yes'],['A way to turn one gig into the next','referrals, not luck']]},
 {t:'method', kick:'Part two', h:'The DJ Coach Method', p:'A staged climb, not a single course. Each level unlocks the next, and the whole ladder points at one outcome: getting booked.'},
 {t:'ladder', h:'Four levels. One booth.', rungs:[['1','Foundations','Beatmatching, BPM, music theory. The muscle memory everything sits on.'],['2','Mixing Essentials','EQ, filters, effects, creative transitions across genres.'],['3','Performance Ready','Set building, flow, and reading room energy in real time.'],['4','Pro Certification','Brand, portfolio, and the business of landing real gigs.']]},
 {t:'room', kick:'The pillar that gets you booked', h:'Reading the room', p:'A rehearsed set survives until the floor does something you did not plan. A booked DJ adapts in the moment, hears where the energy wants to go, and takes it there.'},
 {t:'roomhow', h:'How we train it', list:[['Energy mapping','reading a crowd in four-song arcs'],['Live hot-cue strategy','so you can turn on a dime'],['Flow planning','building a set that breathes, then breaking the plan on purpose']]},
 {t:'business', kick:'Part two continued', h:'The business of getting booked', p:'A great set in an empty calendar pays nothing. The Pro level builds the parts that make strangers hand you money.'},
 {t:'bizlist', h:'What that looks like', list:[['A brand and portfolio','a stranger can check in thirty seconds'],['Pricing and pitching','so you ask for the gig without flinching'],['A referral engine','every night sets up the next one']]},
 {t:'sound', kick:'The point of view', h:'FeelGoodSound', p:'Blending across genres to move a room, not to show off. Your taste becomes the reason people remember the night and book you for the next.'},
 {t:'looks', kick:'Part three', h:'What a month in this looks like', p:'Weekly live coaching, a path that always has a next step, honest feedback on your real sets, and a community of DJs climbing the same ladder.'},
 {t:'why', kick:'Why listen to me', h:'DJ Hapa', p:'Twenty plus years in the booth, from Michael Jackson to Marshmello, with clients from Microsoft and ESPN to The Grammys. More than 31,000 DJs coached toward real gigs.'},
 {t:'mindset', kick:'The shift', h:'Stop practicing to be ready. Start building to be booked.', p:'Readiness is infinite. Booked is a decision you make about how you spend the next ninety days.'},
 {t:'cta', kick:'Your next step', h:'Start where it starts', p:'Begin with the Free DJ Training to see the method in action. When you are ready to go all in, apply for the Pro DJ Certification and build the booked career alongside a coach.', cta:'Start your Free DJ Training', disc:'Educational content only. No specific booking, income, or career result is guaranteed. Results vary and depend on your own effort, practice, and market.'}
];
const stage=document.getElementById('stage');
const countEl=document.getElementById('count');
function eqbars(){let h='<div class="eq">';const hs=[30,54,22,70,44,62,34];for(const v of hs){h+='<i style="height:'+v+'px"></i>'}return h+'</div>'}
function render(s){
  let h='';
  if(['title','promise','forwho','trap','reframe','problem','method','room','business','sound','looks','why','mindset','cta'].includes(s.t)){h+=eqbars()}
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.h)h+='<h1>'+s.h+'</h1>';
  if(s.p)h+='<p class="lead sub big">'+s.p+'</p>';
  if(s.list){h+='<ul>';for(const it of s.list){h+='<li><b>'+it[0]+'</b> <span>'+it[1]+'</span></li>'}h+='</ul>'}
  if(s.rungs){h+='<div class="ladder">';for(const r of s.rungs){h+='<div class="rung"><div class="n">'+r[0]+'</div><div><b>'+r[1]+'</b><em>'+r[2]+'</em></div></div>'}h+='</div>'}
  if(s.cta)h+='<a class="cta-btn" href="https://thedjcoach.com">'+s.cta+'</a>';
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  return '<div class="slide on">'+h+'</div>';
}
let i=0;
function show(){stage.innerHTML=render(S[i]);countEl.textContent=(i+1)+' / '+S.length}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));show()}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
show();
</script>
</body>
</html>
