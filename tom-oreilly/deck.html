<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Modern SOX Leader — Internal Audit Collective</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link href="https://api.fontshare.com/v2/css?f[]=general-sans@500,600,700&f[]=gambetta@400,500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfcff;
    --panel:#e8eeff;
    --rule:#cdd8f5;
    --ink:#000b28;
    --muted:#4a5168;
    --accent:#064cff;
    --disp:"General Sans", system-ui, sans-serif;
    --serif:"Gambetta", Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--serif)}
  .deck{max-width:1040px;margin:0 auto}
  .slide{
    background:var(--bg);
    min-height:86vh;
    margin:26px auto;
    padding:72px 72px 60px;
    border:1px solid var(--rule);
    border-radius:4px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .kick{font-family:var(--disp);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--disp);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--disp);font-weight:600;font-size:40px;line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:23px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:30em}
  p.body{font-size:21px;line-height:1.55;margin-top:18px;max-width:32em}
  .accentbar{width:64px;height:5px;background:var(--accent);border-radius:3px;margin:0 0 30px}
  ul.points{list-style:none;margin-top:26px}
  ul.points li{font-size:21px;line-height:1.4;padding:18px 0 18px 34px;border-top:1px solid var(--rule);position:relative}
  ul.points li:before{content:"";position:absolute;left:0;top:26px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--rule);border:1px solid var(--rule);margin-top:30px}
  .grid .cell{background:var(--bg);padding:26px}
  .grid .cell h3{font-family:var(--disp);font-weight:600;font-size:19px;color:var(--accent)}
  .grid .cell p{font-size:17px;line-height:1.45;color:var(--muted);margin-top:10px}
  .big{font-family:var(--disp);font-weight:700;font-size:46px;line-height:1.12;letter-spacing:-.01em;max-width:20em}
  .big .hl{color:var(--accent)}
  .stat{font-family:var(--disp);font-weight:700;font-size:92px;color:var(--accent);line-height:1}
  .num{font-family:var(--disp);font-weight:600;font-size:15px;color:var(--muted);position:absolute;top:30px;right:40px;letter-spacing:.1em}
  .cta-note{font-size:15px;line-height:1.5;color:var(--muted);margin-top:40px;max-width:40em;border-top:1px solid var(--rule);padding-top:20px}
  .btn{display:inline-block;font-family:var(--disp);font-weight:600;font-size:19px;color:#fff;background:var(--accent);padding:16px 34px;border-radius:4px;margin-top:30px}
  .present{font-family:var(--disp);font-size:15px;color:var(--muted);letter-spacing:.08em;margin-top:40px}
  @media(max-width:720px){.slide{padding:40px 28px}h1{font-size:38px}h2{font-size:30px}.big{font-size:32px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'kicker',kick:'The promise',h:'In one hour, a plan to shrink your SOX program and grow your influence.',lead:'Not more testing. A different operating model for the same controls, drawn from what the strongest SOX teams actually do.'},
  {t:'kicker',kick:'Who this is for',h:'You lead SOX or internal audit, and you are tired of being treated as the police.',lead:'If you run controls for a public company, or you are the one person who truly understands the SOX program, this hour is for you.'},
  {t:'kicker',kick:'The trap',h:'The business sees audit as a tax, not a teammate.',lead:'You chase evidence. You get looped in last. Control owners nod, then do the minimum. The program grows every year, and the respect does not.'},
  {t:'reframe',big:'The problem was never your testing. It is that <span class="hl">SOX is run as a checklist, when it should be run as leverage.</span>'},
  {t:'kicker',kick:'Part One. The core problem',h:'A compliance-first SOX program quietly works against you.',points:['The control count only ever goes up, so cost goes up with it.','Control owners treat requests as busywork, so quality drops.','You are measured on "no findings," so you never get credit for insight.']},
  {t:'reframe',big:'Every key control you cannot defend from a risk is <span class="hl">cost you are volunteering to carry forever.</span>'},
  {t:'stat',stat:'750+',sub:'SOX and internal audit teams I worked with before building this. The best ones had the fewest key controls and the most influence. That is not a coincidence.'},
  {t:'kicker',kick:'Part Two. The method',h:'Operate in the gray: provide assurance and collaborate at the same time.',lead:'Four moves turn a compliance function into a value-add the business asks for. This is the spine of the SOX Accelerator.'},
  {t:'grid',kick:'The four moves',cells:[
    {h:'1. Top-down, risk-first',p:'Start from the risks that can actually misstate the financials, and rationalize the controls down to the ones that matter. Fewer, stronger key controls.'},
    {h:'2. Govern the information',p:'Standardize how Information Used in Controls is identified and evidenced, so reports and reconciliations stop being the finding every year.'},
    {h:'3. Earn external-auditor reliance',p:'Run the program so your external auditors can lean on your work. Reliance is the lever that cuts total effort on both sides.'},
    {h:'4. Lead the stakeholders',p:'Bring control owners in as partners, not suspects. Executive presence and influence are skills, and they are teachable.'}
  ]},
  {t:'kicker',kick:'Move two, up close',h:'Information Used in Controls is where programs quietly bleed.',points:['Name every report, query and spreadsheet a control depends on.','Prove its completeness and accuracy once, in a standard way.','Stop re-litigating the same IUC question in every cycle and every audit.']},
  {t:'kicker',kick:'Move three, up close',h:'Reliance is a relationship you design, not a favor you request.',points:['Give external auditors clean, repeatable evidence they can trust.','Agree scope and timing early, so nothing is a surprise in Q4.','Every hour of reliance you earn is an hour your team does not repeat.']},
  {t:'kicker',kick:'Where automation belongs',h:'Put technology on the evidence, not on the judgment.',points:['Automate the pulling, matching and tracking of evidence.','Use analytics and GenAI to surface the exceptions worth a human look.','Keep the risk decisions, the scoping and the relationships human. That is the job.']},
  {t:'reframe',big:'When you rationalize the controls and govern the information, <span class="hl">the program gets smaller and your influence gets larger.</span>'},
  {t:'kicker',kick:'Part Three. The payoff',h:'The modern SOX leader has a seat at the table.',points:['Scoping is a risk conversation the business respects, not a form.','Findings drop because owners understand why the control exists.','You are the one explaining controls to the audit committee, by name.']},
  {t:'grid',kick:'Before and after',cells:[
    {h:'Compliance-first',p:'More controls each year. Evidence chased at the deadline. Audit arrives last and leaves blamed. Growth means more headcount doing the same work.'},
    {h:'Value-add',p:'Fewer, defensible key controls. Evidence governed once. Audit shapes the risk conversation. Growth means more influence, not more hours.'}
  ]},
  {t:'kicker',kick:'Why me',h:'I have seen the pattern from the inside and across the field.',lead:'I was one of the first employees at AuditBoard and worked alongside 750+ SOX and internal audit teams. The Internal Audit Collective is where I teach what the strongest ones do, to 23,000+ readers and a live community of practitioners.'},
  {t:'cta',disclaimer:'Educational content only. No specific result is guaranteed. Results vary with your program, your company and your effort, and nothing here is a promise of any outcome, certification or career advancement.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide';
  const n = `<span class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span>`;
  if(s.t==='title'){
    el.innerHTML = n+`<div class="kick">A live masterclass with Tom O'Reilly</div>
      <h1>The Modern SOX Leader</h1>
      <p class="lead">How to run SOX as a value-add the business wants, not a policing function it tolerates.</p>
      <div class="present">Internal Audit Collective</div>`;
  } else if(s.t==='kicker'){
    let pts = s.points ? `<ul class="points">${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>` : '';
    let lead = s.lead ? `<p class="lead">${s.lead}</p>` : '';
    el.innerHTML = n+`<div class="kick">${s.kick}</div><div class="accentbar"></div><h2>${s.h}</h2>${lead}${pts}`;
  } else if(s.t==='reframe'){
    el.innerHTML = n+`<div class="accentbar"></div><div class="big">${s.big}</div>`;
  } else if(s.t==='stat'){
    el.innerHTML = n+`<div class="stat">${s.stat}</div><p class="body">${s.sub}</p>`;
  } else if(s.t==='grid'){
    el.innerHTML = n+`<div class="kick">${s.kick}</div><div class="accentbar"></div>
      <div class="grid">${s.cells.map(c=>`<div class="cell"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')}</div>`;
  } else if(s.t==='cta'){
    el.innerHTML = n+`<div class="kick">Your next step</div><div class="accentbar"></div>
      <h2>Join the next SOX Accelerator cohort.</h2>
      <p class="lead">Sixteen weeks, live, with a room of SOX leaders working the same problems. We build the modern program together, from control rationalization to leading the audit committee.</p>
      <a class="btn" href="https://www.internalauditcollective.com/courses/the-sox-accelerator">See the SOX Accelerator</a>
      <p class="cta-note">${s.disclaimer}</p>`;
  }
  deck.appendChild(el);
});
document.addEventListener('keydown',e=>{
  const slides=[...document.querySelectorAll('.slide')];
  const top=window.scrollY;
  let idx=slides.findIndex(s=>s.offsetTop>top+10);
  if(e.key==='ArrowDown'||e.key==='ArrowRight'){if(idx<0)idx=slides.length-1;slides[Math.min(idx,slides.length-1)].scrollIntoView({behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='ArrowLeft'){let p=slides.filter(s=>s.offsetTop<top-10).pop();if(p)p.scrollIntoView({behavior:'smooth'});}
});
</script>
</body>
</html>
