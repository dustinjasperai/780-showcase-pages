<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Chaos Tax · A Masterclass for Camp Directors · Travis Allison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f8fafc; --panel:#eef1f6; --rule:#dde3ec;
    --acc:#f8445c; --idx:#c9384e; --ink:#1d283a; --grey:#44506a; --dim:#8893a8;
  }
  html,body{height:100%}
  body{background:#e6eaf1;font-family:'Raleway',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#d5dbe6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.012em}
  .t-title h1{font-size:4.7vw;max-width:92%;font-weight:700}
  .t-normal h1{font-size:3.35vw;max-width:85%}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:75%;line-height:1.55;font-weight:400}
  .sub{font-family:'Raleway',sans-serif;font-size:1.78vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Space Grotesk',sans-serif;font-size:1.35vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:5vw;max-width:90%;font-weight:700}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#22304a 0%,#141d2c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.75vw;max-width:88%;color:#f4f7fb;font-weight:500}
  .t-dark .kicker{color:#ff9aa8}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#22304a 0%,#141d2c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:84%;color:#f6f8fc;font-weight:600}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid rgba(248,68,92,.55);color:#ffd7dd;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:500;background:rgba(248,68,92,.08)}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Raleway',sans-serif;font-size:.9vw;color:#b7c0d2;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mod{position:absolute;pointer-events:none}
  .title-mod{right:7%;bottom:8%;width:19vw;opacity:.9}
  .corner-mod{right:6%;bottom:7.5%;width:7vw;opacity:.5}
  .brandline{font-family:'Space Grotesk',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.01em}
  .brandline b{color:var(--acc);font-weight:600}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Space Grotesk',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Raleway',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(29,40,58,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Raleway',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div><div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 01</div>
<div class="brand-foot">Go Camp Pro</div>
<div class="hint" id="hint">Use arrow keys to move through</div>

<svg width="0" height="0" style="position:absolute">
  <symbol id="modules" viewBox="0 0 120 80">
    <rect x="2" y="2" width="34" height="34" rx="6" fill="none" stroke="#f8445c" stroke-width="2"/>
    <rect x="43" y="2" width="34" height="34" rx="6" fill="#f8445c" opacity="0.9"/>
    <rect x="84" y="2" width="34" height="34" rx="6" fill="none" stroke="#f8445c" stroke-width="2"/>
    <rect x="2" y="44" width="34" height="34" rx="6" fill="#f8445c" opacity="0.35"/>
    <rect x="43" y="44" width="34" height="34" rx="6" fill="none" stroke="#f8445c" stroke-width="2"/>
    <rect x="84" y="44" width="34" height="34" rx="6" fill="none" stroke="#f8445c" stroke-width="2"/>
  </symbol>
</svg>

<script>
const S = [
 {t:'title',title:'The Chaos Tax',sub:'Why your best season still runs on you, and the operating system that takes it back. A live masterclass for camp directors.',brand:true,mod:'title'},
 {t:'normal',k:'Who this is for',title:'Families love your camp, and it still runs straight through you.',body:'Registrations, staff questions, the parent emails, the one form that never got sent. You are good at this work. And every season a little more of it lands on your desk, because the camp remembers what you remember and not much else.'},
 {t:'dark',k:'The real question',title:'What if the late nights were never a discipline problem? They are a design problem.'},

 {t:'section',idx:'Part One',title:'The Chaos Tax'},
 {t:'normal',k:'The hidden bill',title:'Every gap in the system gets paid for in your hours.',body:'A repeated email. An unclear staff role. A missed registration form. None of it lands on a budget line, so it feels free. It is not. You pay it all season, in evenings, in stress, and in the hundred small answers only you can give.'},
 {t:'normal',k:'Why working harder fails',title:'You cannot out-work a camp that only exists in your head.',body:'Hiring good people does not fix it when the process lives in your memory. The whole operation still stops at your desk. That is not a sign you are bad at leading. It is a sign the operating system was never actually built.'},
 {t:'dark',k:'The reframe',title:'A great leader who is drowning is rarely a people problem. It is a design problem, and design problems have design solutions.'},

 {t:'section',idx:'Part Two',title:'The Resilience Blueprint'},
 {t:'normal',k:'The principle',title:'Build the camp for the worst shift, not the perfect one.',body:'Firefighters do not write procedures for ideal conditions. They build for a tired crew, under pressure, at the worst possible moment. A camp that only works when everything goes right is not resilient. We design for the hard day, so the good ones feel easy.'},
 {t:'normal',k:'Area one',title:'Leadership clarity.',body:'The decisions only you can make get named, written down, and shared, so your team stops waiting on you for answers they are ready to own.'},
 {t:'normal',k:'Area two',title:'Staff learning and growth.',body:'Training that turns a returning counselor into a leader, so capability compounds each summer instead of resetting every June.'},
 {t:'normal',k:'Area three',title:'Parent and donor communication.',body:'The messages that used to eat your evenings become a system: clear, warm, on time, and no longer written from scratch by you at 11pm.'},
 {t:'normal',k:'Area four',title:'Family belonging.',body:'The felt experience that brings a camper back and makes a parent tell a friend, designed on purpose instead of left to a good week and a lucky mood.'},
 {t:'normal',k:'Area five',title:'Protecting the director’s time.',body:'This is the whole point. When the first four areas run on systems, the hours come back to you, and the camp keeps running on the night you finally step away from it.'},
 {t:'dark',k:'What resilience means',title:'Resilience is not doing more. It is a camp that no longer needs you in the room to hold it together.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The season this builds',title:'The camp runs, and you get to lead it again.',body:'Staff own their roles. Parents get answers without your inbox. Registration season stops being a personal emergency. You move from firefighting the day to actually leading the place you built, with room to think a season ahead.'},
 {t:'dark',k:'The goal',title:'The goal was never a busier director. It was a camp that holds without you holding all of it.'},
 {t:'normal',k:'Why Travis Allison',title:'Thirty years in camp, and a firefighter’s bias for what holds under pressure.',body:'Travis Allison has spent thirty years as a camp director, consultant, and speaker, hosts the camp world’s largest podcast network, and built the community that held the sector together in 2020. He is a camp person first, and he builds systems designed to hold on the hard days, not only the easy ones.'},

 {t:'section',idx:'Your Next Step',title:'Start With Clarity'},
 {t:'normal',k:'The Clarity Sprint',title:'One session. Your biggest problem. A clear path forward.',body:'When you are ready to move, the Clarity Sprint is a focused 90-minute working session: bring the thing costing you the most right now and leave with a plan. It is the front door to the Resilience Blueprint, the multi-season build that installs the whole operating system.'},
 {t:'cta',title:'Ready to stop being the system your camp runs on?',chips:['Book a Clarity Sprint','Explore the Resilience Blueprint'],disc:'Educational content for camp directors and owners. No specific outcome, revenue, or enrollment result is guaranteed. Results vary by camp, team, and circumstances.'},
];

const deck=document.getElementById('deck');
function mod(kind){return `<svg class="mod ${kind==='title'?'title-mod':'corner-mod'}" viewBox="0 0 120 80"><use href="#modules"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Go Camp <b>Pro</b> · Travis Allison</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mod==='title') h+=mod('title');
  else if(s.t==='title') h+=mod('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
