<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Cleaning Business That Runs Without You · Misael Avalos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#070d18; --panel:#20293c; --rule:#2c3648;
    --acc:#ff6933; --ink:#f9fafb; --body:#c3cad6; --dim:#7f8794; --cream:#f9fafb;
  }
  html,body{height:100%}
  body{background:#04070f;font-family:'DM Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#04070f}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'DM Sans',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.012em}
  .t-title h1{font-size:5.0vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:78%;line-height:1.62;font-weight:400}
  .sub{font-family:'DM Sans',sans-serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'DM Sans',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%;font-weight:700}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#152238 0%,#05080f 62%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#20293c 0%,#05080f 62%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream);font-weight:700}
  .t-cta .body{color:#cfd6e2;font-size:1.42vw;margin-top:3vh;max-width:74%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .rug-motif{position:absolute;pointer-events:none}
  .title-rug{right:7.0%;bottom:8%;width:17vw;opacity:.9}
  .corner-rug{right:6.2%;bottom:7.2%;width:8.5vw;opacity:.5}
  .brandline{font-family:'DM Sans',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Misael Avalos</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- rug/carpet-tile motif: a woven border corner with fringe ticks, drawn in the brand orange -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rug" viewBox="0 0 120 120">
  <g fill="none" stroke="#ff6933" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
    <rect x="14" y="14" width="80" height="80" rx="2" opacity="0.9"/>
    <rect x="26" y="26" width="56" height="56" rx="1.5" opacity="0.55"/>
    <rect x="40" y="40" width="28" height="28" rx="1" opacity="0.4"/>
    <path d="M14 14 L26 26 M94 14 L82 26 M14 94 L26 82 M94 94 L82 82" opacity="0.5"/>
    <path d="M14 6 V12 M30 6 V12 M46 6 V12 M62 6 V12 M78 6 V12 M94 6 V12" opacity="0.45"/>
    <path d="M14 108 V114 M30 108 V114 M46 108 V114 M62 108 V114 M78 108 V114 M94 108 V114" opacity="0.45"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Cleaning Business That Runs Without You',sub:'How to scale past the ceiling, build a team and systems that hold, and get your nights and weekends back, without burning out.',brand:true,bp:'title'},
 {t:'normal',k:'Who this is for',title:'The trucks are booked and the phone keeps ringing. It all still runs through you.',body:'You run a real cleaning company. The work is good, the reviews are strong, the schedule is full. But you still quote the jobs, handle the fires, and make the final call on everything. Take a week off and you already know what you would come back to.'},
 {t:'dark',title:'A booked calendar and a business that can run without you are not the same thing.'},

 {t:'section',idx:'Part One',title:'Why a Busy Owner Owns a Job, Not a Business'},
 {t:'normal',k:'The owner-dependence trap',title:'If the company cannot run a week without you, you own the hardest job in it.',body:'Most owners scale by doing more themselves, so growth just buys a heavier version of the same 70-hour week. The revenue looks like a business, but every schedule, every complaint and every decision lives in one head. That is a job with a crew attached, not a company that stands on its own.'},
 {t:'normal',k:'What it actually costs',title:'The ceiling is not your market. It is the number of hours you can personally cover.',body:'When you are the estimator, the dispatcher, the trainer and the closer, the business can only grow to the edge of your calendar. Add more work and something breaks, usually your evenings and your patience. The burnout is not a character flaw. It is the predictable result of a company built to depend on one person.'},
 {t:'dark',title:'You did not start this to buy yourself the one job you are never allowed to leave.'},

 {t:'section',idx:'Part Two',title:'Clarify, Build, Scale'},
 {t:'normal',k:'Step one, clarify',title:'Before you add anything, get honest about where the business actually stands.',body:'Clarify is the assessment. We find the real bottlenecks, the numbers you have been avoiding, and the version of the business you actually want to own. You cannot fix a ceiling you cannot see, and most owners are guessing at theirs. This is where the guessing stops and the plan starts.'},
 {t:'normal',k:'Step two, build',title:'Install the systems and the team so the work stops depending on you.',body:'Build is where the company gets its own backbone. Documented process, so the job is done right whether or not you are there. Real hiring and training, so you have people who make the day-to-day calls. Numbers you can see, so you price and decide on facts instead of the bank balance. This is the work that scales without adding stress or chaos.'},
 {t:'normal',k:'Step three, scale',title:'Optimize the operation and lead the team, instead of running every route yourself.',body:'Scale is what becomes possible once the systems hold. You optimize the operation, build out leadership, and grow on purpose rather than by luck. The four things we hold every engagement to: results you can measure, systems that carry the load, accountability to what you said you would do, and a business built around your life, not on top of it.'},
 {t:'dark',title:'Systems are not paperwork. They are the difference between a busy owner and a free one.'},

 {t:'section',idx:'Part Three',title:'What Changes When the Business Can Stand on Its Own'},
 {t:'normal',k:'The company this builds',title:'A cleaning business that grows on purpose and gives you your life back.',body:'When the systems and the team hold, a slow week stops being a crisis and a week away stops being a gamble. Growth becomes a decision you make on the numbers, not a thing that costs you another weekend. You still own the company. You just stop being the only reason it works.'},
 {t:'dark',title:'The goal was never more jobs. It was a business that runs without burning you out.'},
 {t:'normal',k:'Why Misael',title:'A cleaner who worked 70-hour weeks, then built the business that finally ran without him.',body:'Misael Avalos started as the one doing the work, showing up at every job and handling every detail. He learned to work on the business instead of just in it, built the systems and the team, and grew a multi-six-figure cleaning company that no longer needed him on every route. Now he coaches cleaning and service owners through the same shift, from operator to owner.'},

 {t:'section',idx:'Your Next Step',title:'See Where Your Business Actually Stands'},
 {t:'normal',k:'Keep going with the coaching',title:'A strategy call maps your real bottleneck and the first system to build.',body:'The strategy call is a straight look at how your business runs today, where you want it to go, and the first move that gets you there. No obligation. You leave knowing where your ceiling actually is and what to fix first, whether or not we work together after that.'},
 {t:'cta',title:'Ready to build a business that runs without you?',body:'Book a strategy call with Misael, and join the Skool community of cleaning owners doing the same work.',chips:['Book your strategy call','Join the Skool community'],disc:'Educational content for cleaning and service business owners. No income or business result is guaranteed. Results vary by company, market and how the work is applied.'},
];

const deck=document.getElementById('deck');
function bp(kind){return `<svg class="rug-motif ${kind==='title'?'title-rug':'corner-rug'}"><use href="#rug"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Misael <b>Avalos</b> · Coaching for cleaning business owners</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.bp) h+=bp(s.bp);
  else if(s.t==='title') h+=bp('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
