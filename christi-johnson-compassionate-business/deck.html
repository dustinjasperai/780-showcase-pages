<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Dream Biz Masterclass · Christi Johnson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fff6ea;          /* her dominant brand cream */
    --panel:#f3e6cf;       /* warm card, derived tint of the cream ground */
    --ink:#3a2c7e;         /* her H1 deep violet */
    --ink-soft:#5a4e93;
    --ink-mute:#9186bd;
    --accent:#faa633;      /* her marigold */
    --rule:#e4d6bd;
    --cream-line:#fffaf1;
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{background:#e9dcc4;font-family:'Montserrat',system-ui,sans-serif;color:var(--ink)}
  .deck{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:22px;padding:72px 76px;margin:22px 0;min-height:560px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 18px 44px rgba(58,44,126,.08);
  }
  .kicker{font-family:'Montserrat';font-size:12px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:'Bricolage Grotesque','Montserrat',sans-serif;font-weight:700;
    line-height:1.08;letter-spacing:-.02em;color:var(--ink);font-size:44px}
  .sub{font-family:'Montserrat';font-size:22px;font-weight:500;color:var(--ink-soft);
    margin-top:22px;line-height:1.4;max-width:24ch}
  .body{font-family:'Montserrat';font-size:19px;line-height:1.6;color:var(--ink-soft);
    margin-top:22px;max-width:60ch}
  /* highlighter motif under key titles */
  .mark{position:relative;display:inline;background:linear-gradient(180deg,transparent 62%,rgba(250,166,51,.42) 62%)}
  /* title slide */
  .t-title{background:var(--ink);border-color:var(--ink)}
  .t-title h1{color:var(--cream-line);font-size:62px;font-weight:800;max-width:18ch}
  .t-title .sub{color:#d9cff2;font-size:23px;max-width:32ch}
  .t-title .kicker{color:var(--accent)}
  .brandline{position:absolute;left:76px;bottom:56px;font-family:'Montserrat';font-size:15px;
    font-weight:500;color:#cbbff0;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .dot{position:absolute;right:64px;top:64px;width:66px;height:66px;border-radius:50%;
    background:var(--accent)}
  /* section dividers */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Bricolage Grotesque';font-size:19px;font-weight:700;
    letter-spacing:.03em;color:var(--accent);text-transform:uppercase;margin-bottom:18px}
  .t-section h1{font-size:54px;max-width:16ch}
  .t-section .rule{width:88px;height:6px;border-radius:4px;background:var(--accent);margin-top:28px}
  /* punch slides */
  .t-dark{background:var(--ink)}
  .t-dark h1{color:var(--cream-line);font-size:46px;max-width:22ch;font-weight:700}
  .t-dark .accent-word{color:var(--accent)}
  /* pillar cards row */
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
  .pcard{background:var(--cream-line);border:1px solid var(--rule);border-radius:16px;padding:26px 24px}
  .pcard .n{font-family:'Bricolage Grotesque';font-size:15px;font-weight:800;color:var(--accent);margin-bottom:10px}
  .pcard h3{font-family:'Bricolage Grotesque';font-size:22px;font-weight:700;color:var(--ink);margin-bottom:10px;line-height:1.15}
  .pcard p{font-family:'Montserrat';font-size:15px;line-height:1.5;color:var(--ink-soft)}
  /* cta */
  .t-cta{background:var(--ink)}
  .t-cta h1{color:var(--cream-line);font-size:46px;max-width:20ch}
  .chips{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
  .chip{font-family:'Montserrat';font-size:16px;font-weight:600;background:var(--accent);
    color:#3a2c7e;padding:14px 22px;border-radius:999px}
  .disc{font-family:'Montserrat';font-size:12.5px;line-height:1.5;color:#b6a9e0;
    margin-top:40px;max-width:70ch}
  .nav{position:fixed;right:20px;bottom:18px;font-family:'Montserrat';font-size:12px;
    color:var(--ink-soft);background:var(--bg);border:1px solid var(--rule);
    border-radius:999px;padding:7px 14px}
  @media(max-width:760px){
    .slide{padding:44px 30px;min-height:460px;border-radius:16px}
    h1{font-size:32px}.t-title h1{font-size:40px}.t-section h1,.t-dark h1,.t-cta h1{font-size:32px}
    .sub{font-size:18px}.body{font-size:16px}.pillars{grid-template-columns:1fr;gap:14px}
    .brandline{left:30px;bottom:28px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass',title:'The Dream Biz Masterclass',
  sub:'Business strategy through creative play, for the creatively weird business owner.',brand:true},

 {t:'normal',k:'Who this is for',title:'You built something real. It just stopped feeling like you.',
  body:"You are a creative or neurodivergent business owner. You can make the thing, serve the client, and light people up. But the growth advice you keep getting was built for somebody else's brain, and following it has started to cost you the joy you started for."},

 {t:'dark',title:"You don't need more discipline. You need a business that fits how your brain actually works.",accent:'brain'},

 {t:'section',idx:'Part One',title:'Why the hustle playbook keeps failing you'},
 {t:'normal',k:'The trap',title:'Generic advice, borrowed brain.',
  body:'Do more, wake up earlier, add another funnel, grind through the boring parts. It is advice written for a brain that runs on routine and willpower. When your brain runs on novelty, meaning, and play, that same advice reads as proof that something is wrong with you. Nothing is wrong with you.'},
 {t:'normal',k:'The real cost',title:'Burnout is not a character flaw. It is a design flaw.',
  body:'When the business is built against how you actually work, every month asks you to override yourself a little more. That is not sustainable, and it is not a willpower problem. It is a sign the business was designed for the wrong owner: a version of you that does not exist.'},
 {t:'dark',title:'A business you have to fight yourself to run is a business you will eventually quit.'},

 {t:'section',idx:'Part Two',title:'The Dream Biz method'},
 {t:'normal',k:'The shift',title:'Strategy you can actually stay in.',
  body:'The Dream Biz method runs real strategy, your offers, your marketing, your systems, through creative play instead of grind. Three parts make it work, and each one is built to keep you in the business for the long run.'},
 {t:'pillars',k:'The three parts',title:'Play, Joy, and Slow Abundance.',
  cards:[
   {n:'01',h:'Creative Play',p:'You unlock strategy the way you unlock ideas: through prompts, play, and permission, not a blank spreadsheet you dread. The plan comes out of the part of you that already works.'},
   {n:'02',h:'The Joy Menu',p:'A simple, repeatable menu of what refills you, built once and returned to on purpose. It protects the fuel the whole business runs on, so joy is a system, not an accident.'},
   {n:'03',h:'Slow Abundance',p:'Growth at a kinder, sustainable pace. You choose the offers and the volume that fit your life first, so the business expands without asking you to disappear into it.'},
  ]},
 {t:'dark',title:'Play makes the plan. The Joy Menu protects the fuel. Slow Abundance sets the pace.'},

 {t:'section',idx:'Part Three',title:'The business, redrawn around you'},
 {t:'normal',k:'The week after',title:'Fewer moving parts, chosen on purpose.',
  body:'You stop running five half-built ideas at once. You keep the offers that fit, price them so they hold up, and let the rest go. The calendar has room in it again, and the room is the point, not a reward you earn later.'},
 {t:'normal',k:'Why me',title:'I have rebuilt a business around a real life more than once.',
  body:"I started selling handmade goods at eight, then ran photography, taught piano to a full studio, and coached. Christi Johnson Creative came out of my own burnout and the Joy Menu I built during it. In the Dream Biz Playground I coach creative and neurodivergent owners on this method. It is drawn from a business I actually run, not from theory."},
 {t:'dark',title:'The business of your dreams is not a fairytale. It is a design you have not been given permission to draw yet.'},

 {t:'section',idx:'Your next step',title:'Build your Dream Biz with me'},
 {t:'normal',k:'How I can help',title:'A room, a method, and a plan that fits you.',
  body:'The Dream Biz Playground is the group coaching home for this method: bi-weekly coaching, creative prompts, and doable strategy built for your brain. When you want focused one-to-one time, a VIP Day or an intensive maps the whole thing to your business in a single block.'},
 {t:'cta',title:'Ready to grow the business without losing yourself in it?',
  chips:['Join the Dream Biz Playground','Book a VIP Day'],
  disc:'Educational content for creative and neurodivergent business owners. No income, revenue, or business result is guaranteed. Results vary by owner, business, and season.'},
];

const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`;
  } else if(s.t==='pillars'){
    h+=`<h1>${s.title}</h1><div class="pillars">`;
    s.cards.forEach(c=>{h+=`<div class="pcard"><div class="n">${c.n}</div><h3>${c.h}</h3><p>${c.p}</p></div>`});
    h+=`</div>`;
  } else {
    let title=s.title;
    if(s.accent){title=title.replace(s.accent,`<span class="accent-word">${s.accent}</span>`);}
    h+=`<h1>${title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips){h+=`<div class="chips">`;s.chips.forEach(c=>h+=`<span class="chip">${c}</span>`);h+=`</div>`;}
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
    if(s.brand){h+=`<div class="dot"></div><div class="brandline">Dream <b>Biz</b> · Christi Johnson</div>`;}
  }
  d.innerHTML=h;
  deck.appendChild(d);
});
document.getElementById('nav').textContent=S.length+' slides · scroll';
</script>
</body>
</html>
