<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write Your Next Paper with AI Without Losing Your Voice - The Effortless Academic</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f1;        /* warm paper ground (brand #faf6f1) */
    --panel:#eef1ee;     /* sage-tinted panel (brand #c1d2ce family) */
    --ink:#1f2927;       /* deep forest near-black (brand, 44 uses) */
    --accent:#37675b;    /* signature deep teal-green (brand link, 38 uses) */
    --gold:#d9a554;      /* muted gold highlight (brand) */
    --muted:#5c6b64;     /* desaturated forest for secondary text */
    --rule:#d8d2c6;      /* hairline on paper */
    --serif:'Spectral',Georgia,serif;
    --sans:'Archivo',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--ink);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:8vh 9vw;background:var(--bg);
    background-image:radial-gradient(circle at 1px 1px, rgba(31,41,39,.05) 1px, transparent 0);
    background-size:26px 26px}
  .slide.on{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:clamp(11px,1.1vw,14px);color:var(--accent);margin-bottom:22px}
  .eyebrow .dot{color:var(--gold)}
  h1{font-family:var(--serif);font-weight:600;line-height:1.05;letter-spacing:-.01em;
    font-size:clamp(34px,6vw,76px);max-width:16ch}
  h2{font-family:var(--serif);font-weight:600;line-height:1.1;font-size:clamp(28px,4.4vw,54px);max-width:18ch}
  .lede{font-family:var(--serif);font-style:italic;color:var(--muted);
    font-size:clamp(18px,2.2vw,30px);line-height:1.35;max-width:24ch;margin-top:26px}
  .body{font-size:clamp(16px,1.5vw,22px);line-height:1.6;color:var(--ink);max-width:40ch;margin-top:24px}
  .body.wide{max-width:52ch}
  .sub{font-size:clamp(14px,1.3vw,18px);color:var(--muted);margin-top:18px;max-width:46ch;line-height:1.55}
  .big{font-family:var(--serif);font-weight:500;line-height:1.08;letter-spacing:-.01em;
    font-size:clamp(32px,5.4vw,68px);max-width:17ch}
  .big .hl{color:var(--accent)}
  .present{margin-top:46px;display:flex;align-items:baseline;gap:14px;flex-wrap:wrap}
  .present .nm{font-weight:700;font-size:clamp(15px,1.4vw,19px)}
  .present .br{color:var(--accent);font-weight:600;font-size:clamp(13px,1.2vw,16px)}
  .num{font-family:var(--serif);font-size:clamp(60px,12vw,150px);color:var(--panel);
    font-weight:600;line-height:.8;position:relative}
  .num span{position:relative;color:var(--accent);-webkit-text-stroke:0}
  ul.items{list-style:none;margin-top:30px;display:grid;gap:14px;max-width:40ch}
  ul.items li{font-size:clamp(16px,1.5vw,21px);line-height:1.4;padding-left:28px;position:relative}
  ul.items li::before{content:"";position:absolute;left:0;top:.62em;width:11px;height:2px;background:var(--gold)}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:40px;max-width:1000px}
  .step{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:26px 24px;
    box-shadow:0 1px 0 rgba(31,41,39,.03)}
  .step .k{font-family:var(--sans);font-weight:700;letter-spacing:.12em;text-transform:uppercase;
    font-size:12px;color:var(--accent)}
  .step .n{font-family:var(--serif);font-size:30px;font-weight:600;margin:8px 0 10px}
  .step p{font-size:15px;line-height:1.5;color:var(--muted)}
  .cards{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:40px;max-width:1000px}
  .wcard{background:#fff;border:1px solid var(--rule);border-left:4px solid var(--accent);
    border-radius:10px;padding:22px 20px}
  .wcard.topic{border-left-color:var(--gold)}
  .wcard.arg{border-left-color:var(--ink)}
  .wcard .lab{font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11px;color:var(--accent)}
  .wcard.topic .lab{color:var(--gold)}
  .wcard.arg .lab{color:var(--ink)}
  .wcard p{margin-top:12px;font-size:15px;line-height:1.5;color:var(--ink)}
  .flow{display:flex;align-items:center;gap:10px;margin-top:14px;color:var(--muted);
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600}
  .flow b{color:var(--accent)}
  .ba{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:38px;max-width:960px}
  .ba .col{background:#fff;border:1px solid var(--rule);border-radius:12px;padding:24px}
  .ba .col.after{border-color:var(--accent);box-shadow:0 2px 0 rgba(55,103,91,.12)}
  .ba .tag{font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:11px;color:var(--muted)}
  .ba .after .tag{color:var(--accent)}
  .ba p{margin-top:12px;font-size:15.5px;line-height:1.55;font-family:var(--serif)}
  .stats{display:flex;gap:46px;margin-top:38px;flex-wrap:wrap}
  .stat .v{font-family:var(--serif);font-weight:600;font-size:clamp(34px,4.6vw,56px);color:var(--accent)}
  .stat .l{font-size:14px;color:var(--muted);margin-top:4px;max-width:16ch}
  .ctabox{margin-top:36px;background:#fff;border:1px solid var(--rule);border-radius:14px;
    padding:30px 32px;max-width:640px}
  .ctabox .step-line{display:flex;gap:14px;align-items:flex-start;margin:12px 0;font-size:17px}
  .ctabox .step-line b{color:var(--accent);font-family:var(--serif)}
  .disc{margin-top:26px;font-size:12.5px;color:var(--muted);max-width:52ch;line-height:1.5}
  .brandline{position:absolute;left:9vw;bottom:5.2vh;font-family:var(--sans);font-weight:600;
    letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--accent)}
  .counter{position:absolute;right:9vw;bottom:5.2vh;font-size:12px;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .topbar{position:absolute;left:0;top:0;height:5px;background:var(--accent);transition:width .3s}
  .hint{position:absolute;right:9vw;top:5vh;font-size:11px;color:var(--muted);letter-spacing:.08em}
  @media(max-width:760px){.steps,.cards,.ba{grid-template-columns:1fr}.slide{padding:7vh 7vw}}
</style>
</head>
<body>
<div id="deck">
  <div class="topbar" id="bar"></div>
  <div class="hint">Use arrow keys</div>
</div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass', h:'Write Your Next Paper with AI Without Losing Your Voice',
   sub:'The method for drafting research with AI that keeps your thinking, your voice, and your integrity intact.',
   present:true},

  {t:'who', kicker:'Who this is for', h:'If a blank document still wins more often than you do',
   items:['PhD and master’s students facing a thesis or a first paper',
          'Researchers who want to draft faster without sounding generic',
          'Anyone who has tried AI, felt the prose go flat, and quietly closed the tab']},

  {t:'point', kicker:'The trap', h:'It was never the typing',
   body:'The hardest part of a paper is not the sentences. It is holding a hundred papers, your own notes, and a half-formed argument in your head at once. So you avoid the document, and the deadline does the writing for you.'},

  {t:'reframe', kicker:'An honest reframe',
   big:'AI did not make academic writing easier. For most people it made it easier to sound like <span class="hl">everyone else.</span>'},

  {t:'part', num:'1', h:'Why AI writing fails academics', sub:'Three failures that all come from the same mistake.'},

  {t:'point', kicker:'Failure one', h:'Your voice disappears',
   body:'Ask a model for a paragraph and it returns the average of the internet: fluent, confident, and nobody’s. Your supervisor and your reviewers know your voice. The averaged version is the one that gets sent back.'},

  {t:'point', kicker:'Failure two', h:'You stop understanding your own work',
   body:'When the machine writes the argument, you skip the thinking that writing is supposed to force. Hallucinated citations are only the visible damage. The quieter loss is that you no longer know your paper from the inside.'},

  {t:'point', kicker:'The principle', h:'Cognitive sovereignty',
   body:'You stay the thinker. AI stays the assistant. That is not a slogan, it is a boundary you set on purpose before you ever open a chat window. Every step that follows is built to protect it.'},

  {t:'point', kicker:'The shift', h:'Structure your information first, add AI second',
   body:'Most people reach for AI at the blank page, which is the worst possible moment. The leverage comes earlier: when what you have read is already organized, AI has something true to work from, and the draft stops being generic.'},

  {t:'part', num:'2', h:'The method', sub:'Context, then Guidance, then Control. In that order, every time.'},

  {t:'steps', kicker:'The writing method', h:'Context to Guidance to Control',
   steps:[{k:'Step one',n:'Context',p:'Give it the truth to work from: your notes, your PDFs, your outline. Not a blank prompt.'},
          {k:'Step two',n:'Guidance',p:'Direct the style and structure with specific prompts, so it writes like your field, not like a chatbot.'},
          {k:'Step three',n:'Control',p:'Iterate line by line. You accept, reject, and rewrite until every sentence is yours.'}]},

  {t:'point', kicker:'Step one, in practice', h:'Context comes from a system, not a search',
   body:'You cannot paste what you never kept. The reason AI drafts well for some researchers and badly for others is almost never the model. It is whether their reading is organized enough to hand over.'},

  {t:'cards', kicker:'The engine behind it', h:'The Research Wiki',
   sub:'Every paper you read, filed so a literature review and a first draft fall out of your own notes.',
   cards:[{c:'',lab:'Source',p:'What a paper actually said, in your words, captured once as you read it.'},
          {c:'topic',lab:'Topic',p:'Your synthesis across sources: where they agree, clash, and leave a gap.'},
          {c:'arg',lab:'Argument',p:'Your own claim, already supported, ready to become a paragraph.'}],
   flow:true},

  {t:'point', kicker:'Step two, in practice', h:'Guidance is where the voice is set',
   body:'A good prompt is not "write my introduction." It is a short brief: the journal, the move each paragraph should make, the tone of your discipline, the things you never say. You are directing, not delegating.'},

  {t:'point', kicker:'Step three, in practice', h:'Control is the whole point',
   body:'You read every line out loud against your own ear. Some you keep, most you reshape, a few you delete entirely. What survives is a draft in your voice that you could defend in a viva, because you wrote the thinking and used AI for the lifting.'},

  {t:'point', kicker:'A worked pass', h:'From notes to a first draft in an afternoon',
   body:'Pull the relevant sources and topics from the wiki. Hand them over as context. Guide the structure section by section. Then take control and revise. The blank page is gone by lunch, and what is left is edit-ready and yours.'},

  {t:'ba', kicker:'The revision playbook', h:'Same paragraph, before and after',
   before:'The present study investigates the relationship between the variables, which is important because many studies have looked at this area and found various results over time.',
   after:'We ask whether canopy density predicts beetle diversity, a link the field has assumed for a decade but, as far as we found, never tested directly.'},

  {t:'part', num:'3', h:'A draft that could survive a viva', sub:'When the method and the Research Wiki work together.'},

  {t:'point', kicker:'The outcome', h:'You write more, and it sounds more like you',
   body:'Not AI-generated papers. Your papers, drafted faster, grounded in reading you can actually find, in a voice a reviewer recognizes as yours. You finish sooner because the thinking is done before the draft, not during it.'},

  {t:'cred', kicker:'Why learn this from me', h:'I built this because I needed it',
   body:'I spent twelve years in industry, co-founded a company, then started a PhD at thirty-six with no idea how to manage a hundred papers. The system in this masterclass is the one I built to survive it.',
   stats:[{v:'4.5 yrs',l:'PhD in Ecology, start to finish'},{v:'4 papers',l:'published along the way'}]},

  {t:'who', kicker:'What you walk away with', h:'By the end of the session you will have',
   items:['A repeatable Context to Guidance to Control workflow for any paper',
          'The Source to Topic to Argument structure for your own Research Wiki',
          'A revision pass that sharpens AI drafts back into your voice',
          'A clear line between using AI and outsourcing your thinking']},

  {t:'cta', kicker:'Your next step', h:'Join Effortless Writing with AI',
   body:'Come to the live training, get the drafting frameworks and the revision playbook, and bring your own paper to work on inside the Effortless Academic community.',
   steps:[{b:'1',p:'Enroll in Effortless Writing with AI at effortlessacademic.com'},
          {b:'2',p:'Set up your Research Wiki with the course templates'},
          {b:'3',p:'Draft your next paper with the method, in your own voice'}],
   disc:'Educational content only. No specific grade, publication, or result is guaranteed. Results vary with your field, your effort, and your own work.'}
];

const deck=document.getElementById('deck');
const bar=document.getElementById('bar');
let i=0;

function esc(s){return s==null?'':s;}

function render(){
  document.querySelectorAll('.slide').forEach(e=>e.remove());
  const s=S[i];
  const el=document.createElement('section');
  el.className='slide on';
  let html='';
  const eyebrow=s.kicker?`<div class="eyebrow"><span class="dot">&#9679;</span> ${esc(s.kicker)}</div>`:'';
  if(s.t==='title'){
    html=eyebrow+`<h1>${esc(s.h)}</h1><div class="lede">${esc(s.sub)}</div>`+
      (s.present?`<div class="present"><span class="nm">Ilya Shabanov</span><span class="br">The Effortless Academic</span></div>`:'');
  } else if(s.t==='who'){
    html=eyebrow+`<h2>${esc(s.h)}</h2><ul class="items">${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`;
  } else if(s.t==='point'){
    html=eyebrow+`<h2>${esc(s.h)}</h2><div class="body wide">${esc(s.body)}</div>`;
  } else if(s.t==='reframe'){
    html=eyebrow+`<div class="big">${s.big}</div>`;
  } else if(s.t==='part'){
    html=`<div class="num"><span>${esc(s.num)}</span></div><h2 style="margin-top:18px">${esc(s.h)}</h2><div class="sub">${esc(s.sub)}</div>`;
  } else if(s.t==='steps'){
    html=eyebrow+`<h2>${esc(s.h)}</h2><div class="steps">${s.steps.map(st=>`<div class="step"><div class="k">${esc(st.k)}</div><div class="n">${esc(st.n)}</div><p>${esc(st.p)}</p></div>`).join('')}</div>`;
  } else if(s.t==='cards'){
    html=eyebrow+`<h2>${esc(s.h)}</h2><div class="sub">${esc(s.sub)}</div>`+
      (s.flow?`<div class="flow"><b>Source</b> &rarr; <b>Topic</b> &rarr; <b>Argument</b></div>`:'')+
      `<div class="cards">${s.cards.map(c=>`<div class="wcard ${esc(c.c)}"><div class="lab">${esc(c.lab)}</div><p>${esc(c.p)}</p></div>`).join('')}</div>`;
  } else if(s.t==='ba'){
    html=eyebrow+`<h2>${esc(s.h)}</h2><div class="ba"><div class="col"><div class="tag">Before</div><p>${esc(s.before)}</p></div><div class="col after"><div class="tag">After</div><p>${esc(s.after)}</p></div></div>`;
  } else if(s.t==='cred'){
    html=eyebrow+`<h2>${esc(s.h)}</h2><div class="body wide">${esc(s.body)}</div><div class="stats">${s.stats.map(st=>`<div class="stat"><div class="v">${esc(st.v)}</div><div class="l">${esc(st.l)}</div></div>`).join('')}</div>`;
  } else if(s.t==='cta'){
    html=eyebrow+`<h2>${esc(s.h)}</h2><div class="body wide">${esc(s.body)}</div><div class="ctabox">${s.steps.map(st=>`<div class="step-line"><b>${esc(st.b)}</b><span>${esc(st.p)}</span></div>`).join('')}</div><div class="disc">${esc(s.disc)}</div>`;
  }
  html+=`<div class="brandline">The Effortless Academic</div><div class="counter">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=html;
  deck.appendChild(el);
  bar.style.width=((i+1)/S.length*100)+'%';
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){go(i+1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){go(i-1);e.preventDefault();}
  if(e.key==='Home')go(0); if(e.key==='End')go(S.length-1);
});
deck.addEventListener('click',e=>{const r=deck.getBoundingClientRect();(e.clientX-r.left)/r.width<0.28?go(i-1):go(i+1);});
render();
</script>
</body>
</html>
