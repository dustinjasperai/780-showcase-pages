<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Women Aren't Small Men — a live masterclass with Kyla Channell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1a19; --panel:#13302d; --rule:#27463f;
    --accent:#f79578; --accent2:#2bb7ab; --ink:#f2efe9; --muted:#9fb8b2;
    --head:"Sora",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{position:relative;width:100vw;height:100vh;max-width:1280px;max-height:720px}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:72px 88px;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.18em;font-size:14px;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:64px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:-.01em}
  .sub{font-size:24px;color:var(--muted);margin-top:26px;max-width:62ch;line-height:1.4}
  .pres{font-size:16px;color:var(--accent2);margin-top:40px;font-weight:500;letter-spacing:.02em}
  .body{font-size:28px;line-height:1.42;margin-top:26px;max-width:58ch;color:#e7efec}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px;max-width:64ch}
  li{position:relative;padding-left:40px;font-size:24px;line-height:1.36}
  li::before{content:"";position:absolute;left:0;top:12px;width:20px;height:3px;
    background:var(--accent);border-radius:2px}
  .fw li::before{background:var(--accent2);width:14px;height:14px;top:9px;border-radius:50%}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:40px 46px;margin-top:10px}
  .disc{font-size:14px;color:var(--muted);margin-top:34px;max-width:70ch;line-height:1.5}
  .count{position:absolute;right:28px;bottom:22px;font-size:13px;color:var(--muted);
    font-family:var(--head);letter-spacing:.1em}
  .bar{position:absolute;left:0;bottom:0;height:4px;background:var(--accent);transition:width .35s}
  .brand{position:absolute;left:88px;bottom:22px;font-size:13px;color:var(--muted);
    font-family:var(--head);letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S=[
  {t:'title', k:"A free live masterclass", h:"Why Women Aren't Small Men", sub:"The cycle-aware fueling system for endurance athletes who keep bonking, cramping, or fading late.", pres:"With Kyla Channell, MSc, IOC Diploma in Sports Nutrition"},
  {t:'list', h:"Who this is for", list:["Triathletes, cyclists, ultrarunners and marathoners training 10+ hours a week","Athletes fueling by a number they found online who still hit the wall","Female athletes who were told to just eat like everyone else"]},
  {t:'hook', h:"The uncomfortable truth", body:"Most endurance athletes are following a fueling plan built for someone else's body. Usually a man's. Then they blame willpower when it falls apart at mile 18."},
  {t:'body', h:"It is rarely effort", body:"Bonking, gut shutdown, lost cycles, flat watts, training you cannot absorb. These are almost always a fueling problem wearing a discipline costume."},
  {t:'part', k:"Part one", h:"Why generic fueling fails", body:"A single carbs-per-hour target cannot cover a whole training day. There are four separate windows, and each one is its own calculation."},
  {t:'list', h:"The four fueling windows", list:["Pre-training: topping off without sitting heavy","Intra-training hydration: fluid and electrolytes for the conditions","Intra-training fuel: carbs your gut can absorb in motion","Post-training recovery: rebuilding for the next session"]},
  {t:'body', h:"One number, four jobs", body:"The plan that nails your pre-ride can starve you mid-race and leave you under-recovered. The window decides the number, not the other way around."},
  {t:'part', k:"Part two", h:"The method", body:"Every athlete I coach runs the same three steps. It turns the research into your own numbers, then onto your plate."},
  {t:'fw', h:"Educate. Calculate. Create.", list:["Educate: what the current science actually says","Calculate: the NR calculators turn it into your numbers by sex, age and training load","Create: the exact foods, products and recipes that hit those numbers"]},
  {t:'body', h:"Fluids are not one-size either", body:"Sweat rate and sodium loss vary widely between athletes and conditions. A sweat test replaces the guesswork with a number that is actually yours."},
  {t:'part', k:"Part three", h:"The piece almost nobody coaches", body:"Women are not small men. Fueling has to move with your physiology instead of ignoring it."},
  {t:'list', h:"Fueling through your cycle", list:["Follicular phase: when you can push fuel and intensity","Luteal phase: the carbohydrate and protein shifts that keep you steady","Perimenopause and menopause: protein, timing and recovery adjustments"]},
  {t:'list', h:"The warning lights of under-fueling (RED-S)", list:["A cycle that quietly disappears","Stress fractures and flat power","Always cold, always tired, never adapting"]},
  {t:'body', h:"Train the gut, not just the legs", body:"A stomach that quits mid-race is a trained problem, not a fixed one. Carb tolerance is built the same way your engine is: on purpose, over time."},
  {t:'body', h:"What a season looks like", body:"Fuel is periodized the way your training is: race blocks, an offseason reset, and everyday fueling that protects body composition and immunity in between."},
  {t:'list', h:"What we dial in together", list:["Your true carb, fluid and sodium numbers","Gut training so race fuel actually absorbs","Cycle-aware adjustments across the whole month"]},
  {t:'credibility', h:"Why listen to me", body:"MSc in Nutrition and Human Performance, the IOC Diploma in Sports Nutrition, and years training under Dr. Stacy Sims in sex differences in sport. Fifteen years fueling endurance athletes, from first-timers to Olympians and world champions."},
  {t:'body', h:"The shift", body:"Stop guessing. Start fueling for the athlete you actually are, in the body you actually have."},
  {t:'cta', h:"Work with me", body:"If you want this built for your season, apply for 1-on-1 coaching. I take a limited number of athletes each season so the support stays personal.", disc:"Educational only. No income, performance, or result is guaranteed. Results vary by athlete, effort, and individual circumstances. Consult your physician before making nutrition changes."}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(i===0?' on':'');
  let html='';
  if(s.k) html+='<div class="k">'+s.k+'</div>';
  html+= (s.t==='title') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.body) html+='<div class="body">'+s.body+'</div>';
  if(s.list){const cls=(s.t==='fw')?'fw':'';html+='<ul class="'+cls+'">'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.pres) html+='<div class="pres">'+s.pres+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  html+='<div class="brand">Nutritional Revolution</div>';
  html+='<div class="count">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  stage.appendChild(d);
});
const bar=document.createElement('div');bar.className='bar';document.body.appendChild(bar);
let cur=0;const slides=[...document.querySelectorAll('.slide')];
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));bar.style.width=((cur+1)/S.length*100)+'%';}
show(0);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
stage.addEventListener('click',()=>show(cur+1));
</script>
</body>
</html>
