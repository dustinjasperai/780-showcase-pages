<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Million Dollar Blueprint, a Masterclass with Adam Koós</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5;
    --panel:#f2ede6;
    --ink:#1d1d1d;
    --muted:#5c564e;
    --accent:#c14b36;
    --rule:#e4ddd2;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:64px 64px;margin:0 0 26px;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;overflow:hidden;box-shadow:0 2px 2px rgba(29,29,29,.02);
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .num{position:absolute;top:26px;right:34px;font-size:13px;letter-spacing:.14em;color:var(--muted);font-weight:700}
  .num b{color:var(--accent)}
  .k{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;font-size:60px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Zilla Slab',Georgia,serif;font-weight:600;font-size:44px;line-height:1.08;letter-spacing:-.01em}
  .lead{font-size:23px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:40ch}
  .big{font-family:'Zilla Slab',Georgia,serif;font-weight:600;font-size:72px;line-height:1.04;letter-spacing:-.015em;max-width:20ch}
  .big em{color:var(--accent);font-style:italic}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px;max-width:46ch}
  li{position:relative;padding-left:40px;font-size:22px;line-height:1.45;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;border:2.5px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;line-height:1.4}
  .part h1{font-size:68px}
  .part .barnote{margin-top:22px;font-size:20px;color:var(--muted)}
  .pres{margin-top:40px;font-size:20px;color:var(--ink);font-weight:600}
  .pres span{display:block;color:var(--muted);font-weight:400;font-size:17px;margin-top:4px;letter-spacing:.02em}
  .cta{background:var(--panel)}
  .cta .step{margin-top:30px;display:flex;flex-direction:column;gap:14px;max-width:40ch}
  .cta .step div{font-size:21px;line-height:1.45}
  .disc{margin-top:40px;font-size:14px;line-height:1.5;color:var(--muted);max-width:56ch;border-top:1px solid var(--rule);padding-top:18px}
  .foot{margin-top:28px;font-size:15px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:720px){.slide{padding:40px 30px;min-height:auto}h1{font-size:40px}.big{font-size:46px}h2{font-size:32px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass for financial advisors',
   h:'The Million Dollar Blueprint',
   lead:'How practicing advisors build a seven-figure practice without winging it.',
   pres:'Adam Koós, CMT, CFP, CEPA', presSub:'Founder, ADRENALINE Advisor Consulting and Libertas Wealth Management'},

  {t:'who', k:'Who this is for',
   h:'You are good with clients. Growth is the part that feels random.',
   b:['Financial planners and wealth advisors who deliver for clients every day',
      'Advisors who want to grow the practice without buying their time back in evenings and weekends',
      'Anyone who knows the next level exists but has no repeatable path to it']},

  {t:'trap', k:'The trap',
   big:'You build a meticulous plan for every client, and <em>wing it</em> for yourself.'},

  {t:'reframe', k:'The honest reframe',
   big:'Your practice is not stuck because you are bad at your job. It is stuck because there is no <em>blueprint</em> for your own growth.'},

  {t:'part', k:'Part one', h:'Why growth stalls',
   barnote:'Three quiet leaks that cap almost every practice.'},

  {t:'point', k:'Leak one', h:'Prospecting is a mood, not a system.',
   lead:'When new business depends on how motivated you feel this week, growth swings with your calendar instead of compounding.'},

  {t:'point', k:'Leak two', h:'Referrals are accidental.',
   lead:'Great clients would gladly introduce you. Most never do, because nothing in your process ever asks them to, on purpose.'},

  {t:'point', k:'Leak three', h:'You are the ceiling.',
   lead:'Every decision routes through you, so the practice can only grow as fast as your own hours, and there is no path upmarket.'},

  {t:'part', k:'Part two', h:'The Blueprint',
   barnote:'Plan for yourself the way you plan for your best client.'},

  {t:'point', k:'The planning house', h:'Four parts, built in order.',
   lead:'Before tactics, a structure. Each part rests on the one beneath it, the way a house rests on its foundation.'},

  {t:'point', k:'Foundation', h:'Values',
   lead:'What matters most, and what you will not negotiate on. Audit where your calendar time actually goes against them, and the misalignments show up fast.'},

  {t:'point', k:'Framing', h:'Vision',
   lead:'What the life and the practice look like in 5, 10 and 20 years. Written in specific, sensory detail, not a vague someday.'},

  {t:'point', k:'Finish work', h:'Mission',
   lead:'The bridge that connects the vision to what you do on an ordinary Tuesday, so direction survives contact with a busy week.'},

  {t:'point', k:'Execution', h:'Goals',
   lead:'Specific targets tied to the first three pieces, written as "I will do this, by doing this, so I can do this," and kept on one page you actually see.'},

  {t:'part', k:'The three levers', h:'Then you pull on growth.',
   barnote:'With the plan set, three levers move the practice.'},

  {t:'point', k:'Lever one', h:'Prospecting and Marketing',
   lead:'From lead generation and reputation to intentionally producing more introductions from clients and centers of influence, on a cadence you run every week.'},

  {t:'point', k:'Lever two', h:'Client Onboarding and Service',
   lead:'A proven process that builds deep trust early, which lifts your conversion ratio and turns new clients into advocates from the first meeting.'},

  {t:'point', k:'Lever three', h:'Building a Referable Business',
   lead:'A high-touch but efficient client experience, from review meetings and communication to education and events, that makes introductions the natural result.'},

  {t:'why', k:'Why listen to me',
   h:'I run this on my own firm.',
   b:['A practicing advisor holding the CMT, CFP and CEPA designations, not a marketer on the outside',
      'Built and grew my own seven-figure practice using this exact blueprint',
      'Named one of Investopedia’s 100 Most Influential Advisors']},

  {t:'cta', k:'Your next step',
   h:'See if the Blueprint fits your practice.',
   step:['Book a short intro call and we will walk through where your growth is leaking.',
         'Or fill out the "See if We’re Right For You" questionnaire first, and we will start from there.'],
   disc:'This masterclass is educational. No specific result or income is guaranteed. Results vary by advisor, effort, market and starting point. Nothing here is investment, legal or tax advice.',
   foot:'ADRENALINE Advisor Consulting'}
];

const el = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide ' + s.t;
  let html = '<div class="num">' + String(i+1).padStart(2,'0') + ' <b>/</b> ' + String(S.length).padStart(2,'0') + '</div>';
  if (s.k) html += '<div class="k">' + s.k + '</div>';
  if (s.big) {
    html += '<div class="big">' + s.big + '</div>';
  } else if (s.h) {
    html += (s.t === 'part' ? '<h1>' : (s.t === 'title' ? '<h1>' : '<h2>')) + s.h + (s.t==='part'||s.t==='title' ? '</h1>' : '</h2>');
  }
  if (s.lead) html += '<div class="lead">' + s.lead + '</div>';
  if (s.barnote) html += '<div class="barnote">' + s.barnote + '</div>';
  if (s.b) {
    html += '<ul>' + s.b.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  }
  if (s.pres) html += '<div class="pres">' + s.pres + '<span>' + (s.presSub||'') + '</span></div>';
  if (s.step) html += '<div class="step">' + s.step.map(x => '<div>' + x + '</div>').join('') + '</div>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  if (s.foot) html += '<div class="foot">' + s.foot + '</div>';
  d.innerHTML = html;
  el.appendChild(d);
});
</script>
</body>
</html>
