<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Hard Conversation, a masterclass with Sage B. Hobbs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4ede0;        /* warm sand ground, derived from her #ddd7cc */
    --panel:#fbf7ef;
    --panel2:#efe6d6;
    --rule:#ddd7cc;      /* her own warm neutral */
    --accent:#5a375a;    /* her own plum (site H1/H2/links) */
    --accent2:#005b7f;   /* her own dominant teal */
    --ink:#33302e;       /* warm near-black, from her #333333 */
    --muted:#6f6a63;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .eyebrow{font-family:"Lato";font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:.78rem;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:"Newsreader";font-weight:700;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.04;
    letter-spacing:-.01em;color:var(--ink)}
  h1 .sub{display:block;font-family:"Newsreader";font-weight:400;font-style:italic;
    font-size:clamp(1.2rem,2.4vw,1.8rem);color:var(--muted);margin-top:1.6rem;line-height:1.35}
  h2{font-family:"Newsreader";font-weight:700;font-size:clamp(1.9rem,4vw,3rem);line-height:1.1;
    letter-spacing:-.01em;margin-bottom:2.2rem;color:var(--ink)}
  .label{font-family:"Newsreader";font-style:italic;color:var(--accent);font-size:1.3rem;margin-bottom:.6rem}
  .big{font-family:"Newsreader";font-weight:600;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.15;
    letter-spacing:-.01em;max-width:18ch}
  .kicker{font-family:"Lato";font-weight:700;letter-spacing:.1em;text-transform:uppercase;
    font-size:.8rem;color:var(--accent2);margin-bottom:1.4rem}
  .small{font-family:"Newsreader";font-style:italic;color:var(--muted);font-size:1.25rem;margin-top:1.8rem;max-width:34ch}
  .lede{font-size:1.35rem;max-width:40ch;color:var(--ink)}
  .note{font-family:"Newsreader";font-style:italic;color:var(--muted);font-size:1.15rem;margin-top:2rem;max-width:40ch}
  ul{list-style:none;display:grid;gap:1.4rem;max-width:62rem}
  ul.cols{grid-template-columns:repeat(auto-fit,minmax(16rem,1fr))}
  li{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);
    border-radius:14px;padding:1.5rem 1.7rem}
  li .h{font-family:"Newsreader";font-weight:700;font-size:1.25rem;color:var(--ink);margin-bottom:.5rem}
  li .p{color:var(--muted);font-size:1.02rem}
  .plain li{display:flex;gap:1rem;align-items:flex-start;background:none;border:none;border-left:none;padding:.2rem 0}
  .plain li::before{content:"";flex:0 0 .7rem;height:.7rem;margin-top:.5rem;border-radius:50%;background:var(--accent)}
  .plain li .t{font-size:1.4rem;color:var(--ink)}
  .cta-box{background:var(--panel2);border:1px solid var(--rule);border-radius:18px;padding:2.6rem;max-width:46rem}
  .cta-box .action{font-family:"Newsreader";font-weight:700;color:var(--accent);font-size:1.5rem;margin-top:1.4rem}
  .disclaimer{color:var(--muted);font-size:.86rem;margin-top:2.4rem;max-width:48rem;line-height:1.5}
  .pg{position:absolute;bottom:3vh;right:9vw;font-family:"Newsreader";font-style:italic;color:var(--muted);font-size:.9rem}
  .brandmark{position:absolute;top:5vh;left:9vw;font-family:"Newsreader";font-weight:700;color:var(--accent);letter-spacing:.02em}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Sage B. Hobbs',
   title:'The Hard Conversation',
   sub:'How school leaders build trust and turn around culture with Naked Communication'},

  {t:'who', title:'Who this is for',
   items:['Principals and heads of school','New and experienced administrators','District and nonprofit leaders carrying real weight'],
   note:'If you have ever rehearsed a conversation in the car before you had it, this is for you.'},

  {t:'lede', title:'The trap',
   body:'You got promoted for being good with people and good with results. Then the job handed you the conversations nobody ever trained you for.'},

  {t:'cards', title:'The conversations you did not sign up for',
   cols:true,
   items:[
     {h:'The veteran teacher', p:'Whose lesson is not working, and who has been in the building longer than you have.'},
     {h:'The parent', p:'Who is already certain that you are the problem.'},
     {h:'Your own boss', p:'When the directive coming down does not fit the building you actually run.'}]},

  {t:'reframe', kicker:'The uncomfortable truth',
   big:'The conversation you are avoiding is usually the one your school needs most.'},

  {t:'part', label:'Part One', title:'Why the hard conversation stays hard'},

  {t:'cards', title:'What avoidance actually costs',
   items:[
     {h:'Trust erodes quietly', p:'Your staff already know what you are not saying. Silence reads as either approval or fear.'},
     {h:'Small problems calcify', p:'The lesson that is not working, the behavior you let slide, the call you did not return.'},
     {h:'You carry it home', p:'Your peace of mind goes, because you are still having the conversation in your head at 11pm.'}]},

  {t:'quote', big:'Most leaders do not have a courage problem. They have a method problem.',
   small:'Courage without a method is just adrenaline. It does not repeat, and it cannot be taught.'},

  {t:'part', label:'Part Two', title:'Naked Communication, the method'},

  {t:'cards', title:'Two pillars', cols:true,
   items:[
     {h:'Courage', p:'The inner conversation that sets you up to say the true thing, before you are ever in the room.'},
     {h:'Connection', p:'Disagreeing agreeably and holding a clear boundary without damaging the relationship.'}]},

  {t:'cards', title:'The inner conversation comes first',
   items:[
     {h:'Name the derailer', p:'Recognize your own stress pattern before it quietly runs the meeting for you.'},
     {h:'Regulate, then speak', p:'Impulse control and executive presence are skills you can build, not fixed personality.'},
     {h:'Decide what is, and is not, okay', p:'Clarity before contact. You cannot hold a boundary you have not named for yourself.'}]},

  {t:'cards', title:'Then the conversation itself',
   items:[
     {h:'Stay in the room', p:'How to stay present when it gets hard, instead of rushing to make it end.'},
     {h:'Ask for what you need', p:'Make the direct request, even when it leaves you feeling exposed.'},
     {h:'Disagree agreeably', p:'Hold your position and the relationship at the same time.'}]},

  {t:'reframe', kicker:'The reframe that changes everything',
   big:'Empathy and high standards are not a trade-off. The EQ skills are what let you hold both at once.'},

  {t:'lede', title:'Where the skill comes from',
   body:'This is grounded in emotional intelligence and measured with the EQ-i 2.0 assessment: a real baseline, a shared language, and skills you can practice. Not a personality type. A practice.'},

  {t:'part', label:'Part Three', title:'Back in your building'},

  {t:'cards', title:'Ninety days in',
   items:[
     {h:'The meeting you dreaded', p:'You walk in regulated and clear on the boundary, and you leave with the relationship still intact.'},
     {h:'The staff notice', p:'People trust a leader who says the true thing with care. Culture follows trust, in that order.'},
     {h:'It repeats', p:'Because it is a method and not a mood, you can do it again next week and the week after.'}]},

  {t:'cards', title:'What you will leave with', cols:true,
   items:[
     {h:'A method', p:'A repeatable way into the conversation you have been avoiding.'},
     {h:'The inner script', p:'How to regulate and prepare before you say a single word.'},
     {h:'Language for the room', p:'Ask, disagree, and hold a boundary without breaking trust.'}]},

  {t:'why', title:'Why me',
   body:'I am Sage B. Hobbs. I spent more than 20 years in education, I wrote Naked Communication, and I host Principal Pep Talks. I coach school leaders on exactly this work, every day.'},

  {t:'cta', title:'Build this into how you lead',
   body:'The Principal Leadership Program is a year-long cohort for school leaders who want to build this into how they lead: monthly group coaching, 1:1 executive coaching, the EQ-i 2.0 assessment, reflection partners, and a room of peers doing the same work.',
   action:'Schedule a 30-minute exploratory call to see if it is a fit for you or your district.',
   disclaimer:'This masterclass is educational. It shares a leadership method and does not promise or guarantee any specific result or outcome. Every school, district, and leader is different, and results will vary.'}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function cards(items,cols){
  return '<ul class="'+(cols?'cols':'')+'">'+items.map(function(i){
    return '<li><div class="h">'+esc(i.h)+'</div><div class="p">'+esc(i.p)+'</div></li>';}).join('')+'</ul>';
}
function render(s,idx,total){
  var inner='', brand='<div class="brandmark">Sage B. Hobbs</div>';
  if(s.t==='title'){
    brand='';
    inner='<div class="eyebrow">'+esc(s.eyebrow)+'</div><h1>'+esc(s.title)+'<span class="sub">'+esc(s.sub)+'</span></h1>';
  } else if(s.t==='who'){
    inner='<h2>'+esc(s.title)+'</h2><ul class="plain">'+s.items.map(function(i){return '<li><span class="t">'+esc(i)+'</span></li>';}).join('')+'</ul><div class="note">'+esc(s.note)+'</div>';
  } else if(s.t==='lede'){
    inner='<h2>'+esc(s.title)+'</h2><p class="lede">'+esc(s.body)+'</p>';
  } else if(s.t==='cards'){
    inner='<h2>'+esc(s.title)+'</h2>'+cards(s.items,s.cols);
  } else if(s.t==='reframe'){
    inner='<div class="kicker">'+esc(s.kicker)+'</div><div class="big">'+esc(s.big)+'</div>';
  } else if(s.t==='part'){
    inner='<div class="label">'+esc(s.label)+'</div><h1>'+esc(s.title)+'</h1>';
  } else if(s.t==='quote'){
    inner='<div class="big">'+esc(s.big)+'</div><div class="small">'+esc(s.small)+'</div>';
  } else if(s.t==='why'){
    inner='<h2>'+esc(s.title)+'</h2><p class="lede">'+esc(s.body)+'</p>';
  } else if(s.t==='cta'){
    inner='<h2>'+esc(s.title)+'</h2><div class="cta-box"><p class="lede">'+esc(s.body)+'</p><div class="action">'+esc(s.action)+'</div></div><div class="disclaimer">'+esc(s.disclaimer)+'</div>';
  }
  return '<section class="slide">'+brand+inner+'<div class="pg">'+(idx+1)+' / '+total+'</div></section>';
}
document.getElementById('deck').innerHTML = S.map(function(s,i){return render(s,i,S.length);}).join('');
</script>
</body>
</html>
