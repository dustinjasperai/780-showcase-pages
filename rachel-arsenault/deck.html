<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 4-Act Blueprint for Crime and Fantasy Novels — Rachel Arsenault, Story Cipher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f7;        /* their page background, warm literary cream */
    --panel:#f1ece1;     /* deeper warm tint of the cream ground */
    --ink:#1d1d1d;       /* their dominant near-black ink */
    --rule:#d8cfbe;      /* muted warm hairline */
    --accent:#9a6a12;    /* deepened form of brand gold #ffd68b */
    --muted:#5c554a;
    --display:'Spectral', Georgia, serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:#e9e3d7;
    font-family:var(--body);
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:24px;
  }
  #deck{width:100%;max-width:960px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    box-shadow:0 12px 40px rgba(28,27,26,.10);
    aspect-ratio:16/9;
    padding:64px 72px;
    display:none;
    flex-direction:column;
    position:relative;
    overflow:hidden;
  }
  .slide.active{display:flex}
  .kicker{
    font-family:var(--body);
    font-weight:600;
    letter-spacing:.16em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--accent);
    margin-bottom:20px;
  }
  h1{font-family:var(--display);font-weight:600;font-size:56px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;margin-bottom:20px}
  .sub{font-family:var(--display);font-style:italic;font-weight:500;font-size:26px;color:var(--muted);margin-top:22px;max-width:34ch}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:52ch;margin-bottom:14px}
  p.lead{font-size:22px;color:var(--muted)}
  ul{list-style:none;margin-top:12px}
  li{font-size:19px;line-height:1.5;padding-left:26px;position:relative;margin-bottom:14px;max-width:54ch}
  li:before{content:'';position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--accent);border-radius:1px}
  .hinge{display:flex;gap:14px;margin-top:24px;flex-wrap:wrap}
  .act{flex:1;min-width:150px;background:var(--panel);border-left:3px solid var(--rule);padding:16px 18px;border-radius:3px}
  .act.mid{border-left-color:var(--accent)}
  .act .n{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700}
  .act .t{font-family:var(--display);font-size:23px;margin-top:4px}
  .act .d{font-size:14px;color:var(--muted);margin-top:6px;line-height:1.4}
  .presenter{margin-top:auto;padding-top:24px;font-size:16px;color:var(--muted)}
  .presenter b{color:var(--ink);font-weight:600}
  .rulebar{width:64px;height:3px;background:var(--accent);margin:26px 0}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:18px;max-width:60ch;line-height:1.45}
  .cta-step{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:20px 22px;margin-top:8px;max-width:46ch}
  .cta-step b{color:var(--accent)}
  .foot{position:absolute;bottom:22px;right:28px;font-family:var(--display);font-size:14px;color:var(--muted);letter-spacing:.04em}
  .page{position:absolute;bottom:22px;left:28px;font-size:12px;color:var(--muted);letter-spacing:.12em}
  #nav{max-width:960px;margin:16px auto 0;display:flex;justify-content:space-between;align-items:center;color:#6b6459;font-size:13px}
  #nav button{font-family:var(--body);font-size:13px;background:var(--ink);color:var(--bg);border:0;border-radius:3px;padding:8px 16px;cursor:pointer}
  #nav button:disabled{opacity:.35;cursor:default}
</style>
</head>
<body>
<div id="deck"></div>
<div id="nav">
  <button id="prev">Prev</button>
  <span id="counter"></span>
  <button id="next">Next</button>
</div>
<script>
const S=[
 {t:'title', k:'Story Cipher &middot; A live masterclass',
  h1:'The 4-Act Blueprint for Crime and Fantasy Novels',
  sub:'How to structure a story so the mystery pays off fair and the magic feels earned.',
  presenter:'<b>Rachel Arsenault</b>, developmental editor &middot; Story Cipher Academy'},

 {t:'who', k:'Who this is for', h2:'You have the world. You have the twist.',
  lead:'This is for crime and fantasy writers who have a premise they love, or a draft that stalled, and want a plot that actually lands the payoff their genre promises.',
  paras:['If you have ever finished a manuscript and felt the middle sag or the ending arrive too easily, you are exactly who this was built for.']},

 {t:'trap', k:'The trap', h2:'The imagination is not the problem.',
  lead:'Most writers can dream up a brilliant killer or a striking magic system. Where genre novels break is the plot that has to hold them together.',
  paras:['The clues do not add up. The magic solves the climax by convenience. The reader senses the seams, even when they cannot name them.']},

 {t:'reframe', k:'The reframe', h2:'You are outlining in three acts a story that turns on four.',
  lead:'A crime or fantasy novel has a second engine most structure advice ignores: the midpoint shift, the moment everything you thought you knew is recut.',
  paras:['Treat that hinge as its own act, and the saggy middle and the cheat ending disappear together.']},

 {t:'part', k:'Part One', h1:'The core problem: the saggy middle and the cheat ending'},

 {t:'problem', k:'The core problem', h2:'Why three-act outlining fails genre fiction',
  items:[
   'A mystery has to be <b>fair</b>: the answer must be seeded in plain sight, so the reveal feels inevitable rather than pulled from nowhere.',
   'A fantasy has to be <b>earned</b>: the magic must have rules and costs, or the climax reads as the author waving a wand.',
   'Three acts give you a beginning, a long undivided middle, and an end. The genre payoff lives inside that middle, unmarked, which is why it sags.']},

 {t:'part', k:'Part Two', h1:'The framework: the 4-Act Structure'},

 {t:'acts', k:'The framework', h2:'Four manageable acts, one hinge',
  paras:['Instead of one long second act, we split the story at the point it actually turns. The midpoint shift becomes the spine of the book.'],
  acts:[
   {n:'Act I', tt:'Premise to plot', d:'The question that pulls the reader in.'},
   {n:'Act II', tt:'The build', d:'Clues and rules laid in plain sight.'},
   {n:'Midpoint', tt:'The shift', d:'Everything recut.', mid:true},
   {n:'Act III &amp; IV', tt:'Cost and payoff', d:'The reveal lands fair and earned.'}]},

 {t:'act1', k:'Act I', h2:'Premise to plot',
  lead:'A premise is a situation. A plot is a question the reader needs answered.',
  paras:['Act I turns "a detective in a snowbound town" or "a girl who can hear metal" into the specific dramatic question the rest of the book will pay off. Get this wrong and no amount of craft downstream can save it.']},

 {t:'act2', k:'Act II, first half', h2:'The build: lay it in plain sight',
  lead:'This is where fair-play is won or lost.',
  paras:['Every clue the crime turns on, every rule and limit the magic will obey, gets planted here, visible but unremarkable. The reader should be able to look back and see it was all there.']},

 {t:'midpoint', k:'The hinge', h2:'The midpoint shift',
  lead:'The crescendo of the second act and the tipping point of your story, before we come barreling into the back half.',
  paras:['Think of the single, heart stopping moment at the top of a roller coaster, when you see just how big a drop is coming. The information the reader was given is suddenly recut, and the stakes become personal.']},

 {t:'act3', k:'Act III', h2:'Cost comes due',
  lead:'After the shift, the noose tightens.',
  paras:['The detective is now implicated, not just observing. The magic that felt like a gift shows its price. Everything planted in the build is now spending, and the reader feels the consequences accelerate.']},

 {t:'act4', k:'Act IV', h2:'The payoff, fair and earned',
  lead:'The climax and resolution.',
  paras:['The mystery resolves on clues the reader was fairly given, so the reveal feels inevitable in hindsight. The magic resolves within its own rules, so the win feels earned rather than convenient. This is the promise the genre made in chapter one, kept.']},

 {t:'crime', k:'Genre mechanics &middot; Crime', h2:'Red herrings that play fair',
  items:[
   'A real clue and a red herring should look identical on first read. The difference only appears on the second.',
   'Misdirection is aimed at the reader\'s attention, never at hiding information they were entitled to.',
   'The reveal earns its gasp because everything was on the page. That is the contract of the genre.']},

 {t:'fantasy', k:'Genre mechanics &middot; Fantasy', h2:'Magic systems the climax can stand on',
  items:[
   'Rules and costs defined before the climax turn magic from a plot hole into a plot engine.',
   'The worldbuilding that matters is the part the ending depends on. The rest is texture.',
   'When the magic obeys its own limits under pressure, the reader trusts the win.']},

 {t:'dissect', k:'The method', h2:'Learn it by taking the masterworks apart',
  lead:'The fastest way to learn structure is to put an analytical magnifying glass on the books that already did it.',
  paras:['We dissect the methods behind crime and fantasy masterworks, spotting how a perfect red herring is planted or how a masterful magic system is revealed, then reverse-engineer those moves into your own manuscript.']},

 {t:'part', k:'Part Three', h1:'Your book, four acts in'},

 {t:'outcome', k:'In your manuscript', h2:'From premise to a draft you can actually revise',
  lead:'The point of structure is not a prettier outline. It is a finished book.',
  items:[
   'A premise sharpened into a dramatic question.',
   'An outline built on the four-act hinge, with the payoff planted from the start.',
   'A completed first draft, and a revision plan that tells you exactly what to fix next.']},

 {t:'whyme', k:'Why me', h2:'A crime and fantasy editor, not a general writing coach',
  lead:'I have spent the last decade reading, editing, and dissecting these two genres in particular.',
  paras:['As a developmental editor I apply that analytical magnifying glass to the methods behind crime and fantasy masterworks. I teach it every week on the Story Deep Dive podcast and inside the Story Cipher Academy, where writers take a book from premise to a finished draft.']},

 {t:'cta', k:'Your next step', h2:'Ready to outline your novel in four acts?',
  paras:['Start free, then go deep when you are ready.'],
  steps:[
   {label:'Free:', text:'the 4-Act Structure email course and outline template at storycipher.me.'},
   {label:'Go further:', text:'join the Story Cipher Academy waitlist for Novel 101, the guided path from premise to a completed first draft.'}],
  disclaimer:'Educational content only. No specific writing, publishing, or income result is guaranteed. Results vary by the individual and the effort they put in.'}
];

function render(s){
 let h='<div class="kicker">'+(s.k||'')+'</div>';
 if(s.h1) h+='<h1>'+s.h1+'</h1>';
 if(s.h2) h+='<h2>'+s.h2+'</h2>';
 if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
 if(s.t==='part') h+='<div class="rulebar"></div>';
 if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
 if(s.paras) s.paras.forEach(p=>h+='<p>'+p+'</p>');
 if(s.items){h+='<ul>';s.items.forEach(it=>h+='<li>'+it+'</li>');h+='</ul>';}
 if(s.acts){
   h+='<div class="hinge">';
   s.acts.forEach(a=>{h+='<div class="act'+(a.mid?' mid':'')+'"><div class="n">'+a.n+'</div><div class="t">'+a.tt+'</div><div class="d">'+a.d+'</div></div>';});
   h+='</div>';
 }
 if(s.steps) s.steps.forEach(st=>h+='<div class="cta-step"><b>'+st.label+'</b> '+st.text+'</div>');
 if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
 if(s.presenter) h+='<div class="presenter">'+s.presenter+'</div>';
 return h;
}

const deck=document.getElementById('deck');
let i=0;
function paint(){
 deck.innerHTML='';
 const el=document.createElement('div');
 el.className='slide active';
 el.innerHTML=render(S[i])+`<div class="page">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div><div class="foot">Story Cipher</div>`;
 deck.appendChild(el);
 document.getElementById('counter').textContent=(i+1)+' / '+S.length;
 document.getElementById('prev').disabled=(i===0);
 document.getElementById('next').disabled=(i===S.length-1);
}
document.getElementById('prev').onclick=()=>{if(i>0){i--;paint();}};
document.getElementById('next').onclick=()=>{if(i<S.length-1){i++;paint();}};
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'&&i<S.length-1){i++;paint();}
 if(e.key==='ArrowLeft'&&i>0){i--;paint();}
});
paint();
</script>
</body>
</html>
