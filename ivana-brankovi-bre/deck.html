<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice They Lean In To — a live masterclass with Ivana Branković</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#273644;        /* ground, from her navy #334862 link color (darker) */
    --panel:#334862;     /* her #334862, uses 18 */
    --rule:#415a76;      /* desaturated slate off the same navy */
    --ink:#f1f1f1;       /* her #f1f1f1, uses 27 */
    --muted:#9fb0c0;     /* muted slate for secondary text */
    --accent:#dd5b3a;    /* her terracotta CTA-button color #dd5b3a, uses 17 */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Montserrat',sans-serif;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 52px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:'Montserrat';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-size:13px;margin-bottom:18px}
  h1{font-family:'Anton',sans-serif;font-weight:400;font-size:62px;line-height:1.02;
    letter-spacing:.01em;text-transform:uppercase}
  h2{font-family:'Anton',sans-serif;font-weight:400;font-size:40px;line-height:1.05;
    letter-spacing:.01em;text-transform:uppercase}
  .sub{color:var(--muted);font-size:21px;margin-top:20px;max-width:30ch}
  .body{font-size:20px;margin-top:16px;max-width:60ch;color:var(--ink)}
  .body.muted{color:var(--muted)}
  ul{margin-top:18px;padding-left:22px;max-width:60ch}
  li{font-size:19px;margin:10px 0}
  .big{font-size:30px;line-height:1.25;max-width:40ch;font-weight:500}
  .wave{position:absolute;right:30px;bottom:24px;opacity:.5}
  .stat{display:flex;gap:40px;margin-top:26px;flex-wrap:wrap}
  .stat b{font-family:'Anton';font-size:46px;color:var(--accent);display:block;font-weight:400}
  .stat span{color:var(--muted);font-size:15px}
  .num{font-family:'Anton';color:var(--accent);font-size:22px;margin-right:12px}
  .cta h2{color:var(--accent)}
  .disc{color:var(--muted);font-size:14px;margin-top:26px;max-width:62ch;line-height:1.5}
  .pillar-row{display:flex;align-items:baseline;gap:16px;margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<svg width="0" height="0"><symbol id="w" viewBox="0 0 120 40"><path d="M2 20 Q 12 2 22 20 T 42 20 T 62 20 T 82 20 T 102 20 T 118 20" fill="none" stroke="#dd5b3a" stroke-width="3"/></symbol></svg>
<script>
const S = [
  {t:'title', k:'A live masterclass with Ivana Branković', h:'The Voice They Lean In To', sub:'How to speak so people actually listen, in meetings, on stage, and on camera.'},
  {t:'who', k:'Who this is for', h:'You already have something to say', b:'You run meetings, present to clients, go live on camera, or stand in front of a room. You are good at your work. But the moment you open your mouth, you feel it does not land the way it should.'},
  {t:'reframe', k:'The trap', h:'You were told it is a confidence problem', b:'So you practiced more, rehearsed harder, and pushed the nerves down. The nerves came back anyway, because confidence was never the root. Your voice was.'},
  {t:'part', k:'Part one', h:'Why most speaking advice fails you'},
  {t:'point', k:'The core problem', h:'Nerves are a symptom, not the disease', b:'Every quick tip treats the surface: breathe, smile, make eye contact. None of it touches the real reason a talented person sounds flat, because none of it starts with the one instrument you carry into every room.'},
  {t:'point', k:'The real block', h:'A voice you have not accepted', b:'Most people quietly dislike their own voice. So they shrink it, flatten it, or perform a borrowed one. The audience hears the discomfort before they hear the message. Accepting your voice is where real presence begins.'},
  {t:'part', k:'Part two', h:'The method: three moves, one voice'},
  {t:'pillar', k:'Pillar one', h:'Accept the instrument', b:'Before technique, ownership. You learn to hear your own voice without flinching and to treat it as the asset it is. This is the holistic step: you cannot work on the voice without working on the person behind it.'},
  {t:'point', k:'What changes', h:'From hiding to owning', b:'When you stop fighting your sound, the tension that made you rush, mumble, or over-perform simply drops. People read that ease instantly. It is the fastest shift most speakers ever feel.'},
  {t:'pillar', k:'Pillar two', h:'Train the instrument', b:'Now the craft. Breath, diction, pace, and expression, built from 20 years of radio, television, and voice work. The same drills that make a broadcast voice carry will make yours carry in any room.'},
  {t:'point', k:'What changes', h:'A voice that holds a room', b:'You learn to land a sentence, use a pause, and let a point breathe. The message stops leaking energy and starts holding attention from the first line to the last.'},
  {t:'pillar', k:'Pillar three', h:'Command the room', b:'Finally, presence. Body language, stage habits, and on-camera comfort so the person the audience sees matches the voice they hear. Being watched stops feeling like exposure and starts feeling like contact.'},
  {t:'point', k:'What changes', h:'Seen, not scrutinised', b:'On stage, in a boardroom, or recording content, you stand in front of people without shrinking. The camera and the crowd become the same simple thing: someone to speak to.'},
  {t:'part', k:'Part three', h:'When your voice finally lands'},
  {t:'point', k:'The shift', h:'Same person, different presence', b:'You walk in carrying the same expertise you always had. The difference is that now it reaches people. They lean in, they remember the point, and they act on it.'},
  {t:'point', k:'Where it carries', h:'One skill, every room', b:'A pitch, a keynote, a team meeting, a reel. The voice work does not belong to one stage. Once it is yours, it travels with you into all of them.'},
  {t:'why', k:'Why learn this from me', h:'I have lived on the microphone', b:'I started in radio at 16, producing my own shows, then moved into television hosting, event moderation, commercial voice-over, and audiobook narration. I trained with Les Brown and Brian Tracy. Voice is not my topic, it is my craft.', stat:[['20+','years on air'],['200+','people trained'],['1,500+','client performances']]},
  {t:'quote', k:'What I believe', h:'Accept your voice, accept yourself', b:'When you accept your voice, you actually accept yourself. That is when a speaker stops performing and starts connecting, and it is the whole point of this work.'},
  {t:'recap', k:'The method, in one view', h:'Three moves, one voice', b:'Accept the instrument. Train the instrument. Command the room. In that order, because presence built on an accepted voice is the only kind that lasts.'},
  {t:'cta', k:'Your next step', h:'Work on your voice with me', b:'If this is the way you want to speak, the next step is a training built around you: one-on-one, in a group, or with your team. We work on the skills that matter most to you, starting with the voice.', disc:'This masterclass is educational. No specific result or outcome is guaranteed. Results vary from person to person and depend on your own practice and application.'}
];

const deck = document.getElementById('deck');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;');}
S.forEach(function(sl){
  const d = document.createElement('div');
  d.className = 'slide ' + (sl.t === 'cta' ? 'cta' : '');
  let html = '';
  if (sl.k) html += '<div class="kicker">'+esc(sl.k)+'</div>';
  if (sl.t === 'part') {
    html += '<h1>'+esc(sl.h)+'</h1>';
  } else if (sl.t === 'title') {
    html += '<h1>'+esc(sl.h)+'</h1>';
    if (sl.sub) html += '<div class="sub">'+esc(sl.sub)+'</div>';
  } else {
    html += '<h2>'+esc(sl.h)+'</h2>';
    if (sl.b) html += '<div class="body">'+esc(sl.b)+'</div>';
  }
  if (sl.stat) {
    html += '<div class="stat">';
    sl.stat.forEach(function(s){ html += '<div><b>'+esc(s[0])+'</b><span>'+esc(s[1])+'</span></div>'; });
    html += '</div>';
  }
  if (sl.disc) html += '<div class="disc">'+esc(sl.disc)+'</div>';
  html += '<svg class="wave" width="120" height="40"><use href="#w"/></svg>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
