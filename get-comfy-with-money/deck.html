<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 4 Phases of Finance and Flow — Get Comfy With Money</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f6f4ef;      /* brand dominant ground */
    --navy:#1d2a44;       /* brand header/footer navy */
    --ink:#141414;        /* near brand body ink */
    --rose:#f65d8b;       /* brand accent */
    --blush:#f8d7d6;      /* brand soft blush tint */
    --muted:#5a5560;
    --line:#e2ddd3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ded9cf}
  body{font-family:'Montserrat',system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:28px 0}
  .deck{max-width:960px;margin:0 auto;padding:0 20px}
  .slide{
    position:relative;background:var(--cream);border:1px solid var(--line);
    border-radius:18px;padding:64px 68px;margin:0 0 26px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 10px 34px rgba(29,42,68,.07);
  }
  .slide .kicker{font-family:'Montserrat';font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;font-size:12px;color:var(--rose);margin-bottom:20px}
  h1,h2,h3{font-family:'Cabin',sans-serif;line-height:1.08;color:var(--navy);font-weight:700}
  h1{font-size:50px;letter-spacing:-.01em}
  h2{font-size:36px;letter-spacing:-.01em}
  h3{font-size:23px}
  p{font-weight:300;font-size:18px;line-height:1.62;color:#2c2a30;margin-top:16px;max-width:60ch}
  .lead{font-size:21px;font-weight:400;color:#36333b}
  .big{font-size:22px}
  ul{margin:20px 0 0 0;padding:0;list-style:none}
  li{font-weight:400;font-size:18px;line-height:1.5;color:#2c2a30;padding:11px 0 11px 30px;
    position:relative;border-bottom:1px solid var(--line);max-width:62ch}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;
    border-radius:50%;background:var(--rose)}
  .num{font-family:'Cabin';font-weight:700;color:var(--blush);font-size:15px}
  /* dark section slides */
  .slide.dark{background:var(--navy);border-color:var(--navy)}
  .slide.dark h1,.slide.dark h2,.slide.dark h3{color:var(--cream)}
  .slide.dark p{color:#cfd4df}
  .slide.dark .kicker{color:var(--blush)}
  .slide.dark .lead{color:#e7e9ef}
  /* title */
  .title h1{font-size:60px;margin-top:6px}
  .title .sub{font-size:21px;font-weight:300;color:#4a4752;margin-top:22px;max-width:56ch}
  .brandrow{display:flex;align-items:center;gap:14px;margin-top:40px;
    padding-top:22px;border-top:1px solid var(--line)}
  .brandrow .who{font-family:'Cabin';font-weight:600;color:var(--navy);font-size:17px}
  .brandrow .biz{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:600}
  /* phase cycle */
  .cycle{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-top:34px}
  .phase{background:#fffdf9;border:1px solid var(--line);border-radius:14px;padding:22px 20px}
  .phase .pn{font-family:'Cabin';font-weight:700;font-size:13px;color:var(--rose);letter-spacing:.08em;text-transform:uppercase}
  .phase h3{font-size:19px;margin-top:8px}
  .phase p{font-size:14px;margin-top:9px;line-height:1.5}
  .pill{display:inline-block;background:var(--blush);color:#8a2b47;font-weight:600;
    font-size:13px;letter-spacing:.04em;border-radius:999px;padding:6px 15px;margin-top:4px}
  .quote{font-family:'Cabin';font-weight:600;font-size:30px;line-height:1.3;color:var(--cream);max-width:20ch}
  .disc{font-size:13px;color:#8a8690;font-weight:300;margin-top:26px;line-height:1.5;max-width:64ch}
  .ctabox{margin-top:30px;display:flex;gap:14px;flex-wrap:wrap}
  .ctabox .step{background:#fffdf9;border:1px solid var(--line);border-radius:12px;padding:16px 20px;font-size:15px;font-weight:500;color:var(--navy)}
  .ctabox .step span{display:block;font-size:12px;color:var(--rose);font-weight:600;text-transform:uppercase;letter-spacing:.1em;margin-bottom:5px}
  .foot{position:absolute;bottom:22px;left:68px;right:68px;display:flex;justify-content:space-between;
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:#b7b2a6}
  .slide.dark .foot{color:#6f7890}
  @media(max-width:720px){
    .slide{padding:40px 28px;min-height:auto}
    h1{font-size:36px}.title h1{font-size:40px}h2{font-size:28px}
    .cycle{grid-template-columns:1fr 1fr}.foot{display:none}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass', h:'The 4 Phases of Finance and Flow',
   sub:'How heart-led business owners make calm, confident money decisions by working with their natural energy instead of against it.',
   who:'Lia Loewenthal', biz:'Get Comfy With Money'},

  {t:'who', k:'Who this is for', h:'You did not start a business to dread your own numbers.',
   p:'You are a heart-led, purpose-driven business owner. You care deeply about your work and the people you serve. But money admin gets pushed to the bottom of the list, pricing conversations make you shrink, and the spreadsheet only comes out when something feels wrong.',
   lead:'This is for the owner who wants money to feel like a tool for freedom, not a monthly source of stress.'},

  {t:'dark', k:'The trap', quote:'You were told to push the same amount, every single day.',
   p:'Hustle culture treats your capacity like a flat line. Show up hard on Monday, show up just as hard every other day, forever. But your energy is not a flat line, and neither is the way money actually moves through a business. When you force a cycle to behave like a straight line, money becomes a fight.'},

  {t:'reframe', k:'The reframe', h:'Your finances have a rhythm. Most owners just never learned to read it.',
   p:'There are weeks when you are built to dream and plan. Weeks when you are built to create. Weeks when you are built to connect and sell. And weeks when you are built to slow down, reconcile and reflect. When your money work matches that rhythm, the admin stops feeling like punishment and the decisions get clearer.',
   lead:'That rhythm is what this masterclass will teach you to use on purpose.'},

  {t:'problem', k:'Part one, the core problem', h:'Money avoidance is not a discipline problem.',
   list:[
     'It is an energy problem. You try to do visionary budgeting on a day your body wants to rest, and call yourself lazy when it does not land.',
     'It is a mindset problem. The emotional weight you carry about money gets in the way long before the maths does.',
     'It is a timing problem. Nobody taught you that there is a right season to raise prices, a right season to plan, and a right season to simply tidy up.'
   ]},

  {t:'cost', k:'What it costs', h:'The quiet price of doing money at the wrong time.',
   list:[
     'You undercharge, because you set prices on a day you felt small.',
     'You avoid your accounts until tax time, then pay for it in stress and scramble.',
     'You make big financial decisions reactively, instead of from a plan you trust.',
     'You stay busy, but your business never quite supports the life you wanted it to.'
   ]},

  {t:'myth', k:'The flat-calendar myth', h:'Willpower is not the missing piece. Timing is.',
   p:'Most money advice hands you a system and tells you to run it identically every week. Then when your real energy dips and the system slips, you blame yourself. The problem was never your discipline. It was asking the same brain to dream, sell, and reconcile all on the same Tuesday. Match the task to the season and the willpower you were missing turns out to have been there all along.',
   lead:'You do not need more force. You need better timing.'},

  {t:'dark', k:'Part two, the method', quote:'So here is the whole system, in four phases.',
   p:'The 4 Phases of Finance and Flow is the method I use with my 1:1 clients to sync money work to natural energy. Each phase has its own job. You stop asking your money brain to do everything at once.'},

  {t:'cycle', k:'The framework', h:'The 4 Phases of Finance and Flow',
   phases:[
     {n:'Phase 1', h:'Initiate', p:'Dream, set your financial goals and targets, plan and budget with intention. This is where the next season gets designed.'},
     {n:'Phase 2', h:'Build', p:'Open, creative energy. Create new content and offers, start projects, do the work that needs fresh thinking.'},
     {n:'Phase 3', h:'Connect', p:'Verbal and social energy. Initial consults, pricing conversations, selling and visibility. The season to be seen.'},
     {n:'Phase 4', h:'Reflect', p:'Slow down. Reconcile your numbers, review what worked, tend the admin, and integrate the lesson before you begin again.'}
   ]},

  {t:'phase', k:'Phase one', h:'Initiate: plan when you are built to dream.',
   p:'Most owners try to budget and set targets in a reactive panic. In the Initiate phase you do it from vision, not fear. You decide what the money is for, set the targets, and build the budget that makes them real. Everything downstream gets easier because the direction is already chosen.',
   pill:'Set goals · build the budget · design the season'},

  {t:'phase', k:'Phase two', h:'Build: create when your thinking is open.',
   p:'There is a stretch where your energy is expansive and ideas come easily. This is the phase to build the offers, write the content, and start the projects that need fresh thinking, before any pressure to sell them. When you create in the Build phase, the work is better and it does not cost you double the effort.',
   pill:'New offers · content · projects'},

  {t:'phase', k:'Phase three', h:'Connect: price and sell when you are built to be seen.',
   p:'Pricing is not a spreadsheet exercise, it is a conversation you have to be ready for. In the Connect phase you lean into the weeks where your energy is verbal and social: you take the consults, have the pricing conversations, and sell from confidence instead of apology. This is where my 5 Pricing Power Moves live.',
   pill:'Consults · pricing conversations · visibility'},

  {t:'phase', k:'Phase four', h:'Reflect: reconcile when you are built to rest.',
   p:'The admin you have been dreading belongs here, not everywhere. In the Reflect phase you slow down on purpose: reconcile the numbers, look calmly at what the month actually did, tend the invoicing and expenses, and carry one lesson forward. Done in its own season, the money admin stops feeling like a punishment.',
   pill:'Reconcile · review · tidy the admin'},

  {t:'mindset', k:'The layer underneath', h:'The numbers matter. But so does the person looking at them.',
   p:'You can have the perfect plan and still freeze when it is time to act, because of what money has come to mean to you. So the method carries a mindset layer in every phase. We lift the emotional burden you have been carrying about money, so that you can actually use the plan you made.',
   lead:'Confidence is not a personality trait. It is what happens when the work finally fits how you are built.'},

  {t:'pricing', k:'Pricing, specifically', h:'Value your passion projects and your paid work equally.',
   p:'Most owners price the work they love as if it were worth less, then wonder why the business does not hold them up. In the Connect phase we use the 5 Pricing Power Moves to set prices that reflect the real value you deliver, and to have the money conversation without flinching. Pricing from confidence, in the right season, changes what the whole business can carry.',
   pill:'5 Pricing Power Moves'},

  {t:'practice', k:'Part three, in practice', h:'What one month looks like with the phases.',
   list:[
     'Initiate week: you open the month with your targets and a budget you believe in.',
     'Build week: you make the offers and content the season needs, without forcing sales talk too early.',
     'Connect week: you book the consults and have the pricing conversations, on purpose, when you have the energy for them.',
     'Reflect week: you reconcile, review the numbers calmly, and carry the lesson into next month.'
   ]},

  {t:'who-me', k:'Why me', h:'I built this because I needed it first.',
   p:'I was a struggling entrepreneur with no real direction and over twenty-seven thousand pounds of credit-card debt. In the process of teaching myself everything about money and business, I became so confident about my own finances that I cleared the debt completely, bought a home, and built a business that supports the life I actually want. I am like a money doula for my clients now: gentle, but experienced, through all of it.',
   lead:'Get Comfy With Money exists so you do not have to learn it the hard way, alone.'},

  {t:'cta', k:'Work with me', h:'Let us make your money feel comfortable.',
   p:'If the four phases made something click, here is how we can work together.',
   steps:[
     {s:'Start free', t:'Join Finance & Chill, my free monthly accountability session.'},
     {s:'Go deeper', t:'Book a Money Date, a half-day intensive on your business finances.'},
     {s:'Go all in', t:'1:1 mentoring to build your finance-and-flow rhythm for good.'}
   ],
   disc:'This masterclass is educational and reflects one approach to money management. It is not financial, tax or investment advice, and it makes no guarantee of income or business results. Please seek your own independent advice before making financial decisions.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='dark'?' dark':'') + (s.t==='title'?' title':'');
  let html = '';
  if(s.k) html += `<div class="kicker">${s.k}</div>`;
  if(s.quote) html += `<div class="quote">${s.quote}</div>`;
  if(s.h) html += `<h1>${s.h}</h1>`;
  if(s.lead) html += `<p class="lead">${s.lead}</p>`;
  if(s.p) html += `<p>${s.p}</p>`;
  if(s.sub) html += `<div class="sub">${s.sub}</div>`;
  if(s.pill) html += `<div><span class="pill">${s.pill}</span></div>`;
  if(s.list){ html += '<ul>'; s.list.forEach(x=>html+=`<li>${x}</li>`); html+='</ul>'; }
  if(s.phases){ html += '<div class="cycle">'; s.phases.forEach(ph=>{
    html += `<div class="phase"><div class="pn">${ph.n}</div><h3>${ph.h}</h3><p>${ph.p}</p></div>`;
  }); html+='</div>'; }
  if(s.steps){ html += '<div class="ctabox">'; s.steps.forEach(st=>{
    html += `<div class="step"><span>${st.s}</span>${st.t}</div>`;
  }); html+='</div>'; }
  if(s.who){ html += `<div class="brandrow"><div><div class="who">${s.who}</div><div class="biz">${s.biz}</div></div></div>`; }
  if(s.disc) html += `<div class="disc">${s.disc}</div>`;
  html += `<div class="foot"><span>Get Comfy With Money</span><span>The 4 Phases of Finance and Flow</span></div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
