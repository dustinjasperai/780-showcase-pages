<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach the Future Self, Not the Problem — a live masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1fa;
    --panel:#ffffff;
    --ink:#2c2e3f;
    --rule:#e4dff0;
    --accent:#f2bf78;
    --dim:#6b6a7a;
    --head:'Manrope',system-ui,sans-serif;
    --body:'Nunito Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:20px;
    padding:64px 66px;margin:22px 0;min-height:540px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
    box-shadow:0 18px 50px rgba(44,46,63,.06);
  }
  .num{position:absolute;top:26px;right:30px;font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:.14em;color:var(--accent)}
  .kick{font-family:var(--head);font-size:15px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:58px;line-height:1.06;letter-spacing:-.015em}
  h2{font-family:var(--head);font-weight:700;font-size:42px;line-height:1.12;letter-spacing:-.01em}
  .lead{font-size:24px;line-height:1.5;color:var(--dim);margin-top:24px;max-width:44ch}
  .body{font-size:23px;line-height:1.55;margin-top:20px;max-width:52ch}
  .body strong{color:var(--ink);font-weight:700}
  ul{margin-top:26px;list-style:none;display:flex;flex-direction:column;gap:16px}
  li{font-size:22px;line-height:1.45;padding-left:40px;position:relative;max-width:52ch}
  li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;
    background:var(--accent);box-shadow:0 0 0 4px rgba(242,191,120,.22)}
  .big{font-family:var(--head);font-weight:800;font-size:74px;line-height:1.02;letter-spacing:-.02em}
  .big .strike{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:6px}
  .big .a{color:var(--accent);font-style:italic}
  .part-n{font-family:var(--head);font-weight:800;font-size:120px;line-height:1;color:var(--accent);opacity:.9}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px}
  .cell{border:1.5px solid var(--rule);border-radius:14px;padding:24px 26px;background:var(--bg)}
  .cell .t{font-family:var(--head);font-weight:700;font-size:20px}
  .cell .d{font-size:18px;color:var(--dim);margin-top:8px;line-height:1.4}
  .horizon{margin-top:44px;display:flex;align-items:center;gap:0}
  .dot{width:15px;height:15px;border-radius:50%;background:var(--ink)}
  .dot.future{background:var(--accent);box-shadow:0 0 0 6px rgba(242,191,120,.25)}
  .line{flex:1;height:3px;background:linear-gradient(90deg,var(--ink),var(--accent))}
  .tag{font-family:var(--head);font-size:15px;font-weight:700;letter-spacing:.06em;color:var(--dim)}
  .tag.f{color:var(--accent)}
  .cred{display:flex;flex-wrap:wrap;gap:14px;margin-top:30px}
  .pill{font-family:var(--head);font-weight:700;font-size:19px;padding:12px 20px;border-radius:100px;background:var(--bg);border:1.5px solid var(--rule)}
  .pill .a{color:var(--accent)}
  .cta-btn{align-self:flex-start;margin-top:34px;font-family:var(--head);font-weight:700;font-size:22px;color:var(--ink);background:var(--accent);border-radius:100px;padding:18px 34px}
  .disc{font-size:15px;color:var(--dim);margin-top:30px;line-height:1.5;max-width:62ch}
  .foot{font-family:var(--head);font-size:15px;font-weight:600;color:var(--dim);margin-top:38px;letter-spacing:.02em}
  @media(max-width:640px){.slide{padding:40px 30px;min-height:420px}h1{font-size:40px}h2{font-size:30px}.big{font-size:48px}.part-n{font-size:80px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for coaches',
   h:'Coach the Future Self, Not the Problem',
   lead:'How the Future Self Design™ method turns a good coaching session into an identity-level shift. Live, with Lauren LeMunyan, MCC.'},

  {t:'promise', kick:'What you will leave with',
   h:'One method, three shifts',
   items:['A way to move a client from problem-solving to real possibility','The exact question that surfaces a client\'s future self','A repeatable session shape you can use in your very next call']},

  {t:'who', kick:'Who this is for',
   h:'Coaches who are good, and want to be undeniable',
   items:['ACC and PCC coaches deepening their craft','Newer coaches who want a method, not just instincts','Any coach whose sessions keep circling the same problem']},

  {t:'trap', kick:'The trap',
   h:'You solve the problem. It comes back anyway.',
   body:'You are good at this. You listen, you reflect, you help your client crack the problem in front of them. Then next session, a new version of the same problem walks in the door. The work feels busy. It does not feel like it is <strong>changing who your client is</strong>.'},

  {t:'hook', kick:'The reframe',
   big:'The problem was <span class="strike">the point.</span> <span class="a">never</span>'},

  {t:'hook2', kick:'The reframe',
   h:'A problem is a symptom of an identity',
   body:'People do not stay stuck because they lack a solution. They stay stuck because the person they are being cannot hold the solution yet. Coach the <strong>problem</strong> and you get a better week. Coach the <strong>future self</strong> and you get a different person.'},

  {t:'part', n:'01', kick:'Part one', h:'Why problem-first coaching stalls'},

  {t:'content', kick:'Problem-oriented thinking',
   h:'The frame decides the ceiling',
   body:'Problem-oriented coaching asks "how do we fix this?" It keeps the client at the center of the problem, negotiating with it. The client leaves relieved, not <strong>changed</strong>. The ceiling of the session is the size of the problem.'},

  {t:'content', kick:'Possibility-oriented thinking',
   h:'Start from who they are becoming',
   body:'Possibility-oriented coaching asks "who are you the day this is already behind you, and what does she do?" The problem does not disappear. It gets <strong>smaller than the person</strong>. That is the whole move, and it is teachable.'},

  {t:'part', n:'02', kick:'Part two', h:'The Future Self Design™ method'},

  {t:'framework', kick:'The method',
   h:'Six competencies, one shift',
   cells:[
     {t:'Possibility over problem',d:'Move the client from fixing to becoming.'},
     {t:'Intuition as a tool',d:'Use your read of the room on purpose, not by accident.'},
     {t:'Identity-level agreements',d:'Build agreements the future self would keep.'},
     {t:'The 9 session hurdles',d:'Name and navigate the moments a session stalls.'},
     {t:'Locate the client',d:'Know exactly where they are before you move.'},
     {t:'Anchor small actions',d:'Tie tiny steps to the future-self identity.'}]},

  {t:'pillar', kick:'Competency one', h:'Possibility over problem',
   body:'The first shift is a language shift. You stop asking what is wrong and start asking what is <strong>possible for the person they are becoming</strong>. The client hears themselves answer as that person. The session changes register in one question.'},

  {t:'pillar', kick:'Competency three', h:'Identity-level agreements',
   body:'Most action steps are made by the current self, who is exactly the person who has not done them. A Future Self Design agreement is made <strong>from the future self</strong>. It sticks because it belongs to the person the client is stepping into, not the one they are leaving.'},

  {t:'pillar', kick:'Competency four', h:'Navigate the 9 hurdles',
   body:'Sessions do not stall randomly. There are nine recognizable moments where a client protects the old identity: the deflection, the false urgency, the "yes but," and six more. When you can <strong>name the hurdle in the moment</strong>, you stop coaching in the dark.'},

  {t:'pillar', kick:'Competency six', h:'Anchor small actions to the future self',
   body:'The smallest action, tied to identity, outperforms the biggest action tied to willpower. You help the client choose one move their future self would obviously make, and you <strong>anchor it to her, not to the goal</strong>. Momentum becomes evidence of who they are now.'},

  {t:'part', n:'03', kick:'Part three', h:'Inside a Future Self Design session'},

  {t:'look', kick:'The arc',
   h:'From the problem in the room to the person leaving it',
   horizon:true,
   body:'You start where the client is: the present self, holding the problem. You surface the future self, coach from her, and build one identity-level agreement. The client leaves as <strong>a slightly different person</strong>, not just a person with a plan.'},

  {t:'whyme', kick:'Who is teaching this',
   h:'Lauren LeMunyan, MCC',
   body:'Master Certified Coach, the ICF\'s highest credential, with 4,000+ certified coaching hours. Creator of the Future Self Design™ method and host of The Spitfire Podcast. This is the method behind every session, taught in the open.',
   pills:['<span class="a">MCC</span> · Master Certified Coach','4,000+ <span class="a">coaching hours</span>','Creator, <span class="a">Future Self Design™</span>','Host, <span class="a">The Spitfire Podcast</span>']},

  {t:'recap', kick:'The one idea',
   big:'Coach the <span class="a">future self.</span> The problem takes care of itself.'},

  {t:'cta', kick:'Your next step',
   h:'Practice the method with me, live',
   body:'The Future Self Design™ Coach Training is a live cohort: three working sessions and a private mentor hour, worth 13 ICF CCE credits. Small on purpose. Apply for the next cohort and bring a real client puzzle.',
   btn:'Apply for the next cohort',
   disc:'Educational only. No specific coaching outcome or client result is guaranteed. Results vary by coach, client, and effort. Future Self Design™ is a trademark of Lauren LeMunyan.'}
];

function render(){
  const root = document.getElementById('deck');
  S.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide';
    let inner = `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
    if (s.kick) inner += `<div class="kick">${s.kick}</div>`;
    if (s.big) inner += `<div class="big">${s.big}</div>`;
    if (s.part_dummy) {}
    if (s.n) inner += `<div class="part-n">${s.n}</div>`;
    if (s.h && i===0) inner += `<h1>${s.h}</h1>`;
    else if (s.h) inner += `<h2>${s.h}</h2>`;
    if (s.lead) inner += `<div class="lead">${s.lead}</div>`;
    if (s.body) inner += `<div class="body">${s.body}</div>`;
    if (s.items){ inner += '<ul>' + s.items.map(x=>`<li>${x}</li>`).join('') + '</ul>'; }
    if (s.cells){ inner += '<div class="grid">' + s.cells.map(c=>`<div class="cell"><div class="t">${c.t}</div><div class="d">${c.d}</div></div>`).join('') + '</div>'; }
    if (s.horizon){ inner += `<div class="horizon"><span class="dot"></span><span class="line"></span><span class="dot future"></span></div><div class="horizon" style="margin-top:10px"><span class="tag">Present self · the problem</span><span style="flex:1"></span><span class="tag f">Future self · the shift</span></div>`; }
    if (s.pills){ inner += '<div class="cred">' + s.pills.map(p=>`<span class="pill">${p}</span>`).join('') + '</div>'; }
    if (s.btn) inner += `<div class="cta-btn">${s.btn}</div>`;
    if (s.disc) inner += `<div class="disc">${s.disc}</div>`;
    if (i===0) inner += `<div class="foot">Future Self Design™ · Lauren LeMunyan, MCC · Spitfire Coach</div>`;
    el.innerHTML = inner;
    root.appendChild(el);
  });
}
render();
</script>
</body>
</html>
