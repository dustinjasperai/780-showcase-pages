<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Run Your Business Without Running Yourself Into the Ground · Rebecca Wood</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Figtree:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#17131a; --panel:#211a26; --rule:#3a2f42;
    --accent:#e0475f; --gold:#c9a24b;
    --ink:#f4efe9; --ink-soft:#d8cfce; --dim:#a99fb0;
  }
  html,body{height:100%}
  body{background:#0f0c12;font-family:'Figtree',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f0c12}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Figtree',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Instrument Serif',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.08;letter-spacing:.002em}
  .t-title h1{font-size:5.4vw}
  .t-normal h1{font-size:3.9vw;max-width:88%}
  .t-normal .body{font-family:'Figtree',sans-serif;font-size:1.48vw;color:var(--ink-soft);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-family:'Figtree',sans-serif;font-size:1.72vw;color:var(--ink-soft);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Figtree',sans-serif;font-size:1.3vw;font-weight:700;color:var(--gold);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:90%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 130% at 50% 0%,#2a1622 0%,#140f18 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.3vw;max-width:88%;color:#fdf2f2}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#4a1e2c 0%,#170f16 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.6vw;max-width:84%;color:#fdf2f2}
  .t-cta .kicker{color:#f0a9b4}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid #e0879440;color:#f4d9de;border-radius:100px;padding:1.3vh 1.7vw;font-family:'Figtree',sans-serif;font-size:1.2vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Figtree',sans-serif;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#b7889a}
  .t-title .disc,.t-normal .disc{text-align:left}
  .vessel-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-vessel{right:7.5%;bottom:9%;width:20vw}
  .corner-vessel{right:6%;bottom:7.5%;width:8.5vw;opacity:.55}
  .brandline{font-family:'Figtree',sans-serif;font-size:1.3vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:500;letter-spacing:.06em}
  .brandline b{color:var(--accent);font-weight:700}
  .pillars{display:flex;gap:1.4vw;margin-top:3.4vh;flex-wrap:wrap}
  .pillar{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--gold);border-radius:6px;padding:2vh 1.6vw;font-family:'Figtree',sans-serif;font-size:1.24vw;font-weight:600;color:var(--ink)}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(244,239,233,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Figtree',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Figtree',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Figtree',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:6.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8vw}.t-dark h1{font-size:6.6vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.6vw}.pillar{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">REBEL25</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- a vessel that refills from empty to whole: the run-on-empty vs run-whole through-line -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vessel" viewBox="0 0 200 160">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M56 26 H144 L134 132 A16 16 0 0 1 118 146 H82 A16 16 0 0 1 66 132 Z" stroke="#e0475f" opacity="0.55"/>
    <path d="M70 96 H130 L124 130 A12 12 0 0 1 112 140 H88 A12 12 0 0 1 76 130 Z" fill="#e0475f" opacity="0.85" stroke="none"/>
    <path d="M74 78 H126" stroke="#c9a24b" opacity="0.8" stroke-dasharray="2 7"/>
    <path d="M92 12 V22 M100 8 V22 M108 12 V22" stroke="#c9a24b" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Run Your Business Without Running Yourself Into the Ground',sub:'A live masterclass for salon and spa owners on growing the business while healing the person running it.',brand:true,vessel:'title'},

 {t:'normal',k:'Who this is for',title:'The salon is full. You are empty.',body:'You are booked out, the team is busy, the clients are happy. And you are quietly running on nothing, saying yes to everyone, wondering why more work has not turned into more freedom. You built this to feel free, not trapped inside it.'},
 {t:'dark',title:'You do not have a business problem. You have a running-on-empty problem.'},

 {t:'section',idx:'Part One',title:'Running On Empty'},
 {t:'normal',k:'Why working harder stops working',title:'You cannot out-work a nervous system that is already maxed out.',body:'When the tank is empty, more hours just borrow against tomorrow. The decisions get reactive, the resentment builds, and the business starts to feel like the thing doing this to you. Harder is not the lever. Full is.'},
 {t:'normal',k:'The quiet cost',title:'The weight follows you home.',body:'Payroll, the difficult client, the staff member who needs a conversation, the pricing you keep avoiding. Owners carry all of it after the doors close. It is a heavy way to run something you built to help people feel good.'},
 {t:'dark',title:'Burnout is not weakness. It is data. It is telling you the way you are running this cannot hold.'},

 {t:'section',idx:'Part Two',title:'The Boundaries You Never Set'},
 {t:'normal',k:'Built out of saying yes',title:'You grew this by saying yes. It is now the thing draining you.',body:'The late replies, the discounts to keep the peace, the hours you give away, the standards you hold for everyone but yourself. None of it is a character flaw. It is a set of boundaries that were never drawn, and they can be drawn now.'},
 {t:'normal',k:'Holding the line',title:'Set it once, hold it without guilt.',body:'A boundary is not a wall you throw up in anger. It is a decision you make in advance and keep calmly, so the team learns the new normal and you stop paying for the old one. The guilt fades faster than you think.'},
 {t:'dark',title:'The business can only hold as much as the owner does. Widen the owner and the business widens.'},

 {t:'section',idx:'Part Three',title:'Money From Worth, Not Fear'},
 {t:'normal',k:'Feminine financial power',title:'Your prices were set by your story, not your value.',body:'Discounting from guilt, undercharging to feel safe, avoiding the numbers because they make you anxious. These are money stories, not maths. Name the story and the price can finally move to match the work you actually do.'},
 {t:'normal',k:'Deciding differently',title:'Make the money decisions from full, not from fear.',body:'When you are rested and clear, you raise the price, you hire the help, you stop the leak. When you are empty, you avoid all three. The order matters. Heal the person, then the money decisions get easier to make and to keep.'},
 {t:'dark',title:'You cannot charge what you are worth while a quiet part of you is not sure you are worth it.'},

 {t:'section',idx:'Part Four',title:'Running Whole'},
 {t:'normal',k:'What full looks like',title:'A business that fits the life, not one you perform for.',body:'Whole is not a spa day bolted onto the same overwhelm. It is boundaries that hold, prices that match, a team that owns the day, and an owner who is in the room instead of running on fumes. That is when growth stops costing you yourself.'},
 {t:'dark',title:'Grow the business and keep yourself. That is the whole point, and it is the whole method.'},

 {t:'section',idx:'Your next step',title:'Where this goes next'},
 {t:'normal',k:'How the work runs',title:'From running on empty to running whole.',pillars:['Rebel Six: six weeks to steady','REBEL25: the twelve month mentorship','Support, structure, space to rise'],body:'Rebel Six gives you the support, structure and space to rise without doing it alone. REBEL25 is the twelve month mentorship that keeps you steady while you rebuild the business around a person who is no longer running on empty.'},
 {t:'normal',k:'Why me',title:'Mentor, rebel, survivor, and done staying silent.',body:'I built and ran the business, hit the wall, and came back knowing the strategy was never the missing piece. REBEL25 exists because too many capable women are quietly burning out inside businesses they built to feel free. I mentor the owner and the business at the same time, because they were never separate.'},
 {t:'cta',title:'Ready to run your business without running yourself into the ground?',chips:['Start with Rebel Six','Step into REBEL25 mentorship'],disc:'Educational and personal-development content for salon, spa and service-business owners. No income, revenue, or business result is guaranteed. Outcomes vary by owner, business, and circumstances.'},
];

const deck=document.getElementById('deck');
function vessel(kind){return `<svg class="vessel-motif ${kind==='title'?'title-vessel':'corner-vessel'}"><use href="#vessel"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.pillars) h+=`<div class="pillars">`+s.pillars.map(p=>`<div class="pillar">${p}</div>`).join('')+`</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">REBEL<b>25</b> · Rebecca Wood</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vessel) h+=vessel(s.vessel);
  else if(s.t==='title') h+=vessel('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
