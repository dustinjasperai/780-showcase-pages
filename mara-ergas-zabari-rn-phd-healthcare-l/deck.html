<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Without Burning Out — The Inspired Healthcare Leader Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6ee;        /* warm off-white ground, from brand.json light scheme */
    --panel:#f3e7d4;     /* soft amber tint */
    --ink:#362117;       /* espresso brown, the site's only dark */
    --muted:#6f5a48;     /* muted brown */
    --accent:#f79e00;    /* brand amber, verbatim from brand.json */
    --head:'Cabin',system-ui,sans-serif;
    --body:'Raleway',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--bg);border:1px solid #e7d7bf;border-radius:14px;padding:48px 44px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 #efe2cd}
  .slide.sect{background:var(--panel)}
  .slide.title{background:var(--ink);color:var(--bg)}
  .slide.cta{background:var(--panel)}
  .eyebrow{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:16px}
  .title .eyebrow{color:var(--accent)}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin-bottom:16px}
  h3{font-family:var(--head);font-weight:600;font-size:22px;margin-bottom:10px}
  p{font-size:19px;margin-bottom:12px;max-width:62ch}
  p.lead{font-size:22px;color:var(--muted)}
  .pillar{display:inline-block;font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
  ul{margin:8px 0 8px 22px}
  li{font-size:19px;margin-bottom:10px;max-width:60ch}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:4px 0 20px}
  .present{font-family:var(--head);font-weight:600;font-size:18px;color:var(--bg);margin-top:26px}
  .present span{color:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:70ch}
  .next{font-family:var(--head);font-weight:600;font-size:20px;color:var(--ink);margin-top:10px}
  .num{position:absolute;right:20px;bottom:14px;font-size:12px;color:var(--muted);font-family:var(--head)}
  .slide{position:relative}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass',h1:'Lead Without Burning Out',p:'How frontline healthcare leaders hold the team together through chaos, without losing themselves in the process.',present:'The Inspired Healthcare Leader Masterclass with <span>Mara Ergas-Zabari, RN, PhD</span>'},
 {t:'content',eyebrow:'Who this is for',h2:'If you lead people and results at the same time',p:'Charge nurses, unit managers, directors, and clinical leads. The ones responsible for both the patients and the people, who feel the weight of both every shift.',p2:'If that is you, this hour is built for you.'},
 {t:'content',eyebrow:'The trap',h2:'You are working nonstop, and it still feels chaotic',bullets:['You plan and plan, and the unit stays unpredictable.','You are always working, yet the team feels like you are never around.','You carry the hard conversations alone, and they keep repeating.'],p:'More hours have stopped buying more control. That is the signal most leaders miss.'},
 {t:'content',eyebrow:'The reframe',h2:'Burnout is not a stamina problem',p:'The usual answer is resilience training, wellness days, a push to toughen up. That treats the symptom.',p2:'The leaders who recover their energy do something different. They change what the work means, not how hard they grind at it.'},
 {t:'sect',eyebrow:'Part one',h2:'The real problem underneath burnout'},
 {t:'content',eyebrow:'Part one',h2:'A depleted team is a disconnected team',p:'When clinicians lose the line between their daily tasks and why those tasks matter, the work turns into a checklist. Checklists exhaust people. Purpose sustains them.',p2:'Your job as the leader is not to carry everyone. It is to keep that line visible.'},
 {t:'content',eyebrow:'Part one',h2:'Three forces every frontline leader is fighting',bullets:['Complexity: healthcare teams change faster than any fixed plan can hold.','Silence: people stop speaking up long before they stop caring.','Drift: the mission fades into the backlog, and meaning goes with it.']},
 {t:'sect',eyebrow:'Part two',h2:'The three shifts that change how your team leads'},
 {t:'content',pillar:'Shift one',h2:'Psychological safety comes first',p:'When clinicians feel safe, heard, and fulfilled, patients receive the best care. It takes courage to speak up, and only a psychologically safe environment lets every voice be heard.',p2:'Safety is not softness. It is the condition that makes everything else possible.'},
 {t:'content',pillar:'Shift one',h2:'What building safety actually looks like',bullets:['You make it normal to name a problem without naming a villain.','You respond to the first hard truth in a way that invites the second.','You protect the quietest voice in the room on purpose.']},
 {t:'content',pillar:'Shift two',h2:'Meaning is the antidote to burnout',p:'Connecting to meaning and purpose is the antidote to burnout. Not a retreat, not a resilience course. A reconnection to why this work is worth doing.',p2:'When a stretched team remembers what the work is for, the same workload stops costing the same energy.'},
 {t:'content',pillar:'Shift two',h2:'How to put meaning back into a hard week',bullets:['Tie one concrete win back to a patient or a colleague it served.','Name the purpose out loud before you hand out the tasks.','Make reflection a habit of the unit, not a once-a-year survey.']},
 {t:'content',pillar:'Shift three',h2:'Leadership is required of everyone',p:'Leadership is required of everyone regardless of role. The frontline leader who tries to hold all of it alone is the one who burns out first.',p2:'Your real work is growing leadership capacity across the whole team, so the load is shared, not stacked on you.'},
 {t:'content',pillar:'Shift three',h2:'Sharing the load without losing the standard',bullets:['Hand real decisions down, not just tasks.','Coach in the moment instead of rescuing after the fact.','Let people own outcomes, and let them own the learning too.']},
 {t:'content',eyebrow:'The lens',h2:'Lead change like a living system, not a plan',p:'A healthcare team is a complex adaptive system. If it is not changing, it is stagnating or declining. You cannot script it into place.',p2:'You lead change with a direction and a feedback loop, not a rigid plan that breaks on contact with a real shift.'},
 {t:'sect',eyebrow:'Part three',h2:'A steadier unit, and a steadier you'},
 {t:'content',eyebrow:'Part three',h2:'The psychologically safe unit, in practice',bullets:['People raise concerns early, while they are still small.','The hard conversations happen once, not on a loop.','The team recovers from a bad week instead of carrying it for months.'],p:'The leader is steadier, more present, and far less depleted.'},
 {t:'content',eyebrow:'Why me',h2:'I have led these teams, and I have studied why they break',p:'I am a registered nurse and a PhD, and I have spent decades leading healthcare teams and developing frontline leaders. The Inspired Healthcare Leader podcast is where I share what actually helps when you are responsible for both people and results.',p2:'This masterclass is that work, distilled into one hour you can use on Monday.'},
 {t:'content',eyebrow:'Recap',h2:'Three shifts, one outcome',bullets:['Build safety first, so the truth can surface.','Lead with meaning, so the work sustains the team.','Grow leaders at every level, so the load is shared.'],p:'That is how you lead without burning out.'},
 {t:'cta',eyebrow:'Your next step',h2:'Let us talk about your team',p:'If this is the way you want to lead, the next step is a free connection call. An informal, no pressure conversation about where you are and where you want to go as a leader.',next:'Book a free connection call at maraergaszabari.com',disc:'This masterclass is educational. It shares leadership principles and reflects one leader's experience and research. It is not clinical, legal, or financial advice, and it makes no guarantee of any specific result. Outcomes vary with context, team, and effort.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t||'content');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.pillar) h+='<div class="pillar">'+s.pillar+'</div>';
  if(s.h1){h+='<h1>'+s.h1+'</h1>';}
  if(s.h2){h+='<h2>'+s.h2+'</h2>';}
  if(s.t==='sect'||s.t==='title') h+='<div class="rule"></div>';
  if(s.p) h+='<p'+(s.t==='title'?' class="lead"':'')+'>'+s.p+'</p>';
  if(s.bullets){h+='<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';}
  if(s.p2) h+='<p>'+s.p2+'</p>';
  if(s.present) h+='<div class="present">'+s.present+'</div>';
  if(s.next) h+='<div class="next">'+s.next+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
