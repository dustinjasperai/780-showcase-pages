<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own Your Neighborhood — Launch Your Farm Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111827; --panel:#18212f; --rule:#2a3545;
    --accent:#37ca37; --warm:#f25c5c; --ink:#ffffff; --muted:#aab4c0;
    --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 52px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .num{position:absolute;top:22px;right:26px;font-size:12px;color:var(--muted);letter-spacing:.14em}
  .kick{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:48px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:14px}
  p{font-size:19px;line-height:1.55;color:#e7ecf1;max-width:62ch;margin-top:12px}
  p.lead{font-size:22px}
  .sub{color:var(--muted);font-size:18px;margin-top:16px}
  ul{list-style:none;margin-top:18px;display:grid;gap:12px}
  li{font-size:19px;line-height:1.4;padding-left:30px;position:relative;color:#e7ecf1}
  li:before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:14px;color:var(--bg);background:var(--accent);padding:6px 14px;border-radius:999px;margin-bottom:20px;width:max-content}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12}
  .big .a{color:var(--accent)}
  .grid7{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px;margin-top:22px}
  .cell{background:#121a26;border:1px solid var(--rule);border-radius:12px;padding:16px}
  .cell b{font-family:var(--head);color:var(--accent);display:block;font-size:17px;margin-bottom:4px}
  .cell span{font-size:14px;color:var(--muted)}
  .disc{color:var(--muted);font-size:14px;line-height:1.5;margin-top:22px;max-width:70ch}
  .cta h1{font-size:44px}
  .cta .step{font-size:20px;color:#e7ecf1;margin-top:18px}
  .foot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-family:var(--head);
    font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);background:rgba(17,24,39,.92);padding:12px;border-top:1px solid var(--rule)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="foot">Launch Your Farm — Live Masterclass</div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass with Ryan Smith', h:'Own Your Neighborhood',
   sub:'The geographic farming method that beats buying leads.'},

  {t:'who', kick:'Who this is for', h:'For the agent who is tired of renting attention.',
   p:'If you are a real estate agent who has bought leads, chased portals, and still feels invisible in your own backyard, this is for you. New to farming, stalled, or already farming and ready to scale.'},

  {t:'trap', kick:'The trap', h:'More leads was never the problem.',
   p:'You were told success is a volume game: buy more leads, make more calls, post more content. So you rented attention from Zillow and the feed. The moment you stop paying, it disappears. You are starting from zero every single month.'},

  {t:'cost', kick:'The real cost', h:'Rented attention has a meter running.',
   p:'A bought lead is a stranger who talked to four other agents the same hour. You pay again next month for the next stranger. None of it ever becomes yours. The agents who win long term stop renting attention and start owning it in one place.'},

  {t:'reframe', big:true, kick:'The reframe',
   htmlbig:'You do not need more leads. You need a neighborhood that already <span class="a">knows your name.</span>'},

  {t:'part', pill:'Part One', h:'Why most farms fail by month two.',
   p:'Agents treat farming like a campaign: a few postcards, a quick burst, then silence when nothing closes right away. Farming is not a campaign. It is a presence you build until the neighborhood cannot forget you. The agents who quit early never reach the point where it compounds.'},

  {t:'list', kick:'Part One', h:'The three mistakes that kill a farm',
   items:['Picking a neighborhood you cannot realistically win.','Going quiet the moment the first month does not produce.','Looking like every other agent instead of the one local expert.']},

  {t:'part', pill:'Part One', h:'The compounding you never reach.',
   p:'The returns on a farm are not linear. The first months feel like you are shouting into an empty street. Then recognition tips, referrals start, and the same effort produces several times the result. Quitting early means paying all the cost and collecting none of the payoff.'},

  {t:'part', pill:'Part Two', h:'The Bridge Blueprint.',
   p:'My three-phase system for turning a cold neighborhood into a farm that refers you by name. Launch, Build, Grow. Each phase has one job, and you do not skip ahead.'},

  {t:'cells3', kick:'Part Two', h:'Launch. Build. Grow.',
   cells:[['Launch','Choose the right market, set your mindset, and craft the message only you can own.'],['Build','Put the systems in: a consistent marketing cadence and a follow-up process that never drops anyone.'],['Grow','Deepen community connection, book the appointments, and scale what is working.']]},

  {t:'part', pill:'Part Two', h:'The message only you can own.',
   p:'Every agent in your farm sounds the same: just listed, just sold, call me. The local expert sounds like the neighborhood itself. You talk about the streets, the schools, the small businesses, the things only someone who lives it would know. That is the Message phase, and it is what makes you impossible to confuse with anyone else.'},

  {t:'grid7', kick:'Part Two', h:'The 7 M’s of a farm that compounds',
   cells:[['Market','Pick it right'],['Mindset','Play long'],['Message','Own a lane'],['Methods','Build systems'],['Manage','Stay consistent'],['Meet','Be present'],['Mastery','Own the market']]},

  {t:'list', kick:'Part Two', h:'The tools that do the showing up for you',
   items:['Follow-Up Mastery: a process so nobody in your farm ever goes cold.','Social Success Plan: a simple video and content cadence you can keep.','Leverage Their Listings and Business Boost: turn other agents’ activity and local partnerships into your own pipeline.']},

  {t:'part', pill:'Part Two', h:'Consistency is the whole strategy.',
   p:'The method is not clever tactics. It is showing up for one neighborhood long enough that you become the obvious choice. Follow-Up Mastery and a simple social cadence do the compounding. You are not louder than the big teams. You are more present than all of them.'},

  {t:'part', pill:'Part Three', h:'From invisible to inevitable.',
   p:'People in your farm stop seeing an agent and start seeing their agent. They wave on the street. They refer you before a sign goes up. Your pipeline stops depending on what you can buy this month and starts depending on who already trusts you.'},

  {t:'why', kick:'Why me', h:'I did this with no team and no budget.',
   p:'I moved into a brand-new market with no network. By farming one area the right way, I closed 17 transactions in 15 months without a big team, a flashy budget, or long-time connections. Then I spent years turning it into a system any agent can run.'},

  {t:'cta', kick:'Your next step', h:'Pick your farm. Own it.',
   step:'Join the Local Expert Academy and get the full Bridge Blueprint, the templates, and live coaching to launch and grow your farm.',
   disc:'Educational only. This masterclass shares a method and one agent’s experience. No specific income, listing, or business result is guaranteed, and nothing here is a promise of earnings. Results vary and depend on your market, effort, and consistency.'}
];

const host = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let inner = '<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if (s.pill) inner += '<span class="pill">'+s.pill+'</span>';
  if (s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if (s.t==='title') { inner += '<h1>'+s.h+'</h1><p class="lead sub">'+s.sub+'</p>'; }
  else if (s.big) { inner += '<div class="big">'+s.htmlbig+'</div>'; }
  else if (s.t==='list') { inner += '<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  else if (s.t==='cells3') { inner += '<h2>'+s.h+'</h2><div class="grid7">'+s.cells.map(c=>'<div class="cell"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('')+'</div>'; }
  else if (s.t==='grid7') { inner += '<h2>'+s.h+'</h2><div class="grid7">'+s.cells.map(c=>'<div class="cell"><b>'+c[0]+'</b><span>'+c[1]+'</span></div>').join('')+'</div>'; }
  else if (s.t==='cta') { inner += '<h1>'+s.h+'</h1><p class="step">'+s.step+'</p><p class="disc">'+s.disc+'</p>'; }
  else { inner += '<h2>'+s.h+'</h2>'+(s.p?'<p>'+s.p+'</p>':''); }
  el.innerHTML = inner;
  host.appendChild(el);
});
</script>
</body>
</html>
