<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Die Coaching-Haltung — Masterclass mit Julia Städtler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Heebo:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#131b1e;
    --panel:#1b262c;
    --ink:#f4f7f8;
    --ink-soft:#c3cdd2;
    --muted:#5e7682;
    --accent:#77a6ff;
  }
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:'Heebo',system-ui,sans-serif;line-height:1.6;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;}
  .slide{display:none;width:100%;max-width:980px;}
  .slide.active{display:block;animation:fade .4s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{font-family:'Oswald',sans-serif;font-weight:500;text-transform:uppercase;letter-spacing:.22em;font-size:14px;color:var(--accent);margin-bottom:22px;}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(34px,6vw,68px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:clamp(26px,4.2vw,44px);line-height:1.1;margin-bottom:20px;}
  p{font-size:clamp(17px,2vw,22px);color:var(--ink-soft);max-width:38ch;margin-bottom:16px;}
  p.lead{color:var(--ink);font-size:clamp(19px,2.3vw,26px);max-width:34ch;}
  .meta{font-family:'Oswald',sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--muted);margin-top:30px;}
  ul{list-style:none;margin-top:10px;}
  li{position:relative;padding-left:30px;font-size:clamp(17px,2vw,22px);color:var(--ink-soft);margin-bottom:16px;max-width:40ch;}
  li::before{content:"";position:absolute;left:0;top:.7em;width:14px;height:2px;background:var(--accent);}
  .arc{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;}
  .arc span{font-family:'Oswald',sans-serif;text-transform:uppercase;letter-spacing:.08em;font-size:clamp(13px,1.6vw,17px);color:var(--ink);background:var(--panel);border-left:3px solid var(--accent);padding:12px 16px;}
  .big{font-family:'Oswald',sans-serif;font-weight:700;font-size:clamp(40px,8vw,96px);color:var(--accent);line-height:1;}
  .panel{background:var(--panel);border-left:4px solid var(--accent);padding:26px 28px;margin-top:10px;}
  .disclaimer{font-size:14px;color:var(--muted);max-width:60ch;margin-top:28px;line-height:1.5;}
  .cta-line{font-family:'Oswald',sans-serif;font-weight:500;letter-spacing:.04em;color:var(--accent);font-size:clamp(19px,2.3vw,26px);margin-top:18px;}
  #nav{position:fixed;bottom:22px;right:28px;display:flex;gap:10px;align-items:center;font-family:'Oswald',sans-serif;font-size:13px;letter-spacing:.14em;color:var(--muted);}
  #nav button{background:var(--panel);color:var(--ink);border:1px solid var(--muted);font-family:'Oswald',sans-serif;font-size:14px;padding:6px 14px;cursor:pointer;letter-spacing:.1em;}
  #nav button:hover{border-color:var(--accent);color:var(--accent);}
  #count{min-width:58px;text-align:right;}
  .foot{position:fixed;bottom:22px;left:28px;font-family:'Oswald',sans-serif;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--muted);}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot">Lost &amp; Found · Julia St&auml;dtler</div>
<div id="nav">
  <button id="prev">Zur&uuml;ck</button>
  <span id="count"></span>
  <button id="next">Weiter</button>
</div>
<script>
const S = [
  {t:'title', kicker:'Masterclass', h1:'Die Coaching-Haltung', lead:'Wie du dich und dein Team durch jeden Umbruch f&uuml;hrst.', meta:'Mit Julia St&auml;dtler · Lost &amp; Found'},

  {t:'intro', kicker:'F&uuml;r wen das hier ist', h2:'Du f&uuml;hrst. Und gerade f&uuml;hlt sich vieles unklar an.', body:'F&uuml;r Gr&uuml;nder:innen und F&uuml;hrungskr&auml;fte, die nach dem Warum fragen. Du stehst an einem Umbruch, beruflich oder pers&ouml;nlich, und die alten Rezepte greifen nicht mehr.'},

  {t:'trap', kicker:'Die Falle', h2:'Die Standard-Antwort lautet: mehr Leistung.', body:'Mehr pushen, h&auml;rter durchhalten, die Zweifel wegarbeiten. In einer schnelllebigen, unvorhersehbaren Welt kostet dich genau das die Klarheit, und dein Team die Energie.'},

  {t:'reframe', kicker:'Der Reframe', h2:'Nicht mehr Leistung. Eine andere Haltung.', lead:'Umbr&uuml;che lassen sich nicht wegarbeiten. Aber mit der richtigen Haltung lassen sie sich beschleunigen und strukturieren.'},

  {t:'part', kicker:'Teil 1', h1:'Warum Umbr&uuml;che sich chaotisch anf&uuml;hlen'},

  {t:'content', kicker:'Das Nervensystem', h2:'Unsicherheit liest dein K&ouml;rper als Gefahr.', body:'Im Alarmmodus wird dein Denken eng. Du reagierst, statt zu entscheiden. Kein Mangel an Disziplin, sondern Biologie. Willenskraft allein kommt dagegen nicht an.'},

  {t:'content', kicker:'Die Kosten', h2:'Woran du es im Alltag merkst.', list:['Entscheidungen f&uuml;hlen sich z&auml;h und nebelig an','Du reagierst gereizt, wo du eigentlich f&uuml;hren willst','Die Unruhe springt auf dein Team &uuml;ber','Deine Vision verschwindet hinter der n&auml;chsten To-do-Liste']},

  {t:'part', kicker:'Teil 2', h1:'Die Coaching-Haltung'},

  {t:'content', kicker:'Das wichtigste Werkzeug', h2:'Eine Coaching-Haltung einnehmen.', body:'Selbstwirksam und l&ouml;sungsorientiert, statt reaktiv. Dir selbst gegen&uuml;ber, im Team und mit deinen Mitmenschen. Das ist das wichtigste Werkzeug f&uuml;r einen entspannten Alltag und produktive Kommunikation.'},

  {t:'content', kicker:'Die Coaching-Pyramide', h2:'Tools und Modelle, die aufeinander aufbauen.', body:'Von der Haltung &uuml;ber die richtigen Fragen bis zu den Modellen: Schritt f&uuml;r Schritt, nicht alles auf einmal. So wird aus Theorie eine Praxis, die du sofort anwendest.'},

  {t:'content', kicker:'Werkzeug 1', h2:'Fragen statt Antworten.', body:'Die st&auml;rkste F&uuml;hrungskraft gibt nicht die schnellste Antwort. Sie stellt die Frage, die den anderen, und dich selbst, ins eigene Denken bringt.'},

  {t:'content', kicker:'Werkzeug 2', h2:'Das Nervensystem regulieren.', body:'Embodiment und Achtsamkeit als Mindset-Changer. Kleine &Uuml;bungen f&uuml;r den Alltag, die dein System aus dem Alarm holen, damit dein Kopf wieder weit denken kann.'},

  {t:'content', kicker:'Werkzeug 3', h2:'Glaubens&auml;tze erkennen.', body:'Die unbewussten Regeln, die dich im Prozess schon ausbremsen, bevor du angefangen hast. Erst sichtbar, dann ver&auml;nderbar.'},

  {t:'content', kicker:'Werkzeug 4', h2:'Eine Vision bauen, ohne dich klein zu halten.', body:'Gro&szlig; denken, ohne dich vorher durch unbewusste &Auml;ngste einzuschr&auml;nken. Eine Richtung, die tr&auml;gt, auch wenn der Weg noch nicht fertig ist.'},

  {t:'part', kicker:'Teil 3', h1:'Vom Umbruch zur Klarheit'},

  {t:'arc', kicker:'Die Lost & Found Journey', h2:'F&uuml;nf Schritte, einmal durch.', arc:['Wurzeln','Blockaden','Nervensystem','Vision','Glaubens&auml;tze']},

  {t:'content', kicker:'So sieht es aus', h2:'Was sich in deiner Woche &auml;ndert.', list:['Du triffst Entscheidungen aus Klarheit, nicht aus Druck','Dein Team sp&uuml;rt die ruhigere F&uuml;hrung sofort','Du hast Werkzeuge, die du immer wieder einsetzt','Umbr&uuml;che werden planbar, statt dich zu &uuml;berrollen']},

  {t:'why', kicker:'Warum ich', h2:'Julia St&auml;dtler', body:'Life- und Business-Coach mit &uuml;ber 1.000 Coaching-Stunden. Master Coach DBCA, NESC-Coach mit Nervensystem-Ausbildung. Ich kenne den Umbruch aus eigener Erfahrung: nach dem Burnout im Traumjob, einer Auszeit in den Alpen, zur&uuml;ck zu dem, was z&auml;hlt.'},

  {t:'recap', kicker:'Die drei Verschiebungen', h2:'Was du mitnimmst.', list:['Von mehr Leistung zu einer anderen Haltung','Von Reaktion zu einem regulierten Nervensystem','Vom Chaos im Umbruch zu struktureller Klarheit']},

  {t:'cta', kicker:'Dein n&auml;chster Schritt', h1:'Lass uns deinen Umbruch gemeinsam sortieren.', ctaLine:'Buche dein kostenfreies Kennenlerngespr&auml;ch auf juliastaedtler.com', disclaimer:'Diese Masterclass dient der Weiterbildung und pers&ouml;nlichen Entwicklung. Sie ersetzt keine Therapie oder medizinische Beratung. For education only. No specific result or income is guaranteed. Results vary and depend on your own implementation.'}
];

const stage=document.getElementById('stage');
let i=0;
function render(){
  const s=S[i];
  let h='<div class="slide active">';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.body) h+='<p>'+s.body+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.arc){h+='<div class="arc">';s.arc.forEach(x=>h+='<span>'+x+'</span>');h+='</div>';}
  if(s.ctaLine) h+='<div class="cta-line">'+s.ctaLine+'</div>';
  if(s.meta) h+='<div class="meta">'+s.meta+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='</div>';
  stage.innerHTML=h;
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
function go(n){i=Math.max(0,Math.min(S.length-1,i+n));render();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
