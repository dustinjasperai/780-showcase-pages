<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Polished Professional — A Masterclass with Alison M. Cheperdak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,wght@0,600;0,700;1,600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f8f2ee; --panel:#ffffff; --rule:#d6d2cc; --ink:#3d3a37;
  --muted:#7a7470; --accent:#4a7a9b;
  --serif:'Bodoni Moda',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#2a2622;font-family:var(--sans);color:var(--ink)}
.deck{max-width:1040px;margin:0 auto}
.slide{position:relative;background:var(--bg);aspect-ratio:16/9;margin:26px auto;
  padding:74px 84px;display:flex;flex-direction:column;justify-content:center;
  box-shadow:0 22px 60px rgba(0,0,0,.34);overflow:hidden}
.slide::before{content:'';position:absolute;left:84px;top:66px;width:54px;height:3px;background:var(--accent)}
.kicker{font-size:15px;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:24px}
.pill{display:inline-block;font-size:14px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);border:1.5px solid var(--accent);border-radius:100px;padding:7px 16px;margin-bottom:26px;align-self:flex-start}
h1{font-family:var(--serif);font-weight:700;font-size:74px;line-height:1.04;letter-spacing:.005em}
h2{font-family:var(--serif);font-weight:600;font-size:50px;line-height:1.1;margin-bottom:20px}
.lede{font-size:26px;line-height:1.5;color:var(--ink);max-width:82%;margin-top:22px;font-weight:300}
.sub{font-size:23px;line-height:1.52;color:var(--muted);max-width:84%;margin-top:16px}
.byline{margin-top:44px;font-size:20px;color:var(--muted);letter-spacing:.02em}
.byline b{color:var(--ink);font-weight:600}
ul{list-style:none;margin-top:12px}
li{font-size:25px;line-height:1.5;padding-left:34px;position:relative;margin-bottom:18px;max-width:86%}
li::before{content:'';position:absolute;left:0;top:14px;width:15px;height:15px;border:2px solid var(--accent);border-radius:50%}
.big{font-family:var(--serif);font-weight:600;font-size:58px;line-height:1.1;max-width:92%}
.big .a{color:var(--accent);font-style:italic}
.frame{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:40px 44px;margin-top:6px;max-width:94%}
.frame h3{font-family:var(--serif);font-size:36px;font-weight:600;margin-bottom:12px}
.frame p{font-size:22px;line-height:1.5;color:var(--muted)}
.practice{margin-top:22px;font-size:20px;color:var(--ink)}
.practice b{color:var(--accent);font-weight:600;letter-spacing:.03em}
.num{font-family:var(--serif);font-size:30px;color:var(--accent);font-weight:600;margin-bottom:10px}
.cta-line{font-size:24px;color:var(--ink);margin-top:22px}
.cta-line b{color:var(--accent)}
.disclaimer{margin-top:26px;font-size:16px;line-height:1.5;color:var(--muted);max-width:80%;font-style:italic}
.foot{position:absolute;left:84px;right:84px;bottom:40px;display:flex;justify-content:space-between;
  font-size:14px;letter-spacing:.08em;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px}
.foot .b{color:var(--ink);font-weight:600}
.count{position:absolute;right:84px;top:62px;font-size:14px;color:var(--muted);letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:'A Live Masterclass · Elevate Etiquette',
    h1:'The Polished<br>Professional',
    lede:'How modern etiquette becomes your quiet leadership edge in the rooms that matter most.',
    byline:'with <b>Alison M. Cheperdak, J.D.</b> · Bestselling author of <i>Was It Something I Said?</i>',
    foot:'The Polished Professional' },

  {t:'promise',
    kicker:'What you will leave with',
    h2:'One hour. Three moves.',
    bullets:[
      'How to land as the most composed person in any high-stakes room.',
      'How to stay relationship-first when roles, teams, or circumstances are shifting.',
      'How to build real executive presence without performing or imitating anyone.'
    ],
    foot:'The promise' },

  {t:'audience',
    kicker:'Who this is for',
    h2:'You already do the work. You just want the room to see it.',
    sub:'You are a professional, a leader, or someone stepping up: the promotion, the board seat, the client you cannot afford to lose. You prepare harder than anyone. And still, in the moment that counts, you second-guess how you are coming across.',
    foot:'Who this is for' },

  {t:'reframe',
    big:'Presence is not personality.<br>It is <span class="a">respect, read live.</span>',
    sub:'The quiet thing that sets people apart is not more rules, a better script, or a bigger voice. It is etiquette: emotional intelligence other people can actually see.',
    foot:'The reframe' },

  {t:'part',
    pill:'Part One',
    h2:'Why preparing harder keeps backfiring',
    sub:'Most of us are taught that presence is something you either have or you do not, so we try to compensate with words. We script every line. And scripting is exactly what makes us disappear.',
    foot:'Part One · The core problem' },

  {t:'insight',
    kicker:'The real cost',
    h2:'When you are rehearsing, you are not here.',
    sub:'The classic mistake: being so focused on what you are going to say next that you miss what the other person is actually saying. People feel that absence. It reads as nerves, or worse, as indifference, no matter how prepared you are.',
    foot:'Part One · The core problem' },

  {t:'part',
    pill:'Part Two',
    h2:'The three focus areas',
    sub:'Everything I coach lives in three places. Each one is a skill, not a trait, and each one has a practice you can use this week.',
    foot:'Part Two · The method' },

  {t:'focus', num:'01',
    h3:'High-stakes first impressions',
    p:'How you land in the first ninety seconds, before a word of business is spoken.',
    practice:'walk in with two or three objectives, never a script. Objectives keep you present and flexible; a script makes you brittle.',
    foot:'Focus Area One' },

  {t:'focus', num:'02',
    h3:'Relationships through transition',
    p:'Staying relationship-first when the role, the team, or the circumstances are in flux.',
    practice:'lead with honoring the person in front of you. Etiquette is not performing for show. It is showing someone you genuinely care and making them feel welcome, especially when everything is uncertain.',
    foot:'Focus Area Two' },

  {t:'focus', num:'03',
    h3:'Executive presence, authentically yours',
    p:'Presence that is embodied and genuine rather than copied from someone you admire.',
    practice:'if you were creating a movie starring you, what would that person wear? How would they carry themselves? Then become that version, which is still you, just deliberate.',
    foot:'Focus Area Three' },

  {t:'insight',
    kicker:'A move you can use today',
    h2:'Stop scripting small talk. Start listening.',
    sub:'Do not memorize openers. Bring a few things you genuinely enjoy, like what you have been reading, watching, cooking, or where you have traveled, and then actually listen to the answer. Curiosity is more magnetic than any clever line.',
    foot:'In practice' },

  {t:'insight',
    kicker:'The details that get noticed',
    h2:'Presence is dining tables and inboxes too.',
    sub:'The same respect shows up in how you handle a business dinner and how you show up online. In private coaching we work through the real situations you are walking into, from the table to your social feed, so none of it is left to chance.',
    foot:'In practice' },

  {t:'reframe',
    big:'Etiquette is <span class="a">respect, integrity, and honesty</span>, made visible.',
    sub:'Paired with emotional intelligence, it is the thing that quietly and powerfully sets you apart, in even the most competitive rooms. Not tradition for its own sake. A leadership tool.',
    foot:'The thesis' },

  {t:'part',
    pill:'Part Three',
    h2:'How it plays out in the room',
    sub:'You walk in with objectives, not a script. You listen more than you perform. You make the other person feel genuinely welcome. You carry yourself like the deliberate version of you. People read all of it as presence, and presence is what they remember.',
    foot:'Part Three · The outcome' },

  {t:'why',
    kicker:'Why learn this from me',
    h2:'A lawyer and a newsroom taught me presence under pressure.',
    bullets:[
      'J.D. from George Washington University Law School; former TV news reporter for an NBC station in New York.',
      'Delivered trainings at Harvard Law School, the U.S. Congress, and Fortune 100 companies.',
      'Bestselling author of <i>Was It Something I Said?</i>, on the everyday etiquette that avoids awkward moments in relationships, work, and life.'
    ],
    foot:'Alison M. Cheperdak, J.D.' },

  {t:'cta',
    kicker:'Your next step',
    h2:'Work with me, one to one.',
    sub:'If the method resonated, my private coaching takes it into your real situations, with personalized feedback on body language, conversation style, and confidence, through to dining and social-media etiquette.',
    ctaLine:'Start at <b>elevateetiquette.com</b>',
    disclaimer:'This masterclass is educational. It shares frameworks and perspective, not guarantees. Individual results vary, and nothing here promises a specific professional or financial outcome.',
    foot:'The Polished Professional' }
];

const deck = document.getElementById('deck');
S.forEach(function(s, i){
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if(s.pill) h += '<div class="pill">'+s.pill+'</div>';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.num) h += '<div class="num">'+s.num+'</div>';
  if(s.h3){
    h += '<div class="frame"><h3>'+s.h3+'</h3>';
    if(s.p) h += '<p>'+s.p+'</p>';
    if(s.practice) h += '<div class="practice"><b>The practice:</b> '+s.practice+'</div>';
    h += '</div>';
  }
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.lede) h += '<div class="lede">'+s.lede+'</div>';
  if(s.sub) h += '<div class="sub">'+s.sub+'</div>';
  if(s.bullets){ h += '<ul>'; s.bullets.forEach(function(b){ h += '<li>'+b+'</li>'; }); h += '</ul>'; }
  if(s.byline) h += '<div class="byline">'+s.byline+'</div>';
  if(s.ctaLine) h += '<div class="cta-line">'+s.ctaLine+'</div>';
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  h += '<div class="foot"><span class="b">Elevate Etiquette</span><span>'+(s.foot||'')+'</span></div>';
  h += '<div class="count">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
