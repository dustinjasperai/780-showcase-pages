<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 100-House System — FlipTalk Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Open+Sans:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16110c;      /* warm near-black jobsite ground, from brand #010001/#222 warmed */
    --panel:#211911;
    --rule:#3a2c1e;
    --accent:#f25a28;  /* FlipTalk brand orange, 38 uses in brand.json */
    --ink:#f5efe8;
    --mute:#b7a897;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#0c0906;color:var(--ink);font-family:"Open Sans",system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 8vw;background:var(--bg);border-bottom:1px solid var(--rule);position:relative}
  .ey{font-family:"Oswald",sans-serif;letter-spacing:.22em;text-transform:uppercase;
    font-size:.82rem;color:var(--accent);margin-bottom:1.1rem;font-weight:600}
  h1{font-family:"Oswald",sans-serif;font-weight:700;line-height:1.02;
    font-size:clamp(2.2rem,6vw,4.1rem);text-transform:uppercase;letter-spacing:.01em}
  h2{font-family:"Oswald",sans-serif;font-weight:600;line-height:1.08;
    font-size:clamp(1.7rem,4.2vw,2.8rem);text-transform:uppercase}
  p{font-size:clamp(1.02rem,1.9vw,1.28rem);line-height:1.6;max-width:44ch;color:var(--ink);margin-top:1rem}
  p.lead{color:var(--mute)}
  .num{font-family:"Oswald",sans-serif;font-weight:700;font-size:clamp(3rem,9vw,6rem);
    color:var(--accent);line-height:.9}
  .tape{height:6px;width:84px;background:var(--accent);margin:1.4rem 0}
  ul{margin-top:1.2rem;list-style:none}
  li{font-size:clamp(1rem,1.8vw,1.2rem);line-height:1.5;padding:.55rem 0 .55rem 1.6rem;
    position:relative;border-top:1px solid var(--rule);max-width:50ch}
  li:before{content:"";position:absolute;left:0;top:1.1rem;width:14px;height:3px;background:var(--accent)}
  .phase{font-family:"Oswald",sans-serif;color:var(--mute);letter-spacing:.14em;
    text-transform:uppercase;font-size:.8rem}
  .cta h1{color:var(--accent)}
  .disc{font-size:.82rem;color:var(--mute);margin-top:2.2rem;max-width:56ch;line-height:1.5}
  .foot{position:absolute;bottom:2.2rem;left:8vw;font-family:"Oswald",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;font-size:.72rem;color:var(--mute)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:"title",ey:"FlipTalk Masterclass",h:"The 100-House System",p:"How to build a house-flipping business that runs on a team and a set of systems, not on you."},
 {t:"promise",ey:"The promise",h:"A machine, not a hustle",p:"In the next hour I'll show you the four engines that let a flipping business do real volume, and why the ceiling you keep hitting is a systems problem, not an effort problem."},
 {t:"who",ey:"Who this is for",h:"You can flip a house. Now you want a business.",p:"For the investor doing a handful of deals a year who keeps hitting the same ceiling: every flip still runs through you. More deals just means more fires."},
 {t:"trap",ey:"The trap",h:"Flipping is not a business. Yet.",p:"Right now you ARE the acquisitions team, the funding, the project manager, and the sales desk. That is a job you can't leave, and it caps you at the number of deals you can personally touch."},
 {t:"cost",ey:"The real cost",h:"The ceiling has a price",p:"Staying the operator doesn't just cap your deals. It caps your profit, your time, and how much the business is worth the day you want to step back. Every deal that depends on you is a deal that can't scale."},
 {t:"reframe",ey:"The reframe",h:"The deal is never the problem. The system is.",p:"A blown budget, a dead lead month, a contractor who vanished. Those feel like bad luck. They are missing systems. Fix the system once and the problem stops coming back."},
 {t:"part",ey:"Part one",num:"01",h:"The four engines of a flipping machine",p:"A business doing 100+ houses a year runs on four engines, each owned by a system and a person, not by your calendar."},
 {t:"pillar",phase:"Engine 01",ey:"Deal flow",h:"A pipeline, not a hunt",li:["Predictable marketing to motivated sellers across more than one channel","Relationships that feed deals: agents, contractors, wholesalers","A follow-up system so leads don't die in a spreadsheet"],p:"The best source of deals is the one that shows up every month whether or not you went looking."},
 {t:"pillar",phase:"Engine 02",ey:"Funding",h:"Fund the whole deal with none of your cash",li:["Private money for acquisition AND rehab","Joint-venture structures that split risk, not just profit","A capital stack that lets you say yes to the next deal"],p:"Cash should never be the reason you pass on a good flip."},
 {t:"pillar",phase:"Engine 03",ey:"Rehab",h:"Rehab the right way, keep the profit",li:["Vet and scope contractors the same way every time","Hold the budget with a draw schedule, not hope","Catch the profit-killers before they hit the P&L"],p:"Most flippers don't lose on the buy. They lose in the middle, on the rehab."},
 {t:"pillar",phase:"Engine 04",ey:"Team + systems",h:"The business runs on a schedule",li:["The roles that let deals move without you in the room","KPIs and numbers you actually look at every week","Accountability so the machine keeps its own pace"],p:"The goal: investors who go from a few deals a year to a few a month by installing the roles, not working more hours."},
 {t:"connect",ey:"How they connect",h:"One engine feeds the next",p:"Deal flow fills the funding pipeline. Funding frees you to say yes. Rehab systems protect the profit. The team runs all three on a schedule. Pull one engine out and the machine stalls."},
 {t:"part",ey:"Part two",num:"02",h:"When the machine runs",p:"When the four engines are installed, the business stops depending on your energy and starts depending on your system."},
 {t:"out",ey:"The shift",h:"From operator to owner",li:["Consistent deal flow instead of feast-or-famine months","Predictable profit per project instead of surprises","A team that handles the work you used to do at 11pm"],p:""},
 {t:"numbers",ey:"The dashboard",h:"The numbers you actually watch",li:["Leads in, deals under contract, and your real cost per deal","Budget variance per project, not just the final number","Days on each phase so a stall shows up early"],p:"You can't scale what you don't measure. The machine runs on a handful of numbers you check every week."},
 {t:"why",ey:"Why me",h:"I lost it all and rebuilt the machine",p:"I started in 2003, rode the market up, and lost everything in the 2008 crash. By 2012 I was choosing between groceries and the electric bill, digging out of a million-dollar hole. I rebuilt into a business flipping 100+ houses a year. Not with a secret deal. With systems."},
 {t:"first",ey:"Where to start",h:"The first engine to install",p:"If you're doing a few deals a year, start with deal flow and the numbers. Predictable leads plus a weekly dashboard is what turns the next 90 days from guessing into building."},
 {t:"cta",ey:"Your next step",h:"Build your 100-House System",p:"If you want the engines installed in your business, the Inner Circle Elite mastermind is where we do it together. Apply and let's see if it's a fit.",cta:true,
  disc:"Educational content only. Real estate investing carries risk and results vary with market, effort, and execution. Nothing here is a guarantee of income or results."}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.cta?' cta':'');
  let h='';
  if(s.ey) h+=`<div class="ey">${s.ey}</div>`;
  if(s.num) h+=`<div class="num">${s.num}</div><div class="tape"></div>`;
  if(s.phase) h+=`<div class="phase">${s.phase}</div>`;
  if(s.h) h+=(s.t==='title'||s.num||s.cta)?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`;
  if(!s.num) h+=`<div class="tape"></div>`;
  if(s.p) h+=`<p class="lead">${s.p}</p>`;
  if(s.li){h+='<ul>';s.li.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  h+=`<div class="foot">FlipTalk &middot; The 100-House System &middot; ${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
