<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Leadership Capacity Gap | Performance Intelligence</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#22211F;         /* ground, derived from site evidence #363636 (warm charcoal) */
    --panel:#2E2C29;      /* raised panel */
    --ink:#F2F0EC;        /* text */
    --ink-soft:#C4C0B6;   /* secondary text */
    --rule:#b7b7b7;       /* hairline, from site evidence */
    --accent:#C9872F;     /* amber: energy, the chosen single accent */
  }
  html,body{height:100%}
  body{background:#151412;color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid #37342F;border-radius:14px;
    aspect-ratio:16/9;margin:0 0 22px;padding:58px 64px;overflow:hidden;
    display:flex;flex-direction:column;justify-content:center;
  }
  .slide::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(120% 120% at 100% 0%, rgba(201,135,47,0.08), transparent 55%)}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Spectral',Georgia,serif;font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:40px;line-height:1.12;margin-bottom:20px;letter-spacing:-.01em}
  .sub{font-size:22px;color:var(--ink-soft);margin-top:20px;max-width:24ch}
  .lead{font-size:21px;color:var(--ink-soft);max-width:60ch}
  .lead strong{color:var(--ink);font-weight:600}
  p+p{margin-top:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;color:var(--ink-soft);padding:12px 0;border-bottom:1px solid #37342F;display:flex;gap:14px;align-items:baseline}
  li::before{content:"";flex:0 0 10px;height:10px;background:var(--accent);border-radius:2px;transform:translateY(2px)}
  li b{color:var(--ink);font-weight:600}
  .big{font-family:'Spectral',Georgia,serif;font-size:44px;line-height:1.1;font-weight:600;max-width:20ch}
  .ghost{color:#4A463F}
  .foot{position:absolute;left:64px;bottom:30px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#6E6A61}
  .pageno{position:absolute;right:64px;bottom:30px;font-size:12px;color:#6E6A61}
  /* capacity gauge motif: four segments = PQ Index domains */
  .gauge{display:flex;gap:10px;margin-top:26px;max-width:620px}
  .seg{flex:1;height:14px;border-radius:7px;background:#37342F;position:relative;overflow:hidden}
  .seg i{position:absolute;left:0;top:0;bottom:0;background:var(--accent);border-radius:7px;opacity:.9}
  .domains{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:26px;max-width:760px}
  .dom{background:var(--panel);border:1px solid #3B372F;border-left:3px solid var(--accent);border-radius:10px;padding:18px 20px}
  .dom h3{font-family:'Spectral',serif;font-size:21px;font-weight:600;margin-bottom:4px}
  .dom p{font-size:15px;color:var(--ink-soft);margin:0}
  .levers{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:24px;max-width:820px}
  .lev{background:var(--panel);border:1px solid #3B372F;border-radius:10px;padding:16px 18px;font-size:18px}
  .lev b{display:block;font-family:'Spectral',serif;color:var(--ink);font-size:20px;margin-bottom:2px}
  .lev span{font-size:14px;color:var(--ink-soft)}
  .cta-box{margin-top:26px;background:var(--panel);border:1px solid #3B372F;border-radius:12px;padding:24px 28px;max-width:640px}
  .cta-box .step{font-size:20px;color:var(--ink);font-weight:600}
  .disc{margin-top:18px;font-size:13px;color:#8A867C;max-width:62ch;line-height:1.5}
  @media(max-width:720px){.slide{padding:34px 28px;aspect-ratio:auto;min-height:72vw}h1{font-size:36px}h2{font-size:28px}.domains,.levers{grid-template-columns:1fr}.foot,.pageno{position:static;margin-top:20px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer style="max-width:1080px;margin:0 auto;padding:0 20px 60px;font-family:'IBM Plex Sans',sans-serif;font-size:12px;color:#6E6A61;line-height:1.5">
This masterclass is educational only. No specific performance, health, income or business result is guaranteed. Results vary from person to person. It shares general frameworks and strategies and is not medical, psychological or financial advice.
</footer>
<script>
const S = [
  {t:'title'},
  {t:'promise'},
  {t:'whofor'},
  {t:'trap'},
  {t:'reframe'},
  {t:'partlabel', kick:'Part One', h:'The gap nobody measures'},
  {t:'content', kick:'The core problem', h:'You were promoted for capability.',
    lead:'Strategy, decisions, people, judgment. Every leadership program you have ever done sharpened your <strong>capability</strong>. None of them measured your <strong>capacity</strong> to keep spending it.'},
  {t:'content', kick:'The core problem', h:'Capacity is the real ceiling.',
    lead:'When capacity runs low, capability still looks fine on the outside. The same smart leader makes slower decisions, shorter fuses, worse sleep. <strong>Burnout is not a willpower problem. It is an unmeasured capacity problem.</strong>'},
  {t:'reframe2'},
  {t:'partlabel', kick:'Part Two', h:'Measure it: the PQ Index'},
  {t:'pq'},
  {t:'domains'},
  {t:'content', kick:'Why it works', h:'You cannot manage what you have never measured.',
    lead:'A seven minute read gives you a precise picture of the physical and psychological conditions underneath your performance. That is where sustainable high performance starts, not with another push.'},
  {t:'partlabel', kick:'Part Three', h:'Rebuild it: the 6 Levers'},
  {t:'levers'},
  {t:'content', kick:'The next ninety days', h:'Ninety days of capacity, not another sprint.',
    lead:'Small, measured changes across the levers that move the four domains. You stop running on fumes between quarters and start leading from a full tank, on purpose.'},
  {t:'why'},
  {t:'cta', disc:'This masterclass is educational only. No specific performance, health, income or business result is guaranteed. Results vary from person to person. It shares general frameworks and strategies and is not medical, psychological or financial advice.'}
];

const FOOT = 'Performance Intelligence, Andrew May';
function seg(fill){return '<div class="seg"><i style="width:'+fill+'%"></i></div>';}

function render(s, i, n){
  let b='';
  if(s.t==='title'){
    b = '<div class="kick">A live masterclass with Andrew May</div>'+
        '<h1>The Leadership Capacity Gap</h1>'+
        '<div class="sub">High performance. Without the burnout.</div>'+
        '<div class="gauge">'+seg(72)+seg(48)+seg(63)+seg(55)+'</div>';
  } else if(s.t==='promise'){
    b = '<div class="kick">What you will leave with</div>'+
        '<ul>'+
        '<li><b>A straight read</b> on why hard working leaders stall at the same ceiling.</li>'+
        '<li><b>The four domains</b> that decide how you actually show up under pressure.</li>'+
        '<li><b>The levers</b> that rebuild capacity without slowing your ambition down.</li>'+
        '</ul>';
  } else if(s.t==='whofor'){
    b = '<div class="kick">Who this is for</div>'+
        '<h2>Senior leaders carrying real load.</h2>'+
        '<p class="lead">Executives and people leaders who are performing at a high level and feeling the cost of it. You are not looking for motivation. You are looking for a way to keep this pace without it quietly taking you apart.</p>';
  } else if(s.t==='trap'){
    b = '<div class="kick">The trap</div>'+
        '<p class="big">When it gets hard, you do the one thing that got you here. You push <span class="ghost">harder</span>.</p>'+
        '<p class="lead" style="margin-top:22px">It works, right up until it does not. The push that built your career is the same habit that drains the tank you are leading from.</p>';
  } else if(s.t==='reframe'){
    b = '<div class="kick">The reframe</div>'+
        '<p class="big">More effort into a half full tank does not give you more. It just empties it faster.</p>';
  } else if(s.t==='reframe2'){
    b = '<div class="kick">The shift</div>'+
        '<p class="big">Stop training only what you can <span class="ghost">do</span>. Start measuring what you can <span style="color:var(--accent)">sustain</span>.</p>';
  } else if(s.t==='partlabel'){
    b = '<div class="kick">'+s.kick+'</div><h1>'+s.h+'</h1>';
  } else if(s.t==='content'){
    b = '<div class="kick">'+s.kick+'</div><h2>'+s.h+'</h2><p class="lead">'+s.lead+'</p>';
  } else if(s.t==='pq'){
    b = '<div class="kick">The PQ Index</div>'+
        '<h2>Your Leadership Capacity, on a page.</h2>'+
        '<p class="lead">The Performance Intelligence Quotient measures the physical and psychological conditions of your performance across four domains, so capacity stops being a feeling and becomes a number you can move.</p>'+
        '<div class="gauge">'+seg(70)+seg(45)+seg(60)+seg(52)+'</div>';
  } else if(s.t==='domains'){
    b = '<div class="kick">The four domains</div>'+
        '<div class="domains">'+
        '<div class="dom"><h3>Energy Management</h3><p>Activity, fuel, sleep and recovery. The physiology under every decision.</p></div>'+
        '<div class="dom"><h3>Mental Agility</h3><p>How cleanly you think, switch and focus when the pressure is on.</p></div>'+
        '<div class="dom"><h3>Strategic Recovery</h3><p>Deliberate recharge, not collapse. The skill most leaders never built.</p></div>'+
        '<div class="dom"><h3>Biological Age</h3><p>How well your body is actually running versus the number on your licence.</p></div>'+
        '</div>';
  } else if(s.t==='levers'){
    b = '<div class="kick">The 6 Levers, from MatchFit</div>'+
        '<h2>Six places to rebuild the tank.</h2>'+
        '<div class="levers">'+
        '<div class="lev"><b>Move</b><span>Train the body that carries the brain.</span></div>'+
        '<div class="lev"><b>Fuel</b><span>Eat for steady energy, not a crash at 3pm.</span></div>'+
        '<div class="lev"><b>Recharge</b><span>Sleep and recovery as performance work.</span></div>'+
        '<div class="lev"><b>Think</b><span>Manage attention and the inner critic.</span></div>'+
        '<div class="lev"><b>Play</b><span>Protect the off switch on purpose.</span></div>'+
        '<div class="lev"><b>Connect</b><span>The relationships that refill, not drain.</span></div>'+
        '</div>';
  } else if(s.t==='why'){
    b = '<div class="kick">Why listen to me on this</div>'+
        '<h2>Twenty years, boardrooms and locker rooms.</h2>'+
        '<p class="lead">I have spent more than two decades coaching senior executives, elite sporting teams and the Australian Defence Force on performing under pressure, and I built the PQ Index with Professor Tom Buckley so capacity could finally be measured, not guessed.</p>';
  } else if(s.t==='cta'){
    b = '<div class="kick">Your next step</div>'+
        '<h2>Measure your capacity. Then rebuild it.</h2>'+
        '<div class="cta-box"><div class="step">Take the 7 minute PQ Index, then join us to walk through what your four domains are telling you and the first levers to pull.</div></div>'+
        '<p class="disc">'+s.disc+'</p>';
  }
  const foot = (s.t==='title')?'':'<div class="foot">'+FOOT+'</div><div class="pageno">'+(i+1)+' / '+n+'</div>';
  return '<section class="slide">'+b+foot+'</section>';
}
const deck=document.getElementById('deck');
deck.innerHTML = S.map((s,i)=>render(s,i,S.length)).join('');
</script>
</body>
</html>
