<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Income Mirrors Your Identity, a live masterclass with Elyse Archer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2e9;      /* warm ivory ground, off her light site */
    --panel:#fffdf8;   /* warm white */
    --rule:#e7ddc9;    /* soft sand rule */
    --ink:#0c2c5d;     /* her ranked navy */
    --muted:#5c6472;   /* muted slate */
    --accent:#bf9863;  /* her brand gold */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .stage{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 54px;margin:0 0 26px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 1px 0 rgba(12,44,93,.03);
  }
  .kick{font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:20px}
  h1{font-family:"Prata",Georgia,serif;font-weight:400;font-size:46px;line-height:1.12;color:var(--ink);margin-bottom:18px}
  h2{font-family:"Prata",Georgia,serif;font-weight:400;font-size:33px;line-height:1.18;color:var(--ink);margin-bottom:16px}
  p{font-size:19px;line-height:1.62;color:var(--muted);max-width:66ch;margin-bottom:12px}
  p.lead{font-size:21px;color:var(--ink)}
  .num{font-family:"Prata",serif;font-size:15px;color:var(--accent);position:absolute;top:26px;right:30px;letter-spacing:.04em}
  .rule{width:54px;height:2px;background:var(--accent);margin:6px 0 22px;border:0}
  ul{list-style:none;margin:8px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:20px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  li small{display:block;color:var(--muted);font-size:15.5px;margin-top:4px;font-weight:400}
  .mirror{display:grid;grid-template-columns:1fr 1fr;gap:0;border:1px solid var(--rule);border-radius:12px;overflow:hidden;margin-top:14px}
  .mirror div{padding:24px 26px}
  .mirror .a{background:#fbf6ec}
  .mirror .b{background:#fff;border-left:2px solid var(--accent)}
  .mirror h3{font-family:"Prata",serif;font-weight:400;font-size:19px;margin-bottom:8px;color:var(--ink)}
  .mirror p{font-size:16px;margin:0}
  .big{font-family:"Prata",serif;font-size:40px;line-height:1.15;color:var(--ink)}
  .cta{background:var(--ink);border-color:var(--ink)}
  .cta .kick{color:var(--accent)}
  .cta h1,.cta h2,.cta p{color:#fff}
  .cta .btn{display:inline-block;margin-top:20px;background:var(--accent);color:#0c1b33;font-weight:700;padding:15px 30px;border-radius:8px;font-size:17px;letter-spacing:.02em}
  .disc{font-size:13.5px;color:#c7d2e6;margin-top:26px;max-width:70ch;line-height:1.5}
  .foot{text-align:center;color:var(--muted);font-size:13px;padding:8px 0 0}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="foot">Superhuman Selling &middot; a live masterclass with Elyse Archer</div>
<script>
const S = [
  {t:'title', kick:'A LIVE MASTERCLASS WITH ELYSE ARCHER', h:'Your Income Mirrors Your Identity',
   p:'The quantum sales leap for women who are done trading more tactics for the same number. One live hour on selling from who you are becoming, not who you used to be.'},

  {t:'who', kick:'Who this is for', h:'You can sell. That was never the problem.',
   list:[
     ['You are a woman entrepreneur or sales pro who already closes.','You have skill, offers, and a track record.'],
     ['But your income has a ceiling you keep hitting.','Different month, same number.'],
     ['You have tried more scripts, more calls, more hustle.','And the needle barely moves.']
   ]},

  {t:'trap', kick:'The trap', h:'The whole industry sells you the same fix.',
   p:'Every feed, every course, every coach: a better script, a tighter pitch, one more objection handler. So you collect tactics.',
   lead:'And you still walk into the sales conversation as the same person, carrying the same ceiling. The tactics were never the thing holding the number down.'},

  {t:'reframe', kick:'The reframe', big:'You do not have a sales problem. You have an identity problem.',
   p:'Money mirrors your identity. The beliefs you hold about who you are and what you are worth set the number long before the sales call starts.'},

  {t:'problem', kick:'Part one: the real problem', h:'You are selling from an old self.',
   p:'When you sell as the person you were at your last level, you unconsciously protect that level. You discount to feel safe. You shrink the offer. You avoid the bigger room.',
   lead:'Your results are not tracking your ability. They are tracking your self concept.'},

  {t:'setpoint', kick:'Part one', h:'Everyone has a financial setpoint.',
   p:'It is the income your nervous system has decided is normal and safe for someone like you. Cross it and something in you quietly pulls you back: the missed follow up, the lowered price, the full calendar with no room to grow.',
   lead:'Skill did not cap you. Your setpoint did.'},

  {t:'why-tactics', kick:'Part one', h:'This is why tactics alone stall.',
   p:'A great method handed to an old identity gets watered down until it feels safe again. That is why two people run the same playbook and get completely different numbers.',
   lead:'Belief in the method, and in yourself, is what actually makes the method work.'},

  {t:'framework', kick:'Part two: the framework', h:'The Four M\'s of Quantum Sales Growth',
   p:'A quantum leap is an uncommon jump, not a slow yearly climb off last year. It comes from working four things in order, not just the last one.',
   list:[
     ['Mind over matter','Become the person who has already done it.'],
     ['Money','Raise your setpoint and your worthiness to receive.'],
     ['Masculine and feminine energy','Structure and flow, held together.'],
     ['Method','Strategy and tactics, once the first three are set.']
   ]},

  {t:'m1', kick:'Mind over matter', h:'Become her first. The actions follow.',
   p:'Define the identity of the woman who has already hit the number. How she prices. How she follows up. What she says yes and no to. Then take action as her today, before the evidence arrives.',
   lead:'This is not positive thinking. It is deciding who is doing the selling.'},

  {t:'m2', kick:'Money', h:'Raise the setpoint on purpose.',
   p:'Name the number that currently feels normal. Then do the belief work to make a bigger number feel safe, so you stop self correcting back down to the old ceiling.',
   lead:'When a bigger number feels ordinary, your behaviour changes on its own.'},

  {t:'m3', kick:'Masculine and feminine energy', h:'Growth without the grind.',
   p:'Masculine energy is structure, targets, and decisive action. Feminine energy is intuition, connection, and flow. Most women in sales are pushed to lead only with the first and burn out.',
   lead:'Integrated, you sell in a way that is aligned with how you are wired, and it lasts.'},

  {t:'m4', kick:'Method', h:'Now, and only now, the tactics.',
   p:'With the identity and the setpoint handled, the strategy finally sticks: the offer, the follow up, the conversation. Same playbook, run by a different person, produces a different number.'},

  {t:'bigthree', kick:'The foundation', h:'Mind. Money. Method.',
   p:'These are the Big Three. Get the mind and money work right and the method compounds. Skip them and even the best strategy returns almost nothing.',
   lead:'Most sellers live entirely in method. That is why they stay stuck.'},

  {t:'mirror', kick:'The core idea', h:'What changes when the identity changes',
   mirror:[
     ['Selling from the old self','Discount to close. Shrink the offer. Chase. The number stays where it has always been.'],
     ['Selling from the next self','Hold the price. Make the bigger ask. Follow up like it is normal. The number follows you.']
   ]},

  {t:'story', kick:'Proof of concept', h:'I lived at one number for a decade.',
   p:'I held roughly the same six figure year for ten years. Nothing about my skill changed overnight. What changed was who I decided I was being when I sold.',
   lead:'From there, a hundred thousand a year became a hundred thousand a month in about six weeks, without adding hours.'},

  {t:'what-it-looks', kick:'Part three: after the leap', h:'When you sell as her',
   list:[
     ['Pricing stops feeling like a fight.','You name the number and let it stand.'],
     ['Follow up becomes normal, not needy.','The next level version of you expects the yes.'],
     ['Sales stops draining you.','Aligned selling feels like connection, not conquest.']
   ]},

  {t:'whoami', kick:'Who is teaching this', h:'Elyse Archer',
   p:'Founder of Superhuman Selling and the She Sells movement. I help women entrepreneurs and sales professionals make quantum leaps in income through identity, not just tactics.',
   list:[
     ['Host of the Superhuman Selling podcast.','Weekly, on sales and income growth.'],
     ['Featured in Forbes and Inc.','And on stages built for women in sales.'],
     ['A community of women making the leap together.','This is the method, taught live.']
   ]},

  {t:'recap', kick:'The leap in one line', big:'Change who is selling, and the number changes with you.',
   p:'Mind, money, and energy first. Method second. That order is the whole difference between a slow climb and a quantum leap.'},

  {t:'next', kick:'Go deeper', h:'Keep going with She Sells',
   p:'This masterclass is the on ramp. Inside She Sells All Access you get the full identity based selling method, monthly live trainings, and a room full of women raising their setpoints alongside you.',
   lead:'The leap is easier when you are not doing it alone.'},

  {t:'cta', kick:'Your next step', h:'Come sell as her.',
   p:'Join She Sells and put the Four M\'s to work on your own number, starting this month.',
   btn:'Join She Sells All Access',
   sub:'superhumanselling.circle.so',
   disc:'Educational content only. Individual results vary and no specific income or result is guaranteed. The examples shared reflect the presenter\'s own experience and are not a promise of future earnings.'}
];

const stage = document.getElementById('stage');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let html = '';
  html += '<span class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.h) html += '<h1>'+s.h+'</h1>';
  if(s.big) html += '<div class="big">'+s.big+'</div><hr class="rule">';
  if(s.h) html += '<hr class="rule">';
  if(s.lead && !s.p) html += '<p class="lead">'+s.lead+'</p>';
  if(s.p) html += '<p>'+s.p+'</p>';
  if(s.lead && s.p) html += '<p class="lead">'+s.lead+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(it=> html += '<li>'+it[0]+'<small>'+it[1]+'</small></li>'); html += '</ul>'; }
  if(s.mirror){ html += '<div class="mirror"><div class="a"><h3>'+s.mirror[0][0]+'</h3><p>'+s.mirror[0][1]+'</p></div><div class="b"><h3>'+s.mirror[1][0]+'</h3><p>'+s.mirror[1][1]+'</p></div></div>'; }
  if(s.btn) html += '<div><span class="btn">'+s.btn+'</span></div>';
  if(s.sub) html += '<p class="disc" style="margin-top:14px">'+s.sub+'</p>';
  if(s.disc) html += '<p class="disc">'+s.disc+'</p>';
  el.innerHTML = html;
  stage.appendChild(el);
});
</script>
</body>
</html>
