<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Subconscious Sales Masterclass · Jason Hayes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700;800&family=Source+Sans+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F6F7F2; --panel:#FFFFFF; --rule:#DFE3D8;
    --acc:#009044; --idx:#262323; --chalk:#1B1D19; --grey:#5C5652; --dim:#8B8B82;
  }
  html,body{height:100%}
  body{background:#14150F;font-family:'Source Sans Pro',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#14150F}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Montserrat',-apple-system,sans-serif;font-weight:700;color:var(--idx);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:3.7vw;max-width:88%}
  .t-normal h1{font-size:2.7vw;max-width:84%}
  .t-normal .body{font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.56;font-weight:400}
  .sub{font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Source Sans Pro',sans-serif;font-size:1.3vw;font-weight:600;color:var(--acc);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:3.9vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(180deg,var(--chalk) 0%,#0E0F0B 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.1vw;max-width:82%;font-style:italic;color:#F6F7F2}
  .t-cta{background:linear-gradient(180deg,var(--chalk) 0%,#0E0F0B 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.3vw;max-width:80%;color:#F6F7F2}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#D9F0E1;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.88vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-cta .disc{color:#A9B0A2}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .title-motif{right:7%;bottom:9%;width:19vw}
  .corner-motif{right:6%;bottom:7.5%;width:8.5vw;opacity:.55}
  .brandline{font-size:1.24vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(20,22,25,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.4vw}.t-normal h1{font-size:4.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Subcon Sales</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- tunnel-arc motif: a wash-tunnel entrance / threshold moment, one arc picked out in accent -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="tunnel" viewBox="0 0 260 150">
  <g fill="none" stroke-linecap="round">
    <line x1="14" y1="128" x2="246" y2="128" stroke="#262323" stroke-width="2" opacity="0.25"/>
    <path d="M30 128 A80 80 0 0 1 190 128" stroke="#262323" stroke-width="8" opacity="0.18"/>
    <path d="M52 128 A58 58 0 0 1 168 128" stroke="#262323" stroke-width="8" opacity="0.28"/>
    <path d="M74 128 A36 36 0 0 1 146 128" stroke="#009044" stroke-width="9" opacity="0.9"/>
    <circle cx="110" cy="92" r="5" fill="#009044"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Subconscious Sales Masterclass',sub:'Why customers say yes before they know why, and how to build a membership sales system around it.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You built a great wash. The membership pitch still feels like a coin flip.',body:'Your crew washes every car right. What happens at the counter after that, whether that customer joins the unlimited plan or drives off a one-and-done, changes by shift and by employee. Nobody trained for it, so nobody can explain why it works some days and not others.'},
 {t:'dark',title:'Over 90 percent of the decision to buy is made before your team ever opens their mouth.'},

 {t:'section',idx:'Part One',title:'Why Membership Sales Feel Random'},
 {t:'normal',k:'The invisible decision',title:'Most washes sell on logic. The decision is already subconscious.',body:'Price, features, a good wash, all logical arguments made out loud after the customer has already decided. If the pitch only speaks to logic, it is arguing with a decision the customer made somewhere else first.'},
 {t:'normal',k:'A pitch you did not train for',title:'Every interaction at the pay station is a pitch, whether your crew knows it or not.',body:'Without a shared method, the membership offer becomes whatever each employee happens to say that day. Some of it works by accident. None of it repeats on purpose.'},
 {t:'dark',title:'A membership sale you did not train for is a membership sale you are leaving on the table.'},

 {t:'section',idx:'Part Two',title:'The Subconscious Sales Method'},
 {t:'normal',k:'Temporal Landmarks',title:'People are primed to start new habits at life\'s transition points.',body:'A new vehicle purchase, a birthday, a new job, the first of the month. Jason\'s own framework trains a crew to recognize these moments and pitch the unlimited plan as the reward that comes with them, right when a customer is already primed to say yes to something new.'},
 {t:'normal',k:'Negative Space',title:'A calmer customer is an easier customer to sell to.',body:'Every extra word on a sign, every extra option at the pay station, adds to the mental load of a customer who is already navigating traffic. Jason\'s Negative Space principle strips signage and messaging down to the fewest words possible, on purpose, because clarity reads as safety.'},
 {t:'normal',k:'Building Rapport and Dialog',title:'The trained conversation, not the improvised one.',body:'The largest module in Jason\'s curriculum, Dialog, is built specifically so every employee runs the same rapport-building conversation, matched to the right employee for the right moment through his own MBTI-based role placement.'},
 {t:'dark',title:'Clarity equals a calmer customer. A calmer customer is easier to sell to.'},

 {t:'section',idx:'Part Three',title:'The Wash That Runs One Method'},
 {t:'normal',k:'What this builds',title:'A crew that pitches every car, every time, the same trained way.',body:'Not a script recited by rote. A team that recognizes the Temporal Landmark moment, keeps the signage and the pitch itself simple, and runs Post-Sale retention instead of letting the conversation end at the transaction.'},
 {t:'normal',k:'Why Jason Hayes',title:'Twenty years in automotive, then car wash, built from the ground up.',body:'Jason spent 20 years in automotive before moving into the car wash industry and building the Subconscious Sales method from his own published frameworks. He hosts The Subcon Podcast and has appeared as a guest on Wash Talk, the industry\'s flagship show.'},

 {t:'section',idx:'Your Next Step',title:'Put the Method to Work'},
 {t:'normal',k:'Owner Club',title:'For owners and GMs who want to run the full system.',body:'Unlimited community access, monthly leadership calls, the full sales-training curriculum, and the strategies behind pricing, hiring, and management, at $250 a month.'},
 {t:'normal',k:'Employee Club',title:'For the crew that actually runs the pitch every shift.',body:'The same Building Rapport and Dialog training, sales scripts, and a monthly employee call, at $19 a month, so the method runs on the floor, not just in the owner\'s head.'},
 {t:'cta',title:'Ready to put the Subconscious Sales method to work at your tunnel?',chips:['Join the Owner Club','Explore the Employee Club'],disc:'Educational content for car wash owners and their teams. No membership count, revenue, or income result is guaranteed. Results vary by location, market, and team.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#tunnel"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Subcon <b>Sales</b> · Jason Hayes</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=motif(s.arc);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
