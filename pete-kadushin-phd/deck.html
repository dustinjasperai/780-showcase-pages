<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Deeper Game of Coaching — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1;
    --panel:#2d3748;
    --rule:#d7d3c7;
    --accent:#31589b;
    --ink:#23272e;
    --dim:#5d6572;
    --chalk:#f6f5f1;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:#fffefb;border:1px solid var(--rule);border-radius:10px;padding:56px 56px;margin:20px 0;min-height:60vh;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  .slide h1{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:clamp(34px,5vw,58px);line-height:1.04;letter-spacing:-.01em;color:var(--panel)}
  .slide h2{font-family:"Newsreader",Georgia,serif;font-weight:500;font-size:clamp(28px,4vw,44px);line-height:1.08;color:var(--panel);margin-bottom:10px}
  .slide p{font-size:clamp(17px,1.7vw,21px);line-height:1.5;color:var(--ink);max-width:40ch;margin-top:14px}
  .slide p.lead{font-size:clamp(19px,2vw,24px);color:var(--dim)}
  .slide .sub{margin-top:22px;font-size:18px;color:var(--dim);max-width:52ch}
  .slide ul{list-style:none;margin-top:22px;max-width:46ch}
  .slide li{position:relative;padding-left:26px;margin:14px 0;font-size:clamp(17px,1.7vw,21px);line-height:1.45}
  .slide li:before{content:"";position:absolute;left:0;top:11px;width:10px;height:2px;background:var(--accent)}
  .slide .rule{width:54px;height:3px;background:var(--accent);margin:0 0 26px}
  .title-slide{background:var(--panel);border-color:var(--panel)}
  .title-slide h1,.title-slide h2{color:#fff}
  .title-slide .kick{color:#9fb4df}
  .title-slide p,.title-slide .sub{color:#c9cfd8}
  .num{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--dim);letter-spacing:.1em}
  .part{background:var(--accent);border-color:var(--accent)}
  .part h1,.part .kick{color:#fff}
  .part .kick{color:#d7e1f4}
  .three{display:grid;grid-template-columns:1fr;gap:16px;margin-top:26px;max-width:62ch}
  .three .cell{border-left:3px solid var(--accent);padding:8px 0 8px 18px}
  .three .cell b{font-family:"Newsreader",serif;font-weight:500;font-size:22px;color:var(--panel);display:block;margin-bottom:4px}
  .three .cell span{font-size:16px;color:var(--dim)}
  .cta-slide{background:var(--panel);border-color:var(--panel)}
  .cta-slide h1,.cta-slide h2{color:#fff}
  .cta-slide .kick{color:#9fb4df}
  .cta-slide p{color:#c9cfd8;max-width:48ch}
  .cta-slide .disclaimer{margin-top:28px;font-size:13px;color:#8a93a1;max-width:60ch;line-height:1.5}
  @media(max-width:640px){.slide{padding:38px 26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', kick:'A Masterclass for Coaches', h:'The Deeper Game of Coaching', sub:'Why your best clients can do everything right and still stay stuck, and the coaching that actually moves them.', by:'Dr. Pete Kadushin, PhD, CMPC'},
 {t:'audience', kick:'Who this is for', h:'The coach who has already mastered the models.', body:'You know the frameworks. You run a clean session. And still, there are clients who do everything right and do not change. This hour is about why that happens, and what to do instead.'},
 {t:'trap', kick:'The trap', h:'You can run a flawless session and watch nothing move.', body:'When a capable client stalls, most coaches reach for another tool, another model, another reframe. More technique on top of a block that technique was never going to touch.'},
 {t:'reframe', kick:'The reframe', h:'The problem was never the technique.', body:'The block is almost never a missing skill. It is who the client is being underneath the skill. Coach the doing and it holds for a week. Coach the being and it holds.'},
 {t:'part', kick:'Part One', h:'Why more technique stops working.'},
 {t:'content', kick:'The ceiling', h:'Optimization has a ceiling.', body:'Mental skills, routines, and strategy get a capable performer to the edge of what they already are. Past that edge, adding more tools just gives the same person more ways to grip harder.'},
 {t:'content', kick:'The real lever', h:'The lever is the level of being.', body:'The highest point of leverage is not a new behavior. It is the unconscious rule the client is organized around, the thing they are protecting without knowing it. That is where change becomes durable.'},
 {t:'part', kick:'Part Two', h:'The Deeper Game: three places change actually lives.'},
 {t:'three', kick:'The map', h:'Three themes from inside elite rooms.', cells:[
   {b:'Greatness', s:'Consistent execution of the overlooked fundamentals, recovery, rest, support, tuned to the individual, not more volume.'},
   {b:'Negative Space', s:'Intentional subtraction and recovery over constant optimization. Performance often improves by taking things away.'},
   {b:'Identity and Performance', s:'When self-worth is fused to the outcome, an opportunity becomes a threat, and the body plays to protect.'}
 ]},
 {t:'content', kick:'Theme one', h:'Greatness is in the boring fundamentals.', body:'At the top, the difference is rarely a secret method. It is whether the basics of recovery, rest, and support are actually in place, built around how this specific person works.'},
 {t:'content', kick:'Theme two', h:'Negative Space.', body:'Capable people default to adding. The deeper move is subtraction: fewer priorities, real recovery, space for the nervous system to settle. You cannot perform from a system that never comes down.'},
 {t:'content', kick:'Theme three', h:'Identity fused to outcome turns opportunity into threat.', body:'When who I am depends on how this goes, every rep carries survival weight. The grip tightens, the body tenses, and the skill the client clearly has stops showing up when it counts.'},
 {t:'content', kick:'The move', h:'De-fuse the identity from the result.', body:'The work is helping the client hold the goal without being owned by it. When self-worth is no longer on the table, the same person finally gets to use what they already know.'},
 {t:'content', kick:'In the room', h:'What this changes in a session.', body:'You stop collecting more strategies and start listening for the rule underneath. The conversation gets quieter and goes deeper, and the client leaves changed at the level of being, not just informed.'},
 {t:'part', kick:'Part Three', h:'What the deeper game looks like in practice.'},
 {t:'content', kick:'The arc', h:'A coaching philosophy that evolves with you.', body:'Over a focused block of weeks, you build and refine your own coaching philosophy, pressure test it against real clients, and leave with language and actions that carry the full force of who you are.'},
 {t:'why', kick:'Why me', h:'Fifteen years inside elite performance.', body:'PhD in Sport and Exercise Psychology. Certified Mental Performance Consultant. Three years embedded with the NHL Chicago Blackhawks and two more as their Manager of Learning and Development, plus faculty roles at Boston University and Western Colorado University.'},
 {t:'recap', kick:'In one line', h:'Coach the being, not just the doing.', body:'Greatness in the fundamentals. Negative Space over endless optimization. Identity un-fused from the result. That is the deeper game.'},
 {t:'cta', kick:'Where to go from here', h:'Play the deeper game with me.', body:'The Deeper Game of Coaching is a focused cohort of ten coaches: weekly live sessions, concept work between them, and two one-to-one sessions to make it yours. If it sounds like your next step, the first move is a short call with me.', disclaimer:'Educational content only. No specific result or outcome is guaranteed. Results vary and depend on the individual, their clients, and their effort.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  let cls='slide';
  if(s.t==='title')cls+=' title-slide';
  else if(s.t==='part')cls+=' part';
  else if(s.t==='cta')cls+=' cta-slide';
  el.className=cls;
  let h='';
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.t!=='part')h+='<div class="rule"></div>';
  h+='<h1>'+(s.h||'')+'</h1>';
  if(s.sub)h+='<p class="sub">'+s.sub+'</p>';
  if(s.by)h+='<p class="sub"><strong>'+s.by+'</strong></p>';
  if(s.body)h+='<p class="lead">'+s.body+'</p>';
  if(s.cells){h+='<div class="three">';s.cells.forEach(c=>{h+='<div class="cell"><b>'+c.b+'</b><span>'+c.s+'</span></div>';});h+='</div>';}
  if(s.disclaimer)h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
