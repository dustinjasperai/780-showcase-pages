<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Coaching Engine — The Padel School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf4e9; --panel:#fffdf8; --ink:#17181a; --muted:#595b60;
    --rule:#efe2d0; --accent:#f9931f; --charcoal:#2b2d31;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:'Sora';font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Sora';font-weight:700;font-size:48px;line-height:1.05;color:var(--charcoal);letter-spacing:-.01em}
  h2{font-family:'Sora';font-weight:700;font-size:34px;line-height:1.1;color:var(--charcoal);margin-bottom:16px}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);margin-top:20px;max-width:40em}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:14px;max-width:42em}
  .kicker{font-size:17px;color:var(--muted);margin-top:10px}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:14px}
  li{position:relative;padding-left:40px;font-size:19px;line-height:1.5;color:var(--ink)}
  li .n{position:absolute;left:0;top:1px;width:26px;height:26px;border-radius:7px;background:var(--accent);
    color:#fff;font-family:'Sora';font-weight:700;font-size:14px;display:flex;align-items:center;justify-content:center}
  li b{color:var(--charcoal)}
  .step{display:flex;gap:16px;align-items:flex-start;margin-top:18px}
  .step .dot{flex:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--accent);
    display:flex;align-items:center;justify-content:center;font-family:'Sora';font-weight:700;color:var(--accent)}
  .step .txt{font-size:18px;line-height:1.5}
  .step .txt b{font-family:'Sora';color:var(--charcoal)}
  .tag{display:inline-block;font-family:'Sora';font-weight:600;font-size:13px;letter-spacing:.08em;
    text-transform:uppercase;color:var(--charcoal);background:#f1ede4;border:1px solid var(--rule);
    border-radius:999px;padding:6px 14px;margin-top:26px}
  .cta h1{font-size:42px}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:28px;max-width:44em;border-top:1px solid var(--rule);padding-top:16px}
  .num{position:absolute;right:30px;bottom:22px;font-family:'Sora';font-size:13px;color:#b7b2a6}
  .big{font-family:'Sora';font-weight:700;font-size:64px;color:var(--accent);line-height:1}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass for padel club owners',
   h:'The Coaching Engine', lede:'How to make your club the padel destination in your city, by turning coaching into the system that drives it, not a service on the side.'},

  {t:'who', eyebrow:'Who this is for',
   h:'Club owners and operators', body:'You run the courts, the bookings and the team. You can see padel growing around you. The question is no longer whether people will play. It is whether they will keep playing at your club.'},

  {t:'trap', eyebrow:'The trap',
   h:'Treating coaching as an add-on', body:'Most clubs sell court hours and bolt a few lessons on top. Coaching is whatever the coach on shift decides to teach. It fills a slot, then the player drifts, and you are back to selling the next empty hour.'},

  {t:'reframe', eyebrow:'The reframe',
   h:'Court time is a commodity', lede:'Any club with four courts can sell an hour. The club that owns coaching owns the thing players actually want, which is to get better. That is what they come back for, and it is the one thing a court alone cannot sell.'},

  {t:'part', eyebrow:'Part one', h:'Why courts alone do not build a club', kicker:'Four problems coaching is built to solve.'},

  {t:'list', eyebrow:'The four challenges', h:'What is quietly capping your growth', items:[
     ['1','<b>Inconsistent coaching.</b> Every coach teaches their own way, so quality swings and new hires start from scratch.'],
     ['2','<b>No clear pathway.</b> Players have no visible way to progress, so repeat bookings stall and momentum fades.'],
     ['3','<b>A disconnected community.</b> Court bookings alone do not create loyalty. Players need groups, not just slots.'],
     ['4','<b>Growth that will not scale.</b> When everything depends on one star coach, the club cannot grow past them.']
  ]},

  {t:'single', eyebrow:'The cost',
   h:'The empty off-peak court', body:'Every one of those four problems shows up in the same place: the quiet hours. You cannot discount your way out of them, because a discount rents a court once. A player on a pathway books the same hour every week.'},

  {t:'part', eyebrow:'Part two', h:'The system that makes coaching the engine', kicker:'Three stages that turn coaching into your club’s growth.'},

  {t:'steps', eyebrow:'The three-stage club system', h:'How a destination club is built', steps:[
     ['1','<b>Train your team.</b> One shared method, so every coach at your club teaches to the same standard.'],
     ['2','<b>Implement your programmes.</b> Structured adult and junior programmes with a clear, visible player pathway.'],
     ['3','<b>Keep developing your club.</b> Ongoing support and fresh content, so the system improves instead of going stale.']
  ]},

  {t:'single', eyebrow:'Stage one, in practice', h:'One method, not five',
   body:'When your whole team coaches from one shared framework, a lesson feels the same whoever delivers it. New coaches get productive in weeks, not seasons, and a player never has to start over because their usual coach is away.'},

  {t:'single', eyebrow:'Stage two, in practice', h:'A pathway players can see',
   body:'Beginners need a next step. Intermediates need a reason to keep showing up. A structured pathway gives every member an obvious reason to book again, and gives you adult and junior programmes that fill the court instead of emptying it.'},

  {t:'single', eyebrow:'Stage three, in practice', h:'A club that keeps improving',
   body:'Programmes are not a one-off project. With ongoing support and updated content, the system compounds, and your club stays ahead of the new courts opening down the road.'},

  {t:'method', eyebrow:'The coaching method', h:'The TPS Performance Cycle', kicker:'The loop that makes every session actually stick.', steps:[
     ['L','<b>Learn.</b> Players understand the why, so training gains compound instead of being forgotten.'],
     ['B','<b>Build.</b> Technique is refined through quality repetitions and focused exercises, not random hitting.'],
     ['R','<b>Reflect.</b> Each session is reviewed, so the next one starts smarter instead of from scratch.']
  ]},

  {t:'single', eyebrow:'Why it matters to the club', h:'Better players stay longer',
   body:'A method that produces real improvement is not just good coaching. It is retention. Players who feel themselves getting better renew, bring friends, and move up into higher-value programmes. That is the whole economics of a padel club, running quietly in the background.'},

  {t:'single', eyebrow:'The junior pipeline', h:'This year’s juniors are next year’s members',
   body:'A junior programme is not a nice extra. It is the most reliable membership pipeline a club has. Children who learn properly keep playing, their families stay close to the club, and the pathway carries them into adult programmes over time.'},

  {t:'part', eyebrow:'Part three', h:'When the engine is running', kicker:'And why this method, from this team.'},

  {t:'single', eyebrow:'The picture', h:'A full court at 2pm on a Tuesday',
   body:'Off-peak hours booked with coaching groups. A waiting list for the junior academy. Coaches who all teach to the same standard. Members who have been with you for years because they are still improving. That is a club that owns its market, not one of several options in town.'},

  {t:'why', eyebrow:'Why this team', h:'Built by people who coach at the top',
   body:'The Padel School’s system comes from Sandy Farquharson, a World Padel Tour player who captained the Men’s GB team for over a decade and holds a Master’s in Biomechanics. It is trusted by national federations to build coach-education pathways. This is the same system, packaged so your club can run it.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Build the coaching engine at your club', body:'If you want the system that turns coaching into your club’s growth, the next step is a conversation with The Padel School about the Club Partner Programme and the TPS Academy. We will look at your courts, your team and your market, and map what a coaching engine would look like for you.',
   disc:'This masterclass is educational. It shares a coaching and club-development system and does not guarantee any specific revenue, membership, or business result. Outcomes depend on your market, your team, and how the system is implemented.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='cta'?'cta':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h) h+='<h1 style="'+(s.t==='title'||s.t==='cta'?'':'font-size:36px')+'">'+s.h+'</h1>';
  if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
  if(s.body) h+='<p class="body">'+s.body+'</p>';
  if(s.kicker) h+='<p class="kicker">'+s.kicker+'</p>';
  if(s.items){h+='<ul>';s.items.forEach(it=>h+='<li><span class="n">'+it[0]+'</span>'+it[1]+'</li>');h+='</ul>';}
  if(s.steps){s.steps.forEach(st=>h+='<div class="step"><span class="dot">'+st[0]+'</span><span class="txt">'+st[1]+'</span></div>');}
  if(s.t==='part') h+='<span class="tag">The Coaching Engine</span>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
