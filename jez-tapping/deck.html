<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The First 66 Days · Jez Tapping</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Questrial&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#20211f; --panel:#2b2c29; --rule:#4a4b47;
    --ink:#ECEAE3; --accent:#4FA6A3; --grey:#B7B4AA; --dim:#7d7d7a;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Questrial',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Syne',sans-serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.01em}
  .t-title h1{font-size:3.6vw;max-width:88%}
  .t-normal h1{font-size:2.6vw;max-width:84%}
  .t-normal .body{font-family:'Questrial',sans-serif;font-size:1.35vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.58;font-weight:400}
  .sub{font-family:'Questrial',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Questrial',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.8vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.7vw;max-width:80%;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:6px;padding:1.3vh 1.6vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.84vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .route-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-route{right:6%;bottom:8%;width:13vw}
  .corner-route{right:6%;bottom:7%;width:5.6vw;opacity:.5}
  .brandline{font-family:'Questrial',sans-serif;font-size:1.18vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Questrial',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Questrial',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Questrial',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 17</div>
<div class="brand-foot">Indoor Climbing Industry Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- route motif: a bolted climbing line stepping up through clip points, echoing a logged route on a topo rather than a generic growth arrow -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="route" viewBox="0 0 200 220">
  <g fill="none" stroke="#4FA6A3" stroke-width="3" stroke-linecap="round">
    <path d="M30,210 L60,170 L50,120 L90,90 L80,40 L120,15" opacity="0.95"/>
  </g>
  <g fill="#4FA6A3">
    <circle cx="30" cy="210" r="5"/><circle cx="60" cy="170" r="5"/><circle cx="50" cy="120" r="5"/>
    <circle cx="90" cy="90" r="5"/><circle cx="80" cy="40" r="5"/><circle cx="120" cy="15" r="6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The First 66 Days',sub:'A masterclass for climbing gym owners on the early-visit habit that predicts who sticks around, built by someone who ran the UK\'s largest climbing estate.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You are pouring effort into intro courses, and losing a chunk of those climbers inside the first couple of months.',body:'Most climbing gym marketing is built to fill intro-to-climbing courses. That part usually works. What a lot of gyms don\'t have is a system for the weeks right after the course ends, which is roughly the window that decides whether that person becomes a member.'},
 {t:'dark',title:'A full intro class means little if nobody comes back for month two.'},

 {t:'section',idx:'Part One',title:'Retention Is a Habit Problem, Not Just a Discount Problem'},
 {t:'normal',k:'A journey built around the segment, not one generic path',title:'A casual drop-in and a structured, coached climber, junior or adult, are not walking the same journey.',body:'Most gyms run everyone through the same generic onboarding. Design the journey to the segment instead, drop-in visitors one way, coached-program starters (juniors and adults each with their own path within that) another, and safety, satisfaction, and growth tend to improve together instead of trading off against each other.'},
 {t:'normal',k:'The 66-day approach',title:'He targets frequent visits in the first couple of months after an intro course.',body:'Habit-formation research (an average of roughly 66 days, with a wide range depending on the person and the behaviour) points to a rough target: get someone back often in that early window and the habit has a real chance to form. Applied to a climbing gym, that early stretch after the intro course, not the course itself, is where he focuses.'},
 {t:'dark',title:'You are not just selling a membership. You are trying to build a habit.'},

 {t:'section',idx:'Part Two',title:'The System Built Around That Window'},
 {t:'normal',k:'A two-stage return process',title:'Stage one gets them back once. Stage two is what makes coming back a habit.',body:'Stage one is a simple incentive to return after the intro course, something like a free month. Stage two is staff-driven: front-desk and coach interactions that escalate from small talk into real questions, turning a casual visit into a memory the climber actually keeps.'},
 {t:'normal',k:'Touchpoints that go past "hello"',title:'"Hello" and "how was your session?" are a starting point, not the whole conversation.',body:'Most staff stop at the greeting. He trains staff to escalate: from a greeting, to a specific question about the session, to a genuinely insightful one. That escalation is what turns a transaction into a relationship, and a relationship is what tends to survive those early weeks.'},
 {t:'normal',k:'A learn-to-climb program with somewhere to go',title:'Modelled on real national progression pathways like NICAS, not a one-off intro class.',body:'A course that ends after one session has nowhere for the habit to attach. A program built around a genuine progression pathway, the kind NICAS runs nationally for climbers, gives a new climber somewhere to keep climbing toward.'},
 {t:'dark',title:'Built by someone who managed the UK\'s largest climbing estate, not a theory from a book.'},

 {t:'section',idx:'Part Three',title:'Where This Comes From'},
 {t:'normal',k:'Why Jez Tapping',title:'Nearly 20 years inside indoor climbing operations, not marketing.',body:'Managed Westway Climbing Centre. Five years as Regional Climbing Manager at Everyone Active, running the UK\'s largest climbing estate. A trustee of NICAS. This approach was built running gym floors, not writing about them.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Own 66-Day System'},
 {t:'normal',k:'How it works',title:'Start with a call, then build the retention system for your own gym.',body:'A free consultation call is the starting point. From there, engagements range from a monthly Core Support retainer through to a full Business Performance Review or a Systems and Structure project built around your gym specifically.'},
 {t:'cta',title:'Ready to stop losing first-timers after one visit?',chips:['Book your free consultation call'],disc:'Educational content for climbing gym owners. No income, growth, or business result is guaranteed. Results vary by gym, market, and effort.'},
];

const deck=document.getElementById('deck');
function routeSvg(kind){return `<svg class="route-motif ${kind==='title'?'title-route':'corner-route'}"><use href="#route"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Indoor Climbing Industry <b>Consulting</b> &middot; Jez Tapping</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=routeSvg(s.arc);
  else if(s.t==='title') h+=routeSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
