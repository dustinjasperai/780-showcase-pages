<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Student to Teacher - A Live Masterclass with Rina Jakubowicz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Karla:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf9f6;        /* warm white ground, from site light render */
    --panel:#f1efe8;     /* soft panel */
    --ink:#223040;       /* deep ink */
    --muted:#5d6b74;     /* muted slate */
    --accent:#1f536d;    /* her H2 teal (brand.json rgb 31,83,109) */
    --sage:#83b692;      /* her sage accent (brand.json rgb 131,182,146) */
    --rule:#d9d4c7;
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Karla',-apple-system,Segoe UI,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e7e4dc;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border-radius:14px;
    aspect-ratio:16/9;margin:0 0 22px;padding:64px 72px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 #fff inset,0 10px 30px rgba(34,48,64,.08);
    overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:72px;right:72px;bottom:40px;height:2px;background:linear-gradient(90deg,var(--sage),transparent 70%)}
  .num{position:absolute;top:34px;right:40px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .brandmark{position:absolute;top:32px;left:72px;font-family:var(--serif);font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:20px;font-weight:600}
  h1{font-family:var(--serif);font-weight:600;font-size:58px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.08;margin-bottom:16px}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);max-width:30ch}
  .big{font-family:var(--serif);font-size:46px;line-height:1.12;max-width:20ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);max-width:40ch}
  .kicker{font-size:15px;letter-spacing:.16em;text-transform:uppercase;color:var(--sage);font-weight:700;margin-bottom:14px}
  .partnum{font-family:var(--serif);font-size:120px;color:var(--panel);position:absolute;right:56px;bottom:10px;line-height:1}
  ul.clean{list-style:none;margin-top:10px}
  ul.clean li{font-size:19px;line-height:1.55;padding:10px 0 10px 26px;position:relative;max-width:42ch;border-bottom:1px solid var(--rule)}
  ul.clean li:last-child{border-bottom:0}
  ul.clean li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;background:var(--sage)}
  .shift h2 span{color:var(--accent)}
  .cite{font-size:15px;color:var(--muted);margin-top:16px;font-style:italic}
  .cta{background:var(--accent);color:#fff}
  .cta::after{display:none}
  .cta .brandmark{color:#bcd4df}
  .cta h2{color:#fff}
  .cta .lede{color:#dce6ea}
  .cta .step{margin-top:22px;font-size:20px;font-weight:600;color:#fff}
  .disclaimer{position:absolute;left:72px;right:72px;bottom:30px;font-size:12px;line-height:1.5;color:#9fb6c1}
  .two{display:flex;gap:40px;align-items:center}
  .two .col{flex:1}
  .quote{font-family:var(--serif);font-size:38px;line-height:1.2;max-width:24ch}
  .quote .mk{color:var(--sage)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    h1:'From Student to Teacher',
    lede:'The three shifts that turn a devoted practitioner into a teacher people seek out.',
    eyebrow:'A live masterclass with Rina Jakubowicz' },

  {t:'audience',
    kicker:'Who this is for',
    h2:'You already love the practice.',
    body:'You come to the mat most days. You have felt what yoga does. And somewhere in you is the thought that will not leave: I want to teach this.' },

  {t:'trap',
    kicker:'The trap',
    big:'But "someday I will do my training" keeps turning into next year.' },

  {t:'reframe',
    kicker:'The real reason',
    big:'It was never about your poses.',
    body:'What holds people back from teaching is not flexibility or years on the mat. It is not knowing how to lead, from the inside out.' },

  {t:'part', num:'1', kicker:'Part one', h2:'Why most new teachers feel like frauds' },

  {t:'content',
    h2:'Certification is not confidence.',
    body:'Many trainings hand you a stack of poses and a certificate. Then you stand in front of a room and realize nobody taught you the part that matters: how to hold the space, and why any of it works.' },

  {t:'content',
    h2:'Students feel the difference.',
    body:'There is a teacher who knows the shapes, and a teacher who knows the yoga. Students cannot always name it, but they feel which room they are in, and they come back to one of them.' },

  {t:'part', num:'2', kicker:'Part two', h2:'The three shifts' },

  {t:'shift',
    kicker:'Shift one',
    h2:'<span>Teach from philosophy,</span> not just poses.',
    body:'The Yoga Mind distills the Bhagavad Gita, the Yoga Sutras and Vedanta into 52 principles you can actually live and teach. When your class carries a principle, a sequence becomes a lesson people remember.',
    cite:'From The Yoga Mind, 52 Essential Principles of Yoga Philosophy.' },

  {t:'content',
    h2:'One principle, taught well.',
    body:'You do not lecture philosophy. You thread one idea through breath, movement and stillness, so a student leaves having felt it in their body, not just heard it.' },

  {t:'shift',
    kicker:'Shift two',
    h2:'<span>Lead the room</span> with presence.',
    body:'Positive energy is contagious. The state you walk in with sets the room before you say a word. Leading is a skill you can practice, and it is what turns a class into a following.' },

  {t:'content',
    h2:'Presence is trainable.',
    body:'Voice, pacing, where you stand, how you hold a pause. These are not personality. They are craft, and they are learnable over a supervised practicum, not a weekend.' },

  {t:'shift',
    kicker:'Shift three',
    h2:'<span>Build a teaching life</span> that pays.',
    body:'The shift most trainings leave out entirely. Passion, purpose and profit are not opposites. A teacher who understands the business of yoga gets to keep teaching, because the work sustains itself.',
    cite:'From A Yoga Business Breakthrough, Five Essential Shifts.' },

  {t:'content',
    h2:'Teaching is a practice and a profession.',
    body:'You can honor the tradition and still build something that supports your life. One does not cost the other. That is the whole point of the third shift.' },

  {t:'part', num:'3', kicker:'Part three', h2:'The teacher you become' },

  {t:'content',
    h2:'A teacher people seek out.',
    body:'Grounded in philosophy. Calm and clear in front of a room. Teaching in the language your community speaks. And building a life around the work, not squeezing the work around a life.' },

  {t:'quote',
    quote:'<span class="mk">"</span>You do not find peace. You practice it.<span class="mk">"</span>',
    cite:'Rina Jakubowicz' },

  {t:'why',
    kicker:'Why learn this from Rina',
    h2:'Twenty-five years, two languages.',
    items:[
      'Teaching yoga in English and Spanish for over 25 years',
      'Author of The Yoga Mind and Choose Peace, read worldwide',
      'Featured at Wanderlust, Kripalu, Omega and Yoga Journal conferences',
      'Founder of Rina Yoga and Super Yogis'
    ] },

  {t:'recap',
    kicker:'The three shifts',
    h2:'Teach. Lead. Sustain.',
    items:[
      'Teach from philosophy, not just poses',
      'Lead the room with contagious, grounded presence',
      'Build a teaching life that actually pays'
    ] },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Train with Rina.',
    lede:'Ready to make these shifts yours? The 200-Hour Teacher Training is where you build them, in English or Spanish, with mentorship and a supervised practicum.',
    step:'Learn more and enroll at rinayoga.com',
    disclaimer:'This masterclass is for educational purposes. Yoga teaching outcomes vary by individual effort and circumstances. No specific income or professional result is promised or guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'cta' ? 'cta' : '') + (s.t === 'shift' ? ' shift' : '');
  let inner = '';
  inner += '<div class="brandmark">Rina Yoga</div>';
  if (s.t !== 'cta') inner += '<div class="num">' + String(i+1).padStart(2,'0') + ' / ' + String(S.length).padStart(2,'0') + '</div>';
  if (s.eyebrow) inner += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.kicker) inner += '<div class="kicker">' + s.kicker + '</div>';
  if (s.h1) inner += '<h1>' + s.h1 + '</h1>';
  if (s.h2) inner += '<h2>' + s.h2 + '</h2>';
  if (s.big) inner += '<div class="big">' + s.big + '</div>';
  if (s.quote) inner += '<div class="quote">' + s.quote + '</div>';
  if (s.body) inner += '<p class="body" style="margin-top:14px">' + s.body + '</p>';
  if (s.items) { inner += '<ul class="clean">'; s.items.forEach(x => inner += '<li>' + x + '</li>'); inner += '</ul>'; }
  if (s.lede) inner += '<div class="lede" style="margin-top:14px">' + s.lede + '</div>';
  if (s.cite) inner += '<div class="cite">' + s.cite + '</div>';
  if (s.step) inner += '<div class="step">' + s.step + '</div>';
  if (s.num) inner += '<div class="partnum">' + s.num + '</div>';
  if (s.disclaimer) inner += '<div class="disclaimer">' + s.disclaimer + '</div>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
