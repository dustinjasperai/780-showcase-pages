<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>What Two Locations Taught Me About Staffing · Jennifer Bryant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#434a53; --panel:#525a64; --rule:#5f6873;
    --ink:#f5f5f0; --accent:#45bfd1; --accent2:#c75c9a; --dim:#aab0b8; --grey:#c7ccd2;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Lato',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Baloo 2',sans-serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.8vw;max-width:88%}
  .t-normal h1{font-size:2.75vw;max-width:86%}
  .t-normal .body{font-family:'Lato',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.58;font-weight:400}
  .sub{font-family:'Lato',sans-serif;font-size:1.6vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Lato',sans-serif;font-size:1.3vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent2);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3vw;max-width:80%;font-style:italic;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.3vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .daub-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-daub{right:5%;bottom:6%;width:16vw}
  .corner-daub{right:6%;bottom:7%;width:6.8vw;opacity:.5}
  .brandline{font-family:'Lato',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.2);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600;font-family:'Lato',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700;font-family:'Lato',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Lato',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">Small Hands Big Art</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- clay-daub motif: a loose, hand-thrown paint/clay daub shape, echoing "made by hand" over a rigid corporate line -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="daub" viewBox="0 0 260 100">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M10,60 C30,20 70,15 95,45 C115,70 145,25 175,40 C200,52 195,85 225,70" stroke="#5f6873" opacity="0.85"/>
    <circle cx="70" cy="30" r="9" fill="#c75c9a" opacity="0.9" stroke="none"/>
    <circle cx="200" cy="60" r="12" fill="#45bfd1" opacity="0.9" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"What Two Locations Taught Me About Staffing (And Charging What You’re Worth)",sub:'A masterclass for art studio owners on building a team and a price list that let the business run without you standing in every room.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You opened a studio because you love teaching kids to make things, not because you love running payroll.',body:'Most art studio owners get good at the art side fast. The business side, hiring the right people, pricing a class so it actually covers what it costs to run, gets figured out by trial and error, usually the hard way.'},
 {t:'dark',title:"A studio that only runs when you’re in the room is not a business yet. It’s a job with your name on the sign."},

 {t:'section',idx:'Part One',title:'Why the Owner Becomes the Bottleneck'},
 {t:'normal',k:'One person, every decision',title:'If every class, every hire, and every price change routes through you, growth just means more hours for you.',body:'Adding a second location, a new camp session, or a longer class list only works if someone besides you can run it the way you would. Most studios never build that, so growth stalls right where the owner runs out of hours.'},
 {t:'normal',k:'A full schedule can hide the real problem',title:'Busy is not the same as built right.',body:'Plenty of studios are fully booked and still barely profitable, because the pricing was set early, before anyone knew what materials, staff hours, and studio time actually cost. A packed camp season at the wrong price per seat is still a problem, just a busy one.'},
 {t:'dark',title:'You do not need to work more hours. You need a team and a price list built for the business you actually have.'},

 {t:'section',idx:'Part Two',title:'The Two Things That Actually Change It'},
 {t:'normal',k:'Staffing and leadership',title:'Hiring people who love showing up, and training them so class quality does not depend on which teacher is on the schedule.',body:'Staffing a studio is not the same as staffing a retail counter. The instructor is the product for the hour a family is in the room. Building a culture where a teacher runs a class the way you would, without you standing in the doorway, is what actually lets you step back.'},
 {t:'normal',k:'Pricing strategy',title:'Classes, camps, parties, and memberships each need their own pricing logic, not one number copied across all of them.',body:'A birthday party, a six-week class series, and a summer camp week have different material costs, different staff hours, and different demand. Pricing them off the same gut-feel number is how a studio ends up busy and still tight on cash every month.'},
 {t:'normal',k:'Where startup planning fits in',title:'Getting the location, the initial class list, and the business structure right before you open saves years of expensive correction later.',body:'A lot of what looks like a staffing or pricing problem two years in was actually decided on day one: the wrong location for the target family, or a curriculum built before anyone tested what parents would actually pay for.'},
 {t:'dark',title:'A second location does not fix a first location that was never built to run without you.'},

 {t:'section',idx:'Part Three',title:'What This Actually Looks Like at Two Locations'},
 {t:'normal',k:'What changes first',title:"Most owners start with the three things costing them the most: who is on the schedule, what each offering is actually priced at, and where the owner’s time goes.",body:'A single focused session maps your top three issues and an action plan built around your studio specifically, not a generic top-ten list every studio owner gets handed.'},
 {t:'normal',k:'Why Jennifer Bryant',title:'Fifteen-plus years running a real, profitable, two-location studio, not a course built by someone who has never run one.',body:'Jennifer left a career in law and finance to open Small Hands Big Art in Charlotte in 2009, then opened a second location in Fort Mill in 2018. She is teaching from decisions she made and lived with: staffing two locations, pricing classes, camps, parties, and memberships, and planning a studio from a blank slate.'},

 {t:'section',idx:'Your Next Step',title:'Build the Team and the Price List'},
 {t:'normal',k:'How the mentorship works',title:'From a single focused session up to ongoing monthly mentorship.',body:'A 90-Minute Deep Dive works through one specific challenge. The 3-Session Startup Pack covers the foundational business setup for a new studio. Monthly Mentorship pairs two calls a month with ongoing email support for owners working through staffing, pricing, and growth decisions as they come up.'},
 {t:'cta',title:'Ready to build the studio that runs without you in every room?',chips:['Book a Discovery Call','Explore Monthly Mentorship'],disc:'Educational content for art studio owners. No income, enrollment, or business result is guaranteed. Results vary by studio, market, and effort.'},
];

const deck=document.getElementById('deck');
function daubSvg(kind){return `<svg class="daub-motif ${kind==='title'?'title-daub':'corner-daub'}"><use href="#daub"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Small Hands <b>Big Art</b> &middot; Jennifer Bryant</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=daubSvg(s.arc);
  else if(s.t==='title') h+=daubSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
