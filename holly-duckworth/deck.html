<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Authentic Intelligence - Holly Duckworth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e7efed;        /* pale teal tint derived from brand #006269/#1c545d */
    --panel:#fbfdfc;
    --rule:#c9d8d5;
    --ink:#12343b;        /* deep teal-navy, derived from #006269/#011627 */
    --muted:#5c6b6e;
    --accent:#1c545d;     /* brand.json primary teal (11 uses) */
    --accent2:#006269;    /* brand.json deep teal (8 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Montserrat',system-ui,sans-serif;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:48px 44px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-family:'Oswald',sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-size:13px;margin-bottom:14px}
  h1{font-family:'Oswald',sans-serif;font-weight:700;font-size:52px;line-height:1.05;color:var(--ink);margin-bottom:16px}
  h2{font-family:'Oswald',sans-serif;font-weight:600;font-size:34px;line-height:1.1;color:var(--ink);margin-bottom:14px}
  p{font-size:19px;color:var(--ink);margin-bottom:12px;max-width:62ch}
  p.sub{color:var(--muted);font-size:18px}
  .big{font-size:30px;font-weight:500;line-height:1.3}
  ul{margin:10px 0 0 0;padding:0;list-style:none}
  li{font-size:19px;padding:10px 0 10px 28px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}
  .num{font-family:'Oswald',sans-serif;color:var(--accent2);font-weight:700;font-size:15px;letter-spacing:.1em;margin-bottom:10px;text-transform:uppercase}
  .cta{background:var(--accent);color:#f6f3ee}
  .cta .eyebrow,.cta h1,.cta h2,.cta p{color:#f6f3ee}
  .cta .eyebrow{color:#cfe3e2}
  .disclaimer{font-size:14px;color:#cfe3e2;margin-top:20px;max-width:64ch}
  .foot{font-family:'Oswald',sans-serif;color:var(--muted);font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin-top:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Holly Duckworth',h1:'Authentic Intelligence',sub:'Leading as a whole human in an AI world',foot:'Holly Duckworth, CAE, CMP, LSP'},
 {t:'promise',eyebrow:'What you will leave with',h2:'One hour from now',body:'A clear way to use AI with more confidence and better judgment, and a personal sense of what you want to keep human. Not another list of 100 tools. A way of deciding.'},
 {t:'who',eyebrow:'Who this is for',h2:'Accomplished women leaders',body:'You lead a business, a team, a career, or yourself through change. You know AI matters. You do not want to chase every new tool or feel like you have to become a technologist to keep up.'},
 {t:'trap',eyebrow:'The trap',h2:'The noise is the trap',body:'Every day there is a new model, a new headline, a new "you are behind." So the honest response becomes either freeze, or grab every tool and lose yourself in the process.'},
 {t:'reframe',eyebrow:'The real risk',h2:'It is not falling behind on tools',big:'The real risk is quietly handing over your judgment. The tools are easy. Keeping your discernment, your presence, and your voice is the hard part, and it is the part that matters.'},
 {t:'part',num:'Part One',h2:'The false choice',body:'We have been told it is human OR artificial. Be warm, or be efficient. Lead with heart, or lead with data. That framing is wrong, and it is costing women leaders the most.'},
 {t:'content',eyebrow:'Why it costs you',h2:'Authentic Intelligence',body:'Authentic Intelligence is the pairing of human wisdom with AI innovation. Your capacity for authentic connection, judgment, and presence is becoming your competitive advantage, not the thing AI erases. Technology should make us more human, not less.'},
 {t:'part',num:'Part Two',h2:'The Compass to Empowerment',body:'When AI is changing everything, you need a way to decide, not a bigger toolbox. This is the compass I teach, five points to lead, decide, and grow as a whole human.'},
 {t:'point',num:'Point 1',h2:'Get Clear',body:'Separate what matters from the noise. Name where AI could create real value in your work and life, and where it is just more headline.'},
 {t:'point',num:'Point 2',h2:'Stay Conscious',body:'Know where to trust AI, where to question it, and where human judgment still belongs firmly in the driver seat. Discernment is a skill, not a mood.'},
 {t:'point',num:'Point 3',h2:'Build Confidence',body:'Move from hesitation to experimentation by learning through use, not by trying to master every new tool before you touch it.'},
 {t:'point',num:'Point 4',h2:'Create Connection',body:'Use technology in ways that strengthen communication, relationships, and the human experience rather than flatten them.'},
 {t:'point',num:'Point 5',h2:'Choose Curated Tools',body:'Build a small, intentional AI toolkit around what you actually need, instead of what everyone else says you should have. No giant list. No overwhelm.'},
 {t:'part',num:'Part Three',h2:'A week on the other side of the compass',body:'You stop reacting to every AI headline. You make one clear decision about where AI helps and where you keep it human. You lead from clarity instead of pressure.'},
 {t:'why',eyebrow:'Why me',h2:'I have lived this question',body:'I am a keynote speaker, author, and leadership strategist. I founded the AI Empowered Women community, I write the AI Pathfinder, and I spoke at TEDxFranklin on the human impact of change and connection. My whole body of work sits where leadership, wellbeing, and AI meet.'},
 {t:'recap',eyebrow:'The compass, again',h2:'Clear. Conscious. Confident.',body:'Get Clear, Stay Conscious, Build Confidence, Create Connection, Choose Curated Tools. One compass you can carry into every AI decision from here.'},
 {t:'cta',eyebrow:'Your next step',h1:'Become future ready',body:'If you want help applying this to your own leadership, the next step is a one-to-one conversation, or joining the next Future Ready Female Lab cohort with me.',disclaimer:'This masterclass is educational. Results vary from person to person, and nothing here is a promise or guarantee of any specific income or outcome.',foot:'Holly Duckworth · AI Empowered Women'}
];
const d=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
  if(s.big) h+='<p class="big">'+s.big+'</p>';
  if(s.body) h+='<p>'+s.body+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.disclaimer) h+='<p class="disclaimer">'+s.disclaimer+'</p>';
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
