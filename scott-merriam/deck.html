<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Becoming Whole Together | A Masterclass with Pacific Integral</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --paper:#f6f4ee;
    --panel:#fffdf8;
    --ink:#002539;
    --ink-soft:#3a4a50;
    --muted:#6d7a7c;
    --accent:#253d31;
    --teal:#0f4450;
    --rule:#dcd9cf;
  }
  html,body{height:100%;}
  body{
    font-family:'Hanken Grotesk',-apple-system,sans-serif;
    background:var(--accent);
    color:var(--ink);
  }
  #stage{max-width:1040px;margin:0 auto;padding:28px 20px 90px;}
  .slide{
    position:relative;
    background:
      radial-gradient(120% 90% at 85% 8%, rgba(15,68,80,0.06), transparent 60%),
      radial-gradient(90% 80% at 10% 100%, rgba(37,61,49,0.07), transparent 55%),
      var(--paper);
    border:1px solid var(--rule);
    border-radius:4px;
    aspect-ratio:16/9;
    margin:0 0 22px;
    padding:60px 66px;
    display:flex;flex-direction:column;justify-content:center;
    overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,0.03);
  }
  .slide::before{
    content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);
  }
  .kicker{font-size:12px;font-weight:600;letter-spacing:0.18em;text-transform:uppercase;color:var(--teal);margin-bottom:18px;}
  h1{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:60px;line-height:1.04;color:var(--ink);letter-spacing:-0.01em;}
  h2{font-family:'Bodoni Moda',Georgia,serif;font-weight:600;font-size:42px;line-height:1.1;color:var(--ink);margin-bottom:18px;}
  .promise{font-family:'Bodoni Moda',Georgia,serif;font-size:27px;color:var(--ink-soft);margin-top:22px;line-height:1.3;font-style:italic;}
  p.lead{font-size:20px;line-height:1.55;color:var(--ink-soft);max-width:40ch;}
  ul{list-style:none;margin-top:14px;}
  li{font-size:19px;line-height:1.5;color:var(--ink-soft);padding:11px 0 11px 30px;position:relative;border-bottom:1px solid var(--rule);}
  li:last-child{border-bottom:none;}
  li::before{content:'';position:absolute;left:2px;top:20px;width:9px;height:9px;border-radius:50%;background:var(--accent);}
  .big{font-family:'Bodoni Moda',Georgia,serif;font-size:46px;line-height:1.14;color:var(--ink);max-width:24ch;}
  .facet-num{font-family:'Bodoni Moda',Georgia,serif;font-size:22px;color:var(--teal);margin-bottom:8px;}
  .quote{font-family:'Bodoni Moda',Georgia,serif;font-size:36px;line-height:1.26;color:var(--ink);max-width:26ch;}
  .cite{font-size:14px;color:var(--muted);margin-top:22px;letter-spacing:0.04em;}
  .note{font-size:14px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:60ch;}
  .cta-steps{margin-top:16px;}
  .cta-steps li::before{background:var(--teal);}
  .disc{font-size:12.5px;color:var(--muted);margin-top:30px;line-height:1.5;max-width:70ch;border-top:1px solid var(--rule);padding-top:14px;}
  .pager{position:absolute;right:26px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:0.08em;}
  .brandline{position:absolute;left:66px;bottom:20px;font-size:12px;color:var(--muted);letter-spacing:0.08em;}
  @media(max-width:720px){
    .slide{padding:34px 30px;}
    h1{font-size:38px;} h2{font-size:30px;} .big{font-size:30px;} .quote{font-size:26px;}
    p.lead,li{font-size:16px;} .promise{font-size:20px;}
  }
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title',
    kicker:"A live masterclass with Pacific Integral",
    title:"Becoming Whole Together",
    promise:"Why your next real growth is not another thing to master, but a deeper way of being, relating, and leading that you grow into with others."
  },
  {t:'content',
    kicker:"Who this is for",
    title:"You have done the work. And you sense there is further to go.",
    points:[
      "You have read, practiced, sat, journaled, led. Real change happened.",
      "And still there is a gap between the change you long to embody and your capacity to enact it under pressure.",
      "You are a leader, coach, or changemaker who senses the limits of conventional self-improvement.",
      "You are not looking for one more framework to collect. You are looking for a way to actually become."
    ]
  },
  {t:'statement',
    kicker:"The trap",
    big:"Most development asks you to rise above your humanity. The deepest development asks you to inhabit it more fully."
  },
  {t:'quote',
    kicker:"A reframe",
    quote:"This gap you feel is not a failing. It is an invitation to a fundamental shift in how you relate to yourself and everything around you.",
    cite:"The premise this whole hour is built on"
  },
  {t:'content',
    kicker:"Part one  ·  why growth stalls",
    title:"Insight is not the same as lived capacity.",
    points:[
      "We collect insights in the mind. But the mind is only one room of the house.",
      "Under real stress, the old patterns run anyway, because they live in the body and in how we relate, not in what we understand.",
      "So we end up knowing more and changing less. The understanding outpaces the becoming.",
      "Development that lasts has to move through the whole being, not just the intellect."
    ]
  },
  {t:'statement',
    kicker:"Part one  ·  the hidden reason",
    big:"We treat our own growth as a solo project. But your deepest unfolding happens through relationship, not apart from it."
  },
  {t:'content',
    kicker:"Part two  ·  the model",
    title:"The Seven Facets of Awakened Wholeness",
    lead:"Not seven skills to master in sequence. Seven doorways into the wholeness that is already here, engaged as an ecology of practice that opens as you do.",
    note:"Grounded in two decades of research in post-conventional adult development, including the STAGES developmental model. Where you are developmentally shapes what each facet can mean for you next."
  },
  {t:'facet',
    num:"Facet one",
    title:"Awakening",
    lead:"The path of freedom. Recognizing that you are boundless openness and also this particular life, and learning to orient from that ground in a way that inspires care for the world."
  },
  {t:'facet',
    num:"Facet two",
    title:"Complexity",
    lead:"Holding paradox and seeing more. Widening your view enough to hold the greater whole beyond the polarities, even when the parts seem incompatible."
  },
  {t:'facet',
    num:"Facet three",
    title:"Embodiment",
    lead:"Fully inhabiting this life. Working with the patterns that structure how life flows through you, so truth is something you live and not only something you grasp."
  },
  {t:'facet',
    num:"Facet four",
    title:"Collective",
    lead:"Creating the field for mutual evolution. The capacities of love and truthfulness that let a group become a place where something larger than any one person can emerge."
  },
  {t:'facet',
    num:"Facet five",
    title:"Integration",
    lead:"Welcoming all of yourself. Including what has been disowned and releasing what was never actually yours to carry."
  },
  {t:'facet',
    num:"Facet six",
    title:"Intimacy",
    lead:"Cultivating healthy, open, awakened connection. Meeting what gets in the way of real contact, and practicing what becomes possible when you are willing to be truly present."
  },
  {t:'facet',
    num:"Facet seven",
    title:"Expression",
    lead:"Partnering with what wants to emerge through you. Following the movement of life rather than forcing an outcome from personal will."
  },
  {t:'statement',
    kicker:"Part two  ·  the distinctive edge",
    big:"Rigor and aliveness in one practice. The developmental clarity of real research, held in the warmth of a living community."
  },
  {t:'content',
    kicker:"Part three  ·  how it lives",
    title:"Growth as an ecology, not a ladder.",
    points:[
      "You stop managing yourself and start tending the conditions in which you naturally unfold.",
      "The facets are not steps. You move among them as life asks, and they deepen each other.",
      "You practice in a cohort, because a field of awakened awareness makes a quality of becoming possible that solitude cannot.",
      "Insight becomes lived capacity: more presence, more range, more trust in your own guidance."
    ]
  },
  {t:'quote',
    kicker:"What people describe",
    quote:"I arrived feeling like an outlier in my own life. I departed knowing I am part of an emerging story much larger than myself.",
    cite:"A graduate, in their own words"
  },
  {t:'content',
    kicker:"Why Pacific Integral",
    title:"Twenty years, three continents, one question.",
    points:[
      "Since 2003 we have pioneered research and practice in post-conventional development, emergent leadership, and collective intelligence.",
      "Our faculty includes recognized researchers in adult development and the STAGES model.",
      "This work has reached thousands of leaders, coaches, and changemakers around the world.",
      "We hold one question underneath all of it: what becomes possible when we grow whole, together?"
    ]
  },
  {t:'statement',
    kicker:"The invitation",
    big:"The transformation you seek is not about transcending your humanity. It is about discovering your belonging within it."
  },
  {t:'cta',
    kicker:"Where to go from here",
    title:"Take the next step with us.",
    lead:"If something in this hour resonated, the natural next step is a conversation, not a commitment.",
    steps:[
      "Schedule a discovery conversation to explore what is alive for you right now and whether deeper work fits.",
      "Go deeper in Generating Transformative Change, our nine month cohort journey into awakened wholeness.",
      "Begin where you are, with a single practice from today you can return to this week."
    ],
    disc:"This masterclass is educational. It describes a developmental practice and shares the experiences of past participants. It is not therapy or medical advice, and no specific personal, professional, or financial result is guaranteed. Results vary from person to person."
  }
];

const stage = document.getElementById("stage");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  let h = "";
  if (s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if (s.t === "title") {
    h += `<h1>${s.title}</h1>`;
    if (s.promise) h += `<div class="promise">${s.promise}</div>`;
  } else if (s.t === "statement") {
    h += `<div class="big">${s.big}</div>`;
  } else if (s.t === "quote") {
    h += `<div class="quote">&ldquo;${s.quote}&rdquo;</div>`;
    if (s.cite) h += `<div class="cite">${s.cite}</div>`;
  } else if (s.t === "facet") {
    h += `<div class="facet-num">${s.num}</div>`;
    h += `<h2>${s.title}</h2>`;
    h += `<p class="lead">${s.lead}</p>`;
  } else if (s.t === "cta") {
    h += `<h2>${s.title}</h2>`;
    if (s.lead) h += `<p class="lead">${s.lead}</p>`;
    if (s.steps) { h += `<ul class="cta-steps">`; s.steps.forEach(x => h += `<li>${x}</li>`); h += `</ul>`; }
    if (s.disc) h += `<div class="disc">${s.disc}</div>`;
  } else {
    h += `<h2>${s.title}</h2>`;
    if (s.lead) h += `<p class="lead">${s.lead}</p>`;
    if (s.points) { h += `<ul>`; s.points.forEach(x => h += `<li>${x}</li>`); h += `</ul>`; }
    if (s.note) h += `<div class="note">${s.note}</div>`;
  }
  h += `<div class="brandline">Pacific Integral</div>`;
  h += `<div class="pager">${i + 1} / ${S.length}</div>`;
  el.innerHTML = h;
  stage.appendChild(el);
});
</script>
</body>
</html>
