<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pricing for Profit — Web Designer Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1ea;      /* warm linen ground (light-scheme brand) */
    --panel:#fffdf9;   /* warm white panel */
    --ink:#313131;     /* brand.json dominant charcoal */
    --muted:#6b6b6b;
    --accent:#2440c4;  /* brand blue, from brand.json #0000ee + live-site blue primary */
    --accent2:#e8795a; /* testimonial-section warm coral, used sparingly */
    --rule:#e7e2da;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  h1,h2,h3,.eyebrow{font-family:'Poppins',system-ui,sans-serif}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-.01em}
  h2{font-size:36px;line-height:1.12;font-weight:600;letter-spacing:-.01em;margin-bottom:18px}
  h3{font-size:22px;font-weight:600;margin-bottom:8px}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:62ch}
  p.lead{font-size:23px;color:var(--muted)}
  .sub{font-size:20px;color:var(--muted);margin-top:16px;font-weight:400}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:6px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .steps{display:flex;gap:10px;margin-top:26px;flex-wrap:wrap}
  .steps span{font-family:'Poppins';font-size:13px;font-weight:600;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:7px 14px}
  .steps span.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .big{font-size:30px;font-weight:600;font-family:'Poppins';line-height:1.2;color:var(--ink)}
  .accent{color:var(--accent)}
  .coral{color:var(--accent2)}
  .formula{font-family:'Poppins';font-size:22px;line-height:1.7;margin-top:18px}
  .formula b{color:var(--accent)}
  .present{margin-top:30px;font-size:17px;color:var(--muted)}
  .present b{color:var(--ink);font-weight:600}
  .disc{margin-top:26px;font-size:14px;color:var(--muted);max-width:60ch}
  .num{font-family:'Poppins';font-weight:700;color:var(--accent2);font-size:18px;margin-bottom:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'promise'},
  {t:'who'},
  {t:'trap'},
  {t:'reframe'},
  {t:'part', n:'Part One', h:'Why working harder never moved your prices', p:'The problem was never how many clients you can find. It is where the money quietly leaks out of the business you already have.'},
  {t:'point', num:'01', h:'The missing link in the sale', p:'Most designers present a price and hope. They never build the short conversation that lets a client understand what a higher price actually buys them, so every quote becomes a negotiation you lose.'},
  {t:'point', num:'02', h:'The missing link in delivery', p:'Scope creep is a pricing problem wearing a project-management costume. When the edges of a project are undefined, you overdeliver for free and your effective rate collapses.'},
  {t:'part', n:'Part Two', h:'The Web Designer Academy Roadmap', p:'Three shifts, in order. Each one removes a reason you are leaving money on the table.'},
  {t:'pillar', num:'Pillar 1', h:'Create Marketing Momentum', p:'A simple, repeatable way to stay in front of the right clients, built for a service provider, not a social-media manager. The Just Ask approach uncovers who is already connected to your next client so you can line one up in minutes a week.'},
  {t:'pillar', num:'Pillar 2', h:'Confidently make higher-priced offers', p:'Stop quoting hourly. The Package Matrix structures your expertise into offers priced for the outcome the client gets, so a bigger number feels obvious instead of scary.'},
  {t:'matrix'},
  {t:'pillar', num:'Pillar 3', h:'Safely stop overdelivering and overworking', p:'Scope, process, and boundaries that protect the profit you just priced in, so earning more does not quietly cost you every evening and weekend.'},
  {t:'part', n:'The math', h:'Your Personal Profitability Formula', p:'Premium pricing is not a guess or a growth hack. It is arithmetic that starts with the life you actually want.'},
  {t:'formula'},
  {t:'result'},
  {t:'story'},
  {t:'recap'},
  {t:'cta', disc:'No specific income or result is guaranteed. Results vary with your market, effort, and circumstances.'}
];

function esc(s){return s.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));}

function render(s){
  switch(s.t){
    case 'title': return `
      <div class="eyebrow">Live Masterclass — Web Designer Academy</div>
      <h1>Pricing for Profit</h1>
      <p class="sub">How women web designers charge for the outcome, not the hours.</p>
      <div class="steps"><span class="on">Missing links</span><span class="on">The Package Matrix</span><span class="on">Your Profitability Formula</span></div>
      <div class="present">Presented by <b>Shannon Mattern</b>, founder of the Web Designer Academy</div>`;
    case 'promise': return `
      <div class="eyebrow">What you will walk away with</div>
      <h2>By the end of this hour</h2>
      <ul>
        <li>The two places profit leaks out of a web design business, and how to seal them</li>
        <li>A way to package your work so a higher price feels obvious to the client</li>
        <li>The exact number you need to charge for, worked backward from the life you want</li>
      </ul>`;
    case 'who': return `
      <div class="eyebrow">Who this is for</div>
      <h2>The experienced designer who has outgrown beginner prices</h2>
      <p class="lead">You can build beautiful sites. You are booked, or close to it. And you still feel a flinch every time you send a quote, so you round the number down before you hit send.</p>`;
    case 'trap': return `
      <div class="eyebrow">The trap</div>
      <h2>The quote-and-pray cycle</h2>
      <p>You price by the hour or by what you think they will say yes to. You win the project, then overdeliver to feel worth it. You finish tired, a little resentful, and no closer to the income you started this business for. So you go looking for more clients, when the leak was never the number of clients.</p>`;
    case 'reframe': return `
      <div class="eyebrow">The reframe</div>
      <p class="big">You do not have a lead problem.<br>You have a <span class="accent">pricing</span> problem.</p>
      <p class="sub">And a pricing problem is the good kind, because it is fixable this week without finding a single new client.</p>`;
    case 'part': return `
      <div class="eyebrow">${esc(s.n)}</div>
      <h2>${esc(s.h)}</h2>
      <p class="lead">${esc(s.p)}</p>`;
    case 'point': return `
      <div class="num">${esc(s.num)}</div>
      <h2>${esc(s.h)}</h2>
      <p>${esc(s.p)}</p>`;
    case 'pillar': return `
      <div class="eyebrow">${esc(s.num)}</div>
      <h2>${esc(s.h)}</h2>
      <p>${esc(s.p)}</p>`;
    case 'matrix': return `
      <div class="eyebrow">The Package Matrix</div>
      <h2>Price the transformation, not the time</h2>
      <ul>
        <li>Name the outcome the client is really buying, in their words</li>
        <li>Build three tiers around that outcome, not around deliverable counts</li>
        <li>Anchor on the result, so the investment reads as small next to it</li>
      </ul>`;
    case 'formula': return `
      <div class="eyebrow">Your Personal Profitability Formula</div>
      <h2>Start with the life, end with the price</h2>
      <div class="formula">
        <b>Personal expenses</b> you want covered<br>
        plus <b>business costs</b> to run well<br>
        plus <b>taxes</b> set aside honestly<br>
        equals your <b>Minimum Baseline Revenue</b>.
      </div>
      <p class="sub">Charge below it and you are subsidizing your clients. Price for it, and the premium number stops being a leap of faith.</p>`;
    case 'result': return `
      <div class="eyebrow">What changes</div>
      <h2>From a small site to a real project</h2>
      <p>When the price reflects the outcome, one client can be worth what five used to be. The work gets calmer, the clients get better, and the business finally supports the freedom you built it for in the first place.</p>`;
    case 'story': return `
      <div class="eyebrow">Why me</div>
      <h2>I built this because I lived it</h2>
      <p>I spent over a decade helping women web designers raise their prices and package their expertise, after replacing my own six-figure corporate income without working more. Going behind the scenes of more than 1,500 web design businesses showed me the same leaks every time, and the same roadmap out.</p>
      <div class="present"><b>Shannon Mattern</b> · Web Designer Academy · Profitable Web Designer Podcast</div>`;
    case 'recap': return `
      <div class="eyebrow">The shift, in one line</div>
      <p class="big">Seal the leaks. Package the outcome. <span class="coral">Charge for the life you want.</span></p>`;
    case 'cta': return `
      <div class="eyebrow">Your next step</div>
      <h2>Apply to the Web Designer Academy</h2>
      <p>If you are ready to make this your default way of pricing, with coaching and a community of women doing the same, the Academy is where we do the work together over the next year.</p>
      <p class="sub">Start your application at webdesigneracademy.com.</p>
      <p class="disc">This masterclass is educational. ${esc(s.disc)}</p>`;
  }
  return '';
}

const deck = document.getElementById('deck');
S.forEach(s=>{const el=document.createElement('section');el.className='slide';el.innerHTML=render(s);deck.appendChild(el);});
</script>
</body>
</html>
