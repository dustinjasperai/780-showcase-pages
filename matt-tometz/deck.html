<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Speed Training Triangle — Matt Tometz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16163f; --panel:#20205a; --rule:#33336b;
    --accent:#116dff; --ink:#f3f4fb; --muted:#aab0d6;
    --head:'Barlow Condensed',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:linear-gradient(170deg,var(--panel),var(--bg));border:1px solid var(--rule);
    border-radius:18px;padding:52px 46px;margin:18px 0;min-height:420px;
    display:flex;flex-direction:column;justify-content:center}
  .kick{font-family:var(--head);letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700;font-size:15px;margin-bottom:14px}
  h1{font-family:var(--head);font-weight:800;font-size:58px;line-height:1.02;letter-spacing:.01em}
  h2{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.05;margin-bottom:14px}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:58ch;margin-top:12px}
  .muted{color:var(--muted)}
  .big{font-size:26px;line-height:1.4}
  ul{margin:16px 0 0 20px} li{font-size:19px;line-height:1.6;margin:8px 0}
  .tri{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
  .tri div{flex:1;min-width:180px;background:var(--bg);border:1px solid var(--rule);
    border-radius:14px;padding:22px}
  .tri h3{font-family:var(--head);font-weight:700;font-size:26px;color:var(--accent)}
  .tri p{font-size:16px;margin-top:8px}
  .num{font-family:var(--head);font-weight:800;font-size:120px;color:var(--accent);line-height:1}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:62ch}
  .foot{font-family:var(--head);letter-spacing:.1em;text-transform:uppercase;
    color:var(--muted);font-size:13px;margin-top:30px}
  @media(max-width:640px){h1{font-size:40px}h2{font-size:30px}.slide{padding:34px 24px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'cover', kick:'A live masterclass with Matt Tometz',
   h:'The Speed Training Triangle',
   p:'How athletes actually get faster, and why more sprints is not the answer.'},
  {t:'who', kick:'Who this is for',
   h:'You train hard. The clock stopped moving.',
   p:'For the athlete who is putting in the work, and the parent paying for it, and the time on the stopwatch has not changed in months. This is for you.'},
  {t:'hook', kick:'The hard truth',
   h:'More sprints is often why you plateaued.',
   p:'Volume without a target burns quality. You get tired, not fast. Speed is a skill, and skills are trained on purpose, not by piling on reps.'},
  {t:'part', kick:'Part one',
   h:'Speed is three things. Most programs train one.',
   p:'Chase one piece and you cap out. Getting faster means training all three together, in the right order, measured so you know it is working.'},
  {t:'tri', kick:'Part two, the framework',
   h:'The Speed Training Triangle',
   tri:[['Force','How hard you can put into the ground. Strength and power are the engine.'],
        ['Mechanics','How you apply that force. Angles, posture, and clean movement turn power into speed.'],
        ['Rhythm','The timing that ties it together. The piece almost everyone skips.']]},
  {t:'f', kick:'Side one',
   h:'Force',
   p:'You cannot out-technique weak. Force is the engine behind every stride. We build it so there is something to apply when the mechanics are right.'},
  {t:'m', kick:'Side two',
   h:'Mechanics',
   p:'Force in the wrong direction is wasted. Clean shin angles, posture, and ground contact turn raw power into forward speed. This is where the coach eye earns its keep.'},
  {t:'r', kick:'Side three',
   h:'Rhythm',
   p:'The forgotten side. Speed has a tempo. When force and mechanics sync into rhythm, the stride finally feels free instead of forced. Train this and the other two come alive.'},
  {t:'part', kick:'The aiming point',
   h:'The 95% Rule',
   p:'Your fastest, all-out days are not your best training days. Quality speed lives at about 95 percent, aimed on purpose. It is fast enough to adapt, controlled enough to stay clean.'},
  {t:'num', kick:'Why 95, not 100',
   num:'95%',
   p:'All-out invites sloppy mechanics and fatigue that wrecks the next rep. A 95 percent aiming point keeps every rep high quality, which is what actually makes an athlete faster over a season.'},
  {t:'eq', kick:'How every call gets made',
   h:'The data, the coach eye, and the feel.',
   p:'No single input runs the session. The numbers show what happened, the coach eye reads how it happened, and the athlete feel tells us what is left in the tank. All three, together.'},
  {t:'data', kick:'Individualized, not one size fits all',
   h:'Your loads, not the team average.',
   p:'Using load and velocity profiling, we set resisted sprint loads for the individual athlete instead of a blanket number. The plan fits the athlete in front of us, measured and adjusted.'},
  {t:'look', kick:'Inside a speed week',
   h:'A week built around quality.',
   ul:['Two to three true speed days, each aimed at 95 percent',
       'Force work that feeds the stride, not that leaves you flat',
       'Mechanics drilled when fresh, never when fried',
       'Rhythm and tempo woven through, measured every session']},
  {t:'me', kick:'Why listen to me',
   h:'Coaching plus data, every day.',
   p:'I coach sports performance at the college level and have trained athletes from youth up through the pros. My work in sport science has been published, and I spend every day marrying the coach eye to the numbers to get athletes faster.'},
  {t:'recap', kick:'Put it together',
   h:'Force. Mechanics. Rhythm. Aimed at 95%.',
   p:'That is the whole system. Build all three sides, aim every rep, and measure it so you know it is working. That is how the clock finally starts moving again.'},
  {t:'cta', kick:'Your next step',
   h:'Let us build your speed plan.',
   p:'If you want this applied to your training, start a plan with Tometz Performance. In person, online, or remote, we will build the triangle around you and aim every session.',
   disc:'Educational only. Results vary from athlete to athlete and nothing here is a guarantee of any specific performance outcome.',
   foot:'tometzperformance.com'}
];
const d=document.getElementById('deck');
S.forEach(s=>{
  const el=document.createElement('section');el.className='slide';
  let html='';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='num'){ html+='<div class="num">'+s.num+'</div>'; }
  if(s.h) html+=(s.t==='cover'?'<h1>':'<h2>')+s.h+(s.t==='cover'?'</h1>':'</h2>');
  if(s.p) html+='<p'+(s.t==='cover'?' class="big"':'')+'>'+s.p+'</p>';
  if(s.ul){ html+='<ul>'+s.ul.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  if(s.tri){ html+='<div class="tri">'+s.tri.map(x=>'<div><h3>'+x[0]+'</h3><p>'+x[1]+'</p></div>').join('')+'</div>'; }
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  if(s.foot) html+='<div class="foot">'+s.foot+'</div>';
  el.innerHTML=html;d.appendChild(el);
});
</script>
</body>
</html>
