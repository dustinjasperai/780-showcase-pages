<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Heartful Leader | A live masterclass with Sagan Rossi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f0eef1;
    --panel:#ffffff;
    --soft:#e7e3ee;
    --rule:#d7d1e0;
    --ink:#0f172a;
    --ink-soft:#3a3950;
    --ink-muted:#6f6a82;
    --accent:#5b5578;
  }
  html,body{height:100%}
  body{
    font-family:'Lato',-apple-system,sans-serif;
    background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;overflow:hidden;
  }
  #stage{width:min(960px,94vw);aspect-ratio:16/9;position:relative}
  .slide{
    position:absolute;inset:0;display:none;flex-direction:column;
    justify-content:center;padding:7% 8%;
    background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;box-shadow:0 18px 50px rgba(15,23,42,0.08);
  }
  .slide.on{display:flex}
  .eyebrow{font-family:'Raleway',sans-serif;font-weight:700;font-size:13px;
    letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Raleway',sans-serif;font-weight:800;font-size:clamp(28px,4.4vw,52px);
    line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin-bottom:18px}
  h2{font-family:'Raleway',sans-serif;font-weight:700;font-size:clamp(22px,3.1vw,36px);
    line-height:1.14;color:var(--ink);margin-bottom:16px}
  p{font-size:clamp(15px,1.8vw,21px);line-height:1.5;color:var(--ink-soft);max-width:44ch}
  p.lead{font-size:clamp(17px,2.1vw,24px);color:var(--ink-soft)}
  .promise{font-family:'Raleway',sans-serif;font-weight:600;color:var(--accent)}
  ul{list-style:none;margin-top:10px}
  li{font-size:clamp(15px,1.8vw,21px);line-height:1.45;color:var(--ink-soft);
    padding-left:28px;position:relative;margin-bottom:14px;max-width:46ch}
  li::before{content:"";position:absolute;left:0;top:.62em;width:11px;height:11px;
    border-radius:50%;background:var(--accent)}
  .big{font-family:'Raleway',sans-serif;font-weight:800;font-size:clamp(30px,5vw,60px);
    line-height:1.05;color:var(--ink)}
  .big .hl{color:var(--accent)}
  .spark{display:inline-block;width:14px;height:14px;border-radius:50%;
    background:var(--accent);box-shadow:0 0 0 6px var(--soft);margin-bottom:22px}
  .part-no{font-family:'Raleway',sans-serif;font-weight:800;font-size:clamp(46px,8vw,96px);
    color:var(--soft);line-height:.9;margin-bottom:6px}
  .cred{font-size:clamp(15px,1.8vw,20px);color:var(--ink-soft);max-width:48ch}
  .cred strong{color:var(--ink);font-weight:700}
  .cta-line{font-family:'Raleway',sans-serif;font-weight:700;color:var(--accent);
    font-size:clamp(18px,2.2vw,26px);margin-top:14px}
  .disclaimer{font-size:12px;color:var(--ink-muted);margin-top:26px;max-width:52ch;line-height:1.5}
  #hud{position:fixed;bottom:16px;right:22px;font-family:'Raleway',sans-serif;
    font-size:12px;letter-spacing:.1em;color:var(--ink-muted)}
  #brand{position:fixed;bottom:16px;left:22px;font-family:'Raleway',sans-serif;
    font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .nav{position:fixed;inset:0;display:flex;justify-content:space-between;pointer-events:none}
  .nav button{pointer-events:auto;background:none;border:none;color:var(--ink-muted);
    font-size:30px;padding:0 20px;cursor:pointer;opacity:.5}
  .nav button:hover{opacity:1;color:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="brand">NorthSpark Coaching</div>
<div id="hud"></div>
<div class="nav"><button id="prev" aria-label="Previous">&#8249;</button><button id="next" aria-label="Next">&#8250;</button></div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass',h:'The Heartful Leader',lead:'Leading from the spark: the emotional intelligence to lead people, not just manage work.'},
 {t:'who',eyebrow:'Who this is for',h:'For leaders who are good at the work and tired of leading on willpower.',p:'Founders, executives, and team leaders who got promoted for their skill and now spend most of their day on the one thing no one trained them for: people.'},
 {t:'trap',eyebrow:'The trap',h:'You were promoted for being the best at the work.',p:'So you keep solving the work. Meanwhile the team waits on you, the meetings get heavier, and the part that actually drains you is never on the agenda: the people.'},
 {t:'reframe',eyebrow:'The real problem',big:'Your team does not need another strategy offsite.',lead:'It needs emotional intelligence it can actually use, modelled by the person leading it.'},
 {t:'cost',eyebrow:'What it costs to ignore',h:'The human part does not wait.',b:['Your best people leave quietly, long before they tell you.','Trust erodes one unspoken thing at a time.','You carry the weight home, and call it the price of leading.']},
 {t:'partdiv',no:'One',title:'The Spark',sub:'Self-awareness and values as the real operating system of a leader.'},
 {t:'content',h:'Your technical skill got you here. It will not carry you.',b:['The higher you go, the more you lead through other people.','The work stops being the work. The people become the work.','Almost no one is taught the human part of leading.']},
 {t:'content',h:'Reflective, not directive.',b:['Great leaders ask better questions before they give more answers.','Self-awareness is a daily practice, not a personality trait.','Your values are the filter every hard decision runs through.']},
 {t:'partdiv',no:'Two',title:'Heartful Teams',sub:'Trust, psychological safety, and collaboration across cultures and time zones.'},
 {t:'content',h:'Teams do not break on strategy. They break on trust.',b:['Psychological safety is what lets a team tell you the truth in time.','Across cultures and time zones, assumptions are the silent tax.','Emotional intelligence is a team skill, not just a personal one.']},
 {t:'content',h:'The habits that build a heartful team.',b:['Name the unspoken thing in the room, kindly and early.','Build a team charter people actually believe.','Make it safe to disagree, then safe to commit.']},
 {t:'partdiv',no:'Three',title:'Leading Through Change',sub:'Resilience and preventing burnout while leading people through transformation.'},
 {t:'content',h:'Change is the job now. Burnout is the risk.',b:['People do not resist change. They resist loss they cannot name.','The early signals of burnout show up in the team before the person.','Resilience is built before the storm, not during it.']},
 {t:'content',h:'When you lead from the spark.',b:['Clearer decisions, made with less second-guessing.','A team that raises problems while they are still small.','A leader who has energy left for the people they love.']},
 {t:'cred',eyebrow:'Why me',h:'I have led under pressure, not just studied it.',cred:'Twenty years in brand and marketing, most recently as a VP on a global executive team. I led a creative team through acquisitions and transformation while that team reported 90% career satisfaction. Now I coach leaders and teams full time, certified through Henley Business School, the ICF, and the EMCC. My work is reflective rather than directive, grounded in presence, compassion, and non-judgment.'},
 {t:'cta',eyebrow:'Your next conversation',h:'Find the spark within your leadership.',lead:'If this is the kind of leader you want to be, the next step is a free chemistry conversation to see if we are a fit.',cta:'Book a chemistry call at northsparkcoaching.com',disclaimer:'This masterclass is for educational purposes only. It shares principles and practices from leadership and team coaching. No specific result is guaranteed. Results vary from one leader and team to the next.'}
];

const stage=document.getElementById('stage');
const hud=document.getElementById('hud');
let i=0;

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function render(s){
 if(s.t==='title') return `<div class="slide on"><span class="spark"></span>
   <div class="eyebrow">${esc(s.eyebrow)}</div>
   <h1>${esc(s.h)}</h1>
   <p class="lead promise">${esc(s.lead)}</p></div>`;
 if(s.t==='who'||s.t==='trap') return `<div class="slide"><div class="eyebrow">${esc(s.eyebrow)}</div>
   <h2>${esc(s.h)}</h2>
   <p>${esc(s.p)}</p></div>`;
 if(s.t==='reframe') return `<div class="slide"><div class="eyebrow">${esc(s.eyebrow)}</div>
   <div class="big">${esc(s.big)}</div>
   <p class="lead" style="margin-top:22px">${esc(s.lead)}</p></div>`;
 if(s.t==='cost') return `<div class="slide"><div class="eyebrow">${esc(s.eyebrow)}</div>
   <h2>${esc(s.h)}</h2>
   <ul>${s.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 if(s.t==='partdiv') return `<div class="slide"><div class="part-no">${esc(s.no)}</div>
   <div class="eyebrow">Part ${esc(s.no)}</div><h1>${esc(s.title)}</h1>
   <p class="lead">${esc(s.sub)}</p></div>`;
 if(s.t==='content') return `<div class="slide"><h2>${esc(s.h)}</h2><ul>${s.b.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`;
 if(s.t==='cred') return `<div class="slide"><div class="eyebrow">${esc(s.eyebrow)}</div>
   <h2>${esc(s.h)}</h2>
   <p class="cred">${esc(s.cred)}</p></div>`;
 if(s.t==='cta') return `<div class="slide"><span class="spark"></span><div class="eyebrow">${esc(s.eyebrow)}</div>
   <h1>${esc(s.h)}</h1>
   <p class="lead">${esc(s.lead)}</p>
   <div class="cta-line">${esc(s.cta)}</div>
   <p class="disclaimer">${esc(s.disclaimer)}</p></div>`;
 return '<div class="slide"></div>';
}

function show(n){
 i=Math.max(0,Math.min(S.length-1,n));
 stage.innerHTML=render(S[i]);
 stage.firstChild.classList.add('on');
 hud.textContent=('0'+(i+1)).slice(-2)+' / '+('0'+S.length).slice(-2);
}
document.getElementById('next').onclick=()=>show(i+1);
document.getElementById('prev').onclick=()=>show(i-1);
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')show(i+1);
 if(e.key==='ArrowLeft'||e.key==='PageUp')show(i-1);
});
show(0);
</script>
</body>
</html>
