<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Calm &amp; Connected: Parenting Kids &amp; Teens with ADHD</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Gelasio:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
<style>
  :root{
    --bg:#f5f6f1;
    --panel:#fdfdfb;
    --soft:#eef1ec;
    --rule:#e3e7e1;
    --ink:#2b2b2b;
    --muted:#6b6b6b;
    --accent:#6d887a;
    --accent2:#824b26;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Gelasio',Georgia,serif;
    -webkit-font-smoothing:antialiased;
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
  }
  #stage{
    width:min(960px,94vw);
    height:min(620px,92vh);
    position:relative;
  }
  .slide{
    display:none;
    position:absolute;
    inset:0;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 60px;
    box-shadow:0 10px 40px rgba(43,43,43,.06);
    overflow:auto;
    flex-direction:column;
  }
  .slide.active{display:flex;}
  h1,h2,h3,.kicker,.counter,.nav button,.pill{font-family:'Poppins',system-ui,sans-serif;}
  .kicker{
    font-size:13px;
    letter-spacing:.14em;
    text-transform:uppercase;
    color:var(--accent);
    font-weight:600;
    margin:0 0 18px;
  }
  h1{
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:40px;
    line-height:1.12;
    margin:0 0 20px;
    color:var(--ink);
  }
  h2{
    font-family:'Poppins',sans-serif;
    font-weight:600;
    font-size:30px;
    line-height:1.18;
    margin:0 0 20px;
    color:var(--ink);
  }
  .lede{
    font-size:21px;
    line-height:1.5;
    color:var(--ink);
    max-width:46ch;
  }
  .body{
    font-size:18px;
    line-height:1.6;
    color:var(--ink);
    max-width:54ch;
  }
  .muted{color:var(--muted);}
  ul.bullets{
    list-style:none;
    padding:0;
    margin:8px 0 0;
    max-width:56ch;
  }
  ul.bullets li{
    position:relative;
    padding:12px 0 12px 30px;
    font-size:18px;
    line-height:1.5;
    border-bottom:1px solid var(--rule);
  }
  ul.bullets li:last-child{border-bottom:none;}
  ul.bullets li::before{
    content:"";
    position:absolute;
    left:2px;
    top:19px;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--accent);
  }
  .presenter{
    margin-top:auto;
    padding-top:22px;
    font-family:'Poppins',sans-serif;
    font-weight:500;
    font-size:16px;
    color:var(--accent2);
  }
  .step{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    width:54px;height:54px;
    border-radius:14px;
    background:var(--soft);
    color:var(--accent);
    font-family:'Poppins',sans-serif;
    font-weight:700;
    font-size:22px;
    margin-bottom:18px;
  }
  .pill{
    display:inline-block;
    background:var(--soft);
    color:var(--accent2);
    font-size:12px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    padding:7px 14px;
    border-radius:999px;
    margin:0 0 18px;
  }
  .quote{
    font-style:italic;
    font-size:23px;
    line-height:1.45;
    max-width:48ch;
    color:var(--accent2);
  }
  .card{
    background:var(--soft);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:22px 24px;
    margin-top:18px;
    max-width:56ch;
  }
  .card p{margin:0;font-size:17px;line-height:1.55;}
  .disclaimer{
    margin-top:20px;
    font-size:13px;
    line-height:1.5;
    color:var(--muted);
    max-width:60ch;
    border-top:1px solid var(--rule);
    padding-top:16px;
  }
  .cta-actions{margin-top:22px;}
  .cta-actions .pill{
    background:var(--accent);
    color:#ffffff;
    font-size:14px;
    padding:12px 20px;
    margin-right:10px;
  }
  .nav{
    position:absolute;
    bottom:-44px;
    left:0;right:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
  }
  .nav button{
    background:var(--panel);
    border:1px solid var(--rule);
    color:var(--ink);
    border-radius:10px;
    padding:8px 16px;
    font-size:14px;
    font-weight:500;
    cursor:pointer;
  }
  .nav button:hover{border-color:var(--accent);color:var(--accent);}
  .counter{
    font-size:13px;
    color:var(--muted);
    letter-spacing:.04em;
  }
</style>
</head>
<body>
<div id="stage">
  <div id="slides"></div>
  <div class="nav">
    <button id="prev">&larr; Back</button>
    <div class="counter" id="counter"></div>
    <button id="next">Next &rarr;</button>
  </div>
</div>
<script>
const S = [
  {t:'title',
    kicker:'A Parent Masterclass',
    title:'Calm &amp; Connected: Parenting Kids &amp; Teens with ADHD',
    sub:'Why connection comes before correction.',
    presenter:'Cindy Goldrich, Ed.M., ADHD-CCSP · PTS Coaching'
  },
  {t:'content',
    kicker:'Who this is for',
    title:'You are trying hard, and still hitting walls',
    body:'This hour is for the parent who reminds, nudges, and repeats, then wonders why nothing sticks. If mornings, homework, and transitions feel like a daily negotiation, you are in the right room. Not because you are doing it wrong, but because no one has explained how your child’s brain actually works.'
  },
  {t:'content',
    kicker:'The trap',
    title:'The strategy that works for a week',
    body:'Most ADHD parenting advice hands you a system: a chart, a reward, a tighter set of rules. It works for a few days. Then the novelty fades, the pushback returns, and you are left feeling like you failed at something simple. You did not fail. The tool was built for a different kind of brain.'
  },
  {t:'quote',
    kicker:'A reframe',
    quote:'The behavior you see is not defiance and it is not laziness. It is a brain that works differently. Willpower was never the lever you were missing.',
    foot:'So we stop pulling harder on the wrong lever, and start with how the brain is actually wired.'
  },
  {t:'content',
    pill:'Part One: The Core Problem',
    title:'ADHD is a difference in executive function',
    body:'Executive function is the brain’s management system: it governs attention, regulation, motivation, and follow-through. In ADHD these skills develop on a different timeline. This is not about intelligence or caring. It is about the gap between knowing what to do and being able to do it in the moment.'
  },
  {t:'content',
    kicker:'Attention and regulation',
    title:'Not a lack of attention, a lack of control over it',
    bullets:[
      'Attention is hard to start, hard to shift, and hard to hold where it is needed, even on things that matter.',
      'Emotion arrives big and fast, and the brakes are slower to engage, so a small moment can become a large one.',
      'What looks like overreaction is often a regulation system doing its best with the wiring it has.'
    ]
  },
  {t:'content',
    kicker:'Motivation and follow-through',
    title:'The brain runs on interest, not on importance',
    bullets:[
      'An ADHD brain is powered by what is interesting, urgent, or new, more than by what is simply important later.',
      'A task can feel obvious and still never get started, because starting and sequencing are the hard parts.',
      'Reminders stack up as pressure, not as help, when the missing piece is capacity rather than willingness.'
    ]
  },
  {t:'quote',
    kicker:'The key idea',
    quote:'Challenging behavior happens when the demands of a moment exceed a child’s capacity in that moment.',
    foot:'Consequence-first parenting adds demand to a child who is already over capacity, so it backfires. We lower the gap instead.'
  },
  {t:'content',
    pill:'Part Two: Calm &amp; Connected',
    title:'Understanding before strategy',
    body:'This is the model I teach and license to coaches worldwide. It has one spine: parents first learn why a child’s behavior makes sense given how ADHD affects the brain, because connection is the precondition for any technique to work. We move through six steps, in order, and the order matters.'
  },
  {t:'step',
    n:'1',
    kicker:'Step one',
    title:'Remain Calm &amp; Connected',
    body:'Your regulated nervous system is the tool. When you stay calm, you lend your child the steadiness their brain cannot yet produce on its own. Connection is not a reward for good behavior. It is the ground everything else is built on, and it comes first, before any correction.'
  },
  {t:'step',
    n:'2',
    kicker:'Step two',
    title:'Improve Communication',
    body:'We trade reminders and lectures for language the ADHD brain can actually receive: fewer words, clear and concrete, delivered when your child can listen rather than mid-meltdown. You learn to name what you see without blame, so your child stays open instead of defensive.'
  },
  {t:'step',
    n:'3',
    kicker:'Step three',
    title:'Encourage Collaboration',
    body:'Problems get solved with your child, not to them. When kids help design the plan, they are far more likely to follow it, and they build the skill of thinking a problem through. Collaboration turns a daily power struggle into a shared project you are both invested in.'
  },
  {t:'step',
    n:'4',
    kicker:'Step four',
    title:'Achieve Clarity &amp; Consistency',
    body:'ADHD brains rely on predictable structure to offload the executive-function work they find hardest. We set expectations that are clear, visible, and realistic, then hold them consistently. Consistency here is kindness: it removes the guesswork and the constant renegotiation that drains you both.'
  },
  {t:'step',
    n:'5',
    kicker:'Step five',
    title:'Establish Effective Consequences',
    body:'Now, and only now, do consequences fit. The goal is to teach, not to punish. Effective consequences are logical, connected to the behavior, and known in advance, so they build understanding instead of shame. They land because the relationship underneath them is already strong.'
  },
  {t:'step',
    n:'6',
    kicker:'Step six',
    title:'Make Better Choices and Build Skills',
    body:'The finish line is not compliance, it is capacity. We help your child practice the executive-function skills of planning, starting, and self-monitoring, so better choices come from growing ability, not from fear. Skills built this way stay, because they belong to your child.'
  },
  {t:'content',
    pill:'Part Three: At Home',
    title:'What changes when you lead with connection',
    bullets:[
      'Less daily conflict, because you are no longer fighting your child’s brain.',
      'A stronger relationship that can hold the hard conversations without breaking.',
      'Real skills your child carries forward, not just behavior that holds while you watch.',
      'A calmer you, parenting from a plan instead of from the last reaction.'
    ]
  },
  {t:'quote',
    kicker:'The heart of it',
    quote:'Parent the child you have. Not the one you thought you would have, or the one others say you would have if you just parented their way.',
    foot:'Your child is not a problem to fix. They are a brain to understand, and a person to stay connected to.'
  },
  {t:'content',
    kicker:'Why learn this with me',
    title:'Cindy Goldrich, Ed.M., ADHD-CCSP',
    bullets:[
      'Master’s in education and counseling psychology, Columbia University Teachers College.',
      'ADHD Certified Clinical Services Provider, founder of PTS Coaching since 2008.',
      'Author of 8 Keys to Parenting Kids &amp; Teens with ADHD: Supporting Your Child’s Executive Function.',
      'Creator of the Calm &amp; Connected model, taught to parents and licensed to coaches worldwide.'
    ]
  },
  {t:'content',
    kicker:'Your next step',
    title:'Go deeper than one hour can hold',
    body:'If today gave you a new way to see your child, the full model gives you the practice. The live Calm &amp; Connected series walks through all six steps together, with time to apply each one to your own home and your own child.',
    card:'Prefer to start small? Session 1, ADHD and Executive Function Challenges, is a single two-hour live class that lays the foundation this masterclass opened.'
  },
  {t:'cta',
    kicker:'Begin',
    title:'Start with Calm &amp; Connected',
    actions:[
      'Join the next live Calm &amp; Connected series',
      'Start with Session 1',
      'Request individual parent coaching'
    ],
    body:'Bring your questions and your real situation. This is the room where parents stop guessing and start understanding.',
    presenter:'Cindy Goldrich, Ed.M., ADHD-CCSP · PTS Coaching',
    disclaimer:'This presentation is for educational purposes only and is not medical, psychological, or clinical advice. No specific outcome or result is guaranteed. Every child is different; results vary.'
  }
];

const slidesEl = document.getElementById('slides');
const counterEl = document.getElementById('counter');
let i = 0;

function esc(x){return x;}

function render(s){
  let h = '';
  if(s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if(s.pill) h += '<span class="pill">'+s.pill+'</span>';
  if(s.n) h += '<div class="step">'+s.n+'</div>';

  if(s.t==='title'){
    h += '<h1>'+s.title+'</h1>';
    if(s.sub) h += '<p class="lede">'+s.sub+'</p>';
  } else if(s.t==='quote'){
    h += '<p class="quote">“'+s.quote+'”</p>';
    if(s.foot) h += '<p class="body muted" style="margin-top:22px;">'+s.foot+'</p>';
  } else {
    if(s.title) h += '<h2>'+s.title+'</h2>';
    if(s.body) h += '<p class="body">'+s.body+'</p>';
    if(s.bullets){
      h += '<ul class="bullets">';
      s.bullets.forEach(function(b){ h += '<li>'+b+'</li>'; });
      h += '</ul>';
    }
  }

  if(s.card) h += '<div class="card"><p>'+s.card+'</p></div>';

  if(s.actions){
    h += '<div class="cta-actions">';
    s.actions.forEach(function(a){ h += '<span class="pill">'+a+'</span>'; });
    h += '</div>';
  }

  if(s.presenter) h += '<div class="presenter">'+s.presenter+'</div>';
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';

  return h;
}

S.forEach(function(s, idx){
  const d = document.createElement('div');
  d.className = 'slide' + (idx===0 ? ' active' : '');
  d.innerHTML = render(s);
  slidesEl.appendChild(d);
});

const nodes = slidesEl.querySelectorAll('.slide');

function show(n){
  i = Math.max(0, Math.min(S.length-1, n));
  nodes.forEach(function(node, idx){ node.classList.toggle('active', idx===i); });
  counterEl.textContent = (i+1) + ' / ' + S.length;
}

document.getElementById('next').addEventListener('click', function(){ show(i+1); });
document.getElementById('prev').addEventListener('click', function(){ show(i-1); });
document.addEventListener('keydown', function(e){
  if(e.key==='ArrowRight' || e.key==='PageDown' || e.key===' ') { show(i+1); e.preventDefault(); }
  else if(e.key==='ArrowLeft' || e.key==='PageUp') { show(i-1); e.preventDefault(); }
});
slidesEl.addEventListener('click', function(){ show(i+1); });

show(0);
</script>
</body>
</html>
