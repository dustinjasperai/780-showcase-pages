<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agentic Analytics in Production - Future Proof Data Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfcfc; --panel:#ffffff; --rule:#d1d5db; --ink:#171717;
    --muted:#4b5563; --accent:#111827; --soft:#e3e3e3;
    --head:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--soft);font-family:var(--body);color:var(--ink);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .kick{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;
    letter-spacing:-.01em;margin-bottom:16px}
  p{font-size:20px;color:var(--muted);max-width:60ch;margin-bottom:14px}
  p.lead{font-size:23px;color:var(--ink)}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.1;
    letter-spacing:-.01em;color:var(--ink);max-width:22ch}
  .part{font-family:var(--head);font-size:15px;font-weight:600;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:12px}
  .divider .num{font-family:var(--head);font-weight:700;font-size:80px;color:var(--soft);
    line-height:1;margin-bottom:8px}
  ul{list-style:none;margin:14px 0 0}
  li{font-size:19px;color:var(--ink);padding:12px 0 12px 20px;border-bottom:1px solid var(--rule);
    position:relative}
  li:before{content:"";position:absolute;left:0;top:20px;width:8px;height:8px;
    background:var(--accent);border-radius:2px}
  li span{display:block;font-size:15px;color:var(--muted);margin-top:4px}
  .pipe{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
  .pipe .box{flex:1;min-width:150px;background:var(--panel);border:1px solid var(--rule);
    border-radius:8px;padding:16px 16px;font-family:var(--head);font-weight:600;font-size:16px}
  .pipe .box small{display:block;font-family:var(--body);font-weight:400;font-size:13px;
    color:var(--muted);margin-top:6px;line-height:1.4}
  .foot{position:absolute;bottom:22px;left:56px;font-size:13px;color:var(--muted);
    font-family:var(--head);letter-spacing:.04em}
  .bio{display:flex;gap:30px;flex-wrap:wrap;margin-top:18px}
  .bio .stat{font-family:var(--head)}
  .bio .stat b{display:block;font-size:34px;color:var(--accent);font-weight:700}
  .bio .stat small{font-size:14px;color:var(--muted)}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:14px;
    color:var(--bg);background:var(--accent);padding:7px 15px;border-radius:999px;margin-bottom:20px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:62ch;line-height:1.5}
  .cta h1{color:var(--ink)}
  .a{color:var(--accent)}
  .strike{color:var(--rule);text-decoration:line-through;text-decoration-thickness:3px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:32px}h2{font-size:26px}.foot{left:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Future Proof Data Science";
const S = [
  {t:'title', kick:'A live masterclass for data scientists', h:'Agentic Analytics in Production',
   p:'The architecture that takes a data agent from a working notebook demo to something your team can actually rely on.',
   who:'Andres Vourakis  ·  Future Proof Data Science'},

  {t:'who', kick:'Who this is for',
   h:'You write SQL and you know the data.',
   p:'Colleagues come to you when they need a number. You have heard of AI agents that answer data questions, and you want to know what it takes to build one your team relies on. You do not need to have built an agent before.'},

  {t:'trap', kick:'The trap',
   big:'You have read the tutorials. You have seen the demos. You still cannot ship it.',
   p:'The tutorials cut to a working demo and skip the parts that matter. Then real data, real users, and real edge cases hit, and the demo falls apart.'},

  {t:'hook', kick:'The reframe',
   big:'The gap is not knowledge. It is architecture.',
   p:'Most data scientists are learning agentic AI. Very few are shipping it. This masterclass is about the difference.'},

  {t:'divider', num:'01', part:'Part one', h:'The core problem',
   p:'Where understanding agentic AI stops being enough and shipping a working system becomes the actual job.'},

  {t:'body', kick:'Where tutorials end',
   h:'A demo that runs in a notebook is not a system.',
   p:'Production ready means more than "it runs." The hard part is everything the demo skipped: what happens when the inputs are messy, when two users ask the same question differently, and when the agent is confidently wrong.'},

  {t:'body', kick:'Why this is a data scientist problem',
   h:'The data scientist owns the parts an AI engineer cannot.',
   p:'The semantic layer, the evaluation criteria, and the trust calibration are all things only someone close to the data can build correctly. Throw it over the wall and you get something that runs but does not know what a good answer looks like.'},

  {t:'divider', num:'02', part:'Part two', h:'The four pieces that decide whether it works',
   p:'What each one does, where each one breaks, and why every demo skips at least three of them.',
   pipe:[['Semantic models','So the agent reasons over your data without hallucinating columns or joins.'],
         ['Guardrails','Question quality rubrics so bad inputs are caught before they hit the data.'],
         ['Routing logic','Directs each request to the correct data source.'],
         ['Observability','On every output, so you can debug when the agent misbehaves.']]},

  {t:'body', kick:'Piece one', h:'Semantic models',
   p:'The map the agent reasons over. Without it the agent invents columns and joins that do not exist. With it, the same question returns the same trustworthy shape every time. This is the layer only someone who lives in the data can build.'},

  {t:'body', kick:'Piece two', h:'Guardrails',
   p:'A question quality rubric that catches bad inputs before they ever reach the data, plus graceful failure modes for the questions the agent should not try to answer. The difference between a system you trust and one you babysit.'},

  {t:'body', kick:'Piece three', h:'Routing logic',
   p:'Context engineering that keeps prompts predictable across questions and users, and routing that sends each request to the correct source. Predictability is what makes the answers repeatable instead of a coin flip.'},

  {t:'body', kick:'Piece four', h:'Observability',
   p:'Instrumentation on every output and evaluation against real business questions, not vibe checks. When the agent misbehaves you can see exactly where, and you can prove it got better.'},

  {t:'bar', kick:'The production ready bar',
   h:'What "production ready" actually requires.',
   list:[['Semantic models','the agent can reason over without hallucinating'],
         ['Context engineering','prompts stay predictable across users'],
         ['Guardrails and rubrics','bad inputs caught before the data'],
         ['Routing logic','each request to the correct source'],
         ['Observability','on every output, so you can debug'],
         ['Evaluation','against real business questions'],
         ['Graceful failure','for the questions it should not answer']]},

  {t:'body', kick:'How it differs from what you know',
   h:'It is a system, not a single query.',
   p:'Text to SQL turns one question into one query. RAG retrieves documents and answers over them. Agentic analytics routes the question, fetches context, runs the query, validates the result, and returns reasoning alongside the answer. SQL generation and retrieval are steps inside it, not the whole thing.'},

  {t:'divider', num:'03', part:'Part three', h:'What it looks like, end to end',
   p:'A real production system, architecture to deployment, with the trade-offs visible.'},

  {t:'body', kick:'A real shipped system',
   h:'A Talk to Your Data Slackbot, in production.',
   p:'Not a toy demo. A walkthrough of a system I shipped at work: how the four pieces fit together, which trade-offs mattered, and what I would build first if I were starting again. You see where the tutorials end and production begins.'},

  {t:'bio', kick:'Who is teaching this',
   h:'Andres Vourakis',
   p:'Senior Data Scientist with 8+ years in tech and applied AI and ML. I shipped the agentic analytics system in this masterclass in production at my company, and presented this material at DataFest and other data and AI events.',
   stats:[['8+','Years in tech'],['100+','Mentees'],['50K+','Followers'],['50+','Interviews']]},

  {t:'recap', kick:'What you walk away with',
   h:'The intuition to design one yourself.',
   list:[['See where tutorials end','and production begins'],
         ['The four pieces','what each does and where each breaks'],
         ['A real system, end to end','architecture to deployment, trade-offs visible'],
         ['What to build first','when you sit down to do this in your own work']]},

  {t:'cta', pill:'Next step',
   h:'Build one your team relies on.',
   p:'Join the live masterclass on shipping agentic analytics in production, then take the next step into the bootcamp when you are ready to build your own.',
   cta:'Reserve your seat at futureproofds.com',
   disc:'Educational content only. No income, role, outcome, or result is guaranteed. Results vary and depend on your own work, data, and circumstances.'}
];

function esc(x){return x;}
const deck = document.getElementById('deck');
S.forEach(s=>{
  const el = document.createElement('section');
  el.className = 'slide ' + s.t + (s.t==='divider'?' divider':'') + (s.t==='cta'?' cta':'');
  let h = '';
  if(s.kick) h += '<div class="kick">'+s.kick+'</div>';
  if(s.pill) h += '<span class="pill">'+s.pill+'</span>';
  if(s.part){ h += '<div class="divider"><div class="num">'+s.num+'</div></div><div class="part">'+s.part+'</div>'; }
  if(s.h) h += (s.t==='title'||s.t==='cta'||s.t==='bio'||s.t==='divider'?'<h1>':'<h2>')+s.h+(s.t==='title'||s.t==='cta'||s.t==='bio'||s.t==='divider'?'</h1>':'</h2>');
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.p) h += '<p class="lead">'+s.p+'</p>';
  if(s.pipe){ h += '<div class="pipe">'; s.pipe.forEach(b=>{ h += '<div class="box">'+b[0]+'<small>'+b[1]+'</small></div>'; }); h += '</div>'; }
  if(s.list){ h += '<ul>'; s.list.forEach(it=>{ h += '<li>'+it[0]+'<span>'+it[1]+'</span></li>'; }); h += '</ul>'; }
  if(s.stats){ h += '<div class="bio">'; s.stats.forEach(st=>{ h += '<div class="stat"><b>'+st[0]+'</b><small>'+st[1]+'</small></div>'; }); h += '</div>'; }
  if(s.who) h += '<div class="foot">'+s.who+'</div>';
  if(s.cta) h += '<p class="lead" style="color:var(--accent);font-weight:600;margin-top:10px">'+s.cta+'</p>';
  if(s.disc) h += '<div class="disc">'+s.disc+'</div>';
  if(s.t!=='title' && !s.who) h += '<div class="foot">'+BRAND+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
