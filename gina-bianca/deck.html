<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Price Your Time — a masterclass with Gina Bianca</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe4; --panel:#fffcf6; --panel2:#efe7db;
    --ink:#463939; --muted:#8a7c76; --rule:#dcd2c7; --accent:#697d5b;
    --serif:'Playfair Display',Georgia,serif; --sans:'Source Sans 3',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:26px 20px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 64px 58px;margin:0 0 22px;min-height:560px;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 14px 40px rgba(70,57,57,.06)}
  .kick{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--serif);font-weight:700;font-size:66px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:44px;line-height:1.1}
  .lead{font-size:24px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:40ch}
  .big{font-size:30px;line-height:1.45;max-width:44ch}
  .num{font-family:var(--serif);font-style:italic;font-size:26px;color:var(--accent);font-weight:500;letter-spacing:.02em}
  .partno{font-family:var(--serif);font-size:150px;line-height:.9;color:var(--panel2);font-weight:700;position:absolute;top:34px;right:52px}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
  li{font-size:24px;line-height:1.4;padding-left:40px;position:relative;max-width:48ch}
  li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:5px;
    border:2.5px solid var(--accent)}
  .steps li::before{content:counter(s);counter-increment:s;border:none;width:34px;height:34px;top:-2px;left:0;
    background:var(--accent);color:#fff;border-radius:9px;font-weight:700;font-size:18px;display:flex;
    align-items:center;justify-content:center;font-family:var(--sans)}
  .steps{counter-reset:s}
  .steps li{padding-left:52px}
  .quote{font-family:var(--serif);font-style:italic;font-size:42px;line-height:1.28;max-width:20ch}
  .quote .a{color:var(--accent)}
  .attrib{margin-top:26px;font-size:17px;letter-spacing:.06em;color:var(--muted);text-transform:uppercase;font-weight:600}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:34px}
  .card{background:var(--panel2);border-radius:14px;padding:30px 32px}
  .card h3{font-family:var(--serif);font-size:22px;font-weight:600;margin-bottom:12px;color:var(--accent)}
  .card p{font-size:19px;line-height:1.42;color:var(--ink)}
  .facts{margin-top:28px;display:flex;flex-direction:column;gap:14px}
  .facts div{font-size:22px;line-height:1.35}
  .facts b{font-family:var(--serif);font-weight:600}
  .disc{margin-top:34px;font-size:15px;line-height:1.5;color:var(--muted);max-width:60ch}
  .foot{position:absolute;bottom:26px;left:64px;right:64px;display:flex;justify-content:space-between;
    font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px}
  .cta h1{font-size:58px}
  .cta .go{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-weight:700;
    font-size:22px;padding:18px 34px;border-radius:100px;letter-spacing:.01em}
  .site{margin-top:20px;font-size:20px;color:var(--muted);font-weight:600}
  @media(max-width:720px){.slide{padding:40px 30px}h1{font-size:44px}.cols{grid-template-columns:1fr}.partno{font-size:96px;right:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A free live masterclass for salon owners', h:'Price Your Time',
   lead:'How to raise your prices off what your time actually costs, without the sticker shock and without losing the clients you want to keep.'},

  {t:'agenda', kick:'Who this is for', h:'You are booked, and still not paid what you are worth.',
   lead:'For stylists, suite and salon owners who suspect they are undercharging but are scared that raising prices will empty the chair.'},

  {t:'quote', q:'Undercharging is not humility. It is a <span class="a">slow leak</span> in your business and in how you feel about the work.',
   attrib:'The reframe we start with'},

  {t:'part', no:'01', kick:'Part one', h:'Why most salon prices are a guess.',
   lead:'Prices copied from the salon down the street, nudged up a little when it feels safe. None of it is tied to what the service actually costs you to deliver.'},

  {t:'point', kick:'The real cost', h:'Two things happen when the price is a guess.',
   items:['Sticker shock scares away the exact clients you want, because the number has no story behind it.',
          'Undercharging quietly builds resentment, until the work you loved starts to drain you.']},

  {t:'quote', q:'Sticker shock will run your business into the ground. Undercharging will <span class="a">drain your soul</span> of appreciation until resentment builds.',
   attrib:'Why pricing is not just math'},

  {t:'part', no:'02', kick:'Part two', h:'Price your time, not the market.',
   lead:'The whole method rests on one number most owners have never worked out: what one minute of your time actually costs.'},

  {t:'steps', kick:'The method', h:'Five steps to a price with a reason behind it.',
   items:['Know what one minute of your chair costs you, once rent, product, and your pay are in.',
          'Set a time standard for every service, so each one has a real, repeatable length.',
          'Reprice off cost per minute times time, not off what the salon next door charges.',
          'Walk the client through the plan in the consultation, so the price is understood before it is heard.',
          'Hold the rate with a boundary, so a pushback does not quietly undo the whole thing.']},

  {t:'point', kick:'Step one', h:'What one minute of your time costs.',
   items:['Add up what it costs to keep the doors open and pay yourself properly for an hour.',
          'Divide down to the minute. Now every service has a floor you can price above with confidence.']},

  {t:'point', kick:'Step two', h:'A time standard for every service.',
   items:['Decide how long each service should take to be done well, and hold that standard.',
          'Consistent timing is what makes cost-per-minute pricing fair to you and predictable for the guest.']},

  {t:'point', kick:'Steps three and four', h:'Reprice, then pre-sell it in the consultation.',
   items:['Rebuild each price on cost per minute times its time standard. The number now has a reason.',
          'The consultation is where the price lands. A clear plan of attack means the price is expected, not a surprise.']},

  {t:'card2', kick:'A worked example', h:'The same service, two ways to price it.',
   a:{h:'Priced off a feeling', p:'You charge what feels safe next to the salon down the road. Some services quietly lose money and you never see which.'},
   b:{h:'Priced off your time', p:'You know the cost per minute and the time standard, so every service clears its floor and the premium is deliberate.'}},

  {t:'part', no:'03', kick:'Part three', h:'What changes when the price has a reason.',
   lead:'This is not about being the most expensive chair in town. It is about every service paying for the time it takes, and you knowing exactly why.'},

  {t:'point', kick:'The other side', h:'When the price finally has a reason.',
   items:['You quote a price without flinching, because you can explain it in one sentence.',
          'The clients who value your time stay. The ones who only wanted the cheapest chair were never your clients.',
          'The resentment fades, because the work is finally paying for itself.']},

  {t:'quote', q:'The goal is not the highest price. It is a price you can <span class="a">say out loud</span> and stand behind.',
   attrib:'What we are really after'},

  {t:'bio', kick:'Who is teaching this', h:'Gina Bianca',
   facts:['<b>17 years</b> in the beauty industry, salon owner since 2014.',
          '<b>Global Director of Hair Color</b> for Rusk Professional.',
          'Host of <b>The Gina Bianca Podcast</b> for stylists and salon owners.',
          'Creator of <b>The Network Mastermind</b> and the <b>360 Guest Experience</b>.']},

  {t:'point', kick:'Where this fits', h:'Pricing is one room of a bigger house.',
   items:['The 360 Guest Experience makes the higher price feel obvious, from first message to rebook.',
          'Boundaries in Business keep the price and your time protected once they are set.']},

  {t:'recap', kick:'To recap', h:'Price your time.',
   items:['Know what one minute costs you.',
          'Set a time standard for every service.',
          'Reprice off cost and time, not the market.',
          'Pre-sell the price in the consultation, then hold it.']},

  {t:'cta', kick:'Where to take this next', h:'Come put the whole method to work.',
   lead:'If pricing your time is the first room, The Network Mastermind is the rest of the house: the courses, the weekly live coaching, and the community that keep it in place.',
   go:'Join us inside The Network Mastermind', site:'ginabianca.com',
   disc:'This class is educational. No specific income or business result is guaranteed. Results vary with your market, your effort, and your own numbers.'}
];

const deck = document.getElementById('deck');
function foot(i){return `<div class="foot"><span>Price Your Time</span><span>Gina Bianca</span></div>`}
function render(s,i){
  let inner='';
  if(s.t==='title') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p>`;
  else if(s.t==='agenda') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><p class="lead">${s.lead}</p>`;
  else if(s.t==='part') inner=`<div class="partno">${s.no}</div><div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p>`;
  else if(s.t==='quote') inner=`<div class="quote">${s.q}</div><div class="attrib">${s.attrib}</div>`;
  else if(s.t==='point') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul>${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='steps') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="steps">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='recap') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="steps">${s.items.map(x=>`<li>${x}</li>`).join('')}</ul>`;
  else if(s.t==='card2') inner=`<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="cols"><div class="card"><h3>${s.a.h}</h3><p>${s.a.p}</p></div><div class="card"><h3>${s.b.h}</h3><p>${s.b.p}</p></div></div>`;
  else if(s.t==='bio') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="facts">${s.facts.map(x=>`<div>${x}</div>`).join('')}</div>`;
  else if(s.t==='cta') inner=`<div class="kick">${s.kick}</div><h1>${s.h}</h1><p class="lead">${s.lead}</p><div class="go">${s.go}</div><div class="site">${s.site}</div><p class="disc">${s.disc}</p>`;
  return `<section class="slide ${s.t==='cta'?'cta':''}">${inner}${foot(i)}</section>`;
}
deck.innerHTML = S.map(render).join('');
</script>
</body>
</html>
