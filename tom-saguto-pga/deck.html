<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>The 2-Move Swing: A Crispy Contact Masterclass with Tom Saguto, PGA</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #f7f7f7;
    --panel: #ffffff;
    --hairline: #e8e8e8;
    --ink: #1a1a1a;
    --body: #2d2d2d;
    --muted: #555555;
    --green: #006738;
    --lime: #b3f063;
    --display: 'Cormorant Garamond', Georgia, serif;
    --sans: 'Inter', system-ui, sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    height: 100%;
    background: var(--bg);
    color: var(--body);
    font-family: var(--sans);
    font-weight: 400;
    -webkit-font-smoothing: antialiased;
  }

  .deck { height: 100vh; width: 100vw; overflow: hidden; position: relative; }

  .slide {
    position: absolute;
    inset: 0;
    display: none;
    flex-direction: column;
    justify-content: center;
    padding: clamp(2.5rem, 7vw, 8rem);
    background: var(--bg);
    animation: fade 0.5s ease;
  }
  .slide.active { display: flex; }

  @keyframes fade {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  h1 { font-family: var(--display); color: var(--ink); font-weight: 700; line-height: 1.0; letter-spacing: -0.005em; }
  h2 { font-family: var(--display); color: var(--ink); font-weight: 700; line-height: 1.04; }
  p { color: var(--body); font-weight: 400; }

  .eyebrow {
    font-family: var(--sans);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.28em;
    font-size: clamp(0.62rem, 0.9vw, 0.78rem);
    color: var(--green);
  }

  .rule { width: 84px; height: 3px; background: var(--green); border: 0; margin: 1.4rem 0; }

  .partmark { font-family: var(--display); font-weight: 700; color: var(--green); font-size: clamp(3.5rem, 10vw, 8rem); line-height: 1; }

  .bignum { font-family: var(--display); font-weight: 700; color: var(--green); font-size: clamp(7rem, 24vw, 20rem); line-height: 0.78; letter-spacing: -0.02em; }

  .title h1 { font-size: clamp(3rem, 8vw, 7rem); }
  .title .sub { font-size: clamp(1.1rem, 1.9vw, 1.6rem); color: var(--body); max-width: 44ch; margin-top: 1.5rem; font-weight: 300; }
  .byline { margin-top: 2.6rem; }
  .byline .name { font-family: var(--display); font-weight: 700; color: var(--ink); font-size: clamp(1.25rem, 1.8vw, 1.6rem); }
  .byline .creds { color: var(--muted); font-size: clamp(0.8rem, 1.1vw, 0.95rem); margin-top: 0.35rem; letter-spacing: 0.02em; }

  .lead { font-size: clamp(1.7rem, 4vw, 3.4rem); }
  .body-copy { font-size: clamp(1.02rem, 1.5vw, 1.35rem); color: var(--body); max-width: 60ch; line-height: 1.55; font-weight: 300; }
  .body-copy strong { color: var(--ink); font-weight: 600; }

  .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(2rem, 5vw, 5rem); align-items: center; }
  @media (max-width: 820px) { .two-col { grid-template-columns: 1fr; } }

  .pillar-head { display: flex; align-items: baseline; gap: 1.4rem; flex-wrap: wrap; }
  .pillar-index { font-family: var(--display); font-weight: 700; color: var(--green); font-size: clamp(3rem, 7vw, 5.5rem); line-height: 1; }
  .pillar-name { font-size: clamp(2.4rem, 6vw, 4.4rem); }

  .list { list-style: none; margin-top: 1.6rem; }
  .list li { position: relative; padding-left: 1.6rem; margin-bottom: 1rem; font-size: clamp(1rem, 1.4vw, 1.2rem); color: var(--body); line-height: 1.5; font-weight: 300; max-width: 60ch; }
  .list li::before { content: ""; position: absolute; left: 0; top: 0.6em; width: 8px; height: 8px; background: var(--green); }
  .list li strong { color: var(--ink); font-weight: 600; }

  .pillars-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); margin-top: 2rem; }
  @media (max-width: 820px) { .pillars-grid { grid-template-columns: 1fr 1fr; } }
  .pcell { background: var(--panel); padding: 1.4rem 1.2rem; }
  .pcell .pn { font-family: var(--display); font-weight: 700; color: var(--green); font-size: 1.7rem; }
  .pcell .pt { font-family: var(--display); font-weight: 700; color: var(--ink); font-size: clamp(1.05rem, 1.4vw, 1.3rem); margin-top: 0.4rem; line-height: 1.1; }

  .creds-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1px; background: var(--hairline); border: 1px solid var(--hairline); margin-top: 1.8rem; }
  @media (max-width: 820px) { .creds-grid { grid-template-columns: 1fr; } }
  .cred { background: var(--panel); padding: 1.5rem 1.6rem; }
  .cred .ct { font-family: var(--display); font-weight: 700; color: var(--ink); font-size: clamp(1.2rem, 1.6vw, 1.5rem); }
  .cred .cd { color: var(--muted); font-size: 0.92rem; margin-top: 0.4rem; }

  .mark { background: var(--lime); color: var(--ink); padding: 0.05em 0.28em; font-weight: 600; }

  .cta h2 { font-size: clamp(2.4rem, 6vw, 5rem); }
  .cta .step { display: flex; align-items: baseline; gap: 1rem; margin-top: 1.6rem; }
  .cta .brand { font-family: var(--display); font-weight: 700; color: var(--green); font-size: clamp(1.3rem, 1.8vw, 1.7rem); }
  .cta .arrow { font-family: var(--display); font-weight: 700; color: var(--green); font-size: clamp(1.6rem, 3vw, 2.4rem); }
  .disclaimer { color: var(--muted); font-size: clamp(0.72rem, 0.95vw, 0.85rem); line-height: 1.5; max-width: 64ch; margin-top: 2.4rem; font-weight: 300; }

  .brandbar { position: absolute; top: clamp(1.6rem, 3vw, 2.6rem); left: clamp(2.5rem, 7vw, 8rem); font-family: var(--display); font-weight: 700; color: var(--ink); font-size: 1.1rem; letter-spacing: 0.01em; }
  .brandbar span { color: var(--green); }

  .progress { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--green); transition: width 0.4s ease; z-index: 10; }

  .counter { position: absolute; bottom: clamp(1.4rem, 3vw, 2.4rem); right: clamp(2.5rem, 7vw, 8rem); font-family: var(--sans); font-weight: 500; color: var(--muted); font-size: 0.82rem; letter-spacing: 0.08em; }
  .counter b { color: var(--green); font-weight: 600; }

  .nav-hint { position: absolute; bottom: clamp(1.4rem, 3vw, 2.4rem); left: clamp(2.5rem, 7vw, 8rem); font-family: var(--sans); font-weight: 400; color: var(--muted); font-size: 0.75rem; letter-spacing: 0.05em; opacity: 0.75; }

  .arrows { position: absolute; bottom: clamp(1.2rem, 3vw, 2.2rem); left: 50%; transform: translateX(-50%); display: flex; gap: 0.6rem; z-index: 10; }
  .arrows button { background: var(--panel); border: 1px solid var(--hairline); color: var(--green); width: 40px; height: 34px; cursor: pointer; font-size: 1rem; line-height: 1; border-radius: 2px; transition: background 0.2s, border-color 0.2s; }
  .arrows button:hover { border-color: var(--green); background: #f0f6f2; }
</style>
</head>
<body>
<div class="deck" id="deck">
  <div class="brandbar">Saguto<span>Golf</span></div>
  <div class="progress" id="progress"></div>
  <div class="nav-hint">Use arrow keys or click to advance</div>
  <div class="counter"><b id="cur">01</b> / <span id="total">20</span></div>
  <div class="arrows">
    <button id="prev" aria-label="Previous slide">&larr;</button>
    <button id="next" aria-label="Next slide">&rarr;</button>
  </div>
</div>

<script>
  // Data-driven slide deck. Each entry is one slide object with a type `t`.
  const S = [
    {t:'title',
      eyebrow: 'A SagutoGolf Masterclass, Live',
      title: 'The 2-Move Swing',
      sub: 'How to strike the ball crispy, again and again, by learning the swing as two moves instead of two dozen.',
      name: 'Taught by Tom Saguto, PGA',
      creds: 'PGA Member. Voted #1 Online Golf School. MyGolfSpy Top 10 Instructor.' },

    {t:'statement',
      eyebrow: 'The Promise',
      lead: 'By the end of this class, the swing stops feeling like a puzzle you rebuild every round.',
      body: 'You will see the swing the way I teach it: two simple moves, grounded in geometry and physics that do not change from day to day. Fewer moving parts means fewer things to break. That is what makes <strong>crispy contact</strong> repeatable for a real golfer with a real body and a real schedule.' },

    {t:'twocol',
      eyebrow: 'Who This Is For',
      h: 'You love this game. You are tired of guessing where the ball goes.',
      body: 'You have watched the videos. You have taken the tips. You keep a mental list of swing thoughts a mile long, and you cycle through them one by one, hoping today is the day it clicks.',
      bullets: [
        'One round you strike it pure. The next you cannot find the middle of the face.',
        'Every new tip adds another thing to remember, not another shot you can trust.',
        'Practice feels like maintenance that never quite holds.' ] },

    {t:'hook',
      eyebrow: 'The Real Problem',
      title: 'It is not you. It is the number of variables you are asked to control.',
      body: 'Inconsistent contact is not a talent problem. It is a <strong>complexity</strong> problem. The more independent moves a swing depends on, the more ways it has to go wrong on any given day.' },

    {t:'divider',
      eyebrow: 'Part One',
      num: '01',
      title: 'Why conventional instruction breaks your contact' },

    {t:'statement',
      eyebrow: 'Part One',
      lead: 'Most instruction stacks up dozens of independent positions.',
      body: 'Grip, stance, takeaway, wrist set, backswing plane, hip turn, weight shift, lag, release, follow through. Each is coached as its own separate move to remember and coordinate in the fraction of a second the swing actually takes. Learn them one at a time and you never quite own them all at once.' },

    {t:'twocol',
      eyebrow: 'Part One',
      h: 'Every move you add is a variable that can break the strike.',
      body: 'Think of each position as a dial. Set twenty dials, and all twenty have to land in range for the ball to come off clean. Miss one and the strike suffers.',
      bullets: [
        'That is why good days feel like luck. You are not repeating a method.',
        'You are hoping every dial happens to line up at the same instant.',
        'Fewer variables is not a shortcut. It is the whole answer.' ] },

    {t:'divider',
      eyebrow: 'Part Two',
      num: '02',
      title: 'The 2-Move Swing and the 5 Pillars of Great Ball Striking' },

    {t:'bignum',
      eyebrow: 'Part Two: The Framework',
      num: '2',
      h: 'moves, not two dozen.',
      body: 'Instead of coordinating a long list of positions, the 2-Move Swing reduces the full motion to two essential moves built on geometry that does not change. Take the variables out, and consistent contact becomes the default outcome rather than a lucky one. You can groove the pattern with a simple 2-move drill. No club, no balls, no range required. That is what makes it fit a real life, not just a lesson tee.' },

    {t:'pillarsgrid',
      eyebrow: 'Part Two: The Framework',
      num: '5',
      h: 'Pillars of Great Ball Striking. Each one is an outcome the swing is built to deliver.',
      pillars: [
        { n: '01', label: 'Crispy Contact' },
        { n: '02', label: 'Effortless Power' },
        { n: '03', label: 'Predictable Control' },
        { n: '04', label: 'Body Friendly' },
        { n: '05', label: 'Low Maintenance' } ] },

    {t:'pillar',
      eyebrow: 'Pillar One',
      index: '01',
      name: 'Crispy Contact',
      body: 'The clean, centered strike you feel and hear when the ball comes off the middle of the face. It is the whole point, so it is the first thing the two moves are engineered to produce, on purpose, not by accident.' },

    {t:'pillar',
      eyebrow: 'Pillar Two',
      index: '02',
      name: 'Effortless Power',
      body: 'Power that comes from a sound sequence, not from swinging harder. When the geometry is right, speed shows up on its own. You stop muscling the ball and start delivering the club.' },

    {t:'pillar',
      eyebrow: 'Pillar Three',
      index: '03',
      name: 'Predictable Control',
      body: 'A start line and shape you can count on. Fewer moving parts means fewer surprises, so you can aim at a target and trust where the ball is going before you swing.' },

    {t:'pillar',
      eyebrow: 'Pillar Four',
      index: '04',
      name: 'Body Friendly',
      body: 'A motion your body can actually make and keep making. The two moves do not demand the flexibility or speed of a tour player, which is why golfers with back, knee, and shoulder limits can strike it well.' },

    {t:'pillar',
      eyebrow: 'Pillar Five',
      index: '05',
      name: 'Low Maintenance',
      body: 'A swing that holds up without constant re-tuning. With so few variables to drift, you do not have to rebuild it every time you step away. It is there when you come back to it.' },

    {t:'divider',
      eyebrow: 'Part Three',
      num: '03',
      title: 'From the drill to the course, and who it fits' },

    {t:'list',
      eyebrow: 'Part Three: In Practice',
      h: 'You practice the pattern, not a checklist.',
      bullets: [
        'Groove the two moves with the drill at home, in a hallway or a garage, without a ball.',
        'Carry one clear feeling to the course instead of a dozen swing thoughts.',
        'Because the motion repeats, a good strike is something you can find on command rather than stumble into.' ] },

    {t:'creds',
      eyebrow: 'Why Learn It From Me',
      h: 'I teach this because I have watched it work for golfers everyone else gave up on.',
      creds: [
        { ct: 'PGA Member', cd: 'A trained, credentialed teaching professional.' },
        { ct: 'Voted #1 Online Golf School', cd: 'Recognized for online instruction.' },
        { ct: 'MyGolfSpy Top 10 Instructor', cd: 'Named among the top instructors online.' },
        { ct: '600,000+ golfers', cd: 'Golfers reached through this method.' } ] },

    {t:'list',
      eyebrow: 'Part Three: Who It Fits',
      h: 'Built for the golfers conventional instruction tends to leave behind.',
      bullets: [
        '<strong>Golfers 65 and up,</strong> including many members in their 70s and 80s who want to keep striking it clean.',
        '<strong>Players with back, knee, or shoulder limits,</strong> who need a motion the body can tolerate.',
        '<strong>Time-poor players</strong> who cannot get to the range often and need a swing that holds without constant practice.' ],
      foot: 'It works for new golfers and low handicaps too. The <span class="mark">simplicity</span> is what makes it fit any body.' },

    {t:'cta',
      eyebrow: 'Your Next Step',
      h: 'Ready to strike it crispy? Start the Crispy Contact System.',
      body: 'Learn the 2-Move Swing in full, groove it with the drills, and build a swing that finally holds. Take the next step with SagutoGolf and begin the Crispy Contact System today.',
      brand: 'Begin at SagutoGolf',
      disclaimer: 'Educational content only. Golf improvement depends on individual effort, consistency, and practice, and results vary from golfer to golfer. Nothing here is a promise or guarantee of any specific outcome, score, or level of play.' }
  ];

  const deck = document.getElementById('deck');

  function esc(s) { return s; }

  function render(s) {
    const el = document.createElement('section');
    el.className = 'slide';
    let html = '';
    const eb = s.eyebrow ? '<p class="eyebrow">' + s.eyebrow + '</p><hr class="rule" />' : '';

    if (s.t === 'title') {
      el.classList.add('title');
      html = eb +
        '<h1>' + s.title + '</h1>' +
        '<p class="sub">' + s.sub + '</p>' +
        '<div class="byline"><div class="name">' + s.name + '</div>' +
        '<div class="creds">' + s.creds + '</div></div>';
    } else if (s.t === 'statement') {
      html = eb + '<h2 class="lead">' + s.lead + '</h2>' +
        '<p class="body-copy" style="margin-top:1.6rem;">' + s.body + '</p>';
    } else if (s.t === 'hook') {
      html = eb + '<h1 style="font-size:clamp(2rem,5.5vw,4.6rem);max-width:20ch;">' + s.title + '</h1>' +
        '<p class="body-copy" style="margin-top:2rem;">' + s.body + '</p>';
    } else if (s.t === 'divider') {
      html = eb + '<div class="partmark">' + s.num + '</div>' +
        '<h2 style="font-size:clamp(2rem,5vw,4.2rem);margin-top:0.6rem;">' + s.title + '</h2>';
    } else if (s.t === 'twocol') {
      const bl = (s.bullets || []).map(b => '<li>' + b + '</li>').join('');
      html = eb + '<div class="two-col">' +
        '<div><h2 style="font-size:clamp(1.8rem,4.5vw,3.4rem);">' + s.h + '</h2></div>' +
        '<div><p class="body-copy">' + s.body + '</p><ul class="list">' + bl + '</ul></div></div>';
    } else if (s.t === 'bignum') {
      html = eb + '<div class="two-col">' +
        '<div><div class="bignum">' + s.num + '</div>' +
        '<h2 style="font-size:clamp(1.8rem,4vw,3rem);margin-top:1rem;">' + s.h + '</h2></div>' +
        '<div><p class="body-copy">' + s.body + '</p></div></div>';
    } else if (s.t === 'pillarsgrid') {
      const cells = s.pillars.map(p => '<div class="pcell"><div class="pn">' + p.n + '</div><div class="pt">' + p.label + '</div></div>').join('');
      html = eb + '<div class="two-col" style="grid-template-columns:auto 1fr;">' +
        '<div class="bignum">' + s.num + '</div>' +
        '<h2 style="font-size:clamp(1.6rem,3.6vw,2.8rem);">' + s.h + '</h2></div>' +
        '<div class="pillars-grid">' + cells + '</div>';
    } else if (s.t === 'pillar') {
      html = eb + '<div class="pillar-head"><span class="pillar-index">' + s.index + '</span>' +
        '<h2 class="pillar-name">' + s.name + '</h2></div>' +
        '<p class="body-copy" style="margin-top:1.6rem;">' + s.body + '</p>';
    } else if (s.t === 'list') {
      const bl = s.bullets.map(b => '<li>' + b + '</li>').join('');
      const foot = s.foot ? '<p class="body-copy" style="margin-top:1.4rem;">' + s.foot + '</p>' : '';
      html = eb + '<h2 style="font-size:clamp(1.8rem,4vw,3rem);max-width:24ch;">' + s.h + '</h2>' +
        '<ul class="list" style="margin-top:1.8rem;">' + bl + '</ul>' + foot;
    } else if (s.t === 'creds') {
      const cs = s.creds.map(c => '<div class="cred"><div class="ct">' + c.ct + '</div><div class="cd">' + c.cd + '</div></div>').join('');
      html = eb + '<h2 style="font-size:clamp(1.8rem,4vw,3rem);max-width:24ch;">' + s.h + '</h2>' +
        '<div class="creds-grid">' + cs + '</div>';
    } else if (s.t === 'cta') {
      el.classList.add('cta');
      html = eb + '<h2>' + s.h + '</h2>' +
        '<p class="body-copy" style="margin-top:1.4rem;">' + s.body + '</p>' +
        '<div class="step"><span class="arrow">&rarr;</span><span class="brand">' + s.brand + '</span></div>' +
        '<p class="disclaimer">' + s.disclaimer + '</p>';
    }
    el.innerHTML = html;
    return el;
  }

  const rendered = S.map(render);
  rendered.forEach(el => deck.insertBefore(el, deck.querySelector('.brandbar')));
  const slides = rendered;

  let idx = 0;
  const total = slides.length;
  document.getElementById('total').textContent = String(total).padStart(2, '0');

  function show(n) {
    idx = Math.max(0, Math.min(total - 1, n));
    slides.forEach((s, i) => s.classList.toggle('active', i === idx));
    document.getElementById('cur').textContent = String(idx + 1).padStart(2, '0');
    document.getElementById('progress').style.width = ((idx + 1) / total * 100) + '%';
  }
  function nextSlide() { show(idx + 1); }
  function prevSlide() { show(idx - 1); }

  document.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); nextSlide(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); prevSlide(); }
    else if (e.key === 'Home') { show(0); }
    else if (e.key === 'End') { show(total - 1); }
  });
  document.getElementById('next').addEventListener('click', (e) => { e.stopPropagation(); nextSlide(); });
  document.getElementById('prev').addEventListener('click', (e) => { e.stopPropagation(); prevSlide(); });
  deck.addEventListener('click', (e) => {
    if (e.target.closest('.arrows')) return;
    const x = e.clientX;
    if (x < window.innerWidth * 0.25) prevSlide(); else nextSlide();
  });

  show(0);
</script>
</body>
</html>
