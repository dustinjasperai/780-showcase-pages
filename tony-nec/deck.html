<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sound Medicine, Not Sound Baths - The Sound Healing Academy</title>
<link href="https://fonts.googleapis.com/css2?family=Cabin:wght@400;500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#282459;      /* deep indigo ground (brand darkest) */
  --panel:#493a7c;   /* brand button violet */
  --rule:#5b5590;
  --accent:#674ea7;  /* brand purple */
  --sand:#b39385;    /* brand warm sand highlight */
  --ink:#fbfaf7;     /* off-white */
  --muted:#c9c6de;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#17142e;font-family:'Open Sans',sans-serif;color:var(--ink);line-height:1.5}
.deck{max-width:1120px;margin:0 auto;padding:30px 18px}
.slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:18px;
  padding:72px 72px;margin:26px 0;min-height:560px;display:flex;flex-direction:column;
  justify-content:center;overflow:hidden}
.slide::after{content:'';position:absolute;right:-120px;bottom:-120px;width:360px;height:360px;
  border-radius:50%;border:2px solid var(--accent);opacity:.18;
  box-shadow:0 0 0 40px transparent, inset 0 0 0 40px transparent}
.rings{position:absolute;right:-90px;bottom:-90px;opacity:.22;pointer-events:none}
.eyebrow{font-family:'Cabin',sans-serif;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
  font-size:14px;color:var(--sand);margin-bottom:22px}
h1{font-family:'Cabin',sans-serif;font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em}
h2{font-family:'Cabin',sans-serif;font-weight:700;font-size:40px;line-height:1.12;margin-bottom:10px}
.lede{font-size:23px;color:var(--muted);margin-top:22px;max-width:40ch}
.sub{font-size:20px;color:var(--muted);margin-top:28px}
.present{margin-top:46px;font-size:19px;color:var(--sand);font-weight:600;position:relative;z-index:2}
ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px;position:relative;z-index:2}
li{display:flex;gap:18px;align-items:flex-start;font-size:22px;max-width:52ch}
li .dot{flex-shrink:0;width:14px;height:14px;border-radius:50%;background:var(--accent);margin-top:9px}
.pillar{display:inline-block;font-family:'Cabin',sans-serif;font-weight:700;font-size:15px;
  letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--sand);
  border-radius:100px;padding:8px 18px;margin-bottom:24px}
.big{font-size:30px;line-height:1.35;max-width:30ch}
.big .hl{color:var(--sand)}
.part-n{font-family:'Cabin',sans-serif;font-size:140px;font-weight:700;color:var(--panel);
  line-height:.9;position:relative;z-index:2}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px;position:relative;z-index:2}
.cell{background:var(--panel);border-radius:14px;padding:26px 28px}
.cell .k{font-family:'Cabin',sans-serif;font-weight:700;font-size:22px;color:var(--ink)}
.cell .v{font-size:17px;color:var(--muted);margin-top:8px}
.stat{display:flex;gap:40px;flex-wrap:wrap;margin-top:34px;position:relative;z-index:2}
.stat .n{font-family:'Cabin',sans-serif;font-weight:700;font-size:48px;color:var(--sand)}
.stat .l{font-size:16px;color:var(--muted);margin-top:4px;max-width:16ch}
.cta-box{position:relative;z-index:2}
.cta-btn{display:inline-block;margin-top:28px;background:var(--sand);color:#2a2140;
  font-family:'Cabin',sans-serif;font-weight:700;font-size:22px;border-radius:100px;padding:18px 40px}
.disclaimer{margin-top:40px;font-size:14px;color:#9a97b5;max-width:60ch;position:relative;z-index:2}
.num{position:absolute;top:28px;right:34px;font-size:14px;color:#6f6a9c;font-family:'Cabin',sans-serif}
.path{display:flex;flex-direction:column;gap:14px;margin-top:30px;position:relative;z-index:2}
.step{display:flex;gap:20px;align-items:center;background:var(--panel);border-radius:12px;padding:20px 26px}
.step .s-n{font-family:'Cabin',sans-serif;font-weight:700;font-size:24px;color:var(--sand);flex-shrink:0;width:40px}
.step .s-t{font-size:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const RINGS = `<svg class="rings" width="300" height="300" viewBox="0 0 300 300" fill="none">
  <circle cx="150" cy="150" r="40" stroke="#b39385" stroke-width="2"/>
  <circle cx="150" cy="150" r="80" stroke="#b39385" stroke-width="2"/>
  <circle cx="150" cy="150" r="120" stroke="#b39385" stroke-width="2"/>
  <circle cx="150" cy="150" r="10" fill="#b39385"/></svg>`;

const S = [
  {t:'title',
    eyebrow:'A free live masterclass',
    h1:'Sound Medicine,<br>Not Sound Baths',
    sub:'The Integral path to a certified sound healing practice.',
    present:'with Tony Nec - The Sound Healing Academy' },

  {t:'promise',
    eyebrow:'What this hour gives you',
    h2:'By the end of this live class you will know:',
    bullets:[
      'What makes sound healing a whole-person method, not a playlist',
      'The four instrument families and when a practitioner reaches for each',
      'The real path from enthusiast to certified, insurable practitioner' ] },

  {t:'who',
    eyebrow:'Who this is for',
    h2:'This is for you if:',
    bullets:[
      'Sound already moves you, and you want to work with it for real',
      'You have run or sat in sound baths and want the method underneath them',
      'You want a credential clients and insurers actually trust' ] },

  {t:'trap',
    pillar:'The honest part',
    big:'You can already feel what sound does.<br>But <span class="hl">a playlist is not a practice.</span>' },

  {t:'hook',
    pillar:'The reframe',
    big:'The relaxation is real.<br>The problem is <span class="hl">it stops there.</span>' },

  {t:'part', n:'1', h2:'Why sound baths plateau' },

  {t:'body',
    eyebrow:'The core problem',
    h2:'One good session is not change.',
    lede:'A single sound bath relaxes the body for an afternoon. Lasting change asks you to work the whole person, on purpose, with a repeatable method behind every session.' },

  {t:'body',
    eyebrow:'What is missing',
    h2:'Three gaps keep enthusiasts stuck:',
    bullets:[
      'No framework, so every session is improvised',
      'No credential, so the work is hard to charge for or insure',
      'No path, so there is nowhere to grow after the first bowl' ] },

  {t:'part', n:'2', h2:'The Integral Method' },

  {t:'body',
    eyebrow:'Where it comes from',
    h2:'Integral means the whole person.',
    lede:'Integral Sound Healing is built on Integral Theory: it works across body, mind, soul and spirit at once, blending ancient wisdom, modern science, art and sound therapy into one method rather than a single relaxing track.' },

  {t:'pillarslide',
    pillar:'Pillar one',
    h2:'The whole-person framework',
    lede:'Every session is designed to reach all layers of a person, not just the nervous system. That is what turns a nice experience into a process you can repeat and build a practice on.' },

  {t:'pillarslide',
    pillar:'Pillar two',
    h2:'The instruments',
    grid:[
      ['The healing voice','Toning as the most direct instrument you already own'],
      ['Singing bowls','Tibetan and crystal bowls for layered, sustained resonance'],
      ['Gongs and drums','Immersive, enveloping sound fields and rhythm'],
      ['Tuning forks','Precise, targeted frequency work'] ] },

  {t:'pillarslide',
    pillar:'Pillar three',
    h2:'Why it works in the body',
    lede:'Sound vibration travels deep into tissue and shifts brainwave frequency, guiding a person into a deeply relaxed, meditative state where the whole-person work can actually land. The method teaches you to apply that on purpose.' },

  {t:'pillarslide',
    pillar:'Pillar four',
    h2:'The certification pathway',
    lede:'The method is taught as a real path: Level 1 foundations, then Level 2 for one-to-one clients and group sound baths, then specialist diplomas. The Academy is an IICT-approved provider, so your diploma qualifies you to practise and insure your work.' },

  {t:'part', n:'3', h2:'From enthusiast to practitioner' },

  {t:'body',
    eyebrow:'What a session looks like',
    h2:'A practitioner leads, they do not press play.',
    lede:'You hold the space, choose the instruments for the person in front of you, and move them through an arc on purpose. That is the difference between a recording and a practice.' },

  {t:'why',
    eyebrow:'Why learn it here',
    h2:'The Sound Healing Academy',
    stats:[
      ['23 yrs','teaching the Integral method since 2003'],
      ['10,000+','sound healers in the community'],
      ['70+','countries with students and graduates'],
      ['IICT','approved training provider'] ] },

  {t:'path',
    eyebrow:'The path, mapped',
    h2:'Where this goes next:',
    steps:[
      ['01','Level 1 - Integral foundations and your first instruments'],
      ['02','Level 2 - one-to-one clients and group sound baths'],
      ['03','Specialist diplomas - crystal bowls, tuning forks and more'],
      ['04','Certified, insurable practitioner'] ] },

  {t:'cta',
    eyebrow:'Your next step',
    h2:'Start the path today.',
    lede:'Join the free live masterclass, then step into Level 1 of the Integral Sound Healing certification with The Sound Healing Academy.',
    btn:'Register for the live masterclass',
    disclaimer:'Educational content only. No specific result or income is guaranteed. Results vary from person to person. Sound healing is a complementary wellbeing practice and is not a substitute for medical care.' }
];

function render(){
  const deck = document.getElementById('deck');
  S.forEach((s, i)=>{
    const el = document.createElement('section');
    el.className = 'slide';
    let inner = `<div class="num">${i+1} / ${S.length}</div>` + RINGS;
    if(s.eyebrow) inner += `<div class="eyebrow">${s.eyebrow}</div>`;
    if(s.pillar) inner += `<div class="pillar">${s.pillar}</div>`;
    if(s.t==='title'){
      inner += `<h1>${s.h1}</h1><div class="sub">${s.sub}</div><div class="present">${s.present}</div>`;
    } else if(s.t==='part'){
      inner += `<div class="part-n">${s.n}</div><h2 style="margin-top:14px">${s.h2}</h2>`;
    } else if(s.t==='trap' || s.t==='hook'){
      inner += `<div class="big">${s.big}</div>`;
    } else {
      if(s.h2) inner += `<h2>${s.h2}</h2>`;
      if(s.lede) inner += `<div class="lede">${s.lede}</div>`;
      if(s.bullets) inner += '<ul>'+s.bullets.map(b=>`<li><span class="dot"></span><span>${b}</span></li>`).join('')+'</ul>';
      if(s.grid) inner += '<div class="grid">'+s.grid.map(g=>`<div class="cell"><div class="k">${g[0]}</div><div class="v">${g[1]}</div></div>`).join('')+'</div>';
      if(s.stats) inner += '<div class="stat">'+s.stats.map(st=>`<div><div class="n">${st[0]}</div><div class="l">${st[1]}</div></div>`).join('')+'</div>';
      if(s.steps) inner += '<div class="path">'+s.steps.map(p=>`<div class="step"><div class="s-n">${p[0]}</div><div class="s-t">${p[1]}</div></div>`).join('')+'</div>';
      if(s.btn) inner += `<div class="cta-box"><div class="cta-btn">${s.btn}</div></div>`;
      if(s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
    }
    el.innerHTML = inner;
    deck.appendChild(el);
  });
}
render();
</script>
</body>
</html>
