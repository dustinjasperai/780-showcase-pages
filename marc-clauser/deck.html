<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Booked Before the Box — Wall Print Academy Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500;600&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ffffff;
    --panel:#f3f2f0;
    --ink:#1b1b1b;
    --rule:#424242;
    --accent:#242424;
    --muted:#6b6b6b;
    --display:'Jost',sans-serif;
    --text:'Fira Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d9d8d4;color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 18px 80px}
  .slide{
    background:var(--bg);
    border:1px solid #e4e3df;
    aspect-ratio:16/9;
    margin:0 0 26px;
    padding:62px 66px;
    position:relative;
    display:flex;flex-direction:column;
    overflow:hidden;
  }
  .kicker{
    font-family:var(--display);
    font-weight:500;
    letter-spacing:.32em;
    text-transform:uppercase;
    font-size:12px;
    color:var(--rule);
    margin-bottom:26px;
    display:flex;align-items:center;gap:14px;
  }
  .kicker::before{content:"";width:34px;height:1px;background:var(--rule);display:inline-block}
  h1{font-family:var(--display);font-weight:600;font-size:58px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:500;font-size:40px;line-height:1.08;letter-spacing:-.005em}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch;font-weight:300}
  .sub{font-size:17px;line-height:1.55;color:var(--muted);max-width:52ch;margin-top:auto}
  p.body{font-size:18px;line-height:1.6;max-width:50ch;font-weight:400}
  .spacer{flex:1}
  .num{position:absolute;top:58px;right:66px;font-family:var(--display);font-size:13px;color:#bdbcb8;letter-spacing:.1em}
  .frame{position:absolute;right:66px;bottom:60px;width:150px;height:150px;border:1px solid var(--rule)}
  .frame.sm{width:92px;height:92px}
  ul.pills{list-style:none;display:flex;flex-direction:column;gap:14px;margin-top:8px}
  ul.pills li{font-size:19px;line-height:1.4;padding-left:26px;position:relative;max-width:46ch}
  ul.pills li::before{content:"";position:absolute;left:0;top:10px;width:9px;height:9px;background:var(--accent)}
  .big{font-family:var(--display);font-weight:600;font-size:120px;line-height:1;color:var(--accent)}
  .mod{display:grid;grid-template-columns:48px 1fr;gap:20px 22px;margin-top:6px}
  .mod .mi{font-family:var(--display);font-weight:500;font-size:22px;color:var(--rule);border-top:2px solid var(--accent);padding-top:8px}
  .mod .mt{font-family:var(--display);font-weight:500;font-size:22px;line-height:1.2}
  .mod .md{grid-column:2;font-size:15.5px;color:var(--muted);line-height:1.5;margin-top:-10px;max-width:50ch}
  .quote{font-family:var(--display);font-weight:300;font-size:38px;line-height:1.22;letter-spacing:-.01em;max-width:24ch}
  .cta h2{font-size:46px}
  .cta .step{font-size:20px;line-height:1.5;margin-top:22px;max-width:46ch}
  .disc{font-size:12.5px;color:var(--muted);line-height:1.5;max-width:70ch;margin-top:26px;border-top:1px solid #e4e3df;padding-top:14px}
  .brandline{position:absolute;bottom:60px;left:66px;font-family:var(--display);letter-spacing:.28em;text-transform:uppercase;font-size:11px;color:#bdbcb8}
  .label{font-family:var(--display);letter-spacing:.2em;text-transform:uppercase;font-size:12px;color:var(--rule);margin-bottom:10px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start}
  .stat{font-family:var(--display);font-weight:600;font-size:64px;color:var(--accent);line-height:1}
  .statcap{font-size:15px;color:var(--muted);margin-top:8px;max-width:26ch;line-height:1.45}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title'},
  {t:'forwho'},
  {t:'market'},
  {t:'reframe'},
  {t:'part', part:'Part One', title:'The box-first trap', sub:'Why most new operators lose money before they ever make a sale.'},
  {t:'problem'},
  {t:'truth'},
  {t:'objection'},
  {t:'part', part:'Part Two', title:'The Booked-Before-the-Box method', sub:'The order the Academy teaches: demand first, machine second.'},
  {t:'method-intro'},
  {t:'mod1'},
  {t:'mod2'},
  {t:'mod3'},
  {t:'mod4'},
  {t:'part', part:'Part Three', title:'What the first 90 days look like', sub:'From zero to a booked wall, then a machine that pays for itself.'},
  {t:'ninety'},
  {t:'walkaway'},
  {t:'whyme'},
  {t:'cta', disc:'Educational content only. No income or result is guaranteed. Results vary and depend on your own effort, market, and execution.'}
];

const R = {
  title: () => `
    <div class="kicker">Wall Print Academy Masterclass</div>
    <div class="spacer"></div>
    <h1>Booked Before<br>the Box.</h1>
    <p class="sub">How to land your first paying wall printing jobs before you spend a dollar on a printer. The de-risk-first path into a high-margin, low-competition business.</p>
    <div class="frame"></div>
    <div class="brandline">Marc Clauser</div>`,

  forwho: () => `
    <div class="kicker">Who this is for</div>
    <h2>You can see the opportunity.<br>You just don't want to gamble on it.</h2>
    <div class="spacer"></div>
    <ul class="pills">
      <li>You have watched a wall printer turn a blank wall into art and thought "people would pay for that."</li>
      <li>You are creative or handy, but you are not a trained graphic designer and that worries you.</li>
      <li>The machine costs real money, and you do not want to own one before you know it will sell.</li>
    </ul>`,

  market: () => `
    <div class="label">The opportunity</div>
    <h2>High margin. Low competition.<br>And almost nobody doing it right.</h2>
    <div class="spacer"></div>
    <div class="two">
      <div>
        <div class="stat">high</div>
        <div class="statcap">margins on a printed wall once you can sell and deliver the work.</div>
      </div>
      <div>
        <div class="stat">low</div>
        <div class="statcap">competition in most local markets, because few operators ever get past the gear.</div>
      </div>
    </div>
    <p class="sub">The room is wide open. The people who win it are the ones who learn to sell the work, not the ones who buy the fanciest machine.</p>`,

  objection: () => `
    <div class="kicker">The two fears that stop people</div>
    <div class="spacer"></div>
    <ul class="pills">
      <li>"I'm not a designer." You do not need to be. There is a repeatable way to deliver clean artwork without the training.</li>
      <li>"What if I buy it and nobody books?" You never find out the expensive way, because you book first and buy second.</li>
    </ul>
    <p class="sub">Both fears are real, and both are solved by the order you do things in.</p>`,

  reframe: () => `
    <div class="kicker">The reframe</div>
    <div class="spacer"></div>
    <div class="quote">The printer is not the business. The booked job is the business.</div>
    <p class="sub">Everyone starts by shopping for machines. The operators who last start by selling the work, then buy the machine to fill the calendar they already built.</p>
    <div class="frame sm"></div>`,

  part: (s) => `
    <div class="kicker">${s.part}</div>
    <div class="spacer"></div>
    <h1>${s.title}</h1>
    <p class="sub">${s.sub}</p>`,

  problem: () => `
    <div class="label">The common path</div>
    <h2>Buy the machine, then go looking for demand.</h2>
    <div class="spacer"></div>
    <div class="two">
      <div>
        <div class="stat">$0</div>
        <div class="statcap">in signed jobs on the day the machine arrives, for most first-time buyers.</div>
      </div>
      <div>
        <div class="stat">months</div>
        <div class="statcap">of payments on equipment that sits idle while you learn how to sell and design from scratch.</div>
      </div>
    </div>
    <p class="sub">The gear was never the hard part. Finding customers and delivering clean artwork is, and the box-first order leaves you doing both under financial pressure.</p>`,

  truth: () => `
    <div class="kicker">The uncomfortable truth</div>
    <div class="spacer"></div>
    <div class="quote">If you cannot book a wall without a printer, owning one will not fix it.</div>
    <p class="sub">Demand is a skill, not a machine. Prove you can fill a calendar with borrowed or outsourced capacity first, and the purchase becomes a safe, obvious yes.</p>`,

  'method-intro': () => `
    <div class="kicker">The method</div>
    <h2>Four moves, in order, before the box.</h2>
    <div class="spacer"></div>
    <ul class="pills">
      <li>Vet the opportunity so you invest with eyes open, not on hype.</li>
      <li>Book the first job before you own anything.</li>
      <li>Deliver clean artwork without being a designer.</li>
      <li>Go from nobody to the local name people call.</li>
    </ul>`,

  mod1: () => `
    <div class="label">Move One</div>
    <div class="mod">
      <div class="mi">01</div><div class="mt">Things to know before you invest</div>
      <div class="md">What to vet about the market, the margins, and the machines before you spend a dollar. The screen that tells you whether this is a real business for you, or an expensive hobby.</div>
    </div>
    <div class="spacer"></div>
    <p class="body">Start here and the rest of the path is calm. Skip it and every later decision is a guess made with money already spent.</p>`,

  mod2: () => `
    <div class="label">Move Two</div>
    <div class="mod">
      <div class="mi">02</div><div class="mt">Getting your first sale</div>
      <div class="md">How to find good customers, price the work, and book your first wall printing jobs with no equipment in the garage yet. This is the move that makes everything after it safe.</div>
    </div>
    <div class="spacer"></div>
    <p class="body">A signed job is permission to buy a machine. You are no longer hoping demand shows up. You are buying capacity for demand you already created.</p>`,

  mod3: () => `
    <div class="label">Move Three</div>
    <div class="mod">
      <div class="mi">03</div><div class="mt">Intro to graphics, without being a graphic designer</div>
      <div class="md">How to prepare and deliver print-ready wall artwork without years of design training. This removes the single biggest objection new operators carry: "I'm not a designer."</div>
    </div>
    <div class="spacer"></div>
    <p class="body">You do not need to be an artist. You need a repeatable way to turn what a customer wants into a file the wall will love.</p>`,

  mod4: () => `
    <div class="label">Move Four</div>
    <div class="mod">
      <div class="mi">04</div><div class="mt">From nobody to somebody: your online presence</div>
      <div class="md">Building the local presence, portfolio, and social proof that turns an unknown into the business people find and trust. The compounding engine once the first jobs are done.</div>
    </div>
    <div class="spacer"></div>
    <p class="body">The first sale proves the business. Your presence is what makes the next ten come to you instead of you chasing them.</p>`,

  ninety: () => `
    <div class="label">The first 90 days</div>
    <h2>Demand first. The machine pays for itself second.</h2>
    <div class="spacer"></div>
    <div class="two">
      <div>
        <div class="stat">1</div>
        <div class="statcap">booked wall before any purchase, using the first-sale moves.</div>
      </div>
      <div>
        <div class="stat">&gt;60</div>
        <div class="statcap">operators the founders have already walked through this exact path.</div>
      </div>
    </div>
    <p class="sub">The order is the whole point. You arrive at the buying decision with revenue on the table, not a bet on your desk.</p>`,

  walkaway: () => `
    <div class="kicker">What you walk away with</div>
    <h2>A business you proved before you paid for it.</h2>
    <div class="spacer"></div>
    <ul class="pills">
      <li>A clear read on whether this is right for you, made before any money is at risk.</li>
      <li>Your first booked jobs and a way to price them with confidence.</li>
      <li>A delivery and presence system so the work keeps coming without you chasing it.</li>
    </ul>`,

  whyme: () => `
    <div class="kicker">Why learn it here</div>
    <h2>Built by operators, not a reseller.</h2>
    <div class="spacer"></div>
    <ul class="pills">
      <li>Marc Clauser, a pioneer of wall printing in North America, with nearly a decade in the business.</li>
      <li>Co-founder of Vertical Printers, where the method was built on real jobs, not theory.</li>
      <li>Over 60 operators already started on this path through the Academy and community.</li>
    </ul>`,

  cta: (s) => `
    <div class="cta">
      <div class="kicker">Your next step</div>
      <div class="spacer"></div>
      <h2>Come book your first wall before you buy the box.</h2>
      <p class="step">Join Wall Print Academy and start with Move One. Land the first job, then let the machine earn its keep from day one.</p>
      <div class="disc">${s.disc}</div>
      <div class="brandline">Wall Print Academy &middot; Marc Clauser</div>
    </div>`
};

const deck = document.getElementById('deck');
S.forEach((s,i) => {
  const el = document.createElement('div');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  el.innerHTML = (R[s.t] ? R[s.t](s) : '') + `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  deck.appendChild(el);
});
</script>
</body>
</html>
