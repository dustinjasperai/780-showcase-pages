<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Leading by Subtraction — a masterclass for new engineering & SE leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f3ec; --panel:#ece4da; --rule:#c4c0b9; --ink:#36302a; --ink-soft:#514b45; --accent:#514b45;
  }
  html,body{height:100%}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--ink); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative; width:min(96vw,1040px); aspect-ratio:16/9;
    background:var(--bg); overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,.45);
  }
  .slide{
    position:absolute; inset:0; padding:64px 72px;
    display:none; flex-direction:column; justify-content:center;
  }
  .slide.on{display:flex}
  .kicker{font-size:13px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--accent); margin-bottom:22px}
  h1{font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:58px; line-height:1.07; letter-spacing:-.01em; color:var(--ink)}
  h2{font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:40px; line-height:1.12; color:var(--ink); margin-bottom:20px}
  .lead{font-size:23px; line-height:1.5; color:var(--ink-soft); max-width:40ch}
  .promise{font-size:20px; line-height:1.55; color:var(--ink-soft); margin-top:26px; max-width:46ch}
  .big{font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:46px; line-height:1.14; color:var(--ink); max-width:24ch}
  ul{list-style:none; margin-top:10px}
  li{font-size:22px; line-height:1.5; color:var(--ink-soft); padding:12px 0; border-bottom:1px solid var(--rule); display:flex; gap:16px; align-items:baseline}
  li:last-child{border-bottom:none}
  li .n{font-family:'Playfair Display',serif; font-weight:600; color:var(--accent); font-size:20px; min-width:1.4em}
  .part{font-family:'Playfair Display',serif; font-weight:500; font-size:19px; letter-spacing:.04em; color:var(--accent); text-transform:uppercase}
  .partnum{font-family:'Playfair Display',serif; font-size:96px; font-weight:700; color:var(--rule); line-height:1; margin-bottom:8px}
  .over-word{font-family:'Playfair Display',serif; font-size:52px; font-weight:700; color:var(--ink)}
  .over-quote{font-size:22px; line-height:1.5; color:var(--ink-soft); margin-top:18px; max-width:40ch; font-style:italic}
  .method{display:flex; gap:20px; margin-top:12px}
  .method .step{flex:1; background:var(--panel); padding:22px 20px}
  .method .step h3{font-family:'Playfair Display',serif; font-size:24px; color:var(--ink); margin-bottom:8px}
  .method .step p{font-size:15px; line-height:1.45; color:var(--ink-soft)}
  .cred{font-size:20px; line-height:1.6; color:var(--ink-soft); max-width:44ch}
  .cred strong{color:var(--ink); font-weight:600}
  .cta-line{font-size:24px; line-height:1.5; color:var(--ink-soft); margin-top:18px; max-width:40ch}
  .cta-book{font-family:'Playfair Display',serif; font-size:30px; color:var(--ink); font-weight:600; margin-top:24px}
  .disclaimer{font-size:12px; line-height:1.5; color:#8a847c; margin-top:34px; max-width:60ch}
  .brandline{position:absolute; left:72px; bottom:30px; font-size:12px; letter-spacing:.12em; text-transform:uppercase; color:#9b948a}
  .pagenum{position:absolute; right:72px; bottom:30px; font-size:12px; color:#9b948a; font-variant-numeric:tabular-nums}
  #nav{position:fixed; bottom:18px; left:50%; transform:translateX(-50%); display:flex; gap:14px; font-family:'Inter',sans-serif; font-size:13px; color:#cfc9bd}
  #nav button{background:transparent; border:1px solid #6b6459; color:#e9e4da; padding:6px 14px; cursor:pointer; font-size:13px}
  #nav button:hover{border-color:#cfc9bd}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav">
  <button onclick="go(-1)">&larr; Prev</button>
  <span id="count"></span>
  <button onclick="go(1)">Next &rarr;</button>
</div>
<script>
const S = [
  {t:'title'},
  {t:'who'},
  {t:'trap'},
  {t:'reframe'},
  {t:'part', num:'01', label:'The problem under the problem'},
  {t:'core'},
  {t:'part', num:'02', label:'The Overs'},
  {t:'overs'},
  {t:'over', word:'Overthinking', quote:'You keep thinking about the decision instead of making it.'},
  {t:'over', word:'Overdoing', quote:'You launch more initiatives than the team can absorb.'},
  {t:'over', word:'Overwatching', quote:'You keep checking everything the team does.'},
  {t:'over', word:'Overtalking', quote:'You take up more of the meeting than you intended.'},
  {t:'over', word:'Overcommunicating', quote:'You communicate more in Slack than the situation needs.'},
  {t:'part', num:'03', label:'Leading by subtraction'},
  {t:'subtract'},
  {t:'method'},
  {t:'first30'},
  {t:'cred'},
  {t:'recap'},
  {t:'cta', disclaimer:'This masterclass is for educational purposes only. No result is guaranteed. Results vary based on your context, your team, and the effort you put in.'}
];

function slideHTML(s){
  switch(s.t){
    case 'title': return `
      <div class="kicker">A live masterclass for new-seat engineering & SE leaders</div>
      <h1>Leading by Subtraction</h1>
      <p class="promise">Why the instinct that earned you the promotion is now slowing your team down, and the first thing to hand back this week.</p>`;
    case 'who': return `
      <div class="kicker">Who this is for</div>
      <h2>You just took the seat.</h2>
      <p class="lead">Director or VP of sales engineering, solution engineering, or engineering. Promoted from within or hired in. Technically excellent, and quietly unsure which of your old instincts still serve you.</p>`;
    case 'trap': return `
      <div class="kicker">The trap</div>
      <p class="big">You were promoted for doing more, better, faster than anyone else.</p>
      <p class="promise">So when the team feels slow, you reach for the thing that always worked: do more of it yourself.</p>`;
    case 'reframe': return `
      <div class="kicker">The reframe</div>
      <p class="big">The instinct that got you here is the one holding the team back.</p>
      <p class="promise">Leadership is not the senior version of individual contribution. Most new leaders have a doing-too-much problem, not a doing-too-little one.</p>`;
    case 'part': return `
      <div class="partnum">${s.num}</div>
      <div class="part">${s.label}</div>`;
    case 'core': return `
      <div class="kicker">The core problem</div>
      <h2>You are still solving the work.</h2>
      <p class="lead">The work of a leader is not the work of the team, done harder. It is building the conditions where the team does its best work without you in the middle of every path. The gap between those two jobs is where new leaders burn out and teams stall.</p>`;
    case 'overs': return `
      <div class="kicker">The Overs</div>
      <h2>Five ways good leaders quietly do too much.</h2>
      <ul>
        <li><span class="n">1</span>Overthinking</li>
        <li><span class="n">2</span>Overdoing</li>
        <li><span class="n">3</span>Overwatching</li>
        <li><span class="n">4</span>Overtalking</li>
        <li><span class="n">5</span>Overcommunicating</li>
      </ul>`;
    case 'over': return `
      <div class="kicker">The Overs</div>
      <div class="over-word">${s.word}</div>
      <p class="over-quote">&ldquo;${s.quote}&rdquo;</p>`;
    case 'subtract': return `
      <div class="kicker">Leadership by subtraction</div>
      <h2>Lead by deciding what to remove.</h2>
      <p class="lead">For each Over, the move is the same three questions: what can you <strong>stop</strong>, what can you <strong>shorten</strong>, what can you <strong>hand back</strong>, while staying fully accountable for the outcome. Subtraction is not stepping away. It is making room for the team to step up.</p>`;
    case 'method': return `
      <div class="kicker">How to pick the first thing to subtract</div>
      <h2>Name it. Frame it. Invite it.</h2>
      <div class="method">
        <div class="step"><h3>Name it</h3><p>Name the behavior and what you are trying to achieve or protect by doing it.</p></div>
        <div class="step"><h3>Frame it</h3><p>Examine what the situation actually needs, your assumptions, and your real role in it.</p></div>
        <div class="step"><h3>Invite it</h3><p>Choose one practical next move, and invite the team into the space you just made.</p></div>
      </div>`;
    case 'first30': return `
      <div class="kicker">What the first 30 days looks like</div>
      <h2>One Over at a time.</h2>
      <p class="lead">Pick the single Over costing you the most. Run it through Name it, Frame it, Invite it. Hand one thing back this week and watch what the team does with the room. Then the next. You are not changing who you are. You are subtracting what the seat no longer needs from you.</p>`;
    case 'cred': return `
      <div class="kicker">Why this, from me</div>
      <p class="cred">I spent <strong>23 years in technology</strong>, 15 of them at Salesforce, going from solution engineer to senior director leading 30-plus people. I <strong>micromanaged, hired the wrong person, and held onto work I should have handed back</strong>. Leading by subtraction is the thing I wish someone had coached me through in my first year in the seat. I am an ICF Professional Certified Coach, and this is the work I do with tech leaders now.</p>`;
    case 'recap': return `
      <div class="kicker">The whole idea in one line</div>
      <p class="big">Find your Over. Subtract it. Give the team the room.</p>`;
    case 'cta': return `
      <div class="kicker">Your next step with your team</div>
      <h2>Bring the Leadership Mirror to your team.</h2>
      <p class="cta-line">If your strategy is clear to you but your team is guessing, the next step is a conversation.</p>
      <div class="cta-book">Book your intro call at coachfulcoaching.com</div>
      <p class="disclaimer">${s.disclaimer}</p>`;
  }
  return '';
}

const stage = document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>`<section class="slide" data-i="${i}">${slideHTML(s)}<div class="brandline">Coachful Coaching</div><div class="pagenum">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div></section>`).join('');
let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const count=document.getElementById('count');
function show(i){slides[cur].classList.remove('on'); cur=Math.max(0,Math.min(S.length-1,i)); slides[cur].classList.add('on'); count.textContent=`${cur+1} / ${S.length}`;}
function go(d){show(cur+d);}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1);});
stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect(); (e.clientX-r.left > r.width/2)?go(1):go(-1);});
show(0);
</script>
</body>
</html>
