<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Single Audit, Decoded, with Lucy Morgan, CPA</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Source+Serif+4:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f8fa; --panel:#eef1f5; --ink:#1a3854; --body:#323335;
    --accent:#960f1b; --blue:#1171b9; --rule:#d7deE6;
    --head:'Archivo',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--serif)}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:#fff;border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(26,56,84,.05)}
  .slide.dark{background:var(--ink);border-color:var(--ink)}
  .slide.dark *{color:#fff}
  .kick{font-family:var(--head);font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .slide.dark .kick{color:#f2b8bd}
  h1{font-family:var(--head);font-weight:800;color:var(--ink);font-size:46px;line-height:1.06;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;color:var(--ink);font-size:32px;line-height:1.12;
    margin-bottom:16px}
  p{font-size:20px;line-height:1.5;color:var(--body);max-width:62ch;margin-bottom:14px}
  .big{font-size:27px;line-height:1.38;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 34px;position:relative;
    border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;
    border:2px solid var(--accent);border-radius:3px}
  .num{font-family:var(--head);font-weight:800;color:var(--blue);font-size:15px;
    letter-spacing:.12em;text-transform:uppercase;margin-bottom:10px}
  .stamp{display:inline-block;font-family:var(--head);font-weight:700;font-size:13px;
    letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    border:2px solid var(--accent);border-radius:6px;padding:7px 12px;margin-top:8px}
  .foot{font-family:var(--head);font-size:12px;letter-spacing:.1em;text-transform:uppercase;
    color:#8893a0;margin-top:26px}
  .disc{font-size:15px;color:#6b7580;line-height:1.5;margin-top:22px;max-width:64ch}
  .pres{font-size:18px;color:var(--ink);font-weight:600;margin-top:6px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Lucy Morgan, CPA',
    h:'The Single Audit, Decoded',
    p:'How to run a federal award so audit day is a non-event, built on 2 CFR Part 200.',
    pres:'Lucy Morgan, CPA, MBA, MyFedTrainer.com'},

  {t:'who', kick:'Who this is for',
    h:'You manage the money after the grant is won',
    items:['Grant managers and compliance officers at nonprofits',
      'Finance and grant accounting teams at higher education',
      'State, local, and tribal government award recipients',
      'Anyone who will sit across the table from an auditor']},

  {t:'trap', kick:'The trap',
    h:'Winning the grant was the easy part',
    p:'The day the award lands, it becomes yours to defend. Nobody hands you a system for that. You inherit a federal award, a folder of rules, and a clock running toward a single audit.'},

  {t:'hook', dark:true, kick:'The reframe',
    h:'You do not lose federal funding by failing to win it',
    p:'You lose it at audit. A single questioned cost can turn into repaid dollars, a corrective action plan, and a finding that follows your organization into the next award cycle.'},

  {t:'part', num:'Part One', h:'Why single audits produce findings'},

  {t:'body', kick:'The real problem',
    h:'2 CFR 200 was never written to be readable',
    p:'The Uniform Guidance runs hundreds of sections across cost principles, procurement, and audit requirements. Most teams meet it one finding at a time, after the auditor has already written it up.',
    items:['Procurement rules nobody mapped to your actual purchasing',
      'Time and effort documentation that does not match the draw-downs',
      'Internal controls that live in one head and nowhere else',
      'Records retired before the retention window closed']},

  {t:'body', kick:'What a finding costs',
    h:'A finding is rarely just a note',
    p:'Questioned costs can become repaid costs. Repeat findings can escalate your risk designation, trigger more frequent monitoring, and put future funding on a shorter leash. The expensive part is almost never the dollar amount.'},

  {t:'part', num:'Part Two', h:'The 2 CFR 200 operating system'},

  {t:'body', kick:'The method',
    h:'Four pillars, in the order an auditor reads them',
    p:'Audit-readiness is not a binder you build the week before. It is four systems that run all year, each mapped to the part of 2 CFR 200 it answers.'},

  {t:'pillar', num:'Pillar One', h:'Financial Management Foundations',
    p:'The core financial management standards of Part 200: allowable costs, the right account structure, and draw-downs that tie cleanly back to the budget. Get this right and most other findings never start.'},

  {t:'pillar', num:'Pillar Two', h:'Procurement Standards and Compliance',
    p:'The Part 200 procurement rules, the single most-cited area in single audits. Methods, thresholds, documentation, and conflict-of-interest handling, mapped to how your organization actually buys.'},

  {t:'pillar', num:'Pillar Three', h:'Monitoring and Internal Controls',
    p:'The controls that let you catch a problem before an auditor does: segregation of duties, subrecipient monitoring, and a review rhythm that does not depend on any one person staying.'},

  {t:'pillar', num:'Pillar Four', h:'Closeout and Record Retention',
    p:'Finishing the award clean: final reports reconciled, records held for the full retention window, and a closeout file that answers the questions before they are asked.'},

  {t:'body', kick:'How it fits together',
    h:'The four pillars make audit day boring',
    p:'When each pillar runs all year, the single audit stops being an event you brace for. The auditor asks, you open the file, and the answer is already there. Boring is the goal.'},

  {t:'part', num:'Part Three', h:'What audit-ready actually looks like'},

  {t:'body', kick:'The calm audit',
    h:'A clean trail, not a scramble',
    p:'Audit-ready teams do not work harder in audit season. They built the documentation trail as the work happened, so the audit is a retrieval exercise, not an investigation.',
    items:['Every cost traces to an allowable line and an approval',
      'Procurement decisions carry their own paper trail',
      'Monitoring is logged, not remembered',
      'Closeout files are complete the day the award ends']},

  {t:'cred', kick:'Why learn this from me',
    h:'I read 2 CFR 200 so you do not have to',
    items:['CPA and MBA, former nonprofit controller responsible for federal grants',
      'Author of Decoding Grant Management: The Ultimate Success Guide to 2 CFR Part 200',
      'Host of the Grant Talks Podcast and 250+ articles on grant management',
      'Our team has collectively managed $2.5 billion in federal grants']},

  {t:'recap', kick:'The whole method',
    h:'Three parts, one outcome',
    items:['Part One: why single audits produce findings',
      'Part Two: the four-pillar 2 CFR 200 operating system',
      'Part Three: what an audit-ready, finding-free award looks like']},

  {t:'cta', kick:'Your next step',
    h:'Make your next single audit a non-event',
    p:'If you want the full system, the Single Audit Success Academy walks your team through all four pillars with 12 months of access and a year of e-mentoring. Prefer to train the whole team at once? Bring this training in-house.',
    disc:'This masterclass is educational. Results vary by organization and are not guaranteed; nothing here is legal, audit, or accounting advice for your specific award.',
    foot:'MyFedTrainer.com'}
];

const deck = document.getElementById('deck');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function list(items){return '<ul>'+items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.dark?' dark':'');
  let h='';
  if(s.kick) h+='<div class="kick">'+esc(s.kick)+'</div>';
  if(s.num) h+='<div class="num">'+esc(s.num)+'</div>';
  if(s.h) h+=(s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>');
  if(s.pres) h+='<div class="pres">'+esc(s.pres)+'</div>';
  if(s.p) h+='<p'+(s.t==='title'||s.t==='hook'||s.t==='trap'?' class="big"':'')+'>'+esc(s.p)+'</p>';
  if(s.items) h+=list(s.items);
  if(s.t==='cta') h+='<span class="stamp">Audit-ready</span>';
  if(s.disc) h+='<div class="disc">'+esc(s.disc)+'</div>';
  if(s.foot) h+='<div class="foot">'+esc(s.foot)+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
