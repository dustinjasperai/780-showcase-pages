<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Editor's Yes, a masterclass with Chad R. Allen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef3fb;        /* near-white, his light scheme (brand.json) */
    --panel:#ffffff;
    --ink:#16202e;       /* deep editorial ink */
    --muted:#5a6473;
    --rule:#dfe4ea;
    --accent:#2d91fb;    /* his measured brand blue, brand.json rgb(45,145,251) */
    --serif:'Lora',Georgia,serif;
    --sans:'Plus Jakarta Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 3px rgba(22,32,46,.05)}
  .slide.title{background:var(--ink);color:#fff;border-color:var(--ink)}
  .slide.part{background:var(--accent);color:#fff;border-color:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;
    color:var(--accent);margin-bottom:18px}
  .slide.title .eyebrow,.slide.part .eyebrow{color:rgba(255,255,255,.8)}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.14;margin-bottom:18px}
  h3{font-family:var(--serif);font-weight:600;font-size:26px;margin-bottom:10px}
  p.lead{font-size:21px;color:var(--muted);margin-top:16px;max-width:46ch}
  .slide.title p.lead,.slide.part p.lead{color:rgba(255,255,255,.88)}
  p.body{font-size:19px;margin-top:14px;max-width:52ch;color:var(--ink)}
  .slide.title .sig{margin-top:40px;font-size:17px;color:rgba(255,255,255,.75);font-weight:500}
  ul{list-style:none;margin-top:22px;display:grid;gap:16px}
  li{position:relative;padding-left:30px;font-size:19px;max-width:54ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:28px}
  .three .box{background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:24px}
  .three .box .k{font-family:var(--serif);font-weight:700;font-size:22px;color:var(--accent)}
  .three .box p{font-size:15px;color:var(--muted);margin-top:8px}
  .num{font-family:var(--serif);font-size:15px;color:var(--accent);font-weight:700;margin-bottom:8px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
  .cta-step{display:inline-block;margin-top:22px;font-weight:600;font-size:19px;color:var(--accent)}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:360px}h1{font-size:34px}h2{font-size:28px}.three{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass', h1:"The Editor's Yes",
    lead:"How to write a book proposal a publisher can't refuse.",
    sig:"with Chad R. Allen, former editorial director and acquisitions editor" },

  {t:'promise', eyebrow:'What you walk away with',
    h2:"By the end of this hour, you will read your own book the way the person who says yes reads it.",
    body:"Not more writing advice. A clear picture of the one document publishers actually buy from, and how to build yours." },

  {t:'who', eyebrow:'Who this is for',
    h2:"For the writer with a real book in them.",
    list:["Aspiring authors sitting on an idea they believe in",
          "Subject matter experts who want a book to grow their authority",
          "Published authors who want the next deal, not just the next draft"] },

  {t:'trap', eyebrow:'The trap',
    h2:"You pour a year into the manuscript. Then the rejections come, and nobody tells you why.",
    body:"Most writers spend their energy perfecting the chapters and treat the proposal as paperwork. Then they wonder why the door never opens." },

  {t:'hook', eyebrow:'The reframe', part:true,
    h2:"Publishers don't reject books. They reject proposals.",
    body:"The proposal is the decision document. The good news is that a decision document is learnable in a way that talent is not." },

  {t:'part', eyebrow:'Part one', part:true, h2:"Why your proposal is read before your book." },

  {t:'content', eyebrow:'The core problem',
    h2:"You are writing for the wrong reader first.",
    body:"Before a single real reader meets your book, one person decides its fate. That person reads for three things, and most proposals answer only one of them." },

  {t:'content', eyebrow:'From the buy side',
    h2:"I spent two decades as the person who said yes or no.",
    body:"As an editorial director I acquired and developed national bestsellers. I know what lands on an editor's desk, what gets passed up the chain, and what quietly gets set aside. That view is what I teach." },

  {t:'part', eyebrow:'Part two', part:true, h2:"The method: Concept, Platform, Writing." },

  {t:'method', eyebrow:'The three lenses',
    h2:"The exact three things an editor reads a proposal for.",
    three:[
      {k:'Concept', p:'A marketable idea that meets a real felt need. The title, the subtitle, the hook that makes someone need this book.'},
      {k:'Platform', p:'Not vanity follower counts. Your real connections and ability to bring exposure, built on a genuine author reader connection.'},
      {k:'Writing', p:'The sample pages that earn trust. Craft that proves you can carry the idea you just sold.'} ] },

  {t:'content', eyebrow:'Lens one, Concept',
    h2:"A concept meets a felt need the reader already has.",
    body:"We start with the reader's felt need, then shape the title and subtitle until the idea is impossible to misunderstand and hard to put down. A strong concept does most of the selling for you." },

  {t:'content', eyebrow:'Lens two, Platform',
    h2:"Platform is connection, not a follower count.",
    body:"I define platform as your connections and your ability to bring exposure to your own book. A strong author reader connection is the foundation for lasting impact, and it is something you can build on purpose." },

  {t:'content', eyebrow:'Lens three, Writing',
    h2:"The sample proves you can deliver the promise.",
    body:"Your writing sample is where the concept stops being a pitch and becomes a book. We make those pages the strongest thing in the room." },

  {t:'arch', eyebrow:'The full proposal',
    h2:"The pieces that turn a good idea into a publisher ready document.",
    list:["A brief description that captures the book's vision",
          "A table of contents and chapter by chapter synopsis",
          "An author bio that establishes credibility",
          "A marketing section built on real platform",
          "A writing sample that earns the page",
          "A clear path for pitching agents and publishers"] },

  {t:'part', eyebrow:'Part three', part:true, h2:"What a yes looks like." },

  {t:'content', eyebrow:'The shift',
    h2:"The difference is not talent. It is knowing what you are being read for.",
    body:"The writer who guesses sends their book into silence. The writer who understands Concept, Platform and Writing walks in already answering the three questions the editor was going to ask." },

  {t:'why', eyebrow:'Why learn this from me',
    h2:"Twenty years inside publishing, now on your side of the desk.",
    body:"Former editorial director and acquisitions editor. Author of Do Your Art, a manifesto on rejecting apathy to bring your best work to the world. I have coached hundreds of writers from idea to contract." },

  {t:'recap', eyebrow:'In one line',
    h2:"Concept, Platform, Writing. Build those three and you build a proposal that is hard to refuse.",
    body:"That is the whole method, and it is learnable." },

  {t:'cta', eyebrow:'Your next step',
    h2:"Ready to build the proposal that gets a yes?",
    body:"If you want to go further, this is where we work together directly, from first idea to a publisher ready proposal.",
    step:"Work with Chad: one on one coaching and Book Proposal Academy",
    disclaimer:"This masterclass is educational. Publishing outcomes depend on many factors including your idea, your market and your effort. No specific result, deal or income is promised or guaranteed. Results vary." }
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title':'') + (s.part?' part':'');
  let h = '';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.lead) h += '<p class="lead">'+s.lead+'</p>';
  if(s.body) h += '<p class="body">'+s.body+'</p>';
  if(s.list){ h += '<ul>'; for(const i of s.list) h += '<li>'+i+'</li>'; h += '</ul>'; }
  if(s.three){ h += '<div class="three">'; for(const b of s.three) h += '<div class="box"><div class="k">'+b.k+'</div><p>'+b.p+'</p></div>'; h += '</div>'; }
  if(s.step) h += '<div class="cta-step">'+s.step+'</div>';
  if(s.sig) h += '<div class="sig">'+s.sig+'</div>';
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
