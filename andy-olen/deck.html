<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Trilogy of Yes, a masterclass with Andy Olen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Assistant:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eceff5;      /* his light ground, tinted toward his brand navy/grey */
    --panel:#fdfdff;   /* faint cool white, navy cast */
    --rule:#dce1ea;    /* his light grey, navy cast */
    --accent:#000b40;  /* his dominant brand navy */
    --ink:#161e2a;     /* his heading navy */
    --body:#3a4150;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Assistant',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:64px 60px;margin:0 0 28px;min-height:460px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(22,30,42,.04)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:'Crimson Text',Georgia,serif;font-weight:600;font-size:54px;line-height:1.08;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:'Crimson Text',Georgia,serif;font-weight:600;font-size:40px;line-height:1.12;color:var(--ink)}
  .lede{font-size:21px;line-height:1.55;color:var(--body);margin-top:22px;max-width:40em}
  p.body{font-size:19px;line-height:1.6;color:var(--body);margin-top:16px;max-width:40em}
  .kicker{font-family:'Crimson Text',Georgia,serif;font-style:italic;font-size:26px;color:var(--accent);margin-top:8px}
  .partnum{font-family:'Crimson Text',Georgia,serif;font-size:120px;line-height:1;color:var(--rule);font-weight:600}
  .rowlist{margin-top:28px;display:flex;flex-direction:column;gap:14px}
  .rowlist .item{display:flex;gap:16px;align-items:baseline;font-size:20px;color:var(--body)}
  .rowlist .item b{color:var(--ink);font-weight:700}
  .dot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;background:var(--accent);transform:translateY(-3px)}
  .three{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:34px}
  .three .c{border-top:3px solid var(--accent);padding-top:16px}
  .three .c h3{font-family:'Crimson Text',Georgia,serif;font-size:24px;color:var(--ink);margin-bottom:8px}
  .three .c p{font-size:16px;line-height:1.5;color:var(--muted)}
  .quote{font-family:'Crimson Text',Georgia,serif;font-size:34px;line-height:1.3;color:var(--ink)}
  .thread{margin-top:28px;max-width:30em;display:flex;flex-direction:column;gap:12px}
  .bub{padding:13px 18px;border-radius:16px;font-size:18px;line-height:1.4;max-width:80%}
  .bub.them{background:#eef0f4;color:var(--ink);align-self:flex-start;border-bottom-left-radius:4px}
  .bub.you{background:var(--accent);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
  .cred{margin-top:26px;display:grid;grid-template-columns:1fr 1fr;gap:14px 36px;max-width:40em}
  .cred .c{font-size:18px;color:var(--body)}
  .cred .c b{display:block;font-family:'Crimson Text',Georgia,serif;font-size:30px;color:var(--accent)}
  .cta h1{font-size:48px}
  .btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;font-weight:700;font-size:19px;padding:16px 34px;border-radius:999px;letter-spacing:.01em}
  .disclaimer{margin-top:30px;font-size:13px;line-height:1.5;color:var(--muted);max-width:44em;border-top:1px solid var(--rule);padding-top:16px}
  .brandline{font-size:15px;color:var(--muted);margin-top:30px;letter-spacing:.04em}
  @media(max-width:680px){.slide{padding:40px 26px}h1{font-size:38px}h2{font-size:30px}.three{grid-template-columns:1fr}.cred{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A live masterclass with Andy Olen',
    h:'The Trilogy of Yes',
    kicker:'How to make customers say yes, without discounting your way there.' },

  {t:'trap',
    eyebrow:'Who this is for',
    h:'You sell for a living. And the hardest moment is the same every time.',
    body:'The customer asks you to come down on price. In that second, most salespeople believe they have exactly two answers: say yes and give away margin, or say no and watch the deal walk. One quietly bleeds your value. The other loses the sale.' },

  {t:'hook',
    eyebrow:'The real problem',
    quote:'Almost every deal you have ever lost started as a customer’s anxiety you could not turn into trust fast enough.' },

  {t:'part', num:'01', h:'The Dark Side of Negotiations',
    body:'Fear and anxiety are what actually move a negotiation, and they move it in the wrong direction. The fear of losing the deal pushes you to give away price before the customer has even pushed. That reflex has a name, and naming it is the first step to beating it.' },

  {t:'rows',
    eyebrow:'What the Dark Side costs you',
    h:'It is not the discount. It is the pattern.',
    items:[
      ['Price first','You lead with a concession to feel safe, and teach the customer to always ask for more.'],
      ['Trust last','You pitch before the customer trusts you, so every objection lands harder.'],
      ['One-sided wins','You either win at their expense or lose at yours, and neither builds a relationship.']
    ] },

  {t:'part', num:'02', h:'The Trilogy of Yes',
    body:'Three skills, in order, turn a cold and anxious customer into a confident yes. They are not closing tricks. They are the way trust actually gets built inside a sale.' },

  {t:'three',
    eyebrow:'The framework',
    h:'Connection. Communication. Cooperation.',
    cards:[
      ['Connection','Earn trust before you ever pitch. The customer has to believe you are on their side first.'],
      ['Communication','Move the sales agenda forward with clear, pressure-free dialogue the customer welcomes.'],
      ['Cooperation','Work toward a shared outcome, so the win is something you build together.']
    ] },

  {t:'rows',
    eyebrow:'Skill one',
    h:'Connection: trust comes before the pitch',
    items:[
      ['Lead with their world','Open on the customer’s problem, not your product.'],
      ['Lower the anxiety','Name the tension in the room instead of pretending it is not there.'],
      ['Earn the right','Only then do you get permission to sell.']
    ] },

  {t:'rows',
    eyebrow:'Skill two',
    h:'Communication: move the deal without pressure',
    items:[
      ['Ask, do not tell','Questions move the agenda; monologues stall it.'],
      ['Make it easy to say more','Clarity keeps the customer talking and the deal alive.'],
      ['Carry the momentum','Each exchange should leave the customer leaning in, not backing away.']
    ] },

  {t:'rows',
    eyebrow:'Skill three',
    h:'Cooperation: win together, not at their expense',
    items:[
      ['Shared outcome','Frame the deal as something you solve side by side.'],
      ['Protect the relationship','A win that costs you the relationship is a loss with a delay.'],
      ['Set up the trade','Cooperation is what makes the next move, Yes, If, possible.']
    ] },

  {t:'part', num:'03', h:'The "Yes, If" Move',
    body:'This is the third answer to "can you come down on price," the one most salespeople never learn. You do not say yes. You do not say no. You say Yes, If, and you trade value for value.' },

  {t:'hook',
    eyebrow:'The move',
    quote:'"Yes, I can do that for you, if you can do this for me." You keep the relationship, and you keep your price.' },

  {t:'thread',
    eyebrow:'What it sounds like',
    h:'Yes, If in a real exchange',
    msgs:[
      ['them','Can you come down on the price?'],
      ['you','Yes, if we lock in a two-year agreement.'],
      ['them','Let’s talk about that.']
    ] },

  {t:'rows',
    eyebrow:'How to run it',
    h:'Trade value for value',
    items:[
      ['Prepare your ifs','Know in advance what you can trade and what you want in return.'],
      ['Never concede for free','Every give is attached to a get. That is the whole discipline.'],
      ['Stay cooperative','The tone is partnership, not combat. You are building the deal, not winning a fight.']
    ] },

  {t:'hook',
    eyebrow:'The outcome',
    quote:'Triple Win Outcomes: a win for you, a win for your business, and a win for your customer. That is what a cooperative negotiation is built to produce.' },

  {t:'rows',
    eyebrow:'What changes',
    h:'The same rep, three months in',
    items:[
      ['Before','Discounts early, dreads the price conversation, wins deals but loses margin.'],
      ['After','Walks in with trades ready, welcomes the price conversation, and protects both the deal and the relationship.'],
      ['The difference','Not a new personality. A method, run on purpose.']
    ] },

  {t:'cred',
    eyebrow:'Why learn this from Andy',
    h:'Built on real deals, at real scale.',
    stats:[
      ['$4.5B+','In global sales and marketing led across his teams'],
      ['17 years','Senior sales leadership in medical technology'],
      ['Siemens, Roper, Abbott','SVP and Global VP roles at Fortune 500 companies'],
      ['Author + TEDx','"The Trilogy of Yes" and the TEDx stage']
    ] },

  {t:'recap',
    eyebrow:'The method, in one line',
    h:'Connect, communicate, cooperate, then trade with Yes, If.',
    body:'Turn the customer’s anxiety into trust, keep the deal moving without pressure, and answer the price question with a trade instead of a discount. That is how customers say yes, and how you keep what the deal is worth.' },

  {t:'cta',
    eyebrow:'Work with Andy',
    h:'Put the "Yes, If" move on your own deals.',
    body:'In the Three Session Accelerator we take your real, live opportunities and install the Trilogy of Yes and the Yes, If move on them, call by call, until it is second nature.',
    cta:'Start the Three Session Accelerator',
    disclaimer:'Educational content only. This masterclass teaches sales and negotiation skills; it is not a guarantee of any specific sales result, revenue, or income. Outcomes vary by person, market, and effort.' }
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function slide(inner){return '<section class="slide">'+inner+'</section>';}
function eb(s){return s?'<div class="eyebrow">'+esc(s)+'</div>':'';}
const R = {
  title:s=>slide(eb(s.eyebrow)+'<h1>'+esc(s.h)+'</h1><div class="kicker">'+esc(s.kicker)+'</div>'),
  trap:s=>slide(eb(s.eyebrow)+'<h2>'+esc(s.h)+'</h2><p class="body">'+esc(s.body)+'</p>'),
  hook:s=>slide(eb(s.eyebrow)+'<div class="quote">'+esc(s.quote)+'</div>'),
  part:s=>slide('<div class="partnum">'+esc(s.num)+'</div><h2>'+esc(s.h)+'</h2><p class="body">'+esc(s.body)+'</p>'),
  rows:s=>slide(eb(s.eyebrow)+'<h2>'+esc(s.h)+'</h2><div class="rowlist">'+s.items.map(i=>'<div class="item"><span class="dot"></span><div><b>'+esc(i[0])+'.</b> '+esc(i[1])+'</div></div>').join('')+'</div>'),
  three:s=>slide(eb(s.eyebrow)+'<h2>'+esc(s.h)+'</h2><div class="three">'+s.cards.map(c=>'<div class="c"><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>').join('')+'</div>'),
  thread:s=>slide(eb(s.eyebrow)+'<h2>'+esc(s.h)+'</h2><div class="thread">'+s.msgs.map(m=>'<div class="bub '+(m[0]==='you'?'you':'them')+'">'+esc(m[1])+'</div>').join('')+'</div>'),
  cred:s=>slide(eb(s.eyebrow)+'<h2>'+esc(s.h)+'</h2><div class="cred">'+s.stats.map(c=>'<div class="c"><b>'+esc(c[0])+'</b>'+esc(c[1])+'</div>').join('')+'</div>'),
  recap:s=>slide(eb(s.eyebrow)+'<h2>'+esc(s.h)+'</h2><p class="body">'+esc(s.body)+'</p>'),
  cta:s=>slide('<div class="cta">'+eb(s.eyebrow)+'<h1>'+esc(s.h)+'</h1><p class="body">'+esc(s.body)+'</p><span class="btn">'+esc(s.cta)+'</span><div class="brandline">Andy Olen &middot; The Trilogy of Yes</div><div class="disclaimer">'+esc(s.disclaimer)+'</div></div>')
};
document.getElementById('deck').innerHTML = S.map(s=>R[s.t](s)).join('');
</script>
</body>
</html>
