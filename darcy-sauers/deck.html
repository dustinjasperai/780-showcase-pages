<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Get Found: The Doula Visibility Masterclass — The Doula Darcy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#002d52;        /* her dominant brand ground (brand.json) */
    --navy-panel:#083a63;  /* lighter navy, derived */
    --navy-deep:#001d38;   /* darker navy, derived */
    --magenta:#eb0a6f;     /* her signature accent (brand.json) */
    --mint:#eef7ef;        /* her soft secondary */
    --ink:#eaf1f7;
    --muted:#a9c1d6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--navy-deep);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1100px;margin:0 auto}
  .slide{min-height:100vh;padding:8vh 7vw;display:flex;flex-direction:column;justify-content:center;
    background:var(--navy);border-bottom:1px solid rgba(255,255,255,.06);position:relative;overflow:hidden}
  .slide:nth-child(even){background:var(--navy-panel)}
  .kicker{font-family:'Open Sans';font-weight:600;letter-spacing:.18em;text-transform:uppercase;
    font-size:.72rem;color:var(--magenta);margin-bottom:1.1rem}
  h1{font-family:'Playfair Display';font-weight:800;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'Playfair Display';font-weight:700;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08}
  p{font-size:clamp(1.05rem,1.7vw,1.35rem);line-height:1.6;color:var(--ink);max-width:44ch;margin-top:1.2rem}
  p.lead{color:var(--muted)}
  ul{margin:1.4rem 0 0 0;list-style:none;max-width:48ch}
  li{font-size:clamp(1.02rem,1.6vw,1.28rem);line-height:1.5;padding:.55rem 0 .55rem 1.6rem;position:relative;color:var(--ink)}
  li:before{content:"";position:absolute;left:0;top:1.15rem;width:.6rem;height:.6rem;background:var(--magenta);border-radius:2px}
  .big{font-family:'Playfair Display';font-weight:800;font-size:clamp(2.1rem,5.2vw,3.6rem);line-height:1.06;max-width:20ch}
  .em{color:var(--magenta)}
  .presenter{margin-top:2.4rem;color:var(--muted);font-size:1rem;letter-spacing:.02em}
  .searchbar{margin-top:2rem;max-width:520px;border:2px solid var(--magenta);border-radius:40px;
    padding:.9rem 1.4rem;color:var(--muted);font-size:1.05rem;background:rgba(255,255,255,.03)}
  .num{font-family:'Playfair Display';font-weight:800;color:var(--magenta);font-size:1.4rem;margin-right:.4rem}
  .disclaimer{margin-top:2.2rem;color:var(--muted);font-size:.82rem;line-height:1.5;max-width:60ch}
  .cta-btn{display:inline-block;margin-top:1.8rem;background:var(--magenta);color:#fff;font-weight:600;
    padding:.9rem 1.8rem;border-radius:40px;text-decoration:none;font-size:1.05rem}
  .foot{position:absolute;bottom:2.2rem;left:7vw;color:var(--muted);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase}
  .slidewrap{counter-reset:s}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'cover',
   kicker:'A live masterclass for working doulas',
   h:'Get Found.',
   p:'How an established doula becomes the one families find, and book, at the exact moment they start searching.',
   presenter:'With Darcy Sauers, The Doula Darcy. Postpartum doula and lactation counselor since 2010, with a decade in advertising and marketing.'},

  {t:'section', kicker:'Who this is for', h:'You are great with families. The quiet part is the business.',
   p:'This is for the doula who is already doing the work, already certified, and secretly wondering how long they can keep going like this.'},

  {t:'content', kicker:'The trap', h:'The month you need clients is the month referrals go quiet.',
   list:['Your income only flows during client contact hours.','Word of mouth is real, but it is not a plan you control.','So the calendar swings between fully booked and empty. Feast, then famine.']},

  {t:'big', kicker:'The reframe', big:'Referrals are not a marketing plan. They are what happens when marketing works.'},

  {t:'section', kicker:'Part one', h:'Families do not ask around anymore. They search.'},

  {t:'content', kicker:'The visibility problem', h:'If you are not found, you do not exist to them.',
   p:'When an expectant family decides they want a doula, the first move is a search. The doula they find is the doula they call. Being the best in town does nothing if the family twenty minutes away never sees you.',
   search:'postpartum doula near me'},

  {t:'section', kicker:'Part two, the framework', h:'Visibility-Driven Marketing.'},

  {t:'content', kicker:'Get found on Google', h:'Doula marketing comes down to getting found on Google.',
   list:['Be visible at the exact moment someone is looking for a doula.','Local discoverability so nearby families surface you first.','Content that answers the question they are already typing.']},

  {t:'section', kicker:'Part two, continued', h:'The Hybrid Doula Business Model.'},

  {t:'big', kicker:'The core idea', big:'Hands-on work is your heart. Hands-free income is your safety net.'},

  {t:'content', kicker:'Five hands-free income streams', h:'Ways to get paid when you are not at a birth.',
   list:['Online childbirth and postpartum classes.','Digital resources, ebooks, and courses.','Group programs and workshops.','Independent contractor partnerships.','Affiliate partnerships.']},

  {t:'content', kicker:'What it fixes', h:'Same hours. No empty weeks.',
   p:'Consistent visibility keeps new families coming in, and hands-free income fills the gaps between births. The swing flattens out. That is how a doula career lasts without burning out.'},

  {t:'section', kicker:'Part three', h:'A booked, steady practice, on purpose.'},

  {t:'content', kicker:'From solo practice to agency', h:'You do not need more hours. You may need a second doula.',
   list:['Onboarding sub-doulas so you are not the only one who can serve.','Pricing and fair compensation that keep the business profitable.','Reputation management and values-aligned leadership as you grow.']},

  {t:'content', kicker:'Why listen to me', h:'A marketer who became a doula.',
   p:'I built a thriving postpartum practice, now a doula agency, in a small New Hampshire town. I have fifteen years as a postpartum doula and a decade in advertising and marketing behind every strategy I teach. That combination is rare in this field, and it is the whole reason I can teach getting found.'},

  {t:'content', kicker:'The takeaway', h:'Two skills carry a doula business.',
   list:['Get found, so new families reach you on purpose, not by luck.','Get paid between births, so the quiet weeks stop deciding your income.']},

  {t:'cta', kicker:'Ready to get found?', h:'Let us build this into your business.',
   p:'If this is the direction you want to grow, work with me directly. We map your visibility, set up the hybrid model, and where it fits, turn your solo practice into an agency.',
   btn:'Work with The Doula Darcy',
   disclaimer:'This masterclass is educational. It shares strategies and frameworks only. No income or result is guaranteed. Results vary based on your market, your effort, and many factors outside any teacher control. Every doula business is different.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if(s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if(s.t==='cover'){
    inner += `<h1>${s.h}</h1>`;
    if(s.p) inner += `<p>${s.p}</p>`;
    if(s.presenter) inner += `<div class="presenter">${s.presenter}</div>`;
  } else if(s.t==='big'){
    inner += `<div class="big">${s.big}</div>`;
  } else if(s.t==='cta'){
    inner += `<h2>${s.h}</h2>`;
    if(s.p) inner += `<p>${s.p}</p>`;
    if(s.btn) inner += `<a class="cta-btn" href="https://douladarcy.com/work-with-me">${s.btn}</a>`;
    if(s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  } else {
    inner += `<h2>${s.h}</h2>`;
    if(s.p) inner += `<p>${s.p}</p>`;
    if(s.search) inner += `<div class="searchbar">&#128269;&nbsp;&nbsp;${s.search}</div>`;
    if(s.list){ inner += '<ul>'; s.list.forEach(x=> inner += `<li>${x}</li>`); inner += '</ul>'; }
  }
  inner += `<div class="foot">The Doula Darcy &middot; Get Found Masterclass</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
