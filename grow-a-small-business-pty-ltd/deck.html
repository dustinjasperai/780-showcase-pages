<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Know Your Numbers First — a live masterclass with Troy Trewin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0f2038;
  --panel:#16263f;
  --accent:#1ba0ff;
  --hot:#ff4851;
  --ink:#eef4fb;
  --muted:#8fa4bd;
  --head:'Poppins',system-ui,sans-serif;
  --body:'Montserrat',system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#081426;color:var(--ink);font-family:var(--body);line-height:1.5}
.deck{max-width:960px;margin:0 auto;padding:28px 16px}
.slide{
  background:var(--bg);
  border:1px solid rgba(27,160,255,.18);
  border-radius:14px;
  padding:52px 54px;
  margin:0 0 20px;
  min-height:420px;
  display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
}
.slide::before{content:"";position:absolute;left:0;top:0;height:5px;width:100%;
  background:linear-gradient(90deg,var(--accent),rgba(27,160,255,0));}
.kicker{font-family:var(--head);font-weight:600;letter-spacing:.12em;text-transform:uppercase;
  font-size:13px;color:var(--accent);margin-bottom:18px}
h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:20px;margin-top:18px;max-width:40ch}
p.body{font-size:19px;margin-top:16px;max-width:52ch;color:#dbe6f3}
.big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.14;max-width:22ch}
.big .a{color:var(--accent)}
.presenter{margin-top:30px;color:var(--muted);font-size:16px}
ul{margin:22px 0 0 0;padding:0;list-style:none}
li{position:relative;padding:12px 0 12px 30px;font-size:19px;border-bottom:1px solid rgba(143,164,189,.14);max-width:54ch}
li:last-child{border-bottom:0}
li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:3px;background:var(--accent)}
.n{font-family:var(--head);font-weight:700;font-size:18px;color:var(--bg);background:var(--accent);
  width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.part{font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--hot)}
.disc{margin-top:26px;color:var(--muted);font-size:14px;max-width:60ch}
.cta-step{font-family:var(--head);font-weight:600;font-size:22px;color:var(--accent);margin-top:20px}
.foot{position:absolute;right:26px;bottom:18px;color:rgba(143,164,189,.5);font-size:12px;font-family:var(--head);letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
{t:'title', kicker:"A live masterclass", h:"Know Your Numbers First", sub:"The 10-year financial model that makes small-business growth safe.", presenter:"With Troy Trewin, founder of Grow A Small Business"},

{t:'who', kicker:"Who this is for", h:"Owners of businesses under 30 people", body:"You have revenue, a team, and ambition to grow. What you want is to grow on purpose, not on luck, and without the business quietly outrunning its own cash."},

{t:'trap', kicker:"The trap", h:"Growth that feels like going backwards", body:"Sales climb, the team gets bigger, and somehow cash gets tighter. You are busier than ever and less sure than ever about the next decision. So you push harder, which is exactly what makes it worse."},

{t:'reframe', kicker:"The real problem", big:"You do not have a growth problem. You have a <span class='a'>numbers problem</span> you cannot see yet."},

{t:'part', part:"Part one", h:"Why growing blind breaks good businesses"},

{t:'list', kicker:"Growing blind", h:"Most owners run on the bank balance", list:["The bank balance is a rear-view mirror, not a plan","Pricing gets set by feel, not by what the model needs","Hires happen when you are drowning, which is the most expensive time to hire","Every big decision becomes a gut call made under stress"]},

{t:'cost', kicker:"What it costs", h:"The expensive mistakes all look the same", body:"Hiring too early. Discounting to win work that loses money. Chasing revenue that never reaches the bottom line. None of these feel like a numbers mistake in the moment. All of them are."},

{t:'part', part:"Part two", h:"The method: build the model first"},

{t:'pillar', n:"1", kicker:"Pillar one", h:"Know your numbers", body:"We build a 10-year financial model from your real drivers, your revenue, your margins, your costs, your team. Not a spreadsheet of hope. A decade-horizon picture of what this business can actually become, and what it needs to get there."},

{t:'pillar', n:"2", kicker:"Pillar two", h:"The four strategic documents", body:"The model is not the end. Out of it fall four documents your team can execute from: the plan, the targets, the priorities, and the one-pager everyone can see. Strategy stops living in your head."},

{t:'pillar', n:"3", kicker:"Pillar three", h:"The target cascade", body:"Ten years becomes this year. This year becomes this quarter. Now every week has a number attached, and you always know whether you are ahead or behind, long before the bank balance tells you."},

{t:'order', kicker:"The order matters", h:"Strategy before people", body:"Most owners try to fix growth by hiring. You only scale the team once the model is tested and the numbers are proven. Get the sequence wrong and you are just adding cost to a problem you have not solved."},

{t:'part', part:"Part three", h:"What it looks like on the other side"},

{t:'after', kicker:"The shift", h:"Decisions become arithmetic, not anxiety", body:"Should we hire? Should we take the big contract? Can we afford the new site? Each one gets a clear yes or no from the model. You still make the call, but you make it with the numbers in front of you instead of a knot in your stomach."},

{t:'lens', kicker:"Growth that fits your life", h:"Health, wealth, relationships", body:"Growth puts pressure on three parts of an owner's life. The point of knowing your numbers is not just a bigger business. It is a business that grows without costing you your health, your wealth, or the people you did this for."},

{t:'why', kicker:"Why listen to me", h:"22 years, more than 40 businesses", body:"I have held equity in fifteen businesses, run others without it, consulted to more than twenty-five, and chaired small-business boards since 2017. I have seen fast growth, slow growth, and shutdowns up close."},

{t:'why2', kicker:"What they all shared", big:"Every business that made it ran on <span class='a'>the same habit</span>: the model came first."},

{t:'recap', kicker:"The recap", h:"Numbers first, in order", list:["Build the 10-year financial model from your real drivers","Let the four strategic documents fall out of it","Cascade the targets from ten years down to this quarter","Only then scale the people"]},

{t:'cta', kicker:"Your next step", h:"See if this fits your business", step:"Book a Growth Chat with Troy", body:"A short, no-pressure conversation to look at where your numbers are today and whether the Business Transformation Program is the right next step for you.", disc:"This masterclass is educational. No income or result is guaranteed. Results vary with the owner, the business, and the market."}
];

function esc(x){return x==null?"":x}
function render(){
  const root=document.getElementById('deck');
  S.forEach(function(s){
    const el=document.createElement('section');
    el.className='slide';
    let h='';
    if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
    if(s.part) h+='<div class="part">'+esc(s.part)+'</div>';
    if(s.n) h+='<div class="n">'+esc(s.n)+'</div>';
    if(s.h) h+=(s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>');
    if(s.big) h+='<div class="big">'+s.big+'</div>';
    if(s.sub) h+='<div class="sub">'+esc(s.sub)+'</div>';
    if(s.step) h+='<div class="cta-step">'+esc(s.step)+'</div>';
    if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
    if(s.list){ h+='<ul>'; s.list.forEach(function(i){h+='<li>'+esc(i)+'</li>';}); h+='</ul>'; }
    if(s.presenter) h+='<div class="presenter">'+esc(s.presenter)+'</div>';
    if(s.disc) h+='<div class="disc">'+esc(s.disc)+'</div>';
    h+='<div class="foot">Grow A Small Business</div>';
    el.innerHTML=h;
    root.appendChild(el);
  });
}
render();
</script>
</body>
</html>
