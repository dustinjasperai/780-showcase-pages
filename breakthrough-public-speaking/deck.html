<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak With Genuine Confidence on Camera - Breakthrough Public Speaking</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&family=Karla:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1fb;        /* her light lavender ground (sarinamann.com #f7f4ff, deepened) */
    --panel:#ffffff;
    --rule:#d7d1ec;      /* light tint of her indigo */
    --accent:#00135e;    /* her dominant deep indigo */
    --deep:#150e1f;      /* her aubergine-black */
    --ink:#211b2e;
    --muted:#5b556b;
    --display:'Rubik',system-ui,sans-serif;
    --body:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  .deck{max-width:1000px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:60px 64px;margin:0 0 26px;min-height:480px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.16em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.08;color:var(--deep);letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.15;color:var(--deep);margin-bottom:14px}
  .sub{font-size:22px;color:var(--muted);margin-top:22px;max-width:40ch;line-height:1.4}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:54ch;margin-top:14px}
  .big{font-size:27px;line-height:1.4;color:var(--deep);max-width:46ch}
  ul{margin:22px 0 0 0;max-width:56ch}
  li{list-style:none;font-size:19px;line-height:1.45;padding:13px 0 13px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li .n{position:absolute;left:0;top:13px;font-family:var(--display);font-weight:700;color:var(--accent)}
  li b{font-family:var(--display);font-weight:600;color:var(--deep)}
  .part h1{font-size:60px}
  .part .kicker{font-size:15px}
  .title-slide{background:var(--deep)}
  .title-slide::before{background:var(--accent);width:10px}
  .title-slide h1{color:#f7f4ff;font-size:58px}
  .title-slide .kicker{color:#b9b0e0}
  .title-slide .sub{color:#cfc8e6}
  .cta-slide{background:var(--accent)}
  .cta-slide::before{background:#f7f4ff;width:10px}
  .cta-slide h2,.cta-slide h1{color:#ffffff}
  .cta-slide p,.cta-slide .sub{color:#e7e4f6}
  .step{color:var(--accent);font-family:var(--display);font-weight:700}
  .disc{margin-top:26px;font-size:13px;color:#d8d4ee;max-width:60ch;line-height:1.5}
  .brand{font-family:var(--display);font-weight:600;font-size:15px;letter-spacing:.04em;color:var(--muted);margin-top:30px}
  .cta-slide .brand{color:#cdc8ee}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-slide', html:`
    <div class="kicker">Breakthrough Public Speaking &middot; A masterclass with Sarina Mann</div>
    <h1>Speak With Genuine Confidence on Camera</h1>
    <div class="sub">How business owners who freeze on video learn to show up as themselves - on webinars, on video, and in the room that matters.</div>`},

  {t:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>You are brilliant in a one-to-one conversation.</h2>
    <p>You can win the client across a table, answer any question about your business, and speak for hours about the work you love.</p>
    <p>Then the camera light goes on, or it is your turn to present to the room, and something else takes over.</p>`},

  {t:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>So you do what feels safe.</h2>
    <ul>
      <li><b>You over-rehearse</b> until the words sound like a script someone else wrote.</li>
      <li><b>You hide behind slides</b> and let the deck do the talking.</li>
      <li><b>You avoid video altogether</b> and watch quieter competitors get seen instead.</li>
    </ul>
    <p>None of it is a confidence problem you can think your way out of.</p>`},

  {t:'hook', html:`
    <div class="kicker">The reframe</div>
    <h1 style="font-size:44px">"Fake it till you make it" is the advice that keeps you stuck.</h1>
    <p class="big">Confidence is not a personality you were born with or without. It is a skill. And like any skill, once you learn how it actually works, the confidence follows on its own.</p>`},

  {t:'part', cls:'part', html:`
    <div class="kicker">Part one</div>
    <h1>The fear lives in your body, not your script.</h1>`},

  {t:'content', html:`
    <div class="kicker">The real problem</div>
    <h2>Your nervous system reacts before your brain does.</h2>
    <p>Shallow breath, a tight chest, a racing heart, a mind that goes blank. That is a physiological response, not a flaw in your preparation.</p>
    <p>It is why more notes, more slides, and more rehearsal never fix the feeling. You are solving a body problem with a paperwork answer.</p>`},

  {t:'content', html:`
    <div class="kicker">Why it compounds on camera</div>
    <h2>The camera removes the thing that normally calms you.</h2>
    <p>No nodding faces. No live energy to feed off. Just a lens and the sound of your own voice, which sends the same nervous system into overdrive.</p>
    <p>Master the body first and everything downstream - your words, your pace, your presence - gets easier.</p>`},

  {t:'part', cls:'part', html:`
    <div class="kicker">Part two</div>
    <h1>The 5-Step Framework for Genuine Confidence</h1>`},

  {t:'pillar', html:`
    <div class="kicker">Step one</div>
    <h2>Confidence Mindset</h2>
    <p>We name the fear and rate it, then take apart the catastrophic thinking and the limiting beliefs underneath it.</p>
    <p>You stop fighting the nerves and start understanding exactly what they are and what they are not.</p>`},

  {t:'pillar', html:`
    <div class="kicker">Step two</div>
    <h2>Physiology first</h2>
    <p>Breath, grounding, and relaxation techniques that work the body and the mind together, so you can settle yourself in the ninety seconds before you speak.</p>
    <p>This is the piece almost no speaking training teaches, and it is the one that changes everything.</p>`},

  {t:'pillar', html:`
    <div class="kicker">Step three</div>
    <h2>Tech Competence</h2>
    <p>Lighting, camera, audio, angle, and your relationship with the lens itself. When the set-up is handled, your attention is free for the message.</p>
    <p>Looking and sounding like a professional is mostly a checklist, not a talent.</p>`},

  {t:'pillar', html:`
    <div class="kicker">Step four</div>
    <h2>Content that lands on camera</h2>
    <p>Language, structure, and the right kind of content for the moment, whether it is a sixty-second pitch or a full presentation.</p>
    <p>Clarity of your core message is what makes you watchable, not clever lines.</p>`},

  {t:'pillar', html:`
    <div class="kicker">Step five</div>
    <h2>Presentation Skills, step by step</h2>
    <p>A clear process for pre-recorded video, and a separate one for live virtual events and webinars, so you are never guessing in the moment.</p>
    <p>You practise the real thing, in the real format, until it feels like you.</p>`},

  {t:'part', cls:'part', html:`
    <div class="kicker">Part three</div>
    <h1>When the camera stops being the thing you dread.</h1>`},

  {t:'content', html:`
    <div class="kicker">The shift</div>
    <h2>You show up as yourself, on the days it counts.</h2>
    <ul>
      <li><b>On video</b> you speak to the lens like it is one person, and people feel it.</li>
      <li><b>On webinars</b> you hold the room without a script to hide behind.</li>
      <li><b>In the pitch</b> you turn more conversations into leads and more presentations into sales.</li>
    </ul>`},

  {t:'content', html:`
    <div class="kicker">Proof it is learnable</div>
    <h2>I was the anxious introvert first.</h2>
    <p>I dreaded speaking. Then I learned, step by step, that confidence is built, not inherited, and went on to win Toastmasters contests at local, regional, and national level.</p>
    <p>Everything in this framework is the path I walked and now teach, nothing borrowed.</p>`},

  {t:'why', html:`
    <div class="kicker">Why me</div>
    <h2>Sarina Mann, Breakthrough Public Speaking</h2>
    <ul>
      <li>Award-winning Toastmasters speaker and communication keynote speaker.</li>
      <li>Creator of the Breakthrough Virtual Speaker Programme and the 5-Step Framework for Genuine Confidence.</li>
      <li>Host of The Speakers' Community Podcast, and founder of a community built around speaking with real confidence.</li>
    </ul>`},

  {t:'recap', html:`
    <div class="kicker">The five steps, together</div>
    <h2>One path from frozen to fluent.</h2>
    <ul>
      <li><span class="n">1</span><b>Confidence Mindset</b> - name it, rate it, dismantle it.</li>
      <li><span class="n">2</span><b>Physiology first</b> - breath, grounding, relaxation.</li>
      <li><span class="n">3</span><b>Tech Competence</b> - look and sound the part.</li>
      <li><span class="n">4</span><b>Content that lands</b> - clear message, right format.</li>
      <li><span class="n">5</span><b>Presentation Skills</b> - practised, step by step.</li>
    </ul>`},

  {t:'cta', cls:'cta-slide', html:`
    <div class="kicker">Your next step</div>
    <h2>Ready to speak with genuine confidence on camera?</h2>
    <p>If this is the breakthrough you have been putting off, let's build your confidence the same way, step by step. Book a call with me, or start inside the Breakthrough Virtual Speaker Programme.</p>
    <div class="brand">Sarina Mann &middot; Breakthrough Public Speaking</div>
    <div class="disc">Educational only. This masterclass teaches a learning process; it is not advice for any individual situation. No income, role, booking, or result is guaranteed, and outcomes vary with the work you put in.</div>`}
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls || '');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
