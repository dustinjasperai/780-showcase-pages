<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Brand Strategy Without the Jargon - a masterclass with Sarah Robb</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f0f3f7;        /* her actual site body background, rgb(240,243,247) */
    --panel:#ffffff;
    --ink:#252a3b;       /* her dominant body ink, 54 uses */
    --muted:#565662;     /* her slate gray, 15 uses */
    --accent:#2b4f77;    /* her H1/H2 + footer navy, 50 uses */
    --pop:#eaf23a;       /* her chartreuse pop, 22 uses */
    --rule:#d9e0ea;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{scroll-snap-type:y mandatory;overflow-y:scroll;height:100vh}
  .slide{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .kicker{font-size:14px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:"Gilda Display",Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,68px);line-height:1.04;letter-spacing:-.01em;max-width:16ch}
  h2{font-family:"Gilda Display",Georgia,serif;font-weight:400;font-size:clamp(28px,4.4vw,48px);line-height:1.1;max-width:20ch}
  .lede{font-size:clamp(18px,2.1vw,25px);line-height:1.5;color:var(--muted);max-width:40ch;margin-top:26px;font-weight:400}
  p.body{font-size:clamp(17px,1.7vw,21px);line-height:1.6;max-width:46ch;margin-top:18px;color:var(--ink)}
  ul{margin-top:26px;max-width:48ch;list-style:none}
  ul li{position:relative;padding-left:30px;margin-bottom:16px;font-size:clamp(16px,1.7vw,20px);line-height:1.5}
  ul li:before{content:"";position:absolute;left:0;top:.6em;width:12px;height:12px;background:var(--pop);border:1.5px solid var(--accent);border-radius:2px}
  .steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:18px;margin-top:30px;max-width:62ch}
  .step{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 18px 20px}
  .step .s-n{font-family:"Gilda Display",serif;font-weight:400;color:var(--accent);font-size:22px}
  .step .s-t{margin-top:8px;font-weight:600;font-size:16px}
  .step .s-d{margin-top:6px;color:var(--muted);font-size:14px;line-height:1.45}
  .section{background:var(--accent);color:#fff;border-bottom:none}
  .section h2{color:#fff}
  .section .kicker{color:var(--pop)}
  .section .lede{color:rgba(255,255,255,.82)}
  .creds{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px;max-width:48ch}
  .creds span{border:1px solid var(--rule);background:var(--panel);border-radius:999px;padding:9px 16px;font-size:15px;font-weight:600;color:var(--accent)}
  .cta h1{max-width:18ch}
  .cta .lede{max-width:44ch}
  .disc{margin-top:36px;font-size:13px;line-height:1.55;color:var(--muted);max-width:54ch}
  .foot{position:absolute;bottom:3.4vh;left:9vw;right:9vw;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .section .foot{color:rgba(255,255,255,.6)}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Sarah Robb',title:'Brand Strategy Without the Jargon',lede:'The clear, 7-step way to lead a brand strategy project that clients happily pay strategy fees for.'},
 {t:'who',kicker:'Who this is for',title:'You can design the brand. Strategy is where you freeze.',lede:'For designers, copywriters and marketers who are brilliant at execution but want to confidently own the strategy, and charge for it.'},
 {t:'promise',kicker:'What you will leave with',title:'By the end of this hour you will have:',bullets:['A plain-English definition of what brand strategy actually is','The exact 7 steps to run a project from blank brief to finished deliverable','A clear view of where the real fee comes from, and how to charge it']},
 {t:'trap',kicker:'The trap',title:'The project lands. The panic starts.',body:'A client asks for "the brand strategy" and you are staring at a blank page, rebuilding your approach from scratch, every single time. You are not short on talent. You are short on a process.'},
 {t:'reframe',kicker:'The reframe',title:'Jargon is not depth. It is what hides the missing process.',body:'The field is taught in buzzwords, purpose pyramids, archetypes, essence wheels, that sound clever and tell you nothing about what to do on Monday morning. Clarity is the real expertise.'},
 {t:'section',kicker:'Part one',title:'The real problem is not knowledge. It is the lack of a repeatable system.'},
 {t:'body',kicker:'Part one',title:'What it actually costs you',body:'Without a system you underprice the work, you skip the research that justifies a real fee, and you hand the strategy to someone else. In my survey of 172 strategists the typical project came in at $4,500, while those working from a clear, research-led process averaged far more.'},
 {t:'body',kicker:'Part one',title:'Confidence is the thing clients are buying',body:'When you do not trust your own process, you discount, you hedge, and you present tentatively. When you do, you charge properly and the room believes you. The process is what creates the confidence.'},
 {t:'section',kicker:'Part two',title:'The method: start with four questions, then follow seven simple steps.'},
 {t:'body',kicker:'The foundation',title:'The Four Question Framework',body:'Before any work begins, four questions pin down what brand strategy actually is, and draw the line between brand strategy, marketing strategy and business strategy. Most projects go wrong here, before they start, by confusing the three.'},
 {t:'steps',kicker:'The 7 simple steps',title:'From a blank brief to a finished strategy',steps:[
   {n:'1',ti:'Frame it',de:'Agree what the strategy is for and what it must answer.'},
   {n:'2',ti:'Research the customer',de:'Interviews and surveys that surface what really drives them.'},
   {n:'3',ti:'Research the company',de:'The truths, assets and ambitions only the business has.'},
   {n:'4',ti:'Find the insight',de:'Turn the raw research into the one thing worth building on.'},
   {n:'5',ti:'Set the direction',de:'Position the brand and make the strategic choices clear.'},
   {n:'6',ti:'Build the strategy',de:'A simple, client-ready articulation anyone can act on.'},
   {n:'7',ti:'Present & roll out',de:'Sell it in the room, then a 12-month implementation plan.'}
 ]},
 {t:'body',kicker:'The hinge',title:'Step four is where projects are won',body:'Everyone can gather research. The skill is turning a pile of interviews and data into the single insight the whole strategy stands on. Get this right and the direction almost writes itself.'},
 {t:'body',kicker:'The toolkit',title:'The tools do the heavy lifting',body:'Each step comes with the actual thing you need: interview scripts, survey templates, competitor audits, workshop facilitation guides, presentation frameworks, AI-assisted analysis prompts, and proposal and pricing templates. 23 in all.'},
 {t:'section',kicker:'Part three',title:'When the process is doing the work for you.'},
 {t:'body',kicker:'The shift',title:'From scramble to system',body:'Instead of reinventing your approach on every brief, you walk in with a path you trust. The research gives you the confidence to charge for strategy, present it without flinching, and deliver something the client can actually use.'},
 {t:'body',kicker:'The deliverable',title:'What a client-ready strategy looks like',body:'Not a 60-slide theory deck. A clear, decision-ready document the client and their team can act on: the insight, the positioning, the choices, and the plan to roll it out over the next year.'},
 {t:'creds',kicker:'Why learn it this way',title:'20 years running strategy for the world’s biggest brands.',lede:'I spent two decades developing brand strategy at Landor and in-house, across 70+ brands.',creds:['Pfizer','Diageo','EY','PepsiCo','Oracle','Landor']},
 {t:'body',kicker:'Inside the Academy',title:'Everything, in one place',body:'The Brand Strategy Academy gives you all 7 steps, the 23 client-ready tools, live Q&A coaching, a 490+ member community of working strategists, and lifetime access. Clear, practical, no fluff.'},
 {t:'cta',kicker:'Your next step',title:'Start running brand strategy the clear way.',lede:'Begin with the free "Brand Strategy in 7 Simple Steps" mini course, then join the Academy when you are ready to deliver a full project.',disc:'This masterclass is educational. It teaches a process and a set of tools for doing brand strategy work. No specific income, client, enrollment or business result is guaranteed. Results vary and depend on your own effort, skill and market.'}
];
const deck=document.getElementById('deck');
function foot(i){return '<div class="foot"><span>Brand Strategy Sarah</span><span>'+(i+1)+' / '+S.length+'</span></div>';}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='section'?'section ':'')+(s.t==='cta'?'cta ':'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='steps'){
    h+='<h2>'+s.title+'</h2><div class="steps">';
    s.steps.forEach(st=>{h+='<div class="step"><div class="s-n">'+st.n+'</div><div class="s-t">'+st.ti+'</div><div class="s-d">'+st.de+'</div></div>';});
    h+='</div>';
  } else if(s.t==='creds'){
    h+='<h2>'+s.title+'</h2>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    h+='<div class="creds">'+s.creds.map(c=>'<span>'+c+'</span>').join('')+'</div>';
  } else {
    const tag=(s.t==='title'||s.t==='cta')?'h1':'h2';
    h+='<'+tag+'>'+s.title+'</'+tag+'>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    if(s.bullets) h+='<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';
    if(s.body) h+='<p class="body">'+s.body+'</p>';
    if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  }
  h+=foot(i);
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
