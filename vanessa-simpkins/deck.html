<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell From The Stage, a Masterclass with Vanessa Simpkins</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;800&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1016;
    --panel:#241620;
    --rule:#3a2431;
    --chalk:#f3e9ee;
    --dim:#c9b3c0;
    --accent:#aa628a;
    --hot:#ec008c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--chalk);font-family:'Open Sans',system-ui,sans-serif;overflow:hidden}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
  .slide{display:none;width:100%;max-width:1040px}
  .slide.on{display:block;animation:fade .4s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  h1,h2,h3,.kicker{font-family:'Sora','Open Sans',sans-serif}
  .kicker{text-transform:uppercase;letter-spacing:.18em;font-size:13px;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-size:clamp(34px,6vw,68px);line-height:1.04;font-weight:800;letter-spacing:-.01em}
  h2{font-size:clamp(26px,4.4vw,48px);line-height:1.08;font-weight:800;letter-spacing:-.01em}
  h3{font-size:clamp(20px,2.6vw,30px);font-weight:600}
  p{font-size:clamp(16px,1.9vw,22px);line-height:1.5;color:var(--dim);margin-top:18px;max-width:40ch}
  .lead{color:var(--chalk)}
  .spot{display:inline-block;width:72px;height:5px;background:linear-gradient(90deg,var(--accent),var(--hot));border-radius:4px;margin-bottom:26px}
  ul{list-style:none;margin-top:22px}
  li{font-size:clamp(16px,2vw,22px);line-height:1.4;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);color:var(--chalk)}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--accent);border-radius:50%}
  .num{font-family:'Sora';font-size:clamp(44px,8vw,96px);font-weight:800;color:var(--rule);line-height:1}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:40px 44px}
  .big{font-size:clamp(30px,5vw,58px);font-weight:800;font-family:'Sora';line-height:1.05}
  .accent{color:var(--accent)}
  .foot{position:fixed;bottom:22px;left:7vw;right:7vw;display:flex;justify-content:space-between;font-size:12px;color:#6f5765;letter-spacing:.04em}
  .nav{position:fixed;bottom:18px;right:7vw;font-size:12px;color:#6f5765}
  .disc{font-size:13px;color:#8a7281;margin-top:22px;max-width:56ch}
  .cta-box{margin-top:26px;display:inline-block;border:1px solid var(--accent);border-radius:999px;padding:14px 30px;color:var(--chalk);font-family:'Sora';font-weight:600}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot"><span>Take Your Power Back Now</span><span>Vanessa Simpkins</span></div>
<div class="nav"><span id="pg"></span> &nbsp; &larr; / &rarr;</div>
<script>
const S=[
  {t:'title', k:'A Live Masterclass', h:'Sell From The Stage', sub:'How to enroll high-ticket clients from a single room, without a huge audience or a complicated launch.'},
  {t:'who', k:'Who this is for', h:'For the woman who already has the gift', body:'You are a coach, a speaker, a healer or an expert. You know you change lives. What you do not have yet is a repeatable way to get in front of the right people and have them say yes.'},
  {t:'trap', k:'The trap', h:'You were told to grow the audience first', body:'Post more. Chase followers. Wait until you are big enough. So you stay busy being visible and still wonder why the calendar is not full of buyers.'},
  {t:'reframe', k:'The reframe', big:'You do not need a bigger audience. You need a <span class="accent">room that buys.</span>'},
  {t:'part', k:'Part One', num:'01', h:'The real problem'},
  {t:'problem', k:'The real problem', h:'It is not reach. It is the room and the ask.', body:'Two things keep heart-centered women stuck: there is no room where you get to teach and sell in one sitting, and when the moment comes to name the price, you shrink. Reach cannot fix either one.'},
  {t:'problem', k:'The cost', h:'What invisibility actually costs', body:'Every month without a room that buys is a month of free content, free calls and hope marketing. The gift is real. The structure to get paid for it is missing.'},
  {t:'part', k:'Part Two', num:'02', h:'The Workshop Profits method'},
  {t:'pillar', k:'Pillar one', h:'Craft the talk from the first minute', body:'The room is won or lost in the opening moments. You will structure a talk that earns attention, teaches something real, and leads naturally to the offer instead of bolting it on at the end.'},
  {t:'pillar', k:'Pillar two', h:'Build the irresistible offer', body:'An offer the right person cannot talk themselves out of. Clear outcome, clear path, clear reason to act now. This is what turns a nodding room into an enrolling one.'},
  {t:'pillar', k:'Pillar three', h:'Fill the room with the right people', body:'A full room of the wrong people pays nothing. You will learn to attract the buyers, line up partners who send their people, and get the right seats filled for your next workshop.'},
  {t:'pillar', k:'Pillar four', h:'Own your value, charge what you are worth', body:'The number you can say out loud without flinching is the number you will earn. We work the value before the price, so the ask stops being the scary part.'},
  {t:'principle', k:'The foundation', big:'Radical honesty. Radical responsibility. <span class="accent">Radical self love.</span>', body:'Every pillar sits on this. Own your story, own your worth, and the selling stops feeling like selling.'},
  {t:'part', k:'Part Three', num:'03', h:'When the room runs on purpose'},
  {t:'picture', k:'The picture', h:'One room, run on purpose', body:'Sixty minutes. You teach, you make one clean offer, and the right people raise their hand. No chasing, no convincing. You run it again next month.'},
  {t:'picture', k:'The shift', h:'From hustling for visibility to getting paid for your gift', body:'This is the confidence-to-cash shift. The work does not get louder. It gets clearer, and it finally gets paid.'},
  {t:'why', k:'Why learn this from me', h:'I built this the hard way', body:'I rebuilt from bankruptcy and spent over a decade teaching women to sell from the stage and from small workshops. I have taught this method to thousands of women who wanted their confidence and their cash flow to finally match the size of their gift.'},
  {t:'recap', k:'The whole method', h:'Three parts, one outcome', items:['The room and the ask, not more reach','The four pillars of Workshop Profits','Own your value and run the room on purpose']},
  {t:'next', k:'Your next step', h:'Ready for a bigger breakthrough?', body:'If you want help applying this to your own offer, the next step is a private Big Breakthrough Session with me, where we map your talk, your offer and your value together.'},
  {t:'cta', k:'Take your power back', h:'Book your Big Breakthrough Session', body:'Come find me at takeyourpowerbacknow.com and book your 1-1 Big Breakthrough Session.', disc:'Educational only. No specific income or result is guaranteed. Results vary and depend on your offer, your market and the work you put in.'}
];
const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===cur?' on':'');
    let html='';
    if(s.k) html+='<div class="kicker">'+s.k+'</div>';
    html+='<span class="spot"></span><br>';
    if(s.num) html+='<div class="num">'+s.num+'</div>';
    if(s.h) html+='<h1>'+s.h+'</h1>';
    if(s.big) html+='<div class="big">'+s.big+'</div>';
    if(s.sub) html+='<p class="lead">'+s.sub+'</p>';
    if(s.body) html+='<p>'+s.body+'</p>';
    if(s.items){html+='<ul>';s.items.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
    if(s.t==='cta') html+='<div class="cta-box">takeyourpowerbacknow.com</div>';
    if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
    d.innerHTML=html;
    stage.appendChild(d);
  });
  document.getElementById('pg').textContent=(cur+1)+' / '+S.length;
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
stage.addEventListener('click',()=>go(cur+1));
render();
</script>
</body>
</html>
