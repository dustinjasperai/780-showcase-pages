<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Enduring Firm · ClientWise</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@600;700;800&family=Public+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ffffff; --panel:#12244b; --rule:#dbe2ee;
    --ink:#12244b; --accent:#2283cd; --grey:#4c5566; --dim:#9aa3b2;
  }
  html,body{height:100%}
  body{background:#0a1730;font-family:'Public Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a1730}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Libre Franklin',sans-serif;font-weight:800;color:var(--ink);line-height:1.12;letter-spacing:-.01em}
  .t-title h1{font-size:3.7vw;max-width:92%}
  .t-normal h1{font-size:2.5vw;max-width:84%;font-weight:700}
  .t-normal .body{font-size:1.38vw;color:var(--grey);margin-top:2.6vh;max-width:78%;line-height:1.6;font-weight:400}
  .sub{font-size:1.5vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.52;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-size:1.3vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.7vw;max-width:86%;color:#ffffff;font-weight:700}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:82%;color:#ffffff}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:#ffffff;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#b9c4d8}
  .t-title .disc,.t-normal .disc{text-align:left}
  .rise-motif{position:absolute;pointer-events:none}
  .title-rise{right:6.5%;bottom:10%;width:18vw;opacity:.96}
  .brandline{font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(18,36,75,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.8vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">ClientWise · Ray Sclafani</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ascent" viewBox="0 0 260 120">
  <g fill="none">
    <line x1="16" y1="104" x2="244" y2="104" stroke="#12244b" stroke-width="4" stroke-linecap="round"/>
    <path d="M28 104 H84 V78 H140 V50 H196 V22" stroke="#2283cd" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="28" cy="104" r="8" fill="#2283cd"/>
    <circle cx="196" cy="22" r="7" fill="none" stroke="#2283cd" stroke-width="4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Enduring Firm',sub:'A live masterclass for financial advisors on building a practice that keeps its value, and its clients, long after you step back.',brand:true},
 {t:'normal',k:'Who this is for',title:'You built a great practice. The real question is whether it survives you.',body:'This is for the established advisor or firm owner who has grown a book worth being proud of, and who has started to wonder what actually happens to it when they slow down, sell, or step back. The practice works. Whether it is a business, or just a very good job, is a different question.'},
 {t:'dark',title:'A book of business pays you while you work. An enduring firm pays you when you stop.'},

 {t:'section',idx:'Part One',title:'Why Most Practices Are Worth Less Than the Owner Thinks'},
 {t:'normal',k:'The founder trap',title:'The clients came for you. That is exactly what caps the value.',body:'When every relationship runs through the founder, the firm cannot be handed over without handing over the founder too. A buyer knows it, and prices it in. The very thing that grew the practice, you at the center of everything, is the thing that discounts it at transition.'},
 {t:'normal',k:'The succession gap',title:'More than 70% of advisors have no meaningful succession plan.',body:'It is the most predictable event in the career, and the least planned for. Most owners treat succession as a late paperwork exercise, so it arrives as a fire sale instead of a transfer. The plan is not the afterthought. The plan is where the enterprise value lives.'},
 {t:'dark',title:'Enterprise value is not what you earn. It is what transfers without you.'},

 {t:'section',idx:'Part Two',title:'The ClientWise Model'},
 {t:'normal',k:'Reframe the relationship',title:'Stop being the directive advisor. Become the trusted advocate.',body:'The reframe at the heart of You Have Been Framed: move clients from depending on your instructions to trusting your advocacy, so the loyalty attaches to the firm and its process, not only to you. Loyal client advocates are the ones who stay through a transition, which is what makes the relationships transferable in the first place.'},
 {t:'normal',k:'The Professional Advisory Model',title:'Build the firm around a model, not around your calendar.',body:'The Professional Advisory Model defines the roles, the client process, and the team structure so the business can run and grow without the owner sitting in every seat. A firm built on a model is one another person can step into. A firm built on a founder is not.'},
 {t:'normal',k:'Success In Succession',title:'A seven part roadmap, and four questions every owner has to answer.',body:'Succession handled as a design decision, made early, not an exit handled late. The roadmap turns a vague someday into a set of concrete choices about ownership, leadership, and timing, so the firm is built to transfer from the day you decide it should.'},
 {t:'dark',title:'An enduring firm is engineered, one decision at a time. It does not happen by accident.'},

 {t:'section',idx:'Part Three',title:'The Path to an Ensemble Enterprise'},
 {t:'normal',k:'From solo to ensemble',title:'The growth path runs from Emerging Leader to Super Ensemble.',body:'A firm matures in stages, from a single-owner practice up through a multi-owner ensemble enterprise. Naming the stage you are in, and the next one, is how you stop guessing and start building deliberately toward the structure that carries real enterprise value.'},
 {t:'normal',k:'Develop the next generation',title:'The firm transfers when the next generation is ready to carry it.',body:'Enterprise value depends on a second line of advisors and leaders who can hold the relationships and run the business. Developing them, and giving them a real path to ownership, is not an HR nicety. It is the mechanism that makes the transfer possible at all.'},
 {t:'normal',k:'Know the number',title:'Manage the firm by what it is worth, not only by what it earns.',body:'Enterprise value is a number you can measure, watch, and move. Treating it as an ongoing management metric, rather than a question you ask once at the end, is what separates an owner building an asset from an advisor running a very good job.'},

 {t:'section',idx:'Who Is Teaching This',title:'Two Decades Inside the Business of Advice'},
 {t:'normal',k:'Not theory',title:'The coaching partner the top teams already call.',body:'ClientWise has coached advisors and teams at the largest firms in the industry, was named a Barron’s Advisor exclusive coaching partner, and its founder sits on the board of a multi-billion dollar RIA guiding enterprise-value creation and succession. This is the enduring-firm question, worked with owners for nearly two decades.'},
 {t:'normal',k:'How it works',title:'The masterclass lays out the map. The Academy is where you build it.',body:'This hour gives you the model: why practices lose value, the reframe, the succession roadmap, and the path to an ensemble enterprise. From there, the Business Builders Academy is the peer room where owners install it, quarter by quarter, alongside advisors solving the same problem.'},
 {t:'cta',title:'Ready to build a firm that is worth more than your book of business?',chips:['Join the Business Builders Academy'],disc:'Educational content for financial advisors building an advisory business. No income, revenue, valuation, or business result is guaranteed. Results vary by advisor, firm, market, and effort.'},
];

const deck=document.getElementById('deck');
function riseSvg(){return `<svg class="rise-motif title-rise"><use href="#ascent"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">ClientWise &middot; <b>Ray Sclafani</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=riseSvg();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
