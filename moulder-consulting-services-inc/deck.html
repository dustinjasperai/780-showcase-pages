<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Success Without Sacrifice - A Masterclass for Lawyers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#052941;      /* brand dominant: button/H2/footer on coursecorrectioncoaching.com */
    --steel:#365f79;     /* brand link blue */
    --rose:#987d7d;      /* brand H1 dusty rose */
    --ground:#fafaf7;    /* warm off-white (light scheme site) */
    --panel:#ffffff;
    --ink:#1b2430;
    --muted:#5c6773;
    --rule:#e4e0d8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--steel);font-family:"Work Sans",system-ui,sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;padding:32px 0}
  .deck{max-width:960px;margin:0 auto;padding:0 20px}
  .slide{background:var(--ground);border-radius:14px;padding:64px 64px;margin:0 0 26px;min-height:500px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 34px rgba(5,41,65,.16);position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:64px;right:64px;bottom:40px;height:2px;background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 38%,var(--rose) 38%,var(--rose) 46%,var(--rule) 46%,var(--rule) 100%)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--steel);font-weight:600;margin-bottom:18px}
  h1{font-family:"Playfair Display",serif;font-weight:700;color:var(--navy);font-size:52px;line-height:1.05;margin-bottom:18px}
  h2{font-family:"Playfair Display",serif;font-weight:700;color:var(--navy);font-size:38px;line-height:1.1;margin-bottom:20px}
  .lede{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);margin-top:14px;max-width:46ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:52ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:21px;width:12px;height:2px;background:var(--rose)}
  .big{font-family:"Playfair Display",serif;font-size:44px;line-height:1.12;color:var(--navy);max-width:22ch}
  .kicker{font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--rose);font-weight:600;margin-bottom:16px}
  .section h2{font-size:46px}
  .pillar{font-family:"Playfair Display",serif;font-size:30px;color:var(--navy);margin-bottom:6px}
  .by{margin-top:26px;font-size:17px;color:var(--steel);font-weight:600}
  .by span{display:block;color:var(--muted);font-weight:400;font-size:15px;margin-top:4px}
  .num{position:absolute;top:30px;right:38px;font-size:13px;color:var(--muted);letter-spacing:.1em}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:60ch}
  .cta-btn{display:inline-block;margin-top:22px;background:var(--navy);color:#fff;font-weight:600;font-size:18px;padding:15px 30px;border-radius:9px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title'},
 {t:'who'},
 {t:'trap'},
 {t:'reframe'},
 {t:'section',kicker:'Part One',h:'Why grinding harder stops working'},
 {t:'list',eye:'The core problem',h:'You were trained to out-work it',items:[
   'The habits that made you a great associate (bill more, say yes, grind) do not build a book of business.',
   'Business development is not another task to cram into a 2,400-hour year. Treated that way, it is the first thing to fall off.',
   'So the book grows in fits and starts, and the life shrinks to make room for the work.']},
 {t:'list',eye:'The hidden cost',h:'Activity is not the same as growth',items:[
   'More lunches, more posts, more hours. The needle barely moves.',
   'Rainmaking feels like pressure instead of a practice you can repeat.',
   'The lawyers who grow steadily are not working more. They are working on purpose.']},
 {t:'section',kicker:'Part Two',h:'The Course Correction: Rewire, Reconnect, Realign'},
 {t:'pillar',eye:'Rewire',pill:'Cultivate a success mindset',body:'Rewire the thinking you were trained into: from reacting to responding, from proving to deciding. The judgment, emotional intelligence and self-trust to lead your own practice come first, because every other move depends on them.'},
 {t:'pillar',eye:'Reconnect',pill:'Authentic business development',body:'Reconnect to the clients and conversations that actually build a book. A relationship-first, values-aligned approach to rainmaking means fewer, better moves with the right people, not constant activity with everyone.'},
 {t:'pillar',eye:'Realign',pill:'Whole life leadership',body:'Realign the practice with the life you want. Clear boundaries, protected focus and better decisions are not the reward for growth. They are what makes sustained growth possible without burning out.'},
 {t:'list',eye:'How they work together',h:'One system, not three tactics',items:[
   'Rewire changes how you decide. Reconnect changes where your time goes. Realign protects both.',
   'Each move makes the next one easier, which is why the growth compounds instead of stalling.',
   'This is the difference between a good month and a book that keeps building year over year.']},
 {t:'section',kicker:'Part Three',h:'Inside a corrected practice'},
 {t:'list',eye:'A week, redesigned',h:'Fewer moves, aimed better',items:[
   'A short list of relationships that matter, worked deliberately instead of reactively.',
   'Business development time that is protected on the calendar, not squeezed into the gaps.',
   'Conversations that start from genuine value, so referrals and work follow without the chase.']},
 {t:'list',eye:'Boundaries that grow the book',h:'Protecting the work that pays',items:[
   'Saying no to the work that fills hours but never builds the practice.',
   'Energy and focus treated as the real assets, because tired lawyers make expensive decisions.',
   'A pace you can hold for years, which is the only pace that compounds.']},
 {t:'why'},
 {t:'recap'},
 {t:'cta',disc:'This masterclass is educational and is not legal, financial, or business advice. No specific result is guaranteed. Results vary and depend on your practice, market, and effort. Nothing here promises a particular income or outcome.'}
];

function el(html){const d=document.createElement('div');d.innerHTML=html;return d.firstElementChild;}

function render(){
 const deck=document.getElementById('deck');
 S.forEach((s,i)=>{
  let inner='';
  const num='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.t==='title'){
   inner='<div class="eyebrow">A live masterclass for lawyers</div>'+
     '<h1>Success Without Sacrifice</h1>'+
     '<p class="lede">How to grow your book of business without grinding yourself into the ground.</p>'+
     '<div class="by">Heather Moulder, J.D.<span>Course Correction Coaching | Life &amp; Law</span></div>';
  }else if(s.t==='who'){
   inner='<div class="eyebrow">Who this is for</div>'+
     '<p class="big">For the lawyer who is already good, and already tired.</p>'+
     '<p class="sub">You have built real skill and a real reputation. What you want now is a bigger book and a fuller life, not a choice between them.</p>';
  }else if(s.t==='trap'){
   inner='<div class="eyebrow">The trap</div>'+
     '<h2>The rainmaking math you were handed</h2>'+
     '<p class="sub">Bill more hours. Take every meeting. Out-work the person next to you. It is how you were told to grow, and it is why the book plateaus while the calendar fills.</p>';
  }else if(s.t==='reframe'){
   inner='<div class="kicker">The reframe</div>'+
     '<p class="big">The skills that got you here will not scale. Out-working the problem is the problem.</p>';
  }else if(s.t==='section'){
   inner='<div class="kicker">'+s.kicker+'</div><h2>'+s.h+'</h2>';
   deck.appendChild(el('<div class="slide section">'+num+inner+'</div>'));return;
  }else if(s.t==='list'){
   inner='<div class="eyebrow">'+s.eye+'</div><h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  }else if(s.t==='pillar'){
   inner='<div class="eyebrow">'+s.eye+'</div><div class="pillar">'+s.pill+'</div><p class="sub" style="max-width:52ch;margin-top:12px">'+s.body+'</p>';
  }else if(s.t==='why'){
   inner='<div class="eyebrow">Why listen to me</div>'+
     '<h2>I grew the book and nearly lost everything else first</h2>'+
     '<p class="sub" style="max-width:54ch">I spent eighteen years in private practice and made partner in BigLaw. I built a book worth more than a million dollars in under two years, and I did it through two long stretches of bed rest and an aggressive breast cancer diagnosis. I learned the hard way that growth and a full life are not opposites. This masterclass is the system I wish I had then.</p>';
  }else if(s.t==='recap'){
   inner='<div class="eyebrow">The three moves</div><h2>Your course correction</h2><ul>'+
     '<li><strong>Rewire</strong> the mindset you decide from.</li>'+
     '<li><strong>Reconnect</strong> to the relationships that build the book.</li>'+
     '<li><strong>Realign</strong> the practice with the life you actually want.</li></ul>';
  }else if(s.t==='cta'){
   inner='<div class="eyebrow">Your next step</div>'+
     '<h2>Let us map your course correction</h2>'+
     '<p class="sub">If you want help applying this to your own practice, book a strategy session with Course Correction Coaching and we will look at where your book is stalling and what one change would move it.</p>'+
     '<a class="cta-btn">Schedule your strategy session</a>'+
     '<p class="disc">'+s.disc+'</p>';
  }
  deck.appendChild(el('<div class="slide">'+num+inner+'</div>'));
 });
}
render();
</script>
</body>
</html>
