<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Founder Mode: Leading at Scale · Dave Bailey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fcfcfc; --panel:#f4f4f4; --rule:rgba(22,30,42,.16);
    --accent:#161e2a; --ink:#101010; --muted:#353a37; --faint:#a3a3a3;
  }
  html,body{height:100%}
  body{background:#e7e6e2;font-family:'IBM Plex Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7e6e2}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:linear-gradient(165deg,#ffffff 0%,#fcfcfc 48%,#f3f3f1 100%);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .42s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Archivo',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Archivo',sans-serif;font-weight:800;color:var(--ink);line-height:1.12;letter-spacing:-.015em}
  .t-title h1{font-size:4.0vw;max-width:95%}
  .t-title h1 b{color:var(--accent);font-weight:800}
  .t-normal h1{font-size:2.9vw;max-width:88%;font-weight:700}
  .t-normal .body{font-family:'IBM Plex Sans',sans-serif;font-size:1.5vw;color:var(--muted);margin-top:2.6vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-family:'IBM Plex Sans',sans-serif;font-size:1.55vw;color:var(--muted);margin-top:3.2vh;max-width:84%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Archivo',sans-serif;font-size:1.2vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.5vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:var(--accent);margin-top:3.6vh}
  .t-dark{background:linear-gradient(160deg,#1b2433 0%,#0d131d 100%);align-items:flex-start;justify-content:center}
  .t-dark h1{font-size:3.4vw;max-width:92%;color:#fcfcfc}
  .t-dark h1 b{color:#8ea3c4;font-weight:800}
  .t-cta{background:linear-gradient(160deg,#1b2433 0%,#0d131d 100%);align-items:flex-start}
  .t-cta h1{font-size:3.7vw;max-width:88%;color:#fcfcfc}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .chip{border:1.5px solid #8ea3c4;color:#cdd7e6;border-radius:100px;padding:1.3vh 1.7vw;font-family:'Archivo',sans-serif;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'IBM Plex Sans',sans-serif;font-size:.9vw;color:#9fb0c8;font-style:italic;line-height:1.45}
  .brandline{font-family:'Archivo',sans-serif;font-size:1.25vw;color:var(--muted);margin-top:3.6vh;font-weight:600;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:800}
  .grid{position:absolute;pointer-events:none;opacity:.9}
  .title-grid{right:0;bottom:0;width:34vw;height:100%}
  .corner-grid{right:0;bottom:0;width:17vw;height:62%;opacity:.6}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(22,30,42,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--faint);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--faint);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--faint);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.0vw}.t-normal h1{font-size:5.3vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Founder Coach</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- founder-coach motif: a blueprint schematic grid with one highlighted node, a built system of frameworks -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="schem" viewBox="0 0 200 300" preserveAspectRatio="xMidYMax meet">
  <g stroke="#161e2a" stroke-width="1" opacity="0.22" fill="none">
    <path d="M20 20 H180 M20 70 H180 M20 120 H180 M20 170 H180 M20 220 H180 M20 270 H180"/>
    <path d="M20 20 V280 M70 20 V280 M120 20 V280 M170 20 V280"/>
  </g>
  <circle cx="120" cy="120" r="6" fill="#161e2a"/>
  <path d="M120 120 L170 70 M120 120 L70 170 M120 120 L120 220" stroke="#161e2a" stroke-width="1.6" opacity="0.5"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Founder Mode: How to Lead at Scale <b>Without Becoming Someone Else’s Idea of a CEO</b>',sub:'A live masterclass for venture-backed founder-CEOs who raised the round, grew the team, and keep getting told to step back from the thing they are best at.',brand:true,grid:'title'},
 {t:'normal',k:'Who this is for',title:'You raised the round and grew the team. Now everyone wants you to step aside.',body:'You are somewhere between Series A and Series C, leading a team that keeps growing in size and complexity. The advice coming at you is to delegate, hire experienced execs, and get out of the detail. And the more of it you take, the slower and stranger the company feels.'},
 {t:'dark',title:'The advice slowing you down was written for managers, <b>not for founders.</b>'},

 {t:'section',idx:'Part One',title:'Why Conventional CEO Advice Fails Founders'},
 {t:'normal',k:'The step-back trap',title:'When you fully let go, the things that made the company great quietly leave with you.',body:'Standards drop. Urgency fades. People start working on the wrong things, and you feel disconnected from the product and the company you built. Stepping back entirely was never the goal. It just sounded like maturity.'},
 {t:'normal',k:'The real problem',title:'It is not that you are too close to the detail. It is that you are leading on borrowed instincts.',body:'Most leadership playbooks were built for big, stable companies with layers of structure. Run a venture-scale company that way and you lead against your own instincts, your ambition, and your actual role as the founder.'},
 {t:'dark',title:'You do not need to become a different CEO. You need to <b>lead like a founder, on purpose.</b>'},

 {t:'section',idx:'Part Two',title:'The Founder Leadership Model'},
 {t:'normal',k:'Lever one: Elevate',title:'Raise your standards, because upleveling starts at the top.',body:'Your standards are not as high as you think, and the company can only rise to the bar you actually hold. Founder Mode starts by resetting that bar for yourself first, then making it legible to everyone around you.'},
 {t:'normal',k:'Lever two: Communicate',title:'Say the one thing that matters until the whole company can repeat it.',body:'Alignment is not a deck you present once. It is a founder acting as chief editor of the company story, repeating the few things that matter so often that the team starts saying them back to you. That is when execution gets coherent.'},
 {t:'normal',k:'Lever three: Activate',title:'Create real urgency and sharp focus instead of a longer to-do list.',body:'Scale does not reward more priorities. It rewards fewer, with a clock on them. Activate is how you concentrate the team on the work that moves the company, and build the momentum that a scaling company lives or dies on.'},
 {t:'normal',k:'Lever four: Dominate',title:'Clarify the role only you can play, and build toward the bigger future.',body:'Transformation starts by creating a future, not managing the past. Dominate is where you clarify your ideal role, put a flag in the sand, and lead from your edge instead of apologising for being a founder in the chair.'},
 {t:'dark',title:'Four levers. Learn each as a <b>tool you can teach,</b> and leadership compounds across the whole company.'},

 {t:'section',idx:'Part Three',title:'What Founder Mode Looks Like in Practice'},
 {t:'normal',k:'The first domino',title:'Find the one change that topples the rest, and make it this month.',body:'You do not fix everything at once. You find the single highest-leverage move, the first domino, and you knock it over first. Most founders feel the shift inside thirty days, because the right first move does most of the work.'},
 {t:'normal',k:'Tools, not advice',title:'A scaling CEO does not need more advice. They need tools.',body:'Advice lives and dies in your head. A framework is different: every framework you learn, you can teach, so the company starts running on a shared system instead of on you remembering to say the right thing in the right meeting.'},
 {t:'dark',title:'A framework your team can run <b>beats advice only you can remember.</b>'},
 {t:'normal',k:'Why Dave',title:'I built this in the chair before I taught it in a room.',body:'I founded three venture-backed startups, including Delivery Hero, which IPO’d in 2017. Over the last several years I have coached more than 250 venture-backed CEOs across 26 countries, whose companies have raised over seven billion dollars, and built 500-plus frameworks to help them lead with clarity. This masterclass is where that system starts.'},

 {t:'section',idx:'Your Next Step',title:'Lead Your Company Your Way'},
 {t:'normal',k:'The CEO Review',title:'Start with an honest read on how you lead today.',body:'The fastest way to find your own first domino is a clear look at where your leadership is strong and where it is quietly capping the company. That is exactly what the free CEO Review is built to give you, before you change a single thing.'},
 {t:'cta',title:'Ready to lead at scale in Founder Mode?',chips:['Take the free CEO Review','Founder Coach'],disc:'Educational content for venture-backed founder-CEOs. No specific financial, fundraising, or company result is guaranteed. Outcomes vary by company, stage, market, and execution.'},
];

const deck=document.getElementById('deck');
function grid(kind){return `<svg class="grid ${kind==='title'?'title-grid':'corner-grid'}"><use href="#schem"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Founder <b>Coach</b> · Dave Bailey</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.grid) h+=grid(s.grid);
  else if(s.t==='title') h+=grid('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
