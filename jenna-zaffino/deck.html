<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Values-Led Studio · Jenna Zaffino, Pilates Unfiltered</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400;1,700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f8f7ed; --panel:#eef0e6; --rule:#e2e3d6;
    --acc:#dda15e; --ink:#1c4036; --body:#3f5049; --dim:#8a8f83; --cream:#f8f7ed; --deep:#1c4036;
  }
  html,body{height:100%}
  body{background:#eceadd;font-family:'Raleway',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#eceadd}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'PT Serif',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.64;font-weight:400}
  .sub{font-family:'PT Serif',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#22493d 0%,#173229 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#22493d 0%,#173229 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Raleway',sans-serif;color:#e7ecdf;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:#cfe0d4;text-align:center;line-height:1.45}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(28,64,54,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Pilates Unfiltered</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The Values-Led Studio',sub:'How to grow a Pilates studio that is profitable and full of life, without running yourself into the ground.',brand:true},
 {t:'normal',k:'Who this is for',title:'You built a studio you are proud of. Somewhere in there, it started running you.',body:'You are a studio owner whose clients love the work and whose teachers are talented. And you are also the one covering the front desk, filling the last-minute gaps, and answering emails at 10pm. The studio is full, and you are running low.'},
 {t:'dark',title:'A fuller schedule will not fix a studio that is quietly running its owner into the ground.'},
 {t:'section',idx:'Part One',title:'The trap almost every studio owner falls into.'},
 {t:'normal',k:'The default advice',title:'Grow more, systemize more, until it runs without you.',body:'The usual playbook says add classes, add clients, and build enough process that the studio can run without you in the room. It is not wrong about systems. It is wrong about the order, because it treats the studio like a machine and the owner like a bottleneck to remove.'},
 {t:'normal',k:'What it costs',title:'A studio can be full and hollow at the same time.',body:'When growth comes before culture, you feel it first: teachers who clock in and drift out within a year, clients who cannot tell your studio from the one down the street, and an owner who cannot remember the last time the work felt like theirs. Systems on top of that just help a tired studio run faster.'},
 {t:'dark',title:'You did not open your studio to build a machine you would want to escape.'},
 {t:'section',idx:'Part Two',title:'Grow the studio from the inside out.'},
 {t:'normal',k:'The idea',title:'Values first. Then the team. Then the systems.',body:'A studio that lasts is built in that order. First you get clear on what your studio actually stands for. Then you build a team that owns those values with you. Only then do pricing, offers, and operations get layered on, so the systems serve the people instead of replacing them.'},
 {t:'normal',k:'Pillar 1 · Fuel your fire',title:'Get honest about what your studio is really for.',body:'Before any tactic, you and your team name the values and the vision underneath the studio. This is the work most owners skip, and it is the reason two studios with the same equipment feel completely different to walk into. Clarity here is what makes every later decision easy.'},
 {t:'normal',k:'Pillar 2 · Empower the team',title:'Give your teachers something to own, not just a shift to cover.',body:'A team aligned to real values stops behaving like staff and starts behaving like owners of their corner of the studio. You define what each person is responsible for and trusted to lead, so the studio no longer lives or dies on you being in the room.'},
 {t:'normal',k:'Pillar 3 · Price and offers that fit',title:'Charge in a way the work can actually sustain.',body:'Pricing is not a number you copy from the studio down the road. It is set from what your studio is worth and what it costs you to deliver it well. From there you shape offers that fit your studio and your clients, instead of discounting your way to a full but exhausting schedule.'},
 {t:'normal',k:'Pillar 4 · Operations that protect you',title:'Build systems in service of people, not the other way around.',body:'Now the systems earn their place: scheduling, onboarding, and the handful of processes that remove friction. Done in this order, operations protect the owner\'s energy and the team\'s time, rather than squeezing more output out of both.'},
 {t:'normal',k:'Pillar 5 · Teach without the fear',title:'The owner\'s own confidence is part of the business.',body:'A studio takes on the nervous system of the person leading it. When the owner teaches and leads from steadiness instead of scarcity, the whole team feels it, and so do the clients. Reclaiming that is not a soft extra. It is the difference between a studio you dread and one you love.'},
 {t:'section',idx:'Part Three',title:'What a values-led studio feels like.'},
 {t:'normal',k:'In practice',title:'Steady growth, a team that stays, and an owner with something left over.',body:'You still grow. Clients still come. The difference is that the growth is built on a team that stays, a brand clients can name, and an owner who has energy for their own life. The studio can run without you in the room, because you built the people first, not only the process.'},
 {t:'normal',k:'The shift',title:'From holding it all together to leading it forward.',body:'The old version of you was the glue and the backup and the bottleneck. The values-led version is the person who set the direction, trusted the team, and priced the work to sustain it. Same studio, completely different life.'},
 {t:'normal',k:'Why me',title:'I have taught the movement and lived the burnout.',body:'I have spent nearly twenty years in Pilates as a teacher and studio owner, and I burned out doing it the hard way before I rebuilt around values and team. I am a National Board Certified Health and Wellness Coach, I wrote The Movement Teacher\'s Guide to Fearless Teaching, and I host Pilates Unfiltered, where I work through the real business of this profession every week.'},
 {t:'cta',title:'Let us map your values-led studio.',body:'If this is the studio you want to build, the next step is a conversation. Book an Insight Session with me and we will look at where your studio is now and the first move toward a studio that grows without costing you yourself. This masterclass is educational. No specific business or income result is guaranteed, and results vary with your studio, your market, and the work you put in.',brand:true}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide t-' + s.t + (i === 0 ? ' active' : '');
  let html = '';
  if (s.k) html += '<div class="kicker">' + s.k + '</div>';
  if (s.idx) html += '<div class="idx">' + s.idx + '</div>';
  if (s.title) html += '<h1>' + s.title + '</h1>';
  if (s.sub) html += '<div class="sub">' + s.sub + '</div>';
  if (s.body) html += '<div class="body">' + s.body + '</div>';
  if (s.t === 'section') html += '<div class="rule"></div>';
  if (s.brand) html += '<div class="brandline">Jenna Zaffino &middot; <b>Pilates Unfiltered</b></div>';
  if (s.t === 'cta') html += '<div class="disc">Educational content. No specific business or income result is guaranteed. Results vary.</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const bar = document.getElementById('bar');
const count = document.getElementById('count');
const hint = document.getElementById('hint');
const pad = n => String(n).padStart(2, '0');
function show(n){
  cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('active', i === cur));
  bar.style.width = ((cur + 1) / slides.length * 100) + '%';
  count.textContent = pad(cur + 1) + ' / ' + pad(slides.length);
  if (cur > 0 && hint) hint.style.opacity = 0;
}
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('prev').onclick = () => show(cur - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
show(0);
</script>
</body>
</html>
