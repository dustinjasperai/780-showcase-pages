<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Relief Framework &middot; Lori Fischer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F5F1EA; --panel:#FFFFFF; --rule:#E4DED1;
    --acc:#746F86; --idx:#5B5768; --chalk:#2B2F44; --grey:#4A4653; --dim:#8C8496;
  }
  html,body{height:100%}
  body{background:#242030;font-family:'Montserrat',Arial,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#242030}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',Arial,sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Cardo',Georgia,serif;font-weight:700;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.5vw;max-width:88%}
  .t-normal h1{font-size:2.6vw;max-width:84%}
  .t-normal .body{font-family:'Montserrat',Arial,sans-serif;font-size:1.35vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-family:'Montserrat',Arial,sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.3vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:3.8vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#332E44 0%,#242030 100%);align-items:center;text-align:center}
  .t-dark h1{font-family:'Cardo',Georgia,serif;font-size:2.5vw;max-width:78%;font-style:italic;font-weight:400;color:#F2EFE8}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#332E44 0%,#242030 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.1vw;max-width:82%;color:#F2EFE8}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#EDE9F2;border-radius:100px;padding:1.3vh 1.6vw;font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Montserrat',Arial,sans-serif;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-dark .disc,.t-cta .disc{color:#9F98AC}
  .frame-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-frame{right:6%;bottom:9%;width:9vw}
  .corner-frame{right:5%;bottom:8%;width:6vw;opacity:.5}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Montserrat',sans-serif;font-size:12px;letter-spacing:.14em;color:#D2CBD9;z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Montserrat',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#D2CBD9;z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Montserrat',sans-serif;font-size:11px;color:#D2CBD9;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Staging Business School</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- frame-corner motif: an open picture-frame corner, a restrained nod to staging a room -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="framecorner" viewBox="0 0 100 100">
  <path d="M6 60 L6 6 L60 6" stroke="#746F86" stroke-width="4" fill="none" stroke-linecap="round"/>
  <path d="M94 40 L94 94 L40 94" stroke="#746F86" stroke-width="4" fill="none" stroke-linecap="round" opacity="0.55"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Relief Framework',sub:'A live masterclass for staging business owners ready to stop running every job themselves, built from Lori Fischer\'s own FIX IT Protocol.',brand:true,signal:'title'},
 {t:'normal',k:'Who this is for',title:'You can stage any house. Can the business run without you in it?',body:'You quote the job, manage the crew, and answer every client text yourself. That makes you excellent at staging. It does not make you the owner of a company yet, it makes you the most important employee inside one.'},
 {t:'dark',title:'A full calendar and a business you can leave for a week are not the same thing.'},

 {t:'section',idx:'Part One',title:'The Weight Of Being The Business'},
 {t:'normal',k:'The trap',title:'Busy every week and still the only one who can run a job.',body:'Every client relationship only you can manage, every crew decision only you can make, is a ceiling on how big this gets. Growth without a system just means you personally carrying more weight, not a company that is worth something.'},
 {t:'normal',k:'What a full schedule actually costs',title:'Revenue that requires you on every job is a job, not a company.',body:'A business that only works when you are physically in it is not a business yet, it is a very demanding job with a staging inventory attached. Something has to change before the calendar does.'},
 {t:'dark',title:'None of this makes the business bigger. It just makes you more tired inside the same size company.'},

 {t:'section',idx:'Part Two',title:'The Relief Framework'},
 {t:'normal',k:'Reclaim your finances',title:'Know what a job actually pays you before you take it.',body:'Financial clarity and profitable pricing for the staging business itself, not just the client invoice. Owners who reclaim this piece stop guessing whether a busy month was actually a profitable one.'},
 {t:'normal',k:'Refine your operations',title:'Streamline the day-to-day mechanics of running jobs and a team.',body:'The systems underneath the work, how jobs get quoted, scheduled, and run, so the business does not depend on you personally remembering every detail.'},
 {t:'normal',k:'Release to delegate',title:'Build the team systems so you are not the one on every job.',body:'Job descriptions, hiring workflows, staff handbooks, and a training library built specifically for a staging business, what Lori packages as Swipe Studio. The FIX IT Protocol is the diagnostic step before any of it: naming the real problem before prescribing the fix.'},
 {t:'dark',title:'Reclaim the finances. Refine the operations. Release to delegate. That is the whole shift.'},

 {t:'section',idx:'Part Three',title:'Inside The Room With Other Owners'},
 {t:'normal',k:'What the community is for',title:'Twice-monthly live calls, not a course you finish alone.',body:'CEO Power Sessions bring real-time problem-solving with a peer group of other staging business owners. The point is not a certificate, it is somewhere to bring the actual problem in your business that month and work through it live.'},
 {t:'normal',k:'Why Lori Fischer',title:'She ran the business herself first, then built the room she needed.',body:'Lori owns Rethink Home Interiors, a real staging company. The story she tells openly is a personal one: staying busy doing all of it herself until a quiet moment made it clear something had to change, which is what pushed her from thinking like a stager to thinking like a business owner.'},

 {t:'section',idx:'Your Next Step',title:'Bring This Into Your Business'},
 {t:'normal',k:'How it\'s delivered',title:'The Accelerate Track: curriculum, live calls, and Swipe Studio.',body:'On-demand modules built around the Relief Framework, biweekly CEO Power Sessions, and the Swipe Studio template library, taught by an owner who ran the exact shift on her own company first.'},
 {t:'normal',k:'What actually happens',title:'Work through your own business, not a generic case study.',body:'The modules are built around a real staging operation: what to charge, how to build a team that does not depend on you, and how to run the FIX IT Protocol on your own specific problem.'},

 {t:'cta',title:'Ready to reclaim, refine, and release?',chips:['Join the Accelerate Track','Staging Business School'],disc:'Educational content for staging business owners. No income or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="frame-motif ${kind==='title'?'title-frame':'corner-frame'}"><use href="#framecorner"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Staging Business School &middot; <b>Lori Fischer</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.signal) h+=motif(s.signal);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
