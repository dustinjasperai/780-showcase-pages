<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fully Booked Chair, a masterclass with Britt Seva</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4f1;
    --panel:#ffffff;
    --rule:#e4ddd6;
    --ink:#26272a;
    --muted:#5f6167;
    --accent:#cc3366;
    --accent2:#38616e;
    --head:'Playfair Display',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(38,39,42,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* motif: the chair filling up, a rising rule like a salon mirror's edge */
  .slide::before{content:'';position:absolute;top:0;left:0;height:5px;width:42%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 0 6px 0}
  .kick{font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.05;margin:0 0 18px;letter-spacing:-0.01em}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.1;margin:0 0 20px;letter-spacing:-0.01em}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:44ch}
  .lead{font-size:27px;color:var(--ink);font-family:var(--body)}
  .em{color:var(--accent);font-style:italic;font-family:var(--head)}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .big{font-family:var(--head);font-size:112px;line-height:1.0;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:2px #26272a55;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:210px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:25px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:auto}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:38px}h2{font-size:30px}.big{font-size:66px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Thriving Stylist · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Fully Booked Chair',p:'How to fill your chair with new clients from social media, without discounting, and build a book that actually pays.',pres:'With <b>Britt Seva</b>, Thriving Stylist'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why your chair still has gaps','It is almost never your skill behind the chair.'],['A feed that brings in new guests','Content built to book, not just to be liked.'],['Your first move to a full book','The loyal, higher-paying clientele that pays every month.']]},
 {t:'audience',kick:'Who this is for',h:'You are great behind the chair. The book still is not full.',p:'Stylists, booth renters and suite owners who are talented, working hard, and still have open hours they cannot explain.',who:'<b>The trap:</b> you drop your prices, chase referrals, and wait for walk-ins, and the calendar still has holes in it.'},
 {t:'reframe',kick:'The reframe',big1:'More followers.',big2:'A full <span class="em">chair</span>.',p:'A big following feels good and pays nothing. A full chair is new guests who book, come back, and refer. One is a vanity number. The other is a business.'},
 {t:'part',kick:'Part one',h:'Why the chair has gaps.'},
 {t:'point',kick:'The core problem',h:'It was never about talent.',p:'Most stylists respond to a slow week by discounting or posting more of the same. The prices drop, the effort goes up, and the new guests still do not come. Demand was the missing piece, not skill.'},
 {t:'framework',kick:'The core problem',h:'Discounting vs. demand.',row:[['Discounting','Buys a one-time visit from someone shopping on price. They rarely rebook, and they rarely refer.'],['Marketing','Builds demand from people who want you specifically. They book, they stay, and they bring friends.']],p:'A discount fills a chair for a day. A marketing system fills it for good.'},
 {t:'point',kick:'The core problem',h:'Referrals alone cannot fill a chair.',p:'Word of mouth is wonderful and it is not a plan. It arrives when it arrives. A social feed that works on purpose is the difference between hoping for new guests and booking them.'},
 {t:'part',kick:'Part two',h:'How to bring new guests in.'},
 {t:'cycle',kick:'The system',h:'The marketing funnel, in four moves.',steps:['Show the work: content that proves what you do and who it is for','Make the offer: a clear reason for a new guest to book you now','Book the first visit: an easy, obvious next step from the feed','Set up the rebook: turn the first visit into a standing client'],p:'One repeatable path from a stranger scrolling to a guest in your chair. This is a system you run, not luck you wait on.'},
 {t:'point',kick:'The craft',h:'The first few seconds decide it.',p:'A new client stops scrolling for a reason. Your content has to say who you are for and what they will walk out with, fast, before the thumb keeps moving.'},
 {t:'point',kick:'The craft',h:'Content that books, not content that trends.',p:'A trending sound gets views from people who will never sit in your chair. Content built around your work and your offer gets booked by the people who live near enough to come in.'},
 {t:'skills',kick:'The craft',h:'The pieces of a chair-filling feed.',li:[['A clear who and what','So the right local client knows this is for them.'],['Proof and offers','Before-and-afters and a reason to book now, not someday.'],['An easy way to book','The path from a post to your calendar in one tap.']]},
 {t:'part',kick:'Part three',h:'From a full chair to a business that pays.'},
 {t:'truefans',kick:'The thesis',h:'A loyal book beats a busy week.',p:'You do not need to be famous. You need a full book of clients who trust you, rebook on their way out, and refer their friends. That is what pays every month, working less, not more.',who:'<b>Principle:</b> build the clientele that comes back, not the follower count that looks big.'},
 {t:'looks',kick:'The outcome',h:'What a thriving stylist looks like.',li:[['New guests every week','From a feed that works while you are behind the chair.'],['Prices you do not apologize for','Demand lets you charge what your work is worth.'],['A book that is full months out','Income that is steady, not a good week and a slow one.']]},
 {t:'whyme',kick:'Why Britt',h:'A stylist who built it, then taught it.',li:[['From struggling stylist to seven-figure salon director','She lived the slow weeks before she solved them.'],['16,000+ stylists coached since 2012','A system proven across booth renters, suites and salons.'],['The #1 podcast for beauty pros','Millions of downloads of stylist-specific business teaching.']]},
 {t:'cta',kick:'Your next step',h:'Ready to fill your chair?',ctas:['<b>Join the Thriving Stylist Method</b> for the full marketing and retention system, workbook and coaching.','<b>Start with the free Profit Priority Playbook</b> if you want the first step today.'],disc:'This masterclass is educational. It shares frameworks and approaches for marketing a stylist business and building a clientele; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by stylist.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`+(s.who?`<div class="who">${s.who}</div>`:'')}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
