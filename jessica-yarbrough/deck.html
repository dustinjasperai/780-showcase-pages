<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Ultra-High-End Offer - A Masterclass with Jessica Yarbrough</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#121418;        /* charcoal ground, derived from her dark site scheme (#000/#2b333f), not the retired #14202E */
    --panel:#1c1f26;
    --rule:#2b2f38;
    --ink:#f4efe6;
    --muted:#9aa0ab;
    --accent:#ccb898;    /* champagne gold, verbatim from brand.json (uses=11) */
    --head:'Montserrat',system-ui,sans-serif;
    --body:'PT Serif',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px}
  .slide{
    background:linear-gradient(180deg,#14171d 0%,var(--bg) 100%);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:56px 56px;
    margin:0 0 28px;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .slide::before{content:"";position:absolute;left:56px;top:40px;width:46px;height:2px;background:var(--accent)}
  .eyebrow{font-family:var(--head);font-weight:600;letter-spacing:.18em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);font-style:italic;margin-bottom:10px}
  p.lead{font-size:20px;margin-bottom:14px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;padding:10px 0 10px 26px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:8px;height:8px;background:var(--accent);border-radius:50%}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.12;color:var(--ink)}
  .big .hl{color:var(--accent)}
  .divider .eyebrow{font-size:13px}
  .divider h1{color:var(--accent)}
  .foot{position:absolute;right:56px;bottom:28px;font-family:var(--head);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
  .disclaimer{margin-top:22px;font-size:13px;color:var(--muted);font-style:italic}
  .cta-line{font-family:var(--head);font-weight:600;font-size:20px;color:var(--accent);margin-top:14px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Jessica Yarbrough',h1:'The Ultra-High-End Offer',sub:'How experts command $25K to $100K+ without working more'},
  {t:'who',eyebrow:'Who this is for',h2:'For the coach or consultant whose income does not reflect the value they create',lead:'You are brilliant at the work. You deliver real transformation. And yet the number on your invoice keeps you feeling like you run a job, not a business.'},
  {t:'trap',eyebrow:'The trap',h2:'You were told to lower your price, launch more, and add more funnels',lead:'So you got busier. More offers, more content, more hours. And the income still does not match the value you bring to the table.'},
  {t:'reframe',eyebrow:'The reframe',big:'You are not too expensive. You are <span class="hl">under-positioned.</span>'},
  {t:'promise',eyebrow:'In the next 60 minutes',h2:'What you will walk away with',list:['Why premium buyers pay for certainty, not hours','How to codify your genius into an ownable system','The structure of an ultra-high-end offer','The mindset that lets you say your price without flinching']},
  {t:'divider',eyebrow:'Part One',h1:'The real problem'},
  {t:'content',eyebrow:'Problem one',h2:'Expertise is not an offer',lead:'Knowing a great deal is not the same as having something people can buy at a premium. Scattered brilliance feels risky to a buyer. A system feels safe, and safe is what commands top dollar.'},
  {t:'content',eyebrow:'Problem two',h2:'Trading hours caps you',lead:'If the only way to earn more is to work more, you have built a ceiling, not a business. There are only so many hours, and the best experts refuse to sell them one at a time.'},
  {t:'content',eyebrow:'Problem three',h2:'Discounting signals doubt',lead:'Every discount quietly tells the buyer you are not sure it is worth it. Premium positioning does the opposite. It removes the question before it is ever asked.'},
  {t:'divider',eyebrow:'Part Two',h1:'The Expert Accelerator Method'},
  {t:'pillar',eyebrow:'Pillar one',h2:'Codify your genius',lead:'Turn the way you get results into a named, repeatable method you own. When your process has a shape and a name, it stops being advice and starts being intellectual property.'},
  {t:'pillar',eyebrow:'Pillar two',h2:'Package the ultra-high-end offer',lead:'Build the offer so the value is unmistakable, then price it where it belongs. This is where $25K, $50K, and $100K+ programs come from, structure first, number second.'},
  {t:'pillar',eyebrow:'Pillar three',h2:'Position as the go-to expert',lead:'Elevate how you show up so that in your niche you are the obvious choice. When positioning is right, price resistance drops before the conversation even begins.'},
  {t:'pillar',eyebrow:'Pillar four',h2:'Master the sale',lead:'We teach people our value, because no one is ever going to volunteer and ask if they can pay you more. The premium sale is a calm conversation about outcomes, not a pitch.'},
  {t:'divider',eyebrow:'Part Three',h1:'The business you actually want'},
  {t:'content',eyebrow:'Scale',h2:'From solopreneur to CEO',lead:'Once the method is codified and the offer is premium, you can scale it one to many, with a small team and high-end group programs, instead of carrying every client on your own back.'},
  {t:'content',eyebrow:'The point',h2:'Make more while working less',lead:'This is the whole aim. Design the business around the life you actually want, with fewer clients, deeper work, and an income that finally reflects the value you create.'},
  {t:'why',eyebrow:'Why listen to me',h2:'Jessica Yarbrough',lead:'I started over as a single mother and built an international consulting business helping coaches and consultants sell and scale ultra-high-end services. I share this work every week on the Scaling Coaches and Consultants podcast.'},
  {t:'recap',eyebrow:'The recap',h2:'The path, in one line',list:['Codify your genius into a system','Package it as an ultra-high-end offer','Position so premium feels obvious','Sell it as a calm outcome conversation']},
  {t:'cta',eyebrow:'Your next step',h2:'Ready to build your ultra-high-end offer?',cta:'Book a strategy call and we will map your Expert Accelerator path together.',disclaimer:'This masterclass is educational. It is not a guarantee of income or results. Outcomes vary and depend on your work, your market, and your execution.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='divider'?' divider':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.cta) h+='<div class="cta-line">'+s.cta+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="foot">Expert Accelerator &middot; '+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
