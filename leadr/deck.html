<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The One Talk — a masterclass by Leadr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Lora:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#17110B;
  --panel:#23190F;
  --rule:#3A2A18;
  --accent:#fb5718;
  --ink:#F4ECE3;
  --muted:#C6B7A6;
  --head:'Lora',Georgia,serif;
  --body:'Montserrat',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
.deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
.slide{position:relative;background:linear-gradient(180deg,var(--panel),#1b130c);border:1px solid var(--rule);border-radius:18px;padding:64px 64px;margin:26px 0;min-height:520px;display:flex;flex-direction:column;justify-content:center;overflow:hidden}
.slide::before{content:"";position:absolute;top:-140px;right:-120px;width:360px;height:360px;background:radial-gradient(circle,rgba(251,87,24,.22),transparent 62%);pointer-events:none}
.spot{position:absolute;left:0;top:0;width:6px;height:100%;background:linear-gradient(180deg,var(--accent),transparent)}
.kick{font-size:14px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.05;letter-spacing:-.01em}
h2{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.01em}
.sub{font-size:23px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:44ch}
.big{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.12}
.big .a{color:var(--accent);font-style:italic}
ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
li{font-size:22px;line-height:1.45;padding-left:38px;position:relative;color:var(--ink)}
li::before{content:"";position:absolute;left:0;top:9px;width:16px;height:16px;border-radius:5px;border:2px solid var(--accent)}
.num{font-family:var(--head);font-size:26px;color:var(--accent);font-weight:700;margin-bottom:14px}
.note{margin-top:26px;font-size:18px;color:var(--muted);line-height:1.5;max-width:52ch}
.presenter{margin-top:40px;font-size:18px;color:var(--muted);letter-spacing:.02em}
.presenter b{color:var(--ink);font-weight:600}
.part .kick{color:var(--muted)}
.part h2{font-size:52px}
.part .pnum{font-family:var(--head);font-size:110px;font-weight:700;color:rgba(251,87,24,.28);line-height:1}
.cta-slide{align-items:flex-start}
.cta-box{margin-top:24px;font-size:22px;color:var(--ink);line-height:1.5}
.cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#1a1109;font-weight:700;font-size:20px;padding:16px 30px;border-radius:100px;letter-spacing:.01em}
.disc{margin-top:34px;font-size:14px;color:#9d8f7f;line-height:1.55;max-width:60ch}
.stat{display:flex;gap:40px;margin-top:34px;flex-wrap:wrap}
.stat div{min-width:140px}
.stat .n{font-family:var(--head);font-size:46px;color:var(--accent);font-weight:700}
.stat .l{font-size:15px;color:var(--muted);letter-spacing:.04em;margin-top:6px;text-transform:uppercase}
.foot{max-width:960px;margin:0 auto;padding:0 20px 60px;color:#7d7161;font-size:13px;text-align:center}
@media(max-width:640px){.slide{padding:40px 28px;min-height:auto}h1{font-size:40px}h2{font-size:32px}.big{font-size:34px}.part .pnum{font-size:72px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">The One Talk. A masterclass by Leadr (leadr.co).</div>
<script>
const S = [
  {t:'title', kick:'A Leadr masterclass', title:'The One Talk', sub:'How to land and deliver a TEDx-style talk that launches a movement, a career, and a message that outlives the room.', presenter:'Taylor Conroy, founder of Leadr. 4x TEDx speaker.'},
  {t:'promise', kick:'What you will walk away with', title:'By the end of this hour', bullets:['A clear read on whether your idea is talk-worthy, and how to sharpen it until it is','The exact way stages decide who gets accepted, and how to get on the right side of that','A simple structure for a talk people remember and share long after you leave the stage']},
  {t:'who', kick:'Who this is for', title:'You have a message. You are tired of waiting to be picked.', bullets:['Coaches, founders, and experts who know they have something worth saying','Aspiring professional and motivational speakers ready for a real stage','Change-makers who want one talk to do the work a hundred cold pitches cannot']},
  {t:'trap', kick:'The trap', title:'The pitch-and-pray treadmill', sub:'Most people with a great message spend years chasing small gigs, sending cold pitches, and hoping someone hands them a microphone. The effort is real. The leverage is not.', note:'More pitching does not compound. One talk on the right stage does.'},
  {t:'reframe', kick:'The reframe', big:'You do not have a visibility problem. You have a <span class="a">stage</span> problem.', note:'Visibility is downstream of one thing: standing on a stage big enough that the right idea travels on its own.'},
  {t:'part', kick:'Part One', pnum:'01', title:'Why one talk beats a hundred pitches'},
  {t:'content', kick:'The leverage', title:'A talk is a permanent asset', bullets:['A pitch disappears the moment it is ignored. A talk keeps working for years','One recorded talk becomes the proof, the reach, and the credibility for everything after it','The stage borrows an audience that already trusts the room, and lends that trust to you']},
  {t:'content', kick:'The real reason', title:'Why most talks get rejected', sub:'It is rarely the speaker. It is the idea. Stages do not book topics, they book one clear idea worth spreading, framed so a curator can picture the room leaning in.', note:'Fix the idea first. Everything downstream gets easier.'},
  {t:'part', kick:'Part Two', pnum:'02', title:'The STAGE method: a 3-step blueprint'},
  {t:'pillar', num:'Step 1', title:'Find the one idea worth spreading', sub:'Not your whole story. The single idea inside it that changes how people see something. We pressure-test it until it is sharp enough to survive a stranger repeating it.', note:'One idea, one sentence, one shift in the listener.'},
  {t:'pillar', num:'Step 2', title:'Land the stage', sub:'The application that gets accepted is a craft, not a lottery. You learn how curators actually choose, how to position your idea for their audience, and how to apply in a way that makes yes the easy answer.', note:'Get on the right side of how stages decide.'},
  {t:'pillar', num:'Step 3', title:'Deliver the talk that launches a movement', sub:'A structured talk built around the most impactful moments of your story, held tightly to the one message, delivered so the room feels it and remembers it.', note:'Structure carries the nerves. The message carries the room.'},
  {t:'content', kick:'Talk writing', title:'Structure over stagecraft', sub:'The most transformative talks are not the most polished performances. They are the best-built ones: a spine strong enough that you could give the talk before you feel ready, because the structure does the heavy lifting.', note:'We write the talk first, then let your voice fill it in.'},
  {t:'content', kick:'Talk marketing', title:'One talk, a whole speaking business', bullets:['A single talk becomes the top of a funnel: media, paid gigs, a book, a program','You repurpose the talk into content that keeps introducing you to new rooms','The stage stops being the finish line and becomes the engine of what comes next']},
  {t:'part', kick:'Part Three', pnum:'03', title:'From one talk to a speaking career'},
  {t:'content', kick:'The arc', title:'From idea to the stage to a career', sub:'The path is repeatable: sharpen the idea, land the stage, deliver the talk, then turn that one moment into the foundation of a speaking business. Each step makes the next one lighter.', note:'This is a method you can run again for every idea you carry.'},
  {t:'why', kick:'Why learn this here', title:'Built from stages, not theory', stat:[['4x','TEDx talks delivered'],['1,000+','stages booked by our people'],['100M+','talk views'],['30M+','lives impacted']], note:'Leadr exists to help people with a message worth sharing get it in front of the world. These are our documented numbers, and the method behind them is what this masterclass teaches.'},
  {t:'content', kick:'You are not doing it alone', title:'A room that practices with you', sub:'Inside the Leadr community you rehearse with other serious speakers every week, get your talk seen before it is on the big stage, and stop guessing whether it lands.', note:'Practice in a room that tells you the truth.'},
  {t:'recap', kick:'The whole thing in one breath', title:'Find the idea. Land the stage. Deliver the talk.', bullets:['Find the one idea worth spreading','Land the stage with an application that gets accepted','Deliver a talk that launches a movement, then build a career on it']},
  {t:'cta', kick:'Your next step', title:'Ready to land your talk?', ctahtml:'If you have a message worth sharing and you are ready to get it on the world’s biggest stage, the STAGE Accelerator is where we do this together, start to finish.', btn:'Apply at leadr.co', disc:'This masterclass is educational. No specific result, booking, or income is guaranteed. Results vary and depend on your idea, your effort, and your execution.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck=document.getElementById('deck');
for(const s of S){
  const sl=el('section','slide'+(s.t==='part'?' part':'')+(s.t==='cta'?' cta-slide':''));
  sl.appendChild(el('div','spot'));
  if(s.t==='part'){
    if(s.kick)sl.appendChild(el('div','kick',s.kick));
    sl.appendChild(el('div','pnum',s.pnum));
    sl.appendChild(el('h2',null,s.title));
    deck.appendChild(sl);continue;
  }
  if(s.kick)sl.appendChild(el('div','kick',s.kick));
  if(s.num)sl.appendChild(el('div','num',s.num));
  if(s.big){sl.appendChild(el('div','big',s.big));}
  else if(s.t==='title'){sl.appendChild(el('h1',null,s.title));}
  else if(s.title){sl.appendChild(el('h2',null,s.title));}
  if(s.sub)sl.appendChild(el('div','sub',s.sub));
  if(s.stat){const st=el('div','stat');for(const [n,l] of s.stat){const d=el('div');d.appendChild(el('div','n',n));d.appendChild(el('div','l',l));st.appendChild(d);}sl.appendChild(st);}
  if(s.bullets){const ul=el('ul');for(const b of s.bullets)ul.appendChild(el('li',null,b));sl.appendChild(ul);}
  if(s.ctahtml)sl.appendChild(el('div','cta-box',s.ctahtml));
  if(s.btn)sl.appendChild(el('div','cta-btn',s.btn));
  if(s.presenter)sl.appendChild(el('div','presenter',s.presenter));
  if(s.note)sl.appendChild(el('div','note',s.note));
  if(s.disc)sl.appendChild(el('div','disc',s.disc));
  deck.appendChild(sl);
}
</script>
</body>
</html>
