<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Happy Campers at Home | A Masterclass with Audrey Monke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffaf2; --panel:#fff3e0; --rule:#e8dcc7; --ink:#2b2320;
    --muted:#6b5f55; --accent:#f96100; --blue:#2f7bb0;
    --display:'Playfair Display',Georgia,serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:0 0 22px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
  .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:16px}
  .kick.blue{color:var(--blue)}
  h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.04;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1;margin-bottom:16px}
  h3{font-family:var(--display);font-weight:700;font-size:26px;margin-bottom:10px}
  p{font-size:20px;line-height:1.55;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.lead{font-size:23px;color:var(--muted)}
  .big{font-family:var(--display);font-size:34px;line-height:1.18;font-weight:700;max-width:24ch}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 40px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:6px;top:20px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li b{font-weight:700}
  .num{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;
    background:var(--panel);color:var(--accent);font-weight:700;font-family:var(--display);margin-right:12px;border:1px solid var(--rule)}
  .presenter{margin-top:26px;font-size:17px;color:var(--muted)}
  .presenter b{color:var(--ink)}
  .tag{display:inline-block;background:var(--panel);border:1px solid var(--rule);border-radius:999px;
    padding:7px 16px;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:18px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:66ch;line-height:1.5}
  .strike{text-decoration:line-through;color:var(--muted)}
  .pageno{position:absolute;right:22px;bottom:16px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:36px}h2{font-size:28px}.big{font-size:26px}p{font-size:18px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* All masterclass copy lives inside const S (the coach's own masterclass to her parent audience). */
const S = [
  {t:'title',
    kick:'A live masterclass with Audrey Monke',
    h:'Happy Campers at Home',
    lead:'How to raise kids who thrive the way they do at camp, using 9 research backed secrets you can start this week.',
    presenter:'Audrey Monke, summer camp owner and director for 39 years, author of Happy Campers, mom of five.'},

  {t:'who',
    kick:'Who this is for',
    h:'You have seen your kid at their best.',
    body:['At camp. At a friend&rsquo;s house. On a team. Somewhere out there is a version of your child who is kind, capable, and genuinely happy.',
          'This hour is for the parent who wants that same kid to show up at home, and is tired of being told it comes down to stricter rules.']},

  {t:'trap',
    kick:'The trap',
    h:'More rules. More consequences. More screen limits.',
    body:['You have tried all of it. And the house still feels like a negotiation, a lecture, or a standoff more often than you want to admit.',
          'The harder you push for better behavior, the more connection quietly leaks out of the relationship.']},

  {t:'reframe',
    kick:'The reframe',
    big:'The problem was never your kid. It is the culture your kid is living in, and culture is something you can build on purpose.'},

  {t:'why',
    kick:'Why camp works',
    h:'It is not the lake.',
    body:['In 39 years and tens of thousands of kids, I watched the same transformation happen every summer. Shy kids find their people. Homesick kids find their grit. Kids become their best selves.',
          'It is not the setting. It is a deliberate culture of connection, belonging, and responsibility. That culture can be recreated in a kitchen just as well as a cabin.']},

  {t:'part',
    kick:'Part one',
    h:'The core problem: we lead with correction.',
    body:['Most parenting runs on catching what is wrong. Camp runs on catching what is right.',
          'When correction comes before connection, kids stop hearing the lesson and start defending themselves. The order is the whole game.']},

  {t:'contrast',
    kick:'Connection first',
    body:['Camp does not start with',
          'STRIKE:discipline.',
          'It starts with connection, and discipline gets dramatically easier once a kid feels seen.']},

  {t:'part',
    kick:'Part two',
    h:'The 9 Summer Camp Secrets',
    lead:'The research backed practices that build a thriving culture at home. We will walk through all nine, and leave you with the one to start this week.'},

  {t:'secrets',
    kick:'Secrets 1 to 3',
    items:[['1','<b>Connection comes first.</b> Relationship before correction, every time.'],
           ['2','<b>Catch them doing something right.</b> Reinforce the behavior you want to see more of.'],
           ['3','<b>Positive practices produce optimistic kids.</b> Small daily rituals train the way kids see the world.']]},

  {t:'secrets',
    kick:'Secrets 4 to 6',
    items:[['4','<b>All kids can be more independent.</b> Even the clingy homebody, with the right scaffolding.'],
           ['5','<b>Grit grows outside the comfort zone.</b> Stretch, struggle, and recovery are how resilience is built.'],
           ['6','<b>Kids are more capable than we think.</b> Hand them real responsibility and watch them rise to it.']]},

  {t:'secrets',
    kick:'Secrets 7 to 9',
    items:[['7','<b>Kids thrive with structure.</b> Predictable routines and clear expectations create safety.'],
           ['8','<b>Make it cool to be kind.</b> Build a family culture where kindness is the norm, not the exception.'],
           ['9','<b>Coach kids to better friendships.</b> See yourself as their Friendship Skills Coach.']]},

  {t:'friendship',
    kick:'The secret under the secrets',
    h:'You are their Friendship Skills Coach.',
    body:['The single biggest predictor of a happy, successful life is the ability to form good relationships. It is also the most coachable skill there is.',
          'Through reflection, conversation, and a little role play, you can teach self regulation, empathy, and how to be a good friend, the same way camp counselors do it every day.']},

  {t:'part',
    kick:'Part three',
    h:'What this looks like at home',
    body:['None of this is a program you bolt on at 8pm. It is a handful of small shifts woven into the week you already have.',
          'One question at dinner. One responsibility handed over. One moment of connection before the correction. That is where thriving starts.']},

  {t:'week',
    kick:'A week of small shifts',
    items:[['','<b>Monday.</b> Ask one Question for Connection at dinner and just listen.'],
           ['','<b>Wednesday.</b> Catch your kid doing something right, out loud.'],
           ['','<b>Friday.</b> Hand over one job you usually do for them.'],
           ['','<b>Sunday.</b> A five minute family check in. What went well, what is next.']]},

  {t:'whyme',
    kick:'Why listen to me',
    h:'Audrey Monke',
    body:['39 years as a summer camp owner and director. Author of Happy Campers: 9 Summer Camp Secrets for Raising Kids Who Become Thriving Adults. Host of the Sunshine Parenting podcast.',
          'Mom of five adult kids, now a grandmother. I have tested every one of these secrets at camp and at my own kitchen table.']},

  {t:'start',
    kick:'Where to start',
    big:'Start with Secret #1 this week. Connection before correction. Everything else gets easier from there.'},

  {t:'cta',
    kick:'Your next step',
    h:'Work with me to make it stick.',
    body:['If you want help applying the 9 secrets to your own family&rsquo;s specific challenges, that is exactly what my Raise Thriving Kids coaching is for.',
          'Bring your real situation. We will build the plan together.'],
    cta:'Learn more at sunshine-parenting.com',
    disc:'Educational content only. Every child and family is different and individual results vary. Nothing here is a guaranteed outcome, and this is not a substitute for professional or medical advice.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function body(arr){var f=document.createDocumentFragment();arr.forEach(function(t){
  if(t.indexOf('STRIKE:')===0){f.appendChild(el('p','big','<span class="strike">'+t.slice(7)+'</span>'));}
  else{f.appendChild(el('p',null,t));}
});return f;}

const deck=document.getElementById('deck');
S.forEach(function(s,i){
  var sl=el('div','slide');
  if(s.kick)sl.appendChild(el('div','kick'+(s.t==='friendship'?' blue':''),s.kick));
  if(s.tag)sl.appendChild(el('span','tag',s.tag));
  if(s.h)sl.appendChild(el(i===0?'h1':'h2',null,s.h));
  if(s.lead)sl.appendChild(el('p','lead',s.lead));
  if(s.big)sl.appendChild(el('div','big',s.big));
  if(s.body)sl.appendChild(body(s.body));
  if(s.items){var ul=el('ul');s.items.forEach(function(it){
    var li=el('li');if(it[0])li.innerHTML='<span class="num">'+it[0]+'</span>'+it[1];else li.innerHTML=it[1];
    ul.appendChild(li);});sl.appendChild(ul);}
  if(s.presenter)sl.appendChild(el('div','presenter',s.presenter));
  if(s.cta)sl.appendChild(el('p','lead','<b style="color:var(--accent)">'+s.cta+'</b>'));
  if(s.disc)sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','pageno',(i+1)+' / '+S.length));
  deck.appendChild(sl);
});
</script>
</body>
</html>
