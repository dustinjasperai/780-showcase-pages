<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Wealthy Woman Method · Rebecca Barr</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F6EEE7; --panel:#FBF6F1; --rule:#E4D5CB;
    --accent:#AD8A46; --ink:#2E1F2B; --soft:#5F5058; --dim:#9A8B84;
  }
  html,body{height:100%}
  body{background:#EDE2D8;font-family:'Hanken Grotesk',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDE2D8}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Hanken Grotesk',sans-serif;font-size:1.06vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:5.6vw;font-weight:600}
  .t-title h1 b{color:var(--accent);font-weight:700;font-style:italic}
  .t-normal h1{font-size:3.6vw;max-width:92%;font-weight:600}
  .t-normal h1 b{color:var(--accent);font-weight:600;font-style:italic}
  .t-normal .body{font-family:'Hanken Grotesk',sans-serif;font-size:1.4vw;color:var(--soft);margin-top:2.6vh;max-width:80%;line-height:1.66;font-weight:400}
  .sub{font-family:'Hanken Grotesk',sans-serif;font-size:1.62vw;color:var(--soft);margin-top:3.2vh;max-width:82%;line-height:1.56;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Hanken Grotesk',sans-serif;font-size:1.2vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%;font-weight:600}
  .t-section .rule{width:15vw;height:2.5px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#3A2836 0%,#241722 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:90%;color:#F6EEE7;font-weight:500}
  .t-dark h1 b{color:var(--accent);font-style:italic}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#3A2836 0%,#241722 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:88%;color:#F6EEE7;font-weight:600}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Hanken Grotesk',sans-serif;border:1.6px solid var(--accent);color:#E9C888;border-radius:100px;padding:1.3vh 1.9vw;font-size:1.16vw;font-weight:500;letter-spacing:.02em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:#C9B49E;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .wealth-motif{position:absolute;pointer-events:none;opacity:.95}
  .title-w{right:6%;bottom:8%;width:28vw;opacity:.9}
  .corner-w{right:6%;bottom:7.4%;width:11vw;opacity:.5}
  .brandline{font-family:'Hanken Grotesk',sans-serif;font-size:1.24vw;color:var(--soft);margin-top:3.4vh;font-weight:500;letter-spacing:.03em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(173,138,70,.16);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.7vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">The Wealthy Woman</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a line that dips, then climbs and settles onto a higher, level plateau (a money set-point reset upward and held) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="wealth" viewBox="0 0 280 200">
  <g fill="none" stroke="#AD8A46" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="20" y1="158" x2="262" y2="158" opacity="0.26"/>
    <path d="M28 118 C 64 120, 78 150, 116 148 S 176 84, 250 72" opacity="0.85"/>
    <line x1="150" y1="72" x2="252" y2="72" stroke-dasharray="3 8" opacity="0.42"/>
    <circle cx="250" cy="72" r="8" fill="#AD8A46" stroke="none" opacity="0.95"/>
    <circle cx="250" cy="72" r="18" opacity="0.5"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Wealthy Woman <b>Method</b>',sub:'A live masterclass on why purpose-led women make good money then quietly repel it, and how to reset the money set-point so it finally stays.',brand:true,w:'title'},
 {t:'normal',k:'Who this is for',title:'You make good money. It just never seems to <b>stay</b>.',body:'You have built something real. The clients come, the launches work, the numbers look fine on a good month. And still, somehow, it slips: you undercharge, you over-deliver, you spend it down, you flinch every time it starts to build. You are not bad with money. You have a pattern with it, and the pattern is louder than the strategy.'},
 {t:'dark',title:'This was never a strategy problem. It is a <b>set-point</b> problem.'},

 {t:'section',idx:'Part One',title:'Why The Money Never Sticks'},
 {t:'normal',k:'The good-girl pattern',title:'You were trained to be <b>good</b>, not wealthy.',body:'Be helpful. Do not ask for too much. Do not be greedy, or difficult, or full of yourself. Most heart-led women were raised on some version of it, and it hardens into the way you price, the way you discount before anyone asks, the way you give one more thing away for free. Good-girl conditioning feels like kindness. It reads, on your bank balance, as a ceiling.'},
 {t:'normal',k:'The money wound',title:'Underneath the pattern is an old <b>wound</b>.',body:'For a lot of us money got tangled up early with fear, shame, or not-enough, long before we ran a business. So the body learns that money is not safe, and it protects you the only way it knows: it keeps you small. I know this one from the inside. I was a self-made property millionaire by twenty-five, and I walked away from most of it, because some part of me did not believe I was allowed to hold it.'},
 {t:'dark',title:'You were taught how to <b>earn</b> it. Nobody taught you how to keep it.'},

 {t:'section',idx:'Part Two',title:'The Method: Make It, Hold It, Receive It'},
 {t:'normal',k:'The method',title:'Wealth is built in that <b>order</b>, and most women skip two.',body:'The Wealthy Woman Method has three moves, and they are sequential. Make it, with grounded strategy instead of more hustle. Hold it, by clearing the patterns that spend it back down. Receive it, by resetting the set-point underneath so a bigger number stops feeling dangerous. Most women pour everything into the first move and wonder why the money still runs through their hands. The keeping is a separate skill, and it can be taught.'},
 {t:'normal',k:'Move one',title:'<b>Make it</b>: strategy built on ease, not on grind.',body:'This is the part the internet obsesses over, so we handle it cleanly and move on. Clear offer, aligned pricing, a way to be seen by the right women. Growth that runs on strategy and energy instead of white-knuckle hustle, because a business that costs you yourself to run is one more thing you will unconsciously sabotage. Make it in a way you would actually want to keep.'},
 {t:'normal',k:'Move two',title:'<b>Hold it</b>: clear the patterns that spend it back down.',body:'This is where the good-girl programming gets undone. We look at where you undercharge, over-give, avoid the money conversation, or quietly self-sabotage right as things take off, and we clear it. Boundaries stop being scary. Your prices start matching your value. The leaks close, and for the first time the money you make is money you get to keep.'},
 {t:'normal',k:'Move three',title:'<b>Receive it</b>: reset the set-point at the root.',body:'Every woman has an internal number she believes she is allowed to have, and she will unconsciously drift back to it, up or down. This is the deepest work and the reason the results last. Using Human Design, EFT and hypnosis, we reset that set-point at the subconscious level, so holding more money stops triggering the old alarm and starts feeling like home. This is what activating your inner wealthy woman actually means.'},
 {t:'normal',k:'The identity',title:'A wealthy woman is someone you get to <b>become</b>.',body:'You do not scale your way there by working like a man and hoping the feeling catches up. You become the woman who feels safe being seen, safe being paid well, safe being wealthy, and the strategy finally has somewhere solid to land. Money follows identity. Change who is holding the business, and what the business can hold changes with her.'},
 {t:'dark',title:'Make it. Hold it. Receive it. In <b>that</b> order.'},

 {t:'section',idx:'Part Three',title:'What Changes When The Set-Point Holds'},
 {t:'normal',k:'The shift',title:'Same business. A different relationship with <b>money</b>.',body:'Nothing has to change about your market or your offer. What changes is you. You price without apologising, you stop flinching when the account grows, you let the good month be the new normal instead of a fluke you brace against. The income stops spiking and crashing and starts building, because the woman holding it finally believes she is allowed to.'},
 {t:'normal',k:'Why me',title:'I made it, lost it, and learned how to <b>keep</b> it.',body:'I am Rebecca Barr, The Femalepreneur Coach and founder of The Wealthy Woman Company. Self-made property millionaire by twenty-five, then I walked away from nearly all of it, and had to understand exactly why before I built it back on purpose. I wrote the best-selling Good Girl's Guide to Money Making, I host The Wealthy Woman Podcast, and I am a mother of six. This is not theory I read. It is the work I had to do myself.'},
 {t:'dark',title:'Wealth that stays is a <b>skill</b>. Which means it is learnable.'},

 {t:'section',idx:'Your next step',title:'Become The Woman Who Holds It'},
 {t:'normal',k:'Where this goes',title:'The method, worked into <b>your</b> money and your business.',body:'This masterclass is the map. Inside my world, in the Wealthy Woman mastermind and the Wealth Activation work, we take it into your real numbers and your real patterns, move by move, until making it, holding it and receiving it are simply how you operate. That is where an hour of clarity turns into a set-point that holds for good.'},
 {t:'cta',title:'Ready to make money you actually get to keep?',chips:['Join the Wealthy Woman world','Start with Wealth Activation'],disc:'Educational content for women in business. No specific income, financial, or business result is guaranteed. Results vary by situation, effort, and circumstance.'},
];

const deck=document.getElementById('deck');
function wealth(kind){return `<svg class="wealth-motif ${kind==='title'?'title-w':'corner-w'}"><use href="#wealth"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Rebecca Barr · <b>The Wealthy Woman</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.w) h+=wealth(s.w);
  else if(s.t==='title') h+=wealth('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
