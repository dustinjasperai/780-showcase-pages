<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Embodied Teacher — a masterclass with Tammy Mittell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f5f0;
  --panel:#efe9dc;
  --rule:#ddd6c8;
  --ink:#2b2b2b;
  --accent:#003027;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Raleway',sans-serif;-webkit-font-smoothing:antialiased}
.deck{max-width:1040px;margin:0 auto}
.slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 7vw;position:relative;border-bottom:1px solid var(--rule)}
.kick{font-size:14px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:26px}
h1{font-family:'Crimson Text',Georgia,serif;font-weight:700;font-size:clamp(40px,6.4vw,74px);line-height:1.04;letter-spacing:-.01em;color:var(--ink)}
h1 em{font-style:italic;color:var(--accent)}
h2{font-family:'Crimson Text',Georgia,serif;font-weight:700;font-size:clamp(30px,4.6vw,50px);line-height:1.1;color:var(--ink)}
h2 em{font-style:italic;color:var(--accent)}
p{font-size:clamp(18px,2.1vw,23px);line-height:1.62;max-width:40ch;margin-top:24px;color:#43433f}
p.lead{font-size:clamp(20px,2.5vw,27px);color:var(--ink);max-width:34ch}
.big{font-family:'Crimson Text',Georgia,serif;font-size:clamp(34px,5vw,58px);line-height:1.12;color:var(--ink);max-width:22ch}
.big em{font-style:italic;color:var(--accent)}
ul{margin-top:28px;list-style:none;max-width:40ch}
li{font-size:clamp(17px,2vw,22px);line-height:1.5;padding-left:30px;position:relative;margin-bottom:18px;color:#43433f}
li::before{content:"";position:absolute;left:0;top:13px;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}
.part .num{font-family:'Crimson Text',serif;font-size:clamp(70px,12vw,150px);line-height:.8;color:var(--accent);opacity:.18;font-weight:700}
.pillar-name{font-family:'Crimson Text',serif;font-style:italic;color:var(--accent)}
.grid{display:flex;gap:22px;margin-top:34px;flex-wrap:wrap}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 24px;flex:1;min-width:220px}
.card .t{font-family:'Crimson Text',serif;font-weight:700;font-size:26px;color:var(--ink)}
.card .h{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.card .d{font-size:16px;line-height:1.5;color:#54544f;margin-top:10px}
.leaf{position:absolute;right:6vw;bottom:8vh;opacity:.5}
.foot{position:absolute;left:7vw;bottom:5vh;font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:#9a968b;font-weight:600}
.cta-box{margin-top:30px;display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:19px;padding:17px 34px;border-radius:100px;letter-spacing:.01em}
.disc{margin-top:34px;font-size:13px;line-height:1.6;color:#8d897e;max-width:52ch}
.nav{position:fixed;right:18px;bottom:18px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:#9a968b;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px;font-weight:700}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const LEAF = '<svg class="leaf" width="90" height="120" viewBox="0 0 90 120" fill="none"><path d="M45 115 C45 70 10 55 10 25 C40 35 45 60 45 60 C45 60 50 35 80 25 C80 55 45 70 45 115 Z" stroke="#003027" stroke-width="1.5" fill="none" opacity="0.6"/><path d="M45 115 L45 40" stroke="#003027" stroke-width="1.2" opacity="0.5"/></svg>';
const S = [
  {t:'title', kick:'A live masterclass for aspiring yoga teachers', h:'The <em>Embodied</em> Teacher', p:'How to train as a yoga teacher women trust, through every stage of life.'},
  {t:'who', kick:'Who this is for', big:'You have a deep <em>practice</em>. You feel the pull to teach. You are not sure a certificate makes you ready.'},
  {t:'trap', kick:'The honest part', h:'You did the hours.', p:'You learned the poses, the Sanskrit, the anatomy sheets. And still, the thought of standing at the front of a real room, reading real bodies, can make you freeze.'},
  {t:'reframe', kick:'The reframe', big:'A 200 hour certificate is proof you <em>attended</em>. It is not yet the skill of holding a room.'},
  {t:'part', part:true, num:'One', h:'The gap most trainings leave'},
  {t:'point', kick:'Shapes vs. bodies', h:'Most trainings teach <em>sequences</em>.', p:'They teach you the shapes and the order. Far fewer teach you to read a living, breathing, nervous body in front of you, and to adjust in the moment.'},
  {t:'point', kick:'Where it matters most', h:'And then a woman walks in <em>pregnant</em>.', p:'Or postnatal. Or in a phase her body has never been in before. The exact moment a student most needs a skilled teacher is the moment most trainings go quiet.'},
  {t:'part', part:true, num:'Two', h:'Body. Breath. Heart. Soul.'},
  {t:'point', kick:'The frame I teach', h:'Four <em>layers</em>, taught as one.', p:'A complete teacher works with all four at once. Here is what each one asks of you.'},
  {t:'pillar', kick:'Layer one', h:'<span class="pillar-name">Embodiment</span>, the Body', p:'Being embodied means feeling present, safe and at home in your own body first. You cannot teach a room into a state you cannot find yourself. This is where real cueing comes from.'},
  {t:'pillar', kick:'Layer two', h:'<span class="pillar-name">Spirit</span>, the Breath', p:'The breath of life, the subtle energetic self. Breath is the teacher\'s real instrument: the thing that changes a room faster than any adjustment. You learn to teach it, not just mention it.'},
  {t:'pillar', kick:'Layer three', h:'<span class="pillar-name">Heart</span>, intuition', p:'The heart\'s intuitive perception is the pathway to deep healing. For a teacher it is the quiet skill of reading the room and trusting what you sense, so you teach the class in front of you, not the one you planned.'},
  {t:'pillar', kick:'Layer four', h:'<span class="pillar-name">Shakti</span>, Feminine Wisdom', p:'The creative power of the feminine principle, honoured through every stage and phase of a woman\'s life. This is the specialism most teachers never gain, and the one women come back for.'},
  {t:'point', kick:'Put together', h:'One class, <em>four</em> layers.', p:'When body, breath, heart and feminine wisdom move together, a class stops being a workout and becomes the thing people cannot get anywhere else.'},
  {t:'part', part:true, num:'Three', h:'What a complete training looks like'},
  {t:'path', kick:'The path', h:'Three ways of <em>knowing</em>.', cards:[
      {h:'Instinct', t:'100 hrs', d:'Teaching methodology, teaching practice, yogic lifestyle. The craft of leading a room.'},
      {h:'Intellect', t:'56 hrs', d:'Functional anatomy and yogic philosophy. The ground under your confidence.'},
      {h:'Intuition', t:'44 hrs', d:'Teaching contexts, the business of teaching, self study. Teaching as a real life.'}
  ]},
  {t:'point', kick:'Built for a real life', h:'Nine months, <em>not</em> a sprint.', p:'Part online, part in person, paced over nine months so the teachings have time to land in your body before you pass them on. YAP-UK accredited.'},
  {t:'whyme', kick:'Who you would train with', h:'Tammy Mittell', p:'25 years of practice. 18 years teaching. Over 8 years training other teachers. A Senior Accredited teacher and a YAP-UK accredited training school, specialising in women\'s wellbeing, pre and postnatal, and womb care.'},
  {t:'outcome', kick:'What you walk away as', big:'A teacher women <em>trust</em>, qualified to hold every stage of a woman\'s life.'},
  {t:'cta', kick:'The next step', h:'Train with <em>me</em>.', p:'The next 200 hour cohort opens soon. If this is the teacher you want to become, come and find out if it is the right fit. Visit tammysyoga.co.uk or email hi@tammysyoga.co.uk to start a conversation about the next intake.', cta:'Join the next 200 hour cohort', disc:'This masterclass is educational. Becoming a working yoga teacher takes practice, study and time, and no particular income or career result is guaranteed. Results vary from teacher to teacher.', close:'Body. Breath. Heart. Soul.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.part ? ' part' : '');
  let html = '';
  if (s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if (s.part) html += '<div class="num">'+s.num+'</div>';
  if (s.h) html += (s.part ? '<h2>' : '<h1>') + s.h + (s.part ? '</h2>' : '</h1>');
  if (s.big) html += '<div class="big">'+s.big+'</div>';
  if (s.p) html += '<p'+(s.t==='title'||s.t==='cta'?' class="lead"':'')+'>'+s.p+'</p>';
  if (s.cards){ html += '<div class="grid">'; s.cards.forEach(c=>{ html += '<div class="card"><div class="h">'+c.h+'</div><div class="t">'+c.t+'</div><div class="d">'+c.d+'</div></div>'; }); html += '</div>'; }
  if (s.cta) html += '<div><span class="cta-box">'+s.cta+'</span></div>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  if (s.close) html += '<div class="big" style="margin-top:46px">'+s.close.replace('Heart.','<em>Heart.</em>')+'</div>';
  if (s.t==='pillar' || s.t==='title' || s.t==='cta') html += LEAF;
  html += '<div class="foot">Body · Breath · Heart · Soul</div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});

const nav = document.getElementById('nav');
function upd(){ const h=window.innerHeight; const i=Math.min(S.length, Math.round(window.scrollY/h)+1); nav.textContent=i+' / '+S.length; }
window.addEventListener('scroll', upd); upd();
</script>
</body>
</html>
