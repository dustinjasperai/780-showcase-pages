<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Natural Facelift You Train, Not Buy — Face Yoga Method Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcf2f0;      /* soft blush ground — brand.json */
    --panel:#ffffff;
    --ink:#000e41;     /* dominant navy — brand.json (130 uses) */
    --muted:#5b6072;
    --rule:#000e41;
    --accent:#ce7da5;  /* rose accent — brand.json */
    --display:'Playfair Display',Georgia,serif;
    --body:'Jost',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid rgba(0,14,65,.08);border-radius:18px;
    padding:66px 64px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 18px 50px rgba(90,40,70,.07);position:relative;overflow:hidden}
  .slide::before{content:'';position:absolute;left:0;top:64px;bottom:64px;width:4px;background:var(--accent);border-radius:0 4px 4px 0;opacity:.85}
  .kick{font-size:13px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:60px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:42px;line-height:1.1;margin-bottom:18px}
  .lead{font-size:23px;line-height:1.5;color:var(--muted);font-weight:300;margin-top:26px;max-width:44ch}
  .sub{font-size:20px;line-height:1.55;color:var(--muted);font-weight:300;margin-top:14px;max-width:52ch}
  p.body{font-size:21px;line-height:1.6;color:var(--ink);font-weight:300;margin-top:16px;max-width:54ch}
  .part{font-family:var(--display);font-style:italic;font-size:22px;color:var(--accent);margin-bottom:10px}
  ul{margin-top:22px;list-style:none;max-width:56ch}
  li{font-size:20px;line-height:1.5;color:var(--ink);font-weight:300;padding-left:30px;position:relative;margin-bottom:16px}
  li::before{content:'';position:absolute;left:0;top:11px;width:11px;height:11px;border:2px solid var(--accent);border-radius:50%}
  .pillar{font-family:var(--display);font-size:15px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .big{font-family:var(--display);font-size:76px;line-height:1;color:var(--ink);margin:8px 0 6px}
  .big .a{color:var(--accent);font-style:italic}
  .cred{font-size:19px;line-height:1.6;color:var(--muted);font-weight:300;margin-top:16px;max-width:52ch}
  .cta-line{font-family:var(--display);font-size:30px;color:var(--ink);margin-top:20px}
  .disc{font-size:14px;line-height:1.6;color:var(--muted);font-weight:300;margin-top:34px;max-width:60ch;border-top:1px solid rgba(0,14,65,.1);padding-top:18px}
  .num{position:absolute;right:60px;bottom:34px;font-size:13px;letter-spacing:.2em;color:rgba(0,14,65,.28);font-weight:500}
  @media(max-width:640px){.slide{padding:44px 30px;min-height:auto}h1{font-size:40px}h2{font-size:30px}.big{font-size:52px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Fumiko Takatsu', h:'A Natural Facelift You Train, Not Buy',
    lead:'The Face Yoga Method: how to lift, tone and soften your face with muscle, massage, breath and mindset. No surgery, no needles, no creams to buy.'},
  {t:'promise', kick:'What you will leave with', h:'By the end of this hour',
    items:['Why your face changes with age, in plain terms','The four things a natural facelift actually asks of you','A five minute daily practice you can start tonight','How the method builds a face that looks like you, only rested']},
  {t:'for', kick:'Who this is for', h:'You have tried the surface',
    body:'The serums, the rollers, the "miracle" creams, maybe even a consult you talked yourself out of. Nothing held. Because none of it reaches the thing that is actually changing.'},
  {t:'hook', kick:'The reframe', big1:'Your face', big2:'is not failing.', tail:'It is un-trained.'},
  {t:'part', part:'Part One', h:'Why the face ages faster than it should', sub:'Three things happen under the skin, and none of them are on the shelf at the store.'},
  {t:'content', kick:'Reason one', h:'The muscles slacken', body:'There are more than forty muscles in the face and, unlike the body, most people never use them on purpose. Unused muscles shorten and drop. The lift you are missing is muscle tone you stopped building.'},
  {t:'content', kick:'Reason two', h:'The lymph stagnates', body:'The face drains fluid through a network just under the skin. When it slows, you get puffiness, dullness and heaviness around the jaw and eyes. Massage moves it. A cream cannot.'},
  {t:'content', kick:'Reason three', h:'The tension sets in', body:'A clenched jaw, a furrowed brow, a held breath, repeated for years, carve themselves into the face. The lines you dislike most are often tension you can learn to release.'},
  {t:'content', kick:'What the shelf cannot do', h:'This is why products plateau', body:'Creams sit on the surface. Needles freeze motion. Neither trains a muscle, drains the lymph, or unlearns a tension pattern. Those are the three things that actually shape a face, and all three respond to practice.'},
  {t:'part', part:'Part Two', h:'The Face Yoga Method', sub:'One integrated practice, four pillars. This is the system I put together over twenty years, and it is what separates it from doing a few exercises off the internet.'},
  {t:'pillar', pillar:'Pillar One', h:'Exercise', body:'Targeted poses that work the muscles which lift the cheeks, open the eyes and firm the jaw. You train the face the way you would train the body, region by region, until the lift holds on its own.'},
  {t:'pillar', pillar:'Pillar Two', h:'Massage', body:'Hands-on lymphatic massage that de-puffs, sculpts and brightens. This is the piece most exercise-only routines skip, and it is often the fastest visible change in the first week.'},
  {t:'pillar', pillar:'Pillar Three', h:'Breath', body:'Breath woven into the practice, so it releases the tension it just worked on rather than adding to it. A face at ease reads younger than a face held tight, every time.'},
  {t:'pillar', pillar:'Pillar Four', h:'Mindset', body:'The part nobody sells you: how you meet the face in the mirror. When the goal shifts from fixing a flaw to caring for a face, the practice sticks, and the result shows.'},
  {t:'content', kick:'How it stacks', h:'The five minute face', body:'You do not need an hour. A short daily pass, tone, drain, breathe and a kind word, is enough to build and keep the change. The method is designed to fit a real morning.'},
  {t:'content', kick:'Your first few weeks', h:'Weeks, not years', body:'Most people feel the difference in the first days and see it within a few weeks: a lifted look through the cheeks, a softer jaw, brighter eyes. Not a different face. Your face, rested and awake.'},
  {t:'cred', kick:'Why me', h:'I built this on my own face first', body:'In 2003 a car accident left my face asymmetrical. Creams and treatments did nothing. Then it clicked: if I can train my body, I can train my face. Weeks later people said I looked younger and more aligned.',
    cred:'Twenty years on, the Face Yoga Method has grown into a global brand, six books, hundreds of certified teachers, and hundreds of thousands of students who train their faces instead of buying the next promise.'},
  {t:'thesis', kick:'The whole idea', big1:'Bought,', big2:'it fades.', tail:'Trained, it lasts.'},
  {t:'cta', kick:'Your next step', h:'Come train with me',
    body:'Join the next live masterclass and then start the 6-Week Face Toning Bootcamp, where I walk you through the full four-pillar practice, day by day.',
    disc:'This masterclass is educational. Face yoga is a wellness practice. No specific result is guaranteed. Results vary from person to person, and nothing here is a medical treatment or a substitute for professional care.'}
];

function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide';
  let h = '';
  if(s.kick) h += `<div class="kick">${esc(s.kick)}</div>`;
  if(s.part) h += `<div class="part">${esc(s.part)}</div>`;
  if(s.t==='hook' || s.t==='thesis'){
    h += `<div class="big">${esc(s.big1)}</div><div class="big"><span class="a">${esc(s.big2)}</span></div>`;
    if(s.tail) h += `<h2 style="margin-top:22px">${esc(s.tail)}</h2>`;
  } else {
    if(s.h && s.t==='title') h += `<h1>${esc(s.h)}</h1>`;
    else if(s.h) h += `<h2>${esc(s.h)}</h2>`;
  }
  if(s.pillar) {/* pillar shown via kick already suppressed */}
  if(s.lead) h += `<div class="lead">${esc(s.lead)}</div>`;
  if(s.sub) h += `<div class="sub">${esc(s.sub)}</div>`;
  if(s.body) h += `<p class="body">${esc(s.body)}</p>`;
  if(s.cred) h += `<div class="cred">${esc(s.cred)}</div>`;
  if(s.items){ h += '<ul>' + s.items.map(x=>`<li>${esc(x)}</li>`).join('') + '</ul>'; }
  if(s.disc) h += `<div class="disc">${esc(s.disc)}</div>`;
  h += `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  d.innerHTML = h;
  deck.appendChild(d);
});
</script>
</body>
</html>
