<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From OT to OTPreneur &middot; Turn Your Clinical Skills Into a Business You Own &middot; with Jayson Davies &amp; Sarah Putt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7f5;      /* soft cool mint-white paper (light scheme, from brand light bg) */
    --panel:#e3efe7;   /* soft mint panel (brand green washed onto paper) */
    --ink:#1c2a23;     /* deep green-black type */
    --ink-soft:#3d4f46;/* body copy on mint paper */
    --rule:rgba(28,42,35,.14);
    --dim:#86988e;     /* muted caption */
    --accent:#63c49a;  /* OTPreneur brand mint-green (harvested, 19 uses) */
    --accent-deep:#2f8f66;/* legible mint for small type, same hue family */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"Inter",-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;width:100%;max-width:960px;aspect-ratio:16/9;
    background:
      radial-gradient(120% 90% at 84% 6%, rgba(99,196,154,.20), transparent 58%),
      var(--bg);
    overflow:hidden;box-shadow:0 0 0 1px var(--rule);
  }
  .slide{position:absolute;inset:0;padding:8% 9%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:"Poppins",sans-serif;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;font-size:clamp(12px,1.6vw,16px);color:var(--accent-deep);margin-bottom:1em}
  h1{font-family:"Poppins",sans-serif;font-weight:800;line-height:1.02;
    font-size:clamp(34px,6.8vw,72px);letter-spacing:-.01em}
  h2{font-family:"Poppins",sans-serif;font-weight:700;line-height:1.06;
    font-size:clamp(25px,4.8vw,48px);letter-spacing:-.005em}
  .lede{font-size:clamp(16px,2.2vw,23px);line-height:1.5;max-width:45ch;margin-top:.9em;color:var(--ink-soft)}
  .rule{width:74px;height:5px;background:var(--accent);margin:1.05em 0;border-radius:3px}
  ul{list-style:none;margin-top:1.1em;max-width:50ch}
  li{position:relative;padding-left:1.7em;margin:.62em 0;font-size:clamp(15px,2vw,21px);line-height:1.4;color:var(--ink-soft)}
  li::before{content:"";position:absolute;left:0;top:.52em;width:11px;height:11px;background:var(--accent);border-radius:50%}
  .big{font-family:"Poppins",sans-serif;font-weight:800;font-size:clamp(60px,14vw,150px);color:var(--accent);line-height:.92;letter-spacing:-.02em}
  .cardwrap .inner{background:var(--panel);padding:5.5% 6.5%;border-left:6px solid var(--accent);border-radius:5px}
  .foot{position:absolute;left:9%;bottom:5.5%;font-family:"Poppins",sans-serif;
    letter-spacing:.13em;text-transform:uppercase;font-size:13px;color:var(--dim)}
  .disc{font-size:13px;line-height:1.55;color:var(--dim);max-width:60ch;margin-top:1.3em}
  #nav{position:fixed;bottom:14px;right:18px;display:flex;gap:8px;align-items:center;
    font-family:"Poppins",sans-serif;font-size:14px;color:var(--dim)}
  #nav button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    border-radius:6px;padding:5px 11px;cursor:pointer}
  #nav button:hover{border-color:var(--accent-deep);color:var(--accent-deep)}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass with Jayson Davies & Sarah Putt',h:'From OT to OTPreneur',lede:'How to turn the clinical skills you already have into a business you actually own, without waiting until you feel ready.'},
 {t:'promise',h:'What you will leave with',ul:['A clear read on which of your OT skills people will pay for, and how','A simple path from a vague idea to a niche you have actually validated','The one mindset shift that separates the OTs who start from the ones who keep saying someday']},
 {t:'who',kick:'Who this is for',h:'You are a great OT. That was never the question.',lede:'You can run an eval, write the plan, and get a kid or a client further than anyone expected. What you have never been taught is how any of that becomes a business with your name on it.'},
 {t:'hook',kick:'The reframe',h:'You do not need permission. You need a plan.',lede:'Most OTs wait to feel like an entrepreneur before they start. It never arrives that way. The confidence comes from doing the work in order, not from a personality you are supposed to grow first.'},
 {t:'part',kick:'Part one',h:'Why most OT business ideas stall'},
 {t:'content',h:'The three quiet stalls',ul:['The idea stays a someday: no deadline, no first step, so nothing moves','The niche is everyone: "I help kids and adults and clinics" is a niche of nobody','The identity block: "I am a clinician, not a business person," so you self-reject before the market ever gets a say']},
 {t:'content',h:'Hustle is not the missing piece',lede:'You already work harder than almost anyone. Another late night is not what turns your skills into income. A sequence is: decide what you sell, to whom, and how they find you, in that order.'},
 {t:'part',kick:'Part two',h:'The path: the OTPreneur Startup'},
 {t:'card',kick:'Step one',h:'The OTPreneur Mindset',lede:'Name the fear and the imposter voice out loud, then put guardrails around them. You are not becoming someone new. You are letting the OT you already are get paid directly for what she knows.'},
 {t:'card',kick:'Step two',h:'Define and validate your niche',lede:'Pick the exact person you are best placed to help, then pressure-test that they exist, they have the problem, and they will pay. A niche you have validated beats a niche you find interesting.'},
 {t:'card',kick:'Step three',h:'From niche to product',lede:'Match a business model to two things at once: your real expertise and the life you want. Direct client care, telehealth, contract work, a digital product. The right one fits both, not just the market.'},
 {t:'content',kick:'Step four',h:'Build the audience before you need it',ul:['Show up where your person already is, consistently, with real help','Let them see the OT behind the offer, not just the offer','So that when the doors open, there is already a room to open them to']},
 {t:'content',kick:'Step five',h:'Make it real and keep it accountable',lede:'The parts that feel scary are the most learnable: choosing a business entity, tracking your money, and setting goals you actually report on. Structure and a bit of accountability are what carry a plan across the line.'},
 {t:'part',kick:'Part three',h:'What the first year can look like'},
 {t:'content',h:'The shift you feel first',ul:['A niche you can say in one sentence, to anyone who asks','A first paying client who came for the exact thing you chose to offer','A calendar that finally has your business on it, not just your day job']},
 {t:'why',kick:'Why learn this from us',h:'Two OTs who actually built the thing',lede:'We are Jayson Davies and Sarah Putt, both practicing occupational therapists. Jayson built The OT Schoolhouse into a community and continuing-education home for school-based OTs. Sarah founded and staffed her own early-intervention private practice. We have made the mistakes, so you get the map instead of the maze.'},
 {t:'recap',h:'The whole path in one breath',ul:['Mindset first, so you stop self-rejecting','A validated niche, so you build for someone real','A product and an audience that fit the life you actually want']},
 {t:'cta',kick:'Your next step',h:'Turn your OT skills into your own business',lede:'If you want the full path with us, workbook, live sessions, and a room of other OTpreneurs, the OTP Startup is where we build your plan step by step. Start with the free guide, then come build it with us.',disc:'This masterclass is educational. No specific income, client, or business result is guaranteed. Outcomes vary and depend on you, your market, and the work you put in.'}
];
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===0?' on':'');
  let h='';
  if(s.kick)h+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='part'){h+='<div class="big">'+(i)+'</div><h2 style="margin-top:.2em">'+s.h+'</h2>';}
  else if(s.t==='title'){h+='<h1>'+s.h+'</h1><div class="rule"></div>'+(s.lede?'<div class="lede">'+s.lede+'</div>':'');}
  else if(s.t==='card'){h+='<div class="cardwrap"><div class="inner"><h2>'+s.h+'</h2>'+(s.lede?'<div class="lede">'+s.lede+'</div>':'')+'</div></div>';}
  else{h+='<h2>'+s.h+'</h2><div class="rule"></div>';if(s.lede)h+='<div class="lede">'+s.lede+'</div>';}
  if(s.ul){h+='<ul>'+s.ul.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.disc)h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="foot">Jayson Davies &amp; Sarah Putt &middot; OTPreneur</div>';
  d.innerHTML=h;stage.appendChild(d);
});
let cur=0;const slides=[...stage.children];const count=document.getElementById('count');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));count.textContent=(cur+1)+' / '+S.length;}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
stage.addEventListener('click',e=>{if(e.clientX> stage.getBoundingClientRect().left+stage.clientWidth/2)show(cur+1);else show(cur-1);});
show(0);
</script>
</body>
</html>
