<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Full Room · Jen Argue, Breakthrough Masterminds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Cabin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fdf6f7; --panel:#f7e9ed; --rule:#efd9e0;
    --acc:#e31c79; --pink:#ff577f; --ink:#2b2733; --body:#55636f; --dim:#9b8f96; --cream:#fbeef3;
  }
  html,body{height:100%}
  body{background:#f3e4ea;font-family:'Cabin',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#f3e4ea}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Cabin',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:92%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Cabin',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-family:'Playfair Display',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:82%;line-height:1.4;font-weight:400;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Cabin',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#2b2130 0%,#1c1620 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#2b2130 0%,#1c1620 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--cream)}
  .t-cta .body{font-family:'Cabin',sans-serif;color:#e9d7e0;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--pink);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .rings-motif{position:absolute;pointer-events:none}
  .title-rings{right:7%;bottom:7.5%;width:19vw;opacity:.9}
  .corner-rings{right:6.5%;bottom:7.5%;width:9vw;opacity:.5}
  .brandline{font-family:'Cabin',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(43,39,51,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Breakthrough Masterminds</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: concentric "hot-seat" rings around a center point (the mastermind table), drawn in magenta/pink -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rings" viewBox="0 0 120 120">
  <g fill="none" stroke="#e31c79" stroke-width="2" stroke-linecap="round">
    <circle cx="60" cy="60" r="8" fill="#ff577f" stroke="none" opacity="0.9"/>
    <circle cx="60" cy="60" r="22" opacity="0.75"/>
    <circle cx="60" cy="60" r="36" opacity="0.5" stroke="#ff577f"/>
    <circle cx="60" cy="60" r="50" opacity="0.3"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Full Room',sub:'How to build a mastermind the right people join, love, and renew, year after year.',brand:true,rings:'title'},
 {t:'normal',k:'Who this is for',title:'You are great in the room. Keeping the room full is the part no one taught you.',body:'You are a coach, consultant, or expert who is genuinely good with people, and a group feels like the natural next step. But starting a mastermind and keeping it full are two different skills, and the second one is where most groups quietly fall apart.'},
 {t:'dark',title:'An empty seat at renewal is not a marketing problem. It is a facilitation problem.'},

 {t:'section',idx:'Part One',title:'Why Most Masterminds Leak'},
 {t:'normal',k:'The wrong room',title:'A group filled with anyone is a group that bonds with no one.',body:'When you invite from a place of "I just need the seats filled," you get mismatched stages, mismatched commitment, and a room that never quite gels. The members who would have renewed feel it first, and they are the ones you lose.'},
 {t:'normal',k:'The flat start',title:'The first two weeks decide whether they ever feel like a group.',body:'Most groups open with a housekeeping call and a shared folder. No bonding, no belonging, no moment where a member thinks "these are my people." Without that, the mastermind is just a calendar invite, and calendar invites are easy to cancel.'},
 {t:'normal',k:'The exhausted leader',title:'If running the group drains you, it will eventually drain the group.',body:'When the facilitator carries every conversation, referees every dynamic, and leaves each call depleted, the energy shows. A group can feel when its leader is running on empty, and no one renews into a room that feels heavy.'},
 {t:'dark',title:'Members do not renew a curriculum. They renew a room they cannot get anywhere else.'},

 {t:'section',idx:'Part Two',title:'The Five-Part Method'},
 {t:'normal',k:'One, Preparation',title:'The work you do before you ever sell a seat is what makes it sellable.',body:'Preparation is the offer, the structure, the price, and the promise, set before you invite a soul. Get this right and enrollment stops feeling like convincing, because the group is already designed to be worth joining.'},
 {t:'normal',k:'Two, Invite',title:'Fill it with the right people, not just people.',body:'Inviting is marketing, an application, and real curation. You are not chasing bodies, you are selecting a room where the members fit each other. That selectiveness is what makes a mastermind feel premium instead of crowded.'},
 {t:'normal',k:'Three, Onboarding',title:'Design the first days to create belonging, not just access.',body:'A deliberate onboarding builds the WOW that bonds a group early: introductions that matter, a first hot seat that lands, a moment where each member feels chosen. Bonding in week one is what makes the renewal conversation easy eleven months later.'},
 {t:'normal',k:'Four, Facilitator Skills',title:'Run a room that is life-giving, not exhausting.',body:'High-level facilitation is the craft: drawing out the quiet member, handling the one who takes all the air, running a hot seat that changes someone, and leaving the call with more energy than you started. This is the skill that separates a mastermind from a group chat.'},
 {t:'normal',k:'Five, Renewal Methods',title:'Treat renewal as something you build all year, not ask for at the end.',body:'Renewal is not a pitch in month twelve, it is the sum of every bonded moment before it. Handle it well and it means more profit and lower expenses, because a renewing member costs nothing to enroll again.'},
 {t:'dark',title:'A well-run room fills itself. The best marketing for next year is this year, done right.'},

 {t:'section',idx:'Part Three',title:'What a Renewing Room Looks Like'},
 {t:'normal',k:'The group this builds',title:'A room members protect, refer to, and re-sign into without a second thought.',body:'When the right people are bonded and the facilitation is generous, the mastermind stops being something you sell every year and becomes something people stay in. Referrals come from inside the room, launches get easier, and your income steadies because your best members simply do not leave.'},
 {t:'normal',k:'Why Jen',title:'A licensed therapist who runs masterminds, with the renewal rate to show for it.',body:'Jen Argue is a licensed therapist who brings real group-dynamics training to facilitation, and has run Breakthrough Masterminds for women entrepreneurs across Canada, Mexico, Australia, and Europe. Her own groups renew at 67%, and this five-part method is exactly how.'},

 {t:'section',idx:'Your Next Step',title:'Build a Room People Never Want to Leave'},
 {t:'cta',title:'Ready to fill a mastermind that renews itself?',body:'Take the next step with Jen and the Breakthrough Masterminds community.',chips:['Learn the full method','Join the mastermind waitlist'],disc:'Educational content for coaches, consultants, and group leaders. No income or business result is guaranteed. Outcomes vary by facilitator, offer, and market.'},
];

const deck=document.getElementById('deck');
function rings(kind){return `<svg class="rings-motif ${kind==='title'?'title-rings':'corner-rings'}"><use href="#rings"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Breakthrough <b>Masterminds</b> · Jen Argue</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.rings) h+=rings(s.rings);
  else if(s.t==='title') h+=rings('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
