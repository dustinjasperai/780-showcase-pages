<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Shift: From Projects to People — Construction Genius</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* Palette — brand-derived from constructiongenius.com (see 01-deep-research.md ## Palette)
     --accent #003087 (their dominant navy), --accent2 #c8102e (their brand red) */
  :root{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --ink:#1a2230;
    --muted:#54607a;
    --rule:#d4dae6;
    --accent:#003087;
    --accent2:#c8102e;
    --display:'Poppins',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{
    position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:6px;padding:52px 56px;margin:0 0 22px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  /* plan-sheet corner marks + section label — construction-document motif */
  .slide::before,.slide::after{content:"";position:absolute;width:16px;height:16px;border:2px solid var(--rule)}
  .slide::before{top:16px;left:16px;border-right:0;border-bottom:0}
  .slide::after{bottom:16px;right:16px;border-left:0;border-top:0}
  .tag{position:absolute;top:22px;right:26px;font-family:var(--display);font-weight:600;
    font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .kicker{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  .lede{font-size:20px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:44ch}
  p.body{font-size:18px;line-height:1.6;color:var(--ink);margin-top:16px;max-width:60ch}
  .rule{height:3px;width:64px;background:var(--accent2);margin:22px 0 0;border-radius:2px}
  ul.pts{margin-top:24px;list-style:none;display:grid;gap:14px;max-width:64ch}
  ul.pts li{position:relative;padding-left:34px;font-size:18px;line-height:1.5}
  ul.pts li::before{content:"";position:absolute;left:0;top:8px;width:12px;height:12px;
    background:var(--accent);border-radius:2px}
  .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-top:28px}
  .card{border:1px solid var(--rule);border-radius:5px;padding:22px}
  .card .n{font-family:var(--display);font-weight:700;color:var(--accent2);font-size:14px;letter-spacing:.12em}
  .card h3{font-family:var(--display);font-weight:600;font-size:20px;margin:8px 0 8px}
  .card p{font-size:15px;line-height:1.5;color:var(--muted)}
  .big{font-family:var(--display);font-weight:700;font-size:64px;color:var(--accent);line-height:1}
  .foot{position:absolute;bottom:20px;left:56px;font-size:12px;color:var(--muted);letter-spacing:.03em}
  .cta{background:var(--accent);color:#fff}
  .cta::before,.cta::after{border-color:rgba(255,255,255,.4)}
  .cta .kicker{color:#9fc0ff}
  .cta h1,.cta h2{color:#fff}
  .cta .lede,.cta p.body{color:#d7e2f7}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:#b7c6e6;max-width:64ch}
  .btn{display:inline-block;margin-top:26px;background:#fff;color:var(--accent);
    font-family:var(--display);font-weight:600;font-size:17px;padding:14px 26px;border-radius:4px}
  .who{display:grid;grid-template-columns:1.2fr 1fr;gap:28px;align-items:center}
  @media(max-width:760px){.slide{padding:38px 26px}h1{font-size:38px}h2{font-size:27px}.grid3{grid-template-columns:1fr}.who{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    tag:'Masterclass',
    kicker:'Construction Genius',
    h:'The Shift',
    sub:'From Projects to People. The leadership masterclass for construction company owners who were never taught to lead one.',
    foot:'Presented by Eric Anderton, Construction Genius' },

  {t:'promise', tag:'What you will learn', kicker:'The promise',
    h:'Stop being the best builder. Become the leader your company can grow behind.',
    body:'In the next hour you will see exactly how technically excellent builders make the shift to leading people, and the three disciplines that decide whether a construction company scales past its owner.' },

  {t:'who', tag:'Who this is for', kicker:'Read this first',
    h:'For the owner who came up through the field.',
    body:'You got promoted because you were the best in the field. You can still out-build anyone on your crew. But nobody handed you a manual for leading the people who do the work now.',
    pts:['You run a construction firm and you are still the technical bottleneck.','Your best people are leaving, or you are afraid they will.','You want the company to run on a system, not on your adrenaline.'] },

  {t:'trap', tag:'The trap', kicker:'The trap',
    h:'The skill that got you here is the skill that is holding you back.',
    body:'The trade rewards technical mastery, so you doubled down on it for twenty years. Then you became the owner, and the job quietly changed from building projects to building people. Nobody told you.' },

  {t:'reframe', tag:'The reframe', kicker:'The hard truth',
    h:'Your company cannot outgrow your leadership.',
    body:'A construction company hits a ceiling at exactly the level of its owner as a leader. You can pour more hours in, but the business will not grow past the person leading it until that person shifts.' },

  {t:'part', tag:'Part One', kicker:'Part One',
    h:'Why great builders make struggling leaders.',
    body:'Building a project is about controlling variables you can see. Leading people is about influencing variables you cannot. They are different jobs, and the second one was never trained. That gap is where the frustration lives.' },

  {t:'cost', tag:'The cost', kicker:'What it is costing you',
    h:'The bill for staying technical.',
    grid:[
      {n:'01',h:'Rework and firefighting',p:'Everything routes through you, so nothing moves without you, and the mistakes wait for you to catch them.'},
      {n:'02',h:'Your best people walk',p:'Talented leaders leave when they are managed like laborers and never developed.'},
      {n:'03',h:'The 70-hour owner',p:'You own a job, not a company, and the job owns your calendar and your family time.'} ] },

  {t:'method', tag:'The method', kicker:'The Shift',
    h:'Three disciplines nobody enters this trade with.',
    body:'Every construction company runs on three things owners were never taught. Master these and the shift from projects to people is not a personality change, it is a set of skills you can learn.',
    grid:[
      {n:'Pillar 1',h:'Leadership',p:'Developing, holding, and keeping the people who do the work.'},
      {n:'Pillar 2',h:'Strategy',p:'Choosing the right work and planning the company past this year.'},
      {n:'Pillar 3',h:'Sales and Marketing',p:'The growth discipline most owners avoid until it is urgent.'} ] },

  {t:'pillar', tag:'Pillar One / Leadership', kicker:'Leadership',
    h:'Lead your people with EAR.',
    body:'Day-to-day leadership is not a mystery. It runs on three moves you repeat until they are habits.',
    grid:[
      {n:'E',h:'Encouragement',p:'People do their best work when they believe their leader is for them, not just over them.'},
      {n:'A',h:'Accountability',p:'Clear standards, clearly held, so good people are not carrying the weak links.'},
      {n:'R',h:'Recognition',p:'Catch people doing it right and say so, out loud, on purpose.'} ] },

  {t:'convo', tag:'Leadership', kicker:'The hard part of accountability',
    h:'Hold the standard without wrecking the relationship.',
    body:'Most owners avoid the tough conversation until it explodes. There is a way to have the hard talk so the person leaves it clearer and more committed, not defensive. Accountability and respect are not opposites, they are the same conversation done well.' },

  {t:'meet', tag:'Leadership', kicker:'Effective meetings',
    h:'Run a meeting that reaches agreement every time.',
    body:'A construction team lives or dies by its meetings. A structured meeting ends with a decision on how to solve the problem and who owns the next step. An unstructured one ends with everyone busier and nothing resolved.',
    pts:['Open with the one decision the meeting exists to make.','Surface the real disagreement early, not in the parking lot after.','Leave with owners and dates, not vague good intentions.'] },

  {t:'pillar', tag:'Pillar Two / Strategy', kicker:'Strategy',
    h:'Go or No-Go: stop chasing the wrong work.',
    body:'Growth is not more jobs, it is the right jobs. A Go / No-Go discipline gives you a clear way to decide which projects to bid and which to walk away from, before they drain your best crews and your margin.',
    pts:['Does this work fit what we are genuinely great at?','Does the client, the terms, and the timeline serve our plan?','If it is not a clear Go, it is a No-Go. Walk.'] },

  {t:'plan', tag:'Strategy', kicker:'Plan and succession',
    h:'Build the plan, then build the people who run it.',
    body:'A strategic plan tells the company where it is going. Developing and promoting your best people is how it gets there without you in every seat. Succession is not an exit event, it is how you scale while you are still in the chair.' },

  {t:'pillar', tag:'Pillar Three / Sales', kicker:'Sales and Marketing',
    h:'The discipline owners avoid until it is too late.',
    body:'Most construction owners treat business development as something that happens when the pipeline runs dry. The companies that scale treat it as a system that runs whether they feel like it or not, so the right work is always coming toward them.' },

  {t:'after', tag:'Part Three', kicker:'What it looks like',
    h:'The company after the shift.',
    grid:[
      {n:'01',h:'The owner leads',p:'You spend your week on people, strategy, and the next twelve months, not on today\'s emergency.'},
      {n:'02',h:'The team owns it',p:'Your leaders make the calls you used to make, and make them well, because you developed them.'},
      {n:'03',h:'The work is chosen',p:'You bid the right projects on purpose and walk from the rest without flinching.'} ] },

  {t:'seven', tag:'The destination', kicker:'The 7 qualities',
    h:'What a construction leader actually looks like.',
    body:'The leaders who make this shift share the same qualities. They are clear, they are consistent, they develop people, they hold the standard, they choose the right work, they communicate under pressure, and they build something that lasts past them.' },

  {t:'why', tag:'Why listen to me', kicker:'Eric Anderton',
    h:'Since 2004, in the field with construction leaders.',
    body:'I have spent two decades as an executive mentor and meeting facilitator for construction firms doing $10 million to $1 billion in revenue, helping them clarify their purpose, develop their best people, and execute the priorities that matter. I wrote the book Construction Genius and host the podcast of the same name. No jargon, no fake motivation, just the practical tools that work on real job sites.' },

  {t:'recap', tag:'Recap', kicker:'The shift, in one page',
    h:'From projects to people.',
    body:'Leadership with EAR. Strategy with Go / No-Go. Sales and marketing as a system. Three disciplines, one shift, and a company that finally grows behind you instead of stopping at you.' },

  {t:'cta', tag:'Your next step', kicker:'Construction Genius',
    h:'Ready to make the shift?',
    body:'If you want to talk through where your company is stuck and what the shift would look like for your team, book a short call with me. We will look at your leadership, your strategy, and your growth, and map the first move.',
    btn:'Book a call at constructiongenius.com',
    disc:'This masterclass is educational. Results vary and depend on your market, your team, and your execution. Nothing here is a guarantee of any specific income or business outcome.' }
];

function el(tag, cls, html){ const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e; }
const deck=document.getElementById('deck');
S.forEach(s=>{
  const sl=el('div','slide'+(s.t==='cta'?' cta':''));
  sl.appendChild(el('div','tag',s.tag||''));
  if(s.t==='title'){
    sl.appendChild(el('div','kicker',s.kicker));
    sl.appendChild(el('h1',null,s.h));
    sl.appendChild(el('div','rule'));
    sl.appendChild(el('p','lede',s.sub));
    sl.appendChild(el('div','foot',s.foot));
    deck.appendChild(sl); return;
  }
  sl.appendChild(el('div','kicker',s.kicker));
  sl.appendChild(el('h2',null,s.h));
  sl.appendChild(el('div','rule'));
  if(s.body) sl.appendChild(el('p','body',s.body));
  if(s.pts){ const ul=el('ul','pts'); s.pts.forEach(p=>ul.appendChild(el('li',null,p))); sl.appendChild(ul); }
  if(s.grid){ const g=el('div','grid3'); s.grid.forEach(c=>{const card=el('div','card'); card.appendChild(el('div','n',c.n)); card.appendChild(el('h3',null,c.h)); card.appendChild(el('p',null,c.p)); g.appendChild(card);}); sl.appendChild(g); }
  if(s.btn) sl.appendChild(el('div','btn',s.btn));
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  deck.appendChild(sl);
});
</script>
</body>
</html>
