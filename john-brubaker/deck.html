<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Coach Your Business Like a Championship Team — Coach Bru</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2; --ink:#1c1a17; --muted:#6b645a; --accent:#faab03;
    --panel:#15181c; --panelink:#f4f1ea; --rule:rgba(250,171,3,.55);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#e9e4da;font-family:'Inter',system-ui,sans-serif;color:var(--ink);padding:28px 0}
  .deck{max-width:960px;margin:0 auto;padding:0 18px}
  .slide{position:relative;background:var(--bg);border-radius:14px;padding:64px 60px;margin:0 0 22px;
    min-height:520px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 rgba(0,0,0,.06),0 18px 40px -28px rgba(0,0,0,.35)}
  .slide.dark{background:var(--panel);color:var(--panelink)}
  .slide::before{content:"";position:absolute;left:0;top:0;height:6px;width:100%;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) 34%,transparent 34%)}
  .kick{font-family:'Poppins';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Poppins';font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'Poppins';font-weight:700;font-size:34px;line-height:1.1;letter-spacing:-.01em}
  .lead{font-size:20px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:40ch}
  .slide.dark .lead{color:#cfc8ba}
  .big{font-size:30px;line-height:1.28;font-weight:500;margin-top:10px;max-width:24ch}
  p.body{font-size:19px;line-height:1.55;margin-top:14px;max-width:46ch}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.4;padding:12px 0 12px 26px;position:relative;border-top:1px solid rgba(0,0,0,.08)}
  .slide.dark li{border-top:1px solid rgba(255,255,255,.1)}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;background:var(--accent);
    border-radius:2px;transform:rotate(45deg)}
  .score{display:flex;gap:18px;margin-top:26px;flex-wrap:wrap}
  .stat{flex:1;min-width:150px;border:1px solid var(--rule);border-radius:10px;padding:18px}
  .stat b{font-family:'Poppins';font-weight:800;font-size:38px;display:block;color:var(--accent)}
  .stat span{font-size:14px;color:var(--muted)}
  .slide.dark .stat span{color:#cfc8ba}
  .num{font-family:'Poppins';font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.12em}
  .foot{position:absolute;bottom:22px;left:60px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .slide.dark .foot{color:#9a9488}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:52ch}
  .cta-step{font-family:'Poppins';font-weight:700;font-size:22px;margin-top:16px}
  .accent{color:var(--accent)}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);opacity:.6}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Coach Bru',
    h:'Coach Your Business Like a Championship Team',
    lead:'The Sport of Business: how the best leaders turn effort into a system that wins.'},

  {t:'who', kick:'Who this is for',
    h:'For leaders whose teams are busy, not winning',
    lead:'You have good people and a clear goal. The results still come in uneven, and nobody can tell you why.'},

  {t:'trap', kick:'The trap',
    big:'You set the goal. You repeat the goal. The team still misses the goal.',
    body:'So you push harder on effort and accountability. Next quarter looks a lot like the last one.'},

  {t:'reframe', dark:true, kick:'The reframe',
    big:'The problem was never the goal. It is that nobody is coaching the practice.',
    body:'Championship teams and amateur teams want the same thing. One builds a system to get there. The other relies on effort and hope.'},

  {t:'part', kick:'Part one', h:'Why effort is not a system',
    lead:'What separates a team that performs under pressure from one that folds.'},

  {t:'content', kick:'The committee problem',
    h:'Run by consensus, accountable to no one',
    body:'When every call is made by committee, the play belongs to everyone and to no one. Effort is high, ownership is low, and the scoreboard shows it.'},

  {t:'content', kick:'The practice gap',
    h:'Amateurs practice until they get it right',
    big:'Professionals practice until they cannot get it wrong.',
    body:'The gap between the two is not talent. It is how deliberately they practice the few things that decide the game.'},

  {t:'part', dark:true, kick:'Part two', h:'The Coach Approach',
    lead:'The system I have used from the locker room to the boardroom, built on four moves.'},

  {t:'pillar', kick:'Move one', h:'Practice design that compounds',
    body:'Decide the handful of reps that actually move the score, then build the week so your team runs them on repeat. Small, correct, and constant beats big and occasional.'},

  {t:'pillar', kick:'Move two', h:'In-game adjustments under pressure',
    body:'A plan is a starting point, not a script. The best coaches read the field at halftime and change the practice, not the goal. Your team needs a way to adjust without panic.'},

  {t:'pillar', kick:'Move three', h:'A culture that travels',
    body:'Stadium Status is a standard, not a stadium. When the standard is clear, it holds up on the road, in a down quarter, and when you are not in the room. Culture that only works when you are watching is not culture.'},

  {t:'pillar', dark:true, kick:'Move four', h:'Chin up, chest out, move forward',
    body:'Every team takes a loss. The performance variable is what happens in the 48 hours after. You can coach the response to adversity, and it is the most repeatable advantage there is.'},

  {t:'part', kick:'Part three', h:'A season run like a program',
    lead:'What a week, and a quarter, look like when the Coach Approach is in place.'},

  {t:'content', kick:'The week',
    h:'Run the week like a practice plan',
    body:'Every meeting has a purpose, a rep, and a score. You stop confusing activity with progress, because the plan tells you which reps count.'},

  {t:'score', kick:'The scoreboard',
    h:'Coach the leading indicators',
    lead:'Most leaders stare at the lagging number. Champions coach the inputs that produce it.',
    stats:[['Lagging','the result you cannot change today'],['Leading','the reps you can coach this week'],['Response','what you do after a loss']]},

  {t:'why', dark:true, kick:'Why me',
    h:'I have coached this at every level',
    body:'Three-time coach of the year. On-air for ESPN Radio and Fox Sports. I have worked with college athletic departments, Major League Baseball organizations, and corporate teams. Forbes named me to its Top 10 Consultants Who Avoid The B.S.'},

  {t:'recap', kick:'The system',
    h:'Four moves, one standard',
    recap:['Practice design that compounds','In-game adjustments under pressure','A culture that travels','Chin up, chest out, move forward']},

  {t:'cta', kick:'Your next step',
    h:'Bring the Coach Approach to your team',
    step:'If you want the full system for your organization, let us talk about what a build looks like for your team.',
    disc:'This masterclass is educational. Nothing here is a guaranteed outcome or an income promise. Results vary with your team, your market, and your execution.'}
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.dark ? ' dark' : '');
  let html = '';
  if(s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if(s.h) html += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if(s.big) html += '<p class="big">'+s.big+'</p>';
  if(s.body) html += '<p class="body">'+s.body+'</p>';
  if(s.recap){ html += '<ul>'; for(const r of s.recap) html += '<li>'+r+'</li>'; html += '</ul>'; }
  if(s.stats){ html += '<div class="score">'; for(const st of s.stats) html += '<div class="stat"><b>'+st[0]+'</b><span>'+st[1]+'</span></div>'; html += '</div>'; }
  if(s.step) html += '<p class="cta-step">'+s.step+'</p>';
  if(s.disc) html += '<p class="disc">'+s.disc+'</p>';
  html += '<div class="foot">Coach Bru &middot; The Sport of Business</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
