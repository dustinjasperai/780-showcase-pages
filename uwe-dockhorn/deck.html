<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Decision You Carry Alone, Uwe Dockhorn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#00293c;
  --panel:#0b3246;
  --rule:#6f6346;
  --accent:#b09d67;
  --ink:#e8e4d8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Space Grotesk',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
.slide{display:none;width:100%;max-width:1040px}
.slide.on{display:block;animation:f .4s ease}
@keyframes f{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.k{font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:28px}
h1{font-family:'Prata',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,70px);line-height:1.07;letter-spacing:-.01em}
h2{font-family:'Prata',Georgia,serif;font-weight:600;font-size:clamp(28px,4.4vw,48px);line-height:1.12}
.accent{color:var(--accent)}
.sub{font-size:clamp(18px,2.2vw,26px);line-height:1.5;color:#cfd6dd;margin-top:26px;max-width:40ch}
.body{font-size:clamp(17px,2vw,23px);line-height:1.6;color:#cfd6dd;margin-top:24px;max-width:46ch}
ul{list-style:none;margin-top:30px;max-width:48ch}
li{position:relative;padding-left:40px;margin-bottom:20px;font-size:clamp(16px,1.9vw,22px);line-height:1.45;color:#dce2e8}
li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;border:2px solid var(--accent);border-radius:4px;transform:rotate(45deg)}
li b{color:var(--ink);font-weight:700}
.section h1{font-size:clamp(30px,5vw,58px)}
.section .k{color:var(--accent)}
.rule{width:64px;height:3px;background:var(--accent);border-radius:3px;margin:34px 0}
.panel{background:var(--panel);border:1px solid rgba(176,157,103,.28);border-radius:16px;padding:40px 44px;margin-top:30px}
.who{font-size:clamp(16px,1.9vw,22px);color:#cfd6dd;line-height:1.6}
.who b{color:var(--accent)}
.disc{font-size:14px;line-height:1.6;color:#9aa6b0;margin-top:30px;max-width:54ch}
.nav{position:fixed;bottom:22px;right:30px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7d8a93;z-index:5}
.brandfoot{position:fixed;bottom:22px;left:30px;font-size:13px;letter-spacing:.08em;color:#7d8a93;z-index:5}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin:0 2px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.card{background:var(--panel);border:1px solid rgba(176,157,103,.28);border-radius:14px;padding:26px 24px}
.card .n{font-family:'Prata',Georgia,serif;color:var(--accent);font-size:26px;font-weight:700}
.card .t{margin-top:10px;font-size:17px;font-weight:700;color:var(--ink)}
.card .d{margin-top:8px;font-size:15px;color:#b9c2cb;line-height:1.45}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandfoot">Uwe Dockhorn · Strategic Advisor</div>
<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass for pioneer CEOs', h:'The Decision You Carry Alone', sub:'How pioneer CEOs read the signal before the data catches up, and move with structure instead of pressure.'},
  {t:'whofor', k:'Who this is for', h:'You built the company. Now you carry the calls.', who:'Founder-led companies, <b>most often 20 to 30 people</b> and <b>$3 to $12M in revenue</b>. You read the shift before the data confirms it. And the biggest directional decisions land on you, with nowhere safe to set them down.'},
  {t:'point', k:'The quiet problem', h:'The weight is not the decision. It is carrying it alone.', body:'A directional call you cannot talk through anywhere gets carried too long. The longer it sits, the more your sense of timing bends around it.'},
  {t:'reframe', k:'The reframe', h:'Relief does not come from a fix. It comes from the situation finally making sense.', body:'You usually know more than you think. The work is making the knowing legible, so the decision stops feeling like a leap in the dark.'},
  {t:'section', k:'Part One', h:'Why the timing keeps slipping'},
  {t:'point', k:'Isolation distorts timing', h:'Alone, every option looks either too early or too late.', body:'Without a structured read, you oscillate. You wait for certainty that never arrives, or you move on pressure and second-guess it for months.'},
  {t:'point', k:'More data is not the answer', h:'The dashboard confirms the past. You are deciding about the future.', body:'The leaders who move well are not the ones with more reports. They are the ones who can separate the signal from the noise and read where things actually are.'},
  {t:'section', k:'Part Two', h:'KAiROS: a structured read of the decision'},
  {t:'kairos', k:'The KAiROS method', h:'One decision, read three ways.', sub:'Not advice. A structured, evidence-validated read of where you are, what stage you are in, and how to move.'},
  {t:'reads', k:'Read one', h:'Where you are', body:'Five readiness reads, honestly scored, so capability and reality are on the table before commitment.', items:['<b>Capability:</b> does what you have match what the move needs','<b>Demand:</b> is it real and evidenced, or assumed','<b>Compliance:</b> is the path actually clear','<b>Organization:</b> can the company carry the change','<b>Stakeholders:</b> who is aligned, and who is not']},
  {t:'point', k:'Read two', h:'What stage you are in', body:'Using a development spectrum to place the company in its real phase, each with its own characteristic pressures, so the move fits the stage you are actually in and not the one you wish you were.'},
  {t:'reads', k:'Read three', h:'How to move', body:'Seven factors that turn a direction into a sequence you can stand behind.', items:['Direction and market timing','Capacity and the people affected','Resources, sequence, and order of moves','The early signals that tell you it is working']},
  {t:'point', k:'The inner move', h:'Letting go and letting in', body:'Before the structure can land, there is a shift: letting go of the version you have been defending, and letting in what the situation is actually telling you. That is where clarity starts.'},
  {t:'section', k:'Part Three', h:'Inside a KAiROS engagement'},
  {t:'arc', k:'A three week arc', h:'From a call you carry to a direction you can stand behind.', cards:[['Week 1','Gather','The full picture, in confidence, with nothing performed for the room.'],['Week 2','Analyze','The three reads applied, signal separated from noise.'],['Week 3','Direction','A direction you can see the shape of and stand behind.']]},
  {t:'point', k:'What changes', h:'You stop guessing whether it is too early.', body:'You leave with the decision made legible, the timing read, and a direction that holds up when the team asks you why. Never too early. Never alone.'},
  {t:'whyme', k:'Why me', h:'Seventeen years of the conversation only you can have.', who:'Systemic coach, train-the-trainer, and strategic business designer. <b>17+ years</b> advising founder-CEOs across <b>hundreds of executive conversations</b> on <b>three continents</b>. Creator of KAiROS and host of ROIAL C-Suite Truths. German precision, global perspective.'},
  {t:'recap', k:'The one idea', h:'Read the signal before the data catches up.', body:'You already see the shift. KAiROS gives you the structure to act on it, with confidence instead of pressure.'},
  {t:'cta', k:'Your next step', h:'Bring the next directional decision to a room built for it.', body:'Book a free Strategic Advisory Consultation. No obligation, no pitch. A steady place to bring the decision, so you never carry it alone.', disc:'This masterclass is educational. It shares a decision-making method, not advice for your specific situation, and no particular business result or outcome is guaranteed. Results vary with your circumstances and execution.'}
];
const stage=document.getElementById('stage');
const nav=document.getElementById('nav');
function esc(s){return s||'';}
function render(a){
  if(a.t==='title'||a.t==='kairos'){
    return `<div class="k">${esc(a.k)}</div><h1>${esc(a.h)}</h1>${a.sub?`<div class="sub">${a.sub}</div>`:''}`;
  }
  if(a.t==='section'){
    return `<div class="section"><div class="k">${esc(a.k)}</div><h1>${esc(a.h)}</h1><div class="rule"></div></div>`;
  }
  if(a.t==='whofor'||a.t==='whyme'){
    return `<div class="k">${esc(a.k)}</div><h2>${esc(a.h)}</h2><div class="panel"><div class="who">${a.who}</div></div>`;
  }
  if(a.t==='reads'){
    return `<div class="k">${esc(a.k)}</div><h2>${esc(a.h)}</h2>${a.body?`<div class="body">${a.body}</div>`:''}<ul>${a.items.map(i=>`<li>${i}</li>`).join('')}</ul>`;
  }
  if(a.t==='arc'){
    return `<div class="k">${esc(a.k)}</div><h2>${esc(a.h)}</h2><div class="grid3">${a.cards.map(c=>`<div class="card"><div class="n">${c[0]}</div><div class="t">${c[1]}</div><div class="d">${c[2]}</div></div>`).join('')}</div>`;
  }
  if(a.t==='cta'){
    return `<div class="k">${esc(a.k)}</div><h1>${esc(a.h)}</h1><div class="body">${a.body}</div><div class="disc">${a.disc}</div>`;
  }
  // point / reframe / recap
  return `<div class="k">${esc(a.k)}</div><h2>${esc(a.h)}</h2>${a.body?`<div class="body">${a.body}</div>`:''}`;
}
let i=0;
stage.innerHTML=S.map((a,n)=>`<div class="slide${n===0?' on':''}" data-n="${n}">${render(a)}</div>`).join('');
const slides=[...document.querySelectorAll('.slide')];
function show(n){i=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,k)=>s.classList.toggle('on',k===i));nav.innerHTML=`${i+1} <span class="dot"></span> ${S.length}`;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(i+1);if(e.key==='ArrowLeft')show(i-1);});
stage.addEventListener('click',()=>show(i+1));
show(0);
</script>
</body>
</html>
