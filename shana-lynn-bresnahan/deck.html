<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Membership They Never Want to Leave - Community Cultivated</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Raleway:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ee; --panel:#fffdf9; --ink:#0d0c0d; --rule:#162524; --accent:#c6b095;
    --muted:#4d4d4d;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:'Raleway',system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid #ece3d6;border-radius:14px;
    padding:48px 52px;margin:22px 0;box-shadow:0 1px 0 #efe7da;position:relative;
    min-height:360px;display:flex;flex-direction:column;justify-content:center}
  .slide::before{content:"";position:absolute;left:0;top:28px;bottom:28px;width:4px;
    background:var(--accent);border-radius:4px}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--rule);font-weight:600;margin:0 0 14px}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:700;font-size:44px;
    line-height:1.12;margin:0 0 16px}
  h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:32px;
    line-height:1.15;margin:0 0 14px}
  p{font-size:19px;margin:0 0 14px;max-width:62ch}
  .lead{font-size:22px;color:var(--ink)}
  .muted{color:var(--muted)}
  ul{margin:8px 0 0;padding:0 0 0 2px;list-style:none}
  li{font-size:19px;margin:0 0 14px;padding-left:26px;position:relative;max-width:64ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;
    background:var(--accent);border-radius:50%}
  .pillar{font-family:'Playfair Display',serif;font-weight:600}
  .big{font-size:30px;font-family:'Playfair Display',serif;color:var(--rule)}
  .foot{max-width:960px;margin:10px auto 0;padding:0 20px;color:var(--muted);font-size:13px}
  .cta h1{color:var(--rule)}
  .num{position:absolute;right:24px;top:20px;font-size:12px;color:#b9ac97;letter-spacing:.1em}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:18px;max-width:70ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<p class="foot">Community Cultivated with Shana Lynn Bresnahan - a live masterclass for membership and subscription business owners.</p>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass with Shana Lynn',h:'A Membership They Never Want to Leave',p:'The four-pillar retention system for keeping the members you already paid to acquire.'},
 {t:'promise',eyebrow:'What you will walk away with',h:'The back end, finally handled',li:['Why members really leave, and why it is almost never a marketing problem','The four pillars that turn a leaky membership into one people stay in for years','A proactive retention system you can run without burning out your team']},
 {t:'who',eyebrow:'Who this is for',h:'You, if acquisition is working',p:'You run a membership, subscription, or community. New members come in. You have a real offer and a real audience. But quietly, out the back, people keep cancelling, and every churned member is revenue you already paid to earn walking out the door.'},
 {t:'trap',eyebrow:'The trap',h:'So you pour more into the front door',p:'More ads. More launches. More content. The top of the funnel gets all the attention because that is where everyone tells you growth comes from. Meanwhile the leak at the back gets wider, and you are running faster just to stay in the same place.'},
 {t:'reframe',eyebrow:'The reframe',h:'Growth is a back-end problem',lead:true,p:'You do not have a traffic problem. You have a retention problem wearing a traffic problem costume. Raise retention a few points and lifetime value multiplies, without adding a single new member. That is the math most memberships never run.'},
 {t:'part',eyebrow:'Part one',h:'Why members leave'},
 {t:'body',eyebrow:'The real reasons',h:'It is rarely the price',li:['They never found a reason to belong beyond the content','They lurked, never connected, and nobody noticed when they went quiet','Onboarding handed them everything at once and overwhelmed them','The community only ever heard from you, never from each other']},
 {t:'body',eyebrow:'The cost of reactive',h:'Firefighting cancellations',p:'When retention is reactive you only find out someone is leaving the moment they click cancel. By then the relationship is already gone. A retention system catches the drift weeks earlier, while you can still do something about it.'},
 {t:'part',eyebrow:'Part two',h:'The Community Cultivated Framework'},
 {t:'body',eyebrow:'Four pillars',h:'Where retention actually comes from',p:'A community people never want to leave is not an accident. It stands on four pillars. Most memberships are strong on one and silent on the rest.'},
 {t:'body',eyebrow:'Pillar one',h:'Cause',p:'The bedrock. A shared cause always outshines a shared interest. Members stay for a purpose, a path, and visible progress toward it, not for a content library.'},
 {t:'body',eyebrow:'Pillar two',h:'Culture',p:'The beliefs your community lives by, and the behaviors that prove them. "Progress over polish" means members share the messy first draft. "Celebration matters" means every small win gets seen. Culture is what you reward.'},
 {t:'body',eyebrow:'Pillar three',h:'Communication',p:'Two directions, not one. Outgoing is your announcements and content. Incoming is you listening to members. If you are the only one talking, you are broadcasting, not building a community.'},
 {t:'body',eyebrow:'Pillar four',h:'Connection',p:'The reason people join and the reason they stay. Member-to-member bonds are the strongest retention lever there is, because people do not cancel on their people.'},
 {t:'part',eyebrow:'Part three',h:'Running it as a system'},
 {t:'body',eyebrow:'From reactive to proactive',h:'A system, not a scramble',li:['Map where your community sits in its development life cycle','Activate quiet members before they drift, do not just manage the loud ones','Design the standout moments that make staying feel personal','Review the signals weekly so churn is caught early, not at cancel']},
 {t:'body',eyebrow:'When the back end holds',h:'The result',p:'Retention stops being the thing you dread checking. Members renew because belonging is designed in, not hoped for. Your team runs the system instead of chasing fires. And the growth you work so hard for at the front door finally stays in.'},
 {t:'whyme',eyebrow:'Why learn this from me',h:'Shana Lynn Bresnahan',p:'I am the retention and member-experience strategist behind many of the 7 and 8-figure online brands you already know, with more than fifteen years inside online communities. Community Cultivated is where I help membership and subscription businesses fix the back end so the members they earn actually stay.'},
 {t:'cta',eyebrow:'Your next step',h:'Build your retention system with me',p:'If acquisition is working but churn is draining the revenue you earned, let us fix the back end together. Apply to work with me inside Community Cultivated and we will build the retention system your membership has been missing.',cta:'Apply to work together at shanalynn.com',disc:'Educational only. This masterclass shares strategy and frameworks for building member retention. It is not a guarantee of income or specific results; outcomes vary with your market, offer, and effort.'}
];
const d=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let html='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.eyebrow) html+='<p class="eyebrow">'+s.eyebrow+'</p>';
  if(s.t==='title'||s.t==='cta'||s.t==='reframe'||s.t==='whyme'||s.t==='promise'||s.t==='who'||s.t==='trap'||s.t==='body'){
    html+= (s.t==='body') ? '<h2>'+s.h+'</h2>' : '<h1>'+s.h+'</h1>';
  } else if(s.t==='part'){
    html+='<h1>'+s.h+'</h1>';
  }
  if(s.p) html+='<p class="'+(s.lead?'lead':'')+'">'+s.p+'</p>';
  if(s.li){ html+='<ul>'; s.li.forEach(x=>html+='<li>'+x+'</li>'); html+='</ul>'; }
  if(s.cta) html+='<p class="big">'+s.cta+'</p>';
  if(s.disc) html+='<p class="disclaimer">'+s.disc+'</p>';
  el.innerHTML=html;
  d.appendChild(el);
});
</script>
</body>
</html>
