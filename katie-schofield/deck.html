<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Science of Colour, a masterclass with Katie Schofield</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,600&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c1614;
    --panel:#241d1a;
    --rule:#cf9b6a;
    --dim:#b8a89a;
    --ink:#f4ece3;
    --accent:#cf9b6a;
    --head:'Spectral',Georgia,serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid rgba(207,155,106,.20);border-radius:16px;
    padding:64px 74px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(0,0,0,.34);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* a single caramel pigment stroke climbing from the left */
  .slide::before{content:'';position:absolute;top:0;left:0;height:6px;width:42%;
    background:linear-gradient(90deg,var(--accent),rgba(207,155,106,0));border-radius:0 0 6px 0}
  .kick{font-family:var(--body);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:68px;line-height:1.03;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:48px;line-height:1.07;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.15;margin:0 0 12px}
  p{font-family:var(--body);font-size:22px;line-height:1.55;color:var(--dim);margin:0 0 14px;max-width:46ch}
  .lead{font-size:26px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.42;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid rgba(207,155,106,.18)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:15px;height:15px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:700}
  li span{display:block;color:var(--dim);font-size:17px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:128px;line-height:.96;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:1.5px rgba(244,236,227,.34);position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid rgba(207,155,106,.20);border-radius:14px;padding:24px 26px}
  .cell .n{font-family:var(--head);color:var(--ink);font-size:28px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:58px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#1c1614;
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:800;font-size:16px;top:14px;left:6px}
  .who{font-size:19px;color:var(--dim);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--dim);margin-top:26px;max-width:64ch;line-height:1.45}
  .ctaline{font-size:23px;color:var(--ink);margin-top:8px;max-width:52ch}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--dim);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--dim);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid rgba(207,155,106,.22);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:rgba(207,155,106,.28);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:44px}h2{font-size:34px}.big{font-size:78px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Katie Schofield · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Science of Colour',p:'Why permanent makeup heals the way it does, and how to read skin, choose pigment and predict the healed result with confidence instead of guesswork.',pres:'A live session with <b>Katie Schofield</b>'},
 {t:'promise',kick:'What you will leave with',h:'Three shifts, in one live hour.',li:[['Read the skin before the pigment','A way to read any client\'s tone and undertone first, so the pigment decision is made on purpose.'],['Predict the healed colour','Why the same pigment behaves differently from one skin to the next, and how to see the healed result coming.'],['A repeatable colour decision','One method you run every time, instead of a chart you hope works on the next face.']]},
 {t:'audience',kick:'Who this is for',h:'Your work looks perfect fresh. It does not always heal that way.',p:'For permanent makeup artists who can do the work, but watch brows heal too warm, too ashy or too grey on some clients and not others, and cannot always say why it happened.',who:'<b>The trap:</b> you memorised the pigment chart, you followed it exactly, and it still healed wrong, so you are left guessing what to change next time.'},
 {t:'reframe',kick:'The reframe',big1:'Memorising.',big2:'Or <span class="em">understanding</span>.',p:'A chart tells you what to reach for. It never tells you why, so the moment the skin changes, the recipe breaks. Understanding why colour, pigment and skin behave the way they do is what lets you adapt to any client. That shift is the whole session.'},
 {t:'part',kick:'Part one',h:'Why beautiful work heals wrong.'},
 {t:'point',kick:'The core problem',h:'The chart is not the cause.',p:'Pigment charts tell you what to pick. They cannot tell you why a colour turned in the skin, because the chart never met your client. The variable that decides the healed result is the skin itself, and that is the part most training skips.'},
 {t:'point',kick:'The core problem',h:'The skin decides.',p:'Undertone, thickness, melanin and age all change how a pigment reads going in and how it settles as it heals. That is why one client\'s brows heal beautifully and another\'s do not, on the exact same pigment and the exact same hand.'},
 {t:'framework',kick:'The core problem',h:'What you see, and what heals.',row:[['Fresh on the day','Rich, crisp and true to the pigment in the cap. This is the result everyone photographs, and the one that fools you.'],['Healed weeks later','Warmer, cooler or greyer, moved by the skin it settled into. This is the only result that actually counts.']],p:'The gap between those two pictures is colour chemistry and skin, not your technique. Close that gap and the corrections stop.'},
 {t:'part',kick:'Part two',h:'The colour theory that predicts healing.'},
 {t:'point',kick:'Pillar one',h:'Read the undertone first.',p:'Before you open a single pigment, you read the skin\'s underlying tone, warm, cool or neutral, not the surface colour. This one read is what stops brows healing ashy or too warm, and it is the decision the chart cannot make for you.'},
 {t:'point',kick:'Pillar two',h:'Know how the pigment will shift.',p:'Every pigment has a base that leans warm, cool or neutral, and that base moves as it heals. When you understand the chemistry, you are not choosing the colour you want on the day, you are choosing the colour it will become.'},
 {t:'point',kick:'Pillar three',h:'Predict the heal, do not hope for it.',p:'Depth, skin type, including high melanin and mature skin, and aftercare all pull the final colour. Once you can see how each one moves the result, you place work that heals the way you planned, on skin most artists find unpredictable.'},
 {t:'cycle',kick:'The decision in order',h:'The colour choice, step by step.',steps:['Read the skin\'s underlying tone before anything else','Name the undertone you are working with, warm, cool or neutral','Match a pigment base that will heal to the tone you want','Adjust for depth, skin type and how it will settle','Place the work knowing the healed result you are aiming at'],p:'You do not guess and correct. You run the same five steps every time, and the healed result stops being a surprise.'},
 {t:'part',kick:'Part three',h:'On your own clients.'},
 {t:'looks',kick:'The outcome',h:'Predictable heals, on any skin.',li:[['Fewer corrections','Work that heals the way you planned means less reworking, fewer awkward reviews and more of your day spent on new clients.'],['Confidence on every skin type','High melanin, mature and difficult skin stop being the jobs you dread, because you can read and plan for them.'],['Results that sell themselves','Consistent healed brows are the portfolio that books the next client, without discounting or chasing.']]},
 {t:'whyme',kick:'Why learn this from Katie',h:'Fifteen years, and every skin type.',li:[['The colour theory teacher','Colour theory is the hardest part of permanent makeup, and it is the thing Katie is known for teaching clearly.'],['Reached over 1.6 million','Her teaching on colour, pigment and healing has reached more than 1.6 million people, and raised standards across the industry.'],['Tested on the hard cases','Fifteen years across every skin type, including high melanin, mature skin and male brows, judged at international level.']]},
 {t:'cta',kick:'Your next step',h:'Want to learn the whole method?',ctas:['<b>Join the waitlist for the next intake of Katie\'s mentorship</b>, where the full colour, pigment and healing method is taught step by step, with feedback on your own work.','Come with the client skin type you find hardest to predict, and that is where we will start.'],disc:'This masterclass is educational. It shares approaches for reading skin and choosing pigment; it is not medical advice, not advice for your specific client, and not a guarantee of any particular result. Outcomes vary by artist, client skin and technique.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--dim)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
