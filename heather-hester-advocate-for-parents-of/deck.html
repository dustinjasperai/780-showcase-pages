<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First Conversation — a live masterclass with Heather Hester</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6f4; --panel:#ffffff; --rule:#ecdcd6;
    --accent:#c94268; --accent2:#3f9d8f; --ink:#2a2126; --muted:#6c5b61;
    --head:'Montserrat',system-ui,sans-serif; --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:54px 56px;margin:26px 0;box-shadow:0 18px 40px rgba(201,66,104,.06);min-height:420px;
    display:flex;flex-direction:column;justify-content:center}
  .slide.title{background:linear-gradient(140deg,#fff 0%,#fdeef1 100%)}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 18px}
  .part{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--accent2);margin:0 0 10px}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.12;margin:0 0 16px}
  .sub{font-size:22px;color:var(--muted);margin:0 0 10px}
  .note{font-family:var(--head);font-weight:600;font-size:15px;color:var(--accent);margin-top:22px}
  .quote{font-family:var(--body);font-style:italic;font-size:34px;line-height:1.3;margin:0}
  ul{margin:14px 0 0;padding:0 0 0 2px;list-style:none}
  li{position:relative;padding:10px 0 10px 34px;font-size:21px;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:'';position:absolute;left:4px;top:19px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .disc{font-family:var(--head);font-size:13px;color:var(--muted);margin-top:26px;line-height:1.5}
  .cta h2{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', k:'A live masterclass', h:'The First Conversation', sub:'What to say, and who to be, in the weeks after your teen comes out', note:'with Heather Hester'},
 {t:'point', h:'This hour is for you if', bullets:['Your teen recently came out, or is quietly questioning','You froze, said the wrong thing, or said nothing at all','You love your kid, and you are terrified of getting this wrong']},
 {t:'point', k:'The trap', h:'You had a script for everything else', sub:'Sleep, screens, curfews, homework. For this one moment, nobody handed you any words at all.'},
 {t:'quote', quote:'The problem was never your love. It was that nobody ever taught you what to say.'},
 {t:'part', part:'Part One', h:'Why the first weeks feel impossible'},
 {t:'point', h:'Fear speaks first', sub:'Old conditioning, guilt, and fear move faster than you do. They freeze you, and the freeze reads as rejection.'},
 {t:'point', h:'Silence is also an answer', sub:'A teen who just told you the truest thing about themselves reads a long pause as a verdict. The quiet is rarely heard as love.'},
 {t:'part', part:'Part Two', h:'The Brave Belonging Method'},
 {t:'point', k:'Step one', h:'Unlearn', bullets:['Let go of the fear, guilt, and old conditioning keeping you frozen','Name your own triggers before they drive the conversation','Your first reaction is yours to hold, not your child to carry']},
 {t:'point', k:'Step two', h:'Embrace', bullets:['Rebuild the way you talk to each other, one exchange at a time','Lead with curiosity instead of dread','Offer yourself the same compassion you want to offer them']},
 {t:'point', k:'Step three', h:'Empower', bullets:['Move from frozen into confident, steady action','Build a home where pride and belonging are simply the baseline','Let your teen be fully themselves in their own house']},
 {t:'point', k:'The practice', h:'Confident Kindness', sub:'Staying grounded and compassionate even when the conversation feels hard.', bullets:['Listen more','Judge less','Make room for repair']},
 {t:'point', h:'What repair actually sounds like', sub:'Not a perfect speech. A door left open: I did not handle that the way I wanted to. Can we try again? I am still learning, and I am not going anywhere.'},
 {t:'part', part:'Part Three', h:'Your home, thirty days on'},
 {t:'point', h:'Thirty days from here', bullets:['A teen who tests the waters again, because last time was safe','A parent who has a next sentence ready instead of a held breath','A home that feels honest, not careful']},
 {t:'point', h:'You do not need the perfect words', sub:'You just need the next one. Confident Kindness is a practice, not a performance, and practice is something you can start tonight.'},
 {t:'why', part:'Why me', h:'I have been exactly where you are', sub:'When my own teenage son came out, I felt love and fear in the same breath, and I realized how much I still had to unlearn. That is why I wrote Parenting with Pride and host the podcast More Human. More Kind. This is the work I needed, built for you.'},
 {t:'quote', quote:'Your child did not need you to be an expert. They needed you to stay.'},
 {t:'cta', h:'Let us have the next conversation together', sub:'If you want help having these conversations in your own home, book a free discovery call with me and we will map your next step together.', disc:'This masterclass is educational and is not therapy, counseling, or medical advice. Outcomes are not guaranteed, and results vary from family to family.'}
];
const E=s=>s==null?'':String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='title'?'title':s.t==='cta'?'cta':'');
  let html='';
  if(s.k) html+='<p class="k">'+E(s.k)+'</p>';
  if(s.part) html+='<p class="part">'+E(s.part)+'</p>';
  if(s.quote){ html+='<p class="quote">'+E(s.quote)+'</p>'; }
  else {
    if(s.h) html+=(s.t==='title'?'<h1>':'<h2>')+E(s.h)+(s.t==='title'?'</h1>':'</h2>');
    if(s.sub) html+='<p class="sub">'+E(s.sub)+'</p>';
    if(s.bullets){ html+='<ul>'; s.bullets.forEach(b=>html+='<li>'+E(b)+'</li>'); html+='</ul>'; }
    if(s.note) html+='<p class="note">'+E(s.note)+'</p>';
    if(s.disc) html+='<p class="disc">'+E(s.disc)+'</p>';
  }
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
