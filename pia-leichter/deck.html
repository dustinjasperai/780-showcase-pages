<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become the Creative Director of Your Work — Pia Leichter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Albert+Sans:wght@400;500;600;700&family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,500;0,6..96,600;1,6..96,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f7f3; --panel:#efe7d7; --ink:#261a17; --accent:#ce795b; --olive:#857d60;
    --serif:"Bodoni Moda",Georgia,serif; --sans:"Albert Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--sans)}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{position:relative;background:var(--bg);border:1px solid rgba(38,26,23,.12);
    border-radius:14px;padding:72px 64px;min-height:560px;margin:0 0 28px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden}
  .slide .num{position:absolute;top:22px;right:28px;font-size:12px;letter-spacing:.14em;
    color:var(--olive);font-weight:600}
  .kicker{font-size:12.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:600;font-size:58px;line-height:1.04;
    letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.08}
  .sub{font-size:20px;line-height:1.5;color:#4a3a33;margin-top:22px;max-width:30em}
  .body{font-size:19px;line-height:1.6;color:#3a2c26;margin-top:18px;max-width:34em}
  .lead{font-family:var(--serif);font-style:italic;font-size:26px;line-height:1.3;
    color:var(--olive);margin-bottom:14px}
  ul{list-style:none;margin-top:26px;max-width:36em}
  li{font-size:19px;line-height:1.45;padding:14px 0 14px 34px;position:relative;
    border-top:1px solid rgba(38,26,23,.12)}
  li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;
    background:var(--accent);border-radius:3px}
  li b{font-weight:700}
  .part{font-family:var(--serif);font-size:15px;letter-spacing:.06em;color:var(--olive)}
  .dark{background:var(--ink);color:var(--bg);border-color:transparent}
  .dark .sub,.dark .body{color:#e8ddd3}
  .dark .lead{color:var(--accent)}
  .quote{font-family:var(--serif);font-size:34px;line-height:1.22;font-weight:400;
    max-width:24em}
  .who{margin-top:30px;font-size:16px;color:var(--olive);font-weight:600}
  .cta .btn{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;
    font-weight:700;font-size:18px;padding:16px 30px;border-radius:999px;text-decoration:none}
  .disc{margin-top:34px;font-size:13px;line-height:1.5;color:var(--olive);max-width:40em}
  @media(max-width:640px){.slide{padding:44px 26px;min-height:460px}h1{font-size:36px}h2{font-size:28px}.quote{font-size:24px}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"dark", kicker:"A live masterclass with Pia Leichter",
   h:"Become the Creative Director of Your Work",
   sub:"How to stop waiting for someday and start directing the work, and the life, you are actually building.",
   who:"Pia Leichter · Kollektiv Studio · certified coach and award-winning creative director"},

  {t:"who", kicker:"Who this is for",
   h:"You have the idea. You just cannot get it out of you.",
   body:"This is for founders with an emerging vision, executives mid-project, artists reaching for fuller expression, and creative entrepreneurs who know there is bigger, braver work in them and have not yet found the way through."},

  {t:"trap", kicker:"The trap",
   lead:"Someday.",
   h:"The most expensive word in a creative life.",
   body:"You wait for the right time, for permission, for certainty, for the fear to pass. So the book, the brand, the body of work, the bigger life stays a foggy vision. Not because you lack talent. Because no one taught you to direct it."},

  {t:"hook", cls:"dark", kicker:"The real cost",
   quote:"Left undirected, a creative life runs on default. And default is just someone else's direction, quietly becoming yours."},

  {t:"part", part:"Part one", h:"You were never meant to wait for creativity. You were meant to direct it."},

  {t:"problem", kicker:"The core problem",
   h:"We are born creative. Then we forget.",
   body:"You came in a card carrying member of the creative club. Somewhere between school, work, and the opinions of others, the card got lost or quietly taken. So creativity started to feel like something other people do, instead of who you already are."},

  {t:"reframe", kicker:"The reframe that changes everything",
   lead:"That stuck feeling is not a block.",
   h:"It is a creative evolution point.",
   body:"The discomfort means an old version of the work no longer fits. It is the signal of your next becoming, asking what wants to be made through you next. Read that way, being stuck is not failure. It is the doorway."},

  {t:"part", part:"Part two", h:"The method: directing your work on purpose."},

  {t:"pillars", kicker:"Four moves of a creative director",
   h:"You do not need more inspiration. You need direction.",
   list:[
     "<b>Reclaim the card.</b> Start from the fact that you are already creative, not from proving it.",
     "<b>Direct, do not wait.</b> Choose the narrative, the aesthetic, and the next move on purpose.",
     "<b>Follow the next becoming.</b> Ask what wants to be made through you now, not ten years ago.",
     "<b>Treat rest as the strategy.</b> The connected, eureka ideas arrive in the restful, open space, not the grind."
   ]},

  {t:"deep", kicker:"On the hard middle",
   lead:"The work that scares you is usually the work worth doing.",
   h:"This is type two fun.",
   body:"Type one fun feels good while it happens. Type two fun only feels like fulfilment in hindsight, after you have done the brave, uncomfortable thing. Most people quit the moment the work stops feeling easy. A creative director keeps directing."},

  {t:"deep", kicker:"On rest",
   h:"Your next idea is waiting on the other side of real rest.",
   body:"When you stop forcing, the mind keeps working in the background, connecting dots and surfacing the idea you could not reach by pushing. Rest is not the reward for the work. For a creative director, it is part of the work."},

  {t:"part", part:"Part three", h:"What changes when your hand is on the direction."},

  {t:"vision", kicker:"The after",
   h:"The foggy vision becomes a concrete, real world thing.",
   body:"The manuscript gets finished. The brand finally sounds like you. The body of work, the exhibition, the bigger life stops being a someday and becomes a decision you make on purpose, again and again, with your own hand on the direction."},

  {t:"why", cls:"dark", kicker:"Why work with me",
   h:"Part certified coach. Part creative director. Part creative midwife.",
   body:"I spent two decades as an award winning creative director for some of the biggest brands in the world, and I am a certified coach. I bring both to your work. Less advice, more direction. Someone to help you create bigger, braver work, and become who you need to be to make it.",
   who:"Pia Leichter · author of Welcome to the Creative Club · CPCC, ACC"},

  {t:"recap", kicker:"The whole idea in one line",
   quote:"Your life is your biggest creative project. You are allowed to direct it."},

  {t:"cta", cls:"cta dark", kicker:"The invitation",
   h:"Let us direct what you are building next.",
   body:"If something in this is calling, book a discovery call. We will talk about the work you want to make, where you are stuck, and whether working together is the right next move.",
   btn:"Book your discovery call",
   who:"kollektiv.studio",
   disc:"Educational content only. Nothing here is a promise of a specific outcome, income, or result. No income, role, or result is guaranteed. Results vary and depend on your own work and circumstances."}
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide " + (s.cls || "");
  let h = '<div class="num">' + String(i+1).padStart(2,"0") + " / " + String(S.length).padStart(2,"0") + "</div>";
  if (s.kicker) h += '<div class="kicker">' + s.kicker + "</div>";
  if (s.part)   h += '<div class="part">' + s.part + "</div>";
  if (s.lead)   h += '<div class="lead">' + s.lead + "</div>";
  if (s.quote)  h += '<p class="quote">' + s.quote + "</p>";
  if (s.h)      h += (s.part ? '<h1 style="margin-top:14px">' : "<h1>") + s.h + "</h1>";
  if (s.sub)    h += '<p class="sub">' + s.sub + "</p>";
  if (s.body)   h += '<p class="body">' + s.body + "</p>";
  if (s.list){  h += "<ul>"; s.list.forEach(x => h += "<li>" + x + "</li>"); h += "</ul>"; }
  if (s.btn)    h += '<a class="btn" href="https://calendly.com/kollektivstudio/creative-partnership-discovery-call">' + s.btn + "</a>";
  if (s.who)    h += '<div class="who">' + s.who + "</div>";
  if (s.disc)   h += '<div class="disc">' + s.disc + "</div>";
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
