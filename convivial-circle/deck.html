<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why the Chore Chart Keeps Failing, a Masterclass with Mystie Winckler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Nunito+Sans:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#f8f2e6;   /* warm ivory, from her light-scheme brand */
    --panel:#fffdf8;    /* near-white card */
    --rule:#e4d9c2;     /* warm taupe rule */
    --ink:#2d2822;      /* deep warm brown-black */
    --ink-soft:#5a5044; /* muted brown */
    --accent:#c0901a;   /* deep goldenrod, derived from brand gold #ffd700 */
    --serif:'Spectral', Georgia, serif;
    --sans:'Nunito Sans', -apple-system, system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(45,40,34,.04)}
  .slide.title{min-height:540px;background:
    radial-gradient(120% 90% at 85% 10%, rgba(192,144,26,.10), transparent 60%),var(--panel)}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1.14;margin-bottom:10px}
  .sub{font-family:var(--serif);font-style:italic;font-size:24px;color:var(--ink-soft);margin-top:20px}
  .part{font-family:var(--sans);font-weight:900;font-size:15px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .body{font-size:21px;color:var(--ink);max-width:62ch;margin-top:6px}
  .body + .body{margin-top:18px}
  .lead{font-family:var(--serif);font-size:30px;line-height:1.3;max-width:24ch}
  ul{list-style:none;margin-top:26px;display:grid;gap:16px}
  li{position:relative;padding-left:30px;font-size:20px;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:2px;
    background:var(--accent);transform:rotate(45deg)}
  .pillar-name{font-family:var(--serif);font-weight:700;color:var(--accent)}
  .foot{margin-top:30px;font-size:14px;color:var(--ink-soft);border-top:1px solid var(--rule);padding-top:16px}
  .num{position:absolute;top:22px;right:28px;font-size:13px;color:var(--ink-soft);font-weight:700;letter-spacing:.08em}
  .slide{position:relative}
  .cta li::before{background:var(--accent)}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--ink-soft);font-style:italic;line-height:1.5;
    border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .signoff{font-family:var(--serif);font-size:22px;margin-top:22px;color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:'A live masterclass with Mystie Winckler, Simply Convivial',
    title:'Why the Chore Chart Keeps Failing',
    sub:'And what actually makes a home peaceful' },

  {t:'who',
    part:'Who this is for',
    h:'You have tried every system. It still falls apart.',
    body:'This class is for the homeschooling mom who has bought the planners, printed the chore charts, downloaded the apps, and still ends most weeks feeling behind and a little ashamed.',
    bullets:['You are not lazy and you are not disorganized.',
             'You have more information about homemaking than any generation before you.',
             'And you are still exhausted. There is a reason, and it is not another template.'] },

  {t:'content',
    part:'The trap',
    h:'By Thursday, the chart is in ruins',
    lead:'You made the beautiful chart on Sunday. By Thursday nobody is looking at it, and you feel like the failure.' ,
    body:'So you go looking for a better chart. A better planner. A better routine. The cycle resets, and the shame compounds.' },

  {t:'hook',
    lead:'What if the chore chart was never the problem?' },

  {t:'section', part:'Part One', h:'Why every system collapses' },

  {t:'content',
    h:'A system sits on top of an attitude',
    body:'A routine is just a container. If the heart carrying it is resentful, rushed, and convinced the work is beneath her, no container will hold.',
    body2:'This is why the same chart works beautifully for one mom and crumbles for another. The chart is identical. The attitude underneath it is not.' },

  {t:'content',
    h:'The real problem is attention, not information',
    body:'You do not need to learn one more hack. You need to notice what your home and your people actually need in the moment, and respond to it, instead of serving a checklist that stopped matching reality on Tuesday.' },

  {t:'section', part:'Part Two', h:'Organize Your Attitude' },

  {t:'pillar',
    name:'Shift One, Organize Your Attitude',
    body:'Before you reorganize the kitchen, you renew the mind. Homemaking is not a problem to be solved, it is a calling to be received. When the way you think about the work changes, the work itself changes.' },

  {t:'pillar',
    name:'Shift Two, Read, Respond, Repeat',
    body:'Trade obedience to a checklist for trained attention. Read what the home and the family need right now. Respond to it. Repeat. This is responsiveness that survives a hard week, where a rigid chart cannot.' },

  {t:'pillar',
    name:'Shift Three, Learn to Love What Must Be Done',
    body:'The dishes, the laundry, the same meals again. This repetitive, thankless work is not a distraction from your calling. It is the path of humility and sanctification. When you stop resenting it, you stop being exhausted by it.' },

  {t:'pillar',
    name:'The engine, Humble Habits',
    body:'Lasting change in a home does not come from a motivated weekend overhaul. It comes from tiny, faithful, repeated acts. Small and humble, done again tomorrow. That is what actually builds a peaceful home.' },

  {t:'section', part:'Part Three', h:'What a peaceful week actually looks like' },

  {t:'content',
    h:'A day run from a renewed mind',
    body:'Not a perfect day. A real one, with interruptions and spills and a toddler meltdown at 4pm. But a day you move through with attention and contentment instead of a clipboard and a growing sense of defeat.',
    body2:'The work still has to be done. You have simply learned to meet it differently.' },

  {t:'content',
    h:'Contentment in the ordinary',
    body:'When the attitude is renewed, the ordinary stops feeling like a sentence. The repeated work becomes the place you actually live out your faith, in front of the people you love most.' },

  {t:'why',
    part:'Why listen to me',
    h:'Mystie Winckler',
    body:'I am a second-generation homeschooler and a mom of five, two graduated and three still at home. I have been doing this for over two decades.',
    bullets:['Host of the Simply Convivial podcast on biblical homemaking and homeschooling',
             'Author of The Convivial Homeschool',
             'I have taught thousands of moms the attitude-first approach to a peaceful home'] },

  {t:'content',
    h:'The three shifts, together',
    bullets:['Organize your attitude. Renew the mind before the mop closet.',
             'Read, Respond, Repeat. Train attention, not obedience to a list.',
             'Learn to love what must be done. Receive the work as discipleship.'] },

  {t:'cta',
    part:'Where to go from here',
    h:'Step into the Convivial Circle',
    body:'If today helped, this is where the real work happens together. The Convivial Circle is my membership for Christian homemakers: the full courses behind these three shifts, weekly live seminars, monthly community calls, accountability, and a library of more than three hundred lessons.',
    bullets:['Organize Your Attitude, Learn to Love What Must Be Done, and the full course library',
             'Weekly live seminars and monthly community Zoom calls',
             'A community of moms walking the same road'],
    signoff:'Come build a peaceful home with us. Mystie Winckler',
    disclaimer:'This masterclass is offered for educational and encouragement purposes only. Every home and family is different, results vary from person to person, and nothing here is a guarantee of any particular outcome.' }
];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function li(arr){return '<ul>'+arr.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>';}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const n=String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0');
  let cls='slide', inner='';
  if(s.t==='title'){cls+=' title';
    inner='<div class="kicker">'+esc(s.kicker)+'</div><h1>'+esc(s.title)+'</h1><div class="sub">'+esc(s.sub)+'</div>';}
  else if(s.t==='hook'){cls+=' hook';
    inner='<div class="lead">'+esc(s.lead)+'</div>';}
  else if(s.t==='section'){cls+=' section';
    inner='<div class="part">'+esc(s.part)+'</div><h2>'+esc(s.h)+'</h2>';}
  else if(s.t==='pillar'){cls+=' pillar';
    inner='<h2><span class="pillar-name">'+esc(s.name)+'</span></h2><div class="body">'+esc(s.body)+'</div>';}
  else {
    if(s.part) inner+='<div class="part">'+esc(s.part)+'</div>';
    if(s.h) inner+='<h2>'+esc(s.h)+'</h2>';
    if(s.lead) inner+='<div class="lead">'+esc(s.lead)+'</div>';
    if(s.body) inner+='<div class="body">'+esc(s.body)+'</div>';
    if(s.body2) inner+='<div class="body">'+esc(s.body2)+'</div>';
    if(s.bullets) inner+=li(s.bullets);
    if(s.signoff) inner+='<div class="signoff">'+esc(s.signoff)+'</div>';
    if(s.disclaimer) inner+='<div class="disclaimer">'+esc(s.disclaimer)+'</div>';
    if(s.t==='cta') cls+=' cta';
  }
  deck.insertAdjacentHTML('beforeend','<section class="'+cls+'"><span class="num">'+n+'</span>'+inner+'</section>');
});
</script>
</body>
</html>
