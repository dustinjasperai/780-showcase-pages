<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Five-Star Salon — A Masterclass with Patricia Nowakowski</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Raleway:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f2ec; --panel:#ebe1d4; --rule:#ddcfbe;
    --accent:#584948; --ink:#392c28; --body:#5f544d; --dim:#a89a8c;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#efe7db;font-family:'Raleway',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.6%;background:var(--bg)}
  .slide.active{opacity:1}
  .kicker{font-family:'Raleway',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.06;letter-spacing:.002em}
  .t-title h1{font-size:7.0vw;max-width:74%}
  .t-normal h1{font-size:4.3vw;max-width:88%;line-height:1.08}
  .t-normal .body{font-family:'Raleway',sans-serif;font-size:1.24vw;color:var(--body);margin-top:2.9vh;max-width:76%;line-height:1.68;font-weight:400}
  .sub{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:1.9vw;color:var(--accent);margin-top:3.0vh;max-width:82%;line-height:1.36;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.05vw;font-weight:700;color:var(--accent);margin-bottom:1.8vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:6.0vw;max-width:86%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.0vh}
  .t-dark{background:radial-gradient(120% 140% at 80% 10%,#3d302b 0%,#211915 100%)}
  .t-dark h1{color:var(--bg);font-size:5.0vw;max-width:88%;font-weight:500}
  .t-dark h1 .hl{color:#d8c4a6}
  .t-cta{background:radial-gradient(120% 140% at 80% 10%,#3d302b 0%,#211915 100%)}
  .t-cta h1{color:var(--bg);font-size:5.0vw;max-width:86%}
  .t-cta .body{font-family:'Raleway',sans-serif;color:#e7d8c2;font-size:1.3vw;margin-top:2.6vh;max-width:72%;line-height:1.62}
  .chips{display:flex;gap:1.2vw;margin-top:4.0vh;flex-wrap:wrap}
  .chip{border:1.6px solid #d8c4a6;color:var(--bg);border-radius:100px;padding:1.3vh 1.9vw;font-size:1.1vw;font-weight:600;font-family:'Raleway',sans-serif}
  .brandline{font-family:'Raleway',sans-serif;font-size:1.05vw;color:var(--body);margin-top:3.6vh;font-weight:600;letter-spacing:.08em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.0vh;font-family:'Raleway',sans-serif;font-size:.8vw;color:#c8b8a6;line-height:1.5;max-width:84%}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7.5%;top:50%;transform:translateY(-50%);width:19vw;height:19vw;opacity:.95}
  .corner-mo{right:6%;bottom:8%;width:7vw;height:7vw;opacity:.45}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:12vw}.t-normal h1{font-size:8.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.6vw}.t-section h1{font-size:10vw}.t-dark h1{font-size:8.6vw}
    .t-cta h1{font-size:9.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.disc{font-size:2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Opulent Beauty Pro</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a single five-point star over a soft underline, the five-star experience -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#584948" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 20 l9.5 20.6 22.6 2.7 -16.8 15.3 4.6 22.3 -19.9 -11.1 -19.9 11.1 4.6 -22.3 -16.8 -15.3 22.6 -2.7 z" fill="#584948" fill-opacity="0.10"/>
    <path d="M38 96 L82 96" opacity="0.7"/>
    <circle cx="60" cy="58" r="41" opacity="0.28"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Five-Star Salon.',sub:'The masterclass on filling your chairs through a five-star experience and a team that leads like owners, so your books stay full without chasing new clients.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'Your salon is busy. It still runs on you, and the money still leaks out the back.',body:'You do beautiful work, your team is talented, and new clients keep coming in the door. Yet you are the one holding it all together, first-timers quietly drift away, and the numbers never feel as good as the schedule looks. That is not a marketing problem, and it is not a talent problem.'},
 {t:'dark',title:'A new client is the most expensive client you will <span class="hl">ever pay for</span>.'},

 {t:'section',idx:'Part One',title:'Why More Clients Was Never the Fix'},
 {t:'normal',k:'The leaky bucket',title:'You keep pouring new clients into a salon that quietly loses them.',body:'Most owners answer a slow week by chasing more new heads, more ads, more discounts, more hustle. But if a first-time guest does not feel something worth coming back for, you are refilling a leaky bucket. The clients you already served this month are the cheapest, warmest, most profitable growth you will ever have, and they are walking out unrebooked.'},
 {t:'normal',k:'The owner bottleneck',title:'When the experience lives in your hands alone, the salon can never outgrow you.',body:'If you are the only one who greets like it matters, remembers the details, and holds the standard, then every chair but yours delivers a lesser version of your brand. The team is capable. What is missing is a standard they own and a reason to carry it when you are not watching.'},
 {t:'dark',title:'The salon that will make or break your career is the <span class="hl">one you already have</span>.'},

 {t:'section',idx:'Part Two',title:'The Five-Star Experience: How You Make People Feel'},
 {t:'normal',k:'The whole idea in one line',title:'Hospitality is not customer service. It is how you make people feel.',body:'Customer service is the checklist, the water offered, the coat taken. Hospitality is the feeling a guest leaves with, seen, cared for, a little more themselves. That feeling is what they book again, what they tell their friends, and what no discount and no algorithm can copy. Everything below is how you build it on purpose.'},
 {t:'normal',k:'Pillar one, the mindset shift',title:'A five-star salon is a philosophy your whole team lives, not a list of tasks.',body:'Luxury is not the candle or the robe. It is a way of seeing the guest that every person on your floor shares. Before you train a single step, you shift the belief, we are not doing hair, we are making people feel cared for. Get the mindset right and the details take care of themselves. Skip it and the checklist feels hollow.'},
 {t:'normal',k:'Pillar two, emotional foundations',title:'Loyalty is built on how safe and seen a guest feels, not on the transaction.',body:'People come back to the place where they felt genuinely cared for. That means real attention, remembering what matters to them, and a warmth that does not depend on the tip. When a guest feels emotionally safe in your chair, price stops being the conversation and the rebooking becomes automatic. This is the foundation everything else sits on.'},
 {t:'normal',k:'Pillar three, consistent details',title:'Five-star is a hundred small touches, done the same way every single visit.',body:'Luxury lives in the deliberate details, the greeting by name, the timing, the follow-up text, the finish that feels intentional. One great visit is luck. A five-star salon is the same care delivered consistently, by every stylist, on a Tuesday afternoon as much as a Saturday. Consistency is what turns a nice experience into a reputation.'},
 {t:'normal',k:'Pillar four, closing the experience gaps',title:'Find the quiet places your guest journey breaks, and close them one by one.',body:'Between the booking and the goodbye there are small gaps where the experience slips, the unclear parking, the awkward wait, the checkout that feels rushed, the first-timer nobody rebooked. Walk your own salon as a guest and you will feel them. Closing those gaps is often the difference between a full column and a full salon.'},
 {t:'dark',title:'People forget the haircut. They never forget <span class="hl">how you made them feel</span>.'},

 {t:'section',idx:'Part Three',title:'Lead Like An Owner: A Team That Fills Its Own Books'},
 {t:'normal',k:'Ownership, not compliance',title:'You cannot deliver five-star alone. You lead a team that carries it for you.',body:'The experience only scales when your stylists hold the standard as if the salon were theirs. That is a leadership job, not a rules job. You lead like an owner and you teach them to as well, with clear standards, real accountability, and incentives like quarterly bonuses that reward the behavior you actually want. A team that owns the experience fills its own books.'},
 {t:'normal',k:'Why a team, not a building of renters',title:'A commission team can deliver one standard. A hallway of suites cannot.',body:'I built Opulent Beauty as a full-commission salon on purpose, and I walked away from the suite model to do it. A team that shares a standard, a culture, and a way of caring for guests is how you deliver a five-star experience every chair, every time. That shared standard is the asset, and it is the thing you can lead, grow, and be proud of.'},
 {t:'normal',k:'Why Patricia',title:'Two decades behind the chair, a commission salon and six studios, and a lot of receipts.',body:'Patricia Nowakowski has spent over twenty years in the industry, built Opulent Beauty into a full-commission salon plus six studios, and founded Opulent Beauty Pro to teach salon owners what actually worked. She hosts The Elevate Podcast for owners and stylists. Everything here comes from running a real salon, not a theory.'},

 {t:'section',idx:'Your Next Step',title:'Build the Five-Star Salon'},
 {t:'normal',k:'Keep going with Patricia',title:'From a busy salon that runs on you to a five-star salon that fills its own books.',body:'The work is a rhythm, the mindset, the experience your team owns, and the leadership that holds it. Start with the Lead Like An Owner guide, and when you want a set of eyes on your own salon, Patricia coaches owners one to one through exactly this, the experience, the team, and the numbers behind them.'},
 {t:'cta',title:'Ready to build a salon people never forget?',body:'Take the next step with Patricia and Opulent Beauty Pro.',chips:['Read Lead Like An Owner','Book a coaching call with Patricia','Listen to The Elevate Podcast'],disc:'Educational content for salon owners and beauty professionals. No income or business result is guaranteed. Results vary by individual, market, team, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Opulent Beauty <b>Pro</b> · Patricia Nowakowski</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='corner') h+=mo('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
