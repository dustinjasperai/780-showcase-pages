<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Culture in 4D — Growing Leaders From the Middle | Tony Moore</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cantata+One&family=Fira+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14263f;        /* deep form of their dominant navy #1a3764 */
    --panel:#1a3764;     /* their exact header navy */
    --rule:#2c466f;      /* lighter navy, same family */
    --ink:#fffff0;       /* their body ivory */
    --ink-soft:#c7d2e4;  /* muted ivory-blue */
    --accent:#c96a3c;    /* legible form of their terracotta #aa4f25 */
    --serif:'Cantata One', Georgia, serif;
    --sans:'Fira Sans', -apple-system, system-ui, sans-serif;
  }
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased;overflow:hidden;}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .slide{display:none;width:100%;height:100%;padding:7vh 8vw;flex-direction:column;justify-content:center;position:relative;}
  .slide.active{display:flex;animation:fade .45s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:none;}}
  .kicker{font-family:var(--sans);font-size:clamp(11px,1.1vw,14px);font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  h1{font-family:var(--serif);font-size:clamp(34px,6vw,76px);line-height:1.05;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:var(--serif);font-size:clamp(26px,3.6vw,48px);line-height:1.12;margin-bottom:20px;}
  .lead{font-size:clamp(17px,1.9vw,26px);color:var(--ink-soft);max-width:60ch;line-height:1.5;}
  .big{font-family:var(--serif);font-size:clamp(30px,5vw,62px);line-height:1.12;max-width:20ch;}
  .big .hl{color:var(--accent);}
  ul{list-style:none;max-width:60ch;}
  li{font-size:clamp(16px,1.8vw,24px);color:var(--ink-soft);padding:12px 0 12px 34px;position:relative;line-height:1.4;border-bottom:1px solid var(--rule);}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:22px;width:14px;height:14px;background:var(--accent);transform:rotate(45deg);}
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;margin-top:10px;}
  .dcol{background:var(--panel);border-top:3px solid var(--accent);padding:22px 18px;}
  .dcol .d{font-family:var(--serif);font-size:clamp(18px,1.8vw,24px);margin-bottom:8px;}
  .dcol .t{font-size:clamp(13px,1.1vw,15px);color:var(--ink-soft);line-height:1.4;}
  .num{font-family:var(--serif);color:var(--accent);font-size:clamp(20px,2.2vw,30px);margin-bottom:14px;}
  .panelbox{background:var(--panel);border-left:4px solid var(--accent);padding:26px 30px;max-width:64ch;}
  .panelbox p{font-size:clamp(16px,1.7vw,22px);color:var(--ink-soft);line-height:1.5;}
  .panelbox p+p{margin-top:14px;}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;align-items:start;}
  .two .lbl{font-family:var(--sans);font-size:12px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
  .two .box{border:1px solid var(--rule);padding:22px;height:100%;}
  .two .box.after{background:var(--panel);border-color:var(--accent);}
  .two p{font-size:clamp(15px,1.5vw,20px);color:var(--ink-soft);line-height:1.45;}
  .disc{position:absolute;left:8vw;right:8vw;bottom:4vh;font-size:12px;color:var(--ink-soft);opacity:.7;line-height:1.4;}
  .credit{font-size:clamp(15px,1.5vw,20px);color:var(--ink-soft);max-width:60ch;line-height:1.5;}
  .credit strong{color:var(--ink);font-weight:600;}
  .cta-steps{font-size:clamp(16px,1.7vw,22px);color:var(--ink-soft);margin-top:8px;}
  .cta-steps b{color:var(--accent);font-weight:600;}
  #nav{position:fixed;bottom:18px;right:22px;font-family:var(--sans);font-size:12px;color:var(--ink-soft);letter-spacing:.08em;z-index:10;}
  #bar{position:fixed;top:0;left:0;height:3px;background:var(--accent);width:0;transition:width .3s;z-index:10;}
  @media(max-width:720px){.grid4{grid-template-columns:1fr 1fr;}.two{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="bar"></div>
<div id="stage"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title'},
 {t:'audience'},
 {t:'trap'},
 {t:'hook'},
 {t:'part', n:'Part One', h:'Why pulling weeds never ends', lead:'You were promoted for solving problems. So you kept solving them, faster than anyone else. The team learned to bring every problem to you, and the weeds kept growing back.'},
 {t:'panel', kicker:'The core problem', h:'Accountability is the symptom', paras:['When leaders tell me their team will not take ownership, they ask me how to hold people more accountable. That question is the problem.','Holding people accountable is what you do when the culture has not given them a reason to own the outcome themselves. You cannot manage your way out of a culture problem.']},
 {t:'part', n:'Part Two', h:'Culture in 4D', lead:'Culture is not luck and it is not a poster on the wall. It is architecture. You build it across four dimensions, on purpose, with the people who have to live in it.'},
 {t:'grid'},
 {t:'pillar', n:'Dimension 1 of 4', d:'Dream', lead:'Before you touch a single process, name the culture you actually want in plain language your team can repeat back. Most teams drift because nobody ever said out loud what good looks like here.'},
 {t:'pillar', n:'Dimension 2 of 4', d:'Design', lead:'Build the behaviors, rituals and decisions that would make that culture inevitable. If you want ownership, design the meeting, the handoff and the scoreboard so owning the outcome is the easy path, not the heroic one.'},
 {t:'pillar', n:'Dimension 3 of 4', d:'Develop', lead:'Culture grows through practice, not announcements. Develop your people in the real moments on their desk this week, so the standard gets stronger every time they use it instead of every time you remind them.'},
 {t:'pillar', n:'Dimension 4 of 4', d:'Defend', lead:'Growth, pressure and bad days will all try to pull the culture back to the old way. Defend it. Culture holds because a leader in the middle guards it on the days it would be easier to let it slide.'},
 {t:'panel', kicker:'The outcome', h:'Radical ownership', paras:['When a team moves through all four dimensions together, something shifts. People stop waiting to be told and start owning both the culture and the results.','Individual and collective ownership become the default. The need to hold the team accountable becomes a thing of the past.']},
 {t:'part', n:'Part Three', h:'The middle is where culture holds', lead:'You do not need the corner office to build this. Culture is set and defended in the middle of the org chart, in the hundred small moments a mid-level leader owns every week.'},
 {t:'two'},
 {t:'credibility'},
 {t:'recap'},
 {t:'cta', disc:'Educational content only. This masterclass shares a leadership and culture framework. No result is guaranteed. Results vary with your situation, your team, and your effort.'}
];

const D=[
 ['Dream','Name the culture you actually want, in plain language your team can repeat, before you touch a single process.'],
 ['Design','Build the behaviors, rituals and decisions that would make that culture inevitable, instead of hoping it shows up.'],
 ['Develop','Grow the people and the habits day to day, so the culture gets stronger through practice, not announcements.'],
 ['Defend','Protect it when pressure, growth and bad days try to pull it back to the old way. Culture holds because someone guards it.']
];

function render(s){
 if(s.t==='title') return `<div class="slide" data-t><div class="kicker">A live masterclass with Tony Moore, The Culture Architect</div><h1>Culture in 4D</h1><div class="lead">Growing leaders from the middle, so your team owns the work instead of waiting on you.</div></div>`;
 if(s.t==='audience') return `<div class="slide" data-t><div class="kicker">Who this is for</div><h2>You were promoted before anyone showed you how to lead</h2><ul><li>Your calendar is full of other people's problems</li><li>Decisions stall the minute you step away</li><li>You are the one everyone runs to for every answer</li><li>You are leading the work and doing it at the same time</li></ul></div>`;
 if(s.t==='trap') return `<div class="slide" data-t><div class="kicker">The trap</div><div class="big">You became the bottleneck <span class="hl">by being good at your job.</span></div></div>`;
 if(s.t==='hook') return `<div class="slide" data-t><div class="kicker">The reframe</div><div class="big">You do not have a time problem. <span class="hl">You have an ownership problem.</span></div></div>`;
 if(s.t==='part') return `<div class="slide" data-t><div class="kicker">${s.n}</div><h1>${s.h}</h1><div class="lead">${s.lead}</div></div>`;
 if(s.t==='panel') return `<div class="slide" data-t><div class="kicker">${s.kicker}</div><h2>${s.h}</h2><div class="panelbox">${s.paras.map(p=>`<p>${p}</p>`).join('')}</div></div>`;
 if(s.t==='grid') return `<div class="slide" data-t><div class="kicker">The four dimensions</div><h2>Dream, Design, Develop, Defend</h2><div class="grid4">${D.map(d=>`<div class="dcol"><div class="d">${d[0]}</div><div class="t">${d[1]}</div></div>`).join('')}</div></div>`;
 if(s.t==='pillar') return `<div class="slide" data-t><div class="kicker">${s.n}</div><h1>${s.d}</h1><div class="lead">${s.lead}</div></div>`;
 if(s.t==='two') return `<div class="slide" data-t><div class="kicker">The shift</div><h2>From pulling weeds to growing leaders</h2><div class="two"><div class="box"><div class="lbl">Today</div><p>Every problem routes to you. Progress depends on your attention. The weeds grow back the moment you look away.</p></div><div class="box after"><div class="lbl">With radical ownership</div><p>Your team owns the outcome and the culture. You lead instead of firefight, and the work keeps moving when you step away.</p></div></div></div>`;
 if(s.t==='credibility') return `<div class="slide" data-t><div class="kicker">Why me</div><h2>I have rebuilt culture from the inside</h2><div class="credit"><p>I spent 25 years as a corporate HR executive, leading organizational change and carrying culture through <strong>five mergers and acquisitions</strong> where two ways of working had to become one.</p><p>I left the C-suite to help leaders architect culture on purpose. I wrote <strong>Culture in 4D</strong> as the blueprint, and I built this program for the leaders in the middle who hold it together every day. People call me the Culture Architect. I am a recovering HR executive.</p></div></div>`;
 if(s.t==='recap') return `<div class="slide" data-t><div class="kicker">The method</div><div class="big">Dream, Design, Develop, Defend. <span class="hl">That is how ownership is built.</span></div></div>`;
 if(s.t==='cta') return `<div class="slide" data-t><div class="kicker">Your next step</div><h2>Stop pulling weeds. Start growing leaders.</h2><div class="cta-steps">If you are ready to build a culture of radical ownership with your team, the next step is simple: <b>join Coaching From The Middle</b> or <b>book a call with the TMS&amp;A team</b> and we will map it to the team you lead right now.</div><div class="disc">${s.disc}</div></div>`;
 return `<div class="slide" data-t></div>`;
}

const stage=document.getElementById('stage');
stage.innerHTML=S.map(render).join('');
const slides=[...document.querySelectorAll('.slide')];
let i=0;
function show(n){i=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,x)=>s.classList.toggle('active',x===i));document.getElementById('nav').textContent=(i+1)+' / '+slides.length;document.getElementById('bar').style.width=((i)/(slides.length-1)*100)+'%';}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ')show(i+1);if(e.key==='ArrowLeft'||e.key==='PageUp')show(i-1);});
stage.addEventListener('click',e=>{const w=window.innerWidth;show(e.clientX<w*0.3?i-1:i+1);});
show(0);
</script>
</body>
</html>
