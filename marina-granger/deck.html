<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Become Magnetic to Galleries and Collectors · Marina Press Granger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf6f4; --panel:#f6e2e3; --rule:#e3c2c3;
    --ink:#2a4657; --accent:#ff5fad; --accent2:#cf5b90; --dim:#9aa2ab; --grey:#4a5561;
    --deep:#2a4657;
  }
  html,body{height:100%}
  body{background:#e7ddd7;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7ddd7}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent2);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:0}
  .t-title h1{font-size:4.6vw;max-width:90%}
  .t-title h1 .a{color:var(--accent2);font-style:italic}
  .t-normal h1{font-size:3.1vw;max-width:88%}
  .t-normal .body{font-family:'Montserrat',sans-serif;font-size:1.36vw;color:var(--grey);margin-top:2.8vh;max-width:78%;line-height:1.62;font-weight:400}
  .sub{font-family:'Montserrat',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.2vw;font-weight:700;color:var(--accent2);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:90%}
  .t-section .rule{width:14vw;height:3px;background:var(--accent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:var(--deep);align-items:center;text-align:center}
  .t-dark h1{font-size:3.1vw;max-width:82%;font-style:italic;color:#faf6f4}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.6px solid var(--accent2);color:var(--ink);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.1vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.82vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.16vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent2);font-weight:700}
  .frame-motif{position:absolute;pointer-events:none}
  .title-frame{right:5.2%;bottom:6.4%;width:15vw;opacity:.85}
  .corner-frame{right:6%;top:8%;width:6.2vw;opacity:.5}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600;font-family:'Montserrat',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700;font-family:'Montserrat',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Montserrat',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Artist Advisory</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- frame-corner motif: a thin gallery-hang frame corner, echoing "on the wall" -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="frame" viewBox="0 0 200 140">
  <g fill="none" stroke-width="2.4" stroke-linecap="round">
    <path d="M16,124 L16,20 L120,20" stroke="#cf5b90" opacity="0.9"/>
    <path d="M40,124 L184,124 L184,44" stroke="#2a4657" opacity="0.5"/>
    <circle cx="150" cy="86" r="7" fill="#ff5fad" opacity="0.9" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"Become <span class='a'>Magnetic</span> to Galleries and Collectors",sub:'A live masterclass for visual artists on why galleries choose the artists they choose, and how to become one of them.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You are a serious artist doing real work, and the right galleries still do not know your name.',body:'You have watched artists with less range land the show, the wall, the collector. It is rarely a talent problem. It is a being-seen problem, and it is fixable.'},
 {t:'dark',title:'Talent gets you into the studio. It does not get you onto the wall. Galleries choose the artists they can place, trust, and remember.'},

 {t:'section',idx:'Part One',title:'Why Talented Artists Stay Invisible'},
 {t:'normal',k:'The expensive myth',title:'You were taught that if the work is good enough, it will be discovered.',body:'It is the most costly belief in an artist career. Galleries are not searching for the most talented person alive. They are looking for artists who are ready to be shown, and who make that easy to see.'},
 {t:'normal',k:"The gatekeeper's view",title:'A gallery is making a bet on you, not only on your work.',body:'When a director considers an artist, they are asking quiet questions. Can I place this. Is the body of work coherent. Will this person show up, be easy to represent, and carry the gallery well. Most artists never answer those questions, because no one told them they were being asked.'},
 {t:'dark',title:'You are not being judged only on your art. You are being read for whether you are ready to be represented.'},

 {t:'section',idx:'Part Two',title:'The Four Things That Make You Magnetic'},
 {t:'normal',k:'One · What galleries actually seek',title:'A coherent body of work with a clear point of view, not a portfolio of everything you can do.',body:'Galleries represent a voice, not a range. The first shift is deciding what you are known for, so a curator can describe you in one sentence and picture you in a room.'},
 {t:'normal',k:'Two · Presentation and words',title:'How your work is presented, written about, and curated online is part of the work now.',body:'The images, the artist statement, the way your site and social read to a curator: these decide whether you are taken seriously before anyone meets you. Presentation is not vanity. It is the first thing a gallery sees.'},
 {t:'normal',k:'Three · Real relationships',title:'Representation comes from relationships, not from cold submissions and open calls.',body:'The artists who get shown build genuine connection with galleries, curators, and collectors before they ask for anything. There is a way to do this that is authentic rather than transactional, and it can be learned.'},
 {t:'normal',k:'Four · The inner work',title:'The confidence to be seen, so you actually put yourself in the rooms where it happens.',body:'Most artists self-reject long before a gallery ever could. The mindset work is not fluff. It is what lets you send the email, walk into the opening, and hold your prices without flinching.'},
 {t:'dark',title:'Positioning, presentation, relationships, and self-belief. None of them ask you to be more talented. All of them can be built on purpose.'},

 {t:'section',idx:'Part Three',title:'When the Right Yes Starts Finding You'},
 {t:'normal',k:'The shift',title:'You stop chasing galleries and start becoming the artist they reach out to.',body:'When your work is coherent, your presentation is undeniable, and you are genuinely in the conversation, the dynamic flips. Introductions happen. Curators remember your name. The right yes starts to find you.'},
 {t:'normal',k:'Why Marina',title:'Seven years choosing artists from the other side of the desk.',body:'Marina Press Granger spent nearly fifteen years in the NYC art world, seven of them as a gallery director, selling over a million dollars in art and deciding which artists got shown. The Artist Advisory teaches the exact things she used to look for, paired with the mindset work that makes an artist impossible to overlook.'},

 {t:'section',idx:'Your Next Step',title:'Become Unforgettable to the Right Galleries'},
 {t:'normal',k:'How to go deeper',title:'From this masterclass into the Artist Academy and 1:1 work.',body:'The masterclass gives you the map. Inside the Artist Academy and 1:1 VIP coaching, Marina walks you through your own positioning, presentation, and gallery strategy step by step, with the mindset work alongside it.'},
 {t:'cta',title:'Ready to become the artist galleries go looking for?',chips:['Watch the free masterclass','Explore the Artist Academy'],disc:'Educational content for visual artists. No representation, sale, or career outcome is guaranteed. Results vary by artist, body of work, market, and effort.'},
];

const deck=document.getElementById('deck');
function frameSvg(kind){return `<svg class="frame-motif ${kind==='title'?'title-frame':'corner-frame'}" viewBox="0 0 200 140"><use href="#frame"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Artist <b>Advisory</b> &middot; Marina Press Granger</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc==='title') h+=frameSvg('title');
  else if(s.t==='normal') h+=frameSvg('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
