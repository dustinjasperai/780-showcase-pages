<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Strengths-First Leader | Nicole Jansen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:ital,wght@0,400;0,600;0,700;1,400&family=Roboto+Slab:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f1;      /* lightened form of brand cream #f4ebde */
    --panel:#f4ebde;   /* brand cream, verbatim */
    --ink:#1f1b16;     /* near-black, from brand #111111 */
    --muted:#6b635a;
    --rule:#d9cfbf;    /* muted cream-grey */
    --accent:#f5821f;  /* brand orange, verbatim from site probe */
    --head:'Roboto Slab',Georgia,serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#efe9df;color:var(--ink);font-family:var(--body);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.14;margin-bottom:14px}
  .lead{font-size:20px;color:var(--muted);margin-top:18px;max-width:46ch}
  p.b{font-size:19px;margin-top:14px;max-width:58ch}
  ul{margin:18px 0 0 0;list-style:none;max-width:60ch}
  ul li{position:relative;padding-left:30px;margin:12px 0;font-size:18px}
  ul li::before{content:"";position:absolute;left:0;top:10px;width:12px;height:12px;
    background:var(--accent);border-radius:3px}
  .big{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.12;max-width:20ch}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  .pill{display:inline-block;background:var(--panel);border:1px solid var(--rule);
    border-radius:999px;padding:6px 14px;font-weight:700;font-size:13px;margin:6px 8px 0 0}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:22px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
  .card h3{font-family:var(--head);font-size:18px;margin-bottom:6px}
  .card p{font-size:15px;color:var(--muted)}
  .num{font-family:var(--head);color:var(--accent);font-weight:800;font-size:15px}
  .foot{position:absolute;bottom:18px;left:54px;right:54px;display:flex;justify-content:space-between;
    font-size:12px;color:var(--muted);letter-spacing:.03em}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:62ch;line-height:1.5}
  .cta-note{font-size:19px;margin-top:14px;max-width:52ch}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:33px}.big{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
/* The Strengths-First Leader. Nicole Jansen's masterclass. Content lives in const S. */
const S = [
  {t:'cover',
   kick:'A live masterclass with Nicole Jansen',
   h:'The Strengths-First Leader',
   lead:'How to scale your impact without burning out, by leading from the way you are actually wired.'},

  {t:'part',
   kick:'The promise',
   h:'What you will walk away with',
   pts:['A clear read on how you are wired to lead.',
        'A way to grow the business that does not run on your stamina.',
        'A first move you can make this week to get your calendar back.']},

  {t:'whofor',
   kick:'Who this is for',
   h:'For the driven leader who became the bottleneck',
   pts:['You built something real, and now it runs on you.',
        'Your calendar belongs to everyone except you.',
        'You keep pushing harder, and it keeps costing more.']},

  {t:'trap',
   kick:'The trap',
   h:'The feed tells you to work harder',
   b:'Every leadership program sells the same answer: more discipline, more systems, more hours. You have tried that. The harder you drive, the faster you empty out. The problem was never your effort.'},

  {t:'part',
   kick:'The trap, continued',
   h:'What the old way actually costs',
   pts:['The work only you can do waits while you handle everything else.',
        'The people around you stay small because you hold it all.',
        'The purpose you started with gets buried under the to-do list.']},

  {t:'reframe',
   kick:'The reframe',
   big:'The most driven leaders burn out first.',
   lead:'Not because they are weak. Because they are leading against their own wiring instead of from it.'},

  {t:'part',
   kick:'Part one',
   h:'Why willpower runs out',
   b:'Effort is a battery, not a strategy. When you lead from traits that are not yours, every day drains you. The harder you grip, the more the business depends on your grip.'},

  {t:'reframe',
   kick:'Part one, continued',
   big:'Growth built on stamina has a ceiling. The ceiling is you.',
   lead:'Strengths-first leadership removes you as the ceiling.'},

  {t:'part',
   kick:'Part two',
   h:'Know how you are wired to lead',
   b:'As a Certified Human Behavior Specialist, I start every leader with one question: how are you actually built to lead? When you know your wiring, you stop forcing yourself into a shape that costs you.'},

  {t:'pillars',
   kick:'Part two, continued',
   h:'Four ways leaders are wired',
   cards:[
     {n:'A',h:'The driver',p:'Fast, decisive, allergic to detail. Burns out doing other people\'s follow-through.'},
     {n:'B',h:'The connector',p:'Energized by people. Burns out carrying everyone else\'s weight.'},
     {n:'C',h:'The builder',p:'Steady, loyal, dependable. Burns out absorbing every change alone.'},
     {n:'D',h:'The analyst',p:'Precise, thorough, careful. Burns out trying to make it all perfect.'}]},

  {t:'part',
   kick:'The point',
   h:'You are not every type, and you were never meant to be',
   b:'Each wiring has a strength and a predictable way it empties out. The job is not to fix your type. It is to build the business so your strengths carry it and your blind spots are covered by people wired for them.'},

  {t:'part',
   kick:'Part three',
   h:'Leading from strengths, in practice',
   b:'Once you know your wiring, strengths-first leadership runs across six areas. This is the frame my clients use to rebuild how they lead.'},

  {t:'pillars',
   kick:'Part three, continued',
   h:'The six pillars',
   cards:[
     {n:'01',h:'Foundations',p:'Your leadership style, self-awareness, and a clear personal purpose.'},
     {n:'02',h:'Communication and EI',p:'Emotional intelligence and conflict that holds under pressure.'},
     {n:'03',h:'Team',p:'Building a team that covers what you are not wired for.'},
     {n:'04',h:'Strategic mindset',p:'Clear thinking and steady decisions through change.'},
     {n:'05',h:'Influence',p:'Genuine engagement, not pressure.'},
     {n:'06',h:'Legacy',p:'Mentoring leaders under you so impact outlasts your hours.'}]},

  {t:'part',
   kick:'Pillar in focus',
   h:'Foundations: lead on purpose, not on reflex',
   b:'Before tactics, you name who you are as a leader and what you are actually here to build. Every decision after that gets easier, because you are no longer reacting. You are leading from a center.'},

  {t:'part',
   kick:'Pillar in focus',
   h:'Team: stop covering what you are not wired for',
   b:'The fastest relief for a bottlenecked leader is a team built around your wiring, not a clone of you. You hand off the work that drains you to the people it energizes, and the whole system speeds up.'},

  {t:'part',
   kick:'Pillar in focus',
   h:'Legacy: build leaders, not dependence',
   b:'A business that needs you in every room is not an asset, it is a job. Legacy leadership means the people under you grow into decisions, so your impact compounds while your hours do not.'},

  {t:'part',
   kick:'The result',
   h:'What a strengths-first week looks like',
   pts:['Your calendar is built around the work only you can do.',
        'The rest is held by people wired for it.',
        'You grow the business and still have something left at the end of the day.']},

  {t:'reframe',
   kick:'The shift',
   big:'Stop being the engine. Start building leaders.',
   lead:'This is how purpose and profit stop competing, and how growth stops costing you your health.'},

  {t:'why',
   kick:'Why me',
   h:'About Nicole Jansen',
   b:'For more than thirty years I have coached and trained visionary entrepreneurs and leaders across finance, real estate, health, nonprofit, and beyond. I am a Certified Human Behavior Specialist, Business Coach, and Strategic Intervention Coach, and host of the Leaders of Transformation podcast. My work integrates business mastery with personal growth so you can lead with purpose and create lasting impact without burning out.'},

  {t:'cta',
   kick:'Your next step',
   h:'Lead from your strengths',
   note:'If this is the way you want to lead, the next step is a short conversation. Book a discovery call with me, or join us at the Transformed Leader 3-Day Experience.',
   disc:'This masterclass is educational. It does not promise any specific financial or business outcome. Results vary from person to person and nothing here is guaranteed. Leaders of Transformation.'}
];

const foot = (i)=>`<div class="foot"><span>Leaders of Transformation</span><span>${i+1} / ${S.length}</span></div>`;
function render(){
  const d=document.getElementById('deck');
  d.innerHTML = S.map((s,i)=>{
    let inner='';
    if(s.kick) inner+=`<div class="kick">${s.kick}</div>`;
    if(s.t==='cover'){ inner+=`<h1>${s.h}</h1><p class="lead">${s.lead}</p>`; }
    else if(s.t==='reframe'){ inner+=`<div class="big">${s.big}</div>`+(s.lead?`<p class="lead">${s.lead}</p>`:''); }
    else if(s.t==='pillars'){ inner+=`<h2>${s.h}</h2><div class="grid">`+s.cards.map(c=>`<div class="card"><div class="num">${c.n}</div><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')+`</div>`; }
    else if(s.t==='cta'){ inner+=`<h2>${s.h}</h2><p class="cta-note">${s.note}</p><p class="disclaimer">${s.disc}</p>`; }
    else { inner+=`<h2>${s.h}</h2>`; if(s.b) inner+=`<p class="b">${s.b}</p>`; if(s.pts) inner+=`<ul>`+s.pts.map(x=>`<li>${x}</li>`).join('')+`</ul>`; }
    inner+=foot(i);
    return `<section class="slide">${inner}</section>`;
  }).join('');
}
render();
</script>
</body>
</html>
