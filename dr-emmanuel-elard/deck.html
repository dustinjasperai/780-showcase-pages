<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Installing AI Into the Aesthetic Cabinet | A live masterclass with Dr. Emmanuel Elard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#ffffff;
    --panel:#f8f9fb;
    --ink:#0b1220;
    --ink-soft:#28313f;
    --ink-muted:#5b6473;
    --rule:#e4e7ee;
    --accent:#1650ef;
  }
  html,body{height:100%;}
  body{font-family:'Hanken Grotesk',-apple-system,sans-serif;background:#0b1220;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{width:100vw;height:100vh;position:relative;background:var(--bg);}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:8vh 10vw;background:var(--bg);}
  .slide.on{display:flex;}
  .slide.dark{background:var(--ink);color:#fff;}
  .kicker{font-family:'Sora',sans-serif;font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  .slide.dark .kicker{color:#7aa0ff;}
  h1{font-family:'Sora',sans-serif;font-size:clamp(34px,6vw,68px);font-weight:700;line-height:1.05;letter-spacing:-.01em;margin-bottom:22px;}
  h2{font-family:'Sora',sans-serif;font-size:clamp(28px,4.4vw,46px);font-weight:600;line-height:1.12;letter-spacing:-.01em;margin-bottom:26px;}
  .sub{font-size:clamp(17px,2vw,23px);color:var(--ink-soft);max-width:46ch;line-height:1.5;}
  .slide.dark .sub{color:#c5ccd8;}
  .foot{position:absolute;bottom:5vh;left:10vw;font-family:'Sora',sans-serif;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted);}
  .num{position:absolute;top:7vh;right:10vw;font-family:'Sora',sans-serif;font-size:13px;color:var(--ink-muted);letter-spacing:.1em;}
  .big{font-family:'Sora',sans-serif;font-size:clamp(28px,4.4vw,52px);font-weight:600;line-height:1.14;max-width:20ch;margin-bottom:24px;}
  ul{list-style:none;max-width:52ch;}
  li{font-size:clamp(16px,1.9vw,22px);color:var(--ink-soft);padding:14px 0 14px 34px;border-bottom:1px solid var(--rule);position:relative;line-height:1.4;}
  li::before{content:"";position:absolute;left:0;top:23px;width:16px;height:2px;background:var(--accent);}
  .note{margin-top:26px;font-size:clamp(15px,1.7vw,19px);color:var(--ink);font-weight:500;border-left:3px solid var(--accent);padding-left:16px;max-width:48ch;}
  .fw{display:flex;align-items:flex-start;gap:34px;max-width:60ch;}
  .fwnum{font-family:'Sora',sans-serif;font-size:clamp(44px,7vw,92px);font-weight:700;color:var(--accent);line-height:.9;}
  .fwbody{font-size:clamp(17px,2vw,23px);color:var(--ink-soft);line-height:1.5;}
  .tag{display:inline-block;margin-top:18px;font-family:'Sora',sans-serif;font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);background:var(--panel);border:1px solid var(--rule);padding:6px 12px;border-radius:40px;}
  .quote{font-family:'Sora',sans-serif;font-size:clamp(20px,2.6vw,30px);font-weight:600;line-height:1.25;color:#fff;max-width:28ch;margin-top:30px;border-left:3px solid var(--accent);padding-left:20px;}
  .stat{display:flex;gap:50px;flex-wrap:wrap;margin-top:10px;}
  .stat div span{display:block;font-family:'Sora',sans-serif;font-size:clamp(34px,5vw,60px);font-weight:700;color:var(--accent);line-height:1;}
  .stat div p{font-size:15px;color:var(--ink-muted);margin-top:8px;max-width:16ch;}
  .action{display:inline-block;margin-top:30px;font-family:'Sora',sans-serif;font-size:clamp(16px,1.9vw,21px);font-weight:600;color:#fff;background:var(--accent);padding:16px 26px;border-radius:10px;}
  .disc{position:absolute;bottom:5vh;left:10vw;right:10vw;font-size:12.5px;color:var(--ink-muted);line-height:1.5;max-width:70ch;}
  .nav{position:absolute;bottom:4vh;right:6vw;z-index:10;font-family:'Sora',sans-serif;font-size:13px;color:var(--ink-muted);}
  .nav b{color:var(--accent);}
  .hint{position:absolute;bottom:4vh;left:50%;transform:translateX(-50%);font-size:12px;color:var(--ink-muted);z-index:10;}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><b id="cur">1</b> / <span id="tot">1</span></div>
<div class="hint">Use the arrow keys to move through the slides</div>
<script>
const S=[
 {t:'title', kicker:"A live masterclass with Dr. Emmanuel Elard", h:"Installing AI Into the Aesthetic Cabinet", sub:"The calibrated system that hands two hours a day back to the physician, with not a single line of code to write.", foot:"IA Esthétique"},
 {t:'agenda', kicker:"The hour ahead", h:"What you walk out with", list:["A clear picture of where AI actually belongs in your cabinet","The method that turns generic AI into a tool you trust with a patient letter","Three concrete systems you can start the same afternoon"], note:"One hour, live. One result at the end of it."},
 {t:'who', kicker:"Who this is for", h:"If the admin is eating your clinical time", list:["Aesthetic physicians and clinic managers running a busy practice","Doctors who tried ChatGPT and got generic, unusable answers","Anyone losing hours a day to courriers, comptes-rendus and relances"], note:"You did not train for fifteen years to spend your evenings writing patient letters."},
 {t:'reframe', kicker:"The quiet problem", big:"Most AI advice for doctors stops at prompt tips.", sub:"The cabinet does not run on tips. It runs on calibrated, repeatable systems that keep working while you see patients."},
 {t:'part', kicker:"Part One", h:"Why generic AI fails in the cabinet", sub:"The gap between a clever demo and a tool you would trust with a real patient letter."},
 {t:'list', kicker:"Part One", h:"Three reasons it breaks", list:["Generic prompts return generic prose you would never send a patient","Nothing is calibrated to your comptes-rendus, your tone, your protocols","It stays a toy on your phone instead of a system that runs without you"], note:"Calibration, not cleverness, is what makes AI safe to use at the cabinet."},
 {t:'reframe', kicker:"Part One", big:"The cost is quiet, and it compounds.", sub:"Every untracked renewal, every evening of paperwork, every post you never published. None of it shows up as a crisis. All of it adds up."},
 {t:'part', kicker:"Part Two", h:"The IA Esthetique method", sub:"Three staged packs, fourteen modules. One tool, one hour, one result at a time."},
 {t:'framework', kicker:"Part Two", num:"01", h:"Calibrated prompting", body:"We build an AI assistant tuned to your real work: patient letters, comptes-rendus, consultation prep. Not a generic chatbot, an assistant that writes in your voice and follows your protocols.", tag:"Pack IA"},
 {t:'framework', kicker:"Part Two", num:"02", h:"Automations that run without you", body:"A patient finishes a treatment, and the renewal reminder for their next session fires on its own. We build the relance workflow once, and it keeps working while you are with patients.", tag:"Pack Automatisations"},
 {t:'framework', kicker:"Part Two", num:"03", h:"Vibe coding your own site", body:"You describe your clinic site in plain words, and the AI builds and edits it for you. No agency, no developer, no code. Your web presence stops living on broken autopilot.", tag:"Pack Vibe Coding"},
 {t:'list', kicker:"Part Two", h:"What one hour per tool looks like", list:["ChatGPT: your first calibrated assistant for letters and reports","Claude: document analysis and higher level medical writing","n8n: your first automated patient relance","Images and video: publishable clinic content in minutes","Vibe coding: your professional site, built by you with AI"], note:"One tool, one result you can use the same afternoon."},
 {t:'part', kicker:"Part Three", h:"What changes in the practice", sub:"The week after, measured in hours returned and in revenue that stops leaking."},
 {t:'list', kicker:"Part Three", h:"The week, given back", list:["Comptes-rendus drafted in minutes, not after hours","Patient relances sent on their own, so renewals no longer slip","Clinic content produced in-house, on time","Your site updated the day you decide to change it"], note:"Lighter admin, a fuller recall column, calmer evenings."},
 {t:'stat', kicker:"Part Three", h:"Where the hours go", stats:[["2 h","the daily admin load AI is built to take off your desk"],["14","modules, each ending in one usable result"],["5","core tools, mastered one live hour at a time"]], note:"The targets are illustrative. Your real numbers depend on your practice."},
 {t:'why', kicker:"Why me", h:"Why me", body:"I have practised aesthetic medicine for fifteen years and founded NextMotion, a SaaS used by hundreds of clinics worldwide. I taught at the Henri Mondor faculty for eight years. I run every one of these systems in my own cabinet, and I have trained 250+ aesthetic physicians to do the same.", quote:"AI will not replace physicians. But physicians who use it will replace those who do not."},
 {t:'cta', kicker:"Your next step", h:"Put AI to work in your cabinet", sub:"Join the next live session, then go deeper with the Programme Complet: three packs, fourteen modules, and twelve months in the mastermind community.", action:"Reserve your place at the next live masterclass", disc:"Educational content for organisational and productivity purposes only. No income, clinical, or business result is guaranteed. Results vary by practice, effort, and circumstances."}
];
const stage=document.getElementById('stage');
function esc(s){return s;}
function render(){
  stage.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+((s.t==='reframe'||s.t==='why')?' dark':'');
    let html='';
    if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
    if(s.t==='title'){ html+='<h1>'+s.h+'</h1><p class="sub">'+s.sub+'</p>'; if(s.foot) html+='<div class="foot">'+s.foot+'</div>'; }
    else if(s.t==='agenda'||s.t==='who'||s.t==='list'){ html+='<h2>'+s.h+'</h2><ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; if(s.note) html+='<div class="note">'+s.note+'</div>'; }
    else if(s.t==='reframe'){ html+='<div class="big">'+s.big+'</div><p class="sub">'+s.sub+'</p>'; }
    else if(s.t==='part'){ html+='<h2>'+s.h+'</h2><p class="sub">'+s.sub+'</p>'; }
    else if(s.t==='framework'){ html+='<div class="fw"><div class="fwnum">'+s.num+'</div><div><h2>'+s.h+'</h2><div class="fwbody">'+s.body+'</div><div class="tag">'+s.tag+'</div></div></div>'; }
    else if(s.t==='stat'){ html+='<h2>'+s.h+'</h2><div class="stat">'+s.stats.map(x=>'<div><span>'+x[0]+'</span><p>'+x[1]+'</p></div>').join('')+'</div>'; if(s.note) html+='<div class="note">'+s.note+'</div>'; }
    else if(s.t==='why'){ html+='<h2>'+s.h+'</h2><p class="sub">'+s.body+'</p><div class="quote">'+s.quote+'</div>'; }
    else if(s.t==='cta'){ html+='<h2>'+s.h+'</h2><p class="sub">'+s.sub+'</p><div class="action">'+s.action+'</div><div class="disc">'+s.disc+'</div>'; }
    html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
    d.innerHTML=html;
    stage.appendChild(d);
  });
}
let cur=0;
function show(n){ const sl=stage.children; if(!sl.length) return; cur=Math.max(0,Math.min(S.length-1,n)); for(let i=0;i<sl.length;i++) sl[i].classList.toggle('on',i===cur); document.getElementById('cur').textContent=cur+1; }
render();
document.getElementById('tot').textContent=S.length;
show(0);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' '||e.key==='ArrowDown'){show(cur+1);e.preventDefault();} else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){show(cur-1);e.preventDefault();} });
stage.addEventListener('click',()=>show(cur+1));
</script>
</body>
</html>
