<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Magnetic YouTube Channel | Danie Jay</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#FBF6F3;      /* her site cream ground */
    --panel:#FFFFFF;
    --rule:#EADFD5;
    --accent:#F2BA05;  /* her signature golden yellow */
    --ink:#1A1710;
    --ink-soft:#4a433a;
    --ink-muted:#857c70;
  }
  html,body{height:100%;}
  body{background:var(--ink);font-family:'Poppins',-apple-system,sans-serif;color:var(--ink);display:flex;align-items:center;justify-content:center;min-height:100vh;}
  #stage{width:min(960px,96vw);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.45);}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;flex-direction:column;justify-content:center;}
  .slide.active{display:flex;}
  .eyebrow{font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;}
  h1{font-family:'DM Serif Display',Georgia,serif;font-size:60px;line-height:1.02;color:var(--ink);margin-bottom:20px;letter-spacing:-.01em;}
  h2{font-family:'DM Serif Display',Georgia,serif;font-size:40px;line-height:1.08;color:var(--ink);margin-bottom:18px;}
  p{font-size:20px;line-height:1.6;color:var(--ink-soft);max-width:44ch;font-weight:300;}
  .lead{font-size:24px;color:var(--ink-soft);max-width:40ch;}
  .big{font-family:'DM Serif Display',Georgia,serif;font-size:46px;line-height:1.1;color:var(--ink);max-width:22ch;}
  .big .hl{color:var(--accent);font-style:italic;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:21px;line-height:1.5;color:var(--ink-soft);padding-left:34px;position:relative;margin-bottom:14px;font-weight:400;}
  li::before{content:"";position:absolute;left:0;top:12px;width:16px;height:16px;border-radius:50%;background:var(--accent);}
  .num{font-family:'DM Serif Display',serif;font-size:22px;color:var(--ink);background:var(--accent);width:54px;height:54px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:22px;}
  .presenter{margin-top:30px;font-size:17px;color:var(--ink-muted);font-weight:500;}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:30px 34px;max-width:46ch;}
  .disclaimer{font-size:14px;color:var(--ink-muted);margin-top:26px;max-width:52ch;font-weight:300;}
  .cta-line{font-size:22px;color:var(--ink);font-weight:600;margin-top:8px;}
  .nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;font-family:'Poppins';font-size:13px;color:#cbbfa8;}
  .nav button{background:rgba(242,186,5,.15);color:#F2BA05;border:1px solid rgba(242,186,5,.4);border-radius:8px;padding:7px 16px;font-size:13px;cursor:pointer;font-family:inherit;}
  .nav button:hover{background:rgba(242,186,5,.28);}
  .brandmark{position:absolute;top:30px;right:40px;font-size:13px;font-weight:600;letter-spacing:.1em;color:var(--ink-muted);text-transform:uppercase;}
  @media(max-width:640px){.slide{padding:34px 30px;}h1{font-size:34px;}h2{font-size:26px;}p,.lead{font-size:16px;}.big{font-size:28px;}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button id="prev">&larr;</button><span id="counter"></span><button id="next">&rarr;</button></div>
<script>
const S=[
 {t:'title'},
 {t:'promise',eyebrow:'What you will walk away with',h2:'By the end of this hour',ul:['The 4 Ingredients that make a channel pull in the RIGHT viewers','Why your niche lives inside YouTube search, not in trends','How a magnetic video turns a stranger into a buyer','The simple path from a new subscriber to your paid program']},
 {t:'audience',eyebrow:'Who this is for',h2:'You have been told to "just start a channel"',p:'You are a coach or course creator. People keep telling you to get on YouTube. So you post, consistently, for months. The views trickle in. And the leads do not. It feels like shouting into a void while you watch everyone else grow.'},
 {t:'reframe',reframe:true,big:'Views are a vanity metric.<br>The right <span class="hl">viewers</span> are a business.'},
 {t:'problem',eyebrow:'Part one: the real problem',h2:'The algorithm is not your audience',p:'Most YouTube advice optimizes for the algorithm: more uploads, trendier titles, bigger thumbnails. That can buy you views. It almost never buys you clients, because the people it brings are there for the trend, not for you.'},
 {t:'problem',eyebrow:'Part one: the real problem',h2:'Generic reach, generic results',p:'A channel built for everyone is magnetic to no one. When your content is not anchored to a specific person and a specific transformation, even a viral video leaves you with subscribers who will never buy. Reach without resonance is just noise.'},
 {t:'problem',eyebrow:'Part one: the real problem',h2:'The content treadmill burns you out',p:'And so you post more, hoping volume fixes it. More scripting, more filming, more editing, for the same quiet inbox. The treadmill is exhausting precisely because it was never a volume problem. It was a magnetism problem.'},
 {t:'framework',eyebrow:'Part two: the framework',h2:'The 4 Ingredients of a Magnetic YouTube Channel',p:'A magnetic channel is not luck and it is not the mercy of the algorithm. It is four ingredients, built on purpose, that make the right person stop, watch, trust, and come to you.'},
 {t:'ingredient',num:'1',h2:'Find your niche inside YouTube search',p:'Before you film anything, you find the words your dream client is already typing into YouTube. Your niche is not a vibe, it is a set of searches. Build on what people are actively looking for and every video starts with demand instead of hope.'},
 {t:'ingredient',num:'2',h2:'Film high-retention videos',p:'Retention is the whole game. We cover the hook, the structure, and the editing rhythm that keep the right person watching to the end, because watch time is what tells YouTube to keep showing you to people exactly like them.'},
 {t:'ingredient',num:'3',h2:'Make every video magnetic to your dream client',p:'This is where your personality stops being a liability and becomes your advantage. A magnetic video is unmistakably yours in voice and point of view, so the right viewer feels found, not marketed to.'},
 {t:'ingredient',num:'4',h2:'Turn viewers into a community that buys',p:'A view is a moment. A community is an asset. We build the path from a first watch to an email, from an email to a relationship, and from a relationship to your paid program, so the channel compounds instead of resetting every week.'},
 {t:'reframe',reframe:true,big:'Start scared.<br><span class="hl">Stay weird.</span>'},
 {t:'ethos',eyebrow:'The ethos',h2:'Your personality is the strategy',p:'You do not need a studio, perfect lighting, or the confidence of someone who has done this a hundred times. You need to start before you feel ready and refuse to sand off the parts of you that make you memorable. That is what a stranger subscribes to.'},
 {t:'ethos',eyebrow:'The ethos',h2:'Weird is what they remember',p:'The coaches who win on YouTube are not the most polished. They are the most themselves. Your quirks, your specific story, the way you explain a thing nobody else explains that way, that is the moat. Perfection is forgettable. You are not.'},
 {t:'vision',eyebrow:'Part three: in practice',h2:'A channel that brings you dream clients in your sleep',p:'When the four ingredients are in place, the channel stops being a content treadmill and becomes a pipeline: the right people find you through search, binge your best videos, join your list, and arrive at your offer already sold on your method.'},
 {t:'bridge',eyebrow:'Part three: in practice',h2:'From a free video to your program',p:'A magnetic channel is the top of your business, not a hobby beside it. The same four ingredients that earn a subscriber also warm them to the point where enrolling in your course or coaching feels like the obvious next step, not a leap.'},
 {t:'whyme',eyebrow:'Why me',h2:'I built this the weird way',p:'I am Danie Jay. I teach coaches and course creators to build YouTube channels that bring in dream clients and sell their courses, inside the Magnetic Creator Academy and the Magnetic Course Blueprint. One student used this exact framework to launch his course and bring in $40,000 in sales. The method is the same one we are walking through today.'},
 {t:'recap',eyebrow:'The recap',h2:'Four ingredients, one magnetic channel',ul:['Find your niche inside YouTube search','Film high-retention videos','Make every video magnetic to your dream client','Turn viewers into a community that buys']},
 {t:'cta',cta:true,eyebrow:'Your next step',h2:'Ready to build your magnetic channel?',ctaLine:'Join the Magnetic Creator Academy and we will build your 4 Ingredients together.',disclaimer:'This masterclass is for education only. Results vary from person to person and depend on the work you put in. Nothing here is a guarantee of income, growth, or results.'}
];
const stage=document.getElementById('stage');
function render(s){
  if(s.t==='title'){
    return `<div class="brandmark">Hey Danie Jay</div>
      <div class="eyebrow">A live masterclass</div>
      <h1>The Magnetic<br>YouTube Channel</h1>
      <p class="lead">4 ingredients that turn views into dream clients, for coaches and course creators.</p>
      <div class="presenter">with Danie Jay</div>`;
  }
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) h+=`<div class="num">${s.num}</div>`;
  if(s.reframe) return `<div class="big">${s.big}</div>`;
  if(s.h2) h+=`<h2>${s.h2}</h2>`;
  if(s.p) h+=`<p>${s.p}</p>`;
  if(s.ul){h+='<ul>';s.ul.forEach(i=>h+=`<li>${i}</li>`);h+='</ul>';}
  if(s.ctaLine) h+=`<div class="cta-line">${s.ctaLine}</div>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  return h;
}
let i=0;
function show(){
  stage.innerHTML=S.map((s,n)=>`<div class="slide${n===i?' active':''}">${render(s)}</div>`).join('');
  document.getElementById('counter').textContent=`${i+1} / ${S.length}`;
}
document.getElementById('next').onclick=()=>{i=Math.min(i+1,S.length-1);show();};
document.getElementById('prev').onclick=()=>{i=Math.max(i-1,0);show();};
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'){i=Math.min(i+1,S.length-1);show();}if(e.key==='ArrowLeft'){i=Math.max(i-1,0);show();}});
show();
</script>
</body>
</html>
