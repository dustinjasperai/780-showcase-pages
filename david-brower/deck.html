<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Booth Test: A Masterclass with David Brower</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f6f5;
    --panel:#ffffff;
    --ink:#142640;
    --body:#3a4250;
    --accent:#01b17b;
    --rule:#d8ddda;
    --muted:#6b7280;
    --display:'Barlow Condensed',Impact,sans-serif;
    --text:'Lato',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:#e7ebe9;color:var(--ink);font-family:var(--text);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:70px 76px;margin:22px 0;min-height:540px;display:flex;flex-direction:column;
    box-shadow:0 10px 30px rgba(20,38,64,.06);overflow:hidden;
  }
  .slide::before{content:'';position:absolute;left:0;top:56px;width:6px;height:52px;background:var(--accent);border-radius:0 4px 4px 0}
  .num{position:absolute;top:30px;right:40px;font-family:var(--display);letter-spacing:.14em;font-size:15px;color:var(--muted)}
  .kick{font-family:var(--display);text-transform:uppercase;letter-spacing:.2em;font-size:18px;font-weight:600;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:74px;line-height:1.02;letter-spacing:.005em;color:var(--ink)}
  h2{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;color:var(--ink);margin-bottom:26px}
  .lead{font-size:26px;line-height:1.5;color:var(--body);margin-top:26px;max-width:44ch}
  p.body{font-size:23px;line-height:1.6;color:var(--body);margin-top:18px;max-width:52ch}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:18px}
  li{position:relative;padding-left:40px;font-size:23px;line-height:1.5;color:var(--body);max-width:50ch}
  li::before{content:'';position:absolute;left:0;top:12px;width:16px;height:16px;border:3px solid var(--accent);border-radius:50%}
  li b{color:var(--ink);font-weight:700}
  .habit{display:flex;flex-direction:column;gap:20px;margin-top:30px}
  .hrow{display:flex;gap:24px;align-items:flex-start;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:24px 28px}
  .hn{font-family:var(--display);font-weight:700;font-size:40px;color:var(--accent);line-height:1;min-width:44px}
  .ht{font-family:var(--display);font-weight:600;font-size:30px;color:var(--ink)}
  .hd{font-size:20px;line-height:1.5;color:var(--body);margin-top:6px}
  .genres{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:30px}
  .g{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px 24px;font-size:21px;color:var(--ink)}
  .g span{display:block;font-size:18px;color:var(--muted);margin-top:6px}
  .stat{display:flex;gap:56px;margin-top:34px;flex-wrap:wrap}
  .stat div .k{font-family:var(--display);font-weight:700;font-size:60px;color:var(--accent);line-height:1}
  .stat div .l{font-size:19px;color:var(--body);margin-top:8px;max-width:20ch}
  .center{justify-content:center;text-align:center;align-items:center}
  .center::before{display:none}
  .center .lead{max-width:40ch}
  .cta-btn{display:inline-block;margin-top:34px;font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.03em;color:#fff;background:var(--accent);border-radius:100px;padding:18px 40px}
  .disc{margin-top:40px;font-size:15px;line-height:1.5;color:var(--muted);max-width:60ch}
  .title-slide{background:var(--ink);border-color:var(--ink)}
  .title-slide::before{top:70px;height:64px}
  .title-slide .kick{color:var(--accent)}
  .title-slide h1{color:#fff;font-size:88px}
  .title-slide .lead{color:#cdd4dc}
  .title-slide .num{color:#5b6577}
  .foot{margin-top:auto;padding-top:30px;font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:15px;color:var(--muted)}
  .title-slide .foot{color:#7c8698}
  @media(max-width:640px){
    .slide{padding:44px 30px;min-height:auto}
    h1{font-size:48px}.title-slide h1{font-size:54px}h2{font-size:36px}
    .lead{font-size:21px}p.body,li,.g{font-size:19px}.stat{gap:32px}
    .genres{grid-template-columns:1fr}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kick:'A live masterclass with David Brower',h:'The Booth Test',lead:'Why a great voice is where it starts, and what actually turns it into booked voice-over work.'},

  {t:'content',kick:'Who this is for',h:'You have been told this your whole life',bullets:[
    '<b>"You have such a great voice. You should be doing voiceovers."</b>',
    'You have thought about it more than once. Maybe you have even bought a mic.',
    'But nobody ever told you what to actually do next, so it stayed an idea.'],
    foot:'The Booth Test'},

  {t:'content',kick:'The trap',h:'A great voice is the most common thing in the booth',body:'Every working voice actor started with a good voice. It is the price of admission, not the edge. What separates the ones who book from the ones who audition forever is not talent. It is trained delivery and a demo that proves it.',foot:'The Booth Test'},

  {t:'center',kick:'The reframe',h:'Casting does not buy your voice',lead:'They buy how you read the script and the demo that shows you can do it on command.'},

  {t:'content',kick:'Part one: the real problem',h:'Why "just start auditioning" fails',bullets:[
    'You audition against people who have trained their read for years.',
    'You have no demo, or a self-made one that gets skipped in the first ten seconds.',
    'You get no feedback, so you repeat the same mistakes and call it bad luck.'],
    foot:'The Booth Test'},

  {t:'content',kick:'Part two: the method',h:'Let’s Begin',body:'My whole approach starts with one honest question: where are you actually at right now? From there we build the exact skills you need, in order. Three habits do most of the work, and then we cut the demo.',foot:'The Booth Test'},

  {t:'habits',kick:'The three habits',h:'How a broadcaster performs a script',habits:[
    {n:'01',t:'Read it cold',d:'Pick up any script and make it sound like you mean it, first take. This is the skill 28 years on air is built on, and it is trainable.'},
    {n:'02',t:'Pace on purpose',d:'Slow down where it matters, drive where it moves. Pacing is the difference between "nice voice" and "that sounds like a real ad."'},
    {n:'03',t:'Interpret for the genre',d:'A medical read is not a car spot is not a documentary. You learn to switch, so one voice can book across the whole market.'}]},

  {t:'content',kick:'The step everything points to',h:'Then we cut the demo',body:'The demo is the product. It is what a casting director actually listens to, and it is what turns training into bookings. We produce it together, built from the reads you have earned, so it sounds like work you can already do.',foot:'The Booth Test'},

  {t:'genres',kick:'Part three: the range that books',h:'One voice, many rooms',genres:[
    {t:'Commercial',s:'The 30-second sell'},
    {t:'E-learning',s:'Clear, patient, long-form'},
    {t:'Medical',s:'Precise and trusted'},
    {t:'Automotive',s:'Energy on demand'},
    {t:'Documentary',s:'Story-led narration'},
    {t:'Faith-based',s:'Warmth that lands'}]},

  {t:'stat',kick:'Why me',h:'I have made this walk with a lot of people',stats:[
    {k:'28 yrs',l:'On-air radio career behind the method'},
    {k:'500+',l:'Clients coached and voiced'},
    {k:'85+',l:'Countries those clients work in'}],
    body:'I went full-time in voice-over in 2008 after 28 years on the radio. Since then I have coached voice actors and produced their demos, and I have booked work for clients in 85+ countries. I teach the read the way I had to learn it, live, not from a script.'},

  {t:'center',kick:'The honest version',h:'This is trainable',lead:'Talent got you the compliment. Reps, feedback, and a real demo get you the booking. That part is learnable, and it starts with one conversation.'},

  {t:'cta',kick:'Let’s begin',h:'Book a free consultation',lead:'We will talk about where you are, where you want to be, and the exact next step, whether that is coaching, a demo, or both.',btn:'Start with a free consult',disc:'Educational content only. No income, booking, or career-outcome guarantees are made or implied. Results vary and depend on your own effort, practice, and market. Voice-over is a competitive field.'}
];

function esc(x){return x;}
function slideHTML(s,i,n){
  const num=`<div class="num">${String(i+1).padStart(2,'0')} / ${String(n).padStart(2,'0')}</div>`;
  const kick=s.kick?`<div class="kick">${s.kick}</div>`:'';
  const foot=s.foot?`<div class="foot">${s.foot}</div>`:'';
  if(s.t==='title'){
    return `<section class="slide title-slide">${num}${kick}<h1>${s.h}</h1><div class="lead">${s.lead}</div><div class="foot">David Brower · VO Training Plus</div></section>`;
  }
  if(s.t==='center'){
    return `<section class="slide center">${num}${kick}<h1>${s.h}</h1><div class="lead">${s.lead}</div></section>`;
  }
  if(s.t==='habits'){
    const rows=s.habits.map(h=>`<div class="hrow"><div class="hn">${h.n}</div><div><div class="ht">${h.t}</div><div class="hd">${h.d}</div></div></div>`).join('');
    return `<section class="slide">${num}${kick}<h2>${s.h}</h2><div class="habit">${rows}</div>${foot}</section>`;
  }
  if(s.t==='genres'){
    const g=s.genres.map(x=>`<div class="g">${x.t}<span>${x.s}</span></div>`).join('');
    return `<section class="slide">${num}${kick}<h2>${s.h}</h2><div class="genres">${g}</div>${foot}</section>`;
  }
  if(s.t==='stat'){
    const st=s.stats.map(x=>`<div><div class="k">${x.k}</div><div class="l">${x.l}</div></div>`).join('');
    return `<section class="slide">${num}${kick}<h2>${s.h}</h2><div class="stat">${st}</div><p class="body">${s.body}</p>${foot}</section>`;
  }
  if(s.t==='cta'){
    return `<section class="slide center">${num}${kick}<h1>${s.h}</h1><div class="lead">${s.lead}</div><div class="cta-btn">${s.btn}</div><div class="disc">${s.disc}</div></section>`;
  }
  const bul=s.bullets?`<ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`:'';
  const bod=s.body?`<p class="body">${s.body}</p>`:'';
  return `<section class="slide">${num}${kick}<h2>${s.h}</h2>${bod}${bul}${foot}</section>`;
}
const deck=document.getElementById('deck');
deck.innerHTML=S.map((s,i)=>slideHTML(s,i,S.length)).join('');
</script>
</body>
</html>
