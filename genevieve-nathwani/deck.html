<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leading Change Without Burning Out: The System Changer Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fff3ec; --panel:#fff9f6; --ink:#1a1a1a; --muted:#5b554c;
    --rule:#e4ddd2; --accent:#fe3101; --deep:#111abf;
    --head:'Oswald',sans-serif; --body:'Libre Baskerville',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kicker{font-family:var(--head);text-transform:uppercase;letter-spacing:.18em;
    font-size:13px;font-weight:600;color:var(--accent);margin-bottom:18px}
  .kicker.deep{color:var(--deep)}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.1;margin-bottom:10px}
  .sub{font-size:20px;color:var(--muted);margin-top:18px;font-style:italic}
  p{font-size:19px;margin-top:16px;max-width:60ch}
  ul{margin:18px 0 0 0;padding:0;list-style:none}
  li{font-size:19px;padding:12px 0 12px 26px;border-top:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;
    border-radius:50%;background:var(--accent)}
  li b{font-family:var(--head);font-weight:600}
  .lead{font-size:30px;line-height:1.25;font-weight:700}
  .accent{color:var(--accent)}
  .deepc{color:var(--deep)}
  .foot{font-family:var(--head);text-transform:uppercase;letter-spacing:.14em;
    font-size:12px;color:var(--muted);margin-top:26px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;font-style:italic;max-width:62ch}
  .title-slide{background:var(--ink);border-color:var(--ink)}
  .title-slide h1,.title-slide .sub{color:var(--bg)}
  .title-slide .sub{opacity:.85}
  .cta-slide{border-color:var(--accent);border-width:2px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    h:'Leading Change Without Burning Out',
    sub:'The System Changer Method, with Genevieve Nathwani' },

  {t:'content', k:'A masterclass for system changers',
    lead:'For leaders shaping a better future in climate, human rights, finance, and technology.',
    p:'The multi award-winning filmmakers, funders, charity leaders, and technologists carrying the weight of the world’s hardest problems.' },

  {t:'list', k:'Who this is for',
    h:'You know this feeling',
    items:[
      '<b>The outrage treadmill.</b> There is always more to be angry about, and more to carry.',
      '<b>The overwork badge.</b> Exhaustion worn as proof that the mission matters.',
      '<b>The halo effect.</b> Doing good is supposed to be its own reward, so you never stop.' ] },

  {t:'reframe', k:'The reframe',
    lead:'Over-obsession with work and impact is <span class="accent">toxic</span> for changemakers, and it is quietly corroding the very change you set out to make.' },

  {t:'content', k:'Part one · the real problem',
    h:'Burnout is not a personal failing',
    p:'It is built into how the movement works. Urgency culture rewards self-sacrifice, treats rest as a luxury, and mistakes depletion for dedication.',
    sub:'You cannot pour lasting change from an empty cup.' },

  {t:'content', k:'Part one · the cost',
    h:'The system you are fighting lives in you too',
    p:'The same patterns of extraction and depletion you see out in the world get reproduced inside your own life. Changing the system starts with refusing to run yourself the way the old system ran everyone.' },

  {t:'divider', k:'Part two · the method',
    h:'The System Changer Method',
    sub:'Wellbeing as the engine of impact, not the reward for it.' },

  {t:'list', k:'Pillar one',
    h:'Strengths and personal mission',
    items:[
      'Name the work only you are here to do, and the strengths that let you do it.',
      'Anchor decisions to that mission so the noise of a thousand urgent things loses its grip.' ] },

  {t:'list', k:'Pillar two',
    h:'Unpacking limiting beliefs',
    items:[
      'Surface the inherited stories: that rest is selfish, that your worth is your output.',
      'Replace them with beliefs that let you lead for decades, not months.' ] },

  {t:'list', k:'Pillar three',
    h:'Inner resources and decisiveness',
    items:[
      'Activate the steadiness and clarity you already carry.',
      'Build decision-making agility so complexity stops paralysing you.' ] },

  {t:'list', k:'Pillar four',
    h:'Resilience and a settled nervous system',
    items:[
      'Lower the chronic stress that narrows your thinking and your patience.',
      'Support the neuroplasticity that lets new, healthier patterns actually stick.' ] },

  {t:'content', k:'A systems lens',
    h:'The Imaginal Cell Effect',
    p:'In a chrysalis, a handful of imaginal cells carry the blueprint for the butterfly, and the whole system reorganises around them. One changed leader does the same for a team, an organisation, a movement.',
    sub:'Your inner shift is not separate from the outer work. It is the seed of it.' },

  {t:'content', k:'A systems lens',
    h:'Systems wayfinding',
    p:'You will never see the whole map, and you still have to move. Wayfinding is making good decisions inside complexity through receptivity rather than force, sensing where the system wants to open instead of pushing where it will not.' },

  {t:'list', k:'Part three · what changes',
    h:'A wellbeing-first changemaker',
    items:[
      'Leads from fullness, not depletion, so the work compounds instead of collapsing.',
      'Makes clearer, braver decisions because the nervous system is settled.',
      'Models a way of working others can actually sustain, which is how change lasts.' ] },

  {t:'content', k:'Why work with me', deep:true,
    h:'Genevieve Nathwani',
    p:'I co-built one of Europe’s leading seed-stage VC funds and launched Europe’s first VC-funded mental-health service for founders, supporting around 60 founders through scaling.',
    sub:'Co-Active, Climate Change Coaches, and Centre for Climate Psychology certified. 30+ changemakers coached across climate, human rights, finance, and tech.' },

  {t:'reframe', k:'The invitation',
    lead:'There is urgent work to be done. <span class="deepc">Looking after yourself is how you get to keep doing it.</span>' },

  {t:'cta', k:'Next step',
    h:'Let’s talk',
    p:'Book a free discovery call and we will map where wellbeing and impact are pulling against each other, and what a System Changer Method partnership would look like for you.',
    cta:'Book a discovery call at genevievenathwani.com',
    disc:'No income or result is guaranteed. Results vary. Educational content only; coaching supports personal and professional development and is not therapy or medical advice.' }
];

const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let html = '';
  if (s.k) html += '<div class="kicker'+(s.deep?' deep':'')+'">'+s.k+'</div>';
  if (s.t==='title'){ html += '<h1>'+s.h+'</h1>'; if(s.sub) html+='<div class="sub">'+s.sub+'</div>'; }
  else if (s.t==='reframe'){ html += '<div class="lead">'+s.lead+'</div>'; }
  else if (s.t==='divider'){ html += '<h2>'+s.h+'</h2>'; if(s.sub) html+='<div class="sub">'+s.sub+'</div>'; }
  else {
    if (s.lead) html += '<div class="lead">'+s.lead+'</div>';
    if (s.h) html += '<h2>'+s.h+'</h2>';
    if (s.p) html += '<p>'+s.p+'</p>';
    if (s.items){ html += '<ul>'; s.items.forEach(i=> html += '<li>'+i+'</li>'); html += '</ul>'; }
    if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
    if (s.cta) html += '<div class="foot">'+s.cta+'</div>';
    if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  }
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
