<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Second in Command Scorecard — Live Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@500;700;800&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1b2d;        /* deep navy ground */
    --panel:#16263d;     /* panel navy */
    --ink:#f7f3ea;       /* cream ink */
    --muted:#aebbcd;     /* muted slate */
    --accent:#f2b542;    /* harvested brand gold (button) */
    --accent2:#2ea3f2;   /* harvested brand blue (link) */
    --line:#2a3b55;
    --head:'Schibsted Grotesk',system-ui,sans-serif;
    --body:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:#070e18;color:var(--ink);font-family:var(--body);}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px;}
  .slide{background:var(--bg);border:1px solid var(--line);border-radius:18px;
    padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden;}
  .slide:before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent);}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 18px;}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;margin:0 0 18px;}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;margin:0 0 16px;}
  .sub{font-size:21px;color:var(--muted);margin:0 0 10px;max-width:46ch;}
  ul{margin:14px 0 0;padding:0 0 0 2px;list-style:none;}
  li{font-size:20px;line-height:1.4;margin:0 0 14px;padding-left:34px;position:relative;}
  li:before{content:"";position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:4px;
    background:var(--accent);}
  .score{display:inline-block;font-family:var(--head);font-weight:800;color:var(--bg);
    background:var(--accent);border-radius:10px;padding:6px 14px;font-size:16px;margin-top:18px;}
  .num{font-family:var(--head);font-weight:800;font-size:15px;color:var(--accent2);letter-spacing:.1em;}
  .disc{font-size:15px;color:var(--muted);line-height:1.5;max-width:70ch;}
  .foot{position:absolute;right:24px;bottom:18px;font-family:var(--head);font-size:12px;
    letter-spacing:.12em;color:#5c6f8c;text-transform:uppercase;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'The COO Alliance Live Masterclass', h:'The Second in Command Scorecard',
    sub:'The 5 gaps that keep a COO stuck in the weeds, and the one to fix first.'},
  {t:'title', k:'A question', h:'You were promoted to run the company. So why does it still run you?',
    sub:'A live, self-scored diagnostic for Chief Operating Officers and second-in-command leaders.'},
  {t:'list', k:'Who this is for', h:'Built for the operator next to the CEO',
    list:['You are the COO, President, VP or second-in-command at a company doing 2 million or more in revenue.',
      'A leadership team reports to you.',
      'You carry execution for a vision someone else set.',
      'You feel the pull between building the business and running the daily fires.']},
  {t:'cred', k:'Your host', h:'Cameron Herold',
    sub:'Founder of The COO Alliance. As COO of 1-800-GOT-JUNK? he helped grow the company from 2 million to over 100 million in revenue in six years. Author of seven books, including The Second in Command, Vivid Vision, Double Double and Meetings Suck.'},
  {t:'reframe', k:'The reframe', h:'A COO is not a senior manager. You are the Second in Command.',
    sub:'The job is to turn the CEO vision into an executing company, own the operating system, and build the leaders beneath you. Most operators were never taught the role on purpose.'},
  {t:'map', k:'The diagnostic', h:'Five gaps. One scorecard.',
    list:['Vision. Does the company have a vivid, shared picture of three years out.',
      'Meeting rhythm. Does your calendar run the week, or does the week run you.',
      'CEO partnership. Is ownership between you and the CEO actually clear.',
      'Growth system. Can the business double without heroics.',
      'Leadership leverage. Have you built leaders, or does everything still route through you.'],
    note:'Score each gap 1 to 5 as we go. Lowest score names your first fix.'},

  {t:'gap', k:'Gap 1 of 5 / Vivid Vision', h:'The Vision gap', n:'01',
    sub:'Without a vivid, present-tense picture of the business three years out, the operator reacts instead of builds. Priorities shift with whoever shouted last.'},
  {t:'list', k:'Gap 1 / what good looks like', h:'When the vision is vivid',
    list:['Everyone can describe what the company looks, feels and acts like in three years.',
      'Your quarterly priorities ladder up to that picture, not to the inbox.',
      'You can say no to good ideas because they do not serve the vision.']},
  {t:'score', k:'Gap 1 / self-score', h:'Rate your Vision gap, 1 to 5',
    sub:'1 means no shared vision exists. 5 means every leader can recite it and acts on it.'},

  {t:'gap', k:'Gap 2 of 5 / Meetings Suck', h:'The Meeting-rhythm gap', n:'02',
    sub:'No cadence means meetings leak into every hour. The right rhythm of daily huddles, weekly tactical and monthly or quarterly reviews gives the week its spine back.'},
  {t:'list', k:'Gap 2 / what good looks like', h:'When the rhythm holds',
    list:['A short daily huddle keeps the team in sync without a thread of messages.',
      'Weekly tactical clears issues; monthly and quarterly set direction.',
      'Meetings end with owned actions, not vague agreement.']},
  {t:'score', k:'Gap 2 / self-score', h:'Rate your Meeting-rhythm gap, 1 to 5',
    sub:'1 means meetings own your calendar. 5 means the rhythm runs itself and protects your focus.'},

  {t:'gap', k:'Gap 3 of 5 / The Second in Command', h:'The CEO-partnership gap', n:'03',
    sub:'When ownership between CEO and COO is blurred, the operator ends up doing the CEO job, their own job, and nobody job. Clarity here frees more hours than any tool.'},
  {t:'list', k:'Gap 3 / what good looks like', h:'When the partnership is clear',
    list:['You and the CEO have written who owns what, out loud.',
      'The CEO works on the future; you make the present run.',
      'Disagreements happen in private and resolve to one decision.']},
  {t:'score', k:'Gap 3 / self-score', h:'Rate your CEO-partnership gap, 1 to 5',
    sub:'1 means roles blur daily. 5 means ownership is explicit and you rarely collide.'},

  {t:'gap', k:'Gap 4 of 5 / Double Double', h:'The Growth-system gap', n:'04',
    sub:'If growth depends on heroics, it stalls the moment you look away. A repeatable system is what lets revenue and profit double in three years or less.'},
  {t:'list', k:'Gap 4 / what good looks like', h:'When growth is a system',
    list:['The levers that drive revenue are named, measured and owned.',
      'A new hire can run the play without you in the room.',
      'You can forecast the next double, not just hope for it.']},
  {t:'score', k:'Gap 4 / self-score', h:'Rate your Growth-system gap, 1 to 5',
    sub:'1 means growth lives in your head. 5 means it is a documented, owned system.'},

  {t:'gap', k:'Gap 5 of 5 / Invest In Your Leaders', h:'The Leadership-leverage gap', n:'05',
    sub:'If you have not built leaders beneath you, everything still routes through you. Leverage is the difference between a busy operator and a scalable one.'},
  {t:'score', k:'Gap 5 / self-score', h:'Rate your Leadership-leverage gap, 1 to 5',
    sub:'1 means every decision escalates to you. 5 means your leaders decide and own outcomes.'},

  {t:'tally', k:'Your scorecard', h:'Add up your Second in Command Scorecard',
    sub:'Total your five scores. Your lowest single gap is the first thing to fix. That one number is the conversation worth having next.'},
  {t:'next', k:'What members do next', h:'This is the room where operators fix it together',
    sub:'The COO Alliance is the only peer network built exclusively for COOs and second-in-command leaders. Members work these five gaps with vetted peers, direct access to Cameron, and the frameworks behind this scorecard.'},
  {t:'cta', k:'Your next step', h:'Bring your lowest score to a conversation',
    sub:'Take the gap you scored lowest and talk it through with the COO Alliance. Start with your scorecard.',
    disc:'Educational content only. No income, role, title, or business result is guaranteed. Results vary and depend on your own effort, market, and decisions. Figures and member stories are examples, not promises.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.k) inner += '<p class="kicker">' + s.k + '</p>';
  if (s.n) inner += '<p class="num">GAP ' + s.n + '</p>';
  if (s.h) inner += (i === 0 ? '<h1>' + s.h + '</h1>' : '<h2>' + s.h + '</h2>');
  if (s.sub) inner += '<p class="sub">' + s.sub + '</p>';
  if (s.list) { inner += '<ul>'; s.list.forEach(x => inner += '<li>' + x + '</li>'); inner += '</ul>'; }
  if (s.note) inner += '<span class="score">' + s.note + '</span>';
  if (s.t === 'score') inner += '<span class="score">Score 1 2 3 4 5</span>';
  if (s.disc) inner += '<p class="disc">' + s.disc + '</p>';
  inner += '<span class="foot">The COO Alliance / Second in Command Scorecard</span>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
