<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Somatic Blueprint, a masterclass with Julia Kraft of Speak To Inspire</title>
<link href="https://fonts.googleapis.com/css2?family=Radley:ital@0;1&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Palette derived from speaktoinspire.com (extract_brand.js, see 01-deep-research.md ## Palette):
   light-scheme brand -> LIGHT deck. accent #5a2633 (their dominant wine, 31 uses),
   highlight #ac5168 (their rose), ground #faf5f1 (from their #f9ede5 blush), ink #302b2a.
   Type: Radley (their brand serif) + Karla body. Not the house chassis, not Fraunces+Work Sans. */
:root{
  --bg:#faf5f1;
  --panel:#f3e7e1;
  --rule:#e6d3cc;
  --accent:#5a2633;
  --accent2:#ac5168;
  --ink:#302b2a;
  --muted:#6f6260;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Karla',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw;position:relative}
.slide{display:none;width:100%;max-width:960px;animation:fade .35s ease}
.slide.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:'Radley',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,66px);line-height:1.05;letter-spacing:-.01em}
h2{font-family:'Radley',Georgia,serif;font-weight:600;font-size:clamp(28px,4.5vw,48px);line-height:1.1;color:var(--ink)}
.accent{color:var(--accent)}
.lead{font-size:clamp(18px,2.4vw,26px);line-height:1.5;color:var(--muted);margin-top:24px;max-width:44ch}
.big{font-family:'Radley',Georgia,serif;font-size:clamp(26px,4vw,44px);line-height:1.22;max-width:22ch}
ul.pts{list-style:none;margin-top:28px;display:grid;gap:16px;max-width:40ch}
ul.pts li{font-size:clamp(17px,2.2vw,23px);line-height:1.4;padding-left:26px;position:relative;color:var(--ink)}
ul.pts li::before{content:'';position:absolute;left:0;top:.62em;width:11px;height:11px;border-radius:50%;background:var(--accent2)}
.part{display:flex;align-items:baseline;gap:20px}
.pnum{font-family:'Radley',serif;font-size:clamp(46px,9vw,120px);color:var(--accent);line-height:.9}
.pill{display:inline-block;background:var(--panel);color:var(--accent);border:1px solid var(--rule);border-radius:100px;padding:8px 18px;font-weight:600;font-size:15px;letter-spacing:.02em;margin-bottom:20px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:30px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:24px}
.card .t{font-family:'Radley',serif;font-size:22px;color:var(--accent);margin-bottom:8px}
.card .d{font-size:16px;line-height:1.45;color:var(--muted)}
.frame{background:var(--panel);border-left:5px solid var(--accent);border-radius:8px;padding:26px 28px;margin-top:26px;max-width:46ch}
.frame .t{font-family:'Radley',serif;font-size:clamp(22px,3vw,30px);color:var(--accent)}
.frame .d{font-size:18px;line-height:1.5;color:var(--ink);margin-top:10px}
.cta-line{font-size:clamp(19px,2.6vw,28px);line-height:1.5;margin-top:22px;max-width:34ch}
.disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:34px;max-width:60ch;border-top:1px solid var(--rule);padding-top:16px}
.byline{font-size:17px;color:var(--muted);margin-top:34px}
.byline b{color:var(--ink);font-weight:700}
#nav{position:fixed;bottom:20px;right:26px;display:flex;gap:10px;align-items:center;z-index:5}
#nav button{background:var(--panel);border:1px solid var(--rule);color:var(--accent);border-radius:100px;width:42px;height:42px;font-size:18px;cursor:pointer;font-family:inherit}
#count{position:fixed;bottom:28px;left:26px;font-size:13px;color:var(--muted);letter-spacing:.1em}
.progress{position:fixed;top:0;left:0;height:4px;background:var(--accent);transition:width .3s}
</style>
</head>
<body>
<div class="progress" id="bar"></div>
<div id="stage"></div>
<div id="count"></div>
<div id="nav"><button id="prev" aria-label="Previous">&larr;</button><button id="next" aria-label="Next">&rarr;</button></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass with Speak To Inspire',h:'The Somatic <span class="accent">Blueprint</span>',lead:'How to stop freezing in high-stakes rooms, without rehearsing more. For professional women who know their stuff and still blank.',byline:'with <b>Julia Kraft</b>, founder of Speak To Inspire'},
 {t:'who',kick:'Who this is for',h:'You are an expert. And when it is your turn to speak, you shrink.',pts:['You are a director, VP, founder or professional who is respected for your work','But meetings, QBRs, board updates and pitches make your chest tighten','You over-prepare, and still stumble, clam up, or lean on the script']},
 {t:'trap',kick:'The trap',big:'So you rehearse more. Memorise more. Try harder to look calm. And the nerves show up anyway.',lead:'Toastmasters, scripts, presentation tips. If technique alone worked, it would have worked by now.'},
 {t:'reframe',kick:'The reframe',big:'The problem was never your preparation. <span class="accent">It is your nervous system.</span>',lead:'And a nervous system can be retrained. That is the whole of this masterclass.'},
 {t:'part',n:'01',label:'The core problem',sub:'Why more rehearsal makes it worse'},
 {t:'body',kick:'The core problem',h:'You know your material. Your body does not believe you are safe.',pts:['In a high-stakes room your nervous system reads exposure as danger','It floods you with the same physical spike whether it is a lion or a boardroom','That spike is why you blank, race, or clam up, even when you are the expert']},
 {t:'frame',kick:'The core problem',ft:'Why "fake it till you make it" backfires',fd:'Pushing through a physical alarm with more scripting and more rehearsal adds pressure on top of the spike. The harder you brace, the louder the alarm gets. The work is not more control. It is teaching the body it is safe.'},
 {t:'part',n:'02',label:'The Fully Expressed method',sub:'The somatic way in, built for professional women'},
 {t:'frame',kick:'The method',ft:'1. The Somatic Root-Cause Audit',fd:'We find where the freeze actually lives in your body and what triggers it, instead of blaming your preparation. You cannot regulate what you have never located.'},
 {t:'frame',kick:'The method',ft:'2. The Real-Time Nervous System Reset',fd:'A somatic technique you run in the moment, mid-meeting, to neutralise the physical anxiety loop without losing your train of thought or your voice.'},
 {t:'frame',kick:'The method',ft:'3. The Promotion Unblocking Strategy',fd:'As the alarm quiets, your natural authority comes through. You stop reading as the dependable executor and start being seen as the leader you already are.'},
 {t:'threep',kick:'How the work holds',h:'Proven. Personal. Premium.',cards:[{t:'Proven',d:'The Fully Expressed curriculum has worked for women when nothing else did, including the technique-first route.'},{t:'Personal',d:'Every woman’s freeze has its own story. You get expert feedback on yours, not a one-size template.'},{t:'Premium',d:'Accountability, a safe space to practise, and mentorship, so the change actually sticks.'}]},
 {t:'part',n:'03',label:'When the alarm goes quiet',sub:'Who you are on the other side of the reset'},
 {t:'body',kick:'When the alarm goes quiet',h:'You speak on the fly, and you sound like yourself.',pts:['You answer the hard question in the QBR without pre-writing every word','You feel grounded in the room instead of bracing against it','Your message lands because you are present for it, not performing it']},
 {t:'body',kick:'When the alarm goes quiet',h:'Presence you can rely on, not a persona you maintain.',pts:['This is not becoming an extrovert or a polished performer','It is your real voice, steady under pressure','Comfort in your skin that holds up when the spotlight turns to you']},
 {t:'why',kick:'Why Speak To Inspire',h:'This is the work Julia has done since 2014.',pts:['Founder of Speak To Inspire, blending theater and performance training, somatic practice, mindfulness and public speaking','Has trained thousands of professionals and hundreds of teams inside companies like LinkedIn, Salesforce, ZScaler and Twitter','Focused entirely on smart, introverted professional women who want to be heard as themselves']},
 {t:'recap',kick:'The three shifts',h:'What changes today',pts:['You locate the freeze in your body, instead of blaming your prep','You get a reset you can run in the moment','You start being seen as the authority you already are']},
 {t:'cta',kick:'Your next step',h:'Ready to retrain how you show up?',cta_line:'Book a private strategy session with Speak To Inspire and we will map your Fully Expressed path together.',disc:'This masterclass is educational. It teaches a method for working with speaking anxiety and presence; it is not therapy or medical advice. No specific career, income, or performance result is guaranteed. Results vary from person to person.'}
];

function render(s){
 if(s.t==='title') return `<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="lead">${s.lead}</div><div class="byline">${s.byline}</div>`;
 if(s.t==='who'||s.t==='body'||s.t==='why'||s.t==='recap') return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><ul class="pts">${s.pts.map(p=>`<li>${p}</li>`).join('')}</ul>`;
 if(s.t==='trap'||s.t==='reframe') return `<div class="kick">${s.kick}</div><div class="big">${s.big}</div><div class="lead">${s.lead}</div>`;
 if(s.t==='part') return `<div class="part"><div class="pnum">${s.n}</div><div><div class="pill">Part ${s.n}</div><h2>${s.label}</h2><div class="lead">${s.sub}</div></div></div>`;
 if(s.t==='frame') return `<div class="kick">${s.kick}</div><div class="frame"><div class="t">${s.ft}</div><div class="d">${s.fd}</div></div>`;
 if(s.t==='threep') return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="grid3">${s.cards.map(c=>`<div class="card"><div class="t">${c.t}</div><div class="d">${c.d}</div></div>`).join('')}</div>`;
 if(s.t==='cta') return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="cta-line">${s.cta_line}</div><div class="disc">${s.disc}</div>`;
 return '';
}

let i=0;const stage=document.getElementById('stage');
function show(){stage.innerHTML=`<div class="slide on">${render(S[i])}</div>`;
 document.getElementById('count').textContent=`${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}`;
 document.getElementById('bar').style.width=`${((i+1)/S.length)*100}%`;}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));show();}
document.getElementById('next').onclick=()=>go(1);
document.getElementById('prev').onclick=()=>go(-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
show();
</script>
</body>
</html>
