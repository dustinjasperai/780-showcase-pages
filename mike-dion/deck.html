<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Irreplaceable Finance Pro — F9 Finance</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3ecdd; --panel:#fffdf7; --ink:#0e2a24; --accent:#00614d;
    --rule:#e8e1d4; --pop:#ff6b4a; --muted:#4a5a53;
    --serif:'Spectral',Georgia,serif; --sans:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(14,42,36,.04)}
  .slide.title{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.part{background:#eef2ee;border-color:var(--rule)}
  .num{font-family:var(--sans);font-weight:700;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .slide.title .num{color:var(--pop)}
  .rule{width:46px;height:3px;background:var(--accent);border-radius:2px;margin:0 0 20px}
  .slide.title .rule{background:var(--pop)}
  h1{font-family:var(--serif);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  h3{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.18}
  .sub{font-size:19px;color:var(--muted);margin-top:16px;max-width:42ch}
  .slide.title .sub{color:#cfe0d9}
  .big{font-family:var(--serif);font-weight:600;font-size:30px;line-height:1.25;max-width:26ch}
  p.body{font-size:18px;color:var(--ink);margin-top:14px;max-width:54ch}
  ul{margin:20px 0 0;padding:0;list-style:none}
  li{font-size:18px;padding:11px 0 11px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:56ch}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:3px;background:var(--accent);border-radius:2px}
  li b{font-family:var(--serif);font-weight:600}
  .kick{font-size:17px;color:var(--muted);margin-top:14px;max-width:52ch}
  .cta h2{color:var(--ink)}
  .cta .btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;
    font-weight:700;padding:14px 26px;border-radius:9px;font-size:17px}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:58ch;line-height:1.5}
  .cred{display:flex;gap:30px;flex-wrap:wrap;margin-top:22px}
  .cred div{min-width:120px}
  .cred .n{font-family:var(--serif);font-weight:700;font-size:30px;color:var(--accent)}
  .cred .l{font-size:14px;color:var(--muted);margin-top:2px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',num:"A live masterclass by Mike Dion, F9 Finance",h:"The Irreplaceable Finance Pro",sub:"How to put AI on your close, reporting and forecasting without handing your judgment to a machine."},
  {t:'who',num:"Who this is for",h2:"For the finance pro doing the real work",body:"Controllers, FP&A managers, senior finance managers and fractional CFOs who already carry the close, the board pack and the forecast, and who are quietly buried in manual work.",kick:"If your best hours go to re-keying actuals instead of the analysis that moves your career, this is for you."},
  {t:'list',num:"The trap",h2:"The month that never ends",items:["<b>Rebuild the same pack.</b> Every close, the same deck gets rebuilt from scratch.","<b>Re-key the same actuals.</b> Hours lost to copy, paste and reconcile.","<b>Write the same commentary.</b> The variance story, typed again by hand.","<b>No time left to think.</b> The work that would make you irreplaceable waits for next month, every month."]},
  {t:'hook',num:"The reframe",big:"The risk was never that AI replaces finance pros. It is that the finance pro who uses it replaces the one who does not.",kick:"The question is not whether to use AI. It is whether you own it or it owns your numbers."},
  {t:'part',num:"Part one",h2:"Why most finance AI quietly fails"},
  {t:'list',num:"Part one",h2:"Confident, and wrong",items:["<b>Theory first.</b> Courses teach prompts in the abstract, never on your actual month-end work.","<b>A generic chatbot.</b> One open box, no structure, no finance guardrails.","<b>No governance.</b> Nothing checks the number before it reaches the CFO.","<b>So it breaks under scrutiny.</b> The one place a finance number cannot be confidently wrong."]},
  {t:'body',num:"Part one",h3:"A worked example of the miss",body:"Hold labor at one month's percentage of revenue and a lazy model forecasts about 47,000 dollars of labor against an actual near 109,000. Wrong by more than 61,000 dollars, on one line, in one month, at one store out of seven. A model will make that error at scale and never flinch.",kick:"AI has to be governed by finance judgment. That is the whole point, and it is the part no generic tool teaches."},
  {t:'part',num:"Part two",h2:"The F9 method: one skill every two weeks, applied to the job you already have"},
  {t:'list',num:"Part two",h3:"AI Reporting",items:["Turn the monthly pack from a two-day rebuild into a workflow that assembles itself.","Fifteen minutes a day, run on your real reports, inside the tools you already use."]},
  {t:'list',num:"Part two",h3:"Data Cleaning",items:["Power Query plus AI to standardise messy exports before they ever reach your model.","Stop reconciling by eye. Let the clean step run itself and flag what actually changed."]},
  {t:'list',num:"Part two",h3:"AI Commentary",items:["A variance narrative that holds up: tied to the numbers, in your voice, drafted in seconds.","You edit and approve. The blank page disappears."]},
  {t:'list',num:"Part two",h3:"Close Automation",items:["The repeating steps of the close, sequenced and automated, with a human sign-off at every gate.","Shorten the close without losing a single control."]},
  {t:'list',num:"Part two",h3:"AI Forecasting",items:["Driver-based scenarios built off real actuals, with the model's weak points exposed, not hidden.","Forecast ranges you can defend, because you can see where they would break."]},
  {t:'list',num:"Part two",h3:"Prompting for Finance",items:["Finance-specific prompts that produce output able to survive a CFO review.","The difference between a toy answer and a number you would put your name on."]},
  {t:'part',num:"Part three",h2:"Where this goes: the AI CFO org chart"},
  {t:'list',num:"Part three",h3:"Not a chatbot. A governed system.",items:["<b>The org chart.</b> A planning agent plus specialists for FP&A, treasury, accounting, reporting and risk, each owning its lane.","<b>The data layer.</b> One source of truth the agents read from.","<b>The orchestration layer.</b> Workflow governance with human-in-the-loop approvals and materiality thresholds.","<b>The result.</b> A finance function that mirrors a real org, where you set the judgment and the system does the grunt work."]},
  {t:'body',num:"Part three",h3:"Ninety days from now",body:"Real workflows running in your actual job. The close shorter, the commentary drafted, the forecast defensible. The hours you used to lose are back, and they go to the analysis only you can do.",kick:"That is what it means to become the person your team cannot replace."},
  {t:'cred',num:"Why learn this here",h2:"Taught by someone who did the work",cred:[["10+ yrs","Corporate finance and FP&A"],["5,000+","Finance pros trained"],["150,000+","Hours saved with AI"]],kick:"Mike Dion runs F9 Finance and hosts the Excel at AI in Finance podcast. No theory. Just the moves that make you the person your team cannot replace."},
  {t:'cta',num:"Your next step",h2:"Start the first roadmap",body:"Join the Finance AI Lab and run your first AI skill on real finance work in fifteen minutes a day, or move fast in the four-week Finance AI Fast Track with live coaching.",btn:"Join the Finance AI Lab",disc:"Educational content only. No income or result is guaranteed. Results vary and depend on your own work, your data and your organisation."}
];
function esc(s){return s;}
function render(){
  const d=document.getElementById('deck');
  S.forEach(s=>{
    const el=document.createElement('section');
    el.className='slide '+(s.t==='title'?'title':s.t==='part'?'part':s.t==='cta'?'cta':'');
    let h='';
    if(s.num) h+='<div class="num">'+s.num+'</div>';
    h+='<div class="rule"></div>';
    if(s.h) h+='<h1>'+s.h+'</h1>';
    if(s.h2) h+='<h2>'+s.h2+'</h2>';
    if(s.h3) h+='<h3>'+s.h3+'</h3>';
    if(s.big) h+='<div class="big">'+s.big+'</div>';
    if(s.body) h+='<p class="body">'+s.body+'</p>';
    if(s.items){h+='<ul>';s.items.forEach(i=>h+='<li>'+i+'</li>');h+='</ul>';}
    if(s.cred){h+='<div class="cred">';s.cred.forEach(c=>h+='<div><div class="n">'+c[0]+'</div><div class="l">'+c[1]+'</div></div>');h+='</div>';}
    if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
    if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
    if(s.btn) h+='<div><span class="btn">'+s.btn+'</span></div>';
    if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
    el.innerHTML=h;
    d.appendChild(el);
  });
}
render();
</script>
</body>
</html>
