<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Come As You Are: The Regulated Room — a masterclass with Giana Gambino</title>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,400;0,500;0,600;0,700;1,500;1,600&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eceef2; --panel:#f8f9fb; --rule:#d7dce4;
    --ink:#161616; --muted:#565b64; --accent:#242833;
    --head:'Newsreader',Georgia,serif; --body:'Assistant',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:64px 60px;margin:26px 0;box-shadow:0 10px 34px rgba(36,40,51,.06);
    min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .kick{font-family:var(--body);font-size:15px;font-weight:700;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:600;font-size:60px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.12;letter-spacing:-.01em}
  .lead{font-size:24px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:40ch}
  .body{font-size:23px;line-height:1.55;color:var(--ink);margin-top:20px;max-width:48ch}
  .by{margin-top:40px;font-size:20px;color:var(--muted)}
  .by strong{color:var(--ink);font-weight:700}
  .num{font-family:var(--head);font-style:italic;font-size:26px;color:var(--accent);margin-bottom:14px}
  .rule{width:64px;height:4px;background:var(--accent);border-radius:3px;margin:8px 0 6px}
  ul{margin-top:22px;list-style:none}
  li{font-size:22px;line-height:1.5;color:var(--ink);padding-left:30px;position:relative;margin-bottom:16px;max-width:46ch}
  li::before{content:'';position:absolute;left:0;top:13px;width:12px;height:12px;border-radius:50%;
    border:2.5px solid var(--accent)}
  .cta-box{font-size:23px;line-height:1.5;color:var(--ink);margin-top:14px}
  .cta-step{display:inline-block;margin-top:26px;font-family:var(--body);font-weight:700;font-size:20px;
    color:#fff;background:var(--accent);border-radius:100px;padding:15px 30px}
  .disc{margin-top:30px;font-size:14px;line-height:1.5;color:#8a857a;max-width:60ch}
  .pg{position:absolute;right:30px;bottom:22px;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:#b8b0a1;font-weight:700}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', kick:'A free live masterclass', h:'Come As You Are: The Regulated Room',
  lead:'How to teach yoga that settles the nervous system first, so every body in the room can actually learn.',
  by:'With <strong>Giana Gambino</strong>, C.A.Y.A. Yoga School'},

 {t:'content', kick:'Who this is for',
  h:'The class finished your certification. It did not finish your nerves.',
  body:'This is for the newly certified teacher who knows the poses cold, then freezes the second a real room turns to look at them.'},

 {t:'content', kick:'The trap',
  h:'You were trained to teach poses. You were never trained to hold a room.',
  body:'Most trainings grade you on alignment and sequencing. Then you stand in front of eight strangers and realize nobody taught you the part that actually matters.'},

 {t:'content', kick:'The reframe',
  h:'A perfect flow in a dysregulated room teaches nothing.',
  body:'The nervous system learns first; the body follows. If the room is braced and anxious, your cleverest sequence lands on no one. Settle the room and the practice teaches itself.'},

 {t:'section', num:'Part One', h:'Why great sequencing is not enough'},

 {t:'content', kick:'Part One',
  h:'The feed is full of flashy flows.',
  body:'Fast, photogenic, exhausting. Students leave tired and impressed, not changed. Creative sequencing is not the goal; it is a tool, and on its own it is a distraction.'},

 {t:'content', kick:'Part One',
  h:'Regulation comes before intensity.',
  body:'A settled nervous system is the prerequisite for learning, for depth, and for the trust that keeps a student coming back. Intensity without regulation is just stress in stretchy pants.'},

 {t:'section', num:'Part Two', h:'The Come As You Are method'},

 {t:'pillar', num:'Pillar 1', h:'Come As You Are',
  body:'Meet every body, tradition, and experience level exactly where it is. You design the class so nobody has to perform their way in. Belonging is the first cue.'},

 {t:'pillar', num:'Pillar 2', h:'Regulate first',
  body:'Open with breath and pace, not peak poses. You learn the signals of a braced room and the handful of moves that bring it down before you ask anything hard of it.'},

 {t:'pillar', num:'Pillar 3', h:'Intelligent sequencing',
  body:'Every pose, prop, and variation earns its place. Peak Pose Analysis: you build backward from one intention so the arc has a reason, not just a playlist.'},

 {t:'pillar', num:'Pillar 4', h:'Cue like a human',
  body:'Language that lands without the jargon. You replace recited anatomy with plain, warm direction people can actually follow with their eyes closed.'},

 {t:'section', num:'Part Three', h:'Inside a class that actually settles'},

 {t:'content', kick:'Part Three',
  h:'The arc of a class that regulates.',
  body:'Welcome, then breath, then a build with a clear intention, then one honest peak, then a real settle. Five moves, repeatable, and students feel the difference on the mat.'},

 {t:'content', kick:'Part Three',
  h:'Teaching outside the studio, without burning out.',
  body:'Your voice, your own classes, workshops and privates and retreats. A sustainable teaching life is built on a method you trust, not on saying yes to every slot until you are empty.'},

 {t:'pillar', num:'Why me', h:'Who is teaching this',
  body:'Giana Gambino co-founded C.A.Y.A. Yoga School on the Come As You Are principle, with 22 years of combined teaching behind the trainings and the weekly podcast, The Funny Thing About Yoga.'},

 {t:'content', kick:'The recap',
  h:'Three shifts you can make this week.',
  body:'Regulate the room before you sequence it. Build every class backward from one intention. Cue like a person, not a manual. That is the whole method in one breath.'},

 {t:'cta', kick:'Come as you are, keep going', h:'Train with C.A.Y.A.',
  cta:'If you want the full method, with practice teaching and feedback, our 200 and 300-hour teacher trainings are where it lives.',
  step:'Explore the C.A.Y.A. teacher training',
  disc:'This masterclass is educational. Results vary from teacher to teacher, and nothing here is a guarantee of income, enrollment, or any particular outcome.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  if(s.kick) html+=`<div class="kick">${s.kick}</div>`;
  if(s.t==='title'){
    html+=`<h1>${s.h}</h1>`;
    if(s.lead) html+=`<div class="lead">${s.lead}</div>`;
    if(s.by) html+=`<div class="by">${s.by}</div>`;
  } else if(s.t==='section'){
    if(s.num) html+=`<div class="num">${s.num}</div>`;
    html+=`<div class="rule"></div><h2>${s.h}</h2>`;
  } else if(s.t==='pillar'){
    if(s.num) html+=`<div class="num">${s.num}</div>`;
    html+=`<h2>${s.h}</h2>`;
    if(s.body) html+=`<div class="body">${s.body}</div>`;
  } else if(s.t==='cta'){
    html+=`<h2>${s.h}</h2>`;
    if(s.cta) html+=`<div class="cta-box">${s.cta}</div>`;
    if(s.step) html+=`<div class="cta-step">${s.step}</div>`;
    if(s.disc) html+=`<div class="disc">${s.disc}</div>`;
  } else {
    html+=`<h2>${s.h}</h2>`;
    if(s.body) html+=`<div class="body">${s.body}</div>`;
    if(s.list){ html+='<ul>'+s.list.map(x=>`<li>${x}</li>`).join('')+'</ul>'; }
  }
  html+=`<div class="pg">C.A.Y.A. &middot; ${i+1} / ${S.length}</div>`;
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
