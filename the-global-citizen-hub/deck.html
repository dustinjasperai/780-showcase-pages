<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tuition-Free Path to Europe · The Global Citizen Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#211450;      /* their mid indigo ground */
    --panel:#2c256f;   /* their lighter indigo */
    --rule:#180e3a;    /* their deepest indigo, for thin edges */
    --accent:#4855bf;  /* their exact brand accent */
    --ink:#ffffff;
    --muted:#d2d7db;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    position:relative;background:linear-gradient(170deg,var(--panel),var(--bg));
    border:1px solid var(--rule);border-radius:18px;padding:56px 54px;margin:0 0 26px;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;top:0;left:0;height:5px;width:100%;
    background:linear-gradient(90deg,var(--accent),transparent 72%)}
  .slide::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;
    border:1.5px dashed var(--rule);border-radius:50%;opacity:.45}
  .num{position:absolute;top:20px;right:26px;font-size:12px;letter-spacing:.18em;color:var(--muted);opacity:.6}
  .k{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:"Spectral",Georgia,serif;font-size:clamp(34px,5.4vw,60px);line-height:1.04;font-weight:400;letter-spacing:-.01em}
  h2{font-family:"Spectral",Georgia,serif;font-size:clamp(27px,3.8vw,42px);line-height:1.1;font-weight:400;letter-spacing:-.01em}
  .sub{font-size:clamp(17px,2vw,21px);color:var(--muted);margin-top:20px;max-width:40ch}
  .body{font-size:clamp(16px,1.7vw,19px);color:var(--ink);margin-top:20px;max-width:52ch}
  .note{font-size:14px;color:var(--muted);margin-top:22px;max-width:56ch}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:58ch}
  li{position:relative;padding-left:30px;font-size:clamp(16px,1.7vw,19px);color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border-radius:3px;
    background:var(--accent);transform:rotate(45deg)}
  .step{font-family:"Spectral",serif;font-size:15px;letter-spacing:.2em;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
  .big{font-family:"Spectral",serif;font-size:clamp(40px,7vw,86px);color:var(--accent);line-height:1}
  .cmp{display:flex;flex-wrap:wrap;gap:26px;margin-top:30px}
  .cmp div{flex:1 1 220px;background:rgba(255,255,255,.04);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .cmp .lab{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
  .cmp .val{font-family:"Spectral",serif;font-size:clamp(24px,3vw,34px)}
  .disc{font-size:12.5px;color:var(--muted);opacity:.85;margin-top:26px;max-width:62ch;line-height:1.55}
  .cover{min-height:540px}
  .cover h1{max-width:18ch}
  footer{text-align:center;color:var(--muted);opacity:.55;font-size:12px;letter-spacing:.14em;margin-top:30px}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:380px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<footer>THE GLOBAL CITIZEN HUB &middot; TRAVIS DREWS</footer>
<script>
const S = [
  {t:'cover', k:"A Global Citizen Hub Masterclass with Travis Drews",
    h:"The Tuition-Free Path to Europe",
    sub:"How to earn an English-taught European degree for under 5,000 euros a year and turn it into a life abroad."},

  {t:'who', k:"Who this is for",
    h:"If you have quietly wondered whether Europe is even possible",
    list:[
      "You are staring down US tuition or the debt you already carry.",
      "You assumed moving abroad was only for the wealthy, the young, or the already-fluent.",
      "You want a calmer baseline, a real education, or a fresh start, and you want it to be legal and lasting.",
      "You are tired of generic move-abroad advice that never gets specific about money."
    ]},

  {t:'trap', k:"The trap",
    h:"You were handed two bad options",
    body:"Take out a loan the size of a house deposit, or give up on the idea entirely. Nobody showed you the third door.",
    list:[
      "Tuition sticker shock back home.",
      "A wall of visa jargon that makes the whole thing feel impossible.",
      "The quiet belief that you need to be rich, under 25, or fluent to qualify."
    ]},

  {t:'hook', k:"The uncomfortable truth",
    h:"The barrier was never money. It was information.",
    body:"Most people pouring money into tuition have no idea that a fully accredited, English-taught European degree can cost less than a single semester back home. Once you can see the real options, the decision stops being about whether you can afford it, and starts being about whether you want it."},

  {t:'part', k:"Part One", h:"Why the old map is wrong"},

  {t:'list', k:"Part One",
    h:"Three myths that keep good people stuck",
    list:[
      "“I need to be fluent first.” Hundreds of European degree programs are taught entirely in English.",
      "“I am too old.” Many public programs have no age limit at all.",
      "“I need a huge savings cushion.” Public tuition is often capped near 5,000 euros a year, and plenty of programs are fully subsidized."
    ]},

  {t:'cmp', k:"Part One",
    h:"Look at the actual numbers",
    cmp:[
      {lab:"The default path",val:"~ $38,000", sub:"average US student debt per borrower"},
      {lab:"A European public degree",val:"≤ 5,000 euros / yr", sub:"many programs fully subsidized, taught in English"}
    ],
    note:"Same credential. A different continent. A fraction of the price. That gap is the whole opportunity."},

  {t:'part', k:"Part Two", h:"The Global Citizen Path"},

  {t:'step', k:"Part Two", step:"Step One · Target",
    h:"Decide the life first, the country second",
    body:"Start from the life you actually want, the climate, the pace, the cost of living, the language you are willing to learn, and let that shortlist the countries. The right destination is the one that fits your life, not the one with the prettiest postcard."},

  {t:'step', k:"Part Two", step:"Step Two · Qualify",
    h:"Find your near-free program",
    body:"This is where the European Scholarship Database does the heavy lifting: 500+ verified public-university programs across Germany, France, Spain, Portugal, Italy and more, all taught in English, all with low or no tuition. You are not hunting blind. You are matching your background to programs that already accept international applicants."},

  {t:'step', k:"Part Two", step:"Step Three · Enter",
    h:"Choose the right visa for your route",
    body:"A student place, a job-seeker visa, or Germany's new Opportunity Card. Each one is a legal front door, and each has a clear checklist once you know which one fits you. The mistake is picking the country before you understand the door you will walk through."},

  {t:'step', k:"Part Two", step:"Step Four · Stay",
    h:"Turn the visa into a future",
    body:"A first visa is a beginning, not the finish line. The Citizenship Mega Pack maps how a student or work visa becomes long-term residency, and how residency can become a second passport, so the move you make this year keeps paying off for decades."},

  {t:'part', k:"Part Three", h:"What it actually looks like"},

  {t:'list', k:"Part Three",
    h:"A realistic timeline, not a fantasy",
    list:[
      "Months 1 to 2: get clear on your target life and shortlist countries.",
      "Months 2 to 4: match yourself to programs and prepare applications.",
      "Months 4 to 8: applications, acceptance, and the visa paperwork.",
      "Arrival: land with a plan for residency, not just a plane ticket."
    ],
    note:"Timelines shift with your situation and with each country's calendar. The point is that it is a sequence you can run, not a lottery you enter."},

  {t:'list', k:"Part Three",
    h:"The mistakes that cost people the most",
    list:[
      "Falling for an agent who charges thousands for information that is public.",
      "Applying to one dream school instead of a sensible shortlist.",
      "Choosing the country before understanding the visa.",
      "Treating the first visa as the whole plan and ignoring the path to residency."
    ]},

  {t:'why', k:"Why I built this",
    h:"I did this myself, then built the map I wish I had",
    body:"I moved to Europe and learned the hard way how much of this is hidden behind jargon and expensive gatekeepers. So I built The Global Citizen Hub: the scholarship database, the visa guides, and the community, so that the next person does not have to throw money away on loans or agents to find a door that was open the whole time."},

  {t:'recap', k:"The path in one slide",
    h:"Target. Qualify. Enter. Stay.",
    list:[
      "Target the life, and let it pick the country.",
      "Qualify for a near-free, English-taught program.",
      "Enter through the visa that fits your route.",
      "Stay, and turn the visa into residency and a passport."
    ]},

  {t:'cta', k:"Your next step",
    h:"See if your European path is closer than you think",
    body:"Inside The Global Citizen Hub you get the European Scholarship Database, the country visa guides, and a community of people making the same move, so you can go from “maybe someday” to a real, costed plan.",
    note:"Join The Global Citizen Hub to start matching yourself to programs this week.",
    disc:"This masterclass is educational only. No specific admission, scholarship, visa, immigration outcome, or financial result is guaranteed. Results vary based on your background, your effort, program availability, and the independent decisions of universities and governments. Always confirm current requirements with the relevant institution or authority."}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=el('section','slide'+(s.t==='cover'?' cover':''));
  sec.appendChild(el('div','num',String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')));
  if(s.k) sec.appendChild(el('div','k',s.k));
  if(s.step) sec.appendChild(el('div','step',s.step));
  if(s.h) sec.appendChild(el(s.t==='cover'?'h1':(s.t==='part'?'h1':'h2'),null,s.h));
  if(s.sub) sec.appendChild(el('div','sub',s.sub));
  if(s.body) sec.appendChild(el('div','body',s.body));
  if(s.cmp){const w=el('div','cmp');s.cmp.forEach(c=>{const d=el('div');d.appendChild(el('div','lab',c.lab));d.appendChild(el('div','val',c.val));if(c.sub)d.appendChild(el('div','note',c.sub));w.appendChild(d);});sec.appendChild(w);}
  if(s.list){const ul=el('ul');s.list.forEach(x=>ul.appendChild(el('li',null,x)));sec.appendChild(ul);}
  if(s.note) sec.appendChild(el('div','note',s.note));
  if(s.disc) sec.appendChild(el('div','disc',s.disc));
  deck.appendChild(sec);
});
</script>
</body>
</html>
