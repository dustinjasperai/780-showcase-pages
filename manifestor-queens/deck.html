<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sell &amp; Scale Like a Manifestor - Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Questrial&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#070504;
    --panel:#15100d;
    --accent:#9b1f1f;
    --gold:#b39c51;
    --cream:#f0e8cc;
    --ink:#f0e8cc;
    --muted:#a89266;
    --display:'Cormorant Garamond', Georgia, serif;
    --body:'Questrial', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--panel);
    border:1px solid rgba(179,156,81,.22);
    border-radius:14px;
    padding:52px 54px;
    margin:0 0 20px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);
  }
  .kicker{font-family:var(--body);letter-spacing:.32em;text-transform:uppercase;
    font-size:12px;color:var(--gold);margin:0 0 20px}
  h1{font-family:var(--display);font-weight:600;font-size:54px;line-height:1.04;margin:0 0 18px;color:var(--cream)}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.08;margin:0 0 18px;color:var(--cream)}
  .lede{font-family:var(--display);font-style:italic;font-size:26px;line-height:1.3;color:var(--gold);margin:0 0 10px}
  p{font-size:19px;line-height:1.62;color:var(--ink);margin:0 0 14px;max-width:62ch}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink);margin:0 0 14px;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--accent);
    transform:rotate(45deg)}
  .big{font-family:var(--display);font-size:46px;line-height:1.12;color:var(--cream);font-style:italic}
  .part-num{font-family:var(--display);font-size:120px;line-height:1;color:var(--accent);opacity:.9;margin:0 0 6px}
  .name{font-family:var(--display);font-size:22px;color:var(--gold);font-style:italic}
  .foot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted);letter-spacing:.12em}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin-top:22px;max-width:70ch}
  .cta-line{font-family:var(--display);font-size:30px;color:var(--cream);margin:14px 0 0}
  .threshold{color:var(--gold)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Masterclass for Manifestor Women in Business',
   h:'Sell &amp; Scale Like a Manifestor',
   lede:'Strategy and AI execution, without abandoning yourself.',
   p:'Manifestors do not build businesses like everyone else. This hour is the path from holding back to clean, initiated movement.'},

  {t:'who',
   kicker:'Who this is for',
   h:'The woman who is done forcing it',
   p:'You are a Manifestor. You can see the whole thing before anyone else can. You have launched, led, and built - and you are tired of running on an engine that was designed for a different type.',
   list:['You have offers and an audience already','You move in bursts, not in steady daily routines','You keep being told to "stay consistent" and it keeps costing you']},

  {t:'trap',
   kicker:'The trap',
   h:'You were handed a map built for Generators',
   p:'Almost every business playbook assumes you respond to the market, grind daily, and wait to be asked. For a Manifestor that advice is not just unhelpful. It is the exact thing that makes you shrink, stall, and second-guess your own knowing.'},

  {t:'hook',
   kicker:'The reframe',
   h:'You do not need more strategy',
   big:'You need to move.',
   p:'The gap is not information. You already know where you are. The only question is whether you stay there, or initiate.'},

  {t:'cost',
   kicker:'What holding back costs',
   h:'The price of waiting to be ready',
   list:['The offer that stays in your drafts while someone louder sells it','The clients who never find you because you did not inform the room','The energy you leak managing everyone else before you move','The quiet resentment that builds when you make yourself small']},

  {t:'part',
   kicker:'Part One',
   num:'01',
   h:'The core problem',
   p:'You are trying to run a Manifestor business on borrowed mechanics - and then blaming yourself when they do not fit.'},

  {t:'content',
   kicker:'Part One',
   h:'Consistency is the wrong goal',
   p:'Manifestor energy is not a steady output. It is initiation in waves. When you force a flat daily routine on a wave-shaped energy, you burn the wave trying to look productive in the trough.',
   list:['Steady routines drain you and still look like "not enough"','Reacting to the market keeps you a step behind your own vision','"More strategy" becomes a hiding place from the next move']},

  {t:'content',
   kicker:'Part One',
   h:'The missing move: informing',
   p:'The Manifestor strategy is to inform before you act. Not to ask permission. Most of the friction you feel in launches and sales is resistance you created by moving without first informing the people your move affects - your audience, your clients, your own nervous system.'},

  {t:'part',
   kicker:'Part Two',
   num:'02',
   h:'The method',
   lede:'Reclaim. Own. Lead.',
   p:'Three phases that put your business back on your own engine. Each one is a different move, in order.'},

  {t:'content',
   kicker:'Reclaim',
   h:'Your rhythm. Your power.',
   p:'Before strategy, reclaim the way you are actually built to move. We map your energetic season so you stop scheduling launches in your trough and stop apologising for your bursts.',
   list:['Name your real capacity instead of a borrowed calendar','Design around waves of initiation, not flat daily output','Stop abandoning yourself to look consistent']},

  {t:'content',
   kicker:'Own',
   h:'Your voice. Your positioning.',
   p:'Now we make you unmistakable. A Manifestor who informs clearly and positions with authority does not chase clients - she magnetises the ones already looking for exactly her.',
   list:['Sharpen the one message only you can carry','Inform the room so your moves land instead of surprising people','Position from authority, not from proving']},

  {t:'content',
   kicker:'Lead',
   h:'At your level. With clean power.',
   p:'Leading is operating at full capacity without the self-abandonment. You make the call, you inform, you move - and you let the structure and the team carry what does not need you.',
   list:['Make decisions at the speed you actually see at','Hold power without burning out or going quiet','Lead the room instead of managing it']},

  {t:'content',
   kicker:'The reset',
   h:'The One: a 30-day operating system reset',
   p:'Reclaim, Own and Lead are not a mindset idea. The One is the daily audio practice that rewires the holding-back pattern into initiation - thirty days to stop overthinking your capability and start moving from it.'},

  {t:'content',
   kicker:'The sales move',
   h:'Sell like a Manifestor',
   p:'Selling is not louder pushing. For a Manifestor it is informing with such clarity that the right person decides before you ever "close." We build your enrolment around the inform-and-initiate move so sales feels like leadership, not performance.'},

  {t:'content',
   kicker:'The execution layer',
   h:'AI execution: move fast, not more hours',
   p:'The reason Manifestors stall is the gap between a fast vision and slow hands. AI is the execution engine that lets you act on the wave while it is here - drafting, systemising and shipping at the speed you see, so initiation does not die in the backlog.'},

  {t:'content',
   kicker:'The result',
   h:'Dream Urge clients',
   p:'When your rhythm, message and execution are aligned, you attract the clients your energy is actually built for - the ones who match your urge, not the ones you talked yourself into.'},

  {t:'part',
   kicker:'Part Three',
   num:'03',
   h:'A business on your own engine',
   p:'A Manifestor business that runs on initiation, informs before it moves, and scales without costing you yourself.'},

  {t:'content',
   kicker:'Before and after',
   h:'From forcing to initiating',
   list:['Before: flat routines, launches in the trough, quiet burnout','After: moves timed to your season, informed and clean','Before: selling by proving and pushing','After: selling by informing, clients deciding on their own','Before: vision stuck in the backlog','After: AI executing at the speed you see']},

  {t:'why',
   kicker:'Why me',
   h:'I built this from the inside',
   p:'I am Taye Dee, a 5/1 Manifestor. I teach Manifestor women business strategy and AI execution because I rebuilt my own business on this exact path - Reclaim, Own, Lead - after years of trying to run it on advice that was never designed for how I move.',
   name:'Taye Dee - Manifestor Queens'},

  {t:'recap',
   kicker:'The path',
   h:'Your next move',
   list:['Reclaim your rhythm and your real capacity','Own your voice and inform the room','Lead at full power with AI carrying the execution'],
   p:'This is the work inside my world - from The Throne Room to The Initiators mastermind.'},

  {t:'cta',
   kicker:'Step through the Red Door',
   h:'Ready to move?',
   p:'If you are a Manifestor woman ready to lead, sell and scale at your full capacity, the next step is The Initiators - my high-frequency mastermind designed only for Manifestors. Apply to step inside.',
   ctaLine:'Apply for The Initiators at tayedee.com',
   disc:'Educational content only. No income or specific result is guaranteed. Results vary based on your own effort, market, and circumstances. Human Design is used as a self-reflection framework, not as advice that replaces professional, medical, or financial guidance.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let html = '';
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.num) html += '<div class="part-num">' + s.num + '</div>';
  if (s.h) html += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
  if (s.lede) html += '<div class="lede">' + s.lede + '</div>';
  if (s.big) html += '<div class="big">' + s.big + '</div>';
  if (s.p) html += '<p>' + s.p + '</p>';
  if (s.list) { html += '<ul>'; s.list.forEach(x => html += '<li>' + x + '</li>'); html += '</ul>'; }
  if (s.ctaLine) html += '<div class="cta-line threshold">' + s.ctaLine + '</div>';
  if (s.name) html += '<div class="name">' + s.name + '</div>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  html += '<div class="foot">' + String(i + 1).padStart(2, '0') + ' / ' + String(S.length).padStart(2, '0') + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
