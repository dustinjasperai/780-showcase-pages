<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the 50-Minute Session: A Masterclass for Couples Therapists</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;1,500&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eff1ec;
    --panel:#dde4dd;
    --ink:#30373e;
    --accent:#496561;
    --accent2:#9c2c24;
    --rule:#cfc9bc;
    --dim:#6b7470;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:'Mulish',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;padding:28px;
  }
  #stage{width:100%;max-width:880px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:54px 58px;min-height:500px;
    display:none;flex-direction:column;justify-content:center;
    box-shadow:0 10px 40px rgba(48,55,62,.08);
  }
  .slide.on{display:flex}
  .kicker{font-family:'Mulish';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Spectral',serif;font-weight:600;font-size:46px;line-height:1.08;color:var(--ink)}
  h2{font-family:'Spectral',serif;font-weight:600;font-size:33px;line-height:1.14;color:var(--ink)}
  .sub{font-family:'Spectral',serif;font-style:italic;font-weight:500;font-size:22px;color:var(--accent);margin-top:18px}
  p,li{font-size:19px;line-height:1.58;color:var(--ink)}
  p+p{margin-top:16px}
  ul{list-style:none;margin-top:22px}
  li{position:relative;padding-left:30px;margin-bottom:15px}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;
    border:2px solid var(--accent);border-radius:50%}
  .lead{font-size:23px;line-height:1.5}
  .big{font-family:'Spectral',serif;font-weight:600;font-size:40px;line-height:1.15;color:var(--accent)}
  .part{font-family:'Spectral',serif;font-weight:600;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent2)}
  .foot{margin-top:26px;font-size:15px;color:var(--dim)}
  .rule{width:64px;height:3px;background:var(--accent);margin:22px 0;border-radius:2px}
  .cards{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:24px}
  .card{background:var(--panel);border-radius:10px;padding:20px 22px}
  .card h3{font-family:'Spectral',serif;font-weight:600;font-size:19px;margin-bottom:6px;color:var(--ink)}
  .card p{font-size:16px;color:var(--dim)}
  .disc{font-size:14px;color:var(--dim);margin-top:24px;line-height:1.5;max-width:620px}
  .cta-line{font-family:'Spectral';font-weight:600;font-size:21px;color:var(--accent);margin-top:10px}
  nav{position:fixed;bottom:18px;left:0;right:0;display:flex;gap:16px;justify-content:center;align-items:center}
  nav button{font-family:'Mulish';font-weight:600;font-size:14px;background:var(--panel);
    color:var(--ink);border:1px solid var(--rule);border-radius:8px;padding:8px 16px;cursor:pointer}
  #count{font-size:13px;color:var(--dim)}
</style>
</head>
<body>
<div id="stage"></div>
<nav><button onclick="go(-1)">Prev</button><span id="count"></span><button onclick="go(1)">Next</button></nav>
<script>
const S=[
 {t:'title',kicker:'A Live Masterclass for Couples Therapists',h:'Beyond the 50-Minute Session',sub:'How to Offer Couples Therapy Intensives',foot:'Shane Birkel, LMFT  ·  Certified Relational Life Therapist  ·  Host of The Couples Therapist Couch'},
 {t:'promise',kicker:'What you will leave with',h:'A clear way to do deeper work, and the confidence to offer it',list:['The arc of an intensive, so you know what you are trying to accomplish even when the session goes somewhere you did not expect','The 4 Cs, a clinical compass for the moments you are not sure where to go next','How to structure, explain, price, and actually begin offering intensives in your practice']},
 {t:'who',kicker:'Who this is for',h:'The therapist who keeps reaching something real at minute 47',p:['You already have experience working with couples. You believe in this work.','You have also felt the frustration of finally getting somewhere, then looking at the clock.'],foot:'You do not need to have run an intensive before. You may be here precisely because you have not.'},
 {t:'trap',kicker:'The moment you know',h:'There are three minutes left',p:['The couple came in activated. One partner is angry, the other is shutting down. You slow things down. You help them feel safe enough to actually talk.','Something finally opens up. And then you look at the clock.','You contain what just happened, help them regulate, schedule the next appointment, and send them back out into their lives.']},
 {t:'reframe',kicker:'A different question',h:'What if the problem is not always the therapy?',big:'What if sometimes the container is simply too small for the work we are trying to do?',foot:'This is not about abandoning weekly couples therapy. It is about having enough time to do the work the couple actually needs.'},
 {t:'part',part:'Part One',h:'The Container Problem'},
 {t:'content',kicker:'The core problem',h:'The hour was never built for this work',p:['Couples therapy means working with attachment, family history, shame, fear, betrayal, parenting, and some of the most important relationships in a person’s life.','That is intensive work whether we give ourselves fifty minutes or six hours.','The weekly hour asks you to open something up and close it back down before the real work can land.']},
 {t:'content',kicker:'What it costs',h:'Good work that never gets to finish',p:['The couple leaves regulated but not changed. You carry the sense that you were close.','Over time, the fifty-minute frame quietly sets the ceiling on how deep your work can go, and on how your practice has to be built to sustain it.']},
 {t:'part',part:'Part Two',h:'The Arc of an Intensive'},
 {t:'content',kicker:'Not a script',h:'Structure without a rigid formula',p:['An intensive might be two hours, three hours, four hours, a full day, or more. Couples do not follow a six-hour agenda, so you do not teach from one.','What you need is the arc: an understanding of what you are moving toward, so you can follow the work where it needs to go and still know where you are.']},
 {t:'content',kicker:'The arc, step by step',h:'Where the time goes',list:['Establish safety and expectations from the very beginning','Clarify what each partner really wants from the relationship and from the intensive','Identify and work with the cycle underneath the presenting conflict','Bring in family-of-origin work when it is relevant to what is happening now']},
 {t:'content',kicker:'The arc, continued',h:'Staying with the hard moments',list:['Work directly with shame, defensiveness, accountability, and repair','Navigate highly activated moments without losing the direction of the work','Bring the intensive to a meaningful close, and help the couple understand what comes next']},
 {t:'fourcs',kicker:'Your clinical compass',h:'The 4 Cs',p:['When a session goes somewhere you did not plan, you do not need a rule for every situation. You need to know what to pay attention to.','The 4 Cs are the compass: when you are not sure where to go next, they tell you what matters right now, so uncertainty stops being the thing that keeps you from offering this work.']},
 {t:'content',kicker:'You do not become a different therapist',h:'A bigger container for the skills you already have',p:['You have spent years learning from EFT, Relational Life Therapy, Gottman, IMAGO, PACT, and trauma work.','Intensive work does not replace any of it. It gives those skills more room. The way you already work with couples often fits beautifully inside this structure. You simply have more time to follow it.']},
 {t:'part',part:'Part Three',h:'Intensives In Your Practice'},
 {t:'content',kicker:'Actually offering it',h:'The questions that keep therapists from starting',p:['Knowing how to run an intensive does not help much if you never feel ready to offer one.'],list:['What formats make sense for you and the couples you serve','How to price an intensive in a way that works for you and for them','How to explain the model and respond when a couple inquires','How to schedule intensives alongside your existing caseload']},
 {t:'content',kicker:'More than your sessions',h:'A more intentional practice',p:['Learning to work in longer containers can change more than your clinical work.','It can mean doing deeper work with fewer couples. Fewer clinical hours or fewer clinical days. Increasing revenue without simply adding more appointments to the calendar.'],foot:'There is no single correct way to build a practice. The point is to build one that actually works for you.'},
 {t:'why',kicker:'Why learn this from me',h:'I have been living this question',p:['I am a Licensed Marriage and Family Therapist and a Certified Relational Life Therapist, and I host The Couples Therapist Couch, where I have spent years in conversation with the people who shaped this field.','I see couples in longer formats in my own practice, roughly ten to fifteen clinical hours a week. Intensives are how I found a way to do deeper work and still have a practice I want to keep.']},
 {t:'cta',kicker:'Where to begin',h:'Keep going with me',p:['If you are ready to learn how to offer intensives and build the practice around them, the next step is to keep working on this together.'],ctaline:'Join the Couples Therapist Inner Circle, where we go deeper on the clinical and the practical every month.',foot:'Find everything at couplestherapistcouch.com',disc:'This masterclass is educational. It is not a substitute for your own clinical judgment, licensure, or supervision. No specific clinical outcome, caseload, or financial result is guaranteed. Results vary from therapist to therapist and practice to practice.'}
];
const stage=document.getElementById('stage');let i=0;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
function render(s){
 let h='<div class="slide on">';
 if(s.kicker)h+='<div class="kicker">'+esc(s.kicker)+'</div>';
 if(s.part)h+='<div class="part">'+esc(s.part)+'</div><div class="rule"></div>';
 if(s.h)h+=(s.t==='title'?'<h1>':'<h2>')+esc(s.h)+(s.t==='title'?'</h1>':'</h2>');
 if(s.sub)h+='<div class="sub">'+esc(s.sub)+'</div>';
 if(s.t!=='part')h+='<div class="rule"></div>';
 if(s.big)h+='<div class="big">'+esc(s.big)+'</div>';
 if(s.p)s.p.forEach(x=>h+='<p class="lead">'+esc(x)+'</p>');
 if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+esc(x)+'</li>');h+='</ul>'}
 if(s.ctaline)h+='<div class="cta-line">'+esc(s.ctaline)+'</div>';
 if(s.foot)h+='<div class="foot">'+esc(s.foot)+'</div>';
 if(s.disc)h+='<div class="disc">'+esc(s.disc)+'</div>';
 h+='</div>';return h;
}
function show(){stage.innerHTML=render(S[i]);document.getElementById('count').textContent=(i+1)+' / '+S.length}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));show()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
show();
</script>
</body>
</html>
