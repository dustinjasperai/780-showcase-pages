<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Recalibration — SoulFull Business with Jenna Marie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf8f5;
    --ink:#151616;
    --muted:#5c5560;
    --rule:#d8cfe0;
    --accent:#644071;
    --accent-2:#6f3dad;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ece7f0;color:var(--ink);font-family:'Lato',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:32px 16px 72px}
  .slide{
    background:var(--paper);
    border:1px solid var(--rule);
    border-radius:10px;
    padding:64px 64px 56px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);
  }
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:'Lora',Georgia,serif;font-weight:600;font-size:46px;line-height:1.12;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Lora',Georgia,serif;font-weight:600;font-size:34px;line-height:1.16;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.sub{color:var(--muted);font-size:18px}
  .big{font-family:'Lora',Georgia,serif;font-style:italic;font-size:30px;line-height:1.3;color:var(--accent-2);max-width:60ch}
  ul{margin:10px 0 0 0;padding:0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 20px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li .n{color:var(--accent);font-family:'Lora',serif;font-weight:600;margin-right:10px}
  li .d{display:block;color:var(--muted);font-size:16px;margin-top:3px}
  .phase{font-family:'Lora',serif;font-size:20px;color:var(--accent);font-weight:600;margin-bottom:6px}
  .foot{position:absolute;bottom:22px;left:64px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .page{position:absolute;bottom:22px;right:64px;font-size:12px;color:var(--muted)}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:22px;max-width:60ch}
  .cta-line{font-family:'Lora',serif;font-size:22px;color:var(--accent);margin-top:10px}
  @media(max-width:640px){.slide{padding:40px 28px}h1{font-size:34px}h2{font-size:26px}.foot,.page{left:28px;right:28px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "SoulFull Business with Jenna Marie";
const S = [
  {t:'title',
   eyebrow:'A live masterclass',
   h:'The Recalibration',
   sub:'Why your profitable business is draining you, and the five phases that fix it by design.'},

  {t:'who',
   eyebrow:'Who this is for',
   h:'You built something that works. It is quietly costing you.',
   body:['The numbers are good. Better than ever, maybe.',
         'And still you dread opening the laptop. The business you built to free you is the thing running you.',
         'This hour is for the founder who is successful on paper and exhausted underneath it.']},

  {t:'trap',
   eyebrow:'The trap',
   h:'You have been told to push harder.',
   body:['Another system. Another morning routine. More discipline, more mindset work, more hustle.',
         'None of it touched the real problem, so the drain came back within a month.']},

  {t:'tax',
   eyebrow:'The hidden tax',
   h:'The drain is not free. You are paying it in capacity.',
   body:['Every week spent working against your design is a week of energy you do not get back, and it quietly caps how far the business can actually go.',
         'That is why willpower keeps running out. You are fighting the structure, not your character.']},

  {t:'reframe',
   eyebrow:'The reframe',
   big:'A draining business is a design problem. Not a mindset one.'},

  {t:'problem',
   eyebrow:'Part one',
   h:'The business was built against how you are wired.',
   body:['Most businesses are copied from someone else’s blueprint, a strategy that fit their energy, not yours.',
         'When the structure fights your actual design, every day asks you to work in a way that costs you more than it returns. That is the leak.']},

  {t:'problem2',
   eyebrow:'Part one',
   h:'You can read the leak. It is in your chart.',
   body:['Your Human Design chart is not a horoscope. It is an operations map, how you make clean decisions, where your energy is reliable, and where it is not.',
         'Read the business against the chart and the misaligned commitments show up plainly.']},

  {t:'bridge',
   eyebrow:'Part one',
   h:'Good news: a design problem is fixable.',
   body:['A mindset problem asks you to become a different person. A design problem just asks you to rebuild the structure around the person you already are.',
         'That is a much smaller, much more doable thing. There is a method for it.']},

  {t:'framework',
   eyebrow:'Part two',
   h:'The Business Recalibration Method',
   sub:'Five phases that diagnose the drain and rebuild the business around you.'},

  {t:'phase', eyebrow:'Phase one', phase:'Authority Restoration',
   h:'Decide from your own design.',
   body:['We get you making the real decisions from your own authority again, instead of the borrowed shoulds that put you here.']},

  {t:'phase', eyebrow:'Phase two', phase:'Business Diagnosis',
   h:'Find exactly where it leaks.',
   body:['We read the existing business against your chart and locate the specific commitments, offers and roles that are draining you.']},

  {t:'phase', eyebrow:'Phase three', phase:'Capacity-Based Redesign',
   h:'Rebuild around your real capacity.',
   body:['We redesign the offers, the delivery and the week around the energy you actually have, so the business stops taking more than it gives back.']},

  {t:'phase', eyebrow:'Phase four', phase:'Financial Foundations',
   h:'Hold the income without the hours.',
   body:['We restructure pricing and revenue so the money holds steady without you working more to protect it.']},

  {t:'phase', eyebrow:'Phase five', phase:'Intentional Expansion',
   h:'Grow only along your lines.',
   body:['We expand the business along the directions that fit your design, instead of chasing every generic growth tactic that put you back in the drain.']},

  {t:'picture',
   eyebrow:'Part three',
   h:'What recalibrated feels like.',
   body:['The business still grows. You stop paying for it with your health and your evenings.',
         'The work that is yours to do feels like yours again. The rest is restructured, delegated, or gone.']},

  {t:'shift',
   eyebrow:'Part three',
   h:'This is not a few less hours. It is a different relationship.',
   body:['Recalibrated owners do not just win back time. They stop bracing against their own business.',
         'The work stops feeling like a negotiation with yourself, because the structure finally agrees with how you are built.']},

  {t:'whyme',
   eyebrow:'Why me',
   h:'I rebuilt my own business this way first.',
   body:['Twenty years ago I was a celebrity makeup artist. I built a business that looked successful and left me empty.',
         'I rebuilt it around my design, and then I built the Recalibration Method so other founders could do the same on purpose instead of by accident.']},

  {t:'cta',
   eyebrow:'Your next step',
   h:'Recalibrate your business, by design.',
   body:['If this is the work, the next step is a conversation about your design and your business.'],
   ctaLine:'Start with the free Recalibration, or book your Business Reset.',
   disclaimer:'This masterclass is educational. No specific income or result is guaranteed. Results vary with the person, the business, and the work they put in.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.phase) html += `<div class="phase">${s.phase}</div>`;
  if(s.t==='title'){ html += `<h1>${s.h}</h1>`; if(s.sub) html += `<p class="sub">${s.sub}</p>`; }
  else if(s.big){ html += `<p class="big">${s.big}</p>`; }
  else { if(s.h) html += `<h2>${s.h}</h2>`; if(s.sub) html += `<p class="sub">${s.sub}</p>`; }
  if(s.body) s.body.forEach(b=> html += `<p>${b}</p>`);
  if(s.ctaLine) html += `<div class="cta-line">${s.ctaLine}</div>`;
  if(s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  html += `<div class="foot">${BRAND}</div><div class="page">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
