<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>After the Checklist - A Live Masterclass for Senior Military and SOF Leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafafb;        /* brand near-white header ground */
    --panel:#e7ebf0;     /* brand pale blue-gray */
    --rule:#6f7787;      /* brand slate */
    --ink:#0f233f;       /* brand deep navy (dominant) */
    --accent:#3f4f1f;    /* brand military olive */
    --muted:#595959;     /* brand gray */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Libre Baskerville",Georgia,serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 9vw;border-bottom:1px solid var(--rule)}
  .slide:last-child{border-bottom:none}
  .eyebrow{font-family:"Libre Baskerville",serif;font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:"Playfair Display",serif;font-weight:700;font-size:clamp(2.1rem,5.2vw,4rem);line-height:1.06;letter-spacing:-.01em}
  h2{font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(1.7rem,3.8vw,2.9rem);line-height:1.12}
  .lead{font-size:clamp(1.05rem,1.7vw,1.35rem);max-width:40ch;margin-top:1.5rem;color:var(--muted)}
  .body{font-size:clamp(1rem,1.5vw,1.2rem);max-width:46ch;margin-top:1.3rem}
  .num{font-family:"Playfair Display",serif;font-size:1rem;color:var(--accent);letter-spacing:.2em;margin-bottom:1.1rem}
  .rule{width:64px;height:2px;background:var(--accent);margin:2rem 0}
  ul{list-style:none;margin-top:1.6rem;max-width:48ch}
  li{position:relative;padding-left:1.6rem;margin-bottom:1rem;font-size:clamp(1rem,1.5vw,1.2rem)}
  li:before{content:"";position:absolute;left:0;top:.6em;width:8px;height:8px;background:var(--accent)}
  .pillar{border-left:3px solid var(--accent);padding-left:1.4rem;margin-top:1.4rem;max-width:50ch}
  .pillar h3{font-family:"Playfair Display",serif;font-weight:600;font-size:clamp(1.2rem,2vw,1.6rem);margin-bottom:.4rem}
  .pillar p{color:var(--muted);font-size:1.02rem}
  .dark{background:var(--ink);color:var(--bg)}
  .dark .eyebrow{color:#c9cf9b}
  .dark .lead,.dark .body{color:#c7cdd8}
  .cta-steps{margin-top:1.8rem;max-width:46ch}
  .disc{margin-top:2.6rem;font-size:.82rem;color:var(--rule);max-width:52ch;font-style:italic}
  .kicker{font-family:"Playfair Display",serif;font-size:1.15rem;color:var(--accent);margin-bottom:.8rem}
  .brandline{margin-top:2.4rem;font-size:.8rem;letter-spacing:.18em;text-transform:uppercase;color:var(--rule)}
  #deck{counter-reset:s}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:'A Live Masterclass for Senior Military & SOF Leaders',
   h:'After the Checklist', lead:'The executive transition that starts where the checklist ends.'},

  {t:'content', eyebrow:'Who this is for',
   h:'You led for twenty, thirty years. Now the clock is running.',
   body:'For senior military leaders and Special Operations professionals inside a year of retirement, who know they are qualified for more than the first job that comes along.'},

  {t:'content', eyebrow:'The trap',
   h:'You did TAP. The resume is polished. You still feel behind.',
   body:'Because the checklist was never the hard part. Separation paperwork does not tell a civilian company what a command record is worth, and it does not tell you who you are without the rank.'},

  {t:'dark', eyebrow:'The real risk',
   h:'The danger is not unemployment. It is getting down-leveled.',
   lead:'Taking a role two levels beneath your experience because no one translated what you actually did, and because the offer came while you were still deciding what you wanted.'},

  {t:'content', eyebrow:'The reframe',
   h:'Transition is a strategy problem, not a paperwork problem.',
   body:'The checklist treats it like paperwork. Senior leaders who win the transition treat it like the planning cycle it is: assess, translate, position, decide. That is the work this session walks you through.'},

  {t:'section', num:'PART ONE', h:'The gap no program closes'},

  {t:'content', eyebrow:'Part One',
   h:'Civilian hiring managers cannot read a command record.',
   body:'They see rank and acronyms, not the budget you owned, the people you led, or the outcomes you were accountable for. Left untranslated, a career of executive-level leadership reads like a mystery on a page.'},

  {t:'content', eyebrow:'Part One',
   h:'The more senior your record, the harder this gets.',
   body:'A thirty-year command career does not compress neatly into a civilian job description. The leaders with the most to offer are the ones a generic transition track underserves the most.'},

  {t:'content', eyebrow:'Part One',
   h:'And the identity shift is happening at the same time.',
   body:'Who are you when the uniform comes off? How do you keep your family steady through the move? Most transition programs skip this entirely. It is the part un-TAP’ed was written to address, the moments after the checklist ends.'},

  {t:'section', num:'PART TWO', h:'The method: Employment Strategies for Executive Leaders'},

  {t:'content', eyebrow:'Part Two',
   h:'ESEL is built for senior leaders, not for first-term separations.',
   body:'Four moves turn a command career into a civilian executive one. You already have the experience. This is how you make it legible, and how you choose what it is for.'},

  {t:'pillars', eyebrow:'Part Two', h:'The four moves',
   pillars:[
     {h:'1. Translate', p:'Turn command, budget and accountability into the language a civilian executive search actually recognizes.'},
     {h:'2. Network at the executive level', p:'Informational interviews with decision makers, not applications into job boards. Senior roles are filled through conversations.'},
     {h:'3. Decide what next is for', p:'Faith, family and identity first, from un-TAP’ed. The right role is the one that fits the life you are building, not just the one that calls back.'},
     {h:'4. Interview for the role you earned', p:'Walk in as the leader you were, so you are considered for the seat that matches your record, not down-leveled out of it.'}
   ]},

  {t:'content', eyebrow:'Part Two',
   h:'You do not do this alone.',
   body:'Honor Forward connects you with senior leaders and veterans who have already walked the path into civilian executive life. The transition is a known road when you are walking it with people who have been down it.'},

  {t:'section', num:'PART THREE', h:'Six months after the uniform comes off'},

  {t:'content', eyebrow:'Part Three',
   h:'A clear story, the right rooms, an offer that fits.',
   body:'Your experience reads like executive value on the page. You are in conversations with leaders who can hire you. And the decision about what is next is yours to make on purpose, not one made for you by whoever called first.'},

  {t:'content', eyebrow:'The format',
   h:'We teach this live, so we can talk about you.',
   body:'This is a live session, not a recording. You can ask about your own timeline, your family, the move you are actually facing. That is why it is worth an hour of your week.'},

  {t:'content', eyebrow:'Why Cyndi & Michele',
   h:'This work is personal, because we are in your community.',
   body:'We grew up in the military family, married into it, and have coached more than 5,000 service members through transition as career coaches and transition specialists. 374 is named for Psalm 37:4. We lead with heart, service, and strategy, in that order.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Let us build your transition on purpose.',
   steps:['Book a 45-minute strategy session with 374 Consultants.','We map your translate, network and decide plan together.','You leave with the next move clear, and a community behind it.'],
   disc:'Educational content only. Outcomes depend on each individual’s circumstances, effort, and the civilian market; no specific job, title, income, or result is promised or guaranteed.',
   brand:'374 Consultants · ESEL Seminars · Honor Forward'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const sec = document.createElement('section');
  sec.className = 'slide' + (s.t==='dark'?' dark':'');
  let html = '';
  if (s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.num) html += `<div class="num">${s.num}</div>`;
  if (s.t==='title'){ html += `<h1>${s.h}</h1>`; if(s.lead) html += `<p class="lead">${s.lead}</p>`; html += `<div class="brandline">374 Consultants · Tactical Transition</div>`; }
  else if (s.t==='section'){ html += `<h2>${s.h}</h2><div class="rule"></div>`; }
  else if (s.t==='dark'){ html += `<h2>${s.h}</h2>`; if(s.lead) html += `<p class="lead">${s.lead}</p>`; }
  else if (s.t==='pillars'){ html += `<h2>${s.h}</h2>`; for(const p of s.pillars){ html += `<div class="pillar"><h3>${p.h}</h3><p>${p.p}</p></div>`; } }
  else if (s.t==='cta'){ html += `<h2>${s.h}</h2><div class="cta-steps"><ul>`; for(const st of s.steps){ html += `<li>${st}</li>`; } html += `</ul></div>`; if(s.brand) html += `<div class="brandline">${s.brand}</div>`; if(s.disc) html += `<p class="disc">${s.disc}</p>`; }
  else { html += `<h2>${s.h}</h2>`; if(s.body) html += `<p class="body">${s.body}</p>`; }
  sec.innerHTML = html;
  deck.appendChild(sec);
}
</script>
</body>
</html>
