<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Systemic Safeguarding Model — Andrew Hall</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fefffa;        /* his warm off-white page ground (brand.json, 10 uses) */
    --panel:#ffffff;
    --rule:#e4ddd2;      /* desaturated step off the warm ground */
    --ink:#161e2a;       /* his h1 navy (brand.json) */
    --ink2:#2f2f2f;      /* his header/footer dark */
    --muted:#6b6457;
    --accent:#c47324;    /* his dominant burnt-amber button/link (brand.json, 22 uses) */
    --accent-soft:#f6ead9;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink2);color:var(--ink);font-family:'Lato',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 18px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 10px 30px rgba(22,30,42,.08)}
  .kick{font-family:'Raleway',sans-serif;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Raleway',sans-serif;font-weight:800;font-size:46px;line-height:1.06;
    color:var(--ink);letter-spacing:-.01em}
  h2{font-family:'Raleway',sans-serif;font-weight:700;font-size:32px;line-height:1.12;
    color:var(--ink);letter-spacing:-.01em}
  p{font-size:19px;line-height:1.6;color:var(--ink2);margin-top:18px;max-width:60ch}
  .lede{font-size:22px;color:var(--ink);font-weight:400}
  .sub{font-size:20px;color:var(--muted);margin-top:14px}
  ul{margin:22px 0 0 2px;list-style:none;max-width:62ch}
  li{position:relative;padding:12px 0 12px 34px;font-size:18.5px;line-height:1.5;
    color:var(--ink2);border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:4px;top:19px;width:10px;height:10px;
    background:var(--accent);border-radius:2px}
  .pillar{display:flex;gap:16px;align-items:flex-start;padding:14px 0;border-bottom:1px solid var(--rule)}
  .pillar:last-child{border-bottom:none}
  .pnum{font-family:'Raleway',sans-serif;font-weight:800;font-size:22px;color:var(--accent);
    min-width:38px;line-height:1.3}
  .pbody b{font-family:'Raleway',sans-serif;color:var(--ink);font-size:19px}
  .pbody span{display:block;font-size:16.5px;color:var(--muted);margin-top:3px;line-height:1.5}
  .big{font-size:30px;line-height:1.28;color:var(--ink);font-weight:400;max-width:24ch}
  .big b{color:var(--accent);font-weight:700}
  .foot{margin-top:30px;font-size:14px;color:var(--muted);letter-spacing:.02em}
  .card{background:var(--accent-soft);border:1px solid #ecd9bf;border-radius:10px;
    padding:22px 26px;margin-top:22px}
  .card p{margin-top:0;color:var(--ink2)}
  .disc{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:66ch}
  .cta h1{font-size:40px}
  .n{font-family:'Raleway',sans-serif;color:var(--accent);font-weight:800}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kick:'A live masterclass for school safeguarding leads',
   h:'Safeguarding That Does Not Rest on One Person',
   sub:'The systemic model: building a whole-school culture where every adult safeguards, confidently and consistently.',
   foot:'Presented by Andrew Hall, former headteacher and specialist safeguarding consultant'},

  {t:'lede',kick:'Who this is for',
   big:'If you are a DSL, a deputy, or a head who feels safeguarding quietly lands on <b>your</b> desk alone, this hour is for you.',
   p:'We will look at why strong schools stop depending on one person, and how the safeguarding culture is built on purpose rather than by accident.'},

  {t:'bullets',kick:'The trap',h:'Most schools run safeguarding as a job, not a system',
   items:['The DSL logs, chases, and firefights, often alone.',
     'Staff pass concerns up and assume they are handled.',
     'Training is a once-a-year slide deck everyone forgets by October.',
     'KCSIE is met on paper while gaps open quietly in practice.']},

  {t:'reframe',kick:'The reframe',
   big:'A safe school is not one with a brilliant DSL. It is one where <b>every adult</b> knows what to notice, what to do, and that they will be backed.',
   p:'That is a culture question before it is a compliance question. And culture can be designed.'},

  {t:'bullets',kick:'Part one: the real problem',h:'Compliance is not the same as culture',
   items:['Compliance asks: can we prove we did the required thing?',
     'Culture asks: would a quiet child actually be noticed here on a Tuesday?',
     'You can pass an audit and still miss the child in front of you.',
     'The gap between the policy folder and the corridor is where harm hides.']},

  {t:'bullets',kick:'Part one, deeper',h:'The DSL role has quietly doubled',
   items:['Online harm, sextortion, and AI-generated images did not exist in the old job.',
     'Mental health, exploitation, and county lines all now land on the same desk.',
     'Reporting, recording, and audit expectations have grown every single year.',
     'One person cannot hold all of that. A system can.']},

  {t:'section',kick:'Part two',h:'The systemic safeguarding model',
   sub:'Safeguarding as a whole-school system: five parts that hold each other up, so it never rests on one person remembering.'},

  {t:'pillars',kick:'The model',h:'Five parts of a systemic school',
   pillars:[
     ['01','Structures','The roles, routes and records that hold safeguarding up, so the right thing happens even on the DSL’s day off.'],
     ['02','Culture','The shared belief that safeguarding is everyone’s job, modelled from the top and felt on the corridor.'],
     ['03','Consistent messaging','Every adult, staff, governor and volunteer, trained on the same thing, so there are no gaps between people.'],
     ['04','Beyond child protection','Early help, wellbeing, and the wider shape of harm: peer-on-peer, online, county lines, exploitation.'],
     ['05','Confident response','What actually happens when a concern is raised: consistent, timely, and backed by leadership.']]},

  {t:'bullets',kick:'Part two, deeper',h:'Why structures come first',
   items:['When the route is clear, a worried teaching assistant acts in the moment, not next week.',
     'Records that are simple get used. Records that are a maze get skipped.',
     'Good structures make the right action the easy action.',
     'This is how you stop a single absence or oversight becoming a safeguarding failure.']},

  {t:'bullets',kick:'Part two, deeper',h:'Why consistent messaging matters most',
   items:['Children test the edges. A gap between two adults is the gap they find.',
     'One trained DSL and three hundred untrained adults is not a safe school.',
     'The same training, delivered to everyone, closes the gaps between people.',
     'Safeguarding is only ever as strong as its least confident adult.']},

  {t:'bullets',kick:'Part two, deeper',h:'Culture is built, not announced',
   items:['You cannot assembly-email a culture into existence.',
     'It is modelled by leaders, rehearsed in training, and protected when it is inconvenient.',
     'Adults copy what they see leadership actually do with a concern.',
     'Build the behaviour you want to be normal on your hardest day.']},

  {t:'bullets',kick:'Part two, deeper',h:'A response people trust',
   items:['Adults only raise concerns in a place where raising them feels safe and worthwhile.',
     'A slow or silent response teaches staff to stop bothering.',
     'Consistent, timely, visible action is what keeps the pipeline of concerns open.',
     'Trust in the response is what makes the whole system run.']},

  {t:'reframe',kick:'Beyond child protection',
   big:'Safeguarding is <b>more than</b> child protection. It is wellbeing, early help, and the harms that never reach a case file.',
   p:'The systemic school sees the whole child, not only the crisis, and acts earlier because it is built to.'},

  {t:'section',kick:'Part three',h:'When the system is doing the work',
   sub:'Not a quieter DSL inbox. A school where safeguarding is simply how the place runs.'},

  {t:'bullets',kick:'The shift',h:'From firefighting to a culture you can feel',
   items:['Concerns surface earlier, because adults trust the route and trust the response.',
     'New staff absorb the culture in weeks, because it is modelled, not just mentioned.',
     'Governors ask sharper questions, because they were trained on the same model.',
     'The DSL leads the system instead of carrying it.']},

  {t:'card',kick:'Why Andrew',h:'Built from the chair, not the textbook',
   card:'Andrew Hall is a former teacher and headteacher and now a specialist safeguarding consultant. The systemic model comes from years of sitting in the DSL seat and the head’s office, and from reading the serious case reviews where good people, without a system, still missed a child.',
   foot:'Advanced Safeguarding for DSLs · Whole School Safeguarding · Safeguarding for Governors and Trustees'},

  {t:'bullets',kick:'What you take away',h:'Leave with the system, not just notes',
   items:['A clear picture of the five parts and where your school is strong or thin.',
     'The language to make safeguarding everyone’s job without lecturing anyone.',
     'A way to train the whole community on one consistent message.',
     'A model that holds up on your busiest, hardest week.']},

  {t:'cta',kick:'Next step',h:'Bring the systemic model to your school',
   p:'The full Advanced Safeguarding for DSLs course works through the model in depth, with downloadable resources, real case studies, and the current KCSIE picture. You can take it as a live course or on demand, or bring it in-house for your whole team.',
   foot:'Explore the course and dates at safeguardinginschools.co.uk',
   disc:'This masterclass is professional development for school staff. It supports, and does not replace, your school’s statutory duties, local safeguarding partnership guidance, or the current version of Keeping Children Safe in Education. No specific result or outcome is guaranteed. Results vary by school, leadership, and implementation.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=el('div','slide'+(s.t==='cta'?' cta':''));
  if(s.kick)d.appendChild(el('div','kick',s.kick));
  if(s.t==='title'||s.t==='cta'||s.t==='section'||s.t==='bullets'||s.t==='card'){
    if(s.h)d.appendChild(el(s.t==='bullets'||s.t==='card'||s.t==='section'?'h2':'h1',null,s.h));
  }
  if(s.sub)d.appendChild(el('div','sub',s.sub));
  if(s.big)d.appendChild(el('div','big',s.big));
  if(s.p)d.appendChild(el('p',null,s.p));
  if(s.items){const ul=el('ul');s.items.forEach(i=>ul.appendChild(el('li',null,i)));d.appendChild(ul);}
  if(s.pillars){s.pillars.forEach(p=>{const row=el('div','pillar');
    row.appendChild(el('div','pnum',p[0]));
    const b=el('div','pbody');b.appendChild(el('b',null,p[1]));b.appendChild(el('span',null,p[2]));
    row.appendChild(b);d.appendChild(row);});}
  if(s.card){const c=el('div','card');c.appendChild(el('p',null,s.card));d.appendChild(c);}
  if(s.foot)d.appendChild(el('div','foot',s.foot));
  if(s.disc)d.appendChild(el('div','disc',s.disc));
  deck.appendChild(d);
});
</script>
</body>
</html>
