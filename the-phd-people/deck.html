<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The PhD Momentum Method — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f1ea;        /* warm academic paper (site is light-scheme) */
    --panel:#ffffff;     /* site panel white */
    --ink:#1b2a27;       /* deep teal-black, pulled toward brand teal */
    --muted:#55615d;     /* muted ink */
    --rule:#dcd6c8;      /* paper rule */
    --accent:#00a889;    /* brand teal, 45 uses in brand.json */
    --accent-deep:#0b6b58;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:18px}
  h1{font-family:"Spectral",Georgia,serif;font-weight:700;font-size:48px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:"Spectral",Georgia,serif;font-weight:600;font-size:34px;line-height:1.14;margin-bottom:18px}
  .lede{font-family:"Spectral",Georgia,serif;font-size:22px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  p{font-size:18px;line-height:1.62;color:var(--ink);max-width:56ch}
  p+p{margin-top:14px}
  .big{font-family:"Spectral",Georgia,serif;font-size:30px;line-height:1.3;color:var(--ink);max-width:30ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;line-height:1.5;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:58ch}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:4px;top:20px;width:9px;height:9px;border-radius:2px;background:var(--accent);transform:rotate(45deg)}
  .stage{display:flex;gap:18px;align-items:baseline;padding:14px 0;border-bottom:1px solid var(--rule)}
  .stage:last-child{border-bottom:0}
  .stage .n{font-family:"Spectral",Georgia,serif;font-size:26px;color:var(--accent-deep);font-weight:700;min-width:36px}
  .stage .b{font-weight:600;font-size:19px}
  .stage .d{color:var(--muted);font-size:16px;line-height:1.45}
  .stat{font-family:"Spectral",Georgia,serif;font-size:40px;color:var(--accent-deep);font-weight:700}
  .row{display:flex;gap:40px;flex-wrap:wrap;margin-top:18px}
  .row .cell{flex:1;min-width:180px}
  .foot{position:absolute;bottom:22px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .disclaimer{margin-top:22px;font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch}
  .brandmark{font-weight:600;color:var(--accent-deep)}
  .cta-steps li:before{background:var(--accent-deep)}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:380px}h1{font-size:34px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Masterclass deck — Dr Max Lemprière, The PhD People. All copy lives in const S. */
const S = [
  {t:'title',
    kicker:'A free masterclass for PhD students',
    h1:'How to Finish Your PhD Without Doing It Alone',
    lede:'The PhD Momentum Method: the four shifts that turn a stalled thesis into steady, finishable progress.'},

  {t:'who',
    kicker:'Who this is for',
    h2:'If your thesis has gone quiet, this is for you',
    body:[
      'You are months (or years) into a PhD and the words have slowed to a trickle.',
      'You open the document, stare at it, and close it again.',
      'Your supervisor is busy, feedback is slow, and nobody has actually told you what "good enough" looks like.',
      'You are not lazy and you are not out of your depth. You are doing the hardest writing of your life in near-total isolation.']},

  {t:'hook',
    kicker:'The reframe',
    big:'Your thesis is not stalling because you are not clever enough. It is stalling because you are doing it alone.',
    note:'Isolation is the hidden productivity killer of doctoral work. Fix that, and the writing starts moving again.'},

  {t:'section', kicker:'Part one', h2:'Why good researchers get stuck'},

  {t:'content',
    kicker:'The real problem',
    h2:'Deep, difficult work in complete isolation is paralysing',
    body:[
      'A PhD is unusual. For years you work on one enormous project, mostly alone, with feedback arriving in rare and nerve-wracking bursts.',
      'So the normal signals that tell you "you are on track" disappear. Without them, doubt fills the gap, and doubt is where momentum goes to die.']},

  {t:'content',
    kicker:'The real problem',
    h2:'Three gaps that quietly stall a thesis',
    list:[
      ['The connection gap','No peers in the trenches with you, so every wobble feels like proof you alone are failing.'],
      ['The clarity gap','Nobody has shown you what a finished chapter actually looks like, so you guess, then second-guess.'],
      ['The rhythm gap','No external structure, so writing only happens in frantic, unsustainable bursts that burn you out.']]},

  {t:'content',
    kicker:'The real problem',
    h2:'Willpower is not the fix',
    body:[
      'Most PhD advice tells you to try harder: more discipline, better time management, one more productivity app.',
      'But you have plenty of discipline. You got this far. The missing piece was never effort. It was a structure and a room full of people doing the work alongside you.']},

  {t:'section', kicker:'Part two', h2:'The PhD Momentum Method'},

  {t:'framework',
    kicker:'The method',
    h2:'Four shifts, in order',
    stages:[
      ['1','Unblock','Start writing again inside a supported space, so you are no longer doing this alone.'],
      ['2','Structure','Get clarity on what your chapters should look like, replacing guesswork with a map.'],
      ['3','Ownership','Grow confidence in your own judgement and start managing the thesis proactively.'],
      ['4','Momentum','Build a calm, sustainable rhythm that keeps you moving without burning out.']]},

  {t:'content',
    kicker:'Shift one of four',
    h2:'Unblock',
    body:[
      'You do not think your way out of a block. You write your way out, in company.',
      'The fastest unblock is a scheduled hour where you sit down with other PhD students and all write at once. The task stops being "finish my thesis" and becomes "write for the next sixty minutes." That is a task a human can actually start.']},

  {t:'content',
    kicker:'Shift two of four',
    h2:'Structure',
    body:[
      'Once the words are flowing, the next enemy is the blank architecture: what goes in an introduction, a methodology, a discussion?',
      'Structure replaces guesswork with a map. When you can see the shape of a finished chapter before you write it, you stop rewriting the same paragraph for a week and start filling in a plan.']},

  {t:'content',
    kicker:'Shift three of four',
    h2:'Ownership',
    body:[
      'Early on, the thesis happens to you. You wait for your supervisor to tell you what to do next.',
      'Ownership is the shift where you start driving. You decide the next milestone, you judge whether a section is good enough, and you bring questions to your supervisor instead of waiting for permission. Confidence is a side effect of being in charge.']},

  {t:'content',
    kicker:'Shift four of four',
    h2:'Momentum',
    body:[
      'The goal is not a heroic all-nighter. It is a rhythm you can keep for the eighteen months it actually takes to finish.',
      'Momentum is small, regular, protected blocks of writing that compound. A calm, repeatable week beats a frantic one every single time, and it is the only pace that gets a thesis over the line without breaking you.']},

  {t:'section', kicker:'Part three', h2:'Inside a writing week that actually moves'},

  {t:'content',
    kicker:'The engine',
    h2:'The co-writing session',
    body:[
      'The method runs on one simple format: four sixty-minute blocks of focused, silent work, with short breaks between them and a check-in at the start and end.',
      'You bring whatever your thesis needs that day: planning, structuring, analysing, writing. You work alongside twenty or thirty other PhD students who get it. In four hours you move further than you usually do in a week.']},

  {t:'content',
    kicker:'The room',
    h2:'You stop doing it alone',
    body:[
      'The reason this works is not magic. It is that progress becomes predictable the moment you are no longer the only person in the room.',
      'A live community of PhD students, writing together every week, turns the loneliest degree in the world into something you show up to with other people.']},

  {t:'credibility',
    kicker:'Who is teaching this',
    h2:'Dr Max Lemprière',
    body:[
      'I started The PhD People after my own doctorate, where the isolation nearly stopped me finishing. I have since supervised and coached more than a hundred PhD students.',
      'What I teach is not theory. It is the exact structure that got me, and thousands of students across more than forty countries, unstuck and moving again.']},

  {t:'stat',
    kicker:'What students see',
    h2:'Structure, not willpower, moves the needle',
    cells:[
      ['17,500','Average words written by a student across one weekend writing intensive.'],
      ['40+','Countries represented in the community, all writing together.'],
      ['4 hours','Of co-writing that routinely beats a solo week of stop-start effort.']],
    note:'These describe what structured writing time tends to produce. Every thesis and every student is different.'},

  {t:'recap',
    kicker:'The method in one line',
    big:'Unblock, then Structure, then Ownership, then Momentum. Done in a room full of people instead of alone.',
    note:'That is the whole shift from a stalled thesis to a finishable one.'},

  {t:'cta',
    kicker:'Your next step',
    h2:'Come and write with us',
    body:[
      'The simplest way to feel the difference is to join one session and write alongside other PhD students.'],
    steps:[
      'Start free: book a seat at the next half-day writing retreat and feel a co-writing block for yourself.',
      'Go further: join the PhD Common Room for ten co-writing sessions a week, skills workshops, and a community that keeps you moving.'],
    disclaimer:'This masterclass is educational. No academic, completion, or examination outcome is guaranteed, and results vary from student to student. The PhD Common Room is a support community and does not replace your university supervision.'}
];

const deck = document.getElementById('deck');
const esc = s => String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function paras(arr){return arr.map(t=>`<p>${esc(t)}</p>`).join('')}
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.h1) h+=`<h1>${esc(s.h1)}</h1>`;
  if(s.h2) h+=`<h2>${esc(s.h2)}</h2>`;
  if(s.lede) h+=`<div class="lede">${esc(s.lede)}</div>`;
  if(s.big) h+=`<div class="big">${esc(s.big)}</div>`;
  if(s.body) h+=paras(s.body);
  if(s.list) h+='<ul>'+s.list.map(x=>`<li><strong>${esc(x[0])}.</strong> ${esc(x[1])}</li>`).join('')+'</ul>';
  if(s.stages) h+='<div>'+s.stages.map(x=>`<div class="stage"><div class="n">${esc(x[0])}</div><div><div class="b">${esc(x[1])}</div><div class="d">${esc(x[2])}</div></div></div>`).join('')+'</div>';
  if(s.cells) h+='<div class="row">'+s.cells.map(x=>`<div class="cell"><div class="stat">${esc(x[0])}</div><p>${esc(x[1])}</p></div>`).join('')+'</div>';
  if(s.steps) h+='<ul class="cta-steps">'+s.steps.map(x=>`<li>${esc(x)}</li>`).join('')+'</ul>';
  if(s.note) h+=`<p class="lede" style="font-size:18px">${esc(s.note)}</p>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  h+=`<div class="foot"><span class="brandmark">The PhD People</span><span>${i+1} / ${S.length}</span></div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
