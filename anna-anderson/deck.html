<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI-Powered Project Leader, Women in PM Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fcfaf6;
    --panel:#ffffff;
    --rule:#e4ded6;
    --accent:#002351;
    --ink:#15110d;
    --muted:#5b5853;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  #stage{
    width:min(960px,94vw);
    aspect-ratio:16/10;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    position:relative;
    overflow:hidden;
    box-shadow:0 18px 60px rgba(0,35,81,.08);
  }
  /* blueprint-grid motif: thin navy build-plan lattice */
  #stage::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background-image:
      linear-gradient(var(--rule) 1px,transparent 1px),
      linear-gradient(90deg,var(--rule) 1px,transparent 1px);
    background-size:48px 48px;
    opacity:.35;
    -webkit-mask-image:linear-gradient(135deg,rgba(0,0,0,.9),transparent 70%);
    mask-image:linear-gradient(135deg,rgba(0,0,0,.9),transparent 70%);
  }
  .slide{
    position:absolute;inset:0;
    padding:62px 68px;
    display:none;
    flex-direction:column;
    justify-content:center;
    gap:18px;
  }
  .slide.on{display:flex}
  .kicker{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);
  }
  .accentbar{width:52px;height:4px;background:var(--accent);border-radius:3px}
  h1{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:800;color:var(--accent);
    font-size:46px;line-height:1.06;letter-spacing:-.02em;
  }
  h2{
    font-family:'Plus Jakarta Sans',sans-serif;
    font-weight:700;color:var(--accent);
    font-size:32px;line-height:1.12;letter-spacing:-.01em;
  }
  p.lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch}
  p.sub{font-size:17px;line-height:1.55;color:var(--muted);max-width:52ch}
  ul{list-style:none;display:flex;flex-direction:column;gap:13px;margin-top:4px}
  li{position:relative;padding-left:30px;font-size:18px;line-height:1.4;max-width:50ch}
  li::before{
    content:"";position:absolute;left:0;top:9px;width:10px;height:10px;
    border:2px solid var(--accent);border-radius:2px;
  }
  .grid4{display:grid;grid-template-columns:repeat(2,1fr);gap:16px;margin-top:6px}
  .cell{border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:16px 18px;background:var(--bg)}
  .cell .n{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.04em;text-transform:uppercase}
  .cell .d{font-size:15px;color:var(--muted);line-height:1.45;margin-top:5px}
  .big{font-size:60px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:800;color:var(--accent);line-height:1}
  .foot{font-size:13px;color:var(--muted);line-height:1.5;max-width:60ch;margin-top:10px}
  .cta-row{display:inline-flex;align-items:center;gap:12px;margin-top:8px}
  .pill{font-family:'Plus Jakarta Sans',sans-serif;font-weight:700;font-size:18px;color:var(--panel);background:var(--accent);padding:14px 26px;border-radius:999px}
  #nav{position:fixed;bottom:16px;right:20px;font-size:13px;color:var(--muted);font-family:'Plus Jakarta Sans',sans-serif}
  #brandfoot{position:fixed;bottom:16px;left:20px;font-size:12px;color:var(--muted);letter-spacing:.04em}
</style>
</head>
<body>
<div id="stage"></div>
<div id="nav"></div>
<div id="brandfoot">Women in PM Network &middot; Anna L. Anderson, PMP</div>
<script>
const S=[
  {t:'title', k:'A live masterclass with Anna L. Anderson', h:'The AI-Powered Project Leader', s:'How to run real delivery work with AI and become the project manager no team wants to lose.'},
  {t:'audience', k:'Who this is for', h:'You lead the work. You are not sure the title keeps up.', items:['Career-changers breaking into project management','Working PMs who want the next role, not just the next task','Certified PMs (PMP, CAPM, Scrum) who feel the job shifting under them']},
  {t:'trap', k:'The trap', h:'You think the certificate is the finish line.', s:'So you study the framework, pass the exam, and still sit in interviews being asked to prove you can actually deliver. The credential opens the door. It does not run the project.'},
  {t:'reframe', k:'The hard reframe', h:'The profession is changing faster than the curriculum.', s:'AI is already rewriting how projects get planned, reported, de-risked and communicated. The PMs getting hired and promoted are not the ones who memorized the most. They are the ones who can deliver with these tools in hand.'},
  {t:'part', k:'Part one', h:'The relevance gap', s:'Fundamentals still matter. But knowing the theory and proving you can run the work are two different things, and the gap between them is where careers stall.'},
  {t:'problem', k:'Why it stalls', h:'Three things nobody teaches you', items:['How to use AI inside real delivery without losing judgment or governance','How to show delivery evidence, not just a certificate, when it counts','How to position the work you have done so the right people see it']},
  {t:'part', k:'Part two', h:'The Blueprint', s:'This is the method I teach inside the AI-Powered Project Leadership Blueprint. Four pillars, built to be done, not just studied.'},
  {t:'pillars', k:'The four pillars', h:'Learn. Apply. Connect. Lead.', cells:[['Learn','The fundamentals that still decide whether a project lands: scope, risk, stakeholders, delivery.'],['Apply','Run a real project end to end in a live simulation, so you have proof you can do the work.'],['Connect','Position that proof. Resume, LinkedIn and interview language that reads like a delivery leader.'],['Lead','Carry judgment and governance into every room, so AI makes you faster without making you replaceable.']]},
  {t:'lifecycle', k:'AI across the lifecycle', h:'Where AI actually earns its place', items:['Planning and work breakdown you can defend','Status reports and executive updates drafted in minutes','RAID and risk analysis that surfaces what you missed','Meeting synthesis and stakeholder comms that stay human']},
  {t:'guard', k:'The line that matters', h:'Judgment stays in the chair.', s:'AI drafts. You decide. The PMs who win keep governance, context and accountability at the center and let the tool do the heavy lifting underneath. That balance is the whole skill.'},
  {t:'part', k:'Part three', h:'The PM you become', s:'Not theory. A working picture of how the job changes once you run it this way.'},
  {t:'picture', k:'The difference', h:'From studying the job to running it', items:['You walk into reviews and interviews with delivery evidence, not just a cert number','You do in an hour what used to take a day, and the quality goes up','You stop waiting to feel ready and start being chosen for the role']},
  {t:'sim', k:'The simulation', h:'You learn it by doing it', s:'The heart of the Blueprint is a live simulation project. You plan it, run it, report on it and close it, with AI in the workflow and me in the room. You leave with a portfolio piece, not a promise.'},
  {t:'why', k:'Why me', h:'I am still a practitioner and a teacher.', items:['PMP certified and a PMI Authorized Training Partner','LinkedIn Learning instructor on project delivery and AI','16+ years leading projects and programs in complex organizations','Founder of Women in PM Network and the BlueprintHub career platform']},
  {t:'promise', k:'What you leave with', h:'Relevant, capable, confident', s:'A way to run modern delivery with AI, the evidence to prove it, and the positioning to make sure the right people know it. That is how you stay future-ready while the work keeps changing.'},
  {t:'cta', k:'Your next step', h:'Come build your Blueprint', s:'If this is the PM you want to be, the next step is a short strategy call. We map where you are, where you want to be, and whether the AI-Powered Project Leadership Blueprint is the right path there.', cta:'Book your strategy call', foot:'Educational only. No specific role, salary, interview outcome or income result is guaranteed. Results vary with each person’s effort, experience and circumstances.'}
];
const stage=document.getElementById('stage'), nav=document.getElementById('nav');
let i=0;
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(){
  let b='';
  const s=S[i];
  b+='<div class="slide on">';
  if(s.k) b+='<div class="kicker">'+esc(s.k)+'</div>';
  b+='<div class="accentbar"></div>';
  if(s.t==='title'||s.t==='cta'){ b+='<h1>'+esc(s.h)+'</h1>'; } else { b+='<h2>'+esc(s.h)+'</h2>'; }
  if(s.s) b+='<p class="'+((s.t==='title'||s.t==='cta')?'lead':'sub')+'">'+esc(s.s)+'</p>';
  if(s.items){ b+='<ul>'; s.items.forEach(x=>b+='<li>'+esc(x)+'</li>'); b+='</ul>'; }
  if(s.cells){ b+='<div class="grid4">'; s.cells.forEach(c=>b+='<div class="cell"><div class="n">'+esc(c[0])+'</div><div class="d">'+esc(c[1])+'</div></div>'); b+='</div>'; }
  if(s.cta){ b+='<div class="cta-row"><span class="pill">'+esc(s.cta)+'</span></div>'; }
  if(s.foot){ b+='<div class="foot">'+esc(s.foot)+'</div>'; }
  b+='</div>';
  stage.innerHTML=b;
  nav.textContent=(i+1)+' / '+S.length;
}
function go(d){ i=Math.max(0,Math.min(S.length-1,i+d)); render(); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
stage.addEventListener('click',()=>go(1));
render();
</script>
</body>
</html>
