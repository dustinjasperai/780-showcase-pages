<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Break Through Your Ceiling · Brett Gilliland, Elite Entrepreneurs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#002d5b; --panel:#063a71; --rule:#0c4b86;
    --acc:#ffab40; --ink:#f5f7fb; --body:#c4d2e4; --dim:#7f93ad; --cream:#f5f7fb;
  }
  html,body{height:100%}
  body{background:#001b38;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#001b38}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Inter Tight',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.012em}
  .t-title h1{font-size:5.0vw;max-width:92%}
  .t-normal h1{font-size:3.35vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.62;font-weight:400}
  .sub{font-family:'Inter Tight',sans-serif;font-size:2.05vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.34;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.9vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#012a54 0%,#00152c 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#012a54 0%,#00152c 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.95vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#d7e1ee;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .cl-motif{position:absolute;pointer-events:none}
  .title-cl{right:7.5%;bottom:8%;width:15vw;opacity:.92}
  .corner-cl{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.10);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Elite Entrepreneurs</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- ceiling motif: a rising path breaking up through a ceiling line, drawn in amber -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ceil" viewBox="0 0 120 120">
  <g fill="none" stroke="#ffab40" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 62 H50" opacity="0.55"/>
    <path d="M70 62 H108" opacity="0.55"/>
    <path d="M60 106 V26" opacity="0.95"/>
    <path d="M44 44 L60 24 L76 44" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Break Through Your Ceiling',sub:'How founders scale from seven figures to eight by leading, not doing.',brand:true,cl:'title'},
 {t:'normal',k:'Who this is for',title:'You built this to your first million by doing. That is exactly why it stalls here.',body:'You are the founder who can do every job in the building, and for a long time that was the superpower. Now the team leans on you for every call, progress has slowed, and the days are full but the number is not moving. The business has quietly become the size of you.'},
 {t:'dark',title:'Effort got you to a million. Effort alone will not get you to ten.'},

 {t:'section',idx:'Part One',title:'Why Good Businesses Stall at Seven Figures'},
 {t:'normal',k:'The real ceiling',title:'The wall is not strategy. It is leadership capacity.',body:'Every revenue tier asks for a level of leadership the last one did not. The version of leading that got you to a million, being the best doer and holding it all in your head, is the same version that caps you here. You did not run out of market. You ran out of the way you were leading.'},
 {t:'normal',k:'Discretionary effort',title:'Your team is giving you compliance. Growth needs their discretionary effort.',body:'Discretionary effort is the extra a person gives when they believe in where this is going. You cannot mandate it and you cannot buy it. It is unlocked by how the founder leads, and the gap between what your team could give and what it gives today is the real ceiling on the business.'},
 {t:'dark',title:'You cannot out-work a leadership problem. You can only out-lead it.'},

 {t:'section',idx:'Part Two',title:'The Elite Growth Method'},
 {t:'normal',k:'Create Clarity',title:'It starts by ending the drama and uniting the team behind one goal.',body:'Most stuck companies are not short on effort, they are short on clarity, and the fog shows up as division, politics, and everyone rowing in a slightly different direction. Create Clarity is the first move: one goal the whole team can see, so the energy stops leaking sideways.'},
 {t:'normal',k:'Chart the Course',title:'Get out of reactive mode and build the future on purpose.',body:'When every day is firefighting, the business drifts wherever the loudest problem points it. Charting the course means stepping out of the daily reaction long enough to decide, on purpose, what the next stage looks like and the handful of moves that get you there.'},
 {t:'normal',k:'Align All Efforts',title:'Point the whole team at the few priorities that actually move the number.',body:'A team can be busy and aligned at the same time only if everyone knows the few things that matter most this quarter. Alignment is what turns a lot of motion into progress, so the effort you already have starts compounding instead of cancelling out.'},
 {t:'normal',k:'Build the Team',title:'Build leaders at every level so the business stops depending on you.',body:'Scaling is not hiring more doers, it is building leaders who own outcomes without you in the room. When you develop leadership at every level, decisions get made closer to the work, and the company stops being bottlenecked at your desk.'},
 {t:'normal',k:'Execute with Consistency',title:'Make progress predictable instead of heroic.',body:'Growth that depends on a heroic month from the founder is fragile. Consistent execution is a rhythm of accountability, the meetings and the follow-through that make results repeatable, so the business grows on a system rather than on your adrenaline.'},
 {t:'dark',title:'This is a leadership system, not another operating system to install.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Lead Instead of Do'},
 {t:'normal',k:'The three hats',title:'A CEO wears three hats. The rest belong to the team.',body:'The three that are truly yours are setting the vision, building the team, and delivering results. Everything else is a hat you are wearing out of habit. Learning to hand those back is like learning a new language, awkward at first, then the thing that finally lets the business outgrow you.'},
 {t:'normal',k:'The founder this builds',title:'Fewer decisions on your desk, and faster growth off it.',body:'When the team owns the work and you own the leadership, the calendar clears of things only you could decide, and the number starts moving again because more capable people are now driving it. You are not doing less because you care less. You are leading more, and the business grows because of it.'},
 {t:'dark',title:'The goal was never to do less. It was to lead more, and grow because of it.'},
 {t:'normal',k:'Why Brett Gilliland',title:'I helped take a company from seven million to over a hundred. This is how.',body:'I spent ten years helping Infusionsoft grow from about seven million in revenue to over a hundred million, did the foundational work on its purpose, values, and mission, and co-created its Elite Forum with Clate Mask. Elite Entrepreneurs is where I now teach seven-figure founders the leadership that breaks the ceiling. This method is the one behind all of it.'},

 {t:'section',idx:'Your Next Step',title:'Lead Your Way Past the Ceiling'},
 {t:'cta',title:'Ready to break through your ceiling?',body:'Take the next step with Elite Entrepreneurs.',chips:['Get your free 10M Blueprint','Apply for the Elite Mastermind'],disc:'Educational content for business owners. No income or business result is guaranteed. Results vary by owner, team, and market.'},
];

const deck=document.getElementById('deck');
function cl(kind){return `<svg class="cl-motif ${kind==='title'?'title-cl':'corner-cl'}"><use href="#ceil"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Elite <b>Entrepreneurs</b> · Brett Gilliland</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.cl) h+=cl(s.cl);
  else if(s.t==='title') h+=cl('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
