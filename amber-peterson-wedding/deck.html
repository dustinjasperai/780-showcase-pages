<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Niche-First Method &middot; Amber Peterson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#152420; --panel:#1e332d; --rule:#365049;
    --accent:#c2a877; --accent2:#74cbc8; --chalk:#f4efe4; --dim:#a9c2ba;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Montserrat',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3.2vw;max-width:84%}
  .t-normal .body{font-size:1.4vw;color:var(--dim);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.7vw;color:var(--dim);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent2);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1f3a34 0%,#0a1310 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:84%;font-style:italic;color:#f1efe4}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1f3a34 0%,#0a1310 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:#e9dcc1;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .compass-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-compass{right:7%;bottom:9%;width:15vw}
  .corner-compass{right:6%;bottom:8%;width:8vw;opacity:.35}
  .brandline{font-size:1.2vw;color:var(--dim);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Planner's Lounge</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- compass / wayfinding motif: a ring with a directional needle -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="compass" viewBox="0 0 200 200">
  <g fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="100" cy="100" r="82" stroke="#c2a877" opacity="0.55"/>
    <circle cx="100" cy="100" r="58" stroke="#74cbc8" opacity="0.35"/>
    <path d="M100 34 L112 100 L100 166 L88 100 Z" stroke="#f4efe4" opacity="0.5"/>
    <circle cx="100" cy="100" r="5" fill="#c2a877" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Niche-First Method',sub:'How wedding planners stop competing on price and start booking the weddings they actually want, by picking a lane and marketing to it with real strategy behind it.',brand:true,rise:'title'},
 {t:'normal',k:'Who this is for',title:'You did not start planning weddings to compete on price.',body:'You built real skill: florals, timelines, vendor relationships, the calm voice in the room when something goes wrong. But somewhere along the way, you started saying yes to every inquiry that landed in your inbox just to keep the calendar full.'},
 {t:'normal',k:'The trap',title:'Generalist planners compete on price. Specialists do not.',body:'When you are "a wedding planner" the same as every other wedding planner nearby, the only thing left for a couple to compare is your rate. The planners booking the weddings they actually want are not better at planning. They are clearer about who they are for.'},
 {t:'dark',title:'You do not have a marketing problem. You have a positioning problem.'},

 {t:'section',idx:'Part One',title:'Why "I Do All Weddings" Is Costing You The Best Ones'},
 {t:'normal',k:'The inbox problem',title:'Every inquiry looks like a maybe.',body:'Without a defined lane, every couple who fills out your contact form is a coin flip: right budget, wrong style, or right style, wrong budget. You spend hours on calls that were never going to book, because nothing in your marketing told them who you are actually for.'},
 {t:'normal',k:'The comparison trap',title:'Couples can only compare what looks the same.',body:'If your site says the same thing every other local planner’s site says, a couple has one number left to compare: price. Narrow the field of planners who look like you, and you stop being compared to planners who do not.'},
 {t:'normal',k:'The math',title:'A specialist charges more and closes faster.',body:'A couple who found you because you are exactly what they were looking for does not need convincing on price. The sales conversation gets shorter, and the number attached to it gets bigger, in the same call.'},
 {t:'dark',title:'The planners who feel like they have no competition usually just picked a smaller room to be the best in.'},

 {t:'section',idx:'Part Two',title:'The Niche-First Method'},
 {t:'normal',k:'Pillar one, the niche',title:'Pick a lane specific enough that you become the obvious call.',body:'Not "luxury weddings." A defined style, region, or client type specific enough that when a couple who fits it searches, they find you first and stop looking. The narrower the lane, the shorter the sales conversation.'},
 {t:'normal',k:'Pillar two, pricing with confidence',title:'Price like the specialist you just became.',body:'A defined niche only pays off if your pricing matches it. Present your packages with the same clarity you would want from your own vendors: structured, confident, no apologizing for the number. Couples rarely push back on price. They push back on uncertainty.'},
 {t:'normal',k:'Pillar three, low-cost marketing',title:'You do not need a bigger budget. You need the right ten moves.',body:'Once the lane is picked, marketing gets cheap: a handful of low-cost, high-leverage moves that put you in front of the right couples and vendors repeatedly, instead of shouting into a general feed and hoping the right person scrolls past.'},
 {t:'dark',title:'Marketing to everyone is the most expensive way to reach no one in particular.'},
 {t:'normal',k:'Putting it together',title:'The niche tells them who. The pricing tells them you are worth it. The marketing gets you in front of them.',body:'None of the three works alone. A great niche with weak pricing still leaves money on the table. Confident pricing without a niche still competes with generalists. The method only works when all three run together.'},

 {t:'section',idx:'Part Three',title:'The Shift Planners Feel First'},
 {t:'normal',k:'Three months out',title:'Your inquiries start pre-qualifying themselves.',body:'Couples who reach out already know your style, your rough price range, and why you are the planner for their specific kind of wedding. Fewer discovery calls, a higher close rate, less time spent convincing.'},
 {t:'normal',k:'Six months out',title:'Referrals start sounding like your marketing.',body:'When vendors and past clients can describe exactly who you are for, they refer the right couples instead of anyone getting married. Word of mouth starts doing the qualifying for you.'},
 {t:'normal',k:'Why me',title:'Why me.',body:'I am Amber Peterson, owner of Planner’s Lounge. I spent a decade planning weddings, then built a career as a marketing strategist for service-based businesses before bringing both together here. This is the same strategy taught inside the 9-Month Intensive Mentoring Program, for planners ready to stop competing on price.'},
 {t:'cta',title:'Ready to pick your lane and price like you mean it?',chips:['Learn about the 9-Month Intensive Mentoring Program','Explore Pricing with Confidence'],disc:'Educational content for wedding and event planning business owners. No income, booking, or business result is guaranteed. Results vary by market, niche, and effort.'},
];

const deck=document.getElementById('deck');
function rise(kind){return `<svg class="compass-motif ${kind==='title'?'title-compass':'corner-compass'}"><use href="#compass"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Planner’s <b>Lounge</b> &middot; Amber Peterson</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.rise) h+=rise(s.rise);
  else if(s.t==='title') h+=rise('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
