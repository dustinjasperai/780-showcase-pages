<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Burnout Isn't a Time Problem — Caitlin Clarke</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Quattrocento:wght@400;700&family=Quattrocento+Sans:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#edf3f2;      /* her light scheme, cooled with a faint tint of her teal brand */
    --panel:#f8fcfb;
    --rule:#d4e0de;
    --accent:#045c64;  /* her measured deep teal (extract_brand.js) */
    --ink:#201d19;
    --muted:#6b645b;
    --serif:'Quattrocento', Georgia, serif;
    --sans:'Quattrocento Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);
       display:flex;align-items:center;justify-content:center;overflow:hidden}
  #stage{width:100%;max-width:1040px;aspect-ratio:16/9;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
         padding:72px 84px;background:var(--panel)}
  .slide.on{display:flex}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
           font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.12;margin-bottom:18px}
  p{font-size:21px;line-height:1.55;color:var(--muted);max-width:46ch;margin-top:14px}
  p.lead{color:var(--ink);font-size:24px}
  .big{font-family:var(--serif);font-size:46px;line-height:1.14;color:var(--ink);max-width:20ch}
  ul{list-style:none;margin-top:22px}
  li{font-size:21px;line-height:1.5;padding:12px 0 12px 30px;position:relative;color:var(--ink);
     border-bottom:1px solid var(--rule);max-width:50ch}
  li:before{content:"";position:absolute;left:0;top:22px;width:12px;height:12px;border-radius:50%;
            background:var(--accent)}
  .pillar{font-family:var(--serif);font-size:30px;color:var(--accent);font-weight:700}
  .sub{margin-top:8px}
  .foot{position:absolute;left:84px;bottom:40px;font-size:13px;color:var(--muted);letter-spacing:.04em}
  .num{position:absolute;right:40px;bottom:36px;font-size:12px;color:var(--muted)}
  .cta h1{font-size:46px}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .brandline{position:absolute;left:84px;top:44px;font-family:var(--serif);font-weight:700;
             font-size:16px;color:var(--accent);letter-spacing:.02em}
  .nav{position:fixed;bottom:16px;right:20px;font-size:12px;color:var(--muted);font-family:var(--sans)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav">&larr; / &rarr; to move</div>
<script>
const S=[
 {t:'title'},
 {t:'who'},
 {t:'trap'},
 {t:'hook'},
 {t:'p1head'},
 {t:'p1body'},
 {t:'p1why'},
 {t:'p2head'},
 {t:'pillar',eyebrow:'The method, pillar one',h:'Work in the body, where it is held',p:'Hakomi-based, body-centered change surfaces the patterns running underneath conscious thought. We do not add another framework on top. We take weight off: the masking, the bracing, the limiting patterns. Change sticks because it happens in the nervous system, not the calendar.'},
 {t:'pillar',eyebrow:'The method, pillar two',h:'Down-regulate the system on high alert',p:'High-functioning burnout is a nervous system that never fully stood down. We repattern it, attachment-informed and slow, so a chronically activated system can settle. When the system settles, capacity comes back on its own.'},
 {t:'pillar',eyebrow:'The method, pillar three',h:'Meet the part that keeps you over-functioning',p:'Through parts work and imaginal work we meet the over-functioner, the perfectionist, the one who believes rest has to be earned. You stop fighting the pattern and start working with the part of you that built it for a reason.'},
 {t:'together'},
 {t:'p3head'},
 {t:'p3body'},
 {t:'whyme'},
 {t:'notwhat'},
 {t:'cta',disc:"Educational content only. This is coaching, not medical, psychological, or therapeutic treatment, and it is not a substitute for care from a licensed professional. No specific result is guaranteed. Results vary from person to person."}
];
const stage=document.getElementById('stage');
function slideHTML(s,i,n){
 let inner='';
 if(s.t==='title'){
  inner=`<div class="eyebrow">A live masterclass</div>
   <h1>Why burnout isn't<br>a time problem</h1>
   <p class="lead">For leaders who are still delivering and running on empty. One hour on what actually holds the exhaustion in place, and what moves it.</p>`;
 } else if(s.t==='who'){
  inner=`<div class="eyebrow">Who this is for</div>
   <h2>You lead, and you are tired in a way sleep doesn't fix</h2>
   <ul>
    <li>Directors, founders, CEOs, and executive directors carrying a lot</li>
    <li>High achievers who look fine on the outside and are bracing on the inside</li>
    <li>People who sense the usual advice (take PTO, set boundaries) hasn't reached it</li>
   </ul>`;
 } else if(s.t==='trap'){
  inner=`<div class="eyebrow">The trap</div>
   <h2>You already optimized the calendar</h2>
   <p class="lead">You protected the mornings. You took the time off. You delegated, you said no, you booked the retreat. By every measure you did the responsible things.</p>`;
 } else if(s.t==='hook'){
  inner=`<div class="eyebrow">And yet</div>
   <div class="big">The weekend ends and you wake up just as wiped out as before.</div>
   <p>That isn't a willpower failure or a scheduling failure. It's a signal that the exhaustion lives somewhere a calendar can't reach.</p>`;
 } else if(s.t==='p1head'){
  inner=`<div class="eyebrow">Part one</div>
   <h2>Burnout isn't a shortage of hours</h2>
   <p class="lead">It's a nervous system stuck on high alert. The depletion you feel is the cost of a body that has been braced for a very long time.</p>`;
 } else if(s.t==='p1body'){
  inner=`<div class="eyebrow">What high alert does</div>
   <h2>The cost of a braced system</h2>
   <ul>
    <li>Bracing: holding tension as though something is always about to go wrong</li>
    <li>Masking: performing steady while the inside is anything but</li>
    <li>Over-functioning: carrying what isn't yours because stopping feels unsafe</li>
   </ul>`;
 } else if(s.t==='p1why'){
  inner=`<div class="eyebrow">Why time off doesn't fix it</div>
   <h2>Rest doesn't reach a system that never stood down</h2>
   <p class="lead">You can remove the demands for a weekend, but the pattern keeping you activated travels with you. The body stays ready. That's why Monday feels like you never left.</p>`;
 } else if(s.t==='p2head'){
  inner=`<div class="eyebrow">Part two, the method</div>
   <h2>We don't add more. We take weight off.</h2>
   <p class="lead">Three moves, worked in the body rather than talked about from the neck up. This is the difference between understanding the pattern and changing it.</p>`;
 } else if(s.t==='pillar'){
  inner=`<div class="eyebrow">${s.eyebrow}</div>
   <div class="pillar">${s.h}</div>
   <p class="sub">${s.p}</p>`;
 } else if(s.t==='together'){
  inner=`<div class="eyebrow">How they fit</div>
   <h2>Work with the system, not against it</h2>
   <p class="lead">Settle the body, repattern the activation, and make peace with the part that built the over-functioning. Done in that order, the exhaustion stops being something you manage and starts being something that lifts.</p>`;
 } else if(s.t==='p3head'){
  inner=`<div class="eyebrow">Part three</div>
   <h2>What leading from the body looks like</h2>
   <p class="lead">Not a softer version of you. A steadier one. Same standards, less cost to meet them.</p>`;
 } else if(s.t==='p3body'){
  inner=`<div class="eyebrow">On the other side</div>
   <ul>
    <li>You feel the "no" in your body before your calendar fills up</li>
    <li>Hard conversations land because you're regulated, not braced</li>
    <li>Rest actually restores, because the system knows how to stand down</li>
   </ul>`;
 } else if(s.t==='whyme'){
  inner=`<div class="eyebrow">Why me</div>
   <h2>I spent twenty years inside the pressure</h2>
   <p class="lead">I built, led, and shaped culture in startups and fast-growing companies before coaching full-time. I'm an ICF-certified integrative coach (PCC) and a Certified Hakomi Practitioner. I work where strategy and mindset stop reaching, in the body.</p>`;
 } else if(s.t==='notwhat'){
  inner=`<div class="eyebrow">A word on what this is not</div>
   <h2>Not time-management. Not mindset hacks.</h2>
   <p class="lead">If better planning or a new morning routine were going to fix this, they already would have. This is nervous-system work, and it changes who you are under pressure, not just what you do.</p>`;
 } else if(s.t==='cta'){
  inner=`<div class="eyebrow">Your next step</div>
   <h1>If this is the work you've been missing</h1>
   <p class="lead">Book a clarity call. We'll look at what's holding the exhaustion in place and whether working together, in Stop Burnout for Good or executive coaching, is the right next move. You'll leave with clarity either way.</p>
   <div class="disc">${s.disc}</div>`;
 }
 return `<section class="slide${i===0?' on':''}${s.t==='cta'?' cta':''}" data-i="${i}">
   <div class="brandline">Caitlin Clarke &middot; Somatic Executive Coaching</div>
   ${inner}
   <div class="num">${i+1} / ${n}</div>
 </section>`;
}
stage.innerHTML=S.map((s,i)=>slideHTML(s,i,S.length)).join('');
let cur=0;const slides=[...document.querySelectorAll('.slide')];
function show(n){cur=(n+slides.length)%slides.length;slides.forEach((el,i)=>el.classList.toggle('on',i===cur));}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
 if(e.key==='ArrowLeft')show(cur-1);
});
stage.addEventListener('click',()=>show(cur+1));
</script>
</body>
</html>
