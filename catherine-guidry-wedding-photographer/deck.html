<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Luxury Booking Method | A Masterclass with Catherine Guidry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#efece2;
    --panel:#faf8f2;
    --rule:#d8d6c6;
    --ink:#1b1b18;
    --ink-soft:#44433d;
    --ink-muted:#7d7b70;
    --accent:#a5a690;
    --accent2:#787b6f;
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{font-family:'Nunito Sans',-apple-system,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
  #stage{max-width:1040px;margin:0 auto;padding:40px 24px 90px}
  .slide{display:none;background:var(--panel);border:1px solid var(--rule);min-height:76vh;padding:64px 60px;position:relative}
  .slide.on{display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-size:12px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent2);margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:58px;line-height:1.08;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;font-size:40px;line-height:1.15;margin-bottom:20px}
  .lead{font-size:21px;color:var(--ink-soft);max-width:40ch}
  .body{font-size:19px;color:var(--ink-soft);max-width:62ch;margin-bottom:14px}
  .big{font-family:'Cormorant Garamond',Georgia,serif;font-size:72px;font-weight:600;color:var(--accent2);line-height:1}
  ul{list-style:none;margin-top:10px;max-width:60ch}
  li{position:relative;padding-left:26px;font-size:19px;color:var(--ink-soft);margin-bottom:14px}
  li::before{content:"";position:absolute;left:0;top:13px;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .part-num{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:22px;color:var(--accent2);margin-bottom:10px}
  .rule{width:64px;height:2px;background:var(--accent);margin:4px 0 26px}
  .note{font-size:14px;color:var(--ink-muted);margin-top:26px;max-width:60ch;font-style:italic}
  .footer{position:absolute;bottom:22px;left:60px;right:60px;display:flex;justify-content:space-between;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-muted);border-top:1px solid var(--rule);padding-top:12px}
  .nav{position:fixed;bottom:0;left:0;right:0;background:rgba(246,243,236,.94);border-top:1px solid var(--rule);display:flex;align-items:center;justify-content:center;gap:20px;padding:12px;font-size:13px;color:var(--ink-muted);backdrop-filter:blur(4px)}
  .nav button{font-family:'Nunito Sans',sans-serif;font-size:13px;border:1px solid var(--rule);background:var(--panel);color:var(--ink);padding:7px 16px;cursor:pointer;border-radius:2px}
  .nav button:hover{border-color:var(--accent)}
  @media(max-width:720px){.slide{padding:44px 26px}h1{font-size:40px}h2{font-size:30px}.big{font-size:52px}.footer{left:26px;right:26px}}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><button onclick="go(-1)">&larr; Prev</button><span id="count"></span><button onclick="go(1)">Next &rarr;</button></div>
<script>
const S = [
  {t:'title', eyebrow:'A free masterclass for wedding photographers', title:'The Luxury Booking Method', lead:'How to book fewer weddings and earn more from each one, without lowering your prices or shooting every weekend of the year.'},
  {t:'who', eyebrow:'Who this is for', title:'You, if any of this sounds familiar', bullets:['You are good behind the camera, but the inquiries that come in want the lowest price.','You watch a handful of photographers in your market book the couples you want.','You are busy, but busy is not the same as profitable.','You want fewer weddings a year, each one worth more.']},
  {t:'trap', eyebrow:'The trap', title:'More weddings is the wrong goal', body:'Most photographers try to fix an income problem by booking more weddings. So they lower prices to win the inquiry, fill the calendar, and end the year exhausted and still underpaid.', body2:'The couples who value artistry are out there paying well. They are just booking someone else.'},
  {t:'reframe', eyebrow:'The reframe', title:'Price is a positioning decision, not a math problem alone', body:'When you compete on price, you attract clients who shop on price. When you price from the life you want and back it with a client experience worth talking about, you attract clients who book on trust.', note:'This class is about the three levers that move you from the first group to the second.'},
  {t:'part', part:'Part One', title:'Price from your own numbers'},
  {t:'content', eyebrow:'The Base-Price Formula', title:'Start from the life, not the market', body:'Pricing by copying the photographer down the road is how you inherit their mistakes. Instead, build your base price backward from what your year actually needs to produce.', bullets:['Set the annual income you want to take home.','Add back your taxes and your true business expenses to get the real number you must gross.','Divide by the number of weddings you actually want to shoot. That is your minimum base price.']},
  {t:'content', eyebrow:'The Base-Price Formula', title:'A worked example', big:'$3,575', body:'Want to net a target income after a twelve percent tax year and your business expenses, and you choose to shoot fifteen weddings? The math lands on a base price in the mid three thousands, before any albums or add-ons.', note:'The point is not the exact figure. It is that your price is now defensible, because it is tied to your real costs and the year you want.'},
  {t:'content', eyebrow:'The Base-Price Formula', title:'Add-ons are profit, not discounts', body:'Once the base covers your year, albums, extra sessions, and products stack on top as margin. You stop discounting to close, because the base already carries the business.'},
  {t:'part', part:'Part Two', title:'Make the experience worth referring'},
  {t:'content', eyebrow:'The Posing Plan', title:'Posing is a booking lever', body:'Clients do not remember your settings. They remember how they felt and how they looked. Confident, natural posing on demand is what produces images people rave about, and raving clients are what fill your calendar with the right referrals.'},
  {t:'content', eyebrow:'The Posing Plan', title:'A repeatable system beats talent on the day', bullets:['A go-to sequence so you are never improvising in front of a nervous couple.','Direction that gets real emotion instead of stiff, posed faces.','A method that holds up in any light, any location, any time crunch.']},
  {t:'content', eyebrow:'The Posing Plan', title:'Consistency is what lets you raise prices', body:'When every gallery is strong, not just the ones with perfect light, you can charge like it. Consistency is the quiet thing that makes a premium price feel safe to the client.'},
  {t:'part', part:'Part Three', title:'Build a roster of clients you love'},
  {t:'content', eyebrow:'Ideal clientele', title:'Decide who you are for', body:'You cannot be the cheapest and the most sought after at the same time. Naming the client who values your artistry changes your website, your words, and the inquiries you attract.', bullets:['Write for the client you want, not the one you are afraid to lose.','Let your portfolio say no to the work you do not want more of.']},
  {t:'content', eyebrow:'The referral engine', title:'Planners and venues are your paid-free sales team', body:'The luxury tier runs on relationships. Wedding planners and venues send repeat, pre-sold couples when the experience you deliver makes them look good to their clients.', bullets:['Deliver an experience a planner is proud to attach their name to.','Follow through so the next referral is automatic, not a favor.']},
  {t:'content', eyebrow:'How it fits together', title:'Three levers, one result', body:'Price from your own numbers so the business is sound. Pose so the work is consistently strong. Position so the right clients and referrers find you. That is how you book fewer weddings and earn more from each.'},
  {t:'credibility', eyebrow:'Why listen to me', title:'I built this the hard way', body:'I set out to shoot luxury weddings with no school for it and no map. I made the mistakes, found what clients do and do not respond to, and turned it into a repeatable method. Now I shoot a smaller number of weddings a year and teach photographers to do the same.', note:'I am sharing the lessons so you do not have to learn them one disappointing season at a time.'},
  {t:'recap', eyebrow:'What you walk away with', title:'Your next three moves', bullets:['Rebuild your base price from your real numbers this week.','Lock in a posing sequence you can run without thinking.','Name your ideal client and start speaking only to them.']},
  {t:'cta', eyebrow:'Where to go from here', title:'Go full time, on purpose', body:'If you want the whole system, step by step, the Full Time Wedding Photography course walks through pricing, posing, client experience, and scaling in order. If you want it tailored to your business, there is in-person mentoring with live critique.', bullets:['Full Time Wedding Photography course','In-person mentoring with live sessions'], note:'Educational only. Nothing here is a promise of income, bookings, or results, and no result is guaranteed. Results vary with your market, effort, and experience.'}
];
let i=0;
const stage=document.getElementById('stage');
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function render(){
  const s=S[i];
  let h='<div class="slide on">';
  if(s.eyebrow) h+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.part){ h+='<div class="part-num">'+esc(s.part)+'</div>'; }
  if(s.title){ h+=(s.t==='title'?'<h1>':'<h2>')+esc(s.title)+(s.t==='title'?'</h1>':'</h2>'); }
  h+='<div class="rule"></div>';
  if(s.lead) h+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.big) h+='<div class="big">'+esc(s.big)+'</div>';
  if(s.body) h+='<p class="body">'+esc(s.body)+'</p>';
  if(s.body2) h+='<p class="body">'+esc(s.body2)+'</p>';
  if(s.bullets){ h+='<ul>'; s.bullets.forEach(function(b){h+='<li>'+esc(b)+'</li>'}); h+='</ul>'; }
  if(s.note) h+='<p class="note">'+esc(s.note)+'</p>';
  h+='<div class="footer"><span>Catherine Guidry</span><span>The Luxury Booking Method</span></div>';
  h+='</div>';
  stage.innerHTML=h;
  document.getElementById('count').textContent=(i+1)+' / '+S.length;
}
function go(d){ i=Math.max(0,Math.min(S.length-1,i+d)); render(); }
document.addEventListener('keydown',function(e){ if(e.key==='ArrowRight'||e.key===' ')go(1); if(e.key==='ArrowLeft')go(-1); });
render();
</script>
</body>
</html>
