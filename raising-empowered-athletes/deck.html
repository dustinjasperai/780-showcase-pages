<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Raising Empowered Athletes — The Lean-Back Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe4; --panel:#fffdf8; --ink:#2f2a22; --muted:#6c6355;
    --rule:#e6ddcc; --accent:#ff674d;
    --head:'Poppins',system-ui,sans-serif; --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 54px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(47,42,34,.03)}
  .slide.title{background:linear-gradient(180deg,#fffdf8 0%,#fdeee8 100%)}
  .slide.cta{background:#2f2a22;color:#fdf6f2;border-color:#2f2a22}
  .kicker{font-family:var(--head);font-weight:600;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  .part h2{font-size:40px}
  .promise{font-size:21px;color:var(--muted);margin-top:20px;max-width:42ch}
  p.body{font-size:20px;line-height:1.5;margin-top:18px;max-width:50ch;color:#453d31}
  ul{margin-top:22px;list-style:none;display:grid;gap:14px;max-width:52ch}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.45}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.1;color:var(--ink)}
  .quote{font-size:40px;font-style:italic;line-height:1.2}
  .num{font-family:var(--head);font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.14em;
    text-transform:uppercase;margin-bottom:14px}
  .cta h2{color:#fdf6f2}
  .cta .body{color:#e8ddd5}
  .cta a{color:#ffb7a8;font-family:var(--head);font-weight:600;text-decoration:none}
  .disc{margin-top:26px;font-size:13px;color:#b7ab9f;max-width:60ch;line-height:1.5}
  .foot{margin-top:26px;font-family:var(--head);font-size:13px;color:var(--muted);letter-spacing:.04em}
  .pagemark{font-family:var(--head);font-size:12px;color:#b9b0a2;margin-top:28px;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', kicker:'A live masterclass for sports parents',
   h:'Raising Empowered Athletes', promise:'The lean-back method for raising a happy, brave, resilient athlete, and keeping the love of the game alive. One live hour with Kirsten Jones.'},

  {t:'who', kicker:'Who this is for',
   h:'The parent in the front seat',
   body:'You drive to the practices, you pay for the club, you care more than anyone in the stands. You are a parent of a youth or teen athlete who wants to help, without becoming the reason the game stops being fun.'},

  {t:'trap', kicker:'The trap',
   h:'Leaning in feels like love',
   body:'So we coach from the sideline, we break down the game on the ride home, we fix the mistakes before they can. It comes from love. And it quietly teaches a kid that the game belongs to us, not to them.'},

  {t:'reframe', kicker:'The hard truth',
   h:'By age 13, most kids quit',
   body:'Not because they stop being good. Because it stopped being theirs. The pressure we add to help is often the exact thing that drains the joy and the drive we were trying to protect.'},

  {t:'part', cls:'part', num:'Part one', h:'The problem is proximity, not effort'},

  {t:'content', kicker:'What goes wrong',
   h:'Three seats too close',
   list:['We answer questions they never asked','We carry the result home and replay it','We measure our support in money, hours, and reps']},

  {t:'content', kicker:'The shift',
   h:'Lean back, not in, not out',
   body:'Leaning out is checking out. Leaning in is taking over. Leaning back is the hardest and most powerful seat: present, calm, and handing the athlete the wheel.'},

  {t:'part', cls:'part', num:'Part two', h:'The lean-back method'},

  {t:'pillar', num:'Pillar 1', kicker:'The ride home',
   h:'The six-word rule',
   body:'The only thing to say after a game: "I love to watch you play." No breakdown, no fixes. Six words that hand the game back and keep the car a safe place.'},

  {t:'pillar', num:'Pillar 2', kicker:'Ownership',
   h:'Let them own it',
   body:'Ask what they thought before you offer what you saw. Let the misses and the wins be theirs. A kid who owns the outcome is a kid who keeps showing up.'},

  {t:'pillar', num:'Pillar 3', kicker:'The dos and don\'ts',
   h:'Say less, mean more',
   list:['Do ask their input on the decisions that affect them','Do model being human, not perfect','Do not do for them what they can do for themselves','Do not trade sleep and joy for one more rep']},

  {t:'pillar', num:'Pillar 4', kicker:'The mental game',
   h:'Four tools for unshakeable confidence',
   body:'Confidence is built, not born. We give the athlete a simple set of tools to name the obstacle, quiet the noise, and walk back onto the field sure of themselves, whatever the scoreboard says.'},

  {t:'part', cls:'part', num:'Part three', h:'The quieter car, the braver kid'},

  {t:'content', kicker:'The shift you feel',
   h:'A quieter car and a braver kid',
   list:['They talk first, because the car got safe','They try harder things, because the misses are allowed','You enjoy the stands again, because it stopped being your game']},

  {t:'why', kicker:'Why me',
   h:'I have sat in every seat',
   body:'Division I Hall of Fame athlete. Fifteen years as a Nike executive. Mom of three athletes, two playing D1 basketball. Author of the best-selling Raising Empowered Athletes. I coached hard and parented hard, and I learned to lean back the hard way.'},

  {t:'cta', cls:'cta', kicker:'Your next step',
   h:'Come spend one live hour with me',
   body:'I will walk you through the lean-back method, the six-word rule, and the tools I give my coaching clients, live, with time for your questions. Bring the situation that is stressing you out right now.',
   disc:'Educational only. No income, performance, scholarship, or result is guaranteed. Results vary by family and athlete.',
   cta:'Reserve your seat at kirstenjonesinc.com'},
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  let h = '';
  if (s.num) h += '<div class="num">'+s.num+'</div>';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.t === 'title') {
    h += '<h1>'+s.h+'</h1>';
    if (s.promise) h += '<p class="promise">'+s.promise+'</p>';
  } else if (s.t === 'part') {
    h += '<h2>'+s.h+'</h2>';
  } else {
    h += '<h2>'+s.h+'</h2>';
  }
  if (s.body) h += '<p class="body">'+s.body+'</p>';
  if (s.list) { h += '<ul>'; s.list.forEach(x => h += '<li>'+x+'</li>'); h += '</ul>'; }
  if (s.cta) h += '<p class="body" style="margin-top:28px"><a href="https://www.kirstenjonesinc.com/coaching">'+s.cta+'</a></p>';
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  if (s.foot) h += '<div class="foot">'+s.foot+'</div>';
  h += '<div class="pagemark">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
