<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Discuss the Undiscussabull — a masterclass for farm families</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#faf7f2;      /* cream ground, from brand.json light scheme */
    --panel:#ffffff;
    --ink:#2b2733;        /* near-black body */
    --accent:#662d91;     /* Elaine's dominant brand purple (160 uses) */
    --accent2:#44b6ac;    /* her teal link accent */
    --muted:#6f6a77;
    --rule:#e7e0d6;
    --head:'Crimson Text', Georgia, serif;
    --body:'Open Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#2b2733;}
  body{font-family:var(--body);color:var(--ink);}
  .deck{max-width:1040px;margin:0 auto;padding:28px 16px 80px;}
  .slide{
    background:var(--paper);
    border-radius:14px;
    padding:64px 64px;
    margin:0 0 26px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
    position:relative;
    overflow:hidden;
  }
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent);}
  .num{position:absolute;right:26px;top:22px;font-size:12px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;}
  .kick{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px;}
  h1{font-family:var(--head);font-weight:700;font-size:54px;line-height:1.05;letter-spacing:-.01em;}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;color:var(--ink);}
  h2 .hl{color:var(--accent);}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);margin-top:20px;max-width:30em;}
  .sub{font-size:17px;line-height:1.55;color:var(--muted);margin-top:16px;max-width:34em;}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:40em;}
  li{position:relative;padding-left:30px;font-size:18px;line-height:1.5;}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:50%;background:var(--accent2);}
  .steps{counter-reset:s;display:grid;grid-template-columns:1fr 1fr;gap:12px 34px;margin-top:26px;}
  .steps div{counter-increment:s;position:relative;padding-left:40px;font-size:16px;line-height:1.4;}
  .steps div::before{content:counter(s);position:absolute;left:0;top:-2px;width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;font-weight:700;font-size:13px;display:flex;align-items:center;justify-content:center;font-family:var(--body);}
  .fair{display:grid;gap:16px;margin-top:26px;max-width:38em;}
  .fair div{border-left:3px solid var(--accent2);padding:4px 0 4px 18px;}
  .fair b{font-family:var(--head);font-size:22px;color:var(--accent);}
  .fair span{display:block;font-size:16px;color:var(--muted);margin-top:2px;}
  .big{font-family:var(--head);font-size:44px;line-height:1.12;max-width:20em;}
  .big .hl{color:var(--accent);}
  .credit{display:flex;gap:16px;align-items:baseline;margin-top:22px;flex-wrap:wrap;}
  .credit span{font-size:15px;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:7px 15px;}
  .cta h2{font-size:42px;}
  .cta .lead{font-size:20px;}
  .site{margin-top:30px;font-weight:700;color:var(--accent);font-size:19px;}
  .disc{margin-top:26px;font-size:12.5px;line-height:1.5;color:var(--muted);max-width:40em;border-top:1px solid var(--rule);padding-top:14px;}
  @media(max-width:720px){.slide{padding:40px 28px;min-height:auto}h1{font-size:38px}h2{font-size:28px}.big{font-size:30px}.steps{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Elaine Froese, CSP',
   h:'Discuss the Undiscussabull',
   lead:'How to have the farm-transition conversation your family keeps avoiding, before the land decides for you.'},

  {t:'point', kick:'What you will walk out with',
   h:'One honest hour, four things to take home.',
   bullets:['The real reason your transition talks keep stalling, named out loud.',
            'A four-question filter for the fight about what is fair.',
            'Ten small moves to start the conversation without blowing up the table.',
            'A simple map from "we never talk about it" to a plan everyone signed.']},

  {t:'trap', kick:'Who this is for',
   h:'You love this farm. You also lie awake over it.',
   sub:'This hour is for the families who farm together and want to keep farming together: the parents who built it, the son or daughter who wants to take it on, the spouses, and the kids who left but still care how it ends.',
   bullets:['You know a transition is coming, but no one has said the quiet parts out loud.',
            'Every time it comes up, someone shuts down, so you let it drop again.',
            'You are not fighting about land. You are fighting about being heard.']},

  {t:'reframe', kick:'The hard truth',
   big:'Silence is a decision too. It just lets the <span class="hl">worst-case</span> make it for you.'},

  {t:'point', kick:'Part one, the real problem',
   h:'There is a bull in the middle of your farm kitchen.',
   lead:'I call it the Undiscussabull: the thing everybody sees and nobody will name.',
   sub:'Most families do not lack love or brains. They lack a safe way to start the sentence. So the bull just stands there, year after year, getting bigger.'},

  {t:'point', kick:'Part one, the four animals',
   h:'Your Undiscussabull is usually one of these four.',
   bullets:['Money. Who knows the real numbers, and who is only guessing.',
            'Death. The plan that assumes everyone lives and stays healthy forever.',
            'Fairness. What the off-farm kids get, and whether anyone will say it.',
            'Control. Who is actually in charge now, and who refuses to let go.']},

  {t:'point', kick:'Part one, the myths that keep you stuck',
   h:'The three sentences that stall good farms.',
   bullets:['"They already know what I want." They do not. They are guessing, and guessing wrong.',
            '"We will deal with it after harvest." There is always another harvest.',
            '"Talking about it will just start a fight." The silence is the fight, drawn out for years.']},

  {t:'point', kick:'Part one, the cost',
   h:'What avoidance actually costs.',
   bullets:['Successors leave for town jobs while they wait for an answer that never comes.',
            'A parent passes with no plan, and the kitchen table turns into a courtroom.',
            'Off-farm siblings feel forgotten. On-farm siblings feel trapped. Both are right.',
            'A Virginia Tech study of 400 farms found the families who actually communicate were 21% more profitable. The conversation is not soft. It is the business.']},

  {t:'reframe', kick:'The reframe',
   big:'Fair is not the same as <span class="hl">equal</span>. Confusing the two stalls more farms than drought.'},

  {t:'fairslide', kick:'A tool you can use tonight',
   h:'The F.A.I.R. filter',
   sub:'When "what is fair" turns into a fight, run it through four questions instead of feelings.',
   fair:[['Financial transparency','Does everyone see the real numbers, or are they guessing?'],
         ['Attitude toward money','What did each of you learn about money that you have never said?'],
         ['Intentions, out loud','What does each person actually want? Not assume. Want.'],
         ['Roles, and rebels','Who does what now, and who has quietly opted out?']]},

  {t:'point', kick:'Part two, the method',
   h:'You do not need courage first. You need a first step.',
   lead:'Discuss the Undiscussabull is ten small, doable moves.',
   sub:'Nobody changes a 30-year pattern in one dramatic talk. You change it with one honest question, then the next.'},

  {t:'steps', kick:'Part two, the ten steps',
   h:'How to start the conversation.',
   steps:['Take charge of starting it','Come from curiosity, not accusation','Ask deeply, then wait',
          'Play with possibility','Really listen, do not reload','Ponder and perk, give it time',
          'Cultivate trust in small deposits','Come to terms with death','Extend the olive branch',
          'Respect boundaries']},

  {t:'point', kick:'Part two, try this first',
   h:'One question to ask at supper tonight.',
   lead:'"When you picture this farm in ten years, what do you hope is true?"',
   sub:'You are not deciding anything tonight. You are letting each person say what they actually want out loud, which is the one thing no one has done. That is the whole first step.'},

  {t:'point', kick:'Part two, the map',
   h:'From stuck to a working plan.',
   sub:'The conversation is the start. This is the path it opens.',
   bullets:['Family Dynamic Map, so everyone sees the same picture.',
            'Key Challenges Audit, so you fix the right thing first.',
            'The Family Meeting that actually decides something.',
            'Then the advisory team, the lawyer and accountant, doing their job on top of a family that agrees.']},

  {t:'point', kick:'Part three, a story',
   h:'The empty chair at the table.',
   sub:'I have sat with families where one chair stays empty, the son who moved to the city because he waited six years for an answer and finally stopped waiting. Every one of them told me the same thing. It was never about the money. It was that nobody would talk to him.',
   bullets:['The farms that keep their people are not the ones with the most land.',
            'They are the ones who learned to say the hard thing while everyone was still at the table.']},

  {t:'point', kick:'Part three, the payoff',
   h:'When the bull leaves the kitchen.',
   bullets:['The founder sleeps, because the farm is safe either way.',
            'The successor commits, because the future finally has a date on it.',
            'The off-farm kids feel seen, because fair got defined, not dodged.',
            'The transition becomes an ongoing family circle, not a cliff everyone dreads.']},

  {t:'credit', kick:'Why listen to me',
   h:'I have farmed this, and coached it for 30 years.',
   sub:'I am a Prairie farmer who lived my own succession, then spent three decades helping thousands of farm families talk through theirs.',
   credit:['CSP, Certified Speaking Professional','2018 Wilson Loree Award for Excellence in Farm Management','5 books on farm transition','50,000+ readers','Host, Farm Family Harmony Podcast']},

  {t:'cta', kick:'Your next step',
   h:'Start the conversation your farm has been waiting for.',
   lead:'If today named your Undiscussabull, do not let it go quiet again. Keep going with me: the Farm Family Transition Membership, a coaching session, or the free planning resources on my site.',
   site:'elainefroese.com',
   disc:'Educational content only. Results vary from family to family and nothing in this masterclass is a guarantee of any financial, legal, or family outcome. For legal, tax, and estate decisions, work with your own qualified advisors.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+ (s.t==='cta'?'cta':'');
  let html='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.kick) html+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='title') html+='<h1>'+s.h+'</h1>';
  else if(s.t==='reframe') html+='<div class="big">'+s.big+'</div>';
  else if(s.h) html+='<h2>'+s.h+'</h2>';
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.sub) html+='<p class="sub">'+s.sub+'</p>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+b+'</li>');html+='</ul>';}
  if(s.steps){html+='<div class="steps">';s.steps.forEach(b=>html+='<div>'+b+'</div>');html+='</div>';}
  if(s.fair){html+='<div class="fair">';s.fair.forEach(f=>html+='<div><b>'+f[0]+'</b><span>'+f[1]+'</span></div>');html+='</div>';}
  if(s.credit){html+='<div class="credit">';s.credit.forEach(c=>html+='<span>'+c+'</span>');html+='</div>';}
  if(s.site) html+='<div class="site">'+s.site+'</div>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
