<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow Without the Hustle — a live masterclass with Becky Mollenkamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caprasimo&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f7e9; --panel:#fffdf4; --rule:#e3e2cf;
    --ink:#1a1a1a; --muted:#5b554a;
    --accent:#cc0731; --deep:#8f0420; --hl:#eeff63;
    --head:'Caprasimo',system-ui,serif; --body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 52px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-size:clamp(34px,6vw,64px);line-height:1.02;font-weight:400;margin-bottom:18px}
  h2{font-family:var(--head);font-size:clamp(26px,4.4vw,44px);line-height:1.06;font-weight:400;margin-bottom:16px}
  .sub{font-size:clamp(17px,2.2vw,22px);color:var(--muted);max-width:40ch}
  .lead{font-size:clamp(20px,2.6vw,27px);max-width:42ch}
  .divider{background:var(--ink);color:#fff}
  .divider::before{background:var(--hl)}
  .divider h2{color:#fff}
  .divider .kicker{color:var(--hl)}
  .big{font-family:var(--head);font-size:clamp(30px,5vw,52px);line-height:1.05;max-width:22ch}
  ul{list-style:none;margin-top:12px}
  li{font-size:clamp(16px,2vw,20px);padding:12px 0;border-bottom:1px solid var(--rule);
    display:flex;gap:14px;align-items:baseline}
  li:last-child{border-bottom:none}
  .n{font-family:var(--head);color:var(--accent);font-size:22px;min-width:1.6em}
  .stagesub{color:var(--muted);font-size:15px;display:block;margin-top:3px}
  .hl{background:linear-gradient(transparent 60%,var(--hl) 60%);padding:0 2px}
  .step{font-family:var(--head);font-size:clamp(28px,4.5vw,46px);color:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:56ch;line-height:1.5}
  .cta h1{color:var(--accent)}
  .foot{font-size:12px;color:var(--muted);position:absolute;right:28px;bottom:18px;letter-spacing:.05em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Becky Mollenkamp',
   h:'Grow Without the Hustle',
   sub:'A new map for mission-driven founders who refuse to burn out to grow.'},

  {t:'lead', kicker:'Who this is for',
   lead:'You run a values-driven, service-based business. You have reached real revenue. And somewhere along the way the work stopped feeling like yours.'},

  {t:'lead', kicker:'The trap',
   lead:'You did everything the playbook said. You hustled, optimized, built the list, ran the launch. The numbers grew. The exhaustion grew faster.'},

  {t:'big', kicker:'The reframe',
   big:'What if the problem was never you. It was the map you were handed.'},

  {t:'divider', kicker:'Part one', h:'Why the mainstream playbook fails you'},

  {t:'lead', kicker:'The conditioning',
   lead:'Mainstream entrepreneurship bakes in a script: growth equals grind, your worth equals your revenue, rest has to be earned. Most of us absorbed it without ever choosing it.'},

  {t:'lead', kicker:'The cost',
   lead:'Following a borrowed script harder does not fix misalignment. It deepens it. You end up with a bigger business that fits you less.'},

  {t:'divider', kicker:'Part two', h:'The Bridge: building your own map'},

  {t:'stage', kicker:'Stage one', step:'01',
   h:'Rediscover Your Compass',
   sub:'Define success on your own terms, beyond money and productivity, so every later decision has something true to point at.'},

  {t:'stage', kicker:'Stage two', step:'02',
   h:'Lighten Your Load',
   sub:'Name the internalized rules driving the overwork, then set them down. This is the unlearning the rest of the map depends on.'},

  {t:'stage', kicker:'Stage three', step:'03',
   h:'Chart Your Course',
   sub:'Build a personalized growth plan rooted in your capacity and values, not someone else roadmap for a business that is not yours.'},

  {t:'stage', kicker:'Stage four', step:'04',
   h:'Build a Bridge',
   sub:'Cross from the old way to the new one through steady, supported implementation, so the change holds under real-world pressure.'},

  {t:'list', kicker:'The operating principles', h:'What a liberated business runs on',
   items:[
     ['Boundaries','Your capacity sets the pace, not the market.'],
     ['Pleasure','Work that feels good is allowed to be the point.'],
     ['Collaboration','Growth through relationships, not extraction.'],
     ['Collective care','Your people and your community are part of the plan.']
   ]},

  {t:'divider', kicker:'Part three', h:'Running a business that fits your life'},

  {t:'lead', kicker:'The anti-hustle CEO',
   lead:'You make decisions from capacity instead of fear. You grow in seasons that fit your life. The business finally reflects your values and supports your life, not the other way around.'},

  {t:'lead', kicker:'Why me',
   lead:'I spent nearly two decades in corporate journalism before building a business on my own terms. A decade of coaching and a lot of unlearning later, I help equity-minded founders grow profitable, people-first businesses. My work is grounded in Black feminist thought, disability justice, and abolitionist frameworks.'},

  {t:'big', kicker:'The one idea',
   big:'You can have the growth. You do not have to abandon your values or your humanity to get it.'},

  {t:'cta', kicker:'Your next step',
   h:'Ready to draw your own map?',
   sub:'If this is the version of growth you want, let us build the rest of your map together inside The Bridge, my 3-month coaching partnership for mission-driven founders.',
   disc:'This masterclass is educational. No income or result is guaranteed; it offers teaching, not a guarantee of outcomes. Results vary by founder and effort.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck = document.getElementById('deck');
S.forEach(s=>{
  const sl = el('div','slide'+(s.t==='divider'?' divider':'')+(s.t==='cta'?' cta':''));
  if(s.kicker) sl.appendChild(el('div','kicker',s.kicker));
  if(s.h) sl.appendChild(el(s.t==='title'?'h1':'h2', null, s.h));
  if(s.step) sl.appendChild(el('div','step',s.step));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.lead) sl.appendChild(el('p','lead',s.lead));
  if(s.sub) sl.appendChild(el('p','sub',s.sub));
  if(s.items){
    const ul=el('ul');
    s.items.forEach((it,i)=>{
      const li=el('li');
      li.appendChild(el('span','n',String(i+1)));
      li.appendChild(el('span',null,'<strong>'+it[0]+'</strong><span class="stagesub">'+it[1]+'</span>'));
      ul.appendChild(li);
    });
    sl.appendChild(ul);
  }
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  sl.appendChild(el('div','foot','beckymollenkamp.com'));
  deck.appendChild(sl);
});
</script>
</body>
</html>
