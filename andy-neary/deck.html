<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Become the Obvious Choice — Andy Neary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f2;        /* warm off-white ground (brand light scheme, #f5f5f5 family) */
    --panel:#f4f1ea;     /* panel */
    --ink:#1b2e37;       /* navy-slate — his dominant display ink (55 uses) */
    --muted:#55606a;     /* body grey (from #555555) */
    --accent:#a38f22;    /* brass-gold — his H1/footer accent (40 uses) */
    --accent-bright:#caae23;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:Georgia,"Times New Roman",serif;
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid #e4ded1;
    border-radius:10px;
    padding:56px 56px 48px;
    margin:0 0 26px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 #efe9db;
  }
  .kicker{
    font-family:"Teko",sans-serif;
    text-transform:uppercase;
    letter-spacing:.14em;
    font-weight:600;
    font-size:20px;
    color:var(--accent);
    margin-bottom:14px;
  }
  .rule{height:3px;width:64px;background:var(--accent);margin:0 0 22px;border-radius:2px}
  h1{
    font-family:"Teko",sans-serif;
    font-weight:700;
    line-height:.98;
    font-size:74px;
    letter-spacing:.01em;
    color:var(--ink);
    text-transform:uppercase;
  }
  h2{
    font-family:"Teko",sans-serif;
    font-weight:600;
    font-size:48px;
    line-height:1.02;
    text-transform:uppercase;
    letter-spacing:.01em;
    color:var(--ink);
    margin-bottom:18px;
  }
  .sub{font-size:22px;color:var(--muted);margin-top:18px;line-height:1.45;max-width:46ch}
  p.lead{font-size:21px;line-height:1.6;color:var(--ink);max-width:54ch;margin-bottom:14px}
  p.body{font-size:19px;line-height:1.62;color:var(--muted);max-width:56ch;margin-bottom:12px}
  ul{list-style:none;margin:10px 0 0}
  li{
    font-size:20px;line-height:1.5;color:var(--ink);
    padding:14px 0 14px 46px;position:relative;border-top:1px solid #e9e3d6;
    max-width:58ch;
  }
  li:first-child{border-top:0}
  li .num{
    position:absolute;left:0;top:12px;
    font-family:"Teko",sans-serif;font-weight:700;font-size:28px;color:var(--accent);
    width:34px;text-align:left;line-height:1;
  }
  li b{color:var(--ink)}
  li span.d{display:block;font-family:Georgia,serif;font-size:16px;color:var(--muted);margin-top:4px}
  .divider{background:var(--ink);border-color:var(--ink)}
  .divider .kicker{color:var(--accent-bright)}
  .divider h2{color:#fff;font-size:58px;margin:0}
  .divider .sub{color:#c6cdd2}
  .divider .rule{background:var(--accent-bright)}
  .pill{display:inline-block;font-family:"Teko",sans-serif;text-transform:uppercase;
    letter-spacing:.1em;font-size:18px;color:var(--ink);background:var(--panel);
    border:1px solid #e4ded1;border-radius:999px;padding:7px 16px;margin:6px 8px 0 0}
  .who b{color:var(--ink)}
  .credit{font-size:18px;color:var(--muted);margin-top:8px}
  .cta h2{color:#fff}
  .disc{font-size:14px;color:#aeb6bc;margin-top:26px;line-height:1.5;max-width:60ch}
  .foot{font-family:"Teko",sans-serif;text-transform:uppercase;letter-spacing:.12em;
    font-size:16px;color:var(--muted);margin-top:30px}
  .big{font-family:"Teko",sans-serif;font-weight:700;font-size:40px;color:var(--accent);line-height:1}
  @media(max-width:680px){
    .slide{padding:34px 26px;min-height:auto}
    h1{font-size:52px}h2{font-size:36px}.divider h2{font-size:40px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Complete Game Masterclass',
   h1:'Become the Obvious Choice',
   sub:'How insurance producers win on brand and relevance, not price and quotes.',
   credit:'Andy Neary, Founder of Complete Game Consulting'},

  {t:'who',
   kicker:'Who this is for',
   h2:'The producer who is good at the job and still invisible',
   lead:'You know your plans. You can run the numbers. You close when you get in the room.',
   body:'This is for the agency owner or producer who is winning but has plateaued, because what got you here will not get you to the next level.',
   pills:['Independent producers','Employee-benefits brokers','Agency owners who have plateaued']},

  {t:'body',
   kicker:'The trap',
   h2:'You are competing in a crowd that all looks the same',
   lead:'Every agent sends the same quote, makes the same call, and leans on the same carriers.',
   body:'So the prospect decides on price, because price is the only thing that looks different. You are one of many, and the market treats you that way.'},

  {t:'body',
   kicker:'The real problem',
   h2:'No one knows who you are before you call',
   lead:'The issue is not your product knowledge. It is that you are a stranger reaching out cold to people who have never heard of you.',
   body:'When you have no reach and no relevance, every deal starts from zero and every deal competes on price.'},

  {t:'divider',
   kicker:'Part one',
   h2:'Reach and Relevance Beat the Grind',
   sub:'Why the producers who win stopped chasing and started attracting.'},

  {t:'body',
   kicker:'The shift',
   h2:'Turn reach and relevance into revenue',
   lead:'A pitcher does not throw harder to get out of a jam. He repeats his mechanics until the result is inevitable.',
   body:'The same is true here. You do not out-hustle the market. You build a brand so the right prospects already know you, trust you, and come to you, so leads come to you instead of you reaching out to leads.'},

  {t:'list',
   kicker:'What changes',
   h2:'From anonymous rep to the obvious choice',
   items:[
     ['Before','Chasing cold prospects who compare you on price.'],
     ['After','A feed full of the right buyers who already see you as the expert.'],
     ['The win','You get in more rooms, and you get in them already trusted.']]},

  {t:'divider',
   kicker:'Part two',
   h2:'The Complete Game Marketing Playbook',
   sub:'The four pillars of the modern insurance sales cycle.'},

  {t:'list',
   kicker:'The playbook',
   h2:'Clarity, Content, Capture, Conversion',
   items:[
     ['Clarity','Get crystal clear on who you serve and the one message that speaks only to them.'],
     ['Content','Show up consistently where your buyers already are, so you earn relevance before the pitch.'],
     ['Capture','Turn attention into conversations, so interest does not evaporate.'],
     ['Conversion','Walk into the call already trusted, so you win on fit instead of fighting on price.']]},

  {t:'divider',
   kicker:'The engine underneath',
   h2:'The One-of-One Sales Framework',
   sub:'How elite producers become the only logical choice for their buyer.'},

  {t:'body',
   kicker:'One of one',
   h2:'Stop being one of many',
   lead:'Confidence and conviction are not personality traits. They are built, the same way a pitcher builds a repeatable delivery.',
   body:'When a producer knows exactly who they are and exactly who they serve, they stop quoting everyone and start winning the buyers who were only ever going to say yes to them.'},

  {t:'divider',
   kicker:'Part three',
   h2:'The Four Pillars of a Complete Game',
   sub:'The off-the-field discipline that makes the on-the-field result inevitable.'},

  {t:'list',
   kicker:'The four pillars',
   h2:'What a complete game is built on',
   items:[
     ['Mechanics','Master the daily habits and rituals that compound into results.'],
     ['Game Plan','Own your calendar so business development actually happens every week.'],
     ['Pitch Selection','Identify your brand and the exact audience you were built to serve.'],
     ['The Delivery','Deliver one clear message that drives massive brand awareness.']]},

  {t:'body',
   kicker:'The through-line',
   h2:'When clarity and confidence collide, action happens',
   lead:'Clarity tells you who you serve and what to say. Confidence makes you say it, consistently, in public, where buyers can find you.',
   body:'Put the two together and the grind turns into gravity. The right prospects come to you already sold on the method.'},

  {t:'body',
   kicker:'Why me',
   h2:'I built this as an undersized pitcher and an unknown producer',
   lead:'I spent years as an undersized right-hander in professional baseball, and later as a carrier rep nobody had heard of.',
   body:'I did not have the biggest arm or the biggest brand. I had mechanics, a plan, and a message. Complete Game Consulting is the playbook I wish I had as a producer, now used by award-winning brokers across the industry.'},

  {t:'list',
   kicker:'The first ninety days',
   h2:'A brand that works while you sleep',
   items:[
     ['Week 1-2','One clear message and one clearly defined buyer.'],
     ['Week 3-6','A consistent content rhythm that builds reach and relevance.'],
     ['Week 7-12','Inbound conversations from buyers who already trust you.']]},

  {t:'cta',
   kicker:'Your next move',
   h2:'Play a Complete Game',
   lead:'If you are ready to stop competing on price and become the obvious choice, let us build your playbook together.',
   body:'Book a strategy call with Andy Neary and the Complete Game team, or explore the Complete Game Mastermind.',
   foot:'Complete Game Consulting · andyneary.com',
   disc:'Educational content only. Examples reflect individual experiences and are not a promise or guarantee of results. Your results depend on your market, effort, and execution. No income or sales outcomes are guaranteed.'}
];

function slideHTML(s){
  if(s.t==='title'){
    return `<div class="slide">
      <div class="kicker">${s.kicker}</div>
      <div class="rule"></div>
      <h1>${s.h1}</h1>
      <div class="sub">${s.sub}</div>
      <div class="credit">${s.credit}</div></div>`;
  }
  if(s.t==='divider'){
    return `<div class="slide divider">
      <div class="kicker">${s.kicker}</div>
      <div class="rule"></div>
      <h2>${s.h2}</h2>
      <div class="sub">${s.sub}</div></div>`;
  }
  if(s.t==='who'){
    const pills=(s.pills||[]).map(p=>`<span class="pill">${p}</span>`).join('');
    return `<div class="slide who">
      <div class="kicker">${s.kicker}</div><div class="rule"></div>
      <h2>${s.h2}</h2>
      <p class="lead">${s.lead}</p><p class="body">${s.body}</p>
      <div>${pills}</div></div>`;
  }
  if(s.t==='list'){
    const items=s.items.map(it=>`<li><span class="num">+</span><b>${it[0]}</b><span class="d">${it[1]}</span></li>`).join('');
    return `<div class="slide">
      <div class="kicker">${s.kicker}</div><div class="rule"></div>
      <h2>${s.h2}</h2><ul>${items}</ul></div>`;
  }
  if(s.t==='cta'){
    return `<div class="slide divider cta">
      <div class="kicker">${s.kicker}</div><div class="rule"></div>
      <h2>${s.h2}</h2>
      <p class="lead" style="color:#eef1f3">${s.lead}</p>
      <p class="body" style="color:#c6cdd2">${s.body}</p>
      <div class="foot">${s.foot}</div>
      <div class="disc">${s.disc}</div></div>`;
  }
  // body
  return `<div class="slide">
    <div class="kicker">${s.kicker}</div><div class="rule"></div>
    <h2>${s.h2}</h2>
    <p class="lead">${s.lead}</p><p class="body">${s.body}</p></div>`;
}
document.getElementById('deck').innerHTML = S.map(slideHTML).join('');
</script>
</body>
</html>
