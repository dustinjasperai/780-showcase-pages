<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Intuition Is A Choice · Candace McKim</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0a2338;        /* her dominant dark navy (brand.json) */
    --panel:#102c45;
    --rule:#3a4a5c;
    --accent:#1abc9c;    /* her one distinctive non-neutral (brand.json) */
    --ink:#eef3f6;
    --muted:#9fb0bd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif;line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 46px;margin:16px 0;min-height:370px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:30px;right:36px;width:12px;height:12px;
    border-radius:50%;background:var(--accent);box-shadow:0 0 22px 6px rgba(26,188,156,.55)}
  .kicker{font-family:"Hanken Grotesk",sans-serif;font-weight:700;letter-spacing:.18em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Gilda Display",serif;font-weight:700;font-size:58px;line-height:1.04;margin-bottom:18px;letter-spacing:.01em}
  h2{font-family:"Gilda Display",serif;font-weight:600;font-size:40px;line-height:1.1;margin-bottom:16px}
  h3{font-family:"Gilda Display",serif;font-weight:600;font-size:30px;margin-bottom:10px;color:var(--accent)}
  p{font-size:18px;color:var(--ink);margin-bottom:12px;max-width:62ch}
  p.lead{font-size:21px;color:var(--muted)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:18px;padding:9px 0 9px 26px;position:relative;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:15px;width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .big{font-family:"Gilda Display",serif;font-size:38px;font-weight:600;line-height:1.18;max-width:22ch}
  .sub{color:var(--muted);font-size:19px;max-width:60ch}
  .name{margin-top:28px;font-family:"Hanken Grotesk",sans-serif;font-weight:700;color:var(--accent);letter-spacing:.03em;text-transform:uppercase;font-size:14px}
  .disclaimer{margin-top:22px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.55}
  .cta-line{font-family:"Gilda Display",serif;font-weight:600;font-size:30px;color:var(--ink);margin-top:6px}
  .n{position:absolute;bottom:20px;left:46px;font-size:12px;color:var(--rule);font-family:"Hanken Grotesk",sans-serif;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title'},
 {t:'who',k:'Who this is for',h:'You are a soul-led woman building a real business',b:['You care about doing work that matters, in a way that feels like you.','You have done the courses, hired the coaches, filled the notebooks.','And still, most days, you are second-guessing the next move.']},
 {t:'trap',k:'The trap',h:'More strategy has not made it clearer',b:['The instinct when you are stuck is to go find one more framework.','So the folder of tactics grows, and the noise grows with it.','Every decision now runs through a committee of other people opinions.']},
 {t:'reframe',k:'The reframe',big:'The problem was never a missing strategy. It is that you do not yet trust the one you already sense is right.'},
 {t:'problem',k:'Part one',h:'Strategy without self-trust stalls every time',b:['Tactics are everywhere and mostly free. Clarity is the scarce thing.','When you cannot hear your own read on a decision, you outsource it.','Outsourced decisions feel safe and land flat, because they are not yours.']},
 {t:'cost',k:'Part one',h:'What that is quietly costing you',b:['Income that swings because your offers keep changing shape.','Burnout from running a business that does not sound like you.','A steady sense that you are capable of far more than this.']},
 {t:'belief',k:'The core belief',big:'Intuition is a choice. It is a sense you can develop, and one you can decide to trust on purpose.'},
 {t:'distinguish',k:'First, what it is not',h:'Intuition is not wishful thinking',b:['It is not fear, and it is not the loudest opinion in the room.','It is the quiet, steady read underneath all of that.','The work is learning to tell the difference on purpose.']},
 {t:'part2',k:'Part two',h:'The Six Pillars',b:['The method I teach women to grow with intuition and strategy together.','Not instead of strategy. Alongside it, so you finally follow the right one.']},
 {t:'pillar',k:'Pillar one',h:'Intuitive Wisdom',sub:'Recognising your own inner signal, reading it cleanly, and telling it apart from fear and old conditioning.'},
 {t:'pillar',k:'Pillar two',h:'Powerful Practices',sub:'Divine feminine power, sustainable self-care, and boundaries, because an intuition you never rest or protect goes quiet.'},
 {t:'pillar',k:'Pillar three',h:'Mindset Magic',sub:'The 5 Keys to Mastering Your Mindset, and how to catch the unintelligent thinking patterns that override your knowing.'},
 {t:'pillar',k:'Pillar four',h:'Chakra Connection and Universal Wisdom',sub:'Energy, guides, empathy ethics, and elemental astrology, used as practical tools for reading a situation, not as decoration.'},
 {t:'pillar',k:'Pillar five',h:'Her Way to Success',sub:'The business layer: pricing, marketing, and branding done like a woman, so your strategy and your intuition point the same direction.'},
 {t:'apply',k:'In practice',h:'How a decision gets made now',b:['A decision shows up. You get your own read on it first.','You check that read against the strategy, instead of the other way round.','You move, and you keep moving, because the call was actually yours.']},
 {t:'apply',k:'In practice',h:'The shift you are really after',b:['Consistent, aligned action instead of start-stop second-guessing.','Offers that hold their shape because they came from you.','A business that grows and still feels like yours.'],note:'Educational only. No specific income or result is guaranteed.'},
 {t:'why',k:'Why me',h:'I have spent 25 years on this',b:['Intuitive business coach, TEDx speaker, and number one bestselling author.','Founder of the Intuitive Coaching Academy, where I certify women to coach this work.','I teach intuition as a skill because I have watched women learn it.']},
 {t:'recap',k:'One line to keep',big:'You do not need more complicated strategies. You need the right one, and the self-trust to follow it.'},
 {t:'cta'}
];
const TITLE={
 title:`<div class="kicker">A live masterclass with Candace McKim</div>
   <h1>Intuition Is A Choice</h1>
   <p class="lead">How soul-led women entrepreneurs grow by trusting the right strategy, not collecting more of them.</p>
   <div class="name">Candace McKim · Intuitive Coaching Academy</div>`,
 cta:`<div class="kicker">Your next step</div>
   <h2>Take this further with me</h2>
   <p class="sub">If today landed, the full method lives inside my certification program, where I train women to develop their intuition and run their business with it, pillar by pillar.</p>
   <div class="cta-line">Join the Intuitive Coaching Academy</div>
   <p class="sub">candacemckim.com</p>
   <div class="disclaimer">This masterclass is educational. No specific income or business result is guaranteed. Results vary and depend on your own effort, market, and circumstances.</div>`
};
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide';
  let inner='';
  if(s.t==='title'||s.t==='cta'){ inner=TITLE[s.t]; }
  else{
    if(s.k) inner+=`<div class="kicker">${s.k}</div>`;
    if(s.big) inner+=`<div class="big">${s.big}</div>`;
    if(s.h) inner+=`<h2>${s.h}</h2>`;
    if(s.sub) inner+=`<p class="sub">${s.sub}</p>`;
    if(s.b) inner+='<ul>'+s.b.map(x=>`<li>${x}</li>`).join('')+'</ul>';
    if(s.note) inner+=`<div class="disclaimer">${s.note}</div>`;
  }
  inner+=`<div class="n">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  d.innerHTML=inner;
  deck.appendChild(d);
});
</script>
</body>
</html>
