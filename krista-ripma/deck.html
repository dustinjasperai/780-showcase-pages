<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Secret to Authentic Self-Promotion — Krista Ripma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7ef;      /* her warm cream ground (brand.json, 30 uses) */
    --ink:#272626;     /* her charcoal body/heading (107 uses) */
    --accent:#ff6334;  /* her orange site accent */
    --highlight:#f7f667; /* her yellow accent, sparing */
    --muted:#6a6862;
    --panel:#efefe4;
    --display:'Bricolage Grotesque',system-ui,sans-serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e9e9df;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--bg);border-radius:18px;padding:64px 60px;margin:22px 0;
    min-height:560px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(39,38,38,.06),0 18px 44px -28px rgba(39,38,38,.45);
    position:relative;overflow:hidden;
  }
  .num{position:absolute;top:24px;right:30px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.04em}
  .eyebrow{font-family:var(--display);font-weight:600;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .kicker{font-family:var(--display);font-weight:600;color:var(--accent);font-size:15px;letter-spacing:.12em;text-transform:uppercase;margin-bottom:14px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,5.4vw,62px);line-height:1.04;letter-spacing:-.02em;margin-bottom:22px}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(28px,4vw,46px);line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  .lead{font-size:clamp(18px,2.1vw,23px);line-height:1.5;color:var(--muted);max-width:44ch}
  .big{font-family:var(--display);font-weight:600;font-size:clamp(30px,4.4vw,52px);line-height:1.12;letter-spacing:-.01em}
  .mark{background:linear-gradient(transparent 62%,var(--highlight) 62%);padding:0 .06em}
  ul{list-style:none;margin-top:14px}
  li{font-size:clamp(17px,2vw,21px);line-height:1.45;padding:12px 0 12px 34px;position:relative;border-top:1px solid rgba(39,38,38,.1)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:14px;background:var(--accent);border-radius:3px}
  .pillars{display:grid;grid-template-columns:1fr;gap:16px;margin-top:10px}
  .pillar{background:var(--panel);border-left:5px solid var(--accent);border-radius:10px;padding:22px 26px}
  .pillar .k{font-family:var(--display);font-weight:600;font-size:22px;margin-bottom:6px}
  .pillar .v{color:var(--muted);font-size:17px;line-height:1.45}
  .steps{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:22px}
  .step{background:var(--panel);border-radius:10px;padding:18px 14px;text-align:center}
  .step .n{font-family:var(--display);color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.1em}
  .step .t{font-family:var(--display);font-weight:600;font-size:18px;margin-top:8px}
  .section-slide{background:var(--ink);color:var(--bg)}
  .section-slide h2{color:var(--bg)}
  .section-slide .kicker{color:var(--highlight)}
  .section-slide .lead{color:#d9d8cf}
  .cta-slide{background:var(--ink);color:var(--bg)}
  .cta-slide h1{color:var(--bg)}
  .cta-slide .eyebrow{color:var(--highlight)}
  .cta-slide .lead{color:#d9d8cf}
  .cta-btn{display:inline-block;margin-top:26px;background:var(--accent);color:#fff;font-family:var(--display);font-weight:600;font-size:19px;padding:16px 30px;border-radius:999px}
  .disclaimer{margin-top:30px;font-size:13px;line-height:1.5;color:#9a988f;max-width:62ch}
  .cred{display:grid;grid-template-columns:repeat(3,auto);gap:10px 26px;margin-top:22px;font-family:var(--display);font-weight:600;color:var(--muted);font-size:15px;letter-spacing:.08em;text-transform:uppercase}
  @media(max-width:720px){.slide{padding:44px 26px;min-height:460px}.steps{grid-template-columns:repeat(2,1fr)}.cred{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Krista Ripma · Authentic Audience',
   h1:'The Secret to Authentic Self-Promotion',
   lead:'How to talk about your work with clarity and confidence, without giving yourself the ick. Self-love, service, and strategy, working together.'},

  {t:'content', kicker:'Who this is for',
   h2:'For the founder who gets weird when it is time to promote',
   lead:'You are a creative, coach, founder, or service provider. Your work is powerful. The moment you have to talk about it, everything tightens.'},

  {t:'content', kicker:'The trap', h2:'Sound familiar?',
   list:['You cringe a little every time you hit post or send','You worry you will sound salesy, braggy, or fake','You struggle to explain what you do in a way that lands','You know visibility matters, but you have no real strategy']},

  {t:'hook',
   html:'You are not bad at marketing.<br>You are <span class="mark">overdue for a self-promotion reset</span> that actually feels like you.'},

  {t:'section', kicker:'Part one', h2:'The real problem is not your marketing',
   lead:'It is the story you tell yourself about self-promotion. If promotion feels like ego or bragging, you will avoid it, and your best work stays invisible.'},

  {t:'content', kicker:'The shift', h2:'People buy from people',
   lead:'Brands with founders who show up are not winning because of fancy funnels. They win because we feel a real human behind the work. Self-promotion is not ego. It is you standing in service to your purpose and your people.'},

  {t:'section', kicker:'Part two', h2:'The framework: self-love, service, strategy',
   lead:'Three parts that only work together. This is what I walk every client through to step into their self-promotion power.'},

  {t:'framework', h2:'The three parts, up close',
   pillars:[
     {k:'1. Self-love', v:'Talk about your work without the ick. Visibility feels safe when you stop performing and start standing by what you actually do.'},
     {k:'2. Service', v:'Promotion in service to your people, not your ego. Your offer is a gift, and staying quiet keeps it from the people who need it.'},
     {k:'3. Strategy', v:'One clear message, amplified everywhere. Stop rewriting from scratch and start saying the one true thing consistently.'}
   ]},

  {t:'steps', h2:'What we do in 75 minutes together',
   steps:[{n:'01',t:'Align'},{n:'02',t:'Amplify'},{n:'03',t:'Nail'},{n:'04',t:'Speak'},{n:'05',t:'Shift'}],
   lead:'A pep talk, a strategy session, and an implementation hour in one.'},

  {t:'content', kicker:'Step 01 · Align', h2:'Align with your dream customers',
   lead:'When you know exactly who you are for, your message lands with the right people instead of trying to reach everyone and moving no one.'},

  {t:'content', kicker:'Step 02 · Amplify', h2:'Amplify your message, do not recreate it',
   lead:'Find your key benefits and talking points once. Then amplify that one clear message everywhere, instead of reinventing what you say every time you post.'},

  {t:'content', kicker:'Step 03 · Nail', h2:'Nail your key benefits',
   lead:'When you can name the real value you create, you always know what you are actually selling, and so does everyone who meets you.'},

  {t:'section', kicker:'Part three', h2:'What changes when you do this',
   lead:'A clear, grounded way to talk about your work, and a simple plan you can actually keep.'},

  {t:'content', kicker:'You walk away with', h2:'A self-promotion plan you can keep',
   list:['A grounded way to describe what you do, in one line','Key benefits and talking points you can reuse everywhere','A simple self-promotion strategy you can commit to for 90 days','A fresh mindset: promotion as service, not performance']},

  {t:'content', kicker:'The bigger idea', h2:'Build a business loved by 1,000 true fans',
   lead:'You do not need to go viral. You need a devoted audience built through honest, human-first marketing. Treat your business like it is already loved by 1,000 true fans, and show up accordingly.'},

  {t:'content', kicker:'Why learn this from me', h2:'A decade of human-first marketing',
   lead:'I have spent the last ten years helping hundreds of founders, authors, and creatives build true-fan communities through honest marketing, and finally feel at home being seen in their businesses.',
   cred:['Forbes','Entrepreneur','CBS']},

  {t:'cta', eyebrow:'Your next step', h1:'Ready to make self-promotion feel like service?',
   lead:'Join the next live masterclass, or work with me one to one to build the message and the strategy around your business.',
   btn:'Join the live masterclass',
   disclaimer:'This masterclass is educational. No specific income, outcome, or result is guaranteed. Results vary and depend on your own effort, offer, and market.'}
];

const deck = document.getElementById('deck');
S.forEach(function(s, i){
  const el = document.createElement('section');
  let cls = 'slide';
  if(s.t==='section') cls += ' section-slide';
  if(s.t==='cta') cls += ' cta-slide';
  el.className = cls;
  let inner = '<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.eyebrow) inner += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) inner += '<h1>'+s.h1+'</h1>';
  if(s.h2) inner += '<h2>'+s.h2+'</h2>';
  if(s.html) inner += '<div class="big">'+s.html+'</div>';
  if(s.lead) inner += '<p class="lead">'+s.lead+'</p>';
  if(s.list){ inner += '<ul>'; s.list.forEach(function(x){ inner += '<li>'+x+'</li>'; }); inner += '</ul>'; }
  if(s.pillars){ inner += '<div class="pillars">'; s.pillars.forEach(function(p){ inner += '<div class="pillar"><div class="k">'+p.k+'</div><div class="v">'+p.v+'</div></div>'; }); inner += '</div>'; }
  if(s.steps){ inner += '<div class="steps">'; s.steps.forEach(function(p){ inner += '<div class="step"><div class="n">'+p.n+'</div><div class="t">'+p.t+'</div></div>'; }); inner += '</div>'; }
  if(s.cred){ inner += '<div class="cred">'; s.cred.forEach(function(c){ inner += '<div>'+c+'</div>'; }); inner += '</div>'; }
  if(s.btn) inner += '<div><span class="cta-btn">'+s.btn+'</span></div>';
  if(s.disclaimer) inner += '<p class="disclaimer">'+s.disclaimer+'</p>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
