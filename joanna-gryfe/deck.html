<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Content Engine for Food Brands - People in Food</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F9F3E8;
    --panel:#fffaf0;
    --rule:#134251;
    --ink:#134251;
    --muted:#5d7176;
    --accent:#d95f48;
    --accent2:#efb071;
    --headFont:'Oswald',sans-serif;
    --bodyFont:'PT Serif',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--bodyFont);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid rgba(19,66,81,.12);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(19,66,81,.04)}
  .kicker{font-family:var(--headFont);text-transform:uppercase;letter-spacing:.22em;
    font-size:13px;font-weight:600;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--headFont);font-weight:700;font-size:52px;line-height:1.05;
    letter-spacing:.01em;margin-bottom:18px}
  h2{font-family:var(--headFont);font-weight:600;font-size:38px;line-height:1.08;
    margin-bottom:16px}
  .sub{font-size:21px;color:var(--muted)}
  .body{font-size:22px;max-width:40ch}
  .big{font-family:var(--headFont);font-weight:700;font-size:46px;line-height:1.08;
    color:var(--accent);margin-bottom:16px}
  ul{list-style:none;margin-top:10px}
  li{font-size:21px;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid rgba(19,66,81,.08)}
  li:before{content:"";position:absolute;left:0;top:21px;width:12px;height:12px;
    background:var(--accent);border-radius:3px}
  .pill{display:inline-flex;align-items:center;justify-content:center;font-family:var(--headFont);
    font-weight:700;font-size:20px;width:54px;height:54px;border-radius:50%;
    background:var(--rule);color:var(--bg);margin-bottom:18px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:8px}
  .col h3{font-family:var(--headFont);text-transform:uppercase;letter-spacing:.14em;
    font-size:14px;color:var(--muted);margin-bottom:10px}
  .col.after h3{color:var(--accent)}
  .foot{font-family:var(--headFont);text-transform:uppercase;letter-spacing:.16em;
    font-size:13px;color:var(--muted);margin-top:26px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:52ch;font-style:italic}
  .n{font-family:var(--headFont);font-size:15px;color:var(--muted);margin-bottom:8px;
    text-transform:uppercase;letter-spacing:.18em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'A live masterclass with Jo Gryfe',h:'The Content Engine for Food Brands',sub:'How to produce six months of content in one block, get on air, and actually make money from it.',foot:'People in Food'},
  {t:'agenda',h:"What we'll cover",items:['Why weekly content stalls','The content engine, in three parts','What it looks like for your brand']},
  {t:'for',h:'Who this is for',items:['You run an established food brand, product, or content platform','You are posting constantly and it is not compounding','You know your brand could be bigger than your feed']},
  {t:'trap',h:'The trap',body:'You were told the answer is to post more. So you grind out content every week, and the brand still lives and dies by the algorithm.'},
  {t:'point',h:'What the grind costs',items:['Your time, the scarcest resource in a small brand','Your edge, because everyone posts, so posts stop mattering','Your upside, because the big partnerships go to media brands']},
  {t:'reframe',kicker:'The reframe',big:'A food brand is a media brand.',body:'The brands that win do not post more. They build a content engine and run it like a studio.'},
  {t:'point',h:'What changes when you run an engine',items:['Content compounds instead of resetting every week','The brand travels across platforms and on air','Attention turns into revenue, not just reach']},
  {t:'part',n:'Part One',h:'The core problem',body:'Weekly content is a treadmill. It does not bank, it does not get you on air, and it rarely turns into real money.'},
  {t:'point',h:'Three things weekly content never does',items:['It never compounds, every week starts from zero','It never travels, it stays on one platform','It never pays, attention without a model is not revenue']},
  {t:'part',n:'Part Two',h:'The Content Engine',body:'Three moving parts, drawn from building Tiny Kitchen, Tastemade, and Rachael Ray.'},
  {t:'pillar',n:'01',h:'The Production Block',body:'Produce six months of content in one concentrated block instead of grinding weekly. Plan it, shoot it, bank it, then run it.'},
  {t:'pillar',n:'02',h:'Getting On Air',body:'Move from a digital-only presence to on-air placement. On air changes how a food brand is seen, priced, and partnered with.'},
  {t:'pillar',n:'03',h:'Make Money Off the Content',body:'Turn the content into revenue through sponsorships, endorsement deals, and platforms, instead of hoping reach becomes income.'},
  {t:'point',h:'The thread that ties it together',items:['Storytelling for your unique selling point','One story, produced once, running everywhere','A brand that looks and behaves like a media company']},
  {t:'part',n:'Part Three',h:'A brand that runs like a studio',body:'A food brand that produces in blocks, shows up on air, and earns from its content, not from the weekly grind.'},
  {t:'before',h:'Before and after',before:['Posting every week','Living on one platform','Reach with no model'],after:['Producing in blocks','On air and everywhere','Content that earns']},
  {t:'why',kicker:'Why me',h:'Jo Gryfe',body:'I built brand and business for Noma, Rachael Ray, Tastemade, and Food Network. I created Tiny Kitchen and built Tastemade studio operations. People in Food puts that experience behind your brand.'},
  {t:'cta',h:'Your next step',body:'If you want the content engine built for your food brand, the next cohort of People in Food opens by application.',action:'Apply at peoplein.food',disc:'Educational only. No income or results guarantees; outcomes vary with effort, market, and execution.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach(s=>{
  const d=el('section','slide');
  if(s.kicker)d.appendChild(el('div','kicker',s.kicker));
  if(s.n)d.appendChild(el('div','n',s.n));
  if(s.t==='pillar')d.appendChild(el('div','pill',s.n));
  if(s.t==='reframe'&&s.big)d.appendChild(el('div','big',s.big));
  if(s.h)d.appendChild(el(s.t==='title'?'h1':'h2',null,s.h));
  if(s.sub)d.appendChild(el('div','sub',s.sub));
  if(s.body)d.appendChild(el('div','body',s.body));
  if(s.items){const u=el('ul');s.items.forEach(i=>u.appendChild(el('li',null,i)));d.appendChild(u);}
  if(s.before){
    const c=el('div','cols');
    const a=el('div','col');a.appendChild(el('h3',null,'Today'));const ua=el('ul');s.before.forEach(i=>ua.appendChild(el('li',null,i)));a.appendChild(ua);
    const b=el('div','col after');b.appendChild(el('h3',null,'With the engine'));const ub=el('ul');s.after.forEach(i=>ub.appendChild(el('li',null,i)));b.appendChild(ub);
    c.appendChild(a);c.appendChild(b);d.appendChild(c);
  }
  if(s.action)d.appendChild(el('div','big',s.action));
  if(s.foot)d.appendChild(el('div','foot',s.foot));
  if(s.disc)d.appendChild(el('div','disc',s.disc));
  deck.appendChild(d);
});
</script>
</body>
</html>
