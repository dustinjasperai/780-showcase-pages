<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Earn the Conversation — a LinkedIn masterclass by Brynne Tillman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;600;800&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f9fd;
    --panel:#e9eff8;
    --ink:#15202b;
    --muted:#5b6b7b;
    --rule:#cfdaeb;
    --accent:#426bba;
    --gold:#ffc000;
    --head:'Libre Franklin',sans-serif;
    --body:'Open Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:54px 56px;margin:0 0 22px;min-height:470px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 2px rgba(21,32,43,.05)}
  .kicker{font-family:var(--head);font-weight:800;font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .kicker.gold{color:#9a7400}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--head);font-weight:800;font-size:33px;line-height:1.14;letter-spacing:-.01em;margin-bottom:18px}
  h3{font-family:var(--head);font-weight:600;font-size:22px;line-height:1.2;margin-bottom:10px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin-bottom:14px;max-width:46ch}
  p.lead{font-size:21px;color:var(--muted)}
  p.big{font-size:27px;line-height:1.35;color:var(--ink);max-width:40ch}
  .muted{color:var(--muted)}
  .accent{color:var(--accent)}
  ul{list-style:none;margin:8px 0 0}
  li{font-size:18.5px;line-height:1.5;padding:11px 0 11px 30px;position:relative;border-top:1px solid var(--rule);max-width:50ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:2px;background:var(--accent)}
  li.g::before{background:var(--gold)}
  .pilltag{display:inline-block;font-family:var(--head);font-weight:600;font-size:12.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:5px 13px;margin-bottom:16px}
  .foot{margin-top:26px;font-size:14px;color:var(--muted);font-family:var(--head);font-weight:600;letter-spacing:.04em}
  .brandline{display:flex;align-items:center;gap:12px;margin-top:30px}
  .brandline .dot{width:11px;height:11px;border-radius:3px;background:var(--accent)}
  .brandline .dot.g{background:var(--gold)}
  .card{background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:20px 22px;margin-top:10px;max-width:52ch}
  .card p{margin-bottom:0;font-size:18px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:8px}
  .mini{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 20px}
  .mini h3{font-size:18px;color:var(--accent);margin-bottom:6px}
  .mini p{font-size:16px;color:var(--muted);margin:0;max-width:none}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .pagenum{font-size:12px;color:var(--muted);font-family:var(--head);letter-spacing:.1em;margin-bottom:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',
    kicker:'A LinkedIn masterclass',
    h1:'Earn the Conversation',
    sub:'How to turn LinkedIn into a steady flow of trust-based conversations with the right buyers, without a single salesy pitch.',
    foot:'Brynne Tillman · Social Sales Link'},

  {t:'audience',
    kicker:'Who this is for',
    h2:'For sellers who are tired of being ignored on LinkedIn',
    lead:'This is for sales professionals and revenue teams who live on LinkedIn and want pipeline from it.',
    items:[
      'You send connection requests and the pitch goes out in message two.',
      'Your profile reads like a resume, so buyers skim it and move on.',
      'You are busy on LinkedIn, but very little of it turns into real conversations.'
    ]},

  {t:'hook',
    kicker:'The uncomfortable truth',
    big:'Cold-pitching on LinkedIn does not start relationships. It ends them.',
    p:'The harder you sell in the first message, the faster the buyer tunes you out. The connect-and-pitch is just the loudest symptom of a transactional mindset, and buyers can feel it instantly.'},

  {t:'audience', kicker:'The real cost',
    h2:'What the connect-and-pitch quietly costs you',
    lead:'Every rushed pitch spends something you do not get back.',
    items:[
      'A first impression you only get to make once, burned in one message.',
      'Connections who now ignore you instead of replying.',
      'Hours of activity that produce noise in the feed, not pipeline.'
    ]},

  {t:'reframe', kicker:'What buyers want', h2:'Buyers want a trusted advisor, not another pitch',
    p:'Buyers want to engage with professionals who listen first, bring insights, and add value before asking for a meeting. The seller who does that is the one who gets the reply.',
    lead:'Listen first. Bring insight. Earn the meeting.'},

  {t:'part', n:'Part One', h2:'The real problem is the mindset, not the message',
    p:'Most reps open with some version of "We help companies do X." It centers you, not the buyer, so the buyer stops reading. The fix is not a cleverer opener. It is a different starting point.',
    card:'Detach from what the prospect is worth to you. Attach to what you are worth to the prospect.'},

  {t:'reframe', kicker:'The shift', h2:'Slow down the outreach to speed up the outcome',
    p:'Trusted advisors do not rush the ask. They earn the right to the conversation first, by bringing an insight, a resource, or a relevant perspective before they ever ask for anything.',
    lead:'Value first. The meeting is the result, not the opening move.'},

  {t:'part', n:'Part Two', h2:'The method: four moves that earn the conversation',
    p:'You do not need more activity. You need the right four moves, run consistently. Here is the sequence we teach.'},

  {t:'pillar', tag:'Move 01', h2:'Rebuild your profile as a resource, not a resume',
    p:'Your profile is the landing page every buyer checks before they reply. We turn it from a list of your jobs into a page that speaks to their problem and positions you as the person worth talking to.',
    items:['Lead with the buyer\'s outcome, not your title','Make every section answer "why should they talk to you"','Give a reason to connect before you ever reach out']},

  {t:'pillar', tag:'Move 02', h2:'Map the buyers and the warm paths in',
    p:'Using LinkedIn and Sales Navigator, we pinpoint the right people and the relationships that already connect you to them. Most of your next deals are hiding in connections you already have.',
    items:['Filter to the exact buyers and influencers you want','Map mutual connections and referral paths','Nurture first-degree relationships for warm introductions']},

  {t:'pillar', tag:'Move 03', h2:'Earn the conversation by leading with value',
    p:'Instead of pitching, you share insight and engage in a way that builds credibility. You become the resource buyers want to hear from, so the conversation starts on their terms and your trust is already banked.',
    items:['Open with a relevant insight, never a product line','Comment and engage where your buyers already are','Ask the question that earns a reply, not a pitch']},

  {t:'pillar', tag:'Move 04', gold:true, h2:'Scale it in your own voice with CRISPY AI prompts',
    p:'This is where most teams break: doing it well, consistently, at volume. Custom AI prompts built on the CRISPY framework let you produce on-brand, in-your-voice profiles, messages, content and pre-call plans in minutes, so the method actually sticks.',
    items:['Profile and messaging drafted in your voice, not generic AI','Pre-call planning and discovery questions in seconds','Consistency across the whole team without the robotic tone']},

  {t:'why', kicker:'The system', h2:'The four moves, working together',
    p:'None of the four moves does much alone. Run as one loop, they turn a cold profile into a referral engine.',
    items:[
      'A resource profile gives buyers a reason to look closer.',
      'Buyer mapping points that profile at exactly the right people.',
      'Value-led engagement earns the conversation on their terms.',
      'CRISPY prompts make all three repeatable, in your voice, every week.'
    ]},

  {t:'audience', kicker:'This is not theory', h2:'The results sellers report',
    lead:'Real outcomes from sellers who learned this method (their words, on our site).',
    items:[
      'A VP of staffing: "Closed more than $3 million in sales and doubled my commission."',
      'A senior account executive: three first-call appointments with Fortune 500 firms in three weeks.',
      'A brand strategist: LinkedIn engagement grew from a few likes to 500-plus on every post.'
    ]},

  {t:'part', n:'Part Three', h2:'A week of earning conversations',
    p:'None of this is more hours on the platform. It is the same time, spent on the four moves instead of the scroll.',
    grid:[
      ['Monday','Review buyer map and warm paths. Pick the ten conversations worth earning this week.'],
      ['Midweek','Share one insight. Engage where buyers are. Draft outreach with your CRISPY prompts.'],
      ['Ongoing','Nurture the replies into conversations. Convert trust into booked calls, not cold asks.'],
      ['The compounding part','Shorter time-to-conversation, warmer intros, and a profile that keeps working while you sleep.']
    ]},

  {t:'why', kicker:'Why learn this here',
    h2:'This is the method, from the people who wrote the book on it',
    p:'Brynne Tillman is a globally recognized LinkedIn and social-selling strategist and founder of Social Sales Link.',
    items:[
      'Co-author of The LinkedIn Edge (with Jeb Blount) and Prompt Writing Made Easy, the book behind the CRISPY framework',
      'Host of the Making Sales Social podcast',
      'Has trained revenue teams at firms like Penn Mutual, BNY Mellon | Pershing, and Vizient'
    ]},

  {t:'hook', kicker:'The whole idea, in one line',
    big:'Stop selling on LinkedIn. Start earning the conversation.',
    p:'When you lead with value and let trust do the work, the meeting stops being something you chase and becomes something buyers offer you.'},

  {t:'cta',
    kicker:'Where to go from here',
    h2:'Put the four moves to work this week',
    p:'If this is how you want your team to show up on LinkedIn, the next step is simple: come learn and practice it with us inside Social Sales Link, where the live coaching, the training library, and the CRISPY prompt tools all live.',
    cta:'Join Social Sales Link or book a call with Brynne at socialsaleslink.com',
    disc:'This masterclass is educational. It shares a sales methodology and frameworks; it is not a guarantee of any specific sales result, revenue, or income. Outcomes depend on your market, your effort, and your execution.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide';
  let h = '';
  const page = '<div class="pagenum">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  if (s.t === 'title') {
    h = page + '<div class="kicker">'+s.kicker+'</div><h1>'+s.h1+'</h1><p class="lead">'+s.sub+'</p>'
      + '<div class="brandline"><span class="dot"></span><span class="dot g"></span><span class="foot">'+s.foot+'</span></div>';
  } else if (s.t === 'hook') {
    h = page + '<div class="kicker">'+s.kicker+'</div><p class="big">'+s.big+'</p><p class="muted">'+s.p+'</p>';
  } else if (s.t === 'part') {
    h = page + '<div class="kicker">'+s.n+'</div><h2>'+s.h2+'</h2>' + (s.p?'<p>'+s.p+'</p>':'');
    if (s.card) h += '<div class="card"><p>'+s.card+'</p></div>';
    if (s.grid) { h += '<div class="grid2">'; s.grid.forEach(g=>{ h += '<div class="mini"><h3>'+g[0]+'</h3><p>'+g[1]+'</p></div>'; }); h += '</div>'; }
  } else if (s.t === 'reframe') {
    h = page + '<div class="kicker">'+s.kicker+'</div><h2>'+s.h2+'</h2><p>'+s.p+'</p><p class="lead">'+s.lead+'</p>';
  } else if (s.t === 'audience') {
    h = page + '<div class="kicker">'+s.kicker+'</div><h2>'+s.h2+'</h2><p class="lead">'+s.lead+'</p><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  } else if (s.t === 'pillar') {
    h = page + '<span class="pilltag">'+s.tag+'</span><h2>'+s.h2+'</h2><p>'+s.p+'</p><ul>'+s.items.map(x=>'<li'+(s.gold?' class="g"':'')+'>'+x+'</li>').join('')+'</ul>';
  } else if (s.t === 'why') {
    h = page + '<div class="kicker">'+s.kicker+'</div><h2>'+s.h2+'</h2><p>'+s.p+'</p><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>';
  } else if (s.t === 'cta') {
    h = page + '<div class="kicker gold">'+s.kicker+'</div><h2>'+s.h2+'</h2><p>'+s.p+'</p><div class="card"><p><strong>'+s.cta+'</strong></p></div><p class="disc">'+s.disc+'</p>';
  }
  d.innerHTML = h;
  deck.appendChild(d);
});
</script>
</body>
</html>
