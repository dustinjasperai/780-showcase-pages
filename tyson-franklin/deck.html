<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Thriving Podiatry Business Model</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Open+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FBF9F6; --panel:#F2EEE7; --rule:#E4DFD4;
    --ink:#262322; --ink-soft:#55524D; --accent:#AE0F21; --navy:#1C2E3B; --dim:#8B857A;
  }
  html,body{height:100%}
  body{background:#DCD6CB;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#DCD6CB}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Poppins',-apple-system,sans-serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.6vw}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-size:1.45vw;color:var(--ink-soft);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-size:1.7vw;color:var(--ink-soft);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.3vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:var(--navy);align-items:center;text-align:center}
  .t-dark h1{font-family:'Poppins',sans-serif;font-size:3.5vw;max-width:86%;color:#FBF9F6;font-weight:500}
  .t-cta{background:var(--navy);align-items:center;text-align:center}
  .t-cta h1{color:#FBF9F6;font-size:3.7vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid #E8A19C;color:#FBF9F6;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.88vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-dark .disc,.t-cta .disc{color:#B8AFA6}
  .path-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-path{right:7.5%;bottom:9%;width:24vw}
  .corner-path{right:6%;bottom:7.5%;width:10vw;opacity:.55}
  .brandline{font-size:1.24vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:400;letter-spacing:.01em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.3vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Tyson Franklin</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- roadmap motif: a stepped line through three checkpoints, capped with a small footprint mark -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="path-motif" viewBox="0 0 260 140">
  <g fill="none" stroke-width="2.2" stroke-linecap="round">
    <path d="M14 118 H90 V78 H166 V42 H236" stroke="#AE0F21" opacity="0.85"/>
    <circle cx="14" cy="118" r="4.2" fill="#AE0F21" opacity="0.85"/>
    <circle cx="90" cy="78" r="4.2" fill="#AE0F21" opacity="0.85"/>
    <circle cx="166" cy="42" r="4.2" fill="#AE0F21" opacity="0.85"/>
    <path d="M228 30 q4 -8 10 -6 q6 2 4 10 q-2 8 -10 8 q-8 0 -8 -6 q0 -4 4 -6z" fill="#AE0F21" opacity="0.7" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Thriving Podiatry Business Model',sub:'How a podiatrist who has personally opened, bought, relocated, or sold 20+ practices builds one that actually works, in one hour.',brand:true,path:'title'},
 {t:'normal',k:'Who this is for',title:'You are excellent at the clinical work. The business is a different skill.',body:'You trained for the foot, not the front desk, the recalls, or the marketing plan. Most podiatry practices are run by someone who never got taught the business side at all.'},
 {t:'normal',k:'The trap',title:'A borrowed system is not the same as a proven one.',body:'Plenty of coaches will hand you a template. Very few have personally run the practice they are describing. A system that has never been tested on a real clinic is a guess with good branding.'},
 {t:'dark',title:'You do not need more theory. You need what has actually worked, 20-plus times over.'},

 {t:'section',idx:'Part One',title:'The Team and the Conversation'},
 {t:'normal',k:'Culture first',title:'Align the team with what you actually believe, not just what you say.',body:'Every practice has an extended team, front desk, associates, even the accountant. If they are not aligned with your values and your standards, the business fights itself every day.'},
 {t:'normal',k:'Pre-framing',title:'Selling without selling.',body:'The way you introduce a treatment plan decides whether a patient accepts it before you have said the price. Pre-framing directs the conversation so the recommendation lands as obvious, not pushed.'},
 {t:'dark',title:'A practice runs on conversations long before it runs on marketing.'},

 {t:'section',idx:'Part Two',title:'The Three Systems That Bring Patients Back'},
 {t:'normal',k:'Recalls',title:'A recall is not a reactivation.',body:'A recall brings a patient back on schedule, before they have gone quiet. It is the easiest revenue in the practice and the most commonly ignored.'},
 {t:'normal',k:'Reactivation',title:'The patient who has already gone quiet.',body:'Reactivation is a different conversation than a recall. It has to acknowledge the gap and give a real reason to come back, not just a reminder.'},
 {t:'normal',k:'Incomplete prescriptions',title:'The treatment plan that was agreed to and never finished.',body:'An incomplete prescription is money and outcomes left on the table. Chasing it properly is its own system, not an afterthought on a busy Friday.'},

 {t:'section',idx:'Part Three',title:'The Roadmap and the GPS'},
 {t:'normal',k:'The Roadmap',title:'The yearly marketing plan most practices never write down.',body:'A Roadmap is the whole year mapped out, so marketing is a plan you follow, not a scramble every time the calendar looks thin.'},
 {t:'normal',k:'The GPS',title:'The daily and weekly plan that actually gets the Roadmap followed.',body:'A plan for the year is useless without a plan for Tuesday. The GPS is the daily and weekly tactical layer that keeps the practice moving toward the Roadmap.'},
 {t:'normal',k:'Punctuated Equilibrium',title:'Track the handful of numbers that actually tell you the truth.',body:'Most practices track everything and learn nothing. Punctuated Equilibrium is knowing the small set of numbers that actually reveal whether the business is moving or stalling.'},
 {t:'dark',title:'A Roadmap without a GPS is a wish. A GPS without a Roadmap is busywork.'},

 {t:'section',idx:'Your next step',title:'A Free Discovery Call'},
 {t:'normal',k:'Why me',title:'I have personally opened, bought, relocated, or sold 20-plus podiatry practices.',body:'I am Tyson Franklin. Every system in this masterclass is one I have used myself, or helped another podiatrist introduce successfully. I will never hand you one I have not proven first.'},
 {t:'normal',k:'How we begin',title:'A free 30-minute conversation about your practice.',body:'We look at where the business is losing ground today and which of these systems would move the needle fastest. You work with me directly, never handed off to an employee coach.'},
 {t:'cta',title:'Book your free 30-minute discovery call.',chips:['Book the discovery call','Explore mentoring with Tyson'],disc:'Educational content for podiatry practice owners only. No income, revenue, or business result is guaranteed. Results vary by owner, practice, and market.'},
];

const deck=document.getElementById('deck');
function pathMotif(kind){return `<svg class="path-motif ${kind==='title'?'title-path':'corner-path'}"><use href="#path-motif"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Thriving Podiatry Business Model</b> &middot; Tyson Franklin</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.path) h+=pathMotif(s.path);
  else if(s.t==='title') h+=pathMotif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
