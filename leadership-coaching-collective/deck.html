<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Leaders Grow Faster in a Room of Peers | Leadership Coaching Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f3efe4;
    --panel:#ffffff;
    --ink:#1c2b24;
    --ink-soft:#44524a;
    --ink-muted:#7a857c;
    --rule:#e3ddcf;
    --accent:#036936;
    --accent2:#f7941d;
  }
  html,body{height:100%;}
  body{
    font-family:'Inter',-apple-system,sans-serif;
    background:var(--bg); color:var(--ink);
    display:flex; align-items:center; justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{ width:min(960px,94vw); }
  .slide{
    display:none; background:var(--panel); border:1px solid var(--rule);
    border-radius:14px; padding:64px 60px; min-height:560px;
    box-shadow:0 18px 50px rgba(28,43,36,0.08);
    flex-direction:column; justify-content:center;
  }
  .slide.active{ display:flex; }
  .kicker{ font-size:12px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:22px; }
  h1{ font-family:'Playfair Display',Georgia,serif; font-weight:700; font-size:46px; line-height:1.12; letter-spacing:-0.01em; }
  h2{ font-family:'Playfair Display',Georgia,serif; font-weight:600; font-size:34px; line-height:1.2; margin-bottom:20px; }
  .sub{ font-size:20px; color:var(--ink-soft); margin-top:22px; line-height:1.55; }
  .byline{ margin-top:40px; font-size:15px; color:var(--ink-muted); }
  .byline strong{ color:var(--ink); font-weight:600; }
  p.body{ font-size:19px; color:var(--ink-soft); line-height:1.62; margin-bottom:14px; }
  ul{ list-style:none; margin-top:10px; }
  li{ font-size:19px; color:var(--ink-soft); line-height:1.5; padding-left:28px; position:relative; margin-bottom:14px; }
  li::before{ content:""; position:absolute; left:0; top:11px; width:10px; height:10px; border-radius:50%; background:var(--accent); }
  .big{ font-family:'Playfair Display',Georgia,serif; font-size:30px; color:var(--ink); line-height:1.3; }
  .accent{ color:var(--accent); }
  .partnum{ font-family:'Playfair Display',Georgia,serif; font-size:19px; color:var(--accent2); font-weight:600; margin-bottom:10px; letter-spacing:0.02em; }
  .pillar-name{ font-family:'Playfair Display',Georgia,serif; font-size:30px; color:var(--ink); margin-bottom:14px; }
  .disclaimer{ margin-top:30px; font-size:13px; color:var(--ink-muted); line-height:1.5; border-top:1px solid var(--rule); padding-top:16px; max-width:640px; }
  .cta-step{ font-size:21px; color:var(--ink-soft); margin-top:18px; line-height:1.5; }
  .nav{ position:fixed; bottom:20px; right:26px; font-size:13px; color:var(--ink-muted); font-weight:500; }
  .hint{ position:fixed; bottom:20px; left:26px; font-size:13px; color:var(--ink-muted); }
  @media (max-width:640px){ .slide{ padding:40px 26px; min-height:70vh;} h1{font-size:32px;} h2{font-size:26px;} .sub{font-size:17px;} p.body,li{font-size:17px;} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint">Use arrow keys or click to move</div>
<div class="nav"><span id="cur">1</span> / <span id="tot">1</span></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass', h1:'Why Leaders Grow<br>Faster in a Room of Peers', sub:'The one hour that changes how your leaders carry pressure, make decisions, and bring their teams with them.', byline:'With <strong>Alex Carleton</strong> and <strong>Melissa Bloom</strong> &middot; Leadership Coaching Collective'},
  {t:'for', kicker:'Who this is for', h2:'If you lead, and you are a little alone in it', body:['This is for rising leaders stepping into bigger roles, new managers learning to lead people instead of tasks, and seasoned leaders steering a team through change.'], list:['You can read every leadership book and still freeze in the moment that counts.','The higher you go, the fewer honest mirrors you have.','You were promoted for being good at the work, not for being prepared to lead the people.']},
  {t:'reframe', kicker:'The reframe', big:'The problem was never that you needed more information.<br>It is that you have been trying to grow as a leader <span class="accent">alone</span>.'},
  {t:'section', partnum:'Part One', h2:'The core problem'},
  {t:'point', kicker:'How leaders are usually developed', h2:'Two options, both lonely', body:['Most leadership development is a solo activity. You get a one to one coach, or you get dropped into a course and left to apply it by yourself.'], list:['One to one is powerful, but it happens in a vacuum, away from real peers and real stakes.','A self paced course gives you frameworks and no one to practise them with.','Either way, you go back to your desk and nothing in the room has changed.']},
  {t:'point', kicker:'Why it does not stick', h2:'Insight without a room fades by Monday', body:['Leadership is not a body of knowledge. It is a set of behaviours you perform in front of other people, under pressure.'], list:['You cannot rehearse hard conversations against a workbook.','Without peers, you assume your struggle is unique, so you hide it.','Hidden struggle is slow struggle.']},
  {t:'point', kicker:'What it costs', h2:'The quiet price of growing alone', list:['Decisions get slower because you are second guessing with no sounding board.','Good leaders plateau and start to wonder if the next level is for them.','Teams feel the hesitation before they can name it.']},
  {t:'section', partnum:'Part Two', h2:'The method: the cohort'},
  {t:'pillar', partnum:'Pillar 1', pillar:'The power of shared experience', body:['Put leaders facing the same challenges in one room and something shifts. They stop performing and start telling the truth.'], list:['Your hardest problem is almost never yours alone.','A peer who solved it last quarter is worth more than any slide.','Shared experience turns private doubt into collective progress.']},
  {t:'pillar', partnum:'Pillar 2', pillar:'A safe space for growth', body:['Real development needs psychological safety. We build trust fast so the group can do honest work.'], list:['Honest dialogue, constructive feedback, and shared problem solving, on purpose.','A place to be unsure out loud before you have to be certain in front of your team.','Safety is not softness. It is what makes hard feedback usable.']},
  {t:'pillar', partnum:'Pillar 3', pillar:'Your goals, the group as the engine', body:['A cohort is not a class. Each leader keeps their own objective at the centre; the group is the engine that moves it.'], list:['Personalised feedback, in a room of people who get it.','You leave with your own next step, not a generic takeaway.','The peer network outlasts the program.']},
  {t:'pillar', partnum:'Pillar 4', pillar:'Evidence based, practised between sessions', body:['This is an evidence based development program, not a pep talk. The work happens in your real week.'], list:['Apply what you learn immediately in live workplace situations.','Deeper awareness of what actually drives you as a leader.','Pause, think, and respond with intention instead of reacting.']},
  {t:'point', kicker:'How a cohort runs', h2:'What the room looks like', list:['A small group of peers who meet live over a set number of weeks.','Facilitated conversation, not lecture.','Real situations brought in, worked on together, and tested before the next session.']},
  {t:'section', partnum:'Part Three', h2:'Your cohort, in practice'},
  {t:'point', kicker:'Built around real leaders', h2:'Four ways in', list:['Nonprofit Leaders, working within real constraints toward mission and funding goals.','Women Leaders, building consensus and advocacy in rooms not built for them.','Technology Leaders, moving from brilliant engineer to people leader.','Build Your Own, an in house cohort for one organisation.']},
  {t:'point', kicker:'What changes', h2:'Where a leader lands in ninety days', list:['More confidence to lead through uncertainty and seek other perspectives.','New tools to communicate and motivate that bring out the best in a team.','A network of peers they keep calling long after the cohort ends.']},
  {t:'credibility', kicker:'Why us', h2:'Two coaches, one belief', body:['Alex Carleton and Melissa Bloom bring thirty five years of leading and twenty years of coaching, and host the Practically Coaching podcast.'], big:'We believe leadership starts with being human, and that leaders do not grow in isolation.'},
  {t:'recap', kicker:'The one idea', big:'Leaders do not grow alone.<br>They grow in a room of <span class="accent">peers who tell the truth</span>.'},
  {t:'cta', kicker:'Your next step', h2:'Join a cohort', cta:['If this is the kind of growth you want for yourself or your leaders, the next step is a short conversation to find the right cohort.'], disclaimer:'This masterclass is educational. No specific result, outcome, or income is guaranteed. Results vary based on your context, effort, and organisation.'}
];

const stage = document.getElementById('stage');
function esc(x){return x||'';}
function render(s){
  let h = '';
  if(s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if(s.partnum) h += `<div class="partnum">${s.partnum}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.pillar) h += `<div class="pillar-name">${s.pillar}</div>`;
  if(s.big) h += `<div class="big">${s.big}</div>`;
  if(s.body) s.body.forEach(p=> h += `<p class="body">${p}</p>`);
  if(s.list){ h += '<ul>'; s.list.forEach(li=> h += `<li>${li}</li>`); h += '</ul>'; }
  if(s.cta) s.cta.forEach(p=> h += `<p class="cta-step">${p}</p>`);
  if(s.sub) h += `<div class="sub">${s.sub}</div>`;
  if(s.byline) h += `<div class="byline">${s.byline}</div>`;
  if(s.disclaimer) h += `<div class="disclaimer">${s.disclaimer}</div>`;
  return `<div class="slide active">${h}</div>`;
}
let i = 0;
function show(n){
  i = Math.max(0, Math.min(S.length-1, n));
  stage.innerHTML = render(S[i]);
  document.getElementById('cur').textContent = i+1;
  document.getElementById('tot').textContent = S.length;
}
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(i+1);
  if(e.key==='ArrowLeft') show(i-1);
});
stage.addEventListener('click', ()=> show(i+1));
show(0);
</script>
</body>
</html>
