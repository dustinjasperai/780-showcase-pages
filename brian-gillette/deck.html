<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Feel-Good Close &middot; Brian Gillette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5fbfa; --panel:#e3f3f1; --rule:#cfe8e4;
    --accent:#009689; --accent2:#005f5a;
    --ink:#022f2e; --grey:#4a5565; --dim:#8a97a0;
  }
  html,body{height:100%}
  body{background:#dbeeeb;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dbeeeb}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .38s ease;
    display:flex;flex-direction:column;justify-content:flex-end;padding:8% 9% 13% 9%}
  .slide.active{opacity:1;visibility:visible}
  /* a single steady ledger rule under the headline, "the calm close" register */
  .t-normal h1, .t-hit h1{position:relative;padding-bottom:2.2vh}
  .t-normal h1::after, .t-hit h1::after{content:'';position:absolute;left:0;bottom:0;height:2px;width:5.6vw;background:var(--accent)}
  .kicker{font-family:'Space Mono',monospace;font-size:.82vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);margin-bottom:2.6vh}
  h1{font-family:'Inter',-apple-system,sans-serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title{justify-content:center}
  .t-title h1{font-size:4.2vw;max-width:78%;color:var(--ink);font-weight:700}
  .t-title .sub{font-family:'Inter',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:3.2vh;max-width:64%;line-height:1.62;font-weight:300}
  .t-normal h1{font-size:2.6vw;max-width:82%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:2.8vh;max-width:70%;line-height:1.62;font-weight:300}
  .t-section{background:var(--panel);justify-content:center;border-left:1.6vw solid var(--accent)}
  .t-section .idx{font-family:'Space Mono',monospace;font-size:.95vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);margin-bottom:2.4vh}
  .t-section h1{font-size:3.6vw;max-width:74%;font-weight:700}
  .t-hit{background:var(--panel);justify-content:center;align-items:flex-start}
  .t-hit h1{font-size:2.8vw;max-width:76%;color:var(--ink);line-height:1.2;font-weight:600}
  .t-hit .body{font-family:'Inter',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3vh;max-width:62%;font-weight:300}
  .t-cta{background:var(--ink);justify-content:center;align-items:center;text-align:center;border-top:1.1vh solid var(--accent)}
  .t-cta h1{font-size:3.2vw;max-width:78%;color:#f5fbfa}
  .t-cta h1::after{display:none}
  .chips{display:flex;gap:1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{font-family:'Space Mono',monospace;border:1.5px solid var(--accent);color:var(--accent);padding:1.2vh 1.8vw;font-size:.98vw;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
  .brandline{font-family:'Space Mono',sans-serif;font-size:.9vw;color:#9cb8b3;margin-top:3.6vh;font-weight:700;letter-spacing:.16em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .disc{position:absolute;left:9%;right:9%;bottom:4.6vh;font-family:'Inter',sans-serif;font-size:.78vw;color:var(--dim);line-height:1.45;font-weight:300}
  .t-cta .disc{text-align:center;bottom:3.4vh;color:#7fa39c}
  .idxmark{position:absolute;pointer-events:none;font-family:'Space Mono',monospace;font-weight:700;letter-spacing:.2em}
  .idxmark.big{right:6%;top:9%;font-size:6vw;color:var(--rule)}
  .idxmark.small{right:7%;top:11%;font-size:2.4vw;color:var(--rule)}
  .hud{position:fixed;left:0;right:0;bottom:0;height:3px;background:rgba(2,47,46,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:12px;right:18px;font-family:'Space Mono',monospace;font-size:11px;letter-spacing:.2em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Space Mono',monospace;font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:11px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:10px;color:var(--dim);z-index:20;letter-spacing:.12em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.4vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:2.9vw}
    .t-title .sub{font-size:3.1vw}.t-section h1{font-size:6.8vw}.t-hit h1{font-size:5.6vw}.t-cta h1{font-size:6.4vw}.chip{font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Feel-Good Close</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The Feel-Good Close',sub:'How to sell managed services without fear-based tactics, taught from the same framework behind Feel-Good MSP and The MSP Sales Podcast.',brand:true,idx:'01'},

 {t:'normal',k:'Who this is for',title:'MSP owners whose sales process runs on urgency and FUD.',body:'Fear, uncertainty, and doubt closes deals, but it also burns out the rep who has to run it every day, and it attracts clients who bought the scare, not the relationship. If your team dreads the pitch, this is for you.',idx:'02'},
 {t:'normal',k:'What you will walk away with',title:'A way to sell managed services that your team can actually stand behind.',body:'Not a script to memorize. A repeatable, practiced process built on listening and empathy instead of shock-and-awe, designed to be rehearsed until it becomes muscle memory.',idx:'03'},
 {t:'normal',k:'An honest note',title:'This is education, not a promise.',body:'Every MSP carries a different book of business and a different sales team. What matters is applying the version of this process that fits your shop.',disc:'Educational content. Nothing here is a promise of income, growth, or business results. No outcome is guaranteed and results vary.',idx:'04'},
 {t:'normal',k:'Who is teaching this',title:'Brian Gillette. Founder of Feel-Good MSP, host of The MSP Sales Podcast.',body:'15 years in sales, in the MSP channel specifically since 2017. Author of "How To Sell a Sh*tload of Managed Services." Creator of the Feel-Good Close and the 7-Step Scaling Framework.',idx:'05'},

 {t:'section',idx:'Part One',title:'Why Fear-Based Selling Breaks'},
 {t:'normal',k:'The default posture, named',title:'Most MSP sales training is built on fear. Yours does not have to be.',body:'Shock-and-awe pitches, worst-case-breach stories, urgency countdowns: it works in the short term, and it trains your rep to feel like a con artist every single call.',idx:'07'},
 {t:'hit',title:'A close built on fear only works while the fear holds. A close built on trust keeps working after the sale.',body:'Nothing about that changes until the process itself stops depending on scaring the prospect into moving.',idx:'HIT'},
 {t:'normal',k:'The hidden cost',title:'Fear-sold clients churn faster and refer less.',body:'A prospect who bought the scare has no relationship with your team, only a temporary anxiety response. The first competitor with a calmer pitch, or a quiet renewal season, is when they leave.',idx:'09'},
 {t:'normal',k:'What most owners try instead',title:'Hiring a "hunter" and hoping the numbers cover the churn.',body:'It works until the hunter burns out or the pipeline dries up, and the shop is exactly as dependent on fear-selling as it was before. More reps running the same broken process is not a fix.',idx:'10'},

 {t:'section',idx:'Part Two',title:'The Feel-Good Close'},
 {t:'normal',k:'Sell with empathy, not urgency',title:'Listen first, communicate with empathy, and stop leading with fear.',body:'The Feel-Good Close is intentional and strategic, not just "being nice." It is a structured close built on integrity, authenticity, and a win-win outcome, rehearsed like any other repeatable skill.',idx:'12'},
 {t:'hit',title:'If your close only works because the prospect is scared, it is not a system yet. It is a threat only you can make convincingly.',idx:'HIT'},
 {t:'normal',k:'The 7-Step Scaling Framework',title:'A named, practiced framework for growing MRR without compromising your values.',body:'Built for role-play and repetition until the steps become muscle memory, not a one-time script. The same structure whether you are the owner closing or handing it off to your first sales hire.',idx:'14'},
 {t:'normal',k:'ICP first, not "any business with 20 seats"',title:'A real ideal customer profile: demographics, psychographics, and specific use cases.',body:'Most MSP sales training skips straight to the pitch. The Feel-Good Close starts with who you are actually built to serve, so the empathy in the close is real, not performed.',idx:'15'},

 {t:'section',idx:'Part Three',title:'What Changes For Your Team'},
 {t:'normal',k:'Mindset Monday',title:'A weekly practice for the part of selling that training alone never fixes.',body:'Limiting beliefs, the fear of rejection, the discomfort of a "no": the emotional side of selling gets its own recurring session, not a one-time pep talk buried in onboarding.',idx:'17'},
 {t:'hit',title:'The MSP that sells on trust builds a sales team that wants to stay.',idx:'HIT'},
 {t:'normal',k:'Proof, not theory',title:'A 15-year sales career, entirely inside the MSP channel since 2017.',body:'The framework is named, taught weekly on The MSP Sales Podcast, and documented in his own book, not a one-off talk.',idx:'19'},
 {t:'cta',title:'Sell with empathy. Close with integrity. Build a team that stays.',chips:['The Feel-Good Close','Executive Partnership & Sales Accelerator'],brand:true,disc:'Educational content only. No income, growth, or business result is guaranteed. Results vary.'},
];

const deck=document.getElementById('deck');
function idxMark(kind,label){return `<div class="idxmark ${kind==='big'?'big':'small'}">${label||''}</div>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1>`;
  } else {
    if(s.k) h+=`<div class="kicker">${s.k}</div>`;
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">The Feel-Good <b>Close</b> &middot; Brian Gillette</div>`;
  }
  if(s.idx && s.t!=='section') h+=idxMark(s.idx==='HIT'?'small':'big', s.idx==='HIT'?'':('SEC.'+s.idx));
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
