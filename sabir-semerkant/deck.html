<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The 8-D Method | A Masterclass with Sabir Semerkant</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#faf8fc;
    --panel:#f2eef7;
    --ink:#1a1524;
    --ink-soft:#3a3444;
    --ink-muted:#6b6478;
    --rule:#e3dcec;
    --accent:#562367;
    --gold:#b8860b;
  }
  html,body{height:100%;}
  body{
    font-family:'Figtree',-apple-system,sans-serif;
    background:#2a2335;
    color:var(--ink);
    display:flex;align-items:center;justify-content:center;
    min-height:100vh;
  }
  #deck{width:min(960px,96vw);aspect-ratio:16/9;background:var(--bg);position:relative;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4);}
  .slide{position:absolute;inset:0;padding:64px 72px;display:none;flex-direction:column;justify-content:center;}
  .slide.active{display:flex;}
  .eyebrow{font-size:14px;font-weight:600;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);margin-bottom:20px;}
  h1{font-family:Georgia,'Times New Roman',serif;font-size:52px;font-weight:700;line-height:1.08;color:var(--ink);letter-spacing:-.01em;}
  h2{font-family:Georgia,'Times New Roman',serif;font-size:38px;font-weight:700;line-height:1.14;color:var(--ink);margin-bottom:22px;letter-spacing:-.01em;}
  .sub{font-size:22px;color:var(--ink-soft);line-height:1.5;margin-top:22px;max-width:42ch;}
  p.body{font-size:20px;color:var(--ink-soft);line-height:1.55;max-width:46ch;margin-bottom:14px;}
  ul{list-style:none;margin-top:10px;}
  li{font-size:20px;color:var(--ink-soft);line-height:1.5;padding-left:30px;position:relative;margin-bottom:12px;max-width:46ch;}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:2px;}
  .big{font-size:88px;font-family:Georgia,serif;font-weight:700;color:var(--accent);line-height:1;}
  .goldnum{color:var(--gold);}
  .dim-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-top:14px;}
  .dim{font-size:18px;color:var(--ink-soft);padding:10px 14px;background:var(--panel);border-left:3px solid var(--accent);}
  .dim.ad{border-left-color:var(--gold);color:var(--ink);font-weight:600;}
  .footer{position:absolute;bottom:26px;left:72px;right:72px;display:flex;justify-content:space-between;font-size:12px;color:var(--ink-muted);letter-spacing:.04em;}
  .disclaimer{font-size:14px;color:var(--ink-muted);margin-top:26px;max-width:52ch;line-height:1.45;}
  .nav{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);display:flex;gap:14px;align-items:center;color:#d9d2e6;font-size:13px;font-family:'Figtree',sans-serif;}
  .nav button{background:rgba(255,255,255,.12);color:#fff;border:none;border-radius:6px;padding:7px 14px;font-size:13px;cursor:pointer;}
  .cta-slide{background:var(--accent);color:#fff;}
  .cta-slide h2,.cta-slide h1{color:#fff;}
  .cta-slide .sub{color:#efe7f5;}
  .cta-slide .eyebrow{color:var(--gold);}
  .cta-slide .disclaimer{color:#cdbfe0;}
</style>
</head>
<body>
<div id="deck"></div>
<div class="nav"><button id="prev">Prev</button><span id="count"></span><button id="next">Next</button></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Sabir Semerkant',h:'The 8-D Method',sub:'Where the 2X is actually hiding in a Shopify or DTC store, and why it was never the ad account.'},
  {t:'who',eyebrow:'Who this is for',h:'You run a real store doing $100K to $5M.',body:['You have live traffic, real orders, and a product people come back for.','You have tried new ads, new pages, and new tests.','And the revenue number still will not move the way it should.']},
  {t:'trap',eyebrow:'The trap',h:'So you do the only thing the internet tells you to do.',sub:'You buy more traffic. Then you buy more again. The number barely twitches, and your margin quietly gets worse.'},
  {t:'reframe',eyebrow:'The reframe',h:'The ad account is one lever out of eight.',sub:'Most brands pour money and attention into a single dimension while seven others silently cap every dollar that lever brings in.'},
  {t:'part',eyebrow:'Part one',h:'Why more spend stopped working',body:['A cold visitor lands on a page that loads in 4.9 seconds, not 1.8.','The offer and the price frame give them no reason to choose the bigger basket.','They buy once, and nothing brings them back.','You did not have an ads problem. You had seven other problems the ads exposed.']},
  {t:'framework',eyebrow:'Part two',h:'The eight dimensions of growth',dims:['1 - Performance & site speed','2 - Pricing & offer architecture','3 - Customer journey & retention','4 - Creative & brand messaging','5 - Positioning & brand','6 - Logistics & post-purchase','7 - Tech stack','8 - Team'],adidx:3},
  {t:'content',eyebrow:'Dimension one',h:'Performance',body:['Speed is the cheapest conversion lever you own.','One store moved from 4.9 seconds to 1.8 seconds on mobile and reported a 328% lift.','Before you touch spend, fix what the spend lands on.']},
  {t:'content',eyebrow:'Dimension two',h:'Pricing and offer architecture',body:['Revenue gets you noticed. Structure sets the price.','AG1 shows a subscription at $79 a month next to $99 one-time, and 75% choose the subscription.','The offer frame is a growth lever most owners never deliberately touch.']},
  {t:'content',eyebrow:'Dimension three',h:'Customer journey and retention',body:['When 88% to 94% of customers buy once, acquisition is a leaking bucket.','The lifecycle flows, the email and SMS that bring people back, are where real LTV is made.','You already paid to acquire them. Earn the second and third order.']},
  {t:'content',eyebrow:'Dimension four',h:'Creative and brand messaging',body:['This is the dimension everyone starts with, and it is dimension four for a reason.','Great creative on a weak offer and a slow site just buys expensive one-time orders.','Message to the job the customer is hiring your product to do.']},
  {t:'content',eyebrow:'Dimensions five to eight',h:'The compounding back half',body:['Five, positioning and brand: why you, not the cheaper option.','Six, logistics and post-purchase: the experience that earns the reorder.','Seven, tech stack: the tools that actually talk to each other.','Eight, team, placed last on purpose: you fix the system before you staff it.']},
  {t:'reframe',eyebrow:'The sequence',h:'Order is the whole method.',sub:'Every sprint works one dimension at a time, in sequence, so each fix compounds on the last instead of fighting it.'},
  {t:'part',eyebrow:'Part three',h:'What a 2X actually looks like',body:['It is not one heroic campaign.','It is a store where speed, offer, retention, and brand all pull in the same direction.','The same traffic you have today, converting and returning at a higher rate.']},
  {t:'proof',eyebrow:'From brands that ran the method',h:'The pattern repeats',body:['A luxury jewelry brand grew from $1.5M to $3M in 11.5 months, with margin rising from 45% to 65%.','A leather-goods brand added 199.6% in a first 12-week engagement.','A waterwear brand added 88% in 30 days.'],note:'Documented case studies from Growth By Sabir. Results vary by brand.'},
  {t:'why',eyebrow:'Why me',h:'I have done this at every scale.',body:['25+ years in e-commerce and $1B+ in sales driven.','Built the e-commerce team at VaynerMedia that became VaynerCommerce.','200+ DTC brands coached through the Rapid 2X Protocol.','Guest lecturer at Harvard Business School.']},
  {t:'cta',eyebrow:'Your next step',h:'Find your first dimension.',sub:'Book a call and we will look at your store’s real numbers together and tell you which of the eight dimensions is capping you first.',disclaimer:'This masterclass is educational. It is not financial advice and no specific income or result is guaranteed. Outcomes vary by brand, market, and execution.'}
];
const deck=document.getElementById('deck');
function render(){
  deck.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===0?' active':'')+(s.t==='cta'?' cta-slide':'');
    let h='';
    if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
    if(s.t==='title'){h+='<h1>'+s.h+'</h1>';}
    else{h+='<h2>'+s.h+'</h2>';}
    if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
    if(s.body){h+='<ul>';s.body.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
    if(s.dims){h+='<div class="dim-grid">';s.dims.forEach((x,j)=>h+='<div class="dim'+(j===s.adidx?' ad':'')+'">'+x+'</div>');h+='</div>';}
    if(s.note) h+='<div class="disclaimer">'+s.note+'</div>';
    if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
    h+='<div class="footer"><span>The 8-D Method</span><span>Growth By Sabir</span></div>';
    d.innerHTML=h;
    deck.appendChild(d);
  });
}
let cur=0;
function show(n){cur=(n+S.length)%S.length;document.querySelectorAll('.slide').forEach((el,i)=>el.classList.toggle('active',i===cur));document.getElementById('count').textContent=(cur+1)+' / '+S.length;}
render();show(0);
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')show(cur+1);if(e.key==='ArrowLeft')show(cur-1);});
</script>
</body>
</html>
