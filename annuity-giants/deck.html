<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prove It, Don't Pitch It — The Annuity Giants Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b1120; --panel:#111a30; --rule:#243049;
  --accent:#f0c040; --ink:#f1f5f9; --dim:#94a3b8;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:'DM Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
#stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 7vw}
.slide{display:none;width:100%;max-width:980px}
.slide.on{display:block;animation:fade .4s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.kick{font-size:.82rem;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:1.4rem}
h1{font-family:'Lora',Georgia,serif;font-weight:600;font-size:3.5rem;line-height:1.08;letter-spacing:-.01em}
h2{font-family:'Lora',Georgia,serif;font-weight:600;font-size:2.5rem;line-height:1.12;margin-bottom:1.2rem}
.sub{font-size:1.35rem;color:var(--dim);margin-top:1.6rem;line-height:1.5;max-width:40ch}
p.body{font-size:1.3rem;line-height:1.6;color:#d9dee7;max-width:46ch;margin-top:1rem}
.big{font-family:'Lora',Georgia,serif;font-weight:600;font-size:3rem;line-height:1.14;max-width:22ch}
.big .a{color:var(--accent);font-style:italic}
.meta{margin-top:2.4rem;font-size:1.05rem;color:var(--dim);letter-spacing:.02em}
.part{font-family:'Lora',Georgia,serif;font-weight:500;font-style:italic;font-size:1.3rem;color:var(--accent);margin-bottom:.8rem}
ul{list-style:none;margin-top:1.6rem}
li{font-size:1.3rem;line-height:1.5;padding:.6rem 0 .6rem 2.2rem;position:relative;color:#d9dee7;border-bottom:1px solid var(--rule)}
li:before{content:'';position:absolute;left:0;top:1.25rem;width:20px;height:20px;border:2px solid var(--accent);border-radius:5px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:2.2rem 2.4rem;margin-top:1.6rem}
.card h3{font-family:'Lora',serif;font-weight:600;font-size:1.7rem;color:var(--ink);margin-bottom:.6rem}
.card p{font-size:1.2rem;color:#d9dee7;line-height:1.55}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.4rem;margin-top:1.6rem}
.disc{font-size:.95rem;color:var(--dim);margin-top:2rem;line-height:1.5;max-width:52ch}
.nav{position:fixed;bottom:22px;right:26px;display:flex;gap:10px;align-items:center;z-index:5}
.nav button{background:var(--panel);color:var(--ink);border:1px solid var(--rule);border-radius:9px;padding:9px 15px;font:inherit;font-size:.95rem;cursor:pointer}
.nav button:hover{border-color:var(--accent)}
.count{font-size:.9rem;color:var(--dim);min-width:52px;text-align:center}
.foot{position:fixed;bottom:24px;left:26px;font-size:.85rem;color:var(--dim);letter-spacing:.12em;text-transform:uppercase}
</style>
</head>
<body>
<div id="stage"></div>
<div class="foot">The Annuity Giants</div>
<div class="nav"><button onclick="go(-1)">Prev</button><span class="count" id="count"></span><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title',h:"Prove It, Don't Pitch It",sub:"The client-first annuity close, taught live by an actively producing agent.",meta:"A live masterclass with Tracy Lownsberry"},
 {t:'promise',k:"In the next hour",h:"You will leave with the exact sequence a daily top producer runs on every call.",body:"Not theory. The real conversation, from first question to signed plan, that turns a skeptic into a client without a single hard pitch."},
 {t:'audience',k:"Who this is for",h:"Agents and advisors who want to produce more without sounding like a salesperson.",body:"Whether you have written one annuity or a thousand, this is the method for the ones who want clients to choose the product, not be pushed into it."},
 {t:'trap',k:"The rip-off reflex",h:"Most annuity pitches lose the client in the first two minutes.",body:"Lead with the product and the client hears a sales pitch. They have read the bad information online, their guard goes up, and no feature sheet talks them back down."},
 {t:'reframe',k:"The reframe",big:"The annuity sale was never a persuasion problem. It is a <span class='a'>proof</span> problem."},
 {t:'part',part:"Part One",h:"Why product-first selling backfires.",body:"The client does not distrust annuities. They distrust being sold one. Fix the trust gap and the product sells itself."},
 {t:'problem',k:"The noise",h:"There is a lot of bad information out there about annuities.",body:"Your client has already met it. If your first move is to argue with the internet, you have lost. Your first move is to understand their actual problem."},
 {t:'part',part:"Part Two",h:"The method, four moves."},
 {t:'pillar',k:"Move one",h:"Find the real problem.",body:"Before any product talk, a problem-led fact-find. What keeps them up at night about retirement income. The recommendation is built from the answer, never from the brochure."},
 {t:'pillar',k:"Move two",h:"Match the type to the need.",body:"Income-driven annuities for guaranteed lifetime income. Performance-driven annuities as a buffer inside the portfolio. The right match makes the recommendation obvious."},
 {t:'pillar',k:"Move three",h:"Prove it on 28 years.",body:"Instead of telling them it works, show them. Their own numbers, with and without an annuity, across real market cycles going back 28 years. The client sees the outcome for themselves."},
 {t:'pillar',k:"Move four",h:"Deliver the plan.",body:"They leave with a branded, client-specific proposal built from the conversation, not a generic handout. A document they can sit with, trust, and say yes to."},
 {t:'part',part:"Part Three",h:"Inside a real client call."},
 {t:'example',k:"The turn",h:"Objections end when the numbers start.",cards:[["Client","“Honestly, I have heard annuities are a rip-off.”"],["You","“Fair. Let me run your own numbers, 28 years, with and without one.”"],["Client","“Oh. I did not know it looked like that.”"]]},
 {t:'why',k:"Why this method",h:"It comes from someone who still sells this way every day.",body:"Tracy Lownsberry is an actively producing annuity agent and trainer who has sold millions in annuities, in person and virtually. This is not a retired guru's theory. It is the current, tested process."},
 {t:'ethics',k:"The standard",h:"Never sacrifice ethics for a sale.",body:"Educate first. Match honestly. Prove the math. Done right, the ethical path and the high-production path are the same path."},
 {t:'recap',k:"The whole method",h:"Four moves, one hour.",list:["Find the real problem","Match the type to the need","Prove it on 28 years","Deliver the plan they keep"]},
 {t:'next',k:"Where this lives",h:"The Annuity Giants Academy.",body:"The masterclass is the method in one hour. The Academy is where you get the full training, the weekly live sessions, and the tools that run this process for you on every call."},
 {t:'cta',k:"Your next step",h:"Join the Annuity Giants Academy.",body:"Learn the client-first method, get the weekly live training, and start proving it on your own clients.",disc:"Educational only. No specific sales or income result is guaranteed. Results vary and depend on your market, effort, licensing, and compliance. Nothing here is investment, tax, or legal advice."}
];
const stage=document.getElementById('stage');
function render(){
 stage.innerHTML='';
 S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===cur?' on':'');
  let h='';
  if(s.k)h+=`<div class="kick">${s.k}</div>`;
  if(s.part)h+=`<div class="part">${s.part}</div>`;
  if(s.big)h+=`<div class="big">${s.big}</div>`;
  else if(s.h)h+=(s.t==='title'?`<h1>${s.h}</h1>`:`<h2>${s.h}</h2>`);
  if(s.sub)h+=`<div class="sub">${s.sub}</div>`;
  if(s.body)h+=`<p class="body">${s.body}</p>`;
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.cards){s.cards.forEach(c=>h+=`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`);}
  if(s.meta)h+=`<div class="meta">${s.meta}</div>`;
  if(s.disc)h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;stage.appendChild(d);
 });
 document.getElementById('count').textContent=(cur+1)+' / '+S.length;
}
let cur=0;
function go(n){cur=Math.max(0,Math.min(S.length-1,cur+n));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1);});
render();
</script>
</body>
</html>
