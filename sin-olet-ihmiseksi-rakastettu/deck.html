<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Five R's Method — Leading From a Steady Nervous System</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF6EC;
    --panel:#F3E9D6;
    --ink:#2C3E50;
    --muted:#6B7683;
    --accent:#C8A15A;
    --display:'Playfair Display',Georgia,serif;
    --body:'Quicksand',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 60px}
  .slide{
    background:var(--bg);
    border:1px solid #E6DECF;
    border-radius:14px;
    padding:56px 56px 52px;
    margin:0 0 22px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 2px rgba(44,62,80,.04);
  }
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.1;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:32px;line-height:1.15;color:var(--ink);margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:62ch;margin-bottom:12px}
  p.sub{color:var(--muted);font-size:18px}
  .lead{font-size:22px;line-height:1.55}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:10px 0 10px 30px;position:relative;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .rrow{display:flex;gap:18px;align-items:baseline;padding:9px 0;border-bottom:1px solid #EBE3D4;max-width:64ch}
  .rrow:last-child{border-bottom:none}
  .rword{font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);min-width:150px}
  .rgloss{font-size:18px;color:var(--muted)}
  .big{font-family:var(--display);font-size:38px;line-height:1.2;color:var(--ink);max-width:22ch}
  .accent{color:var(--accent)}
  .foot{position:absolute;bottom:20px;left:56px;right:56px;display:flex;justify-content:space-between;
    font-size:12px;color:var(--muted);letter-spacing:.04em}
  .brandmark{display:inline-flex;align-items:center;gap:10px;margin-top:26px}
  .dot{width:26px;height:26px;border-radius:50%;border:2px solid var(--accent);position:relative}
  .dot:before{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--accent)}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:20px;max-width:64ch;line-height:1.5}
  .cta-step{background:var(--panel);border-left:3px solid var(--accent);padding:14px 18px;border-radius:0 8px 8px 0;
    font-size:19px;margin-top:8px;max-width:58ch}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',k:'A live masterclass with Satu Kujanpää',h:'Leading From a Steady Nervous System',p:'The Five R’s Method for staying clear, present and decisive when the pressure is highest.',brand:'Ihmiseksi rakastettu'},

  {t:'who',k:'Who this is for',h:'For leaders who carry real weight',bullets:[
    'Managers, executives and entrepreneurs responsible for people, money and outcomes.',
    'You lead well on a good day. You want to lead just as well on the hard ones.',
    'You sense that pressure is quietly costing you clarity, presence and recovery.']},

  {t:'trap',k:'The trap',h:'Pressure does not make you a worse leader. It makes a different one show up.',p:'Under load, you move faster, listen less, and decide from reaction instead of judgement. Then you spend the evening replaying the meeting instead of resting. It looks like a skills problem. It is not.'},

  {t:'reframe',k:'The reframe',h:'Your best leadership is state dependent.',p:'Everything you already know how to do is only available to you when your nervous system feels safe enough to reach it. Lose the state, and you lose access to the leader you actually are.',big:true},

  {t:'part',k:'Part one',h:'The core problem',p:'Why capable leaders stop sounding like themselves when the stakes rise.'},

  {t:'content',k:'Part one',h:'Stress narrows you on purpose',bullets:[
    'Under threat the body prioritises speed and defence over perspective and connection.',
    'Thinking gets literally narrower: fewer options, shorter fuse, tunnel focus.',
    'This is not weakness. It is design. The problem is leading an organisation from it.']},

  {t:'content',k:'Part one',h:'What it quietly costs',bullets:[
    'Decisions made from reaction that have to be walked back later.',
    'A room that mirrors your tension instead of your calm.',
    'No real recovery, because the pressure follows you home.']},

  {t:'part',k:'Part two',h:'The Five R’s',p:'A compass for finding your way back to a steady state, again and again, on demand.'},

  {t:'rlist',k:'Part two',h:'Five returns to steadiness',rows:[
    {w:'Rauha',g:'Peace. Settling the body before the mind can lead.'},
    {w:'Rakkaus',g:'Love. Leading from connection, to yourself and to your people.'},
    {w:'Rentous',g:'Relaxation. Releasing the grip so judgement comes back online.'},
    {w:'Rohkeus',g:'Courage. Acting from choice, not from fear.'},
    {w:'Ratkaisukeskeisyys',g:'Solution focus. Turning attention to the next useful step.'}]},

  {t:'content',k:'Part two',h:'Why five, and why a compass',p:'You will not stay perfectly steady. No leader does. The Five R’s are not a standard to live up to, they are a way to notice you have drifted and correct course quickly. A compass, not a finish line.'},

  {t:'content',k:'Part two',h:'Kotikartta: mapping your way home',p:'Before you can return to a steady state you have to know what yours feels like. The Home Map names your own early warning signs and your own fastest routes back, so the method fits you instead of a template.',brand:false},

  {t:'content',k:'Part two',h:'How the change actually takes root',bullets:[
    'Pause and identify: catch the pressure response early, while you still have a choice.',
    'Find the way back: use your own route to a regulated, resourceful state.',
    'Practise in daily life: apply it in the real meeting, not just in theory.',
    'Root the change: repeat it until steadiness is your default, not your effort.']},

  {t:'part',k:'Part three',h:'The same leader, a steadier state',p:'Same person, same pressure, different place to lead from.'},

  {t:'content',k:'Part three',h:'From reacting to leading',bullets:[
    'The hard conversation handled with presence instead of defensiveness.',
    'A decision made once, clearly, instead of three times, anxiously.',
    'A team that borrows your steadiness because you brought some.']},

  {t:'reframe',k:'The heart of it',h:'Lasting change begins the moment you experience yourself differently.',p:'Not more information. Not another framework to understand. A felt, repeatable return to the state where your real capability lives.',big:true},

  {t:'why',k:'Why me',h:'Satu Kujanpää',bullets:[
    '25+ years as a classroom and special education teacher before coaching full time.',
    'NLP Trainer, executive coach, and solution-focused brief therapist.',
    'I built the Five R’s and the Embodied Leader method on one belief: people change when they are seen and feel safe, not when they are told.'],brand:true},

  {t:'recap',k:'In one line',h:'Steady state, clearer leader.',bullets:[
    'Pressure narrows capable leaders. State, not skill, is what you lose.',
    'The Five R’s are your compass back, and the Home Map makes it yours.',
    'Practised until rooted, steadiness becomes how you lead by default.']},

  {t:'cta',k:'Your next step',h:'Go deeper in the Embodied Leader program',p:'A 20-week personal coaching process to make a steady, clear leadership state your default, through the Five R’s, embodied practice and the Home Map.',step:'Book a free, no-obligation discovery call to see if it is the right fit.',disc:'This masterclass and the Embodied Leader program are educational and support your leadership and wellbeing. They are not therapy or medical treatment. No income or specific result is guaranteed. Results vary from one leader to the next.',brand:'Ihmiseksi rakastettu · ihmiseksirakastettu.fi'}
];

function foot(brand){return '<div class="foot"><span>'+(brand||'Ihmiseksi rakastettu')+'</span><span>The Five R’s Method</span></div>';}

function render(s){
  let h='<section class="slide">';
  if(s.k) h+='<div class="kicker">'+s.k+'</div>';
  if(s.t==='title'){
    h+='<h1>'+s.h+'</h1><p class="lead">'+s.p+'</p>';
    h+='<div class="brandmark"><span class="dot"></span><span>'+s.brand+'</span></div>';
  } else if(s.t==='cta'){
    h+='<h2>'+s.h+'</h2><p>'+s.p+'</p>';
    h+='<div class="cta-step">'+s.step+'</div>';
    h+='<div class="disclaimer">'+s.disc+'</div>';
  } else if(s.t==='rlist'){
    h+='<h2>'+s.h+'</h2>';
    s.rows.forEach(function(r){h+='<div class="rrow"><span class="rword">'+r.w+'</span><span class="rgloss">'+r.g+'</span></div>';});
  } else {
    if(s.h) h+= (s.big? '<h2 class="big">'+s.h+'</h2>' : '<h2>'+s.h+'</h2>');
    if(s.p) h+='<p'+(s.big?' class="lead"':'')+'>'+s.p+'</p>';
    if(s.bullets){h+='<ul>';s.bullets.forEach(function(b){h+='<li>'+b+'</li>';});h+='</ul>';}
  }
  if(s.t!=='title'&&s.t!=='cta') h+=foot();
  h+='</section>';
  return h;
}
document.getElementById('deck').innerHTML=S.map(render).join('');
</script>
</body>
</html>
