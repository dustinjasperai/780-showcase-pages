<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Better Brand Method | Brandmerry</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fffdf9; --panel:#f3ece1; --rule:#e3d8c6; --ink:#2a2420;
    --accent:#a2381a; --accent2:#305049; --muted:#7a6f63;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Lato",system-ui,sans-serif}
  .wrap{max-width:900px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:52px 48px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:54px;line-height:1.05;
    color:var(--ink);margin-bottom:18px}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:40px;line-height:1.08;
    margin-bottom:16px}
  .lead{font-size:20px;line-height:1.55;color:var(--ink);max-width:40ch}
  .sub{font-size:17px;line-height:1.6;color:var(--muted);margin-top:10px;max-width:52ch}
  .big{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:46px;line-height:1.12;
    color:var(--accent);max-width:24ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;
    border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:13px;height:13px;
    border-radius:50%;background:var(--accent2)}
  .step{font-family:"Cormorant Garamond",serif;font-size:72px;color:var(--panel);
    position:absolute;right:34px;top:24px;font-weight:600}
  .stepnum{color:var(--accent);font-family:"Cormorant Garamond",serif;font-size:22px;font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
  .chip{background:var(--panel);border:1px solid var(--rule);border-radius:999px;
    padding:8px 16px;font-size:14px;color:var(--ink)}
  .brandline{margin-top:28px;font-size:15px;color:var(--muted);letter-spacing:.04em}
  .cta{background:var(--panel)}
  .cta h1{color:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:56ch}
  .pagefoot{position:absolute;right:26px;bottom:18px;font-size:12px;color:var(--muted)}
  .kicker{font-size:15px;color:var(--accent2);font-weight:700;margin-bottom:8px;letter-spacing:.05em}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S=[
  {t:"title"},
  {t:"promise"},
  {t:"who"},
  {t:"trap"},
  {t:"hook"},
  {t:"part",k:"Part One",h:"The real reason your brand feels off"},
  {t:"problem"},
  {t:"part",k:"Part Two",h:"The Build a Better Brand Method"},
  {t:"step",n:1,h:"Who you are",b:"Your values, your point of view, and the lens only you bring. This is the root everything else grows from."},
  {t:"step",n:2,h:"Who you serve",b:"The specific person you are for, in their own words, so your message finally feels aimed instead of broadcast."},
  {t:"step",n:3,h:"What you stand for",b:"The belief that separates you from every other option. This is what makes a brand a decision, not a comparison."},
  {t:"step",n:4,h:"How you communicate",b:"Your voice, your throughline, the way you sound in a caption and on a call. Consistency is built here, not improvised later."},
  {t:"step",n:5,h:"The story that ties it together",b:"The one narrative that threads all four, so a stranger feels like they already know you by the end of a single post."},
  {t:"story"},
  {t:"systems"},
  {t:"part",k:"Part Three",h:"What a magnetic brand looks like"},
  {t:"after"},
  {t:"whyme"},
  {t:"recap"},
  {t:"cta",disc:"This class is educational. No income or result is guaranteed. Results vary from person to person and depend on your own work, offer, and market."}
];

const tpl={
  title:()=>`<div class="slide">
    <div class="eyebrow">A live masterclass with Michelle Knight</div>
    <h1>Build a Better Brand Method</h1>
    <p class="lead">Turn the story only you can tell into a brand that attracts your dream clients, makes content feel effortless, and finally sounds like you.</p>
    <div class="brandline">Brandmerry &middot; brandmerry.com</div></div>`,
  promise:()=>`<div class="slide"><div class="eyebrow">What you will walk away with</div>
    <h2>By the end of this class</h2>
    <ul>
      <li>The hidden brand mistakes quietly costing you time, money, and momentum</li>
      <li>A 5-step foundation you can build your whole brand on</li>
      <li>The one story that makes a cold audience feel like they already know you</li>
      <li>A simpler way to show up, so visibility stops eating every hour of your week</li>
    </ul></div>`,
  who:()=>`<div class="slide"><div class="eyebrow">Who this is for</div>
    <h2>For the online entrepreneur who knows they are good at the work</h2>
    <p class="sub">You have the skills, the offer, and the drive. What you do not have is a brand that makes the right people stop, recognize themselves, and lean in. You have tweaked the colors and the bio more times than you want to admit, and it still does not feel like you.</p></div>`,
  trap:()=>`<div class="slide"><div class="kicker">The trap</div>
    <h2>So you rebrand. Again.</h2>
    <p class="sub">New palette. New headshots. New tagline. For a week it feels fresh, and then the same quiet problem comes back: the brand looks nicer but it still does not pull people in. Because the thing that was missing was never the look.</p></div>`,
  hook:()=>`<div class="slide"><div class="eyebrow">The reframe</div>
    <p class="big">You do not have a logo problem. You have a story problem.</p>
    <p class="sub">A brand is not how it looks. It is what people feel they understand about you in the first ten seconds, and whether that feeling is specific enough to trust.</p></div>`,
  part:(s)=>`<div class="slide"><div class="eyebrow">${s.k}</div><h1>${s.h}</h1></div>`,
  problem:()=>`<div class="slide"><div class="kicker">The core problem</div>
    <h2>Tactics first, foundation never</h2>
    <p class="sub">Most branding advice hands you tactics: post more, pick a niche, use this hook. But if the foundation under it is not solid, who you are, who you serve, what you stand for, and how you communicate, none of it lands. The result is scattered messaging and content that works hard and converts little.</p></div>`,
  step:(s)=>`<div class="slide"><div class="step">0${s.n}</div>
    <div class="stepnum">Step ${s.n} of 5</div>
    <h2>${s.h}</h2><p class="sub">${s.b}</p></div>`,
  story:()=>`<div class="slide"><div class="eyebrow">The Magnetic Brand Story</div>
    <h2>Your story is the strategy</h2>
    <p class="sub">The story you keep leaving out of your marketing, because it feels too personal or too ordinary, is almost always the one that connects. We find it, shape it, and thread it through everything you publish, so the same narrative is doing the selling whether someone meets you on a reel, an email, or a call.</p></div>`,
  systems:()=>`<div class="slide"><div class="kicker">Systems over hustle</div>
    <h2>Built to run without burning you out</h2>
    <p class="sub">A magnetic brand is not a posting marathon. Once the foundation and the story are set, you build once and reuse, so you can be consistent without living inside your phone. That is how a brand supports the life you wanted when you started, instead of swallowing it.</p></div>`,
  after:()=>`<div class="slide"><div class="eyebrow">What changes</div>
    <h2>When the foundation is right</h2>
    <ul>
      <li>Content gets easier, because you always know what you are really saying</li>
      <li>The right people self-identify and reach out already warm</li>
      <li>Your pricing holds, because the brand carries the trust before the call</li>
      <li>You stop rebranding, because nothing underneath is broken anymore</li>
    </ul></div>`,
  whyme:()=>`<div class="slide"><div class="eyebrow">Why listen to me</div>
    <h2>I have taught this for a decade</h2>
    <p class="sub">I left my 9 to 5, built a multiple-six-figure brand, and became a full-time traveler within five years, all on the back of one story told well. For eight years at Brandmerry I have helped thousands of entrepreneurs turn their own story into a brand that creates income and freedom.</p>
    <div class="chips"><span class="chip">CNBC</span><span class="chip">Entrepreneur</span><span class="chip">Fast Company</span><span class="chip">Thrive Global</span><span class="chip">Authority Magazine</span></div></div>`,
  recap:()=>`<div class="slide"><div class="eyebrow">The method, in one breath</div>
    <h2>Story first, then everything else</h2>
    <p class="sub">Find the foundation, tell the story only you can tell, and build a brand on systems instead of hustle. That is the Build a Better Brand Method, and it is the difference between a brand that looks nice and a brand that pulls.</p></div>`,
  cta:(s)=>`<div class="slide cta"><div class="eyebrow">Your next step</div>
    <h1>Build it with me</h1>
    <p class="lead">If you are ready to put this foundation and story in place for your own brand, the Brand Strategy Intensive is where we do it together, one on one, and map your next 90 days.</p>
    <div class="brandline">Start at brandmerry.com/intensive &middot; Brandmerry</div>
    <p class="disc">${s.disc}</p></div>`
};
document.getElementById('deck').innerHTML = S.map((s,i)=>{
  const html = tpl[s.t](s);
  const cut = html.lastIndexOf('</div>');
  return html.slice(0,cut) + `<div class="pagefoot">${i+1} / ${S.length}</div>` + html.slice(cut);
}).join('');
</script>
</body>
</html>
