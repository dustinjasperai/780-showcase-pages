<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Study Less. Score Higher. · Dr. Andre Pinesett</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0e2c42; --panel:#143b57; --rule:#23557a;
    --acc:#3d9bd6; --idx:#8fb9d6; --chalk:#eef5fb; --grey:#c2d4e3; --dim:#6f92ab;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Montserrat',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Lora',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.3vw;max-width:90%}
  .t-normal h1{font-size:3.2vw;max-width:86%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.55;font-weight:300}
  .sub{font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1c4a6b 0%,#071825 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;font-style:italic;color:#f0f6fb}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1c4a6b 0%,#071825 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap}
  .t-dark .chips,.t-cta .chips{justify-content:center}
  .chip{border:1px solid var(--acc);color:#cbe4f5;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .steps{display:flex;gap:.7vw;margin-top:4vh;flex-wrap:wrap;align-items:center}
  .step{border:1px solid var(--rule);background:var(--panel);color:var(--grey);border-radius:8px;padding:1.4vh 1.4vw;font-size:1.16vw;font-weight:500}
  .step b{color:var(--acc);font-weight:600}
  .arrow{color:var(--dim);font-size:1.3vw}
  .stat{display:flex;gap:3.4vw;margin-top:4vh;flex-wrap:wrap}
  .stat .n{font-family:'Lora',Georgia,serif;font-size:3.6vw;color:var(--acc);line-height:1}
  .stat .l{font-size:1.05vw;color:var(--grey);margin-top:1vh;max-width:14vw;font-weight:300}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc,.t-section .disc{text-align:left}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}.step{font-size:2.6vw}.stat .n{font-size:8vw}.stat .l{font-size:2.6vw;max-width:40vw}
  }
</style>
</head>
<body>
<div class="stage">
  <div class="deck" id="deck"></div>
</div>
<div class="hud"><i id="bar"></i></div>
<div class="brand-foot">Premed Productivity</div>
<div class="count" id="count"></div>
<div class="hint" id="hint">Use arrow keys or click to advance</div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>

<script>
const S = [
  {t:'title', kicker:'A Premed Productivity Masterclass', h:'Study Less. Score Higher.',
    sub:'How to dominate pre-med and the MCAT on a fraction of the study hours everyone else is burning.',
    brand:'with <b>Dr. Andre Pinesett</b> · The Premed Productivity Expert' },

  {t:'normal', kicker:'Who this is for', h:'You are working harder than anyone. It is not showing up in your grades.',
    body:'You read every chapter twice, you live in the library, you skip the weekends off. And the GPA still slips, the MCAT still feels a mile away, and you are running on empty. This session is for the pre-med who is out of hours, not out of effort.' },

  {t:'normal', kicker:'The trap', h:'Every piece of advice you get is the same. Do more.',
    body:'More hours. More flashcards. More practice tests. A $2,000 prep class on top. So you add, and add, until there is nothing left to add, and the results still do not move. The problem was never how much you were doing.' },

  {t:'dark', h:'"More hours is not the answer. For most pre-meds, it is the problem."' },

  {t:'section', idx:'Part One', h:'Why studying more keeps failing you' },

  {t:'normal', kicker:'The real problem', h:'Passive studying feels productive. It is not.',
    body:'Re-reading, highlighting, and cramming light up the part of your brain that feels busy while teaching it almost nothing that lasts. You spend the hours, you get the fatigue, and the material still will not stick when it counts on exam day.' },

  {t:'normal', kicker:'The cost', h:'The grind has a price, and you are paying it twice.',
    body:'First in time you will never get back, then in the stress and burnout that make the next block even harder. By the time the MCAT arrives, the tank is empty and the 95th percentile looks like something other people do.' },

  {t:'normal', kicker:'The myth', h:'You do not need an expensive prep class. You need a system.',
    body:'The $2,000 course sells you more content and more hours, the exact thing that is not working. What actually moves the needle is a smarter way to use the hours you already have, so you learn more from less.' },

  {t:'section', idx:'Part Two', h:'The Premed Productivity System' },

  {t:'normal', kicker:'Studying less, by design', h:'Get better grades on fewer hours, on purpose.',
    body:'Studying less is a discipline, not a shortcut. It rests on the four things I train every student on, so the hours you keep are the ones that actually count.',
    chips:['Time management','Study strategy','Professional development','Mental fitness'] },

  {t:'normal', kicker:'The PRIME Reading Protocol', h:'Cut your reading time by up to 60%. Retain more, not less.',
    body:'Most pre-meds read dense science the slow way, front to back, hoping it sticks. The PRIME Reading Protocol changes how you move through the material so you read it once, hold on to it, and free up the hours the grind was eating.' },

  {t:'normal', kicker:'Mental fitness', h:'Dominating pre-med starts with dominating yourself.',
    body:'The systems only hold if your mindset does. No excuses, just dominate is not a slogan, it is the habit of showing up, doing the hard thing, and refusing to let a bad block become a bad year.' },

  {t:'section', idx:'Part Three', h:'What the pathway looks like' },

  {t:'normal', kicker:'The Success Pathway', h:'One roadmap, from your first study block to your white coat.',
    body:'Every stage builds on the one before it, so you always know the next right move instead of guessing.',
    steps:['Think Better','Study Better','Premed Better','MCAT Better','Apply Better','Med School Better'] },

  {t:'normal', kicker:'A week, rebuilt', h:'Ten focused hours can beat forty scattered ones.',
    body:'I studied roughly ten hours a week in college and kept my weekends. Not by cutting corners, but because every hour had a job. That is the whole promise of studying less: fewer hours, aimed better, protected fiercely.' },

  {t:'dark', h:'"I was a first-generation student who was told he would never become a doctor. I did not outwork that. I out-systemed it."' },

  {t:'normal', kicker:'Why listen to me', h:'The system is the one I used on myself first.',
    body:'Ninety-fifth percentile on the MCAT, studied independently, no expensive prep class. Stanford School of Medicine, top five percent of the class, no weekend studying. Fifteen-plus years since, teaching pre-meds to do the same.',
    stat:[['95th','percentile MCAT, studied independently'],['Top 5%','of the class at Stanford Med'],['10 hrs','a week, weekends kept']] },

  {t:'cta', kicker:'Your next step', h:'Ready to stop grinding and start dominating?',
    sub:'Start your transformation inside the Total Premed Transformation, where the system, the coaching, and the pathway live in one place.',
    brand:'<b>Dr. Andre Pinesett</b> · premedproductivity.com',
    disc:'Educational content only. Individual results vary and depend on your own effort and circumstances. No specific score, admission, or outcome is guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('div');
  el.className = 'slide t-' + s.t + (i === 0 ? ' active' : '');
  let h = '';
  if (s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if (s.idx) h += `<div class="idx">${s.idx}</div>`;
  if (s.h) h += `<h1>${s.h}</h1>`;
  if (s.t === 'section') h += `<div class="rule"></div>`;
  if (s.body) h += `<div class="body">${s.body}</div>`;
  if (s.sub) h += `<div class="sub">${s.sub}</div>`;
  if (s.chips) h += `<div class="chips">${s.chips.map(c => `<div class="chip">${c}</div>`).join('')}</div>`;
  if (s.steps) h += `<div class="steps">${s.steps.map((c, j) => `<div class="step"><b>${j+1}</b> &nbsp;${c}</div>${j < s.steps.length-1 ? '<div class="arrow">&rsaquo;</div>' : ''}`).join('')}</div>`;
  if (s.stat) h += `<div class="stat">${s.stat.map(x => `<div><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('')}</div>`;
  if (s.brand) h += `<div class="brandline">${s.brand}</div>`;
  if (s.disc) h += `<div class="disc">${s.disc}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const bar = document.getElementById('bar');
const count = document.getElementById('count');
const hint = document.getElementById('hint');
function show(n) {
  cur = Math.max(0, Math.min(S.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('active', i === cur));
  bar.style.width = ((cur + 1) / S.length * 100) + '%';
  count.textContent = (cur + 1) + ' / ' + S.length;
  if (cur > 0) hint.style.opacity = '0';
}
document.getElementById('next').onclick = () => show(cur + 1);
document.getElementById('prev').onclick = () => show(cur - 1);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
show(0);
</script>
</body>
</html>
