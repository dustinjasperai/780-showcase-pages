<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Average Content Comes to Die — a WACA masterclass with Hannah Sands</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,900&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#2a1512;
  --panel:#3a1d19;
  --accent:#7d352e;
  --tint:#c96a4a;
  --ink:#f6f6d9;
  --rule:#7d352e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg);color:var(--ink);font-family:"Hanken Grotesk",system-ui,sans-serif}
.wrap{max-width:1120px;margin:0 auto;padding:40px 22px 90px}
.slide{
  background:var(--panel);
  border:1px solid rgba(201,106,74,.28);
  border-radius:14px;
  padding:54px 54px 48px;
  margin:0 0 26px;
  min-height:70vh;
  display:flex;flex-direction:column;justify-content:center;
  position:relative;overflow:hidden;
}
.slide::before{
  content:attr(data-n);
  position:absolute;top:20px;right:26px;
  font-family:"Fraunces",serif;font-weight:900;font-size:13px;
  letter-spacing:.14em;color:rgba(246,246,217,.32);
}
.kicker{
  font-family:"Hanken Grotesk";font-weight:600;font-size:12.5px;
  letter-spacing:.26em;text-transform:uppercase;color:var(--tint);margin-bottom:18px;
}
h1{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(38px,6vw,74px);line-height:.98;letter-spacing:-.01em}
h2{font-family:"Fraunces",serif;font-weight:600;font-size:clamp(28px,4.2vw,46px);line-height:1.05;letter-spacing:-.01em}
.lede{font-size:clamp(17px,2.1vw,22px);line-height:1.5;max-width:46ch;margin-top:22px;color:rgba(246,246,217,.86)}
.big{font-family:"Fraunces",serif;font-weight:900;font-size:clamp(30px,5vw,58px);line-height:1.03}
.strike{color:var(--tint);text-decoration:line-through;text-decoration-thickness:3px}
.hot{color:var(--tint)}
ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:52ch}
li{position:relative;padding-left:30px;font-size:clamp(16px,2vw,20px);line-height:1.42;color:rgba(246,246,217,.9)}
li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:2px;background:var(--tint)}
.num{font-family:"Fraunces",serif;font-weight:900;font-size:15px;color:var(--accent);background:var(--ink);border-radius:999px;width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:16px}
.foot{margin-top:30px;font-size:13px;letter-spacing:.04em;color:rgba(246,246,217,.5)}
.cta h1{font-size:clamp(34px,5.4vw,66px)}
.btn{display:inline-block;margin-top:28px;background:var(--accent);color:var(--ink);font-weight:600;letter-spacing:.02em;padding:16px 30px;border-radius:999px;font-size:17px}
.disc{margin-top:26px;font-size:12.5px;line-height:1.5;color:rgba(246,246,217,.5);max-width:60ch}
.cover{background:linear-gradient(160deg,#2a1512 0%,#43201a 100%)}
.cover h1{font-size:clamp(44px,8vw,96px)}
.quote{font-family:"Fraunces",serif;font-weight:600;font-style:italic;font-size:clamp(24px,3.6vw,40px);line-height:1.18;max-width:24ch}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S=[
 {t:'cover',kicker:'A WACA live masterclass with Hannah Sands',title:'Where Average Content Comes to Die',lede:'How to make content bold enough to actually sell, not just scroll past.'},
 {t:'promise',kicker:'The promise',h2:'In the next hour',lede:'You will leave with a way to say it sharper and sell it better: a repeatable method for turning posts into customers, without burning out or winging it.'},
 {t:'who',kicker:'Who this is for',h2:'You are a creator or founder who is done winging it',points:['You post consistently but it rarely turns into sales','You have a real offer and a real voice, but no system behind it','You are tired of watching louder accounts out-sell better work']},
 {t:'trap',kicker:'The trap',big:'More content is not the problem. <span class="strike">Average</span> content is.',lede:'Posting more of the same safe, forgettable content just means more people scroll past you faster.'},
 {t:'reframe',kicker:'The reframe',quote:'"Your audience does not owe you a sale because you showed up. They buy when it is clear, bold, and obviously for them."'},
 {t:'part',kicker:'Part one',h1:'Why good content still does not sell'},
 {t:'point',kicker:'The quiet killer',h2:'Safe is the enemy',lede:'Content built to offend no one moves no one. If it could belong to any account in your niche, it is already invisible.'},
 {t:'point',kicker:'The gap',h2:'Attention is not the same as intent',points:['Views feel like progress','But a saved reel is not a paying customer','The missing step is turning attention into a decision']},
 {t:'part',kicker:'Part two',h1:'The method: Clarity, Confidence, Conversations'},
 {t:'pillar',n:'1',kicker:'Pillar one',h2:'Clarity: say it sharper',lede:'Get the voice and the offer sharp enough to cut through a crowded feed. One audience, one promise, one obvious next step. Strategy and structure replace guesswork.'},
 {t:'pillar',n:'2',kicker:'Pillar two',h2:'Confidence: be bold, not average',lede:'Stop sanding the edges off. The content that sells has a point of view somebody could disagree with. This is where average content comes to die.'},
 {t:'pillar',n:'3',kicker:'Pillar three',h2:'Conversations: sell it better',lede:'Content is the start of a conversation, not the end. Build the path from a bold post to a real offer so attention turns into organic sales.'},
 {t:'point',kicker:'The through-line',h2:'Grow without the grind',lede:'Done properly this runs on founder energy and structure, not a 24/7 content treadmill. Fewer, braver pieces beat a feed full of filler.'},
 {t:'part',kicker:'Part three',h1:'What bold looks like in practice'},
 {t:'point',kicker:'A week of bold',h2:'From blank page to booked',points:['Lead with the sharpest thing you believe','Make the offer impossible to misread','Invite the decision instead of hoping for it']},
 {t:'point',kicker:'The shift',h2:'From posting to selling',lede:'When clarity, confidence and conversations stack, the same effort you already spend starts producing customers instead of just compliments.'},
 {t:'why',kicker:'Why me',h2:'I built this the hard way',lede:'I scaled Socially Sands to roughly a million dollars in organic sales in two years, through two babies, serving hundreds of creators. WACA is the method I used, built for you.'},
 {t:'recap',kicker:'The recap',h2:'Clarity. Confidence. Conversations.',points:['Clarity: say it sharper','Confidence: be bold, not average','Conversations: sell it better']},
 {t:'cta',kicker:'Your next step',title:'Come build it inside WACA',lede:'We Are Creator Academy is where creators and founders stop winging it and build something loud, strategic and made to last. Enrolment opens monthly, one cohort at a time.',btn:'Join the next WACA cohort',disc:'This masterclass is educational. No specific income, sales, or growth result is guaranteed. Results vary and depend on your own work, offer, and market.'}
];
const app=document.getElementById('app');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='cover'?'cover':'')+(s.t==='cta'?' cta':'');
  d.setAttribute('data-n',String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0'));
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.title) h+='<h1>'+s.title+'</h1>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.n) h+='<div class="num">'+s.n+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.quote) h+='<div class="quote">'+s.quote+'</div>';
  if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
  if(s.points){h+='<ul>';s.points.forEach(p=>h+='<li>'+p+'</li>');h+='</ul>';}
  if(s.btn) h+='<div><span class="btn">'+s.btn+'</span></div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  d.innerHTML=h;
  app.appendChild(d);
});
</script>
</body>
</html>
