<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Transformation-Driven Gym (a HolosBody Masterclass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2eee6;        /* HolosBody warm cream ground (brand.json) */
    --panel:#ffffff;
    --band:#ffffff;      /* white contrast band */
    --ink:#2d3443;       /* HolosBody dominant slate (brand.json, 46 uses) */
    --muted:#5a6475;
    --rule:#dfe3ec;
    --accent:#e15d3a;    /* HolosBody signature orange (brand.json H2, 20 uses) */
    --deep:#07243c;      /* HolosBody deep navy (brand.json, 7 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);font-family:'Open Sans',system-ui,sans-serif;color:var(--ink)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 64px}
  .slide{background:var(--bg);border-radius:14px;margin:0 0 26px;padding:52px 56px;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 30px rgba(7,36,60,.12);position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
  .eyebrow{font-family:'Poppins',sans-serif;font-weight:600;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:44px;line-height:1.08;color:var(--ink);margin-bottom:16px}
  h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:32px;line-height:1.14;color:var(--ink);margin-bottom:16px}
  p{font-size:19px;line-height:1.6;color:var(--muted);margin-bottom:12px;max-width:62ch}
  .lead{font-size:22px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:10px 0 10px 30px;position:relative;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .kicker{font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;color:var(--deep);margin-top:22px}
  .title-slide{background:var(--deep)}
  .title-slide h1,.title-slide .lead{color:#fff}
  .title-slide p{color:#cdd6e4}
  .title-slide .eyebrow{color:#f6a186}
  .title-slide::after{background:var(--accent)}
  .band{background:#ffffff}
  .pill{display:inline-block;font-family:'Poppins',sans-serif;font-weight:600;font-size:13px;
    color:var(--deep);background:#fff;border:1px solid var(--rule);border-radius:999px;padding:7px 14px;margin:6px 8px 0 0}
  .num{font-family:'Poppins',sans-serif;font-weight:700;font-size:15px;color:var(--accent);margin-bottom:8px}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:22px;max-width:68ch;line-height:1.5}
  .cta-slide{background:var(--deep)}
  .cta-slide h2,.cta-slide .lead{color:#fff}
  .cta-slide p{color:#cdd6e4}
  .cta-slide .eyebrow{color:#f6a186}
  .cta-box{display:inline-block;font-family:'Poppins',sans-serif;font-weight:700;font-size:20px;
    color:#fff;background:var(--accent);border-radius:10px;padding:16px 26px;margin-top:10px}
  .foot{position:absolute;right:26px;bottom:18px;font-family:'Poppins',sans-serif;font-weight:600;
    font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
  .title-slide .foot,.cta-slide .foot{color:#8aa0b8}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-slide', eyebrow:'A HolosBody Masterclass with Remi Mayer',
    h1:'The Transformation-Driven Gym',
    lead:'How to build the gym members never want to leave, and command premium prices for it.',
    p:'A live training for gym, studio, and fitness-facility owners who are ready to grow on transformation and retention, not discounts and endless lead chasing.' },

  {t:'content', eyebrow:'Who this is for',
    h2:'You are great at changing lives. Growing the business is the hard part.',
    bullets:['You own a gym, a studio, a box, or a training facility.',
             'Your members get real results when they stay and do the work.',
             'But filling the calendar still feels like feast or famine.',
             'And the only growth advice you hear is "get more leads, run more offers."'],
    kicker:'If that is you, this hour is built for you.' },

  {t:'content', cls:'band', eyebrow:'The trap',
    h2:'The discount-and-chase treadmill',
    p:'Most owners try to grow by adding more leads at the top: a new promo, a cheaper intro offer, another lead magnet.',
    bullets:['Cheap offers bring in price shoppers who leave the moment the discount ends.',
             'Churn quietly eats every new member you sign.',
             'You work harder every month just to stay in the same place.'],
    kicker:'More traffic cannot fix a leak in the bucket.' },

  {t:'statement', eyebrow:'The reframe',
    h1:'More leads will not fix a retention problem.',
    p:'The gyms that win are not the ones with the most leads. They are the ones whose members get a transformation so good they stay for years and tell their friends.' },

  {t:'content', eyebrow:'Part one', h2:'The core problem: you look like every other gym',
    p:'From the outside, most gyms sell the same thing: a room, some equipment, and a class schedule. When you look the same, you compete on price, and price is a race to the bottom.',
    bullets:['Members cannot tell why you are different, so they shop on cost and convenience.',
             'When results stall, there is nothing holding them, so they drift away.',
             'You are left refilling the same seats over and over.'] },

  {t:'content', cls:'band', eyebrow:'Part one', h2:'The math nobody shows you',
    p:'A retained member who stays a year is worth many times a member who quits in six weeks. Yet almost all the effort goes into the first visit, not the next twelve months.',
    bullets:['Retention compounds. Every member who stays makes the next year easier.',
             'Transformation is what earns the right to charge a premium.',
             'Premium prices plus retention beat volume plus discounts, every time.'],
    kicker:'This is the whole game, and almost no one plays it on purpose.' },

  {t:'statement', eyebrow:'Part two', h1:'The HolosBody Method',
    p:'Four pieces that turn a gym into a transformation brand people pay a premium to belong to.' },

  {t:'content', eyebrow:'Pillar one', h2:'The Health & Habit Coaching System',
    p:'Add health, habit, accountability, and mindset coaching on top of your training, delivered in minutes a day, so members change their whole lifestyle, not just their workout.',
    bullets:['A branded wellness course your members follow, in your name.',
             'An AI Health Coach and habit tracking that keep them engaged between sessions.',
             'Accountability and mindset support that makes results stick.'],
    kicker:'This is the thing your competitors simply do not have.' },

  {t:'content', cls:'band', eyebrow:'Pillar two', h2:'Heart-Centered Selling',
    p:'Enroll your dream clients with integrity. No gimmicks, no pressure, no bait and switch. You help them decide, and the right people say yes.',
    bullets:['A conversation that qualifies and serves, instead of pushing.',
             'Owners using this command premium memberships of 2,400 to 24,000 dollars a year.',
             'You attract members who value the transformation, not the lowest price.'] },

  {t:'content', eyebrow:'Pillar three', h2:'The Transformation-Driven Video Formula',
    p:'A single video that speaks directly to your ideal member: their frustrations, their hopes, and the transformation you deliver. You get it in front of the right people, and qualified prospects book themselves in.',
    bullets:['Lead with the transformation, not the equipment or the price.',
             'Let the right members self-select before they ever reach out.',
             'Replace the endless cold-lead chase with people who already want in.'] },

  {t:'content', cls:'band', eyebrow:'Pillar four', h2:'The Simple 4-Step System',
    p:'The repeatable monthly rhythm that signs 20 to 50 new members, without the feast-or-famine swings.',
    bullets:['Craft an offer built on transformation, not a discount.',
             'Attract the right members with the video formula.',
             'Enroll them with heart-centered selling.',
             'Retain them with the health and habit coaching system.'] },

  {t:'statement', eyebrow:'Part three', h1:'Your gym twelve months from now',
    p:'Not more hours and more hustle. A business that grows because your members get a transformation worth staying for.' },

  {t:'content', eyebrow:'The transformed gym', h2:'From one more gym to the only choice in town',
    bullets:['Members stay for years because their whole life is getting better.',
             'You charge premium prices because you deliver a premium transformation.',
             'Happy members refer the next ones, so growth stops depending on discounts.',
             'You run a calmer, more profitable business doing the work you love.'] },

  {t:'content', cls:'band', eyebrow:'Minutes a day', h2:'Delivery that fits your week',
    p:'The coaching system does the heavy lifting between sessions, so you deliver a world-class member experience without adding hours to your day.',
    bullets:['The app, the course, and the AI coach carry the daily touchpoints.',
             'You stay focused on coaching and leading, not chasing.',
             'Your members feel supported every single day, not just in class.'] },

  {t:'content', eyebrow:'Why learn this here', h2:'Built with gym owners, for gym owners',
    p:'HolosBody has spent six years helping gym owners, personal trainers, and fitness professionals build transformation-first businesses, and has worked with over 400 owners along the way.',
    bullets:['This is a system refined in real gyms, not theory.',
             'It goes beyond ads and funnels to mindset, identity, and lifestyle.',
             'The goal is more profit and, just as important, more freedom.'] },

  {t:'statement', eyebrow:'The shift', h1:'Stop chasing. Start delivering.',
    p:'When you build on transformation and retention, growth stops being a monthly scramble and starts compounding on its own.' },

  {t:'content', cls:'band', eyebrow:'Recap', h2:'The four pieces, together',
    bullets:['Health & Habit Coaching System for transformation and retention.',
             'Heart-Centered Selling for premium, integrity-first enrollment.',
             'Transformation-Driven Video Formula for the right members.',
             'The Simple 4-Step System to make it a monthly rhythm.'] },

  {t:'cta', cls:'cta-slide', eyebrow:'Your next step',
    h2:'Map your transformation-driven growth plan',
    p:'If you want help applying this to your gym, the next step is a free Strategic Growth Session. We will look at your offer, your retention, and your enrollment, and build a step-by-step plan for your business.',
    cta:'Book your free Strategic Growth Session',
    disclaimer:'This masterclass is educational. Results vary and depend on your market, your effort, and many factors outside anyone’s control. Nothing here is a promise or guarantee of income, revenue, or any specific outcome.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  let html = '';
  if (s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.h1) html += '<h1>' + s.h1 + '</h1>';
  if (s.h2) html += '<h2>' + s.h2 + '</h2>';
  if (s.lead) html += '<p class="lead">' + s.lead + '</p>';
  if (s.p) html += '<p>' + s.p + '</p>';
  if (s.bullets) { html += '<ul>'; s.bullets.forEach(b => html += '<li>' + b + '</li>'); html += '</ul>'; }
  if (s.kicker) html += '<div class="kicker">' + s.kicker + '</div>';
  if (s.cta) html += '<div class="cta-box">' + s.cta + '</div>';
  if (s.disclaimer) html += '<div class="disclaimer">' + s.disclaimer + '</div>';
  html += '<div class="foot">HolosBody &middot; The Transformation-Driven Gym</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
