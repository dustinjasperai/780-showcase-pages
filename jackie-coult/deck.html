<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Practice Revenue Audit · Complete Healthcare Business Consulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Petrona:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Albert+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#131B18; --panel:#1A2320; --rule:#26312C;
    --sage:#7FAE8E; --slate:#9AA8A2; --chalk:#EFEAE0; --grey:#CBD3CD; --dim:#7C8983;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Albert Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--sage);margin-bottom:2.4vh}
  h1{font-family:'Petrona',Georgia,serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.6vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.46vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Albert Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--slate);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--sage),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1E2924 0%,#0A0F0D 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-style:italic;color:#EAE5DA}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1E2924 0%,#0A0F0D 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--sage);color:#CFE3D5;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .ledger-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-ledger{right:6.5%;bottom:9%;width:22vw}
  .corner-ledger{right:6%;bottom:7.5%;width:10vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--sage);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--sage);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Complete Healthcare Business Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- audit-ledger motif: a horizontal baseline with five checkpoint squares, verified left to right -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 260 80">
  <line x1="14" y1="42" x2="246" y2="42" stroke="#7FAE8E" stroke-width="2" opacity="0.5"/>
  <rect x="10" y="34" width="16" height="16" rx="3" fill="#7FAE8E"/>
  <path d="M14 42 l3 3 l6 -7" stroke="#131B18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="68" y="34" width="16" height="16" rx="3" fill="#7FAE8E"/>
  <path d="M72 42 l3 3 l6 -7" stroke="#131B18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="126" y="34" width="16" height="16" rx="3" fill="#7FAE8E"/>
  <path d="M130 42 l3 3 l6 -7" stroke="#131B18" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="184" y="34" width="16" height="16" rx="3" fill="none" stroke="#9AA8A2" stroke-width="2"/>
  <rect x="234" y="34" width="16" height="16" rx="3" fill="none" stroke="#9AA8A2" stroke-width="2"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Practice Revenue Audit',sub:'Where a dermatology practice is actually losing money, and how a five-point audit finds it, in one sitting.',brand:true,climb:'title'},
 {t:'normal',k:'Who this is for',title:'The schedule is full. The collections do not match it.',body:'You are seeing patients, running procedures, billing what you think you should. The catch is a lot of practices never find out how much of that work never turns into collected revenue.'},
 {t:'normal',k:'The trap',title:'A slow month does not always mean fewer patients.',body:'Most owners assume a soft month is a volume problem, so they push for more patients. Often the real leak is a stale fee schedule, an under-negotiated payor contract, or a credentialing gap quietly costing reimbursement every week.'},
 {t:'dark',title:'You do not have a patient problem. You have a practice that has never been audited.'},

 {t:'section',idx:'Part One',title:'The Practice That Looks Busy But Is Not Collecting'},
 {t:'normal',k:'The real cost',title:'Billing errors and stale fee schedules are invisible from the front desk.',body:'A biopsy coded under an old fee schedule, a payor contract that never got renegotiated, a credentialing gap that delays enrollment: none of it shows up on the daily schedule. It shows up months later as revenue that was never collected.'},
 {t:'normal',k:'The shift',title:'Stop guessing at the leak. Audit for it.',body:'The owners who close the gap do not try to out-work it with more patients. They bring in someone who audits the revenue cycle itself, checkpoint by checkpoint, and shows exactly where the money went.'},
 {t:'dark',title:'An audit is not a guess. It is five checkpoints, worked in order.'},

 {t:'section',idx:'Part Two',title:'The Practice Revenue Audit'},
 {t:'normal',k:'Checkpoint one',title:'Practice Assessment.',body:'A comprehensive review of every system inside the practice, so the audit starts from what is actually happening, not a guess.'},
 {t:'normal',k:'Checkpoint two',title:'Revenue Cycle and Fee Schedule Analysis.',body:'A full audit of the billing, coding, and collections process, including a Master fee schedule review tuned to dermatology-specific coding on minor procedures, pathology, and biologics.'},
 {t:'normal',k:'Checkpoint three',title:'Payor Contract Negotiations.',body:'Reviewing existing payor contracts to confirm the practice is properly reimbursed for excisions, biopsies, phototherapy, and biologics, and renegotiating where it is not.'},
 {t:'normal',k:'Checkpoint four',title:'Credentialing and Compliance.',body:'Payor enrollment, product-inventory tracking, and audit-readiness, so the practice can actually bill for the work it does and survive a payor audit intact.'},
 {t:'normal',k:'Checkpoint five',title:'Workflow Redesign.',body:'Redesigning front- and back-office operations to handle high patient volume alongside cosmetic-service delivery without the two colliding.'},
 {t:'dark',title:'Five checkpoints, worked in order, are how a practice finds money it already earned.'},

 {t:'section',idx:'Part Three',title:'What This Looks Like'},
 {t:'normal',k:'The result',title:'The same practice you built, minus the quiet leak.',body:'You keep the clinical standards and the patient volume you already have. What changes is the revenue cycle underneath it: fee schedules that reflect real reimbursement, contracts that pay what they should, and credentialing that does not stall a new provider.'},
 {t:'normal',k:'Why me',title:'30-plus years, National Speaker since 1992, 250+ start-ups completed.',body:'I am Jackie Coult, CHBC, a Certified Healthcare Business Consultant. I have completed over 250 start-ups for medical practices, ASCs, imaging centers, and medical organizations, and I have been speaking on this nationally since 1992. This is not theory. It is the same audit I run for practices like yours.'},

 {t:'section',idx:'Your next step',title:'A Conversation About Your Practice'},
 {t:'normal',k:'How we begin',title:'A conversation about where your revenue cycle actually stands.',body:'We look at your fee schedule, your payor contracts, and your credentialing status, and map which of the five checkpoints your practice needs first, whether that is a full assessment or a focused fix on one leak.'},
 {t:'cta',title:'Submit a consultation request by phone or email.',chips:['Call (801) 274-2677','Email Jackie@chcbconsulting.com'],disc:'Educational content for dermatology practice owners only. No income, revenue, or business result is guaranteed. Results vary by owner, practice, and market.'},
];

const deck=document.getElementById('deck');
function ledger(kind){return `<svg class="ledger-motif ${kind==='title'?'title-ledger':'corner-ledger'}"><use href="#ledger"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Complete Healthcare Business Consulting &middot; <b>Jackie Coult, CHBC</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.climb) h+=ledger(s.climb);
  else if(s.t==='title') h+=ledger('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
