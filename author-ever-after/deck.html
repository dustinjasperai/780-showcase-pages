<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Romance Your Launch — a masterclass with Danika Bloom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Actor&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3ede9;        /* warm cream ground, from brand #eee8e5 */
    --panel:#ffffff;      /* brand ranked #ffffff */
    --rule:#d9cfc8;       /* warm taupe, tint of ground */
    --ink:#232020;        /* near brand body #111111 */
    --muted:#6f6660;
    --accent:#ae2759;     /* brand link/accent raspberry */
    --lav:#8580a9;        /* brand ranked-2 lavender */
    --display:'Cormorant Garamond', Georgia, serif;
    --body:'Actor', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{}
  .slide{
    min-height:100vh;scroll-snap-align:start;
    display:flex;flex-direction:column;justify-content:center;
    padding:8vh 9vw;position:relative;border-bottom:1px solid var(--rule);
  }
  .num{position:absolute;top:4vh;right:6vw;font-family:var(--display);
    font-size:15px;letter-spacing:.14em;color:var(--muted)}
  .num .heart{color:var(--accent)}
  .kicker{font-family:var(--body);text-transform:uppercase;letter-spacing:.22em;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(40px,7vw,86px);
    line-height:1.02;letter-spacing:-.01em;max-width:16ch}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(30px,5vw,60px);
    line-height:1.06;max-width:20ch}
  .lede{font-size:clamp(18px,2.1vw,25px);color:var(--ink);max-width:34ch;margin-top:26px}
  .sub{font-size:clamp(16px,1.7vw,20px);color:var(--muted);max-width:40ch;margin-top:18px}
  .accent{color:var(--accent)}
  .rule{width:64px;height:3px;background:var(--accent);margin:30px 0 0}
  .part{font-family:var(--display);font-size:clamp(15px,1.6vw,19px);
    letter-spacing:.16em;text-transform:uppercase;color:var(--lav)}
  .grid{display:grid;gap:20px;margin-top:34px;max-width:52ch}
  .grid.two{grid-template-columns:1fr 1fr}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:24px 26px}
  .card .t{font-family:var(--display);font-size:24px;font-weight:600;margin-bottom:8px}
  .card .t .n{color:var(--accent);margin-right:10px}
  .card p{font-size:16px;color:var(--muted)}
  .steps{counter-reset:step;margin-top:34px;max-width:46ch;display:grid;gap:16px}
  .step{display:flex;gap:18px;align-items:flex-start}
  .step .dot{flex:0 0 auto;width:38px;height:38px;border-radius:50%;
    background:var(--accent);color:#fff;font-family:var(--display);font-weight:600;
    display:flex;align-items:center;justify-content:center;font-size:19px}
  .step .b{font-family:var(--display);font-size:23px;font-weight:600}
  .step .s{font-size:15px;color:var(--muted);margin-top:2px}
  .title-slide{background:linear-gradient(160deg,#f6f0ec 0%,#efe6df 100%)}
  .title-slide h1{font-size:clamp(46px,8.5vw,104px)}
  .presenter{margin-top:40px;font-size:17px;color:var(--ink)}
  .presenter b{font-family:var(--display);font-weight:600}
  .presenter span{color:var(--muted)}
  .big{font-family:var(--display);font-size:clamp(34px,5.4vw,66px);
    font-weight:600;line-height:1.08;max-width:18ch}
  .cta-slide{background:var(--ink);color:var(--bg);border-bottom:none}
  .cta-slide .kicker{color:var(--lav)}
  .cta-slide h1{color:var(--bg)}
  .cta-slide .rule{background:var(--accent)}
  .cta-btn{display:inline-block;margin-top:34px;background:var(--accent);color:#fff;
    font-family:var(--body);font-size:19px;padding:16px 34px;border-radius:999px;
    text-decoration:none;letter-spacing:.02em}
  .cta-alt{margin-top:20px;font-size:16px;color:#cbb9c4}
  .disclaimer{margin-top:46px;font-size:12.5px;color:#8a7c86;max-width:52ch;line-height:1.5}
  @media(max-width:680px){.grid.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', kicker:'A free live masterclass for romance writers',
    h:'Romance Your <span class="accent">Launch</span>',
    lede:'The steady path from stuck to steadily published, for romance writers with real, full lives.',
    presenter:'with <b>Danika Bloom</b><br><span>USA Today bestselling romance author &middot; founder of Author Ever After</span>'},

  {t:'std', kicker:'What this hour gives you',
    h:'A plan you can actually <span class="accent">follow</span>.',
    sub:'By the end you will know the real reason your book has stalled, the four things every pre-published romance author needs, and the exact order to move through so your first novel finally reaches readers.'},

  {t:'std', kicker:'Who this is for',
    h:'You have a story only <span class="accent">you</span> can tell.',
    sub:'And a life that is already full. You are a mom, a caregiver, a career-juggler, a late-night writer. Every one of those is welcome here. If that is you, this hour was built for you.'},

  {t:'std', kicker:'The trap',
    h:'You were handed a hustle, not a <span class="accent">path</span>.',
    sub:'Post every day. Go viral. Be a bestseller by next Tuesday. So the draft sits in a folder, the doubt gets louder, and another year slips by with the book still unwritten.'},

  {t:'reframe', big:'The problem was never your talent or your discipline. It is that no one gave you a plan that <span class="accent">fits a real life</span>.'},

  {t:'part', part:'Part One', h:'Why first romance books stall'},

  {t:'std', kicker:'The honest diagnosis',
    h:'It is rarely about the writing.',
    sub:'Almost every writer I meet can write. What breaks down is everything around the writing: the isolation, the accountability that does not fit a real week, and the head-stuff that gets tangled with the logistics.'},

  {t:'grid', kicker:'Three real reasons',
    h:'What actually stops the book.',
    cards:[
      {t:'Isolation', p:'You are doing it alone, with no one who gets what a chapter break costs at 11pm.'},
      {t:'The wrong accountability', p:'Generic word-count challenges ignore the caregiving, the day job, the whole life.'},
      {t:'Tangled head-stuff', p:'The mindset and the logistics knot together until the whole thing feels impossible.'}
    ]},

  {t:'reframe', big:'Fix those three, and the writing you already know how to do finally has <span class="accent">room to happen</span>.'},

  {t:'part', part:'Part Two', h:'The four supports every romance author needs'},

  {t:'std', kicker:'The Author Ever After model',
    h:'Steady beats <span class="accent">heroic</span>.',
    sub:'Not a burst of motivation that fades by Thursday. Four supports that hold you up week after week, so progress becomes the default instead of the exception.'},

  {t:'grid', kicker:'Support one and two',
    h:'People, and momentum.',
    cards:[
      {n:'1', t:'Your people', p:'A cozy, off-social community and small writing pods, so you are never drafting in the dark.'},
      {n:'2', t:'Gentle accountability', p:'Daily writing sprints and a weekly mastermind. Momentum without the pressure that breaks you.'}
    ]},

  {t:'grid', kicker:'Support three and four',
    h:'A path, and a clear head.',
    cards:[
      {n:'3', t:'A clear publishing path', p:'Pen name, author website, cover brief, formatting, ARC team, launch. Step by step, in order.'},
      {n:'4', t:'A mindset shift', p:'We untangle the head-stuff from the to-do list, so the next right step is always obvious.'}
    ]},

  {t:'part', part:'Part Three', h:'Romance Your Launch, step by step'},

  {t:'steps', kicker:'The path we walk together',
    h:'From blank page to published.',
    steps:[
      {b:'Know your market', s:'Where your kind of romance actually sells, and the readers already waiting for it.'},
      {b:'Own your author identity', s:'Your pen name, your promise, the brand a reader trusts on sight.'},
      {b:'Find your readers', s:'Build the list and the small world that shows up when you publish.'}
    ]},

  {t:'steps', kicker:'The path we walk together',
    h:'The finish line is closer than it looks.',
    steps:[
      {b:'Self-edit with confidence', s:'The revision passes that make the book publish-ready without losing your voice.'},
      {b:'Get publish-ready', s:'Cover brief, formatting, and the setup that makes launch day calm.'},
      {b:'Launch with a plan', s:'A real launch runway, not a hope-and-post scramble.'}
    ]},

  {t:'std', kicker:'Why me',
    h:'I have walked this exact <span class="accent">path</span>.',
    sub:'I am Danika Bloom, a USA Today bestselling romance author with more than a dozen books, and before that 25 years writing for nonprofits and coaching solopreneurs to turn fuzzy ideas into real plans. I am warm, but I am not vague. I will cheer you on, and I will also help you decide. No weird gatekeeping.'},

  {t:'std', kicker:'A week inside Author Ever After',
    h:'A rhythm that fits your <span class="accent">real</span> week.',
    sub:'Morning or late-night sprints when you can grab them. A small pod that knows your story. A weekly mastermind for the stuck spots. Twice-monthly office hours for the business side. Progress you can feel, without upending your life.'},

  {t:'std', kicker:'The far side of it',
    h:'A finished book, with your name on the cover.',
    sub:'A published romance novel, readers who found you, and the quiet proof that you can do the next one. That is what steady, supported publishing actually delivers.'},

  {t:'cta', kicker:'Your turn',
    h:'Ready to romance your <span class="accent">launch</span>?',
    sub:'The next step is simple: come see if Author Ever After feels like home, or book a free conversation and we will map your path together.',
    btn:'Join Author Ever After',
    alt:'Prefer to talk it through first? Book a free 30-minute conversation with Danika.',
    disclaimer:'This masterclass is educational. Publishing outcomes, sales, and income vary and depend on your own work and market. No particular result is guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  const cls = ['slide'];
  if (s.t === 'title') cls.push('title-slide');
  if (s.t === 'cta') cls.push('cta-slide');
  el.className = cls.join(' ');
  const num = `<div class="num">${String(i+1).padStart(2,'0')} <span class="heart">&hearts;</span> ${String(S.length).padStart(2,'0')}</div>`;
  let inner = num;
  if (s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if (s.part) inner += `<div class="part">${s.part}</div>`;
  if (s.h) inner += (s.t==='part') ? `<h2 style="margin-top:14px">${s.h}</h2>` : `<h1>${s.h}</h1>`;
  if (s.big) inner += `<p class="big">${s.big}</p>`;
  if (s.lede) inner += `<p class="lede">${s.lede}</p>`;
  if (s.presenter) inner += `<div class="rule"></div><div class="presenter">${s.presenter}</div>`;
  if (s.sub && s.t!=='cta') inner += `<p class="sub">${s.sub}</p>`;
  if (s.cards) {
    inner += `<div class="grid ${s.cards.length>1?'two':''}">`;
    s.cards.forEach(c => {
      inner += `<div class="card"><div class="t">${c.n?`<span class="n">${c.n}</span>`:''}${c.t}</div><p>${c.p}</p></div>`;
    });
    inner += `</div>`;
  }
  if (s.steps) {
    inner += `<div class="steps">`;
    s.steps.forEach((st, j) => {
      inner += `<div class="step"><div class="dot">${j+1}</div><div><div class="b">${st.b}</div><div class="s">${st.s}</div></div></div>`;
    });
    inner += `</div>`;
  }
  if (s.t === 'cta') {
    if (s.sub) inner += `<p class="sub" style="color:#e7d9e0">${s.sub}</p>`;
    inner += `<a class="cta-btn" href="https://www.authoreverafter.com/join/">${s.btn}</a>`;
    if (s.alt) inner += `<div class="cta-alt">${s.alt}</div>`;
    if (s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  }
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
