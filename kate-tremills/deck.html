<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyful Creating — Finish the Book You Keep Starting | Kate Tremills</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f3;       /* warm blush-cream ground, from her blush #efd7cd */
    --panel:#efe3dc;    /* soft blush panel */
    --accent:#834d6c;   /* her dominant plum (brand.json, 20 uses) */
    --sage:#a2ac87;     /* her sage secondary */
    --ink:#3a2f36;      /* warm charcoal, from #404041 */
    --muted:#7a6b72;
    --disp:'Cormorant Garamond',Georgia,serif;
    --body:'Quicksand',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    position:relative;background:var(--bg);min-height:62vh;
    padding:64px 72px;margin:22px 0;border-radius:6px;
    box-shadow:0 10px 40px rgba(58,47,54,.18);
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--disp);font-weight:600;font-size:58px;line-height:1.04;color:var(--ink);letter-spacing:.2px}
  h2{font-family:var(--disp);font-weight:600;font-size:40px;line-height:1.1;color:var(--ink)}
  .sub{font-family:var(--disp);font-style:italic;font-size:26px;color:var(--accent);margin-top:20px}
  p.lead{font-size:19px;line-height:1.65;color:var(--ink);margin-top:20px;max-width:46ch}
  p.note{font-size:16px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:52ch}
  .kicker{font-family:var(--disp);font-size:120px;line-height:1;color:var(--panel);position:absolute;right:48px;top:28px;font-weight:600}
  ul{margin-top:24px;list-style:none}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 34px;position:relative;border-top:1px solid rgba(131,77,108,.16);color:var(--ink)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:22px;width:10px;height:10px;border-radius:50%;background:var(--sage)}
  li b{font-family:var(--disp);font-size:22px;color:var(--accent);font-weight:600}
  .pill{display:inline-block;background:var(--panel);color:var(--accent);font-weight:600;font-size:14px;padding:7px 15px;border-radius:999px;margin-top:22px}
  .cta h2{font-size:46px}
  .cta .step{background:var(--panel);border-radius:6px;padding:24px 28px;margin-top:26px;max-width:40ch}
  .cta .step b{color:var(--accent);font-family:var(--disp);font-size:24px}
  .disc{font-size:13px;color:var(--muted);margin-top:30px;line-height:1.55;max-width:58ch}
  .foot{position:absolute;left:72px;bottom:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .center{align-items:flex-start}
  @media(max-width:700px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:30px}.kicker{display:none}}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:'A free live masterclass with Kate Tremills',
   h:'Joyful Creating: Finish the Book You Keep Starting',
   sub:'How to take the book that has lived in you for years from idea to a real blueprint, without burning out or overthinking it into the ground.'},

  {t:'for', eyebrow:'Who this is for',
   h:'This is for the woman with an unwritten book.',
   lead:'The multi-passionate woman with three projects on the go and a book she has not finished. You have the story. You have the idea that will not leave you alone. What you do not have, yet, is a way to finish it that feels like yours.'},

  {t:'trap', k:'01', eyebrow:'The trap',
   h:'You have started it six times.',
   lead:'Every time, the same thing happens. You open the document full of hope, and within twenty minutes the overthinking shows up. Is this good enough. Who am I to write this. Maybe later, when I have more time. So you close it again.',
   note:'It is not a time problem. You find time for everything else that matters.'},

  {t:'reframe', eyebrow:'The reframe',
   h:'The problem was never your discipline.',
   sub:'It is that writing stopped feeling like yours.'},

  {t:'part', eyebrow:'Part one', k:'I',
   h:'Why books stay unwritten.',
   lead:'Somewhere along the way, creating got tangled up with pressure, hustle and proving yourself. The joy that made you want to write in the first place went quiet. And a project with no joy underneath it is almost impossible to finish, no matter how disciplined you are.'},

  {t:'list', eyebrow:'What that looks like',
   h:'The four quiet book-killers.',
   items:[
     ['Overthinking','You edit the first sentence for an hour and never reach the second.'],
     ['No clear reader','You are writing for everyone, so the book will not land for anyone.'],
     ['A borrowed voice','You sound like the authors you admire instead of like you.'],
     ['No map','Without a structure, every writing session starts from zero.']
   ]},

  {t:'part', eyebrow:'Part two', k:'II',
   h:'The Joyful Creating method.',
   lead:'This is the different relationship with your own creativity that I teach: joy as the through-line, with real structure built underneath it. Not one or the other. Inspiration gives you the fuel. Structure gives you the finished book.'},

  {t:'pillar', eyebrow:'The path, step one', k:'1',
   h:'Nail Your Idea.',
   lead:'We get crystal clear on the one book you are actually here to write, and turn the fog into a single Book Idea Statement you can hold in one hand.'},

  {t:'pillar', eyebrow:'The path, step two', k:'2',
   h:'Know Your Market.',
   lead:'We build a Market Map of exactly who this book is for and what they are already reading, so your book has a real place to land instead of floating in a vacuum.'},

  {t:'pillar', eyebrow:'The path, step three', k:'3',
   h:'Find Your Voice.',
   lead:'We make a Voice and Style Guide that sounds like you on your best day, so the writing stops fighting you and starts flowing.'},

  {t:'pillar', eyebrow:'The path, step four', k:'4',
   h:'Build Your Blueprint.',
   lead:'We shape a Book Arc, a structure that makes the whole thing feel doable. You leave knowing exactly what the next writing session is, and the one after that.'},

  {t:'reframe', eyebrow:'How I coach',
   h:'Kind firmness.',
   sub:'Warm and direct at once, the gentle nudge that will not let you quietly abandon your book.'},

  {t:'list', eyebrow:'The creative practice underneath',
   h:'Refill the well, then write.',
   items:[
     ['Creative self-care','Short practices that reconnect you with your spark before the inner critic wakes up.'],
     ['Intentional attention','Meditation and journaling that clear the block, not productivity hacks that add pressure.'],
     ['A joyful reset','When you stall, you reset and return, instead of spiraling and quitting.']
   ]},

  {t:'part', eyebrow:'Part three', k:'III',
   h:'When the book stops being the thing you avoid.',
   lead:'The overthinking loses its grip. You know who you are writing for and you sound like yourself. You sit down and the next scene is already waiting. The book stops being the thing you avoid and becomes the thing you look forward to.'},

  {t:'why', eyebrow:'Why me',
   h:'I have walked this road.',
   lead:'I am the number-one bestselling author of Joyful Creating, with five-plus books across fiction and nonfiction. Before coaching I was a screenwriter in Los Angeles, represented by a manager and an agent, and a journalist for Elle Canada and beyond. I am a member of the Writers Guild of Canada.',
   note:'I built the Joyful Creating method out of my own burnout, the moment I had to stop and reconnect with why I ever wanted to create at all.'},

  {t:'cta', eyebrow:'Your next step',
   h:'Let us write your damn book.',
   lead:'If finishing the book inside you through joy instead of willpower is what you want, here is how we work together next.',
   step:['Book a coaching call','Tell me where your book is stuck, and we map the fastest joyful path from where you are to a finished draft.'],
   disc:'This masterclass is educational. It shares a creative method and process only. No specific publishing, sales or income result is guaranteed. Results vary by writer and by book, and depend on the work you put in.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'cta' ? 'cta' : '');
  let html = '';
  if (s.k) html += '<div class="kicker">' + s.k + '</div>';
  if (s.eyebrow) html += '<div class="eyebrow">' + s.eyebrow + '</div>';
  if (s.t === 'title') {
    html += '<h1>' + s.h + '</h1>';
    if (s.sub) html += '<p class="lead">' + s.sub + '</p>';
  } else {
    html += '<h2>' + s.h + '</h2>';
  }
  if (s.sub && s.t !== 'title') html += '<div class="sub">' + s.sub + '</div>';
  if (s.lead) html += '<p class="lead">' + s.lead + '</p>';
  if (s.items) {
    html += '<ul>';
    s.items.forEach(it => { html += '<li><b>' + it[0] + '.</b> ' + it[1] + '</li>'; });
    html += '</ul>';
  }
  if (s.step) html += '<div class="step"><b>' + s.step[0] + '.</b><br>' + s.step[1] + '</div>';
  if (s.note) html += '<p class="note">' + s.note + '</p>';
  if (s.disc) html += '<p class="disc">' + s.disc + '</p>';
  html += '<div class="foot">Joyful Creating &middot; Kate Tremills &middot; ' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
