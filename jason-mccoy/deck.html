<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Zero to Your First Paid Voice-Over Job &middot; Voice Acting 101</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f7fb;      /* cool blue-tinted studio paper (their light site scheme) */
    --panel:#e7eef6;   /* pale steel panel, tint of the brand blue */
    --ink:#10202e;     /* deep navy-black type */
    --ink-soft:#35434f;/* body copy on cool paper */
    --rule:rgba(16,32,46,.14);
    --dim:#7a8794;     /* muted caption */
    --accent:#2d6c9f;  /* Voice Acting 101 steel blue (brand.json, 14 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"IBM Plex Sans",-apple-system,sans-serif;
    display:flex;align-items:center;justify-content:center;
    -webkit-font-smoothing:antialiased;
  }
  #stage{
    position:relative;width:100%;max-width:960px;aspect-ratio:16/9;
    background:
      radial-gradient(120% 90% at 84% 6%, rgba(45,108,159,.12), transparent 58%),
      var(--bg);
    overflow:hidden;box-shadow:0 0 0 1px var(--rule);
  }
  .slide{position:absolute;inset:0;padding:8% 9%;display:none;flex-direction:column;justify-content:center}
  .slide.on{display:flex}
  .kick{font-family:"Space Grotesk",sans-serif;font-weight:600;letter-spacing:.2em;
    text-transform:uppercase;font-size:clamp(12px,1.6vw,16px);color:var(--accent);margin-bottom:1em}
  h1{font-family:"Space Grotesk",sans-serif;font-weight:700;line-height:1.0;
    font-size:clamp(36px,7.4vw,78px);letter-spacing:-.01em}
  h2{font-family:"Space Grotesk",sans-serif;font-weight:600;line-height:1.04;
    font-size:clamp(27px,5.2vw,52px);letter-spacing:-.005em}
  .lede{font-size:clamp(16px,2.2vw,23px);line-height:1.5;max-width:42ch;margin-top:.85em;color:var(--ink-soft)}
  .rule{width:74px;height:4px;background:var(--accent);margin:1.05em 0;border-radius:2px}
  ul{list-style:none;margin-top:1.1em;max-width:48ch}
  li{position:relative;padding-left:1.7em;margin:.62em 0;font-size:clamp(15px,2vw,21px);line-height:1.4;color:var(--ink-soft)}
  li::before{content:"";position:absolute;left:0;top:.52em;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .big{font-family:"Space Grotesk",sans-serif;font-weight:700;font-size:clamp(64px,15vw,164px);color:var(--accent);line-height:.92;letter-spacing:-.02em}
  .step{display:flex;gap:.85em;align-items:baseline;margin:.5em 0;max-width:50ch}
  .step .n{font-family:"Space Grotesk",sans-serif;font-weight:700;color:var(--accent);
    font-size:clamp(18px,2.6vw,30px);min-width:3.4em;letter-spacing:.02em}
  .step .t{font-size:clamp(15px,2vw,21px);line-height:1.38;color:var(--ink-soft)}
  .card .lede{max-width:52ch}
  .cardwrap .inner{background:var(--panel);padding:5.5% 6.5%;border-left:6px solid var(--accent);border-radius:4px}
  .foot{position:absolute;left:9%;bottom:5.5%;font-family:"Space Grotesk",sans-serif;
    letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--dim)}
  .disc{font-size:13px;line-height:1.55;color:var(--dim);max-width:56ch;margin-top:1.3em}
  #nav{position:fixed;bottom:14px;right:18px;display:flex;gap:8px;align-items:center;
    font-family:"Space Grotesk",sans-serif;font-size:14px;color:var(--dim)}
  #nav button{font:inherit;background:var(--panel);color:var(--ink);border:1px solid var(--rule);
    width:32px;height:32px;cursor:pointer;border-radius:3px}
  #nav button:hover{background:var(--accent);color:#fff;border-color:var(--accent)}
  #count{min-width:56px;text-align:center;letter-spacing:.12em}
  .prog{position:fixed;top:0;left:0;height:4px;background:var(--accent);transition:width .2s}
</style>
</head>
<body>
<div class="prog" id="prog"></div>
<div id="stage" aria-live="polite"></div>
<div id="nav"><button id="prev" aria-label="Previous">&#8592;</button>
<span id="count"></span><button id="next" aria-label="Next">&#8594;</button></div>
<script>
const S=[
 {t:'title', kick:'A free live masterclass with Jason McCoy',
  h:'From Zero to Your First Paid Voice-Over Job',
  lede:'How to start a voice-over career from home, land real paying work, and do it without an agent or a fancy studio.'},

 {t:'point', kick:'Who this hour is for',
  h:'You, if you keep meaning to start',
  list:['You love the idea of voice-over but have never been paid for it',
        'You are not sure your setup, your voice, or your demo is good enough',
        'You have no agent, no contact, and no idea where the work actually is'],
  foot:'Voice Acting 101'},

 {t:'point', kick:'The trap',
  h:'Waiting until you feel ready',
  list:['You keep buying gear and courses instead of booking work',
        'You think you have to be discovered before you can start',
        'Another year passes and you still have not sent a single quote'],
  foot:'Voice Acting 101'},

 {t:'reframe', big:'"Someday"',
  lede:'is the most expensive word in voice-over. The working actors you admire launched before they felt ready, and got paid while they were still learning.'},

 {t:'section', kick:'Part one',
  h:'You do not have a talent problem',
  lede:'You have a launch problem. Talent gets you ready to record. A launch gets you a booth, a demo, and a first client who pays.'},

 {t:'point', kick:'The old advice',
  h:'Why "just get an agent" fails beginners',
  list:['Agents sign people who are already booking, not people starting out',
        'Your first paying jobs come from you, not from being represented',
        'Modern voice-over is bought online, direct, every single day'],
  foot:'Voice Acting 101'},

 {t:'section', kick:'Part two',
  h:'The VO Launch Plan',
  lede:'The exact path from a spare room to a paid booking. Five moves, in order.'},

 {t:'point', kick:'Move one',
  h:'A booth that sounds professional',
  list:['Record broadcast-quality audio on a beginner budget',
        'Treat a closet or a corner so it sounds like a real studio',
        'Set your levels and edit so a client never hears the room'],
  foot:'Recording Quality VO'},

 {t:'point', kick:'Move two',
  h:'Perform for the job, not the applause',
  list:['Match your natural voice to the work that actually hires',
        'Take direction and self-direct a clean, usable read',
        'Audition in a way that gets you shortlisted, not skipped'],
  foot:'Voice Acting Performance'},

 {t:'point', kick:'Move three',
  h:'A demo that gets you hired',
  list:['Know when you are genuinely ready to record one',
        'Write and produce a commercial demo yourself',
        'Lead with the exact sound buyers are listening for'],
  foot:'The DIY Demo'},

 {t:'point', kick:'Move four',
  h:'Run it like a business',
  list:['Set rates you can quote without flinching',
        'Handle delivery, invoicing, and union versus non-union',
        'Look like a pro from the very first email'],
  foot:'The Business Side'},

 {t:'point', kick:'Move five',
  h:'Go and get the work',
  list:['Build a simple site and demo player buyers trust',
        'Use pay-to-play platforms without drowning in them',
        'Pitch direct clients who book you again and again'],
  foot:'Getting Voice-Over Work'},

 {t:'section', kick:'Part three',
  h:'What the first 90 days look like',
  lede:'This is not a burst of talent. It is a short, ordered sprint that ends with a real booking.'},

 {t:'steps', kick:'The launch sprint',
  h:'From setup to first quote',
  steps:[['Week 1','Build the booth and dial in your sound'],
         ['Week 2','Find your niche and train the read'],
         ['Week 3','Write and record your demo'],
         ['Week 4','Set your rates and build a simple site'],
         ['Week 5','Send your first real pitches']],
  foot:'Voice Acting 101'},

 {t:'point', kick:'The shift',
  h:'From "someday" to booked',
  list:['You stop collecting gear and start collecting clients',
        'You have a demo, a price, and a place to send them',
        'Your first paid job stops being a maybe'],
  foot:'Voice Acting 101'},

 {t:'card', kick:'Why listen to me',
  h:'20+ years behind the mic',
  lede:'I have voiced work for brands like Amazon, Emirates, PetSmart, and Walmart across more than twenty years. I built Voice Acting 101 to hand beginners the exact launch I had to piece together the hard way. This is the path I teach inside the VO Launch Plan.',
  foot:'Jason McCoy · Voice Acting 101'},

 {t:'point', kick:'The recap',
  h:'What you leave with today',
  list:['Why launching beats waiting to be ready',
        'The five moves from bedroom to booking',
        'A 90-day sprint you can start this week'],
  foot:'Voice Acting 101'},

 {t:'cta',
  h:'Start your launch inside the VO Launch Plan',
  lede:'The VO Launch Plan walks you through every move above at your own pace, with feedback and mentorship options and a 30-day guarantee. Grab the free 5-Step VO Guide today and make the first move.',
  disc:'This masterclass is educational. No income, booking, or client result is guaranteed. Results vary and depend on your own work, your market, and your effort.',
  foot:'Voice Acting 101 · voiceacting101.com'}
];

const stage=document.getElementById('stage');
const countEl=document.getElementById('count');
const progEl=document.getElementById('prog');
let i=0;

function render(){
  stage.innerHTML='';
  const s=S[i];
  const el=document.createElement('div');
  el.className='slide on';
  if(s.t==='card') el.classList.add('card','cardwrap');
  let h='';
  const openInner = s.t==='card' ? '<div class="inner">' : '';
  const closeInner = s.t==='card' ? '</div>' : '';
  if(s.kick) h+='<div class="kick">'+s.kick+'</div>';
  if(s.t==='reframe'){
    h+='<div class="big">'+s.big+'</div>';
    if(s.lede) h+='<p class="lede" style="margin-top:.7em">'+s.lede+'</p>';
  } else if(s.t==='title'){
    h+='<h1>'+s.h+'</h1><div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
  } else if(s.t==='cta'){
    h+='<h2>'+s.h+'</h2><div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    if(s.disc) h+='<p class="disc">'+s.disc+'</p>';
  } else if(s.t==='card'){
    h+=openInner+'<h2>'+s.h+'</h2><div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    h+=closeInner;
  } else {
    if(s.h) h+='<h2>'+s.h+'</h2>';
    if(s.t==='section') h+='<div class="rule"></div>';
    if(s.lede) h+='<p class="lede">'+s.lede+'</p>';
    if(s.list){h+='<ul>';s.list.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
    if(s.steps){s.steps.forEach(x=>h+='<div class="step"><span class="n">'+x[0]+'</span><span class="t">'+x[1]+'</span></div>');}
  }
  if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
  el.innerHTML=h;
  stage.appendChild(el);
  countEl.textContent=(i+1)+' / '+S.length;
  progEl.style.width=((i+1)/S.length*100)+'%';
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));render();}
document.getElementById('next').onclick=()=>go(i+1);
document.getElementById('prev').onclick=()=>go(i-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')go(i+1);
  if(e.key==='ArrowLeft')go(i-1);
});
stage.addEventListener('click',e=>{const r=stage.getBoundingClientRect();
  if(e.clientX-r.left>r.width*0.5)go(i+1);else go(i-1);});
render();
</script>
</body>
</html>
