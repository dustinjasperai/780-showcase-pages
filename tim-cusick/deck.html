<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Data-Driven Rider — a BaseCamp masterclass with Tim Cusick</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b2033;        /* ground: deepened BaseCamp navy (#013150 / #1a3a53 family) */
    --panel:#14314a;     /* their brand navy #1a3a53, one step up */
    --rule:#3a5a74;      /* hairline from the #8098a8 steel family */
    --accent:#90dfe2;    /* brand bright-aqua link color, verbatim from brand.json */
    --ink:#eaf1f6;       /* headline on navy */
    --body:#b9c7d2;      /* body, their pale-grey family */
    --muted:#7f93a3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--body);font-family:"Source Sans 3",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto}
  .slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:7vh 6.2vw;border-bottom:1px solid var(--rule);position:relative}
  .kicker{font-family:"Oswald",sans-serif;font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:"Oswald",sans-serif;font-weight:700;color:var(--ink);font-size:clamp(34px,5.6vw,66px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:"Oswald",sans-serif;font-weight:600;color:var(--ink);font-size:clamp(26px,3.8vw,42px);line-height:1.08;margin-bottom:18px}
  p.lead{font-size:clamp(17px,2vw,22px);max-width:42ch;margin-top:20px;color:var(--body)}
  p.big{font-size:clamp(20px,2.6vw,30px);max-width:32ch;color:var(--ink);font-weight:500}
  .sub{color:var(--muted);font-size:14px;margin-top:26px;font-family:"Oswald",sans-serif;letter-spacing:.14em;text-transform:uppercase}
  ul{list-style:none;margin-top:26px;max-width:48ch}
  li{position:relative;padding-left:30px;margin-bottom:16px;font-size:clamp(16px,1.8vw,19px)}
  li::before{content:"";position:absolute;left:0;top:.62em;width:11px;height:2px;background:var(--accent)}
  .num{font-family:"Oswald",sans-serif;font-weight:700;color:var(--accent);font-size:clamp(44px,7vw,92px);line-height:1}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:22px;margin-top:30px;max-width:62ch}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:7px;padding:22px}
  .card h3{font-family:"Oswald",sans-serif;font-weight:600;color:var(--accent);font-size:17px;letter-spacing:.04em;margin-bottom:8px}
  .card p{font-size:15px;color:var(--body)}
  .curve{margin-top:34px;max-width:560px}
  .curve svg{width:100%;height:auto;display:block}
  .bars{display:flex;gap:18px;align-items:flex-end;margin-top:34px;height:190px;max-width:520px}
  .bars .b{flex:1;background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--accent);position:relative;display:flex;align-items:flex-end;justify-content:center}
  .bars .b span{font-family:"Oswald",sans-serif;font-size:12px;letter-spacing:.08em;color:var(--muted);text-transform:uppercase;padding:8px 4px;text-align:center}
  .cta h1{margin-bottom:10px}
  .disclaimer{color:var(--muted);font-size:12.5px;max-width:64ch;margin-top:30px;line-height:1.55;border-top:1px solid var(--rule);padding-top:18px}
  .foot{position:absolute;bottom:22px;left:6.2vw;color:var(--muted);font-size:12px;font-family:"Oswald",sans-serif;letter-spacing:.14em;text-transform:uppercase}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',
   kicker:'A BaseCamp Masterclass',
   h1:'The Data-Driven Rider',
   lead:'How to read your own power numbers and build the season you actually want, without just riding more hours.',
   sub:'With Tim Cusick, Founder & Head Coach, BaseCamp'},

  {t:'who',
   kicker:'Who this is for',
   h2:'You ride a lot. You are not getting much faster.',
   bullets:[
     'You train most weeks and still plateau every spring.',
     'You have power data from your head unit and no idea what to do with it.',
     'You are time-crunched, 6 to 18 hours a week, and cannot afford junk miles.',
     'You want to peak for one or two events, not just survive the group ride.']},

  {t:'trap',
   kicker:'The trap',
   h2:'Three things riders do when they want to get faster.',
   bullets:[
     'Ride more miles and hope volume does the work.',
     'Copy a pro plan built for a body and a calendar that are not yours.',
     'Train by feel, so the hard days are too easy and the easy days are too hard.'],
   lead:'All three ignore the one thing already sitting in your files: your own numbers.'},

  {t:'reframe',
   kicker:'The reframe',
   big:'More hours is not the lever. Training to your own power profile is.',
   lead:'The data already tells you what to do. Most riders have simply never been shown how to read it.'},

  {t:'part',num:'01',
   kicker:'Part one',
   h2:'Why "just ride more" stops working',
   bullets:[
     'Volume with no structure builds fatigue faster than fitness.',
     'Averages hide the truth about where you are strong and where you leak time.',
     'Without a baseline you cannot tell real progress from a good day.']},

  {t:'engines',
   kicker:'Part one',
   h2:'You are not training one engine. You are training three.',
   lead:'Your short, medium and long power each come from a different system. Lump them together and you train none of them well.',
   bars:[
     {label:'5 sec sprint'},
     {label:'5 min VO2'},
     {label:'20 min threshold'},
     {label:'3 hour endurance'}]},

  {t:'curve',
   kicker:'The idea that changes everything',
   h2:'Your Power Duration Curve is your fingerprint',
   lead:'Plot your best power from a few seconds to a few hours and you see exactly where you are strong, where you fade, and which system to train next.'},

  {t:'part',num:'02',
   kicker:'Part two: the method',
   h2:'DataSmart: train to your numbers, not someone else’s',
   lead:'The approach I built from leading the WKO power-analysis software the sport’s coaches use. Four moves, in order.'},

  {t:'framework',
   kicker:'The DataSmart method',
   cards:[
     {h:'1. Find your rider type',p:'Your curve tells us whether you are a sprinter, an all-rounder, or a time-trial diesel. Training follows the truth, not a label.'},
     {h:'2. Set the real numbers',p:'Modeled FTP and the full curve, re-tested as you change, so every zone is yours and not a guess.'},
     {h:'3. Match the periodization',p:'Base 1, Base 2, then Build, scaled to your weekly hours and your one goal event.'},
     {h:'4. Read and adjust',p:'We review the completed session and how you felt, not just the file. The number starts the conversation; the rider finishes it.'}]},

  {t:'periodization',
   kicker:'Part two: the season',
   h2:'Base, base, build, peak',
   bullets:[
     'Base 1 and Base 2 grow the aerobic engine that carries everything else.',
     'Build turns that base into the specific power your event demands.',
     'For time-crunched riders we use undulating weeks, so short hours still progress.',
     'Everything is planned backward from the one day that matters to you.']},

  {t:'ecosystem',
   kicker:'Part two: the whole athlete',
   h2:'The engine is only one system',
   lead:'A power plan on its own leaves watts on the table. BaseCamp trains four systems together.',
   cards:[
     {h:'Training',p:'Structured, progressive, matched to your data and your calendar.'},
     {h:'Nutrition',p:'Fuelling the work so the adaptations actually stick.'},
     {h:'Strength',p:'Cycling-specific work that protects the body and the power.'},
     {h:'Mental',p:'The skills to show up, hold the plan, and race your season.'}]},

  {t:'part',num:'03',
   kicker:'Part three: your winter, mapped',
   h2:'A season built around your own data',
   bullets:[
     'A baseline test and a curve you can actually read.',
     'A plan that changes when your numbers change, not on a fixed template.',
     'Weekly live coach-led workouts with a team of riders at your level.',
     'One clear peak, planned back from the event that matters to you.']},

  {t:'belong',
   kicker:'Part three: the room you train in',
   big:'Train Where You Belong.',
   lead:'The typical BaseCamp rider is 54, rides for life, and still wants to get faster. You train alongside people at your level, not against pros you will never be.'},

  {t:'mistake',
   kicker:'One thing to avoid',
   h2:'Do not chase someone else’s FTP',
   lead:'The fastest way to stall is to borrow a number off the internet and train to it. Your curve, re-tested as you grow, is the only number that moves you forward.'},

  {t:'why',
   kicker:'Why trust this',
   h2:'Where the method comes from',
   bullets:[
     'I co-developed WKO5, the power-analysis software used across endurance sport.',
     'Athletes I have coached hold world and national titles, and world bests.',
     'BaseCamp runs 35+ certified coaches and one shared idea about how people get faster.']},

  {t:'recap',
   kicker:'What you now know',
   h2:'The whole method in one breath',
   bullets:[
     'Volume is not the lever. Your power profile is.',
     'Your curve shows which of your three engines to train next.',
     'A season matched to your numbers, fuelled, strengthened, and backed by a team.']},

  {t:'cta',
   kicker:'Your next step',
   h1:'Build your season around your numbers',
   lead:'Start with a free 20-minute consult. We look at your data, map one goal, and show you where your time is best spent this winter.',
   sub:'BaseCamp Endurance Coaching: Train Where You Belong',
   disclaimer:'This masterclass is for education only. Training outcomes vary by rider, history, health, consistency and available time; no specific performance result is promised or guaranteed. Always consult a qualified medical professional before starting or changing a training program.'}
];

const deck=document.getElementById('deck');
function curveSVG(){
  return '<div class="curve"><svg viewBox="0 0 560 230" role="img" aria-label="Power duration curve">'
   +'<line x1="40" y1="190" x2="540" y2="190" stroke="#3a5a74" stroke-width="1.5"/>'
   +'<line x1="40" y1="20" x2="40" y2="190" stroke="#3a5a74" stroke-width="1.5"/>'
   +'<path d="M48 40 C140 46, 180 120, 300 150 S 480 182, 536 185" fill="none" stroke="#90dfe2" stroke-width="3"/>'
   +'<circle cx="48" cy="40" r="4" fill="#90dfe2"/><circle cx="300" cy="150" r="4" fill="#90dfe2"/><circle cx="536" cy="185" r="4" fill="#90dfe2"/>'
   +'<text x="48" y="212" fill="#7f93a3" font-family="Oswald" font-size="11" letter-spacing="1">5 SEC</text>'
   +'<text x="270" y="212" fill="#7f93a3" font-family="Oswald" font-size="11" letter-spacing="1">5 MIN</text>'
   +'<text x="486" y="212" fill="#7f93a3" font-family="Oswald" font-size="11" letter-spacing="1">1 HOUR</text>'
   +'<text x="8" y="36" fill="#7f93a3" font-family="Oswald" font-size="11" letter-spacing="1" transform="rotate(-90 14 110)">WATTS</text>'
   +'</svg></div>';
}
function barsHTML(items){
  const hs=[88,64,52,38];
  return '<div class="bars">'+items.map((it,k)=>'<div class="b" style="height:'+hs[k%hs.length]+'%"><span>'+it.label+'</span></div>').join('')+'</div>';
}
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.big) h+='<p class="big">'+s.big+'</p>';
  if(s.num) h+='<div class="num">'+s.num+'</div>';
  if(s.bullets){h+='<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';}
  if(s.t==='curve') h+=curveSVG();
  if(s.bars) h+=barsHTML(s.bars);
  if(s.cards){h+='<div class="grid">'+s.cards.map(c=>'<div class="card"><h3>'+c.h+'</h3><p>'+c.p+'</p></div>').join('')+'</div>';}
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.sub) h+='<div class="sub">'+s.sub+'</div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="foot">BaseCamp · The Data-Driven Rider · '+(i+1)+' / '+S.length+'</div>';
  sec.innerHTML=h;
  deck.appendChild(sec);
});
</script>
</body>
</html>
