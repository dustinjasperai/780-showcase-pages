<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Success Beyond Game Day — The Championship Routine (Masterclass)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2;        /* their light scheme, warm off-white */
    --panel:#ffffff;
    --ink:#262626;       /* their charcoal #333/#363636 family */
    --muted:#6f685f;
    --rule:#e6ddd0;
    --accent:#ff8200;    /* their brand orange, --awb-color-4 */
    --accent-deep:#c96a00;
    --teal:#009473;      /* their --awb-color-5, used sparingly */
    --display:'Oswald',sans-serif;
    --body:'Raleway',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 10px 30px rgba(80,55,25,.06);position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .kicker{font-family:var(--display);font-weight:600;letter-spacing:.2em;text-transform:uppercase;
    font-size:14px;color:var(--accent-deep);margin-bottom:20px}
  h1{font-family:var(--display);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:.01em}
  h2{font-family:var(--display);font-weight:700;font-size:38px;line-height:1.1}
  .sub{font-size:21px;color:var(--muted);margin-top:20px;max-width:40ch;line-height:1.5}
  .lead{font-size:24px;line-height:1.5;margin-top:10px;max-width:46ch}
  .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.1;max-width:24ch}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
  li{font-size:21px;line-height:1.4;padding-left:34px;position:relative;max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:50%;
    background:var(--accent)}
  li b{font-family:var(--display);font-weight:600}
  .part{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--teal)}
  .num{font-family:var(--display);font-weight:700;font-size:120px;color:var(--rule);line-height:.8;
    position:absolute;right:40px;bottom:16px}
  .title-slide{background:linear-gradient(135deg,#fff 0%,#fff6ec 100%)}
  .title-slide h1{font-size:60px}
  .promise{margin-top:28px;font-size:22px;font-weight:600;color:var(--accent-deep)}
  .cta-slide{background:linear-gradient(135deg,#fff6ec 0%,#ffe9d2 100%)}
  .cta-step{font-family:var(--display);font-weight:700;font-size:30px;color:var(--accent-deep);margin-top:18px}
  .disclaimer{margin-top:30px;font-size:14px;color:var(--muted);line-height:1.5;max-width:60ch;
    border-top:1px solid var(--rule);padding-top:16px}
  .foot{font-family:var(--display);letter-spacing:.14em;text-transform:uppercase;font-size:12px;
    color:var(--muted);margin-top:26px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:38px}.title-slide h1{font-size:42px}h2{font-size:28px}.big{font-size:32px}.num{display:none}}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', k:'Success Beyond Game Day', h:'The Championship Routine',
   sub:'How to go pro in life before the game ends.',
   promise:'A live masterclass for athletes who want their next chapter to feel like a win, not a cliff.'},

  {t:'who', k:'Who this is for',
   h:'The athlete who can see the finish line',
   bullets:['Your final season is in sight and you are already wondering what is next.',
            'You went pro, then it ended, and the real world felt strangely quiet.',
            'Your Olympic or college run is closing and you want a plan, not a panic.',
            'You coach or raise athletes and want them ready for life, not just the next game.']},

  {t:'content', k:'The trap', h:'You had a playbook for every game',
   lead:'Nobody handed you one for after. So most athletes improvise the biggest transition of their lives with no system at all.'},

  {t:'reframe', k:'The real risk', big:'The danger is not losing. It is waiting until game over to ask who you are.'},

  {t:'part', part:'Part One', h:'Talent does not transfer. The routine does.'},

  {t:'content', k:'The identity cliff', h:'Who am I beyond sport?',
   lead:'When the cleats come off, the schedule, the team, and the identity all leave at once. I know the feeling. I walked off the field at Pitt with a degree and a full blown identity crisis.'},

  {t:'content', k:'The core problem', h:'Most athletes start the day after',
   lead:'The transition gets handled in crisis mode, once the career is already over. The athletes who thrive start it on Day 1, while they still compete.'},

  {t:'part', part:'Part Two', h:'The Athlete Advantage'},

  {t:'content', k:'The edge you already own', h:'Five rare traits, most people never build',
   bullets:['<b>Coachability</b>. You welcome feedback instead of defending against it.',
            '<b>Sacrifice</b>. You trade comfort now for results later, on purpose.',
            '<b>Hyper focused consistency</b>. You repeat the small things when nobody is watching.',
            '<b>Beast mode on demand</b>. You find another gear when it counts.',
            '<b>Winner mentality</b>. You expect to figure it out and you do.']},

  {t:'content', k:'The translation principle', h:'How you do anything is how you do everything',
   lead:'These traits are the rarest skills in any boardroom. The work is learning to name them and point them at a new field.'},

  {t:'part', part:'Part Two, continued', h:'The Championship Routine, built from Day 1'},

  {t:'content', k:'The four pillars', h:'Develop the whole athlete',
   bullets:['<b>Mental game</b>. Focus, resilience, and identity that outlast the sport.',
            '<b>Business acumen</b>. How value gets created and captured in the real world.',
            '<b>Financial literacy</b>. Turning earnings and effort into something that lasts.',
            '<b>Go pro in life</b>. A clear next move you are proud to run toward.']},

  {t:'content', k:'The routine', h:'One percent better, every day',
   lead:'A championship routine is not a motivational moment. It is a repeatable weekly system you run on Day 1 and keep running, so the handoff is smooth when it comes.'},

  {t:'part', part:'Part Three', h:'Run it like a season'},

  {t:'content', k:'The five step playbook', h:'Goal creation to manifestation',
   bullets:['Name the opportunity you actually want, in plain words.',
            'Take the first visible action this week, not someday.',
            'Apply the life tools you already earned in competition.',
            'Build the people and the brand around the move.',
            'Review, adjust, and run it again. Grit, then greatness.']},

  {t:'content', k:'The identity you rebuild', h:'Chameleon, wolf, lion',
   bullets:['<b>Chameleon</b>. Curious, unafraid of change, able to adapt to any room.',
            '<b>Wolf</b>. Lead from the front or the back, whatever the team needs.',
            '<b>Lion</b>. Keep the competitor. Give that beast mode a new field to win on.']},

  {t:'content', k:'A week in the routine', h:'Small, repeatable, yours',
   lead:'Identity work, a skills audit, one networking rep, one brand move, one decision toward your next chapter, then a review. Seven days that compound.'},

  {t:'why', k:'Why me', h:'Samantha Card',
   bullets:['Former NCAA Division 1 softball player at the University of Pittsburgh.',
            'MBA and a Fortune 100 career built after the game.',
            'Author of The Athlete Advantage, Success Beyond Game Day.',
            'On a mission to help one billion athletes extend their impact beyond the game.']},

  {t:'recap', k:'The whole routine', h:'Three parts, one outcome',
   bullets:['The routine transfers when the talent cannot.',
            'The Athlete Advantage is the edge you already own.',
            'Built from Day 1, the handoff becomes your next win.']},

  {t:'cta', k:'Your next step', h:'Build your Championship Routine',
   step:'Join the Level Up program at successbeyondgameday.com',
   sub:'Start the routine while you still compete, and go pro in life.',
   disc:'This masterclass is for educational purposes only. It shares frameworks and routines, not promises. No income or result is guaranteed. Results vary from person to person.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  let cls = 'slide';
  if (s.t === 'title') cls += ' title-slide';
  if (s.t === 'cta') cls += ' cta-slide';
  d.className = cls;
  let html = '';
  if (s.k) html += `<div class="kicker">${s.k}</div>`;
  if (s.part) html += `<div class="part">${s.part}</div>`;
  if (s.h) html += (s.t === 'part') ? `<h2>${s.h}</h2>` : `<h1>${s.h}</h1>`;
  if (s.big) html += `<div class="big">${s.big}</div>`;
  if (s.lead) html += `<p class="lead">${s.lead}</p>`;
  if (s.sub && s.t !== 'cta') html += `<p class="sub">${s.sub}</p>`;
  if (s.bullets) html += '<ul>' + s.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
  if (s.promise) html += `<div class="promise">${s.promise}</div>`;
  if (s.step) html += `<div class="cta-step">${s.step}</div>`;
  if (s.sub && s.t === 'cta') html += `<p class="sub">${s.sub}</p>`;
  if (s.disc) html += `<div class="disclaimer">${s.disc}</div>`;
  if (s.t !== 'title' && s.t !== 'cta') html += `<div class="num">${String(i).padStart(2,'0')}</div>`;
  if (s.t === 'title') html += `<div class="foot">Live masterclass with Samantha Card</div>`;
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
