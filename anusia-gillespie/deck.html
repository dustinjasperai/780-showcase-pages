<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Bottega Method Masterclass · Anusia Gillespie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5efe6; --panel:#ece3d4; --rule:#ddd0bd;
    --accent:#be7327; --accent-lift:#d88f3e; --ink:#0f1d33; --body:#4a463d;
    --muted:#8a8377; --cream:#f5efe6; --sky:#aecad8;
  }
  html,body{height:100%}
  body{background:#0b1220;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1220}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'EB Garamond',Georgia,serif;font-weight:500;color:var(--ink);line-height:1.12;letter-spacing:-.003em}
  .t-title h1{font-size:5.4vw;max-width:15em}
  .t-normal h1{font-size:3.5vw;max-width:84%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.42vw;color:var(--body);margin-top:2.6vh;max-width:72%;line-height:1.6;font-weight:300}
  .sub{font-family:'Inter',sans-serif;font-size:1.7vw;color:var(--body);margin-top:3.2vh;max-width:74%;line-height:1.5;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.28vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:5vw;max-width:90%}
  .thread{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),rgba(190,115,39,0));margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#182f51 0%,#0f1d33 70%);align-items:center;text-align:center}
  .t-dark h1{font-size:4vw;max-width:88%;font-style:italic;color:var(--cream);font-weight:400}
  .t-dark .kicker{color:var(--accent-lift)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#182f51 0%,#0f1d33 70%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.3vw;max-width:82%;color:var(--cream)}
  .chips{display:flex;gap:1vw;margin-top:4.4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent-lift);color:#f0d8b8;border-radius:100px;padding:1.3vh 1.8vw;font-family:'Inter',sans-serif;font-size:1.18vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Inter',sans-serif;font-size:.9vw;color:var(--muted);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:#9fb0c4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Inter',sans-serif;font-size:1.28vw;color:var(--body);margin-top:3.6vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .title-thread{position:absolute;right:8.4%;bottom:12%;width:24vw;height:2px;background:linear-gradient(90deg,rgba(190,115,39,0),var(--accent))}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(15,29,51,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 23</div>
<div class="brand-foot">Soul Toll</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<script>
const S = [
 {t:'title',title:'The Bottega Method Masterclass',sub:'How to actually start the creative thing you have been circling, with the structure a first-time creator never gets.',brand:true},
 {t:'normal',k:'Who this is for',title:'You did everything right.',body:'You built the career, the title, the life that looks like success from the outside. And somewhere in the middle of it a quieter thing has been waiting: a book, a course, a company, a body of work you keep meaning to begin.'},
 {t:'dark',title:'You do not have a talent problem. You have a structure problem.'},

 {t:'section',idx:'Part One',title:'Why the Leap Stalls'},
 {t:'normal',k:'The quiet question',title:'Am I building the life I want, or the one I was told to want?',body:'Most people who feel this do not need permission and they do not need more inspiration. They need a way to move that does not require quitting everything to find out.'},
 {t:'normal',k:'The real reason',title:'It is not discipline. No one ever gave you the room.',body:'A first book, a first course, a first venture gets built in the margins, alone, between everything else. Of course it stalls. It has never had a workshop, a deadline, or a single other person expecting it.'},
 {t:'dark',k:'The unfair gap',title:'A software founder gets incubators, mentors and a demo day. You have been doing this in the margins, on your own.'},

 {t:'section',idx:'Part Two',title:'The Bottega'},
 {t:'normal',k:'An old idea',title:'For five hundred years, this is how makers were made.',body:'In the Renaissance bottega, apprentices worked alongside a master and each other. You learned by making, in a room, surrounded by people a little further along. Nobody handed you a blank page and wished you luck.'},
 {t:'normal',k:'The modern version',title:'A workshop with a room, a method, and a deadline.',body:'The Bottega takes that model and points it at the creative leap. Not a course you watch alone, but a working studio: people building their first thing together, with a path to follow and a day the work is due.'},
 {t:'dark',title:'You do not need more inspiration. You need a workshop.'},

 {t:'section',idx:'Part Three',title:'The Path: Explore, Build, Launch'},
 {t:'normal',k:'Explore',title:'Start with an Energy Audit, not a to-do list.',body:'Before you make anything, you look honestly at where your hours and attention already go, and what they cost you. Then you decide what actually deserves the room. This is optimizing for soul over toll, and it is where the work begins.'},
 {t:'normal',k:'Build',title:'Make the first version. Put it in front of the room.',body:'Over eight weeks you build the real, rough, first version and carry it to a demo day, where you show it to people. Not perfect. Finished enough to be seen. Shipping the first draft is the skill almost no one is taught.'},
 {t:'normal',k:'Launch',title:'Take it to the people it is for.',body:'Then the last stretch: getting the work in front of the people it was made for, and building the habit of keeping it going. This is the part most creative advice skips, and the part that turns a project into a practice.'},
 {t:'dark',title:'Explore, Build, Launch. From an idea you keep circling to a thing that is in the world.'},

 {t:'section',idx:'Part Four',title:'What Changes'},
 {t:'normal',k:'The room',title:'The odds you finish rise the moment there is a room.',body:'A deadline you did not set alone, people who saw the early draft, a day the work is due. The structure does the thing willpower could not do by itself: it gets the work made.'},
 {t:'normal',k:'Why I built this',title:'I made this leap myself.',body:'I was a lawyer, in global firms and at Harvard Law, and at twenty-nine a meditation cracked something open like a champagne cork. I left, carried the debt, learned the craft, and wrote my novel. I built the Bottega so the next person does not have to do it alone.'},
 {t:'dark',title:'The work you keep circling is allowed to be the work.'},

 {t:'section',idx:'Your next step',title:'Come Into the Bottega'},
 {t:'normal',k:'How to start',title:'Start free, on a Thursday.',body:'The Imagination Hour is a free weekly hour to picture the person you are becoming and the work you want to make. From there, the Explore, Build and Launch path inside the Bottega takes it the rest of the way, with the room around you.'},
 {t:'cta',title:'Ready to start the thing you have been circling?',chips:['Join the free Imagination Hour','Come into the Bottega'],disc:'Educational content for people exploring a creative project. No income, career, or business result is guaranteed. Results vary by person, craft, and circumstance.'},
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="thread"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Soul <b>Toll</b> · Anusia Gillespie</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=`<div class="title-thread"></div>`;
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
