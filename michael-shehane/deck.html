<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Buy-In Ladder — InStride Leadership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f5;        /* light ground — site_scheme is light */
    --ink:#282828;       /* their dominant charcoal */
    --muted:#6b6763;
    --panel:#f1ece5;
    --rule:#e0d8cd;
    --accent:#ff5e1a;    /* their orange, from brand.json / ## Palette */
    --display:'Space Grotesk',sans-serif;
    --body:'Raleway',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:54px 50px;margin:22px 0;min-height:440px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide .num{position:absolute;top:20px;right:26px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.08em}
  .eyebrow{font-family:var(--display);font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:56px;line-height:1.04;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:36px;line-height:1.1;letter-spacing:-.01em;margin-bottom:16px}
  .sub{font-size:22px;color:var(--muted);font-weight:300;max-width:40ch}
  p{font-size:20px;margin-bottom:14px;max-width:46ch}
  ul{list-style:none;margin-top:10px}
  li{font-size:20px;padding:11px 0 11px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:50ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:14px;height:3px;background:var(--accent)}
  .big{font-family:var(--display);font-size:40px;font-weight:700;line-height:1.08;letter-spacing:-.01em;max-width:24ch}
  .big .hot{color:var(--accent)}
  .rung-wrap{margin-top:18px}
  .rung{display:flex;align-items:baseline;gap:18px;padding:9px 0}
  .rung .r-no{font-family:var(--display);font-weight:700;color:var(--accent);font-size:20px;min-width:30px}
  .rung .r-name{font-family:var(--display);font-weight:600;font-size:21px;min-width:130px}
  .rung .r-txt{color:var(--muted);font-size:17px}
  .rung.on{background:var(--panel);border-radius:8px;padding:12px 14px}
  .ladder{display:flex;flex-direction:column-reverse;gap:7px;margin-top:8px}
  .ladder .step{background:var(--panel);border-left:4px solid var(--accent);padding:10px 16px;font-family:var(--display);font-weight:600;font-size:19px}
  .ladder .step span{color:var(--muted);font-weight:400;font-family:var(--body);font-size:15px;margin-left:10px}
  .credit{font-size:18px;color:var(--muted);max-width:52ch}
  .credit strong{color:var(--ink);font-weight:600}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:58ch;line-height:1.45}
  .cta-line{font-family:var(--display);font-weight:600;font-size:24px;margin-top:10px}
  .brandline{font-family:var(--display);font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:28px}
  @media(max-width:680px){.slide{padding:38px 26px}h1{font-size:40px}h2{font-size:28px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A Live Masterclass · InStride Leadership',h:'The Buy-In Ladder',sub:'How to move people when you cannot just tell them what to do.',brand:'Michael Shehane · InStride Leadership'},
  {t:'promise',eyebrow:'What you will leave with',h:'By the end of this hour',items:['The five rungs of buy-in, and how to tell which one a moment calls for','Why pushing harder on the wrong rung reads as pressure, not leadership','A way to get a "yes" from people who do not report to you']},
  {t:'who',eyebrow:'Who this is for',h:'You lead through influence, not a title',sub:'Managers, team leads, and senior individual contributors in tech who have to get buy-in across functions they do not control.'},
  {t:'trap',eyebrow:'The trap',h:'You had the better idea. It still did not land.',sub:'You walked in with the right call, the data, the logic. The room nodded. Then nothing moved. The problem was not the idea.'},
  {t:'hook',big:true,html:'The problem was never your <span class="hot">idea</span>.<br>It was the <span class="hot">rung</span> you were standing on.'},
  {t:'part',eyebrow:'Part One',h:'Why good ideas die in the room'},
  {t:'body',h:'Authority is the rarest tool you have',items:['Most of the time you cannot mandate the outcome you need','So almost all real leadership is lateral: peers, partners, people above you','Buy-in is not a personality trait. It is a sequence of moves.']},
  {t:'body',h:'The one-move mistake',items:['When a "no" shows up, the instinct is to repeat the argument louder','That keeps you on the same rung, just with more force','The move is not more volume. It is a different rung.']},
  {t:'part',eyebrow:'Part Two · The framework',h:'The Buy-In Ladder'},
  {t:'ladderview',eyebrow:'Five rungs, lowest effort to highest',h:'Nudge, inspire, influence, persuade, negotiate',steps:[
    {n:'Nudge',d:'make the next step small and obvious'},
    {n:'Inspire',d:'connect the ask to something they already want'},
    {n:'Influence',d:'shape the frame before the decision'},
    {n:'Persuade',d:'make the case directly, on their terms'},
    {n:'Negotiate',d:'trade, when interests genuinely differ'}
  ]},
  {t:'rung',eyebrow:'Rung 1',h:'Nudge',sub:'The lowest-cost move. You do not argue. You make the next step so small and so obvious that saying yes is easier than saying no. Most buy-in never needs more than this.'},
  {t:'rung',eyebrow:'Rung 2',h:'Inspire',sub:'You stop selling your idea and connect it to something they already care about. People move for their reasons, not yours. This rung finds the overlap.'},
  {t:'rung',eyebrow:'Rung 3',h:'Influence',sub:'You shape the frame before the decision is on the table. What is compared to what, what counts as the default, who is in the room. The frame often decides the answer.'},
  {t:'rung',eyebrow:'Rung 4',h:'Persuade',sub:'Only now do you make the case head-on, in their language, against their actual concern. Persuasion lands when the first three rungs have done their work.'},
  {t:'rung',eyebrow:'Rung 5',h:'Negotiate',sub:'When interests honestly conflict, you trade. This is the highest-cost rung, and reaching for it first is the most common error leaders make.'},
  {t:'hook',big:true,html:'Knowing <span class="hot">which rung</span> you are on<br>decides how you communicate.'},
  {t:'part',eyebrow:'Part Three',h:'The calm version of the same meeting'},
  {t:'body',h:'Same meeting, run two ways',items:['Default: open with the ask, meet the first objection, push the ask again','On the ladder: start one rung lower, read the resistance, climb only as needed','The second version feels calmer. Calm is what people read as authority.']},
  {t:'credit',eyebrow:'Why learn this from me',h:'I coach this for a living',credit:'I am Michael Shehane, founder of InStride Leadership and an ICF-credentialed (ACC) coach with a background in linguistics and organizational psychology. I have coached leaders at Meta, Google, Netflix, Uber, Duolingo, Airbnb, Stanford, and Genentech on exactly this: knowing what to say when it matters most.',brand:'InStride Leadership'},
  {t:'cta',eyebrow:'Your next step',h:'Bring one real decision',sub:'If there is a buy-in you are trying to win right now, that is the place to start.',cta:'Book a free 15-minute consultation at leadinstride.com',disc:'This masterclass is educational. It shares a communication framework and approach; it is not a guarantee of any specific outcome, promotion, or result. Outcomes depend on your own situation and effort.',brand:'InStride Leadership · leadinstride.com'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let inner='<div class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</div>';
  if(s.eyebrow)inner+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){inner+='<h1>'+s.h+'</h1><div class="sub">'+s.sub+'</div><div class="brandline">'+s.brand+'</div>';}
  else if(s.t==='hook'){inner+='<div class="big">'+s.html+'</div>';}
  else if(s.t==='part'){inner+='<h2>'+s.h+'</h2>';}
  else if(s.t==='ladderview'){inner+='<h2>'+s.h+'</h2><div class="ladder">';s.steps.forEach(r=>{inner+='<div class="step">'+r.n+'<span>'+r.d+'</span></div>';});inner+='</div>';}
  else if(s.t==='rung'){inner+='<h2>'+s.h+'</h2><div class="sub">'+s.sub+'</div>';}
  else if(s.t==='credit'){inner+='<h2>'+s.h+'</h2><p class="credit">'+s.credit+'</p><div class="brandline">'+s.brand+'</div>';}
  else if(s.t==='cta'){inner+='<h2>'+s.h+'</h2><div class="sub">'+s.sub+'</div><div class="cta-line">'+s.cta+'</div><div class="disc">'+s.disc+'</div><div class="brandline">'+s.brand+'</div>';}
  else{ if(s.h)inner+='<h2>'+s.h+'</h2>'; if(s.sub)inner+='<div class="sub">'+s.sub+'</div>'; if(s.items){inner+='<ul>';s.items.forEach(x=>inner+='<li>'+x+'</li>');inner+='</ul>';}}
  el.innerHTML=inner;deck.appendChild(el);
});
</script>
</body>
</html>
