<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Daily Sales in an Hour a Day, Grit To Glory Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Nunito+Sans:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0a2338;
    --accent:#ff2ec6;
    --accent2:#8c52ff;
    --bg:#fbeff7;
    --panel:#fffafd;
    --muted:#55636f;
    --rule:#ecd9e8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:'Nunito Sans',sans-serif}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    background:var(--bg);
    min-height:600px;
    margin:26px 0;
    padding:64px 72px;
    border-radius:6px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    border-top:6px solid var(--accent);
    box-shadow:0 10px 40px rgba(10,35,56,.25);
  }
  .kicker{font-family:'Nunito Sans';font-weight:900;letter-spacing:.18em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:52px;line-height:1.08;color:var(--ink);margin-bottom:20px}
  h2{font-family:'Cormorant Garamond',serif;font-weight:700;font-size:38px;line-height:1.14;color:var(--ink);margin-bottom:22px}
  .lede{font-size:22px;line-height:1.5;color:var(--muted);max-width:40ch}
  p{font-size:20px;line-height:1.55;color:var(--ink);max-width:46ch;margin-bottom:16px}
  ul{margin:10px 0 0 0;list-style:none}
  li{font-size:21px;line-height:1.5;color:var(--ink);padding-left:34px;position:relative;margin-bottom:16px;max-width:48ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:16px;height:16px;background:var(--accent);border-radius:3px}
  .big{font-family:'Cormorant Garamond',serif;font-size:64px;line-height:1.05;color:var(--ink)}
  .big em{font-style:italic;color:var(--accent2)}
  .step{font-family:'Cormorant Garamond',serif;font-size:120px;color:var(--accent);opacity:.18;position:absolute;top:36px;right:60px;font-weight:700}
  .part{color:var(--accent2);font-weight:900;letter-spacing:.16em;text-transform:uppercase;font-size:15px;margin-bottom:14px}
  .brand{position:absolute;bottom:30px;left:72px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .cta{background:var(--ink);color:#fff;border-top:6px solid var(--accent)}
  .cta h2,.cta h1{color:#fff}
  .cta .lede{color:#d9e0e6}
  .btn{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:900;padding:16px 30px;border-radius:5px;letter-spacing:.04em;font-size:18px}
  .disc{font-size:13px;line-height:1.5;color:#9fb0bd;margin-top:30px;max-width:60ch}
  .note{font-size:16px;color:var(--muted);margin-top:18px}
  @media(max-width:700px){.slide{padding:40px 30px;min-height:460px}h1{font-size:34px}h2{font-size:26px}.big{font-size:38px}.step{font-size:70px;right:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title'},
  {t:'promise'},
  {t:'content',kicker:'Who this is for',h:'You are driven, and your days are already full',body:['You are building a direct sales business around a real life. Family, work, everything else.','You do not need more motivation. You need a way to make the business move forward on the days that are already packed.']},
  {t:'content',kicker:'The trap',h:'Busy all day, and the income still will not move',body:['Most sellers fill the day with activity that feels like work but does not produce income.','Posting with no plan. Reorganizing the product closet. Waiting to feel ready. The calendar is full and the sales are flat.']},
  {t:'hook',big:'It was never your pitch.<br>It was your <em>daily reps.</em>'},
  {t:'part',part:'Part One',h:'The real problem is consistency, not talent'},
  {t:'content',kicker:'The core problem',h:'Feast, then famine',body:['When action is inconsistent, income is inconsistent. A big week, then three quiet ones.','Willpower is not the fix, because the thing stopping you is usually underneath it: the belief that says do it later, or that selling is pushy. The nervous system wins over the to-do list every time.']},
  {t:'part',part:'Part Two',h:'The 3-Step Plan to Daily Sales'},
  {t:'step',n:'1',h:'Attract',body:['Bring the people who need your solution into your world, every single day.','Not chasing. A simple daily rhythm of showing up so new people find you on purpose, not by luck.']},
  {t:'content',kicker:'Step one in practice',h:'Daily lead flow',body:['A repeatable way to start conversations with the right women every day.','When new people enter your world daily, you are never starting from zero on Monday.']},
  {t:'step',n:'2',h:'Protect your hour',body:['Identify your income-producing activities and give them one focused hour that nothing else is allowed to touch.','One hour of the right activity beats a whole day of the wrong one.']},
  {t:'content',kicker:'Step two in practice',h:'The income-producing-activity filter',body:['Reaching out, following up, inviting, and closing are income-producing. Almost everything else is preparation dressed up as progress.','Protect the hour. Do the four things. Let the rest wait.']},
  {t:'step',n:'3',h:'Sell and grow, daily',body:['Make product sales and add new team members every day through consistent, effective action.','Daily is the word that matters. Small and daily compounds into the result most people only wish for.']},
  {t:'content',kicker:'Step three in practice',h:'Consistency is the whole strategy',body:['The sellers who win are rarely the most talented. They are the most consistent.','A sale and a conversation every day, done for a year, is a different business.']},
  {t:'content',kicker:'The inner game',h:'Why most sellers stall, and how to clear it',body:['The daily reps are simple. Doing them when fear and old beliefs show up is the hard part.','This is the work I am known for: using tools like NLP, EFT, and the T.I.M.E. Technique to release the beliefs that keep you from showing up, so the daily method actually gets done. Overcome. Breakthrough. Live free.']},
  {t:'part',part:'Part Three',h:'What a day in the method looks like'},
  {t:'content',kicker:'The one-hour business',h:'Your hour, on repeat',body:['Open with the belief work so you show up clear. Then attract, then the income-producing activities, then one real selling action.','In and out in about an hour. Every day. Without sacrificing the life you built the business for.']},
  {t:'content',kicker:'Why me',h:'I built this the hard way',body:['I went from homeless in my early twenties to a multi-million dollar producer, leading Top 2% teams to eight figures worldwide. I am also an Army combat veteran, a wife, and a mom.','The grit is real. So is the glory on the other side of it. This method is how I crossed over, and how I teach other women to.']},
  {t:'content',kicker:'Where this goes',h:'The Grit To Glory Experience',body:['The masterclass is the method. The Grit To Glory Experience is where we install it together over a full year, with the inner work, the sales skill, and the community that keeps you consistent.','If today resonated, that is the next step.']},
  {t:'cta',disc:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your own effort, consistency, market, and many factors outside any teacher\'s control. Nothing here is financial advice.'}
];

function esc(s){return s;}
function render(){
  const deck=document.getElementById('deck');
  S.forEach(s=>{
    const d=document.createElement('section');
    d.className='slide'+(s.t==='cta'?' cta':'');
    let html='';
    if(s.t==='title'){
      html=`<div class="kicker">A Grit To Glory Masterclass</div>
        <h1>Daily Sales in an Hour a Day</h1>
        <div class="lede">The 3-step operating system for network marketers who want to sell every day without sacrificing the life they built the business for.</div>
        <div class="note">with Charity Schaefer</div>`;
    }else if(s.t==='promise'){
      html=`<div class="kicker">What you will walk away with</div>
        <h2>A business that moves forward in one focused hour a day</h2>
        <ul>
          <li>A daily rhythm that brings the right people into your world on purpose</li>
          <li>A simple filter for the activities that actually produce income</li>
          <li>The inner-game work that gets the method done when fear shows up</li>
        </ul>`;
    }else if(s.t==='hook'){
      html=`<div class="big">${s.big}</div>`;
    }else if(s.t==='part'){
      html=`<div class="part">${s.part}</div><h2>${s.h}</h2>`;
    }else if(s.t==='step'){
      html=`<div class="step">${s.n}</div><div class="part">Step ${s.n}</div><h2>${s.h}</h2>`+
        (s.body?('<div>'+s.body.map(b=>`<p>${b}</p>`).join('')+'</div>'):'');
    }else if(s.t==='content'){
      html=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2>`+
        (s.body?('<ul>'+s.body.map(b=>`<li>${b}</li>`).join('')+'</ul>'):'');
    }else if(s.t==='cta'){
      html=`<div class="kicker">Your next step</div>
        <h1>Ready to install the method?</h1>
        <div class="lede">Apply for the Grit To Glory Experience and let's build your one-hour-a-day business together.</div>
        <span class="btn">Apply for the Grit To Glory Experience</span>
        <div class="disc">${s.disc}</div>`;
    }
    html+=`<div class="brand">Grit To Glory &middot; Charity Schaefer</div>`;
    d.innerHTML=html;
    deck.appendChild(d);
  });
}
render();
</script>
</body>
</html>
