<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Modern Etiquette Business, A Masterclass with Elaine Swann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f2;        /* ivory ground, from light scheme */
    --panel:#f0e8de;     /* soft champagne, from #cdbcab */
    --rule:#e3d7c7;
    --accent:#600032;    /* burgundy, dominant brand color */
    --gold:#a67d44;      /* antique gold, secondary accent */
    --ink:#2a1620;       /* deep wine-black body ink */
    --muted:#6f5a62;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Poppins',system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:40px 24px 120px}
  .slide{
    background:#fffdfa;border:1px solid var(--rule);border-radius:14px;
    padding:60px 64px;margin:0 0 34px;min-height:560px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 10px 30px rgba(96,0,50,0.06);position:relative;scroll-margin-top:20px;
  }
  .slide.title,.slide.divider,.slide.cta{background:var(--accent);color:#fdf6ee;border-color:var(--accent)}
  .slide.divider{background:linear-gradient(135deg,#600032,#7d1f4d)}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:22px}
  .slide.title .eyebrow,.slide.divider .eyebrow,.slide.cta .eyebrow{color:#e9c79a}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Playfair Display',serif;font-weight:600;font-size:40px;line-height:1.12;margin-bottom:18px}
  .slide.divider h2,.slide.title h1{color:#fdf6ee}
  .lede{font-size:21px;line-height:1.55;color:var(--muted);max-width:40ch;margin-top:8px}
  .slide.title .lede,.slide.cta .lede,.slide.divider .lede{color:#f3dfd0;max-width:46ch}
  p{font-size:19px;line-height:1.6;max-width:56ch;margin-top:14px}
  .big{font-size:30px;font-family:'Playfair Display',serif;line-height:1.3;max-width:30ch}
  ul{margin:22px 0 0 0;list-style:none;max-width:60ch}
  li{font-size:19px;line-height:1.5;padding:13px 0 13px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;background:var(--gold);border-radius:2px;transform:rotate(45deg)}
  .slide.divider li,.slide.cta li{border-color:rgba(255,255,255,.18)}
  .pillars{display:grid;grid-template-columns:repeat(5,1fr);gap:14px;margin-top:30px}
  .pill{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:20px 14px;text-align:center}
  .pill .n{font-family:'Playfair Display',serif;font-size:30px;color:var(--accent)}
  .pill .t{font-size:14px;margin-top:8px;font-weight:500}
  .meta{margin-top:40px;font-size:16px;color:#f0d9c9;font-weight:300}
  .kicker{font-family:'Playfair Display',serif;font-size:26px;color:var(--gold);margin-bottom:6px}
  .foot{position:absolute;bottom:22px;left:64px;right:64px;font-size:12px;color:var(--muted);display:flex;justify-content:space-between}
  .slide.title .foot,.slide.divider .foot,.slide.cta .foot{color:#dcb79c}
  .disc{margin-top:28px;font-size:13px;line-height:1.5;color:#e9cdbb;max-width:64ch}
  .num{opacity:.7}
  @media(max-width:720px){.slide{padding:40px 26px}h1{font-size:36px}h2{font-size:28px}.pillars{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "The Swann School of Protocol";
const S = [
  {t:'title', eyebrow:'A Live Masterclass with Elaine Swann',
    h:'The Modern Etiquette Business',
    lede:'How to turn what you know into a licensed etiquette school people actually hire.' },

  {t:'content', eyebrow:'What you will leave with',
    h:'A clear path from "I love etiquette" to a booked, licensed business',
    bullets:['Why a certificate alone never becomes a business',
             'The five programs you are actually selling',
             'The turnkey model that gets a new school open and booked'] },

  {t:'content', eyebrow:'Who this is for',
    h:'The aspiring etiquette consultant',
    lede:'You know etiquette matters. You have the warmth, the eye, the standards. What you do not yet have is a way to turn that into clients who pay you.' },

  {t:'content', eyebrow:'The trap',
    big:'You can be the most polished person in the room and still have no one to teach.' ,
    lede:'Getting certified feels like the finish line. For most people it is where everything stalls.' },

  {t:'divider', eyebrow:'Part One', h:'A certificate is not a business' },

  {t:'content', eyebrow:'The real problem',
    h:'The market does not hire certificates',
    p:'Corporate teams, families, brides and universities do not search for a credential. They search for someone who can clearly solve a problem for them. If all you have is a certificate on the wall, you are invisible to the people who would happily pay you.' },

  {t:'content', eyebrow:'The real problem',
    h:'Modern clients want modern etiquette',
    p:'The old finishing-school playbook, white gloves and rigid rules, reads as dated to the people writing the checks today. Etiquette now is about confidence, inclusion, technology and real human connection. That is the work companies and families will pay a premium for.' },

  {t:'divider', eyebrow:'Part Two', h:'The method: Modern Etiquette, built to sell' },

  {t:'content', eyebrow:'The thesis',
    big:'Etiquette is not old-fashioned. Taught the modern way, it is a business.',
    lede:'Modern etiquette meets people where they actually live and work, which is exactly why it sells.' },

  {t:'pillars', eyebrow:'Your product line',
    h:'The Five Pillars',
    pillars:[['1','Business'],['2','Dining'],['3','Adult'],['4','Teen'],['5','Children']],
    p:'Five certifications, five distinct audiences, five ways to get hired. You are not selling one vague service. You are launching a line of programs.' },

  {t:'content', eyebrow:'Your product line',
    h:'One pillar can be a whole practice',
    bullets:['Business etiquette for corporate teams and new hires',
             'Dining etiquette for executives, couples and events',
             'Teen and children programs that fill with word of mouth',
             'Adult polish for confidence, dating and public life'] },

  {t:'divider', eyebrow:'Part Three', h:'The turnkey business: Business-in-a-Box' },

  {t:'content', eyebrow:'How a school actually opens',
    h:'You are handed the whole business, not just the knowledge',
    bullets:['A branded website and professional email, ready to go',
             'The full five-pillar curriculum and ready-made teaching materials',
             'A paired mentor and a 30, 60 and 90 day launch plan',
             'An ongoing community of owners and monthly professional training'] },

  {t:'content', eyebrow:'Why it works',
    h:'Credibility you can borrow on day one',
    p:'Launching alone, you spend years earning trust. Launching as a licensed owner, you step into an established, nationally recognized name with 30-plus schools behind you. New clients say yes faster because the brand has already done the convincing.' },

  {t:'content', eyebrow:'Why learn it here',
    h:'The track record behind the method',
    bullets:['20-plus years as a lifestyle and etiquette expert',
             'Trusted by Merrill, Cisco and Bank of America',
             'Guest speaker at Stanford and the Wharton School',
             'The first Black and female owned etiquette licensing program in the nation'] },

  {t:'content', eyebrow:'The path',
    h:'From certified to booked',
    bullets:['Master the five pillars at your own pace',
             'Build your offers and pricing with direct guidance',
             'Launch your licensed school with a mentor beside you',
             'Keep growing inside a community that has done it before'] },

  {t:'cta', eyebrow:'Your next step',
    h:'Build your modern etiquette business',
    lede:'If you are ready to turn what you know into a licensed, booked etiquette school, the Certification and Licensing program is where it begins.',
    bullets:['Certification across all five pillars',
             'A complete business-in-a-box and launch support',
             'A live Business Development Master Class with Elaine Swann'],
    cta:'Apply for Swann School Certification & Licensing',
    disc:'This masterclass is educational. It shares a method and a path for building an etiquette consulting business. It is not a guarantee of income or results, which vary by person, effort and market.' }
];

function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t||'content');
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.t==='title' && s.h) h += `<h1>${esc(s.h)}</h1>`;
  else if(s.h) h += `<h2>${esc(s.h)}</h2>`;
  if(s.big) h += `<div class="big">${esc(s.big)}</div>`;
  if(s.lede) h += `<div class="lede">${esc(s.lede)}</div>`;
  if(s.p) h += `<p>${esc(s.p)}</p>`;
  if(s.pillars){
    h += `<div class="pillars">` + s.pillars.map(p=>`<div class="pill"><div class="n">${esc(p[0])}</div><div class="t">${esc(p[1])}</div></div>`).join('') + `</div>`;
  }
  if(s.bullets) h += `<ul>` + s.bullets.map(b=>`<li>${esc(b)}</li>`).join('') + `</ul>`;
  if(s.cta) h += `<div class="meta"><strong>${esc(s.cta)}</strong></div>`;
  if(s.t==='title') h += `<div class="meta">Elaine Swann &nbsp;&middot;&nbsp; ${esc(BRAND)}</div>`;
  if(s.disc) h += `<div class="disc">${esc(s.disc)}</div>`;
  h += `<div class="foot"><span>${esc(BRAND)}</span><span class="num">${i+1} / ${S.length}</span></div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
