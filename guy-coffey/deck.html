<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Franchise Growth Assessment — Guy Coffey</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#111214;
    --panel:#1b1d21;
    --rule:#2c2f35;
    --ink:#ece9e3;
    --accent:#c8a35b;
    --dim:#9a968d;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 20px 60px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:46px 48px;margin:18px 0;min-height:300px;display:flex;flex-direction:column;justify-content:center}
  .kicker{font-family:"DM Sans";font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;font-weight:700}
  h1{font-family:"Cormorant Garamond",serif;font-weight:700;font-size:48px;line-height:1.08;letter-spacing:.3px}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:34px;line-height:1.14;margin-bottom:14px}
  .sub{font-size:19px;color:var(--dim);margin-top:18px}
  p{font-size:18px;margin-top:14px;color:var(--ink)}
  p.lead{font-size:21px}
  ul{margin:18px 0 0 0;list-style:none}
  li{position:relative;padding:9px 0 9px 26px;font-size:17px;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:18px;width:8px;height:8px;background:var(--accent);border-radius:50%}
  .domain-no{font-family:"Cormorant Garamond",serif;font-size:40px;color:var(--accent);font-weight:700;display:block;margin-bottom:6px}
  .byline{margin-top:26px;font-size:16px;color:var(--dim);letter-spacing:.04em}
  .rulehr{height:1px;background:var(--rule);margin:22px 0}
  .disclaimer{font-size:13px;color:var(--dim);margin-top:24px;line-height:1.5}
  .cta-step{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--accent);margin-top:12px}
  .pagefoot{font-size:12px;color:var(--dim);letter-spacing:.18em;text-transform:uppercase;margin-top:28px}
  @media(max-width:620px){.slide{padding:34px 24px}h1{font-size:34px}h2{font-size:27px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Live Masterclass with Guy Coffey',
   h1:'The Franchise Growth Assessment',
   sub:'How to know you are ready to scale, before you sell another franchise.',
   byline:'Guy Coffey. Built, scaled and exited Frenchies Modern Nail Care. Host of The Franchise Scale-Up Show.'},

  {t:'audience',
   kicker:'Who this is for',
   h2:'You already sold your first franchises.',
   body:'This is for emerging franchisors with a handful of units open and more in the pipeline. The concept works. People are buying. And something underneath is starting to strain.',
   list:['You are a founder who proved the model and started selling it.',
         'You have between one and twenty units open, or you are about to.',
         'You can feel that the next twenty will not run the way the first few did.']},

  {t:'trap',
   kicker:'The trap',
   h2:'Early demand hides the cracks.',
   body:'When franchises are selling, every number looks like a reason to go faster. So you add units. You add territories. You say yes. The trap is that demand rewards the exact behavior that breaks the system later.',
   list:['Validation looks strong because the first owners are founders-by-proxy.',
         'The support that worked for five owners quietly stops working at fifteen.',
         'By the time it shows up in the numbers, it is already expensive to fix.']},

  {t:'reframe',
   kicker:'The real problem',
   h2:'Systems rarely fail from too little demand.',
   body:'They fail from scaling on a foundation that cannot hold the weight. More units do not fix a weak foundation. They multiply it. The question that actually matters is not how fast can we grow. It is what has to be true before we grow.',
   lead:true},

  {t:'part',
   kicker:'Part One',
   h2:'Noise is not the same as signal.',
   body:'Running a young franchise system is loud. Every owner call, every lead, every operator problem feels urgent. The founders who scale well are not the ones who work the hardest on the noise. They are the ones who can tell which few things actually move the system, and ignore the rest.'},

  {t:'problem',
   kicker:'What breaks first',
   h2:'Four things quietly give way as you add units.',
   list:['Franchise sales outruns onboarding, so new owners start behind.',
         'Support becomes reactive, and the strongest owners stop calling.',
         'Unit economics drift because no one is watching them per location.',
         'The founder becomes the system, and the system cannot be sold.']},

  {t:'method',
   kicker:'The clarity move',
   h2:'Filter the noise first.',
   body:'Before you touch strategy, you separate the few constraints that are actually holding the system back from the dozens of problems that just feel loud. Clarity is not a soft outcome. It is the thing that tells you where the next dollar and the next hire should go.',
   list:['Name the one constraint in each part of the business.',
         'Decide what you will deliberately not fix this quarter.',
         'Scale the few things that compound, not the many that distract.']},

  {t:'part',
   kicker:'Part Two: the framework',
   h2:'The seven domains of a scale-ready system.',
   body:'A readiness assessment looks at the whole business through seven lenses. A system is only as strong as its weakest domain, because that is the one the next twenty units will expose. Here is what each lens is really measuring.'},

  {t:'domain', no:'01', kicker:'Domain one', h2:'Leadership',
   body:'Who actually runs this when the founder is not in the room. Scale-ready systems have leaders and a rhythm of accountability, not a founder answering every question. If the business stops without you, it is a job, not a system.'},

  {t:'domain', no:'02', kicker:'Domain two', h2:'Franchise Sales',
   body:'Are you selling to the right owners, at the right pace, with honest validation. Selling faster than you can support is the most common way a promising brand damages itself. The goal is the right owner, not the next signature.'},

  {t:'domain', no:'03', kicker:'Domain three', h2:'Legal and Compliance',
   body:'Is your agreement structured for the system you are becoming, not the one you started. Franchise disclosure and the franchise agreement are the rails the whole relationship runs on. Weak rails get expensive the moment there is friction.'},

  {t:'domain', no:'04', kicker:'Domain four', h2:'Financials',
   body:'Do you know the real unit economics, per location, not just at headquarters. Royalties can look healthy while owners quietly lose money. A system that does not protect owner profitability is building its own validation problem.'},

  {t:'domain', no:'05', kicker:'Domain five', h2:'Marketing',
   body:'Is there a repeatable way to drive customers to every unit, or does each owner invent it alone. Local marketing is where brand recognition meets reality. Owners who have to build demand from scratch burn out before the brand catches up.'},

  {t:'domain', no:'06', kicker:'Domain six', h2:'Systems',
   body:'Is the work written down, trainable and consistent across every location. The manual is not bureaucracy. It is the asset that lets a new owner reach competence without the founder. Scale is impossible where knowledge lives in people, not systems.'},

  {t:'domain', no:'07', kicker:'Domain seven', h2:'Operations',
   body:'Can a new unit be opened and supported the same way every time. Operations is where all the other domains either hold together or come apart under volume. This is the domain that most often decides whether unit twenty feels like unit two.'},

  {t:'process',
   kicker:'How the thirty days run',
   h2:'From a loud business to a prioritized roadmap.',
   list:['Week one. A deep-dive discovery across all seven domains.',
         'Week two to three. A formal assessment: what is working, where you are exposed.',
         'Week four. A working session that leaves you with a prioritized roadmap.',
         'The output is not a report that sits on a shelf. It is the order of operations.']},

  {t:'part',
   kicker:'Part Three',
   h2:'What scale-ready actually looks like.',
   body:'It is quieter than you expect. The founder is working on a short list of constraints, not firefighting. New owners are validating because they are supported. And the next twenty units look like the proof, not the risk.',
   lead:true},

  {t:'whyme',
   kicker:'Why listen to me on this',
   h2:'I built the thing I am describing.',
   body:'I co-founded, scaled and exited Frenchies Modern Nail Care, I sit on multiple franchise boards, and I have spent over twenty years on both sides of the franchisor and franchisee relationship. I am not theorizing about where systems break. I have been the owner who had to fix it.'},

  {t:'decision',
   kicker:'The one decision',
   h2:'Diagnose before you scale.',
   body:'The most expensive mistake in franchising is adding units to a system that is not ready to hold them. The cheapest hour you will spend this year is the one where you find out, honestly, which of the seven domains is your real constraint.',
   lead:true},

  {t:'cta',
   kicker:'Your next step',
   h2:'Start with a Filter the Noise Call.',
   body:'If you want to know where your system is genuinely exposed before you sell another franchise, that is exactly what the Franchise Growth Assessment is built to show you. We start with a short call to see if it is the right fit.',
   step:'Book a Filter the Noise Call with Guy Coffey.',
   disclaimer:'This masterclass is educational. No specific growth result, revenue figure or outcome is guaranteed. Results vary based on your market, your execution and the systems you already have in place.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.no) h += '<span class="domain-no">'+s.no+'</span>';
  if (s.h1) h += '<h1>'+s.h1+'</h1>';
  if (s.h2) h += '<h2>'+s.h2+'</h2>';
  if (s.sub) h += '<div class="sub">'+s.sub+'</div>';
  if (s.body) h += '<p'+(s.lead?' class="lead"':'')+'>'+s.body+'</p>';
  if (s.list){ h += '<ul>'; for(const li of s.list) h += '<li>'+li+'</li>'; h += '</ul>'; }
  if (s.step) h += '<div class="cta-step">'+s.step+'</div>';
  if (s.byline) h += '<div class="byline">'+s.byline+'</div>';
  if (s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  if (s.t==='title') h += '<div class="pagefoot">Clarity. Outcomes. Real Sustainable Growth.</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
