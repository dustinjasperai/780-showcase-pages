<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Culture That Runs Without You — a masterclass with Nina Kaufman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,500;0,7..72,600;1,7..72,400&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF8F3;        /* warm cream ground (brand world) */
    --panel:#F1EBE1;     /* warm sand */
    --rule:#E0D6C6;      /* hairline */
    --ink:#2B2B28;       /* warm near-black */
    --muted:#6B655C;
    --accent:#8ebeae;    /* sage green — Nina's dominant brand hex */
    --accent2:#e06546;   /* terracotta — brand #2, used sparingly */
    --display:'Literata',Georgia,serif;
    --body:'Hanken Grotesk',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .eyebrow{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:.74rem;color:var(--accent2);margin-bottom:1.4rem}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(2.6rem,6vw,4.6rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(2rem,4.4vw,3.2rem);line-height:1.1;letter-spacing:-.01em}
  .lede{font-family:var(--display);font-weight:400;font-size:clamp(1.3rem,2.3vw,1.9rem);color:var(--ink);max-width:40ch;margin-top:1.6rem;line-height:1.3}
  p.body{font-size:clamp(1.02rem,1.5vw,1.2rem);color:var(--muted);max-width:52ch;margin-top:1.3rem}
  .kicker{font-family:var(--body);font-weight:700;font-size:.8rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .num{font-family:var(--display);font-size:1rem;color:var(--accent);font-weight:600;position:absolute;top:7vh;right:9vw;letter-spacing:.1em}
  .brandline{position:absolute;bottom:5.5vh;left:9vw;font-weight:600;font-size:.82rem;letter-spacing:.06em;color:var(--muted)}
  .brandline b{color:var(--ink)}
  .list{margin-top:2rem;max-width:54ch}
  .list .row{display:flex;gap:1rem;padding:1rem 0;border-top:1px solid var(--rule);align-items:baseline}
  .list .row:last-child{border-bottom:1px solid var(--rule)}
  .dot{flex:0 0 auto;width:.7rem;height:.7rem;border-radius:50%;background:var(--accent);margin-top:.5rem}
  .row h3{font-family:var(--display);font-weight:500;font-size:1.3rem}
  .row p{color:var(--muted);font-size:1rem;margin-top:.2rem}
  .pillar{display:inline-flex;align-items:center;gap:.7rem;background:var(--panel);border:1px solid var(--rule);
    border-radius:999px;padding:.5rem 1.1rem;font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink);margin-bottom:1.6rem}
  .pillar .pdot{width:.7rem;height:.7rem;border-radius:50%;background:var(--accent)}
  .big{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,5vw,3.8rem);line-height:1.08;max-width:22ch}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:3rem;max-width:60ch}
  .cta .btn{display:inline-block;margin-top:2rem;background:var(--accent2);color:#fff;font-weight:700;
    padding:1rem 1.8rem;border-radius:12px;font-size:1.05rem;letter-spacing:.02em}
  .cta .alt{margin-top:1.1rem;color:var(--muted);font-size:1rem}
  .disclaimer{margin-top:3rem;font-size:.78rem;color:var(--muted);max-width:58ch;line-height:1.5}
  .frame{display:inline-block;border:2px solid var(--accent);border-radius:14px;padding:1.4rem 1.8rem;margin-top:1.8rem;
    font-family:var(--display);font-weight:500;font-size:1.3rem;background:var(--bg)}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Nina Kaufman',h:'Culture That Runs Without You',lede:'How to turn your values into a system your team actually follows, so the culture holds when you step out of the room.'},

  {t:'who',eyebrow:'Who this is for',h:'You built the business. Now it runs on you.',body:'This is for the small business owner whose team does good work, but whose culture seems to live in one place: your head. The standards are yours. The hard calls route back to you. And the day you step away, things drift.'},

  {t:'trap',eyebrow:'The trap',big:'You think you have a people problem. You have a system problem.',body:'When your values only exist in you, every hiring call, every piece of feedback, every "is this okay" question has to come back through you. That is not a culture. That is a bottleneck wearing culture’s clothes.'},

  {t:'reframe',eyebrow:'The reframe',big:'Culture is not a vibe. It is a set of decisions, made the same way every time, whether you are there or not.',body:'The businesses whose culture scales did not get luckier with people. They made their values explicit, wrote them down, and built them into the decisions that happen every week.'},

  {t:'part',kicker:'Part one',h:'The core problem',lede:'Values that live only in the founder cannot be delegated, taught, or trusted to anyone else.'},

  {t:'list',eyebrow:'What that looks like',h:'The three quiet symptoms',rows:[
    {h:'Hiring by gut',p:'Every new hire is a coin flip, because "good fit" means "feels right to me" and nobody else can run it.'},
    {h:'Feedback avoided',p:'Hard conversations wait for you, because no one else is sure what the standard even is.'},
    {h:'Drift when you leave',p:'Take a real week off and the tone, the pace, the care all slide. The culture was never load-bearing.'}
  ]},

  {t:'part',kicker:'Part two',h:'The framework',lede:'The Culture Values Guide: Behavior and Attitudes, Values and Standards.'},

  {t:'panel',eyebrow:'The idea',h:'Write the culture down.',body:'The Culture Values Guide is one document that names the behaviors and attitudes your business runs on, and the standards that go with them. It is not a poster. It is the reference every culture decision is made against, so the decision no longer needs you.'},

  {t:'pillar',label:'Pillar 1 · Hiring',big:'Hire for the values, on purpose.',body:'Use the guide to hire for cultural fit and for difference at the same time. You stop hiring copies of yourself and start hiring people who carry the same standards in their own way.'},

  {t:'pillar',label:'Pillar 2 · Supervision',big:'Feedback becomes simple, because the standard is already on paper.',body:'Supervision and feedback stop being personal and start being about the guide. Anyone trained on it can deliver a hard message cleanly, because they are pointing at the shared standard, not their own opinion.'},

  {t:'pillar',label:'Pillar 3 · Growth',big:'Promote, develop, and part ways against the same standard.',body:'Performance reviews, promotions, and the decision to let someone go all run through the guide. The calls get faster and fairer, and they survive you not being in the room.'},

  {t:'legacy',eyebrow:'The multiplier',h:'Train a legacy leader.',body:'The point is not that you run the guide forever. The point is that someone inside the business learns to facilitate it: to onboard, coach, and hold the culture. That is the moment culture stops depending on you and starts compounding.',frame:'Culture you can hand to someone else is the only culture that scales.'},

  {t:'part',kicker:'Part three',h:'The business on the other side of it',lede:'A business where the culture is a system, not a mood.'},

  {t:'list',eyebrow:'A week on the other side',h:'When culture is load-bearing',rows:[
    {h:'Monday',p:'A new hire is onboarded against the guide, not against a feeling. They know the standard by Friday.'},
    {h:'Midweek',p:'A manager handles a tough conversation without you, because the standard is shared and clear.'},
    {h:'Any week',p:'You take real time away. The tone holds. The work holds. Nothing waits for your return.'}
  ]},

  {t:'why',eyebrow:'Why learn this from Nina',h:'Nina Kaufman, YouDesignYou',body:'Nina coaches, consults, and trains ambitious small business owners, their teams, and executives. Her work pairs the Brand Strong Model for owner clarity and growth with the Managing Culture system for building a workplace culture on your deepest values. The through-line of all of it: values made into a working tool, not a slogan.'},

  {t:'recap',eyebrow:'What you take away',h:'Three decisions your values should be making for you',rows:[
    {h:'Who you hire',p:'A values-based filter you can hand to anyone on your team.'},
    {h:'How you give feedback',p:'A shared standard that makes hard conversations clean.'},
    {h:'When you step away',p:'A legacy leader who holds the culture so it does not hold its breath.'}
  ]},

  {t:'cta',eyebrow:'Your next step',h:'Build the system with Nina.',body:'The Managing Culture Program is where owners and their leaders build their own Culture Values Guide and train the legacy leader to run it. If today was useful, this is how you make it permanent.',btn:'Join the Managing Culture Program',alt:'Email nina@youdesignyou.com to start the conversation.',disc:'This masterclass is educational. No specific result is guaranteed. Results vary from business to business, and nothing here is a promise of particular revenue, growth, or outcomes.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide '+(s.t||'');
  let inner='';
  const n=String(i+1).padStart(2,'0');
  inner+='<span class="num">'+n+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.eyebrow)inner+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.kicker)inner+='<div class="kicker">'+s.kicker+'</div>';
  if(s.pdot||s.label)inner+='<div class="pillar"><span class="pdot"></span>'+(s.label||'')+'</div>';
  if(s.h)inner+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.big)inner+='<div class="big">'+s.big+'</div>';
  if(s.lede)inner+='<div class="lede">'+s.lede+'</div>';
  if(s.rows){inner+='<div class="list">';s.rows.forEach(r=>{inner+='<div class="row"><span class="dot"></span><div><h3>'+r.h+'</h3><p>'+r.p+'</p></div></div>';});inner+='</div>';}
  if(s.body)inner+='<p class="body">'+s.body+'</p>';
  if(s.frame)inner+='<div class="frame">'+s.frame+'</div>';
  if(s.t==='cta'){inner+='<div><a class="btn">'+s.btn+'</a></div>';if(s.alt)inner+='<div class="alt">'+s.alt+'</div>';
    inner+='<div class="disclaimer">'+s.disc+'</div>';}
  inner+='<div class="brandline"><b>YouDesignYou</b> &nbsp;·&nbsp; Nina Kaufman</div>';
  sec.innerHTML=inner;
  deck.appendChild(sec);
});
</script>
</body>
</html>
