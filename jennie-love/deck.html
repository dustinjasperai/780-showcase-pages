<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Regenerative Cut-Flower Farm · Jennie Love, Love 'n Fresh Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f6f0; --panel:#eef0e6; --rule:#dfe3d3;
    --acc:#15786c; --acc2:#768c4d; --ink:#16231d; --body:#3c453c; --dim:#828a76; --cream:#f4f1e8;
  }
  html,body{height:100%}
  body{background:#e9ebe0;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9ebe0}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Noto Serif',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:-.004em}
  .t-title h1{font-size:4.9vw;max-width:92%}
  .t-normal h1{font-size:3.2vw;max-width:90%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Noto Serif',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:400;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc2);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 10%,#1c2c24 0%,#0f1712 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1c2c24 0%,#0f1712 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#dfe6d9;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc2);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.2%;bottom:8%;width:15vw;opacity:.92}
  .corner-vf{right:6.5%;bottom:7.2%;width:7.4vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(22,35,29,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.2vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Love 'n Fresh Flowers</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- botanical motif: a single cut stem with a bloom, drawn in olive -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#768c4d" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 108 C60 84 60 66 60 46" opacity="0.9"/>
    <path d="M60 78 C48 74 40 66 38 54 C50 55 58 62 60 74" opacity="0.7"/>
    <path d="M60 66 C72 62 80 54 82 42 C70 43 62 50 60 62" opacity="0.7"/>
    <circle cx="60" cy="34" r="12" opacity="0.9"/>
    <path d="M60 22 C66 26 66 42 60 46 C54 42 54 26 60 22 Z" opacity="0.85"/>
    <path d="M48 34 C52 30 68 30 72 34 C68 38 52 38 48 34 Z" opacity="0.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Regenerative Cut-Flower Farm',sub:'Grow more beautiful flowers, on healthier soil, with less work and lower inputs, by farming with the land instead of against it.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can grow gorgeous flowers. Doing it without wearing out your soil, your budget, or yourself is the part no one taught you.',body:'You grow beautiful blooms and people want them. But every season asks for more tilling, more inputs, and more hours, and the soil gives a little less back each year. A good year still feels like it is one exhausted field away from a hard one.'},
 {t:'dark',title:'A field that needs more tilling, more inputs, and more hours every season is not a farm you can keep.'},

 {t:'section',idx:'Part One',title:'Why Fighting the Land Never Pays Off'},
 {t:'normal',k:'The tillage trap',title:'Tilling looks like progress and quietly destroys the thing you depend on.',body:'Every pass of the tiller breaks up the soil structure and the living network underneath it, then buries a fresh crop of weed seeds to germinate. It feels productive in the moment. Over seasons it leaves you with compacted, lifeless ground that needs even more work and more inputs to grow the same flowers.'},
 {t:'normal',k:'The input treadmill',title:'Every bag of fertilizer you buy is a margin you give away.',body:'When the soil stops feeding the plants, you start buying what it used to provide, in synthetic fertilizer, sprays, and amendments. The bill climbs every year while the ground gets weaker, so you are paying more to fix a problem the paying created. That is a treadmill, not a farm.'},
 {t:'dark',title:'Healthy flowers come from healthy soil, not from the next thing you buy.'},

 {t:'section',idx:'Part Two',title:'The Regenerative Method'},
 {t:'normal',k:'Pillar one, no-till',title:'Stop tilling. Start building living soil.',body:'Instead of turning the ground over, you leave it intact and feed it from the top with compost and mulch. The soil structure rebuilds, the biology comes back, and the weed pressure drops because you stopped bringing new seeds to the surface. Less machinery, less labor, and beds that get better every year instead of worse.'},
 {t:'normal',k:'Pillar two, natural inputs',title:'Feed the soil biology, not the plant, and do it for pennies.',body:'Using JADAM and Korean Natural Farming methods, you make your own biological inputs from materials you already have. You are growing and feeding the microbes that make nutrients available to the crop, rather than buying a bag to force it. The result is resilient plants, and an input bill that shrinks toward zero.'},
 {t:'normal',k:'Pillar three, perennials and woodies',title:'Plant crops that come back, so you replant less and harvest more.',body:'Native perennials and woody cuts are the long game. You plant them once and they return, often for years, giving you distinctive stems that annual growers cannot buy. The workload per stem drops season after season, and your field becomes an asset that appreciates instead of a bed you rebuild every spring.'},
 {t:'normal',k:'Pillar four, intensive small-scale design',title:'Grow more on less land by designing the system, not just the beds.',body:'A small farm wins on layout and timing, not acreage. Tight spacing, planned succession, and crops matched to your ground let a few acres out-produce fields many times their size. The system does the heavy lifting, so the farm stays something one person or a small crew can actually run.'},
 {t:'dark',title:'Regenerative is not slower or smaller. It is more flowers, better margins, and a farm that improves every year.'},

 {t:'section',idx:'Part Three',title:'What Changes on a Regenerative Farm'},
 {t:'normal',k:'The farm this builds',title:'Better blooms, lower costs, and soil that is worth more every season.',body:'When the ground is alive and the perennials are established, the flowers get better while the inputs and the labor get lighter. A dry spell or a hard year stops being a crisis, because healthy soil holds water and holds up. The farm compounds in your favor instead of demanding more to stand still.'},
 {t:'normal',k:'The farmer-florist economics',title:'Flowers this good let you sell direct, at your own price.',body:'Distinctive, healthy stems are what make direct sales work, through subscriptions and CSAs, weddings and events, and workshops on your farm. You stop competing with wholesale and start selling a season and a story that only you can grow. That is where a small regenerative farm actually makes its living.'},
 {t:'dark',title:'The goal was never just to grow flowers. It was a farm and a life that last.'},
 {t:'normal',k:'Why Jennie Love',title:'Seventeen years farming regeneratively in the city, and teaching thousands to do the same.',body:'Jennie built Love \'n Fresh Flowers into a five-acre regenerative farm and design studio in Philadelphia, and is a past president of the Association of Specialty Cut Flower Growers. She hosts the No-Till Flowers podcast, leads the Regenerative Flower Farmers Network, and has taught this method to growers around the world. This is the approach behind all of it.'},

 {t:'section',idx:'Your Next Step',title:'Grow With the Land'},
 {t:'cta',title:'Ready to build a regenerative flower farm that gets better every year?',body:'Keep going with Jennie Love and the Farmer-Florist School.',chips:['Join the Regenerative Flower Farmers Network','Explore the Farmer-Florist School courses'],disc:'Educational content for working and aspiring flower farmers and florists. No income or business result is guaranteed. Results vary by farm, market, climate, and season.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Love 'n Fresh <b>Flowers</b> · Jennie Love</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
