<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The Premium Bookkeeper — A Masterclass with The 6 Figure Bookkeeper</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Jost:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f8; --panel:#f4e6ec; --rule:#e7cdd8;
    --acc:#f80042; --ink:#38163f; --body:#4a2f50; --dim:#9a8593; --cream:#faf1f4; --rose:#ffadc0;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#eadfe6;font-family:'Jost',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1}
  .kicker{font-family:'Jost',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Lora',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:90%}
  .t-normal h1{font-size:3.0vw;max-width:87%}
  .t-normal .body{font-family:'Jost',sans-serif;font-size:1.34vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.66;font-weight:400}
  .sub{font-family:'Lora',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.42;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.05vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:3.9vw;max-width:82%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 150% at 18% 8%,#431a4b 0%,#2a0f30 100%)}
  .t-dark h1{color:var(--cream);font-size:3.3vw;max-width:86%;font-style:italic}
  .t-cta{background:radial-gradient(130% 150% at 18% 8%,#431a4b 0%,#2a0f30 100%)}
  .t-cta h1{color:var(--cream);font-size:3.2vw;max-width:84%}
  .t-cta .body{font-family:'Jost',sans-serif;color:#e9cdd9;font-size:1.34vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.2vw;margin-top:4.4vh;flex-wrap:wrap}
  .chip{border:1.5px solid var(--rose);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:500}
  .brandline{font-family:'Jost',sans-serif;font-size:1.12vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:5.2vh;font-family:'Jost',sans-serif;font-size:.82vw;color:#caa9ba;line-height:1.5;max-width:82%}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:7%;top:50%;transform:translateY(-50%);width:21vw;height:21vw;opacity:.92}
  .corner-mo{right:6%;bottom:8%;width:8vw;height:8vw;opacity:.5}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}.disc{font-size:2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The 6 Figure Bookkeeper</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a ledger reframed as value, three plum hairline rows with a single raspberry underline mark -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#38163f" stroke-width="2" stroke-linecap="round">
    <path d="M14 34 H106 M14 60 H86 M14 86 H98" opacity="0.28"/>
    <path d="M14 100 H72" stroke="#f80042" stroke-width="4" opacity="0.95"/>
    <circle cx="92" cy="60" r="5" fill="#f80042" stroke="none" opacity="0.9"/>
    <circle cx="92" cy="60" r="12" opacity="0.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Premium Bookkeeper',sub:'How to move from hourly books to a six-figure advisory practice, without more clients or longer hours.',brand:true,mo:'title'},
 {t:'normal',k:'Who this is for',title:'You are excellent at the work. The pay you take home is the part that never seems to match it.',body:'You know your clients cold. You keep them compliant, tidy, and out of trouble. But your rates feel stuck, your diary is full, and every extra pound means another hour you do not have. That gap is not a skill problem.'},
 {t:'dark',title:'A capped income is rarely a competence problem. It is a pricing and positioning problem.'},

 {t:'section',idx:'Part One',title:'Why Skilled Bookkeepers Stay Underpaid'},
 {t:'normal',k:'The hourly trap',title:'Selling hours means your income is capped the day you start.',body:'When you charge by the hour or by the transaction, the only way to earn more is to work more. You cannot get a pay rise without giving up an evening. A busy practice built on hours is not a bigger business, it is a heavier one, and it has a hard ceiling you can already feel.'},
 {t:'normal',k:'Seen as the data-entry',title:'If clients think you just do the books, they will only ever pay you to do the books.',body:'Great compliance work is invisible when it goes right. The client sees a tidy return and a monthly fee, not the judgement behind it. As long as you are positioned as the person who processes the numbers, price is the only thing they compare, and there is always someone cheaper.'},
 {t:'dark',title:'You do not have a clients problem. You have a positioning problem.'},

 {t:'section',idx:'Part Two',title:'The Premium Method'},
 {t:'normal',k:'The things I noticed method',title:'Every set of books is full of things worth saying out loud.',body:'The numbers you already prepare are packed with signals: a margin slipping, a cost creeping, cash tightening before a quiet quarter. When you bring those observations to the client instead of just filing them, routine bookkeeping becomes advice. This is the single move that changes what you are worth.'},
 {t:'normal',k:'Become the finance partner',title:'A short monthly conversation turns a supplier into a trusted advisor.',body:'A simple, repeatable advisory meeting, walking the client through what the numbers mean and what to do next, changes how they see you for good. You stop being the person who submits things on time and become the person they call before they make a decision. That relationship is not priced by the hour.'},
 {t:'normal',k:'Package, do not sell hours',title:'Sell an outcome and a relationship, not a timesheet.',body:'When you wrap your work into a clear monthly package, the conversation stops being about how long something took. Your income becomes predictable, your clients know exactly what they get, and you can deliver brilliant work without watching the clock. The package is what makes premium pricing possible.'},
 {t:'normal',k:'Price the value',title:'Set the fee against what it is worth to them, not what it costs you in time.',body:'A structured pricing plan, built around the value a client actually receives, is how you move from a rate you can defend to a rate you deserve. Tiered options let clients choose their level, and a considered plan means you never pluck a number out of the air on a call again.'},
 {t:'normal',k:'Hold your price',title:'The best pricing plan fails the moment your nerve does.',body:'Most bookkeepers know they undercharge. What stops them is the money conversation itself. Learning to name your fee calmly, answer the pause, and hold the line without discounting is a skill you can practise. Confidence is not a personality trait here, it is the last and most important part of the method.'},
 {t:'dark',title:'You are not raising your prices. You are finally charging for the value that was always there.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Reprice the Value'},
 {t:'normal',k:'The practice this builds',title:'Fewer clients, higher fees, and work that actually feels like advice.',body:'When you lead with insight and price the value, you need fewer clients to reach the same income, and the ones you keep are the ones who value you most. The frantic, capped, hourly practice becomes a calmer, premium one, where a six-figure year is a matter of maths rather than more hours.'},
 {t:'dark',title:'The goal was never to work more. It was to build a practice that works for you.'},
 {t:'normal',k:'Why The 6 Figure Bookkeeper',title:'The method behind a 35,000-strong community of bookkeepers.',body:'Since 2020, Zoe Whitman and Jo Wood have helped tens of thousands of bookkeepers reprice, reposition, and grow, through The Bookkeepers Podcast and The Bookkeepers Collective. Zoe built and sold her own award-winning practice first. This is not theory, it is the exact method they teach every week.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Premium, Six-Figure Practice'},
 {t:'normal',k:'Keep going with the Collective',title:'The full method, with the training, coaching, and community to actually do it.',body:'The Bookkeepers Collective walks you through the whole method step by step, from the things I noticed advisory approach to a pricing plan you can defend and the confidence to hold it, with live coaching and a room full of bookkeepers doing the same. Start free in the 6 Figure Bookkeepers Club whenever you are ready.'},
 {t:'cta',title:'Ready to reprice the value you already deliver?',body:'Take the next step with Zoe, Jo, and The 6 Figure Bookkeeper.',chips:['Join The Bookkeepers Collective','Start free in the 6 Figure Bookkeepers Club'],disc:'Educational content for bookkeeping professionals. No income or earnings result is guaranteed. Results vary by practice, market, clients, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo-motif ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The 6 Figure <b>Bookkeeper</b> · Zoe Whitman &amp; Jo Wood</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  else if(s.t==='corner') h+=mo('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
