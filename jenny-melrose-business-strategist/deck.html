<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Owned-Audience Masterclass · Jenny Melrose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f3f7f6; --panel:#e3efee; --rule:#d3e6e3;
    --acc:#367070; --acc2:#52abab; --ink:#22383a; --body:#46585b; --dim:#8aa0a0; --cream:#eef6f4;
  }
  html,body{height:100%}
  body{background:#dce9e7;font-family:'DM Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dce9e7}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'DM Sans',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.16;letter-spacing:.002em}
  .t-title h1{font-size:5.0vw;max-width:94%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'DM Sans',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:75%;line-height:1.62;font-weight:400}
  .sub{font-family:'DM Serif Display',serif;font-style:italic;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:84%;line-height:1.4;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'DM Sans',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#1f4f4d 0%,#16403f 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:88%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1f4f4d 0%,#16403f 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'DM Sans',sans-serif;color:#d7e8e5;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc2);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:8%;bottom:9%;width:15vw;opacity:.92}
  .corner-vf{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'DM Sans',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(34,56,58,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.9vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.1vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Practice to Profit</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- home-base signal motif: a roof over radiating arcs, drawn in teal -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#367070" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M30 60 L60 34 L90 60" opacity="0.95"/>
    <path d="M40 60 L40 88 L80 88 L80 60" opacity="0.85"/>
    <path d="M60 46 C74 46 84 56 84 70" opacity="0.5"/>
    <path d="M60 40 C80 40 94 54 94 74" opacity="0.32"/>
    <circle cx="60" cy="70" r="3.6" fill="#367070" stroke="none" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Owned-Audience Masterclass',sub:'How to grow the business on platforms you actually own.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You built an audience. It just has not turned into the business you pictured.',body:'You show up, you post, you send the emails, and the numbers slowly climb. But the income never quite matches the effort, and a quiet worry sits underneath it: most of what you built lives on platforms that could change the rules tomorrow. You are working like it is a business. It has not started paying you like one.'},
 {t:'dark',title:'Followers you rent were never the business. The audience you own is.'},

 {t:'section',idx:'Part One',title:'Why More Followers Rarely Turns Into Income'},
 {t:'normal',k:'The rented audience',title:'On a social platform, you do not own the relationship. You are renting reach.',body:'The platform sits between you and the people who follow you, and it decides who sees what. When it changes the algorithm, tightens reach, or has a bad week, your audience does not shrink because you did something wrong. It shrinks because you were building on land you do not own, and the landlord moved the walls.'},
 {t:'normal',k:'The noise problem',title:'Posting more into a feed that rewards volume is not the same as building a business.',body:'A feed pays you in reach for producing constantly, so you produce constantly, and the work quietly becomes about staying visible instead of solving a real problem for real people. More content, more noise, more exhaustion, and none of it compounds into something that is actually yours.'},
 {t:'dark',title:'If a platform can switch off your reach tomorrow, it was never really yours.'},

 {t:'section',idx:'Part Two',title:'Building an Audience You Actually Own'},
 {t:'normal',k:'Move one, the problem',title:'Start from the one problem your people will pay you to solve.',body:'Not the topic you post about, the problem you solve. When your whole presence is organized around one specific problem for one specific person, your content stops being noise and starts being the front door to a business. This is the first move, and most creators skip it and wonder why the audience never converts.'},
 {t:'normal',k:'Move two, attract',title:'Attract your people by leaning into what makes you different, not by chasing trends.',body:'You do not need a bigger following. You need the right people to feel like you are speaking directly to them. That comes from being genuinely, specifically you, the exact thing the trend-chasing advice tells you to sand off. The more you sound like only yourself, the more the right people recognize you and stay.'},
 {t:'normal',k:'Move three, connection',title:'Build real know-like-trust on platforms you own.',body:'Your email list, your podcast, your website: these are the places where the relationship belongs to you, not to an algorithm. When you move the center of gravity there, you can reach your people whenever you choose, the trust deepens on your terms, and no platform update can quietly cut the line between you and them.'},
 {t:'normal',k:'Move four, income with integrity',title:'Turn that trust into income by solving the problem, not by selling out.',body:'You do not have to become someone louder or pushier to get paid. When you have named the problem, attracted the right people, and built the trust on your own platforms, offering the paid solution is the natural next step, not a betrayal of it. That is how the income diversifies without the burnout.'},
 {t:'dark',title:'When the audience is yours, a platform change is a headline, not a heart attack.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Own the Audience'},
 {t:'normal',k:'The business this builds',title:'Steadier income, less scrambling for reach, a foundation that compounds.',body:'You stop starting from zero every time the feed goes quiet. The list, the podcast, and the site keep working while you sleep, the people who find you already trust you, and growth stops meaning grind harder. The business finally fits inside a life you actually want to live, which was the point all along.'},
 {t:'dark',title:'You stop performing for the feed and start being paid for the problem you solve.'},
 {t:'normal',k:'Why Jenny',title:'Fifteen years online, a six-figure site built and sold, and a lot of learning this the hard way.',body:'Jenny spent 15-plus years in the online space, grew a lifestyle site to six figures and sold it, and now hosts the Practice to Profit podcast and wrote Influencer Entrepreneurs. She coaches women through this exact shift, from renting an audience to owning one. This masterclass is a piece of that work.'},

 {t:'section',idx:'Your Next Step',title:'Build the Audience You Own'},
 {t:'normal',k:'Keep going with Jenny',title:'This masterclass is the map. The coaching is walking it in your own business.',body:'What you just went through is the shift. Making it real, in your niche, with your list and your offers and someone in your corner, is what the coaching is for. If any of this named something you have been feeling, that is the place to start.'},
 {t:'cta',title:'Ready to grow on a platform you own?',body:'Take the next step with Jenny and Practice to Profit.',chips:['Listen to the podcast','Book a call'],disc:'Educational content for online business owners. No income or business result is guaranteed. Results vary by person, business, and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Practice to <b>Profit</b> · Jenny Melrose</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
