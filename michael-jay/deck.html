<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Studio That Stays · Yoga Biz Champ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Exo:wght@500;600;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ffffff; --panel:#050505; --rule:#e6e8e5;
    --ink:#14181a; --accent:#9ae66e; --grey:#54595a; --dim:#8a8f8c;
  }
  html,body{height:100%}
  body{background:#0a0b0a;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0a0b0a}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--grey);margin-bottom:2.4vh}
  h1{font-family:'Exo',sans-serif;font-weight:700;color:var(--ink);line-height:1.12;letter-spacing:-.005em}
  .t-title h1{font-size:3.8vw;max-width:92%}
  .t-normal h1{font-size:2.5vw;max-width:84%}
  .t-normal .body{font-size:1.38vw;color:var(--grey);margin-top:2.6vh;max-width:78%;line-height:1.6;font-weight:400}
  .sub{font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.52;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-size:1.3vw;font-weight:700;color:var(--ink);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.8vw;max-width:88%}
  .t-section .rule{width:16vw;height:4px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.7vw;max-width:86%;color:#ffffff}
  .t-dark h1 b{color:var(--accent);font-weight:700}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:82%;color:#ffffff}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--accent);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#9aa39a}
  .t-title .disc,.t-normal .disc{text-align:left}
  .ring-motif{position:absolute;pointer-events:none}
  .title-ring{right:6.5%;bottom:9%;width:15vw;opacity:.98}
  .brandline{font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--ink);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(20,24,26,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.2vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Yoga Biz Champ · Michael Jay</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ring" viewBox="0 0 120 120">
  <g fill="#9ae66e">
    <circle cx="60" cy="12" r="6"/><circle cx="94" cy="26" r="6"/><circle cx="108" cy="60" r="6"/>
    <circle cx="94" cy="94" r="6"/><circle cx="60" cy="108" r="6"/><circle cx="26" cy="94" r="6"/>
    <circle cx="12" cy="60" r="6"/><circle cx="26" cy="26" r="6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Studio That Stays',sub:'A live masterclass for community yoga studio owners on building a studio that stays open, stays full, and stays profitable, without losing the soul of it.',brand:true},
 {t:'normal',k:'Who this is for',title:'You opened a studio to build a community, not to lie awake doing the maths.',body:'This is for the owner who is loved by their students and still not sure the doors stay open next year: a full class list, a warm room, and a bank balance that never quite catches up. You are great at the yoga. It is everything around it that keeps you up.'},
 {t:'dark',title:'A beloved studio can still close. Heart got you in the room. It is not what keeps the lights on.'},

 {t:'section',idx:'Part One',title:'Why Loved Studios Still Close'},
 {t:'normal',k:'Full and still broke',title:'A packed community can lose money every single month.',body:'Popularity is not profit. Drop-ins that never become members, a schedule bloated with classes that do not pay, teachers paid whether the room fills or not, and marketing that only happens when things get quiet. The love is real. The numbers were never set up to hold it.'},
 {t:'normal',k:'The owner is the bottleneck',title:'When the studio only works because you are in it, you do not own a studio.',body:'You teach the early class, cover the no-show, answer every message, chase the rebooking. It runs on you. That is not a business yet, it is a very demanding job you built for yourself, and it caps how big your community can ever get.'},
 {t:'dark',title:'Most studios do not have a soul problem. They have a <b>system</b> problem.'},

 {t:'section',idx:'Part Two',title:'The Studio That Stays'},
 {t:'normal',k:'Mission and values',title:'Know what your studio is actually for, then let it decide everything.',body:'A clear mission is not a wall decoration. It sets who you serve, what you say yes and no to, and why a student picks you over the studio down the road. Every schedule, price, and hire gets easier once the studio knows what it is for.'},
 {t:'normal',k:'Intro offer to membership',title:'The first class is a promise. What happens next decides if they stay.',body:'An intro offer is not a discount, it is the start of a relationship. A deliberate path from first visit to belonging, so the people who walk in once have a reason and a nudge to become the members who keep the studio alive. Retention is community, made on purpose.'},
 {t:'normal',k:'A schedule that pays',title:'Build the timetable on data, not on habit.',body:'Classes that fill and hours that actually earn, instead of a grid you inherited and never questioned. When the schedule is built on what your community shows up for, you teach less to earn more and the room feels full instead of thin.'},
 {t:'normal',k:'Team and teachers',title:'Build a bench, not a bottleneck.',body:'Teachers who are invested rather than just booked, and a way to lead them so the studio does not live or die on your own two lungs. This is how you step off the schedule without the community feeling the difference.'},
 {t:'normal',k:'Marketing on a rhythm',title:'Market on purpose, not in a panic the week before.',body:'A steady, simple rhythm that brings new students in all year, so you are never scrambling for bodies when a term goes quiet. Not last-minute, not louder, just consistent, in a voice that sounds like your studio.'},
 {t:'dark',title:'The studio that stays is not the busiest one. It is the one <b>built to last</b>.'},

 {t:'section',idx:'Part Three',title:'Numbers That Keep the Lights On'},
 {t:'normal',k:'Sustainable numbers',title:'Profit is not the opposite of heart. It is what lets the heart keep going.',body:'A handful of numbers a community studio owner should actually watch: what a member is worth over their time with you, what it costs to fill a class, and the margin that leaves something behind. Watched monthly, they turn a good year into many of them.'},
 {t:'normal',k:'The owner’s real job',title:'Lead the studio. Do not teach every class on it.',body:'Your real job is to own the thing, not to be its hardest-working employee. Step out of survival mode and into ownership: a calm, full, profitable week that runs whether or not you are on the mat that morning.'},

 {t:'section',idx:'Who Is Teaching This',title:'Built, Run, and Sold, Not Just Taught'},
 {t:'normal',k:'Not theory',title:'A community studio built from scratch, run profitably for thirteen years, and sold.',body:'This is not a plan drawn on a whiteboard. Michael built Open Space Yoga in Delta, ran it profitably for thirteen years, and sold it to one of his instructors. Everything here is what actually kept those doors open.'},
 {t:'normal',k:'How it works',title:'The masterclass lays out the map. The coaching is where you build it with support.',body:'This hour shows you why loved studios still close, the pieces of a studio that stays, and the numbers behind it. From there, Start a Studio and Grow a Studio are where you install it, week by week, with someone who has actually done it.'},
 {t:'cta',title:'Ready to build the studio that stays open, full, and profitable for years?',chips:['Book a free strategy call','Listen to the Yoga Biz Champ podcast'],disc:'Educational content for yoga studio owners building a business. No income, revenue, or business result is guaranteed. Results vary by studio, market, and effort.'},
];

const deck=document.getElementById('deck');
function ringSvg(){return `<svg class="ring-motif title-ring"><use href="#ring"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Yoga Biz Champ &middot; <b>Michael Jay</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=ringSvg();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
