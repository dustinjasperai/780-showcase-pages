<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Win the Room | A Cenrox Masterclass with Spencer Waldron</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a2b48;        /* brand navy, brand.json rank #4 */
    --panel:#223a5e;
    --rule:#32507d;
    --ink:#f4f7fc;
    --muted:#aab7cf;
    --accent:#8022bd;    /* brand purple, brand.json rank #5 */
    --font:'Archivo',Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);color:var(--ink);font-family:var(--font);
    -webkit-font-smoothing:antialiased;overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{
    display:none;width:min(1120px,92vw);height:min(630px,88vh);
    background:linear-gradient(160deg,var(--bg),#16243d);
    border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;position:relative;overflow:hidden;
    flex-direction:column;justify-content:center;
  }
  .slide.active{display:flex}
  /* Phoenix-rise motif: a thin accent line climbing across each slide */
  .slide::after{
    content:"";position:absolute;left:0;bottom:0;height:3px;width:100%;
    background:linear-gradient(90deg,transparent,var(--accent));opacity:.65;
  }
  .kicker{font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--accent);margin-bottom:22px}
  h1{font-weight:900;font-size:60px;line-height:1.02;letter-spacing:-.02em;max-width:16ch}
  h2{font-weight:800;font-size:40px;line-height:1.06;letter-spacing:-.01em;max-width:20ch}
  .promise{font-size:23px;color:var(--muted);margin-top:24px;max-width:40ch;font-weight:400}
  .lead{font-size:26px;line-height:1.4;max-width:34ch;font-weight:500}
  .big{font-size:30px;line-height:1.3;font-weight:800;max-width:24ch}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px}
  li{font-size:21px;line-height:1.35;padding-left:30px;position:relative;color:var(--ink);max-width:46ch;font-weight:400}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .pillarnum{font-weight:900;font-size:17px;color:var(--accent);letter-spacing:.1em}
  .muted{color:var(--muted)}
  .who{display:flex;gap:16px;flex-wrap:wrap;margin-top:30px}
  .chip{border:1px solid var(--rule);background:var(--panel);border-radius:999px;
    padding:10px 20px;font-size:17px;font-weight:500}
  .creds{display:grid;grid-template-columns:1fr 1fr;gap:16px 40px;margin-top:28px;max-width:60ch}
  .creds div{font-size:18px;color:var(--muted)}
  .creds b{color:var(--ink);font-weight:600}
  .presenter{position:absolute;left:72px;bottom:40px;font-size:17px;color:var(--muted)}
  .presenter b{color:var(--ink);font-weight:600}
  .cta-steps{display:flex;flex-direction:column;gap:16px;margin-top:26px}
  .cta-steps div{font-size:22px;font-weight:600}
  .cta-steps span{color:var(--accent);font-weight:900;margin-right:12px}
  .disclaimer{position:absolute;left:72px;right:72px;bottom:34px;font-size:13px;
    color:var(--muted);line-height:1.5;max-width:70ch}
  .count{position:fixed;right:22px;bottom:16px;font-size:13px;color:var(--muted);opacity:.8}
  .brandmark{position:absolute;right:72px;top:60px;font-size:15px;font-weight:700;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
  .brandmark span{color:var(--accent)}
  .hint{position:fixed;left:22px;bottom:16px;font-size:12px;color:var(--muted);opacity:.55}
</style>
</head>
<body>
<div id="stage"></div>
<div class="count" id="count"></div>
<div class="hint">Use arrow keys</div>
<script>
const S=[
 {t:'title',kicker:'A live Cenrox masterclass',h:'Win the Room',
  promise:'How leaders hold a high-stakes presentation without reading from a script.',
  presenter:'With Spencer Waldron, founder of Cenrox'},

 {t:'who',kicker:'Who this is for',h:'You present when it actually counts.',
  chips:['Executives','Founders','Team leaders','Anyone facing a board, a client, or a stage']},

 {t:'reframe',kicker:'Why this matters',
  big:'When the room does not buy you, the idea does not move. The stakes were never really the slides.'},

 {t:'trap',kicker:'The trap',
  lead:'You build the deck. You rehearse the words. Then the room goes quiet, every eye turns to you, and you revert to reading your own slides back to them.'},

 {t:'reframe',kicker:'The uncomfortable part',
  big:'The problem was never your slides. It is that you are presenting AT the room instead of leading it.'},

 {t:'part',kicker:'Part one',h:'Why strong leaders still lose the room.'},

 {t:'content',kicker:'Part one',h:'Linear slides turn you into a narrator.',
  items:['A fixed slide order forces the room to follow your deck, not your thinking.',
         'Attention leaks the moment you talk to the screen instead of the people.',
         'And the one part you cannot script, the Q&A, is the part that decides the yes.']},

 {t:'content',kicker:'Part one',h:'The high-stakes moments are the unscripted ones.',
  items:['The board interrupts with the question you hoped to skip.',
         'The client pushes back in front of their whole team.',
         'The keynote crowd goes flat and you feel yourself speeding up.']},

 {t:'reframe',kicker:'The real fix',
  big:'You do not need more confidence. You need a method you can run when your heart rate is up.'},

 {t:'part',kicker:'Part two',h:'The Cenrox method: present conversationally, deliver with composure.'},

 {t:'content',kicker:'Part two',h:'Three habits do the work.',
  items:['Present conversationally, so the room follows you and not the deck.',
         'Deliver with composure, trained through practice and feedback.',
         'Own the hard questions, by rehearsing the ones you fear first.']},

 {t:'pillar',num:'Pillar 01',kicker:'Part two',h:'Present conversationally.',
  lead:'Move off the linear deck. Structure the talk as a conversation you steer with the room, non-linear and audience-led, so you are responding to them, not reciting at them.'},

 {t:'pillar',num:'Pillar 02',kicker:'Part two',h:'Deliver with composure.',
  lead:'Mastery in speaking comes from practice, real feedback, and refining your delivery. We train the delivery itself, the voice, the pauses, the presence, not the slide design.'},

 {t:'pillar',num:'Pillar 03',kicker:'Part two',h:'Own the hard questions.',
  lead:'We rehearse the questions you are most afraid of first. When you have already sat with the hard ones, the silence after a tough question stops scaring you.'},

 {t:'part',kicker:'Part three',h:'The same talk, led instead of survived.'},

 {t:'content',kicker:'Part three',h:'You lead the room instead of surviving it.',
  items:['You open a board update by framing the decision, not the agenda.',
         'You take the interruption as an invitation, and answer it calmly.',
         'People remember what you said, because you spoke with them, not past them.']},

 {t:'reframe',kicker:'Part three',
  big:'The moment that used to end you, the hard question in a quiet room, is the moment that now wins you the yes.'},

 {t:'creds',kicker:'Why learn this from Spencer',h:'Sixteen years turning anxious presenters into leaders of the room.',
  creds:[['Prezi','Nine years as product evangelist, spokesperson, and trainer, teaching non-linear presenting.'],
         ['3Sixty','Co-founded a presentation design agency.'],
         ['LinkedIn Learning','Instructor on business and high-stakes presentation skills.'],
         ['Speaking of Success','Host of the podcast on communication and presence.']]},

 {t:'cta',kicker:'Your next step',h:'Practice this live, on your next real presentation.',
  steps:[['1','Join a live coaching session inside the Cenrox membership.'],
         ['2','Start with a free Ask Me Anything session to meet the coach.'],
         ['3','Bring the presentation you are actually dreading. We work on that one.']],
  disclaimer:'This is an educational masterclass. It teaches presentation and communication skills; it does not guarantee any specific result. Your outcomes depend on your own practice and application. Cenrox offers a 30-day money-back guarantee on membership.'}
];

const stage=document.getElementById('stage');
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function render(sl){
  let inner='';
  const brand='<div class="brandmark">CEN<span>ROX</span></div>';
  if(sl.kicker) inner+='<div class="kicker">'+esc(sl.kicker)+'</div>';
  if(sl.t==='title'){
    inner+='<h1>'+esc(sl.h)+'</h1><div class="promise">'+esc(sl.promise)+'</div>';
    inner+='<div class="presenter"><b>'+esc(sl.presenter)+'</b></div>';
  } else if(sl.t==='who'){
    inner+='<h2>'+esc(sl.h)+'</h2><div class="who">'+sl.chips.map(c=>'<div class="chip">'+esc(c)+'</div>').join('')+'</div>';
  } else if(sl.t==='trap'){
    inner+='<div class="lead">'+esc(sl.lead)+'</div>';
  } else if(sl.t==='reframe'){
    inner+='<div class="big">'+esc(sl.big)+'</div>';
  } else if(sl.t==='part'){
    inner+='<h1>'+esc(sl.h)+'</h1>';
  } else if(sl.t==='content'){
    inner+='<h2>'+esc(sl.h)+'</h2><ul>'+sl.items.map(i=>'<li>'+esc(i)+'</li>').join('')+'</ul>';
  } else if(sl.t==='pillar'){
    inner+='<div class="pillarnum">'+esc(sl.num)+'</div><h2>'+esc(sl.h)+'</h2><div class="promise">'+esc(sl.lead)+'</div>';
  } else if(sl.t==='creds'){
    inner+='<h2>'+esc(sl.h)+'</h2><div class="creds">'+sl.creds.map(c=>'<div><b>'+esc(c[0])+'</b>. '+esc(c[1])+'</div>').join('')+'</div>';
  } else if(sl.t==='cta'){
    inner+='<h2>'+esc(sl.h)+'</h2><div class="cta-steps">'+sl.steps.map(s=>'<div><span>'+esc(s[0])+'</span>'+esc(s[1])+'</div>').join('')+'</div>';
    inner+='<div class="disclaimer">'+esc(sl.disclaimer)+'</div>';
  }
  inner+=brand;
  return '<div class="slide active">'+inner+'</div>';
}
let idx=0;
function show(i){
  idx=Math.max(0,Math.min(S.length-1,i));
  stage.innerHTML=render(S[idx]);
  document.getElementById('count').textContent=(idx+1)+' / '+S.length;
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ') show(idx+1);
  else if(e.key==='ArrowLeft') show(idx-1);
});
document.addEventListener('click',()=>show(idx+1));
show(0);
</script>
</body>
</html>
