<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dress As Your Future Self - a Style Awakening masterclass with Amanda Weil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f3;
    --panel:#f4ece3;
    --rule:#e4ddd6;
    --ink:#2b2328;
    --muted:#7a7d83;
    --accent:#652039;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Jost',system-ui,sans-serif;font-weight:300;line-height:1.55}
  .deck{width:100%}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;scroll-snap-align:start;border-bottom:1px solid var(--rule);position:relative}
  .eyebrow{font-family:'Jost';font-weight:500;letter-spacing:.28em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:26px}
  h1{font-family:'EB Garamond';font-weight:500;font-size:clamp(38px,6.4vw,76px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'EB Garamond';font-weight:500;font-size:clamp(30px,4.6vw,54px);line-height:1.1}
  .lede{font-family:'EB Garamond';font-size:clamp(20px,2.4vw,30px);color:var(--ink);max-width:24ch;margin-top:8px}
  p.body{font-size:clamp(16px,1.5vw,20px);color:var(--muted);max-width:52ch;margin-top:22px;font-weight:300}
  .kicker{font-family:'EB Garamond';font-style:italic;font-size:clamp(22px,2.8vw,34px);color:var(--accent);max-width:30ch}
  ul{list-style:none;margin-top:30px;max-width:56ch}
  li{position:relative;padding-left:26px;margin:16px 0;font-size:clamp(16px,1.5vw,20px);color:var(--ink);font-weight:300}
  li::before{content:"";position:absolute;left:0;top:.72em;width:12px;height:1px;background:var(--accent)}
  .phase-no{font-family:'EB Garamond';font-size:clamp(54px,8vw,110px);color:var(--accent);line-height:.9;font-weight:400}
  .phase-grid{display:flex;gap:min(6vw,70px);align-items:baseline;flex-wrap:wrap}
  .meta{font-family:'Jost';letter-spacing:.2em;text-transform:uppercase;font-size:11px;color:var(--muted);
    position:absolute;bottom:4vh;left:8vw;right:8vw;display:flex;justify-content:space-between}
  .rule-line{width:60px;height:2px;background:var(--accent);margin:30px 0 0}
  .cta-box{margin-top:30px;padding:28px 30px;background:var(--panel);border:1px solid var(--rule);max-width:50ch}
  .cta-box .step{font-family:'EB Garamond';font-size:clamp(20px,2.3vw,28px);color:var(--ink)}
  .disclaimer{font-size:12.5px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .brand{font-family:'EB Garamond';font-style:italic;font-size:22px;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A Style Awakening masterclass', title:'Dress As Your Future Self', kicker:'Why your closet is full and still nothing feels like you.', brand:'Amanda Weil Style'},

  {t:'promise', eyebrow:'The promise', title:'In the next hour', body:'You will see why the gap between your wardrobe and who you have become is not a shopping problem, and how to close it on purpose, so the way you show up finally matches the leader you already are.'},

  {t:'point', eyebrow:'Who this is for', title:'The high performer who has outgrown her image', body:'You have built the career, the company, the reputation. You walk into rooms you once only hoped to be in. And yet you open a full closet most mornings and feel like none of it is the person standing there now.'},

  {t:'kicker', eyebrow:'The reframe', title:'', kicker:'You did not outgrow your wardrobe. You outgrew who you were when you bought it.'},

  {t:'section', eyebrow:'Part one', title:'The core problem', body:'Style is treated as the last thing on the list, a surface to fix with more shopping. So the closet keeps filling and the feeling never changes, because the real gap is not between you and the right outfit.'},

  {t:'point', eyebrow:'Part one', title:'The gap is between two selves', body:'There is the self who bought those clothes, often years and several versions of you ago, and the self you are now. Every outfit that no longer fits your life is a quiet argument between them.'},

  {t:'point', eyebrow:'Part one', title:'Why willpower and trends do not fix it', body:'A trend tells you what everyone is wearing. A rule tells you what flatters your shape. Neither asks the only question that matters: who are you becoming, and does what you put on each day agree with her?'},

  {t:'section', eyebrow:'Part two', title:'The Style Awakenings method', body:'Style used as a catalyst for change, not a coat of paint on top of it. Four phases take you from the full closet that feels like nothing to a wardrobe, and a self image, built around your future self.'},

  {t:'phase', no:'01', eyebrow:'Phase one', title:'Awakening', body:'You get honest about the gap. You name who you have become and how little of your current image reflects her. Awareness first, because you cannot dress a self you have not admitted you are.'},

  {t:'phase', no:'02', eyebrow:'Phase two', title:'Releasing', body:'You let go, of the pieces that belong to an old chapter, and of the beliefs underneath them: that it is vain to care, that this is as good as it gets, that you have to earn the right to look like yourself.'},

  {t:'phase', no:'03', eyebrow:'Phase three', title:'Renewing', body:'You rebuild, intentionally. A wardrobe chosen to express the future self, and the mental frame that goes with it, so getting dressed becomes a daily act of stepping toward her instead of away.'},

  {t:'phase', no:'04', eyebrow:'Phase four', title:'Becoming', body:'You walk into the room as the person your style now says you are. The clothes stop being a costume you manage and start being the simplest, truest signal of who you already are.'},

  {t:'point', eyebrow:'The principle', title:'Soul styling: it is an inside job', body:'This is why it is not about trends. Your outer image is the expression of an inner story. Change the story and the wardrobe follows easily; change only the wardrobe and the old story pulls it back.'},

  {t:'point', eyebrow:'The practice', title:'Dress for your future self', body:'The daily practice is small and repeatable: before you reach for what is easy, ask what your future self would wear into this day, and dress one degree toward her. Done every morning, it compounds.'},

  {t:'point', eyebrow:'The shift', title:'Magnetic confidence', body:'When your outside finally agrees with your inside, you stop managing how you look and start using your energy on the room, the work, the relationship. That congruence is what people feel as presence.'},

  {t:'section', eyebrow:'Part three', title:'A closet that agrees with you', body:'A closet where every piece agrees with you. Mornings that take minutes, not a crisis. Walking into the meeting, the stage, the date, already feeling like the version of you that you have been working to become.'},

  {t:'credibility', eyebrow:'Why me', title:'Amanda Weil', body:'I spent fourteen years in the corporate world before I became a soul stylist. I have styled hundreds of executives, entrepreneurs, TV hosts and leaders, and been invited on shows like KTLA to talk about it. I do not help people become someone new. I help them fully express who they have always been.'},

  {t:'recap', eyebrow:'The recap', title:'What you take with you', bullets:['The gap is between your old self and your future self, not you and the right outfit','Four phases: Awakening, Releasing, Renewing, Becoming','Change the inner story and the wardrobe follows','Dress one degree toward your future self every morning']},

  {t:'cta', eyebrow:'Your next step', title:'Map your own Style Awakening', step:'Book a complimentary Style Vision Session with me. We will look at the gap between where your image is now and the leader you are becoming, and map your first steps.', brand:'Amanda Weil Style', disclaimer:'This masterclass is educational. No specific outcome, income, or result is guaranteed. Results vary and depend on your own effort, circumstances, and choices.'}
];

const E = s => s ? `<div class="eyebrow">${s}</div>` : '';
function render(s){
  switch(s.t){
    case 'title': return `${E(s.eyebrow)}<h1>${s.title}</h1><div class="rule-line"></div><p class="lede">${s.kicker}</p><div class="meta"><span class="brand">${s.brand}</span><span>A live masterclass</span></div>`;
    case 'promise': return `${E(s.eyebrow)}<h2>${s.title}</h2><p class="body">${s.body}</p>`;
    case 'kicker': return `${E(s.eyebrow)}<div class="kicker">${s.kicker}</div>`;
    case 'section': return `${E(s.eyebrow)}<h2>${s.title}</h2><p class="body">${s.body}</p>`;
    case 'point': return `${E(s.eyebrow)}<h2>${s.title}</h2><p class="body">${s.body}</p>`;
    case 'phase': return `${E(s.eyebrow)}<div class="phase-grid"><span class="phase-no">${s.no}</span><h2>${s.title}</h2></div><p class="body">${s.body}</p>`;
    case 'credibility': return `${E(s.eyebrow)}<h2>${s.title}</h2><p class="body">${s.body}</p>`;
    case 'recap': return `${E(s.eyebrow)}<h2>${s.title}</h2><ul>${s.bullets.map(b=>`<li>${b}</li>`).join('')}</ul>`;
    case 'cta': return `${E(s.eyebrow)}<h2>${s.title}</h2><div class="cta-box"><div class="step">${s.step}</div></div><p class="disclaimer">${s.disclaimer}</p><div class="meta"><span class="brand">${s.brand}</span><span></span></div>`;
    default: return `<h2>${s.title||''}</h2>`;
  }
}
document.getElementById('deck').innerHTML = S.map(s=>`<section class="slide">${render(s)}</section>`).join('');
</script>
</body>
</html>
