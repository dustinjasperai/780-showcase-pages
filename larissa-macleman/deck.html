<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Salon CEO, a masterclass with Larissa Macleman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f0;
    --panel:#fffdf7;
    --rule:#423023;
    --dim:#6b6257;
    --ink:#00281f;
    --accent:#dcb239;
    --head:'Cormorant Garamond',Georgia,serif;
    --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid rgba(66,48,35,.14);border-radius:16px;
    padding:64px 74px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(0,40,31,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* growth-plan motif: a single gold step-rule climbing from the left */
  .slide::before{content:'';position:absolute;top:0;left:0;height:6px;width:42%;
    background:linear-gradient(90deg,var(--accent),rgba(220,178,57,0));border-radius:0 0 6px 0}
  .kick{font-family:var(--body);font-size:13px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:68px;line-height:1.02;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:48px;line-height:1.06;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:600;font-size:32px;line-height:1.15;margin:0 0 12px}
  p{font-family:var(--body);font-size:22px;line-height:1.55;color:var(--dim);margin:0 0 14px;max-width:46ch}
  .lead{font-size:26px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.42;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid rgba(66,48,35,.14)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:15px;height:15px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:700}
  li span{display:block;color:var(--dim);font-size:17px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:128px;line-height:.96;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:1.5px rgba(0,40,31,.34);position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid rgba(66,48,35,.14);border-radius:14px;padding:24px 26px}
  .cell .n{font-family:var(--head);color:var(--ink);font-size:28px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:58px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#00281f;
    width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:800;font-size:16px;top:14px;left:6px}
  .who{font-size:19px;color:var(--dim);margin-top:auto;padding-top:22px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--dim);margin-top:26px;max-width:64ch;line-height:1.45}
  .ctaline{font-size:23px;color:var(--ink);margin-top:8px;max-width:52ch}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--dim);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--dim);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid rgba(66,48,35,.16);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:rgba(66,48,35,.22);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:44px}h2{font-size:34px}.big{font-size:78px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Salon Owners Collective · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The Salon CEO',p:'How to step off the floor and lead your salon like its CEO, so the business grows without living on your shoulders.',pres:'A live session from <b>Salon Owners Collective</b>, hosted by Larissa Macleman'},
 {t:'promise',kick:'What you will leave with',h:'Three shifts, in one live hour.',li:[['The decision that changes everything','The one call every owner makes before a salon can grow past them.'],['A business that holds without you','How the salon keeps its standards when you are not standing over it.'],['A staged plan, not more hustle','The order to build in, so growth is a sequence you follow instead of a scramble.']]},
 {t:'audience',kick:'Who this is for',h:'The salon is full. You are still the one holding it together.',p:'For salon owners with a real team and a real book, who are past survival but stuck at sixty hour weeks, because every decision, every fix and every standard still runs back through them.',who:'<b>The trap:</b> you are the best stylist, the manager, the fixer and the owner all at once, so the busier the salon gets, the more it needs you, and the ceiling becomes you.'},
 {t:'reframe',kick:'The reframe',big1:'Operator.',big2:'Or a <span class="em">salon CEO</span>.',p:'An operator carries the salon on their own two hands, so it can only ever be as big as they are. A CEO builds the salon to run on a plan, a team and the numbers. Same salon, a completely different ceiling. That shift is the whole session.'},
 {t:'part',kick:'Part one',h:'Why your salon stopped scaling.'},
 {t:'point',kick:'The core problem',h:'You built yourself a job, not a business.',p:'When the salon cannot open, quote, coach or recover from a bad day without you, you do not own a business, you own a very demanding job. It pays better than a chair, but it still owns your calendar, your evenings and your headspace.'},
 {t:'point',kick:'The core problem',h:'Being the best stylist is the ceiling.',p:'The skills that filled your column are not the skills that scale a salon. Doing more, faster, simply moves the bottleneck closer to burnout. Growth does not come from you working harder in the salon. It comes from you working on it.'},
 {t:'framework',kick:'The core problem',h:'Working in it, or on it.',row:[['In the salon','You take the clients, fix the roster, chase the standards. The salon grows only while you push, and stalls the moment you stop.'],['On the salon','You build the plan, the team and the numbers that push for you. The salon keeps moving whether or not you are on the floor.']],p:'Every owner starts in it. A salon only scales once you start living on it.'},
 {t:'part',kick:'Part two',h:'The million dollar Salon Growth Plan.'},
 {t:'point',kick:'Stage one',h:'The CEO decision.',p:'The version of you that built the salon is not always the version that can scale it. Stage one is the decision to lead instead of do: to step back from the chair on purpose, and take the seat where the growth decisions actually get made.'},
 {t:'point',kick:'Stage two',h:'Build the salon to run without you.',p:'Standards that live in your head do not scale. Stage two puts the operating side of the salon into plain structure and clear numbers, so the team owns its own targets and the business holds its standards when you are not in the room.'},
 {t:'point',kick:'Stage three',h:'Scale on purpose, one lever at a time.',p:'Growth is not a lucky quarter. Stage three is the staged climb: knowing your numbers, choosing the one lever that moves them next, and repeating that instead of throwing energy at ten things and hoping one lands.'},
 {t:'cycle',kick:'The plan in motion',h:'The order it actually happens in.',steps:['Decide to lead the salon instead of run on it','Get your real numbers in front of you, not in your head','Put the standards and roles into plain structure','Hand the daily targets to a team that owns them','Pick the one lever that grows revenue next, and pull it'],p:'You do not do all five at once. You move through them in order, and each one buys back time for the next.'},
 {t:'part',kick:'Part three',h:'Back on your own floor.'},
 {t:'looks',kick:'The outcome',h:'The salon runs. You lead.',li:[['Fewer hours, more control','You spend less time behind the chair and more time on the decisions that actually grow the place.'],['A team that steps up','People own their targets and standards, so you stop chasing, reminding and repeating yourself.'],['Growth you can see coming','You know your numbers and your next lever, so scaling is a plan you follow, not a gamble you make.']]},
 {t:'whyme',kick:'Why Salon Owners Collective',h:'Twenty years in salons, before any of the coaching.',li:[['A large format salon owner first','This is built from actually running and scaling salons, not from theory about them.'],['The Salon Owners Collective community and podcast','Hundreds of episodes and thousands of owners, all working on the same operator to CEO shift.'],['A plan, not a pep talk','Salon Owners Collective teaches one repeatable way to grow a salon, so freedom and profit are built, not wished for.']]},
 {t:'cta',kick:'Your next step',h:'Ready to build your own plan?',ctas:['<b>Book a strategy call with the Salon Owners Collective team</b> and we will map where your salon sits today and the next stage of its growth plan.','Bring your real numbers and the one thing keeping you on the floor, and we will start there.'],disc:'This masterclass is educational. It shares frameworks and approaches for growing a salon business; it is not advice for your specific situation and not a guarantee of any particular income or result. Outcomes vary by salon, market and effort.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--dim)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
