<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dream Weave : A Live Masterclass with Athena Laz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg:#141225;
    --panel:#1e1b33;
    --rule:#3a3450;
    --accent:#c1a973;
    --ink:#f3efe6;
    --ink-soft:#c7c2d6;
    --ink-muted:#8d88a3;
  }
  html,body { height:100%; }
  body {
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh;
  }
  #stage { width:100%; max-width:1000px; aspect-ratio:16/10; position:relative; }
  .slide {
    position:absolute; inset:0; display:none; flex-direction:column; justify-content:center;
    padding:64px 72px; background:var(--bg);
  }
  .slide.on { display:flex; }
  .kicker { font-size:13px; font-weight:600; letter-spacing:0.22em; text-transform:uppercase; color:var(--accent); margin-bottom:28px; }
  .part { font-family:'Cormorant Garamond',Georgia,serif; font-size:19px; font-weight:600; letter-spacing:0.16em; text-transform:uppercase; color:var(--accent); margin-bottom:22px; }
  h1 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; font-size:72px; line-height:1.04; letter-spacing:0.005em; color:var(--ink); }
  h2 { font-family:'Cormorant Garamond',Georgia,serif; font-weight:600; font-size:48px; line-height:1.12; color:var(--ink); margin-bottom:22px; }
  .sub { font-size:23px; line-height:1.5; color:var(--ink-soft); margin-top:28px; max-width:40ch; }
  p.body { font-size:24px; line-height:1.55; color:var(--ink-soft); max-width:46ch; }
  ul { list-style:none; margin-top:10px; }
  li { font-size:23px; line-height:1.5; color:var(--ink-soft); padding-left:30px; position:relative; margin-bottom:18px; max-width:48ch; }
  li::before { content:''; position:absolute; left:0; top:14px; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  li b { color:var(--ink); font-weight:600; }
  .big { font-family:'Cormorant Garamond',Georgia,serif; font-style:italic; font-size:52px; line-height:1.18; color:var(--ink); max-width:22ch; }
  .credit { font-size:21px; line-height:1.55; color:var(--ink-soft); max-width:42ch; }
  .credit b { color:var(--ink); font-weight:600; }
  .disclaimer { font-size:14px; line-height:1.5; color:var(--ink-muted); margin-top:30px; max-width:52ch; }
  .cta-step { display:inline-block; margin-top:26px; font-size:18px; font-weight:600; letter-spacing:0.04em; color:var(--bg); background:var(--accent); border-radius:100px; padding:15px 30px; }
  .count { position:absolute; bottom:22px; right:28px; font-size:12px; letter-spacing:0.1em; color:var(--ink-muted); }
  .hint { position:fixed; bottom:16px; left:0; right:0; text-align:center; font-size:12px; color:var(--ink-muted); letter-spacing:0.08em; }
  @media (max-width:720px){ h1{font-size:46px;} h2{font-size:34px;} .big{font-size:34px;} .slide{padding:40px 34px;} .sub,p.body,li,.credit{font-size:19px;} }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hint">Use the arrow keys to move through the slides</div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Athena Laz', h:'The Dream Weave', sub:'How to read your dreams as a real pathway to psyche and spirit.' },
  {t:'who', part:'Who this is for', body:'This is for you if you wake with a dream still tugging at you and no idea what it meant. If you sense your dreams are speaking but the dream dictionaries feel hollow. If you want a real method, not one more hit of inspiration.' },
  {t:'trap', part:'The trap', big:'The dream fades by the time the kettle boils. By noon it is gone. And the one thing your psyche worked all night to show you is lost.' },
  {t:'hook', part:'A reframe', big:'A dream you do not read does not disappear. It repeats. The same figure, the same locked room, the same tide, until you finally turn and look.' },
  {t:'p1', part:'Part one', h2:'Why dreams feel like noise', body:'We were taught the dream is leftover static from the day, so we ignore it, or we look up a symbol in a book that knows nothing about your actual life.' },
  {t:'p1b', h2:'But the dream is not noise', body:'It is not random and it is not generic. It is your own depth speaking in the only language it has: image, feeling, symbol. Learn that language and the dream becomes the most honest counsel you have.' },
  {t:'p2', part:'Part two', h2:'The Dream Weave', body:'This is the method I teach for working with a dream on purpose instead of letting it slip away. Five movements, each one a skill you can practise.' },
  {t:'pil1', part:'The method', h2:'Symbol literacy', body:'Reading what the dream is actually showing you, in your own context, not a dictionary. The image that carries the most charge is where you begin.' },
  {t:'pil2', part:'The method', h2:'The lucid doorway', body:'Becoming awake inside the dream, so you can meet it with intention rather than being carried by it. This is a trainable practice, not a gift reserved for a few.' },
  {t:'pil3', part:'The method', h2:'The shadow in the dark', body:'The figures you flinch from in a dream carry what you have had to exile in waking life. The dream is the one place you can turn and meet them safely.' },
  {t:'pil4', part:'The method', h2:'The dream allies', body:'The guides, the animals, the ones who arrive to help. How to recognise a true ally in the dream and let it work on your behalf.' },
  {t:'pil5', part:'The method', h2:'The bridge', body:'Carrying what you found in the dream back across into waking life, so it changes something real: a choice, a relationship, the next right move.' },
  {t:'p3', part:'Part three', h2:'Reading a dream, live', body:'We take one dream. We stay with the image that has the most charge. We ask what it wants, not only what it means. The answer is almost never what the waking mind guessed first.' },
  {t:'practice', h2:'A practice, not a talent', body:'You do not need to be a natural. Dreaming the way I teach it is a practice. Everyone who commits to it gets better at it, night by night.' },
  {t:'whyme', part:'Why me', credit:'I am a depth psychologist and a fourth-generation intuitive. I wrote <b>The Alchemy of Your Dreams</b>, now translated into more than thirteen languages, and I have spent years teaching this work as <b>The Dream Weave</b>.' },
  {t:'cta', part:'The invitation', h2:'Come dream with me', body:'The Dream Weave is a live depth intensive where we do exactly this together, month after month, with a community of dreamers walking the same path. If tonight stirred something, that is the dream insisting.', step:'Join The Dream Weave', disclaimer:'This masterclass is offered for educational and personal growth purposes. It is not a substitute for medical, therapeutic, or psychological treatment, No specific result is guaranteed. Results vary from person to person.' }
];
const stage = document.getElementById('stage');
stage.innerHTML = S.map((s,i)=>{
  let inner = '';
  if (s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if (s.part) inner += `<div class="part">${s.part}</div>`;
  if (s.h) inner += `<h1>${s.h}</h1>`;
  if (s.h2) inner += `<h2>${s.h2}</h2>`;
  if (s.big) inner += `<div class="big">${s.big}</div>`;
  if (s.sub) inner += `<div class="sub">${s.sub}</div>`;
  if (s.body) inner += `<p class="body">${s.body}</p>`;
  if (s.credit) inner += `<div class="credit">${s.credit}</div>`;
  if (s.step) inner += `<div><span class="cta-step">${s.step}</span></div>`;
  if (s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  inner += `<div class="count">${i+1} / ${S.length}</div>`;
  return `<section class="slide${i===0?' on':''}">${inner}</section>`;
}).join('');
let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
function go(n){ slides[cur].classList.remove('on'); cur=Math.max(0,Math.min(slides.length-1,n)); slides[cur].classList.add('on'); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') go(cur-1);
});
stage.addEventListener('click',()=>go(cur+1));
</script>
</body>
</html>
