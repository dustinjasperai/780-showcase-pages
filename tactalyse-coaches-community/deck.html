<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Invisible Game - a Tactalyse masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Ropa+Sans:ital@0;1&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f7f6f2;
  --panel:#e9e5dc;
  --rule:#d8d2c6;
  --ink:#1a1c20;
  --deep:#333333;
  --accent:#b50a01;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Open Sans',sans-serif;-webkit-font-smoothing:antialiased;padding:40px 18px 90px}
#deck{max-width:1040px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
.slide{position:relative;background:var(--bg);border:1.5px solid var(--rule);border-radius:16px;padding:68px 64px;min-height:560px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;box-shadow:0 10px 30px rgba(51,40,24,.06)}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--accent)}
.pitch{position:absolute;right:46px;top:44px;opacity:.5}
.kick{font-family:'Open Sans';font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:'Ropa Sans',sans-serif;font-weight:400;font-size:68px;line-height:1.02;letter-spacing:.01em}
h2{font-family:'Ropa Sans',sans-serif;font-weight:400;font-size:52px;line-height:1.06;letter-spacing:.01em}
.sub{font-size:25px;line-height:1.5;color:var(--deep);margin-top:26px;max-width:40ch}
.lede{font-size:30px;line-height:1.42;color:var(--ink);max-width:30ch}
.big{font-family:'Ropa Sans',sans-serif;font-size:58px;line-height:1.08;color:var(--ink);max-width:24ch}
.big .a{color:var(--accent)}
.part{font-family:'Ropa Sans',sans-serif;font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);font-weight:400}
ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:20px}
li{font-size:24px;line-height:1.4;color:var(--deep);padding-left:40px;position:relative;max-width:42ch}
li::before{content:'';position:absolute;left:0;top:12px;width:18px;height:18px;border:3px solid var(--accent);border-radius:5px}
.rows{margin-top:28px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:18px;align-items:baseline;font-size:23px;color:var(--deep);max-width:52ch;border-bottom:1px solid var(--rule);padding-bottom:14px}
.pos{font-family:'Ropa Sans',sans-serif;color:var(--accent);font-size:22px;min-width:168px;letter-spacing:.02em}
.who{font-size:27px;line-height:1.45;color:var(--deep);max-width:34ch}
.presenter{margin-top:38px;font-size:21px;color:var(--deep)}
.presenter b{color:var(--ink);font-weight:700}
.cta-step{font-size:30px;line-height:1.4;color:var(--ink);max-width:30ch;margin-top:8px}
.disc{margin-top:40px;font-size:15px;line-height:1.6;color:#6a6760;max-width:60ch;border-top:1px solid var(--rule);padding-top:20px}
.n{position:absolute;right:30px;bottom:22px;font-size:14px;letter-spacing:.14em;color:#8a857b;font-weight:700}
.stat{display:flex;gap:46px;margin-top:34px;flex-wrap:wrap}
.stat div{font-size:19px;color:var(--deep)}
.stat b{display:block;font-family:'Ropa Sans',sans-serif;font-weight:400;font-size:46px;color:var(--accent);line-height:1}
@media(max-width:720px){.slide{padding:44px 30px;min-height:auto}h1{font-size:46px}h2{font-size:38px}.big{font-size:40px}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const PITCH = '<svg class="pitch" width="120" height="78" viewBox="0 0 120 78" fill="none"><rect x="1.5" y="1.5" width="117" height="75" rx="4" stroke="#b50a01" stroke-opacity=".5" stroke-width="2"/><line x1="60" y1="2" x2="60" y2="76" stroke="#b50a01" stroke-opacity=".5" stroke-width="2"/><circle cx="60" cy="39" r="13" stroke="#b50a01" stroke-opacity=".5" stroke-width="2"/><rect x="1.5" y="24" width="20" height="30" stroke="#b50a01" stroke-opacity=".5" stroke-width="2"/><rect x="98.5" y="24" width="20" height="30" stroke="#b50a01" stroke-opacity=".5" stroke-width="2"/></svg>';
const S=[
 {t:'title', k:'A live masterclass for football coaches', h:'The Invisible Game', sub:'Coaching the individual player\'s decision, position by position.', who:'<div class="presenter">with <b>Loran Vrielink</b>, founder of Tactalyse</div>'},
 {t:'promise', k:'What you will leave able to do', lede:'Watch any clip and name the one fundamental that decided the moment, for that specific position, instead of only seeing team shape.'},
 {t:'who', k:'Who this is for', who:'Coaches who already drill the system and set the formation, but keep watching the same players freeze in the same situations.'},
 {t:'trap', k:'The trap', lede:'You can coach a perfect structure all week. On Saturday the game is still decided by one player reading one situation right, or wrong.'},
 {t:'reframe', k:'The reframe', big:'Your players rarely lack fitness or formation. What they lack is <span class="a">the read.</span>'},
 {t:'part', part:'Part One', h:'Why systems stall'},
 {t:'problem', k:'The hidden assumption', lede:'Team tactics quietly assume every player already makes the right individual decision inside the shape. Most never learned how.'},
 {t:'gap', k:'What is missing', lede:'Almost no coaching education teaches a player to SEE the individual fundamental in front of them. That is the gap this masterclass fills.'},
 {t:'part', part:'Part Two', h:'The Fundamentals'},
 {t:'define', k:'The core idea', big:'A fundamental is the <span class="a">optimal response</span> in a given game situation.'},
 {t:'pillar', k:'Layer one', h:'Individual, by position', sub:'The correct action for THIS position in THIS situation. A fullback, a six and a striker read the same moment completely differently.'},
 {t:'pillar', k:'Layer two', h:'Team fundamentals', sub:'How the unit responds together, so individual reads add up instead of cancelling out.'},
 {t:'pillar', k:'Layer three', h:'Line fundamentals', sub:'How a line stays connected and aligned, moving as one when the situation shifts.'},
 {t:'frame', k:'The context frame', h:'Formation. Strategy. Coach.', sub:'The same situation can demand a different fundamental depending on your formation, your strategy and your philosophy. We read situations in context, never as fixed rules.'},
 {t:'part', part:'Part Three', h:'Making the invisible visible'},
 {t:'method', k:'The method', lede:'We show a player the same situation again and again on video until the right read becomes pattern recognition, and they start to anticipate instead of react.'},
 {t:'worked', k:'One situation, every position', h:'The opponent switches play', rows:[['Far fullback','tuck in before the ball travels'],['Ball-side winger','press the first touch'],['The six','screen the switch, do not chase it'],['Back line','slide together, stay connected']]},
 {t:'monday', k:'Coach it Monday', lede:'Once a coach can name the fundamental, it becomes a training rep: isolate the situation, show the read, repeat it until it is automatic.'},
 {t:'why', k:'Why Tactalyse', h:'Built on the real game', stat:[['175+','clients across 14 countries'],['250+','players supported in top competitions'],['35','coaches worldwide in the method']], sub:'The methodology behind individual analysis for professional players including Stefan de Vrij, Jetro Willems and Cody Gakpo.'},
 {t:'recap', k:'The whole picture', h:'What you now have', rows:[['Three layers','individual, team and line fundamentals'],['The frame','formation, strategy, coach'],['The method','see it on video, train the read']]},
 {t:'cta', k:'Your next step', step:'Go deeper with the Tactalyse Master program, our nine month development path for coaches, or start free inside the Tactalyse coaches community.', disc:'This masterclass is educational and shares a coaching methodology. There is no guarantee of any particular result, and outcomes vary with the players, the level and the work put in.'}
];
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let inner=PITCH;
  if(s.k) inner+='<div class="kick">'+s.k+'</div>';
  if(s.part) inner+='<div class="part">'+s.part+'</div>';
  if(s.h) inner+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.t==='title'&&s.h) {}
  if(s.sub) inner+='<div class="sub">'+s.sub+'</div>';
  if(s.lede) inner+='<div class="lede">'+s.lede+'</div>';
  if(s.big) inner+='<div class="big">'+s.big+'</div>';
  if(s.who) inner+='<div class="who">'+s.who+'</div>';
  if(s.stat){let h='<div class="stat">';s.stat.forEach(x=>h+='<div><b>'+x[0]+'</b>'+x[1]+'</div>');h+='</div>';inner+=h;}
  if(s.rows){let h='<div class="rows">';s.rows.forEach(r=>h+='<div class="row"><span class="pos">'+r[0]+'</span><span>'+r[1]+'</span></div>');h+='</div>';inner+=h;}
  if(s.step) inner+='<div class="cta-step">'+s.step+'</div>';
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  inner+='<div class="n">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
