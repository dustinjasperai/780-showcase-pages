<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Ten Levers — a masterclass for school leaders</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f6efe3;        /* warm cream ground — his site cream family (brand.json #faf7f2), deepened */
    --panel:#eef2f5;     /* pale teal-navy tint of his #003c5f accent */
    --ink:#0e1b2a;       /* near-black navy — his body ink */
    --ink-soft:#394a5a;
    --ink-muted:#6d7a86;
    --rule:#e7e0d4;
    --accent:#003c5f;    /* deep teal-navy — his #1 brand colour (60 uses) */
    --pop:#c8186e;       /* magenta — his secondary mark */
  }
  html,body{height:100%;}
  body{
    font-family:'Newsreader',Georgia,serif;
    background:var(--accent);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;}
  .slide{
    display:none;width:100%;height:100%;padding:8vh 9vw;
    flex-direction:column;justify-content:center;
    background:var(--bg);
  }
  .slide.active{display:flex;}
  .eyebrow{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.05rem;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);margin-bottom:1.4rem;}
  .eyebrow .dot{color:var(--pop);}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:4.4rem;line-height:1.04;letter-spacing:-.02em;color:var(--ink);margin-bottom:1.6rem;}
  h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:3rem;line-height:1.1;letter-spacing:-.015em;color:var(--ink);margin-bottom:1.4rem;}
  .lead{font-size:1.9rem;line-height:1.5;color:var(--ink-soft);max-width:60ch;}
  .lead.big{font-size:2.3rem;color:var(--ink);}
  p.body{font-size:1.6rem;line-height:1.55;color:var(--ink-soft);max-width:62ch;margin-top:1rem;}
  .kicker{font-family:'Archivo',sans-serif;font-weight:600;font-size:1.3rem;color:var(--ink-muted);margin-top:2.4rem;}
  ul{list-style:none;margin-top:1rem;max-width:64ch;}
  ul li{position:relative;font-size:1.65rem;line-height:1.45;color:var(--ink-soft);padding-left:2.6rem;margin-bottom:1.15rem;}
  ul li::before{content:"";position:absolute;left:0;top:.62em;width:1.6rem;height:.42rem;border-radius:3px;background:var(--accent);}
  ul li.pop::before{background:var(--pop);}
  ul li strong{color:var(--ink);font-weight:600;}
  .levers{display:grid;grid-template-columns:1fr 1fr;gap:1.1rem 3rem;margin-top:1.2rem;max-width:82ch;}
  .lev{position:relative;padding-left:3.3rem;font-size:1.4rem;line-height:1.3;color:var(--ink-soft);}
  .lev .n{position:absolute;left:0;top:-.1em;font-family:'Archivo',sans-serif;font-weight:800;font-size:1.3rem;color:#fff;background:var(--accent);width:2.3rem;height:2.3rem;border-radius:7px;display:flex;align-items:center;justify-content:center;}
  .lev b{color:var(--ink);font-weight:600;}
  .quote{font-size:2.6rem;line-height:1.32;color:var(--ink);font-weight:500;max-width:30ch;}
  .quote .mk{color:var(--pop);}
  .attr{font-family:'Archivo',sans-serif;font-weight:600;font-size:1.2rem;letter-spacing:.04em;color:var(--ink-muted);margin-top:2rem;text-transform:uppercase;}
  .stat{font-family:'Archivo',sans-serif;font-weight:800;font-size:6rem;line-height:1;color:var(--accent);letter-spacing:-.02em;}
  .stat .pop{color:var(--pop);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:3.2rem;align-items:start;margin-top:1rem;}
  .two h3{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.5rem;color:var(--ink);margin-bottom:.6rem;}
  .two p{font-size:1.4rem;line-height:1.45;color:var(--ink-soft);}
  .cta h1{color:var(--accent);}
  .cta .step{font-family:'Archivo',sans-serif;font-weight:700;font-size:1.8rem;color:var(--ink);margin-top:.4rem;}
  .disc{font-family:'Archivo',sans-serif;font-size:1.02rem;line-height:1.5;color:var(--ink-muted);margin-top:3rem;max-width:70ch;}
  .brandline{font-family:'Archivo',sans-serif;font-weight:700;letter-spacing:.12em;text-transform:uppercase;font-size:1rem;color:var(--ink-muted);margin-top:2.6rem;}
  .brandline b{color:var(--accent);}
  #nav{position:fixed;bottom:2.2vh;right:2.6vw;font-family:'Archivo',sans-serif;font-size:1rem;color:var(--ink-muted);letter-spacing:.06em;z-index:5;}
  #bar{position:fixed;bottom:0;left:0;height:5px;background:var(--pop);width:0;transition:width .25s ease;z-index:5;}
  .hint{position:fixed;bottom:2.2vh;left:2.6vw;font-family:'Archivo',sans-serif;font-size:.95rem;color:var(--ink-muted);z-index:5;}
  @media(max-width:720px){h1{font-size:2.5rem;}h2{font-size:2rem;}.lead{font-size:1.4rem;}.levers{grid-template-columns:1fr;}.two{grid-template-columns:1fr;}.stat{font-size:4rem;}.quote{font-size:1.9rem;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="bar"></div>
<div id="nav"></div>
<div class="hint">Use arrow keys &rarr;</div>
<script>
const S = [
  {t:'title', html:`
    <div class="eyebrow">A masterclass for school leaders <span class="dot">&bull;</span> Education Leaders</div>
    <h1>The Ten Levers</h1>
    <p class="lead big">The small changes in how you run a meeting, have a conversation, or hand something over that decide whether your week feels manageable, or impossible.</p>
    <div class="kicker">Hosted live by Shane Leaning</div>`},
  {t:'forwhom', html:`
    <div class="eyebrow">Who this is for</div>
    <h2>You already lead people. The job keeps getting bigger.</h2>
    <ul>
      <li>You moved up because you were a brilliant teacher, and no one handed you a manual for leading adults.</li>
      <li>Your calendar is other people's problems. The important work keeps sliding to the weekend.</li>
      <li class="pop">You've done the courses. You have the certificates. You still leave most days wondering if any of it actually changed how you lead.</li>
    </ul>`},
  {t:'hook', html:`
    <div class="eyebrow">The uncomfortable part</div>
    <p class="quote">More training is not what makes you a better leader. <span class="mk">Smaller, sharper habits are.</span></p>
    <p class="body">Most leadership development adds to the pile: another framework, another folder, another qualification. This hour is about taking things away until what's left is ten changes small enough to actually use on Monday.</p>`},
  {t:'p1head', html:`
    <div class="eyebrow">Part one</div>
    <h1>The qualification trap</h1>
    <p class="lead">Why the leaders with the most letters after their name are often the most exhausted.</p>`},
  {t:'trap', html:`
    <div class="eyebrow">The trap</div>
    <h2>Qualifications deliver information. Leadership is a skill.</h2>
    <p class="body">A certificate proves you sat through the content. It does not prove you can run a hard meeting, give feedback that lands, or hand over a project without it bouncing back to you a week later. Information you can look up. Skill you have to build, in the room, with people.</p>`},
  {t:'research', html:`
    <div class="eyebrow">What leaders actually told me</div>
    <div class="two">
      <div><div class="stat"><span class="pop">82%</span></div><p>said the most valuable part of their development was the people in their cohort, not the content or the qualification itself.</p></div>
      <div><div class="stat">91%</div><p>were frustrated by the gap between theory and practice: "good background, but I couldn't put it to work in my school."</p></div>
    </div>
    <div class="kicker">From interviews with school leaders across 30+ countries.</div>`},
  {t:'reframe', html:`
    <div class="eyebrow">The reframe</div>
    <p class="quote">Stop collecting frameworks. <span class="mk">Start pulling levers.</span></p>
    <p class="body">A lever is a small, specific change you can make this week that moves something much bigger than its size suggests. You don't need ten new philosophies. You need ten places to push.</p>`},
  {t:'p2head', html:`
    <div class="eyebrow">Part two</div>
    <h1>The ten levers</h1>
    <p class="lead">Grounded in 100+ peer-reviewed studies, built for the Tuesday you're actually having.</p>`},
  {t:'leverswhat', html:`
    <div class="eyebrow">How to read them</div>
    <h2>Ten places to push. None of them take more time than you already spend.</h2>
    <p class="body">Each lever replaces something you already do badly or by accident with the same thing done on purpose. A meeting you were going to run anyway. A conversation you were going to have anyway. The cost is attention, not hours.</p>`},
  {t:'levers', html:`
    <div class="eyebrow">The set</div>
    <div class="levers">
      <div class="lev"><span class="n">1</span><b>Live your values.</b> Use them as decision shortcuts, not posters.</div>
      <div class="lev"><span class="n">2</span><b>Use your experience.</b> Lead from what you already know works.</div>
      <div class="lev"><span class="n">3</span><b>Communicate with clarity.</b> Paraphrase, check, make it concrete.</div>
      <div class="lev"><span class="n">4</span><b>Master your meetings.</b> Five meeting types, one design each.</div>
      <div class="lev"><span class="n">5</span><b>Give powerful feedback.</b> Develop people instead of wounding them.</div>
      <div class="lev"><span class="n">6</span><b>Nurture potential.</b> Name it out loud, build the trust first.</div>
      <div class="lev"><span class="n">7</span><b>Delegate with purpose.</b> Hand it over so it stays over.</div>
      <div class="lev"><span class="n">8</span><b>Develop your team.</b> Design growth, don't hope for it.</div>
      <div class="lev"><span class="n">9</span><b>Own your decisions.</b> Match the method to the size of the call.</div>
      <div class="lev"><span class="n">10</span><b>Make change stick.</b> Map the change, work with the resistance.</div>
    </div>`},
  {t:'meetings', html:`
    <div class="eyebrow">Lever four, up close</div>
    <h2>Master your meetings</h2>
    <p class="body">Five meeting types, one design pattern for each. The decision meeting is not run like the information meeting; the problem-solving meeting is not run like the check-in. When a leader stops running every gathering the same way, two or three hours a week come back, and people stop dreading the calendar invite.</p>`},
  {t:'feedback', html:`
    <div class="eyebrow">Lever five, up close</div>
    <h2>Feedback that develops, not wounds</h2>
    <p class="body">Situation, behaviour, impact, then forward. Most leaders either avoid the conversation until it's a crisis, or soften it until there's no message left. The lever is a routine clear enough that you can have the hard conversation early, kindly, and land the point.</p>`},
  {t:'change', html:`
    <div class="eyebrow">Lever ten, up close</div>
    <h2>Making change actually stick</h2>
    <p class="body">Change in a school fails for a predictable reason: leaders push the plan and treat resistance as the enemy. Map the change, read where the resistance really sits, and work with it. This is the heart of the book, and the lever most leaders wish they'd had two initiatives ago.</p>`},
  {t:'circles', html:`
    <div class="eyebrow">Why it holds</div>
    <h2>Levers are learned in a circle, not a lecture</h2>
    <p class="body">A lever you hear about on a slide is forgotten by Thursday. A lever you practise with three or four peers who lead schools like yours, and debrief with honestly, becomes how you work. The circle is the mechanism. The levers are what you practise in it.</p>`},
  {t:'p3head', html:`
    <div class="eyebrow">Part three</div>
    <h1>What the first months look like</h1>
    <p class="lead">Small changes, visible fast, measured honestly.</p>`},
  {t:'first30', html:`
    <div class="eyebrow">The first 30 days</div>
    <h2>You feel it before anyone else names it</h2>
    <ul>
      <li>One meeting a week redesigned, so it ends on time with a decision.</li>
      <li>One handover that doesn't come back to you.</li>
      <li class="pop">One hard conversation you'd been avoiding, had early and well.</li>
    </ul>`},
  {t:'measure', html:`
    <div class="eyebrow">How we know it worked</div>
    <h2>Three tiers, not a feelings survey</h2>
    <div class="two">
      <div><h3>Days 1&ndash;30</h3><p>Behaviour change: the levers you're actually pulling.</p></div>
      <div><h3>Days 30&ndash;60</h3><p>Validation: your team notices the difference before you tell them.</p></div>
    </div>
    <p class="body">And by months 3&ndash;9, strategic impact: the initiative that stuck, the role you stopped doing yourself, the week that finally feels like yours.</p>`},
  {t:'whyme', html:`
    <div class="eyebrow">Why listen to me on this</div>
    <h2>A decade in the work, not above it</h2>
    <p class="body">I've coached school leaders in more than 30 countries, from middle leaders to executive heads, and written the change-leadership book I wish I'd had. I'm not here to sell you another qualification. I built the ten levers because I watched good leaders drown while holding a shelf full of certificates. This is the thing that would have helped.</p>
    <div class="brandline">Shane Leaning <b>&bull;</b> Education Leaders</div>`},
  {t:'oneidea', html:`
    <div class="eyebrow">If you take one thing</div>
    <p class="quote">Don't try to become a different leader. <span class="mk">Pull one lever this week.</span></p>
    <p class="body">Pick the meeting that drains you most and redesign just that one. That's the whole method in miniature: small change, on purpose, where it moves the most.</p>`},
  {t:'cta', html:`
    <div class="eyebrow">Pull the first lever with a cohort</div>
    <div class="cta"><h1>Lead with the ten levers</h1></div>
    <p class="lead">The next Leadership Intensive cohort practises all ten, live, in a peer circle, over four months.</p>
    <div class="step">Apply for the January cohort, or book a call with me to see if it fits your year.</div>
    <p class="disc">This masterclass is educational and shares leadership practices and approaches only. No specific result is guaranteed. Results vary from leader to leader and depend on your own context, effort and school. Nothing here is a promise of a particular promotion, financial or career outcome.</p>
    <div class="brandline">Education Leaders <b>&bull;</b> for the people leading in schools, worldwide</div>`}
];

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(i===0?' active':'');
  if(s.t==='cta') d.classList.add('ctaSlide');
  d.innerHTML=s.html||'';
  stage.appendChild(d);
});
let cur=0;
const slides=[...document.querySelectorAll('.slide')];
const nav=document.getElementById('nav');
const bar=document.getElementById('bar');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  nav.textContent=(cur+1)+' / '+slides.length;
  bar.style.width=((cur+1)/slides.length*100)+'%';
}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' ') {show(cur+1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp') {show(cur-1);e.preventDefault();}
});
stage.addEventListener('click',()=>show(cur+1));
show(0);
</script>
</body>
</html>
