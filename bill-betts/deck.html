<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Booked Solid, Still Broke · Bill Betts · Pet Passion To Profit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f2ea; --panel:#0e5560; --rule:#d8cfc0;
    --ink:#223038; --accent:#0e7f8c; --accent2:#c98a3f; --dim:#7d7566; --grey:#4a4f5c;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Nunito Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Fredoka',sans-serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.7vw;max-width:90%}
  .t-normal h1{font-size:2.7vw;max-width:87%}
  .t-normal .body{font-family:'Nunito Sans',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:78%;line-height:1.58;font-weight:400}
  .sub{font-family:'Nunito Sans',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:80%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Nunito Sans',sans-serif;font-size:1.3vw;font-weight:700;color:var(--accent2);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.9vw;max-width:90%;color:#f4f1ea}
  .t-section .rule{width:16vw;height:3px;background:var(--accent2);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.9vw;max-width:82%;font-style:italic;color:#f4f1ea}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.2vw;max-width:82%;color:#f4f1ea}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent2);color:#f4f1ea;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .t-cta .disc{color:#a9c3c6}
  .motif{position:absolute;pointer-events:none}
  .title-motif{right:6%;bottom:8%;width:15vw;opacity:.9}
  .corner-motif{right:6.5%;bottom:8%;width:6.4vw;opacity:.45}
  .brandline{font-family:'Nunito Sans',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:600;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.2);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:#cfd6d1;z-index:20;font-weight:600;font-family:'Nunito Sans',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#cfd6d1;z-index:20;font-weight:700;font-family:'Nunito Sans',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:#cfd6d1;z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Nunito Sans',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Pet Passion To Profit</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- grooming-shear + comb line motif: a pair of grooming scissors over a comb, drawn in one weight -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="shear" viewBox="0 0 260 120">
  <g fill="none" stroke="#0e7f8c" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="30" cy="34" r="13"/>
    <circle cx="30" cy="86" r="13"/>
    <path d="M42 42 L210 96"/>
    <path d="M42 78 L210 24"/>
    <path d="M210 24 L236 16"/>
    <path d="M210 96 L236 104"/>
    <path d="M96 118 H220 M104 118 V104 M120 118 V104 M136 118 V104 M152 118 V104 M168 118 V104 M184 118 V104 M200 118 V104" stroke="#c98a3f" stroke-width="2.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:"Booked Solid, Still Broke: The Real Reason Your Grooming Business Is Wearing You Out",sub:'A live masterclass for dog grooming business owners on pricing, mindset, and the simple systems that let you earn more while working fewer days.',brand:true,arc:'title'},

 {t:'normal',k:'Who this is for',title:"You're brilliant with the dogs. It's the business side that keeps you up at night.",body:'Most groomers get good at the grooming fast. Pricing, boundaries, systems, and the confidence to run the whole thing get figured out by trial and error, usually the hard and lonely way. This hour is for the owner who is fully booked and still not taking home what the work is worth.'},
 {t:'dark',title:"Being fully booked is not the same as running a profitable business. It is just a busy version of the same problem."},

 {t:'section',idx:'Part One',title:"Why It Was Never Really About Your Grooming"},
 {t:'normal',k:'The skill was never the problem',title:'What holds most groomers back is not a lack of skill or effort. It is everything around the grooming.',body:'The mental load. Pricing that was set years ago and never moved. A day with no gaps and no plan. Not knowing which part of the business actually needs attention next. You can be the best groomer in town and still feel like the business owns you instead of the other way around.'},
 {t:'normal',k:'The price on the wall',title:'The fear of raising your prices is quietly costing you more than any nervous dog ever will.',body:'Underpricing does not just shrink one invoice. It fills your week with low-value work, trains clients to expect the old rate, and leaves nothing over for time off, staff, or a bad month. Most groomers undercharge for years, not because the market says so, but because raising prices feels personal.'},
 {t:'dark',title:"You do not need more clients. You need the right prices, clear boundaries, and a week that is planned on purpose."},

 {t:'section',idx:'Part Two',title:"The GROOMER Way to Turn It Around"},
 {t:'normal',k:'G is for Growth Mindset',title:'It starts in your head, not in your diary.',body:'Imposter syndrome, guilt about charging, and the belief that you have to say yes to everyone keep a good groomer small. Building the self-worth to charge properly and hold a boundary is the first thing that changes, and everything else gets easier once it does.'},
 {t:'normal',k:'M is for Money Management',title:'Price the business like it is meant to feed you, because it is.',body:'Every service needs its own pricing logic built on what it actually costs you in time, product, and skill, not a gut-feel number copied off the salon down the road. Get the prices right and the same book of clients suddenly pays for time off, help, and a quieter mind.'},
 {t:'normal',k:'O is for Organization and Systems',title:'Build a salon that does not fall apart on the day you are off.',body:'Booking, deposits, no-show policies, and a planned week are what turn a job you own into a business that runs. Simple systems take the decisions off your shoulders so the place works the same whether you are standing in it or not.'},
 {t:'normal',k:'O and E: service and the right clients',title:'Outstanding care keeps the right clients, and honest marketing brings more of them.',body:'Great care of the pet is what earns loyalty and referrals. Marketing that sounds like you, on the channels your ideal clients actually use, fills the book with the owners you want rather than the ones who haggle. You do not need to be everywhere, just clear about who you are for.'},
 {t:'dark',title:"Work smarter, not harder is not a slogan here. It is the whole point: more take-home pay, fewer days on your feet."},

 {t:'section',idx:'Part Three',title:"What It Looks Like When It Works"},
 {t:'normal',k:'What changes first',title:'Most owners start with the three things costing them the most: their prices, their week, and their boundaries.',body:'A short, honest audit maps where the money and the hours are leaking, then gives you an order to fix them in. Not a generic top-ten list every groomer gets handed, but the two or three moves that change your take-home the fastest.'},
 {t:'normal',k:'Why Bill Betts',title:'Sixteen years inside a real, busy grooming business, not a theory from the outside.',body:'Bill left the police in 2021 and went all in on the business side of the grooming salon he and his wife Emma built, A to Z Animal Care. He has spent years since helping other groomers price, plan, and grow through the Pet Passion To Profit podcast and the GROOMER Business Programme. He teaches from decisions he has actually had to make and live with.'},

 {t:'section',idx:'Your Next Step',title:"Earn More, Work Fewer Days"},
 {t:'normal',k:'How the coaching works',title:'From a single Business Audit Call up to full group and one-to-one mentoring.',body:'A Business Audit Call is a focused deep-dive into your numbers and your week with a clear plan to act on. The GROOMER Business Programme adds an online training library, regular live group coaching, expert input, and a private community. A premium six-month one-to-one option is there for owners who want it hands-on.'},
 {t:'cta',title:'Ready to earn more and finally work fewer days?',chips:['Book a Business Audit Call','Join the GROOMER Business Programme'],disc:'Educational content for dog grooming business owners. No income, pricing, or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function motifSvg(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}" viewBox="0 0 260 120"><use href="#shear"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Pet Passion <b>To Profit</b> &middot; Bill Betts</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=motifSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
