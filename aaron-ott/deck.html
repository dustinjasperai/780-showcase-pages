<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Expert-to-Leader Trap — a live masterclass with Aaron Ott</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@400;500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f1;
    --panel:#efeae1;
    --accent:#b38b65;
    --ink:#233043;
    --deep:#3c5a77;
    --muted:#6b6256;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid rgba(35,48,67,.10);border-radius:14px;
    padding:56px 56px;margin:0 0 22px;min-height:380px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:56px;bottom:40px;width:44px;height:3px;
    background:var(--accent);border-radius:2px}
  .k{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:18px}
  h1{font-family:'Spectral',serif;font-weight:600;font-size:46px;line-height:1.08;
    color:var(--ink);margin-bottom:18px}
  h2{font-family:'Spectral',serif;font-weight:600;font-size:34px;line-height:1.14;
    color:var(--ink);margin-bottom:16px}
  p.b{font-size:19px;line-height:1.55;color:var(--deep);max-width:62ch;margin-bottom:12px}
  ul{margin:10px 0 0 0;list-style:none}
  ul li{font-size:18px;line-height:1.5;color:var(--deep);padding-left:22px;position:relative;
    margin-bottom:10px;max-width:60ch}
  ul li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;
    background:var(--accent);border-radius:50%}
  .part{background:var(--panel)}
  .part h1{font-size:40px}
  .big{font-family:'Spectral',serif;font-size:40px;line-height:1.15;color:var(--ink);max-width:22ch}
  .cta{background:var(--ink);color:var(--bg)}
  .cta .k{color:var(--accent)}
  .cta h1,.cta .big{color:var(--bg)}
  .cta p.b{color:#cdd6df}
  .cta .btn{display:inline-block;margin-top:22px;background:var(--accent);color:var(--ink);
    font-weight:600;padding:14px 26px;border-radius:8px;font-size:18px;text-decoration:none}
  .disc{font-size:13px;color:#9fb0bd;margin-top:26px;max-width:60ch;line-height:1.5}
  .num{position:absolute;right:30px;top:26px;font-size:12px;color:var(--muted);letter-spacing:.08em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Aaron Ott',
    h:'The Expert-to-Leader Trap',
    b:'Why the skill that got you promoted is the one holding you back, and what to do about it. A live 60 minute session for accomplished leaders.'},

  {t:'audience', k:'Who this is for',
    h:'You were promoted for being the best. Now the job changed.',
    items:['You are the leader people rely on, and you deliver.',
      'Lately the effort buys less than it used to.',
      'In rooms where you are not the technical expert, part of you wonders if you belong.']},

  {t:'trap', k:'The trap',
    h:'Capable on the outside. Faking it on the inside.',
    b:'From the outside you look capable, reliable, impressive. On the inside it can feel like you are exhausted, uncertain, and quietly waiting to be found out. That gap is not a character flaw. It is the expert-to-leader transition, and almost nobody names it out loud.'},

  {t:'hook', k:'The reframe',
    big:'The skill that got you here is not the skill the job needs now.'},

  {t:'part', k:'Part One',
    h:'The Gap'},

  {t:'gap', k:'The perception and reality gap',
    h:'Two versions of you, pulling apart.',
    items:['How you are seen: capable, dependable, the one who figures it out.',
      'How you feel: stretched thin, improvising, hoping no one looks too closely.',
      'Leadership gets harder the wider that gap grows. The work is closing it, not hiding it.']},

  {t:'imposter', k:'A signal, not a flaw',
    h:'Feeling like a fraud is information.',
    b:'The fraud feeling almost always shows up at the exact moment you step beyond what made you an expert. It is not proof you are not ready. It is a signal that you are leading from output, and the job now asks you to lead from who you are.'},

  {t:'part', k:'Part Two',
    h:'The Two Hidden Drivers'},

  {t:'overfunction', k:'Driver one: over-functioning',
    h:'Doing more used to be the answer. Now it is the symptom.',
    b:'The instinct under pressure is to work harder, carry more, and outperform everyone again, because that always worked. At the leadership level it stops scaling. You become the bottleneck you are trying to clear, and the team learns to wait for you.'},

  {t:'returns', k:'The pattern',
    h:'Effort climbing. Returns flat.',
    items:['More hours, more ownership, more carrying the load.',
      'Results that no longer move the way the effort says they should.',
      'The quiet question: if I am working this hard, why does it feel like this?']},

  {t:'drivers', k:'Driver two: what is underneath',
    h:'The unconscious drivers beneath high performance.',
    b:'Under the over-functioning there is usually something older running the show, a need to prove, to protect, to never be caught not knowing. Left unexamined it drives the schedule, the reactions, and the ceiling. Named, it loosens its grip.'},

  {t:'honesty', k:'The move',
    big:'You do not get through this by working harder. You get through it by getting honest about what is actually driving you.'},

  {t:'part', k:'Part Three',
    h:'Leading From Who You Are'},

  {t:'identity', k:'The shift',
    h:'Lead from who you are, not from how hard you work.',
    b:'When the driving gets conscious, the leadership changes. Decisions get cleaner. You stop performing competence and start exercising judgment. People feel the difference before they can name it, and they trust it.'},

  {t:'ninety', k:'What changes first',
    h:'The first ninety days of leading from identity.',
    items:['You catch the over-functioning reflex before it fires, and you delegate what you used to absorb.',
      'The fraud feeling gets quieter because you stop pretending to be the expert in every room.',
      'Your calendar starts to reflect the leader you are becoming, not the expert you were.']},

  {t:'practices', k:'The three practices',
    h:'What we work on together.',
    items:['Name the gap: see clearly how you are perceived versus how you feel, and close it.',
      'Interrupt the drivers: catch over-functioning and the pattern underneath it in real time.',
      'Lead from identity: make decisions from who you are, with a clear and thrilling vision ahead.']},

  {t:'why', k:'Why me',
    h:'I lived this before I coached it.',
    b:'I spent about twenty years as an IT leader making the expert-to-leader transition myself, across consulting, the performing arts, and construction technology. I know what it is to be praised for competence while quietly wondering if you belong, and I know what it takes to close that gap. That is the whole of my practice.'},

  {t:'vision', k:'Beyond high performance',
    big:'High performance got you here. Leading from who you are is what takes you further.'},

  {t:'isthisyou', k:'Is this you',
    h:'If any of this landed, it is worth a conversation.',
    items:['You are accomplished, and the old playbook is quietly failing you.',
      'You want to lead from clarity, not from exhaustion.',
      'You are ready to get honest about what is driving you.']},

  {t:'cta', k:'Your next step',
    h:'Book a Vision Call.',
    b:'A free conversation to get clear on the vision you actually want to lead toward, and whether coaching is the right way to get there. No pressure, just clarity.',
    btn:'Book a Vision Call',
    disc:'Educational content only. No specific outcome or result is guaranteed. Results vary by individual, effort, and circumstance.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='part'?' part':'')+(s.t==='cta'?' cta':'');
  let html='<div class="num">'+String(i+1).padStart(2,'0')+' / '+S.length+'</div>';
  if(s.k) html+='<div class="k">'+s.k+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>':(s.t==='part'?'<h1>':'<h2>'))+s.h+(s.t==='title'||s.t==='part'?'</h1>':'</h2>');
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.b) html+='<p class="b">'+s.b+'</p>';
  if(s.items){html+='<ul>';s.items.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.btn) html+='<a class="btn">'+s.btn+'</a>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
