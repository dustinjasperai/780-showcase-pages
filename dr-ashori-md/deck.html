<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Labs: The TREND Method for Aging Well in Your 40s</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,600;0,700;1,600&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F8F4EE;
  --panel:#FDFBF7;
  --ink:#363737;
  --accent:#E4572E;
  --rule:#E7DCCF;
  --deep:#7A3B22;
  --dim:#7A7268;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:'Figtree',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
#deck{max-width:960px;margin:0 auto;padding:28px 20px 60px}
.slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:52px 56px;margin:20px 0;box-shadow:0 10px 30px rgba(90,64,40,.06);position:relative;overflow:hidden}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.kick{font-size:13px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
h1{font-family:'Bitter',Georgia,serif;font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
h2{font-family:'Bitter',Georgia,serif;font-weight:600;font-size:34px;line-height:1.12}
.lead{font-size:21px;color:var(--ink);margin-top:20px;max-width:46ch}
.body{font-size:19px;color:#4a463f;margin-top:16px;max-width:52ch}
.part{font-family:'Bitter',Georgia,serif;font-style:italic;font-size:22px;color:var(--deep);margin-bottom:10px}
.big{font-family:'Bitter',Georgia,serif;font-weight:700;font-size:52px;line-height:1.05}
ul{margin-top:18px;padding-left:0;list-style:none;max-width:54ch}
li{font-size:19px;color:#4a463f;padding-left:34px;position:relative;margin-bottom:14px}
li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border:2.5px solid var(--accent);border-radius:4px}
.pillar-letter{font-family:'Bitter',Georgia,serif;font-weight:700;font-size:72px;color:var(--accent);line-height:1}
.pillar-row{display:flex;gap:28px;align-items:flex-start}
.ghost{font-family:'Bitter',Georgia,serif;font-weight:700;font-size:40px;color:transparent;-webkit-text-stroke:1.5px rgba(54,55,55,.4);display:inline-block}
.solid{font-family:'Bitter',Georgia,serif;font-weight:700;font-size:48px;color:var(--ink)}
.solid em{color:var(--accent);font-style:italic}
.disc{font-size:14px;color:var(--dim);margin-top:26px;max-width:58ch;line-height:1.5}
.cta-line{display:inline-block;margin-top:22px;background:var(--accent);color:#fff;font-weight:600;font-size:19px;padding:15px 30px;border-radius:100px}
.foot{font-size:13px;color:var(--dim);letter-spacing:.04em;margin-top:30px;border-top:1px solid var(--rule);padding-top:16px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Dr. Mohammad Ashori, MD',
   h:'Beyond the Labs: The TREND Method for Aging Well in Your 40s',
   lead:'How a board-certified physician keeps busy professionals sharp, strong and energetic through midlife, without a supplement stack or a 12-minute appointment.'},

  {t:'who', kick:'Who this is for',
   h:'You are not sick. You just do not feel like yourself.',
   body:'This is for professionals in their 30s and 40s who are noticing the first changes: the 2pm crash, the foggy afternoons, sleep that no longer repairs, weight that will not move. Your labs come back "normal" and you are told to come back next year.'},

  {t:'trap', kick:'The trap',
   h:'Waiting feels safe. It is the most expensive choice you can make.',
   body:'The system is built to react. It waits for a diagnosis, then treats it. By the time a number is officially "abnormal," the trend that caused it has been building for years, quietly, while everything looked fine on paper.'},

  {t:'reframe', kick:'The reframe',
   h:'"Normal" is not the same as well.',
   body:'A lab result inside the reference range only means you are not yet sick enough to be flagged. It says nothing about whether you are aging the way you want to. The question is not "is this normal." The question is "where is this heading, and can we change it now."'},

  {t:'part', part:'Part One', h:'Why midlife decline sneaks up on smart people'},

  {t:'point', kick:'The visit problem',
   h:'Twelve minutes cannot build a plan.',
   body:'A standard appointment is long enough to rule out disease and write a referral. It is not long enough to connect your sleep, your labs, your stress and your training into one picture and give you something to actually do. So nobody does.'},

  {t:'point', kick:'The trend, not the snapshot',
   h:'One reading is a dot. Five readings are a direction.',
   body:'Aging well is not about a single perfect number. It is about reading the direction of your own markers early enough to steer, and knowing which three things to change first so the next reading moves.'},

  {t:'part', part:'Part Two', h:'The TREND method: five pillars a physician actually follows'},

  {t:'pillar', letter:'T', h:'Testing', body:'We read your labs as a story, not a verdict. Baseline the markers that predict how you age, track their direction, and turn them into two or three concrete moves, not a filing cabinet of PDFs.'},

  {t:'pillar', letter:'R', h:'Relationships', body:'Connection is not a soft extra. Isolation shortens lives as reliably as smoking does. We treat your relationships as a clinical pillar and protect them on purpose.'},

  {t:'pillar', letter:'E', h:'Exercise', body:'Strength and joint mobility are the difference between being 45 and feeling 45 versus feeling 65. We build a movement plan your joints can keep for decades, not a program you quit in three weeks.'},

  {t:'pillar', letter:'N', h:'Nutrition', body:'Not a cleanse, not a shelf of supplements. One or two changes that fit the week you actually have, chosen from what your own labs and goals are asking for.'},

  {t:'pillar', letter:'D', h:'Downtime', body:'Sleep debt and unmanaged stress drive most of what you feel as "getting older" in your 40s. Fix recovery first and half the other numbers start moving on their own.'},

  {t:'contrast', kick:'What makes this different',
   solidHtml:'<span class="ghost">Reactive</span> &nbsp;vs&nbsp; <span class="solid"><em>Proactive</em></span>',
   body:'Most of what you see advertised is a protocol or a supplement to buy. TREND is the opposite: a plan built on your own data, by a doctor whose only product is the plan.'},

  {t:'part', part:'Part Three', h:'Your first 90 days'},

  {t:'plan', kick:'What the plan looks like',
   h:'A map you can keep, not a prescription.',
   items:['Baseline labs, read against where you want to be','One nutrition change that fits your real week','A movement plan your joints can keep','A sleep and stress reset to rebuild recovery','A 90-day re-check to prove it worked']},

  {t:'why', kick:'Why a physician-coach',
   h:'A doctor with nothing to sell you but the plan.',
   body:'Board-certified in family medicine, trained at UCLA. No industry sponsorship, no supplement line, no kickbacks. The recommendations here are the ones I follow for myself and my own family. That is the whole point of coaching instead of prescribing.'},

  {t:'recap', kick:'The method, in one line',
   h:'Test it, connect it, move it, feed it, rest it.',
   body:'Testing, Relationships, Exercise, Nutrition, Downtime. Five pillars, read from your own data, changed two or three at a time, proven in 90 days.'},

  {t:'cta', kick:'Your next step',
   h:'Ready to see where your own trend is heading?',
   body:'Start with a one-hour assessment. We read your labs and your story together and you leave with a 90-day plan built around the TREND method. If it is not useful, it is on me.',
   cta:'Book your Healthy Aging Assessment',
   disc:'Educational only, not medical advice, and not a substitute for care from your own physician. No specific health or outcome result is guaranteed; results vary from person to person.'}
];

const deck = document.getElementById('deck');
function esc(s){return (s||'').replace(/&(?![a-z#])/g,'&amp;')}
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kick) html += '<div class="kick">'+s.kick+'</div>';
  if (s.part) html += '<div class="part">'+s.part+'</div>';
  if (s.t === 'pillar'){
    html += '<div class="pillar-row"><div class="pillar-letter">'+s.letter+'</div><div><h2>'+s.h+'</h2><div class="body">'+s.body+'</div></div></div>';
  } else if (s.t === 'contrast'){
    html += '<div style="margin:10px 0 6px">'+s.solidHtml+'</div>';
    if (s.body) html += '<div class="body">'+s.body+'</div>';
  } else if (s.t === 'part'){
    html += '<h1>'+s.h+'</h1>';
  } else {
    if (s.h) html += (s.t==='title') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>';
    if (s.lead) html += '<div class="lead">'+s.lead+'</div>';
    if (s.body) html += '<div class="body">'+s.body+'</div>';
    if (s.items){ html += '<ul>'; for (const it of s.items) html += '<li>'+it+'</li>'; html += '</ul>'; }
    if (s.cta) html += '<div class="cta-line">'+s.cta+'</div>';
    if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  }
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
