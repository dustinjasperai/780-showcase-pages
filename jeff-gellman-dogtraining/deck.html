<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Year After The Weekend · Jeff Gellman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Karla:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#F6F5F4; --panel:#EBE8E5; --rule:#DCD6CE;
    --ink:#272624; --accent:#9B6E2B; --grey:#5C574F; --dim:#8B8478;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Karla',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4vw;max-width:88%}
  .t-normal h1{font-size:2.95vw;max-width:84%}
  .t-normal .body{font-family:'Karla',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-family:'Karla',sans-serif;font-size:1.65vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Karla',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.2vw;max-width:82%;font-style:italic;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.86vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .contour-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-contour{right:6%;bottom:8%;width:17vw}
  .corner-contour{right:6%;bottom:7%;width:7vw;opacity:.5}
  .brandline{font-family:'Karla',sans-serif;font-size:1.22vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Karla',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Karla',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Karla',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">Solid K9 Training</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- contour motif: calm, level horizon/contour lines - steady ground, not a spiky growth-arrow -
     echoing the "calm leadership, structure, accountability" register of the training philosophy -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="contour" viewBox="0 0 280 100">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <path d="M6,78 C50,68 90,68 140,78 C190,88 230,88 274,78" stroke="#DCD6CE" opacity="0.85"/>
    <path d="M6,52 C50,42 90,42 140,52 C190,62 230,62 274,52" stroke="#DCD6CE" opacity="0.7"/>
    <path d="M6,26 C50,16 90,16 140,26 C190,36 230,36 274,26" stroke="#9B6E2B" opacity="0.95"/>
    <circle cx="274" cy="26" r="5" fill="#9B6E2B" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Year After The Weekend',sub:'A masterclass for dog-training business owners on the difference between a 5-day seminar and a 5-day seminar with a year of mentorship behind it.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You run a good training business. It still depends entirely on you.',body:'Most business advice aimed at dog trainers is a weekend, a workbook, and a Facebook group that goes quiet by December. It works for the three days you are paying attention to it, then your calendar fills back up with clients and the plan sits in a folder.'},
 {t:'dark',title:'A weekend can change how you think. It rarely changes what you do on a random Tuesday in March.'},

 {t:'section',idx:'Part One',title:'Why a Single Weekend Isn’t Enough'},
 {t:'normal',k:'Motivation fades faster than the plan gets built',title:'Most trainers leave a business seminar fired up, then lose the thread inside a month.',body:'A brand-clarity worksheet or a social media tactic is only useful once you actually apply it to your own pricing, your own offers, your own posting schedule, week after week. A single weekend rarely survives first contact with a fully booked training calendar.'},
 {t:'normal',k:'Nobody is teaching the follow-through',title:'The dog-training-business-coaching space has real players. None of them are advertising a year-long model right now.',body:'Craig Ogilvie is running 5 active ads for dog-trainer mentoring. His offer, like most in the space, is built around ongoing group coaching, not a single in-person intensive with a full year of 1:1 mentorship attached to it.'},
 {t:'dark',title:'You don’t need another weekend. You need someone still answering the phone in month nine.'},

 {t:'section',idx:'Part Two',title:'What The Mastermind Actually Teaches'},
 {t:'normal',k:'Proven tools to grow a service-based business',title:'The dog industry is shifting. Real strategies, not more technique, are what carry a business through it.',body:'Five days of in-the-trenches work on the actual mechanics of running a service business in a changing market, not another certification stacked on the ones you already have.'},
 {t:'normal',k:'Social media that converts, taught by Joelle',title:'Building "know, like, and trust" with the right audience, so you stop convincing the wrong clients.',body:'Joelle teaches the exclusive keynotes on social media, brand building, email marketing, and copywriting - the same skillset she used to help grow Solid K9 Training and Solid K9 Academy into multiple 6 and 7 figure businesses.'},
 {t:'normal',k:'Clarity on your brand and your offer',title:'Working sessions on the actual structure of your business and what you’re charging for it.',body:'Not a generic worksheet. Time spent on your specific programs, your specific pricing, and where the offer itself needs to change before the marketing does.'},
 {t:'dark',title:'Then the Inner Circle keeps going for a full year after everyone else has gone home.'},

 {t:'section',idx:'Part Three',title:'The Inner Circle Difference'},
 {t:'normal',k:'What changes after October',title:'The standard 5 days is $3,000. The Inner Circle is $6,000 - the same 5 days, plus a full year of virtual mentorship with Jeff and Joelle.',body:'Client communication that builds loyalty and referrals is one of the core pillars taught live - and it is also exactly what a year of continued mentorship is built to reinforce, month after month, instead of hoping it sticks after one weekend.'},
 {t:'normal',k:'Why Jeff and Joelle',title:'20+ years, 10,000+ dogs, and a business that’s still growing while they teach how they built it.',body:'Jeff Gellman is the trainer other trainers refer their hardest behavioral cases to. Joelle’s marketing and brand-building work helped take Solid K9 Training and Solid K9 Academy to multiple 6 and 7 figure businesses. Neither of them stopped running the business to go teach a course about it.'},

 {t:'section',idx:'Your Next Step',title:'Reserve Your Spot'},
 {t:'normal',k:'How it works',title:'Five days in Bradenton/Sarasota, Florida, twice a year. Bring a dog if you’ve got a hard one.',body:'The standard track is the 5-day event. The Inner Circle adds a full year of continued 1:1 virtual mentorship with Jeff and Joelle on top of it. Spots are limited every session; financing is available through Affirm.'},
 {t:'cta',title:'Ready for more than a weekend?',chips:['Reserve a Mastermind Spot','Join the Inner Circle'],disc:'Educational content for dog-training business owners. No income, growth, or business result is guaranteed. Results vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function contourSvg(kind){return `<svg class="contour-motif ${kind==='title'?'title-contour':'corner-contour'}"><use href="#contour"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Solid K9 <b>Training</b> &middot; Jeff Gellman</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=contourSvg(s.arc);
  else if(s.t==='title') h+=contourSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
