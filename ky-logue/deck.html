<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Close | Wholesaling Syndicate Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ffffff; --panel:#f4f6f2; --rule:#d7ddd2;
    --ink:#13231a; --ink-soft:#3c4a40; --ink-muted:#6c7a6f;
    --accent:#2cb30b;
  }
  html,body{height:100%}
  body{font-family:'Public Sans',-apple-system,sans-serif;background:#0d140f;color:var(--ink);-webkit-font-smoothing:antialiased}
  #stage{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7vh 9vw;background:var(--bg)}
  .slide.on{display:flex}
  .eyebrow{font-family:'Barlow Condensed',sans-serif;font-weight:600;text-transform:uppercase;letter-spacing:.16em;font-size:clamp(13px,1.5vw,17px);color:var(--accent);margin-bottom:18px}
  .divtag{font-family:'Barlow Condensed',sans-serif;font-weight:600;font-size:clamp(15px,1.7vw,20px);color:var(--ink-muted);letter-spacing:.08em;text-transform:uppercase;margin-bottom:12px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(34px,6.4vw,78px);line-height:1.02;letter-spacing:-.01em;color:var(--ink);text-transform:uppercase}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(28px,4.6vw,54px);line-height:1.05;color:var(--ink);text-transform:uppercase;margin-bottom:22px}
  p{font-size:clamp(17px,2vw,25px);line-height:1.5;color:var(--ink-soft);max-width:60ch;margin-bottom:16px}
  .lead{font-size:clamp(20px,2.4vw,30px);color:var(--ink);font-weight:500}
  .big{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(40px,7.4vw,92px);line-height:1;color:var(--accent);text-transform:uppercase}
  ul{list-style:none;margin-top:10px}
  li{font-size:clamp(17px,2vw,25px);line-height:1.45;color:var(--ink-soft);padding-left:34px;position:relative;margin-bottom:16px;max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:.62em;width:16px;height:3px;background:var(--accent)}
  li b{color:var(--ink);font-weight:700}
  .panel{background:var(--panel);border-left:5px solid var(--accent);padding:26px 32px;max-width:64ch;margin-top:8px}
  .panel p{margin-bottom:0}
  .num{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--accent);font-size:clamp(20px,2.4vw,30px);margin-right:10px}
  .disc{font-size:clamp(12px,1.3vw,15px);color:var(--ink-muted);max-width:68ch;margin-top:26px;line-height:1.5}
  .cta-line{font-family:'Barlow Condensed',sans-serif;font-weight:700;color:var(--accent);font-size:clamp(22px,3vw,38px);text-transform:uppercase;margin-top:18px}
  .nav{position:fixed;bottom:18px;right:22px;z-index:20;font-family:'Barlow Condensed',sans-serif;font-size:15px;color:var(--ink-muted);letter-spacing:.1em}
  .brandline{position:fixed;bottom:18px;left:24px;z-index:20;font-family:'Barlow Condensed',sans-serif;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
  .brandline b{color:var(--accent)}
  .dots{position:fixed;top:18px;left:24px;z-index:20;display:flex;gap:6px}
  .dot{width:7px;height:7px;border-radius:50%;background:var(--rule)}
  .dot.on{background:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="dots" id="dots"></div>
<div class="brandline"><b>Wholesaling Syndicate</b> &middot; Live Masterclass</div>
<div class="nav" id="nav"></div>
<script>
const S=[
 {t:'title',eyebrow:'Wholesaling Syndicate &middot; Live Masterclass',h1:'The Close',lead:'How wholesalers turn seller calls into signed contracts, and double their close rate in 90 days.'},
 {t:'content',eyebrow:'Who this is for',h2:'You are not short on leads',paras:['You pull lists, you send the mail, you drive for dollars. The phone rings. And then good leads slip away because the conversation falls apart somewhere between hello and the contract.'],lead:'This hour is about that conversation.'},
 {t:'content',eyebrow:'What it costs',h2:'Every lost call is a lost fee',paras:['A single assignment can be five figures. When a good lead goes cold because the call went sideways, that is not a small miss. That is a paycheck walking out the door to the next investor who knew what to say.'],lead:'You already paid for the lead. The only question is whether you convert it.'},
 {t:'statement',eyebrow:'The reframe',lead:'Here is the thing almost nobody in wholesaling will tell you:',big:"You don't have a lead problem.<br>You have a closing problem."},
 {t:'bullets',divtag:'Part one &middot; the real problem',h2:'Acquisitions is sales, not order-taking',paras:['Most training treats acquisitions as a numbers game: more lists, more mail, more dials. So the money goes to the top of the funnel while the real skill, the seller conversation, is left to chance.'],bullets:['A motivated seller is a person making a hard decision, <b>not a lead to be processed.</b>','The wholesalers who win are not the ones with the most leads. They are the ones who <b>convert the leads they already have.</b>']},
 {t:'divider',divtag:'Part two &middot; the four-stage call',h2:'One conversation, four moves',paras:['Here is the structure of a call that gets a property under contract. Four stages, in order, every time. You will never again wonder what to say next.']},
 {t:'stage',divtag:'The framework &middot; stage 1 of 4',n:'1',h2:'Strategic opener',panel:'You decide what you will say before you ever dial. The opener sets the frame in the first ten seconds: you are a calm professional with a reason to call, not a telemarketer reading a pitch. Most deals are lost here, before a single question is asked.'},
 {t:'stage',divtag:'The framework &middot; stage 2 of 4',n:'2',h2:'Rapport-building questions',panel:'You ask about the house and the situation, and then you listen. The goal is to understand what the seller actually needs, so you show up as the solution to their problem, not just another investor chasing a number.'},
 {t:'stage',divtag:'The framework &middot; stage 3 of 4',n:'3',h2:'Objection handlers',panel:'"I want to think about it." "Your offer is too low." You stop treating these as walls and start treating them as the real conversation. Every common objection has a prepared, honest response that keeps the deal moving instead of ending the call.'},
 {t:'stage',divtag:'The framework &middot; stage 4 of 4',n:'4',h2:'The close',panel:'The close is not pressure. It is making the next step obvious and easy once the seller already sees the value. When the first three stages are done right, asking for the contract feels natural to both sides.'},
 {t:'bullets',eyebrow:'Not every lead is the same',h2:'A script for every door',bullets:['<b>Inbound leads</b> who raised their hand and need qualifying fast.','<b>Outbound and cold calls</b> where the first ten seconds decide everything.','<b>Foreclosure and distressed situations</b> that need care, not pressure.','<b>Follow-up calls</b> on the leads everyone else gave up on.'],paras:['Same four stages. The words change to fit who is on the other end.']},
 {t:'bullets',eyebrow:'The part everyone skips',h2:'The fortune is in the follow-up',paras:['Most sellers do not sign on the first call. The wholesaler who has a simple, consistent follow-up rhythm is the one still in the conversation when the seller is finally ready.'],bullets:['A dead lead is usually just <b>an early one.</b>','Follow-up is a system, <b>not a mood.</b>']},
 {t:'content',eyebrow:'The part that is on you',h2:'From chaos to close',paras:['Sales is emotional. A no stings, a tough seller rattles you, and the next call pays for it. The wholesalers who last learn to reset between calls and treat every conversation like the first one of the day.'],lead:'Resilience is a skill. It can be trained like any other.'},
 {t:'bullets',divtag:'How the whole deal fits together',h2:'Two halves of every deal',bullets:['<b>The first half, acquisitions:</b> finding the seller, having the conversation, getting the property under contract.','<b>The second half, disposition:</b> a cash-buyer network ready to move, so a signed contract becomes an assignment fast.'],paras:['Both halves are sales. The same skills that lock the contract build the buyer list.']},
 {t:'content',eyebrow:'So it runs without you',h2:'Script, then systematize',paras:['Once the conversation is repeatable, it can be documented, trained into a team, and supported with simple automation so leads are followed up every time, not just when you remember.'],lead:'A great call is a skill. A great call that happens every single time is a system.'},
 {t:'statement',divtag:'Part three &middot; same leads, more deals',lead:'When the opener, the questions, the objection handlers and the close are no longer improvised, the same pipeline produces more contracts. That is the whole promise:',big:'2X your close rate<br>in 90 days.'},
 {t:'content',eyebrow:'Why listen to me',h2:'Built from real calls',paras:['I started wholesaling in 2019 and built the Wholesaling Syndicate into a community of thousands of wholesalers, with 200-plus podcast episodes breaking down what actually closes deals. This method is not theory. It is the exact conversation my members run every day.']},
 {t:'cta',eyebrow:'Your next step',h2:'Come practice the script with us',paras:['The full script, the objection handlers and the live weekly sales training are inside the Wholesaling Syndicate. Join the community, bring a real lead, and run the conversation with us.'],cta_line:'Join the Wholesaling Syndicate',disc:'Educational content only. No result is guaranteed. Results vary based on effort, experience, and market conditions, and real estate wholesaling involves risk. Follow all applicable laws and licensing rules in your state.'}
];

let cur=0;
const stage=document.getElementById('stage');
function paras(arr){return (arr||[]).map(p=>`<p>${p}</p>`).join('')}
function bullets(arr){return arr&&arr.length?`<ul>${arr.map(b=>`<li>${b}</li>`).join('')}</ul>`:''}
function slideHTML(s){
 const eb=s.eyebrow?`<div class="eyebrow">${s.eyebrow}</div>`:'';
 const dv=s.divtag?`<div class="divtag">${s.divtag}</div>`:'';
 const hd=s.h2?`<h2>${s.h2}</h2>`:'';
 switch(s.t){
  case 'title':return `<div class="eyebrow">${s.eyebrow}</div><h1>${s.h1}</h1><p class="lead" style="margin-top:22px">${s.lead}</p>`;
  case 'statement':return `${eb}${dv}<p class="lead" style="margin-bottom:26px">${s.lead}</p><div class="big">${s.big}</div>`;
  case 'divider':return `${dv}${hd}${paras(s.paras)}`;
  case 'stage':return `<div class="divtag">${s.divtag}</div><h2><span class="num">${s.n}</span>${s.h2}</h2><div class="panel"><p>${s.panel}</p></div>`;
  case 'bullets':return `${eb}${dv}${hd}${paras(s.paras)}${bullets(s.bullets)}`;
  case 'content':return `${eb}${dv}${hd}${paras(s.paras)}${s.lead?`<p class="lead">${s.lead}</p>`:''}`;
  case 'cta':return `${eb}${hd}${paras(s.paras)}<div class="cta-line">${s.cta_line}</div><p class="disc">${s.disc}</p>`;
 }
 return '';
}
function render(){
 stage.innerHTML='';
 S.forEach((s,i)=>{const d=document.createElement('div');d.className='slide'+(i===cur?' on':'');d.innerHTML=slideHTML(s);stage.appendChild(d)});
 const dots=document.getElementById('dots');dots.innerHTML='';
 S.forEach((s,i)=>{const e=document.createElement('div');e.className='dot'+(i===cur?' on':'');dots.appendChild(e)});
 document.getElementById('nav').textContent=(cur+1)+' / '+S.length;
}
function go(n){cur=Math.max(0,Math.min(S.length-1,n));render()}
document.addEventListener('keydown',e=>{
 if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){go(cur+1);e.preventDefault()}
 if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault()}
 if(e.key==='Home')go(0); if(e.key==='End')go(S.length-1);
});
stage.addEventListener('click',()=>go(cur+1));
render();
</script>
</body>
</html>
