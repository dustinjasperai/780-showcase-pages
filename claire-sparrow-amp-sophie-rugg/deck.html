<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Confidently Teaching Pelvic Health | A masterclass with Claire Sparrow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f1e8;
    --panel:#ece4d4;
    --ink:#2b2926;
    --ink-soft:#5a544d;
    --sage:#4f5e52;
    --accent:#c16a4e;
    --rule:#ddd3c2;
  }
  html,body{height:100%}
  body{
    font-family:'Roboto',-apple-system,sans-serif;
    background:var(--sage);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:5vh 6vw}
  .slide{
    display:none;width:100%;max-width:1040px;background:var(--bg);
    border-radius:14px;padding:64px 72px;min-height:64vh;
    box-shadow:0 30px 80px rgba(30,24,18,.34);
    flex-direction:column;justify-content:center;position:relative;
  }
  .slide.on{display:flex}
  .slide::after{content:'';position:absolute;left:72px;right:72px;bottom:30px;height:1px;background:var(--rule)}
  .kicker{font-family:'Roboto',sans-serif;font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:'Prata',Georgia,serif;font-weight:400;font-size:58px;line-height:1.1;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:'Prata',Georgia,serif;font-weight:400;font-size:40px;line-height:1.16;color:var(--ink);margin-bottom:30px;letter-spacing:-.01em}
  .lead{font-size:23px;line-height:1.55;color:var(--ink-soft);margin-top:26px;max-width:80%;font-weight:300}
  .presenter{margin-top:auto;padding-top:34px;font-size:16px;color:var(--ink-soft);font-weight:500}
  .presenter b{color:var(--ink);font-weight:700}
  ul{list-style:none;margin-top:6px}
  li{position:relative;padding-left:40px;font-size:23px;line-height:1.5;color:var(--ink-soft);margin-bottom:22px;font-weight:400;max-width:88%}
  li::before{content:'';position:absolute;left:0;top:14px;width:20px;height:2px;background:var(--accent);border-radius:2px}
  .note{margin-top:24px;font-size:17px;color:var(--sage);font-weight:500;font-style:italic}
  .big{font-family:'Prata',Georgia,serif;font-weight:400;font-size:46px;line-height:1.28;color:var(--ink);letter-spacing:-.01em}
  .big .a{color:var(--accent)}
  .part{font-family:'Roboto',sans-serif;font-size:15px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .part-h{font-family:'Prata',Georgia,serif;font-weight:400;font-size:52px;line-height:1.1;color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:22px 40px;margin-top:8px}
  .cell{border-top:2px solid var(--rule);padding-top:16px}
  .cell .n{font-family:'Prata',Georgia,serif;font-size:22px;color:var(--accent);display:block;margin-bottom:8px}
  .cell .t{font-size:19px;line-height:1.42;color:var(--ink-soft)}
  .cell .t b{color:var(--ink);font-weight:700}
  .disc{margin-top:26px;font-size:14px;line-height:1.55;color:var(--ink-soft);max-width:82%;font-weight:400}
  .cta-line{margin-top:22px;display:inline-block;font-family:'Roboto',sans-serif;font-size:19px;font-weight:700;color:#fff;background:var(--accent);padding:15px 30px;border-radius:100px}
  .counter{position:fixed;bottom:22px;right:28px;font-size:13px;letter-spacing:.14em;color:#e9e3d6;opacity:.7;font-weight:500;z-index:5}
  .hint{position:fixed;bottom:22px;left:28px;font-size:12px;letter-spacing:.1em;color:#e9e3d6;opacity:.5;z-index:5}
  @media(max-width:720px){
    .slide{padding:40px 34px;min-height:70vh}
    .slide::after{left:34px;right:34px}
    h1{font-size:38px}h2{font-size:30px}.big{font-size:30px}.part-h{font-size:36px}
    li,.lead{font-size:19px}.grid{grid-template-columns:1fr;gap:16px}
  }
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<div class="counter" id="counter"></div>
<div class="hint">Arrow keys or click to advance</div>
<script>
const S=[
  {t:'title',
    kicker:'A live masterclass for Pilates teachers',
    h1:'Confidently Teaching Pelvic Health',
    lead:'How to help clients with prolapse and incontinence through whole-body movement. Beyond kegels, and always within your scope.',
    presenter:'Claire Sparrow · Whole Body Pelvic Health' },

  {t:'content',
    h2:'If you teach women, this is already in your room',
    points:[
      'A client mentions leaking on the jump board, or heaviness after her second baby.',
      'Another quietly stops doing anything that feels like too much.',
      'You want to help, and you are not quite sure where your scope ends.',
      'You were taught to cue a kegel, and you have watched it not land.'
    ] },

  {t:'statement',
    big:'"Just do more kegels" is the most common advice in the room. For a lot of these clients, it is the reason they are <span class="a">not getting better</span>.' },

  {t:'section', part:'Part one', h:'Why the usual advice fails' },

  {t:'content',
    h2:'The pelvic floor is not a muscle you squeeze in isolation',
    points:[
      'It works with the breath, the ribcage, the feet and the fascia that links them.',
      'Many struggling clients are already too tight, not too weak. Squeezing harder makes it worse.',
      'Load without coordination is what leaks, bulges and braces.'
    ] },

  {t:'content',
    h2:'The three you meet most',
    points:[
      'Prolapse: heaviness, dragging, a feeling of something coming down.',
      'Incontinence: leaking on impact, on a laugh, or on a lift.',
      'Diastasis and post-surgical: a middle that will not reconnect.'
    ],
    note:'One cue for all three is where teachers get into trouble.' },

  {t:'section', part:'Part two', h:'The Whole Body Pelvic Health Method' },

  {t:'content',
    h2:'Restore function through movement, not force',
    points:[
      'Built from biotensegrity, fascia and functional movement.',
      'Developed in 2018, now taught to teachers and women worldwide.',
      'The same method behind the best-selling book, HOPE For Your Pelvic Floor.'
    ] },

  {t:'grid',
    h2:'Five shifts the method asks of you',
    cells:[
      ['One','<b>Breath before brace.</b> Restore the pressure system before you ever load it.'],
      ['Two','<b>Whole body, not the floor alone.</b> Work the fascia, feet and ribcage the floor answers to.'],
      ['Three','<b>Observe without invasion.</b> Read posture, breath and movement. No internal assessment.'],
      ['Four','<b>A graded on-ramp.</b> Pre-Pilates before repertoire, so nobody is loaded before they are ready.'],
      ['Five','<b>Adapt to the person.</b> The exercise serves the client, never the other way round.']
    ] },

  {t:'content',
    h2:'The science your cueing has been missing',
    points:[
      'Biotensegrity: the floor is one part of a tensioned, whole-body network.',
      'Fascia and gait carry load the floor cannot manage on its own.',
      'It is why the same client improves when you change what happens above and below the pelvis.'
    ],
    note:'Drawn from the work of physiotherapist Anna Crowle and movement educator James Earls.' },

  {t:'content',
    h2:'Observing without invasion',
    points:[
      'Spot a downward-managing strategy from the way she stands and breathes.',
      'Screen movement and orientation, not anatomy you are not licensed to assess.',
      'Know the exact signs that mean refer, and refer well.'
    ] },

  {t:'content',
    h2:'Adaptations you can use on Monday',
    points:[
      'Go-to modifications across mat, reformer, chair and tower.',
      'What to swap out for prolapse, and for leaking on impact.',
      'How to progress a client without ever gambling with pressure.'
    ] },

  {t:'section', part:'Part three', h:'What this gives you and your clients' },

  {t:'content',
    h2:'For the client',
    points:[
      'From bracing and avoiding, to moving with confidence again.',
      'Fewer "I just live with it" conversations.',
      'A teacher who finally understood, when everyone else said do more kegels.'
    ] },

  {t:'content',
    h2:'For you',
    points:[
      'You stop sending these clients away.',
      'You become the teacher other teachers refer to.',
      'You are the go-to pelvic-health name in your area.'
    ] },

  {t:'content',
    h2:'Why I can teach you this',
    points:[
      'I resolved my own prolapse and abdominal separation after my third son.',
      'Teaching Pilates since 2002, and running my own studio since 2005.',
      'Polestar Pilates Educator and a Lolita San Miguel Master Mentorship graduate.',
      'Best-selling author of HOPE For Your Pelvic Floor.'
    ] },

  {t:'statement',
    big:'You do not need to become a physiotherapist. You need to teach movement in a way that respects the whole system. That is a <span class="a">Pilates teacher\'s job, done well</span>.' },

  {t:'cta',
    kicker:'If this is the work you want to do',
    h2:'Bring this into your teaching',
    points:[
      'The next step is Whole Body Pelvic Health Essentials for Pilates Teachers.',
      'For teachers who want ongoing support, there is the mentorship and community.'
    ],
    button:'Join the next live session',
    disc:'Educational only. This masterclass is not medical advice and does not replace assessment or treatment by a qualified professional. Always teach within your scope of practice and refer to a pelvic-health physiotherapist where appropriate. No clinical outcome is guaranteed and individual results vary.' }
];

const stage=document.getElementById('stage');
const counter=document.getElementById('counter');
function esc(s){return s;}
function render(){
  stage.innerHTML=S.map((s,i)=>{
    let inner='';
    if(s.t==='title'){
      inner=`<div class="kicker">${s.kicker}</div><h1>${s.h1}</h1><div class="lead">${s.lead}</div><div class="presenter">${s.presenter.replace(/·/,'</b>·<b>').replace(/^/,'<b>')}</b></div>`;
    } else if(s.t==='statement'){
      inner=`<div class="big">${s.big}</div>`;
    } else if(s.t==='section'){
      inner=`<div class="part">${s.part}</div><div class="part-h">${s.h}</div>`;
    } else if(s.t==='grid'){
      inner=`<h2>${s.h2}</h2><div class="grid">${s.cells.map(c=>`<div class="cell"><span class="n">${c[0]}</span><div class="t">${c[1]}</div></div>`).join('')}</div>`;
    } else if(s.t==='cta'){
      inner=`<div class="kicker">${s.kicker}</div><h2>${s.h2}</h2><ul>${s.points.map(p=>`<li>${p}</li>`).join('')}</ul><div class="cta-line">${s.button}</div><div class="disc">${s.disc}</div>`;
    } else {
      inner=`<h2>${s.h2}</h2><ul>${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>${s.note?`<div class="note">${s.note}</div>`:''}`;
    }
    return `<div class="slide${i===0?' on':''}" data-i="${i}">${inner}</div>`;
  }).join('');
}
let cur=0;
function show(n){
  cur=Math.max(0,Math.min(S.length-1,n));
  document.querySelectorAll('.slide').forEach(el=>el.classList.toggle('on',+el.dataset.i===cur));
  counter.textContent=(cur+1)+' / '+S.length;
}
render();show(0);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){e.preventDefault();show(cur+1);}
  else if(e.key==='ArrowLeft'||e.key==='ArrowUp'){e.preventDefault();show(cur-1);}
});
document.addEventListener('click',e=>{ if(e.target.closest('.counter')||e.target.closest('.hint'))return; show(cur+1);});
</script>
</body>
</html>
