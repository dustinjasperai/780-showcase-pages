<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Being the Bottleneck — a masterclass with Kate Ahl</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Dosis:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FAF4F3; --panel:#FFFFFF; --ink:#2B2C2B; --rule:#E3D3D1;
    --accent:#434F64; --accent2:#B07E7E; --muted:#6B6460;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:"Dosis",system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 50px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(67,79,100,.04)}
  .slide.title{background:linear-gradient(180deg,#FDF9F8,#FAF0EE);border-color:#EBD9D6}
  .slide.cta{background:#434F64;color:#F6F2EE;border-color:#434F64}
  .k{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);
    font-weight:600;margin:0 0 18px}
  .slide.cta .k{color:#D9B9B6}
  h1,h2{font-family:"Cormorant Garamond",Georgia,serif;font-weight:600;line-height:1.08;margin:0}
  h1{font-size:60px;color:var(--accent)}
  h2{font-size:40px;color:var(--accent)}
  .slide.cta h2,.slide.cta h1{color:#FBF6F3}
  .sub{font-size:21px;line-height:1.5;color:var(--muted);margin:20px 0 0;max-width:40em}
  .slide.cta .sub{color:#E8DED9}
  .big{font-size:30px;line-height:1.3;color:var(--ink);margin:22px 0 0;max-width:34em}
  ul{margin:26px 0 0;padding:0;list-style:none}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 30px;position:relative;
    border-top:1px solid var(--rule);color:var(--ink)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
    border-radius:50%;background:var(--accent2)}
  li b{font-family:"Cormorant Garamond",serif;font-weight:700;color:var(--accent);font-size:22px}
  .note{font-size:15px;color:var(--muted);margin:30px 0 0}
  .slide.cta .note{color:#C9B6B2}
  .pg{font-size:13px;color:var(--muted);text-align:right;margin:-14px 6px 22px 0;letter-spacing:.1em}
  .step{font-family:"Cormorant Garamond",serif;font-size:19px;color:var(--accent2);margin:0 0 6px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title',
    k:'A live masterclass with Kate Ahl',
    h:'Stop Being the Bottleneck',
    sub:'How to hand off the work, trust your team, and get back to why you started your agency.'},

  {t:'who',
    k:'Who this is for',
    h:'The agency owner who is ready to stop being the bottleneck',
    big:'You have a team. You have clients. You have revenue. And somehow every decision, every fix, and every final approval still runs through you.',
    note:'If the business cannot move for a day without you, this hour is for you.'},

  {t:'trap',
    k:'The trap',
    h:'You became your agency’s most expensive employee',
    sub:'You hired people to get your time back. Instead you got a second job: managing everything they do. The to-do list got longer, not shorter, and the one person who can never take a real week off is you.'},

  {t:'reframe',
    k:'The reframe',
    h:'More hustle is not the answer. Getting out of the way is.',
    big:'Scaling a service agency is not about you doing more. It is about the business being able to do more without you in the middle of it.'},

  {t:'promise',
    k:'What this hour covers',
    h:'The handoff, in three shifts',
    list:[
      '<b>Hand off the work.</b> How to delegate outcomes, not just tasks, so the team can actually carry them.',
      '<b>Lead, do not manage.</b> The move from assigning work to growing the people who own it.',
      '<b>Simplify the agency.</b> Prune the offer and write down the standard so it runs without you in the room.']},

  {t:'part',
    step:'Part One',
    h:'Why the owner becomes the ceiling',
    sub:'Before we fix it, it helps to see exactly how a founder quietly turns into the thing holding the agency back.'},

  {t:'list',
    k:'The three ways it happens',
    h:'The bottleneck is built, not born',
    list:[
      '<b>You kept the work you were best at.</b> The highest-skill tasks never got handed off, so the team can only go as fast as your calendar.',
      '<b>You trained no one to decide.</b> Every judgment call comes back to you, so your inbox becomes the company’s decision queue.',
      '<b>You never wrote it down.</b> The standards live in your head, so nobody can match them without asking you first.']},

  {t:'cost',
    k:'What it costs',
    h:'A calendar that belongs to everyone but you',
    sub:'Approve, fix, review, sign off, repeat. The week fills with other people’s decisions, the strategic work slides to someday, and growth stalls at exactly the size one person can personally hold together.'},

  {t:'tax',
    k:'The hidden tax',
    h:'The whole agency waits at your desk',
    big:'When you are the only one who can decide, every person you hired is partly idle, waiting on you. The more talented your team, the more expensive that waiting gets.'},

  {t:'part',
    step:'Part Two',
    h:'The owner to leader handoff',
    sub:'Three shifts that move the work off your plate without the wheels falling off. This is the core of how I scaled Simple Pin Media and what I coach owners through now.'},

  {t:'list',
    k:'Pillar one',
    h:'Hand off the work, with trust',
    list:[
      '<b>Hire for the gap, not the panic.</b> Bring on the next person for the role the business needs, before you are underwater.',
      '<b>Train for the decision, not just the task.</b> Teach the why so your team can make the call you would have made.',
      '<b>Let go on purpose.</b> Delegation is not dumping. You hand over the outcome and the authority, then you stay out of it.']},

  {t:'list',
    k:'Pillar two',
    h:'Lead, do not manage',
    list:[
      '<b>Managing is tasks. Leading is people.</b> Your job shifts from assigning work to growing the people who do it.',
      '<b>Feedback is the tool.</b> Clear, kind, frequent feedback is how standards travel from your head into the team.',
      '<b>Appreciation is strategy.</b> People who feel seen take ownership. Owners who take ownership are what let you step back.']},

  {t:'list',
    k:'Pillar three',
    h:'Simplify what the agency sells and how it runs',
    list:[
      '<b>Prune the offer.</b> Cut the services that no longer fit you or the client, so the team scales around what the agency does best.',
      '<b>Write down the standard.</b> Turn the way you do it into something repeatable that does not need you in the room.',
      '<b>Plan for the hard day.</b> A simple resilience plan means one lost client or one sick week does not put it all back on you.']},

  {t:'part',
    step:'Part Three',
    h:'What changes when you step out of the middle',
    sub:'When the handoff works, the shape of your week and your business changes.'},

  {t:'list',
    k:'The after',
    h:'An agency that runs on the team, not on you',
    list:[
      '<b>The decisions stop at the team.</b> Your inbox is no longer the company’s bottleneck.',
      '<b>You lead the few things only you can.</b> Vision, key relationships, the next bet.',
      '<b>You can step away.</b> A real week off, and the agency keeps its standard without you.']},

  {t:'win',
    k:'And for the work itself',
    h:'The standard holds without you in the room',
    big:'Clients stop being able to tell whether you personally touched their account, because the way you do it now lives in the team, not only in your head.'},

  {t:'why',
    k:'Why me',
    h:'I built the thing I teach, and I still run it',
    big:'I started Simple Pin Media in 2014 and grew it to seven figures with a team of around 38 people serving more than 120 client accounts. The hardest part was not the growth. It was learning to get out of the way. That is what I help agency owners do.'},

  {t:'cta',
    cls:'cta',
    k:'Your next step',
    h:'Ready to stop being the bottleneck?',
    sub:'If you want help making this shift in your own agency, the next step is simple: apply for Agency Executive Coaching and book a fit call with me. We will look at where you are the bottleneck and map the handoff from there.',
    note:'Educational content only. No income, role, or result is guaranteed. Results vary and depend on your own agency, team, and effort.'}
];

const app = document.getElementById('app');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls || s.t);
  let html = '';
  if(s.step) html += '<div class="step">'+s.step+'</div>';
  if(s.k) html += '<p class="k">'+s.k+'</p>';
  if(s.h) html += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.big) html += '<p class="big">'+s.big+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(x=>{ html += '<li>'+x+'</li>'; }); html += '</ul>'; }
  if(s.note) html += '<p class="note">'+s.note+'</p>';
  d.innerHTML = html;
  const pg = document.createElement('div');
  pg.className = 'pg';
  pg.textContent = (i+1) + ' / ' + S.length;
  app.appendChild(pg);
  app.appendChild(d);
});
</script>
</body>
</html>
