<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Design the Firm That Runs Without You: The Small Firm Roadmap</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f3;
    --panel:#eceae4;
    --ink:#424b54;
    --muted:#6f7780;
    --rule:#d8d6cf;
    --accent:#ff7062;
    --display:"Space Grotesk",system-ui,sans-serif;
    --mono:"Courier Prime",ui-monospace,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--display);-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto}
  .slide{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 6vw;border-bottom:1px solid var(--rule);position:relative;
  }
  .kicker{font-family:var(--mono);font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  .num{position:absolute;top:5vh;right:6vw;font-family:var(--mono);font-size:12px;color:var(--muted);letter-spacing:.1em}
  h1{font-size:clamp(34px,6vw,68px);line-height:1.04;font-weight:700;letter-spacing:-.02em;max-width:16ch}
  h2{font-size:clamp(26px,4vw,44px);line-height:1.1;font-weight:600;letter-spacing:-.015em;max-width:20ch}
  .lede{font-size:clamp(18px,2.2vw,24px);line-height:1.5;color:var(--muted);max-width:30ch;margin-top:26px;font-weight:400}
  .big{font-size:clamp(30px,5vw,56px);line-height:1.12;font-weight:600;letter-spacing:-.015em;max-width:18ch}
  .big .hot{color:var(--accent)}
  .rows{margin-top:34px;display:flex;flex-direction:column;gap:14px;max-width:38ch}
  .row{display:flex;gap:16px;align-items:baseline;font-size:clamp(16px,1.9vw,21px);line-height:1.4}
  .row .b{font-family:var(--mono);color:var(--accent);font-size:14px;min-width:34px}
  .pillars{margin-top:30px;display:grid;grid-template-columns:repeat(3,1fr);gap:18px;max-width:900px}
  .pill{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .pill .t{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
  .pill .d{font-size:15px;line-height:1.4;color:var(--ink)}
  .stage-ladder{margin-top:34px;display:flex;flex-direction:column;gap:0;max-width:40ch}
  .stage{display:flex;gap:18px;align-items:baseline;padding:16px 0;border-top:1px solid var(--rule)}
  .stage .n{font-family:var(--mono);color:var(--accent);font-size:14px;min-width:30px}
  .stage .s{font-size:clamp(18px,2.2vw,24px);font-weight:600}
  .stage .c{font-size:15px;color:var(--muted);margin-left:auto;max-width:18ch;text-align:right}
  .credit{font-size:clamp(17px,2vw,22px);line-height:1.5;max-width:34ch;margin-top:24px;color:var(--ink)}
  .disclaimer{font-family:var(--mono);font-size:12px;line-height:1.5;color:var(--muted);max-width:52ch;margin-top:36px}
  .cta-line{font-size:clamp(20px,2.6vw,30px);font-weight:600;margin-top:22px;max-width:24ch}
  .foot{position:absolute;bottom:4vh;left:6vw;font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  @media(max-width:720px){.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'The Small Firm Roadmap',
    h:'Design the firm that runs without you.',
    lede:'A live masterclass for small law firm owners who became accidental business owners and never got the blueprint.' },

  {t:'promise', kicker:'What you will leave with',
    h:'By the end, you will know your firm’s growth stage and the one thing to fix first.',
    lede:'Not more hustle. A design.' },

  {t:'point', kicker:'Who this is for',
    h:'You built a firm good enough to trap you in it.',
    rows:[
      ['01','The work is steady, but every decision still routes through you.'],
      ['02','You are the rainmaker, the manager, and the safety net at once.'],
      ['03','A week off means the firm holds its breath until you get back.'] ] },

  {t:'point', kicker:'The trap',
    h:'Nobody taught you to run a business. They taught you to practice law.',
    lede:'So you run the firm the only way you know how: by doing more of it yourself. That works until it is the thing holding you back.' },

  {t:'hook', kicker:'The reframe',
    big:'Most law firms don’t fail at law.<br>They fail at <span class="hot">design.</span>' },

  {t:'section', kicker:'Part one',
    h:'The problem is not effort. It is that the firm depends on you.',
    lede:'A firm built around the owner has a ceiling: your hours. You cannot out-work a design problem.' },

  {t:'point', kicker:'The real cost',
    h:'When the owner is the system, nothing compounds.',
    rows:[
      ['✕','Team cannot act without you, so they wait.'],
      ['✕','Clients you should decline get said yes to, because volume feels safe.'],
      ['✕','The numbers live in your head, so you steer by nerves.'] ] },

  {t:'section', kicker:'Part two',
    h:'The Healthy Firm: six parts of a business, designed on purpose.',
    lede:'A healthy firm is strong across six areas at once. Most owners over-build one and ignore the rest.' },

  {t:'pillars', kicker:'The six pillars',
    h:'What a firm is actually made of.',
    pills:[
      ['Strategy','Where the firm is going, and which clients belong in it.'],
      ['Team','People who can act without asking you first.'],
      ['Clients','A client experience that is the same whether or not you are in the room.'],
      ['Systems','The work happens the same way every time, by design.'],
      ['Profits','Pricing and numbers that fund the firm you actually want.'],
      ['Owners','A role for you that the firm can survive you stepping back from.'] ] },

  {t:'section', kicker:'Part two, continued',
    h:'The pillar you fix first depends on your stage.',
    lede:'A firm fighting to survive needs a different move than a firm ready to scale. Work the wrong pillar for your stage and nothing moves.' },

  {t:'stages', kicker:'The four growth stages',
    h:'Find where your firm actually is.',
    stages:[
      ['1','Start & Stabilize','Get your feet under you.'],
      ['2','Systematize','Make the work repeatable without you.'],
      ['3','Strengthen','Build a team that owns outcomes.'],
      ['4','Shape','Design the firm, and the exit, you want.'] ] },

  {t:'point', kicker:'The diagnostic',
    h:'The Small Firm Scorecard tells you your stage in minutes.',
    lede:'Score your firm across the six pillars, see where it is strong and where it is stuck, and get the one priority that matters for the next ninety days.' },

  {t:'section', kicker:'Part three',
    h:'How a designed firm actually runs.',
    lede:'Not a fantasy. A normal week, run by a firm that no longer needs you in every room.' },

  {t:'point', kicker:'A designed week',
    h:'The owner’s calendar, rebuilt.',
    rows:[
      ['Mon','Deep work. No client fires routed to you.'],
      ['Tue','The team runs intake and it holds.'],
      ['Wed','Out of office. The firm does not notice.'],
      ['Fri','You work on the firm, not inside it.'] ] },

  {t:'credit', kicker:'Why trust this',
    h:'This is the system behind the Small Firm Roadmap.',
    credit:'Built over hundreds of episodes of the Lawyerist Podcast, the best-selling book The Small Firm Roadmap Revisited, and years of coaching small firm owners through all four stages.' },

  {t:'point', kicker:'The one move',
    h:'Stop working on everything. Work on your stage’s priority.',
    lede:'Firms get unstuck by picking the single thing their stage demands, fixing it, then moving to the next. That is the whole method.' },

  {t:'cta', kicker:'Your next step',
    cta:'Find your stage. Then build the firm that runs without you.',
    lede:'Take the Small Firm Scorecard and apply to work with a Lawyerist Lab strategist for your stage.',
    disclaimer:'Educational content only. Every firm is different and results vary. Nothing here is a guarantee of revenue, growth, or any specific outcome, and nothing here is legal or financial advice.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if (s.h) inner += `<h2>${s.h}</h2>`;
  if (s.big) inner += `<div class="big">${s.big}</div>`;
  if (s.cta) inner += `<div class="cta-line">${s.cta}</div>`;
  if (s.lede) inner += `<div class="lede">${s.lede}</div>`;
  if (s.rows) {
    inner += '<div class="rows">' + s.rows.map(r => `<div class="row"><span class="b">${r[0]}</span><span>${r[1]}</span></div>`).join('') + '</div>';
  }
  if (s.pills) {
    inner += '<div class="pillars">' + s.pills.map(p => `<div class="pill"><div class="t">${p[0]}</div><div class="d">${p[1]}</div></div>`).join('') + '</div>';
  }
  if (s.stages) {
    inner += '<div class="stage-ladder">' + s.stages.map(st => `<div class="stage"><span class="n">${st[0]}</span><span class="s">${st[1]}</span><span class="c">${st[2]}</span></div>`).join('') + '</div>';
  }
  if (s.credit) inner += `<div class="credit">${s.credit}</div>`;
  if (s.disclaimer) inner += `<div class="disclaimer">${s.disclaimer}</div>`;
  if (s.t === 'title') {
    inner = (s.kicker ? `<div class="kicker">${s.kicker}</div>` : '') + `<h1>${s.h}</h1>` + (s.lede ? `<div class="lede">${s.lede}</div>` : '');
  }
  inner += `<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  inner += `<div class="foot">The Small Firm Roadmap</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
