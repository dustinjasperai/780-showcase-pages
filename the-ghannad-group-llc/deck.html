<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Transformative Leader Within — A Masterclass with Amir Ghannad</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4ebe1;        /* warm sand paper, off-white tinted toward their terracotta */
    --panel:#fdf8f2;     /* lighter warm paper for panels */
    --rule:#e2d6c7;      /* soft warm grey, brand-derived */
    --ink:#2d2d2b;       /* brand dominant hex (84 uses) */
    --muted:#6f6a63;
    --accent:#b64011;    /* brand terracotta (the only strong color on their site) */
    --accent-soft:#f4e3da;
    --display:'Marcellus', Georgia, serif;
    --body:'Roboto', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:300;-webkit-font-smoothing:antialiased}
  #deck{height:100vh;width:100vw;overflow:hidden;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
    padding:7vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .eyebrow{font-family:var(--body);font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.3rem}
  h1{font-family:var(--display);font-weight:400;font-size:clamp(2.2rem,5.4vw,4.1rem);line-height:1.05}
  h2{font-family:var(--display);font-weight:400;font-size:clamp(1.8rem,4vw,3rem);line-height:1.1;margin-bottom:1.1rem}
  .lede{font-size:clamp(1.05rem,2vw,1.4rem);font-weight:300;color:var(--muted);max-width:40ch;margin-top:1.4rem;line-height:1.5}
  .body{font-size:clamp(1rem,1.7vw,1.25rem);font-weight:300;max-width:46ch;line-height:1.6;margin-top:.5rem}
  ul{list-style:none;margin-top:1.6rem;display:grid;gap:.9rem;max-width:48ch}
  li{position:relative;padding-left:1.9rem;font-size:clamp(1rem,1.6vw,1.2rem);font-weight:300;line-height:1.45}
  li:before{content:"\2197";position:absolute;left:0;top:.05em;color:var(--accent);font-weight:700}
  .k{color:var(--accent);font-weight:500}
  .part-num{font-family:var(--display);font-size:clamp(3rem,9vw,7rem);color:var(--accent-soft);line-height:.9}
  .part-wrap{display:flex;align-items:baseline;gap:1.4rem}
  .dim{display:grid;grid-template-columns:auto 1fr;gap:1.1rem 1.6rem;max-width:52ch;margin-top:1.4rem}
  .dim .tag{font-family:var(--display);color:var(--accent);font-size:1.5rem;white-space:nowrap}
  .dim .txt{font-weight:300;line-height:1.45;align-self:center}
  .quote{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1.25;max-width:24ch}
  .by{margin-top:2.2rem;font-weight:500;letter-spacing:.02em}
  .by span{display:block;color:var(--muted);font-weight:300;font-size:.95rem;margin-top:.2rem}
  .cred{display:grid;gap:.7rem;margin-top:1.3rem;max-width:50ch}
  .cred div{font-weight:300;line-height:1.4}
  .cred .n{font-family:var(--display);color:var(--accent);font-size:1.25rem;margin-right:.5rem}
  .disclaimer{margin-top:2rem;font-size:.78rem;color:var(--muted);max-width:52ch;line-height:1.5;font-weight:300}
  .cta-actions{margin-top:1.8rem;font-size:1.15rem;font-weight:400}
  .cta-actions .step{display:flex;gap:.8rem;align-items:center;margin-bottom:.7rem}
  .cta-actions .num{font-family:var(--display);color:var(--accent)}
  footer{position:absolute;bottom:3.4vh;left:9vw;right:9vw;display:flex;justify-content:space-between;
    align-items:center;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .nav{position:fixed;bottom:3vh;right:3vw;display:flex;gap:.5rem;z-index:10}
  .nav button{font-family:var(--body);border:1px solid var(--rule);background:var(--panel);color:var(--ink);
    width:40px;height:40px;border-radius:50%;cursor:pointer;font-size:1.1rem}
  .nav button:hover{border-color:var(--accent);color:var(--accent)}
  .count{position:fixed;bottom:3.7vh;left:3vw;font-size:.75rem;color:var(--muted);letter-spacing:.1em}
  .arrow-mark{font-family:var(--display);color:var(--accent);font-size:1.1rem}
</style>
</head>
<body>
<div id="deck"></div>
<div class="count"><span id="cur">1</span> / <span id="tot">1</span></div>
<div class="nav"><button id="prev" aria-label="Previous">&#8249;</button><button id="next" aria-label="Next">&#8250;</button></div>
<script>
const BRAND = "The Ghannad Group";
const S = [
  {t:'title',
    eyebrow:'A Live Masterclass with Amir Ghannad',
    h1:'The Transformative Leader Within',
    lede:'How extraordinary cultures begin, not with a new system or a new org chart, but with radical personal accountability.'},

  {t:'who',
    eyebrow:'Who this is for',
    h2:'You feel the pressure to change things. You are not sure where to start.',
    items:['Team members who lack initiative and avoid accountability',
           'People working in silos instead of collaborating',
           'Capable experts promoted into leadership, never equipped to lead',
           'Lackluster results and low morale, no matter how hard you push']},

  {t:'trap',
    eyebrow:'The trap',
    h2:'You have tried to fix it. Most of it has not stuck.',
    body:'New technology. Motivational talks without follow through. A tough command and control push. Cookie cutter programs that ignore your actual situation. Each one costs time, money, and energy, and the needle barely moves.',
    foot:'This is not a willpower problem. It is a root cause problem.'},

  {t:'reframe',
    eyebrow:'The reframe',
    quote:'The thing holding your culture back is mostly hidden, and most of it is inside the leader.',
    by:'There is a Transformative Leader inside each of us. There are also hidden saboteurs. The work is learning to tell them apart.'},

  {t:'part', num:'01', h2:'In the Stands, or On the Court',
    body:'Most leaders live in the stands. They comment on the problem, wait for a title, wait for better circumstances, wait for the bosses to change. Transformative Leaders step onto the court and take ownership of the situation from exactly where they stand.'},

  {t:'content',
    eyebrow:'The cost of the stands',
    h2:'What waiting actually costs you',
    items:['Playing whack a mole with problems instead of solving root causes',
           'Losing credibility with your bosses and trust with your people',
           'Burning years hoping things will fall into place on their own',
           'Watching good people disengage while you fight fires']},

  {t:'part', num:'02', h2:'The Shift: Radical Accountability',
    body:'Amir inherited the worst performing plant in the company, a toxic culture, and bosses who would not help. In the depths of it, the epiphany was simple and uncomfortable: the solution was radical accountability, starting with himself. Within eighteen months the plant hit industry benchmark results.'},

  {t:'content',
    eyebrow:'Why past training did not stick',
    h2:'Informative learning vs. transformative learning',
    body:'Informative learning stacks new knowledge and tools on top of the same disempowering beliefs and habits, so nothing really changes. Transformative learning goes to the root cause of the dysfunction, which is what lets performance and results shift almost immediately.'},

  {t:'content',
    eyebrow:'The diagnostic',
    h2:'The 7 Hidden Saboteurs of Success and Fulfillment',
    body:'Before you can lead others, you have to see what has quietly been limiting you. The saboteurs are the internal patterns that keep capable, experienced leaders stuck. Naming them, and seeing how they show up in you specifically, is where the transformation starts.'},

  {t:'part', num:'03', h2:'The Transformative Leadership Framework',
    body:'A repeatable path that builds transformative capability at every level of the organization. It works in any size, industry, or situation, because it is built on the timeless principles of human nature, not a one size fits all template.'},

  {t:'dim', eyebrow:'Dimension one', h2:'Individual Development',
    tag:'D1', txt:'Cultivating self awareness, personal accountability, and the foundational habits of a Transformative Leader. This is where the work begins, with you.'},

  {t:'dim', eyebrow:'Dimension two', h2:'Team Development',
    tag:'D2', txt:'Building team cohesion and leadership alignment, and developing a shared vision everyone can stand behind and move toward together.'},

  {t:'dim', eyebrow:'Dimension three', h2:'Best in Class Organization',
    tag:'D3', txt:'Setting organizational strategy, optimizing effectiveness, engaging in multi year planning, and mapping the journey toward a High Performance Organization.'},

  {t:'dim', eyebrow:'Dimension four', h2:'Sustainable Growth',
    tag:'D4', txt:'Stabilizing results, developing intrapreneurs, and embedding scalable systems and processes so the gains hold and keep compounding.'},

  {t:'dim', eyebrow:'Dimension five', h2:'Enterprise Wide Impact',
    tag:'D5', txt:'Developing leaders who can replicate and sustain the transformation independently, creating a lasting legacy of leadership excellence across the enterprise.'},

  {t:'content',
    eyebrow:'The culture Amir helps you build',
    h2:'An organization of inspired, committed, engaged people',
    items:['Influence that expands well beyond your formal authority',
           'Unified teams collaborating toward common objectives',
           'A common language and set of distinctions for the whole team',
           'Breakthrough results, delivered by people bringing their best']},

  {t:'credibility',
    eyebrow:'Why listen to Amir',
    h2:'Three decades in the trenches, then the framework',
    cred:[['31 yrs','in corporate leadership before founding The Ghannad Group'],
          ['240%','revenue increase for one client, with no additional capital invested'],
          ['30+','countries where leaders use his book, The Transformative Leader'],
          ['Top 1%','globally ranked podcast, The Transformative Leader']],
    foot:'Work with leaders at MasterCard, PepsiCo, Campbell’s, E&J Gallo, and L’Oreal.'},

  {t:'content',
    eyebrow:'One more thing',
    h2:'You do not need a title for this to work',
    body:'Your potential to transform the culture is not dependent on your position on the org chart. Expand your influence and make a difference right where you are, and the authority tends to follow. A significant share of past participants report being promoted shortly after.'},

  {t:'cta',
    eyebrow:'Where to go from here',
    h2:'Become the Transformative Leader your people are waiting for',
    actions:[['1','Book a strategy call with Amir to map your situation'],
             ['2','Step into the Transformative Leadership Academy with your team']],
    disclaimer:'This masterclass is educational. It shares principles and frameworks for leadership and culture development. It is not a guarantee of specific business, financial, or career outcomes. Results depend on your own circumstances, effort, and follow through.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (i===0?' on':'');
  let h = '';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){ h += '<h1>'+s.h1+'</h1><p class="lede">'+s.lede+'</p>'; }
  else if(s.t==='part'){ h += '<div class="part-wrap"><div class="part-num">'+s.num+'</div><div><h2>'+s.h2+'</h2></div></div>'; if(s.body) h+='<p class="body">'+s.body+'</p>'; }
  else if(s.t==='reframe'){ h += '<p class="quote">'+s.quote+'</p><p class="by">'+s.by+'</p>'; }
  else if(s.t==='dim'){ h += '<h2>'+s.h2+'</h2><div class="dim"><div class="tag">'+s.tag+'</div><div class="txt">'+s.txt+'</div></div>'; }
  else if(s.t==='credibility'){ h += '<h2>'+s.h2+'</h2><div class="cred">'; s.cred.forEach(c=>{h+='<div><span class="n">'+c[0]+'</span>'+c[1]+'</div>';}); h+='</div>'; if(s.foot) h+='<p class="disclaimer">'+s.foot+'</p>'; }
  else if(s.t==='cta'){ h += '<h2>'+s.h2+'</h2><div class="cta-actions">'; s.actions.forEach(a=>{h+='<div class="step"><span class="num">'+a[0]+'</span><span>'+a[1]+'</span></div>';}); h+='</div><p class="disclaimer">'+s.disclaimer+'</p>'; }
  else { if(s.h2) h += '<h2>'+s.h2+'</h2>'; if(s.body) h+='<p class="body">'+s.body+'</p>'; if(s.items){ h+='<ul>'; s.items.forEach(it=>h+='<li>'+it+'</li>'); h+='</ul>'; } if(s.foot) h+='<p class="body" style="margin-top:1.4rem;color:var(--accent)">'+s.foot+'</p>'; }
  h += '<footer><span class="arrow-mark">↗ '+BRAND+'</span><span>The Transformative Leader Within</span></footer>';
  el.innerHTML = h;
  deck.appendChild(el);
});

let idx=0;
const slides=[...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent=slides.length;
function go(n){ slides[idx].classList.remove('on'); idx=(n+slides.length)%slides.length; slides[idx].classList.add('on'); document.getElementById('cur').textContent=idx+1; }
document.getElementById('next').onclick=()=>go(idx+1);
document.getElementById('prev').onclick=()=>go(idx-1);
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(idx+1); if(e.key==='ArrowLeft')go(idx-1); });
</script>
</body>
</html>
