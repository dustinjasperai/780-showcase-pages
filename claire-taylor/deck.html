<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write From Your Core — The Liberated Writer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Marcellus&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8fd;
    --panel:#ffffff;
    --rule:#e4cef8;
    --ink:#2b2535;
    --muted:#6c6480;
    --accent:#6e5084;
    --deep:#226663;
    --head:'Marcellus', serif;
    --body:'Montserrat', sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 64px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(110,80,132,.04)}
  .slide .num{position:absolute;top:22px;right:26px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .kick{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--deep);margin-bottom:18px;font-weight:600}
  h1{font-family:var(--head);font-weight:400;font-size:52px;line-height:1.08;color:var(--ink);margin-bottom:18px}
  h2{font-family:var(--head);font-weight:400;font-size:38px;line-height:1.14;color:var(--accent);margin-bottom:16px}
  h3{font-family:var(--head);font-weight:400;font-size:26px;color:var(--ink);margin-bottom:10px}
  p{font-size:19px;line-height:1.6;color:var(--ink);margin-bottom:14px;max-width:42em}
  p.lead{font-size:22px;color:var(--muted)}
  .sub{font-size:17px;color:var(--muted);margin-top:6px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li:before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .types li:before{background:var(--deep)}
  .tag{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;margin-bottom:20px}
  .big{font-size:40px;font-family:var(--head);color:var(--accent);line-height:1.12}
  .strike{text-decoration:line-through;text-decoration-color:var(--deep);color:var(--muted)}
  .hl{color:var(--accent)}
  .ennea{position:absolute;right:-70px;bottom:-70px;width:280px;height:280px;opacity:.10}
  .cta h1{color:var(--accent)}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:46em;line-height:1.5}
  .brandline{font-size:15px;color:var(--deep);margin-top:4px;letter-spacing:.04em}
  @media(max-width:620px){.slide{padding:34px 26px}h1{font-size:36px}h2{font-size:28px}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const ENNEA = `<svg class="ennea" viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#6e5084" stroke-width="1"/><polygon points="50,6 85,78 15,78" fill="none" stroke="#226663" stroke-width="1"/><polygon points="50,6 92,38 76,88 24,88 8,38" fill="none" stroke="#6e5084" stroke-width="1"/></svg>`;
const S = [
  {t:'title', cls:'', html:`<span class="kick">A live masterclass with Claire Taylor</span>
    <h1>Write From Your Core</h1>
    <p class="lead">The Enneagram behind your creative blocks, and behind the characters readers never forget.</p>
    <div class="brandline">The Liberated Writer</div>` + ENNEA},

  {t:'who', cls:'', html:`<span class="kick">Who this hour is for</span>
    <h2>If you keep starting, and stalling</h2>
    <p>You have the ideas. You have finished things before. And still the draft sits, or the characters come out a little flat, a little safe, a little too much like you.</p>
    <p class="sub">This is for authors at any stage who are tired of blaming their own willpower for it.</p>`},

  {t:'hook', cls:'', html:`<span class="tag">The reframe</span>
    <h2>You were told it was <span class="strike">discipline</span>.</h2>
    <p class="big">It was never discipline.</p>
    <p>What stops a talented writer is almost never laziness. It is a specific fear, running quietly underneath the work, and it has a name.</p>`},

  {t:'part', cls:'', html:`<span class="kick">Part one</span><h2>Why talented writers stall</h2>`},

  {t:'point', cls:'', html:`<h3>Every writer works from a core fear and a core desire</h3>
    <p>The Enneagram sorts people into nine types, each organized around one core fear and one core desire. That pair shapes how you think, feel, and act, including how you sit down to write, and how you avoid it.</p>`},

  {t:'point', cls:'', html:`<h3>The same fear shows up on the page</h3>
    <p>The fear that stalls you is the same fear that flattens your cast. Characters go safe, or they all sound like you, because the thing you cannot face in yourself is the thing you will not give them.</p>`},

  {t:'part', cls:'', html:`<span class="kick">Part two</span><h2>The Enneagram for Authors</h2>` + ENNEA},

  {t:'framework', cls:'', html:`<span class="kick">The map</span>
    <h3>Nine types, two forces</h3>
    <p>Each type is driven by what it most wants and most fears. Once you can see your own pair clearly, the block stops being mysterious. It becomes a pattern you can work with instead of a wall you keep hitting.</p>`},

  {t:'types', cls:'', html:`<span class="kick">The nine author types</span>
    <h3>Which one is quietly running your writing?</h3>
    <ul class="types">
      <li>1 The Reformer, 2 The Helper, 3 The Achiever</li>
      <li>4 The Individualist, 5 The Investigator, 6 The Loyalist</li>
      <li>7 The Enthusiast, 8 The Challenger, 9 The Peacemaker</li>
    </ul>`},

  {t:'framework', cls:'', html:`<span class="kick">Write Iconic Characters</span>
    <h3>Build a cast from the inside out</h3>
    <p>Map the nine types onto your characters and they stop being plot devices. Each one gets a real fear, a real want, and a reason to act that a reader recognizes without being told.</p>`},

  {t:'framework', cls:'', html:`<span class="kick">Heroes of the Enneagram</span>
    <h3>Growth paths make a hero believable</h3>
    <p>Every type has a path toward its best self. Lay that path over the hero's journey and the arc feels earned, because it moves the way real people actually change.</p>`},

  {t:'framework', cls:'', html:`<span class="kick">Villains of the Enneagram</span>
    <h3>Gifts corrupted by fear</h3>
    <p>A great antagonist is not evil for its own sake. It is a type whose gifts have curdled under fear into something destructive. That is what makes a villain land, and feel almost possible.</p>`},

  {t:'point', cls:'', html:`<h3>Now turn it on yourself</h3>
    <p>Name your own type and you name the fear that stalls you. You stop fighting your nature and start writing with it. The practice gets lighter because it finally fits the writer you actually are.</p>`},

  {t:'part', cls:'', html:`<span class="kick">Part three</span><h2>A sustainable writing life</h2>`},

  {t:'list', cls:'', html:`<span class="kick">Pillars of a sustainable author legacy</span>
    <h3>Build the career, not just the book</h3>
    <ul>
      <li>A business approach that fits your type, not someone else's hustle</li>
      <li>Adapting to a shifting publishing landscape without losing yourself</li>
      <li>Maximizing the specific talent your type is built for</li>
      <li>A mindset for longevity, so the work survives the storms of life</li>
    </ul>`},

  {t:'point', cls:'', html:`<h3>What the next ninety days can look like</h3>
    <p>A draft that moves because the block has a name. Characters that feel inevitable. A writing practice you keep, because for once it is built around how you are wired instead of against it.</p>`},

  {t:'why', cls:'', html:`<span class="kick">Why me</span>
    <h3>Claire Taylor</h3>
    <p>Author of more than forty books and an independent publisher for over a decade, now an Advanced Certified Instructor of the Enneagram Spectrum and an Accredited Practitioner of the Integrative Enneagram (iEQ9).</p>
    <p class="sub">I built The Liberated Writer because the craft advice I was given never touched the real reason I stalled.</p>`},

  {t:'recap', cls:'', html:`<span class="tag">One idea to keep</span>
    <h2>Free the writer, and the writing follows</h2>
    <p>The fear you name in yourself is the same fear that brings your characters to life. One map does both jobs.</p>`},

  {t:'cta', cls:'cta', html:`<span class="kick">Your next step</span>
    <h1>Keep going with me</h1>
    <p>If this hour landed, the work goes deeper inside Author Momentum and Author Legacy group coaching, where we run your iEQ9 assessment and build the career around your type. You can apply, or book a one to one session, at <span class="hl">liberatedwriter.com</span>.</p>
    <p class="disc">Educational content only. No income, role, publishing outcome, or result is guaranteed. Results vary from writer to writer and depend on your own effort, circumstances, and market conditions.</p>
    <div class="brandline">The Liberated Writer, Claire Taylor</div>`},
];
const wrap = document.getElementById('wrap');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = `<span class="num">${i+1} / ${S.length}</span>` + s.html;
  wrap.appendChild(d);
});
</script>
</body>
</html>
