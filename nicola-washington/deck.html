<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn Followers Into Readers — Too Much Social masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f4ec;        /* warm off-white, from light scheme + #f2f2f2 */
    --panel:#fffdf7;     /* paper panel */
    --rule:#e6e1d2;      /* hairline */
    --ink:#14241c;       /* her forest-green ink (brand.json) */
    --ink-soft:#415046;  /* muted forest */
    --accent:#7db86b;    /* her leafy green (brand.json) */
    --highlight:#f8f484; /* her chartreuse signature (brand.json) */
    --serif:'EB Garamond',Georgia,serif;
    --sans:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(20,36,28,.03)}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.12;margin-bottom:16px}
  .sub{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--ink-soft);margin-bottom:10px}
  p.body{font-size:19px;color:var(--ink-soft);max-width:60ch;margin-bottom:14px}
  .big{font-family:var(--serif);font-size:38px;line-height:1.18;font-weight:600;max-width:20ch}
  .mark{background:linear-gradient(transparent 62%, var(--highlight) 62%);padding:0 2px}
  ul.items{list-style:none;margin-top:8px}
  ul.items li{font-size:19px;color:var(--ink);padding:13px 0 13px 34px;border-bottom:1px solid var(--rule);position:relative}
  ul.items li:last-child{border-bottom:none}
  ul.items li:before{content:"";position:absolute;left:4px;top:21px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pillars{display:grid;gap:16px;margin-top:10px}
  .pillar{border-left:3px solid var(--accent);padding:6px 0 6px 20px}
  .pillar .pname{font-family:var(--serif);font-weight:600;font-size:22px;margin-bottom:4px}
  .pillar .pdesc{font-size:17.5px;color:var(--ink-soft)}
  .num{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:20px;margin-right:8px}
  .cta-action{font-family:var(--sans);font-weight:600;font-size:21px;color:var(--ink);background:var(--highlight);display:inline-block;padding:14px 22px;border-radius:10px;margin-top:10px}
  .disclaimer{font-size:13px;color:var(--ink-soft);margin-top:26px;max-width:62ch;line-height:1.45}
  .progress{font-family:var(--sans);font-size:12px;color:var(--ink-soft);opacity:.6;margin-top:30px;letter-spacing:.04em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Too Much Social masterclass · with Nicola Washington',
   title:'Turn Followers Into Readers',
   sub:'The sustainable author’s guide to Instagram'},

  {t:'section',
   kicker:'Who this is for',
   title:'Writers who want readers, not a second job',
   body:'If you are a writer or author who knows Instagram matters but finds it loud, time-hungry and a little bit horrible, this hour is for you. No hacks, no dancing, no becoming someone you are not.'},

  {t:'statement',
   kicker:'The trap',
   big:'Most advice tells writers to post every day, chase the algorithm, and perform. So you burn out, or you go quiet.'},

  {t:'section',
   kicker:'The trap, continued',
   title:'Growth for its own sake is the wrong goal',
   body:'A huge following of people who will never read your book is a vanity number. It costs you hours and gives you nothing back. The feed is full of coaches selling exactly that: grow faster, post more, win the algorithm.'},

  {t:'statement',
   kicker:'The reframe',
   big:'You don’t need more followers. You need the right readers to know you are for them.'},

  {t:'section',
   kicker:'Part one · the real problem',
   title:'Instagram is a reader-finding tool, not a numbers game',
   body:'When you stop treating Instagram as a scoreboard and start treating it as the place readers decide whether a book is for them, almost everything gets simpler. You post less, you post on purpose, and the right people stay.'},

  {t:'section',
   kicker:'Part two · the method',
   title:'People first, not algorithms',
   body:'My Momentum method blends your book, your preferences, and your readers’ interests with proven Instagram strategies, into a plan you can actually keep. Community over growth. Connection over transactions. Four pillars carry it.'},

  {t:'framework',
   kicker:'Pillar one',
   title:'Your profile is a 10-second audition',
   pillars:[
     {name:'The 5 Profile Opportunities',desc:'A stranger decides in about ten seconds whether your account is relevant to them. You have five chances to answer: your handle, your bio, your profile picture, your links, and your pinned posts. Most author accounts waste all five.'}
   ]},

  {t:'bullets',
   kicker:'Pillar one, in practice',
   title:'Make all five say “this is for you”',
   items:[
     'Handle and name: searchable, and clearly a writer, not a riddle',
     'Bio: who you write for and what they get, in one calm line',
     'Photo: a face readers can trust, not a logo',
     'Links: one obvious next step, not a wall of ten',
     'Pinned posts: your three best introductions, chosen on purpose'
   ]},

  {t:'framework',
   kicker:'Pillar two',
   title:'Find the right readers, not more of everyone',
   pillars:[
     {name:'Top-of-funnel discovery',desc:'Finding potential readers is a skill, not luck. You show up where your readers already gather, around the themes and feelings of your book, so the people who find you are the people who would actually want it.'}
   ]},

  {t:'framework',
   kicker:'Pillar three',
   title:'Turn engagement into book sales',
   pillars:[
     {name:'Bottom-of-funnel posts',desc:'Likes are not sales. A small number of deliberate posts do the quiet work of converting a warm follower into someone who buys, borrows, reviews and recommends your book. This is the step most writers never make.'}
   ]},

  {t:'framework',
   kicker:'Pillar four',
   title:'Show up sustainably, not constantly',
   pillars:[
     {name:'Ten Essential Habits',desc:'Effective author accounts are not the ones posting all day. They repeat a small set of habits that build connection without the burnout, so being consistent stops depending on how motivated you feel this week.'}
   ]},

  {t:'statement',
   kicker:'Why it works',
   big:'Sustainable beats spectacular. A plan you keep for a year beats a sprint you quit in a month.'},

  {t:'section',
   kicker:'Part three · the calmer feed',
   title:'A calmer feed that actually sells books',
   body:'Fewer posts, chosen on purpose. A profile that converts strangers into followers and followers into readers. Hours back in your week for the thing that matters most, which is writing the next book.'},

  {t:'section',
   kicker:'Why me',
   title:'I built this as the antidote to bro-marketing',
   body:'I taught English for twelve years, spent seven in social media, and since 2023 I have worked with 150+ writers on launches and platforms. Too Much is my answer to influencer-culture and bro-marketing tactics that ignore how writers actually feel about showing up.'},

  {t:'cta',
   kicker:'Work with me',
   title:'Let’s build your plan together',
   body:'If you want this mapped to your book and your readers, the four-month Momentum programme is where we do it, one to one. Start with a free 30-minute discovery call and we will see if it fits.',
   action:'Book your free discovery call at toomuchsocial.com',
   disclaimer:'This masterclass is educational. It shares strategies and habits for marketing books on Instagram; it is not a guarantee of sales, followers, income or any specific result. Outcomes vary with your book, your audience and your effort.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if (s.t === 'title') {
    html += '<h1>'+s.title+'</h1>';
    if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
  } else if (s.t === 'statement') {
    html += '<div class="big">'+s.big+'</div>';
  } else if (s.t === 'bullets') {
    html += '<h2>'+s.title+'</h2><ul class="items">';
    s.items.forEach(it => html += '<li>'+it+'</li>');
    html += '</ul>';
  } else if (s.t === 'framework') {
    html += '<h2>'+s.title+'</h2><div class="pillars">';
    s.pillars.forEach(p => html += '<div class="pillar"><div class="pname">'+p.name+'</div><div class="pdesc">'+p.desc+'</div></div>');
    html += '</div>';
  } else if (s.t === 'cta') {
    html += '<h2>'+s.title+'</h2><p class="body">'+s.body+'</p>';
    if (s.action) html += '<div class="cta-action">'+s.action+'</div>';
    if (s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  } else {
    html += '<h2>'+s.title+'</h2>';
    if (s.body) html += '<p class="body">'+s.body+'</p>';
  }
  html += '<div class="progress">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
