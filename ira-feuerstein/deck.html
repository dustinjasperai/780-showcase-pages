<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Language of Your Metabolism — The Type 2 Awakening</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf6ef; --panel:#f3ebdf; --rule:#e4d7c4; --ink:#241c15;
    --muted:#6a5c4c; --accent:#e2743b;
    --head:'Newsreader',Georgia,serif; --body:'Figtree',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 64px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide.title,.slide.cta{background:linear-gradient(160deg,#fff7ee 0%,#f6e7d4 100%)}
  .k{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin:0 0 18px}
  h1{font-family:var(--head);font-weight:600;font-size:clamp(34px,5vw,56px);line-height:1.04;
    margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(26px,3.4vw,38px);line-height:1.1;
    margin:0 0 16px;letter-spacing:-.01em}
  p.sub{font-size:clamp(17px,1.7vw,21px);line-height:1.5;color:var(--muted);margin:0;max-width:60ch}
  p.big{font-family:var(--head);font-size:clamp(24px,3vw,34px);line-height:1.22;margin:0;max-width:30ch}
  ul{margin:14px 0 0;padding:0;list-style:none;max-width:62ch}
  li{position:relative;padding:14px 0 14px 34px;border-top:1px solid var(--rule);
    font-size:clamp(16px,1.6vw,20px);line-height:1.45}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:22px;width:12px;height:12px;
    border-radius:50%;background:var(--accent)}
  li b{font-weight:600}
  .step{font-family:var(--head);color:var(--accent);font-size:15px;font-weight:600;
    letter-spacing:.14em;text-transform:uppercase}
  .disc{font-size:13px;color:var(--muted);line-height:1.5;margin:22px 0 0;max-width:66ch}
  .brand{position:absolute;right:30px;bottom:22px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted)}
  .curve{position:absolute;left:0;right:0;bottom:0;height:90px;opacity:.5}
  .n{color:var(--muted);font-size:12px;position:absolute;left:30px;bottom:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass with Ira Feuerstein', h:'The Language of Your Metabolism',
   sub:'How to reverse type 2 diabetes by learning to read your own body, instead of following one more diet.'},

  {t:'content', k:'Who this is for', h:'You have done everything right.',
   sub:'And the number kept climbing anyway. This is for anyone with type 2 diabetes who has counted, walked, and cut carbs on Monday, only to watch the meter say not enough by Friday.'},

  {t:'content', k:'The trap', h:'You were told it was discipline.',
   sub:'So every climbing number felt like a personal failure. Years of quietly deciding you just were not trying hard enough.'},

  {t:'title', k:'The reframe', h:'It was never willpower.',
   sub:'You were fluent in a language no one ever taught you to read. Today we start reading it.'},

  {t:'section', k:'Part One', h:'Why the number keeps climbing'},

  {t:'content', k:'The mechanism', h:'Insulin runs the show.',
   sub:'Every time you eat refined carbs your insulin spikes. High insulin locks fat inside your cells and blocks fat burning. Willpower cannot move a lever that is mechanical, which is exactly why working harder kept failing.'},

  {t:'content', k:'Conversational vs. fluent', h:'The system teaches you to cope.',
   sub:'Take the pill, hold the number, stay conversational. Reversal is a different skill: becoming fluent enough in your own metabolism to change what the number does.'},

  {t:'section', k:'Part Two', h:'The three things fluent people can do'},

  {t:'content', k:'Pillar one', h:'Read the mechanism.',
   big:'Insulin, not willpower. Once you see which lever actually moves, the right move gets obvious.'},

  {t:'content', k:'Pillar two', h:'Read your CGM like grammar.',
   sub:'A continuous glucose monitor turns your body into live feedback. There are only a handful of patterns to learn, and each one tells you what a meal, a walk, or a bad night actually did to you.'},

  {t:'content', k:'Pillar three', h:'Rewire the craving.',
   sub:'Your response to food is learned, which means it is re-learnable. The same neuroplasticity that lets an adult learn a new language lets you make the new response automatic.'},

  {t:'content', k:'The quiet drivers', h:'What keeps the fire lit.',
   list:['<b>Processed foods</b> that spike insulin without you noticing',
         '<b>Seed oils</b> feeding low-grade inflammation',
         '<b>Sugar</b> hiding in the foods marketed as healthy',
         '<b>Stress and sleep</b> raising glucose with no food involved']},

  {t:'section', k:'Part Three', h:'What fluency looks like in a week'},

  {t:'content', k:'A day, read differently', h:'The ten minutes after a meal.',
   sub:'You eat, you glance at the curve, you learn one thing, you make one swap. No counting, no willpower contest. Just reading, then responding, until responding becomes second nature.'},

  {t:'content', k:'The real promise', h:'The outcome is the numbers.',
   big:'The transformation is the person. The number is just the first thing that changes.'},

  {t:'content', k:'Why me', h:'I learned this the hard way.',
   sub:'Two heart attacks. An A1C near 15 and a doctor reaching for the next insulin protocol. I decided to become fluent in my own metabolism instead, and I built The Type 2 Awakening so you would not have to figure it out alone.'},

  {t:'cta', k:'Your next step', h:'Come learn to read it with us.',
   sub:'The Type 2 Awakening is a community of people becoming fluent together. Join us and start reading your own body this week.',
   disc:'Educational content only. Nothing here is medical advice, and no result is guaranteed. Reversal and remission vary from person to person. Work with your own physician before changing medication, diet, or monitoring. Always consult a qualified professional about your care.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=el('div','slide '+(s.t||'content'));
  if(s.k) d.appendChild(el('p','k',s.k));
  if(s.h && (s.t==='section')) d.appendChild(el('h1',null,s.h));
  else if(s.h) d.appendChild(el('h2',null,s.h));
  if(s.sub) d.appendChild(el('p','sub',s.sub));
  if(s.big) d.appendChild(el('p','big',s.big));
  if(s.list){const ul=el('ul'); s.list.forEach(x=>ul.appendChild(el('li',null,x))); d.appendChild(ul);}
  if(s.disc) d.appendChild(el('p','disc',s.disc));
  if(s.t==='title'||s.t==='cta') d.appendChild(el('div','brand','The Type 2 Awakening'));
  else d.appendChild(el('div','n',(i+1)+' / '+S.length));
  deck.appendChild(d);
});
</script>
</body>
</html>
