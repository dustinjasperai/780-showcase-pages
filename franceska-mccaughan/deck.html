<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Recurring-Revenue Florist: How Luxury Hotels Become Contracts That Renew · Franceska McCaughan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f1e9; --panel:#232a26; --rule:#ded4c4;
    --ink:#2b2926; --accent:#3f6f57; --accent2:#b1854e; --dim:#8a8175; --grey:#5c574d;
    --ivory:#f6f1e9;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Jost',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Jost',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:0}
  .t-title h1{font-size:4.6vw;max-width:92%}
  .t-normal h1{font-size:3.2vw;max-width:88%}
  .t-normal .body{font-family:'Jost',sans-serif;font-size:1.34vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Jost',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Jost',sans-serif;font-size:1.2vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:90%}
  .t-section .rule{width:14vw;height:2px;background:var(--accent2);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:82%;font-style:italic;color:var(--ivory)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:82%;color:var(--ivory)}
  .t-cta .kicker{color:var(--accent2)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent2);color:var(--ivory);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.1vw;font-weight:500;font-family:'Jost',sans-serif}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Jost',sans-serif;font-size:.82vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-cta .disc{color:#9c9488}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Jost',sans-serif;font-size:1.16vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.06em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:600}
  .stem{position:absolute;pointer-events:none}
  .title-stem{right:6%;bottom:8%;width:15vw;opacity:.9}
  .corner-stem{right:6.5%;bottom:7%;width:6vw;opacity:.55}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.12);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Jost',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Jost',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Jost',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">The Hotel Florist</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- fine-line botanical stem motif: one elegant living line, the opposite of clip-art florals -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="stem" viewBox="0 0 120 220">
  <g fill="none" stroke="#3f6f57" stroke-width="2" stroke-linecap="round">
    <path d="M60 210 C60 160 60 120 62 78"/>
    <path d="M61 150 C40 140 30 122 30 104 C50 108 60 126 61 148"/>
    <path d="M62 118 C84 108 94 90 94 72 C74 76 63 94 62 116"/>
    <path d="M62 88 C46 80 40 64 41 48 C58 54 63 70 62 86"/>
  </g>
  <circle cx="62" cy="58" r="5" fill="#b1854e"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Recurring-Revenue Florist: How Luxury Hotels Become Contracts That Renew',sub:'A live masterclass for wedding and event florists on landing a five-star hotel account and turning it into income that comes back year after year, without another wedding season.',brand:true,arc:'title'},

 {t:'normal',k:'Who this is for',title:'You are brilliant at the flowers. It is the feast-or-famine calendar that keeps you up at night.',body:'You can design anything a bride asks for. But every January the calendar resets to zero, the off-season is quiet, and the great months only cover the slow ones. The craft was never the problem. The revenue model is.'},
 {t:'dark',title:'A wedding is paid once and then it is over. A hotel is a relationship that reorders every single week.'},

 {t:'section',idx:'Part One',title:'Why Weddings Cap You And Hotels Do Not'},
 {t:'normal',k:'The one-off treadmill',title:'Every wedding starts you back at zero the Monday after the event.',body:'No matter how flawless the work, a wedding is a single transaction with a hard end date. To grow you have to book more of them, which means more inquiries, more consultations, more setup weekends, and more of your own hours. The ceiling is the number of Saturdays in a year.'},
 {t:'normal',k:'The hotel difference',title:'A luxury hotel does not buy an event. It buys a standard it needs met every week of the year.',body:'Lobbies, restaurants, suites, and events all need fresh flowers on a schedule, in and out of season. One signed hotel account is not one sale. It is a weekly order that renews on its own and is far cheaper to keep than a new wedding lead is to win.'},
 {t:'dark',title:'The florists who stop chasing the next event and start keeping a few accounts are the ones who finally get off the treadmill.'},

 {t:'section',idx:'Part Two',title:'The System For Landing And Keeping Hotel Accounts'},
 {t:'normal',k:'One · The florist hotels cannot ignore',title:'Before you pitch anyone, your presence has to read at five-star standard.',body:'A hotel decision-maker judges you in seconds from your portfolio and your online presence. The first move is a portfolio formula and a luxury online presence, high-end mockups included, that make a general manager see a peer who belongs in their building, not a wedding vendor hoping for a shot.'},
 {t:'normal',k:'Two · Position on the niche, not the flowers',title:'Stop competing as a generalist. Position as the specialist a luxury property was already looking for.',body:'Clarify your niche, your vision, and your value so your brand is aligned to what a five-star property expects. The florist who is clearly the luxury-hospitality specialist wins the meeting the generalist never gets invited to.'},
 {t:'normal',k:'Three · Pitch the person who can say yes',title:'The general manager is the connection that turns a maybe into a contract.',body:'A three-step pitch formula aimed at the right decision-maker, with the outreach, the mindset, and the delivery rehearsed. Rejection is not the end of it. You keep the property on your radar and check back, because these relationships are earned over time, not in one email.'},
 {t:'normal',k:'Four · Price with power',title:'Price the recurring contract to be profitable, then negotiate it like it matters, because it does.',body:'Hospitality work has its own pricing logic. Pricing formulas, negotiation strategy, and clean contract terms keep you from discounting your way into an account that quietly loses money every week.'},
 {t:'normal',k:'Five · Become the florist they come back to',title:'The real prize is not the first order. It is the renewal, and the referral to the next property.',body:'Turning a one-time installation into a long-term contract is a deliberate move: consistent delivery, the right testimonials, and a referral path into the next hotel. This is the engine that makes the income recurring instead of one more thing you have to resell every month.'},
 {t:'dark',title:'One kept account is worth more than ten weddings you have to win from scratch. A handful of them is a business that finally runs on repeat.'},

 {t:'section',idx:'Part Three',title:'From A Wedding Calendar To An Account Book'},
 {t:'normal',k:'From event calendar to account book',title:'The shift is from selling your Saturdays to holding a short list of accounts that reorder on their own.',body:'You are not adding more events. You are replacing the frantic ones with a few standing relationships that pay predictably, in and out of season, and leave your best weekends actually yours again.'},
 {t:'normal',k:'Why Franceska McCaughan',title:'Years designing exclusively for the world’s luxury hotels, and the person who built the first hospitality-floral mentorship.',body:'Franceska has designed for Waldorf Astoria, Marriott, Proper Hotels, Disney, and five-star brands across more than fifty countries, and served as Fairmont’s longest-standing Artist in Residence. She teaches this from contracts she pitched, priced, delivered, and renewed herself, which is why the method is built around what hotels actually buy.'},

 {t:'section',idx:'Your Next Step',title:'Land Your First Hotel Account'},
 {t:'normal',k:'Where the method lives',title:'The full path, from portfolio to a signed and renewing contract, is the Hotel Florist Profit Method.',body:'It walks you through positioning, pitching the right decision-maker, pricing and negotiating the contract, and turning that first order into a relationship that renews year after year, with the pitch scripts, discovery questions, and hotel contract templates done for you.'},
 {t:'cta',k:'The Hotel Florist',title:'Ready to trade the wedding treadmill for accounts that reorder every week?',chips:['Explore the Hotel Florist Profit Method','Join the waitlist'],disc:'Educational content for professional florists. No income, contract, or business result is guaranteed. Results vary by florist, market, and effort.'},
];

const deck=document.getElementById('deck');
function stemSvg(kind){return `<svg class="stem ${kind==='title'?'title-stem':'corner-stem'}" viewBox="0 0 120 220"><use href="#stem"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Hotel <b>Florist</b> &middot; Franceska McCaughan</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=stemSvg('title');
  else if(s.t==='normal' && (i%3===0)) h+=stemSvg('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
