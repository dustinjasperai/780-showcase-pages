<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Voice That Gets Pulled From the Pile — a masterclass with Sophia Chang</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f2f5; --panel:#ffffff; --ink:#5c0039; --rule:#7a004b; --accent:#fb8ceb;
    --head:'Archivo',sans-serif; --body:'Nunito Sans',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--panel);border:1px solid rgba(92,0,57,.10);border-radius:18px;
    padding:52px 54px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(92,0,57,.04)}
  .slide.title{background:var(--ink);color:var(--bg)}
  .slide.part{background:var(--rule);color:var(--bg)}
  .slide.cta{background:var(--ink);color:var(--bg)}
  .k{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:.74rem;color:var(--accent);margin-bottom:18px}
  .slide.title .k,.slide.part .k,.slide.cta .k{color:var(--accent)}
  h1{font-family:var(--head);font-weight:800;font-size:2.7rem;line-height:1.08;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:2rem;line-height:1.12;margin-bottom:16px}
  .s{font-size:1.18rem;font-weight:600;opacity:.92;margin-bottom:14px}
  p{font-size:1.06rem;margin-bottom:12px;max-width:62ch}
  ul{list-style:none;margin-top:10px}
  li{position:relative;padding-left:30px;font-size:1.06rem;margin-bottom:14px;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:.55em;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .big{font-family:var(--head);font-weight:800;font-size:3.1rem;color:var(--accent);line-height:1}
  .disc{font-size:.82rem;opacity:.8;margin-top:22px;max-width:70ch}
  .n{font-family:var(--head);font-weight:800;color:var(--accent);font-size:1rem;letter-spacing:.1em}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', k:'A live masterclass with Sophia Chang',
   h:'The Voice That Gets Pulled From the Pile',
   s:'How to write so agents and readers choose you before they ever reach your plot.'},

  {t:'intro', k:'Who this is for',
   h:'You did everything right. You are still in the pile.',
   body:'You tightened the plot. You fixed the pacing. You followed every rule in every craft book you could find. And your query still lands in the same stack as a thousand competent manuscripts.',
   s:'If that is you, this hour is for you.'},

  {t:'hook', k:'The part nobody tells you',
   h:'Agents do not reject your story. They skip your voice.',
   body:'A reader can feel a voice in the first paragraph. So can an agent reading query number forty for the day. Before premise, before plot, before platform, voice is the thing that makes someone feel they are in safe, singular hands.',
   s:'And here is what changed. AI can now write competent prose on command. Competent just became invisible.'},

  {t:'map', k:'What this hour is',
   h:'Three things, one promise.',
   list:['Why voice, not craft, is what gets you pulled out of the pile.',
         'The three things a voice has to do, so you can hear whether yours does them.',
         'How to find yours, using tools I borrowed from a decade on set.'],
   s:'By the end you will know what your voice is missing and the first move to fix it.'},

  {t:'part', cls:'part', k:'Part one', h:'Why voice, not craft.'},

  {t:'problem', k:'The tie and the tiebreaker',
   h:'Craft gets you to competent. Competent is a tie.',
   body:'Every writer in the pile has read the same craft advice and hit the same marks. That is the tie. Voice is the tiebreaker. It is the one variable that cannot be copied off a checklist, because it is made of you.',
   list:['Your history.','Your body.','Your perspective.'],
   s:'That last list is also the one thing AI can never touch.'},

  {t:'part', cls:'part', k:'Part two', h:'The three things a voice has to do.'},

  {t:'pillar', k:'Pillar one',
   h:'Agent Appeal',
   body:'Without a distinct voice, you are another query in the pile. With your voice, you are the one they pull out. We will look at what makes an agent stop on the page instead of scanning past it.'},

  {t:'pillar', k:'Pillar two',
   h:'Reader Connection',
   body:'Voice is what makes a reader trust you enough to follow you anywhere. It arrives before premise and before plot. We will name the small moves that make a reader feel held, and the ones that quietly break that trust.'},

  {t:'pillar', k:'Pillar three',
   h:'AI-Proof Differentiation',
   body:'Everything about you, your history, your body, your perspective, is what makes your voice yours. That is the one thing a model can never generate. In a feed full of competent, unmistakably you is the only moat left.'},

  {t:'part', cls:'part', k:'Part three', h:'How to find yours.'},

  {t:'method', k:'No more character sheets',
   h:'Two tools I stole from the rehearsal hall.',
   body:'I spent years as an actor before I wrote a word of fiction. Actors do not fill out character sheets. They get the character into the body and onto the page a different way.',
   list:['Discovery Journaling: set a timer, drop into first person, and let the voice come through your hand before you write the scene.',
         'Character Body Work: posture is character. The body holds answers your brain has not found yet.']},

  {t:'masks', k:'The thing in your way',
   h:'Most writers are wearing a mask.',
   body:'There are a handful of author voice masks we hide behind: the polished one, the clever one, the one that sounds like our favorite author. Each mask keeps the writing from sounding like you. The work is noticing which one you reach for, and taking it off.'},

  {t:'before', k:'The live rewrite',
   h:'A flat line, and a line only you could write.',
   body:'On the call I will take one real opening line and rewrite it in the writer\'s own voice, live. The difference is not better grammar. It is the sudden feeling that a specific human is in the room.'},

  {t:'why', k:'Why me',
   h:'Where this comes from.',
   list:['Harvard, graduated at twenty.',
         'Former film and TV actor and dancer, then a novelist.',
         'Reese\'s Book Club LitUp Fellow, chosen from more than eight hundred writers.',
         'Pitch Genius: from Ivy League admissions to top literary agents, I have spent twenty years helping people get pulled out of the pile.']},

  {t:'recap', k:'The three things',
   h:'If you remember one slide, this one.',
   list:['Agent Appeal: get pulled from the pile.',
         'Reader Connection: safe, singular hands.',
         'AI-Proof: the one thing AI can never copy.'],
   s:'Craft is the tie. Your voice is the tiebreaker.'},

  {t:'cta', cls:'cta', k:'Your next step',
   h:'Learn to write brave.',
   body:'If you want help finding the voice that gets you pulled from the pile, book a Find Your Voice discovery call with me at sophiachang.com. We will listen to your pages together and name the one move that makes them sound like you.',
   disc:'This masterclass is educational. No income, publishing outcome, agent offer, or result is guaranteed. Results vary and depend on your own work.'}
];

const deck = document.getElementById('deck');
S.forEach(s=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let html = '';
  if(s.k) html += '<div class="k">'+s.k+'</div>';
  if(s.cls==='part'){ html += '<h2>'+s.h+'</h2>'; }
  else if(s.cls==='title'||s.cls==='cta'){ html += '<h1>'+s.h+'</h1>'; }
  else { html += '<h2>'+s.h+'</h2>'; }
  if(s.s) html += '<div class="s">'+s.s+'</div>';
  if(s.body) html += '<p>'+s.body+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(i=>html+='<li>'+i+'</li>'); html += '</ul>'; }
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});
</script>
</body>
</html>
