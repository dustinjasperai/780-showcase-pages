<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The First 3 Years, Without the Scripts — Ann McKitrick, MS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FCEFE9; --panel:#FFF8F4; --panel2:#F7E3DA;
    --ink:#2E2A26; --muted:#6F655C; --rule:#EFD9CD;
    --accent:#EA2C59;
    --head:'Baloo 2',system-ui,sans-serif; --body:'Nunito Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:22px;
    padding:46px 48px;margin:22px 0;box-shadow:0 12px 30px rgba(46,42,38,.06);
    min-height:360px;display:flex;flex-direction:column;justify-content:center}
  .slide.soft{background:var(--panel2)}
  .kick{font-family:var(--head);font-weight:600;letter-spacing:.04em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin:0 0 14px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;margin:0 0 16px}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.12;margin:0 0 14px}
  p{font-size:19px;line-height:1.55;margin:0 0 14px;color:var(--ink)}
  p.sub{color:var(--muted);font-size:20px}
  .big{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.14}
  .big .a{color:var(--accent)}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{position:relative;padding:12px 0 12px 34px;font-size:19px;line-height:1.45;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.06em}
  .foot{font-size:13px;color:var(--muted);margin-top:18px}
  .pill{display:inline-block;font-family:var(--head);font-weight:600;font-size:14px;
    color:var(--accent);background:#FCE3EA;border-radius:999px;padding:6px 14px;margin-bottom:16px}
  .cta h1{font-size:40px}
  .disc{font-size:13.5px;color:var(--muted);line-height:1.5;margin-top:22px;border-top:1px solid var(--rule);padding-top:16px}
  .count{font-family:var(--head);color:var(--muted);font-size:12px;text-align:right;margin:-8px 4px 0}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Ann McKitrick, MS',
   h:'The First 3 Years, Without the Scripts',
   sub:'Raising a child with respect, while you grow too.'},

  {t:'forwho', kick:'Who this is for',
   h:'You, in the thick of it',
   body:'You love your child more than anything, and some days you still feel like you are failing. The crying, the biting, the standoffs at bedtime. You have read the tips. You have tried the words. They keep not working.'},

  {t:'trap', kick:'The trap',
   h:'Everyone hands you a script',
   body:'Say this exact phrase. Use this three step method. Stop the tantrum in sixty seconds. The whole feed sells you words to make the behavior go away. And when the words do not work, you blame yourself.'},

  {t:'reframe', kick:'A different way to see it',
   big:'You do not have a behavior problem. You have a <span class="a">translation</span> problem.'},

  {t:'reframe2', kick:'The reframe this class is built on',
   big:'They are not giving you a hard time. They are <span class="a">having</span> a hard time.'},

  {t:'part', kick:'Part one', num:'01',
   h:'Parenting is a developmental process',
   body:'In the first three years a child grows and learns faster than at any other time in their life. Here is the part no one says out loud: you are developing too. Understanding your child and growing yourself as a parent are the same work.'},

  {t:'point',
   h:'You are not raising a toddler',
   big:'You are <span class="a">building a brain</span>.',
   foot:'The first three years are the fastest growing window a brain will ever get. What you do in it matters more than any single script ever could.'},

  {t:'part', kick:'Part two', num:'02',
   h:'Three pillars under every hard moment',
   sub:'When the scripts fall away, this is what holds.'},

  {t:'pillars', kick:'Pillar one',
   h:'The foundational relationship comes first',
   body:'Your relationship with your child is the main one, and your baby always loves you best. Connection is not a reward you give for good behavior. It is the ground everything else stands on.'},

  {t:'pillars', kick:'Pillar two',
   h:'Boundaries with dignity',
   body:'Having boundaries while providing respect and dignity for who your child is as a person is fundamental. Structure and respect are not opposites. You can hold the limit and honor the child in the same breath.'},

  {t:'pillars', kick:'Pillar three',
   h:'Behavior is communication',
   body:'The meltdown, the bite, the power struggle. Each one is a sentence your child cannot say yet. When you read behavior as communication instead of defiance, you stop managing symptoms and start answering the real need.'},

  {t:'demo', kick:'In a real moment',
   h:'A biting moment, read developmentally',
   body:'Instead of "we do not bite, go to time out," you see a two year old who hit a wall with no words. You name it for them: you wanted the truck, biting hurts, let us find the words. Same moment. A completely different outcome, because you led with the lens, not the script.'},

  {t:'point', kick:'What changes for you',
   h:'Fewer power struggles. More trust.',
   body:'When you stop fighting the behavior and start understanding it, the hard moments get shorter, the connection gets deeper, and you stop ending each day feeling like you got it wrong.'},

  {t:'whyme', kick:'Why listen to me',
   h:'Ann McKitrick, MS',
   body:'Thirty years teaching child development, a Master of Science in Human Development and Family Studies, a certified CIRCLE Trainer and Relationship Development Intervention Consultant. Mother of three, and I fostered five babies. I have lived every idea in this class, not just taught it.'},

  {t:'point', kick:'The heart of it',
   big:'Protect the <span class="a">wonder</span>. You are not behind. You are right on time.'},

  {t:'cta', kick:'Your next step',
   h:'Let us keep going, together',
   body:'If today gave you a new way to see your child, there is a whole path from here. Come work with me inside Nurtured Noggins coaching, where we take these pillars into your real days, your real child, your real questions.',
   foot:'Find the next step at nurturednoggins.com',
   disc:'This masterclass is educational and reflects Ann McKitrick’s professional experience in early childhood development. It is not medical, psychological, or developmental diagnosis or treatment. Every child and family is different, so results vary and no specific outcome is guaranteed.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'reframe' || s.t === 'reframe2' || s.t === 'point' ? ' soft' : '');
  let html = '';
  if (s.kick) html += '<div class="kick">' + s.kick + '</div>';
  if (s.pill) html += '<span class="pill">' + s.pill + '</span>';
  if (s.num) html += '<div class="num">' + s.num + '</div>';
  if (s.h) html += '<h1>' + s.h + '</h1>';
  if (s.big) html += '<p class="big">' + s.big + '</p>';
  if (s.sub) html += '<p class="sub">' + s.sub + '</p>';
  if (s.body) html += '<p>' + s.body + '</p>';
  if (s.items) { html += '<ul>'; s.items.forEach(it => html += '<li>' + it + '</li>'); html += '</ul>'; }
  if (s.foot) html += '<div class="foot">' + s.foot + '</div>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
  const c = document.createElement('div');
  c.className = 'count';
  c.textContent = (i + 1) + ' / ' + S.length;
  deck.appendChild(c);
});
</script>
</body>
</html>
