<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Bones of a Memoir — a masterclass with Jennifer Lauck</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Merriweather:ital,wght@0,400;0,700;0,900;1,400&family=Source+Sans+Pro:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf8f4;      /* warm ivory paper (brand light scheme) */
    --panel:#f3efe8;   /* soft page panel */
    --ink:#1a1a1a;     /* near-black ink (from brand #121212) */
    --muted:#5c564d;   /* warm grey ink */
    --accent:#066aab;  /* her site link blue */
    --rule:#d8d0c4;
    --display:'Merriweather', Georgia, serif;
    --body:'Source Sans Pro', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:56px 60px;
    margin:0 0 22px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.03);
  }
  .num{position:absolute;top:22px;right:26px;font-family:var(--display);font-size:13px;color:var(--rule)}
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:900;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.14;margin-bottom:16px}
  .lede{font-family:var(--display);font-style:italic;font-size:22px;line-height:1.4;color:var(--muted)}
  p{font-size:19px;line-height:1.55;color:var(--ink);max-width:62ch;margin-bottom:14px}
  p.sub{color:var(--muted);font-size:18px}
  .rule{width:64px;height:3px;background:var(--accent);margin:4px 0 24px;border-radius:2px}
  ul{list-style:none;margin:8px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 46px;border-top:1px solid var(--rule);position:relative;max-width:64ch}
  li:first-child{border-top:none}
  li .b{position:absolute;left:0;top:11px;font-family:var(--display);font-weight:900;color:var(--accent);font-size:20px}
  .tag{display:inline-block;font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
  .presenter{margin-top:30px;font-size:17px;color:var(--muted)}
  .presenter b{color:var(--ink);font-family:var(--display)}
  .big{font-family:var(--display);font-weight:900;font-size:40px;line-height:1.12;max-width:20ch}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;max-width:70ch;margin-top:24px;border-top:1px solid var(--rule);padding-top:16px}
  .cta-step{font-family:var(--display);font-size:22px;color:var(--ink);margin:6px 0 2px}
  .part{font-family:var(--display);font-weight:900;font-size:15px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   eyebrow:'A live masterclass',
   h1:'The Bones of a Memoir',
   lede:'How to turn the true story only you can tell into a book a reader cannot put down.',
   presenter:'with <b>Jennifer Lauck</b>, Blackbird Studio for Writers'},

  {t:'audience',
   eyebrow:'Who this is for',
   h2:'You are carrying a true story.',
   p:'You have lived something that matters. Maybe you have started it a dozen times. You have pages, notebooks, a folder of scenes.',
   sub:'And still it sits there, flat or shapeless, nowhere near the book you can feel it wants to be.'},

  {t:'trap',
   eyebrow:'The trap',
   h2:'You think the problem is your writing.',
   p:'So you take another sentence class. You read another craft book. You rewrite the first chapter for the ninth time.',
   sub:'It is almost never the sentences. It is something underneath them.'},

  {t:'hook',
   big:'A memoir does not fail on the sentence. It fails on the bones.',
   sub:'Strip away the beautiful lines and most memoirs have no spine holding the truth up. Structure is what carries a reader from your life into a story.'},

  {t:'part', part:'Part One', h2:'Why true stories go shapeless'},

  {t:'content',
   eyebrow:'The core problem',
   h2:'Lived experience is not a story yet.',
   p:'What happened to you is chronology. A story is shape. The gap between the two is where almost every memoir stalls.',
   sub:'"And then, and then, and then" is a diary. A reader needs a reason to turn the page, not just the next thing that happened.'},

  {t:'content',
   eyebrow:'The cost',
   h2:'The drawer full of drafts.',
   p:'The manuscript that never gets past chapter three. The story that never reaches the one reader who needed to hear it.',
   sub:'Not because the writer lacked talent. Because no one showed them the bones.'},

  {t:'part', part:'Part Two', h2:'The Bones of Storytelling'},

  {t:'list',
   eyebrow:'The framework',
   h2:'Every story stands on six bones.',
   items:[
     ['1','Concept: the single idea the whole book is about.'],
     ['2','Theme: what it means, the thing under the events.'],
     ['3','Plot: the chain of cause and consequence, not just sequence.'],
     ['4','Character: you on the page as a character, not only a narrator.'],
     ['5','Structure: the shape that turns a life into momentum.'],
     ['6','Antagonistic forces: the pressure that makes a true story move.']
   ]},

  {t:'content',
   eyebrow:'Bone one and two',
   h2:'Concept and theme.',
   p:'Before structure, you name the one idea the book is about, and then the deeper thing it is really about underneath.',
   sub:'Most drafts try to be about everything. A memoir earns its power by being about one thing, all the way down.'},

  {t:'content',
   eyebrow:'Bone three and five',
   h2:'Plot and structure.',
   p:'Plot is cause and consequence, not the order events happened in. Structure is the deliberate shape you choose so the reader feels built tension, release, and arrival.',
   sub:'This is where a timeline becomes a book.'},

  {t:'content',
   eyebrow:'Bone four',
   h2:'You, as a character.',
   p:'The hardest turn in memoir is seeing yourself the way you would see a character you invented: with distance, curiosity, and the freedom to let them be flawed.',
   sub:'The narrator remembers. The character acts, wants, and changes on the page.'},

  {t:'content',
   eyebrow:'Bone six',
   h2:'Antagonistic forces.',
   p:'Something has to push. In a true story the pressure is rarely a villain. It is time, silence, the family story, the version of yourself you were trying to leave.',
   sub:'Name the forces and the scenes start writing themselves.'},

  {t:'part', part:'Part Three', h2:'Dangerous writing: truth over comfort'},

  {t:'content',
   eyebrow:'The lineage',
   h2:'Where this craft comes from.',
   p:'The bones give a story its shape. Dangerous writing gives it its blood. The method descends from Gordon Lish through Tom Spanbauer: writing from the wound, putting the body and the real feeling on the page.',
   sub:'Truth over comfort. The reader can always tell when a writer flinched.'},

  {t:'content',
   eyebrow:'On the page',
   h2:'Scene over summary.',
   p:'A chapter that lands does not tell the reader what happened. It puts them in the room, in the body, in the moment, and lets them feel it with you.',
   sub:'Craft is simply the set of choices that make that happen on purpose instead of by luck.'},

  {t:'why',
   eyebrow:'Who is teaching this',
   h2:'Jennifer Lauck.',
   p:'Author of the New York Times bestseller Blackbird, translated into 22 languages and a bestseller across Europe. Four published memoirs. Featured on The Oprah Show, in Newsweek, People, and Writer’s Digest.',
   sub:'Thirty years of writing, and a decade teaching serious writers to finish the book only they can write.'},

  {t:'content',
   eyebrow:'How the work gets made',
   h2:'The long arc, not the quick fix.',
   p:'A real book is made over a real stretch of time, inside honest feedback and a small room of other serious writers. That is the whole philosophy of the studio.',
   sub:'Truth over comfort. Depth over marketplace. Lineage over formula. The long arc over the quick fix.'},

  {t:'cta',
   eyebrow:'Where to begin',
   h2:'Start with the bones.',
   step:'Begin with the free Bones of Storytelling class, then step into a Studio when you are ready for the long arc.',
   sub:'Bring the true story you cannot stop carrying. We will teach you how to give it a spine and set it free.',
   disc:'This masterclass is educational and teaches craft. No publication, sales, income, or specific result is guaranteed. Results vary from writer to writer, and depend on the work each writer puts in.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.part) h += '<div class="part">'+s.part+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.part && s.h2) h += '<div class="rule"></div>';
  if(s.big) h += '<div class="rule"></div><div class="big">'+s.big+'</div>';
  if(s.lede) h += '<p class="lede">'+s.lede+'</p>';
  if(s.p) h += '<p>'+s.p+'</p>';
  if(s.step) h += '<div class="cta-step">'+s.step+'</div>';
  if(s.items){ h += '<ul>'; s.items.forEach(it=>{ h += '<li><span class="b">'+it[0]+'</span>'+it[1]+'</li>'; }); h += '</ul>'; }
  if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
  if(s.presenter) h += '<div class="presenter">'+s.presenter+'</div>';
  if(s.disc) h += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
