<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Roof Tells the Truth · John The Roof Pro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Khand:wght@400;500;600;700&family=Work+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#211E1B; --panel:#2D2926; --rule:#4A443E;
    --accent:#D33A2C; --chalk:#EDE9E1; --grey:#B8AFA3; --dim:#8B8175;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Work Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Work Sans',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Khand',Georgia,serif;font-weight:600;color:var(--chalk);line-height:1.06;letter-spacing:.002em;text-transform:none}
  .t-title h1{font-size:5.6vw}
  .t-normal h1{font-size:3.7vw;max-width:86%}
  .t-normal .body{font-family:'Work Sans',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:75%;line-height:1.55;font-weight:300}
  .sub{font-family:'Work Sans',sans-serif;font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Work Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:90%}
  .t-section .rule{width:17vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#33302B 0%,#151310 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.2vw;max-width:88%;color:#F3F0E9}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#3A211E 0%,#151310 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.4vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:#F3C9C2;border-radius:4px;padding:1.3vh 1.7vw;font-family:'Work Sans',sans-serif;font-size:1.22vw;font-weight:600;letter-spacing:.02em}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-family:'Work Sans',sans-serif;font-size:.88vw;color:var(--dim);text-align:center;line-height:1.42;font-weight:300}
  .t-title .disc{text-align:left}
  .course-motif{position:absolute;pointer-events:none}
  .title-course{right:7%;bottom:8%;width:24vw;opacity:.95}
  .corner-course{right:6%;bottom:7%;width:11vw;opacity:.4}
  .brandline{font-family:'Khand',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Work Sans',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Work Sans',sans-serif;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Work Sans',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.7vw}.t-title h1{font-size:9vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.4vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.7vw}.brandline{font-size:3.2vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">The Roof Tells the Truth</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- stacked shingle courses climbing to a single node / craft motif -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="course" viewBox="0 0 260 160">
  <g stroke-linecap="square">
    <g fill="none" stroke="#8B8175" stroke-width="6" opacity="0.28">
      <line x1="18" y1="140" x2="242" y2="140"/>
      <line x1="30" y1="118" x2="230" y2="118"/>
      <line x1="46" y1="96" x2="214" y2="96"/>
      <line x1="66" y1="74" x2="194" y2="74"/>
      <line x1="88" y1="52" x2="172" y2="52"/>
    </g>
    <g fill="none" stroke="#D33A2C" stroke-width="6">
      <line x1="18" y1="140" x2="96" y2="140"/>
      <line x1="30" y1="118" x2="98" y2="118"/>
      <line x1="46" y1="96" x2="104" y2="96"/>
      <line x1="66" y1="74" x2="112" y2="74"/>
      <line x1="88" y1="52" x2="130" y2="52"/>
    </g>
    <circle cx="130" cy="30" r="7" fill="none" stroke="#D33A2C" stroke-width="4"/>
    <line x1="130" y1="52" x2="130" y2="37" stroke="#D33A2C" stroke-width="4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Roof Tells the Truth',sub:'Turn a partial approval into a full replacement. Ethically, with evidence, on the roof.',brand:true,course:'title'},
 {t:'normal',k:'Who this is for',title:'You lose the biggest jobs on the roof, not at the door.',body:'The adjuster approved a partial when the homeowner was owed a full replacement, and you had no way to prove otherwise. The rep who can talk loses to the rep who can prove it.'},
 {t:'dark',title:'You do not win the full replacement by talking harder. You win it by knowing what you are standing on.'},

 {t:'section',idx:'Part One',title:'Why Great Talkers Lose to Great Inspectors'},
 {t:'normal',k:'The craft reframe',title:'The sale is won with facts, not with pressure.',body:'Homeowners and adjusters both trust the person who reads the roof like a system and documents what they find. Product knowledge is the persuasion engine, not the pitch.'},
 {t:'normal',k:'The real cost',title:'No evidence, no leverage.',body:'When you cannot identify the shingle or prove a repair was tried, the partial approval stands. What you lose is the full replacement the homeowner was actually owed.'},
 {t:'dark',title:'The roof tells the truth. Your job is to read it and write it down.'},

 {t:'section',idx:'Part Two',title:'The C.A.R. Approach'},
 {t:'normal',k:'C, Compatibility',title:'Read the roof as a system.',body:'Do the shingles and components actually work together? Most reps miss the mismatches that decide whether a repair can ever be code compliant and watertight.'},
 {t:'normal',k:'A, Availability',title:'Find out if the product is discontinued.',body:'Spot a discontinued or incompatible shingle and the whole claim changes. This is the leverage point, and a lab backed identification is what makes it undeniable.'},
 {t:'normal',k:'R, Repairability',title:'Document that a real repair was attempted.',body:'Objective, photographed repair attempts prove whether the roof can or cannot be repaired. That evidence is what converts a partial into the full replacement, legitimately.'},
 {t:'dark',title:'Compatibility, Availability, Repairability. The engine that turns a partial into a full, by the evidence.'},

 {t:'section',idx:'Part Three',title:'The Professional Standard'},
 {t:'normal',k:'Homeowner first',title:'Protecting the homeowner wins the trust and the job.',body:'This is never about gaming a carrier or manufacturing damage. It is about getting the homeowner the full, correct roof they are entitled to, and being the professional who can prove it.'},
 {t:'normal',k:'Why me',title:'The discontinued-shingle authority, with the receipts.',body:'I co-founded Name That Shingle, the lab built to identify discontinued and hard-to-match shingles. I built the C.A.R. Approach, I emcee the SRC Summit, and I have spent years turning the craft into a system reps can run.'},

 {t:'section',idx:'Your next step',title:'Master the Craft'},
 {t:'normal',k:'How I can help',title:'Learn to be undeniable on the roof.',body:'In my live classes and team training I teach the full C.A.R. Approach, discontinued-shingle identification, and the documentation file that holds up. It is the same craft I use in the field, taught the way I actually work.'},
 {t:'cta',title:'Ready to win the jobs you are losing on the roof?',chips:['Join the next live class','Apply to train with John'],disc:'Educational content for roofing sales professionals. No income, sales, or claim-approval result is guaranteed. Results vary by rep, roof, and market. Documentation is legitimate, evidence-based, homeowner-protective advocacy, never a way to game an insurer.'},
];

const deck=document.getElementById('deck');
function course(kind){return `<svg class="course-motif ${kind==='title'?'title-course':'corner-course'}"><use href="#course"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">John <b>The Roof Pro</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.course) h+=course(s.course);
  else if(s.t==='title') h+=course('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
