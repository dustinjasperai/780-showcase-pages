<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Growing Your Dental Business — Penny Reed · Dental Growth Officer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1B1512; --panel:#241C17; --rule:#3A2E27;
    --clay:#D97757; --sage:#B7AD93; --chalk:#F6F0E8; --grey:#D6CBC0; --dim:#8A7A6E;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Manrope',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--clay);margin-bottom:2.4vh}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4.7vw}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Manrope',sans-serif;font-size:1.4vw;font-weight:600;color:var(--sage);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--clay),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#33241d 0%,#0D0907 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:86%;font-style:italic;color:#F1E9DE}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#33241d 0%,#0D0907 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--clay);color:#F2CBB4;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .rise-motif{position:absolute;pointer-events:none;opacity:.9}
  .title-rise{right:7.5%;bottom:8%;width:20vw}
  .corner-rise{right:6%;bottom:7.5%;width:9vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--clay);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--clay);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Growing Your Dental Business</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rise" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="136" x2="246" y2="136" stroke="#B7AD93" opacity="0.4"/>
    <path d="M30 130 H86 V102 H142 V72 H198 V40" stroke="#D97757" opacity="0.9"/>
    <path d="M40 130 H90 V108 H146 V82 H200 V54" stroke="#F6F0E8" opacity="0.14"/>
    <circle cx="198" cy="40" r="5" fill="none" stroke="#D97757" stroke-width="2.6"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Growing Your Dental Business',sub:'Why the practices that grow fastest fix the conversation before they raise the marketing spend.',brand:true,rise:'title'},
 {t:'normal',k:'Who this is for',title:'You built a good practice. Growth still feels stuck.',body:'You have the clinical skill, a team, and a full schedule. But the number of patients who say yes to the treatment plan they need has not moved much in years, no matter what you have tried on the marketing side.'},
 {t:'dark',title:'More new-patient ads will not fix a conversation problem.'},

 {t:'section',idx:'Part One',title:'The Real Growth Trap'},
 {t:'normal',k:'Where owners look first',title:'Most growth plans start with more leads.',body:'A new website, a referral push, a bigger ad budget. All of it aimed at getting more people into the chair, while the conversation that happens once they are already there stays exactly the same.'},
 {t:'normal',k:'What it actually costs',title:'A stalled case-acceptance conversation loses patients you already have.',body:'Every treatment plan a patient defers or declines is a patient your marketing already paid for. If the team is not having the same conversation the same way, the practice is leaking revenue it worked to earn.'},
 {t:'dark',title:'Growth is not a marketing problem first. It is a conversation problem.'},

 {t:'section',idx:'Part Two',title:'The Three Pillars'},
 {t:'normal',k:'Pillar one',title:'Case acceptance is a behavioral conversation, not a paperwork one.',body:'Patients say yes when the financial conversation matches how they actually take in information and make decisions, not when the presentation is simply repeated louder or slower. This is where a Dale Carnegie background and behavioral-consultant training change the numbers.'},
 {t:'normal',k:'Pillar one, applied',title:'The same treatment plan, presented differently, gets a different answer.',body:'Two patients hearing the identical recommendation and the identical price will decide differently depending on how the conversation is built around them. Training the team in that difference is the fastest lever most practices never pull.'},
 {t:'normal',k:'Pillar two',title:'Team culture runs on behavioral accountability, not reminders.',body:'A team that understands its own communication and behavioral styles holds itself to defined roles and follow-through, instead of the owner re-checking every task. Accountability becomes a system the team runs, not a habit the owner enforces.'},
 {t:'normal',k:'Pillar three',title:'New-patient marketing works once the first two pillars hold.',body:'A real system for attracting new patients, built past referrals alone, only pays off once the practice can actually convert and retain the patients it already earns. Marketing amplifies what the practice already does well, for better or worse.'},
 {t:'dark',title:'Case Acceptance. Team Culture. New Patients. One conversation runs through all three.'},

 {t:'section',idx:'Part Three',title:'What This Looks Like In Your Practice'},
 {t:'normal',k:'The shift',title:'Case-acceptance rates move before a single new lead arrives.',body:'Because the first fix lives inside conversations the practice is already having, with patients already in the schedule. The team learns to run the same effective conversation instead of guessing which approach lands.'},
 {t:'normal',k:'Why this approach',title:'30-plus years inside dental practices, not theory.',body:'Recognized as a Dentistry Today "Leader in Dental Consulting" every year since 2007. Former Dale Carnegie trainer and certified behavioral consultant through the Institute for Motivational Living. Author of Growing Your Dental Business.'},
 {t:'dark',title:'A practice that grows because the conversation changed, not because you spent more.'},

 {t:'section',idx:'Your next step',title:'Growing Your Dental Business, In Your Practice'},
 {t:'normal',k:'How I can help',title:'The same approach the book teaches, applied to your team.',body:'A growth-strategy engagement covering case acceptance, team culture and accountability, and new-patient systems, built around your practice and your numbers, drawn from the same behavioral training behind Growing Your Dental Business.'},
 {t:'cta',title:'Ready to fix the conversation before you spend another dollar on leads?',chips:['Read Growing Your Dental Business','Book a growth strategy call'],disc:'Educational content for dental practice owners. No income, revenue, or case-acceptance result is guaranteed. Results vary by practice, team, and market.'},
];

const deck=document.getElementById('deck');
function rise(kind){return `<svg class="rise-motif ${kind==='title'?'title-rise':'corner-rise'}"><use href="#rise"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Penny Reed · <b>Dental Growth Officer</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.rise) h+=rise(s.rise);
  else if(s.t==='title') h+=rise('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
