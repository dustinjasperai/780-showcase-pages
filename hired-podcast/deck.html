<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hired From the Other Side of the Table — a MoveUp Careers masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f1e8; --panel:#fffdf8; --rule:#d8cdbb; --ink:#23201c;
    --muted:#6b6256; --accent:#d9532e; --deep:#2b2622;
    --head:'Spectral',Georgia,serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--deep)}
  body{font-family:var(--body);color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
  .slide{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;padding:8vh 9vw;background:var(--bg);
    border-bottom:1px solid var(--rule);position:relative}
  .slide .num{position:absolute;top:4vh;right:6vw;font-size:12px;letter-spacing:.18em;
    color:var(--muted);text-transform:uppercase}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,5.6vw,68px);line-height:1.05;
    letter-spacing:-.01em;max-width:16ch}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(28px,4vw,48px);line-height:1.1;
    max-width:20ch}
  .lead{font-size:clamp(18px,2.1vw,26px);line-height:1.5;max-width:30ch;color:var(--deep);
    margin-top:26px;font-weight:400}
  .body{font-size:clamp(16px,1.6vw,20px);line-height:1.6;max-width:40ch;color:var(--muted);
    margin-top:20px}
  .slide.title{background:var(--deep);color:var(--bg);border-bottom:none}
  .slide.title h1{color:var(--bg)}
  .slide.title .lead{color:#e8dfce}
  .slide.title .by{margin-top:40px;font-size:15px;letter-spacing:.04em;color:#cdbfa6}
  .slide.part{background:var(--accent);color:#fff;border-bottom:none}
  .slide.part .kicker{color:#ffe3d6}
  .slide.part h2{color:#fff;max-width:24ch}
  .slide.reframe{background:var(--deep);color:var(--bg)}
  .slide.reframe h2{color:var(--bg)}
  .slide.reframe .body{color:#e8dfce}
  ul.points{list-style:none;margin-top:30px;max-width:46ch}
  ul.points li{font-size:clamp(16px,1.7vw,21px);line-height:1.45;padding:16px 0;
    border-top:1px solid var(--rule);color:var(--deep)}
  ul.points li b{font-family:var(--head);font-weight:600;color:var(--ink)}
  .bio{display:flex;flex-direction:column;gap:14px;max-width:44ch;margin-top:24px}
  .bio .row{font-size:16px;line-height:1.5;color:var(--muted);padding-left:18px;
    border-left:3px solid var(--accent)}
  .cta-steps{margin-top:28px;max-width:40ch}
  .cta-steps div{font-size:18px;line-height:1.5;padding:12px 0;border-bottom:1px solid var(--rule)}
  .disc{margin-top:36px;font-size:13px;line-height:1.5;color:var(--muted);max-width:52ch;
    font-style:italic}
  .hint{position:fixed;bottom:14px;left:0;right:0;text-align:center;font-size:12px;
    letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.45);pointer-events:none}
</style>
</head>
<body>
<div id="deck"></div>
<div class="hint">scroll</div>
<script>
const S=[
  {t:'title', kicker:'A MoveUp Careers masterclass',
   h:'Hired From the Other Side of the Table',
   lead:'How to win the interview and the offer once you can see what the hiring side is actually deciding.',
   by:'With Matthew Sorensen, former VP of Talent Acquisition and host of the Hired podcast'},

  {t:'promise', kicker:'What you will leave with',
   h:'You will stop guessing what they want',
   body:'By the end you will read any interview from the employer seat, answer the three questions that actually decide the offer, and talk money like someone who has sat on the side that signs off on it.'},

  {t:'who', kicker:'Who this is for',
   h:'Experienced professionals in a job search',
   body:'You keep reaching final rounds, or final offers, and you keep feeling like the decision happened in a room you were not in. It did. This class takes you into that room.'},

  {t:'trap', kicker:'The trap',
   h:'You did everything the advice said',
   body:'Polished resume. STAR stories. The safe answer to the weakness question. And you are still getting a kind no after the final round. The advice is not wrong. It is just written for the wrong side of the table.'},

  {t:'reframe', kicker:'The uncomfortable part',
   h:'The interview was never a test of how good you are',
   body:'It is a risk assessment the hiring side runs on you. Every answer is scored against one quiet question: can we defend hiring this person to the team. Nobody ever shows you that scorecard. Today you get it.'},

  {t:'part', kicker:'Part one', h:'Why strong candidates still lose'},

  {t:'point', kicker:'The gap',
   h:'You answer the question. They listen for the one underneath it.',
   body:'When they ask about a weakness, they are not collecting a weakness. They are checking whether you can see yourself clearly and whether you are a risk. Answer the question they are really asking and you move to the top of the list.'},

  {t:'point', kicker:'Before you ever speak',
   h:'There are fourteen silent screens before the callback',
   body:'Most candidates never get to the interview because of what happens in the first thirty seconds of a resume scan. We will name the screens that quietly disqualify you, and the small fixes that get you back in the room.'},

  {t:'part', kicker:'Part two', h:'Interviewing from the other side of the table'},

  {t:'points', kicker:'The core moves', h:'Four things the hiring side scores',
   items:[
     ['Top three strengths, plus a bonus','One strength that maps to the role, one proven in a past role, one that is personal but useful at work, and a bonus that maps to their culture.'],
     ['The weakness question, three ways','A weakness you are actively fixing, a minor one that does not touch the job, and a human one that breaks the tension. Each signals something different and all three signal self awareness.'],
     ['Be the solution, not the applicant','Frame every answer around the problem they are hiring to solve, so they stop comparing you to other candidates and start picturing the problem gone.'],
     ['Talk teamwork like a future hire','Share credit the way a leader does, so collaboration reads as judgment, not as hiding in the group.']
   ]},

  {t:'part', kicker:'Part three', h:'Winning the offer'},

  {t:'point', kicker:'The number',
   h:'The offer is a conversation, not a verdict',
   body:'Anchor with the market data for the role, give one clear reason, and then stop talking. Silence is the most underused move in salary negotiation, and it is the one the hiring side expects from the people they respect.'},

  {t:'point', kicker:'One full loop',
   h:'The same round, played from the other side',
   body:'We walk one full loop from first screen to signed offer, and at each step you see what the hiring side was thinking and the move that changes their read of you. Not a script to memorize. A lens you keep.'},

  {t:'bio', kicker:'Why me',
   h:'I spent my career on the side that decides',
   rows:['Former executive recruiter and search firm owner',
         'Former VP of Talent Acquisition, screening and selecting candidates',
         'Host of the Hired podcast, rated 4.9 out of 5 across hundreds of reviews',
         'This class is that view, handed to you'] },

  {t:'recap', kicker:'The three things to keep', h:'If you remember nothing else',
   items:[
     ['Answer the question underneath the question','They are scoring risk, not trivia.'],
     ['Be the solution, not the applicant','Make them picture the problem solved.'],
     ['Anchor, give one reason, then stop talking','The offer is a conversation you are allowed to lead.']
   ]},

  {t:'cta', kicker:'For your next search',
   h:'Work with MoveUp Careers',
   steps:['Keep listening to the Hired podcast for the weekly breakdowns',
          'When you are in an active search, bring MoveUp in to prepare the interviews and the offer with you',
          'You walk in able to see the whole decision, not just your side of it'],
   disc:'This masterclass is education, not a promise. Results vary from person to person and no specific job, raise, or salary outcome is guaranteed. Nothing here is legal or financial advice.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide '+s.t;
  let html='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.h){ html += (s.t==='title') ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>'; }
  if(s.lead) html+='<p class="lead">'+s.lead+'</p>';
  if(s.body) html+='<p class="body">'+s.body+'</p>';
  if(s.by) html+='<p class="by">'+s.by+'</p>';
  if(s.rows){ html+='<div class="bio">'; s.rows.forEach(r=>html+='<div class="row">'+r+'</div>'); html+='</div>'; }
  if(s.items){ html+='<ul class="points">'; s.items.forEach(it=>html+='<li><b>'+it[0]+'.</b> '+it[1]+'</li>'); html+='</ul>'; }
  if(s.steps){ html+='<div class="cta-steps">'; s.steps.forEach(st=>html+='<div>'+st+'</div>'); html+='</div>'; }
  if(s.disc) html+='<p class="disc">'+s.disc+'</p>';
  sec.innerHTML=html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
