<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Effortless Academic System Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;1,500&family=Archivo:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2f1ed;        /* their body paper (light scheme) */
    --panel:#ffffff;
    --tint:#e9dfd2;      /* their secondary tan */
    --ink:#212725;       /* their heading ink */
    --muted:#5c5f5a;
    --rule:#d8d3c7;
    --accent:#ff8c00;    /* deepened form of brand #ffa500 for contrast on paper */
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Archivo",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px 52px;margin:0 0 28px;position:relative;min-height:380px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(33,39,37,.03)}
  .slide .kicker{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin:0 0 18px;display:flex;align-items:center;gap:10px}
  .kicker .dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block}
  h1{font-family:"Lora",Georgia,serif;font-weight:600;font-size:46px;line-height:1.08;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:"Lora",Georgia,serif;font-weight:600;font-size:34px;line-height:1.12;margin:0 0 16px}
  p{font-size:19px;line-height:1.55;color:var(--ink);margin:0 0 14px;max-width:62ch}
  p.sub{font-size:21px;color:var(--muted);font-family:"Lora",Georgia,serif;font-style:italic}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:18.5px;line-height:1.5;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule);max-width:64ch}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:21px;width:10px;height:1.5px;background:var(--accent)}
  li b{font-weight:600}
  .lead{font-size:23px;line-height:1.45;max-width:58ch}
  .big{font-family:"Lora",Georgia,serif;font-size:40px;line-height:1.14;font-weight:600;max-width:20ch}
  .step-no{font-family:"Lora",Georgia,serif;font-size:18px;color:var(--accent);font-weight:600;letter-spacing:.04em}
  .panel-tint{background:var(--tint);border-color:#cfc6b6}
  .meta{position:absolute;bottom:20px;right:28px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .brand{position:absolute;bottom:20px;left:28px;font-size:12px;color:var(--muted);letter-spacing:.08em;font-weight:600}
  .quote{font-family:"Lora",Georgia,serif;font-style:italic;font-size:26px;line-height:1.4;max-width:30ch;color:var(--ink)}
  .cta-steps li::before{background:none;content:"→";color:var(--accent);top:12px;font-weight:700}
  .disclaimer{margin-top:22px;font-size:13.5px;color:var(--muted);line-height:1.5;border-top:1px solid var(--rule);padding-top:14px;max-width:70ch}
  @media(max-width:640px){.slide{padding:36px 26px}h1{font-size:34px}h2{font-size:27px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Masterclass deck. Ilya Shabanov / The Effortless Academic.
   Content lives in const S. His IP, his audience, his CTA. */
const S = [
  {t:'title',
    k:'A live masterclass',
    h:"Turn Everything You Read Into Published Research",
    sub:"The Effortless Academic System, with Ilya Shabanov",
    note:"How to build one linked knowledge base that reads, remembers, and helps you write."},

  {t:'promise',
    k:'What you will walk away with',
    h:"By the end of this session",
    list:[
      "A clear picture of the <b>Research Wiki</b>: one place where every paper you read actually stays.",
      "The four steps of the <b>Effortless Academic System</b>, start to finish.",
      "How to put AI to work on <b>your own notes</b>, not the open internet.",
      "A realistic path to finishing papers faster, with less rewriting."]},

  {t:'audience',
    k:'Who this is for',
    h:"If this sounds like your week",
    list:[
      "You are a <b>PhD student, postdoc, or researcher</b> reading more than you can remember.",
      "Your notes are scattered across folders, PDFs, and three apps you forgot about.",
      "Every literature review feels like starting from zero.",
      "You want to use AI, but you do not want it to make things up."]},

  {t:'trap',
    k:'The trap',
    h:"You read hundreds of papers. You keep almost none of it.",
    lead:"You highlight, you take notes, you mean to come back. Six months later the highlights are a graveyard and the ideas are gone. The work was real. The system to hold it was not."},

  {t:'reframe',
    k:'The real problem',
    big:"It is not your memory or your discipline. Your knowledge just was never connected.",
    note:"Linear notes pile up. Linked notes compound. That one difference is what makes research feel effortless or endless."},

  {t:'part',
    k:'Part one',
    h:"Why the usual way breaks down",
    list:[
      "Notes live <b>where you took them</b>, trapped in one PDF, one doc, one lecture.",
      "Nothing talks to anything else, so patterns across papers stay invisible.",
      "When it is time to write, you are rebuilding the argument from scratch every time.",
      "More reading makes it worse, not better."]},

  {t:'engine',
    k:'The core idea',
    h:"Source → topic → argument",
    lead:"Capture at the <b>source</b> level, synthesize into <b>topics</b>, then assemble topics into <b>arguments</b>. The argument is the paper. By the time you write, the thinking is already done."},

  {t:'part',
    k:'Part two: the method',
    h:"The Effortless Academic System",
    sub:"Four steps that turn reading into writing.",
    note:"Not another app to abandon. One system that gets stronger every time you use it."},

  {t:'step', n:'Step 1',
    k:'The Effortless Academic System',
    h:"Build a Research Wiki",
    lead:"A Wikipedia for your research: interlinked notes, deep-linked straight into the PDF they came from, every claim backed by a source you can click. Your field, in your own words, in one place."},

  {t:'step', n:'Step 2',
    k:'The Effortless Academic System',
    h:"Add your lit-review tools",
    lead:"Plug in the tools that find, triage, and map the literature, so new papers flow into the wiki instead of piling up in a downloads folder."},

  {t:'step', n:'Step 3',
    k:'The Effortless Academic System',
    h:"Integrate AI",
    lead:"Point AI at your own notes, not the open web. It summarizes, connects, and drafts from sources you trust, so the output is grounded in what you actually read."},

  {t:'step', n:'Step 4',
    k:'The Effortless Academic System',
    h:"Cultivate and nourish",
    lead:"The wiki is alive. A few minutes per paper keeps it growing, so the system is strongest exactly when a deadline arrives."},

  {t:'proof',
    k:'Inside the Research Wiki',
    h:"One knowledge base, built over time",
    list:[
      "A personal research wiki that grew to <b>500,000+ words</b> across thousands of notes and PDFs.",
      "Every note deep-links into the exact page of the paper it came from.",
      "Claims carry their sources, so citations are never a scramble.",
      "Ask it a question and the answer comes from <b>your</b> library."]},

  {t:'payoff',
    k:'Writing and publishing with AI',
    h:"From notes to a draft, not a blank page",
    lead:"When your knowledge is linked and your AI reads from it, writing changes shape. You draft collaboratively with AI in the loop, pulling from your own sources. Faster papers, fewer errors, far less revision back and forth."},

  {t:'reframe',
    k:'The shift',
    big:"You stop writing from memory and start writing from a system that remembers for you.",
    note:"That is the difference between an exhausting PhD and an effortless one."},

  {t:'credibility',
    k:'Why me',
    quote:"I switched fields at 36, started a PhD in biology, and finished in about two and a half years with four first-author papers.",
    note:"I am Ilya Shabanov. I did not do that on talent or extra hours. I did it by building the system you just saw, and I have been teaching it to researchers ever since at The Effortless Academic."},

  {t:'payoff',
    k:'What becomes possible',
    h:"The effortless academic",
    list:[
      "Lit reviews that start from a library, not a blank screen.",
      "Ideas that connect themselves because the notes are linked.",
      "AI that works for you without inventing sources.",
      "Research that feels like building, not drowning."]},

  {t:'cta',
    k:'Your next step',
    h:"Start building your system",
    steps:[
      "Take the <b>free 21-day email course</b> and set up your first Research Wiki.",
      "When you are ready to go deeper, the <b>Effortless Academic</b> courses walk you through every step.",
      "Find it all at <b>effortlessacademic.com</b>."],
    disclaimer:"This masterclass is for educational purposes only. It shares a research and writing workflow, not academic, career, or financial advice. Individual results vary and are not guaranteed; your outcomes depend on your own field, effort, and circumstances."}
];

const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='part'||s.t==='title' ? ' panel-tint' : '');
  let html = '';
  if(s.k) html += '<div class="kicker"><span class="dot"></span>'+s.k+'</div>';
  if(s.n) html += '<div class="step-no">'+s.n+'</div>';
  if(s.h) html += (i===0 ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.big) html += '<p class="big">'+s.big+'</p>';
  if(s.quote) html += '<p class="quote">“'+s.quote+'”</p>';
  if(s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if(s.list){ html += '<ul>'; s.list.forEach(x=> html += '<li>'+x+'</li>'); html += '</ul>'; }
  if(s.steps){ html += '<ul class="cta-steps">'; s.steps.forEach(x=> html += '<li>'+x+'</li>'); html += '</ul>'; }
  if(s.note) html += '<p style="color:var(--muted);margin-top:16px">'+s.note+'</p>';
  if(s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  html += '<div class="brand">THE EFFORTLESS ACADEMIC</div>';
  html += '<div class="meta">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
