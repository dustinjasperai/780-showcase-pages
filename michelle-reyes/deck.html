<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Own Your Voice, Own the Room — Dr. Michelle Reyes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#efecea; --panel:#f6f2ef; --ink:#33373d; --muted:#69727d;
    --accent:#28544d; --accent2:#b55c47; --rule:#d9d2cc;
    --head:'Spectral',Georgia,serif; --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 56px;margin:0 0 26px;min-height:360px;display:flex;flex-direction:column;justify-content:center}
  .slide.title{background:var(--accent);color:#f5f1ec;border:none}
  .slide.title .kicker,.slide.title .sub{color:#e7ded6}
  .slide.cta{background:var(--accent);color:#f5f1ec;border:none}
  .slide.cta .sub,.slide.cta .disc{color:#e7ded6}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent2);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:700;font-size:48px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:600;font-size:34px;line-height:1.14;margin:0 0 16px}
  .sub{font-size:20px;color:var(--muted);margin:0 0 6px}
  p.body{font-size:19px;margin:0 0 14px;max-width:62ch}
  ul{margin:10px 0 0;padding:0 0 0 2px;list-style:none}
  li{font-size:19px;margin:0 0 14px;padding-left:30px;position:relative;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;background:var(--accent2)}
  .quote{font-family:var(--head);font-style:italic;font-size:30px;line-height:1.25;color:var(--accent);margin:0;max-width:24ch}
  .who{font-size:17px;color:var(--muted);margin-top:16px}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch}
  .n{font-family:var(--head);font-size:15px;color:var(--accent2);font-weight:600;letter-spacing:.12em;text-transform:uppercase;margin:0 0 10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"title", kicker:"Success Culture, with Dr. Michelle Reyes",
   h:"Own Your Voice, Own the Room",
   sub:"A live masterclass on leading as yourself, without code-switching to survive."},

  {t:"who", kicker:"Who this is for",
   h:"You have ideas. You keep filtering them first.",
   body:"If you have ever watered down a thought before it left your mouth, just to be taken seriously in the room, this hour is for you.",
   who:"For leaders who do not fit the dominant culture: people of color, women in male-dominated fields, neurodivergent leaders, and anyone leading across difference."},

  {t:"trap", kicker:"The trap",
   h:"You were taught your voice needed editing.",
   body:"Somewhere along the way you learned to adapt how you speak to reflect the majority culture, as if you needed their permission and their stamp of approval. So you shrank to fit. And it cost you."},

  {t:"hook",
   quote:"We are not born doubting ourselves. That is taught."},

  {t:"part", n:"Part One", h:"The real problem is not confidence."},

  {t:"problem", kicker:"Code-switching",
   h:"The chameleon effect",
   body:"Code-switching is the strategy of altering your language, behavior, and appearance to fit a dominant culture. It is survival. And most leaders who do it are not short on skill or courage.",
   who:"It shows up as self-censoring in meetings, prefacing your idea with this might be dumb, and staying invisible on purpose."},

  {t:"diagnosis",
   quote:"What you think you need is confidence. What you actually need is language."},

  {t:"diagnosis2", kicker:"The shift",
   h:"Language changes everything.",
   body:"When you have the words to name who you are and how you lead, speaking up stops feeling risky. You can organize your thoughts, contribute clearly, and be taken seriously, as yourself."},

  {t:"part", n:"Part Two", h:"The Success Culture method"},

  {t:"frame", n:"Framework 1", h:"Code Unmasking",
   body:"Code unmasking is dropping the facade worn to appear normal or acceptable to others. Where code-switching hides who you are, code unmasking reveals it.",
   who:"The result: less anxiety, more visibility, and the freedom to make real contributions around people who are different from you."},

  {t:"frame", n:"Framework 2", h:"Value-Forward Positioning",
   body:"A way to name your strengths so others recognize and respect them, and to shift how you are seen in meetings, reviews, and leadership conversations.",
   who:"Without over-explaining. Without performing. Without muting your personality or your values."},

  {t:"frame", n:"Framework 3", h:"Aligned Authority",
   body:"Claiming your voice and leading from who you already are, instead of conforming to a mold that was never built for you.",
   who:"Authority that is aligned with your identity holds up under pressure. Borrowed authority does not."},

  {t:"capacity", kicker:"The reframe underneath it all",
   h:"Your culture is not a liability.",
   body:"It is a capacity to steward. The very things you were taught to hide are often the source of your clearest judgment and your deepest connection with the people you lead."},

  {t:"part", n:"Part Three", h:"Leading in the room, unmasked"},

  {t:"after", kicker:"After the shift",
   h:"You stop translating yourself.",
   list:["You articulate ideas with authority, without flattening your personality",
         "You name what you bring, so the room recognizes it",
         "You lead conversations instead of bracing through them",
         "You show up as yourself, anywhere, anytime"]},

  {t:"why", kicker:"Why me",
   h:"I have lived this, and taught it.",
   body:"I am Dr. Michelle Reyes, award-winning author of Becoming All Things and founder of Success Culture Coaching. Over fifteen years I have helped more than a thousand leaders engage across difference with confidence and care.",
   who:"I teach cultural engagement at the university level, with guest lectures at Harvard, Yale, and Vanderbilt, and I serve as Vice President of the Asian American Christian Collaborative."},

  {t:"cta", cls:"cta", kicker:"Your next step",
   h:"Come lead as yourself.",
   sub:"Join the live masterclass, then let us map what leading without the mask looks like for you.",
   disc:"This masterclass is educational. No income, role, promotion, or result is guaranteed, and outcomes vary by person and context. You bring the work, and we bring the language."}
];

const deck = document.getElementById("deck");
for (const s of S){
  const el = document.createElement("section");
  el.className = "slide" + (s.cls ? " " + s.cls : "");
  let html = "";
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if (s.n) html += '<div class="n">'+s.n+'</div>';
  if (s.h) html += (s.t==="title" ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if (s.quote) html += '<p class="quote">'+s.quote+'</p>';
  if (s.body) html += '<p class="body">'+s.body+'</p>';
  if (s.list){ html += '<ul>'; for (const it of s.list) html += '<li>'+it+'</li>'; html += '</ul>'; }
  if (s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if (s.who) html += '<p class="who">'+s.who+'</p>';
  if (s.disc) html += '<p class="disc">'+s.disc+'</p>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
