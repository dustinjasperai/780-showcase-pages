<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Signature Talk — a Speaking Your Brand Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7fb;        /* light tint of the dominant brand purple #783573 */
    --panel:#ffffff;
    --rule:#e8dcec;      /* desaturated tint of #783573 */
    --accent:#783573;    /* dominant brand hex (161 uses) */
    --accent2:#f47d63;   /* her coral button hex (20 uses) */
    --ink:#2a1f2e;       /* deep plum-charcoal */
    --muted:#6a5b6d;
    --disp:'Poppins',system-ui,sans-serif;
    --serif:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--serif)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 60px;margin:0 0 28px;min-height:480px;
    display:flex;flex-direction:column;justify-content:center;position:relative;
    box-shadow:0 10px 34px rgba(120,53,115,.06);overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .kicker{font-family:var(--disp);font-weight:600;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  .part-label{font-family:var(--disp);font-weight:700;letter-spacing:.05em;text-transform:uppercase;
    font-size:15px;color:var(--accent2);margin-bottom:14px}
  h1{font-family:var(--disp);font-weight:700;font-size:58px;line-height:1.03;letter-spacing:-.02em;color:var(--ink)}
  h2{font-family:var(--disp);font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
  .sub{font-family:var(--serif);font-size:23px;line-height:1.45;color:var(--muted);margin-top:22px;max-width:40ch}
  p.body{font-size:22px;line-height:1.55;color:var(--ink);margin-top:18px;max-width:52ch}
  .big{font-size:34px;line-height:1.28;font-family:var(--serif);color:var(--ink);max-width:46ch}
  .foot{font-family:var(--disp);font-weight:500;font-size:19px;color:var(--accent);margin-top:34px}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
  li{font-size:21px;line-height:1.4;padding-left:34px;position:relative;color:var(--ink);max-width:50ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:16px;height:16px;border-radius:50%;
    background:var(--accent2)}
  .num{font-family:var(--disp);font-weight:700;font-size:64px;color:var(--rule);line-height:1;margin-bottom:8px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:28px}
  .card{border:1px solid var(--rule);border-radius:12px;padding:22px 24px;background:#fdfbfe}
  .card h3{font-family:var(--disp);font-weight:600;font-size:21px;color:var(--accent);margin-bottom:8px}
  .card p{font-size:17px;line-height:1.4;color:var(--muted)}
  .disc{font-family:var(--disp);font-size:13px;line-height:1.5;color:var(--muted);margin-top:30px;max-width:60ch}
  .cta-line{display:inline-block;font-family:var(--disp);font-weight:600;font-size:20px;color:#fff;
    background:var(--accent);padding:14px 30px;border-radius:999px;margin-top:26px}
  .pageno{position:absolute;right:26px;bottom:20px;font-family:var(--disp);font-size:13px;color:var(--muted)}
  @media(max-width:640px){.slide{padding:40px 28px}h1{font-size:40px}h2{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Speaking Your Brand Masterclass',
   title:'The Signature Talk',
   sub:'How to turn your expertise into one talk that makes you the recognized thought leader in your field.',
   foot:'with Carol Cox'},

  {t:'promise',
   kicker:'The promise',
   h:'One talk can do the work of a hundred cold pitches.',
   body:'By the end of this session you will have the exact structure I use with the women in the Thought Leader Academy to build a signature talk that opens doors, fills programs, and earns the stage.'},

  {t:'audience',
   kicker:'Who this is for',
   h:'You know your material cold. The room still forgets it.',
   points:[
     'You are an expert, founder, or executive with real depth in your field.',
     'You get on stages, podcasts, and panels, but the talks feel different every time.',
     'You want speaking to actually grow your business, not just fill a calendar slot.'
   ]},

  {t:'reframe',
   partlabel:'The trap',
   h:'The Expert Trap',
   big:'The more you know, the more you tend to lean on information and data to prove it. But audiences do not enroll because they were informed. They enroll because they were moved and given a way forward.'},

  {t:'part', partlabel:'Part One', h:'Why brilliant experts stay invisible'},

  {t:'content',
   kicker:'The real problem',
   h:'It is not confidence. It is structure.',
   body:'Most experts rebuild their talk from scratch every time, so nothing compounds. Without a repeatable structure, each talk is a one-off performance instead of a business asset you can reuse and refine for years.'},

  {t:'part', partlabel:'Part Two', h:'The Signature Talk Canvas'},

  {t:'content',
   kicker:'The framework',
   h:'Three acts, one arc',
   body:'A signature talk moves through three acts. Each one has a job. When they connect, the audience travels from their problem to your method to a clear next step, and the close lands because it ties back to where you opened.'},

  {t:'framework', num:'01', h:'Issue',
   body:'Open with a hook that resonates. Name the goals and challenges your audience already feels, then reframe the real problem as you see it. This is where you earn the right to be heard.'},

  {t:'framework', num:'02', h:'Idea',
   body:'Introduce your big idea, the framework only you teach, supported by two or three key points, stories, and client examples. This is the part that separates you from every other expert on the topic.'},

  {t:'framework', num:'03', h:'Inspiration',
   body:'Close on a motivating vision and a clear call to action with practical next steps, tied back to your opening. This is where interest turns into a decision.'},

  {t:'content',
   kicker:'Make it stick',
   h:'Tell it with I.D.E.A.L. stories',
   body:'Data is forgotten. Stories are repeated. The I.D.E.A.L. ingredients turn a flat example into a moment the room carries out the door: Imagery, Dialogue, Emotion, Action, Lesson.'},

  {t:'content',
   kicker:'Own your category',
   h:'Create your own framework',
   body:'A named framework is the difference between being one more speaker on the subject and being the person the subject is associated with. Your Idea act is where your framework gets its name, and your name is what people search for later.'},

  {t:'archetypes',
   kicker:'Speak as yourself',
   h:'Know your Speaker Archetype',
   cards:[
     ['Stellar Scholar','Leads with depth, research, and credibility.'],
     ['Fabulous Facilitator','Leads by drawing the room in and guiding it.'],
     ['Spellbinding Storyteller','Leads with narrative and emotional truth.'],
     ['Provocative Performer','Leads with energy, contrast, and a bold point of view.']
   ],
   note:'The strongest signature talks are built to your natural archetype, not against it.'},

  {t:'part', partlabel:'Part Three', h:'When one talk becomes the platform'},

  {t:'content',
   kicker:'From talk to platform',
   h:'One talk becomes the whole business',
   body:'Once the structure is set, the same signature talk feeds your keynotes, your podcast episodes, your lead magnets, and your enrollment conversations. It stops being a performance and becomes the front door to everything you offer.'},

  {t:'why',
   kicker:'Why me',
   h:'Carol Cox',
   body:'Founder of Speaking Your Brand and host of the Speaking Your Brand podcast, with 480+ episodes. I have coached hundreds of women to develop keynotes, TEDx talks, and thought leadership platforms, and I have been a TEDxOrlando speaking coach since 2017. I am a left-brained, get-it-done person, which is why everything here is a repeatable system, not a pep talk.'},

  {t:'cta',
   kicker:'Your next step',
   h:'Build your signature talk with me',
   body:'If you want help turning your expertise into a signature talk and a thought leadership platform, the Thought Leader Academy is where we do it together, live.',
   ctaline:'Book a free call at speakingyourbrand.com',
   disc:'This masterclass is for educational purposes only. It shares a framework and examples; it is not a guarantee of any specific speaking, revenue, or business result. Outcomes vary based on your work, your market, and many factors outside any program.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.kicker) html += `<div class="kicker">${s.kicker}</div>`;
  if(s.partlabel) html += `<div class="part-label">${s.partlabel}</div>`;
  if(s.t==='title'){
    html += `<h1>${s.title}</h1>`;
    if(s.sub) html += `<p class="sub">${s.sub}</p>`;
    if(s.foot) html += `<div class="foot">${s.foot}</div>`;
  } else if(s.t==='promise'){
    html += `<h2>${s.h}</h2><p class="body">${s.body}</p>`;
  } else if(s.t==='part'){
    html += `<h1>${s.h}</h1>`;
  } else if(s.t==='reframe'){
    html += `<h2>${s.h}</h2><p class="big" style="margin-top:24px">${s.big}</p>`;
  } else if(s.t==='audience'){
    html += `<h2>${s.h}</h2><ul>${s.points.map(p=>`<li>${p}</li>`).join('')}</ul>`;
  } else if(s.t==='framework'){
    html += `<div class="num">${s.num}</div><h2>${s.h}</h2><p class="body">${s.body}</p>`;
  } else if(s.t==='content' || s.t==='why'){
    html += `<h2>${s.h}</h2><p class="body">${s.body}</p>`;
  } else if(s.t==='archetypes'){
    html += `<h2>${s.h}</h2><div class="grid">${s.cards.map(c=>`<div class="card"><h3>${c[0]}</h3><p>${c[1]}</p></div>`).join('')}</div>`;
    if(s.note) html += `<p class="body" style="font-size:19px;color:var(--muted)">${s.note}</p>`;
  } else if(s.t==='cta'){
    html += `<h2>${s.h}</h2><p class="body">${s.body}</p><div class="cta-line">${s.ctaline}</div><div class="disc">${s.disc}</div>`;
  }
  html += `<div class="pageno">${i+1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
