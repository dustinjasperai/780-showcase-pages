<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 1,000 True Fans Video, a masterclass with Christian LeBlanc</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kumbh+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fef1e1;
    --panel:#fffaf3;
    --rule:#e6d6c2;
    --ink:#173142;
    --muted:#5c6b74;
    --accent:#f48712;
    --accent2:#2ea495;
    --head:'Kumbh Sans',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:64px 72px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(23,49,66,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* story-arc motif: a horizon line rising top-left */
  .slide::before{content:'';position:absolute;top:0;left:0;height:5px;width:46%;
    background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:0 0 6px 0}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.04;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:42px;line-height:1.08;margin:0 0 20px}
  h3{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:44ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:16px;height:16px;border-radius:50%;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px}
  .big{font-family:var(--head);font-size:120px;line-height:.98;font-weight:700}
  .strike{color:transparent;-webkit-text-stroke:2px #17314255;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap}
  .cell{flex:1;min-width:210px;background:var(--bg);border:1px solid var(--rule);border-radius:14px;padding:22px 24px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:26px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:56px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:auto}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:40px}h2{font-size:30px}.big{font-size:74px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">Lost LeBlanc · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The 1,000 True Fans Video',p:'How to make long-form YouTube that turns strangers into a following that actually pays.',pres:'With <b>Christian LeBlanc</b>, Lost LeBlanc'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Why your channel is not growing','It is almost never how often you post.'],['A long-form video people actually finish','The structure that holds attention start to end.'],['Your first move toward 1,000 true fans','The small, real audience that pays, not the view count.']]},
 {t:'audience',kick:'Who this is for',h:'You keep posting. The channel still will not move.',p:'Aspiring and part-time creators who want to go full time, and are tired of chasing views that never turn into anything.',who:'<b>The trap:</b> you post more and more, chase the algorithm, and still have no real audience and no income to show for it.'},
 {t:'reframe',kick:'The reframe',big1:'A million views.',big2:'1,000 <span class="em">true fans</span>.',p:'Views are attention that leaves. True fans are people who come back, who trust you, and who buy. One of those builds a career. The other just feels good for a day.'},
 {t:'part',kick:'Part one',h:'Why channels stall.'},
 {t:'point',kick:'The core problem',h:'Posting more is not the answer.',p:'Most creators respond to a flat channel by making more, faster. The output goes up, the quality goes down, and the audience still does not stick. Volume was never the lever.'},
 {t:'framework',kick:'The core problem',h:'Reach vs. a following.',row:[['Short-form','Buys reach. Great for being seen, weak for being remembered or paid.'],['Long-form','Builds a following. Slower to make, but it is what turns a viewer into a fan.']],p:'YouTube is the highest paying platform because long-form is where trust, and money, actually get built.'},
 {t:'point',kick:'The core problem',h:'Views are not fans.',p:'A viral moment sends strangers who watch once and vanish. A following is built one real video at a time, by people who choose to come back. That choice is the whole game.'},
 {t:'part',kick:'Part two',h:'How to make a video that holds.'},
 {t:'cycle',kick:'The system',h:'Four steps to a video worth watching.',steps:['Pre-production: plan and storyboard the story before you film','Production: shoot with the edit already in mind','Post-production: cut for pace, story and retention','Packaging: the title and thumbnail that earn the click'],p:'One repeatable workflow, from idea to upload. This is how a video gets made on purpose instead of by luck.'},
 {t:'point',kick:'The craft',h:'The hook decides everything.',p:'The first fifteen seconds decide whether anyone sees the rest. A hook is a promise, made clearly and fast, that the payoff is worth the watch.'},
 {t:'point',kick:'The craft',h:'Story is what holds the middle.',p:'Retention does not come from cuts and effects. It comes from a story with a question the viewer wants answered, so they stay to find out. Structure beats polish every time.'},
 {t:'skills',kick:'The craft',h:'Six skills every creator can learn.',li:[['Scripting and storytelling','The spine that makes a video worth finishing.'],['Shooting and editing','Filming for the edit, cutting for pace and retention.'],['Strategy, titles and thumbnails','The packaging that gets the video opened in the first place.']]},
 {t:'part',kick:'Part three',h:'From a following to a living.'},
 {t:'truefans',kick:'The thesis',h:'1,000 true fans beats 1,000,000 viewers.',p:'You do not need to be famous. You need a real, loyal audience that shows up. A thousand people who trust you can support a full-time creator business.',who:'<b>Principle:</b> build the audience that comes back, not the number that looks big.'},
 {t:'looks',kick:'The outcome',h:'What a real creator business looks like.',li:[['Brand deals you can price','A media kit and real numbers, not hoping a brand emails you.'],['Your own offer','A course, community or product your true fans actually want.'],['Income that is not one viral video','A following that keeps paying, upload after upload.']]},
 {t:'whyme',kick:'Why Christian',h:'A creator who built it from scratch.',li:[['From accounting to full-time creator','Quit the desk job, started with a GoPro and no camera background.'],['2M+ subscribers, one story at a time','Built one of the largest travel channels on long-form video.'],['Now teaching thousands of creators','Through YouTuber Pro and the Lost Creator Academy community.']]},
 {t:'cta',kick:'Your next step',h:'Ready to build a following that pays?',ctas:['<b>Join the Lost Creator Academy</b> and get the full system, coaching and community.','<b>Start with YouTuber Pro</b> if you want the core video workflow first.'],disc:'This masterclass is educational. It shares frameworks and approaches for building a channel and audience; it is not advice for your specific situation and not a guarantee of any particular result. Outcomes vary by creator.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`+(s.who?`<div class="who">${s.who}</div>`:'')}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
