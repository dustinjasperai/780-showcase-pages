<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gallery-Ready — a masterclass with Miguel L. Mayher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Petrona:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4eede;      /* warm parchment (light tint of site white #ffffff + gold warmth) */
    --panel:#e7dcc4;   /* deeper parchment */
    --ink:#232322;     /* their heading ink */
    --muted:#6f6a61;   /* warm grey, from #7d7979 family */
    --accent:#b08d57;  /* bronze, from brand ranked_colors */
    --deep:#7a5a30;    /* deeper bronze */
    --rule:#d8c9a8;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Montserrat",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:52px 54px;margin:18px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .slide::before{content:"";position:absolute;left:54px;top:40px;width:46px;height:2px;background:var(--accent)}
  .kick{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--deep);font-weight:600;margin-bottom:22px}
  h1{font-family:"Petrona",Georgia,serif;font-weight:700;font-size:52px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:"Petrona",Georgia,serif;font-weight:600;font-size:38px;line-height:1.08;margin-bottom:16px}
  p{font-size:19px;line-height:1.55;color:#38352f;max-width:62ch;margin-bottom:14px}
  .lead{font-size:22px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:11px 0 11px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:60ch}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border:2px solid var(--accent);border-radius:2px}
  li b{font-family:"Petrona",serif;font-weight:600}
  .big{font-family:"Petrona",serif;font-weight:700;font-size:46px;line-height:1.08;color:var(--deep)}
  .num{font-family:"Petrona",serif;color:var(--accent);font-weight:700;font-size:15px;letter-spacing:.1em}
  .foot{position:absolute;right:54px;bottom:26px;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
  .cta{background:var(--panel)}
  .disc{font-size:14px;color:var(--muted);margin-top:22px;max-width:70ch}
  @media(max-width:640px){.slide{padding:36px 26px}h1{font-size:36px}h2{font-size:28px}.big{font-size:32px}.slide::before,.foot{display:none}}
</style>
</head>
<body>
<main id="deck" aria-label="Gallery-Ready masterclass deck"></main>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Miguel L. Mayher', h:'Gallery-Ready', html:`<p class="lead">The business-school path to gallery representation, grants, and residencies, for fine artists, in one live hour.</p>`},

  {t:'audience', kick:'Who this is for', h:'For artists who are ready, not hobbyists', html:`<ul>
    <li>You have an active practice and work you are proud of.</li>
    <li>You want representation, grants, or residencies, not just more likes.</li>
    <li>You are willing to treat your art as a career, not only a calling.</li>
  </ul>`},

  {t:'trap', kick:'The trap', h:'Talent was never the bottleneck', html:`<p>Most working artists quietly believe the problem is the work. More skill, one more series, a better studio, and the galleries will come.</p><p>They almost never do. The artists who get represented are not always the most talented in the room. They are the ones who understood the career.</p>`},

  {t:'reframe', kick:'The reframe', h:'Galleries invest in a career, not a canvas', html:`<p class="big">A gallery is not buying your painting. It is buying your trajectory.</p><p>Once you see that, every move changes: how you price, how you present, who you build, and what you ask for.</p>`},

  {t:'part', kick:'Part one', h:'Why the usual advice fails', html:`<p>The feed is full of two messages: learn to paint better, or make a living selling prints online. Neither one gets you into a gallery.</p><p>Representation, grants, and residencies run on a different system, the one that is normally learned by accident, over a decade, through an art-school network most artists never had.</p>`},

  {t:'framework', kick:'Part two', h:'The Five Steps', html:`<p>This is the path I teach: five steps to start and grow the business side of your art, taught with the same rigor I learned getting an MBA, applied to a fine-art career.</p>`},

  {t:'step', kick:'Step one', h:'Professionalize the practice', html:`<p class="num">01</p><p>Turn a studio habit into a body of work a gallery can represent: consistent output, inventory you can speak to, and the materials that make you legible to the art world.</p>`},

  {t:'step', kick:'Step two', h:'Monetize through teaching', html:`<p class="num">02</p><p>Build an income line that funds the career between sales. Teaching your process, on your terms, is the most reliable second revenue most artists overlook.</p>`},

  {t:'step', kick:'Step three', h:'Build an audience that buys', html:`<p class="num">03</p><p>Collectors and curators follow artists, not accounts. We build a real audience and a point of difference so the right people are already watching when you ask.</p>`},

  {t:'step', kick:'Step four', h:'Earn media and features', html:`<p class="num">04</p><p>Press, interviews, and features are not luck. They are a repeatable pitch. This is how you become the artist a gallery has already heard of.</p>`},

  {t:'step', kick:'Step five', h:'Win representation, grants, and residencies', html:`<p class="num">05</p><p>The ask itself: how galleries read your pricing and portfolio, what a grant panel actually looks for, and how to apply so the answer is yes.</p>`},

  {t:'detail', kick:'Up close', h:'Priced to be taken seriously', html:`<p>Underpricing is the fastest way to be dismissed. We set your pricing the way a gallery reads it, so representation becomes a conversation instead of a long shot.</p>`},

  {t:'detail', kick:'Up close', h:'The portfolio a panel reads', html:`<ul>
    <li><b>Fit.</b> The show, grant, or gallery you are actually right for.</li>
    <li><b>Portfolio.</b> The work, sequenced to tell one clear story.</li>
    <li><b>Statement.</b> Your art in words a non-artist trusts.</li>
    <li><b>Timeline.</b> The 90-day plan that makes it real.</li>
  </ul>`},

  {t:'credibility', kick:'Why me', h:'An artist who actually has the MBA', html:`<p>I trained in fine art at Central Saint Martins in London, then took an MBA at INSEAD. I built the Professional Artist MBA and the Professional Artist Accelerator to give fine artists the career system I had to learn the hard way.</p><p>This is not make-money-online advice. It is the gallery, grant, and residency path, taught with real structure.</p>`},

  {t:'recap', kick:'The path, in one view', h:'From studio to represented', html:`<ul>
    <li>Professionalize the practice.</li>
    <li>Monetize through teaching.</li>
    <li>Build an audience that buys.</li>
    <li>Earn media and features.</li>
    <li>Win representation, grants, and residencies.</li>
  </ul>`},

  {t:'cta', cls:'cta', kick:'Your next step', h:'Build your gallery-ready career', html:`<p class="lead">If you want the full system and my eyes on your plan, the next step is a short application and a clarity call to see if the Professional Artist Accelerator is the right fit.</p><p>Apply at professionalartist.com.</p><p class="disc">Educational content only. No income, sale, grant, residency, or representation outcome is guaranteed. Results vary and depend on your work, effort, and circumstances.</p>`}
];
const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' '+s.cls : '');
  el.innerHTML = (s.kick?`<div class="kick">${s.kick}</div>`:'') +
                 (s.h?`<h1 style="font-size:${s.t==='title'?'':'40px'}">${s.h}</h1>`:'') +
                 (s.html||'') +
                 `<div class="foot">Professional Artist Association</div>`;
  deck.appendChild(el);
}
</script>
</body>
</html>
