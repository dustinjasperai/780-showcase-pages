<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scale Without the Raise: a masterclass with Dave Colina</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#04352a;        /* deep O2 forest green, from cpgfasttrack.com dominant #004534 */
    --panel:#0a4a3a;
    --rule:rgba(212,255,98,.22);
    --ink:#f3f7ee;
    --muted:#adc3b4;
    --accent:#d4ff62;    /* electric lime, verbatim brand button color */
    --head:'Outfit',system-ui,sans-serif;
    --body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#021c16;color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:64px 60px;margin:0 0 26px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::after{content:"";position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;
    border-radius:50%;background:radial-gradient(circle,rgba(212,255,98,.10),transparent 70%)}
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:60px;line-height:1.02;letter-spacing:-.02em}
  h2{font-family:var(--head);font-weight:800;font-size:40px;line-height:1.08;letter-spacing:-.01em}
  .sub{font-size:21px;color:var(--muted);margin-top:22px;max-width:30ch}
  .body{font-size:22px;line-height:1.5;margin-top:20px;max-width:46ch;color:#e8f2e3}
  .part{font-family:var(--head);font-weight:800;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent)}
  .big{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.05;margin-top:12px}
  ul{margin-top:24px;list-style:none;display:flex;flex-direction:column;gap:16px}
  li{font-size:21px;padding-left:30px;position:relative;max-width:48ch;line-height:1.4}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .pillar-no{font-family:var(--head);font-weight:800;font-size:17px;color:var(--accent);letter-spacing:.1em}
  .quote{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.1;letter-spacing:-.01em}
  .steps{display:flex;gap:14px;margin-top:30px;flex-wrap:wrap}
  .step{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;
    font-family:var(--head);font-weight:600;font-size:18px}
  .step span{color:var(--accent)}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .cta-line{font-family:var(--head);font-weight:600;font-size:24px;color:var(--accent);margin-top:18px}
  .num{position:absolute;top:22px;right:28px;font-size:13px;color:var(--muted);font-family:var(--head)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Dave Colina',
   title:'Scale Without the Raise',
   sub:'The operator’s playbook for taking a CPG brand from the trunk of a car to the national shelf.'},

  {t:'who', kicker:'Who this is for',
   title:'Founders with real traction',
   body:'You are already on shelves. Maybe past a million in revenue. And you keep hearing the same thing: the only way up is a bigger round and a bigger burn. This hour is for you.'},

  {t:'trap', kicker:'The trap',
   title:'You are told the finish line is a bigger round',
   body:'So you chase national distribution early, spread thin across chains you cannot support, and spend the raise propping up velocity that was never really there.'},

  {t:'hook', part:'The reframe',
   quote:'The round was never the moat.'},

  {t:'part', part:'Part One', big:'Why good brands stall'},

  {t:'content', kicker:'The spread problem',
   title:'Twenty chains, three facings, no velocity',
   body:'Distribution without velocity is a liability. Empty shelves get cut. You end up renting space you cannot defend, then raising again to cover the gap.'},

  {t:'content', kicker:'The real engine',
   title:'Velocity is earned in a radius, not bought across a map',
   body:'The next chain does not care how many states you are in. It cares whether product moves. Movement is built in one tight market first.'},

  {t:'part', part:'Part Two', big:'The Operator’s Playbook'},

  {t:'pillar', no:'Pillar 01', title:'Geographic density first',
   body:'O2 owned Ohio and Kentucky CrossFit gyms completely before it touched a national chain, then regional Whole Foods and Kroger. Win one concentrated region all the way before you spread.'},

  {t:'content', kicker:'Why density wins',
   title:'Density beats spread',
   body:'Concentrated velocity in a tight radius is the proof the next buyer wants. Dominate the map you can actually service, and the bigger map comes to you.'},

  {t:'pillar', no:'Pillar 02', title:'A community channel that sells for you',
   body:'Pick a distribution channel that mirrors your customer’s values. For O2 it was CrossFit. The right channel manufactures advocates instead of renting shelf space.'},

  {t:'content', kicker:'The multiplier',
   title:'Turn users into a sales force',
   body:'Becoming the official drink of the CrossFit Games did not just buy reach. It turned a tribe into the people who put you on their gym’s shelf and asked their grocer to carry you.'},

  {t:'pillar', no:'Pillar 03', title:'Scale on profit, not a round',
   body:'Grow on revenue and discipline. Zero-overhead early operations, the Prius trunk, reinvested margin. It is the discipline that let O2 reach the Inc. 5000 and outlast better funded competitors.'},

  {t:'content', kicker:'Capital efficiency',
   title:'Profit is the durable advantage',
   body:'A brand that compounds its own cash controls its own timeline. You are never one bridge round away from losing the company you built.'},

  {t:'pillar', no:'Pillar 04', title:'A product that earns the repeat',
   body:'Formulate around a genuine, provable benefit, not marketing hype. When the product itself drives the second purchase, every dollar of density and community compounds.'},

  {t:'part', part:'Part Three', big:'How O2 actually scaled'},

  {t:'steps', kicker:'The sequence, each step earned',
   title:'Trunk to national, in order',
   steps:['Prius', 'One region, total shelf', 'Regional chains', 'National']},

  {t:'why', kicker:'Why me',
   title:'Dave Colina',
   body:'Founder and CEO of O2. Built it from the trunk of a Prius to an Inc. 5000 brand and the official sports drink of the CrossFit Games. I ran this playbook myself, the hard way.'},

  {t:'content', kicker:'You do not run it alone',
   title:'Operators who built what you are building',
   body:'Inside CPG FastTrack you work the playbook with founders and operators who have scaled real brands, so you skip the mistakes that cost everyone else a year and a round.'},

  {t:'cta', kicker:'Your next step',
   title:'Ready to run the playbook?',
   ctaLine:'Apply to CPG FastTrack and scale on your own terms.',
   disclaimer:'This masterclass is for educational purposes only. It is not financial, investment, or business advice, and it is not a promise or guarantee of any particular revenue, growth, or results. Every brand and market is different, and outcomes vary.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.part) h+=`<div class="part">${s.part}</div>`;
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.quote) h+=`<div class="quote">${s.quote}</div>`;
  if(s.no) h+=`<div class="pillar-no">${s.no}</div>`;
  if(s.title && s.t==='title') h+=`<h1>${s.title}</h1>`;
  else if(s.title) h+=`<h2>${s.title}</h2>`;
  if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
  if(s.body) h+=`<div class="body">${s.body}</div>`;
  if(s.steps){h+='<div class="steps">';s.steps.forEach((st,n)=>{h+=`<div class="step"><span>${n+1}.</span> ${st}</div>`});h+='</div>';}
  if(s.ctaLine) h+=`<div class="cta-line">${s.ctaLine}</div>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  h+=`<div class="num">${i+1} / ${S.length}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
