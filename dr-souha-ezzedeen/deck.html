<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rearing, Not Training - The Way of Life Method Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=PT+Serif:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e7edf7;
    --panel:#f5f8fd;
    --ink:#243040;
    --muted:#5c6773;
    --rule:#dcd6cc;
    --accent:#1863dc;
    --head:'PT Serif', Georgia, serif;
    --body:'Hanken Grotesk', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 26px;min-height:360px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(36,48,64,.03)}
  .slide.title{min-height:460px}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:700;font-size:30px;line-height:1.14;margin:0 0 16px}
  p{font-size:18px;line-height:1.6;color:var(--ink);margin:0 0 14px;max-width:62ch}
  p.lead{font-size:20px;color:var(--muted)}
  .promise{font-size:19px;color:var(--muted);max-width:60ch}
  ul{margin:8px 0 0;padding:0;list-style:none}
  li{font-size:18px;line-height:1.5;padding:12px 0 12px 28px;position:relative;border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  .stage{display:flex;gap:16px;flex-wrap:wrap;margin-top:10px}
  .stage div{flex:1 1 180px;border:1px solid var(--rule);border-radius:10px;padding:18px 18px}
  .stage h3{font-family:var(--head);font-size:20px;margin:0 0 6px}
  .stage span{font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--accent)}
  .stage p{font-size:15.5px;color:var(--muted);margin:6px 0 0}
  .big{font-family:var(--head);font-size:34px;line-height:1.2;max-width:22ch}
  .cite{font-size:15px;color:var(--muted);font-style:italic}
  .disc{font-size:14px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;margin-top:22px;max-width:70ch}
  .n{font-family:var(--head);font-size:15px;color:var(--muted)}
  .pagefoot{font-size:12px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:28px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <p class="kick">The Way of Life&reg; Method &middot; Free Masterclass</p>
    <h1>Rearing, Not Training</h1>
    <p class="promise">Why lasting stability with your dog does not come from another technique, and what actually changes anxiety, reactivity, and the daily struggle: how you live together.</p>
    <p class="n">With Dr Souha Ezzedeen, creator of the Way of Life Method</p>`},

  {t:'agenda', html:`
    <p class="kick">The next 45 minutes</p>
    <h2>What you will walk away understanding</h2>
    <ul>
      <li>Why the behavior you see is almost never the real problem.</li>
      <li>The difference between training a dog and rearing one.</li>
      <li>The three stages every sound dog moves through, in order.</li>
      <li>The five parts of daily life that actually drive change.</li>
      <li>Where to begin this week, without another tool or technique.</li>
    </ul>`},

  {t:'who', html:`
    <p class="kick">Who this is for</p>
    <h2>You care deeply. You have tried hard. Something still is not working.</h2>
    <p>You have followed the guidance. You have done the obedience work, the exposure, the behavior modification. Maybe you have explored tools, or even medication.</p>
    <p>Some things improved for a while. But the stability did not hold.</p>`},

  {t:'fit', html:`
    <p class="kick">An honest filter</p>
    <h2>This is for you if</h2>
    <ul>
      <li>You care about your dog's long term wellbeing, not just this week's behavior.</li>
      <li>You have tried mainstream approaches without the stability you hoped for.</li>
      <li>You are open to examining not just the dog, but how daily life is structured.</li>
      <li>You want thoughtful guidance, not hacks.</li>
    </ul>`},

  {t:'stakes', html:`
    <p class="kick">The cost of the treadmill</p>
    <p class="big">Every new technique that treats the symptom teaches you to trust the next technique a little less.</p>
    <p>Meanwhile the walks stay tense, the greetings stay unpredictable, and the relationship quietly turns into management. The longer that runs, the more both of you brace for the next thing to go wrong.</p>`},

  {t:'trap', html:`
    <p class="kick">The trap</p>
    <h2>The harder you work the dog, the more the real problem hides.</h2>
    <p>When progress stalls, the usual advice is to add another method on top: a new cue, a stricter rule, a different tool. Each one asks more effort from you and more compliance from your dog.</p>
    <p>It feels responsible. It is also why the same issues keep coming back.</p>`},

  {t:'reframe', html:`
    <p class="kick">A different way to see it</p>
    <p class="big">Behavior does not live inside the dog. It reflects your relationship and the way daily life is structured.</p>
    <p class="cite">Training can teach skills. Tools can interrupt reactions. Exposure can raise tolerance. None of them change the conditions that are driving the behavior.</p>`},

  {t:'part', html:`
    <p class="kick">Part One</p>
    <h2>Training for skills is not the same as rearing for stability.</h2>
    <p>Training asks: how do I get the dog to do this, or stop doing that? It works on the surface, one behavior at a time.</p>
    <p>Rearing asks a bigger question: what kind of daily life produces a sound, settled, confident dog in the first place? That is the level this method works at.</p>`},

  {t:'why', html:`
    <p class="kick">Why the surface fails</p>
    <h2>Five things most guardians are never told</h2>
    <ul>
      <li>Teaching skills is not the same as building stability.</li>
      <li>More exposure does not automatically build confidence.</li>
      <li>Persistent behavior does not mean your dog is flawed.</li>
      <li>Focusing only on the dog overlooks the life around the dog.</li>
      <li>Real change begins with how life together is lived.</li>
    </ul>`},

  {t:'part', html:`
    <p class="kick">Part Two &middot; The Way of Life Method</p>
    <h2>Behavior reflects relationship. Relationship is forged in daily life. Daily life shapes character.</h2>
    <p>So instead of managing symptoms, we redesign the conditions. The method moves your dog through three rearing stages, in order, and never skips the foundation.</p>`},

  {t:'stages', html:`
    <p class="kick">The three rearing stages</p>
    <h2>A developmental path, not a drill sheet</h2>
    <div class="stage">
      <div><span>Stage One</span><h3>Foundations</h3><p>Relationship and mindset, space and boundaries, decompression. The settled base everything else is built on.</p></div>
      <div><span>Stage Two</span><h3>Exposure</h3><p>Gradual, intentional socialization and adaptation to the real world, at the dog's pace, not the schedule's.</p></div>
      <div><span>Stage Three</span><h3>Integration</h3><p>Drive development and advanced skills, now resting on a stable, trusting relationship.</p></div>
    </div>`},

  {t:'deep', html:`
    <p class="kick">Stage One, up close</p>
    <h2>Foundations: the stage almost everyone skips</h2>
    <p>Before exposure, before drive, before any skill, a dog needs a settled base: a home where space and boundaries are clear, where decompression is built into the day, and where the relationship feels safe rather than negotiated.</p>
    <p>Skip it, and every later stage wobbles. Build it, and most of the behavior you were fighting starts to ease on its own.</p>`},

  {t:'elements', html:`
    <p class="kick">The five elements of success</p>
    <h2>What you actually redesign in daily life</h2>
    <ul>
      <li>Relationship and mindset: the attitude you bring to the dog every day.</li>
      <li>Space and boundaries: a home structured for calm and success.</li>
      <li>Socialization: exposure that builds confidence instead of flooding it.</li>
      <li>Drive development: channeling your dog's energy into purpose.</li>
      <li>Stage thinking: doing the right thing in the right order.</li>
    </ul>`},

  {t:'contrast', html:`
    <p class="kick">What makes this different</p>
    <p class="big">This is not another set of techniques layered onto the structure you already have. It changes where the real work happens.</p>
    <p>Rather than modifying isolated behaviors, we change how a dog is reared inside the home and how daily life is organized. It is a way of living, practiced day by day.</p>`},

  {t:'day', html:`
    <p class="kick">In practice</p>
    <h2>A day, reorganized</h2>
    <p>Nothing here is a trick. It is the shape of ordinary days changed on purpose: how the morning starts, how space is used, when the dog rests, how exposure is chosen rather than stumbled into, where drive gets a healthy outlet.</p>
    <p>Small, repeated, in the right order. That is where stability is actually made.</p>`},

  {t:'part', html:`
    <p class="kick">Part Three &middot; The shift</p>
    <h2>From managing a hard dog to living with a settled one.</h2>
    <p>Guardians describe the same arc: the daily dread lifts, the walks get calmer, the reactivity softens, and the relationship starts to feel like trust instead of vigilance.</p>`},

  {t:'proof', html:`
    <p class="kick">In guardians' words</p>
    <p class="big">"The method did not just change my dog. It changed me."</p>
    <p class="cite">Guardians inside the Way of Life Academy, describing dogs that now walk calmly, greet politely, and settle in places that used to undo them. Individual experiences vary.</p>`},

  {t:'whome', html:`
    <p class="kick">Why me</p>
    <h2>Dr Souha Ezzedeen</h2>
    <p>A university professor turned canine rearing and relationship coach, with more than two decades working with dogs and more than a decade coaching people. Creator of the Way of Life Method and author of the award winning book of the same name.</p>
    <p>The method grew out of both academic research and lived experience: developmental psychology, attachment theory, and the natural practices of dogs raising dogs.</p>`},

  {t:'cta', cls:'cta', html:`
    <p class="kick">Your next step</p>
    <h2>Begin with the Way of Life Method.</h2>
    <p>If this way of seeing your dog resonated, the Online Academy is where the method is taught in full: the three stages, the five elements, and monthly live coaching with me and a community walking the same path.</p>
    <p class="lead">Clarity comes first. Change follows.</p>
    <p class="disc">Educational only. The Way of Life Method teaches an approach to canine rearing and the guardian relationship. No specific behavioral outcome, timeline, or result is guaranteed, and individual results vary with each dog, home, and history.</p>
    <p class="pagefoot">The Way of Life&reg; Dog Training</p>`}
];
const deck = document.getElementById('deck');
S.forEach(s=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  d.innerHTML = s.html;
  deck.appendChild(d);
});
</script>
</body>
</html>
