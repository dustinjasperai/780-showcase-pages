<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Story Overview — A Story Power Masterclass with Tom Ruwitch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Ubuntu:wght@500;700&family=Open+Sans:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f3ee;        /* his light ground */
    --panel:#ffffff;
    --rule:#e6e6e6;      /* his rule grey */
    --accent:#205db7;    /* his dominant brand blue (126 uses) */
    --deep:#174383;      /* his deep-blue secondary */
    --ink:#222222;       /* his body text */
    --head:#333333;      /* his heading text */
    --muted:#666666;
    --display:'Ubuntu',system-ui,sans-serif;  /* his heading face */
    --body:'Open Sans',system-ui,sans-serif;  /* his body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 52px;margin:22px 0;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;
    background:var(--accent)}            /* the narrative-spine motif */
  .slide.deep::before{background:var(--deep)}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:var(--display);font-weight:700;color:var(--head);font-size:40px;
    line-height:1.12;margin-bottom:14px}
  h2{font-family:var(--display);font-weight:700;color:var(--head);font-size:30px;
    line-height:1.18;margin-bottom:14px}
  h3{font-family:var(--display);font-weight:500;color:var(--deep);font-size:21px;margin:18px 0 6px}
  p{font-size:18px;margin-bottom:12px;max-width:62ch}
  .lede{font-size:20px;color:var(--muted)}
  .big{font-size:30px;font-family:var(--display);font-weight:500;color:var(--head);line-height:1.3}
  ul{margin:10px 0 4px 20px}li{font-size:18px;margin-bottom:9px}
  .num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:15px;
    letter-spacing:.1em;text-transform:uppercase}
  .present{margin-top:26px;font-size:16px;color:var(--muted)}
  .present b{color:var(--head);font-family:var(--display)}
  .pill{display:inline-block;background:var(--bg);border:1px solid var(--rule);
    border-radius:999px;padding:5px 14px;font-size:14px;color:var(--deep);
    font-family:var(--display);margin:4px 6px 4px 0}
  .cta .btn{display:inline-block;background:var(--accent);color:#fff;font-family:var(--display);
    font-weight:700;padding:14px 26px;border-radius:10px;font-size:18px;margin-top:10px}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:66ch}
  .count{font-size:12px;color:var(--muted);text-align:right;font-family:var(--display);margin-top:8px}
</style>
</head>
<body>
<main class="deck" id="deck"></main>
<script>
const S=[
 {t:'title',
  eyebrow:'A Live Story Power Masterclass',
  h1:'The Story Overview',
  sub:'How coaches and consultants turn their own stories into a client-attracting content engine.',
  present:'Presented live by Tom Ruwitch, founder of Story Power Marketing'},

 {t:'content',eyebrow:'Who this is for',
  h2:'You post. People nod. Nobody buys.',
  p:['This is for coaches, consultants, and experts who show up consistently, write thoughtful content, and still watch it get polite likes instead of booked calls.',
     'You are not short on effort or expertise. You are short on one thing, and we are going to fix it today.']},

 {t:'content',eyebrow:'The trap',
  h2:'More tips is not the answer.',
  p:['The instinct when content stalls is to add more: more posts, more channels, more tactics, more tools.',
     'But tactics are interchangeable. The reason your content blends in is not that you need more of it. It is that it reads like everyone else in the feed.']},

 {t:'content',deep:true,eyebrow:'The reframe',
  big:'You do not have a content problem. You have a story you keep burying under tips and tactics, and your prospects can feel it.'},

 {t:'section',eyebrow:'Part one',h2:'Why likes are not demand',
  p:['Prospects remember posts. They hire people. The gap between the two is story.']},

 {t:'content',eyebrow:'Part one',
  h2:'Interchangeable content gets interchangeable results.',
  p:['When your content could have been written by any other expert in your field, prospects treat you like any other expert: a bookmark, not a buyer.',
     'Story is the one thing a competitor cannot copy, because it is yours. It is the fastest way to stop being a commodity.']},

 {t:'content',eyebrow:'Part one',
  h2:'What a story actually does',
  p:['A real story does three things a tip never will:'],
  ul:['It creates an emotional reaction, and emotion is what people act on.',
      'It makes you specific, so the right person feels you are talking to them.',
      'It stays with them, so when the need shows up, you are who they remember.']},

 {t:'section',eyebrow:'Part two',h2:'The Story Power process',
  p:['Four levels that turn your raw experience into an engine that keeps producing content that attracts and converts.']},

 {t:'content',eyebrow:'Part two / level one',
  h3:'Story Discovery',
  h2:'Mine the stories you already have.',
  p:['Most experts sit on a lifetime of usable stories and never see them. Story Discovery is how you surface the moments, clients, and turning points your prospects will respond to emotionally.',
     'You are not inventing anything. You are finding what is already true.']},

 {t:'content',deep:true,eyebrow:'Part two / level two',
  h3:'The Story Overview',
  h2:'Build the blueprint everything is measured against.',
  p:['The Story Overview is the centerpiece: a single reusable narrative blueprint of who you are, who you serve, and the story that connects you.',
     'Once you have it, you stop guessing. Every email, post, and page gets built against it, and your message finally sounds like one person instead of a committee.']},

 {t:'content',eyebrow:'Part two / level three',
  h3:'Power-Up',
  h2:'Rebuild your content around the story.',
  p:['With the Story Overview in hand, you go back through your content, email, website, social, and power it up: the same ideas, now carried by story so they land instead of scroll past.']},

 {t:'content',eyebrow:'Part two / level four',
  h3:'Continuous Power',
  h2:'Keep the engine running without the block.',
  p:['The last level is a simple planning rhythm so you are never staring at a blank page again. The story engine keeps producing, week after week, without writer’s block or burnout.']},

 {t:'content',eyebrow:'Part three',
  h2:'Watch a dull offer become a story people lean into.',
  p:['Take a piece of plain content, a product, an offer, an ordinary moment, and run it through the process. The before is forgettable. The after makes a stranger lean in.',
     'We will walk through a worked example together, live, so you can see the shift happen in real time.']},

 {t:'content',eyebrow:'Why me',
  h2:'I have been doing this for 25 years.',
  p:['In 2001 I founded MarketVolt, one of the first email-marketing software and services companies, back before most businesses had heard of email marketing.',
     'Since then I have helped coaches, consultants, authors, and experts turn content from boring to brilliant through story. It is in the book, the podcast, and everything I teach.']},

 {t:'content',eyebrow:'The one idea to keep',
  big:'Find the story you have been burying. Build it once into your Story Overview. Then let it do the selling you have been trying to do with tactics.'},

 {t:'cta',eyebrow:'Your next step',
  h2:'Ready to find your Story Overview?',
  p:['If today gave you one story worth telling, imagine having the whole engine built around it.',
     'Join Story Power VIP for twice-monthly live masterclasses, members-only training, and one-on-one feedback, or reach out about working together one on one as a private client.'],
  btn:'Join Story Power VIP',
  disclaimer:'This masterclass is educational. It shares methods and examples, not guarantees. Results depend on your own work, market, and offer, and will vary. Nothing here is a promise of income or specific outcomes.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.deep?' deep':'')+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.sub) h+='<p class="lede">'+s.sub+'</p>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.h3) h+='<h3>'+s.h3+'</h3>';
  if(s.big) h+='<p class="big">'+s.big+'</p>';
  (s.p||[]).forEach(x=>h+='<p>'+x+'</p>');
  if(s.ul){h+='<ul>';s.ul.forEach(x=>h+='<li>'+x+'</li>');h+='</ul>';}
  if(s.pills){h+='<div>';s.pills.forEach(x=>h+='<span class="pill">'+x+'</span>');h+='</div>';}
  if(s.present) h+='<div class="present"><b>'+s.present+'</b></div>';
  if(s.btn) h+='<div><span class="btn">'+s.btn+'</span></div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  h+='<div class="count">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
