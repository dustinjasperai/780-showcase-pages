<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Tilt, a masterclass with Debbie Reber</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf8; --panel:#ffffff; --rule:#e7e2db;
    --ink:#45484d; --muted:#7a7268;
    --accent:#ed583a;   /* TiLT signature orange-red (brand.json link color) */
    --teal:#00a99d;     /* TiLT button teal, used sparingly as the "shift" mark */
    --head:'Montserrat',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#efeae3;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:64px 66px;margin:26px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 10px 30px rgba(90,64,40,.06)}
  .kick{font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:800;font-size:52px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.12;letter-spacing:-.005em}
  .lead{font-size:23px;line-height:1.5;color:#54585f;margin-top:22px;max-width:46ch}
  .big{font-family:var(--head);font-weight:800;font-size:58px;line-height:1.08;letter-spacing:-.015em}
  .big .a{color:var(--accent)}
  .strike{position:relative;color:var(--muted)}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:54%;height:5px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:16px}
  li{display:flex;gap:16px;align-items:flex-start;font-size:21px;line-height:1.4;color:#4a4f5c}
  li .d{flex-shrink:0;width:13px;height:13px;border-radius:4px;background:var(--accent);margin-top:7px}
  .tilt{font-family:var(--head);font-weight:700;font-size:30px;color:var(--ink);margin-top:8px}
  .tiltno{font-family:var(--head);font-weight:800;font-size:17px;letter-spacing:.14em;text-transform:uppercase;color:var(--teal)}
  .note{font-size:19px;line-height:1.5;color:#54585f;margin-top:18px;max-width:48ch}
  .by{font-size:18px;color:var(--muted);margin-top:30px;font-weight:500}
  .foot{position:absolute;left:66px;bottom:26px;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);font-weight:600;font-family:var(--head)}
  .pageno{position:absolute;right:66px;bottom:26px;font-size:13px;color:#b5a99b;font-weight:600}
  .cta .btn{display:inline-block;margin-top:28px;background:var(--accent);color:#fff;
    font-family:var(--head);font-weight:700;font-size:20px;padding:16px 30px;border-radius:100px}
  .disc{font-size:13px;line-height:1.5;color:#8a8177;margin-top:30px;max-width:60ch}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S=[
  {t:'title', kick:'A live masterclass with Debbie Reber',
    h:'The Tilt', lead:'Why the problem was never your kid, and what changes the moment you stop trying to fix them.',
    by:'Debbie Reber, author of Differently Wired, founder of TiLT Parenting' },

  {t:'promise', kick:'What you will leave with',
    h:'One shift, and a different week',
    items:['A new lens for the behavior that has been exhausting you',
           'Three of the tilts you can use the same day',
           'A way to stop parenting the kid you expected and start parenting the one you have'] },

  {t:'who', kick:'Who this is for',
    h:'Parents raising a differently wired kid',
    lead:'ADHD, autism, dyslexia, giftedness and 2e, anxiety, sensory differences. If the standard playbook keeps failing you, you are in the right room.' },

  {t:'trap', kick:'The trap',
    h:'You have been handed the wrong job',
    items:['The school calls, and the word is always "won’t"',
           'Every program promises to fix, train, or correct your child',
           'You are doing everything, alone, and still bracing for the next call'] },

  {t:'hook', kick:'The reframe',
    big:'What if your kid was <span class="a">never the problem?</span>' },

  {t:'part', kick:'Part one', h:'The problem is the paradigm, not the child',
    lead:'We were taught to measure our kids against a conventional norm and to treat the gap as a deficit. The gap is real. The deficit is a story. Change the story and the whole family dynamic moves.' },

  {t:'cost', kick:'The cost of the old lens',
    h:'Fighting who they are is a full-time job',
    items:['Isolation: you stop telling people what home actually looks like',
           'Fear: every decision is made from what might go wrong',
           'Burnout: there is nothing left for you, so there is less for them'] },

  {t:'part', kick:'Part two', h:'The tilts',
    lead:'At the heart of Differently Wired are 18 paradigm shifts, the tilts. Each one is a small change in how you see, and everything downstream follows. Here are four to start.' },

  {t:'tilt', no:'Tilt 05', tilt:'Parent from a place of possibility, not fear',
    note:'Fear parents for the worst case. Possibility parents for the kid in front of you. Same love, completely different decisions.' },

  {t:'tilt', no:'Tilt 04', tilt:'Stop fighting who your child is, lean in',
    note:'The energy you spend wishing they were different is the energy you need to help the kid you actually have.' },

  {t:'tilt', no:'Tilt 07', tilt:'Become fluent in your child’s language',
    note:'Behavior is communication. When you learn how they say "I am overwhelmed," the meltdowns start to make sense.' },

  {t:'tilt', no:'Tilt 02', tilt:'Get out of isolation and connect',
    note:'You were never meant to carry this alone, and the parents who find their people last the longest.' },

  {t:'center', kick:'The one that lands hardest',
    big:'He is not giving you a hard time.<br>He is <span class="a">having</span> one.',
    note:'Say it about the next hard moment and watch what it changes in you first.' },

  {t:'part', kick:'Part three', h:'What a week looks like after the tilt',
    items:['The 8am battle becomes a cue you can read, not a verdict on your parenting',
           'You advocate from steadiness instead of panic',
           'Your kid feels seen, and a seen kid settles'] },

  {t:'why', kick:'Why me',
    h:'I built this because I needed it',
    lead:'I raised a twice-exceptional son and found the advice everywhere pointed at fixing him. It was the wrong aim. I wrote Differently Wired, have recorded 500 plus episodes of the Full-Tilt Parenting podcast, and built a community of parents who stopped parenting alone.',
    by:'Debbie Reber, MA' },

  {t:'next', kick:'Where to go from here',
    h:'Keep practicing the tilts, with people who get it',
    lead:'One masterclass starts the shift. Living it is a practice, and it is easier in a room of parents doing the same thing, with coaching when the week gets hard.' },

  {t:'cta', kick:'Your next step',
    h:'Come into the Differently Wired Club',
    lead:'The neurodiversity-affirming membership where parents get real support, trusted guidance, and a place where they and their kids are understood.',
    btn:'Start here at tiltparenting.com',
    disc:'This masterclass is educational. Every child and family is different, and individual results are not guaranteed. Results vary. Nothing here is medical, psychological, or clinical advice.' }
];

function esc(x){return x;}
function render(){
  const wrap = document.getElementById('wrap');
  S.forEach((s,i)=>{
    let inner = '';
    if(s.kick) inner += '<div class="kick">'+s.kick+'</div>';
    if(s.t==='hook'||s.t==='center'){ inner += '<div class="big">'+s.big+'</div>'; if(s.note) inner+='<div class="note">'+s.note+'</div>'; }
    else if(s.t==='title'){ inner += '<h1>'+s.h+'</h1>'; if(s.lead) inner+='<div class="lead">'+s.lead+'</div>'; if(s.by) inner+='<div class="by">'+s.by+'</div>'; }
    else if(s.t==='tilt'){ inner += '<div class="tiltno">'+s.no+'</div><div class="tilt">'+s.tilt+'</div>'; if(s.note) inner+='<div class="note">'+s.note+'</div>'; }
    else if(s.t==='cta'){ inner += '<h2>'+s.h+'</h2>'; if(s.lead) inner+='<div class="lead">'+s.lead+'</div>'; inner+='<div><span class="btn">'+s.btn+'</span></div>'; inner+='<div class="disc">'+s.disc+'</div>'; }
    else {
      inner += (i===0?'<h1>':'<h2>')+s.h+(i===0?'</h1>':'</h2>');
      if(s.lead) inner+='<div class="lead">'+s.lead+'</div>';
      if(s.items){ inner+='<ul>'; s.items.forEach(it=> inner+='<li><span class="d"></span><span>'+it+'</span></li>'); inner+='</ul>'; }
      if(s.by) inner+='<div class="by">'+s.by+'</div>';
      if(s.note) inner+='<div class="note">'+s.note+'</div>';
    }
    inner += '<div class="foot">The Tilt &middot; Differently Wired</div><div class="pageno">'+(i+1)+' / '+S.length+'</div>';
    const div = document.createElement('div');
    div.className='slide '+(s.t==='cta'?'cta':'');
    div.innerHTML = inner;
    wrap.appendChild(div);
  });
}
render();
</script>
</body>
</html>
