<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under-Converted, Not Under-Trained | Nucleus CRE</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=Lora:wght@400;500&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#052044;
    --panel:#00142e;
    --rule:#2a4a73;
    --accent:#ef4423;
    --ink:#ffffff;
    --ink-soft:#c9d6e8;
    --ink-muted:#8aa0bf;
  }
  html,body{height:100%}
  body{font-family:'Lora',Georgia,serif;background:var(--panel);color:var(--ink);overflow:hidden}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:100%;height:100%;padding:7vh 9vw;flex-direction:column;justify-content:center;background:var(--bg)}
  .slide.on{display:flex}
  .eyebrow{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(11px,1.4vw,15px);letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(30px,6vw,68px);line-height:1.04;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(24px,4.4vw,46px);line-height:1.1;margin-bottom:22px}
  .sub{font-size:clamp(17px,2.2vw,26px);color:var(--ink-soft);max-width:32ch;line-height:1.5}
  .body{font-size:clamp(16px,2vw,23px);color:var(--ink-soft);max-width:42ch;line-height:1.6}
  ul{list-style:none;margin-top:10px}
  li{font-size:clamp(16px,2vw,24px);color:var(--ink-soft);padding:14px 0 14px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:23px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .num{font-family:'Archivo',sans-serif;font-weight:800;color:var(--accent);font-size:clamp(14px,1.8vw,20px);margin-right:10px}
  .kicker{font-family:'Archivo',sans-serif;font-weight:700;font-size:clamp(13px,1.6vw,18px);color:var(--ink-muted);margin-bottom:18px;letter-spacing:.04em}
  .disc{margin-top:30px;font-size:clamp(11px,1.2vw,14px);color:var(--ink-muted);max-width:56ch;line-height:1.5}
  .brandline{position:fixed;left:9vw;bottom:4vh;font-family:'Archivo',sans-serif;font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
  .pager{position:fixed;right:9vw;bottom:4vh;font-family:'Archivo',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--ink-muted)}
  .accentbar{width:68px;height:6px;background:var(--accent);margin-bottom:28px;border-radius:3px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  @media(max-width:720px){.two{grid-template-columns:1fr;gap:22px}}
  .stat{font-family:'Archivo',sans-serif;font-weight:800;font-size:clamp(30px,6vw,64px);color:var(--ink)}
  .stat span{color:var(--accent)}
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandline">Nucleus CRE &middot; #CREvolution</div>
<div class="pager" id="pager"></div>
<script>
const S=[
 {t:'title', h:`<div class="accentbar"></div><div class="eyebrow">A Nucleus CRE Masterclass</div><h1>Under-Converted,<br>Not Under-Trained</h1><div class="sub">The commercial agent's production operating system: turning what you already know into consistent closed business.</div>`},
 {t:'who', h:`<div class="eyebrow">Who this is for</div><h2>If you know the material but your month still feels like a roller coaster</h2><ul><li>New to commercial, or crossing over from residential</li><li>Trained, certified, and still producing in fits and starts</li><li>A team or brokerage that wants predictable production, not hope</li></ul>`},
 {t:'trap', h:`<div class="eyebrow">The trap</div><h2>You took the courses. You passed the tests. You still cannot predict next quarter.</h2><div class="body">More training was supposed to fix it. It did not. The thing that was missing was never more knowledge.</div>`},
 {t:'reframe', h:`<div class="eyebrow">The hard truth</div><h1>Most agents are running a hope-based business.</h1><div class="sub">Hoping the lead calls back. Hoping the deal closes. Hoping next quarter beats the last one. That is not a business. That is a roller coaster.</div>`},
 {t:'p1', h:`<div class="kicker">PART ONE</div><h2>The gap is not knowledge. It is a system.</h2><div class="body">A million dollars of commission does not come from working harder or learning one more tactic. It comes from a repeatable system that runs whether you feel motivated that day or not.</div>`},
 {t:'cost', h:`<div class="eyebrow">What hope costs you</div><div class="two"><div><div class="stat"><span>5</span> leads/day</div><div class="body" style="margin-top:14px">A production business puts five new opportunities into the pipeline every single day. Hope puts in whatever happens to show up.</div></div><div><div class="stat">before <span>11am</span></div><div class="body" style="margin-top:14px">The numbers that decide your month get tracked before 11:00 AM, or they do not get tracked at all.</div></div></div>`},
 {t:'p2intro', h:`<div class="kicker">PART TWO</div><h2>The Nucleus Production Operating System</h2><div class="body">Four moving parts, run in the same order every day, so production stops depending on your mood and starts depending on your system.</div><ul><li>A strategic database that generates opportunities</li><li>Ask-to-be-Hired conversations, daily</li><li>A pipeline you can actually trust</li><li>Numbers that tell the truth before 11am</li></ul>`},
 {t:'pillar1', h:`<div class="eyebrow"><span class="num">01</span>The 8 Week Database</div><h2>Your database is your business. Most agents treat it like a junk drawer.</h2><div class="body">Build, segment and work a targeted database so the list itself surfaces the next deal. A simple, powerful system that turns names you already have into revenue.</div>`},
 {t:'pillar2', h:`<div class="eyebrow"><span class="num">02</span>Ask-to-be-Hired conversations</div><h2>Two a day. Every day.</h2><div class="body">Not pitching. Not hoping. A specific conversation that ends with the prospect asking you to go to work. Run twice a day, it changes the shape of your pipeline in weeks.</div>`},
 {t:'pillar3', h:`<div class="eyebrow"><span class="num">03</span>Five new leads a day</div><h2>A pipeline you can trust</h2><div class="body">Five new opportunities in, every day, through a prospecting system that creates them on purpose instead of waiting for referrals to appear.</div>`},
 {t:'pillar4', h:`<div class="eyebrow"><span class="num">04</span>Track what drives production</div><h2>If you cannot see the number, you cannot move it.</h2><div class="body">Track the handful of activities and numbers that actually drive closed business, and review them before 11:00 AM, so the rest of the day goes to what the numbers told you.</div>`},
 {t:'pillar5', h:`<div class="eyebrow"><span class="num">05</span>Protect the calendar</div><h2>Guard the hours that make money</h2><div class="body">Revenue-generating work gets the protected block. Everything else fits around it. The daily habits are what make the system survive a slow market.</div>`},
 {t:'day', h:`<div class="eyebrow">The daily rhythm</div><h2>30 minutes. Same order. Every day.</h2><ul><li>Work the database for today's live opportunities</li><li>Line up and run your two Ask-to-be-Hired conversations</li><li>Feed five fresh leads into the pipeline</li><li>Log the numbers before 11:00 AM and adjust</li></ul>`},
 {t:'ninety', h:`<div class="kicker">PART THREE</div><h2>What 90 days of real production looks like</h2><div class="body">Consistent inventory. A pipeline you can forecast. Closed business that keeps coming regardless of what the market is doing, because the system is no longer you plus hope.</div>`},
 {t:'why', h:`<div class="eyebrow">Why it holds</div><h1>Systems beat motivation on the days motivation does not show up.</h1><div class="sub">Consistency compounds. A mediocre system run daily will outproduce a brilliant agent running on hope every time.</div>`},
 {t:'credibility', h:`<div class="eyebrow">Who teaches this</div><h2>Built by Nucleus CRE</h2><div class="body">The most complete commercial real estate training in the industry. Over 2,000 agents have come through Nucleus CORE, and Nucleus now powers KW Commercial's training curriculum. Clear steps. Real skills. Proven results.</div>`},
 {t:'shift', h:`<div class="accentbar"></div><h1>From under-converted to in-production.</h1><div class="sub">You were never under-trained. You were missing the operating system. This is that system.</div>`},
 {t:'cta', h:`<div class="eyebrow">Your next step</div><h2>Join the #CREvolution</h2><div class="body">If you are ready to trade a hope-based business for a production system, come build it with Nucleus. Start with Nucleus CORE or step into 7in90 and install the full operating system in 90 days.</div><div class="disc">Educational content only. No income, production, or result is guaranteed. Results vary and depend on your market, effort, and execution.</div>`}
];
let i=0;
const stage=document.getElementById('stage');
const pager=document.getElementById('pager');
function render(){
 stage.innerHTML=S.map((s,n)=>`<div class="slide${n===i?' on':''}">${s.h}</div>`).join('');
 pager.textContent=(i+1)+' / '+S.length;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render();}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1);});
document.addEventListener('click',e=>{go(e.clientX<window.innerWidth*0.33?-1:1);});
render();
</script>
</body>
</html>
