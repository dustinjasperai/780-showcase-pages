<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Speak So The Room Listens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f082b;
    --panel:#1a1240;
    --rule:#776f97;
    --accent:#4cbbcf;
    --ink:#eceaf4;
    --muted:#c9c5d8;
    --display:'Manrope',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:56px 52px;margin:22px 0;min-height:360px;display:flex;flex-direction:column;justify-content:center}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.14}
  .promise{font-size:20px;color:var(--muted);margin-top:18px;max-width:34ch}
  p.lead{font-size:20px;color:var(--ink);margin-top:14px;max-width:46ch}
  p.sub{font-size:17px;color:var(--muted);margin-top:14px;max-width:52ch}
  ul{margin-top:18px;padding-left:0;list-style:none}
  li{font-size:18px;color:var(--ink);margin:12px 0;padding-left:26px;position:relative}
  li:before{content:"";position:absolute;left:0;top:9px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .part{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase}
  .big{font-size:40px;font-family:var(--display);font-weight:800;line-height:1.1;margin-top:10px}
  .brandline{margin-top:30px;font-size:15px;color:var(--muted)}
  .pillar-no{font-family:var(--display);font-weight:800;font-size:20px;color:var(--accent)}
  .cta .btn{display:inline-block;margin-top:24px;background:var(--accent);color:#06121a;font-family:var(--display);font-weight:800;padding:14px 26px;border-radius:999px;font-size:17px;text-decoration:none}
  .disclaimer{margin-top:26px;font-size:13px;color:var(--muted);max-width:60ch}
  .footer{text-align:center;color:var(--muted);font-size:13px;padding:14px 0 30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="footer">Be Your Own Coach &middot; with Kathy Brooke</div>
<script>
const S=[
 {t:'title',eyebrow:'A live masterclass',h1:'Speak So The Room Listens',promise:'Steady your voice. Hold the room. In any meeting that actually matters.',brand:'With Kathy Brooke &middot; Be Your Own Coach'},
 {t:'for',eyebrow:'Who this is for',h2:'For leaders and professionals who have to present, pitch and speak up',sub:'If you know your subject cold but the delivery still lets you down, this hour is built for you.'},
 {t:'trap',eyebrow:'The moment it goes wrong',h2:'You know the content. Then you stand up, the voice goes thin, and the room drifts.',sub:'It is not that you have nothing to say. It is that nobody ever taught you what to do with your voice and your nerves in real time.'},
 {t:'reframe',eyebrow:'The reframe',big:'The problem was never confidence. It was mechanics nobody showed you.',sub:'Presence is a set of trainable skills: breath, pace, structure and a way to handle the nerves. Learn the mechanics and the confidence follows.'},
 {t:'parttitle',part:'Part One',h2:'Why the room drifts'},
 {t:'content',eyebrow:'The body goes first',h2:'Nerves hit the body before the brain',sub:'Shallow breath, a racing heart, a tightening throat. The voice shakes because the system is in fight-or-flight, not because you are not good enough.'},
 {t:'content',eyebrow:'Three leaks',h2:'A talk loses people in three places',list:['The open, when you bury the point','The middle, when there is no spine to follow','The close, when it fades instead of landing']},
 {t:'parttitle',part:'Part Two',h2:'The three pillars'},
 {t:'pillar',no:'Pillar 1',h2:'Voice and delivery',sub:'The breath, pace and pause mechanics that steady a shaking voice and make it carry across a room.'},
 {t:'content',eyebrow:'Pillar 1, in practice',h2:'Breathe low, slow the pace, use the pause',list:['Breath from the belly resets the throat','A slower pace reads as authority, not nerves','The pause is where the room leans in']},
 {t:'pillar',no:'Pillar 2',h2:'Presence under pressure',sub:'Reframing the nerves and a short pre-talk routine so you walk in with authority instead of adrenaline.'},
 {t:'content',eyebrow:'Pillar 2, in practice',h2:'A routine for the ten minutes before',list:['Name the nerves as energy, not a warning','A fixed pre-talk routine you can repeat anywhere','One grounding focus for the first sixty seconds']},
 {t:'pillar',no:'Pillar 3',h2:'Structure that lands',sub:'Shaping a talk or a pitch so the point actually arrives, in the room and in the memory.'},
 {t:'content',eyebrow:'Pillar 3, in practice',h2:'Open on the point, build one spine, close on action',list:['Lead with the thing they need to remember','One clear through-line, not five threads','End with the single next step you want']},
 {t:'parttitle',part:'Part Three',h2:'What it looks like'},
 {t:'content',eyebrow:'Before and after',h2:'Same person, same content, a different room',sub:'The difference is never a new personality. It is a steadier voice, a prepared nervous system and a talk built to land. That is learnable in an afternoon and sharpened over weeks.'},
 {t:'why',eyebrow:'Why learn this from Kathy',h2:'Fifteen years inside voice, public speaking and presence',sub:'Kathy Brooke has spent over fifteen years coaching voice, public speaking and presentation, hosts The Personal Development Podcast, and founded Be Your Own Coach to put that work in reach of leaders and teams.'},
 {t:'recap',eyebrow:'Recap',h2:'Three pillars, one steadier room',list:['Voice and delivery','Presence under pressure','Structure that lands']},
 {t:'cta',eyebrow:'Your next step',h2:'Want to work on your own voice and presence?',sub:'Book a session with Kathy or explore the live and self-paced work inside Be Your Own Coach.',btn:'Book a session with Kathy',disclaimer:'This masterclass is educational and shares skills and frameworks for voice, presence and communication. No income or result is guaranteed. Results vary by person and effort.'}
];
const el=document.getElementById('deck');
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide '+s.t;
  let h='';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.part) h+='<div class="part">'+s.part+'</div>';
  if(s.no) h+='<div class="pillar-no">'+s.no+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.promise) h+='<div class="promise">'+s.promise+'</div>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
  if(s.list){h+='<ul>';s.list.forEach(i=>h+='<li>'+i+'</li>');h+='</ul>';}
  if(s.btn) h+='<a class="btn" href="https://beyourowncoach.com/coaching">'+s.btn+'</a>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  if(s.brand) h+='<div class="brandline">'+s.brand+'</div>';
  d.innerHTML=h;
  el.appendChild(d);
});
</script>
</body>
</html>
