<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Break the Lie-Locked Life — a masterclass with Sandra Krug</title>
<link href="https://fonts.googleapis.com/css2?family=Cardo:wght@400;700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#161e2a;
    --panel:#22304a;
    --accent:#e2dcc6;
    --ink:#f4efe4;
    --muted:#aeb8c6;
    --rule:rgba(226,220,198,.22);
    --head:'Cardo',Georgia,serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0d131d;color:var(--ink);font-family:var(--body);line-height:1.5;padding:40px 18px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:28px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:16px;
    aspect-ratio:16/10;padding:66px 70px;display:flex;flex-direction:column;position:relative;overflow:hidden}
  .slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.9}
  .kick{font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:22px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:40px;line-height:1.1;margin-bottom:8px}
  .sub{font-size:23px;color:var(--muted);margin-top:22px;max-width:40ch}
  .lede{font-size:26px;line-height:1.5;margin-top:10px;max-width:46ch}
  .big{font-family:var(--head);font-size:46px;line-height:1.14;max-width:36ch}
  .accent{color:var(--accent)}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:18px}
  li{font-size:22px;padding-left:34px;position:relative;max-width:48ch;color:var(--ink)}
  li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:4px;background:var(--accent)}
  .steps{display:flex;gap:18px;margin-top:30px;flex-wrap:wrap}
  .step{flex:1;min-width:180px;background:var(--panel);border-radius:14px;padding:26px 24px}
  .step .n{font-family:var(--head);font-size:34px;color:var(--accent)}
  .step .t{font-size:22px;font-weight:700;margin-top:6px}
  .step .d{font-size:17px;color:var(--muted);margin-top:8px}
  .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;
    border-top:1px solid var(--rule);padding-top:18px;font-size:14px;color:var(--muted);letter-spacing:.02em}
  .center{justify-content:center}
  .part .kick{font-size:16px}
  .part h1{font-size:64px}
  .disc{font-size:15px;color:var(--muted);margin-top:22px;max-width:60ch;line-height:1.5}
  .cta-line{font-size:24px;color:var(--accent);font-weight:600;margin-top:18px}
  .who{font-size:22px;color:var(--ink);margin-top:14px;max-width:48ch}
  .pills{display:flex;gap:14px;margin-top:26px;flex-wrap:wrap}
  .pill{background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:10px 20px;font-size:16px;color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for Christian women', h:'Break the Lie-Locked Life', sub:'The Truth Mindset Method for renewing your mind and walking in who God made you to be.', who:'With Sandra Krug, Board Certified Coach and Certified Master Christian Life Coach'},
  {t:'who', kick:'Who this is for', h:'You are doing everything right.', lede:'You pray. You serve. You show up for everyone. And underneath it, there is still a heaviness you cannot quite name.'},
  {t:'trap', kick:'The quiet trap', h:'More effort has not fixed it.', lede:'You have tried new habits, new planners, new seasons of discipline. The stuck feeling keeps coming back, and you start to wonder if this is just who you are.'},
  {t:'hook', kick:'The real reason', big:'It was never a discipline problem. It is a <span class="accent">lie</span> you cannot see.'},
  {t:'part', part:true, kick:'Part One', h:'The Lie-Locked Life'},
  {t:'define', kick:'What it is', h:'A Lie-Locked life', lede:'Your mind, your decisions, and your identity get silently shaped by lies you picked up along the way, often without ever realizing it. They act like invisible chains that feel like personality.'},
  {t:'sources', kick:'Where the lies come from', h:'Three common sources', items:['Spoken words: the critical or diminishing things others said','Painful experiences: abandonment, betrayal, rejection','External pressure: social media, hustle culture, impossible standards']},
  {t:'cycle', kick:'Why it sticks', h:'The lie protects itself', lede:'Once a lie takes root, it runs on fear, shame, and avoidance. You build your life around not triggering it, and that is exactly how it stays hidden and in charge.'},
  {t:'part', part:true, kick:'Part Two', h:'The Truth Mindset'},
  {t:'framework', kick:'The method', h:'How the thinking actually changes', steps:[{n:'1',tl:'Uncover',d:'Name the specific lie-based belief running underneath'},{n:'2',tl:'Replace',d:'Swap it for a truth-based declaration from God’s Word'},{n:'3',tl:'Live Free',d:'Walk it out until the renewed mind becomes your default'}]},
  {t:'uncover', kick:'Move One', h:'Uncover', lede:'We trace the stuck feeling back to the sentence underneath it. You cannot replace a lie you have never said out loud. Naming it is where the chain first loosens.'},
  {t:'replace', kick:'Move Two', h:'Replace', lede:'Every lie gets answered with what is actually true of you in Christ. Not a slogan, a declaration you can stand on:', pills:['Loved','Chosen','Set apart','Equipped','Forgiven','Purposed','Called']},
  {t:'livefree', kick:'Move Three', h:'Live Free', lede:'Renewal is a practice, not a single moment. We build the daily rhythm that keeps truth louder than the old lie, so the change holds long after our work together.'},
  {t:'science', kick:'Why it works', h:'Scripture and the way God built your mind', lede:'Renewing the mind is a biblical command and a measurable reality. When you replace distorted thoughts with truth, over time you rebuild the patterns your brain runs on by default.'},
  {t:'tower', kick:'When truth meets a plan', h:'The T.O.W.E.R. Framework', lede:'Truth gives you clarity. A plan gives it legs. My goal-planning method turns conviction into motion:', items:['Target the aim, one Scripture-aligned goal','Outline your resources honestly','Write milestones you can date','Establish boundaries that protect your focus','Review and rejoice every week']},
  {t:'part', part:true, kick:'Part Three', h:'What changes'},
  {t:'outcome', kick:'The arc', h:'Success, Significance, Legacy', steps:[{n:'I',tl:'Success',d:'You stop striving against a lie and start moving from a settled place'},{n:'II',tl:'Significance',d:'Your energy turns outward, toward the purpose you were made for'},{n:'III',tl:'Legacy',d:'What God renews in you becomes what you pass on'}]},
  {t:'whyme', kick:'Why trust me with this', h:'Sandra Krug', lede:'A poor girl from Mississippi who became a nurse, then gave her life to helping women walk free. Board Certified Coach, Certified Master Christian Life Coach, Ziglar Master Coach, and a Doctor of Divinity. My why is simple: to help women find freedom.'},
  {t:'next', kick:'Your next step', h:'Let us find the first lie together.', lede:'If something in this hit close, that is worth paying attention to. The fastest way forward is a conversation, not another program you try alone.'},
  {t:'cta', kick:'Begin here', h:'Book a free Transformational Game Plan call', cta:'Visit lifecoachforladies.com to schedule', disc:'This masterclass is educational. No specific outcome or result is guaranteed. Results vary and depend on your own effort, circumstances, and walk with God.'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const sl = el('div', 'slide' + (s.part?' part center':'') + (s.t==='title'||s.t==='hook'||s.t==='cta'?' center':''));
  if(s.kick) sl.appendChild(el('div','kick',s.kick));
  if(s.h) sl.appendChild(el(s.part||s.t==='title'?'h1':'h2', null, s.h));
  if(s.sub) sl.appendChild(el('div','sub',s.sub));
  if(s.big) sl.appendChild(el('div','big',s.big));
  if(s.lede) sl.appendChild(el('div','lede',s.lede));
  if(s.who) sl.appendChild(el('div','who',s.who));
  if(s.items){const ul=el('ul'); s.items.forEach(it=>ul.appendChild(el('li',null,it))); sl.appendChild(ul);}
  if(s.pills){const p=el('div','pills'); s.pills.forEach(x=>p.appendChild(el('div','pill',x))); sl.appendChild(p);}
  if(s.steps){const w=el('div','steps'); s.steps.forEach(st=>{const d=el('div','step'); d.appendChild(el('div','n',st.n)); d.appendChild(el('div','t',st.tl)); d.appendChild(el('div','d',st.d)); w.appendChild(d);}); sl.appendChild(w);}
  if(s.cta) sl.appendChild(el('div','cta-line',s.cta));
  if(s.disc) sl.appendChild(el('div','disc',s.disc));
  const f=el('div','foot'); f.appendChild(el('span',null,'Life Coach for Ladies')); f.appendChild(el('span',null,(i+1)+' / '+S.length)); sl.appendChild(f);
  deck.appendChild(sl);
});
</script>
</body>
</html>
