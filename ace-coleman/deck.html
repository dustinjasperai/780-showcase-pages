<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Own the Shot · Ace Coleman, Champion Archer Academy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#1c1c1e; --panel:#26262a; --rule:#3a3a3e;
    --acc:#c1272d; --ink:#f2f1ef; --body:#c9c7c4; --dim:#8f8d8b; --steel:#55636f;
  }
  html,body{height:100%}
  body{background:#111112;font-family:'Open Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#111112}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Oswald',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Oswald',sans-serif;font-weight:600;color:var(--ink);line-height:1.08;letter-spacing:.005em;text-transform:uppercase}
  .t-title h1{font-size:5.6vw;max-width:94%}
  .t-normal h1{font-size:3.5vw;max-width:92%;text-transform:none;font-weight:600;letter-spacing:0}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.7vw;color:var(--acc);margin-top:3.2vh;max-width:84%;line-height:1.45;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Oswald',sans-serif;font-size:1.15vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:94%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 12%,#2a1315 0%,#161314 62%,#111112 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:88%;color:var(--ink);text-transform:none;font-weight:600;letter-spacing:0}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#2a1315 0%,#161314 62%,#111112 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.0vw;max-width:86%;color:var(--ink)}
  .t-cta .body{font-family:'Open Sans',sans-serif;color:#d9d6d3;font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--ink);border-radius:100px;padding:1.4vh 1.9vw;font-family:'Oswald',sans-serif;font-size:1.15vw;font-weight:500;letter-spacing:.04em;text-transform:uppercase}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .rings-motif{position:absolute;pointer-events:none}
  .title-rings{right:7%;bottom:7.5%;width:18vw;opacity:.95}
  .corner-rings{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.5}
  .brandline{font-family:'Oswald',sans-serif;font-size:1.2vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.14em;text-transform:uppercase}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(242,241,239,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Oswald',sans-serif;font-size:12px;letter-spacing:.18em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Oswald',sans-serif;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Oswald',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.12em;text-transform:uppercase;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.8vw}.t-title h1{font-size:9.2vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:8vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Champion Archer Academy</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- target-ring motif: concentric rings with a center X and an arrow line, drawn in target red -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rings" viewBox="0 0 120 120">
  <g fill="none" stroke="#c1272d" stroke-width="2" stroke-linecap="round">
    <circle cx="60" cy="60" r="44" opacity="0.35"/>
    <circle cx="60" cy="60" r="31" opacity="0.55"/>
    <circle cx="60" cy="60" r="18" opacity="0.8"/>
    <path d="M53 53 L67 67 M67 53 L53 67" opacity="0.95"/>
  </g>
  <g stroke="#f2f1ef" stroke-width="2" stroke-linecap="round" opacity="0.7">
    <path d="M8 112 L54 66"/>
    <path d="M8 112 L8 100 M8 112 L20 112"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Own the Shot',sub:'How to end target panic by fixing the mind, not the form, and let the shot break clean when it counts.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can stack arrows in the backyard. Then the pin hits gold and your hand quits on you.',body:'You have put in the reps. Your groups at home are tight. But step to the line at a tournament, or draw back on the animal you have waited all season for, and something takes over. You freeze off the middle, or you punch the trigger to make it go, or you flinch at the shot. The score you shoot has nothing to do with the archer you actually are.'},
 {t:'dark',title:'Target panic is not a form flaw. It is a mind that stopped trusting the shot.'},

 {t:'section',idx:'Part One',title:'Why the Shot Falls Apart'},
 {t:'normal',k:'The real mechanism',title:'Target panic is your conscious mind trying to time a shot it was never meant to time.',body:'When the pin settles on the center, the thinking part of your brain jumps in to make the shot happen at exactly the right instant. That is the moment it breaks down. You cannot consciously command a surprise release, so the mind panics: it freezes off the middle, or it grabs the trigger to end the discomfort. More aiming makes it worse, because more aiming is more of the exact thing causing it.'},
 {t:'normal',k:'The three faces of it',title:'Freezing, punching, and flinching are the same problem wearing three masks.',body:'Freezing off the center, punching the trigger the second the pin touches gold, and flinching at the break all come from one place: the shot is being driven by anxiety instead of by a routine. Treat them as form problems and you will tune your bow forever and never fix them. They are a mind problem, and they have a mental solution.'},
 {t:'dark',title:'You cannot out-tune a trust problem. No bow setup fixes the two seconds before the release.'},

 {t:'section',idx:'Part Two',title:'The Champion Archer Mental Game'},
 {t:'normal',k:'Champion Foundations',title:'It starts with what you expect before the arrow is ever nocked.',body:'Before the routine, before the release, there is a mindset layer. Champion Foundations is how you manage expectation and pressure, and how a simple journaling habit turns a bad end into information instead of a spiral. You cannot run a calm shot process on top of a mind that is scared of the outcome, so this comes first.'},
 {t:'normal',k:'The Thought Doorway',title:'You do not get to have no thoughts at full draw. You get to choose which ones you let in.',body:'At full draw the mind will not go silent. The Thought Doorway is how you decide what passes through in those last seconds: the cue that keeps you in the process, and the fear thought you let walk right back out. This is the difference between a mind that is along for the ride and a mind that is running the shot.'},
 {t:'normal',k:'The Champion Archer Mental Shot Routine',title:'A shot that runs the same way every time cannot be hijacked at the last second.',body:'The Mental Shot Routine is the repeatable sequence you run on every arrow, in practice and under the lights, so the shot stops being a decision you make and starts being a process you trust. When the routine is the same on arrow one and arrow sixty, the pressure has nothing to grab onto. That is what lets the shot break as a surprise instead of a punch.'},
 {t:'normal',k:'Let the shot break',title:'Your job is to aim and run the process. The shot going off is not your job.',body:'The clean shot is a surprise break: you hold in the center, you run the routine, and you let the release happen instead of making it happen. The whole method points here, to a shot you no longer try to time. Practice it deliberately and the surprise break stops being luck and becomes the way you shoot.'},
 {t:'dark',title:'Aim. Run the routine. Let it go. The middle takes care of itself.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Own the Shot'},
 {t:'normal',k:'The archer this builds',title:'You finally shoot your practice scores when the scorecard is real.',body:'When the shot is a routine and not a fight, the gap between your backyard groups and your tournament scores closes. You stop dreading the moment the pin hits gold, because you know what you are going to do with it. A bad arrow becomes one arrow, not the start of a meltdown, and the archer who shows up under pressure is the one you have actually been all along.'},
 {t:'dark',title:'The goal was never a perfect shot. It was a shot you trust, on demand, when it matters.'},
 {t:'normal',k:'Why Ace Coleman',title:'A pro who won at every amateur level, then built the system to teach it.',body:'Ace Coleman swept all three ASA amateur known-distance classes and finished as the 2022 K50 Shooter of the Year, and now competes in the Known Pro class in ASA and shoots professionally in the NFAA. He has coached more than 300 archers nationwide on accuracy, consistency, and the mental game. Champion Archer Academy is where that entire method lives.'},

 {t:'section',idx:'Your Next Step',title:'Beat Target Panic For Good'},
 {t:'normal',k:'Keep going with Ace',title:'The full method, from your first calm shot to a mental game that holds under the lights.',body:'Champion Archer Academy is the whole path: the Mental Shot Routine and the Thought Doorway, the form and bow-setup work behind them, and a year of weekly live coaching calls to put it into your own shooting. Start with the free target-panic training, and apply for one-on-one coaching when you are ready to go all in.'},
 {t:'cta',title:'Ready to own the shot when it counts?',body:'Take the next step with Champion Archer Academy.',chips:['Start the free training','Apply for 1-on-1 coaching'],disc:'Educational content for target and bowhunting archers. No score, placement, or result is guaranteed. Progress varies by archer, equipment, and practice.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="rings-motif ${kind==='title'?'title-rings':'corner-rings'}"><use href="#rings"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Champion Archer <b>Academy</b> · Ace Coleman</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
