<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Movement-First Path — Big Picture Skiing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9ecf2; --panel:#fcfdfe; --ink:#111827; --muted:#6b7280;
    --rule:#e5e7eb; --accent:#ff5555; --navy:#232b47;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 90px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:54px 52px;margin:0 0 26px;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;top:26px;left:0;width:4px;height:46px;background:var(--accent);
  }
  .kicker{font-family:Barlow;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:Barlow;font-weight:800;font-size:52px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:Barlow;font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  .promise{margin-top:20px;font-size:21px;color:var(--muted);max-width:40ch;line-height:1.5}
  p.body{margin-top:18px;font-size:19px;line-height:1.6;max-width:52ch;color:#1f2937}
  .big{font-family:Barlow;font-weight:700;font-size:40px;line-height:1.14;max-width:22ch}
  .part{background:var(--navy);color:#f6f7f9}
  .part::before{background:var(--accent)}
  .part .kicker{color:#ff8a8a}
  .part h2{color:#ffffff;font-size:40px}
  .part p{color:#c7cbd6;margin-top:16px;font-size:19px;max-width:46ch;line-height:1.55}
  ul.pillars{margin-top:26px;list-style:none;display:grid;gap:14px}
  ul.pillars li{display:flex;gap:14px;align-items:flex-start;font-size:19px;line-height:1.5}
  ul.pillars li b{font-family:Barlow;font-weight:700}
  .num{font-family:Barlow;font-weight:800;color:var(--accent);min-width:34px;font-size:22px}
  .pillar-lead{display:flex;align-items:baseline;gap:16px}
  .pillar-lead .idx{font-family:Barlow;font-weight:800;font-size:60px;color:var(--accent);line-height:1}
  .creds{margin-top:22px;display:grid;gap:10px;max-width:50ch}
  .creds div{font-size:17px;color:#1f2937;padding-left:16px;border-left:2px solid var(--rule)}
  .cta h2{font-size:40px}
  .cta .step{margin-top:22px;display:inline-block;font-family:Barlow;font-weight:700;font-size:20px;
    color:#fff;background:var(--accent);padding:14px 26px;border-radius:10px}
  .disclaimer{margin-top:30px;font-size:13px;color:var(--muted);max-width:58ch;line-height:1.5}
  .brandline{position:absolute;bottom:20px;right:30px;font-family:Barlow;font-weight:600;
    font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
  .count{position:absolute;bottom:20px;left:30px;font-size:12px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'Big Picture Skiing · Live Masterclass',
   h:'The Movement-First Path',
   promise:'Why intermediate skiers plateau, and the biomechanics that break it.'},

  {t:'who', kicker:'Who this is for',
   big:'For the skier who takes a lesson every season and still skis the same.',
   body:'You can get down anything. You just know it could feel better, and on the steep and the bumps it still falls apart.'},

  {t:'trap', kicker:'The trap',
   big:'You were handed shapes to copy.',
   body:'Bend here. Angulate there. Pole plant now. It works on a groomed blue at half speed. Then the slope tilts up, the speed climbs, and there is no time to think your way through a checklist.'},

  {t:'reframe', kicker:'The reframe',
   big:'The problem was never your effort. You learned positions, not movements.',
   body:'Positions are static. Skiing is not. Great skiers are not holding a shape, they are producing a movement, by feel, faster than conscious thought.'},

  {t:'part', kicker:'Part One',
   h2:'Why copying shapes stops working',
   p:'A position is a photograph. A turn is a film. When you chase the photograph you freeze up exactly when the mountain asks you to flow.'},

  {t:'content', kicker:'The plateau, explained',
   big:'Technique you have to think about is technique you cannot use.',
   body:'Under real speed and real pressure your attention is full. If the movement is not automatic, it is not there when you need it. That gap is the plateau, and no amount of trying harder closes it.'},

  {t:'content', kicker:'Skiing is an ecological skill',
   big:'You do not ski a rulebook. You ski the snow in front of you.',
   body:'The body self-organizes the right movement when you train the right tasks and feelings, not when you memorize more positions. Learn to feel it, and the slope coaches you on every run.'},

  {t:'part', kicker:'Part Two',
   h2:'The four movements that actually separate expert skiers',
   p:'Not four more shapes to hold. Four movements to own, each one trainable on and off the snow.'},

  {t:'pillar', idx:'01', kicker:'Movement one',
   h2:'Separation',
   body:'Upper body quiet and facing down the hill, lower body free to work the turn beneath it. Separation is what lets your edges do the work while your balance stays over the skis.'},

  {t:'pillar', idx:'02', kicker:'Movement two',
   h2:'Angulation through the whole body',
   body:'Edge angle does not come from leaning. It comes from angles stacked through ankle, knee, hip and spine, so you can tip the ski hard and still stand on it.'},

  {t:'pillar', idx:'03', kicker:'Movement three',
   h2:'Edging and pressure, timed right',
   body:'The best skiers are not stronger. They apply pressure at the right moment in the arc and release it at the right moment. Timing, not force, is the skill.'},

  {t:'pillar', idx:'04', kicker:'Movement four',
   h2:'Skiing by feel',
   body:'The goal of every drill is a sensation you can find again without thinking. When the movement has a feel, you own it. That is when you stop needing a coach on your shoulder.'},

  {t:'content', kicker:'The off-snow half',
   big:'Half of your skiing is trained with your boots off.',
   body:'Body alignment, separation and the feel of each movement can be rehearsed indoors. Mental practice is close to as effective as physical practice. The skiers who break through train both.'},

  {t:'content', kicker:'Become your own best coach',
   big:'Film it. See it. Fix it. Repeat.',
   body:'Frame by frame, you compare what you did against the movement you were after. Do that often enough and you stop guessing. You can diagnose your own skiing from the chairlift.'},

  {t:'part', kicker:'Part Three',
   h2:'Your skiing when the movement finally holds',
   p:'Not a new you. The same skier, with movements that stay with you when the run gets hard.'},

  {t:'content', kicker:'The shift',
   big:'From holding on, to flowing down.',
   body:'The steeps stop feeling like survival. The bumps have rhythm. Carving feels like the skis are pulling you through the arc instead of you forcing them around it. Same legs, different movement.'},

  {t:'why', kicker:'Why learn it this way',
   h2:'Two decades of movement, not just miles on snow',
   creds:['APSI Level 4 Trainer and Examiner, Alpine and Telemark',
          'Diploma of Structural Integration and Anatomy In Motion certified',
          'Two time national demonstration team member',
          'Thousands of skiers coached through frame by frame video analysis']},

  {t:'content', kicker:'The recap',
   big:'Separation. Angulation. Pressure timing. Feel.',
   body:'Four movements, trained on and off the snow, checked frame by frame until they are automatic. That is the path off the plateau, and it is the whole method in one slide.'},

  {t:'cta', kicker:'Start your next season',
   h2:'Ready to ski the way you have been trying to?',
   step:'Join the Big Picture Skiing Academy',
   body:'The Coaching Lab takes you through these four movements with your own video, season long, until they are yours.',
   disclaimer:'Educational content only. Skiing is a physical activity with inherent risk; train within your ability and on appropriate terrain. Individual results vary and are not guaranteed.'},
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='part'?' part':'')+(s.t==='cta'?' cta':'');
  let html='';
  if(s.kicker) html+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){ html+=`<h1>${s.h}</h1><div class="promise">${s.promise}</div>`; }
  else if(s.t==='part'){ html+=`<h2>${s.h2}</h2><p>${s.p}</p>`; }
  else if(s.t==='pillar'){ html+=`<div class="pillar-lead"><span class="idx">${s.idx}</span><h2>${s.h2}</h2></div><p class="body">${s.body}</p>`; }
  else if(s.t==='why'){ html+=`<h2>${s.h2}</h2><div class="creds">${s.creds.map(c=>`<div>${c}</div>`).join('')}</div>`; }
  else if(s.t==='cta'){ html+=`<h2>${s.h2}</h2><p class="body">${s.body}</p><div class="step">${s.step}</div><div class="disclaimer">${s.disclaimer}</div>`; }
  else { if(s.big) html+=`<div class="big">${s.big}</div>`; if(s.h2) html+=`<h2>${s.h2}</h2>`; if(s.body) html+=`<p class="body">${s.body}</p>`; }
  html+=`<div class="brandline">Big Picture Skiing</div><div class="count">${i+1} / ${S.length}</div>`;
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
