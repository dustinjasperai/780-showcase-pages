<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The 5-Star Success Blueprint · Beate Chelette</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Open+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f8f5ef; --panel:#efe7d9; --rule:#e2d7c4;
    --ink:#2b2622; --accent:#df5326; --gold:#c0872b; --grey:#5b514a; --dim:#9a9088;
  }
  html,body{height:100%}
  body{background:#ece4d6;font-family:'Open Sans',-apple-system,sans-serif;color:var(--grey);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ece4d6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Open Sans',sans-serif;font-size:1.0vw;font-weight:800;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.14;letter-spacing:.002em}
  .t-title h1{font-size:4.8vw;max-width:96%}
  .t-normal h1{font-size:3.1vw;max-width:93%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.36vw;color:var(--grey);margin-top:3.0vh;max-width:80%;line-height:1.62;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.6vw;color:var(--ink);margin-top:3.4vh;max-width:88%;line-height:1.5;font-weight:600}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.1vw;font-weight:800;color:var(--accent);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.6vh}
  .t-dark{background:linear-gradient(150% 130% at 50% 12%,#2c211c 0%,#171009 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.5vw;max-width:90%;color:#f7efe2}
  .t-cta{background:linear-gradient(150% 130% at 50% 100%,#33251d 0%,#181109 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:88%;color:#f8f0e4}
  .t-cta .body{font-family:'Open Sans',sans-serif;color:#e4d8c6;font-size:1.36vw;margin-top:3vh;max-width:76%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:#f8f0e4;border-radius:100px;padding:1.4vh 1.9vw;font-size:1.12vw;font-weight:700}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:#d9cbb8;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .mo{position:absolute;pointer-events:none}
  .title-mo{right:7.2%;bottom:8%;width:25vw;opacity:.92}
  .corner-mo{right:6.5%;bottom:8%;width:11vw;opacity:.5}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.12vw;color:var(--ink);margin-top:3.8vh;font-weight:700;letter-spacing:.03em}
  .brandline b{color:var(--accent);font-weight:800}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(43,38,34,.08);z-index:20}
  .hud > i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#eaa06e);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:800}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.7vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.0vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">The Growth Architect</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: five construction lines rising into a blueprint star, architecture made visible -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 150 96">
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <g stroke="#2b2622" stroke-width="1.4" opacity="0.32">
      <line x1="16" y1="82" x2="16" y2="60"/>
      <line x1="42" y1="82" x2="42" y2="50"/>
      <line x1="68" y1="82" x2="68" y2="40"/>
      <line x1="94" y1="82" x2="94" y2="50"/>
      <line x1="120" y1="82" x2="120" y2="60"/>
    </g>
    <path d="M16 60 L42 50 L68 40 L94 50 L120 60" stroke="#df5326" stroke-width="2.4" opacity="0.95"/>
    <path d="M68 12 l5.5 12 13 1 -10 8.5 3.4 12.7 -11.9 -7 -11.9 7 3.4 -12.7 -10 -8.5 13 -1 z" stroke="#df5326" stroke-width="1.6" fill="#df5326" fill-opacity="0.14" opacity="0.95"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The 5-Star Success Blueprint',sub:'A live masterclass for founders and experts who are brilliant at the work, and stuck on how to turn it into a business that grows without them. Taught by Beate Chelette, The Growth Architect.',brand:true,mo:'title'},

 {t:'normal',k:'Who this is for',title:'You are excellent at the thing you do. The business around it is the part nobody ever drew you a plan for.',body:'You have the talent, the clients, the proof that people want what you offer. What you were never handed is the architecture: the clear idea, the offer, the system, the team, and the plan that let a business grow past what you can personally carry. So you run it on instinct and effort, and you feel the ceiling getting closer.'},

 {t:'dark',title:'A business that only grows when you push it is not a business yet. It is a very demanding job you built for yourself.'},

 {t:'section',idx:'Part One',title:'Why Talent Alone Stops Scaling'},
 {t:'normal',k:'The real problem',title:'You are the whole system, and the whole system is running out of you.',body:'In the early years, being the person who does everything is what makes it work. Past a point it is exactly what holds it back. Every decision, every client, every fire routes through you, so the business can only ever be as big as your calendar and your energy. That is not a discipline problem. It is a design problem, and design is fixable.'},
 {t:'normal',k:'The trap',title:'Working harder inside the business quietly replaces building the business.',body:'The busier you are delivering, the less time there is to step back and architect. So the parts that would actually free you, a repeatable offer, a system that runs without you, a team that owns outcomes, stay on the someday list. Meanwhile the calendar fills, the revenue plateaus, and the exhaustion compounds. Effort is not the missing ingredient. Structure is.'},
 {t:'dark',title:'You cannot scale chaos. Push hard enough on a business with no architecture and all you get is a bigger version of the same mess.'},

 {t:'section',idx:'Part Two',title:'The Blueprint: Five Stars From Talent to a Business That Runs'},
 {t:'normal',k:'Star one · Idea',title:'Get the core idea clear enough that the right customer feels it in one sentence.',body:'Growth starts with a clean diagnosis: what you actually sell, to whom, and why it matters more than the alternatives. Most stalls trace back to a fuzzy idea that tries to be everything to everyone. When the core idea is sharp and specific, every other decision, the offer, the message, the pricing, gets easier because it finally has something to line up behind.'},
 {t:'normal',k:'Star two · Offer',title:'Build an offer that solves the real problem and gives people a journey, not just a deliverable.',body:'A strong offer is not a longer list of features, it is a clear transformation with an experience wrapped around it. When you understand the outcome your customer is truly buying, you can shape an offer they say yes to quickly and value deeply, and you can charge for the result instead of the hours. This is where your unapologetic value becomes the point.'},
 {t:'normal',k:'Star three · System',title:'Turn what you do by instinct into a Signature Growth System that runs the same way every time.',body:'The work you carry in your head is the work that traps you. So you take your best thinking and make it a system: the repeatable steps that deliver your result without you improvising each time. Clients never need to see how the sausage is made. They just get a consistent outcome, and you get a business that no longer depends on you being in the room for every part of it.'},
 {t:'normal',k:'Star four · Team',title:'Structure a team around the growth plan so the business can hold more than you can.',body:'You do not hire to offload chores, you hire against a plan. Once the system exists, the roles become obvious: who owns what, what good looks like, and how people work toward the same outcome instead of waiting on you. A clear structure is what lets you step out of the middle without the whole thing wobbling every time you take a day off.'},
 {t:'normal',k:'Star five · Blueprint to freedom',title:'Assemble it into your own blueprint, a business built to fund your life, not consume it.',body:'The final star is where the pieces become a plan you can actually run: the idea, the offer, the system, and the team aligned so the business works for the season of life you are in. This is the difference between owning an asset and owning a very expensive job. Done right, it is a business you could grow, keep, or one day sell, on your terms.'},

 {t:'section',idx:'Part Three',title:'The Business the Blueprint Builds'},
 {t:'normal',k:'The business this builds',title:'It grows without living or dying by your personal effort.',body:'When the idea is sharp, the offer is clear, the system is repeatable, and the team owns real outcomes, the fog lifts. Growth stops feeling like heavier lifting and starts feeling like turning up a dial you already built. You get your time and your attention back, the business becomes something you direct rather than something that drags you, and its value stops being locked inside your head.'},
 {t:'dark',title:'Strategy without soul burns people out. Soul without strategy stalls. The point is to build where the two meet.'},
 {t:'normal',k:'Why Beate Chelette',title:'She did not just study this. She built a company from a hundred thousand in debt and sold it to Bill Gates.',body:'A single mother and 135,000 dollars in debt, Beate built BeateWorks into the world leader in interior and celebrity home imagery, licensed in 79 countries, and sold it to Bill Gates Corbis inside two years. Since then, as The Growth Architect and author of Happy Woman Happy World, she has turned what she learned into the 5-Star Success Blueprint and used it to help founders architect their own growth.'},
 {t:'normal',k:'The principle',title:'Architecture beats hustle, every single time.',body:'None of this is about grinding harder or chasing an overnight win. It is about building the structure underneath the talent you already have, so the business can carry weight you cannot carry alone. Get the five stars in place, in order, and the growth you have been forcing by hand finally has a foundation strong enough to stand on.'},

 {t:'cta',title:'Ready to architect a business that grows without you?',body:'Take the next step with Beate Chelette, The Growth Architect.',chips:['Book an Uncovery Session','Join Turn Your Talent into a Business'],disc:'Educational content for founders and business owners. No specific financial or business result is guaranteed. Any examples describe general principles and past experience, not a promise of your results, which vary by business, market, and effort.'},
];

const deck=document.getElementById('deck');
function mo(kind){return `<svg class="mo ${kind==='title'?'title-mo':'corner-mo'}"><use href="#mo"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The Growth <b>Architect</b> · Beate Chelette</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.mo) h+=mo(s.mo);
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
