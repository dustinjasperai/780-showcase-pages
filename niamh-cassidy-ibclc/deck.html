<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The NEST Method | Your Birth Biz Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --cream:#faf6f0;
    --panel:#f3ece1;
    --ink:#262626;
    --ink-soft:#4f4a44;
    --rule:#e4d9c8;
    --pink:#fe0699;
    --lime:#c1ff72;
  }
  html,body{height:100%;}
  body{
    font-family:'DM Sans',system-ui,sans-serif;
    background:var(--ink);
    color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:1100px;margin:0 auto;}
  .slide{
    position:relative;
    background:var(--cream);
    aspect-ratio:16/9;
    margin:22px 16px;
    padding:68px 74px;
    display:flex;flex-direction:column;justify-content:center;
    border-radius:18px;
    overflow:hidden;
    box-shadow:0 18px 50px rgba(0,0,0,0.28);
  }
  .slide.panel{background:var(--panel);}
  .slide.ink{background:var(--ink);color:var(--cream);}
  .slide.pink{background:var(--pink);color:#fff;}
  .eyebrow{font-size:14px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--pink);margin-bottom:22px;}
  .slide.ink .eyebrow{color:var(--lime);}
  .slide.pink .eyebrow{color:#ffe3f3;}
  h1{font-family:'Prata',Georgia,serif;font-weight:400;font-size:52px;line-height:1.12;letter-spacing:-0.01em;margin-bottom:22px;}
  h2{font-family:'Prata',Georgia,serif;font-weight:400;font-size:40px;line-height:1.16;margin-bottom:20px;}
  .lead{font-size:23px;line-height:1.5;color:var(--ink-soft);max-width:40ch;}
  .slide.ink .lead,.slide.pink .lead{color:rgba(255,255,255,0.86);}
  p.body{font-size:20px;line-height:1.55;color:var(--ink-soft);max-width:46ch;margin-top:8px;}
  .slide.ink p.body{color:rgba(255,255,255,0.82);}
  ul{list-style:none;margin-top:14px;}
  ul li{font-size:21px;line-height:1.45;color:var(--ink-soft);padding-left:30px;position:relative;margin-bottom:16px;max-width:44ch;}
  ul li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--pink);}
  .slide.ink ul li{color:rgba(255,255,255,0.84);}
  .slide.ink ul li::before{background:var(--lime);}
  .pillar{font-family:'Prata',serif;font-size:30px;color:var(--pink);margin-right:14px;}
  .kicker{font-size:19px;color:var(--ink-soft);margin-top:26px;max-width:42ch;}
  .big{font-family:'Prata',serif;font-size:72px;line-height:1.05;color:var(--pink);margin-bottom:14px;}
  .slide.ink .big{color:var(--lime);}
  .foot{position:absolute;bottom:30px;left:74px;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--rule);}
  .slide.ink .foot,.slide.pink .foot{color:rgba(255,255,255,0.55);}
  .disclaimer{font-size:14px;line-height:1.5;color:var(--ink-soft);margin-top:26px;max-width:60ch;}
  .slide.pink .disclaimer{color:rgba(255,255,255,0.85);}
  .num{position:absolute;top:30px;right:40px;font-size:13px;letter-spacing:.14em;color:var(--rule);}
  .slide.ink .num,.slide.pink .num{color:rgba(255,255,255,0.5);}
  .cta-step{font-size:22px;line-height:1.5;margin-top:10px;max-width:44ch;}
  @media(max-width:720px){
    .slide{padding:40px 34px;}
    h1{font-size:34px;} h2{font-size:28px;} .lead{font-size:19px;} .big{font-size:52px;}
    p.body,ul li{font-size:17px;} .foot{left:34px;}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"ink", eyebrow:"A free live masterclass", h1:"Booked Out, Burnout-Free", lead:"The NEST Method for building a birth business that fills your calendar without the sales-y ick. Built by a birth worker, for birth workers."},

  {t:"audience", cls:"", eyebrow:"Who this is for", h2:"If you trained to support families, this is for you.", list:["Doulas, IBCLCs and antenatal educators in private practice","Newly trained and unsure how to get your first bookings","Experienced, but the calendar has gone quiet","You love the work and dread the marketing"]},

  {t:"trap", cls:"panel", eyebrow:"The trap", h2:"Nobody trained you for the business part.", body:"You learned how to support a labour, a latch, a new family. Then you were handed a business and told to figure out the clients yourself. So you wait on word of mouth, and some months no one books at all."},

  {t:"reframe", cls:"pink", eyebrow:"The hard truth", h2:"Our profession is losing its best people.", body:"Not because they are bad at birth work. Because the business side breaks them first. Most birth workers who quit never stopped loving the work. They just could not make it pay."},

  {t:"problem", cls:"", eyebrow:"Part one - the real problem", h2:"The marketing you have seen feels wrong.", body:"Hype, false urgency, fear-based launches. It feels manipulative, so you do not do it. And doing nothing keeps the calendar empty. The freeze is the problem, not you."},

  {t:"problem", cls:"panel", eyebrow:"Part one", h2:"The cost of the freeze.", list:["Cancelled classes and quiet months","Undercharging because asking feels greedy","Watching families you could have helped go elsewhere","Quietly wondering if you should give it up"]},

  {t:"framework", cls:"ink", eyebrow:"Part two - the method", h1:"The NEST Method", lead:"Five parts that build a sustainable birth business, in the order that actually works. No manipulation required."},

  {t:"pillar", cls:"", eyebrow:"The NEST Method", h2:"<span class='pillar'>N</span>Nurture your mindset", body:"Clear the money stories and the limiting beliefs first. When charging for your expertise feels ethical and aligned, everything downstream gets easier. This is where most people skip, and why most stay stuck."},

  {t:"pillar", cls:"panel", eyebrow:"The NEST Method", h2:"<span class='pillar'>E</span>Effective offers", body:"Build offers your ideal clients understand and want, so signing up feels obvious to them and you never feel like you are 'selling'. The offer does the persuading, not a pushy pitch."},

  {t:"pillar", cls:"", eyebrow:"The NEST Method", h2:"<span class='pillar'>S</span>Strategies for growth", body:"Tried and tested ways to get consistent referrals and clients. You stop waiting on word of mouth and start attracting the right families on purpose, with messaging that connects instead of feeling awkward."},

  {t:"pillar", cls:"panel", eyebrow:"The NEST Method", h2:"<span class='pillar'>T</span>Trusted support", body:"Weekly coaching, honest feedback on your real offers and marketing, and a community of birth workers who get it. Accountability is what turns a plan into a booked-out practice."},

  {t:"pillar", cls:"ink", eyebrow:"The NEST Method", h2:"<span class='pillar' style='color:var(--lime)'>E</span>Enjoy the work", body:"Growth that fits your life and your family, not a hustle that costs you the thing you got into this for. Sustainable is the whole point."},

  {t:"proof", cls:"", eyebrow:"Part three - the skill", h2:"Messaging that connects, not converts-at-all-costs.", body:"You speak to the family in front of you in plain, warm language about what you actually do and who you are for. That is what fills a calendar ethically, and it is a skill you can learn."},

  {t:"outcome", cls:"panel", eyebrow:"Part three", h2:"You walk away with a Birth Biz Success Plan.", list:["A reframed, aligned relationship with charging","A clear picture of the clients you want to serve","Offers people understand and say yes to","The next three steps to take, in order"]},

  {t:"credibility", cls:"pink", eyebrow:"Why listen to me", h2:"I cancelled more classes than I ran.", body:"I am Niamh Cassidy, IBCLC, MA. When I first trained, I struggled for years to fill my classes. Today my classes have waiting lists and my lactation practice is fully booked. I built this for the birth worker I used to be."},

  {t:"shift", cls:"", eyebrow:"The shift", h2:"Booked out is a system, not a personality.", body:"You do not need to become loud, pushy, or someone you are not. You need a method that fits how you already work. That is what the NEST Method gives you."},

  {t:"myth", cls:"panel", eyebrow:"One myth to drop", h2:"You do not have to be sales-y to be booked.", body:"The birth workers with full calendars are rarely the loudest. They are the clearest. Clarity, not hype, is what makes a family choose you."},

  {t:"cta", cls:"pink", eyebrow:"Your next step", h1:"Come build your plan.", cta:"Join the next live masterclass and map your own Birth Biz Success Plan with me. From there, The NEST Programme is where we build it out together over six months.", disclaimer:"This masterclass is educational. Results vary and depend on your own effort, market, and circumstances. Nothing here is a promise or guarantee of income, bookings, or specific results."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.cls||'');
  let html='';
  html+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) html+='<h1>'+s.h1+'</h1>';
  if(s.h2) html+='<h2>'+s.h2+'</h2>';
  if(s.lead) html+='<div class="lead">'+s.lead+'</div>';
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.body) html+='<p class="body">'+s.body+'</p>';
  if(s.list){html+='<ul>';s.list.forEach(x=>html+='<li>'+x+'</li>');html+='</ul>';}
  if(s.cta) html+='<div class="cta-step">'+s.cta+'</div>';
  if(s.disclaimer) html+='<div class="disclaimer">'+s.disclaimer+'</div>';
  html+='<div class="foot">Your Birth Biz &middot; The NEST Method</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
