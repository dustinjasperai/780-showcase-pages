<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The SEO MBA — How SEOs Win Budget and Buy-In</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,500;0,600;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f5f1;      /* seomba.com warm cream ground (site_scheme light) */
    --panel:#fffdfa;   /* lifted cream panel */
    --ink:#293d52;     /* seomba.com slate-blue ink */
    --rule:#d8cfc4;    /* soft warm rule */
    --accent:#cf534a;  /* seomba.com terracotta accent */
    --muted:#6b6256;
    --head:'Cormorant',Georgia,serif;
    --body:'Jost',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);font-weight:400;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(41,61,82,.03)}
  .kicker{font-family:var(--body);font-weight:500;letter-spacing:.14em;text-transform:uppercase;
    font-size:12.5px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:18px}
  .sub{font-size:20px;color:var(--muted);margin-top:20px;max-width:46ch}
  p.body{font-size:19px;line-height:1.6;max-width:54ch;margin-top:8px}
  p.body + p.body{margin-top:16px}
  .num{font-family:var(--head);font-size:22px;color:var(--accent);font-weight:600;margin-bottom:10px}
  ul{list-style:none;margin-top:22px}
  li{font-size:19px;padding:13px 0 13px 30px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:21px;width:10px;height:10px;border-radius:2px;
    background:var(--accent);transform:rotate(45deg)}
  li:last-child{border-bottom:none}
  li b{font-weight:500}
  .pill{display:inline-block;font-size:13px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--accent);border:1px solid var(--accent);border-radius:40px;padding:5px 14px;margin-bottom:20px}
  .cta{background:var(--ink);color:var(--bg);border-color:var(--ink);text-align:center;align-items:center}
  .cta .kicker{color:#e7b7b1}
  .cta h2{color:var(--bg)}
  .cta .step{font-family:var(--head);font-size:30px;margin:18px 0 10px}
  .disc{font-size:13.5px;color:#b9c2cd;margin-top:26px;max-width:52ch;line-height:1.5}
  .q{font-family:var(--head);font-style:italic;font-size:28px;line-height:1.3;color:var(--ink)}
  .cite{font-size:14px;color:var(--muted);margin-top:16px;letter-spacing:.03em}
  .foot{text-align:center;color:var(--muted);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">The SEO MBA · seomba.com</div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kicker">The SEO MBA · Live Masterclass</div>
    <h1>How SEOs Win Budget and Buy-In</h1>
    <p class="sub">The business and leadership skills that move your best SEO ideas from a slide deck to a funded, shipped project.</p>`},

  {t:'who', cls:'who', html:`
    <div class="kicker">Who this is for</div>
    <h2>Mid-level and senior SEO professionals</h2>
    <ul>
      <li>In-house SEOs who need budget, headcount and engineering time</li>
      <li>Agency SEOs who need clients to say yes and act</li>
      <li>Independent consultants who want to operate at the executive level</li>
    </ul>`},

  {t:'trap', cls:'trap', html:`
    <div class="kicker">The trap</div>
    <h2>You know exactly what to do.</h2>
    <p class="body">You've run the audit. You've written the recommendations. You know, with real confidence, what would move the business.</p>
    <p class="body">And then it sits. Waiting on a sprint that never gets prioritized, a budget that never gets approved, a stakeholder who never quite gets it.</p>`},

  {t:'reframe', cls:'reframe', html:`
    <div class="kicker">The reframe</div>
    <p class="q">"The top 5 SEO challenges are all resource and execution challenges. 43% of people cite lack of buy-in or resources as the biggest risk to SEO success."</p>
    <p class="cite">The hard part of SEO was never the SEO. It's getting other teams to invest in it.</p>`},

  {t:'part', cls:'part', html:`
    <div class="num">Part One</div>
    <h2>Why great SEO work stalls</h2>
    <p class="body">SEO fundamentally depends on other people. Product, engineering, editorial and marketing all have to put their resources behind your projects before anything ships.</p>
    <p class="body">So the real skill isn't finding the opportunity. It's making a case so clear and so credible that the people who control the resources choose to fund it.</p>`},

  {t:'problem', cls:'problem', html:`
    <div class="kicker">The cost of the gap</div>
    <h2>Six months, then six more</h2>
    <p class="body">The average SEO at a large company has waited over six months for their highest-priority technical change, and doesn't expect to see it shipped for at least another six.</p>
    <p class="body">That's not a knowledge problem. That's an influence problem, and it's quietly capping careers across the whole field.</p>`},

  {t:'problem', cls:'problem', html:`
    <div class="kicker">The ceiling</div>
    <h2>Technical skill gets you to Manager</h2>
    <p class="body">Past that point, the people who advance are the ones who can connect SEO to revenue, model the investment, and present it to executives in language the C-suite trusts.</p>
    <p class="body">Almost nobody is taught this. It's the missing half of the job.</p>`},

  {t:'part', cls:'part', html:`
    <div class="num">Part Two</div>
    <h2>The five skills that get SEO funded</h2>
    <p class="body">This is the core of The SEO MBA. Each one is a learnable, repeatable skill, not a personality trait.</p>`},

  {t:'pillar', cls:'pillar', html:`
    <span class="pill">Skill 01</span>
    <h2>Good SEO Strategy</h2>
    <p class="body">A credible strategy is more than a list of things you want to get done. Learn to build one that is aligned with stakeholders before you ever present it, so it reads as a business plan, not a backlog.</p>`},

  {t:'pillar', cls:'pillar', html:`
    <span class="pill">Skill 02</span>
    <h2>The Value of SEO</h2>
    <p class="body">Connect SEO to business value and revenue, including hard-to-measure work like link building. When leadership can see the line from your work to the number they care about, the conversation changes.</p>`},

  {t:'pillar', cls:'pillar', html:`
    <span class="pill">Skill 03</span>
    <h2>Investment Models</h2>
    <p class="body">Build a full financial model and investment plan for a large initiative. Understand the business model well enough to know what gets funded and why, and bring the numbers that let a CFO say yes.</p>`},

  {t:'pillar', cls:'pillar', html:`
    <span class="pill">Skill 04</span>
    <h2>Executive Presence</h2>
    <p class="body">Structure a strategy presentation the same way McKinsey would. Learn to manage upwards, write the email that lands, and present to senior executives so they leave the room sold and ready to resource the work.</p>`},

  {t:'pillar', cls:'pillar', html:`
    <span class="pill">Skill 05</span>
    <h2>Getting Things Done</h2>
    <p class="body">Find alignment with other teams, manage resource asks, and navigate organizational politics. Learn why pre-agreeing the decision before the meeting is the single most reliable way to get buy-in and budget.</p>`},

  {t:'part', cls:'part', html:`
    <div class="num">Part Three</div>
    <h2>The review where the answer is yes</h2>
    <p class="body">You walk into the quarterly review with a one-page business case, a financial model behind it, and a presentation built for executives instead of for SEOs.</p>
    <p class="body">You leave with the budget, the sprint, and the mandate. The work you always knew was right finally ships.</p>`},

  {t:'look', cls:'look', html:`
    <div class="kicker">The shift</div>
    <h2>From "please prioritize this" to "here's the investment case"</h2>
    <ul>
      <li>Before: recommendations that wait in a queue</li>
      <li>After: a funded initiative with a number attached</li>
      <li>Before: the SEO in the room nobody listens to</li>
      <li>After: the SEO the executives bring into the room</li>
    </ul>`},

  {t:'why', cls:'why', html:`
    <div class="kicker">Why learn this from me</div>
    <h2>Hi, I'm Tom Critchlow</h2>
    <p class="body">I've spent 15 years in SEO, in-house, agency-side, and as an independent consultant, with clients like the New York Times, Etsy, Dotdash and Google. My work today is focused on helping CEOs and executive teams structure large-scale SEO investments and hire senior SEO leaders.</p>
    <p class="body">I've watched first-hand how often brilliant SEO work dies for lack of a business case. Over 900 SEO professionals have now taken The SEO MBA to close that gap.</p>`},

  {t:'recap', cls:'recap', html:`
    <div class="kicker">The whole idea, in one line</div>
    <p class="q">Knowing what to do is the easy part. This masterclass is about knowing how to get it funded, shipped, and credited.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kicker">Your next step</div>
    <h2>Keep going with The SEO MBA</h2>
    <p class="step">Join the next cohort of Executive Presence</p>
    <p class="body" style="color:#dfe4ea;max-width:50ch;margin:0 auto">Take the full program on building the business case, modeling the investment, and presenting it to the C-suite, live with a small group of peers. Or bring it to your whole team as a private workshop.</p>
    <p class="disc">This masterclass is educational. No income, role, promotion, or specific result is guaranteed. Outcomes vary and depend on your own work, your organization, and your context.</p>`}
];
const deck = document.getElementById('deck');
deck.innerHTML = S.map(s => `<section class="slide ${s.cls||''}">${s.html}</section>`).join('');
</script>
</body>
</html>
