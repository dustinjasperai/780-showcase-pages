<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slammed Doors to Sofa Giggles: a live masterclass with Roma Norriss</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#2a0235;
    --panel:#330a30;
    --rule:#5a3a52;
    --accent:#ad2c55;
    --ink:#f4d7cf;
    --muted:#c9a9b4;
  }
  html,body{height:100%}
  body{font-family:'Mulish',-apple-system,sans-serif;background:#1c0124;color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7vh 9vw;background:var(--bg)}
  .slide.active{display:flex}
  .eyebrow{font-family:'Mulish';font-size:13px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:clamp(34px,6vw,68px);line-height:1.08;letter-spacing:-.01em;color:var(--ink);margin-bottom:24px}
  h2{font-family:'Newsreader',Georgia,serif;font-weight:600;font-size:clamp(28px,4.4vw,48px);line-height:1.14;color:var(--ink);margin-bottom:20px}
  p{font-size:clamp(17px,2vw,23px);line-height:1.5;color:var(--muted);max-width:40ch}
  p.lead{color:var(--ink);font-size:clamp(19px,2.3vw,27px);max-width:38ch}
  .big{font-family:'Newsreader',Georgia,serif;font-size:clamp(40px,8vw,96px);line-height:1;color:var(--accent);margin-bottom:18px}
  ul{list-style:none;margin-top:14px;max-width:42ch}
  li{position:relative;padding-left:28px;margin-bottom:16px;font-size:clamp(17px,2vw,22px);line-height:1.45;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:.6em;width:12px;height:2px;background:var(--accent)}
  li span{display:block;color:var(--muted);font-size:.82em;margin-top:4px}
  .part{font-family:'Newsreader';font-style:italic;color:var(--accent);font-size:clamp(16px,2vw,20px);margin-bottom:16px}
  .rule{width:64px;height:3px;background:var(--accent);margin:26px 0 0}
  .cta-box{border:1px solid var(--rule);border-radius:4px;padding:30px 34px;max-width:46ch;background:var(--panel)}
  .disclaimer{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);max-width:52ch;font-style:italic}
  .nav{position:fixed;bottom:18px;right:24px;font-family:'Mulish';font-size:12px;color:var(--muted);letter-spacing:.08em;z-index:10}
  .brandmark{position:fixed;bottom:18px;left:24px;font-family:'Mulish';font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);z-index:10}
  @media(max-width:640px){.slide{padding:8vh 7vw}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="brandmark">Roma Norriss Parenting</div>
<div class="nav"><span id="pg">1</span> / <span id="tot">1</span></div>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass for parents',h:'Slammed Doors to Sofa Giggles',p:'How the hardest moments with your child are really about you, and the Deep Work that turns them around. Live, with Roma Norriss.'},
  {t:'who',eyebrow:'Who this is for',h:'You love your child. You still lost it tonight.',p:'This is for the parent who keeps promising to stay calm, and keeps ending the day behind a slammed door, wondering what is wrong with them. Toddler or teenager, the pattern is the same.'},
  {t:'trap',eyebrow:'The trap',h:'You have tried every strategy. The shouting came back.',p:'Charts, timers, gentle scripts. They work for a week, then the old reaction returns, because none of them touch the thing that is actually firing.'},
  {t:'reframe',big:'It was never about discipline.',p:'The blow-up is a co-regulation event, not a behaviour event. Your nervous system and your child’s are talking to each other faster than any technique can reach.'},
  {t:'part',part:'Part One',h:'Why conflict hijacks the body'},
  {t:'body',h:'The reaction is older than your child.',p:'When your child pushes the exact button that was pushed in you at their age, your body runs a pattern laid down in your own childhood. You are not choosing it. That is why willpower keeps failing.'},
  {t:'body',h:'Humans change through connection, not correction.',p:'We make new shifts best through co-regulation: using connection with another steady brain to resource our own. This is the mechanism everything else in the masterclass is built on.'},
  {t:'body',h:'Your calm is the intervention.',p:'Not a trick you perform at your child. A real state you can return to, once you understand what pulls you out of it. Everything downstream, the limits, the listening, the repair, only works from there.'},
  {t:'part',part:'Part Two',h:'The Deep Work method'},
  {t:'pillars',eyebrow:'What Deep Work actually is',h:'Three moves that end the cycle',items:[
    {k:'Co-regulation first',v:'Steady yourself before you steady your child. The order is not optional, it is the whole thing.'},
    {k:'The listening tools',v:'Special Time, Staylistening and setting limits with warmth, so feelings get released instead of stored.'},
    {k:'Offload your own load',v:'Listening Partnerships, so the stress you carry stops leaking onto your child.'}
  ]},
  {t:'body',h:'Let the crying do its job.',p:'A tantrum is not misbehaviour to be stopped. It is your child shedding hurt. When you can stay warm through it, they come out more connected to you, not less.'},
  {t:'body',h:'Special Time, then everything else.',p:'A short, fully-present window where your child leads and you simply delight in them. It is small, it is specific, and it is where the repair starts, long before any clever limit-setting.'},
  {t:'part',part:'Part Three',h:'What the turnaround looks like'},
  {t:'turnaround',eyebrow:'The Family Turnaround',h:'From a stuck dynamic to a clear path',items:[
    {k:'Decode',v:'See what is really happening underneath the behaviour.'},
    {k:'Reframe',v:'The one shift that makes the hard moments make sense.'},
    {k:'North Star',v:'A single clear direction you can actually hold on a bad day.'}
  ]},
  {t:'body',h:'Slammed doors become sofa giggles.',p:'Not because your child changed first. Because you stopped meeting their storm with your own, and the whole house could finally soften.'},
  {t:'body',h:'This is not about getting it right every time.',p:'You will still lose it some days. The difference is you will know what happened, you will know how to repair it, and the pattern will loosen its grip instead of tightening.'},
  {t:'why',eyebrow:'Why me',h:'Roma Norriss',p:'Hand in Hand Parenting Instructor since 2006, somatic and trauma-informed. I work with families where conventional solutions have run out, at the root, over time, so the change holds.'},
  {t:'cta',eyebrow:'Your next step',h:'Bring me your impossible situation.',p:'Book a 75-minute Family Turnaround Session and leave with relief, a reframe, and a clear North Star, or explore the 12-Week One-to-One Programme to go all the way through it together.',
   disclaimer:'This masterclass is educational. Every family is different and no particular outcome or result is guaranteed. Nothing here is a substitute for medical or mental-health care.'}
];
const deck=document.getElementById('deck');
function esc(s){return s}
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide'+(i===0?' active':'');
  let h='';
  if(s.eyebrow)h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.part)h+=`<div class="part">${s.part}</div>`;
  if(s.big)h+=`<div class="big">${s.big}</div>`;
  if(s.h)h+=`<h1>${s.h}</h1>`;
  if(s.items){
    h+='<ul>';s.items.forEach(it=>{h+=`<li>${it.k}<span>${it.v}</span></li>`});h+='</ul>';
  }
  if(s.p)h+=`<p class="${s.t==='title'||s.t==='reframe'?'lead':''}">${s.p}</p>`;
  if(s.t==='part')h+='<div class="rule"></div>';
  if(s.disclaimer)h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  d.innerHTML=h;deck.appendChild(d);
});
let cur=0;const slides=[...document.querySelectorAll('.slide')];
document.getElementById('tot').textContent=slides.length;
function go(n){slides[cur].classList.remove('active');cur=Math.max(0,Math.min(slides.length-1,n));slides[cur].classList.add('active');document.getElementById('pg').textContent=cur+1}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(cur+1);if(e.key==='ArrowLeft')go(cur-1)});
document.addEventListener('click',e=>{go(cur+1)});
</script>
</body>
</html>
