<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profitable Childcare Center: The 7 Numbers That Decide Whether Your Center Runs You · Caroline Jens</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@500;600;700&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbfbf9; --panel:#eef1f4; --deep:#072a42; --rule:#d7dde3;
    --ink:#231f20; --accent:#045484; --accent2:#3a7ca5; --dim:#8a8f98; --grey:#474747;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Rubik',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Rubik',sans-serif;font-size:1.05vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.1;letter-spacing:-.005em}
  .t-title h1{font-size:4.1vw;max-width:94%}
  .t-normal h1{font-size:2.95vw;max-width:90%}
  .t-normal .body{font-family:'Rubik',sans-serif;font-size:1.3vw;color:var(--grey);margin-top:2.6vh;max-width:80%;line-height:1.64;font-weight:400}
  .sub{font-family:'Rubik',sans-serif;font-size:1.4vw;color:var(--grey);margin-top:3.2vh;max-width:82%;line-height:1.55;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Rubik',sans-serif;font-size:1.15vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.2em;text-transform:uppercase}
  .t-section h1{font-size:4.2vw;max-width:92%}
  .t-section .rule{width:14vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--deep);align-items:center;text-align:center}
  .t-dark h1{font-size:3.05vw;max-width:88%;color:#f4f1ea}
  .t-dark h1 .amber{color:var(--accent2)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:3.4vw;max-width:86%;color:var(--ink)}
  .t-cta .kicker{color:var(--accent)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:100px;padding:1.3vh 1.7vw;font-size:1.05vw;font-weight:600;font-family:'Rubik',sans-serif;letter-spacing:.03em}
  .chip.hl{background:var(--accent);color:#fff}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Rubik',sans-serif;font-size:.82vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left}
  .brandline{font-family:'Rubik',sans-serif;font-size:1.14vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.1em;text-transform:uppercase}
  .brandline b{color:var(--accent);font-weight:700}
  .mark{position:absolute;pointer-events:none}
  .title-mark{right:6.8%;bottom:9%;width:15vw;opacity:.9}
  .corner-mark{right:7%;bottom:8%;width:6vw;opacity:.4}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600;font-family:'Rubik',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Rubik',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Rubik',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:5.2vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.8vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Child Care Biz Help</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- fine-line ledger motif: one clean data mark (a rising ledger line over a baseline), never clip-art -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="ledger" viewBox="0 0 120 120">
  <g fill="none" stroke="#045484" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M14 14 L14 106 L106 106"/>
    <path d="M28 92 L52 70 L70 82 L100 40"/>
    <path d="M100 40 L100 54 M100 40 L86 40"/>
    <path d="M28 106 L28 96 M52 106 L52 84 M76 106 L76 74 M100 106 L100 62" opacity=".35"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Profitable Childcare Center',sub:'A live masterclass for center owners and directors on the seven things that decide whether your center runs you or you run it, and the handful of numbers that tell you the truth before your accountant does.',brand:true},

 {t:'normal',k:'Who this is for',title:'You can fill a center. The part that keeps you up at night is whether it is actually paying you back.',body:'You care about the children, the families, and the teachers. You are good at all of it. What you may not have is a clear read on your tuition-to-labor ratio, where the money actually goes each month, or whether a full building is a profitable one. The care was never the problem. The numbers are a black box.'},

 {t:'dark',title:'Most centers do not struggle because they are empty. They struggle because they are <span class="amber">full and still broke</span>.'},

 {t:'section',idx:'Part One',title:'Why a full center can still run its owner into the ground'},

 {t:'normal',k:'The vanity number',title:'Enrollment is the number everyone watches. Margin is the number that decides if you get paid.',body:'A waitlist feels like success. But two centers with the same enrollment can have wildly different bank accounts, because enrollment says nothing about your labor ratio, your tuition strategy, or the timing of your cash. Full is a feeling. Profitable is a fact you can measure.'},

 {t:'normal',k:'The three quiet leaks',title:'Profit usually leaks from the same three places, and none of them are the children.',body:'Labor that creeps past what tuition can carry. Tuition set by what feels fair instead of what the model needs. Cash that arrives after the bills are already due. Fix these three and the same enrollment starts paying you very differently.'},

 {t:'dark',title:'You can be at capacity and still be <span class="amber">one slow month</span> away from missing payroll.'},

 {t:'section',idx:'Part Two',title:'The P.R.O.F.I.T.S. Formula'},

 {t:'normal',k:'The framework',title:'Seven pillars that turn a childcare center into a business that pays you back.',body:'This is the operating system behind a center that runs without living on the owner. Each pillar matters, and one of them ties the other six together.',chips:['Passion','Recruitment','One Vision','Financials','Innovation','Training / Retention','Sales / Marketing']},

 {t:'normal',k:'Financials, the through-line',title:'Financials is the pillar most owners were never taught, and it is the one that makes the other six pay off.',body:'Read your center the way a bank reads a balance sheet. Tuition-to-labor ratio. Margin per classroom. Weeks of cash on hand. When these are clear, every other decision about hiring, raises, or a second location gets easier and safer, because you can see what it does to the model before you commit.'},

 {t:'normal',k:'People are the model',title:'Recruitment, training, and retention are not soft topics. Staffing is the single biggest line item in your building.',body:'It is the largest cost you carry, so it is also the largest lever on profit. Hire to the model, keep your best people, and pull the team behind one shared vision, and your labor ratio stops fighting your margin.'},

 {t:'normal',k:'Enrollment on purpose',title:'Sales, Marketing, Passion, and Innovation fill the seats the model can actually afford.',body:'Enrollment is not luck and it is not just word of mouth. It is a repeatable way to turn inquiries into tours and tours into families, priced against a model that works, powered by the passion families already feel from you and the ideas that keep your center a step ahead.'},

 {t:'dark',title:'When you can read your own center like a banker, you stop <span class="amber">guessing</span> and start deciding.'},

 {t:'section',idx:'Part Three',title:'A center that runs on its numbers, not on you'},

 {t:'normal',k:'Out of the classroom',title:'The center holds its quality when you step back, because the model is doing the work, not your presence.',body:'You move from covering ratios and putting out fires to leading. The building runs on systems and numbers you can see, so a day off does not mean a step back.'},

 {t:'normal',k:'A business, not a job',title:'A center that pays its owner a real wage and still has the margin to grow.',body:'Profit stops being whatever is left over and becomes something you plan for. That is what funds the raise, the renovation, or the second location, on your own terms and under your own brand.'},

 {t:'normal',k:'Why learn this from me',title:'I came to childcare from the finance side, so I teach the part of this business most consultants skip.',body:'I spent fifteen years as a VP of Accounting and Finance for a community bank and earned my MBA, then ran the numbers as Financial Controller and Executive Director for a multi-location childcare center. I wrote the P.R.O.F.I.T.S. childcare success formula and host the Daycare Overhaul podcast. I read centers like balance sheets because that is where I started.'},

 {t:'normal',k:'This is what I do',title:'Helping owners build centers that are full, well run, and genuinely profitable is the whole job.',body:'Through Child Care Biz Help I work with owners and directors on exactly the seven pillars in this session, from the financials to the culture, so the business finally works as well as the classrooms do.'},

 {t:'cta',k:'Your next step',title:'Bring your center and let us look at the numbers together.',sub:'Book a consultation with Child Care Biz Help and we will walk through where your profit is leaking and which pillar to fix first.',disc:'This masterclass is educational. It shares a framework and general principles for running a childcare business and does not promise or guarantee any specific financial result. Every center is different and outcomes vary.'}
];

const deck=document.getElementById('deck');
function markSvg(kind){return `<svg class="mark ${kind}-mark" viewBox="0 0 120 120"><use href="#ledger"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Child Care <b>Biz Help</b> &middot; Caroline Jens</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip${c==='Financials'?' hl':''}">${c}</div>`).join('')+`</div>`;
  }
  if(s.t==='title') h+=markSvg('title');
  else if(s.t==='normal' && (i%3===0)) h+=markSvg('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
