<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Label - a live masterclass with Dr. Olivia Kessel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f4;
    --panel:#ffffff;
    --rule:#ecdcd6;
    --accent:#e35f5f;
    --cyan:#5ce1e6;
    --ink:#2b2622;
    --muted:#8a807a;
    --head:'Cardo', Georgia, serif;
    --body:'Rubik', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:22px;
    padding:56px 54px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 10px 30px rgba(227,95,95,0.05)}
  .slide.hero{background:linear-gradient(160deg,#fff 0%, #fdeeea 100%);border-color:#f4cfc6}
  .num{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin-bottom:18px}
  .kick{display:inline-block;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:16px}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.15;margin-bottom:18px}
  .lede{font-size:21px;line-height:1.5;color:#4a423d;margin-top:18px;max-width:40ch}
  p.body{font-size:18px;line-height:1.6;color:#4a423d;margin-top:14px;max-width:52ch}
  .part{font-family:var(--head);font-style:italic;font-size:19px;color:var(--accent)}
  ul{margin:20px 0 0 0;list-style:none;display:grid;gap:14px}
  li{font-size:18px;line-height:1.5;padding-left:30px;position:relative;color:#413a35}
  li:before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:50%;
    background:var(--accent);opacity:.85}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:26px}
  .box{background:var(--bg);border:1px solid var(--rule);border-radius:16px;padding:24px}
  .box h3{font-family:var(--body);font-weight:600;font-size:14px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);margin-bottom:10px}
  .box p{font-size:17px;line-height:1.5;color:#413a35}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  .big{font-family:var(--head);font-size:40px;line-height:1.12;letter-spacing:-.01em}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:60ch}
  .cta-step{display:inline-block;margin-top:22px;font-family:var(--body);font-weight:600;
    font-size:18px;color:#fff;background:var(--accent);padding:14px 26px;border-radius:999px}
  .sig{margin-top:24px;font-size:16px;color:var(--muted)}
  .sig b{color:var(--ink);font-family:var(--head)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass with Dr. Olivia Kessel',
   h:'Beyond the Label',
   lede:'Spotting ADHD in your daughter before the world mislabels her.'},

  {t:'promise', kick:'What this hour gives you',
   h:'One live hour, mum to mum',
   body:'A doctor who parents an ADHD girl walks you through what ADHD actually looks like in girls, why it hides, and the first move that changes your whole house. Live, so you can ask your own questions.'},

  {t:'audience', kick:'Who this is for',
   h:'For the mum who keeps being told it is nothing',
   body:'You sense something is off. School says she is just quiet, or dramatic, or lazy. You leave every meeting doubting yourself. This hour is for you, not for a textbook child who does not exist.'},

  {t:'trap', kick:'The trap',
   h:'The picture everyone is looking for is a boy',
   body:'The classic ADHD picture is a boy who cannot sit still. Your daughter is organised at school and falls apart at home, or disappears into daydreams. So she slips through every screen, for years.'},

  {t:'reframe', kick:'The hard truth',
   h:'She is not coping. She is masking.',
   body:'Quiet is not the same as fine. Many girls spend all day holding it together, then release it at home where it is safe. The calm report from school is often the clearest sign something is being missed.'},

  {t:'part', kick:'Part one', h:'Why ADHD in girls hides',
   body:'Three things make it almost invisible, and none of them are your fault.'},

  {t:'point', kick:'Masking',
   h:'The daytime performance',
   body:'She studies the room and copies what looks normal. It is exhausting and it works, which is exactly why no one around her raises a flag.'},

  {t:'point', kick:'Internalising',
   h:'It points inward, not outward',
   body:'Instead of disruption you see anxiety, perfectionism, people-pleasing, and a harsh inner voice. It reads as a sensitive child, not a neurodiverse one.'},

  {t:'labels', kick:'The words she collects',
   h:'The labels that land instead',
   body:'Before anyone says ADHD, she is handed a stack of other words.',
   items:['Shy', 'Lazy', 'Too sensitive', 'Dramatic', 'Daydreamer', 'Just a worrier']},

  {t:'part', kick:'Part two', h:'The signs that actually matter',
   body:'What to look for in a girl, and the shift that has to come first.'},

  {t:'point', kick:'At home vs the world',
   h:'The after-school crash',
   body:'A child who is regulated all day and melts down the moment she is home is not badly behaved. She is running on empty after hours of holding it together.'},

  {t:'signs', kick:'Quietly telling signs',
   h:'Less obvious, more common',
   items:['Starts everything, finishes little', 'Loses the thread mid-sentence', 'Flooded by friendships and fallouts', 'Clever on paper, chaotic in practice', 'Hard on herself out of all proportion']},

  {t:'pillar', kick:'The Recharge Station',
   h:'You come first. Not second.',
   body:'You cannot advocate for her while you are running on nothing. The first move is not a new chart for her. It is giving yourself permission to recharge, because a steady parent is the intervention.'},

  {t:'part', kick:'Part three', h:'What to do with this',
   body:'From a hunch to the right support, without losing yourself in the fight.'},

  {t:'point', kick:'A real assessment',
   h:'Ask the question out loud',
   body:'You are allowed to say the words "could this be ADHD" and ask for a proper assessment that understands the female presentation. Come knowing the signs, not apologising for being here.'},

  {t:'point', kick:'The system',
   h:'Navigate support without burning out',
   body:'School and health systems are a maze. You do not have to win every battle at once. You need the few that matter and a community that has walked it ahead of you.'},

  {t:'shift', kick:'The one shift',
   h:'Support <span class="strike">her</span> yourself first',
   body:'The whole category tells you to fix the child. The change that actually works is quieter. Steady the mum, and almost everything downstream gets easier for her.'},

  {t:'why', kick:'Why listen to me',
   h:'A doctor and a mum, same person',
   body:'I am a medical doctor and I am raising a daughter with ADHD and dyslexia. I have sat on both sides of the desk. The SEND Parenting Podcast and the ADHD Warrior Mum community grew out of what I could not find anywhere else.',
   sig:true},

  {t:'recap', kick:'If you take one thing',
   h:'Her quiet is a message, not a verdict',
   body:'ADHD in girls hides behind masking, anxiety, and good manners. Learn the real signs, get the right assessment, and recharge yourself first. That order matters more than any single strategy.'},

  {t:'cta', kick:'Your next step',
   h:'Come and do this with us',
   body:'Join the ADHD Warrior Mum community and the Recharge Station: live masterclasses, Ask and Thrive group calls, and a room full of mums who get it.',
   step:'Join the ADHD Warrior Mum community',
   disc:'This masterclass is educational. It is not medical advice, assessment, or diagnosis, and it is not a substitute for care from your own clinician. No particular outcome or result is guaranteed. Results vary from family to family.'}
];

const deck = document.getElementById('deck');
S.forEach(function(s, i){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t === 'title' ? ' hero' : '');
  let html = '';
  html += '<div class="num">' + (i+1) + ' / ' + S.length + '</div>';
  if (s.kick) html += '<span class="kick">' + s.kick + '</span>';
  if (s.t === 'title') {
    html += '<h1>' + s.h + '</h1>';
    if (s.lede) html += '<div class="lede">' + s.lede + '</div>';
  } else if (s.t === 'part') {
    html += '<div class="part">' + s.kick + '</div><h2>' + s.h + '</h2>';
    if (s.body) html += '<p class="body">' + s.body + '</p>';
  } else {
    html += '<h2>' + s.h + '</h2>';
    if (s.body) html += '<p class="body">' + s.body + '</p>';
  }
  if (s.items) {
    html += '<ul>';
    s.items.forEach(function(it){ html += '<li>' + it + '</li>'; });
    html += '</ul>';
  }
  if (s.sig) html += '<div class="sig">with <b>Dr. Olivia Kessel</b>, SEND Parenting</div>';
  if (s.step) html += '<span class="cta-step">' + s.step + '</span>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
