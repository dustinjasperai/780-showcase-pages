<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Peer Advisory Masterclass · Tina Corner Stolz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zilla+Slab:wght@400;500;600;700&family=Raleway:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#10131b; --panel:#181c27; --rule:#2a2f3d;
    --accent:#ffc700; --ink:#eef1f8; --grey:#c3cad8; --dim:#8b93a5;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Raleway',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Zilla Slab',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.12;letter-spacing:-.005em}
  .t-title h1{font-size:4.9vw}
  .t-normal h1{font-size:3.3vw;max-width:86%}
  .t-normal .body{font-size:1.48vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.8vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Raleway',sans-serif;font-size:1.36vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#1b2131 0%,#0a0c12 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.7vw;max-width:88%;font-weight:500;color:#f4f6fb}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#1b2131 0%,#0a0c12 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:84%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:#ffe27a;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .seat-motif{position:absolute;pointer-events:none}
  .title-seat{right:7.5%;bottom:8%;width:23vw;opacity:.95}
  .corner-seat{right:6%;bottom:7.2%;width:11vw;opacity:.5}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">LXCouncil</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- "seat at the table": a boardroom rule with one gold seat, echoing the book title -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="seat" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="20" y1="96" x2="240" y2="96" stroke="#c3cad8" opacity="0.35"/>
    <circle cx="60" cy="82" r="6" fill="none" stroke="#c3cad8" stroke-width="2.2" opacity="0.3"/>
    <circle cx="110" cy="82" r="6" fill="none" stroke="#c3cad8" stroke-width="2.2" opacity="0.3"/>
    <circle cx="160" cy="82" r="7.5" fill="#ffc700" stroke="#ffc700" stroke-width="2.6"/>
    <circle cx="210" cy="82" r="6" fill="none" stroke="#c3cad8" stroke-width="2.2" opacity="0.3"/>
    <path d="M160 89 V112" stroke="#ffc700" stroke-width="2.6" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Peer Advisory Masterclass',sub:'How to launch and run a peer advisory group that CEOs stay in for years, not months.',brand:true,seat:'title'},
 {t:'normal',k:'Who this is for',title:'You are already good in a room.',body:'You can hold a conversation of senior people, read the table, and earn trust fast. What you want now is a way to turn that into a practice that pays you every month, not a favor you do for free.'},
 {t:'dark',title:'A great meeting and a group people never leave are two different skills.'},

 {t:'section',idx:'Part One',title:'Why Most Groups Quietly Die'},
 {t:'normal',k:'The year-two drop',title:'Most peer groups fall apart in their second year.',body:'The first year runs on novelty. Then the calendar gets heavy, one or two members drift, the room feels thinner, and a group that started full is suddenly fighting to keep a quorum.'},
 {t:'normal',k:'The real cause',title:'It is almost never the members. It is the design.',body:'When the wrong people are at the table, when the agenda wanders, or when the facilitator turns into an advisor, the seat stops being worth the fee. Members do not announce that. They just stop showing up.'},
 {t:'dark',title:'Retention is engineered before the first meeting, not hoped for after it.'},

 {t:'section',idx:'Part Two',title:'The Craft Of The Room'},
 {t:'normal',k:'Meeting design',title:'Every minute has to earn its seat.',body:'A council meeting is built so each leader leaves with one real decision made, not a stack of updates. The structure of the ninety minutes is what makes a busy CEO clear the morning for it.'},
 {t:'normal',k:'Group dynamics',title:'A room of handpicked, non-competing leaders polices itself.',body:'Who sits at the table decides everything. Non-competing peers, matched by stage and stakes, with confidentiality that is real, create a room honest enough that people say the thing they would not say anywhere else.'},
 {t:'normal',k:'Strategic questioning',title:'The best facilitators ask. They do not advise.',body:'The value is not your answer. It is the question that pulls the answer out of the person who has to live with it. That single shift is what separates a paid council from a networking lunch.'},
 {t:'dark',title:'Meeting design, group dynamics, strategic questioning. That is why members renew.'},

 {t:'section',idx:'Part Three',title:'A Practice, Not Just A Meeting'},
 {t:'normal',k:'The model',title:'You keep what you build.',body:'Members pay a monthly fee to hold their seat. Run it as your own practice and the recurring revenue is yours to keep, meeting after meeting, group after group, with no ceiling but the number of rooms you can hold well.'},
 {t:'normal',k:'What good looks like',title:'The right room compounds for years.',body:'A council built this way holds its members past four years and rarely loses a group at all. The retention is the business. A full room that renews beats a busy funnel you have to refill every quarter.'},
 {t:'normal',k:'Why me',title:'I built this the hard way first.',body:'I became one of the largest single-owner peer board franchisees in the world in my first year, spent more than ten thousand hours in over a thousand peer meetings, then built LXCouncil so facilitators could run the model on their own terms.'},
 {t:'dark',title:'The seat is the product. The whole job is making it worth keeping.'},

 {t:'section',idx:'Your next step',title:'Launch Your Own Council'},
 {t:'normal',k:'How I can help',title:'PeerLaunch360 and the PaCA Academy.',body:'It is the certification I wish I had at the start: a 100-point launch checklist and a twelve-module academy covering meeting design, group dynamics, and strategic questioning, built to get your first paying group running in about a hundred and twenty days.'},
 {t:'cta',title:'Ready to build a group CEOs never want to leave?',chips:['Take the fit assessment','Book a strategy call'],disc:'Educational content for aspiring peer advisory and mastermind facilitators. No income, revenue, or business result is guaranteed. Results vary by facilitator, market, and effort.'},
];

const deck=document.getElementById('deck');
function seat(kind){return `<svg class="seat-motif ${kind==='title'?'title-seat':'corner-seat'}"><use href="#seat"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">LX<b>Council</b> · Tina Corner Stolz</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.seat) h+=seat(s.seat);
  else if(s.t==='title') h+=seat('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
