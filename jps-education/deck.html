<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Evidence-Based Coach — JPS Education</title>
<link href="https://fonts.googleapis.com/css2?family=Antonio:wght@500;600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4f2;
  --panel:#ffffff;
  --ink:#141414;
  --accent:#b01213;
  --dark:#141414;
  --rule:#e4e4e4;
  --grey:#55514e;
  --dim:#8a8580;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);font-family:'DM Sans',sans-serif;color:var(--ink);padding:26px 0 60px}
.deck{max-width:1120px;margin:0 auto;padding:0 20px;display:flex;flex-direction:column;gap:22px}
.slide{position:relative;aspect-ratio:16/9;background:var(--panel);border:1px solid var(--rule);
  border-radius:14px;padding:66px 74px;overflow:hidden;display:flex;flex-direction:column;
  box-shadow:0 12px 34px rgba(20,20,20,.06)}
.kicker{font-family:'Antonio',sans-serif;font-weight:700;font-size:16px;letter-spacing:.22em;
  text-transform:uppercase;color:var(--accent);margin-bottom:24px}
h1{font-family:'Antonio',sans-serif;font-weight:700;font-size:62px;line-height:1.02;
  letter-spacing:.005em;text-transform:uppercase;color:var(--ink)}
h2{font-family:'Antonio',sans-serif;font-weight:700;font-size:46px;line-height:1.05;
  letter-spacing:.005em;text-transform:uppercase;color:var(--ink)}
.sub{font-size:26px;line-height:1.45;color:var(--grey);margin-top:22px;max-width:88%}
.body{font-size:23px;line-height:1.55;color:var(--grey);margin-top:24px;max-width:90%}
.pts{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:15px}
.pts li{font-size:22px;color:var(--ink);padding-left:38px;position:relative;line-height:1.4}
.pts li::before{content:"";position:absolute;left:0;top:10px;width:16px;height:16px;
  background:var(--accent);border-radius:3px}
.foot{margin-top:auto;padding-top:26px;display:flex;align-items:center;gap:12px;font-family:'Antonio',sans-serif;
  font-weight:600;font-size:15px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.foot .dot{width:9px;height:9px;background:var(--accent)}
.mark{position:absolute;top:60px;right:74px}
.mark svg{display:block}
.slide.title{background:var(--panel);border-top:8px solid var(--accent)}
.slide.title h1{font-size:82px}
.slide.title .brand{margin-top:auto;font-family:'Antonio',sans-serif;font-weight:600;font-size:19px;
  letter-spacing:.1em;text-transform:uppercase;color:var(--ink)}
.slide.title .brand span{color:var(--accent)}
.slide.part{background:var(--dark);border-color:var(--dark);justify-content:center}
.slide.part .num{font-family:'Antonio',sans-serif;font-weight:700;font-size:17px;letter-spacing:.26em;
  text-transform:uppercase;color:var(--accent);margin-bottom:20px}
.slide.part h2{color:#fbfafa;font-size:54px;max-width:84%}
.slide.part .rule{width:92px;height:6px;background:var(--accent);margin-top:28px}
.slide.reframe{background:var(--dark);border-color:var(--dark);justify-content:center}
.slide.reframe h1{color:#fbfafa;font-size:60px;max-width:94%}
.slide.reframe h1 em{font-style:normal;color:var(--accent)}
.slide.reframe .sub{color:#c9c4c0;margin-top:26px}
.slide.pillar{flex-direction:row;align-items:center;gap:52px}
.slide.pillar .n{font-family:'Antonio',sans-serif;font-weight:700;font-size:160px;line-height:.86;
  color:var(--accent);flex-shrink:0;letter-spacing:-.02em}
.slide.pillar .col h2{font-size:44px}
.slide.pillar .col .body{margin-top:18px}
.slide.credibility{background:var(--panel)}
.slide.credibility .big{font-family:'Antonio',sans-serif;font-weight:700;font-size:40px;color:var(--accent);
  margin-top:10px;text-transform:uppercase;letter-spacing:.01em}
.slide.cta{background:var(--dark);border-color:var(--dark);justify-content:center}
.slide.cta .kicker{color:var(--accent)}
.slide.cta h1{color:#fbfafa;font-size:62px}
.slide.cta .body{color:#d8d4d0}
.slide.cta .pill{display:inline-block;margin-top:30px;font-family:'Antonio',sans-serif;font-weight:700;
  font-size:22px;letter-spacing:.04em;text-transform:uppercase;color:#fbfafa;background:var(--accent);
  border-radius:4px;padding:16px 34px}
.slide.cta .disc{margin-top:auto;font-size:14px;line-height:1.5;color:#98938e;max-width:88%}
@media(max-width:720px){
  .slide{padding:34px 30px;aspect-ratio:auto;min-height:460px}
  h1{font-size:36px}.slide.title h1{font-size:44px}.slide.reframe h1,.slide.cta h1{font-size:36px}
  h2{font-size:30px}.slide.part h2{font-size:34px}
  .sub{font-size:19px;max-width:100%}.body{font-size:18px;max-width:100%}.pts li{font-size:18px}
  .slide.pillar{flex-direction:column;align-items:flex-start;gap:14px}.slide.pillar .n{font-size:92px}
  .mark{display:none}
}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const MARK = '<svg width="60" height="30" viewBox="0 0 60 30" fill="none"><rect x="2" y="20" width="9" height="8" fill="var(--accent)"/><rect x="16" y="13" width="9" height="15" fill="var(--accent)"/><rect x="30" y="7" width="9" height="21" fill="var(--accent)"/><circle cx="52" cy="6" r="5" fill="none" stroke="var(--accent)" stroke-width="3"/></svg>';
const S = [
  {t:'title', kicker:'A free live masterclass for coaches', h:'The Evidence-Based Coach', sub:'How to turn training and nutrition science into results your clients can actually feel.'},
  {t:'who', kicker:'Who this is for', h:'You know the theory. Your clients still stall.', body:'This is for coaches and trainers who have done the reading, hold the qualifications, and still watch good clients plateau and drift away.', pts:['You have more information than ever','Your programs still run on hunches','Clients stall and you are not sure why']},
  {t:'trap', kicker:'The trap', h:'Certified is not the same as in demand.', body:'A certificate proves you passed an exam. It says nothing about whether the person in front of you keeps progressing. Most coaches collect more courses and still coach on guesswork.'},
  {t:'reframe', h:'Knowledge that never reaches the gym floor <em>changes nothing.</em>', sub:'The coaches clients fight to keep are not the ones who know the most. They are the ones who can turn what they know into a result on Monday.'},
  {t:'part', num:'Part One', h:'Why knowledge alone does not move clients'},
  {t:'content', kicker:'The core problem', h:'Drowning in conflicting information', body:'Every study, podcast, and influencer says something different. Without a way to weigh the evidence, coaches default to whatever they saw last, and the program becomes a collection of tactics with no logic underneath it.', pts:['Which evidence actually applies to this client?','Does the program match the goal, or a trend?','Is every variable there on purpose?']},
  {t:'content', kicker:'The cost of guessing', h:'A plateau is a programming problem', body:'When a client stalls, the instinct is to add volume, add motivation, add anything. But a stall is almost always a design flaw, not an effort flaw. Guessing at the fix is how good clients quietly leave.'},
  {t:'part', num:'Part Two', h:'The JPS method: science to the gym floor'},
  {t:'framework', kicker:'The method', h:'Coach from the evidence, not the noise', body:'The JPS method is the system we teach inside the Mentorship: read the evidence, then translate it into coaching decisions a real client can follow. It runs on four moves, in order.'},
  {t:'pillar', n:'01', h:'Read the evidence', body:'Learn the physiology of hypertrophy, fat loss, and strength well enough to know which research applies to the person in front of you, and which is just noise.'},
  {t:'pillar', n:'02', h:'Program for the goal', body:'Build training around principles and variables that match the client and their stage, from general population to advanced lifter, and troubleshoot stalls on purpose instead of by trial and error.'},
  {t:'pillar', n:'03', h:'Periodise the nutrition', body:'Turn nutrition science into meal plans and adjustments clients actually stick to, through periodisation and adherence, not another diet they abandon in three weeks.'},
  {t:'pillar', n:'04', h:'Progress the client', body:'Use the psychology of behaviour change and retention to keep clients engaged and progressing, because a result that lasts is what makes a coach impossible to replace.'},
  {t:'content', kicker:'The full build', h:'Eleven modules, one coaching system', body:'Inside the JPS Coach Mentorship the four moves become a complete curriculum, eleven evidence-based modules from coaching fundamentals through program design, diet programming, client progression, and professional development.'},
  {t:'part', num:'Part Three', h:'The coach clients cannot leave'},
  {t:'content', kicker:'What changes', h:'Results stop depending on luck', body:'When your decisions trace back to evidence, progress becomes repeatable. Clients feel the difference, they stay longer, and your reputation starts doing the selling for you.'},
  {t:'content', kicker:'What makes a coach in demand', h:'Trusted, not just qualified', body:'The coaches who stay booked are the ones who can explain why they do what they do and then deliver on it.', pts:['Decisions you can defend with evidence','Programs that adapt when a client stalls','Retention that compounds into referrals']},
  {t:'credibility', kicker:'Why learn this from JPS', h:'Built by coaches and researchers', big:'Science, from people who coach', body:'JPS Education was built by Jacob Schepis, one of Melbourne’s most sought-after coaches, with Dr Martin Refalo, a PhD researcher, as Education Director. The JPS podcast brings in the field’s leading evidence-based voices, and the Mentorship is internationally accredited. This is the gap between the science and the gym floor, closed.'},
  {t:'recap', kicker:'The whole method, in one line', h:'The Evidence-Based Coach', body:'Read the evidence. Program for the goal. Periodise the nutrition. Progress the client. Four moves that turn what you know into results your clients can feel, and a practice they do not want to leave.'},
  {t:'cta', kicker:'Your next step', h:'Become the coach clients ask for', body:'Join the next intake of the JPS Coach Mentorship and learn the full evidence-based system, module by module, with mentor-led live sessions. Start coaching from the evidence.', pill:'Join the JPS Coach Mentorship', disclaimer:'Educational content only. No specific income, client, or business result is guaranteed. Outcomes vary based on your clients, your effort, and how you apply the material.'}
];
function render(s){
  const el = document.createElement('section');
  el.className = 'slide ' + s.t;
  let inner = '';
  if(s.t==='title'){
    inner += '<div class="mark">'+MARK+'</div>';
    if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
    inner += '<h1>'+s.h+'</h1>';
    if(s.sub) inner += '<div class="sub">'+s.sub+'</div>';
    inner += '<div class="brand">JPS Education <span>&middot;</span> Jacob Schepis</div>';
  } else if(s.t==='part'){
    inner += '<div class="num">'+s.num+'</div><h2>'+s.h+'</h2><div class="rule"></div>';
  } else if(s.t==='reframe'){
    inner += '<h1>'+s.h+'</h1>'+(s.sub?'<div class="sub">'+s.sub+'</div>':'');
  } else if(s.t==='pillar'){
    inner += '<div class="n">'+s.n+'</div><div class="col"><h2>'+s.h+'</h2><div class="body">'+s.body+'</div></div>';
  } else if(s.t==='cta'){
    inner += '<div class="kicker">'+s.kicker+'</div><h1>'+s.h+'</h1>';
    inner += '<div class="body">'+s.body+'</div>';
    if(s.pill) inner += '<div><span class="pill">'+s.pill+'</span></div>';
    inner += '<div class="disc">'+s.disclaimer+'</div>';
  } else {
    inner += '<div class="mark">'+MARK+'</div>';
    if(s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
    inner += '<h2>'+s.h+'</h2>';
    if(s.big) inner += '<div class="big">'+s.big+'</div>';
    if(s.body) inner += '<div class="body">'+s.body+'</div>';
    if(s.pts){ inner += '<ul class="pts">'; s.pts.forEach(p=>inner+='<li>'+p+'</li>'); inner += '</ul>'; }
    inner += '<div class="foot"><span class="dot"></span>JPS Education</div>';
  }
  el.innerHTML = inner;
  return el;
}
const deck = document.getElementById('deck');
S.forEach(s => deck.appendChild(render(s)));
</script>
</body>
</html>
