<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Social Referral Engine — a masterclass with Rachel Adams Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef2ee; --panel:#ffffff; --panel2:#e4ece5; --rule:#cfdbd0;
    --accent:#7e9283; --ink:#2c4251; --body:#333333;
    --display:'Prata',Georgia,serif; --sans:'Poppins',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--sans);font-weight:300}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px;margin:0 0 26px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide.alt{background:var(--panel2)}
  .slide.ink{background:var(--ink);color:#f3efe8}
  .slide.ink .eyebrow{color:#aebcae}
  .slide.ink h1,.slide.ink h2{color:#fff}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:400;color:var(--ink);font-size:46px;line-height:1.12;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:400;color:var(--ink);font-size:34px;line-height:1.16;margin-bottom:16px}
  p{font-size:19px;line-height:1.6;max-width:62ch;margin-bottom:14px}
  .lead{font-size:23px;line-height:1.5}
  .big{font-family:var(--display);font-size:72px;color:var(--accent);line-height:1;margin:10px 0 18px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:14px;height:14px;border-radius:50%;background:var(--accent)}
  .steps{display:flex;gap:18px;margin-top:22px;flex-wrap:wrap}
  .step{flex:1;min-width:200px;background:#34475a;border:1px solid #45586c;border-radius:10px;padding:22px}
  .step .n{font-family:var(--display);font-size:30px;color:#9fb4a4;margin-bottom:8px}
  .step h3{font-family:var(--sans);font-weight:600;color:#fff;font-size:18px;margin-bottom:8px;letter-spacing:.02em}
  .step p{font-size:15px;margin:0;color:#cdd5dd}
  .brandline{font-family:var(--sans);font-weight:500;letter-spacing:.08em;color:#aebcae;font-size:15px;margin-top:22px}
  .foot{position:absolute;bottom:18px;right:28px;font-size:12px;color:#9fb0a2;letter-spacing:.1em;text-transform:uppercase}
  .cta-note{font-size:14px;color:#aebcae;max-width:60ch;margin-top:26px;line-height:1.5}
  .disc{font-size:12.5px;color:#9aa3ad;max-width:66ch;margin-top:18px;line-height:1.5}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:32px}.big{font-size:52px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', cls:'ink', eyebrow:'A live masterclass for realtors', h:'The Social Referral Engine',
  lead:'How to turn your own social media into a national referral network, so listings and closings come to you instead of being chased.',
  brand:'Rachel Adams Lee · Level Up Coaching'},

 {t:'promise', eyebrow:"What you'll walk away with", h:'One hour from now you’ll have a plan',
  bullets:[
   'Why "post more" has never worked, and what actually brings referrals',
   'The three-part system I used to go from 39 to 123 homes a year',
   'How to build a referral network that sends you business across the country',
   'A simple weekly rhythm you can start the same afternoon']},

 {t:'audience', cls:'alt', eyebrow:'Who this is for', h:'The agent who is doing everything right and still waiting',
  p:['You post. You show up. You follow up. And yet the pipeline still feels like it depends on luck, the market, or the next cold lead you have to chase down.',
     "You've been told the answer is more content, more dials, more hustle. So you do more, and the needle barely moves."]},

 {t:'trap', eyebrow:'The trap', h:'Posting for likes is not the same as posting for referrals',
  p:['Most agents treat social media like a billboard. They post listings, market updates, and the occasional selfie, and they measure it in likes.',
     'Likes feel like progress. But a feed full of applause does not put a single qualified seller on your calendar.']},

 {t:'reframe', cls:'ink', eyebrow:'The reframe', h:'Followers are not the goal. A referral system is.',
  lead:"The agents who win on social are not the ones with the biggest audience. They're the ones whose audience keeps sending them people."},

 {t:'problem', eyebrow:'Part one · the core problem', h:'The like economy versus the referral economy',
  p:['In the like economy, every post starts from zero and the attention evaporates in a day. You are always feeding the machine.',
     'In the referral economy, each piece of content does a job: it reminds your people what you do, who you help, and how to send someone your way. The content compounds instead of disappearing.']},

 {t:'problem', cls:'alt', eyebrow:'Part one · the core problem', h:'Why most agent content never converts',
  bullets:[
   'It talks about the house, not the person who needs to move',
   'It never tells anyone you take referrals, so no one offers one',
   'It has no rhythm, so your audience forgets you between posts',
   'It chases trends instead of building one recognizable brand']},

 {t:'framework', cls:'ink', eyebrow:'Part two · the framework', h:'Build. Network. Scale.',
  lead:'This is the Dynamic Agent system, applied to one channel: your social media as a referral engine.',
  steps:[
   {n:'01', title:'BUILD', body:'The foundation: one clear brand, one promise, one audience that knows exactly what you do.'},
   {n:'02', title:'NETWORK', body:'The right audiences: clients, community, and agents around the country who send business your way.'},
   {n:'03', title:'SCALE', body:'The rhythm and systems that let referrals grow without you living inside the app.'}]},

 {t:'build', eyebrow:'Build', h:'A brand people can refer in one sentence',
  p:['Before you post anything, your people need to be able to say what you do without hesitating. "She’s the agent for young families moving into the suburbs" beats "she sells real estate" every time.',
     'We’ll define the one promise your whole feed points back to, so every post reinforces the same recognizable brand.']},

 {t:'network', cls:'alt', eyebrow:'Network', h:'The National Referral Network',
  p:['Referrals are not only clients. Some of the best business comes from other agents in other cities who have a client moving to your market and no one to send them to.',
     'Last year, 131 of my referrals came from social media alone, a large share of them agent to agent. We’ll map exactly how to build and nurture that network on purpose.']},

 {t:'network', eyebrow:'Network · posting with intent', h:'What to post, when, and why it brings referrals',
  bullets:[
   'Content that tells people you take referrals and makes it easy to send one',
   'A simple platform plan across Instagram, Facebook, and YouTube',
   'How to beat the algorithm without chasing every trend',
   'The few post types that do the heavy lifting, so you stop guessing']},

 {t:'scale', cls:'ink', eyebrow:'Scale', h:'A referral engine that runs without running you',
  lead:'Once the brand is clear and the network is built, the work becomes a rhythm, not a scramble. A handful of intentional posts and touches a week keeps the engine warm.'},

 {t:'apply', eyebrow:'Part three · what your week becomes', h:'A week inside the engine',
  bullets:[
   "A short planning block that sets the week's content with intent",
   'Posts that reinforce one brand and invite referrals',
   'A rhythm of genuine touches with your referral network',
   'Conversations that turn into appointments, not just comments']},

 {t:'proof', cls:'alt', eyebrow:'Why listen to me', h:'I built this on my own business first',
  big:'39 → 109 → 123',
  p:["Homes sold in my first three years, built from social and referrals rather than cold calling. Named to the Wall Street Journal's Top 1,000 agents in the U.S., and last year 131 of my referrals came from social alone.",
     'I teach this because it is the exact system that built my business, not a theory.']},

 {t:'fit', eyebrow:'Is this you', h:'This is for you if',
  bullets:[
   "You're a realtor who's tired of chasing cold leads to stay busy",
   'You post but it never seems to turn into actual business',
   'You want a pipeline that comes from relationships, not luck',
   "You're ready to build one brand instead of posting at random"]},

 {t:'cta', cls:'ink', eyebrow:'Your next step', h:"Let's build your referral engine together",
  lead:'If you want help putting this to work in your own market, the next step is a short clarity call. We’ll look at where your business is now and whether the Top Producer Society is the right fit to get you there.',
  note:'Book your clarity call at levelupcoachingco.com. I read every one personally.',
  disc:"This masterclass is educational. Results depend on your market, your effort, and many factors outside any program's control, and no specific income or production result is promised or guaranteed. The numbers shared are my own experience, not a typical result."}
];

const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.cls?' '+s.cls:'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+esc(s.eyebrow)+'</div>';
  if(s.h) html+=(s.t==='title'||s.t==='reframe'||s.t==='cta'||s.t==='framework')?'<h1>'+esc(s.h)+'</h1>':'<h2>'+esc(s.h)+'</h2>';
  if(s.big) html+='<div class="big">'+esc(s.big)+'</div>';
  if(s.lead) html+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.p) (Array.isArray(s.p)?s.p:[s.p]).forEach(x=>html+='<p>'+esc(x)+'</p>');
  if(s.bullets){html+='<ul>';s.bullets.forEach(b=>html+='<li>'+esc(b)+'</li>');html+='</ul>';}
  if(s.steps){html+='<div class="steps">';s.steps.forEach(st=>html+='<div class="step"><div class="n">'+esc(st.n)+'</div><h3>'+esc(st.title)+'</h3><p>'+esc(st.body)+'</p></div>');html+='</div>';}
  if(s.brand) html+='<div class="brandline">'+esc(s.brand)+'</div>';
  if(s.note) html+='<p class="cta-note">'+esc(s.note)+'</p>';
  if(s.disc) html+='<p class="disc">'+esc(s.disc)+'</p>';
  html+='<div class="foot">'+String(i+1).padStart(2,'0')+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
