<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Staff-Nurse-to-Leader Masterclass — Patrick LaRose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f0;        /* their cream ground */
    --panel:#f3ebe0;     /* deeper warm cream */
    --ink:#2b2622;       /* their warm-brown ink */
    --muted:#6f655c;     /* muted brown */
    --rule:#c9b9a6;      /* warm rule */
    --accent:#b5643c;    /* their terracotta */
    --display:'Fraunces',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--panel);color:var(--ink);font-family:var(--body);line-height:1.5}
  #deck{max-width:1040px;margin:0 auto}
  .slide{
    background:var(--bg);min-height:92vh;display:flex;flex-direction:column;
    justify-content:center;padding:7vh 8vw;border-bottom:1px solid var(--rule);
    position:relative;
  }
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.4rem}
  .label{font-family:var(--display);font-weight:600;color:var(--accent);font-size:1.05rem;margin-bottom:1.1rem}
  h1{font-family:var(--display);font-weight:600;font-size:clamp(2.2rem,5.2vw,3.7rem);line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(1.7rem,3.8vw,2.7rem);line-height:1.12}
  .sub{font-size:clamp(1.05rem,1.8vw,1.35rem);color:var(--muted);margin-top:1.4rem;max-width:38ch}
  .body{font-size:clamp(1.05rem,1.7vw,1.3rem);margin-top:1.3rem;max-width:46ch}
  .foot{margin-top:2.4rem;font-size:.9rem;color:var(--muted);letter-spacing:.02em}
  ul{margin-top:1.6rem;list-style:none;max-width:48ch}
  li{position:relative;padding-left:1.6rem;margin-bottom:1rem;font-size:clamp(1rem,1.6vw,1.22rem)}
  li:before{content:"";position:absolute;left:0;top:.62em;width:.6rem;height:.6rem;background:var(--accent);border-radius:50%}
  .pillar-n{font-family:var(--display);font-size:1.1rem;color:var(--accent);font-weight:600}
  .big{font-family:var(--display);font-size:clamp(2rem,4.6vw,3.2rem);line-height:1.1;max-width:20ch}
  .strike{text-decoration:line-through;text-decoration-color:var(--rule);color:var(--muted)}
  .em{color:var(--accent)}
  .cta-box{margin-top:2rem;padding:1.3rem 1.6rem;border:1px solid var(--rule);background:var(--panel);
    display:inline-block;font-family:var(--display);font-size:1.2rem}
  .disc{margin-top:2.2rem;font-size:.82rem;color:var(--muted);max-width:52ch;line-height:1.5}
  .hr{width:4rem;height:2px;background:var(--accent);margin:1.8rem 0}
  .pagenum{position:absolute;bottom:2.2rem;right:8vw;font-size:.78rem;color:var(--muted);letter-spacing:.1em}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:"A live masterclass for nurses",
    h:"The Staff-Nurse-to-Leader Masterclass",
    sub:"How to step up without losing the nurse you are.",
    foot:"Live with Patrick LaRose, DNP, MSN/Ed., RN, NC-BC Board-Certified Coach"},

  {t:'promise',
    kicker:"What you will leave with",
    h:"One honest hour, and a plan you can actually use.",
    body:"By the end you will know where you really are, what the next step is, and how to take it without burning out or walking away from nursing."},

  {t:'who',
    kicker:"Who this is for",
    h:"The nurse everyone already calls.",
    list:["You were just offered charge nurse, manager, or a director seat, and it feels more like a threat than a win.",
      "You have been passed over, and you are starting to wonder if it is you.",
      "You carry the unit already, but no one ever taught you to lead on purpose."]},

  {t:'trap',
    kicker:"The trap",
    h:"Clinical mastery does not transfer to leadership on its own.",
    body:"You can calm a family, catch a mistake, and keep moving on three hours of sleep. None of that is the same skill as leading people, and nobody hands you the playbook on the day you are promoted."},

  {t:'reframe',
    kicker:"The reframe",
    big:'You are not <span class="strike">burned out.</span> You are carrying <span class="em">moral injury.</span>',
    body:"Burnout says rest and you will be fine. Moral injury is the weight of giving care in ways you never wanted to, short staffed, year after year. Naming it right changes what you do next."},

  {t:'part', label:"Part One", h:"Why the leap feels like a threat"},

  {t:'body',
    h:"The identity question underneath the promotion.",
    body:"Nursing asks so much of you to earn the title that it becomes who you are. Stepping into leadership means holding \"I am a nurse\" and \"I am a leader\" at the same time, without one erasing the other."},

  {t:'body',
    h:"Your values live in your calendar and your bank statement.",
    body:"If you want to know what you actually value, do not just say it out loud. Look at where your time and your money already go. That is the honest starting line, and most nurses have never been shown it."},

  {t:'part', label:"Part Two", h:"The three pillars"},

  {t:'pillar',
    n:"Pillar one",
    h:"Orientation",
    body:"An honest read on where you actually are right now, before a single plan is made. No fixing yet. Just the truth about the ground you are standing on."},

  {t:'pillar',
    n:"Pillar two",
    h:"Proximity",
    body:"Consistent, accountable engagement. Staying close enough to the work, week over week, that the change holds instead of fading the moment the shift gets hard again."},

  {t:'pillar',
    n:"Pillar three",
    h:"Integration",
    body:"Turning what you discover into sustainable practice and a renewed identity, so leading becomes who you are, not a role you are performing until you are found out."},

  {t:'part', label:"Part Three", h:"What it looks like in real life"},

  {t:'body',
    h:"The first ninety days of leading differently.",
    list:["Week one: an honest map of where you and your team actually are.",
      "The early weeks: one or two changes you can hold, not twenty you cannot.",
      "By ninety days: a way of leading that sounds like you, not a borrowed voice."]},

  {t:'whyme',
    kicker:"Why me",
    h:"I climbed this ladder, then I came back for the people still on it.",
    body:"I spent about fourteen years in healthcare leadership, from the bedside through management to a senior regional VP seat in Florida. I know the climb, and I know what it costs. I coach nurses through nursing, not out of it."},

  {t:'recap',
    kicker:"The whole thing in one line",
    big:'Lead without <span class="em">erasing the nurse you are.</span>',
    body:"Orientation tells you the truth. Proximity makes it stick. Integration makes it yours."},

  {t:'cta',
    kicker:"Your next step",
    h:"Book a free call, nurse to nurse.",
    body:"Thirty minutes, real and honest, no fancy frameworks. You leave with the first two steps of a plan written down. If it is a fit, we talk about going deeper from there.",
    cta:"Book your free Nurse-to-Nurse call at lifenursecoach.com",
    disc:"Educational session only. No income, outcome, or career result is guaranteed. Results vary by individual, effort, and circumstance. Coaching is not clinical, medical, or mental-health treatment."}
];

function esc(x){return x==null?"":x;}
function render(){
  const deck=document.getElementById('deck');
  S.forEach((s,i)=>{
    const sec=document.createElement('section');
    sec.className='slide';
    let html='';
    if(s.kicker) html+='<div class="kicker">'+esc(s.kicker)+'</div>';
    if(s.label) html+='<div class="label">'+esc(s.label)+'</div>';
    if(s.n) html+='<div class="pillar-n">'+esc(s.n)+'</div>';
    if(s.big) html+='<div class="big">'+esc(s.big)+'</div>';
    else if(s.h && (s.t==='part')) html+='<h1>'+esc(s.h)+'</h1>';
    else if(s.h && (s.t==='title')) html+='<h1>'+esc(s.h)+'</h1>';
    else if(s.h) html+='<h2>'+esc(s.h)+'</h2>';
    if(s.sub) html+='<div class="sub">'+esc(s.sub)+'</div>';
    if(s.body) html+='<div class="body">'+esc(s.body)+'</div>';
    if(s.list){ html+='<ul>'; s.list.forEach(it=>{html+='<li>'+esc(it)+'</li>';}); html+='</ul>'; }
    if(s.cta) html+='<div class="cta-box">'+esc(s.cta)+'</div>';
    if(s.disc) html+='<div class="disc">'+esc(s.disc)+'</div>';
    if(s.t!=='title') html+='<div class="pagenum">'+(i+1)+' / '+S.length+'</div>';
    sec.innerHTML=html;
    deck.appendChild(sec);
  });
}
render();
</script>
</body>
</html>
