<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fitness for Your Landscape Business — a live masterclass with Grant Harrison</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5f6f7; --panel:#ffffff; --ink:#22303c; --mute:#5b6b78;
    --rule:#cfd6dc; --accent:#e67e22; --navy:#194b7d;
    --head:'Oswald',sans-serif; --body:'Roboto',Arial,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid var(--rule);scroll-snap-align:start;position:relative}
  .wrap{scroll-snap-type:y proximity}
  .kick{font-family:var(--head);text-transform:uppercase;letter-spacing:.18em;
    font-weight:600;font-size:clamp(12px,1.4vw,15px);color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:700;line-height:1.02;letter-spacing:.005em;
    font-size:clamp(34px,6.4vw,82px);margin:0 0 20px}
  h2{font-family:var(--head);font-weight:700;line-height:1.05;
    font-size:clamp(28px,4.6vw,56px);margin:0 0 18px}
  p.lead{font-size:clamp(17px,2.1vw,25px);max-width:30ch;color:var(--ink);margin:0 0 10px}
  p.sub{font-size:clamp(15px,1.7vw,20px);max-width:46ch;color:var(--mute);margin:10px 0 0}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);
    font-size:clamp(13px,1.3vw,15px);letter-spacing:.14em;text-transform:uppercase}
  ul.list{list-style:none;padding:0;margin:14px 0 0;max-width:40ch}
  ul.list li{font-size:clamp(17px,2vw,23px);padding:14px 0;border-top:1px solid var(--rule);
    display:flex;gap:16px;align-items:baseline}
  ul.list li:before{content:"";flex:0 0 12px;height:12px;border-radius:2px;
    background:var(--accent);transform:translateY(2px)}
  .part{background:var(--navy);color:#fff;border-bottom:none}
  .part .kick{color:#ffd9b3}
  .part h2{color:#fff}
  .part p.sub{color:#d6e2ee}
  .pill h2{color:var(--navy)}
  .pill .num{color:var(--navy)}
  .why .panel{background:var(--panel);border:1px solid var(--rule);border-left:6px solid var(--accent);
    padding:30px 32px;max-width:58ch;border-radius:4px}
  .cta{background:var(--navy);color:#fff}
  .cta h1{color:#fff}
  .cta .kick{color:#ffd9b3}
  .cta .step{font-family:var(--head);font-weight:600;font-size:clamp(18px,2.3vw,26px);
    margin:8px 0 0;color:#fff}
  .cta .disc{color:#bcd0e2;font-size:14px;max-width:60ch;margin:26px 0 0;line-height:1.55}
  .foot{position:absolute;bottom:3.2vh;left:9vw;right:9vw;display:flex;justify-content:space-between;
    font-size:12px;color:var(--mute);letter-spacing:.04em;font-family:var(--head);text-transform:uppercase}
  .part .foot,.cta .foot{color:rgba(255,255,255,.6)}
  .brandline{font-family:var(--head);font-weight:600;letter-spacing:.06em}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
/* All slide COPY lives inside this const S array (deck_content_check scans only this). */
const S=[
  {t:'title',
    k:"A live masterclass for landscape & snow owners",
    h:"Fitness for Your Landscape Business",
    s:"The 5-Pillar Tune-Up. A live 60-minute session with Grant Harrison, Nextra Consulting."},

  {t:'who',
    k:"Who this is for",
    h:"You built the company. Now it runs you.",
    s:"Landscape and snow business owners who are great in the field, booked solid, and still not seeing the time, money, or freedom the work should buy."},

  {t:'reframe',
    k:"The hard truth",
    h:"You don't have a lead problem. You have a business that only works when you're in it.",
    s:"More leads just means more work on your plate. The fix is not another truck or another app. It is building a company that is fit enough to run without you on every job."},

  {t:'part',
    k:"Part One",
    h:"Why great landscapers stay stuck",
    s:"The best technician in the company is usually the owner, and that is exactly the trap."},

  {t:'list',
    k:"Three things that keep owners stuck",
    h:"It is rarely the work. It is the business.",
    list:["Money mindset: scarcity thinking that treats every dollar as spent, never invested.",
          "People: staying the bottleneck because it feels faster to do it yourself.",
          "Time: being busy all day and calling that productive."]},

  {t:'point',
    k:"Constraint one",
    h:"Money mindset",
    s:"If you see money only as something to hold onto, you will never invest in the people and systems that let the company grow. Owners who think about money with abundance, and surround themselves with people who do too, make different decisions."},

  {t:'point',
    k:"Constraint two",
    h:"You cannot grow without leveraging your team",
    s:"Trusting people is not just a leadership trait. It is a growth strategy. Hire people who are better than you in the places you are weak, then actually delegate instead of hovering. The owners who stay stuck spend their energy fixing their worst people and ignoring their best ones."},

  {t:'point',
    k:"Constraint three",
    h:"Slow down to speed up",
    s:"Just because you are busy does not mean you are being productive. Blocking time to plan, to train, and to communicate strategy feels slow. It is the only thing that lets you step out of the daily grind without the company falling over."},

  {t:'part',
    k:"Part Two",
    h:"The 5 Pillars of a fit business",
    s:"A simple way to see exactly where your company is strong and where it is soft."},

  {t:'list',
    k:"The framework",
    h:"Five pillars. One honest look.",
    list:["Leadership","Finances","Staff","Operations","Customers"]},

  {t:'pill',
    k:"Pillar one",
    h:"Leadership",
    s:"A clear vision for one, three, and ten years, and the discipline to meet on it. Most landscape companies drift because nobody is steering on purpose."},

  {t:'pill',
    k:"Pillar two",
    h:"Finances",
    s:"Know your numbers well enough to price for profit and to survive a slow winter. In a seasonal business, the finances pillar is what makes you profitable in January, not just July."},

  {t:'pill',
    k:"Pillar three",
    h:"Staff",
    s:"The right people in the right roles, hired and trained on a system instead of in a panic. Your crews are your capacity. If they can only work when you are watching, you have not built a team yet."},

  {t:'pill',
    k:"Pillar four",
    h:"Operations",
    s:"The repeatable way the work gets scheduled, done, and checked, so quality does not live only in your head. This is the pillar that lets you take a week off without the phone exploding."},

  {t:'pill',
    k:"Pillar five",
    h:"Customers",
    s:"A clear picture of who your best customer is, how you win them, and how you keep them coming back season after season. Good operations are worth little if you are selling to the wrong people."},

  {t:'part',
    k:"Part Three",
    h:"What a fit business looks like",
    s:"When the five pillars are strong, the company stops depending on you for everything."},

  {t:'list',
    k:"The payoff",
    h:"Stronger, leaner, more profitable.",
    list:["More time: the work gets done whether or not you are on the truck.",
          "More money: you price for profit and plan for the off-season.",
          "More freedom: the company can grow past what one owner can personally carry."]},

  {t:'why',
    k:"Why listen to me",
    h:"I have sat in your seat.",
    s:"I have been in the landscape industry since I was 15. I ran field crews and quality control, then owned my own landscape design and build company and lived every cash-flow and staffing headache you are living now. I closed it to figure out what actually makes these businesses work, and that is what Nextra Consulting teaches every day. This is fitness for your business."},

  {t:'cta',
    k:"Your next step",
    h:"Let's give your business a tune-up.",
    step:"Book a free consultation with Grant at Nextra Consulting, or ask about joining a landscape owner peer group.",
    disc:"This masterclass is educational and reflects one operator's experience. No specific income or result is guaranteed. Results vary with your market, your team, your effort, and how you execute."}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
function render(){
  const deck=document.getElementById('deck');
  S.forEach(function(s,i){
    let cls='slide';
    if(s.t==='part')cls+=' part';
    if(s.t==='pill')cls+=' pill';
    if(s.t==='why')cls+=' why';
    if(s.t==='cta')cls+=' cta';
    const sec=el('section',cls);
    if(s.k)sec.appendChild(el('div','kick',s.k));
    if(s.t==='title'){sec.appendChild(el('h1',null,s.h));sec.appendChild(el('p','sub',s.s));}
    else if(s.t==='cta'){sec.appendChild(el('h1',null,s.h));sec.appendChild(el('div','step',s.step));sec.appendChild(el('div','disc',s.disc));}
    else{sec.appendChild(el('h2',null,s.h));}
    if(s.list){const ul=el('ul','list');s.list.forEach(function(li){ul.appendChild(el('li',null,li));});sec.appendChild(ul);}
    if(s.s && s.t!=='title'){
      if(s.t==='why'){const p=el('div','panel');p.appendChild(el('p','lead',s.s));sec.appendChild(p);}
      else sec.appendChild(el('p','sub',s.s));
    }
    const f=el('div','foot');
    f.appendChild(el('span','brandline','Nextra Consulting'));
    f.appendChild(el('span',null,(i+1)+' / '+S.length));
    sec.appendChild(f);
    deck.appendChild(sec);
  });
}
render();
</script>
</body>
</html>
