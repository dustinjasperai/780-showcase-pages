<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Full Time Filmmaker: The 10 Revenue Streams Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Palette derived from fulltimefilmmaker.com brand probe:
     dark scheme ground, brand red #c50000 accent, Bebas Neue + DM Sans.
     Thesis: a filmmaker's masterclass should read like a film title sequence. */
  :root{
    --bg:#0a0a0a;        /* near-black cinema ground (their dark scheme + #000 footer) */
    --panel:#161e2a;     /* their heading navy */
    --rule:#2a2f3a;      /* muted from panel */
    --accent:#c50000;    /* their exact brand red (8 uses) */
    --ink:#f2f2f2;       /* their white-on-dark text */
    --muted:#9aa1ac;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    position:relative;background:linear-gradient(180deg,#0e0e0e 0%,#0a0a0a 100%);
    border:1px solid var(--rule);border-radius:10px;padding:56px 60px;margin:0 0 26px;
    min-height:430px;display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .rec{position:absolute;top:26px;right:30px;display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase}
  .rec .dot{width:10px;height:10px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(197,0,0,.18)}
  .eyebrow{font-family:"DM Sans";font-weight:700;letter-spacing:.22em;text-transform:uppercase;font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:"Bebas Neue";font-weight:400;font-size:78px;line-height:.98;letter-spacing:.01em;text-transform:uppercase}
  h2{font-family:"Bebas Neue";font-weight:400;font-size:52px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase;margin-bottom:20px}
  .lede{font-size:22px;line-height:1.5;color:var(--ink);max-width:40ch}
  .sub{font-size:19px;line-height:1.6;color:var(--muted);margin-top:16px;max-width:52ch}
  p.body{font-size:18px;line-height:1.65;color:var(--ink);max-width:56ch;margin-top:10px}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;background:var(--accent);border-radius:2px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px 34px;margin-top:22px}
  .num{font-family:"Bebas Neue";font-size:40px;color:var(--accent);line-height:1}
  .step{display:flex;gap:16px;align-items:flex-start}
  .step .t{font-size:17px;line-height:1.5}
  .step .t b{font-weight:700}
  .footer-note{font-size:13px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:64ch}
  .big-list{display:grid;grid-template-columns:1fr 1fr;gap:12px 30px;margin-top:20px}
  .big-list .row{display:flex;gap:12px;align-items:baseline;font-size:17px}
  .big-list .row span{font-family:"Bebas Neue";color:var(--accent);font-size:26px;min-width:30px}
  .kicker{font-size:16px;color:var(--muted);margin-top:24px}
  .cta-steps{display:grid;gap:14px;margin-top:24px;max-width:48ch}
  .tag{display:inline-block;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;margin-bottom:22px}
  .disc{font-size:12.5px;color:var(--muted);line-height:1.55;margin-top:22px;max-width:70ch;border-top:1px solid var(--rule);padding-top:16px}
  .progress{position:absolute;bottom:20px;left:60px;font-size:12px;color:var(--muted);letter-spacing:.12em}
  .brandmark{position:absolute;bottom:20px;right:30px;font-family:"Bebas Neue";font-size:16px;letter-spacing:.14em;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    eyebrow:'A Full Time Filmmaker Masterclass',
    h1:'How I Turned A $500 Camera Into A Full-Time Income',
    lede:'The 10 revenue streams that take you from shooting for free to making a real living behind the lens.',
    sub:'Presented by Parker Walbeck, Full Time Filmmaker' },

  {t:'agenda',
    eyebrow:'What we’ll cover',
    h2:'From free gigs to a full-time income',
    list:['Why talented shooters stay broke','The 10 Sources of Revenue',
          'The Free to Fee strategy that lands big clients','The 6-step path to $100k a year'],
    kicker:'Four parts, one outcome: income that does not depend on any single client.' },

  {t:'for',
    eyebrow:'Who this is for',
    h2:'If you can shoot, but you can’t yet pay rent with it',
    body:'This is for the self-taught shooter, the weekend videographer, the side-hustle editor. You’ve got the eye. Your footage looks good. And yet the money is thin, unpredictable, and tied to whoever happens to email you this month.',
    kicker:'The gap is not your camera. It is how the work gets paid for.' },

  {t:'trap',
    eyebrow:'The trap',
    h2:'One skill, one client type, one income stream',
    body:'Most creators chase better gear and better color grades, then wonder why they’re still broke. The problem is structural: a single stream of income (a few wedding gigs, one steady client) means one cancellation puts you back at zero.',
    kicker:'Better footage does not fix a one-stream income. More streams do.' },

  {t:'reframe',
    eyebrow:'The reframe',
    h2:'Stop selling your time. Start building streams.',
    body:'A full-time filmmaker is not someone with the best camera. It is someone whose income comes from several directions at once, so no single slow month can sink them. That is a decision about structure, and it is learnable.' },

  {t:'part', tag:'Part One', h2:'Why most talented shooters stay broke',
    body:'Talent is common. A diversified income is rare. The creators who go full-time are almost never the most technically gifted. They are the ones who treated their skill like a set of assets to be monetized in more than one way.' },

  {t:'problem',
    eyebrow:'The real problem',
    h2:'Feast, famine, repeat',
    list:['You land a gig, go heads-down for three weeks, and forget to line up the next one.',
          'Your rate is capped by the hours in your day.',
          'You own no asset that earns while you sleep.',
          'One client leaving = a crisis, not a Tuesday.'],
    kicker:'Every one of these is a structure problem, not a talent problem.' },

  {t:'myth',
    eyebrow:'The myth',
    h2:'The "big break" is not coming to save you',
    body:'Waiting to be discovered is the most expensive habit in this field. Nobody hands a creator a career. The ones who make it manufacture their own breaks by putting the right work in front of the exact people they want to hire them.' },

  {t:'part', tag:'Part Two', h2:'The 10 Sources of Revenue',
    body:'This is the core of what I teach. Ten distinct ways a filmmaker can get paid. You do not need all ten. You need three or four working at once so your income stops depending on any single one.' },

  {t:'tenlist',
    eyebrow:'The framework',
    h2:'Ten ways to get paid behind a camera',
    rows:[['01','Client & brand video work'],['02','Weddings & events'],
          ['03','Real estate & commercial'],['04','YouTube & ad revenue'],
          ['05','Brand deals & sponsorships'],['06','Stock footage & presets'],
          ['07','Digital products & courses'],['08','Affiliate & gear commissions'],
          ['09','Live & recurring retainers'],['10','Teaching & coaching']],
    kicker:'Pick three to start. Stack the rest over time.' },

  {t:'choose',
    eyebrow:'How to start',
    h2:'You only need three',
    body:'Trying to run all ten at once is how people burn out. Pick one client-work stream for cash now, one content stream for reach, and one product stream for leverage. Those three cover today, tomorrow and the long game.',
    kicker:'Cash now. Reach next. Leverage last.' },

  {t:'freetofee',
    eyebrow:'The signature move',
    h2:'The "Free to Fee" strategy',
    body:'The move that landed me LG and Hyundai as clients. You do not cold-pitch a dream brand with a rate card. You create one piece of undeniable spec work aimed straight at them, give it away, and let the quality open the door that a pitch never could.',
    list:['Choose the client you actually want, not the one you can get.',
          'Make the sample as if you were already hired.',
          'Deliver it free, then convert the relationship to a fee.'] },

  {t:'example',
    eyebrow:'Free to Fee in practice',
    h2:'One sample opened a door a pitch never would',
    body:'I did not win brand work by emailing rate cards. I made spec pieces good enough that the brand could already picture me on their next shoot, handed them over, and let the work start the conversation. That is how relationships with names like LG and Hyundai began.' },

  {t:'steps',
    eyebrow:'The business engine',
    h2:'6 steps to $100k a year',
    steps:[['1','Pick your first 3 revenue streams and name a number.'],
           ['2','Build a portfolio piece for each stream.'],
           ['3','Price for profit, not for approval.'],
           ['4','Use Free to Fee to land one anchor client.'],
           ['5','Add a product that earns without your hours.'],
           ['6','Reinvest into reach so leads come to you.']] },

  {t:'part', tag:'Part Three', h2:'The month a lost client stops being a crisis',
    body:'When the structure is right, a slow month is an inconvenience instead of an emergency. Your calendar has client work, your channel pays you back, and a product sells while you sleep. That is what "full-time" actually means.' },

  {t:'picture',
    eyebrow:'The after state',
    h2:'Three streams on, one day off',
    list:['A steady anchor client from a Free-to-Fee sample.',
          'A YouTube presence that feeds inbound leads.',
          'A digital product earning in the background.',
          'A rate you set, because you no longer need every "yes".'],
    kicker:'Not a bigger camera. A sturdier income.' },

  {t:'why',
    eyebrow:'Why learn this from me',
    h2:'I built this the hard way, on purpose',
    body:'I started with a $500 camera and dropped out of film school. Over the last several years I’ve filmed in 20+ countries for brands like Canon, LG and Hyundai, grown a channel past 1.7 million subscribers, and generated over $15 million with these exact revenue streams. Everything in this session is what I actually did, not theory.' },

  {t:'roadmap',
    eyebrow:'The first 90 days',
    h2:'What changes when the structure is right',
    list:['Weeks 1 to 3: choose your three streams and build one portfolio piece for each.',
          'Weeks 4 to 8: price for profit and land one anchor client with Free to Fee.',
          'Weeks 9 to 12: publish consistently so leads start coming to you.'],
    kicker:'Ninety days of structure beats five years of waiting for a break.' },

  {t:'cta',
    eyebrow:'Start your full-time income',
    h2:'Build your full-time income inside Full Time Filmmaker',
    body:'If you want the full playbook: all 25+ workshops, 800+ lessons, the Video Business curriculum, and the community. The Premium Lifetime Membership is the next step. One payment, lifetime access, every workshop included.',
    cta:'Join Full Time Filmmaker at fulltimefilmmaker.com',
    disc:'Educational content only. Results are not typical or guaranteed and depend on your effort, skill, market and many factors outside anyone’s control. The incomes and client outcomes described are personal and illustrative, not a promise of your results. Nothing here is financial advice.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide';
  let inner = `<div class="rec"><span class="dot"></span>Rec</div>`;
  if(s.tag) inner += `<span class="tag">${s.tag}</span>`;
  if(s.eyebrow) inner += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.h1) inner += `<h1>${s.h1}</h1>`;
  if(s.h2) inner += `<h2>${s.h2}</h2>`;
  if(s.lede) inner += `<div class="lede">${s.lede}</div>`;
  if(s.sub) inner += `<div class="sub">${s.sub}</div>`;
  if(s.body) inner += `<p class="body">${s.body}</p>`;
  if(s.list){ inner += '<ul>'; s.list.forEach(x=> inner += `<li>${x}</li>`); inner += '</ul>'; }
  if(s.rows){ inner += '<div class="big-list">'; s.rows.forEach(r=> inner += `<div class="row"><span>${r[0]}</span>${r[1]}</div>`); inner += '</div>'; }
  if(s.steps){ inner += '<div class="cta-steps">'; s.steps.forEach(r=> inner += `<div class="step"><div class="num">${r[0]}</div><div class="t">${r[1]}</div></div>`); inner += '</div>'; }
  if(s.cta) inner += `<div class="kicker" style="color:var(--accent);font-weight:700;margin-top:26px">${s.cta}</div>`;
  if(s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if(s.disc) inner += `<div class="disc">${s.disc}</div>`;
  inner += `<div class="progress">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  inner += `<div class="brandmark">Full Time Filmmaker</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
