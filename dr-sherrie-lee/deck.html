<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Diasporic Advantage — a masterclass with Dr Sherrie Lee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9f2f1; --panel:#ffffff; --rule:#2d3748; --ink:#22181c;
    --muted:#4a5568; --accent:#008080; --deep:#005f5f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Mulish",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .wrap{max-width:900px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid #e4e9ee;border-radius:14px;padding:44px 46px;margin:0 0 22px;min-height:360px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--accent)}
  .kick{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:16px}
  h1{font-family:"Lora",Georgia,serif;font-weight:700;font-size:40px;line-height:1.14;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:"Lora",Georgia,serif;font-weight:600;font-size:29px;line-height:1.2;color:var(--ink);margin-bottom:14px}
  p{font-size:18px;color:var(--muted);margin-top:14px;max-width:62ch}
  .lead{font-size:21px;color:var(--ink)}
  .big{font-family:"Lora",Georgia,serif;font-style:italic;font-weight:500;font-size:30px;line-height:1.32;color:var(--ink)}
  ul{margin:18px 0 0 2px;list-style:none}
  li{font-size:18px;color:var(--ink);padding:11px 0 11px 30px;position:relative;border-top:1px solid #eef2f5}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:16px;margin-top:3px}
  .part .num{font-family:"Lora",Georgia,serif;font-size:15px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:10px}
  .title h1{font-size:50px}
  .title .sub{font-size:20px;color:var(--muted);margin-top:20px}
  .title .by{margin-top:30px;font-size:16px;color:var(--ink);font-weight:600}
  .title .by span{display:block;color:var(--muted);font-weight:400;font-size:15px;margin-top:3px}
  .cta{background:var(--deep);border-color:var(--deep)}
  .cta::before{background:#9fd6d6}
  .cta h2,.cta h1{color:#ffffff}
  .cta p{color:#d6e7e7}
  .cta .step{color:#ffffff;font-size:20px;font-weight:600;margin-top:18px}
  .disc{margin-top:26px;font-size:13px;color:#bcd6d6;max-width:66ch}
  .accent{color:var(--accent)}
  .strike{text-decoration:line-through;text-decoration-color:var(--muted);color:var(--muted)}
  .snum{position:absolute;right:20px;bottom:14px;font-size:12px;color:#aab4bd}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`<div class="kick">A live masterclass</div><h1>The Diasporic Advantage</h1><div class="sub">How internationally mobile professionals land the right role in a new country, without starting over.</div><div class="by">Dr Sherrie Lee<span>Career coach and educator, The Diasporic Academic</span></div>`},
  {t:'who', cls:'who', html:`<div class="kick">Who this is for</div><h2>You have done everything right, and it still is not landing</h2><p>You moved countries with real experience behind you. A degree, a track record, results. Yet the applications go quiet, and the roles you would have walked into back home feel out of reach here.</p>`},
  {t:'trap', cls:'trap', html:`<div class="kick">The trap</div><h2>So you apply harder</h2><p>More applications. A sharper CV. Another course to fill the gap on paper. The logic feels right: do more of what worked before, and eventually the system will recognise you.</p><p class="lead">It rarely does. And it is not because you are not good enough.</p>`},
  {t:'hook', cls:'hook', html:`<div class="kick">The reframe</div><div class="big">You do not need to start over. You need a bridge into a system that cannot yet read your value.</div>`},
  {t:'part', cls:'part', html:`<div class="num">Part One</div><h2>Why qualifications stall and people move</h2><p>The first thing to understand is where opportunity actually travels in a new country, and why the front door you are knocking on is the wrong one.</p>`},
  {t:'content', cls:'content', html:`<h2>The system cannot read your CV yet</h2><p>Hiring in an unfamiliar market runs on signals it already trusts: local references, familiar employers, a known face vouching for you. Your overseas credentials are real, but to a stranger reviewing a pile of applications, they do not yet carry that signal.</p>`},
  {t:'content', cls:'content', html:`<h2>The roles you want are rarely posted</h2><p>A large share of good roles are filled before they are ever listed, through conversations and referrals. If your whole strategy is the public job board, you are competing hardest for the smallest, most crowded slice of the market.</p>`},
  {t:'content', cls:'content', html:`<div class="kick">The research behind this</div><h2>Knowledge moves between people, not systems</h2><p>My doctoral work studied how internationally mobile people exchange and translate knowledge across cultures, what I call knowledge brokering. The people who settle well are not the most qualified. They are the ones who find the right connections and learn how the new system really works.</p>`},
  {t:'part', cls:'part', html:`<div class="num">Part Two</div><h2>The method</h2><p>Four moves that build the bridge, in the order that actually works when you are starting with no local network.</p>`},
  {t:'content', cls:'content', html:`<h2>1. Build on weak ties, not just close ones</h2><p>Your closest contacts know what you know. It is the acquaintances, the former colleagues, the people one step removed, who open doors into rooms you cannot see. A deliberate practice of reconnecting and asking is the single highest-return habit in a job search abroad.</p>`},
  {t:'content', cls:'content', html:`<h2>2. Make your own luck, on purpose</h2><p>Careers move through planned happenstance: turning unplanned conversations into opportunities. Three habits make it repeatable.</p><ul><li><b>Prepare for action</b><span>Say yes before you feel fully ready. Use small deadlines to move.</span></li><li><b>Overcome the barrier</b><span>A no leaves you no worse off than silence. Reach out anyway.</span></li><li><b>Take action</b><span>Build relationships every week, not just when you need something.</span></li></ul>`},
  {t:'content', cls:'content', html:`<h2>3. Lead from your strengths, not your gaps</h2><p>Most newcomers spend their energy apologising for what is missing. The faster path is to name your character strengths and build your story, your outreach, and your interviews around them. People hire a clear, confident fit, not a list of caveats.</p>`},
  {t:'content', cls:'content', html:`<h2>4. Relationships grounded in care</h2><p>I coach from manaakitanga, a principle of trust, care, and mutual respect. Networking is not extraction. When you approach people with genuine curiosity and give before you ask, the connections hold, and they carry you further than any single application.</p>`},
  {t:'part', cls:'part', html:`<div class="num">Part Three</div><h2>A different shape to your next ninety days</h2><p>Not a vague promise. Here is what changes when the method is working.</p>`},
  {t:'content', cls:'content', html:`<h2>Ninety days from now</h2><p>You are having real conversations each week with people inside the industry you want. Your CV and LinkedIn speak in the signals this market trusts. You are being introduced, not just applying. The roles that were invisible are now the ones you are discussing over coffee.</p>`},
  {t:'content', cls:'content', html:`<div class="kick">Why me</div><h2>I have crossed this bridge, and studied it</h2><p>I am an Asian professional who built a career across Singapore and New Zealand, and I hold a PhD on how internationally mobile people build networks and identity across cultures. I am a Certified Career Services Provider and an ICF-trained coach. I coach the exact crossing I have made myself.</p>`},
  {t:'content', cls:'content', html:`<h2>Your move today</h2><p>If this is the way you have been looking for work in a new country, a small shift in method changes what becomes possible. The next step is a conversation about where you are and what the bridge looks like for you.</p>`},
  {t:'cta', cls:'cta', html:`<div class="kick">Your next step</div><h1>Let us map your bridge</h1><p>Book a free, no-obligation conversation with me and we will look at your situation and your next move together.</p><div class="step">Book a call at thediasporicacademic.com</div><div class="disc">Educational content only. Every career is different and no income, role, interview, or result is guaranteed. Outcomes vary with your field, market, and effort.</div>`}
];
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html + '<div class="snum">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
</script>
</body>
</html>
