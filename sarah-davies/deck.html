<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Be In Demand — The 5 Phases to Consistent Clients | Sweet Spot Business Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=League+Spartan:wght@500;600;700&family=Lato:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a264c;
    --panel:#223056;
    --rule:#35406a;
    --ink:#f4f1ea;
    --muted:#aeb6cc;
    --accent:#339999;
    --accent-lt:#5fc9c4;
    --gold:#b59d63;
    --head:'League Spartan',system-ui,sans-serif;
    --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:60px 56px;
    margin:0 0 26px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
    box-shadow:0 10px 30px rgba(0,0,0,.18);
  }
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:13px;color:var(--accent-lt);margin-bottom:20px}
  h1{font-family:var(--head);font-weight:700;font-size:62px;line-height:1.02;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:42px;line-height:1.08;letter-spacing:-.01em;margin-bottom:16px}
  .lead{font-size:23px;color:var(--muted);max-width:46ch}
  .big{font-size:31px;line-height:1.3;max-width:34ch}
  .big b{color:var(--accent-lt);font-weight:700}
  p.body{font-size:20px;color:var(--muted);max-width:52ch;margin-top:10px}
  ul{list-style:none;margin-top:14px}
  ul li{font-size:21px;padding:14px 0 14px 40px;border-top:1px solid var(--rule);position:relative}
  ul li:first-child{border-top:none}
  ul li:before{content:"";position:absolute;left:4px;top:22px;width:14px;height:14px;border-radius:50%;border:3px solid var(--accent);}
  .phase-num{font-family:var(--head);font-weight:700;font-size:20px;color:var(--gold);letter-spacing:.08em;margin-bottom:10px}
  .target{position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;border:2px solid var(--rule);}
  .target:after{content:"";position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:120px;height:120px;border-radius:50%;border:2px solid var(--rule);}
  .dot{position:absolute;right:30px;top:30px;width:18px;height:18px;border-radius:50%;background:var(--accent)}
  .part{background:linear-gradient(150deg,#101a3a,#0c1430);border-color:var(--gold)}
  .part .kicker{color:var(--gold)}
  .part h2{color:#fff;font-size:46px}
  .part .lead{color:#cdd3e0}
  .cta{background:linear-gradient(160deg,#20405f,#1a264c);border-color:var(--accent)}
  .cta h2{color:#fff}
  .cta .btn{display:inline-block;margin-top:22px;font-family:var(--head);font-weight:600;letter-spacing:.04em;font-size:18px;color:#08211f;background:var(--accent-lt);padding:16px 30px;border-radius:999px}
  .disc{font-size:13px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
  .recap{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:18px}
  .recap div{border:1px solid var(--rule);border-radius:12px;padding:16px 18px;font-size:17px}
  .recap div b{font-family:var(--head);color:var(--accent-lt)}
  .foot{position:absolute;left:56px;bottom:22px;font-family:var(--head);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', html:`<div class="target"></div><div class="kicker">Sweet Spot Business Coaching &middot; Live Webclass</div><h1>Be In Demand</h1><div class="big">The 5 phases to consistent clients, in the order most experts are never taught.</div><div class="foot">Sarah Davies</div>`},
  {t:'promise', html:`<div class="dot"></div><div class="kicker">What you will leave with</div><h2>A clear roadmap, not more tactics</h2><p class="body">By the end of this class you will know the exact sequence to move from best kept secret to in demand, so clients come to you instead of the other way around.</p>`},
  {t:'who', html:`<div class="kicker">Who this is for</div><h2>Brilliant at the work. Tired of feast or famine.</h2><p class="body">For coaches and consultants who are excellent at what they do, yet whose income still rides on referrals, luck and the next hustle.</p>`},
  {t:'trap', html:`<div class="dot"></div><div class="kicker">Sound familiar</div><div class="big">You have tried everything. Posting on social. Networking. Waiting on referrals. It feels scattered, and it is exhausting.</div>`},
  {t:'hook', html:`<div class="target"></div><div class="kicker">The real reason</div><div class="big">It was never a talent gap. It is that nobody taught you client acquisition in the <b>right order</b>.</div>`},
  {t:'part', cls:'part', html:`<div class="kicker">Part One</div><h2>Why experts stay invisible</h2><p class="lead">The three quiet mistakes that keep good consultants the best kept secret in town.</p>`},
  {t:'mistakes', html:`<div class="kicker">The three mistakes</div><h2>What keeps you stuck</h2><ul><li>Leading with what you do instead of the value a client instantly sees</li><li>Chasing tactics with no order, so effort scatters and nothing compounds</li><li>Pricing your time instead of the outcome, which caps income at your calendar</li></ul>`},
  {t:'cost', html:`<div class="dot"></div><div class="kicker">The cost of waiting</div><div class="big">Income capped by hours. A ticking clock back to a J.O.B. you left for a reason.</div>`},
  {t:'reframe', html:`<div class="kicker">The shift</div><div class="big">Demand is <b>built</b>, not wished for. And it is built in a sequence you can repeat.</div>`},
  {t:'part', cls:'part', html:`<div class="kicker">Part Two</div><h2>The 5 phases to consistent demand</h2><p class="lead">The sweet spot is where your expertise meets a market that is actively looking for it. Here is how you get there.</p>`},
  {t:'p1', html:`<div class="phase-num">Phase 1</div><h2>Position so the value is obvious</h2><p class="body">Move from describing your service to naming the outcome a client cares about, so the right people recognise themselves in seconds.</p>`},
  {t:'p2', html:`<div class="phase-num">Phase 2</div><h2>Validate and get proof it works</h2><p class="body">Test the offer in the real market and collect early proof, so you build on evidence instead of guessing. Most of my clients see this within the first few weeks.</p>`},
  {t:'p3', html:`<div class="phase-num">Phase 3</div><h2>Attract and convert ideal clients</h2><p class="body">Put a simple, values aligned way in front of the right people and turn attention into conversations, without feeling salesy.</p>`},
  {t:'p4', html:`<div class="phase-num">Phase 4</div><h2>Build a repeatable system</h2><p class="body">Turn what worked into a system you can run on purpose, so new clients arrive by design rather than by luck.</p>`},
  {t:'p5', html:`<div class="phase-num">Phase 5</div><h2>Earn beyond the hourly rate</h2><p class="body">With demand that repeats, income is no longer capped by the hours in your week. That is the sweet spot.</p>`},
  {t:'values', html:`<div class="target"></div><div class="kicker">The lens that holds it together</div><h2>Build a business aligned with who you are</h2><p class="body">Connection, Energy, Integrity, Happiness, Intentionality, Nourishment. Your values become the filter for your offers, pricing and marketing, so growth feels proactive instead of reactive.</p>`},
  {t:'part', cls:'part', html:`<div class="kicker">Part Three</div><h2>Fewer, better clients, on your terms</h2><p class="lead">A calendar you choose. Work you are proud of. Income that no longer rides on your next hustle.</p>`},
  {t:'why', html:`<div class="kicker">Why listen to me</div><h2>I am Sarah Davies</h2><p class="body">Twenty five years in business, and a coach to coaches and consultants. This is the same roadmap my clients have used to build real, repeatable demand, in their own voice and on their own values.</p>`},
  {t:'recap', html:`<div class="kicker">The roadmap in one view</div><h2>The 5 phases</h2><div class="recap"><div><b>1.</b> Position for obvious value</div><div><b>2.</b> Validate and get proof</div><div><b>3.</b> Attract and convert</div><div><b>4.</b> Build a repeatable system</div><div><b>5.</b> Earn beyond the hourly rate</div><div><b>&middot;</b> Aligned with your values</div></div>`},
  {t:'cta', cls:'cta', html:`<div class="kicker">Your next step</div><h2>Ready to be in demand?</h2><p class="body">If you want help walking these phases in your own business, the next step is to join me inside Beyond the Hourly Rate, where we do this together over the coming months.</p><span class="btn">Join Beyond the Hourly Rate</span><div class="disc">This class is educational. It shares an approach and a roadmap, not a promise of earnings. No income, role, or result is guaranteed, and results vary by person, market and effort. Examples reflect individual experiences and are not typical or promised.</div>`}
];
const deck=document.getElementById('deck');
S.forEach(s=>{const el=document.createElement('section');el.className='slide'+(s.cls?' '+s.cls:'');el.innerHTML=s.html;deck.appendChild(el);});
</script>
</body>
</html>
