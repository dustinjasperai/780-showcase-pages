<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Exact Words | A Masterclass with Julie Fragnito, MS Ed.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,500&family=Nunito+Sans:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#FBF7F1;        /* warm cream ground (dominant) */
    --panel:#F1E8DA;     /* soft sand */
    --ink:#2E2A26;       /* deep warm charcoal */
    --muted:#6E655C;     /* warm grey */
    --rule:#E3D7C4;      /* sand rule */
    --accent:#C0613B;    /* grounded clay (single accent) */
    --accent-soft:#F3E2D6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:"Nunito Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 64px}
  .slide{
    background:var(--bg);border-radius:14px;margin:0 0 22px;padding:60px 56px;
    min-height:540px;display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;box-shadow:0 1px 0 rgba(0,0,0,.25);
  }
  .kicker{font-family:"Bitter",serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:20px}
  h1{font-family:"Bitter",serif;font-weight:700;font-size:54px;line-height:1.04;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"Bitter",serif;font-weight:700;font-size:38px;line-height:1.1;margin-bottom:18px}
  h3{font-family:"Bitter",serif;font-weight:600;font-size:24px;line-height:1.2;margin-bottom:10px}
  p{font-size:21px;line-height:1.55;color:var(--ink);max-width:42ch;margin-bottom:14px}
  p.lead{font-size:24px;color:var(--muted);max-width:40ch}
  .sub{font-size:19px;color:var(--muted);max-width:44ch}
  .by{margin-top:30px;font-size:18px;color:var(--muted)}
  .by b{color:var(--ink);font-weight:700}
  ul{list-style:none;margin:10px 0 0;max-width:46ch}
  li{position:relative;padding-left:30px;margin-bottom:16px;font-size:20px;line-height:1.5}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .pillar{background:var(--panel);border-left:5px solid var(--accent);border-radius:8px;padding:24px 26px;margin-top:14px;max-width:46ch}
  .script{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:26px 28px;margin-top:10px;max-width:48ch}
  .script .moment{font-size:16px;letter-spacing:.04em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:12px;font-family:"Bitter",serif}
  .script .line{font-family:"Bitter",serif;font-style:italic;font-weight:500;font-size:25px;line-height:1.35;color:var(--ink)}
  .num{font-family:"Bitter",serif;font-size:15px;color:var(--muted);position:absolute;top:26px;right:34px;letter-spacing:.1em}
  .part{display:inline-block;background:var(--accent);color:var(--bg);font-family:"Bitter",serif;font-weight:700;
    font-size:14px;letter-spacing:.12em;text-transform:uppercase;padding:7px 14px;border-radius:30px;margin-bottom:22px}
  .cta{background:var(--panel)}
  .cta .btn{display:inline-block;margin-top:14px;background:var(--accent);color:var(--bg);font-family:"Bitter",serif;
    font-weight:700;font-size:20px;padding:15px 30px;border-radius:40px}
  .disc{margin-top:30px;font-size:14px;color:var(--muted);max-width:52ch;line-height:1.5}
  .cols{display:flex;gap:26px;flex-wrap:wrap}
  .cols .pillar{flex:1;min-width:280px}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:460px}h1{font-size:38px}h2{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:"A Live Masterclass",
    h1:"The Exact Words",
    lead:"How to hold a boundary with warmth, in the moment that actually counts.",
    by:"with <b>Julie Fragnito, MS Ed.</b> &middot; Transforming Parenthood" },

  {t:'who',
    kicker:"Who this is for",
    h2:"For the parent caught between strict and gentle.",
    sub:"If your kids are somewhere between 1 and 16 and you keep bouncing between coming down hard and letting it slide, this hour is for you." },

  {t:'trap',
    kicker:"The moment you know",
    h2:"You've read the books. In the moment, the words still vanish.",
    p:"It is 6pm. The tantrum is on the floor, the sibling is crying, someone just yelled \"I hate you.\" You know you are supposed to stay calm. What you do not have is the line to actually say." },

  {t:'reframe',
    kicker:"The real problem",
    h2:"It was never your patience.",
    p:"Good parents lose it in these moments all the time. Not because they lack love or self-control, but because nobody ever handed them the words that are firm and warm at the same time. You cannot improvise a script you were never given." },

  {t:'part', part:"Part One", h2:"Behavior is only the tip.",
    sub:"Why reacting to what you see keeps the same moment on repeat." },

  {t:'list',
    kicker:"Under the surface",
    h2:"Every hard behavior is a need in disguise.",
    items:[
      "The lying is usually fear of your reaction, not a love of lying.",
      "The hitting is a feeling that got bigger than the words for it.",
      "The \"I hate you\" is \"I am overwhelmed and I need you to stay.\"" ] },

  {t:'list',
    kicker:"Why the usual advice breaks",
    h2:"Strict alone and gentle alone both fail.",
    items:[
      "Strict only: the behavior stops for today, and the connection quietly erodes.",
      "Gentle only: your child feels loved, and the boundary never actually holds.",
      "Kids need both at once. That is the whole method." ] },

  {t:'part', part:"Part Two", h2:"High Structure, High Nurture.",
    sub:"The method, and the shape of every script that comes out of it." },

  {t:'pillars',
    kicker:"The two pillars",
    h2:"Two things, held at the same time.",
    pillars:[
      { h:"High Structure", p:"The boundary is clear, calm, and it holds every single time. Your child always knows where the line is." },
      { h:"High Nurture", p:"Your child stays connected to you through the limit. The relationship is never the price of the rule." } ] },

  {t:'framework',
    kicker:"Where the words come from",
    h2:"Put the two together and you get a script.",
    p:"A High Structure, High Nurture script says the firm thing and the warm thing in one breath. Once you can hear the shape, you can build the line for any moment yourself." },

  {t:'list',
    kicker:"The anatomy of a script",
    h2:"Three moves, every time.",
    items:[
      "Name the feeling, so your child feels seen.",
      "Hold the line, plainly, with no lecture attached.",
      "Offer the next step, so there is a way forward." ] },

  {t:'script',
    kicker:"Script 1",
    h2:"The meltdown over cleanup.",
    moment:"\"I'm NOT cleaning it up.\"",
    line:"\"You're allowed to be mad. The toys still get picked up. I'll start with you.\"" },

  {t:'script',
    kicker:"Script 2",
    h2:"The sibling fight.",
    moment:"Two kids, one toy, full volume",
    line:"\"You both want it and you're both upset. The hitting stops now. Let's figure out the turns together.\"" },

  {t:'script',
    kicker:"Script 3",
    h2:"The words that sting.",
    moment:"\"I hate you!\"",
    line:"\"You're really angry at me right now, and I can handle that. I'm not going anywhere.\"" },

  {t:'part', part:"Part Three", h2:"What home feels like in 30 days.",
    sub:"The same house, a different weather system." },

  {t:'list',
    kicker:"The shift",
    h2:"Fewer standoffs. Lines that stick. Connection intact.",
    items:[
      "You reach for a script instead of freezing or yelling.",
      "Boundaries hold without the week-long cold war afterward.",
      "Your child pushes, and still trusts you to hold the edge." ] },

  {t:'why',
    kicker:"Why learn this from me",
    h2:"I have spent years in these exact moments.",
    items:[
      "Julie Fragnito, MS Ed., certified parent coach and educator.",
      "Host of The Parent Coaching Chair, live coaching on one real moment at a time.",
      "Founder of the School of Transforming Parenthood, with 760k+ parents following along." ] },

  {t:'cta',
    kicker:"Your next step",
    h2:"Ready to have the words when it counts?",
    p:"In the live masterclass I walk you through the High Structure, High Nurture method and the scripts for your hardest moments, so you can use them tonight.",
    btn:"Join the live masterclass",
    disc:"This masterclass is for educational purposes only and is not a substitute for medical, psychological, or professional advice. No specific result is guaranteed. Results vary from child to child and family to family." }
];

const deck = document.getElementById("deck");
function esc(x){return x||"";}
S.forEach((s,i)=>{
  const el=document.createElement("section");
  el.className="slide "+(s.t==="cta"?"cta":"");
  let inner = `<span class="num">${String(i+1).padStart(2,"0")} / ${String(S.length).padStart(2,"0")}</span>`;
  if(s.part) inner += `<span class="part">${s.part}</span>`;
  if(s.kicker) inner += `<div class="kicker">${s.kicker}</div>`;
  if(s.h1) inner += `<h1>${s.h1}</h1>`;
  if(s.h2) inner += `<h2>${s.h2}</h2>`;
  if(s.lead) inner += `<p class="lead">${s.lead}</p>`;
  if(s.p) inner += `<p>${s.p}</p>`;
  if(s.sub) inner += `<p class="sub">${s.sub}</p>`;
  if(s.pillars){ inner += `<div class="cols">`; s.pillars.forEach(p=> inner += `<div class="pillar"><h3>${p.h}</h3><p style="font-size:18px;margin:0;color:var(--muted)">${p.p}</p></div>`); inner += `</div>`; }
  if(s.items){ inner += `<ul>`; s.items.forEach(it=> inner += `<li>${it}</li>`); inner += `</ul>`; }
  if(s.moment||s.line){ inner += `<div class="script">${s.moment?`<div class="moment">${s.moment}</div>`:""}${s.line?`<div class="line">${s.line}</div>`:""}</div>`; }
  if(s.btn) inner += `<div><span class="btn">${s.btn}</span></div>`;
  if(s.by) inner += `<div class="by">${s.by}</div>`;
  if(s.disc) inner += `<div class="disc">${s.disc}</div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
