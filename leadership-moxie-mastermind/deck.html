<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build Your Powerful, Positive Legacy — a Lead With Moxie masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf4ef;        /* harvested warm cream ground (brand.json) */
    --panel:#ffffff;
    --ink:#0a0a0a;       /* harvested near-black (brand.json) */
    --muted:#4a4a4a;
    --rule:#e3d8cf;
    --accent:#008fff;    /* harvested brand azure, 22 uses (brand.json) */
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Source Sans 3',Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 9vw;border-bottom:1px solid var(--rule);position:relative}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:.82rem;color:var(--accent);margin-bottom:1.4rem}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.6rem,6.2vw,4.8rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.1}
  .lead{font-size:clamp(1.15rem,2.1vw,1.5rem);color:var(--muted);margin-top:1.6rem;max-width:40ch}
  .big{font-size:clamp(1.5rem,2.6vw,2rem);margin-top:1.6rem;max-width:34ch;font-weight:500}
  .throughline{width:64px;height:4px;background:var(--accent);border-radius:2px;margin:0 0 2rem}
  ul{margin-top:1.8rem;list-style:none;max-width:48ch}
  li{position:relative;padding-left:1.6rem;margin-bottom:1rem;font-size:clamp(1.05rem,1.8vw,1.25rem)}
  li::before{content:"";position:absolute;left:0;top:.6em;width:9px;height:9px;background:var(--accent);border-radius:50%}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:1.4rem;margin-top:2rem;max-width:60ch}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:1.6rem}
  .card .k{font-family:var(--serif);font-weight:700;font-size:1.4rem;color:var(--accent)}
  .card p{color:var(--muted);margin-top:.5rem;font-size:1rem}
  .nine{display:grid;grid-template-columns:repeat(3,1fr);gap:.9rem;margin-top:2rem;max-width:52ch}
  .nine span{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:.9rem 1rem;
    font-weight:600;text-align:center}
  .cta-box{background:var(--panel);border:1px solid var(--rule);border-left:5px solid var(--accent);
    border-radius:14px;padding:2.2rem;max-width:46ch;margin-top:2rem}
  .disclaimer{font-size:.8rem;color:var(--muted);margin-top:2.4rem;max-width:52ch}
  .kicker{font-family:var(--sans);font-size:1rem;color:var(--muted);margin-top:1.2rem}
  .num{font-family:var(--serif);font-size:1rem;color:var(--accent);position:absolute;top:4vh;right:9vw;font-weight:700}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A Lead With Moxie masterclass',h:'Build Your Powerful, Positive Legacy',sub:'The Moxie way for women leading growing companies.'},
 {t:'promise',eyebrow:'What this hour gives you',h:'Lead with Clarity, Courage, and Focus.',sub:'And turn your ambition into a plan you will actually execute, starting this quarter.'},
 {t:'for',eyebrow:'Who this is for',h:'The woman who built real success.',sub:'And still cannot get to the work that would matter most. You are not short on ambition. You are short on protected time.'},
 {t:'trap',eyebrow:'The trap',h:'Your calendar belongs to everyone else.',sub:'By 9 a.m. on a normal Tuesday you have already shifted out of strategic mode and into reactive mode. The important work keeps sliding to next week.'},
 {t:'reframe',eyebrow:'The honest reframe',h:'Good intentions do not build a legacy. Structure does.',sub:'The strategic day you blocked and lost was not a willpower problem. It was a structure problem.'},
 {t:'part',eyebrow:'Part one',h:'Why capable leaders stay stuck.'},
 {t:'body',eyebrow:'The reactive current',h:'You are the bottleneck on the decisions that matter.',list:['The priority list you could write in your sleep never gets touched.','There are decisions you have circled for months without landing.','Growth feels impossible with no protected space to think.']},
 {t:'body',eyebrow:'What staying stuck costs',h:'It compounds quietly.',list:['Time you will not get back on the wrong work.','Revenue that waits behind the decision you keep deferring.','Leadership credibility, with your team and with yourself.']},
 {t:'part',eyebrow:'Part two',h:'The Moxie Principles.'},
 {t:'cards',eyebrow:'The framework behind every engagement',h:'Clarity. Courage. Focus.',cards:[['Clarity','Name the few priorities that actually build the business, and why the rest can wait.'],['Courage','Make the deferred decisions and have the hard conversations you have been avoiding.'],['Focus','Protect strategic attention from the reactive current, on purpose, every week.']]},
 {t:'part',eyebrow:'Part two, continued',h:'Building Your Powerful, Positive Legacy.'},
 {t:'nine',eyebrow:'The nine components',h:'One framework, run in 13-week cycles.',nine:['Purpose','Mission','Goals','Action','Boundaries','Structure','Values','Celebration','Motivation']},
 {t:'body',eyebrow:'The Quarterly Legacy Framework',h:'Turn ambition into a plan, four times a year.',list:['Each quarter you convert the nine components into one focused plan.','You leave with owners, timelines, and specific actions, not notes.','You run it again next quarter, so momentum never resets to zero.']},
 {t:'part',eyebrow:'Part three',h:'A week that finally includes your own priorities.'},
 {t:'body',eyebrow:'The shift',h:'From busy to intentional.',list:['One protected block becomes the day that moves the needle.','Your team gets a plan they can act on, not another meeting.','You meet the next threshold with intention, not just momentum.']},
 {t:'why',eyebrow:'Why learn this from me',h:'Heather Legge.',list:['Master-level executive coach, MBA, Extended-DISC licensed, 20+ years guiding founders and leaders.','Author of Lead With Moxie, drawn from interviews with 100+ women running businesses.','Founder of Envision Success Inc, elevating achievers into impactful leaders since 2006.']},
 {t:'recap',eyebrow:'The throughline',h:'Clarity and Courage and Focus, built into a legacy.',sub:'That is the whole method. The principles give you the week. The Legacy framework gives you the year.'},
 {t:'cta',eyebrow:'Your next step',h:'Build your legacy with a room of women doing the same.',sub:'If today gave you one clear priority and the structure to protect it, come do this work with support all year. Apply for your seat in the Leadership Moxie Mastermind.',disc:'Educational only. No specific result is guaranteed. Results vary and depend on effort, preparation, and circumstances.'}
];
const E=(s)=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
let html='';
S.forEach((s,i)=>{
  const num=`<div class="num">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  let inner='';
  if(s.t==='title'){inner=`<div class="eyebrow">${E(s.eyebrow)}</div><div class="throughline"></div><h1>${E(s.h)}</h1><p class="lead">${E(s.sub)}</p>`;}
  else if(s.t==='part'){inner=`<div class="eyebrow">${E(s.eyebrow)}</div><div class="throughline"></div><h1>${E(s.h)}</h1>`;}
  else if(s.t==='cards'){inner=`<div class="eyebrow">${E(s.eyebrow)}</div><h2>${E(s.h)}</h2><div class="grid">`+s.cards.map(c=>`<div class="card"><div class="k">${E(c[0])}</div><p>${E(c[1])}</p></div>`).join('')+`</div>`;}
  else if(s.t==='nine'){inner=`<div class="eyebrow">${E(s.eyebrow)}</div><h2>${E(s.h)}</h2><div class="nine">`+s.nine.map(n=>`<span>${E(n)}</span>`).join('')+`</div>`;}
  else if(s.t==='cta'){inner=`<div class="eyebrow">${E(s.eyebrow)}</div><div class="throughline"></div><h2>${E(s.h)}</h2><div class="cta-box"><p class="big" style="margin-top:0">${E(s.sub)}</p></div><p class="disclaimer">${E(s.disc)}</p>`;}
  else if(s.list){inner=`<div class="eyebrow">${E(s.eyebrow)}</div><h2>${E(s.h)}</h2><ul>`+s.list.map(l=>`<li>${E(l)}</li>`).join('')+`</ul>`;}
  else{inner=`<div class="eyebrow">${E(s.eyebrow)}</div><h2>${E(s.h)}</h2>`+(s.sub?`<p class="big">${E(s.sub)}</p>`:'');}
  html+=`<section class="slide">${num}${inner}</section>`;
});
document.getElementById('deck').innerHTML=html;
</script>
</body>
</html>
