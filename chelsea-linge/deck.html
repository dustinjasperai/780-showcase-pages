<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Capacity Ceiling: a live masterclass with Chelsea Linge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloock&family=Wix+Madefor+Text:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e8; --panel:#ffffff; --edge:#ece4d6; --rule:#b9c4b4;
    --ink:#1c3a2e; --ink-soft:#4a5f54; --deep:#142b21; --accent:#c46a4a;
    --stone:#7a6f5d;
    --head:'Gloock',Georgia,serif; --body:'Wix Madefor Text',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .slide{min-height:100vh;width:100%;scroll-snap-align:start;display:flex;
    flex-direction:column;justify-content:center;padding:9vh 9vw;position:relative;
    border-bottom:1px solid var(--edge)}
  .kicker{font-size:.78rem;letter-spacing:.22em;text-transform:uppercase;
    color:var(--stone);font-weight:600;margin-bottom:1.4rem}
  h1{font-family:var(--head);font-weight:400;font-size:clamp(2.6rem,6.4vw,5rem);
    line-height:1.04;color:var(--ink);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:400;font-size:clamp(2rem,4.6vw,3.3rem);
    line-height:1.08;color:var(--ink);margin-bottom:1.5rem}
  p{font-size:clamp(1.05rem,1.7vw,1.4rem);color:var(--ink-soft);max-width:34ch}
  .lead p{max-width:40ch}
  .big p{font-size:clamp(1.3rem,2.4vw,1.9rem);color:var(--ink);max-width:28ch}
  .accent{color:var(--accent)}
  .capline{height:5px;background:var(--accent);border-radius:3px;margin:2.2rem 0 0;transition:width .3s}
  .promise{margin-top:2.4rem;font-size:1.05rem;color:var(--stone);letter-spacing:.02em}
  ul{list-style:none;margin-top:1.6rem;display:grid;gap:1.05rem;max-width:46ch}
  li{position:relative;padding-left:1.7rem;font-size:clamp(1.02rem,1.6vw,1.3rem);color:var(--ink-soft)}
  li::before{content:"";position:absolute;left:0;top:.62em;width:.7rem;height:.7rem;
    border-radius:2px;background:var(--accent)}
  .stages{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2.4rem;max-width:62rem}
  .stage{background:var(--panel);border:1px solid var(--edge);border-radius:14px;padding:1.4rem 1.2rem}
  .stage .n{font-family:var(--head);font-size:1.5rem;color:var(--accent)}
  .stage h3{font-family:var(--head);font-weight:400;font-size:1.3rem;margin:.5rem 0 .4rem;color:var(--ink)}
  .stage span{font-size:.95rem;color:var(--ink-soft)}
  .tiers{display:grid;gap:1rem;margin-top:2rem;max-width:48rem}
  .tier{display:flex;gap:1.2rem;align-items:baseline;background:var(--panel);
    border:1px solid var(--edge);border-left:5px solid var(--accent);border-radius:10px;padding:1.1rem 1.4rem}
  .tier b{font-family:var(--head);font-weight:400;font-size:1.4rem;color:var(--ink);min-width:5.5rem}
  .tier span{color:var(--ink-soft);font-size:1.05rem}
  .big-quote{font-family:var(--head);font-weight:400;font-size:clamp(2rem,4.4vw,3.4rem);
    line-height:1.12;color:var(--ink);max-width:22ch}
  .panel-dark{background:var(--deep);color:#ede7da}
  .panel-dark .kicker{color:#9db0a2}
  .panel-dark h1,.panel-dark h2{color:#f2ede0}
  .panel-dark p{color:#c9d3c8}
  .why{display:grid;gap:1.1rem;margin-top:1.8rem;max-width:40ch}
  .why p{color:#cdd6cc;max-width:40ch}
  .cta-step{margin-top:2.2rem;display:inline-block;background:var(--accent);color:#fff;
    font-weight:600;padding:.95rem 1.8rem;border-radius:999px;font-size:1.1rem}
  .disc{margin-top:2.6rem;font-size:.86rem;color:#9db0a2;max-width:52ch;line-height:1.5}
  .count{position:absolute;top:3vh;right:5vw;font-size:.76rem;letter-spacing:.14em;color:var(--stone)}
  .panel-dark .count{color:#7d9183}
  @media(max-width:720px){.stages{grid-template-columns:repeat(2,1fr)}
    .tier{flex-direction:column;gap:.3rem}.tier b{min-width:0}}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', cls:'lead', html:`<div class="kicker">A live masterclass with Chelsea Linge · Soleia</div>
    <h1>The Capacity<br>Ceiling</h1>
    <div class="capline" style="width:120px"></div>
    <p class="promise">Why your revenue stalls at the edge of what you can hold, and the four stages that move you past it.</p>`},

  {t:'audience', cls:'', html:`<div class="kicker">Who this is for</div>
    <h2>You built the thing. It worked.</h2>
    <p>You are a founder or agency owner past half a million, maybe well past it. The spreadsheet looks good. And still, the next level feels heavier than the last one, not lighter.</p>`},

  {t:'trap', cls:'big', html:`<div class="kicker">The trap</div>
    <h2>So you buy another tactic.</h2>
    <p>A new funnel. A new hire. A new framework. Each one works for a quarter, then the same ceiling shows up wearing a different number.</p>`},

  {t:'reframe', cls:'panel-dark big', html:`<div class="kicker">The reframe</div>
    <h2>You do not have a tactics problem.</h2>
    <p>You have a capacity problem. The business is asking you to hold more visibility, more rejection, and more worth than the version of you who built it was ever trained to carry.</p>`},

  {t:'part1', cls:'', html:`<div class="kicker">Part one</div>
    <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">The ceiling is you.</h1>
    <div class="capline" style="width:180px"></div>`},

  {t:'levels', cls:'', html:`<div class="kicker">Why more strategy stops working</div>
    <h2>Every level has a different bottleneck.</h2>
    <div class="tiers">
      <div class="tier"><b>$500k</b><span>The bottleneck is the sale. You are still the one closing everything.</span></div>
      <div class="tier"><b>$2M</b><span>The bottleneck is the room. You need other people carrying weight you used to carry alone.</span></div>
      <div class="tier"><b>$5M+</b><span>The bottleneck is you. What you can personally hold becomes the cap on the whole company.</span></div>
    </div>`},

  {t:'core', cls:'big', html:`<div class="kicker">The core problem</div>
    <h2>Tactics do not stick on a nervous system that is bracing.</h2>
    <p>You can learn the pricing, the pipeline, the delegation. But if your body treats the next level as a threat, you will quietly sabotage the exact move you paid to learn.</p>`},

  {t:'part2', cls:'panel-dark', html:`<div class="kicker">Part two · the framework</div>
    <h1 style="font-size:clamp(2.2rem,5vw,3.6rem);color:#f2ede0">The four stages.</h1>
    <div class="capline" style="width:240px"></div>
    <p style="margin-top:1.6rem">Discovery. Excavation. Integration. Expansion. The arc every founder moves through when the business outgrows who they have been.</p>`},

  {t:'stage-grid', cls:'', html:`<div class="kicker">The arc at a glance</div>
    <h2>How the work actually runs.</h2>
    <div class="stages">
      <div class="stage"><div class="n">01</div><h3>Discovery</h3><span>Name the real obstacle, not the one on the surface.</span></div>
      <div class="stage"><div class="n">02</div><h3>Excavation</h3><span>Find the pattern and the nervous-system response underneath it.</span></div>
      <div class="stage"><div class="n">03</div><h3>Integration</h3><span>Lead from presence instead of strategy and force.</span></div>
      <div class="stage"><div class="n">04</div><h3>Expansion</h3><span>The work evolves as you grow into the next level.</span></div>
    </div>`},

  {t:'discovery', cls:'big', html:`<div class="kicker">Stage one · Discovery</div>
    <h2>The obstacle is rarely the one you named.</h2>
    <p>Most founders bring a strategy question. Underneath it is almost always a question about what they believe they are allowed to have.</p>`},

  {t:'excavation', cls:'big', html:`<div class="kicker">Stage two · Excavation</div>
    <h2>The pattern runs in the body first.</h2>
    <p>The flinch before you send the invoice. The shrinking in rooms you fought to get into. We work the pattern where it actually lives, not just where you can talk about it.</p>`},

  {t:'integration', cls:'big', html:`<div class="kicker">Stage three · Integration</div>
    <h2>From strategy to presence.</h2>
    <p>When your system stops reading growth as danger, the tactics you already know finally land. You lead the decision instead of white-knuckling it.</p>`},

  {t:'expansion', cls:'big', html:`<div class="kicker">Stage four · Expansion</div>
    <h2>You grow, so the work grows.</h2>
    <p>Capacity is not a one-time unlock. Each new level asks for a new version of you, and the arc repeats at a higher altitude.</p>`},

  {t:'motif', cls:'', html:`<div class="kicker">The through-line</div>
    <h2>Capacity widens stage by stage.</h2>
    <div class="capline" style="width:90px"></div>
    <div class="capline" style="width:200px;margin-top:1rem"></div>
    <div class="capline" style="width:360px;margin-top:1rem"></div>
    <div class="capline" style="width:560px;max-width:90%;margin-top:1rem"></div>
    <p style="margin-top:2rem">Discovery to Expansion. The room you can hold gets wider every pass.</p>`},

  {t:'part3', cls:'', html:`<div class="kicker">Part three</div>
    <h1 style="font-size:clamp(2.2rem,5vw,3.6rem)">How a founder moves through it.</h1>
    <div class="capline" style="width:180px"></div>`},

  {t:'somatic', cls:'big', html:`<div class="kicker">Regulate, do not push</div>
    <h2>Most founders scale from fight-or-flight.</h2>
    <p>There is another way to run a company. I learned it the hard way, under a loaded barbell and across a decade of enterprise sales, before I ever coached a founder through it.</p>`},

  {t:'fusion', cls:'panel-dark', html:`<div class="kicker">The whole idea in one line</div>
    <div class="big-quote">Revenue growth and inner work are the same project.</div>
    <p style="margin-top:1.8rem">Pipeline review and the fear under the follow-up. Pricing and the worth you actually believe. We work both halves in the same room, because they were never separate.</p>`},

  {t:'why', cls:'panel-dark', html:`<div class="kicker">Why me</div>
    <h2 style="color:#f2ede0">Where this comes from.</h2>
    <div class="why">
      <p>A decade in sales, President's Club, more than one hundred million dollars in closed revenue.</p>
      <p>A competitive powerlifter who learned capacity is a physical thing before it is a mindset thing.</p>
      <p>Financially independent at thirty-three, then rebuilt this as the work I actually wanted to do.</p>
    </div>`},

  {t:'room', cls:'', html:`<div class="kicker">Who is already in the room</div>
    <h2>You will not be the only one.</h2>
    <ul>
      <li>Agency owners, who make up close to half of the Soleia membership</li>
      <li>Founders scaling straight into a capacity ceiling</li>
      <li>Operators who are done running their company on adrenaline</li>
    </ul>`},

  {t:'cta', cls:'panel-dark lead', html:`<div class="kicker">Your next step</div>
    <h1 style="color:#f2ede0;font-size:clamp(2.4rem,5.4vw,4rem)">Come home to the<br>founder you are becoming.</h1>
    <p style="margin-top:1.4rem">If the ceiling you are hitting sounds less like a strategy gap and more like a capacity one, let's talk about whether Soleia is the right room for you.</p>
    <span class="cta-step">Book a call with Chelsea at joinsoleia.com</span>
    <div class="disc">Educational content only. Nothing here is financial, legal, or business advice, and no income, role, revenue, or result is guaranteed. Outcomes vary and depend on your own effort, market, and circumstances.</div>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide '+(s.cls||'');
  sec.innerHTML='<div class="count">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>'+s.html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
