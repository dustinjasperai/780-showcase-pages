<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Master the Ball, Master the Game with Saul Isaksson-Hurst</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f7f4;      /* ground, from his light-scheme site */
    --panel:#ffffff;   /* panel */
    --rule:#e4e4dd;    /* hairline rule */
    --ink:#2b2b2b;     /* deep ink, from his #444444 body family */
    --muted:#6b6b64;
    --accent:#8c9600;  /* his olive-lime brand accent, brand.json (16 uses) */
    --ink-panel:#111111; /* his black header, used as a dark section device */
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{background:var(--bg);color:var(--ink);font-family:'Open Sans',system-ui,sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:64px 66px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;box-shadow:0 10px 30px rgba(43,43,43,.05)}
  .slide.dark{background:var(--ink-panel);border-color:var(--ink-panel);color:#fff}
  .slide.dark .k{color:var(--accent)}
  .slide.dark .sub,.slide.dark p,.slide.dark li{color:#e7e7e2}
  .k{font-family:'Open Sans';font-weight:700;font-size:15px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.01em;
    font-size:78px;line-height:.98;color:inherit}
  h2{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:.01em;
    font-size:54px;line-height:1.02;color:inherit;margin-bottom:8px}
  .sub{font-size:22px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:80%}
  p{font-size:21px;line-height:1.6;margin-top:18px;max-width:82%}
  ul{margin-top:22px;list-style:none}
  li{font-size:21px;line-height:1.5;margin:14px 0;padding-left:34px;position:relative}
  li::before{content:'';position:absolute;left:0;top:11px;width:16px;height:16px;
    border:3px solid var(--accent);border-radius:4px}
  .big{font-family:'Bebas Neue',Impact,sans-serif;font-size:120px;line-height:.9;color:var(--accent)}
  .stage{font-family:'Bebas Neue',Impact,sans-serif;font-size:40px;color:var(--accent);letter-spacing:.02em}
  .foot{position:absolute;bottom:26px;left:66px;right:66px;display:flex;justify-content:space-between;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#a6a69e;border-top:1px solid var(--rule);padding-top:14px}
  .slide.dark .foot{color:#7d7d76;border-color:#333}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:82%;line-height:1.5}
  .cta-line{font-family:'Bebas Neue',Impact,sans-serif;font-size:34px;color:var(--accent);margin-top:22px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A Live Session with Saul Isaksson-Hurst',
    h:'Master the Ball,<br>Master the Game',
    sub:'The individual technical session every academy player trains on, and your club never has time for.' },

  {t:'who', k:'Who this is for',
    h:'Serious young players<br>and their parents',
    sub:'For the player who trains hard, loves the game, and wants their technique to hold up when the match speeds up. And for the parent who can see the effort but not the plan.' },

  {t:'trap', k:'The honest problem',
    h:'Twice a week is not<br>enough touches',
    body:'Your child trains with the club twice a week and works hard every session. But the first touch still bounces away under pressure, and the 1v1 still does not come off in games.',
    body2:'That is not a talent problem. Club sessions are built to coach the team: shape, tactics, the group. There is almost no time left for the individual player and their technique.' },

  {t:'reframe', dark:true, k:'The reframe',
    h:'Talent is not<br>the bottleneck',
    sub:'Individual technical volume is. The players who pull ahead are getting daily, structured, deliberate touches that nobody sees on a Saturday.' },

  {t:'section', dark:true, k:'Part One', h:'The Core Problem' },

  {t:'content', k:'Part One',
    h:'The team gets coached.<br>The player does not.',
    body:'A 90 minute team session has to serve 16 players, a game plan, and a result on the weekend. The ball is at any one player\'s feet for a tiny fraction of it.',
    body2:'Technique is built by repetition. Without individual work, the weakest part of a young player\'s game rarely gets the reps it needs to change.' },

  {t:'content', k:'Part One',
    h:'What is actually missing',
    body:'A structured individual plan: the same core technical work, repeated and progressed, that develops first touch, ball mastery, movement, and decision making one player at a time.',
    body2:'This is the exact work I did with academy players at Spurs and Chelsea. It is what today\'s session is built from.' },

  {t:'section', dark:true, k:'Part Two', h:'The Technical<br>Excellence Cycle' },

  {t:'content', k:'The framework',
    h:'One cycle, three stages',
    sub:'My core coaching model. Each stage feeds the next, and every session touches all three.',
    stage:'Ball Mastery  ·  Movement Development  ·  Functional Practices' },

  {t:'content', k:'Stage 1', h:'Ball Mastery',
    body:'First touch, close control, dribbling, ball striking, and skills. Both feet, every surface, from static reps to speed.',
    body2:'This is the base. Everything else in a player\'s game sits on top of how well they can control and manipulate the ball.' },

  {t:'content', k:'Stage 2', h:'Movement Development',
    body:'Turning, running technique, body positioning, and dynamic explosive movement, with and without the ball.',
    body2:'Great technique is useless if the player cannot get into the right position at the right moment. Movement is what makes the skill count.' },

  {t:'content', k:'Stage 3', h:'Functional Practices',
    body:'Applying the skills in game scenarios: 1v1s, skill combinations, and decision making through drills with more than one outcome.',
    body2:'This is where technique becomes football. The player learns to choose, not just to perform.' },

  {t:'content', k:'The foundation', h:'The Building Blocks',
    body:'Five attributes make a complete player: Technical, Physical, Tactical, Psychological, and Social.',
    body2:'Technical excellence is the base the other four depend on. Confidence, decisions, and physicality all grow faster once the ball is not the problem.',
    bullets:['Technical, the base and the primary focus','Physical, Tactical, Psychological, Social build on top'] },

  {t:'content', k:'Underneath it all', h:'The ABC\'s',
    body:'Agility, Balance, and Coordination: the movement foundations that sit underneath ball mastery.',
    body2:'Especially in the younger years, these are the quiet unlock. Better coordination means a cleaner first touch and a faster turn, without ever mentioning the ball.' },

  {t:'section', dark:true, k:'Part Three', h:'The Cycle<br>In Practice' },

  {t:'content', k:'In practice', h:'A repeatable session',
    body:'The Dynamic Ball Mastery programme turns the cycle into structured sessions a player can run again and again, at the park or in the garden.',
    body2:'It is designed to be engaging and progressive, so a young player actually wants to do their individual work, not just their team training.' },

  {t:'content', k:'Progress you can see', h:'Technical markers,<br>not vague hope',
    body:'Because the work is structured, progress is visible: a cleaner first touch, a sharper turn, a 1v1 that comes off more often.',
    body2:'You stop guessing whether the extra work is helping, because you can watch the technique change.' },

  {t:'why', k:'Why me', h:'Saul Isaksson-Hurst',
    bullets:[
      'Around a decade as a skills coach in Premier League academy football at Tottenham Hotspur and Chelsea',
      'UEFA A licence, FA Advanced Youth Award, BA(Hons), MA, PGCE',
      'Works 1-2-1 with players on the books at clubs including Fulham, Spurs, Arsenal and Aston Villa',
      'Founder of My Personal Football Coach and host of the Soccer Player Development Podcast'
    ],
    sub:'I specialise in one thing: developing the individual player\'s technique and ball mastery.' },

  {t:'cta', k:'Your next step', h:'Start the individual work',
    body:'If today made sense, the Dynamic Ball Mastery programme is the structured version of everything we covered, ready to run this week.',
    ctaLine:'Begin Dynamic Ball Mastery, or book 1-2-1 coaching at mypersonalfootballcoach.com',
    disc:'This session is for educational purposes only. Individual results vary and depend on the player\'s effort and consistency. No specific outcome, selection, or level of play is promised or guaranteed.' }
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.dark ? ' dark' : '');
  let html = '';
  if (s.k) html += `<div class="k">${s.k}</div>`;
  if (s.h) html += `<h1${s.t==='section'?' style="font-size:88px"':''}>${s.h}</h1>`;
  if (s.sub) html += `<div class="sub">${s.sub}</div>`;
  if (s.stage) html += `<div class="stage" style="margin-top:30px">${s.stage}</div>`;
  if (s.body) html += `<p>${s.body}</p>`;
  if (s.body2) html += `<p>${s.body2}</p>`;
  if (s.bullets) html += '<ul>' + s.bullets.map(b => `<li>${b}</li>`).join('') + '</ul>';
  if (s.ctaLine) html += `<div class="cta-line">${s.ctaLine}</div>`;
  if (s.disc) html += `<div class="disc">${s.disc}</div>`;
  html += `<div class="foot"><span>My Personal Football Coach</span><span>${i+1} / ${S.length}</span></div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
