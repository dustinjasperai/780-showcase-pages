<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Three Pillars of Product Leadership — Ravi Mehta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f1efe9; --panel:#ffffff; --rule:#e4e1da; --ink:#15171a;
    --muted:#5b5f66; --accent:#1c98bd; --deep:#0f3a47;
    --display:'Archivo',system-ui,sans-serif; --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);
    -webkit-font-smoothing:antialiased;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .kick{font-family:var(--display);font-weight:700;font-size:13px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.04;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:33px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--muted)}
  .big{font-size:26px;line-height:1.3}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;padding:12px 0 12px 30px;position:relative;border-top:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:20px;width:12px;height:12px;
    border-radius:3px;background:var(--accent)}
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:22px}
  .pil{border:1px solid var(--rule);border-radius:10px;padding:20px;background:var(--bg)}
  .pil .n{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent)}
  .pil h3{font-family:var(--display);font-weight:700;font-size:21px;margin:8px 0 6px}
  .pil span{font-size:16px;color:var(--muted)}
  .matrix{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:20px}
  .cell{border:1px solid var(--rule);border-radius:8px;padding:14px 12px;background:var(--bg);
    font-size:15px;color:var(--muted)}
  .cell b{display:block;font-family:var(--display);font-weight:700;font-size:16px;color:var(--ink);margin-bottom:4px}
  .cell.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .cell.on b{color:#fff}
  .tag{display:inline-block;font-family:var(--display);font-weight:600;font-size:13px;
    letter-spacing:.04em;color:var(--deep);background:#dff0f5;border-radius:999px;
    padding:6px 14px;margin-top:18px}
  .quote{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.22;
    letter-spacing:-.01em}
  .cta h1{font-size:42px}
  .step{border-left:3px solid var(--accent);padding-left:18px;margin:18px 0}
  .step b{font-family:var(--display)}
  .disc{font-size:14px;color:var(--muted);margin-top:28px;border-top:1px solid var(--rule);
    padding-top:16px;max-width:70ch}
  .num{position:absolute;right:40px;top:30px;font-family:var(--display);font-weight:700;
    font-size:14px;color:var(--rule)}
  .cover{background:linear-gradient(180deg,#12343f 0%,#0f3a47 100%);color:#fff;border-color:#0f3a47}
  .cover .kick{color:#8fd4e6}
  .cover h1{color:#fff}
  .cover p.lead{color:#cfe6ee}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S = [
  {t:"cover", cls:"cover", html:`
    <div class="kick">A masterclass for product leaders</div>
    <h1>The Three Pillars of Product Leadership</h1>
    <p class="lead">Why are you leading, who are you leading, and what are you leading. The move from building product to leading it, taught by a former CPO.</p>
    <div class="tag">With Ravi Mehta</div>`},

  {t:"promise", html:`
    <div class="kick">In the next hour</div>
    <h2>A clear model for the job you are actually in.</h2>
    <p>We will name the three disciplines of product leadership, find your shape across them, and leave you with the one gap to close first.</p>
    <p class="lead">No new tools to adopt. A way to see the work you are already responsible for.</p>`},

  {t:"who", html:`
    <div class="kick">Who this is for</div>
    <h2>You got promoted on execution. Now the job changed.</h2>
    <p>This hour is for senior PMs, heads of product, and product focused founders who are suddenly responsible for a team, a strategy, and an outcome that is bigger than anything they can ship themselves.</p>
    <p class="lead">You already know how to build. The question is how to lead.</p>`},

  {t:"trap", html:`
    <div class="kick">The trap</div>
    <h2>The best builder on the team becomes the bottleneck.</h2>
    <p>You were the person who could define the spec, unblock the engineers, and ship the thing. So when you got the leadership title, you kept doing exactly that, just across more surface area.</p>
    <p>The team waits on you. The strategy lives in your head. Growth stalls, and it looks like a people problem when it is really an operating problem.</p>`},

  {t:"reframe", html:`
    <div class="kick">The reframe</div>
    <p class="quote">The skills that made you a great product manager are not the skills that make you a great product leader. They are three different disciplines, and nobody teaches you the other two.</p>`},

  {t:"part", html:`
    <div class="kick">Part one</div>
    <h2>The full stack builder myth</h2>
    <p>The instinct at the top is to be the best builder in the room. But a leader who is still the strongest individual contributor has capped the team at the size of one person.</p>
    <p>Leverage does not come from doing more yourself. It comes from three things you have to build deliberately: direction, a team that can run without you, and a delivery system that holds.</p>`},

  {t:"overview", html:`
    <div class="kick">Part two</div>
    <h2>The Three Pillars</h2>
    <p>Everything a product leader is accountable for falls into one of three pillars. Most leaders are strong in one and quietly avoid the other two.</p>
    <div class="pillars">
      <div class="pil"><div class="n">01</div><h3>Strategic</h3><span>Why are you leading</span></div>
      <div class="pil"><div class="n">02</div><h3>People</h3><span>Who are you leading</span></div>
      <div class="pil"><div class="n">03</div><h3>Execution</h3><span>What are you leading</span></div>
    </div>`},

  {t:"imp", html:`
    <div class="kick">A lens for every pillar</div>
    <h2>Innovate, Manage, Produce</h2>
    <p>Inside each pillar there are three roles a leader has to cover. Innovate is defining where the team goes next. Manage is enabling the team to deliver to its potential. Produce is executing flawlessly against the vision.</p>
    <div class="pillars">
      <div class="pil"><div class="n">I</div><h3>Innovate</h3><span>Where next</span></div>
      <div class="pil"><div class="n">M</div><h3>Manage</h3><span>Enable the team</span></div>
      <div class="pil"><div class="n">P</div><h3>Produce</h3><span>Ship it</span></div>
    </div>`},

  {t:"p1", html:`
    <div class="kick">Pillar one</div>
    <h2>Strategic Leadership: why are you leading?</h2>
    <p>A product leader owns the answer to where the team goes next and why it matters. Not a roadmap of features, a point of view on the customer, the market, and the bet you are making.</p>
    <ul>
      <li>A thesis the team can repeat without you in the room</li>
      <li>Goals that are ambitious and real, an alternative to box checking OKRs</li>
      <li>The judgment to say no to good ideas that are off the thesis</li>
    </ul>`},

  {t:"p2", html:`
    <div class="kick">Pillar two</div>
    <h2>People Leadership: who are you leading?</h2>
    <p>Your output is now the output of your team. People Leadership is building a group that can innovate, manage, and produce without waiting on you for every decision.</p>
    <ul>
      <li>Hiring for the shape the team is missing, not more of yourself</li>
      <li>Growing PMs from execution into judgment</li>
      <li>Creating the conditions where the team does its best work</li>
    </ul>`},

  {t:"p3", html:`
    <div class="kick">Pillar three</div>
    <h2>Execution Leadership: what are you leading?</h2>
    <p>Strategy without delivery is a deck. Execution Leadership is the system that turns the thesis into shipped, iterated product, quickly and repeatedly.</p>
    <ul>
      <li>Clear product definition so the team builds the right thing</li>
      <li>A delivery rhythm that compounds, week over week</li>
      <li>Quality and taste held as a standard, not an afterthought</li>
    </ul>`},

  {t:"integrate", html:`
    <div class="kick">The integration</div>
    <h2>Great leaders carry all three at once.</h2>
    <p>Strategy without people is a solo act. People without execution is a happy team that ships nothing. Execution without strategy is a fast march in the wrong direction.</p>
    <p class="lead">The job is holding the tension between all three. That is what the title actually asks of you.</p>`},

  {t:"cost", html:`
    <div class="kick">The cost of staying an IC</div>
    <h2>Every quarter at the bottleneck compounds.</h2>
    <p>The team learns to wait. Your best PMs stop stretching because you make the calls for them. The strategy never gets written down because it is faster to hold it in your head.</p>
    <p class="lead">None of it shows up as a crisis. It shows up as a team that is slower than it should be, led by someone working twice as hard.</p>`},

  {t:"shape", html:`
    <div class="kick">The diagnostic</div>
    <h2>What is your shape?</h2>
    <p>Before you can grow, you have to see yourself honestly. Rate yourself across the core competencies and the picture is rarely balanced. Everyone has a shape.</p>
    <p>Your shape tells you two things: where to lean on your strength, and which one gap is quietly holding your whole team back.</p>`},

  {t:"matrix", html:`
    <div class="kick">Expectations grow with the role</div>
    <h2>From APM to VP</h2>
    <p>The same competencies are expected at every level. What changes is the scope and the bar.</p>
    <div class="matrix">
      <div class="cell"><b>APM</b>Execute a feature well</div>
      <div class="cell"><b>PM</b>Own a product area</div>
      <div class="cell on"><b>Head of Product</b>Own strategy and a team</div>
      <div class="cell"><b>VP / CPO</b>Own the org and the bet</div>
    </div>
    <p class="lead">Most stalls happen at the jump from owning a product to owning a team.</p>`},

  {t:"why", html:`
    <div class="kick">Why me</div>
    <h2>I have sat in the chair.</h2>
    <p>I was Chief Product Officer at Tinder and led product at Meta, Tripadvisor, and Xbox. As an Executive in Residence at Reforge I have coached dozens of senior product leaders, and across my career I have hired nearly a hundred PMs and product leaders.</p>
    <p class="lead">This is the model I use with them, warm and candid in equal measure.</p>`},

  {t:"after", html:`
    <div class="kick">The leader on the other side</div>
    <h2>A leader the team can run behind.</h2>
    <p>The strategy is written down and the team can repeat it. People are growing into their own judgment. Delivery is a rhythm, not a scramble. And you are spending your time on the next bet, not on being the bottleneck.</p>
    <p class="lead">That is the difference between a senior PM with a title and a product leader.</p>`},

  {t:"cta", cls:"cta", html:`
    <div class="kick">Next step</div>
    <h1>Build your Three Pillars with me.</h1>
    <p>The Product Leadership Accelerator is a focused three month program. We work on your Strategic, People, and Execution leadership directly, against the real decisions in front of you right now.</p>
    <div class="step"><b>Start here:</b> book an intro call at ravi-mehta.com and we will map your shape and where to focus first.</div>
    <p class="disc">Educational content only. This masterclass shares frameworks and judgment from one product leader's experience. No income, role, promotion, or business result is guaranteed. Outcomes vary with your situation and effort.</p>`}
];

const wrap = document.getElementById('wrap');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide' + (s.cls ? ' '+s.cls : '');
  d.innerHTML = (i>0 ? '<div class="num">'+(i+1)+' / '+S.length+'</div>' : '') + s.html;
  wrap.appendChild(d);
});
</script>
</body>
</html>
