<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Who Actually Buys Luxury — a masterclass with Elizabeth Solaru</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f5f3ee;
  --panel:#ebe6dc;
  --ink:#3d3e45;
  --rule:#434343;
  --accent:#8a6d3b;
  --mut:#6f6a60;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:'Cormorant Garamond',Georgia,serif}
.slide{
  min-height:100vh;width:100%;
  display:flex;flex-direction:column;justify-content:center;
  padding:9vh 9vw;border-bottom:1px solid #ded7c9;position:relative;
}
.slide::after{content:'';position:absolute;left:9vw;right:9vw;bottom:5.4vh;height:1px;background:var(--accent);opacity:.5}
.k{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(14px,1.5vw,19px);
  letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:28px}
h1{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(40px,6.4vw,92px);
  line-height:1.03;letter-spacing:-.01em;max-width:16ch}
h2{font-family:'Playfair Display',Georgia,serif;font-weight:600;font-size:clamp(30px,4.3vw,60px);
  line-height:1.08;max-width:20ch}
.em{font-style:italic;color:var(--accent)}
.s{font-size:clamp(20px,2.3vw,31px);line-height:1.5;color:var(--mut);margin-top:30px;max-width:40ch;font-weight:400}
.byline{margin-top:46px;font-size:clamp(18px,2vw,25px);letter-spacing:.04em;color:var(--ink)}
.byline b{font-weight:600}
ul{list-style:none;margin-top:38px;max-width:30ch}
li{font-size:clamp(20px,2.2vw,30px);line-height:1.36;padding:18px 0;border-top:1px solid #ded7c9;display:flex;gap:20px;align-items:baseline}
li:last-child{border-bottom:1px solid #ded7c9}
.num{font-family:'Playfair Display',serif;font-style:italic;color:var(--accent);font-size:.8em;flex-shrink:0;min-width:1.6ch}
.spectrum{display:flex;align-items:center;gap:0;margin-top:48px;max-width:46ch}
.pole{flex:1;text-align:center}
.pole .t{font-family:'Playfair Display',serif;font-weight:600;font-size:clamp(20px,2.4vw,32px)}
.pole .d{font-size:clamp(15px,1.5vw,18px);color:var(--mut);margin-top:8px;letter-spacing:.02em}
.bar{flex:1.4;height:2px;background:linear-gradient(90deg,#d8cdb6,var(--accent));margin:0 14px;position:relative;top:-14px}
.tag{display:inline-block;margin-top:40px;font-size:clamp(14px,1.5vw,18px);letter-spacing:.2em;
  text-transform:uppercase;color:var(--accent);border:1px solid var(--accent);border-radius:4px;padding:10px 18px}
.disc{margin-top:40px;font-size:clamp(13px,1.3vw,16px);line-height:1.5;color:var(--mut);max-width:52ch;font-style:italic}
.dot{color:var(--accent)}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', k:'A Luxury Business Emporium Masterclass',
    h:'Who Actually Buys Luxury',
    s:'The psychology of the affluent client, and how to sell to them without a luxury pedigree.',
    byline:'With <b>Elizabeth Solaru</b>'},

  {t:'who', k:'Who this is for',
    h:'You are already good enough for luxury.',
    s:'You make, design or deliver something beautiful. The craft is there. What is missing is the client who pays what it is worth.'},

  {t:'who', k:'Who this is for',
    h:'This room is for you if any of these are true.',
    items:['You discount to win the client who never valued you anyway.',
           'Your best work goes to people who notice the price before the artistry.',
           'You suspect there is a wealthier buyer out there you cannot seem to reach.']},

  {t:'trap', k:'The trap',
    h:'So you lowered the price. And attracted more of the wrong client.',
    s:'Cutting the number does not pull in the affluent. It pushes them away. In luxury, a low price is a signal, and the signal says this is not for me.'},

  {t:'reframe', k:'The hard truth',
    h:'The wealthy are not buying your <span class="em">product</span>.',
    s:'They are buying who they become when they own it. The story, the standing, the feeling of having chosen well. Sell that, and price stops being the conversation.'},

  {t:'part', k:'Part One',
    h:'Why luxury breaks the rules you were taught.'},

  {t:'point', k:'Part One',
    h:'Cheaper is not more persuasive.',
    s:'Everywhere else, a lower price lowers the barrier. In luxury it lowers the perceived value. The affluent read an easy yes as a lack of confidence in the work.'},

  {t:'point', k:'Part One',
    h:'They are not one audience. They are eight.',
    s:'The aspirational buyer and the ultra-wealthy buyer want opposite things from you. Pitch them the same way and you lose both.'},

  {t:'part', k:'Part Two',
    h:'The Eight Luxury Client Archetypes.'},

  {t:'spectrum', k:'Part Two',
    h:'Eight buyers, sitting on one spectrum.',
    s:'From the aspirational client stretching toward their first luxury purchase, to the ultra-wealthy client for whom price is simply not a factor. Each one buys for a different reason.'},

  {t:'point', k:'Part Two',
    h:'Then niche <span class="em">within</span> the niche.',
    s:'Luxury thrives on specificity. You do not serve all eight. You identify the one or two archetypes you were made for, and you build everything around them.'},

  {t:'part', k:'Part Two',
    h:'The Five Non-Negotiable Pillars.'},

  {t:'pillars', k:'Part Two',
    h:'Five things in place before you can command luxury prices.',
    items:['Storytelling','Perception','Customer experience','An incredible product','Vision']},

  {t:'point', k:'Part Two',
    h:'The art, and the science, of luxury selling.',
    s:'Sell the possibility, the dream, the future. The relationship, the expectation, the referral that follows. The object is the last thing the affluent are actually paying for.'},

  {t:'part', k:'Part Three',
    h:'Putting this to work in your business.'},

  {t:'steps', k:'Part Three',
    h:'Three moves, starting this week.',
    items:['Name the one archetype you are built for, and say no to the rest.',
           'Audit your five pillars. Fix the weakest one first.',
           'Rewrite one offer to sell the future, not the features.']},

  {t:'why', k:'Why me',
    h:'I started with £40 and a secondhand mixer.',
    s:'I built Elizabeth’s Cake Emporium into a luxury brand serving royal families and ultra-high-net-worth clients. Featured in Vogue, Tatler and HELLO!, with work for Harrods, Oscar de la Renta and Fendi.'},

  {t:'reframe', k:'Why me',
    h:'You do not need a luxury <span class="em">background</span>.',
    s:'You need to understand the buyer. That is a craft, and it can be learned. It is the whole of what I teach.'},

  {t:'cta', k:'Your next step',
    h:'Come and build your luxury client engine with me.',
    s:'Inside Luxcelerate and my one-to-one coaching, we map your archetype, set your five pillars and rebuild how you sell. Start at luxurybusinessemporium.com.',
    disc:'No specific income or result is guaranteed. Results vary and depend on your work, your market and your offer. This masterclass is educational in nature.'}
];

const deck = document.getElementById('deck');
for (const o of S){
  const sl = document.createElement('section');
  sl.className = 'slide';
  let html = '';
  if (o.k) html += '<div class="k">'+o.k+'</div>';
  if (o.t === 'title'){
    html += '<h1>'+o.h+'</h1>';
    if (o.s) html += '<div class="s">'+o.s+'</div>';
    if (o.byline) html += '<div class="byline">'+o.byline+'</div>';
  } else if (o.t === 'part'){
    html += '<h1>'+o.h+'</h1>';
  } else if (o.t === 'spectrum'){
    html += '<h2>'+o.h+'</h2>';
    html += '<div class="spectrum"><div class="pole"><div class="t">Aspirational</div><div class="d">stretching toward luxury</div></div><div class="bar"></div><div class="pole"><div class="t">Established</div><div class="d">buys on taste</div></div><div class="bar"></div><div class="pole"><div class="t">Ultra-wealthy</div><div class="d">price is no factor</div></div></div>';
    if (o.s) html += '<div class="s">'+o.s+'</div>';
    html += '<div class="tag">Eight archetypes in total</div>';
  } else if (o.items){
    html += '<h2>'+o.h+'</h2>';
    html += '<ul>';
    o.items.forEach((it,i)=>{ html += '<li><span class="num">'+(o.t==='pillars'||o.t==='steps'?(i+1):'·')+'</span><span>'+it+'</span></li>'; });
    html += '</ul>';
    if (o.s) html += '<div class="s">'+o.s+'</div>';
  } else {
    html += '<h2>'+o.h+'</h2>';
    if (o.s) html += '<div class="s">'+o.s+'</div>';
    if (o.disc) html += '<div class="disc">'+o.disc+'</div>';
  }
  sl.innerHTML = html;
  deck.appendChild(sl);
}
</script>
</body>
</html>
