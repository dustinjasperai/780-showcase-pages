<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The New Triple Threat — A Masterclass with Alyshia Ochse</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400;0,6..96,600;0,6..96,700;1,6..96,500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141311;        /* cinematic near-black ground, from the cover */
    --panel:#201d18;     /* ground lifted with filmstrip warmth */
    --rule:#4a3b2a;      /* muted sepia filmstrip */
    --ink:#f4f1ea;       /* warm white display type */
    --muted:#b7b0a4;     /* desaturated warm gray */
    --accent:#1fb5a3;    /* signature teal (the "One" script + her name) */
    --amber:#b98a4e;     /* sepia film-amber, sparing */
    --head:"Bodoni Moda", Georgia, serif;
    --body:"Inter", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
  .slide{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;position:relative;border-bottom:1px solid rgba(74,59,42,.35)}
  .kicker{font-family:var(--body);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.6rem;display:flex;align-items:center;gap:.8rem}
  .kicker::before{content:"";width:34px;height:7px;flex:0 0 auto;
    background:repeating-linear-gradient(90deg,var(--amber) 0 3px,transparent 3px 6px)}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.6rem,7vw,5.4rem);line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(2rem,4.6vw,3.4rem);line-height:1.08;letter-spacing:-.01em}
  .promise{font-family:var(--head);font-style:italic;font-weight:500;color:var(--muted);
    font-size:clamp(1.2rem,2.4vw,1.8rem);margin-top:1.4rem;max-width:22ch}
  .lead{font-size:clamp(1.05rem,1.7vw,1.3rem);color:var(--muted);max-width:40ch;margin-top:1.5rem}
  .body{font-size:clamp(1.05rem,1.6vw,1.25rem);max-width:46ch;margin-top:1.4rem}
  ul{list-style:none;margin-top:1.8rem;max-width:48ch;display:flex;flex-direction:column;gap:1rem}
  li{position:relative;padding-left:1.8rem;font-size:clamp(1rem,1.5vw,1.2rem)}
  li::before{content:"";position:absolute;left:0;top:.62em;width:10px;height:10px;background:var(--accent)}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(3rem,9vw,7rem);line-height:.98}
  .ghost{color:var(--rule);text-decoration:line-through;text-decoration-thickness:3px}
  .num{font-family:var(--head);font-weight:700;color:var(--amber);font-size:clamp(1rem,1.5vw,1.2rem);letter-spacing:.2em}
  .panel{background:var(--panel);border:1px solid var(--rule);padding:2.4rem 2.6rem;max-width:44ch;margin-top:2rem}
  .panel h3{font-family:var(--head);font-size:1.5rem;font-weight:600;margin-bottom:.6rem}
  .panel p{color:var(--muted);font-size:1.05rem}
  .who{color:var(--amber)}
  .pres{margin-top:2.6rem;font-size:.95rem;color:var(--muted);letter-spacing:.04em}
  .pres b{color:var(--ink);font-weight:600}
  .disc{margin-top:2.2rem;font-size:.82rem;color:var(--muted);max-width:52ch;line-height:1.6}
  .cta-step{display:inline-block;margin-top:1.8rem;font-family:var(--body);font-weight:600;
    border:1px solid var(--accent);color:var(--accent);padding:.9rem 1.6rem;letter-spacing:.03em}
  .count{position:absolute;right:8vw;bottom:5vh;font-size:.78rem;color:var(--rule);letter-spacing:.1em}
  .accent{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* The masterclass content lives in const S. The coach is the presenter; this is her class. */
const S = [
  {t:'title', kicker:'A live masterclass', h:'The New Triple Threat', promise:'Why talent was never the bottleneck.', pres:'Presented live by <b>Alyshia Ochse</b> &middot; host of That One Audition'},
  {t:'who', kicker:'Who this is for', h:'For the actor who tapes and waits.', lead:'Working and emerging screen actors who put real work into the room, then hear nothing back, and cannot tell why.'},
  {t:'trap', kicker:'The trap', h:'Good auditions. No bookings.', body:'You get the callback energy, the "loved you in there." Then the role goes somewhere else and no one tells you what was missing. So you decide it was talent, or luck, or timing.'},
  {t:'hook', kicker:'The reframe', big:'<span class="ghost">Sing. Dance. Act.</span>', body:'The old triple threat was built for a stage and a casting room. The industry moved. Most of your first auditions are now a file you record alone, at home, in the dark.'},
  {t:'part', num:'PART ONE', h:'The real problem is not your talent.'},
  {t:'point', kicker:'Part one', h:'The tape is the audition now.', body:'The self-tape is no longer a step before the audition. It is the audition. A brilliant choice that is badly lit, flatly read, and shot like a hostage video never reaches the people who decide.'},
  {t:'point', kicker:'Part one', h:'Why strong actors still miss.', lead:'Three gaps, and none of them is craft:', bullets:['The tape is performed, not directed','The business around the booking is invisible','The actor waits to be chosen instead of building the career']},
  {t:'part', num:'PART TWO', h:'The New Triple Threat.'},
  {t:'fw', num:'ONE', kicker:'The framework', who:'Craft', h:'The choice that reads on camera.', body:'Not more technique for its own sake. The specific, bolder choice that lands in a 90 second clip, and the preparation (including sensorial tools like music) that gets you there under pressure.'},
  {t:'fw', num:'TWO', kicker:'The framework', who:'Business', h:'Run the career like an entrepreneur.', body:'The turnaround on a next day tape. The relationships you keep warm. The follow up. The mindset that survives the no. The working actors who last treat this as a business, not a lottery.'},
  {t:'fw', num:'THREE', kicker:'The framework', who:'Tech', h:'A tape that looks directed.', body:'Lighting, sound, a real reader, framing, and a clean slate. The craft you already have, finally seen. This is the skill most training skips, and it is the one that gates the room now.'},
  {t:'point', kicker:'The framework', h:'The three only work together.', body:'Craft with no tech never gets watched. Tech with no business stays a hobby. Business with no craft is noise. Booked actors run all three at once. That is the new triple threat.'},
  {t:'part', num:'PART THREE', h:'Inside a booked actor\'s week.'},
  {t:'point', kicker:'Part three', h:'Before the deadline, not after.', lead:'A next day tape, handled as a system:', bullets:['The choice, made bolder and specific','Lit and framed like a finished scene','A reader and a clean slate booked','Sent before the deadline, every time']},
  {t:'point', kicker:'Part three', h:'A career you are building, not waiting on.', body:'You stop refreshing your inbox. You know your turnaround, your people, and your next move. The audition becomes one output of a system you control, instead of the whole weather of your week.'},
  {t:'why', kicker:'Why me', h:'I book about 70% of my work on tape.', body:'I am a working actor (True Detective, How I Met Your Mother, Days of Our Lives), and I have spent 250+ episodes of That One Audition asking other working actors how they actually book. The honest answer is almost never raw talent. It is this.'},
  {t:'point', kicker:'The mindset', h:'This is a decade, not an audition.', body:'There is no single right way and no shortcut. A career is a long, non linear climb. The actors who make it are not the most gifted in the room, they are the ones who kept building the three skills while everyone else waited.'},
  {t:'recap', kicker:'The whole thing in one slide', h:'Craft. Business. <span class="accent">Tech.</span>', lead:'The tape is the audition. Direct it like one, run it like a business, and talent finally gets to do its job.'},
  {t:'next', kicker:'Keep building the three', h:'Go deeper with me.', body:'If this reframed how you see the room, the next step is the work itself, together: the craft, the business, and the self-tape tech, built into a practice instead of a panic.', step:'Keep working with Alyshia'},
  {t:'cta', kicker:'Thank you', h:'You were never behind on talent.', lead:'You were missing the system around it. Now you have the map.', step:'Start with The New Triple Threat', disc:'This masterclass is for educational purposes only. It shares a method and a mindset, not a promise. Results vary from actor to actor and are not guaranteed. Nothing here guarantees a booking, representation, or income.'}
];

const el = document.getElementById('deck');
S.forEach((s, i) => {
  const d = document.createElement('section');
  d.className = 'slide';
  let h = '';
  if (s.kicker) h += '<div class="kicker">' + s.kicker + '</div>';
  if (s.num && s.t === 'part') h += '<div class="num" style="margin-bottom:1.2rem">' + s.num + '</div>';
  if (s.who) h += '<div class="big who" style="font-size:clamp(2.4rem,6vw,4.4rem)">' + s.who + '</div>';
  if (s.big) h += '<div class="big">' + s.big + '</div>';
  if (s.h) h += (s.t === 'fw' ? '<h2 style="margin-top:1rem">' : '<h1>') + s.h + (s.t === 'fw' ? '</h2>' : '</h1>');
  if (s.promise) h += '<div class="promise">' + s.promise + '</div>';
  if (s.lead) h += '<div class="lead">' + s.lead + '</div>';
  if (s.body) h += '<div class="body">' + s.body + '</div>';
  if (s.bullets) h += '<ul>' + s.bullets.map(b => '<li>' + b + '</li>').join('') + '</ul>';
  if (s.step) h += '<span class="cta-step">' + s.step + '</span>';
  if (s.pres) h += '<div class="pres">' + s.pres + '</div>';
  if (s.disc) h += '<div class="disc">' + s.disc + '</div>';
  h += '<div class="count">' + String(i + 1).padStart(2, '0') + ' / ' + String(S.length).padStart(2, '0') + '</div>';
  d.innerHTML = h;
  el.appendChild(d);
});
</script>
</body>
</html>
