<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pick the Idea That Pays - A Live Masterclass with Jake Lang</title>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#001a40; --panel:#002c5c; --rule:#3a5f8a; --accent:#f0c000;
    --ink:#f0f0f0; --muted:#9fb4d0;
    --head:'Space Grotesk',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1080px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:linear-gradient(180deg,var(--panel),#00224a);border:1px solid var(--rule);
    border-radius:18px;padding:52px 56px;margin:22px 0;min-height:430px;
    display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:attr(data-n);position:absolute;right:22px;bottom:16px;
    font-family:var(--head);font-size:13px;color:var(--rule)}
  .kicker{font-family:var(--head);font-weight:500;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:34px;line-height:1.12;letter-spacing:-.01em}
  .promise{font-size:21px;color:var(--muted);margin-top:20px;max-width:30ch}
  .lead{font-size:20px;color:var(--ink);margin-top:18px;max-width:52ch}
  .muted{color:var(--muted)}
  .part{font-family:var(--head);font-weight:700;font-size:15px;letter-spacing:.2em;
    text-transform:uppercase;color:var(--accent)}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:19px}
  li::before{content:"";position:absolute;left:0;top:9px;width:12px;height:12px;border-radius:3px;
    background:var(--accent)}
  .steps{display:grid;gap:16px;margin-top:24px;max-width:66ch}
  .step{background:#00213f;border:1px solid var(--rule);border-radius:12px;padding:18px 20px}
  .step .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.1em}
  .step h3{font-family:var(--head);font-size:21px;margin-top:4px}
  .step p{color:var(--muted);font-size:16px;margin-top:6px}
  .big{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.08;max-width:22ch}
  .cta h2{font-size:40px}
  .btn{display:inline-block;margin-top:26px;background:var(--accent);color:#001330;
    font-family:var(--head);font-weight:700;font-size:19px;padding:15px 30px;border-radius:12px}
  .disclaimer{margin-top:28px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:360px}h1{font-size:34px}h2{font-size:26px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
  const S = [
    {t:'title', kicker:'A live masterclass with Jake Lang', h:'Pick the Idea That Pays',
      promise:'The Step One method for choosing and validating your first profitable online business, before you build a thing.'},
    {t:'who', h:'Who this is for',
      lead:'You want to start an online business. You are not short on ideas. You are stuck on which one is actually worth building, and you do not want to spend six months finding out the hard way.'},
    {t:'reframe', big:'You do not need a passion. You need a validated idea.',
      sub:'Passion feels safe. It is also how most first businesses quietly fail.'},
    {t:'part', part:'Part One', h:'Why most first businesses fail before they start',
      lead:'It is almost never the building. It is the choosing.'},
    {t:'list', h:'The beginner loop', items:[
      'Pick an idea because it sounds fun or feels like a passion.',
      'Build for months with no evidence anyone wants it.',
      'Launch to silence, blame the execution, start over.']},
    {t:'list', h:'The real problem', items:[
      'No demand check before the work begins.',
      'One idea, emotionally attached, never pressure tested.',
      'No way to tell a profitable niche from a crowded one.']},
    {t:'part', part:'Part Two', h:'The Step One method',
      lead:'A simple, repeatable process to research, validate, and choose the right idea first. It is the same method I have used to start more than eight online businesses.'},
    {t:'steps', h:'Three moves', steps:[
      {n:'MOVE 01', h:'The Brain Dump', p:'Generate 150+ raw business ideas on purpose. Volume first, judgment later. The Day Job Niche is the fastest source: your current job is a list of problems you already understand.'},
      {n:'MOVE 02', h:'Research the market', p:'Narrow the list with real demand signals. Who is already searching, buying, and complaining in that niche, and is there room to be found.'},
      {n:'MOVE 03', h:'Validate the one', p:'Pressure test the single best idea before you build. Prove people want it so you launch from evidence, not hope.'}]},
    {t:'reframe', big:'The riches are in the niches.',
      sub:'A specific, validated niche beats a big vague market every time.'},
    {t:'part', part:'Part Three', h:'From validated idea to a site that pays',
      lead:'Once the idea is proven, the build is the easy part.'},
    {t:'list', h:'The niche site playbook', items:[
      'Turn the validated idea into a focused content site.',
      'Rank it by answering the questions your niche is already asking.',
      'Monetize with courses, a membership, and affiliate income.']},
    {t:'list', h:'A worked example: the exam prep niche', items:[
      'One concrete niche, chosen and validated with the same process.',
      'Built in public, in real time, decisions and mistakes included.',
      'Proof that the method travels to any niche you validate.']},
    {t:'why', h:'Why learn this from me',
      lead:'I am an 8-time founder and I start a new online business every year, sharing the whole thing behind the scenes on The Entrepreneur Ride Along. You are not watching theory. You are watching a real business get chosen, validated, and built, and copying the parts that work.'},
    {t:'list', h:'What you will leave with', items:[
      'Your own brain-dump of real candidate ideas.',
      'A clear way to tell a profitable niche from a crowded one.',
      'The validation test to run before you build anything.']},
    {t:'recap', h:'The whole method, in one line',
      lead:'Brain-dump the ideas. Research the market. Validate the one. Then build the niche site that pays.'},
    {t:'cta', h:'Your next step',
      lead:'If you want to do this with me, join The Entrepreneur Ride Along membership and build your first validated business alongside the method, the community, and the live training.',
      btn:'Join The Entrepreneur Ride Along',
      disclaimer:'This masterclass is educational only. Results vary from person to person and nothing here is a guarantee of income or results. Your outcome depends on the work you put in.'}
  ];
  const deck = document.getElementById('deck');
  S.forEach((s, i) => {
    const el = document.createElement('section');
    el.className = 'slide' + (s.t === 'cta' ? ' cta' : '');
    el.setAttribute('data-n', String(i + 1).padStart(2, '0') + ' / ' + S.length);
    let html = '';
    if (s.t === 'title') {
      html = `<div class="kicker">${s.kicker}</div><h1>${s.h}</h1><p class="promise">${s.promise}</p>`;
    } else if (s.t === 'reframe') {
      html = `<p class="big">${s.big}</p><p class="lead muted">${s.sub}</p>`;
    } else if (s.t === 'part') {
      html = `<div class="part">${s.part}</div><h2 style="margin-top:14px">${s.h}</h2><p class="lead">${s.lead}</p>`;
    } else if (s.t === 'list') {
      html = `<h2>${s.h}</h2><ul>${s.items.map(x => `<li>${x}</li>`).join('')}</ul>`;
    } else if (s.t === 'steps') {
      html = `<h2>${s.h}</h2><div class="steps">${s.steps.map(x => `<div class="step"><div class="num">${x.n}</div><h3>${x.h}</h3><p>${x.p}</p></div>`).join('')}</div>`;
    } else if (s.t === 'cta') {
      html = `<div class="kicker">The Entrepreneur Ride Along</div><h2>${s.h}</h2><p class="lead">${s.lead}</p><span class="btn">${s.btn}</span><p class="disclaimer">${s.disclaimer}</p>`;
    } else {
      html = `<h2>${s.h}</h2><p class="lead">${s.lead}</p>`;
    }
    el.innerHTML = html;
    deck.appendChild(el);
  });
</script>
</body>
</html>
