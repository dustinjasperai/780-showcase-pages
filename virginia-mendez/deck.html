<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leading On Your Own Terms: The 5C Method - Virginia Mendez</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e6dad3;        /* her warm taupe ground (brand.json, 2nd most used) */
    --panel:#fbf8f4;     /* warm white card, blended from her cream */
    --ink:#03214f;       /* her dominant deep navy */
    --rule:#d6c6bb;      /* deeper taupe hairline */
    --accent:#ef4da9;    /* her magenta accent */
    --muted:#5a6b86;
    --head:'Montserrat', system-ui, sans-serif;
    --body:'Lora', Georgia, serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 24px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:56px;top:40px;height:4px;
    width:var(--w,48px);background:var(--accent);border-radius:3px}
  .pad{padding-top:28px}
  .kicker{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(34px,5vw,58px);line-height:1.04;
    letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(26px,3.4vw,40px);line-height:1.1;
    margin-bottom:16px}
  .lead{font-size:clamp(18px,2vw,23px);color:var(--ink);max-width:40ch}
  .sub{font-size:clamp(17px,1.8vw,20px);color:var(--muted);max-width:52ch;margin-top:10px}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(28px,3.8vw,46px);line-height:1.12;
    max-width:24ch}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:18px;max-width:58ch}
  li{position:relative;padding-left:30px;margin:0 0 15px;font-size:clamp(16px,1.7vw,19px)}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .cnum{font-family:var(--head);font-weight:800;color:var(--accent);font-size:15px;
    letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}
  .foot{margin-top:26px;font-family:var(--head);font-weight:600;font-size:13px;color:var(--muted);
    letter-spacing:.04em}
  .disc{margin-top:22px;font-size:14px;color:var(--muted);max-width:60ch;font-style:italic}
  .by{font-family:var(--head);font-weight:600;color:var(--muted);font-size:15px;margin-top:22px}
  .cta h1{color:var(--ink)}
  .step{font-family:var(--head);font-weight:700;font-size:19px;color:var(--ink);margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', w:120, kicker:"A live masterclass", h:"Leading On Your Own Terms",
   lead:"Why the problem was never your confidence, and the five shifts that let you lead without shrinking.",
   by:"with Virginia Mendez"},

  {t:'audience', kicker:"Who this is for", h:"You are capable. You still go quiet.",
   sub:"For women and professionals who deliver, who others rely on, and who still find themselves second-guessing, softening, and shrinking in the rooms that matter most."},

  {t:'trap', kicker:"The advice you keep getting", h:"“Just be more confident.”",
   sub:"You have heard it from mentors, books, and your own head. You have tried. It works for a week. Then the same hesitation comes back, and now you feel like the problem is you."},

  {t:'reframe', w:160, kicker:"The reframe", big:"Confidence is not the <span class='a'>input</span>. It is the <span class='a'>output</span>.",
   sub:"The thing you are missing was never nerve. It is clarity about what is actually yours to carry, and what was handed to you by identity, context, and other people's expectations."},

  {t:'part', cnum:"Part one", h:"The real problem: expectations that were never yours",
   sub:"From an early age most of us are shaped to fit in rather than to lead. We absorb a quiet script about how to take up space, when to speak, and how much to want. Then we wonder why confidence will not stick."},

  {t:'cost', kicker:"What it costs", h:"The quiet tax",
   pts:["You edit yourself before you speak, so your best thinking stays in your head.",
        "You read the room so well that you disappear into it.",
        "You achieve the thing, and feel guilt or emptiness instead of momentum."]},

  {t:'part', cnum:"Part two", h:"The method: the 5C Framework",
   sub:"Five shifts, in order. The first three do the real work; confidence is what they produce. We will walk each one live, with a real decision you are facing."},

  {t:'c', cnum:"C1 - Clarity", h:"See it through a wider lens",
   sub:"Step back from your own situation and look at it the way you would look at a friend's. Most of the fog is not a lack of answers, it is being too close to see them."},

  {t:'c', cnum:"C2 - Context", h:"Name the forces shaping you",
   sub:"Identity, bias, and the expectations in the room are real, and they are not you. Once you can name the context, you stop mistaking it for a personal flaw and start working with it on purpose."},

  {t:'c', cnum:"C3 - Courage", h:"Reconnect with your own voice",
   sub:"Courage here is small and specific: one sentence said out loud, one boundary kept, one ask made. Separating who you are from what you were told to be is the bravest ordinary thing you will do."},

  {t:'c', cnum:"C4 - Confidence", h:"The result, not the starting line",
   sub:"When you are clear, you understand the context, and you have used your voice once, confidence arrives on its own. It is evidence you built, not a mood you tried to manufacture."},

  {t:'c', cnum:"C5 - Commitment", h:"Momentum without guilt",
   sub:"Commitment is choosing the next small rep on your own terms, not to prove anything. That is how momentum becomes something that lasts instead of something that burns you out."},

  {t:'thesis', w:200, kicker:"Why this works", big:"“Systems only change when the <span class='a'>people inside them</span> do.”",
   sub:"Culture, teams, and families do not shift from the policy down. They shift from the person out. Doing this work on yourself is the most practical lever you have, and it is where everything else starts."},

  {t:'part', cnum:"Part three", h:"What a real week looks like",
   sub:"Not a personality transplant. One decision run through the five Cs: get clarity, name the context, use your voice once, let confidence follow, and commit to the next rep. Repeat it, and the rooms change around you."},

  {t:'shift', kicker:"The shift", h:"From fitting in to leading on your own terms",
   pts:["You say the thing in the room instead of after it.",
        "You choose where you take up space, on purpose.",
        "You build momentum you do not have to apologise for."]},

  {t:'whyme', kicker:"Why me", h:"Virginia Mendez",
   sub:"Spanish-born coach, author, and speaker based in Northern Ireland. Degrees in Law and Business and a Master's in Leadership, with eight years at Deloitte and PwC before moving into this work. Author of Childhood Unlimited: Parenting Beyond the Gender Bias, and co-founder of The Feminist Shop. Over 20,000 adults and 5,000 children reached through workshops and talks. Warm, but honest."},

  {t:'for', kicker:"Who I work with", h:"Three kinds of people",
   pts:["Individuals who want clarity and their own voice back.",
        "Leaders and founders who want to lead with more presence and less performance.",
        "Teams and organisations ready to change from the person out, not the policy down."]},

  {t:'cta', cls:'cta', w:140, kicker:"Your next step", h:"Let's talk it through",
   step:"Book a free 30-minute chemistry call with Virginia to see if the 5C coaching is right for you.",
   disc:"This masterclass is educational. No income, role, or result is guaranteed. Results vary and depend on the work you put in."}
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  if(s.w) el.style.setProperty('--w', s.w + 'px');
  let html = '<div class="pad">';
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.cnum) html += '<div class="cnum">'+s.cnum+'</div>';
  if(s.h) html += '<h1>'+s.h+'</h1>';
  if(s.big) html += '<div class="big">'+s.big+'</div>';
  if(s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if(s.sub) html += '<p class="sub">'+s.sub+'</p>';
  if(s.pts){ html += '<ul>'; for(const p of s.pts) html += '<li>'+p+'</li>'; html += '</ul>'; }
  if(s.step) html += '<p class="step">'+s.step+'</p>';
  if(s.by) html += '<p class="by">'+s.by+'</p>';
  if(s.disc) html += '<p class="disc">'+s.disc+'</p>';
  html += '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
