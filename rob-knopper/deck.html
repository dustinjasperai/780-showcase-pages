<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Audition Machine Method — a live masterclass with Rob Knopper</title>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0c; --panel:#161617; --rule:#2a2a2c; --accent:#f57724;
    --ink:#f4f1ec; --muted:#a7a29b; --head:'Jost',sans-serif; --body:'Raleway',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:60px 58px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .k{font-family:var(--head);font-size:15px;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:600;font-size:52px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.12;letter-spacing:-.005em}
  .s{font-size:23px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  .big{font-family:var(--head);font-weight:600;font-size:62px;line-height:1.06}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:16px}
  li{font-size:22px;line-height:1.4;padding-left:34px;position:relative;color:var(--ink)}
  li::before{content:'';position:absolute;left:0;top:11px;width:14px;height:14px;border-radius:4px;
    border:2px solid var(--accent)}
  li b{color:var(--accent);font-weight:600}
  .phase{font-family:var(--head);font-size:19px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);font-weight:700}
  .cta-box{border:1.5px solid var(--accent);border-radius:14px;padding:26px 30px;margin-top:30px;max-width:46ch}
  .cta-box .step{font-family:var(--head);font-size:26px;font-weight:600;color:var(--ink)}
  .cta-box .where{font-size:20px;color:var(--accent);margin-top:8px;font-weight:600}
  .disclaimer{font-size:15px;color:var(--muted);margin-top:26px;line-height:1.5;max-width:60ch}
  .foot{font-family:var(--head);font-size:14px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);position:absolute;right:40px;bottom:26px}
  .num{position:absolute;left:40px;bottom:24px;font-family:var(--head);font-size:14px;color:var(--rule)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',k:'A live masterclass',h:'The Audition Machine Method',s:'How to win an orchestra audition on a system, not on talent. Live, with Rob Knopper, percussionist with the Metropolitan Opera Orchestra.'},
  {t:'for',k:'Who this is for',h:'For orchestra-track musicians with an audition on the calendar',items:['You have a list and a date, and the clock is running','You practice hard but the result swings wildly','You want a process you trust, not another pep talk']},
  {t:'trap',k:'The trap',h:'You practice harder. You still crack in the room.',s:'More hours is the default answer, and it is the wrong one. Hours without a system just rehearse your current ceiling.'},
  {t:'reframe',k:'The reframe',big:'Talent is not the variable. <span class="a">A repeatable system is.</span>',s:'I lost roughly 50 auditions before I won the Met. What changed was not talent. It was the process.'},
  {t:'section',k:'Part one',h:'Why most preparation fails',items:['Practice is random, so progress cannot compound','There is no honest feedback loop, so blind spots survive','Audition day is the first real test, which is far too late']},
  {t:'section',k:'Part two',h:'The 4 phases',s:'The same sequence I run on every excerpt, for every list. Nothing here depends on being gifted.'},
  {t:'phase',p:'Phase 0',h:'Excerpt research',items:['Study who plays each excerpt, and how they differ','Crowdsource reference recordings so you know the target','Decide the interpretation before you drill a single note']},
  {t:'phase',p:'Phase 1',h:'Learn the notes',items:['Deep muscle-memorization, so the notes hold under pressure','ROAM and a micro-to-macro approach to build from the detail up','The goal is a thousand ways to play it, then one choice']},
  {t:'phase',p:'Phase 2',h:'Self-record',items:['Record every take and listen like a stranger','The recording is the honest feedback the practice room hides','Fix one thing, re-take, bank the keeper']},
  {t:'phase',p:'Phase 3',h:'Mock auditions',items:['Screen up, full dress run, scored like a real committee','Repeat the rep until the nerves have nothing new to say','This is where audition-day comfort is manufactured']},
  {t:'section',k:'The core idea',h:'Comfort on the day is built, not born',s:'23 or more structured mock auditions do for the mind what slow practice does for the hands. The room stops being a surprise.'},
  {t:'tools',k:'The lens',h:'Train like a 5-tool player',s:'A committee is grading several things at once. Train them on purpose instead of hoping.',items:['Rhythm and time','Sound and color','Intonation and control','Musical intention','Consistency under pressure']},
  {t:'week',k:'Part three',h:'What a week in the system looks like',items:['Research and interpretation locked early','Daily practice sessions aimed at one fix at a time','A recorded take that moves the standard forward','A weekly mock that rehearses the room, not just the notes']},
  {t:'why',k:'Why listen to me',h:'The process came from losing, then solving it',items:['Percussionist, Metropolitan Opera Orchestra since 2011','Juilliard graduate, New World Symphony fellow','Taught the method to more than 500 musicians since 2015']},
  {t:'objection',k:'The honest part',h:'This is work, not a shortcut',s:'The system does not remove the reps. It makes every rep count, and it tells you the truth sooner. That is the whole edge.'},
  {t:'recap',k:'In one view',h:'The method, start to finish',items:['Phase 0 research, Phase 1 notes, Phase 2 recording, Phase 3 mock','Mock mastery to build audition-day comfort','The 5-tool lens so nothing is left to chance']},
  {t:'cta',k:'Your next step',h:'Run the full system with me',step:'Join the next Audition Machine cohort',where:'robknopper.com',s:'Eight weeks, weekly live mock auditions, and the full 4-phase method applied to your list.',disc:'This masterclass is educational. No result is guaranteed. Results vary and depend on your own practice, repertoire, and the auditions you enter.'}
];
const deck=document.getElementById('deck');
S.forEach((sl,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let html='';
  if(sl.k) html+='<div class="k">'+sl.k+'</div>';
  if(sl.p) html+='<div class="phase">'+sl.p+'</div>';
  if(sl.big) html+='<div class="big">'+sl.big+'</div>';
  else if(sl.h) html+=(sl.t==='title'?'<h1>':'<h2>')+sl.h+(sl.t==='title'?'</h1>':'</h2>');
  if(sl.s) html+='<div class="s">'+sl.s+'</div>';
  if(sl.items){html+='<ul>';sl.items.forEach(it=>{html+='<li>'+it+'</li>';});html+='</ul>';}
  if(sl.t==='cta'){
    html+='<div class="cta-box"><div class="step">'+sl.step+'</div><div class="where">'+sl.where+'</div></div>';
    html+='<div class="disclaimer">'+sl.disc+'</div>';
  }
  html+='<div class="num">'+(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0')+'</div>';
  html+='<div class="foot">Rob Knopper · Auditionhacker</div>';
  el.innerHTML=html;
  deck.appendChild(el);
});
</script>
</body>
</html>
