<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Story of Transformation — a masterclass with Jen Grisanti</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,700;1,400&family=Public+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1c0b2b;        /* deep plum, darkened from brand #42175e */
    --panel:#2b1240;     /* mid plum */
    --rule:#4a2168;      /* brand plum family, lightened */
    --accent:#c58ce0;    /* orchid tint of brand plum #42175e */
    --ink:#f4eef8;       /* near-white, matches site white-on-plum */
    --muted:#bda7cf;
    --head:"Spectral",Georgia,serif;
    --body:"Public Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;
    justify-content:center;padding:9vh 8vw;position:relative;border-bottom:1px solid var(--rule)}
  .slug{font-family:var(--body);font-weight:700;font-size:.72rem;letter-spacing:.28em;
    text-transform:uppercase;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.05;
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.1}
  .lead{font-family:var(--head);font-style:italic;font-size:clamp(1.3rem,2.6vw,1.9rem);
    color:var(--muted);margin-top:1.4rem;max-width:30ch}
  p{font-size:clamp(1.05rem,1.5vw,1.3rem);max-width:46ch;margin-top:1.2rem;color:var(--ink)}
  p.wide{max-width:60ch}
  .big{font-family:var(--head);font-size:clamp(1.8rem,3.4vw,2.6rem);line-height:1.2;
    max-width:26ch;margin-top:1rem}
  .em{color:var(--accent)}
  ul{list-style:none;margin-top:1.8rem;display:grid;gap:1rem;max-width:52ch}
  li{font-size:clamp(1.05rem,1.6vw,1.35rem);padding-left:1.6rem;position:relative}
  li::before{content:"";position:absolute;left:0;top:.6em;width:.6rem;height:.6rem;
    background:var(--accent);border-radius:50%}
  .steps{display:grid;gap:.9rem;margin-top:1.8rem;max-width:40ch}
  .step{background:var(--panel);border:1px solid var(--rule);border-radius:12px;
    padding:1rem 1.2rem}
  .step b{font-family:var(--head);color:var(--accent);font-size:1.15rem}
  .cred{display:grid;gap:.7rem;margin-top:1.6rem;max-width:54ch}
  .cred span{color:var(--muted);font-size:1.05rem}
  .foot{position:absolute;bottom:3.5vh;left:8vw;color:var(--muted);font-size:.8rem;
    letter-spacing:.04em}
  .disc{margin-top:2rem;color:var(--muted);font-size:.9rem;max-width:52ch}
  .cta h1{max-width:20ch}
  .btn{display:inline-block;margin-top:2rem;background:var(--accent);color:#1c0b2b;
    font-weight:700;padding:.9rem 1.8rem;border-radius:999px;font-size:1.1rem}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:"title", cls:"", html:`
    <div class="slug">A live masterclass</div>
    <h1>The Story of Transformation</h1>
    <div class="lead">Finding the gold in your own story.</div>
    <p class="wide">A live hour on writing the kind of script a reader cannot put down, with Jen Grisanti.</p>
  `},
  {t:"who", cls:"", html:`
    <div class="slug">INT. WHO THIS IS FOR</div>
    <h2>For the writer whose pages are clean and the script still gets passed.</h2>
    <p>You learned the structure. You hit the beats. You got the notes back anyway: "well made, didn't connect." This hour is for you.</p>
  `},
  {t:"trap", cls:"", html:`
    <div class="slug">THE TRAP</div>
    <h2>You have been told it is a structure problem.</h2>
    <p class="big">It almost never is. I read thousands of scripts from the buyer's side of the desk, and the ones that stalled were rarely broken. They were <span class="em">empty</span>.</p>
  `},
  {t:"reframe", cls:"", html:`
    <div class="slug">THE REFRAME</div>
    <h2>Readers do not fall for plots. They fall for people.</h2>
    <p>A perfect outline makes a script correct. Emotional truth makes it unforgettable. That is the one thing a template can never hand you.</p>
  `},
  {t:"part", cls:"", html:`
    <div class="slug">PART ONE</div>
    <h1>The core problem</h1>
    <div class="lead">Why technically right still feels wrong.</div>
  `},
  {t:"body", cls:"", html:`
    <div class="slug">EMOTIONAL TRUTH</div>
    <h2>The difference between a script we believe and one we only follow.</h2>
    <p class="wide">We believe a plot easily. We rarely believe the person inside it. When the feeling underneath the scenes is borrowed, the reader senses it on page ten, long before anything is "wrong."</p>
  `},
  {t:"body", cls:"", html:`
    <div class="slug">THE REAL GAP</div>
    <h2>Your story is not missing a beat. It is missing a wound.</h2>
    <p>The fix is not more structure. It is going back to the feeling that made you want to tell this story in the first place, and putting that on the page.</p>
  `},
  {t:"part", cls:"", html:`
    <div class="slug">PART TWO</div>
    <h1>The method</h1>
    <div class="lead">Three tools I teach every writer I coach.</div>
  `},
  {t:"framework", cls:"", html:`
    <div class="slug">TOOL ONE</div>
    <h2>The Dilemma</h2>
    <p>Every story that holds us is built on one. It is the engine, and most drafts leave it offstage.</p>
    <div class="steps">
      <div class="step"><b>1. Trigger</b><br>An incident breaks the normal world open.</div>
      <div class="step"><b>2. Dilemma</b><br>It forces your character into an impossible choice.</div>
      <div class="step"><b>3. Goal</b><br>The goal is born out of the dilemma, not bolted on.</div>
      <div class="step"><b>4. Pivot</b><br>Every turn points back to that goal.</div>
    </div>
  `},
  {t:"body", cls:"", html:`
    <div class="slug">WHY IT WORKS</div>
    <h2>Stem the goal from the dilemma and the whole story pulls in one direction.</h2>
    <p class="wide">When the audience understands what your character stands to lose, they lean in and they stay. The dilemma is what keeps them in the chair.</p>
  `},
  {t:"framework", cls:"", html:`
    <div class="slug">TOOL TWO</div>
    <h2>The Triangle of the Wound</h2>
    <p class="wide">The character carries an internal wound. The wound sets up an internal dilemma. The external plot becomes the arena where they finally get the chance to heal it.</p>
    <div class="steps">
      <div class="step"><b>Wound</b><br>The old hurt they carry in.</div>
      <div class="step"><b>Internal dilemma</b><br>What the wound makes them afraid to do.</div>
      <div class="step"><b>External plot</b><br>The events that force the choice, and the healing.</div>
    </div>
  `},
  {t:"framework", cls:"", html:`
    <div class="slug">TOOL THREE</div>
    <h2>Story Line: finding gold in your own life</h2>
    <p class="wide">This is not autobiography. It is taking the truth of what you have actually felt, and blending it into the fiction. Your material is already yours. Most writers walk right past it.</p>
  `},
  {t:"body", cls:"", html:`
    <div class="slug">THE PRACTICE</div>
    <h2>Mine the feeling first. Add the fiction second.</h2>
    <p>Start from a real wound, then let the characters and the world carry it somewhere invented. That order is what separates a story that lands from one that merely happens.</p>
  `},
  {t:"part", cls:"", html:`
    <div class="slug">PART THREE</div>
    <h1>The scene, rewritten</h1>
    <div class="lead">And why this comes from the buyer's chair.</div>
  `},
  {t:"body", cls:"", html:`
    <div class="slug">INT. ONE SCENE</div>
    <h2>The same scene, before and after.</h2>
    <p class="wide">Before: two people argue and the plot advances. After: the same argument, but each line is driven by the dilemma and the wound underneath it. Nothing in the structure changed. Everything we feel did.</p>
  `},
  {t:"body", cls:"", html:`
    <div class="slug">TELLING AND SELLING</div>
    <h2>Craft gets you written. The room gets you bought.</h2>
    <p class="wide">The same truth that makes a script land makes a pitch land: the logline, the meeting, the way you tell them why only you could write this. Telling and selling are the same skill wearing two coats.</p>
  `},
  {t:"why", cls:"", html:`
    <div class="slug">WHY ME</div>
    <h2>I spent twenty years deciding which stories got made.</h2>
    <div class="cred">
      <span>Began with Aaron Spelling, my mentor for twelve years.</span>
      <span>Ran Current Programs at Spelling Television across 15+ primetime series.</span>
      <span>Vice President of Current Programming at CBS / Paramount.</span>
      <span>Author of Story Line, TV Writing Tool Kit, and Change Your Story, Change Your Life.</span>
    </div>
    <p>I have sat where the yes and the no get made. These are the tools I wish every writer had brought into the room.</p>
  `},
  {t:"recap", cls:"", html:`
    <div class="slug">WHAT YOU LEAVE WITH</div>
    <h2>Three tools, one shift.</h2>
    <ul>
      <li>The Dilemma: the engine your draft has been missing.</li>
      <li>The Triangle of the Wound: characters a reader cannot look away from.</li>
      <li>Story Line: the gold already sitting in your own life.</li>
    </ul>
  `},
  {t:"cta", cls:"cta", html:`
    <div class="slug">YOUR NEXT STEP</div>
    <h1>Let's tell your story.</h1>
    <p class="wide">If this is the way you want to work, the next step is coaching: we take your pages and your dilemma and shape the script you were always trying to write.</p>
    <a class="btn" href="https://www.jengrisanti.com/consulting-coaching">Work with Jen</a>
    <p class="disc">Educational content only. Outcomes depend on your own work and many factors outside any program. No sale, representation, career result, or income is guaranteed. Results vary.</p>
  `}
];
const root = document.getElementById("deck");
root.innerHTML = S.map(s => `<section class="slide ${s.cls||''}">${s.html}<div class="foot">The Story of Transformation · Jen Grisanti</div></section>`).join("");
</script>
</body>
</html>
