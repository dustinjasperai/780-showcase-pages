<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Formula for Public Speaking — a live masterclass with Dr. Tim Newman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;800&family=Cabin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf7;        /* warm white ground — his light-scheme site */
    --panel:#ffffff;
    --rule:#e3e8ee;
    --ink:#006494;       /* his deep blue (ranked #2, 24 uses) — heading ink */
    --body:#2c3a44;      /* dark slate for body legibility on light ground */
    --accent:#00cea6;    /* his teal button accent (#00cea6) */
    --blue:#00a6fb;      /* his dominant site blue (ranked #1) — secondary */
    --head:'Raleway',system-ui,sans-serif;
    --text:'Cabin',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--body);font-family:var(--text)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:48px 44px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 3px rgba(0,60,90,.05)}
  .kicker{font-family:var(--head);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;color:var(--ink);font-size:44px;line-height:1.08;
    letter-spacing:-.01em;margin-bottom:16px}
  h2{font-family:var(--head);font-weight:700;color:var(--ink);font-size:32px;line-height:1.14;
    margin-bottom:14px}
  p{font-size:19px;line-height:1.55;margin-bottom:12px;max-width:60ch}
  .lead{font-size:22px;color:var(--ink)}
  .big{font-size:30px;font-family:var(--head);font-weight:600;color:var(--ink);line-height:1.25}
  ul{margin:8px 0 0 22px}
  li{font-size:19px;line-height:1.5;margin-bottom:10px}
  .num{font-family:var(--head);font-weight:800;font-size:60px;color:var(--accent);line-height:1}
  .step{display:flex;gap:22px;align-items:flex-start}
  .step .num{min-width:74px}
  .foot{margin-top:auto;padding-top:22px;font-size:14px;color:#7c8a93;font-family:var(--head);
    letter-spacing:.04em}
  .rulebar{height:4px;width:64px;background:var(--accent);border-radius:3px;margin:0 0 20px}
  .cta h1{font-size:40px}
  .disc{margin-top:26px;font-size:14px;color:#7c8a93;max-width:64ch;line-height:1.5}
  .btn{display:inline-block;margin-top:20px;background:var(--accent);color:#04322a;
    font-family:var(--head);font-weight:700;font-size:18px;padding:14px 26px;border-radius:10px}
  .credit li{margin-bottom:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Dr. Tim Newman',
   h:'Confident on Stage in Four Steps',
   p:'The Formula for Public Speaking. Present with confidence by preparing on purpose, not by hoping the nerves stay away.'},

  {t:'who', kicker:'Who this is for',
   h:'For professionals and students who go blank when it counts',
   p:'The talk you have been dreading. The interview, the pitch, the presentation where everyone is looking at you and your mind empties out. You know your material. That has never been the problem.'},

  {t:'trap', kicker:'The trap',
   h:'You were told confidence is something you either have or you do not',
   p:'So every time you froze, you took it as proof that you are just not a natural. You practiced harder, watched more talks, and still felt the same panic the moment it was your turn.',
   big:'That belief is the thing keeping you stuck.'},

  {t:'reframe', kicker:'The reframe',
   h:'Confidence on stage is prepared, not inherited',
   p:'The speakers who look calm are not braver than you. They are more prepared than you, in a specific way. They run the same handful of steps every time, so by the time they stand up there is nothing left to be afraid of.'},

  {t:'problem', kicker:'Part one: the real problem',
   h:'Winging it is the reason you go blank',
   p:'Without a repeatable way to prepare, every talk starts from zero and every talk is a gamble. Some go fine. Some fall apart. You never know which one you are walking into, and that uncertainty is exactly what your nerves feed on.'},

  {t:'cost', kicker:'What it costs',
   h:'The room remembers who could say it well',
   p:'The promotion, the client, the grade, the offer. They go to the person who could stand up and make the case, not always the person who knew the most. Avoiding the skill does not make the cost go away. It just moves it out of sight.'},

  {t:'sectionbreak', kicker:'Part two: the method',
   h:'The Formula for Public Speaking',
   p:'Four parts, run in order, every time. It turns preparation from a vague wish into a checklist you can actually follow.'},

  {t:'step', kicker:'Step one', num:'1', h:'Audience',
   p:'Before a word of the talk exists, you decide who is in the room and what they actually need from you. Every later choice answers to this. Speak to the wrong audience perfectly and you still lose the room.'},

  {t:'step', kicker:'Step two', num:'2', h:'Content',
   p:'Now you choose what to say for that specific audience, and just as importantly what to cut. Most nervous talks are overloaded. The Formula forces you to keep only what serves the room and drop the rest.'},

  {t:'step', kicker:'Step three', num:'3', h:'Expectations',
   p:'You shape the material into the form the room expects, the format that fits the moment, whether that is a keynote, a pitch, a lesson, or a set of answers under pressure. Meeting the expected shape is what makes you feel in control.'},

  {t:'step', kicker:'Step four', num:'4', h:'Script',
   p:'Finally you structure it, rehearse it, and refine the delivery until the words are worn in. By the time you stand up, there is no blank to fall into. You have already been here, out loud, more than once.'},

  {t:'apply', kicker:'Part three: on the day',
   h:'The Q&A is just Audience and Content, prepared',
   p:'The part most people fear most, the unscripted questions, is not a separate skill. It is the same Formula run on a smaller loop. When you know your audience and your content cold, the questions stop being a threat and start being the easiest part.'},

  {t:'after', kicker:'The after state',
   h:'From "I hate public speaking" to "I have a system for this"',
   p:'You do not become a different person. You become a prepared one. The nerves may still show up in the hallway, but they have nowhere to go once you are speaking, because every step has already been handled.'},

  {t:'why', kicker:'Why learn it from me',
   h:'Three decades teaching people to communicate',
   credit:['Doctorate, and close to thirty years teaching communication and sport management.',
     'Taught on four continents, in the United States, Botswana, Malaysia, and Thailand.',
     'Author of one of the pioneering books on social media in sport marketing.',
     'Coached communicators and athletes from the high school level to the professional level.',
     'Host of the Speaking with Confidence podcast, where the Formula gets worked through in the open.']},

  {t:'recap', kicker:'The whole method, in one line',
   h:'Audience. Content. Expectations. Script.',
   p:'Decide who you are speaking to, choose what serves them, shape it to fit the moment, then structure and rehearse it. Run those four every time and confidence stops being luck.'},

  {t:'cta', kicker:'Your next step',
   h:'Learn the Formula and use it on your next talk',
   p:'If you want to go deeper than this session, The Formula for Public Speaking is a step by step program you can work through at your own pace, with the option of one on one coaching when you want a set of eyes on a specific talk.',
   btn:'Start with The Formula for Public Speaking',
   disc:'Educational content only. This masterclass teaches a preparation method for public speaking. Results depend on the work you put in and vary from person to person. No specific outcome is promised or guaranteed.'}
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t === 'cta' ? 'cta' : '');
  let html = '';
  if (s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  html += '<div class="rulebar"></div>';
  if (s.t === 'step'){
    html += '<div class="step"><div class="num">'+s.num+'</div><div><h1>'+s.h+'</h1><p>'+s.p+'</p></div></div>';
  } else {
    if (s.h) html += (s.t==='sectionbreak' || s.t==='title' || s.t==='cta' ? '<h1>' : '<h2>')+s.h+(s.t==='sectionbreak'||s.t==='title'||s.t==='cta'?'</h1>':'</h2>');
    if (s.p) html += '<p class="lead">'+s.p+'</p>';
  }
  if (s.big) html += '<p class="big">'+s.big+'</p>';
  if (s.credit){ html += '<ul class="credit">'; for (const c of s.credit) html += '<li>'+c+'</li>'; html += '</ul>'; }
  if (s.btn) html += '<span class="btn">'+s.btn+'</span>';
  if (s.disc) html += '<div class="disc">'+s.disc+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
