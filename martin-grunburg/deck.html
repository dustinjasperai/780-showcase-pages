<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Your Goals Keep Slipping - The Habit Factor Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@500;600;700&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f0;
    --panel:#ffffff;
    --rule:#e6ddcb;
    --ink:#222222;
    --accent:#a86500;
    --gold:#bb8100;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",system-ui,sans-serif;line-height:1.5}
  .wrap{max-width:900px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:46px 44px;margin:18px 0;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .kick{font-family:"Alegreya Sans";text-transform:uppercase;letter-spacing:.14em;font-size:13px;font-weight:700;color:var(--accent);margin-bottom:14px}
  h1{font-family:"Lora",serif;font-size:40px;line-height:1.12;font-weight:700;margin-bottom:16px}
  h2{font-family:"Lora",serif;font-size:29px;line-height:1.18;font-weight:600;margin-bottom:14px}
  p{font-size:19px;margin-bottom:12px;max-width:62ch}
  .lead{font-size:22px}
  .big{font-family:"Lora",serif;font-size:34px;line-height:1.2;font-weight:600}
  ul{margin:8px 0 0 22px}
  li{font-size:19px;margin-bottom:10px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:10px}
  .cell{border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:10px;padding:16px 18px;background:#fffdf8}
  .cell h3{font-family:"Lora",serif;font-size:20px;color:var(--accent);margin-bottom:6px}
  .cell p{font-size:17px;margin:0}
  .rail{display:inline-block;background:var(--accent);color:#fff;font-weight:700;border-radius:999px;padding:4px 14px;font-size:14px;letter-spacing:.04em}
  .disc{font-size:14px;color:#7a6a4a;border-top:1px solid var(--rule);margin-top:22px;padding-top:14px;max-width:70ch}
  .cta h1{color:var(--accent)}
  .foot{text-align:center;color:#9a8c6c;font-size:13px;margin-top:30px;font-family:"Lora",serif}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<div class="foot">The Habit Factor&reg; &middot; Habits 2 Goals &middot; Martin Grunburg</div>
<script>
const S = [
  {t:'title', kick:'A LIVE MASTERCLASS WITH MARTIN GRUNBURG', h:'Why Your Goals Keep Slipping', p:'And the one habit shift that would finally hold them in place.'},
  {t:'promise', kick:'THE PROMISE', h:'By the end of this hour', p:'You will know how to turn a goal you keep abandoning into a four-week tracked experiment that most people can actually finish.'},
  {t:'forwho', kick:'WHO THIS IS FOR', h:'The ambitious and the stuck', p:'You set real goals. You start strong. Then a few weeks in, the habit quietly disappears and you are back where you began, blaming your discipline.', list:['People who set big goals and keep restarting them','Professionals and coaches who want a method, not motivation','Anyone whose focus scatters before the goal lands']},
  {t:'trap', kick:'THE TRAP', h:'You do not have a goal problem', p:'You have a habit-alignment problem. The goal is clear. What is missing is the small set of daily habits that would actually carry you there, installed on purpose.'},
  {t:'reframe', kick:'THE REFRAME', big:'The feed tells you to forget goals and trust the system. That is exactly backwards.', p:'The goal comes first. Then you engineer the few habits that serve it. A habit with no goal behind it is just a chore you will drop.'},
  {t:'part', rail:'PART ONE', h:'Why willpower keeps losing'},
  {t:'point', kick:'THE REAL MECHANISM', h:'Willpower is a terrible plan', p:'Every time you rely on motivation to show up, you are betting against a bad day. The people who keep habits do not have more willpower. They have a structure that does not need it.'},
  {t:'point', kick:'THE MISSING LINK', h:'A goal without habits is a wish', p:'Goals set direction. Habits cover the distance. When the two are not connected, you drift, and drift feels like failure even when you are trying hard.'},
  {t:'part', rail:'PART TWO', h:'The Habit Factor method'},
  {t:'framework', kick:'THE CORE IDEA', h:'Align the habits to the goal', p:'Start from the goal. Identify the one or two supportive habits that drive it more than anything else. Build those deliberately. That alignment is the Habit Factor.'},
  {t:'model', kick:'P.A.R.R.', h:'Build a habit like an experiment', p:'Four weeks, four steps, repeated. You are not hoping. You are running a tracked experiment on yourself.', cells:[['Plan','Pick your target days per week and the smallest version that still counts.'],['Act','Do the rep. Minimum effort beats a perfect day you skip.'],['Record','Log a 1 for a win, a 0 for a miss. Every day, no judgment.'],['Reassess','After four weeks, read the data and adjust the plan.']]},
  {t:'point', kick:'THE SHIFT', h:'A 0 is data, not a verdict', p:'Most people quit on the first missed day because they read it as proof they cannot change. In P.A.R.R., a 0 is just information that tunes the next cycle. The tracking removes the shame.'},
  {t:'model', kick:'THE UNIFIED BEHAVIOR MODEL', h:'Four elements decide every behavior', p:'When a habit will not stick, one of these four is working against you. Name it and you can move it.', cells:[['Stories','What you tell yourself about who you are and what is possible.'],['Emotions','What you feel in the moment the habit is due.'],['Behaviors','What you actually do, and the cues around it.'],['Environment','What surrounds you and makes the habit easy or hard.']]},
  {t:'point', kick:'THE DIAGNOSTIC', h:'Find the one that is stalling you', p:'The Behavior Echo-System maps your goal across those four elements so you stop guessing. Usually one element is the real blocker. Change it and the whole goal starts to move.'},
  {t:'part', rail:'PART THREE', h:'What four weeks looks like'},
  {t:'looks', kick:'A WORKED EXAMPLE', h:'One goal, one aligned habit', p:'Say the goal is to write a book. The aligned habit is not "write more." It is 25 minutes before email, four mornings a week, logged 1 or 0. By week four the data tells you whether the plan fits your life, and you adjust rather than quit.'},
  {t:'looks', kick:'WHY IT HOLDS', h:'Small, measured, and honest', p:'The habit is small enough to survive a bad day, measured so progress is visible, and reassessed so it bends to reality instead of breaking. That is why people finish.'},
  {t:'whyme', kick:'WHY LISTEN TO ME', h:'Two decades on this one question', p:'I am Martin Grunburg. I wrote The Habit Factor, the first book and app to teach aligning habits to goals, built the Unified Behavior Model, and have hosted the Habits 2 Goals podcast for 600-plus episodes. This method is what I have spent twenty years refining.'},
  {t:'recap', kick:'THE WHOLE THING IN ONE LINE', big:'Pick the goal. Align the habit. Track it with P.A.R.R. Reassess, do not quit.', p:'Everything else is detail.'},
  {t:'cta', kick:'YOUR NEXT STEP', h:'Join the 28 Day Breakthrough', p:'If you want to run this with me, start to finish, the next cohort of the 28 Day Breakthrough walks you through a full P.A.R.R. cycle on the goal that matters most to you right now.', disc:'This masterclass is educational. No specific result or outcome is guaranteed. Results vary based on your effort, consistency, and circumstances.'}
];
const el = document.getElementById('deck');
for (const s of S){
  const d = document.createElement('section');
  d.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let h = '';
  if (s.rail) h += '<span class="rail">'+s.rail+'</span><div style="height:12px"></div>';
  if (s.kick) h += '<div class="kick">'+s.kick+'</div>';
  if (s.h) h += '<h1>'+s.h+'</h1>';
  if (s.big) h += '<p class="big">'+s.big+'</p>';
  if (s.p) h += '<p class="lead">'+s.p+'</p>';
  if (s.list){ h += '<ul>'; for (const li of s.list) h += '<li>'+li+'</li>'; h += '</ul>'; }
  if (s.cells){ h += '<div class="grid">'; for (const c of s.cells) h += '<div class="cell"><h3>'+c[0]+'</h3><p>'+c[1]+'</p></div>'; h += '</div>'; }
  if (s.disc) h += '<div class="disc">'+s.disc+'</div>';
  d.innerHTML = h;
  el.appendChild(d);
}
</script>
</body>
</html>
