<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train With Your Body, Not Against It: The Breakthrough Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;700;800&family=PT+Sans:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    /* Palette derived from getrunningcoaching.com (brand.json), see 01-deep-research.md ## Palette */
    --bg:#eef2ec;        /* sage-tinted ground, from brand sage #809d85 lightened+desaturated */
    --panel:#fbfcfa;
    --rule:#dde3d8;
    --ink:#1a1a1a;       /* their dominant text color, verbatim */
    --muted:#5c5850;
    --accent:#809d85;    /* sage green, brand hex (ranked, 4 uses) */
    --accent2:#516a7b;   /* slate, brand hex (ranked, 4 uses) */
    --display:'Raleway',system-ui,sans-serif;   /* their brand display face */
    --body:'PT Sans',system-ui,sans-serif;      /* their brand body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .stage{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:6vh 6vw}
  .slide{width:min(1000px,100%);background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;padding:clamp(34px,6vw,72px);box-shadow:0 18px 50px rgba(26,26,26,.06);position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--display);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent2)}
  .cyclebar{display:flex;gap:6px;margin:18px 0 4px}
  .cyclebar span{height:6px;flex:1;border-radius:6px;background:var(--rule)}
  .cyclebar span.on{background:var(--accent)}
  h1{font-family:var(--display);font-weight:800;line-height:1.04;font-size:clamp(2.1rem,5.4vw,3.7rem);letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:800;line-height:1.08;font-size:clamp(1.7rem,4vw,2.7rem);letter-spacing:-.01em}
  h3{font-family:var(--display);font-weight:700;font-size:clamp(1.15rem,2.4vw,1.5rem)}
  p{font-size:clamp(1.02rem,1.7vw,1.22rem);line-height:1.6;color:var(--ink);max-width:66ch}
  p.lead{font-size:clamp(1.15rem,2vw,1.4rem);color:var(--muted)}
  .sub{margin-top:16px;color:var(--muted)}
  .big{font-family:var(--display);font-weight:800;color:var(--accent2);font-size:clamp(2.4rem,7vw,4.4rem);line-height:1}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px}
  ul li{position:relative;padding-left:30px;font-size:clamp(1.02rem,1.7vw,1.2rem);line-height:1.5;max-width:64ch}
  ul li::before{content:"";position:absolute;left:0;top:.5em;width:12px;height:12px;border-radius:50%;
    border:2px solid var(--accent)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:26px}
  .card{border:1px solid var(--rule);border-radius:12px;padding:22px 24px;background:var(--bg)}
  .card h3{color:var(--accent2)}
  .card p{font-size:1rem;color:var(--muted);margin-top:8px}
  .pill{display:inline-block;font-family:var(--display);font-weight:700;font-size:.8rem;letter-spacing:.05em;
    color:#fff;background:var(--accent);border-radius:999px;padding:6px 14px}
  .meta{margin-top:34px;display:flex;align-items:center;gap:14px;color:var(--muted);font-size:.98rem}
  .meta b{color:var(--ink);font-family:var(--display)}
  .disc{margin-top:26px;font-size:.86rem;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .count{position:absolute;right:22px;bottom:16px;font-family:var(--display);font-size:.8rem;color:var(--muted)}
  .nav{position:fixed;right:18px;bottom:18px;display:flex;gap:8px;z-index:20}
  .nav button{font-family:var(--display);font-weight:700;border:1px solid var(--rule);background:var(--panel);
    color:var(--ink);border-radius:9px;padding:9px 15px;cursor:pointer;font-size:.95rem}
  .nav button:hover{border-color:var(--accent)}
  .hide{display:none}
</style>
</head>
<body>
<div class="stage"><div class="slide" id="slide"></div></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
  {t:'title',kicker:'A masterclass for women runners',h:'Train With Your Body,<br>Not Against It',sub:'The Breakthrough Method for training smart through every phase of your month, your season, and your life.',by:'Neely Spence Gracey · Get Running'},
  {t:'content',kicker:'Who this is for',h:'You already do the work.',lead:'You show up for the long runs. You follow the plan. You want a real PR at your next 5K, 10K, half or marathon.',body:'This is for the woman runner who is tired of grinding through a plan that was never built for her body, and wants to train in a way that finally fits.'},
  {t:'content',kicker:'The trap',h:'You did everything the plan said.',lead:'And still hit a wall.',body:'The plateau that will not move. The nagging injury that keeps coming back. The weeks where your body feels like a different engine than it did two weeks ago, and the plan acts like nothing changed.'},
  {t:'statement',kicker:'The reframe',big:'The plan was not built for you.',body:'Most classic training plans were built on decades of research done on men, and passed down with one piece of advice for young female runners: go train with the boys. I got that advice too. It took me years to see everything it left out.'},
  {t:'section',kicker:'Part one',h:'The core problem',sub:'One method for every body, every week, every life stage.'},
  {t:'content',kicker:'Part one',h:'Your physiology is not a rounding error.',body:'Your hormones shift across the month. Your needs shift across pregnancy, postpartum, and the seasons of raising a family. A fixed, one-size-fits-all mileage block treats all of that as noise. It is not noise. It is the signal that tells a smart runner when to push and when to build.'},
  {t:'cards',kicker:'What it costs',h:'Training against your body has a price.',cards:[
    {h:'Burnout',p:'Pushing hard on the weeks your body needed to build.'},
    {h:'Injury',p:'The same strain, the same layoff, on repeat.'},
    {h:'Plateaus',p:'More volume, same times, less joy.'},
    {h:'Quitting',p:'Deciding the wall is you. It is not.'}]},
  {t:'section',kicker:'Part two',h:'The Breakthrough Method',sub:'Four pillars that let you train with your body instead of against it.'},
  {t:'pillar',n:1,kicker:'Pillar one',h:'Cycle-aware training',body:'We map your training to your body instead of the calendar alone. You learn which phases of your month are built for the hard, fast work and which are built for strength and recovery, so every workout lands when your body can actually absorb it.'},
  {t:'pillar',n:2,kicker:'Pillar two',h:'Breakthrough Goals',body:'A big race is a dream until it becomes a set of small, tangible actions. Breakthrough Goals turn the wall in front of you into the next concrete step in this week of training, so the plan always tells you what to do next.'},
  {t:'pillar',n:3,kicker:'Pillar three',h:'Mind and mantra',body:'The last mile is a mental event. We build the focus tools, the mindfulness habits, and the personal mantras you reach for when it gets hard, so your head is trained as deliberately as your legs.'},
  {t:'pillar',n:4,kicker:'Pillar four',h:'Strength, mobility and injury-proofing',body:'Strength, mobility, breathing and return-to-running work are woven into the plan from day one, not bolted on after something hurts. This is how you keep the training streak that actually produces the PR.'},
  {t:'section',kicker:'Part three',h:'Inside a Breakthrough block',sub:'A block of training that moves with you.'},
  {t:'content',kicker:'Part three',h:'A training block that breathes.',body:'Instead of a flat wall of mileage, your block moves in phases: build, sharpen, and recover, layered on top of where you are in your own month. The hard sessions land when you can crush them. The easy weeks are planned, not accidental. You arrive at race day sharp instead of scraped together.'},
  {t:'cards',kicker:'Part three',h:'What changes for you.',cards:[
    {h:'You trust the plan',p:'Because it finally matches how you actually feel week to week.'},
    {h:'You stay healthy',p:'Injury-proofing built in, not chased after the fact.'},
    {h:'You race sharp',p:'Peaking on purpose, with a head trained for the hard miles.'},
    {h:'You keep going',p:'Training you can sustain for seasons, not just one cycle.'}]},
  {t:'content',kicker:'Why me',h:'I have run every mile of this.',body:'I am a professional distance runner and I founded Get Running in 2013 to coach the way I wish I had been coached. I co-wrote Breakthrough Women’s Running to put the science, the strategy, and the female-specific training that plans ignore into one place. This method is what I use with the runners I coach every day.',by:'Neely Spence Gracey'},
  {t:'cta',kicker:'Your next step',h:'Ready to train with your body?',body:'If you want a plan built for you and your goals instead of someone else’s, let’s build it together. Start with Get Running Coaching and tell me about the runner you are chasing.',cta:'Start at getrunningcoaching.com, join the team',
    disc:'This masterclass is for educational purposes only. Every runner is different; training outcomes vary by individual and are not guaranteed. Consult a qualified healthcare professional before beginning any new training program.'}
];
let i=0;
function render(){
  const s=S[i], el=document.getElementById('slide');
  let h='';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='title'){
    h+=`<h1 style="margin-top:14px">${s.h}</h1>`;
    if(s.sub) h+=`<p class="lead sub">${s.sub}</p>`;
    if(s.by) h+=`<div class="meta"><b>${s.by}</b></div>`;
  } else if(s.t==='section'){
    h+=`<div class="cyclebar"><span class="on"></span><span></span><span></span><span></span></div>`;
    h+=`<h2 style="margin-top:14px">${s.h}</h2>`;
    if(s.sub) h+=`<p class="lead sub">${s.sub}</p>`;
  } else if(s.t==='statement'){
    h+=`<div class="big" style="margin-top:16px">${s.big}</div>`;
    if(s.body) h+=`<p class="sub">${s.body}</p>`;
  } else if(s.t==='pillar'){
    h+=`<span class="pill">Pillar ${s.n} of 4</span>`;
    h+=`<h2 style="margin-top:16px">${s.h}</h2>`;
    if(s.body) h+=`<p class="sub">${s.body}</p>`;
  } else if(s.t==='cards'){
    h+=`<h2 style="margin-top:12px">${s.h}</h2>`;
    h+=`<div class="grid">`+s.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join('')+`</div>`;
  } else if(s.t==='cta'){
    h+=`<h2 style="margin-top:14px">${s.h}</h2>`;
    if(s.body) h+=`<p class="sub">${s.body}</p>`;
    if(s.cta) h+=`<div class="meta"><span class="pill">${s.cta}</span></div>`;
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  } else {
    h+=`<h2 style="margin-top:12px">${s.h}</h2>`;
    if(s.lead) h+=`<p class="lead" style="margin-top:14px">${s.lead}</p>`;
    if(s.body) h+=`<p class="sub">${s.body}</p>`;
    if(s.by) h+=`<div class="meta"><b>${s.by}</b></div>`;
  }
  h+=`<div class="count">${i+1} / ${S.length}</div>`;
  el.innerHTML=h;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
render();
</script>
</body>
</html>
