<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Train Smarter, Not Longer | Exponential Performance Coaching</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#202b39;
    --panel:#415571;
    --accent:#116dff;
    --ink:#eef2f7;
    --muted:#bdd3f1;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:9vh 9vw;position:relative;border-bottom:1px solid rgba(255,255,255,.06)}
  .kick{font-family:'Inter';font-size:.82rem;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:28px}
  h1{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(3rem,8vw,6.4rem);line-height:.98;letter-spacing:.005em;text-transform:uppercase}
  h2{font-family:'Barlow Condensed',sans-serif;font-weight:700;font-size:clamp(2.2rem,5.2vw,4rem);line-height:1.02;text-transform:uppercase}
  .lead{font-size:clamp(1.15rem,2.2vw,1.7rem);line-height:1.5;color:var(--muted);max-width:30ch;margin-top:28px;font-weight:400}
  .big{font-size:clamp(1.5rem,3vw,2.3rem);line-height:1.35;max-width:24ch;font-weight:500}
  .num{font-family:'Barlow Condensed';font-weight:700;color:var(--accent);font-size:clamp(3rem,7vw,5.5rem);line-height:1}
  .accent{color:var(--accent)}
  .strike{position:relative;color:var(--muted)}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:6px;background:var(--accent);transform:rotate(-2deg);border-radius:3px}
  .panel{background:var(--panel);border-radius:18px;padding:34px 38px;margin-top:10px}
  .pillarno{font-family:'Barlow Condensed';font-weight:700;color:var(--accent);font-size:1.1rem;letter-spacing:.2em;margin-bottom:14px}
  .zones{display:flex;flex-direction:column;gap:14px;margin-top:38px;max-width:640px}
  .zrow{display:flex;align-items:center;gap:18px}
  .zlab{width:110px;font-weight:600;font-size:.95rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .zbar{height:20px;border-radius:10px;background:var(--accent)}
  .grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:18px;margin-top:40px;max-width:900px}
  .card{background:var(--panel);border-radius:16px;padding:26px 24px}
  .card .d{font-family:'Barlow Condensed';font-weight:700;font-size:1.4rem;color:var(--accent);text-transform:uppercase;margin-bottom:10px}
  .card .b{font-size:1rem;color:var(--ink);line-height:1.4}
  .fine{font-size:.82rem;color:var(--muted);line-height:1.5;max-width:60ch;margin-top:34px;opacity:.8}
  .cta-row{margin-top:40px}
  .btn{display:inline-block;background:var(--accent);color:#fff;font-weight:700;font-size:1.05rem;padding:18px 34px;border-radius:100px;letter-spacing:.02em}
  .pg{position:absolute;bottom:26px;right:9vw;font-size:.75rem;letter-spacing:.2em;color:var(--muted);opacity:.55}
  .mono{font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title', kick:'Exponential Performance Coaching', h:'Train Smarter,<br>Not Longer', lead:'How time-crunched endurance athletes get faster on the hours they already have.' },
  {t:'who', kick:'Who this is for', h:'You have a job, a family, and a start line', lead:'Age-group triathletes and multisport athletes who want elite-level results without elite-level hours.' },
  {t:'trap', kick:'The honest starting point', big:'You keep adding miles. The miles stopped adding speed.' },
  {t:'reframe', kick:'The reframe', h:'It was never your <span class="accent">effort</span>.', lead:'It was the plan. More volume feels like progress and quietly stalls you, while costing the time you do not have.' },
  {t:'part', kick:'Part one', h:'Why more volume stops working' },
  {t:'point', kick:'Junk miles', big:'Training by feel piles on fatigue without the stimulus that makes you faster.' },
  {t:'point', kick:'The real cost', big:'Every extra unfocused hour is an hour away from work, family, and recovery.' },
  {t:'point', kick:'The plateau', big:'A generic percentage plan is not built around your body, so progress flattens.' },
  {t:'part', kick:'Part two', h:'The Train Smarter method' },
  {t:'pillar', no:'Pillar 01', h:'Field-test your zones', lead:'We measure your real heart-rate and power zones from a field test, so every session is set to your numbers, not a formula.' },
  {t:'zones', kick:'Pillar 01 in practice', h:'Your numbers, not theirs', rows:[['Recovery',22],['Endurance',46],['Tempo',64],['Threshold',82],['VO2',100]] },
  {t:'pillar', no:'Pillar 02', h:'Periodise to your goal race', lead:'Every week is built backward from your one goal event, so your fitness peaks on the day that actually matters.' },
  {t:'pillar', no:'Pillar 03', h:'Every session has a job', lead:'Nothing is filler. Each session is there for a reason, with notes that explain the why, so your limited hours do the most work.' },
  {t:'pillar', no:'Pillar 04', h:'Close the loop', lead:'Your data comes back through Training Peaks, I monitor it, and we adjust with a weekly check-in and unlimited questions. Coaching does not stop at the plan.' },
  {t:'pillar', no:'Pillar 05', h:'Harden up', lead:'The mind is trained alongside the body. When the race gets hard, you have prepared to have more to give.' },
  {t:'part', kick:'Part three', h:'What it looks like' },
  {t:'week', kick:'A week in the method', h:'Structured, not crammed', cards:[['Mon','Zone 2 ride'],['Tue','Threshold run'],['Wed','Recovery'],['Thu','Zone 3 bike'],['Sat','Long multisport'],['Sun','Easy swim']] },
  {t:'point', kick:'Goal-race blueprint', big:'From Coast to Coast to your first Ironman, we build backward so you arrive ready, not hopeful.' },
  {t:'why', kick:'Why me', h:'Matty Graham', lead:'Sport scientist with a masters in exercise physiology from Otago. Coaching endurance athletes since 2009, from first-timers to elite, across triathlon, multisport, cycling, and running, with a reputation built on Coast to Coast.' },
  {t:'recap', kick:'The shift', big:'Stop training more. Start training to your own numbers, toward one goal, with someone watching the data.' },
  {t:'cta', kick:'Work with me', h:'Train smarter this season', lead:'I take on a limited number of athletes so each plan is genuinely personalised. If you want to get faster on the hours you have, let us talk.', btn:'Apply for coaching', fine:'Educational information only. Training outcomes depend on your own consistency, health, and starting point. Results vary from athlete to athlete, and no specific result or race time is promised or guaranteed.' }
];

function zoneRows(rows){
  return '<div class="zones">'+rows.map(function(r){
    return '<div class="zrow"><div class="zlab">'+r[0]+'</div><div class="zbar" style="width:'+r[1]+'%"></div></div>';
  }).join('')+'</div>';
}
function cards(cs){
  return '<div class="grid">'+cs.map(function(c){
    return '<div class="card"><div class="d">'+c[0]+'</div><div class="b">'+c[1]+'</div></div>';
  }).join('')+'</div>';
}

const deck = document.getElementById('deck');
S.forEach(function(s, i){
  let inner = '';
  if(s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if(s.h) inner += '<h1>'+s.h+'</h1>';
  if(s.t==='part') inner = '<div class="kick">'+(s.kick||'')+'</div><h2>'+s.h+'</h2>';
  if(s.big) inner += '<div class="big">'+s.big+'</div>';
  if(s.lead) inner += '<div class="lead">'+s.lead+'</div>';
  if(s.t==='zones') inner += zoneRows(s.rows);
  if(s.t==='week') inner += cards(s.cards);
  if(s.t==='cta'){
    inner += '<div class="cta-row"><span class="btn">'+s.btn+'</span></div>';
    if(s.fine) inner += '<div class="fine">'+s.fine+'</div>';
  }
  const sec = document.createElement('section');
  sec.className = 'slide';
  sec.innerHTML = inner + '<div class="pg">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(sec);
});
</script>
</body>
</html>
