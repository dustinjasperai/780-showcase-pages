<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Spirit-Led Reset · Tana Lee Johnston</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f7f2ea; --panel:#efe7d9; --rule:#e3d6c3;
    --acc:#c8763a; --idx:#476c77; --ink:#313d41; --grey:#5a5148; --dim:#948a7c;
  }
  html,body{height:100%}
  body{background:#241d18;font-family:'Open Sans',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#241d18}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Cardo',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:0}
  .t-title h1{font-size:5.0vw;max-width:90%}
  .t-normal h1{font-size:3.5vw;max-width:86%}
  .t-normal .body{font-family:'Open Sans',sans-serif;font-size:1.48vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Open Sans',sans-serif;font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Open Sans',sans-serif;font-size:1.3vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:88%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:var(--ink);align-items:center;text-align:center}
  .t-dark h1{font-family:'Cardo',serif;font-style:italic;font-weight:400;font-size:2.6vw;max-width:80%;color:#f7f2ea;line-height:1.4}
  .t-cta{background:var(--ink);align-items:center;text-align:center}
  .t-cta h1{font-family:'Cardo',serif;font-weight:700;font-size:4.0vw;max-width:84%;color:#f7f2ea}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#f7f2ea;border-radius:100px;padding:1.3vh 1.6vw;font-family:'Open Sans',sans-serif;font-size:1.18vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Open Sans',sans-serif;font-size:.9vw;color:#b8ab99;font-style:italic;text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .sun-motif{position:absolute;pointer-events:none}
  .title-sun{right:8%;bottom:9%;width:22vw}
  .corner-sun{right:6.5%;bottom:8%;width:9vw;opacity:.7}
  .brandline{font-family:'Open Sans',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Open Sans',sans-serif;font-size:12px;letter-spacing:.14em;color:#8a857c;z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Open Sans',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#8a857c;z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Open Sans',sans-serif;font-size:11px;color:#8a857c;z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.6vw}.t-normal h1{font-size:6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:4.8vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Stop Survival Mode</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: first light, a rising sun over a horizon (dawn out of survival mode) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="sun" viewBox="0 0 260 150">
  <g fill="none" stroke-width="3" stroke-linecap="round">
    <line x1="10" y1="120" x2="250" y2="120" stroke="#476c77" opacity="0.45"/>
    <path d="M92 120 A38 38 0 0 1 168 120" stroke="#c8763a" opacity="0.95"/>
    <line x1="130" y1="52" x2="130" y2="36" stroke="#c8763a" opacity="0.8"/>
    <line x1="82" y1="68" x2="70" y2="56" stroke="#c8763a" opacity="0.8"/>
    <line x1="178" y1="68" x2="190" y2="56" stroke="#c8763a" opacity="0.8"/>
    <line x1="60" y1="98" x2="44" y2="92" stroke="#c8763a" opacity="0.7"/>
    <line x1="200" y1="98" x2="216" y2="92" stroke="#c8763a" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Spirit-Led Reset',sub:'A live masterclass for Christian women on stepping out of survival mode and into the abundant life, without hustle, pressure, or burnout.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You are the one who holds it all together, and you are quietly running on empty.',body:'You love your people and you carry a lot. But somewhere along the way "getting through the day" became the whole plan, and you feel more like you are surviving your life than living the one God has for you.'},
 {t:'dark',title:'Survival mode is not a character flaw. It is a season you were never meant to set up camp in.'},

 {t:'section',idx:'Part One',title:'Why the Reset Never Sticks'},
 {t:'normal',k:'The usual fix',title:'Most advice hands you a new calendar and a longer to-do list.',body:'Wake earlier, batch your tasks, add a morning routine. It is all built on top of the exhaustion instead of underneath it, so it works for a week and then the old survival pattern takes back over.'},
 {t:'normal',k:'The real cost',title:'A tired soul cannot be organized into peace.',body:'When your identity, your thoughts and your energy are still stuck in survival mode, no productivity system holds. You end up feeling like the problem is you, when the problem is the order you are trying to fix things in.'},
 {t:'dark',title:'You cannot reorganize your way out of survival mode. You have to be reset out of it.'},

 {t:'section',idx:'Part Two',title:'The Four-Part Reset'},
 {t:'normal',k:'Pillar one',title:'Realign your identity.',body:'It starts here, not with your schedule. You are God\'s masterpiece (Ephesians 2:10), not "the woman who holds it all together." The reset begins by returning to the identity God gave you instead of the role you got handed.'},
 {t:'normal',k:'Pillar two',title:'Renew your mind.',body:'Survival mode runs on loops of scarcity, hurry and "I can\'t stop." Before the calendar changes, the thinking changes: you learn to notice those loops and replace them with what is actually true.'},
 {t:'normal',k:'Pillar three',title:'Restore your energy.',body:'Survival mode spends energy faster than it makes it. This pillar rebuilds rest, margin and capacity so you stop running on fumes, and so the change you make can actually last.'},
 {t:'normal',k:'Pillar four',title:'Reset your daily life.',body:'Only now do the routines and the schedule change, built to fit the restored identity, mind and energy underneath them. Clarity first, then routines, then productivity, in that order.'},
 {t:'dark',title:'Identity and mind first. The calendar last. That order is the whole difference.'},

 {t:'section',idx:'Part Three',title:'What the Abundant Life Looks Like'},
 {t:'normal',k:'The shift',title:'From surviving your days to advancing with purpose through them.',body:'Not a perfect life and not more hustle. A daily rhythm that flows out of who you are, so clarity, peace and purpose become normal instead of rare.'},
 {t:'normal',k:'Why Tana',title:'A guide who has walked women through this reset.',body:'Tana Lee Johnston is a Spirit-Led life coach for Christian women and the host of the Stop Survival Mode podcast, where she teaches this exact process: realign identity, renew the mind, restore energy, and reset daily life.'},

 {t:'section',idx:'Your Next Step',title:'Walk It Out Together'},
 {t:'normal',k:'The community',title:'Start with the free Spirit-Led Reset Blueprint.',body:'A first step you can take today: the free blueprint and the community of Christian women walking out of survival mode alongside you.'},
 {t:'normal',k:'The program',title:'Go deeper in the group coaching program.',body:'For the woman who wants to be guided through the full four-part reset with support, the group coaching program walks the whole process out over time, in a group of women doing the same.'},
 {t:'cta',title:'Ready to stop surviving and step into the life God has for you?',chips:['Get the free Reset Blueprint','Pre-register for the group program'],disc:'Educational and faith-based content for encouragement and growth. No specific life, health, financial, or spiritual outcome is guaranteed. Every woman\'s journey is her own.'},
];

const deck=document.getElementById('deck');
function sun(kind){return `<svg class="sun-motif ${kind==='title'?'title-sun':'corner-sun'}"><use href="#sun"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Tana Lee Johnston · <b>Stop Survival Mode</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=sun(s.arc);
  else if(s.t==='section') h+=sun('corner');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
