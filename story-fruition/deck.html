<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mind Movie Pitch — Story Fruition Masterclass</title>
<link href="https://fonts.googleapis.com/css2?family=Fira+Sans:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0d2619;
  --panel:#143524;
  --rule:#6f8578;
  --accent:#fb8f4c;
  --accent2:#27ae60;
  --ink:#f3f1ea;
  --muted:#b4c3b9;
  --head:'Fira Sans',Georgia,sans-serif;
  --body:'Roboto',system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
#stage{max-width:960px;margin:0 auto;padding:40px 24px 120px}
.slide{background:var(--panel);border:1px solid rgba(255,255,255,.07);border-radius:20px;
  padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
  justify-content:center;position:relative;overflow:hidden}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.kick{font-family:var(--head);font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  font-size:14px;color:var(--accent);margin-bottom:22px}
h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em}
h1 .a{color:var(--accent)}
h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.12;margin-bottom:10px}
.promise{font-size:24px;color:var(--muted);margin-top:26px;max-width:80%;line-height:1.5}
.lead{font-size:26px;line-height:1.5;color:var(--ink);max-width:88%}
.lead.big{font-size:34px;line-height:1.35;font-family:var(--head);font-weight:500}
ul{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:18px}
li{font-size:23px;line-height:1.4;padding-left:40px;position:relative;color:var(--ink)}
li::before{content:'';position:absolute;left:0;top:12px;width:16px;height:16px;border-radius:5px;
  background:var(--accent)}
.num{font-family:var(--head);font-weight:700;font-size:20px;color:var(--bg);background:var(--accent);
  width:52px;height:52px;border-radius:14px;display:flex;align-items:center;justify-content:center;margin-bottom:22px}
.quote{font-family:var(--head);font-weight:500;font-size:30px;line-height:1.4;color:var(--ink);max-width:90%}
.src{font-size:16px;color:var(--rule);margin-top:20px;letter-spacing:.04em}
.foot{position:absolute;right:30px;bottom:22px;font-size:13px;color:var(--rule);letter-spacing:.14em;text-transform:uppercase}
.disc{font-size:15px;color:var(--muted);margin-top:30px;line-height:1.55;max-width:88%}
.cta-line{font-size:30px;font-family:var(--head);font-weight:600;color:var(--accent);margin-top:24px}
</style>
</head>
<body>
<div id="stage"></div>
<script>
const S = [
  {t:'title', kick:'Story Fruition Masterclass', h:'The Mind Movie <span class="a">Pitch</span>',
   promise:'How founders and executives turn a slide deck into a story investors fund. Live, 60 minutes, with Melissa Reaves.'},

  {t:'whofor', kick:'Who this is for', h2:'You have the numbers. You still lose the room.',
   lead:'This is for founders raising capital, executives taking the stage, and leaders who have to make people care in minutes, not meetings. If your idea is strong but the room forgets it, you are in the right place.'},

  {t:'trap', kick:'The trap', h2:'The data dump',
   lead:'You were taught to prove it: more slides, more metrics, more market size. So you load the deck and read it out. And somewhere around slide nine, the eyes in the room go flat. You did everything right, and they still will not remember you tomorrow.'},

  {t:'reframe', kick:'The hard truth', h:'Investors do not fund your <span class="a">numbers</span>. They fund the story they can see.',
   promise:'Nobody writes a check because a chart was accurate. They write it because they felt what you felt, and they want in.'},

  {t:'part', kick:'Part One', h:'Why the room <span class="a">forgets</span> you'},

  {t:'point', kick:'The core problem', h2:'A fact is heard. A scene is remembered.',
   lead:'The brain files data under boring and dumps it fast. But a vivid moment, a real person in a real situation, gets stored with emotion attached. Most pitches are all facts and no scene, so there is nothing for the mind to hold onto.'},

  {t:'point', kick:'What it costs you', h2:'The forgettable pitch is expensive.',
   lead:'It is the raise that stalls, the keynote that gets polite applause and no follow-up, the interview you nailed on paper and lost in the room. Not because the idea was weak. Because the delivery gave them nothing to feel.'},

  {t:'part', kick:'Part Two', h:'The Storyteller’s <span class="a">Mind Movie Method</span>'},

  {t:'method', kick:'The method', h2:'Play the movie in their mind.',
   lead:'A Mind Movie is a story told so vividly your audience does not just hear it, they see it, hear it, and feel it with you. We build your pitch out of scenes instead of statistics. Here is how.'},

  {t:'pillar', num:'1', kick:'Pillar one', h2:'Open on a scene, not a stat.',
   lead:'Drop them into a single moment in time, a real one. A person, a place, a problem happening right now. You earn the data later, once they care.'},

  {t:'pillar', num:'2', kick:'Pillar two', h2:'Cast one real hero.',
   lead:'Not your whole market. One customer, named, with a want and an obstacle. When the room roots for one person, they are rooting for your company.'},

  {t:'pillar', num:'3', kick:'Pillar three', h2:'Infuse the senses.',
   lead:'Precise words, tone, and pacing that make them see it and feel it. This is what engages emotion instead of overwhelming it. The vision stops being a claim and becomes an experience.'},

  {t:'pillar', num:'4', kick:'Pillar four', h2:'Land the ask on the emotion.',
   lead:'Make the request at the peak of the feeling, not after you have talked it back down with three more slides. The emotion is the bridge from your story to their yes.'},

  {t:'part', kick:'Part Two, continued', h:'Staying yourself under <span class="a">pressure</span>'},

  {t:'point', kick:'The Matrix of Fear', h2:'Overthinking is the enemy, not nerves.',
   lead:'Drawn from years in improvisation: the moment you try to control every word, you go stiff and the story dies. The Matrix of Fear is how you stay present and authentic when the stakes and the adrenaline are both high.'},

  {t:'point', kick:'The inner voices', h2:'The Inner Chatterbox vs. the Calming Coach.',
   lead:'Two voices run during every high-stakes talk: the anxious chatterbox predicting disaster, and the calming coach who keeps you in the moment. You will learn to notice the switch and choose which one is driving.'},

  {t:'part', kick:'Part Three', h:'Your pitch, <span class="a">rebuilt</span> in real time'},

  {t:'example', kick:'A Mind Movie in action', quote:'A tragic death on a mountainside inspired a breakthrough in rescue aviation.',
   lead:'One scene, told right, has carried pitches that raised real capital. The story does the convincing so you do not have to.', src:'Example teaching from the Mind Movie Method.'},

  {t:'whyme', kick:'Why learn this from me', h2:'Melissa Reaves, Story Fruition',
   lead:'Two decades across publishing sales, ad-tech startups including Oracle, professional acting, and improv. Clients have generated over 170 million dollars in funding using the Investor Pitch Coaching and the Mind Movie Method. I built this method so the best idea in the room is also the one they remember.'},

  {t:'recap', kick:'Take these three', h2:'What to walk away with',
   items:['Open on a scene, not a stat.','Cast one real hero and make the room root for them.','Land the ask at the peak of the feeling.']},

  {t:'cta', kick:'Your next step', h:'Build your <span class="a">Mind Movie Pitch</span>',
   lead:'If you want help turning your pitch, keynote, or interview into a story they fund, book your complimentary discovery call with Story Fruition and we will map your first Mind Movie together.',
   cta:'Book your discovery call with Story Fruition',
   disc:'This masterclass is educational. No specific funding amount, deal, or result is guaranteed. Results vary based on your story, your effort, and your market.'}
];

function render(s){
  let inner = '';
  if(s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if(s.num) inner += '<div class="num">'+s.num+'</div>';
  if(s.h) inner += '<h1>'+s.h+'</h1>';
  if(s.h2) inner += '<h2>'+s.h2+'</h2>';
  if(s.quote) inner += '<div class="quote">“'+s.quote+'”</div>';
  if(s.lead) inner += '<div class="lead'+(s.t==='reframe'||s.t==='method'?' big':'')+'">'+s.lead+'</div>';
  if(s.promise) inner += '<div class="promise">'+s.promise+'</div>';
  if(s.items){ inner += '<ul>'; s.items.forEach(function(i){ inner += '<li>'+i+'</li>'; }); inner += '</ul>'; }
  if(s.cta) inner += '<div class="cta-line">'+s.cta+'</div>';
  if(s.disc) inner += '<div class="disc">'+s.disc+'</div>';
  return inner;
}
const stage = document.getElementById('stage');
S.forEach(function(s, idx){
  const el = document.createElement('div');
  el.className = 'slide';
  el.innerHTML = render(s) + '<div class="foot">Story Fruition &middot; '+(idx+1)+' / '+S.length+'</div>';
  stage.appendChild(el);
});
</script>
</body>
</html>
