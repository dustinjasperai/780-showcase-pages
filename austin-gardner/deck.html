<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>From Performance to Peace: A Masterclass with W. Austin Gardner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f6f5;      /* beehiiv warm off-white (12 uses) */
    --panel:#f1eae6;   /* derived warm tint of ground */
    --rule:#e5e7eb;    /* beehiiv light gray (23 uses) */
    --ink:#1a1a1a;     /* beehiiv ink (39 uses) */
    --muted:#6b6460;
    --accent:#e28a7c;  /* beehiiv Followed by Mercy terracotta (12 uses) */
    --serif:'Spectral',Georgia,serif;
    --sans:'Source Sans 3','Source Sans Pro',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#ddd6d2;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:64px 64px 56px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    box-shadow:0 1px 0 rgba(0,0,0,.03),0 18px 40px rgba(60,40,36,.06);overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent);opacity:.9}
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:600;font-size:54px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:16px}
  .lede{font-family:var(--serif);font-size:23px;line-height:1.45;color:#2d2824;font-style:italic;max-width:40ch}
  p.body{font-size:19px;line-height:1.6;color:#352f2b;max-width:54ch;margin-top:14px}
  .big{font-family:var(--serif);font-size:46px;line-height:1.12;letter-spacing:-.01em;max-width:20ch;font-weight:500}
  .foot{margin-top:auto;padding-top:26px;display:flex;justify-content:space-between;align-items:center;
    font-size:13px;color:var(--muted);border-top:1px solid var(--rule)}
  .foot .brand{font-weight:600;color:#4a433f;letter-spacing:.02em}
  ul.pillars{margin-top:20px;display:grid;gap:14px;max-width:60ch}
  ul.pillars li{list-style:none;padding:16px 18px;background:var(--panel);border-radius:10px;
    font-size:18px;line-height:1.5}
  ul.pillars li b{font-family:var(--serif);font-weight:600}
  .num{font-family:var(--serif);font-size:15px;color:var(--accent);font-weight:600}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:26px;margin-top:18px}
  .two .cell{background:var(--panel);border-radius:10px;padding:22px}
  .two .cell h3{font-family:var(--serif);font-size:21px;margin-bottom:8px}
  .two .cell p{font-size:16px;line-height:1.5;color:#45403c}
  .cta-box{margin-top:18px;background:var(--panel);border-radius:12px;padding:26px;max-width:52ch}
  .cta-box .step{font-size:18px;line-height:1.55;margin-bottom:10px}
  .disclaimer{font-size:13px;color:var(--muted);line-height:1.5;margin-top:20px;max-width:60ch}
  .quiet{font-size:16px;color:var(--muted);margin-top:10px}
  @media(max-width:640px){.slide{padding:38px 26px}h1{font-size:38px}.big{font-size:32px}.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const BRAND = "W. Austin Gardner · Followed by Mercy";
const S = [
  {t:'title', kicker:'A Live Masterclass',
    h:'From Performance to Peace',
    lede:'How to stop earning the love you already have, and finally rest in it.',
    quiet:'With W. Austin Gardner · 50 years in ministry, grace learned the hard way.'},

  {t:'promise', kicker:'The promise', h:'What you will walk out with',
    body:'One hour from now you will know exactly where you have been living on the treadmill, you will have four specific shifts to stand on, and you will have language for a kind of rest you may have preached about for years without ever quite living in it.'},

  {t:'trap', kicker:'Who this is for',
    h:'You have given everything, and it still is not enough.',
    body:'You preach grace to everyone else. In private, you are exhausted, quietly afraid that if you ever stopped producing, God would be disappointed. This hour is for pastors, ministry leaders, and believers who have spent years running on a treadmill they were never meant to be on.'},

  {t:'hook', kicker:'The reframe',
    big:'You have spent decades trying to earn a love that was already yours before you did a single thing.'},

  {t:'part', kicker:'Part One', h:'The problem is not effort. It is the treadmill.',
    body:'Performance-based faith tells you the score resets every morning. Do more, pray more, produce more, and maybe today you will feel accepted. It never arrives, because the whole machine is built on a lie: that the love is a wage, not a gift.'},

  {t:'body2', kicker:'Part One', h:'The ache underneath the ministry',
    cells:[
      {h3:'The hidden fear', p:'If I stop performing, I will be found out, and I will be let go. Even by God.'},
      {h3:'The quiet math', p:'I keep a ledger. Sins on one side, service on the other. I am always behind.'}]},

  {t:'body', kicker:'Part One', h:'How you can tell you are on it',
    body:'The tell is not that you work hard. Plenty of rested people work hard. The tell is the dread: the sense that a bad week with God costs you standing, that your acceptance is only ever as good as your last stretch of obedience. That dread is the treadmill talking.'},

  {t:'turn', kicker:'The turn', big:'There is therefore now no condemnation for those who are in Christ Jesus.',
    quiet:'Romans 8:1. Not someday. Now.'},

  {t:'part', kicker:'Part Two', h:'From Performance to Peace: the walk',
    body:'This is not a motivational push to try harder at resting. It is four shifts in how you see God, each one unhooking a place where you still think you have to earn your keep.'},

  {t:'pillars', kicker:'Part Two', h:'Four shifts',
    items:[
      ['Grace before the gospel','Grace is received, never achieved. Even in the Old Testament the invitation is simply "Come." Nothing is asked of you first.'],
      ['Covenant love','God keeps pursuing people who keep running away. His commitment to you does not rise and fall with your output.'],
      ['The Father you can approach','Seen through Jesus, even the warnings are a Father\'s protective grief, not a cold verdict. You are safe to come close.'],
      ['Rest as obedience','Striving is not the faithful option. Laying it down is. Peace is the fruit of trusting that the work is already finished.']]},

  {t:'pillar', kicker:'Shift One', h:'Grace before the gospel', num:'01',
    body:'Read Isaiah again. Before a single demand, before the cross is ever named, God is pursuing, inviting, restoring. The whole of Scripture is God coming toward people who were sure they had disqualified themselves. If grace is older than the gospel, then it was never something you unlocked by being good enough.'},

  {t:'pillar', kicker:'Shift Two', h:'Covenant love does not blink', num:'02',
    body:'A contract ends the moment one side fails. A covenant does not. The fear you carry, that God has finally had enough of you, is a contract fear. Covenant love is the opposite: He keeps pursuing people who keep running away. Your worst week did not move Him an inch.'},

  {t:'pillar', kicker:'Shift Three', h:'The Father you can approach boldly', num:'03',
    body:'Most of us pray to a God we are slightly braced against. But when you see the Father through Jesus, the posture changes. The warnings you feared were contempt turn out to be a parent\'s protective grief. You can come close without first getting your act together.'},

  {t:'pillar', kicker:'Shift Four', h:'Rest is not quitting', num:'04',
    body:'Here is the hard turn for a lifelong producer: laying the striving down IS the obedient move. Not because the work does not matter, but because you now work FROM acceptance instead of FOR it. The pressure comes off. The joy comes back. The ministry gets lighter and, strangely, better.'},

  {t:'body', kicker:'The honest objection', h:'But will grace make me lazy?',
    body:'It is the first fear every producer raises, and the answer is no. Fear drives people for a while and then it breaks them. Love that is already secure is the only fuel that lasts a lifetime. People who know they are accepted do not coast. They serve from a full cup instead of a cracked one.'},

  {t:'body2', kicker:'Part Three', h:'What peace actually looks like',
    cells:[
      {h3:'Monday morning', p:'You start the week already accepted, not auditioning for it. The sermon prep stops being a verdict on your worth.'},
      {h3:'The long game', p:'You last. Burned-out leaders who find this do not just survive ministry, they soften into it and stay.'}]},

  {t:'body', kicker:'Part Three', h:'The fruit shows up in your people',
    body:'This is the part leaders miss. A pastor at rest leads a congregation toward rest. When you stop modeling the treadmill, the people closest to you stop running on theirs. Grace is caught long before it is taught.'},

  {t:'proof', kicker:'Why me', h:'I learned this the slow way.',
    body:'Fifty years in ministry. Church planting through the Peruvian civil war. Training leaders in more than forty countries. Then Stage 4 kidney cancer and twenty-one days on a ventilator. I spent most of those fifty years performing. Grace is what I found on the other side of nearly losing everything, and I do not want you to wait fifty years to find your peace.',
    quiet:'W. Austin Gardner · Alignment Ministries · Followed by Mercy'},

  {t:'invite', kicker:'One more word', big:'You do not have to earn your way off the treadmill either. You just have to step off.'},

  {t:'cta', kicker:'Where to go from here', h:'Start the walk from performance to peace.',
    steps:[
      'Download the free book, Rising Above The Hurt, and read the first chapter this week.',
      'If you want a guide for the road, book a conversation about one-on-one mentoring through Alignment Ministries.'],
    disclaimer:'This masterclass is for spiritual encouragement and personal growth. It is not professional, medical, or mental-health counseling, and it is not a substitute for care from a qualified professional. No spiritual outcome or result is guaranteed. Results vary and every person\'s path is different.'}
];

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function slideHTML(s,i,n){
  let inner='';
  if(s.kicker) inner+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.h) inner+= (s.t==='title'||s.t==='hook'||s.t==='turn') ? `<h1>${esc(s.h)}</h1>` : `<h2>${esc(s.h)}</h2>`;
  if(s.lede) inner+=`<div class="lede">${esc(s.lede)}</div>`;
  if(s.big) inner+=`<div class="big">${esc(s.big)}</div>`;
  if(s.body) inner+=`<p class="body">${esc(s.body)}</p>`;
  if(s.cells){inner+='<div class="two">';s.cells.forEach(c=>{inner+=`<div class="cell"><h3>${esc(c.h3)}</h3><p>${esc(c.p)}</p></div>`;});inner+='</div>';}
  if(s.items){inner+='<ul class="pillars">';s.items.forEach(it=>{inner+=`<li><b>${esc(it[0])}.</b> ${esc(it[1])}</li>`;});inner+='</ul>';}
  if(s.steps){inner+='<div class="cta-box">';s.steps.forEach(st=>{inner+=`<div class="step">${esc(st)}</div>`;});inner+='</div>';}
  if(s.num) inner+=`<div class="num" style="margin-top:14px">Shift ${esc(s.num)} of 04</div>`;
  if(s.quiet) inner+=`<div class="quiet">${esc(s.quiet)}</div>`;
  if(s.disclaimer) inner+=`<div class="disclaimer">${esc(s.disclaimer)}</div>`;
  inner+=`<div class="foot"><span class="brand">${esc(BRAND)}</span><span>${i+1} / ${n}</span></div>`;
  return `<section class="slide" data-type="${s.t}">${inner}</section>`;
}
const wrap=document.getElementById('wrap');
wrap.innerHTML = S.map((s,i)=>slideHTML(s,i,S.length)).join('');
</script>
</body>
</html>
