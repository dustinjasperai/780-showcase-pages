<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Raving Patients Masterclass — Dr. Len Tau</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --accent:#143b70;   /* Dr. Len Tau dominant navy, from brand.json (66 uses) */
    --bg:#f7f9fc;        /* near-white, light-scheme to match his site */
    --panel:#d9e2ed;     /* his pale blue */
    --ink:#1b2430;
    --muted:#5b6672;
    --rule:#c7d4e6;
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  #deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:#ffffff;border:1px solid var(--rule);border-radius:14px;padding:52px 56px;margin:0 0 22px;
    min-height:420px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:8px;background:var(--accent)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.05;color:var(--accent);letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.1;color:var(--accent);letter-spacing:-.01em}
  .promise{font-family:var(--head);font-weight:600;font-size:22px;color:var(--ink);margin-top:18px;max-width:40ch}
  p.lead{font-size:21px;color:var(--ink);margin-top:16px;max-width:52ch}
  p.sub{font-size:18px;color:var(--muted);margin-top:14px;max-width:54ch}
  .big{font-family:var(--head);font-weight:800;font-size:72px;color:var(--accent);line-height:1}
  ul{margin:18px 0 0 0;list-style:none}
  li{font-size:19px;margin:12px 0;padding-left:28px;position:relative;max-width:56ch}
  li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;border-radius:2px;background:var(--accent)}
  .byline{margin-top:28px;font-family:var(--head);font-weight:700;font-size:17px;color:var(--ink)}
  .byline span{display:block;font-family:var(--body);font-weight:400;font-size:15px;color:var(--muted);margin-top:4px}
  .panel{background:var(--panel);border-radius:10px;padding:22px 24px;margin-top:20px}
  .pillarno{font-family:var(--head);font-weight:800;font-size:15px;color:var(--accent);letter-spacing:.08em}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.45}
  .cta-step{font-family:var(--head);font-weight:700;font-size:22px;color:var(--accent);margin-top:18px}
  .num{font-family:var(--head);font-weight:700;color:var(--muted);font-size:13px;position:absolute;right:26px;bottom:18px}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'cover', kicker:'A live masterclass with Dr. Len Tau, DMD',
   h1:'The Raving Patients Masterclass',
   promise:'How to turn your happiest patients into your busiest new-patient channel.',
   byline:'Dr. Len Tau, DMD', bysub:'Author of Raving Patients. Host of the Raving Patients Podcast.'},

  {t:'who', kicker:'Who this is for',
   h2:'You do great dentistry. You are still invisible to the patients searching for you.',
   sub:'This is for the practice owner who has tried the ads, the SEO, and the agency, and still watches new patients trickle in while the schedule has gaps.'},

  {t:'trap', kicker:'The trap',
   h2:'You have been sold marketing. You have not been sold trust.',
   lead:'Ads, directory listings, a prettier website. They all fight for attention. None of them answer the only question a new patient is really asking: can I trust this practice with my mouth and my money?'},

  {t:'reframe', kicker:'The uncomfortable truth',
   big:'98%',
   lead:'of patients read your reviews before they ever call. Your review profile is your storefront. Right now most practices leave it empty, or let it fill itself at random.'},

  {t:'part', kicker:'Part One', h2:'Why great dentistry is no longer enough.'},

  {t:'problem', kicker:'The real problem',
   h2:'Patients do not choose the best dentist. They choose the most trusted one.',
   sub:'And trust is decided before the first phone call, in a search result and a stack of reviews you may not even know are there. Clinical skill is the price of entry. It is not what wins the booking.'},

  {t:'part', kicker:'Part Two', h2:'The Raving Patients System.'},

  {t:'pillar', no:'Pillar 01', h2:'Reputation marketing, not reputation management.',
   lead:'Management is damage control. Marketing is making your patient reviews your primary new-patient channel, on purpose. Rising at the top of the local map when someone searches for a dentist is the whole game.'},

  {t:'pillar', no:'Pillar 02', h2:'Ask for feedback, not a review.',
   lead:'Asking for feedback opens the door to far more than asking for a review. It feels human instead of transactional, it lifts response rates, and it surfaces small problems privately before they ever become a public one star.'},

  {t:'pillar', no:'Pillar 03', h2:'Build a reputation culture, then automate the ask.',
   lead:'Every team member understands that patients observe everything, and that experience comes first. Then you automate the ask, because a manual system spikes and crashes to zero the week you get busy. Consistency is what moves your ranking.'},

  {t:'pillar', no:'Pillar 04', h2:'Reviews are stories, not star ratings.',
   lead:'A five is a click. A story with the staff member\'s name, the procedure, and real relief is what a nervous stranger reads and believes. Thirty to sixty seconds of a real patient smiling converts a searcher better than any ad you can buy.'},

  {t:'bad', kicker:'The objection, answered',
   h2:'A few bad reviews make the good ones look real.',
   sub:'A wall of nothing but fives reads as fake. The occasional honest critique, answered gracefully and fixed, is proof that the raving reviews are real. Do not fear feedback. Build the system that earns and surfaces it.'},

  {t:'part', kicker:'Part Three', h2:'What it looks like running.'},

  {t:'looks', kicker:'The practice that runs this',
   h2:'A steady, predictable flow, not a once-a-year push.',
   items:['New reviews arriving every week without anyone chasing them',
          'The practice sitting at the top of the map for "dentist near me"',
          'New patients saying a specific review is the reason they called',
          'A team that treats experience and reputation as one job, not two']},

  {t:'proof', kicker:'Proof it is a system',
   h2:'100 five-star reviews in 100 days.',
   sub:'Not a hack and not luck. A repeatable, automated, team-driven process you run on purpose, so the flow holds steady long after the first push.'},

  {t:'why', kicker:'Why learn this from me',
   h2:'I am a practicing dentist who had to solve this myself first.',
   items:['Author of Raving Patients and 100+ Tips to 100 5-Star Reviews in 100 Days',
          'Host of the weekly Raving Patients Podcast',
          'Named one of the top leaders in dental consulting by Dentistry Today',
          'Have trained thousands of dentists in reputation marketing']},

  {t:'recap', kicker:'The system, in one view',
   h2:'Market the reputation, do not just manage it.',
   items:['Ask for feedback, not a review',
          'Build the culture, then automate the ask',
          'Tell stories, not star counts',
          'Let a few honest ones keep it believable']},

  {t:'cta', kicker:'Your next step',
   h2:'Ready to make your patients your best marketing channel?',
   step:'Book your reputation marketing consultation with Dr. Len Tau at drlentau.com.',
   disc:'This masterclass is educational. Results vary from practice to practice and depend on your market, your team, and your follow-through. Nothing here is a guarantee of any specific number of reviews, new patients, or revenue.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='';
  if(s.kicker) h+='<div class="kick">'+s.kicker+'</div>';
  if(s.h1) h+='<h1>'+s.h1+'</h1>';
  if(s.promise) h+='<div class="promise">'+s.promise+'</div>';
  if(s.no) h+='<div class="pillarno">'+s.no+'</div>';
  if(s.h2) h+='<h2>'+s.h2+'</h2>';
  if(s.big) h+='<div class="big">'+s.big+'</div>';
  if(s.lead) h+='<p class="lead">'+s.lead+'</p>';
  if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
  if(s.items){h+='<ul>';s.items.forEach(it=>h+='<li>'+it+'</li>');h+='</ul>';}
  if(s.step) h+='<div class="cta-step">'+s.step+'</div>';
  if(s.byline) h+='<div class="byline">'+s.byline+(s.bysub?'<span>'+s.bysub+'</span>':'')+'</div>';
  if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  h+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
