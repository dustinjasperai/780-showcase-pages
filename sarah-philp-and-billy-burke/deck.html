<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Yourself Well — a live masterclass with Sarah Philp</title>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf9ee;        /* Saorsa dominant cream */
    --panel:#f1ecd9;     /* soft cream panel */
    --rule:#dcd4b8;      /* muted cream-olive hairline */
    --ink:#2f3320;       /* deep olive-charcoal */
    --muted:#6b6a4e;     /* muted olive */
    --accent:#788042;    /* Saorsa olive link colour */
    --accent2:#ba8032;   /* Saorsa ochre */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#e7e2cf;color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{
    background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 22px;min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(47,51,32,.04);
  }
  .kicker{font-family:'Inter';font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:20px}
  h1{font-family:'Spectral';font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Spectral';font-weight:600;font-size:36px;line-height:1.1;margin-bottom:18px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:48ch;margin-top:10px}
  .big{font-family:'Spectral';font-weight:600;font-size:40px;line-height:1.15;max-width:22ch}
  .accent{color:var(--accent)}
  .accent2{color:var(--accent2)}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px;max-width:52ch}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li.ochre::before{background:var(--accent2)}
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .pill{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:22px}
  .pill .n{font-family:'Spectral';font-size:15px;color:var(--accent2);font-weight:600;letter-spacing:.06em}
  .pill h3{font-family:'Spectral';font-size:22px;font-weight:600;margin:6px 0 8px}
  .pill p{font-size:15.5px;line-height:1.5;color:var(--muted)}
  .foot{margin-top:28px;font-size:15px;color:var(--muted)}
  .rulebar{width:54px;height:4px;background:var(--accent2);border-radius:2px;margin:0 0 24px}
  .disclaimer{font-size:13.5px;color:var(--muted);max-width:60ch;margin-top:22px;line-height:1.5}
  .num{position:fixed;right:14px;bottom:12px;font-size:12px;color:#8a8768}
  .cta-steps{display:grid;gap:12px;margin-top:22px;max-width:44ch}
  .cta-steps div{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;font-size:18px}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:auto}h1{font-size:38px}.pillars{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="num" id="num"></div>
<script>
const html = {
  title:`<div class="kicker">A live masterclass</div>
    <h1>Lead Yourself <span class="accent">Well</span></h1>
    <p class="lead">The inside-out work of leading a school, a team, or a change nobody asked for.</p>
    <p class="foot">With Sarah Philp, Chartered Coaching &amp; Educational Psychologist · Saorsa Psychology</p>`,

  who:`<div class="kicker">Who this is for</div>
    <h2>You lead other people for a living.</h2>
    <p class="sub">Headteachers, deputies, service leads, anyone holding a team through a term that keeps asking for more. You spend your days steadying everyone else. This hour is about the part no one books time for: steadying yourself.</p>`,

  hook:`<div class="rulebar"></div>
    <p class="big">You cannot steady a school through change until you can steady <span class="accent2">yourself</span>.</p>
    <p class="sub">Most leadership training hands you another plan. The plan was rarely the problem.</p>`,

  promise:`<div class="kicker">What you will leave with</div>
    <h2>One hour, three shifts.</h2>
    <ul>
      <li>A way to notice your own patterns before they run the room</li>
      <li class="ochre">A conversation that builds trust instead of tension</li>
      <li>A way to move change through people, not past them</li>
    </ul>`,

  p1_head:`<div class="kicker">Part one</div>
    <h2>Change is a people process, not a plan.</h2>
    <p class="sub">We treat improvement as a document: a new strategy, a new policy, a new timetable. Then we wonder why the room goes quiet.</p>`,

  p1_body:`<h2>The real work is between people.</h2>
    <p class="lead">"When we understand the challenge of improvement as an interpersonal process, we are better equipped to remove barriers and engage others in the work that needs to be done."</p>
    <p class="foot">This is the whole of it. Improvement lives in relationships, not in the plan.</p>`,

  p1_cost:`<div class="kicker">The cost of skipping it</div>
    <h2>What it looks like when you don't.</h2>
    <ul>
      <li>Initiatives that launch loudly and land nowhere</li>
      <li class="ochre">A staffroom that nods in the meeting and resists in the corridor</li>
      <li>A leader running on fumes, certain the problem is everyone else</li>
    </ul>`,

  p2_head:`<div class="kicker">Part two</div>
    <h2>The approach: inside-out and outside-in.</h2>
    <p class="sub">An approach that recognises both the capacity of the individual and the environment they live and work in. We start inside, then work outward.</p>`,

  p2_insideout:`<div class="rulebar"></div>
    <p class="big">Lead <span class="accent">yourself</span> before you lead the change.</p>
    <p class="sub">Your patterns under pressure set the weather for the whole team. Notice them first.</p>`,

  p2_pillars:`<div class="kicker">The four moves</div>
    <h2>What we practise.</h2>
    <div class="pillars">
      <div class="pill"><div class="n">01</div><h3>Lead Yourself Well</h3><p>Noticing and managing your own patterns so you choose your response instead of reacting.</p></div>
      <div class="pill"><div class="n">02</div><h3>Resonant Conversations</h3><p>Listening with real depth so a conversation builds the relationship, not just exchanges information.</p></div>
      <div class="pill"><div class="n">03</div><h3>Collaborative Leadership</h3><p>Building the trust and psychological safety a team needs to do braver, more honest work.</p></div>
      <div class="pill"><div class="n">04</div><h3>Leading Change</h3><p>Moving improvement through people in clear phases, removing barriers and bringing the room with you.</p></div>
    </div>`,

  p2_lead:`<div class="kicker">Move one</div>
    <h2>Lead yourself well.</h2>
    <p class="lead">Before a single conversation with the team, the quieter question: what pattern do I bring into the room when I am under pressure, and is it serving the work?</p>`,

  p2_resonant:`<div class="kicker">Move two</div>
    <h2>Resonant conversations.</h2>
    <p class="lead">Most leadership conversations trade information. A resonant one goes a layer deeper, so the other person feels heard and the relationship gets stronger. That is where trust is actually built.</p>`,

  p2_safety:`<div class="kicker">Move three</div>
    <h2>Build psychological safety.</h2>
    <p class="lead">A team that feels safe enough to disagree, to admit a mistake, to say the hard thing early. That safety is not softness. It is the foundation collaborative leadership stands on.</p>`,

  p2_change:`<div class="kicker">Move four</div>
    <h2>Move the change through people.</h2>
    <p class="lead">With the inside work done and the relationships strong, change stops being something you push. It becomes something the room carries with you, in phases, with the barriers named and removed.</p>`,

  p3_head:`<div class="kicker">Part three</div>
    <h2>What it looks like in a real term.</h2>
    <p class="sub">Not a transformation story. A quieter one: the same leader, the same pressures, a different weather system around them.</p>`,

  p3_look:`<h2>The shift you can feel.</h2>
    <ul>
      <li>You respond on purpose instead of reacting on reflex</li>
      <li class="ochre">Hard conversations leave people closer, not bruised</li>
      <li>Change arrives with the staffroom, not at it</li>
    </ul>`,

  p3_whyme:`<div class="kicker">Why work with me</div>
    <h2>Twenty years of this, gently bold.</h2>
    <p class="sub">I am a Chartered Coaching and Educational Psychologist. Saorsa is Gaelic for freedom. For two decades I have worked with leaders and teams on exactly this: the inside-out and outside-in work of leading well, with depth, nuance, and coherence so the change actually holds.</p>`,

  recap:`<div class="kicker">In one line</div>
    <p class="big">Lead yourself well, have resonant conversations, and the change moves <span class="accent">through</span> the room.</p>`,

  cta:`<div class="kicker">Keep going together</div>
    <h2>Keep going with me.</h2>
    <p class="sub">If this hour was useful, the next step is a conversation. We can look at bringing this into your school or team through Coach in Residence, or work one to one through Lead Yourself Well.</p>
    <div class="cta-steps">
      <div>Book a conversation at saorsa-psychology.co.uk</div>
      <div>Or start with the free Wellbeing Ecosystem, a one hour retreat for your mind</div>
    </div>`
};

const S = [
  {t:'title', html: html.title},
  {t:'who', html: html.who},
  {t:'hook', html: html.hook},
  {t:'promise', html: html.promise},
  {t:'p1_head', html: html.p1_head},
  {t:'p1_body', html: html.p1_body},
  {t:'p1_cost', html: html.p1_cost},
  {t:'p2_head', html: html.p2_head},
  {t:'p2_insideout', html: html.p2_insideout},
  {t:'p2_pillars', html: html.p2_pillars},
  {t:'p2_lead', html: html.p2_lead},
  {t:'p2_resonant', html: html.p2_resonant},
  {t:'p2_safety', html: html.p2_safety},
  {t:'p2_change', html: html.p2_change},
  {t:'p3_head', html: html.p3_head},
  {t:'p3_look', html: html.p3_look},
  {t:'p3_whyme', html: html.p3_whyme},
  {t:'recap', html: html.recap},
  {t:'cta', html: html.cta + `<p class="disclaimer">This masterclass is educational and shares a coaching and psychological approach to leadership. It is not therapy or clinical treatment. No income or particular result is guaranteed. Results vary from person to person and team to team.</p>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className='slide';
  el.innerHTML = s.html || '';
  deck.appendChild(el);
});
document.getElementById('num').textContent = S.length + ' slides';
</script>
</body>
</html>
