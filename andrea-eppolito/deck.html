<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Designing Luxury Weddings — A Masterclass with Andrea Eppolito</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..900;1,6..96,400..700&family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F4EDE1;        /* champagne ivory ground (brand: light scheme + luxury palette) */
    --panel:#FFFCF5;
    --ink:#1A1714;        /* near-black ink (brand) */
    --muted:#6E655A;
    --rule:#E3DCCF;
    --accent:#B08D57;     /* champagne bronze — her luxury-wedding palette */
    --deep:#8C6D3F;
    --display:"Bodoni Moda", Georgia, serif;
    --body:"EB Garamond", Georgia, serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:4px;
    padding:64px 60px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(26,23,20,.03)}
  .slide.cover{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .slide.part{background:linear-gradient(180deg,#FFFFFF, #F6F0E6)}
  .kick{font-family:var(--body);text-transform:uppercase;letter-spacing:.28em;
    font-size:13px;color:var(--accent);margin:0 0 20px;font-weight:600}
  .cover .kick{color:var(--accent)}
  h1{font-family:var(--display);font-weight:700;font-size:58px;line-height:1.04;margin:0 0 22px;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;margin:0 0 18px}
  .partno{font-family:var(--display);font-style:italic;font-size:22px;color:var(--accent);margin:0 0 10px}
  p.sub{font-size:23px;line-height:1.5;color:var(--muted);margin:0;max-width:40ch}
  .cover p.sub{color:#E8E0D2;max-width:44ch}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:22px;line-height:1.5;padding:14px 0 14px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li:before{content:"";position:absolute;left:0;top:24px;width:14px;height:1px;background:var(--accent)}
  li b{font-family:var(--display);font-weight:600}
  .pillar h2{font-size:46px}
  .pillar .n{font-family:var(--display);font-style:italic;color:var(--accent);font-size:20px;margin:0 0 6px}
  blockquote{font-family:var(--display);font-style:italic;font-size:34px;line-height:1.3;margin:0;max-width:30ch}
  .by{font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:26px}
  .disc{font-size:15px;line-height:1.5;color:var(--muted);margin-top:28px;max-width:60ch}
  .cta-step{font-family:var(--display);font-size:28px;color:var(--accent);margin:8px 0 0}
  .foot{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin-top:40px}
  .cover .foot{color:#CBBF9F}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cover:true, k:'A Live Masterclass with Andrea Eppolito',
   h:'Designing Luxury Weddings',
   s:'How to design and sell once-in-a-lifetime experiences, and command the fees that match.'},

  {t:'who', k:'Who this is for',
   h:'The planner ready to move upmarket.',
   s:'You can already execute a beautiful wedding. The next move is designing at the top of the market and being paid for it.',
   list:['Established wedding planners and designers','Ready to stop competing on price and availability','Who want to sell design, not decor']},

  {t:'trap', k:'The trap',
   h:'You are pricing your time, not your design.',
   list:['You quote by the hour or the headcount','You get compared to the planner down the street','You book on availability instead of vision']},

  {t:'reframe', cover:true, k:'A reframe',
   h:'They are not buying flowers.',
   s:'A couple spending at the top of the market is buying a story and a feeling. Sell decor and you compete on price forever. Design an experience and you are the only option.'},

  {t:'part', part:'Part One', h:'Why luxury couples choose a designer.'},

  {t:'point', k:'The real decision',
   h:'Luxury is not more. It is intentional.',
   list:['A luxury wedding is designed, not decorated','Every choice carries the couple’s story','Restraint signals taste; excess signals insecurity']},

  {t:'part', part:'Part Two', h:'The Six Pillars of Luxury Design.'},

  {t:'pillar', n:'Pillar One', h:'Color', s:'Color is a strategy, not a preference. A disciplined palette is what separates an editorial wedding from a Pinterest board.'},
  {t:'pillar', n:'Pillar Two', h:'Texture', s:'Texture is how a room feels before anyone speaks. Layering linen, stone, crystal and bloom is what makes a space read as expensive.'},
  {t:'pillar', n:'Pillar Three', h:'Storytelling', s:'Every design decision answers one question: whose story is this? The narrative is the thing couples cannot get anywhere else.'},
  {t:'pillar', n:'Pillar Four', h:'Presentation', s:'How you present the vision is half the sale. A designer who presents with authority is trusted with a bigger budget.'},
  {t:'pillar', n:'Pillar Five', h:'Production', s:'Production is where taste meets logistics. The guest should feel the magic and never see the machinery that made it.'},
  {t:'pillar', n:'Pillar Six', h:'Team', s:'Luxury does not scale on one person. The right team and the right vendors let you hold the standard across every event.'},

  {t:'part', part:'Part Three', h:'What a designed wedding does.'},

  {t:'point', k:'The outcome',
   h:'Design first. The price follows the story.',
   list:['You lead with vision, not a package','Couples self-select into your tier','Your fee reflects the experience, not the hours']},

  {t:'why', k:'Why me',
   h:'Twenty years designing at the top of the market.',
   s:'I have designed luxury and celebrity weddings for clients who lead extraordinary lives, and I teach the exact system I use. I have spoken for Engage, WIPA, NACE and at UNLV.',
   by:'Andrea Eppolito · Luxury Wedding Designer & Educator'},

  {t:'quote', cover:true,
   q:'I see a world that does not exist, and I have the will to bring it to fruition.',
   by:'The designer’s job'},

  {t:'recap', k:'The system',
   h:'This is what we build together.',
   list:['Color, texture and storytelling as a method','Presentation that earns a bigger budget','Production and team that hold the standard']},

  {t:'cta', k:'Your next step',
   h:'Design luxury weddings on purpose.',
   step:'Explore the Wedding Designer Masterclass with Andrea Eppolito.',
   disc:'Educational only. No income or specific result is guaranteed. Results vary and depend on your market, your work, and your clients.',
   foot:'Andrea Eppolito · andreaeppolito.com'}
];

function el(tag, cls, html){const e=document.createElement(tag); if(cls)e.className=cls; if(html!=null)e.innerHTML=html; return e;}
const deck=document.getElementById('deck');
for(const s of S){
  const slide=el('section','slide'+(s.cover?' cover':'')+(s.t==='part'?' part':'')+(s.t==='pillar'?' pillar':''));
  if(s.k) slide.appendChild(el('div','kick',s.k));
  if(s.part) slide.appendChild(el('div','partno',s.part));
  if(s.n) slide.appendChild(el('div','n',s.n));
  if(s.h && s.t==='title') slide.appendChild(el('h1',null,s.h));
  else if(s.h) slide.appendChild(el('h2',null,s.h));
  if(s.q) slide.appendChild(el('blockquote',null,'“'+s.q+'”'));
  if(s.s) slide.appendChild(el('p','sub',s.s));
  if(s.list){const ul=el('ul'); for(const li of s.list) ul.appendChild(el('li',null,li)); slide.appendChild(ul);}
  if(s.step) slide.appendChild(el('div','cta-step',s.step));
  if(s.by) slide.appendChild(el('div','by',s.by));
  if(s.disc) slide.appendChild(el('div','disc',s.disc));
  if(s.foot) slide.appendChild(el('div','foot',s.foot));
  deck.appendChild(slide);
}
</script>
</body>
</html>
