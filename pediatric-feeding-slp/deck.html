<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beyond the Drills: A Pediatric Feeding Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Raleway:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f2efe7; --panel:#fbfaf6; --panel2:#eae4d8; --rule:#d7ccbb;
    --accent:#809f91; --deep:#5f7d6f; --ink:#3a4540; --muted:#6f766f;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Raleway',system-ui,sans-serif}
  .deck{max-width:1100px;margin:0 auto;padding:40px 22px 80px}
  .slide{
    background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(90,80,70,.03);
  }
  .slide.alt{background:var(--panel2)}
  .slide.sage{background:var(--deep);color:#f4f2ec;border-color:var(--deep)}
  .slide.sage .eyebrow,.slide.sage .muted{color:#d6e0d8}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:18px}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Playfair Display',serif;font-weight:600;font-size:38px;line-height:1.12;margin-bottom:16px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch;font-weight:400}
  .muted{color:var(--muted)}
  p{font-size:18px;line-height:1.6;margin-top:14px;max-width:62ch}
  ul{margin:20px 0 0 0;list-style:none}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 40px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:6px;top:22px;width:14px;height:14px;border-radius:50% 50% 50% 2px;background:var(--accent)}
  .num{font-family:'Playfair Display',serif;color:var(--accent);font-size:15px;font-weight:600;letter-spacing:.14em}
  .pill{display:inline-block;background:var(--panel2);border:1px solid var(--rule);border-radius:999px;padding:7px 16px;font-size:14px;color:var(--deep);font-weight:600;margin:6px 8px 0 0}
  .foot{margin-top:28px;font-size:14px;color:var(--muted)}
  .cta{font-size:22px;color:var(--deep);font-weight:600;margin-top:10px}
  .disc{margin-top:26px;font-size:13px;line-height:1.5;color:var(--muted);max-width:66ch;border-top:1px solid var(--rule);padding-top:16px}
  .snum{position:absolute;right:22px;bottom:14px;font-size:12px;color:var(--rule)}
  .slide{position:relative}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A Live Masterclass for Feeding Clinicians',
    h:'Beyond the Drills',
    lead:'The responsive, evidence-based path to real feeding progress.',
    foot:'Brianna Miluk, MS, CCC-SLP, CLC · Pediatric Feeding SLP' },

  {t:'who', eyebrow:'Who this is for',
    h:'You know feeding is more than the mouth',
    body:'This hour is for the SLP, OT, or feeding clinician who has run the oral-motor protocols, logged the sessions, and still watched a child stall. You do not want another worksheet. You want to understand why.' },

  {t:'trap', cls:'alt', eyebrow:'The trap',
    h:'The child tolerates the bite in session. Then eats nothing at home.',
    body:'It is the most common story in pediatric feeding. The data looks like progress. The family tells a different story. When therapy chases compliance, the gains do not travel.' },

  {t:'reframe', cls:'sage', eyebrow:'The reframe',
    h:'Compliance is not progress.',
    body:'A child who complies with a bite under pressure has learned to tolerate us. A child who is fed responsively learns to eat. Those are two different outcomes, and only one of them follows the family home.' },

  {t:'part', eyebrow:'Part One', h:'Why the drills stall',
    body:'Oral-motor drills treat feeding as a strength problem. For most of the children on your caseload, it is a learning problem, a sensory problem, and a relationship problem at the same time. Train the mouth in isolation and you train a skill the child never generalizes.' },

  {t:'list', eyebrow:'Part One', h:'What compliance-based feeding misses',
    items:['The child learns the therapist, not the food','Pressure raises tolerance and lowers trust at once','Gains are context-bound to the therapy room','The family is left out of the mechanism that matters most'] },

  {t:'part', cls:'alt', eyebrow:'Part Two', h:'A framework you can defend',
    body:'Responsive, evidence-based feeding is not a vibe. It is a set of principles you can point to, explain to a parent, and justify in a chart. Here are the four we build on.' },

  {t:'pillar', eyebrow:'Part Two · Pillar 1', num:'01',
    h:'Motor learning, not repetition',
    body:'We choose and sequence intervention from motor-learning science: how skills are actually acquired, retained, and transferred, so practice in the room shows up at the table.' },

  {t:'pillar', cls:'alt', eyebrow:'Part Two · Pillar 2', num:'02',
    h:'Responsive, child-led practice',
    body:'The child sets the pace; we read and answer their cues instead of overriding them. Responsive feeding is what makes a skill generalize, because it respects how eating is built in the first place.' },

  {t:'pillar', eyebrow:'Part Two · Pillar 3', num:'03',
    h:'Know your scope: oral, pharyngeal, esophageal',
    body:'Map the difficulty across the three phases of the swallow and know exactly where an SLP does and does not have a role, especially with esophageal involvement. Scope clarity is a clinical decision tool, not a disclaimer.' },

  {t:'pillar', cls:'alt', eyebrow:'Part Two · Pillar 4', num:'04',
    h:'Evidence over pseudoscience',
    body:'The field is full of confident claims and thin data. We appraise feeding research honestly, separate what holds up from what is trending, and choose interventions we can stand behind.' },

  {t:'part', eyebrow:'Part Three', h:'When a stuck case starts to move',
    body:'Put the four pillars together and a stuck case starts to move, not because of a new drill, but because you changed what you were solving for.' },

  {t:'case', cls:'alt', eyebrow:'Part Three · A case', h:'From tolerating to eating',
    body:'A medically complex toddler who "passed" every session but refused food at home. We shifted from bite-count goals to responsive, cue-led meals, re-scoped the pharyngeal piece, and coached the parent into the mechanism. The gains finally traveled home.',
    foot:'Composite illustration of the method. Every child is different and outcomes vary.' },

  {t:'why', eyebrow:'Why this, from me', h:'I built this because the gap was real',
    body:'I am a speech-language pathologist and certified lactation counselor with a PhD, working with infants and medically complex children. I host The Feeding Pod and have run the Pediatric Feeding Mentorship Group since 2021, because intermediate and advanced clinicians deserve real mentoring on hard cases, not another recorded lecture.' },

  {t:'recap', cls:'alt', eyebrow:'The one-hour recap', h:'What you can take back to your caseload tomorrow',
    items:['Name why a session win does not reach the table','Choose intervention from motor learning, not habit','Lead with responsive, cue-based practice','Hold your scope across all three swallow phases'] },

  {t:'cta', cls:'sage', eyebrow:'Where this goes deeper',
    h:'Go deeper, on real cases, with mentoring',
    body:'If this hour changed how you see a stuck case, the Pediatric Feeding Mentorship Group is where we work through your actual caseload together, with time for your questions and the evidence behind every call.',
    cta:'Join the Pediatric Feeding Mentorship Group',
    disc:'This masterclass is for professional education only. It is clinical education, not medical or legal advice, and it does not establish a provider relationship or guarantee any clinical or financial outcome. Always apply your own clinical judgment and scope of practice. Results vary by clinician and by child.' },
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' '+s.cls : '');
  let html = '';
  if(s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) html += `<div class="num">${s.num}</div>`;
  if(s.h) html += (s.t==='title') ? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`;
  if(s.lead) html += `<div class="lead">${s.lead}</div>`;
  if(s.body) html += `<p>${s.body}</p>`;
  if(s.items){ html += '<ul>'; s.items.forEach(x=>html+=`<li>${x}</li>`); html += '</ul>'; }
  if(s.cta) html += `<div class="cta">${s.cta}</div>`;
  if(s.foot) html += `<div class="foot">${s.foot}</div>`;
  if(s.disc) html += `<div class="disc">${s.disc}</div>`;
  html += `<div class="snum">${i+1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
