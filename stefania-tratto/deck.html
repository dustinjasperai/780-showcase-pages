<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Masterclass, Stefania Tratto, Coach 3C</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafcff;
  --panel:#eaf2f9;
  --rule:#33414d;
  --accent:#0073b6;
  --ink:#151616;
  --muted:#4a5560;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Lato',system-ui,sans-serif}
.deck{max-width:1040px;margin:0 auto;padding:40px 22px 90px}
.slide{background:#ffffff;border:1px solid #dbe6ef;border-radius:16px;padding:64px 60px;margin:22px 0;min-height:560px;
  display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px rgba(21,50,80,.06);position:relative;overflow:hidden}
.slide::before{content:'';position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
.k{font-family:'Poppins',sans-serif;font-size:15px;font-weight:700;letter-spacing:.20em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-.01em;color:var(--ink)}
h2{font-family:'Poppins',sans-serif;font-weight:600;font-size:38px;line-height:1.12;color:var(--ink)}
.sub{font-size:23px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:44ch}
.big{font-family:'Poppins',sans-serif;font-weight:600;font-size:40px;line-height:1.22;color:var(--ink);max-width:24ch}
.big .a{color:var(--accent)}
.uline{height:5px;width:120px;background:var(--accent);border-radius:3px;margin-top:34px}
ul{margin-top:26px;list-style:none;max-width:48ch}
li{position:relative;padding-left:38px;margin-bottom:20px;font-size:22px;line-height:1.45;color:var(--ink)}
li::before{content:'';position:absolute;left:0;top:9px;width:16px;height:16px;border:3px solid var(--accent);border-radius:5px}
.pill{display:inline-block;font-family:'Poppins',sans-serif;font-weight:700;font-size:19px;color:#fff;background:var(--accent);border-radius:100px;padding:8px 20px;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:34px}
.card{background:var(--panel);border-radius:14px;padding:28px 24px}
.card .n{font-family:'Poppins',sans-serif;font-weight:700;font-size:22px;color:var(--accent)}
.card .t{font-family:'Poppins',sans-serif;font-weight:600;font-size:23px;margin:10px 0 8px}
.card .d{font-size:17px;line-height:1.4;color:var(--muted)}
.who{font-size:23px;line-height:1.5;color:var(--ink);max-width:46ch}
.byline{font-family:'Poppins',sans-serif;font-size:19px;color:var(--muted);margin-top:40px}
.disc{font-size:15px;line-height:1.5;color:#66707a;margin-top:34px;max-width:60ch}
.cta-line{font-family:'Poppins',sans-serif;font-weight:700;font-size:25px;color:var(--accent);margin-top:26px}
.foot{font-family:'Poppins',sans-serif;font-size:13px;letter-spacing:.06em;color:#8a94a0;text-align:center;margin-top:30px}
@media(max-width:720px){.slide{padding:40px 28px;min-height:auto}h1{font-size:36px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Stefania Tratto, Coach 3C, Business/Team &amp; Life/Career Coach, Verona</div>
<script>
const S = [
 {t:'title', k:'Masterclass live, gratuita', h:'Cambiare carriera senza ripartire da zero', sub:'Come progettare la tua prossima carriera partendo dai talenti che hai già, non dagli annunci.'},
 {t:'who', k:'Per chi è', h:'Se ti riconosci qui, questa sera è per te', who:'Sei un professionista che sente di essere nel posto sbagliato. Vuoi cambiare, ma il pensiero di ricominciare da capo ti blocca. Non ti serve un altro corso di CV, ti serve una direzione.'},
 {t:'trap', k:'La trappola', h:'La trappola delle candidature', sub:'Mandi curriculum, insegui annunci, aspetti risposte. Il mercato ti tratta come un profilo da filtrare, e ti senti sempre più piccolo. Così il cambiamento sembra una fuga, non una scelta.'},
 {t:'reframe', k:'Il vero nodo', big:'Il problema non è il mercato. È che nessuno ti ha mai insegnato a <span class="a">guidare te stesso</span> nel cambiamento.'},
 {t:'part', k:'Parte 1', h:'Perché il cambiamento fallisce'},
 {t:'point', k:'Errore 1', h:'Parti dall’esterno', sub:'Cerchi la posizione giusta prima di sapere chi sei al lavoro. Così ogni scelta è una scommessa sugli altri, mai su di te.'},
 {t:'point', k:'Errore 2', h:'La paura del da zero', sub:'Credi di dover buttare via anni di esperienza. Non è vero: i tuoi talenti si spostano con te. Cambia il contesto, non il tuo valore.'},
 {t:'part', k:'Parte 2', h:'Il metodo: cambiare da dentro'},
 {t:'framework', k:'Coach 3C', h:'Tre pilastri per una svolta che regge', grid:[
   {n:'01', t:'Talenti', d:'Riconoscere cosa sai fare meglio, davvero.'},
   {n:'02', t:'Autoleadership', d:'Imparare a guidarti nel cambiamento.'},
   {n:'03', t:'Autonomia', d:'Liberare la tua crescita, senza permessi.'}]},
 {t:'pillar', k:'Pilastro 1', h:'Talenti', sub:'Prima di scegliere cosa fare, scopri come funzioni. Con lo strumento dei 4Colors mappiamo il tuo modo naturale di lavorare, decidere e comunicare. Il punto di partenza sei tu, non un annuncio.'},
 {t:'pillar', k:'Pilastro 2', h:'Autoleadership', sub:'Dai miei libri Leader Evoluti per Team Evoluti: un leader evoluto guida prima se stesso. Nel cambio di carriera vuol dire smettere di aspettare il permesso e iniziare a orientare le tue scelte.'},
 {t:'pillar', k:'Pilastro 3', h:'Autonomia, la mentalità Teal', sub:'Dal mio libro Teal: le persone crescono quando vengono liberate da rigidità e controllo. Lo stesso vale per te: la tua prossima carriera si progetta dandoti fiducia e autonomia, non regole altrui.'},
 {t:'tool', k:'Lo strumento', h:'I 4Colors: conoscere come funzioni', grid:[
   {n:'', t:'Come decidi', d:'Di pancia o coi dati.'},
   {n:'', t:'Come comunichi', d:'Diretto o relazionale.'},
   {n:'', t:'Come cresci', d:'Sfida o stabilità.'}]},
 {t:'part', k:'Parte 3', h:'Come si mette in pratica'},
 {t:'steps', k:'Il percorso', h:'Da bloccato a in movimento', points:['Mappa i tuoi talenti reali con i 4Colors','Scegli una direzione coerente con chi sei','Fai il primo passo guidando te stesso, non gli eventi']},
 {t:'event', k:'La masterclass', h:'Una sera, 60 minuti, dal vivo', sub:'Nella masterclass live lavoriamo sui tre pilastri, a partire dai tuoi talenti. Esci con una direzione di lavoro, non con altri compiti da fare.'},
 {t:'whyme', k:'Chi sono', h:'Stefania Tratto', who:'Business/Team & Life/Career Coach, Master Practitioner di PNL e Neuro-Semantica, consulente 4Colors. Autrice di Leader Evoluti per Team Evoluti e Teal. Da anni accompagno persone e team a crescere partendo da ciò che sono.', byline:'Coach 3C, Verona'},
 {t:'recap', k:'Ricapitolando', h:'Tre pilastri, una svolta', points:['Talenti: riparti da ciò che hai già','Autoleadership: guidati nel cambiamento','Autonomia: libera la tua crescita']},
 {t:'invite', k:'Il prossimo passo', big:'Se vuoi lavorare sulla tua svolta con me, il percorso di <span class="a">Professional Career Coaching</span> parte da qui.'},
 {t:'cta', k:'Prossimo passo', h:'Prenota la tua chiamata', sub:'Scopriamo insieme se il percorso di Professional Career Coaching è giusto per te.', ctaLine:'Scrivimi o prenota un primo confronto', disc:'Contenuto educativo. Nessun risultato professionale o guadagno è garantito e i risultati variano. (Educational content: no result or income is guaranteed; results vary and depend on your situation and effort.)'}
];

const el = document.getElementById('deck');
function esc(s){return s==null?'':s;}
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide';
  let html = '';
  if(s.k) html += '<div class="k">'+esc(s.k)+'</div>';
  if(s.h) html += (i===0?'<h1>':'<h2>')+esc(s.h)+(i===0?'</h1>':'</h2>');
  if(s.big) html += '<div class="big">'+esc(s.big)+'</div><div class="uline"></div>';
  if(s.who) html += '<div class="who">'+esc(s.who)+'</div>';
  if(s.sub) html += '<div class="sub">'+esc(s.sub)+'</div>';
  if(s.points){ html += '<ul>'; s.points.forEach(p=>html+='<li>'+esc(p)+'</li>'); html += '</ul>'; }
  if(s.grid){ html += '<div class="grid">'; s.grid.forEach(c=>{ html+='<div class="card">'+(c.n?'<div class="n">'+c.n+'</div>':'')+'<div class="t">'+esc(c.t)+'</div><div class="d">'+esc(c.d)+'</div></div>'; }); html += '</div>'; }
  if(s.byline) html += '<div class="byline">'+esc(s.byline)+'</div>';
  if(s.ctaLine) html += '<div class="cta-line">'+esc(s.ctaLine)+'</div>';
  if(s.disc) html += '<div class="disc">'+esc(s.disc)+'</div>';
  if(i===0) html += '<div class="uline"></div>';
  d.innerHTML = html;
  el.appendChild(d);
});
</script>
</body>
</html>
