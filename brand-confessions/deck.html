<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Velvet Rope Brand, a masterclass with Rachael Bozsik Johanson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#241a10;        /* deepened from her dominant espresso #2d1e0f */
    --panel:#2d1e0f;     /* her dominant espresso */
    --rule:#4a3828;      /* warm brown mid-tone */
    --text:#f3efe6;      /* from her ivory #f7f6f0 / greige #e4dfd9 */
    --muted:#c9bcae;
    --accent:#cdbfb3;    /* champagne taupe, harvested from her site */
    --display:'Cormorant Garamond', Georgia, serif;
    --sans:'Jost', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--text);font-family:var(--sans);font-weight:300}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:64px 64px 56px;
    margin:0 0 28px;
    min-height:560px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .kicker{font-family:var(--sans);font-weight:400;letter-spacing:.32em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:28px}
  h1{font-family:var(--display);font-weight:500;font-size:68px;line-height:1.02;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:500;font-size:46px;line-height:1.08;margin-bottom:22px}
  .sub{font-family:var(--display);font-style:italic;font-weight:400;font-size:26px;color:var(--muted);
    margin-top:26px;line-height:1.35;max-width:30ch}
  p{font-size:21px;line-height:1.62;color:var(--text);max-width:60ch;margin-top:16px;font-weight:300}
  .lead{font-family:var(--display);font-size:34px;line-height:1.3;font-weight:400;max-width:26ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:21px;line-height:1.5;padding:16px 0;border-top:1px solid var(--rule);max-width:62ch;color:var(--text)}
  li:first-child{border-top:none}
  li b{font-family:var(--display);font-weight:600;font-size:23px;color:var(--accent)}
  .hr{width:56px;height:1px;background:var(--accent);margin:0 0 30px}
  .byline{font-family:var(--sans);font-weight:400;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--muted);margin-top:44px}
  .pillar-n{font-family:var(--display);font-style:italic;font-size:20px;color:var(--accent);margin-bottom:10px}
  .cta h2{font-size:52px}
  .disclaimer{font-family:var(--sans);font-size:13px;color:var(--muted);line-height:1.5;
    margin-top:40px;max-width:58ch;font-weight:300}
  .pagenum{position:absolute;right:28px;bottom:22px;font-size:12px;letter-spacing:.2em;color:var(--rule)}
  @media(max-width:720px){
    .slide{padding:40px 28px}h1{font-size:44px}h2{font-size:34px}.cta h2{font-size:38px}
    .lead{font-size:26px}p,li{font-size:18px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kicker:'A Masterclass',
    h1:'The Velvet Rope Brand',
    sub:'How to position yourself so the right clients pay luxury rates, and sign without a second thought.',
    byline:'With Rachael Bozsik Johanson' },

  {t:'promise',
    kicker:'What you will walk away with',
    h2:'By the end of this session',
    list:[
      ['You will see why charging more is a positioning decision, not a pricing one.'],
      ['You will have the Velvet Rope framework for becoming the sought-after option in your market.'],
      ['You will know how to run a sales conversation that ends with a signed client, not a chase.'] ] },

  {t:'who',
    kicker:'Who this is for',
    h2:'If you build a brand people hire for taste',
    p:'Interior designers. Wedding planners. Photographers. Creative agency owners. Consultants. You are excellent at the work. Your clients love you. And yet you are still competing on price, still over-explaining your value, still saying yes to projects that drain you.',
    lead:'' },

  {t:'trap',
    kicker:'The trap',
    lead:'You were told the answer was more. More content, more visibility, more proof, more availability.',
    p:'So you show up everywhere, convince everyone, and quietly train the market to see you as one more option on the list.' },

  {t:'reframe',
    kicker:'The reframe',
    lead:'You do not have a pricing problem. You have a positioning problem.',
    p:'In the luxury market, individuals buy YOU first and your resume second. When the positioning is right, the price stops being an argument.' },

  {t:'part', kicker:'Part One', h2:'Why "more" is quietly capping your rates' },

  {t:'content',
    kicker:'Two different games',
    h2:'Cheesecake Factory or Michelin star',
    list:[
      ['<b>Low-ticket:</b> everywhere, often, convincing you of the value. More is more.'],
      ['<b>Luxury:</b> limited, never convincing. Quality over quantity. Less is more.'] ],
    p:'The way you market to one of these is the opposite of the other. Most founders are running the Cheesecake Factory playbook and wondering why Michelin clients do not come.' },

  {t:'content',
    kicker:'The over-explaining tax',
    h2:'Your "How We Work" PDF is scaring off your best clients',
    p:'Over-explaining signals insecurity. The more you justify, itemize, and reassure, the more you tell a high-end buyer that you are not sure you are worth it either. Luxury says less, and lets the taste do the talking.',
    lead:'' },

  {t:'part', kicker:'Part Two', h2:'The Velvet Rope framework' },

  {t:'pillar',
    pillar:'Pillar One',
    h2:'Brand the person, not the product',
    p:'At the top of your market, people do not buy a service. They buy you: your eye, your standards, your point of view. The brand is built around the founder, so the work becomes impossible to commoditize or compare on a spreadsheet.' },

  {t:'pillar',
    pillar:'Pillar Two',
    h2:'Manufacture demand through selectivity',
    p:'Ditch the open calendar. The founder takes every call. When you move to a handful of clients a year and vet who reaches you, availability itself becomes proof. One designer who repositioned went from 45 inquiries a year to 15, all qualified, and raised her rates.' },

  {t:'pillar',
    pillar:'Pillar Three',
    h2:'The branded magazine, not the capabilities deck',
    p:'Replace the generic how-we-work PDF with one editorial piece sent ahead of the conversation. Vogue-level, tactile, emotional. It does the positioning before you ever speak, so the client arrives already sold on the world you build.' },

  {t:'pillar',
    pillar:'Pillar Four',
    h2:'Run a Connection Call, not a sales call',
    p:'Naming it a sales call hands the client all the power. Rename it. A Connection Call is a decision on both ends to work together, a mutual vetting between peers. The frame changes who is auditioning whom.' },

  {t:'anchor',
    kicker:'The whole thing in one line',
    lead:'Luxury positioning gets you in the room. Sales confidence gets the check signed.',
    p:'Positioning earns the conversation. Confidence closes it. You need both, and most people are missing the second half.' },

  {t:'part', kicker:'Part Three', h2:'When fewer becomes the luxury' },

  {t:'content',
    kicker:'The shift',
    h2:'Fewer clients. Higher rates. A life worth remembering',
    list:[
      ['Inquiries drop in volume and climb in quality, so every call is worth taking.'],
      ['You charge double the going rate and become a top-three choice in your market.'],
      ['You stop competing and start being chosen, which is the only sustainable luxury.'] ] },

  {t:'why',
    kicker:'Why learn this from me',
    h2:'Rachael Bozsik Johanson',
    p:'Luxury brand strategist behind some of the most compelling, and profitable, personal brands. Harvard Business School keynote speaker, featured in Vogue, The New York Times, and Architectural Digest. I have spoken to tens of thousands of women and built the Velvet Rope framework from what actually moves luxury buyers: psychology meeting strategy in high-ticket markets.' },

  {t:'cta',
    kicker:'The invitation',
    h2:'Build a brand, and a life, worth remembering',
    p:'If you are ready to reposition from one-of-many to the obvious choice, this is the work. A limited number of founders are taken on each year, by application.',
    cta:'Apply to work with Rachael at rachaeljohanson.com',
    disclaimer:'This masterclass is educational. It shares frameworks and perspective, not a promise of results. Outcomes depend on your market, your work, and your execution. No income or client result is guaranteed.' }
];

const deck = document.getElementById('deck');
let n = 0;
for (const s of S){
  n++;
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta' : '');
  let h = '';
  if (s.kicker) h += '<div class="kicker">'+s.kicker+'</div>';
  if (s.t==='title'){
    h += '<h1>'+s.h1+'</h1>';
    if (s.sub) h += '<div class="sub">'+s.sub+'</div>';
    if (s.byline) h += '<div class="byline">'+s.byline+'</div>';
  } else {
    if (s.t==='part') h += '<div class="hr"></div>';
    if (s.pillar) h += '<div class="pillar-n">'+s.pillar+'</div>';
    if (s.h2) h += '<h2>'+s.h2+'</h2>';
    if (s.lead) h += '<div class="lead">'+s.lead+'</div>';
    if (s.list){ h += '<ul>'; for (const li of s.list) h += '<li>'+li[0]+'</li>'; h += '</ul>'; }
    if (s.p) h += '<p>'+s.p+'</p>';
    if (s.cta) h += '<p style="font-family:var(--display);font-size:26px;color:var(--accent);margin-top:28px">'+s.cta+'</p>';
    if (s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  }
  h += '<div class="pagenum">'+String(n).padStart(2,'0')+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
