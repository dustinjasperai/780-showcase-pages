<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The EPIC IEP Method — Live Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Source+Sans+3:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf4f8;        /* soft magenta-tinted warm white, ~96% tint of her #db458a */
    --panel:#ffffff;
    --rule:#ece9f0;
    --ink:#1b1a23;       /* her near-black */
    --muted:#55505e;
    --accent:#db458a;    /* her signature magenta button color */
    --highlight:#ffde59; /* her link yellow, used sparingly */
    --display:'Oswald',system-ui,sans-serif;   /* her display face */
    --body:'Source Sans 3',system-ui,sans-serif;/* her body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(27,26,35,.03)}
  .eyebrow{font-family:var(--display);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:14px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:54px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:38px;line-height:1.08;margin-bottom:16px}
  .promise{font-size:22px;color:var(--muted);margin-top:22px;max-width:44ch}
  p.lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:52ch;margin-top:10px}
  p.sub{font-size:19px;line-height:1.5;color:var(--muted);max-width:54ch;margin-top:14px}
  ul{margin:22px 0 0 0;list-style:none}
  li{font-size:20px;line-height:1.4;padding:12px 0 12px 40px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:6px;top:20px;width:14px;height:14px;border-radius:4px;
    background:var(--accent)}
  .num{font-family:var(--display);font-weight:700;color:var(--accent);font-size:16px;letter-spacing:.12em}
  .big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:-.01em}
  .mark{background:linear-gradient(transparent 62%,var(--highlight) 62%);padding:0 2px}
  .cta h2{font-size:42px}
  .step{display:flex;gap:18px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--rule)}
  .step:first-of-type{border-top:none}
  .step .k{font-family:var(--display);font-weight:700;color:var(--accent);font-size:22px;min-width:42px}
  .step .b{font-size:19px;line-height:1.4}
  .step .b b{font-weight:600}
  .disclaimer{font-size:14px;color:var(--muted);margin-top:26px;max-width:60ch;line-height:1.5}
  .brandline{font-family:var(--display);letter-spacing:.1em;text-transform:uppercase;font-size:13px;
    color:var(--muted);margin-top:30px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',eyebrow:'A free live masterclass with the Special Education Boss',
  h1:'The EPIC IEP Method',
  promise:'How to walk into any IEP or 504 meeting like the expert in the room, not the parent hoping for a good outcome.'},

 {t:'who',eyebrow:'Who this is for',h2:'If your child has an IEP or a 504, this is for you.',
  items:['The parent who gets the meeting invite and feels their stomach drop.',
         'The parent who nodded through the last meeting and signed, then wished they had asked more.',
         'The parent who knows their child needs more, but not how to get it written down.']},

 {t:'statement',eyebrow:'The trap',
  big:'You were handed a 20-page document and about 45 minutes to agree to it.',
  sub:'A team of professionals who do this every week, and one parent who does it once a year. That is the room most families walk into.'},

 {t:'statement',eyebrow:'The reframe',
  big:'The IEP meeting is not where your child’s services get decided. It is where they get documented.',
  sub:'The deciding happens before you ever sit down. The parents who get results are the ones who walk in already knowing what the document should say.'},

 {t:'part',num:'Part One',h2:'The real problem is not the school. It is walking in without a system.',
  lead:'Hope is not a strategy at the IEP table. When you do not know what to ask for, you cannot tell the difference between a plan that serves your child and one that just keeps the district compliant.'},

 {t:'statement',eyebrow:'What winging it costs',
  big:'Services you did not know to ask for do not show up on their own.',
  sub:'Goals that are vague on paper are vague in the classroom. The gap between what your child needs and what the document says is where a whole year is quietly lost.'},

 {t:'who',eyebrow:'Three myths that keep parents quiet',h2:'What the room is counting on you to believe.',
  items:['“The team are the experts, so I should defer to them.” You are the only expert on your child in that room.',
         '“If I push, I will be the difficult parent.” Prepared is not difficult. Prepared is respected.',
         '“Once I sign, it is final.” You have procedural rights before, during and after you sign.']},

 {t:'part',num:'Part Two',h2:'The EPIC IEP Method: the seven parts of the document, mastered in order.',
  lead:'Every IEP is built from the same seven parts. Master them in order and you can read any IEP, challenge any weak spot, and walk in knowing exactly what the plan should say before anyone opens their laptop.'},

 {t:'steps',eyebrow:'The method, step by step',h2:'Seven parts. One system.',
  steps:[
   {k:'1',b:'<b>Evaluations.</b> The foundation of the entire IEP. If the evaluation is thin, everything built on top of it is thin.'},
   {k:'2',b:'<b>Present Levels (PLAAFP).</b> The one page that quietly decides the whole year. Weak present levels cap every goal and service that follows.'},
   {k:'3',b:'<b>Annual Goals.</b> Charting the course. How to tell a measurable goal from a goal that will never be measured.'},
   {k:'4',b:'<b>Accommodations and Modifications.</b> The right balance of support, written so the classroom actually has to deliver it.'}]},

 {t:'steps',eyebrow:'The method, continued',h2:'The parts most parents never touch.',
  steps:[
   {k:'5',b:'<b>Least Restrictive Environment.</b> The balance of support and inclusion that fits your child, not the district’s default placement.'},
   {k:'6',b:'<b>Service Delivery.</b> Turning the plan into strategically designed supports with real minutes attached, not good intentions.'},
   {k:'7',b:'<b>Procedural Safeguards.</b> The legal protections you already have, and how to use them as leverage instead of a last resort.'}]},

 {t:'statement',eyebrow:'The hinge of the whole document',
  big:'Present levels are where a child’s whole year is quietly won or lost.',
  sub:'Learn to read this one page and you can predict every goal, service and placement that follows from it. It is the first thing I teach, because fixing it changes everything downstream.'},

 {t:'statement',eyebrow:'Why the order matters',
  big:'You cannot write a strong goal on top of a weak present-levels page.',
  sub:'The method follows the document because the document is a chain. Fix it in order and each part holds up the next. That is what turns a stack of pages into a plan.'},

 {t:'statement',eyebrow:'The posture, not just the paperwork',
  big:'Turn “no” into “let’s document that.”',
  sub:'The Special Education Boss posture is calm, specific and on the record. You ask in the district’s own language, and you get the answer written down either way. That is where procedural safeguards stop being a pamphlet and start being leverage.'},

 {t:'part',num:'Part Three',h2:'The prepared parent walks into a different room.',
  lead:'You read the draft before the meeting and you already know which two pages are weak. You ask for what your child needs in the district’s own language. You get it written in ink. You sign because it is right, not because you ran out of time.'},

 {t:'who',eyebrow:'The difference',h2:'Same parent. Same child. Different room.',
  items:['Before: handed the document in the meeting, reading it for the first time, agreeing to end the awkward silence.',
         'After: you have read it, marked it, and come with the three changes that matter in writing.',
         'The team treats the prepared parent differently. Preparation is the whole advantage.']},

 {t:'statement',eyebrow:'What you leave with',
  big:'A method you can run for every meeting, every year, for as long as your child is in school.',
  sub:'This is not a one-time fix. Once you own the seven parts, you can walk into the next meeting, and the one after that, already knowing what the document should say.'},

 {t:'why',eyebrow:'Why learn this from me',h2:'The Special Education Boss®',
  lead:'I have spent more than 25 years helping families, schools and systems get special education right. I wrote the #1 bestselling playbook The Epic IEP, I host the Special Education Boss® podcast, and I train thousands of parents, advocates and educators through the Special Education Academy. The EPIC IEP method is the system I teach them.'},

 {t:'cta',eyebrow:'Your next step',h2:'Go from lost to the Special Education Boss of your own child’s case.',
  lead:'This masterclass gives you the map. The live 2-Day Special Education Advocacy Intensive walks you through every part of the method with your own child’s documents in hand, so you are ready for the next meeting on the calendar.',
  cta:'Join the next live 2-Day Advocacy Intensive at specialeducationacademy.com',
  disclaimer:'This masterclass is for educational purposes only and is not legal advice. Every child and every district is different, and individual results vary. Nothing here guarantees a particular IEP outcome.'}
];

const deck=document.getElementById('deck');
function esc(x){return x}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide'+(s.t==='cta'?' cta':'');
  let h='';
  if(s.eyebrow) h+=`<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.t==='title'){ h+=`<h1>${s.h1}</h1><div class="promise">${s.promise}</div>`; }
  else if(s.t==='statement'){ h+=`<div class="big">${s.big}</div>`+(s.sub?`<p class="sub">${s.sub}</p>`:''); }
  else if(s.t==='part'){ h+=`<div class="num">${s.num}</div><h2>${s.h2}</h2>`+(s.lead?`<p class="lead">${s.lead}</p>`:''); }
  else if(s.t==='who'){ if(s.h2)h+=`<h2>${s.h2}</h2>`; h+='<ul>'+s.items.map(i=>`<li>${i}</li>`).join('')+'</ul>'; }
  else if(s.t==='steps'){ h+=`<h2>${s.h2}</h2>`+s.steps.map(st=>`<div class="step"><div class="k">${st.k}</div><div class="b">${st.b}</div></div>`).join(''); }
  else if(s.t==='why'){ h+=`<h2>${s.h2}</h2><p class="lead">${s.lead}</p>`; }
  else if(s.t==='cta'){ h+=`<h2>${s.h2}</h2><p class="lead">${s.lead}</p><div class="brandline">${s.cta}</div><div class="disclaimer">${s.disclaimer}</div>`; }
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
