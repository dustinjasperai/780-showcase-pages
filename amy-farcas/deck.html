<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Circle of Nutrition · Dr. Amy Farcas</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Faustina:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Source+Sans+3:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#faf4e9; --panel:#f3ead6; --rule:#e4d8be;
    --accent:#d39a43; --ink:#13223f; --ink-soft:#3c4660; --grey:#5d6577; --dim:#9a8f78; --cream:#faf4e9;
  }
  html,body{height:100%}
  body{background:#e8dcc4;font-family:'Source Sans 3',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e8dcc4}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Faustina',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Faustina',sans-serif;font-weight:500;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:4.8vw;font-weight:600}
  .t-normal h1{font-size:3.3vw;max-width:84%}
  .t-normal .body{font-family:'Source Sans 3',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.58;font-weight:400}
  .sub{font-size:1.85vw;color:var(--ink-soft);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Faustina',sans-serif;font-size:1.4vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#1b2d4d 0%,#0f1a30 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:86%;color:var(--cream);font-weight:400}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1b2d4d 0%,#0f1a30 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4vw;max-width:82%;color:var(--cream)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:#f1d6ac;border-radius:100px;padding:1.3vh 1.6vw;font-family:'Faustina',sans-serif;font-size:1.22vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.2vh;font-size:.92vw;color:#b9c3d6;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .circ-motif{position:absolute;pointer-events:none}
  .title-circ{right:7%;bottom:8%;width:20vw}
  .corner-circ{right:6%;bottom:7.5%;width:9vw;opacity:.5}
  .brandline{font-family:'Faustina',sans-serif;font-size:1.32vw;color:var(--ink-soft);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(19,34,63,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Faustina',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">Full Circle Pet Nutrition</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- three-arc circle: the three factors held at once (needs / intake / life) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="circ" viewBox="0 0 200 200">
  <g fill="none" stroke-width="5" stroke-linecap="round">
    <path d="M100 32 A68 68 0 0 1 158.9 134" stroke="#d39a43" opacity="0.95"/>
    <path d="M151.3 145 A68 68 0 0 1 48.7 145" stroke="#13223f" opacity="0.5"/>
    <path d="M41.1 134 A68 68 0 0 1 100 32" stroke="#d39a43" opacity="0.3"/>
    <circle cx="100" cy="100" r="7" fill="#d39a43" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Circle of Nutrition',sub:'How a board-certified veterinary nutritionist builds one feeding plan that actually fits your pet, and your real life.',brand:true,circ:'title'},
 {t:'normal',k:'Who this is for',title:"You've done everything right. And you still aren't sure.",body:"You've read the labels. You've asked your vet. You've spent more hours researching pet food than you'd like to admit. And at the end of all of it, you still don't quite feel certain you're getting it right."},
 {t:'dark',title:"That isn't a knowledge problem. It's a framework problem."},

 {t:'section',idx:'Part One',title:'Why Good Advice Still Fails You'},
 {t:'normal',k:'The flood',title:'Everyone has an answer for you.',body:'Labels, online forums, influencers, even well-meaning general advice. Most of it was designed for a general audience, or a marketing goal, or a moment that has already passed. None of it was designed around your specific pet.'},
 {t:'normal',k:'The single-factor trap',title:'Most advice optimizes one thing at a time.',body:'The trendiest diet. The cleanest ingredient. The cheapest bag. When each answer fixes one factor in isolation, two perfectly good answers can still contradict each other, and you are left holding the tie-breaker.'},
 {t:'dark',title:'A plan built on one factor collapses the moment life changes.'},

 {t:'section',idx:'Part Two',title:'The Circle of Nutrition'},
 {t:'normal',k:'The method',title:'A real plan holds three things at the same time.',body:'The Circle of Nutrition is the framework veterinary nutritionists are trained on. Its whole point is to hold all three factors at once, instead of trading one off against another. Here is how it works.'},
 {t:'normal',k:'Factor one, Needs',title:'What your specific pet actually needs.',body:'Life stage, body condition, the medical picture, the conditions no label on a shelf can see. This is where a nutritionist starts, not with the food, but with the animal.'},
 {t:'normal',k:'Factor two, Intake',title:'What your pet is actually eating.',body:'The real diet, treats and table scraps and all, not the idealized version on paper. A plan that ignores what is truly going in the bowl is already wrong on day one.'},
 {t:'normal',k:'Factor three, Life',title:'What your real life can actually sustain.',body:'Your budget, your time, your household, the other pets, the picky eater. The best plan on paper is worthless if you cannot keep it. The right plan is the one you can actually live with.'},
 {t:'dark',title:'Needs, intake, and real life. Held together, never traded off.'},

 {t:'section',idx:'Part Three',title:'The Plan That Survives'},
 {t:'normal',k:'A living document',title:'A good plan is built to absorb change.',body:'A new diagnosis, a move, a tighter month. Because it was built on all three factors from the start, your Personalized Pet Nutrition Guide bends with real life instead of breaking the first time something shifts.'},
 {t:'normal',k:'Evidence over marketing',title:'You learn to tell science from a sales pitch.',body:'Once you can read a label and a claim through the three factors, you stop outsourcing the decision to whoever shouted loudest. You start making it yourself, with confidence.'},
 {t:'dark',title:"The goal isn't a perfect diet. It's a confident, durable plan for your pet."},

 {t:'section',idx:'Why me',title:'From the Clinic to Your Kitchen'},
 {t:'normal',k:"Who's teaching this",title:'A board-certified veterinary nutritionist, teaching you directly.',body:'Sixteen years building nutrition plans for devoted pet parents, one of fewer than 150 board-certified veterinary nutritionists in the United States. This is the reasoning I use for patients, put into your hands for your own pet.'},

 {t:'section',idx:'Your next step',title:'Join Full Circle Pet Nutrition'},
 {t:'cta',title:'Ready to feed with confidence instead of guesswork?',chips:['Join the Full Circle priority list','Come to the live Ask Me Anything'],disc:'Educational content for pet parents. Nutrition information is general and does not replace individualized veterinary care; always work with your own veterinarian. No specific health outcome is guaranteed; results vary by pet.'},
];

const deck=document.getElementById('deck');
function circ(kind){return `<svg class="circ-motif ${kind==='title'?'title-circ':'corner-circ'}"><use href="#circ"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Full Circle <b>Pet Nutrition</b> · Dr. Amy Farcas</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.circ) h+=circ(s.circ);
  else if(s.t==='title') h+=circ('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
