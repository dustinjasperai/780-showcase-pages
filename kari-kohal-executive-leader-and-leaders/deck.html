<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Credibility Shortcut — Kari Kohal, NextGen Insurance Consulting Group</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f6f8;        /* ground, from site #f7f7f7 family */
    --panel:#ffffff;     /* panel */
    --rule:#d8d8dd;      /* from #cccccc */
    --ink:#464545;       /* her heading color (evidence) */
    --muted:#6f6e6e;
    --accent:#323699;    /* her indigo accent (evidence, uses=30) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:Georgia,"Droid Serif","Times New Roman",serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:46px 48px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .kicker{font-family:"Poppins",sans-serif;font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:16px}
  h1{font-family:"Poppins",sans-serif;font-weight:700;font-size:44px;line-height:1.08;color:var(--ink);margin-bottom:14px}
  h2{font-family:"Poppins",sans-serif;font-weight:600;font-size:30px;line-height:1.14;color:var(--ink);margin-bottom:14px}
  .sub{font-size:20px;line-height:1.5;color:var(--muted);max-width:42ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);max-width:56ch;margin-top:6px}
  ul{list-style:none;margin-top:10px}
  li{font-size:18px;line-height:1.55;color:var(--ink);padding-left:26px;position:relative;margin-bottom:12px;max-width:58ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--accent)}
  .step{font-family:"Poppins",sans-serif;font-weight:700;font-size:15px;color:var(--accent);letter-spacing:.05em;margin-bottom:8px}
  .big{font-family:"Poppins",sans-serif;font-weight:300;font-size:30px;line-height:1.3;color:var(--ink);max-width:40ch}
  .ladder{position:absolute;right:38px;bottom:30px;display:flex;align-items:flex-end;gap:6px;opacity:.5}
  .ladder i{display:block;width:12px;background:var(--accent);border-radius:2px}
  .foot{font-family:"Poppins",sans-serif;font-size:12px;color:var(--muted);letter-spacing:.04em;position:absolute;left:48px;bottom:22px}
  .cta{border:2px solid var(--accent)}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:60ch;font-family:"Poppins",sans-serif}
  .name{font-family:"Poppins",sans-serif;font-weight:600;font-size:16px;color:var(--ink);margin-top:20px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Kari Kohal',
   h:'The Credibility Shortcut',
   sub:'How insurance professionals build a book of business on trust, not tenure.',
   name:'Kari Kohal, MBA · Founder, NextGen Insurance Consulting Group'},

  {t:'who', kicker:'Who this is for',
   h:'If you are early in your book, this room is for you.',
   bullets:[
     'Producers and agents who are good at the work but invisible in the market.',
     'Agency owners who want a whole sales team seen as trusted advisors, not quote machines.',
     'Anyone who was told credibility only comes after twenty years in the business.']},

  {t:'trap', kicker:'The trap',
   h:'You were told to wait your turn.',
   body:'The industry runs on a quiet rule: nobody takes you seriously until you have the grey hair and the decades. So you compete the only way that is left to you, on price and on being available. And the longer that goes on, the more it feels like the problem is you.'},

  {t:'reframe', kicker:'The reframe',
   big:'The agents winning the best accounts are rarely the most experienced. They are the most trusted. And trust is something you can build on purpose, starting now.'},

  {t:'part', step:'Part One', h:'The credibility gap', sub:'Why experience and trust are not the same thing.'},

  {t:'content', kicker:'The core problem',
   h:'Buyers do not buy the most experienced advisor. They buy the one they believe.',
   bullets:[
     'When every quote looks the same, the decision is made on trust, not on tenure.',
     'Experience is invisible to a prospect who has never heard of you.',
     'So the gap is not a skills gap. It is a credibility gap, and it is the one thing nobody teaches you to close.']},

  {t:'content', kicker:'The cost of the gap',
   h:'An invisible expert loses to a visible one, every time.',
   body:'You watch less capable people win the accounts, the referrals, and the promotions, because they are known and you are not. The work was never the problem. Being believed before the conversation starts, that is the problem.'},

  {t:'proof', kicker:'Why this works',
   h:'I built a book this way, from the mailroom.',
   body:'I started at the bottom of a specialty brokerage, grew my book by more than three hundred percent a year for five years running, and became President of the firm by thirty three. I did not out wait anyone. I built credibility on purpose, before I had earned it the slow way.'},

  {t:'part', step:'Part Two', h:'The Credibility Boost method', sub:'Three pillars that compound trust into a book of business.'},

  {t:'content', kicker:'Pillar one', h:'Self worth',
   body:'You cannot sell conviction you do not feel. The first pillar is doing the honest work on your own value, so you walk into every room selling from belief instead of apology. Prospects feel the difference in the first thirty seconds.'},

  {t:'content', kicker:'Pillar two', h:'Personal brand',
   body:'Be known before the quote. The second pillar builds a clear, repeatable professional identity, what you stand for and who you serve, so that your name arrives in the room before you do and the prospect already trusts the direction.'},

  {t:'content', kicker:'Pillar three', h:'Leverage your skills',
   body:'You already own more authority than you use. The third pillar takes the skills, wins, and knowledge you already have and turns them into visible proof, the content, conversations, and positioning that make you the obvious choice.'},

  {t:'content', kicker:'How it compounds',
   h:'Three pillars, one outcome.',
   bullets:[
     'Self worth makes you believable in the room.',
     'Personal brand makes you known before the room.',
     'Leveraged skills make you the obvious choice once you are in it.',
     'Stacked together, they turn a cold market into a warm book of business.']},

  {t:'part', step:'Part Three', h:'What the first 90 days look like', sub:'A practice, not a personality transplant.'},

  {t:'content', kicker:'The practice',
   h:'Small, repeatable moves, done consistently.',
   bullets:[
     'A clear positioning statement you use everywhere, the same way, every week.',
     'A simple rhythm of visible proof, so the market keeps meeting you.',
     'A handful of credibility assets you can point a prospect to before the first call.']},

  {t:'content', kicker:'What changes',
   h:'From chasing quotes to being sought out.',
   body:'The agents who do this stop leading with price. Conversations start warmer, referrals come unprompted, and the accounts you actually want begin to find you. Individual results vary, but the direction is the same for everyone who does the work.'},

  {t:'proof', kicker:'Why me',
   h:'This is the career I built, taught on purpose.',
   body:'Sixteen years in specialty insurance, seven leading teams, national awards, and a book grown from nothing to President level. NextGen Insurance Consulting Group exists to hand the next generation the credibility playbook I had to figure out the hard way.'},

  {t:'cta', kicker:'Your next step',
   h:'Build your credibility with NextGen.',
   body:'If you want the full Credibility Boost method and one on one guidance for yourself or your sales team, book an initial consultation with me and we will map your first ninety days.',
   name:'Kari Kohal · NextGen Insurance Consulting Group · kari@karikohal.com',
   disc:'Educational content only. This masterclass teaches a method for building professional credibility and is not a guarantee of income, production, or career outcomes. Individual results vary.'}
];

function ladder(){var w=document.createElement('div');w.className='ladder';for(var i=0;i<5;i++){var b=document.createElement('i');b.style.height=(14+i*12)+'px';w.appendChild(b);}return w;}

const deck=document.getElementById('deck');
S.forEach(function(s,idx){
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  let html='';
  if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
  if(s.step) html+='<div class="step">'+s.step+'</div>';
  if(s.h) html+=(s.t==='title'?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>');
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.big) html+='<div class="big">'+s.big+'</div>';
  if(s.body) html+='<p class="body">'+s.body+'</p>';
  if(s.bullets){html+='<ul>';s.bullets.forEach(function(b){html+='<li>'+b+'</li>';});html+='</ul>';}
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  if(s.name) html+='<div class="name">'+s.name+'</div>';
  el.innerHTML=html;
  if(s.t==='part'||s.t==='reframe') el.appendChild(ladder());
  el.insertAdjacentHTML('beforeend','<div class="foot">NextGen Insurance Consulting Group</div>');
  deck.appendChild(el);
});
</script>
</body>
</html>
