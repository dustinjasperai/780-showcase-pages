<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mental GPS — a 1° Coaching masterclass with Paul Melella Jr.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#141013;        /* dark warm-charcoal ground, from their dark site scheme */
    --panel:#1E171A;
    --rule:#322429;
    --ink:#F4F1EE;
    --muted:#B3A7AB;
    --accent:#D41111;    /* 1° brand red, from brand.json */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:8vh 9vw;border-bottom:1px solid var(--rule);position:relative}
  .kicker{font-family:'Bebas Neue',sans-serif;letter-spacing:.18em;font-size:clamp(14px,1.4vw,18px);color:var(--accent);text-transform:uppercase;margin-bottom:22px}
  h1{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.01em;line-height:.95;font-size:clamp(48px,9vw,128px);text-transform:uppercase}
  h2{font-family:'Bebas Neue',sans-serif;font-weight:400;letter-spacing:.015em;line-height:1;font-size:clamp(34px,6vw,76px);text-transform:uppercase}
  p{font-size:clamp(17px,1.9vw,24px);max-width:60ch;color:var(--ink);margin-top:18px}
  p.lead{font-size:clamp(20px,2.4vw,30px)}
  p.muted{color:var(--muted)}
  .big{font-family:'Bebas Neue',sans-serif;font-size:clamp(90px,22vw,300px);line-height:.8;color:var(--accent)}
  .deg{color:var(--accent)}
  .num{font-family:'Bebas Neue',sans-serif;color:var(--accent);font-size:clamp(40px,6vw,84px);line-height:.9;margin-bottom:6px}
  .stat{display:flex;gap:46px;flex-wrap:wrap;margin-top:34px}
  .stat div .n{font-family:'Bebas Neue',sans-serif;color:var(--accent);font-size:clamp(44px,7vw,96px);line-height:.85}
  .stat div .l{color:var(--muted);font-size:clamp(14px,1.4vw,17px);margin-top:6px;max-width:22ch}
  .accentbar{width:84px;height:5px;background:var(--accent);margin-bottom:28px}
  .disclaimer{color:var(--muted);font-size:14px;max-width:70ch;margin-top:30px;line-height:1.55}
  .cta-note{font-family:'Bebas Neue',sans-serif;letter-spacing:.06em;font-size:clamp(22px,3vw,40px);color:var(--ink);text-transform:uppercase;margin-top:18px}
  .pagefoot{position:absolute;bottom:24px;left:9vw;color:var(--muted);font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-family:'Bebas Neue',sans-serif}
</style>
</head>
<body>
<div id="deck"></div>
<script>
/* Masterclass deck — Paul Melella Jr. teaching HIS advisor audience.
   Hand-authored slide array; no ad strategy, no third-party pitch. */
const S = [
  {t:'title', kick:'A 1° Coaching Masterclass',
    h:'The Mental GPS',
    lead:'How financial advisors scale from $250K to $1M and beyond without outworking a misaligned identity.',
    sub:'With Coach Paul Melella Jr. &middot; Founder, 1° Coaching'},

  {t:'content', kick:'Who this is for',
    h:'You are already good. You are also stuck.',
    body:'You are a financial advisor somewhere between $250K and $500K. You know the business. You have the credentials, the CRM, the referral relationships. And yet the number has not moved the way your effort says it should.',
    muted:'If you are grinding more hours for flatter results, and faith, family and health are quietly paying the bill, this hour is for you.'},

  {t:'content', kick:'The trap',
    h:'You bought the tactics. Twice.',
    body:'More scripts. A better pipeline. Another prospecting system. Each one promised the breakthrough. Each one worked for a few weeks, then your results drifted back to the same ceiling.',
    lead:'The tactics were never the problem.'},

  {t:'content', kick:'The reframe',
    h:'You can’t outwork a misaligned identity.',
    muted:'The bottleneck is not your calendar or your pipeline. It is who you believe you are when no one is watching. Your production will always drift back to match that self image.'},

  {t:'content', num:'Part One', h:'The core problem is internal.',
    muted:'Why effort stops converting into income.'},

  {t:'content', bar:true, h:'You are running a $250K operating system.',
    body:'Every advisor carries an identity, a self image of the level they belong at. Set a goal above that level and your own mind quietly protects the old one. The missed follow up. The call you talked yourself out of. The inconsistency you cannot explain.',
    muted:'In twenty years and hundreds of advisors, the ceiling has always been the same place: not the market, not the hours, the identity underneath them.'},

  {t:'content', kick:'The real cost',
    h:'Burnout is not a time problem.',
    body:'When who you are and what you are chasing do not line up, the gap gets paid for in energy. Longer hours. Shorter patience. The faith, family and health trade you never actually agreed to make.'},

  {t:'content', num:'Part Two', h:'The 1° Method.',
    muted:'Three systems that move the identity first, so the tactics finally hold.'},

  {t:'content', kick:'System 01',
    h:'The TRANSFORMATION Doctrine',
    body:'A fourteen step identity system built over two decades. It works in one order and only one order: identity first, then standards, then behavior. Most advisors try to change behavior and wonder why it never sticks. This is why.'},

  {t:'content', kick:'System 02',
    h:'The Mental GPS Framework',
    body:'Your self talk is a navigation system, and most advisors never set the destination. The Mental GPS reprograms the thought patterns running your day so your decisions match the advisor you are becoming, not the one you are leaving behind.'},

  {t:'content', kick:'System 03',
    h:'The 1° Daily Mental Training System',
    body:'You do not need a transformation. You need one degree, held every day. Small shifts created daily compound into monumental results over time. This is the daily discipline that makes the first two systems permanent.'},

  {t:'content', big:'1&deg;',
    h:'One degree of turn, held over distance, changes everything.',
    muted:'A single degree feels like nothing on the day. Over a year it is a different destination entirely. That is the whole method in one image.'},

  {t:'content', num:'Part Three', h:'When the identity holds.'},

  {t:'content', bar:true, h:'The standard rises and the number follows.',
    body:'Prospecting stops feeling like pushing. The hours come down because the drag comes out. Production climbs because it is finally matched to who you have decided to be.',
    stats:[['Chairman’s Council','A level advisors in this work have reached'],
           ['$2M+','Personal income milestones clients have hit'],
           ['20+ yrs','Working directly with advisors and leaders']]},

  {t:'content', kick:'Why me',
    h:'Coach Paul Melella Jr.',
    body:'Master level martial artist. Built four martial arts schools and coached champions at the national level. Over twenty years working directly with financial advisors, entrepreneurs and senior leaders. Bestselling co author of YOU Have Infinite Power, with a foreword by Bob Proctor.',
    muted:'I teach identity the way I was taught discipline. From the inside out, one degree at a time.'},

  {t:'content', kick:'Remember this',
    h:'Identity first. Tactics second.',
    muted:'Fix the order and the ceiling you have been fighting for years simply moves.'},

  {t:'cta', kick:'Your next step',
    h:'Work with the 1° Coaches.',
    body:'If this is the piece that has been missing, the next move is a conversation. Tell us where you are and where you are trying to go, and we will show you how the 1° work applies to your practice.',
    note:'Book your strategy call at onedegreecoachingprogram.com',
    disclaimer:'This masterclass is for education only. It is not financial, legal, or investment advice, and it is not a promise of income or results. Outcomes depend on many factors and vary from person to person. Examples and milestones referenced are illustrative of what some clients have reported and are not typical or guaranteed.',
    foot:'1° Coaching &middot; Paul Melella Jr.'}
];

function esc(s){return s;}
const deck = document.getElementById('deck');
S.forEach(function(s){
  const sec = document.createElement('section');
  sec.className = 'slide';
  let html = '';
  if(s.kick) html += '<div class="kicker">'+s.kick+'</div>';
  if(s.num)  html += '<div class="num">'+s.num+'</div>';
  if(s.big)  html += '<div class="big">'+s.big+'</div>';
  if(s.bar)  html += '<div class="accentbar"></div>';
  if(s.t==='title') html += '<h1>'+s.h+'<span class="deg">.</span></h1>';
  else if(s.t==='reframe' || s.t==='idea') html += '<h2>'+s.h+'</h2>';
  else html += '<h2>'+s.h+'</h2>';
  if(s.lead) html += '<p class="lead">'+s.lead+'</p>';
  if(s.body) html += '<p>'+s.body+'</p>';
  if(s.muted) html += '<p class="muted">'+s.muted+'</p>';
  if(s.sub)  html += '<p class="muted">'+s.sub+'</p>';
  if(s.stats){ html += '<div class="stat">'; s.stats.forEach(function(x){ html += '<div><div class="n">'+x[0]+'</div><div class="l">'+x[1]+'</div></div>'; }); html += '</div>'; }
  if(s.note) html += '<div class="cta-note">'+s.note+'</div>';
  if(s.disclaimer) html += '<p class="disclaimer">'+s.disclaimer+'</p>';
  if(s.foot) html += '<div class="pagefoot">'+s.foot+'</div>';
  sec.innerHTML = html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
