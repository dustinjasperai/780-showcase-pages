<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change the Conversation — a LEGO® Serious Play® masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Overpass:wght@400;600;800;900&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef7fb; --panel:#fcfeff; --ink:#1c1c1c; --muted:#5b5b57;
    --accent:#e22658; --cyan:#3dbfe8; --teal:#05cab6; --rule:#e6e6e3;
    --head:"Overpass",system-ui,sans-serif; --body:"Inter",system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:46px 48px;margin:0 0 20px;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(28,28,28,.03)}
  .kick{font-family:var(--head);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:900;font-size:52px;line-height:1.03;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:34px;line-height:1.08;margin:0 0 16px;letter-spacing:-.01em}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);max-width:40ch;margin:0}
  .big{font-size:30px;line-height:1.3;font-weight:600;max-width:24ch;margin:0}
  ul{list-style:none;margin:10px 0 0;padding:0}
  li{position:relative;padding:11px 0 11px 34px;font-size:19px;line-height:1.45;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li::before{content:"";position:absolute;left:4px;top:19px;width:14px;height:14px;border-radius:4px;
    background:var(--accent);box-shadow:3px 0 0 -3px #fff, 7px 0 0 var(--cyan)}
  .step{font-family:var(--head);font-weight:900;font-size:15px;color:#fff;background:var(--accent);
    display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:10px;margin-bottom:16px}
  .foot{font-family:var(--head);font-weight:700;letter-spacing:.04em;font-size:13px;color:var(--muted);margin-top:24px}
  .part h1{color:var(--accent)}
  .cta{background:var(--ink);color:#fff;border-color:var(--ink)}
  .cta h2,.cta .kick{color:#fff}
  .cta .kick{color:var(--cyan)}
  .disc{font-size:13px;line-height:1.5;color:#b9b9b4;margin-top:26px;max-width:62ch}
  .brand{display:flex;gap:7px;margin-bottom:22px}
  .brand i{width:16px;height:16px;border-radius:4px;display:block}
  .pageno{font-family:var(--head);font-size:12px;color:#b4b4af;margin-top:18px;font-weight:700}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title',
    h:"Change the Conversation",
    lede:"Using LEGO® Serious Play® in the meetings you already run.",
    foot:"A live masterclass with Michael Fearne · The LSP Method"},
  {t:'who',
    kick:"Who this is for",
    big:"For facilitators, managers, coaches and educators who are tired of meetings where the loudest voice wins and most of the room stays quiet."},
  {t:'list',
    kick:"The quiet-room problem",
    h:"You know this meeting.",
    list:["The same three people talk the whole time.",
      "Roughly four in five sit back and say nothing.",
      "You get the safe answer, not the real one.",
      "Everyone nods, then nothing actually changes."]},
  {t:'reframe',
    kick:"The reframe",
    big:"The problem isn't your people. It's the medium. A talking-only meeting rewards whoever is fastest and loudest, not whoever is right."},
  {t:'part',
    kick:"Part one",
    h:"Why talking-only meetings fail"},
  {t:'list',
    kick:"Part one",
    h:"What really drives the room",
    list:["Status and hierarchy decide who speaks first.",
      "Fast talkers crowd out the deep thinkers.",
      "There is no shared thing in the middle to point at.",
      "Decisions live in the air, so they evaporate by Monday."]},
  {t:'part',
    kick:"Part two",
    h:"The science of building"},
  {t:'list',
    kick:"Part two",
    h:"Why your hands know things",
    list:["The hand-mind connection: making unlocks thinking words can't reach.",
      "Constructionism: people understand an idea when they build it.",
      "Everyone builds, so everyone takes part. Not some. All.",
      "Metaphor and flow surface what people can't say outright."]},
  {t:'shift',
    kick:"The everyday shift",
    big:"Everyday LSP is not a once-a-year workshop. It is a daily tool. Not about adding more to your day. About improving the conversations you are already having."},
  {t:'part',
    kick:"Part three",
    h:"The method, in four moves"},
  {t:'step', n:"1",
    kick:"Move one",
    h:"Individual Models",
    lede:"Everyone builds their own answer first, so every person walks in with a view before anyone has spoken."},
  {t:'step', n:"2",
    kick:"Move two",
    h:"Shared Models",
    lede:"Merge the individual models into one the whole group builds and owns together."},
  {t:'step', n:"3",
    kick:"Move three",
    h:"Landscape Models",
    lede:"Place the models in relation to each other and see how the whole thing actually connects."},
  {t:'step', n:"4",
    kick:"Move four",
    h:"System Models",
    lede:"Add the connections and the outside forces, then stress-test decisions and play out real scenarios."},
  {t:'list',
    kick:"The same hour, run differently",
    h:"What changes in the room",
    list:["Minute one: everyone has a model, not just an opinion.",
      "The quiet expert is suddenly the most interesting voice.",
      "The decision is built in the middle of the table, visible to all.",
      "People leave having committed to something they can see."]},
  {t:'list',
    kick:"The overlooked skill",
    h:"Design a question people can build",
    list:["A flat session and a breakthrough one differ by one thing: the building challenge.",
      "Ask a question that is open, personal and safe to answer in bricks.",
      "Get this right and the room facilitates itself."]},
  {t:'why',
    kick:"Why learn it here",
    h:"Michael Fearne",
    list:["Teaching the LEGO® Serious Play® method since 2013.",
      "Author of The LSP Method, the field's practical handbook.",
      "Leads an international network of certified LSP facilitators and trainers."]},
  {t:'cta',
    kick:"Keep the conversation going",
    h:"Start changing the conversation.",
    lede:"Go deeper with Everyday LSP, or get fully certified in the LSP Method. Find the next course at lspmethod.com.",
    disc:"Educational masterclass only. No income, outcome or result is guaranteed. Results vary with your situation, your audience and the work you put in."}
];

function esc(x){return (x||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function bricks(){return '<div class="brand"><i style="background:var(--accent)"></i><i style="background:var(--cyan)"></i><i style="background:var(--teal)"></i></div>';}
function listHTML(a){return "<ul>"+a.map(x=>"<li>"+esc(x)+"</li>").join("")+"</ul>";}

const app=document.getElementById('app');
S.forEach((s,i)=>{
  let inner="";
  const kick = s.kick? '<p class="kick">'+esc(s.kick)+'</p>':'';
  if(s.t==='title'){
    inner=bricks()+'<h1>'+esc(s.h)+'</h1><p class="lede">'+esc(s.lede)+'</p><p class="foot">'+esc(s.foot)+'</p>';
  } else if(s.t==='part'){
    inner=kick+'<h1>'+esc(s.h)+'</h1>';
  } else if(s.t==='who'||s.t==='reframe'||s.t==='shift'){
    inner=kick+'<p class="big">'+esc(s.big)+'</p>';
  } else if(s.t==='list'||s.t==='why'){
    inner=kick+'<h2>'+esc(s.h)+'</h2>'+listHTML(s.list);
  } else if(s.t==='step'){
    inner=kick+'<div class="step">'+esc(s.n)+'</div><h2>'+esc(s.h)+'</h2><p class="lede">'+esc(s.lede)+'</p>';
  } else if(s.t==='cta'){
    inner=kick+'<h2>'+esc(s.h)+'</h2><p class="lede">'+esc(s.lede)+'</p><p class="disc">'+esc(s.disc)+'</p>';
  }
  const cls = 'slide'+(s.t==='part'?' part':'')+(s.t==='cta'?' cta':'');
  app.insertAdjacentHTML('beforeend','<section class="'+cls+'">'+inner+'<p class="pageno">'+(i+1)+' / '+S.length+'</p></section>');
});
</script>
</body>
</html>
