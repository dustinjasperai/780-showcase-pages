<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>People + Process = Profit · Josh Parnell · Limitless Leadership</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f6f8; --panel:#e9edf2; --rule:#d3dae2;
    --ink:#1b232e; --accent:#cc3366; --accent-deep:#a3264f; --muted:#55606d;
    --steel:#00187d; --navy:#1b232e;
  }
  html,body{height:100%}
  body{background:#dfe4ea;font-family:'Montserrat',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dfe4ea}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:2.4vh}
  h1{font-family:'Bitter',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.004em}
  .t-title h1{font-size:4.5vw;max-width:93%}
  .t-normal h1{font-size:3.1vw;max-width:87%}
  .t-normal .body{font-size:1.48vw;color:var(--muted);margin-top:2.6vh;max-width:78%;line-height:1.6;font-weight:400}
  .sub{font-size:1.6vw;color:var(--muted);margin-top:3.2vh;max-width:82%;line-height:1.52;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.26vw;font-weight:700;color:var(--accent-deep);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:16vw;height:4px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh;border-radius:3px}
  .t-dark{background:var(--navy);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:88%;font-style:italic;font-weight:600;color:#f4f6f9}
  .t-cta{background:radial-gradient(135% 135% at 50% 0%,#22303f 0%,#141c26 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.8vw;max-width:88%;color:#f6f8fb;font-weight:700}
  .t-cta .sub{color:#c8d2df}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.6px solid var(--accent);color:#f6cfdd;border-radius:100px;padding:1.3vh 1.7vw;font-size:1.2vw;font-weight:600}
  .steps{display:flex;gap:0;margin-top:3.6vh;flex-wrap:wrap;max-width:95%}
  .step{display:flex;align-items:center;font-size:1.1vw;font-weight:600;color:var(--ink)}
  .step .n{display:inline-flex;align-items:center;justify-content:center;width:2.2vw;height:2.2vw;border-radius:50%;background:var(--steel);color:#fff;font-size:1vw;margin-right:.7vw}
  .step .arw{color:var(--accent-deep);margin:0 .9vw;font-weight:700}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:#8b93a0;font-style:italic;text-align:center;line-height:1.4}
  .t-cta .disc{color:#9fabbb}
  .motif{position:absolute;pointer-events:none;opacity:.96}
  .title-motif{right:7%;bottom:8%;width:20vw}
  .corner-motif{right:6%;bottom:7.4%;width:8.6vw;opacity:.6}
  .brandline{font-size:1.24vw;color:var(--muted);margin-top:3.4vh;font-weight:500;letter-spacing:.01em}
  .brandline b{color:var(--accent-deep);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(27,35,46,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--muted);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.6vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.6vw}.step{font-size:2.6vw}.step .n{width:5vw;height:5vw;font-size:2.4vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Limitless Leadership</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: Roots to Results - a root system feeding an upward, rising form -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="rr" viewBox="0 0 240 170">
  <g fill="none" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
    <line x1="30" y1="96" x2="210" y2="96" stroke="#55606d" opacity="0.32"/>
    <path d="M120 96 C112 116 96 122 82 138 M120 96 C118 120 110 132 100 150 M120 96 C128 120 138 130 150 148 M120 96 C126 116 146 122 162 136" stroke="#a3264f" opacity="0.7"/>
    <line x1="120" y1="96" x2="120" y2="60" stroke="#1b232e" opacity="0.9"/>
    <path d="M78 78 L102 54 L102 78 Z" fill="#cc3366" stroke="#cc3366" opacity="0.92"/>
    <path d="M108 66 L132 40 L132 66 Z" fill="#cc3366" stroke="#cc3366" opacity="0.96"/>
    <path d="M138 52 L164 24 L164 52 Z" fill="#00187d" stroke="#00187d" opacity="0.9"/>
    <path d="M164 24 l3 8 8 3 -8 3 -3 8 -3 -8 -8 -3 8 -3 z" fill="#cc3366" stroke="#cc3366" opacity="0.95"/>
    <circle cx="120" cy="96" r="4.5" fill="#1b232e" stroke="#1b232e"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'People + Process = Profit',sub:'A live masterclass for auto repair shop owners: how to build a team that runs the shop without you, using the leadership system I learned developing thousands of people inside one of the country’s biggest repair franchises.',brand:true,motif:'title'},

 {t:'normal',k:'Who this is for',title:'You can fix anything in the bay. The hard part walked in on two legs.',body:'You opened a shop to do great work and build something of your own. Nobody warned you the real job would be people: the tech who quits the week you get busy, the advisor who skips the process, the fact that the place only runs right when you are standing in it.'},
 {t:'dark',title:'Your shop does not have a car problem. It has a leadership problem wearing coveralls.'},

 {t:'section',idx:'Part One',title:'Why Good Shops Stall'},
 {t:'normal',k:'The promotion nobody trains you for',title:'You got the keys for being the best tech, then handed a job you were never taught.',body:'Wrenching and leading are different skills. Most owners are elite at the first and self-taught at the second, so they lead the way they were led, by feel and by pressure. That works until the shop grows past what one person can hold in their head.'},
 {t:'normal',k:'The hiring trap',title:'More people will not fix a people problem. It multiplies it.',body:'When the team is not led well, hiring just adds more turnover, more rework, more chaos to manage. You cannot staff your way out of a leadership gap. The bay gets louder, not better, and the owner ends up covering every hole personally.'},
 {t:'normal',k:'What you tolerate',title:'Culture is not a poster in the break room. It is the worst behavior you walk past.',body:'Every standard you let slide becomes the new standard. Late, sloppy, short with a customer: if it costs nothing, it spreads. Owners think they have a motivation problem when what they really have is an accountability problem that never got named out loud.'},
 {t:'dark',title:'People do not care how much you know until they know how much you care.'},

 {t:'section',idx:'Part Two',title:'Roots to Results'},
 {t:'normal',k:'The core idea',title:'Results grow from roots. Profit is what a well-led shop produces.',body:'Roots to Results is the method I coach: retention, performance and profit are the fruit, not the lever. The roots are how the leader shows up and how the team is developed. Fix the roots and the numbers follow. Chase the numbers alone and you are pruning a tree that has nothing to feed it.'},
 {t:'normal',k:'Root one: lead yourself',title:'It starts with the leader, before it ever reaches the team.',body:'Self-awareness, keeping your head when the day goes sideways, guarding your own time, and making the shift from player to coach. You cannot pour steadiness into a team you do not have yourself. This is the root everything else grows out of.'},
 {t:'normal',k:'Root two: develop your team',title:'You cannot delegate what you have never actually taught.',body:'Clear communication, real delegation, the crucial conversations most owners avoid, weekly one on ones, and a daily huddle that gets everyone speaking the same language. Development is not an event you send people to. It is a rhythm you run every week.'},
 {t:'normal',k:'Root three: lead your team',title:'Hire on purpose, onboard on purpose, and coach every single week.',body:'Who you let in, how you bring them up to speed, the vision and goals you set, and consistent coaching that does not stop after week one. This is how a shop builds bench strength instead of betting everything on the two people who already know how it all works.'},
 {t:'normal',k:'The four roadblocks',title:'Four quiet things stall almost every shop.',body:'Underneath the day to day, the same four roadblocks keep showing up. Name them and you can work on them on purpose instead of being surprised by them.',steps:['Mindset','Accountability','Communication','Engagement']},
 {t:'dark',title:'A shop that runs on one person is one bad week from chaos. A shop that runs on people and process compounds.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The shop this builds',title:'The owner who used to close every night starts coaching instead of firefighting.',body:'The huddle runs whether you are there or not. Advisors hold the process because they believe in it, not because you are watching. Good techs stay because they can see a future in the building. The numbers get steadier because the people underneath them finally do.'},
 {t:'normal',k:'Why me',title:'I learned this leading thousands of people, not reading about it.',body:'Twenty years of leadership that started in the United States Air Force, then nearly a decade as a corporate trainer and coach inside Christian Brothers Automotive, leading a team that served thousands of employees across the franchise. Everything in Roots to Results was built on a shop floor, then proven with the owners I coach today.'},

 {t:'section',idx:'Your Next Step',title:'Lead a Shop That Runs on People'},
 {t:'cta',title:'Ready to build a team that runs the shop without you?',sub:'Book a discovery call with me to map it for your shop, or start on your own with the Limitless Leadership Blueprint and the Limitless Leadership Podcast.',chips:['Book a discovery call','Start the Limitless Leadership Blueprint'],disc:'Educational content for leadership and business development. No specific income, profit, or outcome is guaranteed. Results vary by shop, effort, and circumstances.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#rr"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.steps) h+=`<div class="steps">`+s.steps.map((c,j)=>`<div class="step"><span class="n">${j+1}</span>${c}</div>`+(j<s.steps.length-1?`<span class="arw">&rarr;</span>`:``)).join('')+`</div>`;
    if(s.brand) h+=`<div class="brandline">The Bearded Leader &middot; <b>Josh Parnell</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
