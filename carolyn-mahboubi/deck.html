<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turning Pro at the Game of Life — Carolyn Mahboubi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Mohave:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3e9;        /* her brand cream ground (brand.json, 28 uses) */
    --panel:#efe9db;     /* derived deeper tint of the cream */
    --ink:#121212;       /* her dominant text color (79 uses) */
    --muted:#4a4a44;
    --accent:#000d2b;    /* her evidenced deep navy (10 uses) */
    --gold:#f0c932;      /* single evidenced gold hairline (luxury heritage) */
    --serif:'Cormorant Garamond',Georgia,serif;
    --sans:'Mohave',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px}
  .slide{
    background:var(--bg);
    border:1px solid rgba(18,18,18,.10);
    border-radius:6px;
    padding:64px 60px;
    margin:0 0 28px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .kicker{font-family:var(--sans);font-weight:500;letter-spacing:.22em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  .kicker::before{content:"";display:inline-block;width:26px;height:2px;background:var(--gold);
    vertical-align:middle;margin-right:12px;transform:translateY(-3px)}
  h1{font-family:var(--serif);font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:42px;line-height:1.1}
  .lede{font-family:var(--serif);font-style:italic;font-size:27px;line-height:1.35;color:var(--muted);margin-top:22px;max-width:42ch}
  p.body{font-family:var(--sans);font-weight:300;font-size:21px;line-height:1.55;margin-top:18px;max-width:52ch;color:#2b2b28}
  ul{list-style:none;margin-top:26px}
  li{font-family:var(--sans);font-weight:300;font-size:21px;line-height:1.5;padding:14px 0 14px 34px;
    border-top:1px solid rgba(18,18,18,.12);position:relative;max-width:56ch}
  li:last-child{border-bottom:1px solid rgba(18,18,18,.12)}
  li::before{content:"";position:absolute;left:0;top:22px;width:16px;height:2px;background:var(--accent)}
  .big{font-family:var(--serif);font-size:48px;line-height:1.12;font-weight:600;max-width:20ch}
  .num{font-family:var(--serif);font-size:20px;color:var(--accent);font-weight:600;letter-spacing:.04em}
  .levels{margin-top:30px}
  .level{display:flex;align-items:baseline;gap:20px;padding:16px 0;border-top:1px solid rgba(18,18,18,.12)}
  .level .lv{font-family:var(--serif);font-size:30px;color:var(--accent);width:44px;font-weight:600}
  .level .lt{font-family:var(--sans);font-weight:500;font-size:22px}
  .level .ld{font-family:var(--sans);font-weight:300;font-size:18px;color:var(--muted);margin-top:4px}
  .credit{font-family:var(--sans);font-weight:300;font-size:16px;color:var(--muted);margin-top:8px}
  .cta-steps{margin-top:24px}
  .disclaimer{font-family:var(--sans);font-weight:300;font-size:13px;color:#6a6a62;margin-top:34px;max-width:60ch;line-height:1.5}
  .pg{position:absolute;bottom:22px;right:28px;font-family:var(--sans);font-size:12px;color:#9a9a90;letter-spacing:.1em}
  .brandmark{position:absolute;top:26px;right:30px;font-family:var(--serif);font-style:italic;font-size:16px;color:var(--muted)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A Masterclass with Carolyn Mahboubi',
   h1:'Turning Pro at the Game of Life',
   lede:'For women who already have the success, and quietly sense a gap between what they have built and how it feels.'},

  {t:'who', kicker:'Who this is for',
   h2:'You did everything right.',
   body:'You built the career, the family, the life people describe as enviable. From the outside, the scoreboard reads a win. And still, in the honest hours, there is a distance between the achievement and your experience of it. This hour is for that distance.'},

  {t:'trap', kicker:'The trap',
   h2:'You were told the gap closes at the next level.',
   body:'The next title. The next milestone. The next version of more. So you kept climbing, because climbing is what worked before. The quiet truth is that the gap has never once closed from the outside, no matter how high the climb.'},

  {t:'hook', kicker:'The reframe',
   big:'The gap does not close by achieving more. It closes by changing who you are being.'},

  {t:'part', num:'Part One', h2:'The Gap'},

  {t:'content', kicker:'What the gap actually is',
   h2:'External achievement, internal experience.',
   body:'Achievement lives on the outside. Fulfillment lives on the inside. We spend decades becoming experts at the outside and amateurs at the inside, then wonder why the two will not meet. The game of life is played on the inside. Most accomplished people have never been taught the rules.'},

  {t:'content', kicker:'Why more does not work',
   h2:'More is an amateur move.',
   body:'The amateur reaches for the next achievement to feel the thing. The pro knows the feeling is generated at a different level entirely. Turning pro is not about doing less or wanting less. It is about ending the search in the one place it was never going to be found.'},

  {t:'part', num:'Part Two', h2:'The Three Levels'},

  {t:'levels', kicker:'Where change actually happens', h2:'Three levels, one of them real.',
   levels:[
     {lv:'01', lt:'Strategies & Tactics', ld:'Your habits, routines and daily practices. Useful, and the shallowest level of change.'},
     {lv:'02', lt:'Mindset', ld:'Your beliefs and thought patterns. Deeper, and where most coaching stops.'},
     {lv:'03', lt:'Identity', ld:'Who you are being. The deepest level, and the only one that holds.'}
   ]},

  {t:'content', kicker:'The whole point',
   h2:'Tactics sit on top of identity.',
   body:'You can stack a hundred new habits on an old identity and watch every one of them fall off. Change the identity and the habits take care of themselves. This is why women who try to fix the gap with a new planner stay stuck, and women who do the identity work rarely go back.'},

  {t:'part', num:'Part Three', h2:'Fierce Presence'},

  {t:'content', kicker:'The practice underneath it all',
   h2:'Fierce Presence is the prerequisite of power.',
   body:'Presence is not a personality you either have or do not. It is a state of being and a delivery system for impact. It is the ground that deep listening, real love and clear decisions all grow out of. And like anything that matters, it is a practice.'},

  {t:'habits', kicker:'The five habits of Fierce Presence', h2:'A practice, not a mood.',
   items:[
     'Let go of the need to be right.',
     'Breathing does matter. Return to the body.',
     'Learn active patience, the authentic kind, not the performed kind.',
     'There is only one of. One person, one situation, one act at a time.',
     'It is not about you, until it is. Lead with curiosity and non attachment.'
   ]},

  {t:'content', kicker:'Before you set a single goal',
   h2:'Start with what actually matters.',
   body:'Most resolutions fail because we set goals before we get clear on what matters. The Values work comes first. When your days are built on your real values instead of inherited ones, the striving quiets on its own, and the vision for the year ahead almost writes itself.'},

  {t:'content', kicker:'On the other side of the gap',
   h2:'Creating from calm, not chasing from lack.',
   body:'The work is not that you stop achieving. It is that the achievement stops being the thing you are using to feel whole. You create from a place of calm, gratitude and presence. The scoreboard still moves. You are simply no longer its hostage.'},

  {t:'why', kicker:'Why I teach this',
   h2:'I spent thirty years on the outside.',
   body:'At sixteen I opened the first Versace franchise in the country and built it into the most successful in the world. Then came Hermes, Saint Laurent, Bulgari, Gucci. I was fluent in the outside. The gap closed only when I changed, not when my circumstances did. That is the whole of what I now teach as a Master Certified Coach.',
   credit:'Carolyn Mahboubi, MCC. Host of the Amateur to Pro podcast.'},

  {t:'cta', kicker:'Where to go from here',
   h2:'Turn pro at the inner game.',
   body:'If this is the work you have been circling, there are two honest next steps.',
   steps:[
     'Take the free Life Audit, ten minutes to see the one area quietly draining the rest.',
     'Or schedule a conversation, and we look at your gap together.'
   ],
   disclaimer:'This masterclass is for educational purposes only. It is not therapy, medical or financial advice, and it makes no guarantee of any particular outcome. Results vary from person to person.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.brandmark !== false && i > 0) inner += '<div class="brandmark">Carolyn Mahboubi</div>';
  if (s.kicker) inner += '<div class="kicker">'+s.kicker+'</div>';
  if (s.t === 'title'){ inner += '<h1>'+s.h1+'</h1>'; if (s.lede) inner += '<div class="lede">'+s.lede+'</div>'; }
  else if (s.t === 'part'){ inner += '<div class="num">'+s.num+'</div><h2 style="margin-top:10px">'+s.h2+'</h2>'; }
  else if (s.t === 'hook'){ inner += '<div class="big">'+s.big+'</div>'; }
  else {
    if (s.h2) inner += '<h2>'+s.h2+'</h2>';
    if (s.body) inner += '<p class="body">'+s.body+'</p>';
    if (s.levels){ inner += '<div class="levels">'; s.levels.forEach(l=>{ inner += '<div class="level"><div class="lv">'+l.lv+'</div><div><div class="lt">'+l.lt+'</div><div class="ld">'+l.ld+'</div></div></div>'; }); inner += '</div>'; }
    if (s.items){ inner += '<ul>'; s.items.forEach(x=> inner += '<li>'+x+'</li>'); inner += '</ul>'; }
    if (s.steps){ inner += '<ul class="cta-steps">'; s.steps.forEach(x=> inner += '<li>'+x+'</li>'); inner += '</ul>'; }
    if (s.credit) inner += '<div class="credit">'+s.credit+'</div>';
    if (s.disclaimer) inner += '<div class="disclaimer">'+s.disclaimer+'</div>';
  }
  inner += '<div class="pg">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
