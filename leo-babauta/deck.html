<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Fearless Purpose Method, a live masterclass with Leo Babauta</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bellota+Text:wght@400;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f6f2;        /* warm paper (brand-fm) */
    --panel:#ece7db;     /* warm tint of the paper ground */
    --ink:#333333;       /* main-site body ink */
    --muted:#6b6967;     /* FM warm gray */
    --accent:#c0ac61;    /* FM warm gold */
    --accent-deep:#91834c;
    --display:'Bellota Text', Georgia, serif;
    --body:'Inter', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    background:var(--bg);
    border:1px solid rgba(107,105,103,.18);
    border-radius:14px;
    aspect-ratio:16/9;
    margin:22px 0;
    padding:64px 72px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
    box-shadow:0 1px 0 rgba(51,51,51,.03);
  }
  .slide .num{position:absolute;top:26px;right:34px;font-size:13px;color:var(--muted);letter-spacing:.08em}
  .kicker{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:22px;font-weight:600}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,4.6vw,58px);line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:clamp(28px,3.6vw,44px);line-height:1.12}
  .sub{font-size:clamp(18px,2vw,23px);color:var(--muted);margin-top:22px;max-width:40ch}
  .body{font-size:clamp(17px,1.7vw,20px);margin-top:20px;max-width:52ch}
  .body p{margin-top:14px}
  ul{margin-top:22px;list-style:none}
  li{font-size:clamp(17px,1.7vw,20px);padding:12px 0 12px 30px;position:relative;border-top:1px solid rgba(107,105,103,.16)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:20px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
  .pill{display:inline-block;font-family:var(--display);font-size:clamp(30px,3.4vw,42px);color:var(--accent-deep)}
  .enso{position:absolute;bottom:-70px;right:-60px;width:260px;height:260px;border:14px solid var(--accent);border-radius:50%;opacity:.14;border-right-color:transparent;transform:rotate(35deg)}
  .dot{width:14px;height:14px;border-radius:50%;background:var(--accent);margin-bottom:26px}
  .lead{font-size:clamp(20px,2.2vw,26px);max-width:44ch}
  .disc{font-size:14px;color:var(--muted);margin-top:28px;max-width:60ch;line-height:1.5}
  .cta-line{font-family:var(--display);font-size:clamp(22px,2.4vw,30px);color:var(--accent-deep);margin-top:24px}
  .title-slide{background:var(--panel)}
  .part-slide{background:var(--panel);align-items:flex-start}
  .foot{color:var(--muted);font-size:14px;margin-top:18px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'A live masterclass with Leo Babauta',
   h:'The Fearless Purpose Method',
   sub:'How to do your most meaningful work without waiting to feel ready.'},

  {t:'who', kicker:'Who this is for',
   h:'For the founders and creators carrying work that matters.',
   body:['You have a project, a business, or a body of work you care about deeply.',
         'And there is a version of it you keep putting off, because some part of you is waiting to feel ready first.']},

  {t:'trap', kicker:'The trap',
   h:'You keep waiting for the fear to go away.',
   sub:'So you tidy the plan, read one more book, and tell yourself you will begin the real work once you feel calm and certain. The waiting feels like progress. It is not.'},

  {t:'hook', kicker:'The reframe',
   h:'The fear was never going to leave first.',
   lead:'The people doing their most meaningful work are not the ones who stopped feeling afraid. They learned to keep moving while the fear is still there.'},

  {t:'part', kicker:'Part one', h:'Why discipline keeps failing you.'},

  {t:'body', kicker:'The core problem',
   h:'Meaningful work triggers resistance.',
   body:['The work you care about most is the work that scares you most. That is not a flaw in you. It is the signal.',
         'So you meet the resistance with force. More discipline, harder rules, a new system. And the harder you push, the louder it gets.']},

  {t:'body', kicker:'The core problem',
   h:'You cannot willpower your way past yourself.',
   body:['Willpower spikes and crashes. The moment it dips, the old pattern is right there waiting.',
         'What holds is not force. It is a practice of staying present with the discomfort instead of running from it.']},

  {t:'part', kicker:'Part two', h:'The 3 Pillars of Fearless Living.'},

  {t:'pillar', kicker:'Pillar one', pill:'Habits',
   h:'A practice, not a willpower sprint.',
   sub:'Small, repeatable daily reps that survive the days you do not feel like it. The practice carries you when motivation does not.'},

  {t:'pillar', kicker:'Pillar two', pill:'Purpose',
   h:'Commit to the work that matters.',
   sub:'Not a vague someday goal. The specific meaningful work you keep circling, named clearly enough that you can return to it every day.'},

  {t:'pillar', kicker:'Pillar three', pill:'Resistance',
   h:'Work with it, not against it.',
   sub:'Overwhelm, self doubt, and the urge to delay are not enemies to defeat. They are what you learn to stay present with, so you can take the next small step anyway.'},

  {t:'body', kicker:'The synthesis',
   h:'Fearless Purpose.',
   body:['Put the three together and the game changes. You stop trying to feel ready, and you start training to act inside the uncertainty.',
         'That is fearless purpose. Doing the meaningful work with the fear still in the room, and doing it with joy rather than dread.']},

  {t:'body', kicker:'The mechanism',
   h:'The Practice.',
   body:['Every day, one small rep. You sit with the discomfort of the work that matters, and you take one step toward it before the resistance can talk you out of it.',
         'Done daily, this rewires how you meet fear. The work stops being something you brace for and becomes something you return to.']},

  {t:'part', kicker:'Part three', h:'What fearless purpose looks like day to day.'},

  {t:'body', kicker:'The shift',
   h:'From bracing to beginning.',
   body:['The project you have been circling for months gets its first honest hour of work.',
         'The fear does not vanish. You just stop letting it run the schedule. You show up, you take the small step, and you do it again tomorrow.']},

  {t:'why', kicker:'Why me',
   h:'I have spent years teaching this.',
   body:['I am Leo Babauta. Since 2007, Zen Habits has become one of the most widely read personal development sites in the world.',
         'I have written books including The Power of Less and Zen To Done, and I now coach founders, creators and leaders through exactly this work inside Fearless Mastery.']},

  {t:'recap', kicker:'What we covered',
   h:'The Fearless Purpose Method.',
   items:['Stop waiting to feel ready.',
          'Build a practice, not a willpower sprint.',
          'Name the work that matters.',
          'Work with resistance, not against it.',
          'Take one small step, daily.']},

  {t:'cta', kicker:'The next step',
   h:'Ready to do the work that matters?',
   ctaline:'Take the next step into Fearless Mastery.',
   body:['If today gave you a way to keep going while afraid, this is the room where you practice it, with coaching, structure and a community doing the same work.'],
   disc:'This masterclass is for educational purposes only. It is not a guarantee of any particular outcome or result. Your experience depends on your own effort and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='part'?' part-slide':'');
  let html = '<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.t==='title') html += '<div class="dot"></div>';
  if(s.kicker) html += '<div class="kicker">'+s.kicker+'</div>';
  if(s.pill) html += '<div class="pill">'+s.pill+'</div>';
  if(s.h) html += (s.t==='title'||s.t==='part')?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>';
  if(s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if(s.lead) html += '<div class="lead">'+s.lead+'</div>';
  if(s.body){ html += '<div class="body">'; s.body.forEach(p=> html += '<p>'+p+'</p>'); html += '</div>'; }
  if(s.items){ html += '<ul>'; s.items.forEach(it=> html += '<li>'+it+'</li>'); html += '</ul>'; }
  if(s.ctaline) html += '<div class="cta-line">'+s.ctaline+'</div>';
  if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  if(s.t!=='part'&&s.t!=='recap') html += '<div class="enso"></div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
