<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Team That Stays · Joan Hutchinson, Your Restaurant Maven</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital@0;1&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#17110d; --panel:#241a13; --rule:#3a2c22;
    --acc:#d96c3e; --ink:#fff9f3; --body:#d8cabb; --dim:#8a7c6f;
  }
  html,body{height:100%}
  body{background:#0e0a07;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0e0a07}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Poppins',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'EB Garamond',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.1;letter-spacing:.004em}
  .t-title h1{font-size:6.0vw;max-width:94%}
  .t-normal h1{font-size:3.9vw;max-width:92%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.64;font-weight:400}
  .sub{font-family:'EB Garamond',serif;font-style:italic;font-size:2.2vw;color:var(--acc);margin-top:3.6vh;max-width:84%;line-height:1.4;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(140% 130% at 50% 12%,#2b1d12 0%,#130d09 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:4.2vw;max-width:88%;color:var(--ink)}
  .t-cta{background:radial-gradient(140% 130% at 50% 100%,#2b1d12 0%,#130d09 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.3vw;max-width:86%;color:var(--ink)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:var(--body);font-size:1.42vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--ink);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500;font-family:'Poppins',sans-serif}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .pl-motif{position:absolute;pointer-events:none}
  .title-pl{right:7.5%;bottom:8%;width:15vw;opacity:.85}
  .corner-pl{right:6.5%;bottom:7.5%;width:7.5vw;opacity:.5}
  .brandline{font-family:'Poppins',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(255,249,243,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.4vw}.t-normal h1{font-size:6.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.2vw}.t-section h1{font-size:8vw}.t-dark h1{font-size:6.6vw}
    .t-cta h1{font-size:7.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Your Restaurant Maven</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- service motif: a plate with fork and knife, drawn in the brand orange -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pl" viewBox="0 0 120 120">
  <g fill="none" stroke="#d96c3e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="66" cy="60" r="30" opacity="0.9"/>
    <circle cx="66" cy="60" r="21" opacity="0.5"/>
    <path d="M20 30 V56 M20 56 V92" opacity="0.9"/>
    <path d="M14 30 V44 M26 30 V44" opacity="0.6"/>
    <path d="M106 30 C99 34 99 50 106 56 V92" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Team That Stays',sub:'How independent restaurant owners build a team that runs the floor, so the business no longer depends on them being in the building.',brand:true,pl:'title'},
 {t:'normal',k:'Who this is for',title:'You can run a great service. Doing it without you on the floor every night is the part no one taught you.',body:'You are an independent owner. The food is good, the regulars come back, and by most measures the place works. But you are the one who opens, closes, covers the call-offs, and fixes whatever breaks. The restaurant runs because you are in it.'},
 {t:'dark',title:'A full schedule is not the same as a team you can trust.'},

 {t:'section',idx:'Part One',title:'Why Good People Keep Leaving'},
 {t:'normal',k:'The turnover treadmill',title:'You are not short-staffed. You are short a reason to stay.',body:'Hiring faster just refills the same leak. People leave when they are thrown on the floor half-trained, never shown what good looks like, and given no way to move up. So you post the ad again, train from scratch again, and stay chained to the schedule.'},
 {t:'normal',k:'The owner as bottleneck',title:'When you are the only one who can fix it, you can never actually leave.',body:'Every decision routes back to you because no one else was ever taught to make it. That is not a staffing problem, it is a leadership gap, and it is the real reason the restaurant cannot run a single night without you standing in it.'},
 {t:'dark',title:'You did not open a restaurant to work every shift in it forever.'},

 {t:'section',idx:'Part Two',title:'Master the Pillars, People First'},
 {t:'normal',k:'Pillar one, hire for fit',title:'Hire for who they are, not just to fill the shift.',body:'Care about people and respect them, and they will respect the work. Hiring for character and fit, not only for who is available this week, is the first pillar, because the wrong hire made in a hurry is the most expensive shift you will ever cover.'},
 {t:'normal',k:'Pillar two, train so it sticks',title:'Give people the tools to do an exceptional job, and they will.',body:'Training that sticks the first time is a system, not shadow-a-shift-and-hope. When you take the time to teach what good looks like and hand over the real tools, you stop re-training the same role every ninety days and start keeping the people you invested in.'},
 {t:'normal',k:'Pillar three, leaders at every level',title:'Build leaders at every level so the floor does not need you on it.',body:'The aim is people beneath you who can make the call you would make. You grow them by handing over real decisions against a clear standard, so the shift runs right whether or not you walked in that day. That is how an owner finally steps back.'},
 {t:'normal',k:'Pillar four, systems that hold',title:'The systems big companies skip, and independents can win with.',body:'Hiring, training, reporting, and tracking, built as repeatable systems instead of things that live in your head. Even large hospitality companies fail at these with every resource in the world. Get them right and an independent can run tighter than the chain down the street.'},
 {t:'dark',title:'Respect your people if you want them to respect the work. Everything else is built on that.'},

 {t:'section',idx:'Part Three',title:'What a Team That Stays Gives You'},
 {t:'normal',k:'What changes on the floor',title:'A restaurant that runs a great night whether or not you are in it.',body:'Turnover slows. Good people stay long enough to get good, and then to lead. The shift runs to a standard without you touching every decision, and a night off stops being a risk. You get the business you built and the life you opened it for.'},
 {t:'dark',title:'The goal was never to work more shifts. It was to build something that holds without you.'},
 {t:'normal',k:'Why Joan',title:'I did not learn this from a book. I learned it running the floor.',body:'Joan Hutchinson started in hospitality at sixteen, has owned and operated restaurants, managed a country club, and steered a company through the pandemic, growing revenue and memberships in the rooms she ran. After watching even well-resourced companies fail their people, she built her coaching around the one thing that keeps a restaurant standing, its team.'},

 {t:'section',idx:'Your Next Step',title:'Build Your Team That Stays'},
 {t:'normal',k:'Where to start with Joan',title:'The Pillars are the whole path, from a revolving door to a team that runs the floor.',body:'It starts with a conversation about your restaurant, your people, and the systems that will hold it together, then a plan that fits the place you actually run. You do not have to keep being the person everyone depends on.'},
 {t:'cta',title:'Ready to build a team that stays?',body:'Take the next step with Your Restaurant Maven and Joan Hutchinson.',chips:['Book a coaching call','Explore the coaching'],disc:'Educational content for restaurant owners and operators. No revenue or business result is guaranteed. Results vary by restaurant, market, and team.'},
];

const deck=document.getElementById('deck');
function pl(kind){return `<svg class="pl-motif ${kind==='title'?'title-pl':'corner-pl'}"><use href="#pl"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Your Restaurant <b>Maven</b> · Joan Hutchinson</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.pl) h+=pl(s.pl);
  else if(s.t==='title') h+=pl('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
