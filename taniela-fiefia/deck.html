<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Price For Profit &middot; Taniela Fiefia</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#0E0F0D; --panel:#1A1C17; --rule:#3A3D33;
    --acc:#E6B943; --idx:#D9C98A; --chalk:#EEE9DD; --grey:#B7B5AC; --dim:#7C7A6C;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Inter',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Oswald',Arial,sans-serif;font-weight:500;color:var(--chalk);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:4vw;max-width:88%}
  .t-normal h1{font-size:3vw;max-width:84%}
  .t-normal .body{font-size:1.44vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.66vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.46;font-weight:300}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.4vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.4vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,#26241A 0%,#050504 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:86%;font-style:italic;color:#F3EFE3}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,#26241A 0%,#050504 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.7vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#F3E9C9;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.2vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.9vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .lift-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-lift{right:6%;bottom:8%;width:19vw}
  .corner-lift{right:5%;bottom:7%;width:8.5vw;opacity:.4}
  .brandline{font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6.6vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">Contractor Coach</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- lift motif: stacked, offset bars suggesting poured concrete courses/lifts, with a level-line diagonal -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="lift" viewBox="0 0 260 200">
  <g fill="none" stroke-linecap="round">
    <rect x="20" y="150" width="90" height="14" fill="#E6B943" opacity="0.85"/>
    <rect x="80" y="112" width="90" height="14" fill="#D9C98A" opacity="0.55"/>
    <rect x="140" y="74" width="90" height="14" fill="#F4EBCB" opacity="0.28"/>
    <line x1="20" y1="150" x2="230" y2="40" stroke="#E6B943" stroke-width="2" stroke-dasharray="6 7" opacity="0.5"/>
    <circle cx="230" cy="40" r="7" fill="none" stroke="#E6B943" stroke-width="2.4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Price For Profit',sub:'A live pricing masterclass for concrete and flatwork contractors, built from Taniela Fiefia\'s own operating playbook.',brand:true,lift:'title'},
 {t:'normal',k:'Who this is for',title:'Your crews matter. What you charge them matters more.',body:'Most concrete contractors doing $20k to $80k a month are busy, not broke on purpose. They\'re just still pricing the job the way the guy who taught them priced it: by the square foot.'},
 {t:'dark',title:'More revenue without more margin isn\'t growth. It\'s a bigger version of the same problem.'},

 {t:'section',idx:'Part One',title:'Why Square-Footage Pricing Loses'},
 {t:'normal',k:'The trap',title:'Bidding by the square foot means bidding against everyone.',body:'When every contractor in the market quotes the same rate per square foot, the job goes to whoever is willing to make the least on it. Growth just means doing more of that.'},
 {t:'normal',k:'What it costs',title:'Revenue climbs. Profit doesn\'t always follow it.',body:'A crew that\'s busier this year than last year isn\'t automatically making more money. Without a pricing model built to protect margin, more jobs can just mean more of the same thin cut.'},
 {t:'dark',title:'"Revenue is for vanity. Profit is for sanity."'},

 {t:'section',idx:'Part Two',title:'The Price For Profit System'},
 {t:'normal',k:'Price for Profit',title:'Price the outcome, not the square footage.',body:'Moving off a flat rate per square foot toward pricing built on the job\'s real value is what protects the margin a busier season should be adding, not eating.'},
 {t:'normal',k:'Get Out of the Field',title:'The owner is the bottleneck until someone else can run a job.',body:'Systems and hiring that let a job run without the owner physically on it are what let the pricing shift actually turn into more money, not just more hours.'},
 {t:'normal',k:'Build a Real Operation',title:'Sales, scheduling, crew, and cash flow, running as one system.',body:'The pricing fix only holds if the operation behind it can deliver on the number: bidding, scheduling, crew management, and knowing the real cost of a job before it\'s quoted.'},
 {t:'dark',title:'A crew that knows its numbers prices differently than a crew that\'s guessing.'},

 {t:'section',idx:'Part Three',title:'Pricing For Profit, Bid By Bid'},
 {t:'normal',k:'The operation this builds',title:'A business that can grow without the owner carrying every job.',body:'Pricing that protects margin, a crew that can run a job without the owner on site, and an operation that knows its real numbers before a bid goes out.'},
 {t:'normal',k:'Why Taniela Fiefia',title:'Built his own concrete business past $2 million a year, from the slab up.',body:'Taniela Fiefia started the way most concrete guys start, finishing slabs, learning the craft the hard way. He built his own company past $2 million a year and 1,200-plus completed projects, then turned the pricing and systems shift that got him there into a mentorship for other contractors.'},

 {t:'section',idx:'Your Next Step',title:'Bring Price For Profit To Your Business'},
 {t:'normal',k:'How it\'s delivered',title:'Application-only 1:1 mentorship for serious operators.',body:'Taniela works directly with a small number of concrete and flatwork contractors at a time through an application-only mentorship, built around pricing for profit, getting out of the field, and building the systems behind a real operation.'},
 {t:'cta',title:'Ready to price the next job for profit?',chips:['Apply For Mentorship','Contractor Coach'],disc:'Educational content for concrete and flatwork contractor owners. No income or revenue result is guaranteed. Results vary by market, crew, and operator.'},
];

const deck=document.getElementById('deck');
function lift(kind){return `<svg class="lift-motif ${kind==='title'?'title-lift':'corner-lift'}"><use href="#lift"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Taniela <b>Fiefia</b> &middot; Contractor Coach</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.lift) h+=lift(s.lift);
  else if(s.t==='title') h+=lift('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
