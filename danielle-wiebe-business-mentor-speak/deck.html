<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Collaboration Advantage — Bloom Business Collective</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,700;1,500&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1A121C; --panel:#261A2B; --rule:#3A2A40;
    --accent:#C5166E; --ink:#FFFFFA; --muted:#C9B8CE;
    --serif:'Playfair Display',Georgia,serif; --sans:'Instrument Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  #deck{max-width:1040px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:linear-gradient(170deg,var(--panel),var(--bg));border:1px solid var(--rule);
    border-radius:18px;padding:60px 56px;margin:22px 0;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;right:-70px;top:-70px;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle at 30% 30%,rgba(197,22,110,.32),transparent 68%)}
  .petal{position:absolute;right:46px;bottom:40px;width:66px;height:66px;opacity:.5}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:20px}
  h1{font-family:var(--serif);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em;margin-bottom:22px}
  h2{font-family:var(--serif);font-weight:700;font-size:40px;line-height:1.1;margin-bottom:20px}
  .lede{font-size:21px;line-height:1.5;color:var(--muted);max-width:40ch}
  p.big{font-family:var(--serif);font-style:italic;font-size:34px;line-height:1.28;max-width:24ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.45;padding:12px 0 12px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:52ch}
  li::before{content:"";position:absolute;left:0;top:21px;width:11px;height:11px;border-radius:50%;background:var(--accent)}
  .pillar{font-family:var(--serif);font-size:26px;color:var(--ink);margin-bottom:6px}
  .num{font-family:var(--serif);font-size:15px;color:var(--accent);letter-spacing:.2em}
  .cta-box{border:1px solid var(--accent);border-radius:14px;padding:26px 30px;margin-top:24px;max-width:46ch;background:rgba(197,22,110,.08)}
  .cta-box .step{font-family:var(--serif);font-size:24px;margin-bottom:8px}
  .disc{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:62ch}
  .foot{position:absolute;left:56px;bottom:30px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .count{position:absolute;right:56px;bottom:30px;font-size:12px;color:var(--muted)}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:10px}
  .card{background:rgba(255,255,250,.03);border:1px solid var(--rule);border-radius:12px;padding:22px 24px}
  .card h3{font-family:var(--serif);font-size:22px;margin-bottom:8px}
  .card p{font-size:16px;color:var(--muted);line-height:1.45}
</style>
</head>
<body>
<div id="deck"></div>
<svg width="0" height="0"><symbol id="bloom" viewBox="0 0 100 100"><g fill="none" stroke="#C5166E" stroke-width="3">
<circle cx="50" cy="50" r="8"/><path d="M50 42 C40 20 20 28 34 46 C12 40 14 62 36 56 C24 76 44 78 44 58 C56 80 72 66 58 52 C80 60 78 38 58 44 C70 22 50 22 50 42Z"/></g></symbol></svg>
<script>
const S=[
 {t:'title',html:`<div class="eyebrow">Bloom Business Collective &middot; Live Masterclass</div>
   <h1>The Collaboration<br>Advantage</h1>
   <p class="lede">How women entrepreneurs grow faster together than burning out alone.</p>`},
 {t:'who',html:`<div class="eyebrow">Who this is for</div>
   <h2>You're building something real, mostly by yourself.</h2>
   <p class="lede">You're a woman entrepreneur with a business you care about. You're working hard, wearing every hat, and quietly wondering why growth still feels so slow and so lonely.</p>`},
 {t:'reframe',html:`<div class="eyebrow">The reframe</div>
   <p class="big">Working harder, alone, is the slowest way to grow a business.</p>`},
 {t:'p1head',html:`<div class="num">PART ONE</div><h2>The solo-hustle trap</h2>
   <p class="lede">The advice you've been given is to grind harder and out-work everyone. So you did. And it cost you time, energy, and your peace, without the growth to show for it.</p>`},
 {t:'p1body',html:`<div class="eyebrow">What actually happens</div>
   <ul><li>You repeat the same busy patterns and call it progress.</li>
   <li>You compete with people you could be collaborating with.</li>
   <li>You have no one to pressure-test decisions with, so everything takes longer.</li>
   <li>Isolation reads as "I just need to work more." It isn't.</li></ul>`},
 {t:'p1cost',html:`<div class="eyebrow">The real cost</div>
   <p class="big">Burnout isn't the price of growth. It's the signal you're carrying it alone.</p>`},
 {t:'p2head',html:`<div class="num">PART TWO</div><h2>The Bloom Method</h2>
   <p class="lede">A different way to grow: strategy plus collaboration plus sustainability. The same framework behind a top 1% podcast and a community of 10,000 women entrepreneurs.</p>`},
 {t:'method',html:`<div class="eyebrow">Three pillars</div>
   <div class="two">
   <div class="card"><h3>Strategy</h3><p>Clarity on the few right things to focus on, so effort turns into momentum.</p></div>
   <div class="card"><h3>Collaboration</h3><p>Grow through partnership and community, not competition and isolation.</p></div>
   <div class="card"><h3>Sustainability</h3><p>A profitable, purpose-driven business you can keep, without losing your peace.</p></div>
   <div class="card"><h3>Faith at the center</h3><p>Build something that glorifies God and still pays the bills.</p></div>
   </div>`},
 {t:'collab',html:`<div class="num">PILLAR: COLLABORATION</div><h2>Strategic Collaborations</h2>
   <p class="lede">The fastest growth lever most women never pull: deliberate partnerships. Cross-promotions, co-hosted events, shared audiences. One good collaboration can outperform a month of solo posting.</p>`},
 {t:'mastermind',html:`<div class="num">PILLAR: THE ROOM</div><h2>Why an intimate room beats a big network</h2>
   <ul><li>Honest feedback from peers who get it.</li>
   <li>Creative problem-solving and accelerated progress.</li>
   <li>Accountability and momentum that outlast motivation.</li>
   <li>Paid commitment means invested people, not lurkers.</li></ul>`},
 {t:'clarity',html:`<div class="eyebrow">Clarity over hustle</div>
   <p class="big">More impact and more income, in less time, by focusing on the right things.</p>`},
 {t:'events',html:`<div class="num">THE MULTIPLIER</div><h2>Community and events</h2>
   <p class="lede">A business can sell through belonging instead of chasing. Live events and a real community turn strangers into a room that roots for you, and buys from you.</p>`},
 {t:'p3head',html:`<div class="num">PART THREE</div><h2>When collaboration does the heavy lifting</h2>
   <p class="lede">Growth stops depending on how many hours you can grind, and starts compounding through the rooms and partnerships you're in.</p>`},
 {t:'look',html:`<div class="eyebrow">The shift</div>
   <ul><li>From alone and overwhelmed to supported and clear.</li>
   <li>From competing for scraps to collaborating for reach.</li>
   <li>From hustle-and-crash to steady, sustainable momentum.</li>
   <li>From a lonely business to one rooted in community and faith.</li></ul>`},
 {t:'whyme',html:`<div class="eyebrow">Why listen to me</div>
   <h2>I built this the collaborative way.</h2>
   <p class="lede">Over a decade in business. A top 1% globally ranked podcast. A community trusted by 10,000+ women entrepreneurs, and 5 chapters hosting hundreds of events across North America, built on collaboration, not competition.</p>`},
 {t:'cta',html:`<div class="eyebrow">Your next step</div>
   <h2>Come grow with us.</h2>
   <div class="cta-box"><div class="step">Join The Bloom Collective</div>
   <p class="lede" style="font-size:17px">Strategy sessions, collaboration calls, The Bloom Method trainings, and a room of women building alongside you. Or apply for 1:1 Mentorship to go deeper.</p></div>
   <p class="disc">This masterclass is educational. It shares strategies and frameworks for growing a business through collaboration and community. No income or result is guaranteed. Results vary and depend on your own work, market, and circumstances.</p>`}
];
const bloom='<svg class="petal"><use href="#bloom"/></svg>';
const d=document.getElementById('deck');
S.forEach((s,i)=>{const el=document.createElement('section');el.className='slide';
 el.innerHTML=s.html+'<div class="foot">The Collaboration Advantage</div><div class="count">'+(i+1)+' / '+S.length+'</div>'+bloom;
 d.appendChild(el);});
</script>
</body>
</html>
