<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leading Worship Out of Connection — A Masterclass with Jon Thurlow</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Lato:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbfaf7;      /* warm near-white, honors his light site scheme */
    --panel:#f1ece3;   /* soft parchment */
    --rule:#d8cfc0;    /* muted parchment rule */
    --accent:#2a8292;  /* his dominant brand teal (brand.json) */
    --ink:#1c2b2e;     /* deep teal-black */
    --muted:#5d6b6c;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lato',sans-serif;font-weight:400;line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:64px 56px;
    margin:0 0 28px;
    min-height:440px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    overflow:hidden;
  }
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .eyebrow{font-family:'Lato';font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Crimson Text',serif;font-weight:600;font-size:46px;line-height:1.1;margin-bottom:20px}
  h2{font-family:'Crimson Text',serif;font-weight:600;font-size:34px;line-height:1.15;margin-bottom:18px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px;max-width:62ch}
  p.lead{font-size:22px;color:var(--muted)}
  ul{margin:8px 0 8px 22px}
  li{font-size:19px;margin-bottom:12px;max-width:60ch}
  .kicker{font-family:'Crimson Text',serif;font-style:italic;font-size:24px;color:var(--accent);margin-top:8px}
  .num{font-family:'Crimson Text',serif;font-size:15px;color:var(--muted);position:absolute;top:22px;right:28px;letter-spacing:.08em}
  .panel{background:var(--panel);border-radius:4px;padding:28px 30px;margin-top:10px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:22px;max-width:66ch;line-height:1.5}
  .by{font-family:'Crimson Text',serif;font-style:italic;font-size:20px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A free live masterclass for worship leaders',h:'Leading Worship Out of Connection, Not a Setlist',sub:'Why your room can feel flat even when the songs are good, and the offstage habit that changes everything.',by:'with Jon Thurlow'},

  {t:'for',eyebrow:'Who this is for',h:'The worship leader who wants more than a good set',body:['You prepare. You pick the right songs. You run a tight rehearsal.','And some Sundays the room still stays on the surface. People sing, but nothing opens up.','If you have ever walked offstage wondering why it felt mechanical, this hour is for you.']},

  {t:'trap',eyebrow:'The trap',h:'We were trained to lead the music',body:['Most of us learned worship leading as a craft: keys, transitions, dynamics, stage presence.','All of it matters. None of it is the thing.','The craft can be flawless and the room can still never go vertical.']},

  {t:'reframe',eyebrow:'The reframe',h:'You can only take a room as deep as you have gone yourself',body:['A congregation does not follow your setlist. It follows your heart.','If you are leading out of preparation and performance, that is as far as the room will travel.','If you are leading out of a real, present connection with Jesus, the room feels it before you say a word.']},

  {t:'section',eyebrow:'Part one',h:'The core problem: leading horizontally'},

  {t:'body',eyebrow:'Horizontal worship',h:'Singing about God, to the room',body:['Horizontal worship points sideways. It performs for people, manages the moment, and fills the silence.','It is not fake. It is just aimed at the wrong place.','The room stays comfortable, entertained, and unmoved.']},

  {t:'body',eyebrow:'Vertical worship',h:'Beholding God, with the room',body:['Vertical worship points up. You are not performing for people, you are leading them to behold Jesus with you.','When the leader is genuinely beholding, the room is invited into something real, not just a song.','This is the whole shift. Everything else in this masterclass serves it.']},

  {t:'section',eyebrow:'Part two',h:'The method: Connection-Based Worship Leading'},

  {t:'body',eyebrow:'The thesis',h:'Leading flows out of connection, not technique',body:['Connection-Based Worship Leading is simple to say and costly to live: you lead onstage out of who you are with Jesus offstage.','The onstage moment is downstream of the offstage relationship.','So the real preparation is not the setlist. It is the connection.']},

  {t:'pillar',eyebrow:'Offstage practice 1',h:'Reading',body:['Meet Him in the Word before you ever ask a room to meet Him in a song.','The Word gives you something true to lead from, not just something new to sing.'],kicker:'You cannot carry what you have not received.'},

  {t:'pillar',eyebrow:'Offstage practice 2',h:'Prayer',body:['Lead out of an ongoing conversation with Jesus, not out of performance anxiety.','Prayer is where the pressure to perform dies and the freedom to lead is born.'],kicker:'Lead from conversation, not from pressure.'},

  {t:'pillar',eyebrow:'Offstage practice 3',h:'Singing',body:['Worship before you ever lead worship. Sing to Him in private with no one watching.','The private song is what gives the public song its weight.'],kicker:'Behold first. Lead second.'},

  {t:'body',eyebrow:'The onstage shift',h:'What changes when you lead from connection',body:['You stop managing the room and start shepherding it.','You follow His direction in the moment instead of defending the plan.','Your band can flow with you because you are actually going somewhere, not stalling.']},

  {t:'body',eyebrow:'The spontaneous moment',h:'When the set opens up and you are not afraid',body:['Spontaneous worship stops being the scary part. It becomes the point.','You know the purpose (beholding Jesus), you know the foundation, and you can guide your heart, your team, and your room through it.','Confidence here is not a personality trait. It is a fruit of connection.']},

  {t:'section',eyebrow:'Part three',h:'When a room finally goes vertical'},

  {t:'body',eyebrow:'The vertical room',h:'A congregation that encounters, not just attends',body:['Week after week, the room moves from singing songs to beholding God.','People stop watching the stage and start meeting Jesus.','That is the fruit of a leader who leads from connection.']},

  {t:'why',eyebrow:'Why me',h:'Twenty years of leading, from connection',body:['I have led worship for nearly twenty years across churches and ministries around the world, and written and served alongside worship leaders many of you know.','For the last few years I have coached hundreds of worship leaders through this exact method.','I teach it because it is the thing that changed my own leading first.'],by:'Jon Thurlow'},

  {t:'recap',eyebrow:'The recap',h:'Three things to take with you',body:['Leading is downstream of connection, not technique.','The real preparation is offstage: Reading, Prayer, Singing.','A room will only go as vertical as the leader already has.']},

  {t:'cta',eyebrow:'Take your leading vertical',h:'Go deeper into Connection-Based Worship Leading',body:['If today named something you have been feeling, the next step is to go deeper with it on purpose.','The Vertical Worship Leader Course walks through the whole method, and the coaching is there if you want help applying it to your room.','Book a coaching call or start the course, and let us take your leading vertical.'],cta:'Book a coaching call with Jon',disc:'This masterclass is educational. It shares a method and principles for worship leading and spiritual practice. It is not a guarantee of any particular outcome in your ministry, church, or team; results vary with context and application.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide';
  let h='<span class="num">'+(i+1)+' / '+S.length+'</span>';
  if(s.eyebrow) h+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1>';}
  else if(s.t==='section'){h+='<h1>'+s.h+'</h1>';}
  else{h+='<h2>'+s.h+'</h2>';}
  if(s.sub) h+='<p class="lead">'+s.sub+'</p>';
  if(s.body){h+='<ul>'+s.body.map(b=>'<li>'+b+'</li>').join('')+'</ul>';}
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.cta) h+='<div class="panel"><strong>'+s.cta+'</strong></div>';
  if(s.by) h+='<div class="by">'+s.by+'</div>';
  if(s.disc) h+='<div class="disclaimer">'+s.disc+'</div>';
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
