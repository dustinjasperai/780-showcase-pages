<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Write the Thing You're Afraid Of — a masterclass with Paulina Pinsky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3eeea; --panel:#ffffff; --ink:#141210; --muted:#6a635c;
    --accent:#e60054; --hi:#f6f055; --rule:#e4ddd5;
    --display:'Syne',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body)}
  .wrap{max-width:900px;margin:0 auto;padding:40px 22px 90px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    padding:52px 48px;margin:0 0 26px;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .slide.dark{background:var(--ink);color:#f7f2ec;border-color:#2a2622}
  .slide.accent{background:var(--accent);color:#fff;border-color:var(--accent)}
  .kicker{font-family:var(--body);font-weight:600;font-size:12px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);margin:0 0 18px}
  .slide.dark .kicker,.slide.accent .kicker{color:var(--hi)}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.04;margin:0 0 18px;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;margin:0 0 16px;letter-spacing:-.01em}
  p{font-size:18px;line-height:1.6;margin:0 0 14px;color:inherit}
  .sub{color:var(--muted);font-size:19px}
  .slide.dark .sub,.slide.accent .sub{color:rgba(255,255,255,.82)}
  .mark{background:linear-gradient(transparent 60%, var(--hi) 60%);padding:0 2px}
  .big{font-size:30px;font-family:var(--display);font-weight:700;line-height:1.18}
  ul{margin:14px 0 0;padding:0;list-style:none}
  li{font-size:18px;line-height:1.5;padding:14px 0 14px 34px;border-top:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:22px;width:16px;height:3px;background:var(--accent);border-radius:2px}
  .slide.dark li{border-color:#2f2a25}
  .num{font-family:var(--display);font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.14em}
  .q{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.2}
  .cite{color:var(--muted);font-size:15px;margin-top:10px}
  .foot{color:var(--muted);font-size:13px;text-align:center;margin-top:30px;font-family:var(--body)}
  .disc{font-size:13px;color:rgba(255,255,255,.8);margin-top:22px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', kicker:"A free live masterclass with Paulina Pinsky, MFA",
    h:"Write the Thing You're Afraid Of",
    sub:"How to put your hardest story on the page without falling apart. Live, in 60 minutes."},

  {t:'trap', kicker:"Who this is for",
    h:"You have a story you keep not writing.",
    sub:"The recovery. The year that broke you. The body you live in. You open the document, and you close it.",
    body:"You are not blocked because you lack talent. You are blocked because the honest version is frightening, and nobody ever taught you how to write toward it safely."},

  {t:'reframe', dark:true, kicker:"The reframe",
    h:"Writing about hard things is a craft, not a confession.",
    sub:"Confession dumps the pain on the page. Craft shapes it so a stranger can feel it, and so you can survive writing it."},

  {t:'section', kicker:"Part one",
    h:"Why the hardest pages are the ones that matter.",
    body:"Elaine Scarry wrote that to have great pain is to have certainty, and to hear of another's pain is to have doubt. The work of this kind of writing is closing that gap, turning what only you can feel into something a reader cannot doubt."},

  {t:'problem', kicker:"The core problem",
    h:"Three things stop almost everyone.",
    list:["The fear that writing it will undo you","The belief it has to be polished before it is allowed to exist","Not knowing how to turn a true feeling into a scene someone will read"]},

  {t:'section', accent:true, kicker:"Part two",
    h:"The method: Writing About Hard Things, in four parts.",
    sub:"The same arc I take one-on-one coaching clients through, in one live hour."},

  {t:'pillar', kicker:"Part two",
    num:"01",
    h:"Get past the fear.",
    body:"We name the barrier out loud and build a container for it. You cannot write toward the hard thing while you are bracing against it. First we make it safe enough to begin."},

  {t:'pillar', kicker:"Part two",
    num:"02",
    h:"Build the foundation.",
    body:"Voice first. We get quiet, find the one true sentence the piece hangs on, and free-write toward it before a single word gets edited. The ugly first draft is the whole point."},

  {t:'pillar', kicker:"Part two",
    num:"03",
    h:"Turn truth into a scene.",
    body:"Craft the raw material into narrative: character, detail, the body on the page. This is where a private feeling becomes a story a reader lives inside, rather than a page they bounce off."},

  {t:'pillar', kicker:"Part two",
    num:"04",
    h:"Protect yourself while you write it.",
    body:"How to pace the work, when to step back, and how to keep going without burning out on your own material. Sustaining the writer is part of the method, not an afterthought."},

  {t:'reframe', dark:true, kicker:"The shift",
    h:"You do not need a better vocabulary.",
    sub:"You need the craft to write the part you have been avoiding. That part is teachable, and this is me teaching it."},

  {t:'section', kicker:"Part three",
    h:"When the fear stops deciding what you write.",
    body:"A piece you were afraid to start becomes something you are proud to share. An essay, a chapter, a Substack post that finally tells the truth. The fear does not vanish. You just stop letting it decide what you write."},

  {t:'list', kicker:"You will leave with",
    h:"What you walk away with, live.",
    list:["The one true sentence your piece hangs on","A safe-enough path into the hardest scene","A way to keep writing it without falling apart","The next concrete step for your specific project"]},

  {t:'credibility', kicker:"Why me",
    h:"I write about hard things for a living, and I teach it.",
    body:"MFA in Nonfiction Creative Writing from Columbia, where I have taught writing since 2017. MacDowell fellow. Co-author of It Doesn't Have To Be Awkward. I write the Substack newly sober. I have spent years turning my own recovery, my own body, and my own hard years into work on the page, and more years teaching other writers to do the same."},

  {t:'quote', kicker:"The belief under all of it",
    q:"“Through finding our voice, only then can we truly heal. You deserve to be heard.”",
    cite:"Paulina Pinsky"},

  {t:'cta', accent:true, kicker:"Your next step",
    h:"Ready to write the thing you have been avoiding?",
    sub:"If today gave you a way in, the next step is working together directly, through my writing coaching and the Full Mentorship, so you finish the piece that scares you.",
    disc:"Educational masterclass only. No income, publication, role, or result is guaranteed. Results vary by writer and effort."}
];

const app = document.getElementById('app');
S.forEach(function(s){
  const el = document.createElement('section');
  el.className = 'slide' + (s.dark ? ' dark' : '') + (s.accent ? ' accent' : '');
  let h = '';
  if(s.kicker) h += '<p class="kicker">'+s.kicker+'</p>';
  if(s.num) h += '<p class="num">'+s.num+'</p>';
  if(s.t === 'title'){
    h += '<h1>'+s.h+'</h1>';
    if(s.sub) h += '<p class="sub big">'+s.sub+'</p>';
  } else if(s.t === 'quote'){
    h += '<p class="q">'+s.q+'</p>';
    if(s.cite) h += '<p class="cite">'+s.cite+'</p>';
  } else {
    if(s.h) h += '<h2>'+s.h+'</h2>';
    if(s.sub) h += '<p class="sub">'+s.sub+'</p>';
    if(s.body) h += '<p>'+s.body+'</p>';
    if(s.list){ h += '<ul>'; s.list.forEach(function(it){ h += '<li>'+it+'</li>' }); h += '</ul>' }
    if(s.disc) h += '<p class="disc">'+s.disc+'</p>';
  }
  el.innerHTML = h;
  app.appendChild(el);
});
const f = document.createElement('p');
f.className = 'foot';
f.textContent = 'Paulina Pinsky · paulinapinsky.com';
app.appendChild(f);
</script>
</body>
</html>
