<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Board Seat Path - HerCsuite Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f9f4f1;        /* their body ground rgb(249,244,241) */
    --panel:#ffffff;
    --tint:#f6eeea;      /* derived warm lightening of ground */
    --rule:#e7d8d2;      /* derived muted from soft-pink family #f4aebe */
    --ink:#303030;       /* their dominant, 59 uses */
    --muted:#6f6763;
    --accent:#ff4c74;    /* their rose/magenta, 18 uses */
    --accent-deep:#7c3662; /* their plum link tone */
    --display:'Playfair Display',Georgia,serif;
    --body:'Poppins',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .stage{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:18px;padding:56px 60px;margin:22px 0;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
    box-shadow:0 1px 0 rgba(48,48,48,0.02),0 24px 48px -36px rgba(124,54,98,0.28);
  }
  .slide::before{
    content:"";position:absolute;top:26px;right:30px;width:34px;height:34px;
    border:2px solid var(--accent);border-radius:50%;opacity:.55;
  }
  .slide::after{
    content:"";position:absolute;top:38px;right:42px;width:10px;height:10px;
    background:var(--accent-deep);border-radius:50%;opacity:.5;
  }
  .kicker{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent-deep);font-weight:600;margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:clamp(34px,6vw,58px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:clamp(26px,4.4vw,40px);line-height:1.1;margin-bottom:18px}
  .lede{font-size:clamp(16px,2.2vw,20px);color:var(--muted);font-weight:300;margin-top:22px;max-width:40ch}
  p{font-size:17px;line-height:1.6;color:var(--ink);max-width:56ch;margin-top:14px}
  .big{font-family:var(--display);font-weight:500;font-size:clamp(24px,3.6vw,34px);line-height:1.2;color:var(--ink);max-width:28ch}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:17px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;border:2px solid var(--accent);border-radius:50%}
  li b{font-weight:600}
  .num{font-family:var(--display);font-size:15px;color:var(--accent-deep);font-weight:600}
  .footer{position:absolute;bottom:22px;left:60px;font-size:12px;color:var(--muted);letter-spacing:.04em}
  .brandline{display:flex;align-items:center;gap:10px;margin-top:30px;font-size:14px;color:var(--muted);letter-spacing:.05em}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--accent)}
  .section-slide{background:linear-gradient(135deg,#fff 0%,var(--tint) 100%)}
  .section-slide h2{font-size:clamp(28px,5vw,46px)}
  .cta-slide{background:linear-gradient(140deg,#fff 0%,var(--tint) 100%)}
  .cta-actions{margin-top:26px;font-size:18px;font-weight:500}
  .cta-actions .go{color:var(--accent-deep);font-weight:600}
  .disc{margin-top:34px;font-size:12.5px;line-height:1.55;color:var(--muted);max-width:62ch;font-weight:300}
  .credit b{font-weight:600}
  @media(max-width:640px){.slide{padding:40px 26px}.footer{left:26px}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const S=[
  {t:'title'},
  {t:'content',kicker:'What you will leave with',h:'A clear path to the boardroom, not another pep talk',
   body:'By the end of this hour you will know the four assets a board candidate actually needs, how nominating committees really choose, and the ninety day path to put your name in the room. Concrete steps you can start this week.'},
  {t:'content',kicker:'Who this is for',h:'Women in the second half of their careers',
   body:'You have led teams, carried a P and L, built or scaled something real. You are ready to land board roles, keep shaping the field, and stay in the rooms where decisions get made. This is for the next chapter, designed on your terms.'},
  {t:'big',kicker:'The trap',big:'You have decades of results. The board door still has not opened. And no one has told you why.'},
  {t:'big',kicker:'The reframe',big:'A board seat is not a reward for a great career. It is a different skill, and it can be learned.'},
  {t:'section',num:'Part One',h2:'Why qualified women stay invisible to committees'},
  {t:'content',kicker:'Myth one',h:'"Someone will tap me when it is my turn"',
   body:'Board seats are not handed out by seniority. They are filled through warm introductions and a clear, specific case. Waiting to be noticed is the single most common reason an accomplished woman never gets the call.'},
  {t:'content',kicker:'Myth two',h:'"My resume speaks for itself"',
   body:'An executive resume and a board resume are different documents. A committee is not hiring an operator. They are selecting oversight, judgment, and risk. A resume written for a job search quietly disqualifies you for a board.'},
  {t:'content',kicker:'Myth three',h:'"I need to be a CEO first"',
   body:'Boards need finance, technology, cybersecurity, go to market, and governance perspective, not only former chief executives. The real gap is translation: turning what you have done into the language a board is looking for.'},
  {t:'section',num:'Part Two',h2:'The Women on Boards method'},
  {t:'content',kicker:'The method',h:'Four assets every board candidate needs',
   list:['<b>The board bio.</b> One page that frames you as governance, not a job seeker.',
         '<b>The board resume.</b> Rewritten around oversight, risk, and value, not duties.',
         '<b>The board pitch.</b> The clear, repeatable case for why a board needs you now.',
         '<b>Interview preparation.</b> How to answer the questions a nominating committee actually asks.']},
  {t:'content',kicker:'Asset one',h:'The board bio',
   body:'Your board bio is the first thing a committee reads and often the only thing. We build a single page that positions you around the perspective you bring to oversight, the sectors you know, and the kind of board where you belong.'},
  {t:'content',kicker:'Asset two',h:'The board resume',
   body:'We rewrite your experience around what a board cares about: financial stewardship, risk, growth, and governance. The same career, told so the people choosing directors see a director, not a candidate for a job.'},
  {t:'content',kicker:'Asset three',h:'The board pitch',
   body:'When someone asks what kind of board you are looking for, you need an answer that is specific and confident. We build the short, repeatable pitch that makes it easy for your network to open the right doors for you.'},
  {t:'content',kicker:'Asset four',h:'Interview preparation',
   body:'A board interview is not a job interview. We prepare you for how committees probe judgment, independence, and fit, so you walk in sounding like someone who has already sat at the table.'},
  {t:'content',kicker:'How it really works',h:'Committees choose on trust and a clear case',
   body:'Nearly every board seat is filled through a warm introduction plus a candidate who is easy to say yes to. The method is built to make you both: visible to the right people, and obviously ready when they look.'},
  {t:'section',num:'Part Three',h2:'What the next ninety days look like'},
  {t:'content',kicker:'The path',h:'From ready on paper to in the room',
   list:['<b>Weeks 1 to 3.</b> Build the bio, the board resume, and your pitch.',
         '<b>Weeks 4 to 7.</b> Position your profile and open warm introductions.',
         '<b>Weeks 8 to 12.</b> Interview prep and first conversations with nominating contacts.',
         '<b>Ongoing.</b> A peer group of women doing the same work, in small structured pods.']},
  {t:'credit',kicker:'Why learn this here',h:'HerCsuite and the Women on Boards Mastermind',
   body:'This masterclass comes from the work HerCsuite does every day with women leaders. <b>Natalie Benamou</b>, Founder and CEO, leads the Women on Boards Mastermind with Naomi Kent and hosts the top ranked podcast <i>Women Leaders on the Move</i>. HerCsuite is a network built to be a force multiplier for women in the second half of their careers.'},
  {t:'cta',h:'Ready for the boardroom?',
   body:'If this is the chapter you are building toward, the Women on Boards Mastermind and the HerCsuite Network are where this work happens, with a peer group of women on the same path.',
   actions:'Join the HerCsuite Network, or start a conversation at hercsuite.com',
   disc:'Educational content only. This masterclass shares a method for board readiness. No specific result or board appointment is guaranteed. Results vary based on your experience, network, and effort.'}
];

function slideInner(s){
  if(s.t==='title'){
    return `<div class="kicker">A HerCsuite Masterclass</div>
      <h1>The Board Seat Path</h1>
      <div class="lede">How accomplished women land their first corporate board role in the second half of their careers.</div>
      <div class="brandline"><span class="dot"></span> HerCsuite with Natalie Benamou</div>`;
  }
  if(s.t==='big'){
    return `<div class="kicker">${s.kicker}</div><div class="big">${s.big}</div>`;
  }
  if(s.t==='section'){
    return `<div class="kicker">${s.num}</div><h2>${s.h2}</h2>`;
  }
  if(s.t==='credit'){
    return `<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><p class="credit">${s.body}</p>`;
  }
  if(s.t==='cta'){
    const act=s.actions.replace('hercsuite.com','<span class="go">hercsuite.com</span>');
    return `<div class="kicker">Your next step</div>
      <h2>${s.h}</h2>
      <p>${s.body}</p>
      <div class="cta-actions">${act}</div>
      <div class="disc">${s.disc}</div>`;
  }
  let body = s.body?`<p>${s.body}</p>`:'';
  let list = s.list?('<ul>'+s.list.map(i=>`<li>${i}</li>`).join('')+'</ul>'):'';
  return `<div class="kicker">${s.kicker||''}</div><h2>${s.h||''}</h2>${body}${list}`;
}

const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  let cls='slide';
  if(s.t==='section')cls+=' section-slide';
  if(s.t==='cta')cls+=' cta-slide';
  d.className=cls;
  d.innerHTML=slideInner(s)+`<div class="footer">${i+1} / ${S.length} &nbsp;&middot;&nbsp; HerCsuite</div>`;
  stage.appendChild(d);
});
</script>
</body>
</html>
