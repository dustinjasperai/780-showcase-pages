<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leading From Presence, Not Control: A Masterclass with Eric Michot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,700;1,9..40,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f1;      /* warm-white ground — harvested site scheme: light */
    --ink:#1a1a1a;     /* harvested brand ink + single accent */
    --rule:#dbd6cd;    /* hairline — a light tint of the harvested ink */
    --mut:#6f6a62;     /* muted ink for secondary text */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:4px;padding:72px 72px 64px;margin:0 0 28px;min-height:560px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  /* the one unbroken thread — the method's Continuum motif */
  .slide::before{content:"";position:absolute;left:72px;top:64px;bottom:64px;width:1px;background:var(--rule)}
  .slide>*{padding-left:40px}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--mut);font-weight:500;margin-bottom:22px}
  h1{font-size:52px;line-height:1.05;font-weight:700;letter-spacing:-.02em;max-width:17ch}
  h2{font-size:38px;line-height:1.1;font-weight:700;letter-spacing:-.015em;max-width:20ch}
  .lead{font-size:22px;line-height:1.5;color:var(--ink);font-weight:400;max-width:34ch;margin-top:22px}
  .sub{font-size:19px;line-height:1.55;color:var(--mut);font-weight:400;max-width:40ch;margin-top:18px}
  .big{font-size:30px;line-height:1.3;font-weight:500;max-width:26ch;margin-top:10px}
  ul{list-style:none;margin-top:26px}
  li{font-size:20px;line-height:1.4;padding:14px 0;border-top:1px solid var(--rule);max-width:40ch;display:flex;gap:16px}
  li:last-child{border-bottom:1px solid var(--rule)}
  li .n{color:var(--mut);font-weight:500;font-variant-numeric:tabular-nums;min-width:1.6em}
  .mods{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin-top:28px;max-width:46ch}
  .mods div{border-top:1px solid var(--rule);border-left:1px solid var(--rule);padding:18px 16px;font-size:18px;font-weight:500}
  .mods div:nth-child(3n){border-right:1px solid var(--rule)}
  .mods div:nth-last-child(-n+3){border-bottom:1px solid var(--rule)}
  .foot{position:absolute;left:112px;bottom:30px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
  .pg{position:absolute;right:28px;bottom:26px;font-size:12px;color:var(--mut);font-variant-numeric:tabular-nums}
  .title h1{font-size:60px;max-width:16ch}
  .disc{font-size:13px;line-height:1.5;color:var(--mut);max-width:50ch;margin-top:30px;font-style:italic}
  .cta .big{margin-top:6px}
  @media(max-width:720px){.slide{padding:44px 28px}.slide::before{left:28px}.slide>*{padding-left:24px}.foot{left:52px}h1{font-size:38px}.title h1{font-size:40px}h2{font-size:28px}.mods{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Transformative Solutions";
const S = [
  {t:'title', eyebrow:"A live masterclass with Eric Michot", h1:"Leading From Presence, Not Control",
   lead:"How the best leaders stop being the bottleneck and let a team move without them."},

  {t:'who', eyebrow:"Who this is for", h2:"For leaders, managers, and coaches who have become the choke point",
   sub:"You are good at your work. So good that now every decision waits for you. The team is capable, but nothing moves until you weigh in."},

  {t:'trap', eyebrow:"The trap", h2:"You were promoted for being the answer. Then the answers never stopped.",
   sub:"More people, more decisions, more of you needed in every room. The reward for control is always more things to control."},

  {t:'hook', eyebrow:"An uncomfortable reframe", big:"More control does not scale you. It shrinks the team around you.",
   sub:"Every decision you hold is a decision your people stop learning to make. The tighter you grip, the smaller they get."},

  {t:'part', eyebrow:"Part one", h2:"The real problem is not time. It is coherence.",
   sub:"A controlled team is busy and obedient and quietly disengaged. The work gets done and the aliveness leaves the room."},

  {t:'body', eyebrow:"What control looks like up close", h2:"Three quiet signals you have become the bottleneck",
   list:["People ask permission for things they already know how to do.","Good ideas arrive only after they check what you think first.","You feel indispensable and exhausted in the same breath."]},

  {t:'body', eyebrow:"The hidden cost", h2:"Control buys compliance. It cannot buy ownership.",
   sub:"You can order the output. You cannot order the care, the judgement, or the initiative. Those only grow in people who are trusted to move."},

  {t:'part', eyebrow:"Part two", h2:"Unity-Centric leadership: lead from the whole, not the top",
   sub:"The shift is from a leader who holds every part to a leader who holds the field. You lead the coherence of the whole, and the parts start to move in tune."},

  {t:'body', eyebrow:"The principle", big:"A team is not parts you manage. It is one living system you tend.",
   sub:"Oneness of people and purpose is not a soft idea. It is the practical center of gravity that lets a group self-organize instead of waiting."},

  {t:'mods', eyebrow:"The method", h2:"Nine movements, from control to coherence",
   mods:["Discovery","Shift","Mirror","Unfolding","Confluence","Stillness","Spiral","Alchemy","Continuum"],
   sub:"The Unity-Centric path. Each movement is a way to access wisdom already in the room and integrate it in the present."},

  {t:'body', eyebrow:"Movements one to three", h2:"Seeing clearly before you act",
   list:["Discovery: name what is actually happening, not the story about it.","Shift: change your own stance before you try to change theirs.","Mirror: let the team see itself so it can lead itself."]},

  {t:'body', eyebrow:"Movements four to six", h2:"Letting the team find its own motion",
   list:["Unfolding: give problems room to reveal their own shape.","Confluence: bring the separate parts into one current.","Stillness: stop managing long enough for the group to step up."]},

  {t:'body', eyebrow:"Movements seven to nine", h2:"Turning motion into a way of working",
   list:["Spiral: return to the same work at a higher level each time.","Alchemy: let tension become the material, not the threat.","Continuum: make the practice continuous, so it outlasts you."]},

  {t:'body', eyebrow:"The core skill", big:"Presence is the whole practice. Everything else is built on it.",
   sub:"Presence is the capacity to stay with what is here without rushing to fix it. It is what lets a leader listen instead of jump, and hold instead of grip."},

  {t:'body', eyebrow:"What presence makes possible", h2:"Two things change the moment you stop gripping",
   list:["Deep listening: you hear the real issue, not the first complaint.","Systems awareness: you see the pattern making the problem, not just the person in front of it."]},

  {t:'part', eyebrow:"Part three", h2:"A team that moves without you in every room",
   sub:"Not chaos, and not a free-for-all. A clear center, and a team that moves toward it without being pushed."},

  {t:'body', eyebrow:"The shift", h2:"From compliance to coherence",
   list:["Decisions move to the people closest to them.","You spend your attention on the field, not the firefighting.","The team carries the method when you are not in the room."]},

  {t:'why', eyebrow:"Why learn this from Eric", h2:"Two decades inside the question, written down",
   sub:"Eric Michot has coached and trained senior executives, entrepreneurs, and changemakers across diverse sectors for over twenty years. The Unity-Centric method is set out across his Coaching and Leadership series, from Unity-Centric Coaching to Unity-Centric Organizations."},

  {t:'recap', eyebrow:"The one idea", big:"Leadership is not control. It is presence, held long enough for a team to become one.",
   sub:"Learn to lead the whole, and you stop being the thing your team is waiting on."},

  {t:'cta', eyebrow:"Where to go from here", h2:"Bring Unity-Centric leadership to your team",
   big:"Book a conversation with Eric.",
   sub:"We will look at where control is quietly costing you coherence, and what leading from presence would change in your team.",
   disc:"This masterclass is educational. It shares a leadership method and the thinking behind it. It is not a guarantee of any specific result; outcomes vary with context, effort, and circumstances."}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide ' + (s.t||'');
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.big) h += `<div class="big">${s.big}</div>`;
  if(s.lead) h += `<div class="lead">${s.lead}</div>`;
  if(s.list){ h += '<ul>' + s.list.map((x,j)=>`<li><span class="n">${(j+1).toString().padStart(2,'0')}</span><span>${x}</span></li>`).join('') + '</ul>'; }
  if(s.mods){ h += '<div class="mods">' + s.mods.map(m=>`<div>${m}</div>`).join('') + '</div>'; }
  if(s.sub) h += `<div class="sub">${s.sub}</div>`;
  if(s.disc) h += `<div class="disc">${s.disc}</div>`;
  h += `<div class="foot">${BRAND}</div><div class="pg">${(i+1).toString().padStart(2,'0')} / ${S.length.toString().padStart(2,'0')}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
