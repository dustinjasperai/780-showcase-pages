<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>Builder Freedom · Mick Hawes, Builders Business Blackbelt</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700&family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f4f7ef; --panel:#e7eede; --rule:#d5dec6;
    --acc:#3f6d16; --lime:#94cf3f; --ink:#23281d; --body:#3c4235; --dim:#7c8370; --cream:#f4f7ef;
  }
  html,body{height:100%}
  body{background:#e7ecdd;font-family:'Poppins',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e7ecdd}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Montserrat',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.15;letter-spacing:.002em}
  .t-title h1{font-size:4.5vw;max-width:94%;font-weight:700}
  .t-normal h1{font-size:3.0vw;max-width:90%}
  .t-normal .body{font-family:'Poppins',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:76%;line-height:1.62;font-weight:400}
  .sub{font-family:'Poppins',sans-serif;font-size:1.7vw;color:var(--acc);margin-top:3.6vh;max-width:84%;line-height:1.5;font-weight:500}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.22em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:92%}
  .t-section .rule{width:15vw;height:3px;background:linear-gradient(90deg,var(--lime),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#1e2a17 0%,#131c0e 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.4vw;max-width:88%;color:var(--cream);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#1e2a17 0%,#131c0e 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.6vw;max-width:86%;color:var(--cream)}
  .t-cta .body{font-family:'Poppins',sans-serif;color:#d7e4c8;font-size:1.4vw;margin-top:3vh;max-width:72%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--lime);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.84vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .gr-motif{position:absolute;pointer-events:none}
  .title-gr{right:7.2%;bottom:8.5%;width:18vw;opacity:.95}
  .corner-gr{right:6.5%;bottom:7.5%;width:8.5vw;opacity:.55}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.1vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.04em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(35,40,29,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.4vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.6vw}.t-section h1{font-size:7.2vw}.t-dark h1{font-size:5.6vw}
    .t-cta h1{font-size:6.4vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Builders Business Blackbelt</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: ascending "blackbelt" level bars climbing off a baseline, drawn in the brand green. progression and levels, not a hammer or a house -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="gr" viewBox="0 0 120 120">
  <g fill="none" stroke="#3f6d16" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <path d="M18 104 H104" opacity="0.5"/>
    <rect x="26" y="86" width="16" height="16" rx="2" fill="#94cf3f" stroke="none" opacity="0.55"/>
    <rect x="50" y="66" width="16" height="36" rx="2" fill="#94cf3f" stroke="none" opacity="0.75"/>
    <rect x="74" y="40" width="16" height="62" rx="2" fill="#3f6d16" stroke="none" opacity="0.95"/>
    <path d="M26 34 L34 26 L42 34" opacity="0.9"/>
    <path d="M34 26 V54" opacity="0.9"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Builder Freedom',sub:'How a custom home builder stops being the business, and builds one that runs, and profits, without them living on the tools.',brand:true,gr:'title'},
 {t:'normal',k:'Who this is for',title:'You build beautiful homes. Somewhere along the way the business started running you.',body:'You are a custom home builder whose work is good and whose clients are happy. But the quoting, the site visits, the chasing money, the staff questions, it all still runs through you. A bigger year just means more of your nights and weekends disappear into it.'},
 {t:'dark',title:'A full job board is not the same as a business. One depends on you for everything. The other does not.'},

 {t:'section',idx:'Part One',title:'Why Working Harder Stopped Paying'},
 {t:'normal',k:'The free quote treadmill',title:'You give away detailed quotes for free, then wonder where your week went.',body:'Hours of takeoffs and pricing handed over for nothing, to people still ringing three other builders. The industry taught everyone to quote for free, so the most valuable thinking you do, scoping the job properly, is the one thing you are never paid for. It rewards the fast guess, not the good builder.'},
 {t:'normal',k:'The price race',title:'When every builder quotes free and competes on price, the lowest number wins the job and loses the money.',body:'Clients treat quotes as interchangeable, so it comes down to price, and the builder who underquotes the most takes the work into a margin that was never there. You know how to build it properly. That is exactly why your honest number keeps losing to someone who has not thought it through.'},
 {t:'dark',title:'You cannot out-work a business where you are the estimator, the site manager, the salesperson and the bank.'},

 {t:'section',idx:'Part Two',title:'The Builder Freedom Method'},
 {t:'normal',k:'Move one, get paid to quote',title:'Charge for the pre-construction work, and the client who pays is the client who builds.',body:'Instead of a free quote, you sell a paid design and pricing stage. It pays you for the real work, and it filters out the tyre-kickers before they cost you a fortnight. The people who pay for that stage are the ones who are serious, funded and ready, so your win rate climbs while your unpaid hours fall.'},
 {t:'normal',k:'Move two, stop competing on price',title:'Win the job on certainty and proof, so a fair price stops being the deciding factor.',body:'When you can show a client exactly how their project will run, what it costs, and why nothing lands as a nasty surprise, you are no longer one of three interchangeable numbers. You compete on trust and on a process they can see, which is the one thing the cheap quote can never match.'},
 {t:'normal',k:'Move three, build the team and systems',title:'Put the business on repeatable systems so it stops living only in your head.',body:'The last move is a team that can quote, run sites and answer clients to your standard, working from documented systems rather than from you. That is the shift from owning a job to owning a business, the point where the work keeps moving whether or not you are on site that day.'},
 {t:'dark',title:'Freedom is not fewer jobs. It is a business that runs to your standard without your hands on every single one.'},

 {t:'section',idx:'Part Three',title:'What Builder Freedom Looks Like'},
 {t:'normal',k:'The builder this builds',title:'Better clients, protected margins, and a business that does not stop the day you do.',body:'You take a real break and the sites keep moving, because your team runs to systems and not to memory. Your margins hold because you are paid for the thinking and you are not buying jobs on price. And the clients you take on are the ones who valued your process enough to pay for it.'},
 {t:'dark',title:'The goal was never to be the busiest builder in town. It was to own the business instead of being owned by it.'},
 {t:'normal',k:'Why Mick Hawes',title:'A builder-industry coach who has spent a lifetime in and around the trade, focused only on custom home builders.',body:'Mick Hawes founded Builders Business Blackbelt and has been a performance coach in business and elite sport for more than 35 years, with all of it now aimed at the custom home building business. He hosts The Tools Shed podcast for builders, and the Blackbelt program turns these moves into a step by step path, with a community of builders walking it alongside you.'},

 {t:'section',idx:'Your Next Step',title:'Start On The Path To Builder Freedom'},
 {t:'normal',k:'Where to begin with Mick',title:'See where your business sits today, then map the path with Mick and the Blackbelt community.',body:'Start with the Builders Freedom Readiness Scorecard, a two minute check that shows you the obstacles between you and earning more while working less. From there, the Builders Business Blackbelt program puts the paid quoting, the pricing, and the team systems in place, step by step, with Mick and a room full of builders beside you.'},
 {t:'cta',title:'Ready to build a business that runs without you?',body:'Take the next step with Mick Hawes and Builders Business Blackbelt.',chips:['Take the Builders Freedom Scorecard','Join Builders Business Blackbelt'],disc:'Educational content for custom home builders growing a business. No income, profit or result is guaranteed. Results vary by builder, market and business.'},
];

const deck=document.getElementById('deck');
function gr(kind){return `<svg class="gr-motif ${kind==='title'?'title-gr':'corner-gr'}"><use href="#gr"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Builders Business <b>Blackbelt</b> · Mick Hawes</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.gr) h+=gr(s.gr);
  else if(s.t==='title') h+=gr('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
