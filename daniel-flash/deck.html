<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title', cls:'slide title', html:`<div class="kick">A live masterclass with Dr. Daniel Flash</div><h1>Ignite Your Own<br>Nervous System</h1><p class="lead">The 20-minute reset that lets your body shake off tension it has been holding for years, live and guided, from your own living room.</p>`},
  {t:'promise', cls:'slide', html:`<div class="kick">What you'll leave with</div><h2>By the end of this session you will have felt your own first tremor.</h2><p>Not a theory about relaxation. An actual, felt release in your own body that you can repeat at home, tonight.</p>`},
  {t:'who', cls:'slide', html:`<div class="kick">Who this is for</div><h2>If your body won't switch off, this is for you.</h2><ul><li>You lie down wired, mind racing, shoulders still up by your ears</li><li>You've tried meditation, yoga and massage and the tension always creeps back</li><li>You feel the stress in your body, not just your head, and nothing quite reaches it</li></ul>`},
  {t:'trap', cls:'slide', html:`<div class="kick">The trap</div><h2>You've been told to relax. Nobody showed your body how.</h2><p>Breathe deeper. Stretch more. Think positive. It is all aimed at the mind, while the charge sits in the body, waiting. So it keeps coming back.</p>`},
  {t:'reframe', cls:'slide', html:`<div class="kick">A different idea</div><div class="big">Your body was never meant to relax on command. It was meant to <span class="a">shake</span>.</div><p>Every mammal discharges stress by trembling. We were taught to hold still. The tension never left, it just went quiet.</p>`},
  {t:'part', cls:'slide', html:`<div class="num">PART ONE</div><h1>Why the tension<br>won't leave</h1>`},
  {t:'problem', cls:'slide', html:`<div class="kick">Where it lives</div><h2>Tension is filed in the body, at specific points.</h2><p>It settles into the fascia and gathers at vital points the body uses to hold a charge. Stretching and talking pass right over those points. That is why the relief never lasts.</p>`},
  {t:'stuck', cls:'slide', html:`<div class="kick">The stuck switch</div><h2>A nervous system left switched on.</h2><p>After enough stress with no discharge, the system stays half-braced all the time. You stop noticing it. Your body never does.</p>`},
  {t:'part', cls:'slide', html:`<div class="num">PART TWO</div><h1>The method</h1>`},
  {t:'kyusho', cls:'slide', html:`<div class="kick">Kyusho vital points</div><h2>An ancient map of the body, turned inward.</h2><p>Kyusho is a once-secret art of the body's vital points, taught for centuries only to a few. In Sensory Energetics it becomes a map you use on yourself, to reach the exact places tension is stored.</p>`},
  {t:'ignition', cls:'slide', html:`<div class="kick">Self-Ignition</div><h2>Your own tremor, switched back on.</h2><p>Self-Ignition wakes the body's natural tremor so it can finish the stress response it never got to finish. You lie down, you let it move, and the body does the work. No one has to touch you.</p>`},
  {t:'modules', cls:'slide', html:`<div class="kick">The four modules</div><h2>Four doors into your own body.</h2><ul><li><b>Tiger</b> contact, strength and the grounding that makes you resilient</li><li><b>Crane</b> sensitivity and balance, how the body speaks beyond touch</li><li><b>Dragon</b> breath, posture and fascia, the link between body and mind</li><li><b>Gorilla</b> deep structural work for alignment and reorganisation</li></ul>`},
  {t:'notreiki', cls:'slide', html:`<div class="kick">Be clear</div><div class="big">This isn't Reiki. Nobody transfers energy to <span class="a">you</span>.</div><p>No channeling, no faith required. It is your body, your nervous system, your own tremor. You learn to do it yourself and you keep it for life.</p>`},
  {t:'part', cls:'slide', html:`<div class="num">PART THREE</div><h1>What the<br>practice looks like</h1>`},
  {t:'practice', cls:'slide', html:`<div class="kick">The daily reset</div><h2>Twenty minutes. A mat or a chair. That's all.</h2><p>You lie or sit in a quiet room, follow the guided practice, and let the body move. Done most days, it becomes the moment your system finally lets go.</p>`},
  {t:'changes', cls:'slide', html:`<div class="kick">What people notice</div><h2>The body starts to settle.</h2><ul><li>Falling asleep without the long wind-down</li><li>Shoulders and jaw that stop living up around the ears</li><li>Breath that reaches lower, on its own</li></ul>`},
  {t:'whyme', cls:'slide', html:`<div class="kick">Who's guiding you</div><h2>Dr. Daniel Flash</h2><p>A world martial-arts champion by fifteen, he spent decades in Taiwan, China, Japan and Russia learning arts few outsiders are taught. He is a Doctor of Natural Medicine and one of the few teaching these methods in their homelands.</p>`},
  {t:'proof', cls:'slide', html:`<div class="kick">The community</div><h2>Practised in more than 60 countries.</h2><p>Sensory Energetics is taught in 68+ countries with certified facilitators in 53+, and members rate the Self-Ignition practice 5.0 in its community reviews.</p>`},
  {t:'cta', cls:'slide cta', html:`<div class="kick">Your next step</div><h1>Start your own practice.</h1><p>Join the Self-Ignition Programme and come to the next live Energy Group Session with Dr. Daniel, or find a seminar in your city and train hands-on.</p><div class="by">Sensory Energetics (KSE)</div><div class="disc">For education only. Sensory Energetics is a somatic practice, not medical treatment, and is not a substitute for care from a qualified professional. No medical outcome or result is guaranteed and individual results vary.</div>`}
];
const deck=document.getElementById('deck');
S.forEach(s=>{const el=document.createElement('section');el.className=s.cls;el.innerHTML='<div>'+s.html+'</div>';deck.appendChild(el);});
document.getElementById('nav').textContent=S.length+' slides';
</script>
