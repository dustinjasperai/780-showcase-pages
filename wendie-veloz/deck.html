<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Idea Surgery — A Live Masterclass with Wendie Veloz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gilda+Display&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf9f6;
    --panel:#f3ece9;
    --ink:#585563;
    --accent:#930c60;
    --teal:#08bdbd;
    --rule:#e4d8d2;
    --chalk:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Raleway',sans-serif}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px}
  .slide{
    background:var(--chalk);
    border:1px solid var(--rule);
    border-radius:18px;
    padding:54px 56px;
    margin:0 0 22px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;overflow:hidden;
  }
  .slide::before{
    content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;
    border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(147,12,96,.10),transparent 70%);
  }
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:18px}
  h1{font-family:'Gilda Display',serif;font-size:58px;line-height:1.05;color:#3a2b35;margin-bottom:18px}
  h2{font-family:'Gilda Display',serif;font-size:40px;line-height:1.1;color:#3a2b35;margin-bottom:20px}
  h3{font-family:'Gilda Display',serif;font-size:27px;color:var(--accent);margin-bottom:10px}
  p{font-size:19px;line-height:1.6;margin-bottom:14px;max-width:48ch}
  .lead{font-size:22px;color:#4a4450}
  .sub{font-size:20px;color:var(--ink)}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:19px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  li.teal::before{background:var(--teal)}
  .num{font-family:'Gilda Display',serif;font-size:22px;color:var(--teal);font-weight:400}
  .presenter{margin-top:26px;font-size:18px;color:#4a4450}
  .presenter b{color:var(--accent);font-weight:700}
  .part-n{font-family:'Gilda Display',serif;font-size:80px;color:var(--teal);opacity:.5;line-height:1}
  .stat{display:flex;gap:34px;flex-wrap:wrap;margin-top:12px}
  .stat div{min-width:150px}
  .stat b{font-family:'Gilda Display',serif;font-size:38px;color:var(--accent);display:block}
  .stat span{font-size:15px}
  .disclaimer{margin-top:24px;font-size:14px;color:#8a8290;max-width:60ch;line-height:1.5}
  .cta-btn{display:inline-block;margin-top:10px;background:var(--accent);color:#fff;font-weight:700;
    padding:15px 30px;border-radius:40px;font-size:18px;text-decoration:none}
  .map{display:flex;gap:10px;align-items:center;margin-top:18px;flex-wrap:wrap}
  .node{background:var(--panel);border:1px solid var(--rule);border-radius:30px;padding:9px 16px;font-size:15px;color:#4a4450}
  .node.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  .foot{text-align:center;color:#a99fa6;font-size:13px;letter-spacing:.14em;text-transform:uppercase;margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="foot">Social Impact Level Up &middot; A live masterclass</div>
<script>
const S=[
  {t:'title', kicker:'A Live Masterclass', h:'Idea Surgery', sub:'Turn idea overwhelm into one aligned action roadmap.', presenter:'Wendie Veloz, Social Impact Strategist &amp; Executive Coach'},
  {t:'promise', kicker:'The promise', h:'In one live hour, you leave with a plan, not more tabs open.', body:['You will map every idea in your head, choose the few that move your mission now, and match your energy to them so you move without burning out.']},
  {t:'forwho', kicker:'Who this is for', h:'Mission-driven founders and nonprofit leaders.', items:['You have more vision than bandwidth','You are wearing all the hats and still feel behind','You want impact and income to grow together, not one at the cost of the other']},
  {t:'trap', kicker:'The trap', h:'More ideas were supposed to help. They are slowing you down.', body:['Every new idea feels like progress. So you collect them. Then you freeze, because everything feels equally urgent and nothing feels like the obvious place to start.']},
  {t:'reframe', kicker:'The reframe', h:'This is not a motivation problem. It is a mapping problem.', body:['You do not need to work harder or care more. You care plenty. You need to get the ideas out of your head and into a shape you can actually see and decide from.']},
  {t:'part', n:'01', kicker:'Part one', h:'Why a full head keeps you stuck.'},
  {t:'content', kicker:'The loop', h:'The overwhelm loop', items:['Ideas pile up faster than you can act on them','Priority feels impossible, so you default to whatever is loudest','Progress stalls, and the stall feeds the self-doubt']},
  {t:'content', kicker:'The real cost', h:'What the fog actually costs you', items:['The mission moves slower than the need it serves','You burn energy on tasks that were never the priority','Burnout starts to look like the price of caring, and it is not']},
  {t:'part', n:'02', kicker:'Part two', h:'Idea Surgery, step by step.'},
  {t:'content', kicker:'Step one', h:'Guided Idea Surgery mind-map', body:['We extract every idea and visually map it, so for the first time you can see all of it at once. What is in your head stops feeling infinite the moment it is on the page.'], map:['dump every idea','group them','see the whole']},
  {t:'content', kicker:'Step two', h:'The Priority Action Framework', body:['From the full map you choose the one to three goals that move your mission right now. Not a list of a hundred tasks. The few that actually matter this quarter.']},
  {t:'content', kicker:'Step three', h:'Aligned Time and Energy Planning', body:['You match your energy to the right tasks, so the plan fits the human carrying it. This is how you make more progress with less burnout instead of grinding yourself flat.']},
  {t:'part', n:'03', kicker:'Part three', h:'Vision, action, aligned energy.'},
  {t:'content', kicker:'What it becomes', h:'A roadmap you can revise again and again', body:['The map is not a one-time exercise. It is a living picture of your mission you come back to whenever a new idea or opportunity shows up, so you never lose the thread again.']},
  {t:'content', kicker:'Aligned first', h:'Healed people build bigger', body:['We tune your well-being and energy as the prerequisite to the work, not an afterthought. Energetic alignment before tactics is what lets personal clarity scale into community impact.']},
  {t:'content', kicker:'Where growth lives', h:'Three levers, once the fog clears', items:['Marketing strategy, so the right people find your work','Funding strategy, so the mission is resourced to last','Implementation strategy, so the plan actually ships']},
  {t:'whyme', kicker:'Why me', h:'I have walked founders through this for 15 years.', stat:[['$35M','in federally funded projects implemented'],['100+','grantees supported'],['15 yrs','in social-impact program work']], body:['Columbia-trained in social-work policy, and I blend intuition with strategy because the leaders doing this work deserve both.']},
  {t:'recap', kicker:'The method', h:'Idea Surgery in one line', items:['See it, map every idea so it stops feeling infinite','Choose it, the one to three goals that matter now','Align it, match your energy so you actually move']},
  {t:'nextstep', kicker:'Where this goes next', h:'From the roadmap to real growth', body:['If you want a partner to carry this the rest of the way, the Purpose-Driven Growth coaching takes your roadmap into marketing, funding, and implementation over six months, one aligned step at a time.']},
  {t:'cta', kicker:'Your next step', h:'Ready to clear the fog?', body:['Apply for Purpose-Driven Growth coaching and book your fit call. Limited spaces open each quarter.'], btn:'Apply and book your call', disclaimer:'This masterclass is educational. No specific result, income, or outcome is guaranteed. Results vary based on your own effort, resources, and circumstances.'}
];
const d=document.getElementById('deck');
function esc(x){return x}
S.forEach(s=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.kicker) h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='part'){ h+='<div class="part-n">'+s.n+'</div>'; }
  if(s.t==='title'){ h+='<h1>'+s.h+'</h1>'; } else { h+='<h2>'+s.h+'</h2>'; }
  if(s.sub) h+='<p class="lead">'+s.sub+'</p>';
  if(s.body){ s.body.forEach(p=>h+='<p>'+p+'</p>'); }
  if(s.items){ h+='<ul>'+s.items.map((it,i)=>'<li class="'+(i%2?'teal':'')+'">'+it+'</li>').join('')+'</ul>'; }
  if(s.map){ h+='<div class="map">'+s.map.map((m,i)=>'<span class="node '+(i===s.map.length-1?'on':'')+'">'+m+'</span>'+(i<s.map.length-1?'<span>&rarr;</span>':'')).join('')+'</div>'; }
  if(s.stat){ h+='<div class="stat">'+s.stat.map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('')+'</div>'; }
  if(s.presenter) h+='<div class="presenter">with <b>'+s.presenter+'</b></div>';
  if(s.btn) h+='<div><span class="cta-btn">'+s.btn+'</span></div>';
  if(s.disclaimer) h+='<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML=h;
  d.appendChild(el);
});
</script>
</body>
</html>
