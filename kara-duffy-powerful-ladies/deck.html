<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Become the Extraordinary CEO — A Masterclass with Kara Duffy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sofia+Sans+Extra+Condensed:wght@600;700;800&family=Sofia+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f1; --panel:#efece4; --rule:#e3ded3;
    --acc:#ff4f58; --ink:#17161a; --body:#403d3a; --dim:#8a847b; --cream:#f6f2ea;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#e9e5dc;font-family:'Sofia Sans',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{display:flex;align-items:center;justify-content:center;width:100vw;height:100vh}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%;background:var(--bg)}
  .slide.active{opacity:1}
  .kicker{font-family:'Sofia Sans',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.26em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Sofia Sans Extra Condensed',Arial,sans-serif;font-weight:800;color:var(--ink);line-height:1.02;letter-spacing:.002em;text-transform:none}
  .t-title h1{font-size:6.6vw;max-width:92%}
  .t-normal h1{font-size:3.9vw;max-width:88%}
  .t-normal .body{font-family:'Sofia Sans',sans-serif;font-size:1.36vw;color:var(--body);margin-top:3.0vh;max-width:72%;line-height:1.62;font-weight:400}
  .sub{font-family:'Sofia Sans',sans-serif;font-size:1.7vw;color:var(--body);margin-top:3.2vh;max-width:76%;line-height:1.42;font-weight:500}
  .t-title .sub b{color:var(--acc);font-weight:700}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Sofia Sans',sans-serif;font-size:1.05vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.26em;text-transform:uppercase}
  .t-section h1{font-size:5.4vw;max-width:82%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-pillar{background:var(--bg)}
  .t-pillar .pin{font-family:'Sofia Sans Extra Condensed',sans-serif;font-size:1.9vw;font-weight:800;color:var(--acc);letter-spacing:.06em;text-transform:uppercase;margin-bottom:1.4vh}
  .t-pillar h1{font-size:4.0vw;max-width:86%}
  .t-pillar .body{font-family:'Sofia Sans',sans-serif;font-size:1.34vw;color:var(--body);margin-top:2.6vh;max-width:72%;line-height:1.62}
  .t-dark{background:radial-gradient(120% 140% at 18% 8%,#231f24 0%,#141216 100%)}
  .t-dark h1{color:var(--cream);font-size:4.4vw;max-width:86%}
  .t-dark h1 em{color:var(--acc);font-style:normal}
  .t-cta{background:radial-gradient(120% 140% at 18% 8%,#231f24 0%,#141216 100%)}
  .t-cta h1{color:var(--cream);font-size:4.0vw;max-width:84%}
  .t-cta .body{font-family:'Sofia Sans',sans-serif;color:#e8ded4;font-size:1.36vw;margin-top:3vh;max-width:70%;line-height:1.58}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap}
  .chip{border:1.6px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.3vh 1.8vw;font-size:1.1vw;font-weight:600}
  .brandline{font-family:'Sofia Sans',sans-serif;font-size:1.12vw;color:var(--body);margin-top:4.0vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .cred{display:flex;gap:2.4vw;margin-top:3.6vh;flex-wrap:wrap;max-width:84%}
  .cred div{font-family:'Sofia Sans',sans-serif;font-size:1.16vw;color:var(--body);line-height:1.4}
  .cred b{font-family:'Sofia Sans Extra Condensed',sans-serif;display:block;font-size:2.6vw;color:var(--acc);font-weight:800}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:5.0vh;font-family:'Sofia Sans',sans-serif;font-size:.82vw;color:#c7bcae;line-height:1.5;max-width:82%}
  .hud{position:fixed;left:0;right:0;top:0;height:4px;background:rgba(0,0,0,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .mo-motif{position:absolute;pointer-events:none}
  .title-mo{right:6.5%;top:50%;transform:translateY(-50%);width:19vw;height:19vw;opacity:.92}
  .corner-mo{right:5.5%;bottom:7%;width:7.5vw;height:7.5vw;opacity:.5}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:700}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:800}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:11vw}.t-normal h1{font-size:7vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.2vw}.t-section h1{font-size:9vw}.t-dark h1{font-size:7.6vw}.t-pillar h1{font-size:7vw}
    .t-pillar .pin{font-size:4vw}.t-pillar .body{font-size:3vw}.t-cta h1{font-size:8vw}.chip{font-size:2.8vw}
    .t-cta .body{font-size:3vw}.disc{font-size:2vw}.cred b{font-size:5vw}.cred div{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Powerful Ladies</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a bold coral arc rising over a fine hairline baseline, the brand-builder's upward curve -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="mo" viewBox="0 0 120 120">
  <g fill="none" stroke="#ff4f58" stroke-linecap="round">
    <path d="M12 96 H108" stroke-width="2" opacity="0.35"/>
    <path d="M18 96 C 40 40, 80 40, 102 96" stroke-width="3.4" opacity="0.95"/>
    <circle cx="102" cy="96" r="5.5" fill="#ff4f58" stroke="none"/>
    <circle cx="60" cy="52" r="4" fill="#ff4f58" stroke="none" opacity="0.85"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'Become the Extraordinary CEO',sub:'How to build a brand led business that runs on your terms, and a life you do not have to shrink to fit it.',brand:true,mo:'title'},

 {t:'normal',k:'Who this is for',title:'You built the business. Somewhere along the way, it started running you.',body:'You are the founder, the strategist, the operator and the safety net, all at once. The work is good and the calendar is full. But every decision still routes through you, and the growth you want would just mean more hours you do not have.'},
 {t:'dark',title:'Working harder is not the next level. <em>Becoming the CEO is.</em>'},

 {t:'section',idx:'Part One',title:'Why Great Founders Get Stuck Being the Operator'},
 {t:'normal',k:'The do it all trap',title:'When you are the answer to everything, growth just costs you more time.',body:'A business that depends on you for every call has a ceiling, and that ceiling is your calendar. Adding revenue adds hours. That is not scaling. That is buying yourself a harder job, one you can never take a real break from.'},
 {t:'normal',k:'The invisible brand',title:'Your reputation lives in your head and your inbox, not in a brand that sells for you.',body:'You know your value. Your best clients know it too. But that trust has never been built into a brand that can travel without you in the room. So new people who have never met you have no way to feel it before they buy.'},
 {t:'dark',title:'If the business cannot run without you, you do not own a business. <em>You own a job.</em>'},

 {t:'section',idx:'Part Two',title:'The Have It All Method'},
 {t:'pillar',pin:'Shift 01 · Brand',title:'Build like the big brands, in the category everyone underestimated.',body:'This is the edge I brought from streetwear and skateboarding into rooms full of multinationals. The same brand playbook the giants use will work for you, especially in a market other people wrote off. You do not need a bigger budget. You need to position like you already belong at the top.'},
 {t:'pillar',pin:'Shift 02 · Systems',title:'Make the business run on process, so it stops running on you.',body:'Every task only you can do is a decision you have not yet turned into a system. We move the work out of your head and into repeatable process, so the machine keeps producing whether or not you are in the room that day.'},
 {t:'pillar',pin:'Shift 03 · Mindset',title:'Step into the CEO seat, and actually stay in it.',body:'The hardest promotion you will ever give yourself is from operator to owner. It is an identity shift before it is a calendar shift. When you lead as the CEO, you stop rescuing every fire and start building the thing that outlives the busywork.'},
 {t:'pillar',pin:'Shift 04 · Permission',title:'Design the business around the life, not the life around the business.',body:'You are allowed to want both. The whole point of building it your way is a business that funds a ridiculous and extraordinary life, on your own terms, without asking anyone for permission first. We design for that on purpose, not as a someday reward.'},
 {t:'dark',title:'You do not have to trade an extraordinary business for an extraordinary life. <em>You get to have it all.</em>'},

 {t:'section',idx:'Part Three',title:'The Extraordinary CEO, In Practice'},
 {t:'normal',k:'A week as the CEO',title:'Your time moves from doing the work to directing the business.',body:'Instead of a week swallowed by delivery and inbox, your hours go to the few decisions that actually move the company: the brand, the offers, the people, the vision. The delivery still happens. It just no longer needs all of you to happen.'},
 {t:'normal',k:'Why me',title:'I have done this from the scrappy side and the corporate side both.',cred:[['100s','of brands and businesses coached and consulted, worldwide'],['Puma · Supra · DC Shoes','brands I helped build and revive before coaching founders to do the same'],['Powerful Ladies','the podcast and community I built to put these conversations in one place']]},
 {t:'normal',k:'Start here',title:'You can take the first shift this week, before we ever talk.',body:'Pick the one task only you can do right now, and write down what it would take to hand it off. That single move is the difference between an operator having a busy week and a CEO building an asset. Everything in the method starts there.'},

 {t:'cta',title:'Ready to become the Extraordinary CEO of your business?',body:'If this is the year you stop being the bottleneck and start building a brand that runs on your terms, that is exactly the work I do with founders inside my coaching and masterminds. Come find me at karaduffy.com and let us map your next shift together.',chips:['karaduffy.com','The Powerful Ladies Podcast'],disc:'This masterclass is educational. It shares principles and frameworks, not promises. No specific income, revenue, or business result is guaranteed. Your outcomes depend on your market, your offer, and the work you put in.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let html='';
  if(s.k) html+='<div class="kicker">'+s.k+'</div>';
  if(s.idx) html+='<div class="idx">'+s.idx+'</div>';
  if(s.pin) html+='<div class="pin">'+s.pin+'</div>';
  if(s.title) html+='<h1>'+s.title+'</h1>';
  if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
  if(s.body) html+='<div class="body">'+s.body+'</div>';
  if(s.cred){html+='<div class="cred">';s.cred.forEach(c=>{html+='<div><b>'+c[0]+'</b>'+c[1]+'</div>';});html+='</div>';}
  if(s.chips){html+='<div class="chips">';s.chips.forEach(c=>{html+='<span class="chip">'+c+'</span>';});html+='</div>';}
  if(s.brand) html+='<div class="brandline">with <b>Kara Duffy</b> · Powerful Ladies</div>';
  if(s.mo==='title') html+='<svg class="mo-motif title-mo"><use href="#mo"/></svg>';
  else if(s.t==='normal'||s.t==='pillar') html+='<svg class="mo-motif corner-mo"><use href="#mo"/></svg>';
  if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});

let cur=0;const slides=[...document.querySelectorAll('.slide')];
const bar=document.getElementById('bar');const count=document.getElementById('count');
const hint=document.getElementById('hint');
function show(n){
  cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=String(cur+1).padStart(2,'0')+' / '+String(slides.length).padStart(2,'0');
  if(cur>0&&hint) hint.style.opacity='0';
}
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
show(0);
</script>
</body>
</html>
