<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Charge 500 Euro Without Blinking — Daniel Taman</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0F0E0C;
  --panel:#17150F;
  --rule:#2A2620;
  --accent:#C9A24B;
  --ink:#F4ECDD;
  --muted:#B6AE9C;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.deck{max-width:960px;margin:0 auto}
.slide{min-height:88vh;display:flex;flex-direction:column;justify-content:center;padding:84px 72px;border-bottom:1px solid var(--rule);position:relative}
.k{font-size:14px;font-weight:700;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
h1{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:84px;line-height:.98;letter-spacing:.005em;text-transform:uppercase}
h2{font-family:'Anton',Impact,sans-serif;font-weight:400;font-size:56px;line-height:1.02;letter-spacing:.01em;text-transform:uppercase}
.sub{font-size:26px;line-height:1.45;color:var(--muted);margin-top:30px;max-width:40ch}
.lead{font-size:30px;line-height:1.4;color:var(--ink);margin-top:28px;max-width:42ch;font-weight:500}
.accent{color:var(--accent)}
ul{list-style:none;margin-top:36px;display:flex;flex-direction:column;gap:20px}
li{font-size:25px;line-height:1.35;color:var(--ink);padding-left:44px;position:relative;max-width:44ch}
li::before{content:"";position:absolute;left:0;top:10px;width:20px;height:20px;border:2px solid var(--accent);border-radius:5px}
.steps{counter-reset:s;list-style:none;margin-top:34px;display:flex;flex-direction:column;gap:18px}
.steps li{padding-left:66px}
.steps li::before{content:counter(s);counter-increment:s;background:var(--accent);color:var(--bg);width:40px;height:40px;border-radius:9px;border:0;display:flex;align-items:center;justify-content:center;font-family:'Anton',sans-serif;font-size:24px;top:-2px}
.part{background:var(--panel)}
.part h2{font-size:72px}
.note{margin-top:40px;font-size:15px;color:var(--muted);letter-spacing:.02em;max-width:52ch;border-top:1px solid var(--rule);padding-top:20px}
.pg{position:absolute;right:72px;bottom:40px;font-size:13px;letter-spacing:.2em;color:var(--rule);text-transform:uppercase}
.brandfoot{position:absolute;left:72px;bottom:40px;font-size:13px;letter-spacing:.14em;color:var(--muted);text-transform:uppercase;font-weight:600}
@media(max-width:720px){
  .slide{padding:56px 30px;min-height:92vh}
  h1{font-size:52px}h2{font-size:38px}.part h2{font-size:46px}
  .sub,.lead{font-size:22px}li{font-size:21px}
}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'For personal trainers going online', h:'Charge <span class="accent">500 Euro</span> Without Blinking', s:'The high-ticket sales call that turns a follower into a premium online client.'},
  {t:'point', k:'The promise', h:'By the end of this hour', s:'You will know the exact conversation that turns a stranger who found you online into a 500 euro client, and why your price stops being the obstacle.'},
  {t:'who', k:'Who this is for', h:'This is for you if', items:['You already train people and get real results','You sell in the gym, or you have started online','You are tired of charging by the hour and want premium clients']},
  {t:'point', k:'The trap', h:'More followers did not fix it', s:'You post every week. The likes come. The paying clients do not. The problem was never the content. It is what happens after someone raises their hand.'},
  {t:'reframe', k:'The reframe', h:'People want to buy. They just do not want to be sold to.', s:'The trainer who apologizes when he says the price teaches the client to doubt it too. The sale is lost before the number is even said.'},
  {t:'part', k:'Part one', h:'Why you are stuck at a low price'},
  {t:'point', h:'You are selling hours, not outcomes', s:'500 lei for twelve sessions is a timesheet. 500 euro for a transformation is an outcome. Same work. A completely different conversation, and a completely different client.'},
  {t:'point', h:'The math nobody shows you', s:'Fifty clients at 500 lei is fifty conversations and fifty programs to write. Ten clients at 500 euro is ten. More income. Far less delivery. The premium price is the easier business to run.'},
  {t:'point', h:'You do not need a huge following', s:'Trainers have signed their first premium clients with under a thousand followers. A big audience is nice. A clear offer and a clean call is what actually pays.'},
  {t:'part', k:'Part two', h:'The 7-step sales call'},
  {t:'steps', k:'The method', h:'The call, step by step', items:['Connect before you pitch','Map where they are right now','Make the real problem conscious','Name what they have already tried','Show the life on the other side','Name the cost of waiting another year','Move calmly to the program']},
  {t:'point', h:'Step three is where the sale is made', s:'Most trainers rush to the plan. The client has to feel the real problem in their own words first. Do that, and the price stops being an argument.'},
  {t:'point', h:'Objections are just unfinished steps', s:'Too expensive, I need to think, let me ask my partner. Each one points back to a step you skipped. You do not overcome objections. You prevent them.'},
  {t:'point', h:'Hold the price with calm', s:'When you believe the outcome is worth it, you say the number and you stop talking. The silence is not awkward. It is the close.'},
  {t:'part', k:'Part three', h:'From hours to premium clients'},
  {t:'point', h:'One offer. One price. One call.', s:'Not a menu of packages. A single premium program with a clear outcome, a price you can say without flinching, and one conversation that enrolls the right people.'},
  {t:'point', h:'Two roads, one result', s:'No program yet? You leave with the offer, the price, and a launch plan. Already have clients and stuck? You leave with the scaling funnel and the high-ticket call that breaks you past the ceiling.'},
  {t:'point', h:'The plan for January', s:'Leave with the offer, the price, and the funnel ready to run. Your first premium online client in weeks, not someday.'},
  {t:'why', k:'Why me', h:'Why listen to me', items:['Natural competitor at Olympia Amateur Men’s Physique','Rebuilt from a broken pelvis and 22 kg lost','From 10,000 euro in debt to a business past 60,000 euro a month','Trainers I have scaled now make 5,000 to 20,000 euro a month, documented on YouTube']},
  {t:'cta', k:'Your move', h:'Ready to charge what it is worth?', s:'If you want to stop selling hours and start selling outcomes, book a free strategy call. We will map your offer, your price, and your first month together.', note:'This masterclass is educational only. Individual results vary and are not guaranteed. Building a coaching business takes work.'}
];

function esc(x){return x;}
const deck = document.getElementById('deck');
S.forEach((sl, i) => {
  const sec = document.createElement('section');
  sec.className = 'slide' + (sl.t === 'part' ? ' part' : '');
  let inner = '';
  if (sl.k) inner += '<div class="k">' + sl.k + '</div>';
  if (sl.t === 'title') {
    inner += '<h1>' + sl.h + '</h1>';
    if (sl.s) inner += '<div class="lead">' + sl.s + '</div>';
  } else if (sl.t === 'part') {
    inner += '<h2>' + sl.h + '</h2>';
  } else if (sl.t === 'steps') {
    inner += '<h2>' + sl.h + '</h2>';
    inner += '<ol class="steps">' + sl.items.map(x => '<li>' + x + '</li>').join('') + '</ol>';
  } else if (sl.t === 'who' || sl.t === 'why') {
    inner += '<h2>' + sl.h + '</h2>';
    inner += '<ul>' + sl.items.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  } else {
    inner += '<h2>' + sl.h + '</h2>';
    if (sl.s) inner += '<div class="sub">' + sl.s + '</div>';
  }
  if (sl.note) inner += '<div class="note">' + sl.note + '</div>';
  inner += '<div class="brandfoot">Daniel Taman &middot; Transformers</div>';
  inner += '<div class="pg">' + (i + 1) + ' / ' + S.length + '</div>';
  sec.innerHTML = inner;
  deck.appendChild(sec);
});
</script>
</body>
</html>
