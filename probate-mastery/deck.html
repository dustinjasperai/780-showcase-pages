<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Empathy-First Probate Conversation | Probate Mastery</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    /* derived from probatemastery.com (brand.json, site_scheme: light) */
    --bg:#f6f8fa; --panel:#ffffff; --rule:#dce3e8;
    --ink:#181818; --muted:#52666a; --dim:#6e8183;
    --accent:#0079bc; --gold:#f9a61e;
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{background:#e6ebef;font-family:'Inter',-apple-system,sans-serif;color:var(--ink);overflow:hidden}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e6ebef}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;padding:9vh 8.4% 9vh;display:none;flex-direction:column;justify-content:center}
  .slide.active{display:flex}
  .kicker{font-family:'Inter',sans-serif;font-size:1.02vw;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Anton',Impact,sans-serif;font-weight:400;color:var(--ink);line-height:1.06;letter-spacing:.005em;font-size:4.4vw;text-transform:none}
  .t-normal h1{font-size:3.5vw;max-width:88%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.48vw;color:var(--muted);margin-top:2.8vh;max-width:76%;line-height:1.55;font-weight:400}
  .sub{font-family:'Inter',sans-serif;font-size:1.75vw;color:var(--muted);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:400}
  /* section dividers */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.32vw;font-weight:700;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:5vw}
  .t-section .rule{width:15vw;height:4px;background:var(--gold);margin-top:3.4vh}
  /* dark reframe slides use their deep slate, still on-brand */
  .t-dark{background:#12232b;align-items:center;text-align:center}
  .t-dark h1{color:#ffffff;font-size:3.9vw;max-width:82%}
  .t-cta{background:#12232b;align-items:center;text-align:center}
  .t-cta h1{color:#ffffff;max-width:84%}
  .chips{display:flex;gap:1.4vw;margin-top:5vh;flex-wrap:wrap;justify-content:center}
  .chip{border:2px solid var(--gold);color:#ffe6bd;border-radius:100px;padding:1.3vh 1.8vw;font-size:1.22vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4vh;font-family:'Inter',sans-serif;font-size:.9vw;color:#9fb2b6;font-style:italic;text-align:center;line-height:1.4}
  .brandline{font-family:'Inter',sans-serif;font-size:1.28vw;color:var(--muted);margin-top:3.6vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:700}
  /* four-option card motif */
  .opts{display:grid;grid-template-columns:repeat(4,1fr);gap:1.4vw;margin-top:4vh}
  .opt{background:var(--panel);border:1px solid var(--rule);border-top:5px solid var(--accent);border-radius:6px;padding:2.6vh 1.4vw}
  .opt .n{font-family:'Anton',sans-serif;font-size:1.8vw;color:var(--gold)}
  .opt .ot{font-family:'Inter',sans-serif;font-weight:700;font-size:1.32vw;color:var(--ink);margin:1vh 0 .8vh}
  .opt .od{font-family:'Inter',sans-serif;font-size:1.02vw;color:var(--dim);line-height:1.4}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.06);z-index:20}
  .hud>i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Inter',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Inter',sans-serif;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Inter',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 01</div>
<div class="brand-foot">Probate Mastery</div>
<div class="hint" id="hint">Use arrow keys or click to advance</div>
<script>
const S = [
 {t:'title',title:'The Empathy-First Probate Conversation',sub:'How to turn one honest conversation with a grieving family into the listing they trust only you with.',brand:true},
 {t:'normal',k:'Who this is for',title:'You want probate business, not to feel like a vulture.',body:'You know probate is one of the largest, least-competitive niches in real estate. What stops most agents is the conversation itself: how to reach out to a family in the worst month of their life without sounding like everyone else circling the estate.'},
 {t:'dark',title:'Families in probate do not need another agent. They need someone who makes a hard decision simple.'},

 {t:'section',idx:'Part One',title:'Why Most Probate Outreach Fails'},
 {t:'normal',k:'The lead-list trap',title:'Everyone buys the same list and dials the same script.',body:'Most probate training sells you a list of fresh filings and a cold-call script. So the executor gets seven identical calls in a week, all asking the same thing: are you ready to sell the house. It is the fastest way to sound like part of the problem.'},
 {t:'normal',k:'The real cost',title:'A pushy first call closes the door for good.',body:'Lead with the property and the family shuts down, the attorney stops referring you, and the estate goes to whoever showed up as a human being. The house was never in short supply. Trust was.'},
 {t:'dark',title:'The house was never the problem. The conversation was.'},

 {t:'section',idx:'Part Two',title:'Transaction Engineering'},
 {t:'normal',k:'Read before you pitch',title:'Structure the deal around the family, not the commission.',body:'Transaction engineering means you understand the estate before you ever suggest a path: the timeline, the condition of the home, the debts against it, and what the heirs actually need. You come in as the advisor who sees the whole picture, not the agent who only sells one thing.'},
 {t:'opts',k:'Give a menu, not a pitch',title:'The four options every family deserves to hear.',opts:[
   {n:'01',ot:'Cash Offer',od:'Fast and certain when the family needs to be done and move on.'},
   {n:'02',ot:'As-Is Sale',od:'No repairs, no cleanout, when the estate has no time or money to fix.'},
   {n:'03',ot:'Retail Sale',od:'Maximize price when the home and the timeline can support it.'},
   {n:'04',ot:'Creative Financing',od:'Structured terms when tax, timing, or multiple heirs make a clean sale hard.'}
 ]},
 {t:'dark',title:'When you give the family options, you stop selling and start advising.'},

 {t:'section',idx:'Part Three',title:'The Conversation That Earns The Listing'},
 {t:'normal',k:'What to say and when',title:'Ask about the family first. The property comes later.',body:'The first conversation is about people, not square footage. When you lead with what the family is facing and let the opportunity reveal itself, you become the one person in their inbox who treated them like a person. That is who gets the call back.'},
 {t:'normal',k:'Earn attorney referrals',title:'The right conversations build a referral pipeline that repeats.',body:'Estate attorneys and fiduciaries send business to the agent who makes them look good to their clients. Handle the family with care and give real options, and the same attorney refers you the next estate, and the one after that. One relationship, years of deals.'},
 {t:'dark',title:'The agents families trust get the listing before it is ever listed.'},

 {t:'section',idx:'Part Four',title:'The Niche That Rewards Trust'},
 {t:'normal',k:'Why this works',title:'A proven method, not a theory.',body:'This is the same approach behind more than 847 million dollars closed by certified members and a community of over 5,000 agents and investors who work probate the empathy-first way. The niche is enormous, more than a million probate filings involving real estate open every year, and it rewards the professional who leads with trust.'},
 {t:'cta',title:'Ready to become the agent families trust in probate?',chips:['Start with the free Probate Mastery training','Get Certified Probate Expert certified'],disc:'Educational content for real estate professionals. No income, revenue, or transaction result is guaranteed. Results vary by agent, market, and effort.'}
];

const deck=document.getElementById('deck');
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.opts){ h+=`<div class="opts">`+s.opts.map(o=>`<div class="opt"><div class="n">${o.n}</div><div class="ot">${o.ot}</div><div class="od">${o.od}</div></div>`).join('')+`</div>`; }
    if(s.brand) h+=`<div class="brandline">Probate <b>Mastery</b> · Certified Probate Expert</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
