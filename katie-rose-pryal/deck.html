<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Neurodivergent Writer's Momentum Method</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#17263f;        /* deep navy ground, from her Navy newsletter brand */
    --panel:#20314f;     /* raised navy panel */
    --rule:#35507e;      /* hairline rule */
    --accent:#c08a3e;    /* muted brass accent */
    --paper:#f6f2e9;     /* warm paper, for light slides */
    --ink:#23222a;       /* ink on paper */
    --mist:#c8d2e4;      /* soft text on navy */
    --mute:#8ea0c0;      /* muted labels on navy */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:#0e1829;color:var(--mist);font-family:"Hanken Grotesk",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  .slide{display:none;width:min(1040px,92vw);height:min(620px,88vh);background:var(--bg);
    border:1px solid var(--rule);border-radius:14px;padding:64px 72px;position:relative;
    box-shadow:0 30px 80px rgba(0,0,0,.45);overflow:hidden}
  .slide.on{display:flex;flex-direction:column;justify-content:center}
  .slide.paper{background:var(--paper);color:var(--ink);border-color:#e4dcca}
  .kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:22px}
  .paper .kicker{color:#a9772f}
  h1{font-family:"Libre Baskerville",serif;font-weight:600;font-size:52px;line-height:1.05;color:#fff;letter-spacing:-.01em}
  .paper h1{color:var(--ink)}
  h2{font-family:"Libre Baskerville",serif;font-weight:600;font-size:38px;line-height:1.12;color:#fff;letter-spacing:-.01em}
  .paper h2{color:var(--ink)}
  .sub{font-family:"Libre Baskerville",serif;font-style:italic;font-size:24px;color:var(--mist);margin-top:20px;line-height:1.4;max-width:40ch}
  .paper .sub{color:#4a4740}
  p.body{font-size:20px;line-height:1.55;color:var(--mist);margin-top:18px;max-width:50ch}
  .paper p.body{color:#38352f}
  ul{margin-top:22px;list-style:none;display:flex;flex-direction:column;gap:16px;max-width:52ch}
  li{position:relative;padding-left:30px;font-size:20px;line-height:1.45;color:var(--mist)}
  .paper li{color:#38352f}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);
    transform:rotate(45deg);border-radius:2px}
  .lead{font-size:22px;color:var(--accent);font-weight:600;margin-bottom:8px}
  .big{font-family:"Libre Baskerville",serif;font-size:30px;line-height:1.3;color:#fff;max-width:44ch}
  .paper .big{color:var(--ink)}
  .name{font-size:18px;color:var(--mute);margin-top:26px}
  .foot{position:absolute;left:72px;bottom:28px;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--mute)}
  .paper .foot{color:#b0a58f}
  .pillar{font-family:"Libre Baskerville",serif;font-size:15px;color:var(--accent);letter-spacing:.14em;text-transform:uppercase;margin-bottom:6px}
  .disc{font-size:14px;color:var(--mute);margin-top:26px;max-width:56ch;line-height:1.5}
  .nav{position:fixed;bottom:18px;right:24px;font-size:12px;color:#5f6f8c;letter-spacing:.1em}
  .mosaic{position:absolute;right:48px;top:48px;display:grid;grid-template-columns:repeat(3,14px);
    grid-auto-rows:14px;gap:5px;opacity:.5}
  .mosaic i{background:var(--accent);border-radius:2px;transform:rotate(45deg);display:block}
  .mosaic i:nth-child(3n){background:var(--rule)}
  .mosaic i:nth-child(4n){background:#6f86b2}
</style>
</head>
<body>
<div id="stage"></div>
<div class="nav"><span id="pos"></span> &nbsp;&larr; &rarr;</div>
<script>
const S=[
  {t:'title',k:'A live masterclass with Katie Rose Pryal',h:'The Neurodivergent Writer’s Momentum Method',sub:'How to finish the book by working with your brain, not against it.'},
  {t:'promise',k:'What you will leave with',big:'A writing plan built for your actual brain, the three reasons neurodivergent writers stall, and a way to build momentum that does not run on willpower.'},
  {t:'who',k:'Who this is for',h:'You have a book in you',bullets:['Writers with ADHD, autism, anxiety, depression, or a bipolar brain','Novelists, memoirists, essayists, and academics','People with half-finished drafts and a folder full of starts','Anyone who has been told to just build a routine, and watched it fall apart']},
  {t:'trap',k:'The trap',h:'It is not that you cannot write',body:'You can write. You have written. What happens is the thread slips, the draft stalls at the messy middle, and the shame about the gap grows louder than the idea ever was. So the file stays closed.'},
  {t:'reframe',k:'The reframe',big:'The problem was never your discipline. It is that almost every piece of writing advice was built for a brain unlike yours.'},
  {t:'part',k:'Part one',h:'Why the usual advice backfires',sub:'Write every day. Same time, same chair. Push through.'},
  {t:'problem',k:'Part one',h:'One size fits one brain',body:'Fixed routines and raw willpower assume a brain that regulates attention and energy on a schedule. A neurodivergent brain does not. So when the routine breaks, you read it as failure, and failure is the thing that keeps the document closed.'},
  {t:'problem2',k:'Part one',h:'Momentum beats motivation',body:'Motivation is weather. Momentum is a system. The goal is not to feel like writing every day. It is to make the next small step so clear and so supported that starting is easier than avoiding.'},
  {t:'part',k:'Part two',h:'The Momentum Method',sub:'A neurodiversity-affirming way to move a book from stuck to done.'},
  {t:'pillar',p:'Pillar one',h:'Getting started',body:'From a blank page or a tangled draft to a plan you can actually see. We figure out what book you are really writing, get the ideas under control, and shape a first real map of it.'},
  {t:'pillar',p:'Pillar two',h:'Staying on track and getting unstuck',body:'Pep talks, hard deadlines, and encouragement matched to how your brain works. A writing schedule you can keep, and proven strategies for the moment you hit a wall, because you will, and that is normal.'},
  {t:'pillar',p:'Pillar three',h:'Publishing',body:'When the draft is ready to meet the world: agent and publisher paths, query letters and proposals, or a clear route to self-publishing. The part most writers never get taught.'},
  {t:'engine',k:'The engine',h:'The momentum cycle',body:'Sometimes meetings alone are not enough. So the method adds reading and feedback as you go: plan, then roughly five thousand words at a time, I read and give developmental feedback on structure and story, you revise, we plan the next stretch. Repeat until the book is done.'},
  {t:'affirm',k:'The principle',big:'Neurodivergence is strengths and struggles, not deficits. We build the plan around the strengths and put scaffolding under the struggles.',paper:true},
  {t:'good',k:'The philosophy',h:'Good enough beats perfect',body:'Perfectionism is the quiet engine of the closed file. A finished, shared, beautifully complicated book does more in the world than a flawless one that never leaves your drive. Done is the standard that lets neurodivergent writers actually publish.',paper:true},
  {t:'part',k:'Part three',h:'When momentum takes over',sub:'Not a tidy new you. A finished manuscript, and a brain you finally trust to write.'},
  {t:'result',k:'Part three',h:'By the end',bullets:['A revision well on its way to finished, not just a first draft','Real skill in structure, storytelling, and revising','A writing practice that survives a bad week','A next step for publishing that fits your book']},
  {t:'why',k:'Why me',h:'I have been where you are',body:'I am a bipolar-AuDHD author of more than fifteen books, a Pushcart nominee, and a faculty member in the Drexel University MFA program. I spent years as a professor of disability studies thinking about how different minds make meaning on the page. I know what stuck feels like, and what it feels like when the book finally comes together.',name:'Katie Rose Guest Pryal, J.D., Ph.D.'},
  {t:'step',k:'The first step',big:'Bring me the project you keep not finishing. We will build the first real plan for it together.'},
  {t:'cta',k:'Your next step',h:'Book a discovery session',body:'A relaxed conversation about your book, your brain, and whether the Momentum Method is the right fit. All writers welcome.',disc:'This masterclass is educational. No specific writing, publishing, or income result is guaranteed. Results vary from writer to writer.'}
];
const stage=document.getElementById('stage');
stage.innerHTML=S.map((s,i)=>{
  const paper=s.paper?' paper':'';
  const mos='<div class="mosaic">'+Array.from({length:9}).map(()=>'<i></i>').join('')+'</div>';
  let inner='';
  if(s.k) inner+='<div class="kicker">'+s.k+'</div>';
  if(s.p) inner+='<div class="pillar">'+s.p+'</div>';
  if(s.h) inner+=(s.t==='title'?'<h1>':'<h2>')+s.h+(s.t==='title'?'</h1>':'</h2>');
  if(s.sub) inner+='<div class="sub">'+s.sub+'</div>';
  if(s.big) inner+='<div class="big">'+s.big+'</div>';
  if(s.body) inner+='<p class="body">'+s.body+'</p>';
  if(s.bullets) inner+='<ul>'+s.bullets.map(b=>'<li>'+b+'</li>').join('')+'</ul>';
  if(s.name) inner+='<div class="name">'+s.name+'</div>';
  if(s.disc) inner+='<div class="disc">'+s.disc+'</div>';
  inner+='<div class="foot">The Momentum Method &middot; Katie Rose Pryal</div>';
  return '<section class="slide'+paper+(i===0?' on':'')+'" data-i="'+i+'">'+(s.t==='title'||s.t==='part'?mos:'')+inner+'</section>';
}).join('');
let cur=0;const slides=[...document.querySelectorAll('.slide')];const pos=document.getElementById('pos');
function show(n){cur=Math.max(0,Math.min(slides.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));pos.textContent=(cur+1)+' / '+slides.length}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')show(cur+1);if(e.key==='ArrowLeft')show(cur-1)});
stage.addEventListener('click',()=>show(cur+1));
show(0);
</script>
</body>
</html>
