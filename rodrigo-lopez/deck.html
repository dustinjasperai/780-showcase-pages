<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lonely Chair: a live masterclass from The Grand</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,400;0,600;0,700;1,400&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e4; --panel:#ffffff; --ink:#264c51; --ink-soft:#3f6166;
    --accent:#c77700; --rule:#d9d0bb; --muted:#6b726b;
    --head:'Bitter',Georgia,serif; --body:'Open Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .wrap{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 28px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(38,76,81,.04)}
  .slide.dark{background:var(--ink);color:#f6f1e4;border-color:var(--ink)}
  .slide.dark .kick,.slide.dark .num{color:#d9b27a}
  .slide.title{min-height:520px;background:var(--ink);color:#f6f1e4;border-color:var(--ink)}
  .slide.title .kick{color:#d9b27a}
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.04;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;margin-bottom:18px}
  .sub{font-size:22px;color:var(--ink-soft);max-width:30ch}
  .slide.title .sub{color:#cfe0df;max-width:34ch}
  p.lead{font-size:20px;color:var(--ink-soft);max-width:60ch;margin-bottom:14px}
  p.body{font-size:18px;color:var(--ink-soft);max-width:62ch;margin-bottom:12px}
  ul{list-style:none;margin-top:10px}
  li{font-size:19px;color:var(--ink-soft);padding-left:28px;position:relative;margin-bottom:14px;max-width:60ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;
    border:2px solid var(--accent)}
  li.on:before{background:var(--accent)}
  .big{font-family:var(--head);font-size:40px;line-height:1.12;max-width:24ch;font-weight:600}
  .big .a{color:var(--accent)}
  .num{font-family:var(--head);font-size:16px;color:var(--muted);margin-bottom:12px;font-weight:600}
  .quote{font-family:var(--head);font-size:30px;line-height:1.28;font-style:italic;max-width:30ch}
  .cite{margin-top:22px;font-size:15px;letter-spacing:.04em;color:var(--muted);font-weight:600}
  .pillars{display:grid;gap:16px;margin-top:8px}
  .pill{border-left:3px solid var(--accent);padding:4px 0 4px 18px}
  .pill b{font-family:var(--head);font-size:21px;display:block;color:var(--ink);margin-bottom:4px}
  .pill span{font-size:16px;color:var(--ink-soft)}
  .disc{font-size:14px;color:var(--muted);max-width:64ch;margin-top:22px;line-height:1.5}
  .foot{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:30px}
  .cta-line{font-size:22px;color:var(--ink-soft);margin-top:10px;max-width:40ch}
  @media(max-width:640px){.slide{padding:36px 26px;min-height:340px}h1{font-size:40px}h2{font-size:30px}.big{font-size:30px}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S = [
  {t:'title', cls:'title', kick:'A live masterclass from The Grand',
   h:'The Lonely Chair',
   sub:'Why the best founders and executives stop trying to lead alone.'},

  {t:'list', kick:'Who this is for', h:'If you are the one everyone looks to',
   lead:'This hour is for founders and executives who carry the final call, and have fewer and fewer people they can be fully honest with.',
   list:['Founders who feel the weight of every decision land on them',
         'Executives who have grown past the people they used to think out loud with',
         'Leaders who look most certain in the exact moments they feel least sure']},

  {t:'big', cls:'dark', kick:'The trap',
   big:'The higher you climb, the fewer rooms are left where you can say <span class="a">"I don\'t know."</span>'},

  {t:'reframe', kick:'A reframe', h:'It is not a strategy problem',
   lead:'Most leaders think they need a better framework, a smarter plan, another book. The real gap is quieter.',
   body:'You do not have a strategy problem. You have a no-one-to-think-with problem. And no plan survives being decided in a vacuum.'},

  {t:'part', cls:'dark', num:'Part One', h:'The isolation tax',
   lead:'The cost of leading alone, and why it hides in plain sight.'},

  {t:'list', kick:'The symptoms', h:'What leading alone actually costs',
   list:['You decide in a vacuum, then hope you read the room right',
         'You perform certainty you do not feel, which is exhausting',
         'Your team and your board both want something from you, so neither is a safe place to be unsure',
         'Small doubts compound because there is nowhere to set them down']},

  {t:'reframe', kick:'The twist', h:'More effort makes it worse',
   lead:'The instinct is to grind harder and look stronger. That is exactly the move that deepens the isolation.',
   body:'The stronger you appear, the less anyone offers to help, and the more alone the chair becomes. Willpower cannot fix a problem that is structural.'},

  {t:'part', cls:'dark', num:'Part Two', h:'Community as the coach',
   lead:'The Grand\'s answer: a curated council of peers who get it, and a coach who stays.'},

  {t:'pillars', kick:'What we believe', h:'Three beliefs the council runs on',
   pillars:[
     {b:'Emotional Intelligence &gt; Artificial Intelligence', s:'As AI takes the technical work, self-aware, empathetic leadership becomes the edge that compounds. We train the human skills, not the output.'},
     {b:'Community Wisdom &gt; Individualism', s:'You learn more from a room of honest perspectives than from any one expert, including yourself.'},
     {b:'Intentional Gathering &gt; Blind Schmoozing', s:'We gather to ask open questions and listen deeply, not to trade business cards. Connection is a leadership practice.'}]},

  {t:'list', kick:'The method', h:'What a Grand council actually is',
   lead:'Not a course. Not solo coaching. A room that stays.',
   list:['6 to 8 peers, matched to your professional and life stage',
         'One executive coach who facilitates, and stays with you all year',
         'A live 90-minute session every month, same room, same faces',
         'Two private 1:1 deep dives when a specific decision needs them']},

  {t:'list', kick:'Inside a session', h:'How ninety minutes actually moves you',
   list:['From Vision to Action: reconnect with the point of it, commit to one brave next step',
         'Who Am I Becoming as a Leader: find yourself again under the role',
         'Designing a Path That Works: test one small experiment, not a full overhaul',
         'Honest, never surface-level, with people who have no agenda for your answer']},

  {t:'part', cls:'dark', num:'Part Three', h:'What changes',
   lead:'What a year in a council does to how you lead.'},

  {t:'list', kick:'The outcome', h:'You stop carrying it alone',
   list:['Decisions you actually trust, because they were pressure-tested by peers',
         'A standing room to be unsure out loud, so certainty is a choice again',
         'Relationships with leaders at your level who understand the real stakes',
         'A clearer sense of who you are becoming, not just what you are shipping']},

  {t:'quote', cls:'dark', kick:'Why this matters',
   quote:'Everyone deserves a coach. Workforces are happier and sharper when people do this kind of development as early as possible.',
   cite:'The belief The Grand was built on'},

  {t:'reframe', kick:'Why The Grand', h:'Trusted where the stakes are highest',
   lead:'The Grand supports leaders at more than 100 innovative companies, early-stage investors, and changemaking organizations.',
   body:'Each council is led by an executive coach who has worked with leaders at every level. The product is the room, and the room is curated with care.'},

  {t:'big', kick:'In one line',
   big:'You were never supposed to do this <span class="a">alone.</span>'},

  {t:'cta', cls:'dark', kick:'Your next step', h:'Join a Grand council',
   ctaLine:'If this is the room you have been missing, start an application to be matched into a council of peers at your level.',
   foot:'The Grand · thegrand.world',
   disc:'This masterclass is educational. No income, role, or business result is guaranteed. Results vary and depend on your own circumstances, effort, and decisions.'}
];

function render(s){
  const cls = 'slide' + (s.cls ? ' '+s.cls : '');
  let inner = '';
  if(s.kick) inner += '<div class="kick">'+s.kick+'</div>';
  if(s.num) inner += '<div class="num">'+s.num+'</div>';
  if(s.h) inner += (s.t==='title' ? '<h1>'+s.h+'</h1>' : '<h2>'+s.h+'</h2>');
  if(s.sub) inner += '<div class="sub">'+s.sub+'</div>';
  if(s.lead) inner += '<p class="lead">'+s.lead+'</p>';
  if(s.body) inner += '<p class="body">'+s.body+'</p>';
  if(s.big) inner += '<div class="big">'+s.big+'</div>';
  if(s.quote) inner += '<div class="quote">&ldquo;'+s.quote+'&rdquo;</div>';
  if(s.cite) inner += '<div class="cite">'+s.cite+'</div>';
  if(s.list){ inner += '<ul>'; s.list.forEach(function(li){ inner += '<li>'+li+'</li>'; }); inner += '</ul>'; }
  if(s.pillars){ inner += '<div class="pillars">'; s.pillars.forEach(function(p){ inner += '<div class="pill"><b>'+p.b+'</b><span>'+p.s+'</span></div>'; }); inner += '</div>'; }
  if(s.ctaLine) inner += '<div class="cta-line">'+s.ctaLine+'</div>';
  if(s.foot) inner += '<div class="foot">'+s.foot+'</div>';
  if(s.disc) inner += '<div class="disc">'+s.disc+'</div>';
  return '<section class="'+cls+'">'+inner+'</section>';
}
document.getElementById('app').innerHTML = S.map(render).join('');
</script>
</body>
</html>
