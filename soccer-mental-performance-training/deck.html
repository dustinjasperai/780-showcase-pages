<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Mental Game Behind Every Confident Young Player</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0b0b0e;
  --panel:#16161d;
  --rule:#2a2a33;
  --accent:#ff0000;
  --ink:#f4f4f6;
  --muted:#9aa0ad;
  --display:'Barlow Condensed',sans-serif;
  --body:'Work Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
#deck{height:100vh;width:100vw;overflow:hidden;position:relative}
.slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;
  padding:8vh 9vw;opacity:0;transition:opacity .35s ease}
.slide.on{display:flex;opacity:1}
.slide::before{content:'';position:absolute;left:9vw;right:9vw;bottom:6.2vh;height:2px;
  background:linear-gradient(90deg,var(--accent) 0 22%,var(--rule) 22% 100%)}
.kicker{font-family:var(--display);font-weight:600;letter-spacing:.26em;text-transform:uppercase;
  color:var(--accent);font-size:clamp(14px,1.5vw,20px);margin-bottom:22px}
h1{font-family:var(--display);font-weight:700;line-height:1.02;letter-spacing:.01em;
  font-size:clamp(40px,7vw,104px);text-transform:uppercase}
h2{font-family:var(--display);font-weight:700;line-height:1.05;letter-spacing:.01em;
  font-size:clamp(32px,5vw,74px);text-transform:uppercase}
.accent{color:var(--accent)}
.sub{font-size:clamp(18px,2vw,30px);line-height:1.5;color:var(--muted);margin-top:26px;max-width:60ch}
.lead{font-size:clamp(22px,2.6vw,40px);line-height:1.35;margin-top:22px;max-width:48ch}
.panel{background:var(--panel);border:1px solid var(--rule);border-radius:16px;padding:30px 34px;margin-top:24px}
ul{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:16px;max-width:70ch}
li{font-size:clamp(17px,1.9vw,26px);line-height:1.4;padding-left:34px;position:relative;color:var(--ink)}
li::before{content:'';position:absolute;left:0;top:.55em;width:16px;height:3px;background:var(--accent);border-radius:2px}
.big{font-family:var(--display);font-weight:700;font-size:clamp(90px,14vw,200px);line-height:.9;color:var(--accent)}
.note{font-size:clamp(12px,1.2vw,15px);color:var(--muted);margin-top:30px;max-width:66ch;line-height:1.5}
.nav{position:fixed;bottom:18px;right:26px;font-family:var(--display);letter-spacing:.14em;
  color:var(--muted);font-size:14px;z-index:5}
.brandmark{position:fixed;top:22px;left:9vw;font-family:var(--display);font-weight:700;
  letter-spacing:.2em;text-transform:uppercase;color:var(--ink);font-size:16px;z-index:5}
.brandmark .accent{color:var(--accent)}
</style>
</head>
<body>
<div class="brandmark">Soccer <span class="accent">Resilience</span></div>
<div id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title', k:'A live masterclass for soccer families',
   h:'The Mental Game Behind Every <span class="accent">Confident</span> Young Player',
   s:'The three moments that quietly decide a match, and the system that trains a player to own them.'},

  {t:'who', k:'Who this is for',
   h:'Parents of players who <span class="accent">care</span>',
   body:['Soccer parents whose player has real ability but shrinks in big moments',
         'Competitive youth and high-school players chasing the next level',
         'Families tired of watching nerves and frustration undo a week of training']},

  {t:'trap', k:'The Talent Trap',
   h:'Talent gets them <span class="accent">seen</span>. It does not keep them there.',
   s:'Every serious player you meet is technically good. By the next level, the gap is almost never the feet. It is what happens between the ears when the pressure is on.'},

  {t:'reframe', k:'The real opponent',
   h:'Your player’s biggest opponent <span class="accent">is not</span> on the other team',
   s:'It is the 60 seconds after a mistake. The knot in the stomach before kickoff. The frustration that pulls them out of the game before halftime. Nobody taught them to handle it, so it handles them.'},

  {t:'part', k:'Part One', h:'The three moments that <span class="accent">decide</span> the match'},

  {t:'pillar', k:'Moment one', h:'Pressure before kickoff',
   body:['The nerves that turn a confident player tentative in the first ten minutes',
         'Why "just relax" never works, and what a pre-game reset actually looks like',
         'A simple routine that puts a player in the right state before the whistle']},

  {t:'pillar', k:'Moment two', h:'Recovery after a mistake',
   body:['One error becomes two becomes a lost game, this is the confidence spiral',
         'The 60-second reset that stops the spiral before it starts',
         'How to play the next ball instead of the last one']},

  {t:'pillar', k:'Moment three', h:'Frustration under fire',
   body:['Bad calls, a physical opponent, a coach’s shout, the triggers that hijack a game',
         'Keeping composure so decisions stay sharp when it gets heated',
         'Turning frustration into focus instead of a yellow card']},

  {t:'part', k:'Part Two', h:'The system: the <span class="accent">Player Training Pathway</span>'},

  {t:'step', k:'Step one', h:'Foundations',
   s:'Core mental resilience. The shared language and the base tools every player starts with, in 5 to 10 minutes a day.'},

  {t:'step', k:'Step two', h:'Essentials',
   s:'Mental preparation. Building the pre-game and in-game routines that make composure a habit, not a hope.'},

  {t:'step', k:'Step three', h:'Premier',
   s:'Mental recovery. Deepening the reset so setbacks, slumps and tough stretches stop defining a season.'},

  {t:'step', k:'Step four', h:'Elite',
   s:'Performing under the lights. The composure that separates players who rise in the biggest moments from players who disappear.'},

  {t:'pillar', k:'The multiplier', h:'One shared <span class="accent">language</span>',
   body:['Parent Foundations trains the sideline, so the car ride home helps instead of hurts',
         'Player, parent and coach all speaking the same mental-performance language',
         'The whole environment pulling the same direction, not just the player alone']},

  {t:'part', k:'Part Three', h:'Inside the training, and <span class="accent">who</span> delivers it'},

  {t:'why', k:'Built by an expert, delivered by pros', h:'Credibility on <span class="accent">both</span> sides',
   body:['A curriculum built by Dr. Brad Miller, a sports psychologist with 25 plus years',
         'Delivered by professional MLS, NWSL and USL players who have lived these moments',
         'Ambassadors like John O’Brien, a former U.S. Men’s National Team and World Cup player']},

  {t:'how', k:'How it runs', h:'Simple enough to <span class="accent">actually</span> stick',
   body:['Short daily sessions in the Academy app, 5 to 10 minutes, not another time sink',
         'Tools tied to real moments in real games, reinforced by pros',
         'A clear pathway so a player always knows the next step']},

  {t:'recap', k:'What you leave with', h:'The <span class="accent">whole</span> picture',
   body:['The three moments that decide matches, and a tool for each',
         'A four-step pathway from Foundations to Elite',
         'A shared language for your player, your family and your team']},

  {t:'cta', k:'Start here', h:'Give your player the <span class="accent">mental edge</span>',
   s:'Begin with Player Foundations, or book a one-on-one session with a Soccer Resilience ambassador and start training the mental game today.',
   note:'This masterclass is educational. No specific result, ranking, scholarship or outcome is guaranteed. Results vary by player, effort and circumstance.'}
];

const deck = document.getElementById('deck');
S.forEach((sl, i) => {
  const d = document.createElement('section');
  d.className = 'slide' + (i === 0 ? ' on' : '');
  let html = '';
  if (sl.k) html += '<div class="kicker">' + sl.k + '</div>';
  if (sl.h) html += (sl.t === 'title' ? '<h1>' + sl.h + '</h1>' : '<h2>' + sl.h + '</h2>');
  if (sl.s) html += '<div class="' + (sl.t === 'title' ? 'sub' : 'lead') + '">' + sl.s + '</div>';
  if (sl.body) html += '<ul>' + sl.body.map(x => '<li>' + x + '</li>').join('') + '</ul>';
  if (sl.note) html += '<div class="note">' + sl.note + '</div>';
  d.innerHTML = html;
  deck.appendChild(d);
});

let cur = 0;
const slides = [...document.querySelectorAll('.slide')];
const nav = document.getElementById('nav');
function show(n){
  cur = Math.max(0, Math.min(slides.length - 1, n));
  slides.forEach((s, i) => s.classList.toggle('on', i === cur));
  nav.textContent = (cur + 1) + ' / ' + slides.length;
}
show(0);
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === ' ') show(cur + 1);
  if (e.key === 'ArrowLeft') show(cur - 1);
});
document.getElementById('deck').addEventListener('click', () => show(cur + 1));
</script>
</body>
</html>
