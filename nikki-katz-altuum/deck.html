<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Four Pillars Running Without You · Nikki Katz</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@600;700;800&family=Roboto&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FBF7EC; --panel:#fff5d9; --rule:#c9c2ab;
    --ink:#182241; --accent:#3d5361; --grey:#4b5468; --dim:#8b8a7c;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Roboto',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--accent);margin-bottom:2.4vh}
  h1{font-family:'Bitter',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.16;letter-spacing:-.005em}
  .t-title h1{font-size:3.5vw;max-width:88%}
  .t-normal h1{font-size:2.55vw;max-width:84%}
  .t-normal .body{font-family:'Roboto',sans-serif;font-size:1.35vw;color:var(--grey);margin-top:2.6vh;max-width:76%;line-height:1.58;font-weight:400}
  .sub{font-family:'Roboto',sans-serif;font-size:1.55vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.5;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Roboto',sans-serif;font-size:1.3vw;font-weight:600;color:var(--accent);margin-bottom:2vh;letter-spacing:.16em;text-transform:uppercase}
  .t-section h1{font-size:3.7vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:var(--accent);margin-top:3.4vh}
  .t-dark{background:var(--panel);align-items:center;text-align:center}
  .t-dark h1{font-size:2.65vw;max-width:80%;color:var(--ink)}
  .t-cta{background:var(--panel);align-items:center;text-align:center}
  .t-cta h1{font-size:2.9vw;max-width:80%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--accent);color:var(--ink);border-radius:4px;padding:1.3vh 1.6vw;font-size:1.1vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.84vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .grid-motif{position:absolute;pointer-events:none;opacity:.85}
  .title-grid{right:6%;bottom:8%;width:11vw}
  .corner-grid{right:6%;bottom:7%;width:5vw;opacity:.55}
  .brandline{font-family:'Roboto',sans-serif;font-size:1.18vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(0,0,0,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500;font-family:'Roboto',sans-serif}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600;font-family:'Roboto',sans-serif}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s;font-family:'Roboto',sans-serif}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.4vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:6vw}.t-dark h1{font-size:5vw}
    .t-cta h1{font-size:5.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 16</div>
<div class="brand-foot">Altuum Consulting</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- grid motif: a 4-quadrant mark echoing the four pillars, a systems binder rather than a generic growth arrow -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="grid4" viewBox="0 0 200 200">
  <g fill="none" stroke="#3d5361" stroke-width="3">
    <rect x="14" y="14" width="78" height="78" rx="4"/>
    <rect x="108" y="14" width="78" height="78" rx="4"/>
    <rect x="14" y="108" width="78" height="78" rx="4"/>
    <rect x="108" y="108" width="78" height="78" rx="4"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Four Pillars Running Without You',sub:'A masterclass for climbing gym owners on systemizing the operations of an already-open gym, built from operating and fixing climbing gyms from the inside.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'Right now, you are the operating system. If you left for a month, would your gym still run the same way?',body:'Most climbing gyms run on whatever is in the founder\'s head. That works fine day to day, until the founder is sick, on vacation, or trying to open a second location, and the whole operation slows down because nothing was ever written down.'},
 {t:'dark',title:'A gym that only runs well when you\'re there is not a system. It is you.'},

 {t:'section',idx:'Part One',title:'Gym Operations Systemization'},
 {t:'normal',k:'Turning what\'s in your head into a documented process',title:'A system is something someone else can run without asking you first.',body:'Systemization means the day-to-day decisions, opening procedures, member questions, scheduling calls, get answered by a documented process instead of a phone call to the owner. It is the pillar the other three sit on top of.'},
 {t:'normal',k:'Staff Training & Development',title:'A system nobody\'s trained on isn\'t a system yet, it\'s a document.',body:'Writing the process down is half the job. The other half is training staff to actually run it consistently, with refreshers built in so the system survives staff turnover instead of leaving with whoever wrote it.'},
 {t:'dark',title:'Documentation without training is just a binder on a shelf.'},

 {t:'section',idx:'Part Two',title:'Route Setting and Retention'},
 {t:'normal',k:'Route Setting Logistics & Strategy',title:'The setting calendar is a scheduling problem before it is a technical one.',body:'Route setting usually gets treated as a technical skill only. Labor hours, setting cadence, and how fresh the walls feel to members are operational and scheduling decisions, and they affect member experience just as much as the actual routes do.'},
 {t:'normal',k:'Membership Engagement & Retention',title:'Systemized operations mean nothing if members don\'t stick around to experience them.',body:'The fourth pillar closes the loop, engagement and retention treated as their own systemized discipline, not left to whichever staff member happens to be friendly that day.'},
 {t:'dark',title:'Four pillars, one connected system, not four departments pulling apart.'},

 {t:'section',idx:'Part Three',title:'Where This Comes From'},
 {t:'normal',k:'Why Nikki Katz',title:'She has worked inside climbing gym operations herself, not just consulted from the outside.',body:'Altuum Consulting comes from hands-on climbing gym management experience, paired with a systems-based, sustainability-and-policy planning background. The pillars above are the same operational areas she has worked inside directly.'},

 {t:'section',idx:'Your Next Step',title:'Systemize Your Gym'},
 {t:'normal',k:'How it works',title:'Start with an audit, then build the system for your own gym.',body:'A Basecamp audit identifies the inefficiencies first. From there, engagements range from an Ascent implementation project through to an ongoing Summit retainer built around your gym specifically.'},
 {t:'cta',title:'Ready to stop being the operating system?',chips:['Start with a Basecamp audit'],disc:'Educational content for climbing gym owners. No income, growth, or business result is guaranteed. Results vary by gym, market, and effort.'},
];

const deck=document.getElementById('deck');
function gridSvg(kind){return `<svg class="grid-motif ${kind==='title'?'title-grid':'corner-grid'}"><use href="#grid4"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Altuum <b>Consulting</b> &middot; Nikki Katz</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=gridSvg(s.arc);
  else if(s.t==='title') h+=gridSvg('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
