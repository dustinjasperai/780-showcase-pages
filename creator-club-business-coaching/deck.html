<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Build a Business World They Search For By Name — A Masterclass with John Marsh</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Bitter:ital,wght@0,400;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#171210; --panel:#221a16; --rule:#3a2e27;
    --ink:#f3e9df; --muted:#b4a496;
    --accent:#d79a46; --accent-soft:#8c6a36;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:"Bitter",Georgia,serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:linear-gradient(180deg,#1b1511 0%,var(--panel) 100%);
    border:1px solid var(--rule); border-radius:14px;
    padding:54px 56px; margin:0 0 22px; min-height:520px;
    display:flex; flex-direction:column; justify-content:center;
    position:relative; overflow:hidden;
  }
  .slide::after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:1px solid var(--accent-soft);border-radius:50%;opacity:.25}
  .slide::before{content:"";position:absolute;right:10px;bottom:20px;width:120px;height:120px;border:1px solid var(--accent-soft);border-radius:50%;opacity:.18}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:18px;font-weight:700}
  h1{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:52px;line-height:1.05;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:"DM Serif Display",Georgia,serif;font-weight:400;font-size:38px;line-height:1.1;margin-bottom:18px}
  .lead{font-size:21px;line-height:1.5;color:var(--ink);max-width:40ch}
  .sub{font-size:19px;line-height:1.55;color:var(--muted);max-width:46ch}
  ul{list-style:none;margin-top:14px}
  li{font-size:19px;line-height:1.5;padding:9px 0 9px 30px;position:relative;color:var(--ink);max-width:48ch}
  li::before{content:"";position:absolute;left:0;top:18px;width:11px;height:11px;border:2px solid var(--accent);border-radius:50%}
  li.x::before{content:"";border:0;left:2px;top:12px;width:14px;height:2px;background:var(--muted);transform:rotate(0)}
  .big{font-family:"DM Serif Display",Georgia,serif;font-size:40px;line-height:1.12;max-width:22ch}
  .num{font-family:"DM Serif Display",Georgia,serif;font-size:20px;color:var(--accent);margin-bottom:8px}
  .pill{display:inline-block;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:5px 13px;border-radius:999px;font-weight:700;margin-bottom:20px;width:max-content}
  .foot{position:absolute;left:56px;bottom:22px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
  .pagenum{position:absolute;right:26px;bottom:22px;font-size:12px;color:var(--muted);z-index:2}
  .quote{font-family:"DM Serif Display",Georgia,serif;font-style:italic;font-size:30px;line-height:1.25;max-width:26ch}
  .by{margin-top:18px;font-size:16px;color:var(--muted)}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:52ch}
  .cta-row{margin-top:20px;font-size:21px;color:var(--accent);font-weight:600}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:440px}h1{font-size:34px}h2{font-size:27px}.big{font-size:28px}.foot{left:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const COACH = "John Marsh", BRAND = "Creator Club";
const S = [
  {t:'title', h:`<div class="pill">A Story Driven Marketing Masterclass</div>
    <h1>Build a Business World<br>They Search For By Name</h1>
    <p class="sub">How coaches and service-business owners grow by building a world people want to belong to, instead of chasing the next funnel.</p>
    <p class="by">With John Marsh and Ruby Marsh &middot; Creator Club</p>`},
  {t:'for', h:`<div class="kicker">Who this is for</div>
    <h2>You love the work. The marketing is the part that won't click.</h2>
    <ul>
      <li>You're a coach, or you run a real service business, and you're genuinely good at it.</li>
      <li>You know you have a story to tell, but you can't figure out how to stand out in the noise.</li>
      <li>You're tired of chasing tactics that worked for someone else and fizzle for you.</li>
    </ul>`},
  {t:'trap', h:`<div class="kicker">The trap</div>
    <p class="big">Frankly, it's harder than it used to be. What good marketing looks like has changed, and nobody updated the map.</p>
    <p class="sub" style="margin-top:22px">You can't just build a 'funnel' and expect a bunch of leads any more. We're past that. You know it. Your audience knows it.</p>`},
  {t:'hook', h:`<div class="kicker">The reframe</div>
    <p class="quote">Most of us were sold a hoax on what marketing really is. Like finding out Santa ain't real.</p>
    <p class="sub" style="margin-top:24px">And when that tipping point happens in your business, you have a choice. Quit chasing. Quit searching. And start building.</p>`},
  {t:'p1', h:`<div class="num">Part One</div>
    <h2>Why trust is the whole game now</h2>
    <p class="sub">Trust is at all-time lows and information is everywhere. Your people aren't looking for one more expert shouting value. They're looking for something, and someone, they can trust. That is the opening.</p>`},
  {t:'oldway', h:`<div class="kicker">The old way vs. now</div>
    <h2>What used to work</h2>
    <ul>
      <li class="x">Teach in your content to prove you know your stuff.</li>
      <li class="x">Watch competitors, then position 'differently'.</li>
      <li class="x">Outsource marketing to an agency to save time.</li>
      <li class="x">Chase SEO and ranking in your local area.</li>
    </ul>
    <p class="sub" style="margin-top:14px">It all treats marketing as a separate thing you bolt on to make the business look good.</p>`},
  {t:'shift', h:`<div class="kicker">The shift</div>
    <p class="big">What if marketing told the story of what you do and who you really are, so it felt like a natural extension of everything else?</p>
    <p class="sub" style="margin-top:20px">Who your stuff is for. How it helps. Your values. This is the core of your whole world, and why you do any of it in the first place.</p>`},
  {t:'wbintro', h:`<div class="num">Part Two</div>
    <h2>World Building</h2>
    <p class="sub">Instead of a funnel, you build a world: your own mission, characters, stories and ideas that people seek out. Done this way, marketing gets easier, and clients come out of the woodwork to chase you down. Four pieces build the world.</p>`},
  {t:'wb1', h:`<div class="kicker">World Building &middot; 1</div>
    <h2>Mission</h2>
    <p class="lead">The reason your world exists. Not a slogan, the real why your dream clients can feel. It's the gravity that pulls the right people in and lets the wrong ones pass by.</p>`},
  {t:'wb2', h:`<div class="kicker">World Building &middot; 2</div>
    <h2>Characters</h2>
    <p class="lead">You, your people, your clients as the heroes. A world has faces and a point of view. Being clear on who you are, and being okay not being everyone's cup of tea, is what makes you findable.</p>`},
  {t:'wb3', h:`<div class="kicker">World Building &middot; 3</div>
    <h2>Stories</h2>
    <p class="lead">How it helps and what you stand for, carried in stories instead of claims. Stories are what people trust, remember, and repeat to the next person who needs you.</p>`},
  {t:'wb4', h:`<div class="kicker">World Building &middot; 4</div>
    <h2>Ideas and language</h2>
    <p class="lead">Your own mission, ideas and words become things people search for by name. When your world has its own language, you stop competing on price and start owning a category of one.</p>`},
  {t:'story', h:`<div class="kicker">The engine</div>
    <h2>Story Driven content</h2>
    <p class="sub">Three kinds of story-driven content do the heavy lifting: content that builds your world, content that invites people into it, and content that moves them to act. Used together, people start to seek you out instead of you hunting them.</p>`},
  {t:'positioning', h:`<div class="kicker">The framework</div>
    <h2>Uniqueness Positioning</h2>
    <p class="lead">A proven framework to clarify your message and position, so you ramp up audience and client attraction. It answers the one question every owner struggles to say in a sentence: who are you, exactly, and who is this for?</p>`},
  {t:'continuum', h:`<div class="kicker">The map</div>
    <h2>The marketing continuum</h2>
    <p class="sub">Most service businesses jump between random tactics. The continuum shows where attention turns into trust, and trust into clients, so you can see which single move matters most for you right now instead of doing everything at once.</p>`},
  {t:'p3', h:`<div class="num">Part Three</div>
    <h2>When people come out of the woodwork</h2>
    <ul>
      <li>Marketing feels like a natural extension of everything you do.</li>
      <li>The right clients come out of the woodwork, and some chase you down.</li>
      <li>You find the long-term growth and confidence you were actually looking for.</li>
    </ul>`},
  {t:'whyme', h:`<div class="kicker">Why listen to us</div>
    <h2>We built the real thing first</h2>
    <p class="sub">For ten years we ran brick-and-mortar businesses, a retail store and a gym, both sold for profit and still running today. Since 2019 we've worked with more than 150 purpose-driven owners, from early stage to several million dollars, who've doubled, tripled, even ten times'd their revenue by building a world instead of chasing tactics.</p>`},
  {t:'rite', h:`<div class="kicker">The rite of passage</div>
    <p class="quote">Quit chasing. Quit searching. And start building the world you know you're capable of.</p>
    <p class="sub" style="margin-top:22px">The world your dream clients are already looking for. That's the work, and it's the most leveraged thing you'll do in your business.</p>`},
  {t:'cta', h:`<div class="pill">Your next step</div>
    <h2>Build your world with us</h2>
    <p class="sub">If this is the way you want to grow, book a free 40-minute strategy call. We'll map where your world is strong, where it leaks, and the one move that matters most, with no obligation to join.</p>
    <p class="cta-row">Book your free strategy call &middot; Creator Club</p>
    <p class="disc">Educational content only. No income or result is guaranteed. Results vary with your market, your offer and the work you put in. Member examples are shared to illustrate the ideas, not to promise an outcome.</p>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide';
  d.innerHTML = (s.h||'') +
    `<div class="foot">${BRAND} &middot; ${COACH}</div>` +
    `<div class="pagenum">${i+1} / ${S.length}</div>`;
  deck.appendChild(d);
});
</script>
</body>
</html>
