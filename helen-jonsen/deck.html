<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Throughline — This Kaleidoscope Career</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#ecefe8;
    --panel:#f9fbf8;
    --rule:#dfe4da;
    --ink:#242323;
    --muted:#565f56;
    --accent:#1b5b3f;
    --deep:#123f2b;
    --head:"Fraunces",Georgia,serif;
    --body:"Mulish","Segoe UI",sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  section{
    position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;padding:56px 56px;margin:0 0 26px;min-height:460px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 1px 0 rgba(36,35,35,.02),0 18px 40px -34px rgba(18,63,43,.45);
  }
  section::before{
    content:"";position:absolute;top:0;right:0;width:150px;height:150px;
    background:
      linear-gradient(135deg,transparent 49%,var(--accent) 49% 51%,transparent 51%),
      linear-gradient(135deg,transparent 62%,rgba(27,91,63,.22) 62% 64%,transparent 64%);
    opacity:.5;pointer-events:none;
  }
  .kick{font-family:var(--body);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--head);font-weight:600;font-size:60px;line-height:1.02;letter-spacing:-.02em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2 .name,h2 .a{color:var(--accent)}
  .lede{font-size:22px;line-height:1.5;color:var(--muted);margin-top:22px;max-width:40ch}
  p{font-size:19px;line-height:1.6;color:var(--ink);max-width:54ch;margin-top:14px}
  .big{font-family:var(--head);font-weight:500;font-size:34px;line-height:1.22;letter-spacing:-.01em;max-width:24ch}
  .big .a{color:var(--accent)}
  ul{list-style:none;margin-top:22px;display:grid;gap:14px;max-width:60ch}
  li{position:relative;padding-left:30px;font-size:19px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:9px;width:11px;height:11px;
    background:var(--accent);transform:rotate(45deg)}
  .steps{display:grid;gap:14px;margin-top:22px;max-width:62ch}
  .steps li{padding-left:46px}
  .steps li::before{content:attr(data-n);top:0;width:30px;height:30px;
    background:var(--accent);color:#fff;border-radius:50%;transform:none;display:grid;
    place-items:center;font-family:var(--head);font-weight:600;font-size:15px}
  .name{font-family:var(--head);font-weight:600;color:var(--accent)}
  .tag{display:inline-block;margin-top:10px;font-size:13px;font-weight:700;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted)}
  .cta{background:var(--deep);border-color:var(--deep);color:#f3efe6}
  .cta::before{opacity:.8}
  .cta .kick{color:#9fd3b6}
  .cta h2{color:#ffffff}
  .cta p{color:#e7efe6}
  .disc{margin-top:26px;font-size:13px;line-height:1.55;color:#b9c9bf;max-width:62ch}
  .slideno{position:absolute;bottom:16px;right:22px;font-size:12px;color:var(--muted);opacity:.6}
  .cta .slideno{color:#9fd3b6}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <div class="kick">This Kaleidoscope Career &middot; A Live Masterclass</div>
    <h1>The Throughline</h1>
    <div class="lede">How to turn a nonlinear career into one story you own, and say it with confidence in any room.</div>
    <span class="tag">With Helen Jonsen</span>`},

  {t:'for', cls:'for', html:`
    <div class="kick">Who this is for</div>
    <h2>You have changed lanes more than once.</h2>
    <p>Maybe you went from one industry to another. Maybe you paused, pivoted, freelanced, led, started over. On paper it can look scattered.</p>
    <p>And every time someone asks "so what do you do?", you feel yourself start to explain, and apologize.</p>`},

  {t:'trap', cls:'trap', html:`
    <div class="kick">The trap</div>
    <h2>The advice you keep getting is to "pick a lane."</h2>
    <p>Tidy the resume. Smooth the gaps. Make the story linear so it is easy to follow.</p>
    <p>So you shrink a rich, varied career down to whatever fits a straight line, and the most interesting parts of you go missing.</p>`},

  {t:'cost', cls:'cost', html:`
    <div class="kick">What that costs you</div>
    <h2>The flattened version undersells you.</h2>
    <p>When you hide the twists, you also hide the range, the judgment, and the pattern recognition you earned by living them.</p>
    <p>You end up competing as a smaller version of yourself, for roles that fit the edited story instead of the whole one.</p>`},

  {t:'hook', cls:'hook', html:`
    <div class="kick">A different read</div>
    <div class="big">Your career was never <span class="a">messy</span>. It was multidimensional. The twists are not detours from the work. They <span class="a">are</span> the work.</div>`},

  {t:'p1', cls:'p1', html:`
    <div class="kick">Part One &middot; The real problem</div>
    <h2>A straight line is the wrong tool.</h2>
    <p>Linear career stories were built for linear careers, the kind almost no one has anymore.</p>
    <p>The problem is not that your path zigzagged. The problem is that you were handed one shape, the ladder, to describe a career that actually moved like a kaleidoscope.</p>`},

  {t:'p1b', cls:'p1b', html:`
    <div class="kick">Part One</div>
    <h2>The kaleidoscope, not the ladder.</h2>
    <p>Turn a kaleidoscope and the same pieces fall into a new pattern. Nothing is lost. It rearranges.</p>
    <p>Your skills, your experiences, your relationships do the same thing between roles. They do not disappear. They resettle into something new, and the pattern is yours.</p>`},

  {t:'p2', cls:'p2', html:`
    <div class="kick">Part Two &middot; The framework</div>
    <h2>Every kaleidoscope career has a <span class="name">throughline</span>.</h2>
    <p>The throughline is the one thread that runs through everything you have done, even the roles that look unrelated.</p>
    <p>For me it was storytelling, curiosity, and a stubborn habit of bringing people together. Name yours, and the "scattered" career becomes a single, coherent story.</p>`},

  {t:'sounds', cls:'sounds', html:`
    <div class="kick">What a throughline sounds like</div>
    <h2>One line, not a timeline.</h2>
    <p>Not "I did this, then this, then this." Instead: "I have always been the person who turns complexity into something people can act on."</p>
    <p>Same career. But now the listener hears a point of view, not a list of jobs.</p>`},

  {t:'reframe', cls:'reframe', html:`
    <div class="kick">The method</div>
    <h2>The Reframe Lens</h2>
    <p>A seven step walk from reconsidering your past to reclaiming your throughline. We move through it together, live.</p>
    <ol class="steps">
      <li data-n="1">Lay out the full picture, every twist, with nothing hidden.</li>
      <li data-n="2">Reconsider each chapter without apology.</li>
      <li data-n="3">Spot the thread you keep returning to.</li>
      <li data-n="4">Name your throughline in one plain line.</li>
    </ol>`},

  {t:'reframe2', cls:'reframe2', html:`
    <div class="kick">The method, continued</div>
    <h2>From thread to told.</h2>
    <ol class="steps">
      <li data-n="5">Write your passion statement, what the thread is for.</li>
      <li data-n="6">Build your signature story, the version you actually say out loud.</li>
      <li data-n="7">Reclaim it, so you lead with it instead of explaining it away.</li>
    </ol>
    <p>You leave with a working draft, not just an idea.</p>`},

  {t:'myth', cls:'myth', html:`
    <div class="kick">The worry</div>
    <h2>"But won't it still look unfocused?"</h2>
    <p>It is the opposite. A throughline is focus. It tells people exactly what you bring, across every setting you have brought it in.</p>
    <p>Breadth without a thread reads as scattered. Breadth on a thread reads as rare.</p>`},

  {t:'tools', cls:'tools', html:`
    <div class="kick">What you walk away with</div>
    <h2>Your Power Tools.</h2>
    <ul>
      <li>A one line throughline you are proud to say</li>
      <li>A passion statement that explains the "why" behind the moves</li>
      <li>A signature story for interviews, bios, and the room</li>
    </ul>`},

  {t:'p3', cls:'p3', html:`
    <div class="kick">Part Three &middot; The same question, a new answer</div>
    <h2>"So what do you do?"</h2>
    <p>It stops being the moment you brace for. You answer in one confident line, and the person leans in instead of glazing over.</p>
    <p>You are no longer translating your career on the fly. You are presenting it.</p>`},

  {t:'room', cls:'room', html:`
    <div class="kick">Where it shows up</div>
    <h2>Everywhere you introduce yourself.</h2>
    <ul>
      <li>The interview answer that used to wander</li>
      <li>The LinkedIn headline that finally sounds like you</li>
      <li>The introduction from a stage or a panel seat</li>
    </ul>`},

  {t:'who', cls:'who', html:`
    <div class="kick">For the woman at a turn</div>
    <h2>Early, mid, or third act.</h2>
    <p>This works whether you are a few years in and already non traditional, mid pivot and tired of looking "messy", or stepping into what is next after decades and asking what your legacy will be.</p>
    <p>The throughline does not care how many chapters you have. It makes sense of all of them.</p>`},

  {t:'whyme', cls:'whyme', html:`
    <div class="kick">Why me</div>
    <h2>I spent four decades proving this.</h2>
    <p>I have moved between newsrooms, corporate media, entrepreneurship, and public service. For years it looked like I could not sit still.</p>
    <p>Then I saw the throughline, in my own career and in the careers of the women I interviewed, and I wrote <span class="name">This Kaleidoscope Career</span> so you would not have to wait four decades to find yours.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Your next step</div>
    <h2>Find your throughline, live.</h2>
    <p>Join me for the live masterclass. Bring the career that never fit a straight line. Leave with one story you are proud to tell.</p>
    <p style="margin-top:18px;font-weight:700;color:#ffffff">Save your seat at helenjonsen.com</p>
    <div class="disc">Educational session only. Nothing here is career, legal, or financial advice, and no income, role, promotion, or result is guaranteed. Outcomes vary with each person's situation and effort.</div>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  if(s.cls) el.className = s.cls;
  el.innerHTML = s.html + '<div class="slideno">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(el);
});
</script>
</body>
</html>
