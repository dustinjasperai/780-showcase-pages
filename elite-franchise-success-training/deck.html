<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Multi-Unit CEO: A Live Masterclass with Aicha Bascaro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1b2a58;        /* AFA darkest navy (brand.json #1b2a58) */
    --panel:#223158;     /* half-step from dominant #324368 */
    --deep:#14213a;      /* deeper navy ground */
    --accent:#0072ef;    /* AFA electric blue (brand.json #0072ef, 122 uses) */
    --ink:#eef2fb;
    --muted:#9fb0d4;
    --rule:rgba(255,255,255,0.12);
    --head:'Montserrat',system-ui,sans-serif;
    --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-snap-type:y mandatory;scroll-behavior:smooth}
  body{background:var(--deep);color:var(--ink);font-family:var(--body);line-height:1.5}
  .slide{min-height:100vh;scroll-snap-align:start;display:flex;flex-direction:column;justify-content:center;
    padding:7vh 8vw;border-bottom:1px solid var(--rule);position:relative;background:var(--bg)}
  .slide:nth-child(even){background:var(--deep)}
  .eyebrow{font-family:var(--head);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:.74rem;color:var(--accent);margin-bottom:1.2rem}
  h1{font-family:var(--head);font-weight:800;font-size:clamp(2.2rem,6vw,4.4rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:clamp(1.7rem,4.2vw,3rem);line-height:1.1;letter-spacing:-.01em}
  .lede{font-size:clamp(1.05rem,2vw,1.45rem);color:var(--muted);margin-top:1.4rem;max-width:40ch}
  .big{font-size:clamp(1.5rem,3.4vw,2.4rem);font-weight:600;max-width:24ch;margin-top:.6rem}
  .accent{color:var(--accent)}
  .pillargrid{display:grid;grid-template-columns:repeat(2,1fr);gap:1rem;margin-top:2.4rem;max-width:760px}
  .pcard{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:1.5rem 1.6rem}
  .pcard .n{font-family:var(--head);font-weight:800;color:var(--accent);font-size:.9rem;letter-spacing:.14em}
  .pcard h3{font-family:var(--head);font-size:1.5rem;margin:.35rem 0 .5rem}
  .pcard p{color:var(--muted);font-size:1rem}
  ul.list{margin-top:1.8rem;max-width:44ch;list-style:none}
  ul.list li{padding:.7rem 0;border-top:1px solid var(--rule);font-size:1.12rem;display:flex;gap:.8rem}
  ul.list li::before{content:"";flex:0 0 10px;height:10px;margin-top:.55rem;background:var(--accent);border-radius:2px}
  .cal{display:grid;grid-template-columns:repeat(4,1fr);gap:.55rem;margin-top:2rem;max-width:620px}
  .cal .m{background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:.7rem .4rem;text-align:center}
  .cal .m.on{background:var(--accent);color:#06142e;border-color:var(--accent)}
  .cal .m b{font-family:var(--head);display:block;font-size:.95rem}
  .cal .m span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
  .cal .m.on span{color:#0a2350}
  .score{font-family:var(--head);font-weight:800;font-size:clamp(3rem,9vw,7rem);color:var(--accent);line-height:1}
  .foot{position:absolute;left:8vw;bottom:3.2vh;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-family:var(--head)}
  .cta-box{margin-top:2rem;display:inline-block;background:var(--accent);color:#06142e;font-family:var(--head);
    font-weight:800;padding:1rem 1.8rem;border-radius:12px;font-size:1.1rem}
  .disc{margin-top:2.2rem;font-size:.82rem;color:var(--muted);max-width:52ch}
  .who{font-size:1.15rem;color:var(--ink);max-width:40ch;margin-top:1.6rem}
  @media(max-width:640px){.pillargrid{grid-template-columns:1fr}.cal{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body>
<main id="deck"></main>
<script>
const S = [
  {t:'title', eyebrow:"A Live Masterclass with Aicha Bascaro", h:`The Multi-Unit <span class="accent">CEO</span>`, sub:"The four systems that turn an overwhelmed franchise owner into a profitable multi-unit enterprise.", foot:"American Franchise Academy"},

  {t:'who', eyebrow:"Who this is for", h:"You run two or more units.", who:"You are growing in revenue but not in profit. Your managers do not perform like owners. You are still the person who fixes everything. And you are wondering why scaling got harder, not easier.", foot:"American Franchise Academy"},

  {t:'trap', eyebrow:"The trap", h:"Your franchisor gave you a brand.", big:`They did not give you a <span class="accent">business</span>.`, sub:"Franchisors train brand execution. They do not train franchisees to be operators, people leaders, or enterprise builders. That gap is where most multi-unit owners get stuck.", foot:"American Franchise Academy"},

  {t:'reframe', eyebrow:"The hard truth", h:`More units will not fix it.`, big:`More units <span class="accent">multiply</span> it.`, sub:"Every weak system you carry into unit two shows up again in unit five. You do not have an expansion problem. You have an operating-system problem.", foot:"American Franchise Academy"},

  {t:'part', eyebrow:"Part One", h:"Why profitable operators stall", foot:"American Franchise Academy"},

  {t:'list', eyebrow:"The pattern", h:"It is almost always the same four leaks.", list:["Unit managers who do not perform like owners","District managers who do not deliver the results","Constant firefighting across locations","Revenue climbing while profit quietly shrinks"], foot:"American Franchise Academy"},

  {t:'reframe', eyebrow:"The real bottleneck", h:"You became the best operator in the building.", big:`So the building now <span class="accent">depends on you</span>.`, sub:"The skill that got you here is the exact thing capping your growth. The job now is not to operate better. It is to build a business that operates without you.", foot:"American Franchise Academy"},

  {t:'part', eyebrow:"Part Two", h:"The COMMAND Operating System", foot:"American Franchise Academy"},

  {t:'pillars', eyebrow:"Four pillars", h:"One system. Four jobs.", cards:[
    {n:"01",h:"TEAM",p:"Hiring, retention, and leadership development so your people run the floor."},
    {n:"02",h:"INCOME",p:"A brand-agnostic execution rhythm that drives sales every shift."},
    {n:"03",h:"PROFIT",p:"Cost control and financial discipline so growth reaches the bottom line."},
    {n:"04",h:"SCALE",p:"Planning, delegation, and enterprise stability past yourself."}
  ], foot:"American Franchise Academy"},

  {t:'pillar', eyebrow:"Pillar 01: Team", h:`People who run it <span class="accent">without you</span>.`, sub:"Most owners hire for warm bodies and hope for leaders. TEAM installs the hiring, retention, and development that turns a unit manager into someone who protects your profit when you are not in the room.", foot:"American Franchise Academy"},

  {t:'pillar', eyebrow:"Pillar 02: Income", h:`Sales as a <span class="accent">rhythm</span>, not a reaction.`, sub:"An execution rhythm that works across any brand you operate. Daily and weekly habits that drive sales every shift, so the number does not rise and fall with your mood or your presence.", foot:"American Franchise Academy"},

  {t:'pillar', eyebrow:"Pillar 03: Profit", h:`Growth that reaches the <span class="accent">bottom line</span>.`, sub:"Revenue is vanity when margin leaks. PROFIT is the cost-of-goods and financial-discipline systems that stop you from adding units and losing money, so every location you run actually pays.", foot:"American Franchise Academy"},

  {t:'pillar', eyebrow:"Pillar 04: Scale", h:`Build an asset, not a <span class="accent">second job</span>.`, sub:"Planning, delegation, and the enterprise structure that lets the business stand without you. The outcome is a company you could sell, hand down, or step back from.", foot:"American Franchise Academy"},

  {t:'systems', eyebrow:"The spine", h:"The 20 Multi-Unit Enterprise Systems", sub:"One or two systems a month, on a calendar, across all four pillars. Not theory you forget by Friday. A fixed annual roadmap you actually install.", cal:[
    ["JAN","Team",1],["FEB","Income",0],["MAR","Profit",0],["APR","Scale",1],
    ["MAY","Team",0],["JUN","Income",1],["JUL","Profit",0],["AUG","Scale",0],
    ["SEP","Team",0],["OCT","Income",0],["NOV","Profit",1],["DEC","Scale",0]
  ], foot:"American Franchise Academy"},

  {t:'score', eyebrow:"Know where you stand", h:"The 112-point assessment", score:"112", sub:"The Multi-Unit Business Systems Assessment scores your operation across all four pillars. Most owners find out fast which systems they have never actually built. You cannot fix what you have not measured.", foot:"American Franchise Academy"},

  {t:'pillar', eyebrow:"Develop the role above the unit", h:"LEAD: your District Managers", sub:"A district manager earns $75 to $95K to oversee $3 to $15M across your units. Untrained, that is the most expensive seat in your company. LEAD gives them the system to actually deliver the results.", foot:"American Franchise Academy"},

  {t:'pillar', eyebrow:"Develop the role inside the unit", h:"MANAGE: your Unit Managers", sub:"MANAGE trains your unit managers to hit financial targets, control cost of goods, and build people and business action plans, so the store runs to standard whether or not you walk in that day.", foot:"American Franchise Academy"},

  {t:'part', eyebrow:"Part Three", h:"When the systems run the business", foot:"American Franchise Academy"},

  {t:'list', eyebrow:"The shift", h:"From owner-operator to multi-unit CEO.", list:["Managers who lead without you in the room","A profit number you can predict, not pray for","A calendar of systems instead of a day of fires","A business you could sell, scale, or step back from"], foot:"American Franchise Academy"},

  {t:'why', eyebrow:"Why me", h:"35 years, from the floor to the P&L.", sub:"Aicha Bascaro grew through the ranks of global franchise brands like Domino's Pizza, Popeyes, and Olive Garden, studying exactly what makes franchisees succeed and what makes them fail. The American Franchise Academy exists to give multi-unit owners the business education their franchisor never provided.", foot:"American Franchise Academy"},

  {t:'cta', eyebrow:"Your next step", h:`Build the business the brand <span class="accent">never handed you</span>.`, sub:"Book a Franchise Success Call and we will map your four pillars, show you where you score on the 112-point assessment, and decide if COMMAND is the right next step for your enterprise.", cta:"Book your Franchise Success Call", disc:"Educational only. No income, role, or result is guaranteed. Results vary and depend on your market, your execution, and factors outside any program's control.", foot:"American Franchise Academy"}
];

function esc(x){return x;}
function slideHTML(s){
  let inner = `<div class="eyebrow">${s.eyebrow||""}</div>`;
  if(s.t==='title'){ inner += `<h1>${s.h}</h1><p class="lede">${s.sub}</p>`; }
  else if(s.t==='who'){ inner += `<h2>${s.h}</h2><p class="who">${s.who}</p>`; }
  else if(s.t==='trap'||s.t==='reframe'){ inner += `<h2>${s.h}</h2><p class="big">${s.big}</p><p class="lede">${s.sub}</p>`; }
  else if(s.t==='part'){ inner += `<h1>${s.h}</h1>`; }
  else if(s.t==='list'){ inner += `<h2>${s.h}</h2><ul class="list">${s.list.map(function(x){return "<li>"+x+"</li>";}).join("")}</ul>`; }
  else if(s.t==='pillars'){ inner += `<h2>${s.h}</h2><div class="pillargrid">${s.cards.map(function(c){return '<div class="pcard"><div class="n">'+c.n+'</div><h3>'+c.h+'</h3><p>'+c.p+'</p></div>';}).join("")}</div>`; }
  else if(s.t==='pillar'){ inner += `<h2>${s.h}</h2><p class="lede">${s.sub}</p>`; }
  else if(s.t==='systems'){ inner += `<h2>${s.h}</h2><p class="lede">${s.sub}</p><div class="cal">${s.cal.map(function(m){return '<div class="m'+(m[2]?' on':'')+'"><b>'+m[0]+'</b><span>'+m[1]+'</span></div>';}).join("")}</div>`; }
  else if(s.t==='score'){ inner += `<h2>${s.h}</h2><div class="score">${s.score}</div><p class="lede">${s.sub}</p>`; }
  else if(s.t==='why'){ inner += `<h2>${s.h}</h2><p class="lede">${s.sub}</p>`; }
  else if(s.t==='cta'){ inner += `<h2>${s.h}</h2><p class="lede">${s.sub}</p><div class="cta-box">${s.cta}</div><p class="disc">${s.disc}</p>`; }
  inner += `<div class="foot">${s.foot||""}</div>`;
  return `<section class="slide">${inner}</section>`;
}
document.getElementById('deck').innerHTML = S.map(slideHTML).join("");
</script>
</body>
</html>
