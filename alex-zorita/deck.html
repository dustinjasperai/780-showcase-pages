<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vender Sin Convencer — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f8f8f8;      /* their dominant ground (brand.json, 213 uses) */
    --panel:#ffffff;
    --rule:#e2e2e2;
    --ink:#2d2d2d;     /* their heading color (brand.json) */
    --muted:#707070;
    --accent:#f32735;  /* their brand red (brand.json, 36 uses) */
    --font:'Space Grotesk',system-ui,Helvetica,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased}
  .stage{max-width:1040px;margin:0 auto;padding:48px 28px 96px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 52px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative}
  .kicker{font-size:13px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  .num{position:absolute;top:24px;right:28px;font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.08em}
  h1{font-size:52px;font-weight:800;line-height:1.05;letter-spacing:-0.02em;margin-bottom:20px}
  h2{font-size:34px;font-weight:800;line-height:1.12;letter-spacing:-0.015em;margin-bottom:18px}
  .lead{font-size:21px;font-weight:400;color:var(--ink);line-height:1.5;max-width:44ch}
  .sub{font-size:19px;color:var(--muted);line-height:1.5;max-width:52ch;margin-top:10px}
  .mark{display:inline-block;position:relative}
  .mark:after{content:"";position:absolute;left:0;right:0;bottom:2px;height:10px;background:var(--accent);opacity:.22;z-index:-1}
  ul{list-style:none;margin-top:14px}
  li{font-size:20px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:0}
  li:before{content:"";position:absolute;left:0;top:22px;width:14px;height:3px;background:var(--accent)}
  .step{font-size:15px;font-weight:700;color:var(--accent);letter-spacing:.1em;text-transform:uppercase;margin-bottom:10px}
  .big{font-size:40px;font-weight:800;line-height:1.1;letter-spacing:-0.02em;max-width:20ch}
  .who{font-size:22px;line-height:1.6;color:var(--ink)}
  .credit{font-size:18px;color:var(--muted);line-height:1.6;max-width:50ch;margin-top:8px}
  .cta-box{border-top:3px solid var(--accent);padding-top:22px;margin-top:8px}
  .disclaimer{font-size:13px;color:var(--muted);line-height:1.5;margin-top:26px;max-width:60ch}
  .presenter{font-size:17px;color:var(--muted);margin-top:26px}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const S=[
 {t:'title', kicker:'A live masterclass', h:'Vender Sin Convencer', sub:'How to close high-ticket work through conversation, without convincing anyone.', presenter:'Presented live by Alex Zorita, La Corvata'},
 {t:'who', kicker:'Who this is for', h:'For professionals who sell their own work', body:'Designers, consultants, photographers, lawyers, and other experts who are great at the craft and want clients to say yes to premium work without a fight.'},
 {t:'trap', kicker:'The trap', h:'You lower the price to win the work', sub:'And every time you do, you teach the next client to negotiate, and you teach yourself that your value is up for debate.'},
 {t:'hook', kicker:'A different idea', big:'You do not need to convince. You need to be understood.'},
 {t:'who', kicker:'What this is not', h:'This is not a bag of closing tricks', body:'No scripts to memorize, no pressure tactics, no chasing. The work is learning to lead a conversation so the right client arrives at yes on their own.'},
 {t:'part', step:'Part one', h:'Why convincing backfires on premium work', sub:'The harder you push, the more the buyer feels sold to, and the more they retreat to the one thing they can control: the price.'},
 {t:'list', kicker:'What convincing costs you', h:'The three hidden costs', items:['Trust: pressure reads as doubt about your own value.','Margin: discounts become the only lever you know how to pull.','Energy: you dread the sales call instead of enjoying it.']},
 {t:'part', step:'Part two', h:'The method: five steps', sub:'Vender Sin Convencer is built in five steps, each one a small shift in how you prepare for and hold the conversation.'},
 {t:'step', step:'Step 1', h:'Philosophy', body:'The mindset for premium sales, and the pricing psychology that lets you name a real number without flinching.'},
 {t:'step', step:'Step 2', h:'Attraction', body:'Finding and qualifying the right clients so your calendar fills with people who already value what you do.'},
 {t:'step', step:'Step 3', h:'Preparation', body:'The structure of the conversation itself, from breaking the ice to explaining the service so its worth is obvious.'},
 {t:'step', step:'Step 4', h:'Adaptation', body:'The seven difficult customer types, and how to read and respond to each one without losing the room.'},
 {t:'step', step:'Step 5', h:'Improvement', body:'A simple system to review every conversation so each one is sharper than the last.'},
 {t:'list', kicker:'Find your voice', h:'The 13 communication styles', items:['There is no single right way to sell.','A test identifies the style you already use naturally.','You sell in your own voice, not a borrowed script.']},
 {t:'walk', kicker:'A real conversation', h:'"Can you do it for less?"', sub:'Instead of defending or discounting, you slow down, understand what they actually need, and walk them through what the work includes and why it pays back. The price stops being the conversation.'},
 {t:'list', kicker:'What changes for you', h:'When the method takes hold', items:['You quote your real rate without a knot in your stomach.','The calendar fills with people who already want what you do.','Sales stops feeling like performing and starts feeling like talking.']},
 {t:'who', kicker:'Why me', h:'I learned this the long way', body:'I am Alex Zorita. I came up as a musician, filmmaker, and designer, and I invested over fifty thousand euros in mentorship before I built this method. La Corvata has taught it to professionals across Spain and Latin America since 2019.'},
 {t:'list', kicker:'Recap', h:'The five steps, together', items:['Philosophy, so you hold your value.','Attraction, so the right people show up.','Preparation, so the conversation has a shape.','Adaptation, so any client can be met.','Improvement, so you keep getting better.']},
 {t:'cta', kicker:'Your next step', h:'Ready to sell without convincing?', body:'Start with the free 13 communication styles test to find your selling voice, then book a diagnosis call and we will map your plan together.', cta:'Take the test, then book your diagnosis at lacorvata.com', disclaimer:'This masterclass is educational. No income or result is guaranteed. Results vary and depend on your own work, market, and effort.'}
];
const stage=document.getElementById('stage');
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
S.forEach((s,i)=>{
  const d=document.createElement('section');d.className='slide';
  let h='';
  const n=(i+1).toString().padStart(2,'0')+' / '+S.length.toString().padStart(2,'0');
  h+='<div class="num">'+n+'</div>';
  if(s.kicker) h+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.step) h+='<div class="step">'+esc(s.step)+'</div>';
  if(s.t==='title'){ h+='<h1>'+esc(s.h)+'</h1>'; if(s.sub)h+='<p class="lead">'+esc(s.sub)+'</p>'; if(s.presenter)h+='<p class="presenter">'+esc(s.presenter)+'</p>'; }
  else if(s.t==='hook'){ h+='<div class="big"><span class="mark">'+esc(s.big)+'</span></div>'; }
  else if(s.h){ h+='<h2>'+esc(s.h)+'</h2>'; }
  if(s.big && s.t!=='hook'){ h+='<div class="big">'+esc(s.big)+'</div>'; }
  if(s.body){ h+='<p class="who">'+esc(s.body)+'</p>'; }
  if(s.sub){ h+='<p class="sub">'+esc(s.sub)+'</p>'; }
  if(s.items){ h+='<ul>'+s.items.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ul>'; }
  if(s.credit){ h+='<p class="credit">'+esc(s.credit)+'</p>'; }
  if(s.t==='cta'){ h+='<div class="cta-box"><p class="lead">'+esc(s.cta)+'</p></div>'; if(s.disclaimer) h+='<p class="disclaimer">'+esc(s.disclaimer)+'</p>'; }
  d.innerHTML=h;
  stage.appendChild(d);
});
</script>
</body>
</html>
