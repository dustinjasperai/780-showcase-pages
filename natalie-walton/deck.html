<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grow Smarter, Not Harder - A Masterclass with Natalie Walton</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Almarai:wght@300;400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f3ec;      /* her warm off-white ground (brand.json) */
    --panel:#ece3d4;   /* warm paper shade from the ground family */
    --ink:#36302a;     /* her dominant text brown (brand.json) */
    --accent:#b9a590;  /* her muted taupe accent (brand.json, verbatim) */
    --rule:#d8cdbb;    /* thin warm hairline from the taupe/ground family */
    --display:"Cormorant Garamond", Georgia, serif;
    --body:"Almarai", system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--panel);color:var(--ink);font-family:var(--body);font-weight:300}
  .deck{max-width:1040px;margin:0 auto;padding:32px 16px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:2px;
    padding:72px 72px;
    margin:0 0 26px;
    min-height:560px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .num{position:absolute;top:28px;right:34px;font-family:var(--body);font-size:12px;letter-spacing:.18em;color:var(--accent)}
  .eyebrow{font-family:var(--body);font-weight:700;font-size:12.5px;letter-spacing:.26em;text-transform:uppercase;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--display);font-weight:500;font-size:62px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:500;font-size:42px;line-height:1.1;margin-bottom:20px}
  .lede{font-family:var(--display);font-style:italic;font-weight:400;font-size:27px;line-height:1.35;color:#5b5147}
  p.body{font-family:var(--body);font-weight:300;font-size:20px;line-height:1.6;max-width:62ch;margin-top:14px}
  p.body + p.body{margin-top:16px}
  .hr{height:1px;background:var(--rule);margin:26px 0;width:120px}
  ul{list-style:none;margin-top:22px}
  li{font-family:var(--body);font-weight:300;font-size:20px;line-height:1.5;padding:16px 0;border-top:1px solid var(--rule);max-width:70ch}
  li:last-child{border-bottom:1px solid var(--rule)}
  li b{font-family:var(--display);font-style:normal;font-weight:600;font-size:23px;display:block;margin-bottom:4px}
  .pillar-k{font-family:var(--body);font-size:12.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);margin-bottom:16px}
  .big{font-family:var(--display);font-weight:500;font-size:52px;line-height:1.08}
  .presenter{margin-top:34px;font-family:var(--body);font-size:16px;letter-spacing:.04em;color:#5b5147}
  .presenter b{font-weight:700;color:var(--ink)}
  .disclaimer{margin-top:30px;font-family:var(--body);font-size:13px;line-height:1.5;color:#7a7066;max-width:64ch}
  .cta-step{font-family:var(--display);font-style:italic;font-size:26px;color:var(--ink);margin-top:10px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A Live Masterclass', h1:'Grow Smarter, Not Harder',
   lede:'Building a creative practice around your signature style, not a scale-to-six-figures playbook.',
   presenter:'with Natalie Walton'},

  {t:'promise', eyebrow:'What you will leave with',
   h2:'One hour, three shifts',
   body:['A clear, values-aligned way to attract better-fit clients, charge with confidence, and grow without adding hours.',
         'No hustle scripts. No funnels that feel like someone else. Just the quiet architecture of a business that reflects the quality of your work.']},

  {t:'who', eyebrow:'Who this is for',
   h2:'Designers building something that lasts',
   list:[['Interior designers and stylists','You do beautiful work and want a practice that can hold it.'],
         ['Creative business owners','Photographers, content creators, shop owners ready to grow smarter, not harder.'],
         ['Anyone tired of chasing','You want fewer, better clients, not a louder feed.']]},

  {t:'trap', eyebrow:'The trap',
   h2:'More clients was supposed to mean more freedom',
   body:['So you said yes to everything. Took the low-fit project. Dropped your price when someone pushed back.',
         'And the busier you got, the less the business looked like you. Growth started to feel like the opposite of why you began.']},

  {t:'reframe', eyebrow:'The reframe',
   big:'The problem was never your talent, or your visibility.',
   body:['It is that the business was built on hustle instead of on your signature. Harder does not scale. Clearer does.']},

  {t:'cost', eyebrow:'What harder costs', h2:'The hidden price of busy',
   body:['Every low-fit project borrows time from the work that would have built your name. Every discount teaches the market what you are worth.',
         'Busy feels like progress. Often it is just the long way around to the same place, more tired.']},

  {t:'philosophy', eyebrow:'A different premise', h2:'Fewer, better',
   body:['The slow home taught me that less, chosen well, is richer than more. A creative business works the same way.',
         'A smaller number of right clients, priced properly, with room to breathe between them, is not a smaller business. It is a sturdier one.']},

  {t:'part', eyebrow:'Part One', h2:'Why growing harder stalls',
   body:['When every lead is a maybe, you negotiate from scarcity. When your marketing sounds like everyone else, you compete on price.',
         'The fix is not more output. It is defining what only you do, and letting that do the heavy lifting.']},

  {t:'part', eyebrow:'Part Two', h2:'The Design and Grow method',
   lede:'Three pillars. The same ones I teach my mentorship clients.',
   body:['Generate quality leads. Sell with ease. Build momentum. Each one removes a reason you are working harder than you should.']},

  {t:'pillar', k:'Pillar One', h2:'Generate Quality Leads',
   body:['Marketing aligned with your values, so the inquiries that come in already fit.',
         'Your signature style is the filter. When your work speaks clearly, the wrong clients self-select out before they ever reach your inbox.']},

  {t:'pillar', k:'Pillar Two', h2:'Sell With Ease',
   body:['Communicating value with confidence, and pricing for profit, so selling stops feeling like pushing.',
         'The pricing conversation does the selling when the value is obvious. You stop discounting to win work you did not want anyway.']},

  {t:'pillar', k:'Pillar Three', h2:'Build Momentum',
   body:['Sustainable systems, templates and tools, so growth does not depend on you working more hours.',
         'This is the quiet architecture: the parts of the business that keep running whether or not you are in the room.']},

  {t:'style', eyebrow:'The through-line', h2:'Your style is your strategy',
   body:['Signature style is not only how a room looks. It is how a practice gets known, referred, and paid well.',
         'Define it once, and leads, pricing, and systems all get easier because they finally point in one direction.']},

  {t:'part', eyebrow:'Part Three', h2:'The practice on the other side',
   list:[['A full calendar of fit','Projects you are proud of, from clients who found you already sold on your point of view.'],
         ['Prices you do not flinch at','Because the value is set before the conversation starts.'],
         ['A business that holds','Systems that carry the weight, so you can step back without it stalling.']]},

  {t:'how', eyebrow:'How it actually runs', h2:'Clarity first, then structure',
   body:['We start with your signature: what you want to be known for, and who that naturally attracts. Everything downstream gets easier once that is settled.',
         'Then we build the lead, pricing and systems pieces around it, in that order, so each one reinforces the last.']},

  {t:'proof', eyebrow:'Why me', h2:'Natalie Walton',
   body:['Interior stylist and designer, and author of four books on home and simple living: This is Home, Still, Style, and Home by the Sea.',
         'Host of the Imprint podcast and the Editions Substack read by more than eighteen thousand people. Work featured in Elle Decoration, Livingetc and Harper’s Bazaar.',
         'I have spent fifteen years making beautiful work pay, and the last few teaching other designers to do the same.']},

  {t:'recap', eyebrow:'The one hour, recapped', h2:'Smarter, not harder',
   list:[['Generate quality leads','Let your style filter for fit.'],
         ['Sell with ease','Price for profit, sell without pushing.'],
         ['Build momentum','Systems that grow the business for you.']]},

  {t:'cta', eyebrow:'Begin, at your pace', h2:'Let us build yours',
   step:'Apply for the 1:1 Business Mentorship, or join Design and Grow to put all three pillars in place.',
   body:['If today gave you one clearer way to grow around your own signature style, this is where we do it together, at your pace.'],
   disclaimer:'This masterclass is educational. Results vary from person to person and depend on many factors; nothing here is a promise or guarantee of income or any specific result.'}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '<span class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</span>';
  if(s.eyebrow) h += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.h1) h += '<h1>'+s.h1+'</h1>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.h2) h += '<h2>'+s.h2+'</h2>';
  if(s.k) h = h.replace('<h2>','<div class="pillar-k">'+s.k+'</div><h2>');
  if(s.lede) h += '<div class="lede">'+s.lede+'</div>';
  if(s.big) h += '<div class="hr"></div>';
  if(s.body) s.body.forEach(p=> h += '<p class="body">'+p+'</p>');
  if(s.step) h += '<div class="cta-step">'+s.step+'</div>';
  if(s.list){ h += '<ul>'; s.list.forEach(it=> h += '<li><b>'+it[0]+'</b>'+it[1]+'</li>'); h += '</ul>'; }
  if(s.presenter) h += '<div class="presenter"><b>'+s.presenter+'</b></div>';
  if(s.disclaimer) h += '<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
