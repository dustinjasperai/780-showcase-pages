<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Presentation Layer — A Masterclass with Ryan Vaughn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;0,700;1,400&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E8;
    --panel:#FCFAF5;
    --ink:#222826;
    --muted:#5C5A52;
    --rule:#E6DFD1;
    --accent:#F58229;
    --serif:"Spectral",Georgia,serif;
    --sans:"Work Sans",system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:56px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;top:0;left:0;height:4px;width:84px;background:var(--accent);border-radius:0 0 4px 0}
  .eyebrow{font-family:var(--sans);font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.08;letter-spacing:-0.01em;margin-bottom:18px}
  h2{font-family:var(--serif);font-weight:600;font-size:34px;line-height:1.14;margin-bottom:16px}
  .lead{font-family:var(--serif);font-style:italic;font-size:23px;color:var(--muted);line-height:1.4}
  p{font-size:18px;color:var(--ink);margin-bottom:12px;max-width:62ch}
  p.sub{color:var(--muted)}
  ul{list-style:none;margin:10px 0}
  li{font-size:19px;padding:10px 0 10px 30px;position:relative;border-bottom:1px solid var(--rule);max-width:64ch}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .phase{font-family:var(--serif);font-size:15px;font-weight:600;color:var(--accent);text-transform:uppercase;letter-spacing:.1em;margin-bottom:10px}
  .big{font-family:var(--serif);font-size:40px;font-weight:700;line-height:1.1;margin-bottom:14px}
  .foot{position:absolute;bottom:20px;right:28px;font-size:12px;color:var(--muted);letter-spacing:.08em}
  .brandline{position:absolute;bottom:20px;left:28px;font-size:12px;color:var(--muted);letter-spacing:.1em;text-transform:uppercase}
  .disclaimer{margin-top:22px;font-size:13px;color:var(--muted);max-width:70ch;line-height:1.5}
  .cta-step{display:inline-block;margin-top:14px;font-family:var(--sans);font-weight:600;font-size:19px;color:var(--ink);border:2px solid var(--accent);border-radius:999px;padding:12px 26px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", eyebrow:"A live masterclass", h1:"The Presentation Layer",
   lead:"Why high-performing founders quietly plateau, and the inside-out shift that breaks it.",
   brand:"Ryan Vaughn, Inside Out Leadership"},

  {t:"content", eyebrow:"In the next hour", h2:"What this hour gives you",
   bullets:[
     "The one habit that got you funded and is now capping your company",
     "A name for the thing you feel but cannot say out loud",
     "The three-phase shift my founders use to lead as themselves",
     "A clear read on whether this work is for you right now"]},

  {t:"content", eyebrow:"Who this is for", h2:"If you are the one everyone looks to",
   bullets:[
     "You founded or now run the company, and the team reads your face first",
     "On paper it is working. Inside, something is quietly off",
     "You have scaled the business faster than you have scaled yourself"]},

  {t:"content", eyebrow:"The trap", h2:"You became the bottleneck, and you cannot say it",
   p:"The further you climb, the fewer rooms there are where you can be honest. Not with the board. Not with the team. Often not even at home. So you hold it, and you keep the surface smooth.",
   sub:"That surface has a cost, and most founders never get to name it."},

  {t:"statement", eyebrow:"The reframe", big:"The skill that got you here is the one capping you now.",
   p:"Looking in control at all times is a survival skill in early stage. At scale it becomes the wall between you and the people and ideas you most need."},

  {t:"content", eyebrow:"Part one", phase:"The core problem", h2:"The Presentation Layer",
   p:"The Presentation Layer is the polished, competent exterior you maintain to look like you have it handled.",
   bullets:[
     "It is built from the need to appear competent",
     "It quietly blocks your own learning",
     "It shuts down the honest signal your team is trying to send you"]},

  {t:"content", eyebrow:"Part one", h2:"What the armor actually costs",
   bullets:[
     "Learning, because you cannot be seen not knowing",
     "Innovation, because the room mirrors your guardedness",
     "Trust, because people do not open up to a surface"]},

  {t:"statement", eyebrow:"Part one", big:"Your behavior is downstream of how your mind makes meaning.",
   p:"We do not start with tactics. We start with the specific structures your mind uses to make meaning, because those structures are what drive how you lead."},

  {t:"content", eyebrow:"Part two", phase:"The method", h2:"Leading from the inside out",
   p:"Personal development drives business outcomes. You can build the company to suit the life you want, instead of the other way around. Here is the arc we run.",
   bullets:[
     "Phase one, align on success",
     "Phase two, inquire, execute and iterate",
     "Phase three, finish or begin again"]},

  {t:"phase", eyebrow:"Part two", phase:"Phase one", h2:"Align on success",
   p:"We define one or more concrete outcomes for your work together, and the objective criteria that will tell you that you have reached them. No vague growth. A target you can see.",},

  {t:"phase", eyebrow:"Part two", phase:"Phase two", h2:"Inquire, execute and iterate",
   p:"In biweekly sessions we examine the meaning-making structures driving your behavior, then you take committed field work back into the real company. We adjust from what the field work shows.",},

  {t:"phase", eyebrow:"Part two", phase:"Phase three", h2:"Finish, or begin again",
   p:"You either reach the outcome you named, or you re-contract around the next one. The work has an end, on purpose, so it stays honest about results."},

  {t:"content", eyebrow:"Part two", h2:"What the work asks of you",
   p:"The method only works if you bring three things. These are the commitments every founder makes going in.",
   bullets:[
     "Come prepared",
     "Reveal yourself",
     "Be unreasonable"]},

  {t:"phase", eyebrow:"Commitment one", h2:"Come prepared",
   p:"Before each session, reflect on the single most important thing to put on the table. The work goes where your honesty goes, so you choose the hardest true thing."},

  {t:"phase", eyebrow:"Commitment two", h2:"Reveal yourself",
   p:"Name your Presentation Layer out loud, and say what you have been withholding. The thing you least want to show is usually the door."},

  {t:"phase", eyebrow:"Commitment three", h2:"Be unreasonable",
   p:"Commit fully to the field work between sessions. Reasonable change gives reasonable results. The founders who shift are the ones who refuse the comfortable version."},

  {t:"content", eyebrow:"Part three", phase:"When the armor drops", h2:"Authenticity over polish",
   p:"When the armor comes down, the room changes before the numbers do.",
   bullets:[
     "You say the true thing first, and the team follows",
     "You hear the signal you used to miss",
     "You lead as yourself, which is the only version that scales"]},

  {t:"content", eyebrow:"Why me", h2:"A founder, coaching founders",
   bullets:[
     "Fifteen years as a founder and CEO across three companies",
     "Built, funded, scaled, and personally exited the last one",
     "A decade of meditation and mindfulness behind the method",
     "I nearly lost myself keeping the surface smooth. That is why this exists"]},

  {t:"content", eyebrow:"Honest fit", h2:"Who this is, and is not, for",
   p:"This is for founders ready to do real inner work, not for anyone looking for one more tactic to add to the pile.",
   bullets:[
     "For you if you want to lead as yourself and mean it",
     "Not for you if the surface is still working well enough to keep",
     "Best when the company is growing faster than you are"]},

  {t:"cta", eyebrow:"Your next step", h2:"Let's see if this is your work right now",
   p:"If any of this landed, the next step is a free discovery session. We will look at where you are, what you want, and whether Inside-Out coaching is the right fit.",
   step:"Schedule your free discovery session",
   disclaimer:"This masterclass is for educational purposes only. It shares a leadership development approach, not advice guaranteeing any specific business, financial, or personal outcome. Results vary by individual and effort. Nothing here is a promise of income or results.",
   brand:"Ryan Vaughn, Inside Out Leadership"}
];

const deck = document.getElementById("deck");
S.forEach((s, i) => {
  const el = document.createElement("section");
  el.className = "slide";
  let html = "";
  if (s.eyebrow) html += `<div class="eyebrow">${s.eyebrow}</div>`;
  if (s.phase && s.t === "content") html += `<div class="phase">${s.phase}</div>`;
  if (s.h1) html += `<h1>${s.h1}</h1>`;
  if (s.lead) html += `<p class="lead">${s.lead}</p>`;
  if (s.big) html += `<div class="big">${s.big}</div>`;
  if (s.h2) html += `<h2>${s.h2}</h2>`;
  if (s.p) html += `<p>${s.p}</p>`;
  if (s.sub) html += `<p class="sub">${s.sub}</p>`;
  if (s.bullets) html += "<ul>" + s.bullets.map(b => `<li>${b}</li>`).join("") + "</ul>";
  if (s.step) html += `<div><span class="cta-step">${s.step}</span></div>`;
  if (s.disclaimer) html += `<div class="disclaimer">${s.disclaimer}</div>`;
  if (s.brand) html += `<div class="brandline">${s.brand}</div>`;
  html += `<div class="foot">${i + 1} / ${S.length}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
