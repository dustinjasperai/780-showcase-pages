<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leading a High Performance Recruitment Team (Ross Clennett)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@500;700;900&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eaecf4;
    --panel:#ffffff;
    --ink:#2c2a5e;
    --rule:#343466;
    --accent:#d23855;
    --muted:#55546a;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#d8dbe8;color:var(--ink);font-family:'Lato',system-ui,Arial,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px}
  .slide{
    background:var(--bg);
    border:1px solid #d3d6e4;
    border-radius:10px;
    padding:64px;
    margin:0 0 26px;
    min-height:520px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 3px rgba(44,42,94,.08);
  }
  .eyebrow{font-family:'Roboto';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:20px}
  .part{color:var(--accent);font-family:'Roboto';font-weight:900;font-size:16px;letter-spacing:.14em;text-transform:uppercase;margin-bottom:14px}
  h1{font-family:'Roboto';font-weight:900;font-size:52px;line-height:1.05;color:var(--ink);margin-bottom:20px}
  h2{font-family:'Roboto';font-weight:700;font-size:38px;line-height:1.12;color:var(--ink);margin-bottom:18px}
  .kicker{font-family:'Roboto';font-weight:700;font-size:23px;color:var(--accent);margin-bottom:8px}
  .big{font-size:58px;font-family:'Roboto';font-weight:900;line-height:1.03;color:var(--ink);max-width:22ch;margin-bottom:22px}
  p{font-size:21px;line-height:1.5;color:var(--muted);max-width:42ch;margin-bottom:14px}
  p.lead{font-size:24px;color:var(--ink);max-width:44ch}
  .accentbar{width:64px;height:6px;background:var(--accent);border-radius:3px;margin-bottom:26px}
  ul{list-style:none;margin:10px 0 0}
  li{font-size:21px;line-height:1.45;color:var(--ink);padding-left:30px;position:relative;margin-bottom:16px;max-width:48ch}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:50%}
  .num{font-family:'Roboto';font-weight:900;font-size:18px;color:#fff;background:var(--ink);
    width:42px;height:42px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:18px}
  .foot{position:absolute;bottom:22px;left:64px;right:64px;display:flex;justify-content:space-between;
    font-family:'Roboto';font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--rule);opacity:.72}
  .cards{display:flex;gap:16px;margin-top:16px;flex-wrap:wrap}
  .card{background:var(--panel);border:1px solid #d3d6e4;border-radius:8px;padding:20px 22px;flex:1;min-width:220px}
  .card .k{font-family:'Roboto';font-weight:900;color:var(--accent);font-size:15px;letter-spacing:.1em;text-transform:uppercase;margin-bottom:8px}
  .card p{font-size:18px;margin:0;color:var(--ink)}
  .disclaimer{font-size:14px;color:var(--rule);max-width:54ch;margin-top:24px;line-height:1.45;opacity:.85}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass with Ross Clennett',
    h:'Leading a High Performance Recruitment Team',
    sub:'How an agency owner makes the shift from top biller to the leader a high performing team is built around.'},

  {t:'promise', eyebrow:'What you will leave with',
    h:'One hour. The shift most owners never quite make.',
    bullets:[
      'Why your best years on the desk can quietly work against you as a leader',
      'The split between billing, managing and leading, and how to protect it',
      'The expectations and coaching conversations a high performance team actually runs on']},

  {t:'content', eyebrow:'Who this is for',
    h:'Owners and team leaders of recruitment agencies.',
    body:'You own a small agency, or you lead a team inside a larger one. You are responsible for other people’s numbers now, not only your own. This hour is for you.'},

  {t:'content', eyebrow:'The trap',
    h:'You are still the top biller. And the boss.',
    body:'So you do both. You bill all week to hit the number, then lead in the gaps that are left. The team feels it. Good people plateau. And the harder you bill, the less there is of you to lead with.'},

  {t:'hook', big:'The best biller rarely becomes the best leader.',
    body:'The skills that made you brilliant on the desk are not the skills that build a team. Nobody tells you that on the way up.'},

  {t:'part', part:'Part One', h:'The player-coach squeeze.',
    body:'Why owning the biggest desk and leading the team pull against each other, and why willpower is not the fix.'},

  {t:'bullets', eyebrow:'What actually happens',
    h:'Leading becomes the thing you do last.',
    bullets:[
      'Billing is urgent and measured, so it always wins the day',
      'Leading is important but rarely urgent, so it slips to the gaps',
      'The team learns to wait for you instead of running to a standard',
      'You end up doing their hardest work for them, and calling it leading']},

  {t:'content', eyebrow:'The real cost',
    h:'A plateaued team is the most expensive thing you own.',
    body:'Not in one dramatic loss, but in the deals that never close, the good people who quietly leave, and the ceiling you keep hitting because the whole agency still runs through you.'},

  {t:'part', part:'Part Two', h:'How a high performance team is actually built.',
    body:'A high performance team is built from the people you hire, the expectations you set, and the coaching conversations you have. Five pieces.'},

  {t:'pillar', num:'1', kicker:'Billing v Managing v Leading',
    h:'Protect the split on purpose.',
    body:'The three jobs are different work, not one blurred job. We map where your week really goes, then protect the hours for leading so they stop getting eaten by the desk.'},

  {t:'pillar', num:'2', kicker:'The way we do things around here',
    h:'Make the standard explicit.',
    body:'Expectations, KPIs, accountability and feedback, written down and lived, so the team runs to a defined standard instead of guessing yours. Culture is what you make explicit and repeat.'},

  {t:'pillar', num:'3', kicker:'Hire for drive',
    h:'The four motivation competencies.',
    body:'Most hiring mistakes are motivation mistakes, not skill mistakes. We look at the four competencies that actually predict drive, so you build the team with people who move on their own.'},

  {t:'pillar', num:'4', kicker:'Coaching, not just training',
    h:'The GROW conversation.',
    body:'Training tells people what to do. Coaching helps them work it out and own it. The GROW structure, Goal, Reality, Options, Will, is how you coach on the job without taking the work back.'},

  {t:'pillar', num:'5', kicker:'The weekly one-on-one',
    h:'The KPI conversation that moves numbers.',
    body:'A short, structured weekly one-on-one that is about performance and the next week, not a status update. Done well, it is the single highest-leverage hour a leader has.'},

  {t:'part', part:'Part Three', h:'What changes when it works.',
    body:'The week stops running through you. The standard runs the team, and you get to lead it.'},

  {t:'cards', eyebrow:'The week of a leader who made the shift',
    h:'Fewer heroics. More performance.',
    cards:[
      {k:'Billing', p:'A protected, deliberate amount, not the whole week by default.'},
      {k:'Managing', p:'The standard and the KPIs do the chasing, so you do not have to.'},
      {k:'Leading', p:'Coaching conversations and weekly one-on-ones, in the calendar, every week.'}]},

  {t:'bullets', eyebrow:'Why listen to me on this',
    h:'Thirty five years in, and still obsessed with the craft.',
    bullets:[
      'Over three and a half decades in recruitment, as a recruiter, a leader of recruiters, and a coach',
      'Fellow of the RCSA and member of its Professional Practice Council',
      '2022 RCSA CEO Outstanding Contribution award',
      'Close to 1,000 weekly columns on recruitment and leadership since 2007']},

  {t:'cta', eyebrow:'Your next step',
    h:'Make the shift with a coach beside you.',
    body:'If this hour was useful, the Leadership Coaching for High Performance program is where we do the work together, over six sessions, on your own team and your own numbers.',
    cta:'Join Leadership Coaching for High Performance →',
    disclaimer:'This masterclass is educational. It shares frameworks and experience, not promises. Every agency and team is different, and no specific result, revenue or income outcome is guaranteed.'}
];

function el(tag, cls, html){const n=document.createElement(tag); if(cls) n.className=cls; if(html!=null) n.innerHTML=html; return n;}
function foot(n, right){const f=el('div','foot'); f.appendChild(el('span',null,'Ross Clennett')); f.appendChild(el('span',null,right)); n.appendChild(f);}

const deck = document.getElementById('deck');
S.forEach(function(s, i){
  const sl = el('section','slide'+(s.t==='cta'?' cta':''));
  const pg = (i===0) ? 'High Performance Recruitment Coach' : (s.t==='cta' ? 'High Performance Recruitment Coach' : String(i).padStart(2,'0'));
  if(s.eyebrow) sl.appendChild(el('div','eyebrow', s.eyebrow));
  if(s.part) sl.appendChild(el('div','part', s.part));
  if(s.num) sl.appendChild(el('div','num', s.num));
  if(s.kicker) sl.appendChild(el('div','kicker', s.kicker));
  if(s.t==='title'){ sl.appendChild(el('h1', null, s.h)); sl.appendChild(el('div','accentbar')); }
  else if(s.t==='hook'){ sl.appendChild(el('div','big', s.big)); }
  else if(s.h){ sl.appendChild(el('h2', null, s.h)); }
  if(s.sub) sl.appendChild(el('p','lead', s.sub));
  if(s.body) sl.appendChild(el('p','lead', s.body));
  if(s.bullets){ const ul=el('ul'); s.bullets.forEach(function(b){ ul.appendChild(el('li',null,b)); }); sl.appendChild(ul); }
  if(s.cards){ const row=el('div','cards'); s.cards.forEach(function(c){ const cd=el('div','card'); cd.appendChild(el('div','k',c.k)); cd.appendChild(el('p',null,c.p)); row.appendChild(cd); }); sl.appendChild(row); }
  if(s.cta) sl.appendChild(el('div','kicker', s.cta));
  if(s.disclaimer) sl.appendChild(el('p','disclaimer', s.disclaimer));
  foot(sl, pg);
  deck.appendChild(sl);
});
</script>
</body>
</html>
