<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where Strategy Becomes a Leadership Capability - The Better Strategy School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
/* ## Palette (traceable to brand.json): light scheme; accent = #032245 (their dominant
   brand navy, 29 uses); ink = #121212 (their body text). Type: Inter (their Inter Display
   face read). Motif: the one-page strategy canvas grid. Not the house chassis. */
:root{
  --bg:#ffffff;
  --panel:#f4f6f9;
  --rule:#d8dee8;
  --accent:#032245;
  --ink:#121212;
  --muted:#5a6675;
  --accent-tint:#eaeef4;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--accent);
  font-family:'Inter',system-ui,sans-serif;
  color:var(--ink);
  display:flex;align-items:center;justify-content:center;
  min-height:100vh;
}
#stage{
  width:min(96vw,1120px);
  aspect-ratio:16/9;
  background:var(--bg);
  position:relative;
  overflow:hidden;
  box-shadow:0 24px 80px rgba(3,34,69,.45);
  border-radius:6px;
}
.slide{
  position:absolute;inset:0;
  padding:64px 72px;
  display:none;
  flex-direction:column;
  background:var(--bg);
}
.slide.on{display:flex}
/* canvas motif: faint one-page grid */
.slide::after{
  content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(var(--rule) 1px,transparent 1px),linear-gradient(90deg,var(--rule) 1px,transparent 1px);
  background-size:56px 56px;opacity:.14;
}
.slide>*{position:relative;z-index:1}
.kicker{
  font-size:14px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;
  color:var(--accent);margin-bottom:20px;
}
h1{font-size:56px;line-height:1.04;font-weight:800;color:var(--accent);letter-spacing:-.02em;max-width:15ch}
h2{font-size:40px;line-height:1.08;font-weight:700;color:var(--ink);letter-spacing:-.015em;max-width:18ch}
.sub{font-size:22px;line-height:1.4;color:var(--muted);margin-top:24px;max-width:40ch;font-weight:400}
.lead{font-size:26px;line-height:1.42;color:var(--ink);max-width:34ch;font-weight:500}
.big{font-size:34px;line-height:1.24;color:var(--ink);max-width:26ch;font-weight:600}
.mt{margin-top:auto}
ul{list-style:none;margin-top:28px;display:flex;flex-direction:column;gap:16px;max-width:38ch}
li{font-size:21px;line-height:1.36;color:var(--ink);padding-left:26px;position:relative;font-weight:400}
li::before{content:"";position:absolute;left:0;top:11px;width:10px;height:10px;background:var(--accent);border-radius:2px}
.grid4{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:30px;max-width:760px}
.card{background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:22px 24px}
.card .n{font-size:13px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.card h3{font-size:23px;font-weight:700;color:var(--ink);margin-top:6px}
.card p{font-size:16px;line-height:1.4;color:var(--muted);margin-top:8px}
.steps{display:flex;gap:14px;margin-top:34px;flex-wrap:wrap}
.step{flex:1;min-width:200px;background:var(--panel);border:1px solid var(--rule);border-left:4px solid var(--accent);border-radius:8px;padding:22px}
.step .st{font-size:13px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--accent)}
.step h3{font-size:22px;margin-top:6px;color:var(--ink)}
.step p{font-size:16px;line-height:1.4;color:var(--muted);margin-top:8px}
.center{align-items:flex-start;justify-content:center}
.quotebar{border-left:5px solid var(--accent);padding-left:26px}
.foot{position:absolute;bottom:26px;left:72px;right:72px;display:flex;justify-content:space-between;font-size:13px;color:var(--muted);z-index:2}
.foot .brand{font-weight:700;color:var(--accent);letter-spacing:.02em}
.disc{font-size:14px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:52ch}
.cta-row{margin-top:30px;display:inline-flex;align-items:center;gap:14px}
.pill{background:var(--accent);color:#fff;font-size:19px;font-weight:600;padding:14px 26px;border-radius:999px}
.nav{position:fixed;bottom:18px;right:22px;display:flex;gap:10px;z-index:10}
.nav button{font-family:inherit;font-size:14px;font-weight:600;color:#fff;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.32);border-radius:6px;padding:8px 14px;cursor:pointer}
.count{position:fixed;bottom:24px;left:22px;color:rgba(255,255,255,.7);font-size:13px;font-weight:600;z-index:10}
@media(max-width:760px){
  .slide{padding:36px 34px}
  h1{font-size:34px}h2{font-size:26px}.lead{font-size:20px}.big{font-size:24px}
  .grid4{grid-template-columns:1fr}.foot{left:34px;right:34px}
}
</style>
</head>
<body>
<div id="stage"></div>
<div class="count" id="count"></div>
<div class="nav"><button onclick="go(-1)">Prev</button><button onclick="go(1)">Next</button></div>
<script>
const S=[
 {t:'title',
  kicker:'The Better Strategy School',
  h1:'Where Strategy Becomes a Leadership Capability',
  sub:'A working session for the leaders who set direction and answer for the outcome.'},

 {t:'promise',
  kicker:'What you leave with',
  h2:'Strategy you can practice on Monday, not a binder you file on Friday.',
  bullets:['A shared definition of strategy your whole team can use','The four capabilities that separate leaders who deliver strategy from leaders who only write it','A one-page way to hold your entire strategy where everyone can see it']},

 {t:'who',
  kicker:'Who this is for',
  h2:'You set direction and you are accountable for where it lands.',
  bullets:['C-suite executives and business unit heads','Senior functional leaders and strategy directors','Founders steering the next stage of growth']},

 {t:'trap',
  kicker:'The trap',
  big:'You ran the offsite. You built the deck. Six months later almost none of it is happening.',
  sub:'It is not a discipline problem. The plan was treated as the finish line when it was only the start.'},

 {t:'reframe',
  kicker:'The reframe',
  h1:'Strategy is not knowledge. It is a practiced capability.',
  sub:'Knowing the frameworks is not the same as being able to diagnose, choose, align, and adapt when the situation is live and moving.'},

 {t:'part',
  kicker:'Part One',
  h2:'Why good plans stall',
  bullets:['The plan assumes a world that stops moving. It does not.','Choices get deferred, so trade-offs never get made.','Everyone nods in the room, then optimizes for their own function.','No shared definition means every leader means something different by "strategy".']},

 {t:'lead',
  kicker:'The gap',
  lead:'The distance between a strategy that reads well and a strategy that happens is not more analysis. It is capability, built through repetition.'},

 {t:'part',
  kicker:'Part Two',
  h2:'The Better Strategy OS',
  sub:'Before capability comes a shared operating definition of strategy that works across any organization, so the whole team is playing the same game.',
  bullets:['One definition of what a strategy is and is not','A common language for ambition, choices, and trade-offs','A shared standard for what "good" looks like']},

 {t:'grid',
  kicker:'The four capabilities',
  h2:'What a leader who delivers strategy can actually do.',
  cards:[
   {n:'01',h:'Diagnosis',p:'Interpret complex, ambiguous situations with clarity before deciding.'},
   {n:'02',h:'Choice',p:'Make consequential decisions under uncertainty, and own the trade-offs.'},
   {n:'03',h:'Alignment',p:'Mobilize people around a shared intent so the strategy actually moves.'},
   {n:'04',h:'Adaptation',p:'Sustain strategic coherence as conditions change over time.'}]},

 {t:'grid',
  kicker:'Capability in depth',
  h2:'Diagnosis and Choice',
  cards:[
   {n:'Diagnosis',h:'See the real situation',p:'Separate the noise from the few forces that actually decide the outcome. Name the challenge before rushing to answers.'},
   {n:'Choice',h:'Decide, and give things up',p:'Strategy is what you say no to. Make the hard call while it still matters, not after the option has closed.'}]},

 {t:'grid',
  kicker:'Capability in depth',
  h2:'Alignment and Adaptation',
  cards:[
   {n:'Alignment',h:'Move people, not just slides',p:'Turn a decision into shared intent so every function pulls the same direction without a memo for every step.'},
   {n:'Adaptation',h:'Hold coherence while you change',p:'Adjust the moves as the world shifts without losing the through-line that makes it a strategy at all.'}]},

 {t:'steps',
  kicker:'The Strategy Launchpad',
  h2:'You practice on a real challenge, not a case study.',
  steps:[
   {s:'Define',h:'The challenge',p:'Frame the actual strategic problem in front of you.'},
   {s:'Design',h:'The strategy',p:'Shape the ambition, the where-to-compete, and the moves.'},
   {s:'Validate',h:'The logic',p:'Pressure-test the choices before you commit resources.'},
   {s:'Activate',h:'The plan',p:'Put it into motion with the people who own it.'}]},

 {t:'canvas',
  kicker:'The Business Strategy Canvas',
  h2:'Your whole strategy on one page.',
  sub:'Five dimensions everyone can see at once, so the strategy stops living in a drawer.',
  cells:['Ambition','Where to compete','The value logic','The enabling organization','Strategic moves']},

 {t:'lead',
  kicker:'The Strategy Paradoxes',
  lead:'Mastery is judgment across competing perspectives: growth and focus, speed and rigor, today and tomorrow. Real strategy holds the tension instead of pretending it away.'},

 {t:'part',
  kicker:'Part Three',
  h2:'When strategy actually moves',
  bullets:['Your leaders share one language for strategy and use it in the room','Choices get made and defended, not endlessly re-opened','The plan bends with the market and still points the same way','Strategy becomes something your team does, week after week']},

 {t:'why',
  kicker:'Why this approach',
  h2:'Built from 20+ years inside real strategy work.',
  sub:'Dr. Marc Sniukas has spent two decades advising C-suites and leadership teams across industries on designing strategy and building the capability to deliver it. The Better Strategy School turns that work into something your team can practice.'},

 {t:'steps',
  kicker:'The path',
  h2:'Three stages, one capability.',
  steps:[
   {s:'Foundations',h:'The Better Strategy OS',p:'A clear, shared definition of strategy.'},
   {s:'Practice',h:'The Strategy Launchpad',p:'Apply it to a live challenge of your own.'},
   {s:'Mastery',h:'The Strategy Paradoxes',p:'Develop judgment across competing demands.'}]},

 {t:'cta',
  kicker:'Your next step',
  h1:'Build strategy as a capability your team keeps.',
  sub:'Explore The Better Strategy School and enroll when you are ready, or join the next live executive masterclass.',
  disc:'This session is educational. It shares a method for building strategic capability; it is not a guarantee of any specific business or financial result. Outcomes depend on your own situation and execution.'}
];

const stage=document.getElementById('stage');
const count=document.getElementById('count');
let i=0;
function esc(s){return (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function foot(){return '<div class="foot"><span class="brand">The Better Strategy School</span><span>makebetterstrategy.com</span></div>'}
function render(){
  const s=S[i];let h='';
  if(s.kicker)h+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.h1)h+='<h1>'+esc(s.h1)+'</h1>';
  if(s.h2)h+='<h2>'+esc(s.h2)+'</h2>';
  if(s.big)h+='<div class="big quotebar">'+esc(s.big)+'</div>';
  if(s.lead)h+='<div class="lead quotebar">'+esc(s.lead)+'</div>';
  if(s.sub)h+='<div class="sub">'+esc(s.sub)+'</div>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+esc(b)+'</li>');h+='</ul>'}
  if(s.cards){h+='<div class="grid4">';s.cards.forEach(c=>h+='<div class="card"><div class="n">'+esc(c.n)+'</div><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p></div>');h+='</div>'}
  if(s.steps){h+='<div class="steps">';s.steps.forEach(c=>h+='<div class="step"><div class="st">'+esc(c.s)+'</div><h3>'+esc(c.h)+'</h3><p>'+esc(c.p)+'</p></div>');h+='</div>'}
  if(s.cells){h+='<div class="steps">';s.cells.forEach(c=>h+='<div class="step"><h3>'+esc(c)+'</h3></div>');h+='</div>'}
  if(s.disc)h+='<div class="disc">'+esc(s.disc)+'</div>';
  if(s.t==='cta')h+='<div class="cta-row"><span class="pill">Explore The Better Strategy School</span></div>';
  stage.innerHTML='<div class="slide on center">'+h+foot()+'</div>';
  count.textContent=(i+1)+' / '+S.length;
}
function go(d){i=Math.max(0,Math.min(S.length-1,i+d));render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(1);if(e.key==='ArrowLeft')go(-1)});
render();
</script>
</body>
</html>
