<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Soul of Sales — A Masterclass with Tiffany Peterson</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cardo:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdf6f4;      /* her warm pink-white body wash */
    --panel:#ffffff;
    --wash:#faeeea;    /* soft rose tint */
    --ink:#303030;     /* her body text color */
    --muted:#8a7e77;
    --rule:#e6d3cb;
    --accent:#d86584;  /* her dominant rose (65 uses) */
    --gold:#d6a25e;    /* her H1 gold (64 uses) */
    --head:'Cinzel', Georgia, serif;
    --body:'Cardo', Georgia, serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);
    display:flex;align-items:center;justify-content:center;overflow:hidden}
  .stage{width:100vw;height:100vh;position:relative}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;
    justify-content:center;padding:8vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .kicker{font-family:var(--head);font-size:clamp(12px,1.3vw,17px);font-weight:600;
    letter-spacing:.3em;text-transform:uppercase;color:var(--accent);margin-bottom:3vh}
  h1{font-family:var(--head);font-weight:600;line-height:1.08;letter-spacing:.01em;
    font-size:clamp(34px,5.4vw,76px);color:var(--ink);max-width:16ch}
  h1 .g{color:var(--gold)}
  h1 .r{color:var(--accent)}
  .sub{font-size:clamp(18px,2.1vw,30px);line-height:1.5;color:#574f4b;margin-top:4vh;
    max-width:30ch;font-weight:400}
  ul{list-style:none;margin-top:4vh;max-width:28ch}
  li{font-size:clamp(17px,1.9vw,27px);line-height:1.4;padding:1.4vh 0 1.4vh 2.2em;
    position:relative;color:#4a423e;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:'';position:absolute;left:0;top:2.1vh;width:1.1em;height:1.1em;
    border-radius:50%;background:var(--wash);box-shadow:inset 0 0 0 2px var(--accent)}
  .note{margin-top:4vh;font-size:clamp(13px,1.4vw,18px);color:var(--muted);
    font-style:italic;max-width:34ch}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(40px,8vw,120px);
    line-height:1.02;color:var(--ink)}
  /* lighthouse-beam motif */
  .beam{position:absolute;top:0;right:0;width:46vw;height:100%;pointer-events:none;overflow:hidden}
  .beam svg{position:absolute;right:-6vw;top:50%;transform:translateY(-50%)}
  .sec h1{font-size:clamp(40px,6.4vw,92px);max-width:18ch}
  .counter{position:absolute;bottom:3.4vh;left:9vw;font-family:var(--head);
    font-size:13px;letter-spacing:.28em;color:var(--muted)}
  .mark{position:absolute;bottom:3vh;right:9vw;font-family:var(--head);font-size:12px;
    letter-spacing:.26em;text-transform:uppercase;color:var(--accent)}
  .slide.sec{background:var(--wash)}
  .slide.title{background:
    radial-gradient(120% 90% at 85% 15%, #fbe6dd 0%, var(--bg) 55%)}
  .slide.cta{background:var(--ink);color:#fdf6f4}
  .slide.cta h1{color:#fdf6f4}
  .slide.cta .sub{color:#e9ddd8}
  .slide.cta .kicker{color:var(--gold)}
  .slide.cta .note{color:#b9aaa3}
  .hint{position:absolute;bottom:3.4vh;left:50%;transform:translateX(-50%);
    font-size:12px;color:var(--muted);letter-spacing:.14em}
  @media(max-width:640px){.beam{display:none}h1{max-width:100%}.sub,ul{max-width:100%}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const S=[
 {t:'title', k:'A Live Masterclass with Tiffany Peterson', h:'The Soul of <span class="r">Sales</span>', sub:'How to sell by serving, so growing your business finally feels like you.'},
 {t:'who', k:'Who this is for', h:'You love what you sell. You hate feeling salesy.', list:['Direct sellers and network marketers','Coaches and service providers','Anyone who grows through relationships, not cold pitching']},
 {t:'point', k:'The trap', h:'You were handed a script that was never built for you.', sub:'Chase. Pitch. Close. Follow up until they stop replying. It works against the one thing that makes you good at this: people already trust you.'},
 {t:'point', k:'The reframe', h:'The problem is not you. It is the <span class="r">model</span>.', sub:'Pushy selling does not fail because you are bad at sales. It fails because it asks you to stop being a human being for the length of the conversation.'},
 {t:'sec', k:'Part One', h:'Why "always be closing" breaks relationship sellers'},
 {t:'point', h:'Pressure is a tax on trust.', sub:'Every pushy ask spends the goodwill you built. The sale you force today can cost you the three referrals you would have earned.'},
 {t:'point', h:'Scripts make you sound like everyone else.', sub:'Your edge was always that you are not the pushy rep. The moment you borrow their words, you hand that edge away.'},
 {t:'point', h:'And it quietly burns you out.', sub:'Selling in a way that fights your values is exhausting. Most people do not quit because it stopped working. They quit because they could not stand doing it.'},
 {t:'sec', k:'Part Two', h:'The Lighthouse Principles: thrive from the inside out'},
 {t:'framework', k:'The approach', h:'Three pillars, worked together', list:['Self-Care: the energy and self-worth to show up fully','Success Habits: the daily disciplines that compound','Sales Training: a relationship-first way to make the ask'], note:'Most teaching picks one. Lasting results come from all three at once.'},
 {t:'framework', k:'The sales part', h:'Nourish Your <span class="r">Network</span>', sub:'Selling is not hunting strangers to pitch. It is serving the people already around you so well that buying from you becomes the obvious next step.'},
 {t:'framework', k:'The path', h:'The 5 Gates Sales System', sub:'A relationship-first progression from the first hello to enrolled. Each gate is a moment of genuine service, not a step closer to a hard close.'},
 {t:'point', k:'The habit', h:'Your productivity equals your paycheck.', sub:'Confidence is a muscle, and so is consistency. The daily reps you put into your own success habits show up directly in your results.'},
 {t:'sec', k:'Part Three', h:'When selling becomes serving, your business changes'},
 {t:'point', h:'You stop dreading the ask.', sub:'When the ask is an invitation to something you believe helps them, you make it cleanly. And more people say yes.'},
 {t:'point', h:'Your network starts selling for you.', sub:'Served people refer. The pipeline you were chasing quietly starts coming to you instead.'},
 {t:'point', k:'Why listen to me', h:'I set sales records before I taught any of this.', sub:'FranklinCovey, Rich Dad, Jack Canfield. Since 2010, through The Lighthouse Principles, I have coached direct sellers, coaches, and entrepreneurs to sell more without selling out.'},
 {t:'cta', k:'Your next step', h:'Ready to sell by serving?', sub:'If this is the way you have always wanted to grow, the next step is my coaching. Let us build your version of this together.', note:'This presentation is educational only. Individual results vary and are not guaranteed.'}
];
function beam(){return '<div class="beam"><svg width="520" height="520" viewBox="0 0 520 520" fill="none"><g opacity="0.5"><path d="M470 260 L120 90 L120 430 Z" fill="#d6a25e" opacity="0.12"/><path d="M470 260 L150 150 L150 370 Z" fill="#d86584" opacity="0.10"/></g><circle cx="470" cy="260" r="10" fill="#d6a25e"/><circle cx="470" cy="260" r="20" fill="none" stroke="#d86584" stroke-width="2" opacity="0.5"/></svg></div>';}
const stage=document.getElementById('stage');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+ (s.t==='sec'?'sec':s.t==='title'?'title':s.t==='cta'?'cta':'');
  let inner='';
  if(s.k) inner+='<div class="kicker">'+s.k+'</div>';
  inner+='<h1>'+s.h+'</h1>';
  if(s.sub) inner+='<div class="sub">'+s.sub+'</div>';
  if(s.list){inner+='<ul>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>';}
  if(s.note) inner+='<div class="note">'+s.note+'</div>';
  if(s.t==='title'||s.t==='framework') inner+=beam();
  inner+='<div class="counter">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  inner+='<div class="mark">The Lighthouse Principles</div>';
  d.innerHTML=inner;
  stage.appendChild(d);
});
let cur=0;const slides=document.querySelectorAll('.slide');
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));}
show(0);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='ArrowDown'||e.key===' '){show(cur+1);e.preventDefault();}
  if(e.key==='ArrowLeft'||e.key==='ArrowUp'){show(cur-1);}
});
stage.addEventListener('click',()=>show(cur+1));
const hint=document.createElement('div');hint.className='hint';hint.textContent='click or press the arrow keys';
document.body.appendChild(hint);setTimeout(()=>hint.remove(),4200);
</script>
</body>
</html>
