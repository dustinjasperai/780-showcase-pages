<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Integrated Approach to Complex Concussion — Natasha Wilch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f8; --panel:#ffffff; --ink:#1c1919; --muted:#6b6263;
    --accent:#e80a4d; --teal:#25cad2; --rule:#1c1919;
    --head:'Poppins',system-ui,sans-serif; --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid rgba(28,25,25,.10);border-radius:18px;
    padding:52px 54px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(28,25,25,.04),0 18px 40px -30px rgba(28,25,25,.35)}
  .kicker{font-family:var(--head);font-weight:600;font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:44px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.12;letter-spacing:-.01em}
  .sub{font-size:19px;line-height:1.5;color:var(--muted);margin-top:18px;max-width:40ch}
  p{font-size:18px;line-height:1.6;margin-top:16px;max-width:54ch}
  .big{font-family:var(--head);font-weight:700;font-size:38px;line-height:1.1;letter-spacing:-.01em}
  .accent{color:var(--accent)}
  ul{margin-top:22px;list-style:none}
  li{font-size:18px;line-height:1.5;padding:12px 0 12px 34px;position:relative;border-top:1px solid rgba(28,25,25,.08)}
  li:first-child{border-top:0}
  li::before{content:"";position:absolute;left:4px;top:19px;width:9px;height:9px;border-radius:2px;background:var(--accent)}
  .sys{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
  .sys span{font-family:var(--head);font-weight:600;font-size:15px;padding:9px 15px;border-radius:999px;
    border:1.5px solid var(--teal);color:var(--ink);background:rgba(37,202,210,.08)}
  .num{font-family:var(--head);font-weight:700;font-size:15px;color:var(--teal);letter-spacing:.12em;text-transform:uppercase}
  .steps{margin-top:24px;display:grid;gap:14px}
  .step{display:flex;gap:16px;align-items:baseline}
  .step b{font-family:var(--head);color:var(--accent);font-size:22px;min-width:28px}
  .quote{font-family:var(--head);font-weight:600;font-size:30px;line-height:1.2;letter-spacing:-.01em}
  .cred{margin-top:20px}
  .cred li::before{background:var(--teal)}
  .disc{font-size:13px;line-height:1.5;color:var(--muted);margin-top:26px;max-width:60ch}
  .cta-line{font-family:var(--head);font-weight:600;font-size:20px;color:var(--ink);margin-top:22px}
  .foot{position:fixed;right:14px;bottom:12px;font-family:var(--head);font-size:11px;letter-spacing:.1em;
    text-transform:uppercase;color:var(--muted);opacity:.8}
  @media(max-width:620px){.slide{padding:34px 24px;min-height:380px}h1{font-size:32px}h2{font-size:24px}.big{font-size:28px}}
</style>
</head>
<body>
<div id="deck"></div>
<div class="foot">Concussion Nerds · Natasha Wilch, PT</div>
<script>
const S = [
  {t:'title', cls:'', html:`<div class="kicker">A free masterclass for clinicians</div>
    <h1>The Integrated Approach to <span class="accent">Complex Concussion</span></h1>
    <div class="sub">Why your persistent clients are still symptomatic, and how to read the whole system to find the driver other clinics miss.</div>
    <div class="cta-line">with Natasha Wilch, Registered Physical Therapist</div>`},

  {t:'promise', cls:'', html:`<div class="kicker">What you walk out with</div>
    <h2>Ninety minutes from now, the complex case makes sense.</h2>
    <ul>
      <li>Why persistent symptoms linger long after the "3 days to heal" story said they should be gone.</li>
      <li>A way to read concussion as interacting systems, not a checklist of isolated tests.</li>
      <li>How to decide what to treat first, so you stop guessing at the start of every session.</li>
    </ul>`},

  {t:'who', cls:'', html:`<div class="kicker">Who this is for</div>
    <h2>The clinician who takes the cases nobody else will.</h2>
    <p>Physical therapists, chiropractors, athletic therapists and occupational therapists who already work with concussion, and who are tired of watching a complex client leave no better than they arrived.</p>
    <p>If concussion is a "tack on" to your practice, this is not for you. If you want it to become what you are known for, read on.</p>`},

  {t:'trap', cls:'', html:`<div class="kicker">The trap</div>
    <h2>Concussion care was a sixty minute lecture in your training.</h2>
    <p>Maybe it was glossed over entirely. Maybe it made it sound like everyone heals in three days. Then the continuing education courses buried you in information you could never integrate into a real session.</p>
    <p>So the hard cases pile up, and it is not your fault. You were never shown the whole picture.</p>`},

  {t:'reframe', cls:'', html:`<div class="kicker">The reframe</div>
    <div class="big">The problem was never your patient.</div>
    <p class="quote accent" style="margin-top:20px">It was the checklist.</p>
    <p>A concussion is a diffuse injury. It touches far more systems than any single protocol was built to catch. Cookie cutter plans stall because the real driver is sitting in a system the checklist never asked about.</p>`},

  {t:'part', cls:'', html:`<div class="num">Part one</div>
    <h2>Concussion is a multi-system injury.</h2>
    <p>One hit, many systems disrupted, and they feed back into each other. Treat one in isolation and the others keep the symptoms alive. This is why "where do I even begin" is the honest question for every complex case.</p>`},

  {t:'systems', cls:'', html:`<div class="kicker">The systems that stay stuck</div>
    <h2>Persistent concussion usually hides in one of these.</h2>
    <div class="sys">
      <span>Autonomics</span><span>Vestibular</span><span>Vision / ocular-motor</span>
      <span>Cervical spine</span><span>Somatosensory</span><span>Cognitive</span>
      <span>Affective / mood</span><span>Primitive reflexes</span>
    </div>
    <p>Seven interacting systems, plus the reflexive layer underneath. The skill is not testing all of them. It is reading how they talk to each other, and spotting the one driving the rest.</p>`},

  {t:'cost', cls:'', html:`<div class="kicker">What it costs</div>
    <h2>The dead end has two casualties.</h2>
    <ul>
      <li>The client who is told, again, that the scans are clean and there is nothing more to do.</li>
      <li>The clinician who starts to dread the complex case and quietly stops taking them.</li>
    </ul>
    <p>Both are fixable, and both change the day you can see the whole system at once.</p>`},

  {t:'part', cls:'', html:`<div class="num">Part two</div>
    <h2>The integrated read.</h2>
    <p>Every system runs through the same four lens sequence. Learn the sequence once and you can apply it to any presentation that walks in, no matter how far off the textbook it falls.</p>`},

  {t:'framework', cls:'', html:`<div class="kicker">The four lens sequence</div>
    <h2>How to read any system.</h2>
    <div class="steps">
      <div class="step"><b>1</b><div><b style="font-family:var(--head)">Neurophysiology.</b> How the system works when it is healthy, so you know what "off" even looks like.</div></div>
      <div class="step"><b>2</b><div><b style="font-family:var(--head)">Impact after concussion.</b> How the injury changes that system, and how that shows up in your client's day.</div></div>
      <div class="step"><b>3</b><div><b style="font-family:var(--head)">Assessment.</b> Multi-system detective work to find the root cause, not a box ticking exercise.</div></div>
      <div class="step"><b>4</b><div><b style="font-family:var(--head)">Treatment.</b> An individualized, integrated plan built around the driver you found.</div></div>
    </div>`},

  {t:'pillar', cls:'', html:`<div class="num">Pillar</div>
    <h2>Assessment is detective work.</h2>
    <p>You are not running every test you know. You are following the thread: which system started this, which ones are just downstream noise, and what the pattern across all of them is trying to tell you.</p>`},

  {t:'pillar', cls:'', html:`<div class="num">Pillar</div>
    <h2>Know what to treat first.</h2>
    <p>Sequence is everything. Prioritize the driver, manage the client's expectations, and build a session that moves the needle instead of flaring everything at once. You never have to open with a guess again.</p>`},

  {t:'pillar', cls:'', html:`<div class="num">Pillar</div>
    <h2>Challenge without crashing.</h2>
    <p>Recovery lives inside the challenge and recovery cycle. Push too little and nothing changes. Push too far and you set them back a week. Learn where that line sits for each client and how to move it over time.</p>`},

  {t:'pillar', cls:'', html:`<div class="num">Pillar</div>
    <h2>Safety is the substrate.</h2>
    <p>How far you can challenge a client depends on how safe they feel with you. Rapport, trust and a felt sense of safety are not soft extras, they are what makes the clinical work possible at all.</p>`},

  {t:'grey', cls:'', html:`<div class="kicker">How I practice</div>
    <div class="quote">I lead with both the logical, detective science brain and the intuitive, body led one.</div>
    <p>Evidence based, and willing to work in the grey, because every client who walks in is an individual and the research only ever describes the average. That blend is what turns a stuck case into a plan.</p>`},

  {t:'part', cls:'', html:`<div class="num">Part three</div>
    <h2>A stuck case, read the other way.</h2>
    <p>A client three months out: dizzy in the grocery aisle, foggy by noon, a neck that never settled. The checklist calls it anxiety. The integrated read finds a vestibular and cervical driver feeding an autonomic load, and a first session that finally gives them a quiet hour.</p>`},

  {t:'outcome', cls:'', html:`<div class="kicker">What becomes possible</div>
    <h2>For you, not just the client.</h2>
    <ul>
      <li>Confidence walking into the case you used to refer out.</li>
      <li>The creativity to build a plan instead of reaching for a protocol.</li>
      <li>A reputation as the clinician in your area who takes the hard concussion, and the demand that follows it.</li>
    </ul>`},

  {t:'whyme', cls:'', html:`<div class="kicker">Why listen to me</div>
    <h2>Natasha Wilch, PT.</h2>
    <ul class="cred">
      <li>Registered Physical Therapist since 2011; over a decade in practice, seven of them devoted to concussion.</li>
      <li>Founder of Symphony Brain Performance, where clients travel from across North America for concussion rehabilitation.</li>
      <li>Founder of Concussion Nerds, mentoring clinicians to bring this integrated approach into their own clinics.</li>
      <li>Canada's Entrepreneur of the Year, BC Physiotherapist Leadership Award.</li>
    </ul>`},

  {t:'cta', cls:'', html:`<div class="kicker">Where to go from here</div>
    <h2>Make the complex case your edge.</h2>
    <p>If this is the way you want to practice, the next step is a conversation. Book a call to see whether the Concussion Nerds mentorship is the right fit for where you are taking your practice.</p>
    <div class="cta-line accent">Book a call to connect at natashawilch.com</div>
    <div class="disc">Educational content only. This masterclass teaches a clinical approach; it is not medical advice and does not replace your own professional judgement or your regulatory scope of practice. No specific clinical outcome, caseload, income, or result is guaranteed. Individual results vary.</div>`}
];

const deck = document.getElementById('deck');
for (const s of S){
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html;
  deck.appendChild(d);
}
</script>
</body>
</html>
