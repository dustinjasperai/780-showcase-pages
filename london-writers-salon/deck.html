<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Writers' Hour Method - London Writers' Salon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F1E6; --panel:#EFE6D5; --rule:#D8C9B0; --ink:#2B2420;
    --muted:#6B5F52; --accent:#C65D3B; --deep:#9E4428;
    --head:'Spectral',Georgia,serif; --body:'DM Sans',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;
    -webkit-font-smoothing:antialiased}
  #deck{}
  .slide{min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:9vh 8vw;border-bottom:1px solid var(--rule);position:relative}
  .eyebrow{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);
    font-weight:600;margin-bottom:22px}
  .num{position:absolute;top:5vh;right:8vw;font-family:var(--head);font-size:15px;color:var(--muted)}
  h1{font-family:var(--head);font-weight:500;font-size:clamp(34px,6vw,68px);line-height:1.05;
    letter-spacing:-.01em;max-width:16ch}
  h2{font-family:var(--head);font-weight:500;font-size:clamp(28px,4.4vw,48px);line-height:1.1;
    max-width:18ch}
  .lede{font-size:clamp(18px,2.1vw,24px);color:var(--muted);margin-top:26px;max-width:30ch;
    font-weight:400}
  .lede.big{font-family:var(--head);font-style:italic;color:var(--ink);font-size:clamp(22px,3vw,34px);
    max-width:24ch}
  p.body{font-size:clamp(17px,1.7vw,20px);margin-top:20px;max-width:34ch;color:var(--ink)}
  .kls{color:var(--accent);font-weight:600}
  .strike{text-decoration:line-through;text-decoration-color:var(--accent);color:var(--muted)}
  ul{list-style:none;margin-top:30px;max-width:40ch}
  li{position:relative;padding-left:30px;margin:16px 0;font-size:clamp(16px,1.7vw,20px)}
  li:before{content:'';position:absolute;left:0;top:11px;width:12px;height:2px;background:var(--accent)}
  .pillar{display:flex;gap:22px;align-items:baseline;margin-top:30px;max-width:40ch}
  .pillar .n{font-family:var(--head);font-size:clamp(30px,4vw,54px);color:var(--accent);line-height:1}
  .pillar .txt h3{font-family:var(--head);font-weight:600;font-size:clamp(20px,2.4vw,28px)}
  .pillar .txt p{color:var(--muted);margin-top:6px;font-size:clamp(15px,1.6vw,18px);max-width:28ch}
  .title-slide{background:var(--panel)}
  .cta-slide{background:var(--ink);color:var(--bg)}
  .cta-slide .eyebrow{color:var(--accent)}
  .cta-slide h2{color:var(--bg)}
  .cta-slide .lede{color:#D8CBB8}
  .cta-btn{display:inline-block;margin-top:34px;background:var(--accent);color:#fff;
    font-weight:600;padding:16px 30px;border-radius:2px;text-decoration:none;font-size:18px}
  .disc{margin-top:40px;font-size:13px;color:#9b8f7d;max-width:44ch;line-height:1.6}
  .brandline{font-family:var(--head);font-style:italic;color:var(--muted);margin-top:18px;font-size:18px}
  @media(max-width:640px){.slide{padding:8vh 7vw}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:"A live masterclass", h:"The Writers' Hour Method",
   lede:"How to build a writing habit that finally sticks."},

  {t:'who', eyebrow:"Who this is for", h:"You have a drawer full of unfinished drafts.",
   lede:"Not because you lack talent. Because the writing keeps not happening."},

  {t:'trap', eyebrow:"The pattern", h:"You've tried everything to make yourself write.",
   body:"The 5am alarm. The productivity app. The expensive bootcamp. A new notebook, a fresh start, a serious promise. It holds for a week, then life closes back over it."},

  {t:'reframe', eyebrow:"The real problem", h:"The problem was never discipline.",
   ledebig:"Writers who show up every day are not more disciplined than you. They just stopped trying to do it alone."},

  {t:'part', eyebrow:"Part one", h:"Why willpower fails writers"},

  {t:'content', h:"Writing alone is a fight with resistance.",
   body:"Every morning the blank page asks you to choose it over everything easier. On willpower alone, most days you lose. That is not weakness. That is what solitary effort does to anyone."},

  {t:'content', h:"Intensity burns out. Consistency compounds.",
   body:"The ambitious plan, four hours every day, collapses by Thursday. A modest commitment you can actually keep, one honest hour, done often, is what turns into a finished book."},

  {t:'part', eyebrow:"Part two", h:"The Writers' Hour Method"},

  {t:'intro', h:"One repeatable hour, built on four moves.",
   lede:"The ritual that turned nine people on a lockdown call into a daily practice for thousands of writers."},

  {t:'pillar', eyebrow:"The method", n:"01", title:"Intention",
   p:"Before a word, you name what you are working on today in one line. Starting is the hardest part, so we make starting tiny."},

  {t:'pillar', eyebrow:"The method", n:"02", title:"The focused hour",
   p:"Fifty five minutes of real writing. No inbox, no feed, no edits. Just the work, protected, with a clear beginning and end."},

  {t:'pillar', eyebrow:"The method", n:"03", title:"Company",
   p:"You write alongside other writers, in the same hour, on purpose. Their quiet presence carries you on the days your own motivation runs out."},

  {t:'pillar', eyebrow:"The method", n:"04", title:"Celebration",
   p:"You end by sharing what you moved forward. The win, named out loud, is what makes you want to come back tomorrow."},

  {t:'content', h:"The hour is a time, not a mood.",
   body:"You stop waiting to feel inspired. You show up to a standing appointment with your own work, and the words come because you did."},

  {t:'part', eyebrow:"Part three", h:"What a writing life looks like"},

  {t:'content', h:"A streak you can see.",
   body:"One honest hour, most days. The pages add up faster than you expect. The practice stops being something you chase and becomes something you have."},

  {t:'content', h:"From habit to finished work.",
   body:"Once the showing up is handled, the craft has somewhere to live. The draft gets finished, the query gets sent, the book gets written, because the writer kept arriving."},

  {t:'why', eyebrow:"Why us", h:"We built the room we needed.",
   body:"London Writers' Salon began in 2019. When lockdown cancelled our in-person events, we put the writing hour online. Nine people came on day one. It has not stopped since, four times a day, across four time zones.",
   brand:"Parul Bavishi and Matt Trinetti, founders"},

  {t:'reframe', eyebrow:"The whole idea", h:"You don't need more willpower.",
   ledebig:"You need a room. Come write in it."},

  {t:'cta', eyebrow:"Start tomorrow morning", h:"Your first hour is free.",
   lede:"Join a live Writers' Hour, then stay for the community that keeps you writing.",
   btn:"Join Writers' Hour",
   disc:"Educational content only. Building a writing practice takes time and individual effort; results vary from writer to writer and no particular outcome is promised or guaranteed."}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const sec=el('section','slide'+(s.t==='title'?' title-slide':'')+(s.t==='cta'?' cta-slide':''));
  sec.appendChild(el('div','num',String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')));
  if(s.eyebrow) sec.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.t==='title'){ sec.appendChild(el('h1',null,s.h)); if(s.lede)sec.appendChild(el('div','lede',s.lede)); }
  else if(s.t==='part'){ sec.appendChild(el('h2',null,s.h)); }
  else if(s.t==='pillar'){
    const row=el('div','pillar'); row.appendChild(el('div','n',s.n));
    const tx=el('div','txt'); tx.appendChild(el('h3',null,s.title)); tx.appendChild(el('p',null,s.p));
    row.appendChild(tx); sec.appendChild(el('h2',null,'')); sec.lastChild.remove(); sec.appendChild(row);
  }
  else if(s.t==='cta'){
    sec.appendChild(el('h2',null,s.h));
    if(s.lede)sec.appendChild(el('div','lede',s.lede));
    const b=el('a','cta-btn',s.btn); b.href='https://londonwriterssalon.com/'; sec.appendChild(b);
    if(s.disc)sec.appendChild(el('div','disc',s.disc));
  }
  else {
    sec.appendChild(el('h2',null,s.h));
    if(s.ledebig)sec.appendChild(el('div','lede big',s.ledebig));
    if(s.lede)sec.appendChild(el('div','lede',s.lede));
    if(s.body)sec.appendChild(el('p','body',s.body));
    if(s.brand)sec.appendChild(el('div','brandline',s.brand));
  }
  deck.appendChild(sec);
});
</script>
</body>
</html>
