<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Scaling Beyond the Founder, a masterclass with Keith Fairhurst</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,500;0,600;0,700;1,600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef5f9;
    --panel:#fbfdfe;
    --rule:#d5e2ea;
    --ink:#3f4a49;
    --muted:#657079;
    --accent:#1094c0;
    --accent2:#1fb3de;
    --head:'Poppins',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:960px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:64px 74px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 22px 56px rgba(63,74,73,.10);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* motif: a three-tier ascent (Building, Leading, Governing), quiet stepped bars */
  .slide::before{content:'';position:absolute;top:34px;left:74px;width:44px;height:26px;
    background:
      linear-gradient(var(--accent),var(--accent)) left bottom/11px 12px no-repeat,
      linear-gradient(var(--accent),var(--accent)) center bottom/11px 19px no-repeat,
      linear-gradient(var(--accent2),var(--accent2)) right bottom/11px 26px no-repeat}
  .slide::after{content:'';position:absolute;right:-70px;bottom:-70px;width:240px;height:240px;
    background:
      linear-gradient(var(--rule),var(--rule)) left bottom/33% 40% no-repeat,
      linear-gradient(var(--rule),var(--rule)) center bottom/33% 66% no-repeat,
      linear-gradient(var(--rule),var(--rule)) right bottom/33% 100% no-repeat;
    opacity:.5}
  .kick{font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:700;margin:14px 0 22px}
  h1{font-family:var(--head);font-weight:700;font-size:56px;line-height:1.06;margin:0 0 18px;letter-spacing:-.015em}
  h2{font-family:var(--head);font-weight:600;font-size:39px;line-height:1.12;margin:0 0 20px;letter-spacing:-.01em}
  h3{font-family:var(--head);font-weight:600;font-size:28px;line-height:1.15;margin:0 0 12px}
  p{font-size:23px;line-height:1.5;color:var(--muted);margin:0 0 14px;max-width:47ch}
  .lead{font-size:27px;color:var(--ink)}
  .em{color:var(--accent);font-style:italic}
  ul{margin:14px 0 0;padding:0;list-style:none;position:relative;z-index:1}
  li{font-size:22px;line-height:1.4;color:var(--ink);padding:16px 0 16px 44px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:22px;width:18px;height:18px;border-radius:5px;
    border:3px solid var(--accent)}
  li b{font-weight:600}
  li span{display:block;color:var(--muted);font-size:18px;margin-top:4px;font-weight:400}
  .big{font-family:var(--head);font-size:104px;line-height:1.02;font-weight:700;letter-spacing:-.025em}
  .strike{color:transparent;-webkit-text-stroke:2px #3f4a4955;position:relative}
  .strike::after{content:'';position:absolute;left:-2%;right:-2%;top:52%;height:5px;background:var(--accent);transform:rotate(-2deg)}
  .row{display:flex;gap:20px;margin-top:20px;flex-wrap:wrap;position:relative;z-index:1}
  .cell{flex:1;min-width:220px;background:var(--bg);border:1px solid var(--rule);border-radius:12px;padding:24px 26px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:24px;font-weight:700;margin-bottom:8px}
  .cell p{font-size:17px;margin:0}
  .steps{counter-reset:s;margin-top:18px}
  .steps li{padding-left:58px}
  .steps li::before{counter-increment:s;content:counter(s);border:none;background:var(--accent);color:#fff;
    width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;
    font-family:var(--body);font-weight:700;font-size:16px;top:16px;left:6px}
  .who{font-size:19px;color:var(--muted);margin-top:26px;max-width:60ch;position:relative;z-index:1}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:26px;max-width:64ch;line-height:1.45}
  .ctaline{font-size:24px;color:var(--ink);margin-top:8px;position:relative;z-index:1}
  .ctaline b{color:var(--accent)}
  .pres{font-size:19px;color:var(--muted);margin-top:26px}
  .pres b{color:var(--ink);font-weight:600}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 30px}h1{font-size:36px}h2{font-size:28px}.big{font-size:60px}p,li{font-size:19px}}
</style>
</head>
<body>
<div class="hint">ScaleUp Partners · masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'Scaling Beyond the Founder',p:'Why the ceiling on your growth is not sales or marketing. It is governance.',pres:'With <b>Keith Fairhurst</b>, ScaleUp Partners'},
 {t:'promise',kick:'What you will leave with',h:'Three things, in one live hour.',li:[['Where the real ceiling on a founder-run firm sits','Almost never where owners think it does.'],['The three tiers that lift it','Building, Leading and Governing, and why owners stall at the first.'],['The first governance move you can make this quarter','One decision, taken out of your hands on purpose.']]},
 {t:'audience',kick:'Who this is for',h:'You have built something that works. Now everything runs through you.',p:'SME founders and owner-leaders whose business is growing, but where every meaningful decision, hire and sign-off still lands on the founder\'s desk.',who:'<b>The trap:</b> you add people and revenue, and somehow you get busier, because more of the business means more of it routing back to you.'},
 {t:'reframe',kick:'The reframe',big1:'A sales problem.',big2:'Actually a <span class="em">governance</span> problem.',p:'When growth stalls, owners reach for more leads or more hustle. Often the real limit is that the business cannot make a good decision without the founder in the room.'},
 {t:'part',kick:'Part one',h:'Why a business cannot outgrow its founder.'},
 {t:'point',kick:'The core problem',h:'Every decision routed to you is a ceiling.',p:'If the business only moves as fast as you can review it, your calendar becomes the speed limit for the whole company. Growth does not remove that limit, it exposes it.'},
 {t:'point',kick:'The core problem',h:'You cannot simply hire your way out.',p:'Without structure, more people just create more decisions that flow back up to you. Headcount without governance multiplies the founder bottleneck, it does not relieve it.'},
 {t:'framework',kick:'The core problem',h:'Two ways a business makes decisions.',row:[['Founder-dependent','The owner is the final answer. Speed, quality and risk all sit in one head. It works until it caps out.'],['Governed','Clear roles, boards and accountability let good decisions happen without the founder present.']],p:'This masterclass is about moving from the first to the second, deliberately.'},
 {t:'part',kick:'Part two',h:'The three tiers of scaling.'},
 {t:'lenses',kick:'The GIANT Journey',h:'Building, Leading, Governing.',li:[['Building','Get the foundations right: people, strategy, execution and cash.'],['Leading','Grow the vision, talent and culture that turn effort into results.'],['Governing','Use risk discipline, sustainability and sound decision rights to compound value.']]},
 {t:'point',kick:'The pattern',h:'Most owners stop at Building.',p:'They systemise operations and tighten cash, then plateau. The Leading and Governing tiers, the ones that let the business run without them, never get installed.'},
 {t:'point',kick:'The distinctive idea',h:'Good governance is not bureaucracy. It is leverage.',p:'Independent boards, clear accountability and disciplined decision-making are not red tape. They are the mechanism that lets a private firm make bigger decisions, faster, with less of it depending on you.'},
 {t:'point',kick:'The distinctive idea',h:'Governing is where value compounds.',p:'A firm that can decide, allocate capital and manage risk without its founder is worth more and breaks less. That is institutional readiness, and it is built on purpose, not by accident.'},
 {t:'cycle',kick:'The playbook',h:'How to install governance that lets the business decide.',steps:['Name the decisions that only you make today','Write down who should own each one instead','Put a simple accountability rhythm around them','Add outside challenge: an advisor or an independent board seat','Review against risk and long-term value, not just this quarter'],p:'Five moves. Each one takes a decision off your desk without losing control of it.'},
 {t:'part',kick:'Part three',h:'What a founder-independent firm looks like.'},
 {t:'looks',kick:'The outcome',h:'The business decides without you in the room.',li:[['Good decisions happen without your sign-off','You set direction and standards, not every answer.'],['The firm becomes institutionally ready','Investable, saleable and durable, because it does not depend on one person.'],['You lead instead of operate','Your time goes to the few decisions only a founder should make.']]},
 {t:'whyme',kick:'Why ScaleUp Partners',h:'An independent partner built for this stage.',li:[['We work alongside founders and leadership teams','An independent, experienced partnership, not a course you watch alone.'],['The GIANT Journey','A tiered path through Building, Leading and Governing GIANTS for SMEs across Southern Africa.'],['A governance-led, evidence-based approach','Clarity, alignment and sustainable scale, with a strategy that stands up to reality.']]},
 {t:'cta',kick:'Your next step',h:'Ready to scale beyond yourself?',ctas:['<b>Start the GIANT Journey</b> and build the structure that lets your firm grow past you.','<b>Begin with Building GIANTS</b>, the 12-month foundation for people, strategy, execution and cash.'],disc:'This masterclass is educational. It shares frameworks and approaches for scaling and governing a private business; it is not advice for your specific situation and is not a guarantee of any particular financial result. Outcomes vary with the business, the market and the work put in.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.steps){h+=`<h2>${s.h}</h2><ul class="steps">`+s.steps.map(x=>`<li>${x}</li>`).join('')+`</ul>`+(s.p?`<p style="margin-top:20px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
