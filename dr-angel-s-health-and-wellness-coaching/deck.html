<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Start With the Parent — a masterclass with Dr. Angel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Mulish:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4f2ec;
    --panel:#eceae4;
    --ink:#2f3b31;
    --accent:#214b25;
    --accent2:#e7b64e;
    --deep:#004054;
    --rule:#cfd4c6;
    --head:'Newsreader',Georgia,serif;
    --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 120px}
  .slide{background:transparent;border-bottom:1px solid var(--rule);padding:58px 0 54px;min-height:62vh;display:flex;flex-direction:column;justify-content:center}
  .slide:last-child{border-bottom:none}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:600;font-size:clamp(34px,6vw,62px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(26px,4.4vw,42px);line-height:1.08;letter-spacing:-.01em}
  .sub{font-family:var(--head);font-style:italic;font-size:clamp(18px,2.6vw,25px);color:var(--deep);margin-top:16px;line-height:1.3}
  p.body{font-size:clamp(16px,2.1vw,19px);line-height:1.6;max-width:62ch;margin-top:20px;color:#3a463c}
  ul{list-style:none;margin-top:26px;display:grid;gap:14px;max-width:70ch}
  li{font-size:clamp(16px,2.1vw,19px);line-height:1.5;padding-left:26px;position:relative}
  li::before{content:"";position:absolute;left:0;top:.62em;width:12px;height:2px;background:var(--accent)}
  .part h1{color:var(--accent)}
  .partnum{font-family:var(--head);font-size:16px;color:var(--accent2);font-weight:600;letter-spacing:.08em;margin-bottom:10px}
  .pillarname{font-family:var(--head);font-weight:600;font-size:clamp(28px,5vw,48px);color:var(--deep)}
  .pillarno{font-family:var(--body);font-weight:700;color:var(--accent2);font-size:14px;letter-spacing:.16em;margin-bottom:14px}
  .grid6{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:30px;max-width:72ch}
  .cell{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:18px 16px}
  .cell b{font-family:var(--head);font-weight:600;font-size:19px;color:var(--accent);display:block;margin-bottom:4px}
  .cell span{font-size:14px;color:#56604f;line-height:1.35}
  .note{margin-top:26px;font-size:14px;color:#6a7364;max-width:60ch;line-height:1.5}
  .cta h1{color:var(--accent)}
  .ctastep{font-family:var(--head);font-size:clamp(18px,2.6vw,24px);color:var(--deep);margin-top:20px;line-height:1.35}
  .disclaimer{margin-top:34px;font-size:12.5px;color:#7b8373;max-width:64ch;line-height:1.5;border-top:1px solid var(--rule);padding-top:16px}
  .badge{display:inline-block;font-family:var(--body);font-weight:700;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--bg);background:var(--accent);padding:6px 12px;border-radius:999px;margin-bottom:22px}
  @media(max-width:620px){.grid6{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap" id="wrap"></div>
<script>
const S = [
  {t:'title', badge:'A live masterclass with Dr. Angel', title:'Start With the Parent',
   sub:'The six-pillar reset for new and expecting families, from a board-certified pediatrician.'},

  {t:'who', kicker:'Who this is for', title:'You are the parent everyone forgot to coach.',
   body:'Busy professionals, working parents, and parents-to-be who have read every book about the baby and almost nothing about themselves. If you are running your family on an empty tank, this hour is for you.'},

  {t:'trap', kicker:'The trap', title:'You optimized everything for the baby.',
   body:'The nursery, the feeding schedule, the sleep course. Meanwhile your own sleep, food, movement, and calm quietly fell off the list. It feels responsible. It is actually the thing holding the whole house back.'},

  {t:'reframe', kicker:'A harder truth', title:'Your child\'s health has a ceiling.',
   sub:'And the ceiling is you.',
   body:'Children borrow their regulation, their habits, and their sense of safety from the adult raising them. A depleted parent is not a character flaw. It is the single most upstream health variable in the home, and almost no one treats it that way.'},

  {t:'part', partnum:'Part One', title:'The Core Problem'},

  {t:'content', kicker:'The depletion spiral', title:'Tired decisions compound.',
   body:'Short sleep lowers your patience, which raises stress, which wrecks your food choices, which steals more sleep. Each night the baseline drops a little. You are not failing. You are stuck in a loop that no amount of baby-fixing can break.'},

  {t:'content', kicker:'Why the baby-fix stalls', title:'Fixing the child does not refill the parent.',
   body:'A better-sleeping baby helps. It does not restore the parent who spent a year running on fumes. The programs in your feed all point at the child. The parent, the actual engine of the home, is left to cope.'},

  {t:'part', partnum:'Part Two', title:'The Six Pillars'},

  {t:'framework', kicker:'The method', title:'Six pillars, yours first.',
   body:'This is the frame I use with every family. We do not start with the baby. We start with the six levers that set a parent\'s baseline, and we move one at a time.',
   cells:[['Sleep','the foundation'],['Nutrition','fuel that lasts'],['Movement','energy back'],['Stressors','less needless load'],['Toxins','a cleaner home'],['Happiness','actually felt']]},

  {t:'pillar', pillarno:'Pillar 01', pillarname:'Sleep',
   body:'Sleep is the foundation of physical health and social-emotional well being, for the parent as much as the child. We protect a floor of parent sleep first, with real boundaries around the late-night phone and the shared load, because everything downstream depends on it.'},

  {t:'pillar', pillarno:'Pillar 02', pillarname:'Nutrition',
   body:'Food is not about a diet, it is about not crashing at 3pm. Iron, protein, and steady fuel keep oxygen and energy flowing to the organs doing the parenting, starting with your brain. We build defaults a tired person can keep.'},

  {t:'pillar', pillarno:'Pillar 03', pillarname:'Movement',
   body:'Not a program you will quit. A small, repeatable dose of movement that gives energy back instead of taking it, folded into a day that already has no spare hours.'},

  {t:'pillar', pillarno:'Pillar 04', pillarname:'Stressors',
   body:'We name the avoidable loads and cut them. Evidence shows repetition strengthens learning, so I ask the same question of a household: which of these stresses actually earns its place, and which can simply go?'},

  {t:'pillar', pillarno:'Pillar 05', pillarname:'Toxins',
   body:'Pragmatic prevention, not fear. The handful of changes in the home and routine that lower real risk, chosen by a pediatrician, so you can stop worrying about the other hundred.'},

  {t:'pillar', pillarno:'Pillar 06', pillarname:'Happiness',
   body:'Joy is a health pillar, not a reward for finishing the list. We build small, felt moments back into the week on purpose, because a parent who feels like themselves raises children who feel safe.'},

  {t:'part', partnum:'Part Three', title:'What a Reset Looks Like'},

  {t:'content', kicker:'One week', title:'One pillar at a time, in a real life.',
   body:'We do not overhaul everything on Monday. We pick the pillar with the most leverage for you right now, make one change you can actually keep, and let it carry the next. By the end, the six fit together into a rhythm that is yours, not the baby\'s schedule.'},

  {t:'why', kicker:'Why me', title:'A pediatrician who turned the lens around.',
   body:'I am Dr. Angelika Rampal, board-certified in pediatrics and trained in integrative medicine, with over two decades caring for children and the families raising them, and three of my own. I spent years helping parents fix the child. The families who actually changed were the ones who started with themselves.'},

  {t:'content', kicker:'Even earlier', title:'The healthiest home starts before the baby.',
   body:'If you are still planning, the six pillars are a preconception advantage, not damage control. The earlier a parent builds their own baseline, the more there is to give when the baby arrives. That is the whole idea behind The Unplanned Parent.'},

  {t:'cta', badge:'Your next step', title:'Work the six pillars with me.',
   ctastep:'If this reframe landed, the coaching is where we turn it into your own plan, pillar by pillar. Reach out through drangel.com to start.',
   disclaimer:'This masterclass is educational and is not medical advice for your specific situation. No health or life result is guaranteed, and individual results vary. For personal medical concerns, consult your own physician.'}
];

function el(tag, cls, html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const wrap = document.getElementById('wrap');
S.forEach(s=>{
  const d = el('section','slide '+s.t);
  if(s.badge) d.appendChild(el('span','badge',s.badge));
  if(s.kicker) d.appendChild(el('div','kicker',s.kicker));
  if(s.partnum) d.appendChild(el('div','partnum',s.partnum));
  if(s.pillarno) d.appendChild(el('div','pillarno',s.pillarno));
  if(s.pillarname) d.appendChild(el('div','pillarname',s.pillarname));
  if(s.title){ const h = el(s.t==='title'?'h1':'h2',null,s.title); d.appendChild(h); }
  if(s.sub) d.appendChild(el('div','sub',s.sub));
  if(s.body) d.appendChild(el('p','body',s.body));
  if(s.cells){
    const g = el('div','grid6');
    s.cells.forEach(c=>{ const cell=el('div','cell'); cell.appendChild(el('b',null,c[0])); cell.appendChild(el('span',null,c[1])); g.appendChild(cell); });
    d.appendChild(g);
  }
  if(s.ctastep) d.appendChild(el('div','ctastep',s.ctastep));
  if(s.note) d.appendChild(el('div','note',s.note));
  if(s.disclaimer) d.appendChild(el('div','disclaimer',s.disclaimer));
  wrap.appendChild(d);
});
</script>
</body>
</html>
