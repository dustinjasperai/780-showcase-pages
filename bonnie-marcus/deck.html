<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Politics of Promotion — a masterclass with Bonnie Marcus</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Mulish:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf3ee; --panel:#fffdfb; --rule:#eaddd3;
    --ink:#2b2b2b; --muted:#6a655d; --accent:#ec6233; --accent2:#0f7c8c;
    --head:'Montserrat',system-ui,sans-serif; --body:'Mulish',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:16px;
    padding:52px 56px;margin:22px 0;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.02)}
  .kick{font-family:var(--head);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:800;font-size:33px;line-height:1.14;letter-spacing:-.01em}
  h3{font-family:var(--head);font-weight:700;font-size:22px;margin-bottom:8px}
  p{font-size:18px;color:var(--ink);margin-top:14px;max-width:62ch}
  p.lead{font-size:21px}
  .muted{color:var(--muted)}
  .big{font-size:30px;font-family:var(--head);font-weight:700;line-height:1.2}
  ul{margin:18px 0 0 0;max-width:64ch}
  li{list-style:none;font-size:18px;padding:12px 0 12px 34px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:4px;top:19px;width:14px;height:3px;background:var(--accent);border-radius:2px}
  .num{font-family:var(--head);font-weight:800;color:var(--accent2);font-size:15px;letter-spacing:.1em}
  .title-cover h1{font-size:58px}
  .title-cover .by{margin-top:26px;font-family:var(--head);font-weight:600;color:var(--muted);font-size:16px}
  .part{background:var(--accent);color:#fff;border-color:var(--accent)}
  .part h2{color:#fff}.part .kick{color:#ffe6da}
  .cta h2{margin-bottom:6px}
  .disc{margin-top:28px;font-size:13px;color:var(--muted);border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .pg{position:fixed;left:0;top:0;height:4px;background:var(--accent);width:0;z-index:9}
  .count{text-align:center;font-family:var(--head);color:var(--muted);font-size:13px;margin-top:10px}
</style>
</head>
<body>
<div class="pg" id="pg"></div>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title-cover', html:`
    <div class="kick">A live masterclass</div>
    <h1>The Politics of Promotion</h1>
    <p class="lead">Why great work is not enough, and what actually gets high-achieving women ahead and keeps them there.</p>
    <div class="by">With Bonnie Marcus, author of The Politics of Promotion and Not Done Yet</div>`},

  {t:'promise', html:`
    <div class="kick">What you will leave with</div>
    <h2>A clear read on how promotion decisions really get made, and a plan to be in that conversation.</h2>
    <ul>
      <li>Why your results alone have not been enough, and what is actually being weighed.</li>
      <li>The difference between a mentor and a sponsor, and how to earn the one that matters.</li>
      <li>A way to name your value out loud without feeling like you are bragging.</li>
    </ul>`},

  {t:'who', html:`
    <div class="kick">Who this is for</div>
    <h2>The woman who does excellent work and keeps watching other people get the title.</h2>
    <p class="muted">You are capable, respected, and reliable. You have been told your time will come. And you have watched someone with a louder voice or a better-placed ally move up ahead of you.</p>`},

  {t:'trap', html:`
    <div class="kick">The trap</div>
    <h2>You were told that if you keep your head down and deliver, you will be recognized.</h2>
    <p>So you did. You over-delivered. You said yes. You assumed the work would speak for itself. That advice was not wrong exactly. It was just incomplete, and the missing half is what this hour is about.</p>`},

  {t:'reframe', html:`
    <div class="kick">The hard truth</div>
    <h1>Promotion decisions are made in rooms you are not in.</h1>
    <p class="lead">Performance gets you considered. Politics gets you chosen. Not the ugly kind of politics. The kind that is really about relationships, visibility, and who is willing to say your name when it counts.</p>`},

  {t:'part', cls:'part', html:`<div class="kick">Part one</div><h2>The core problem</h2>`},

  {t:'stall', html:`
    <div class="kick">Why strong women stall</div>
    <h2>The higher you go, the less it is about the work.</h2>
    <p>Early on, competence gets you promoted. Past a certain level, everyone in the room is competent. Now the decision turns on trust, sponsorship, and whether the decision-makers can picture you in the role. If no one is shaping that picture for you, it gets shaped without you.</p>`},

  {t:'currency', html:`
    <div class="kick">The real currency</div>
    <h2>Relationships and advocacy are not a nice-to-have. They are the mechanism.</h2>
    <ul>
      <li>The people who know you are as important as the skills you have.</li>
      <li>Decisions about you happen whether or not you are advocating for yourself.</li>
      <li>Being excellent and being invisible is the most common and most costly combination.</li>
    </ul>`},

  {t:'part', cls:'part', html:`<div class="kick">Part two</div><h2>The Political Toolkit</h2>`},

  {t:'p1', html:`
    <div class="num">Move 01</div>
    <h3>Read the political landscape</h3>
    <p>Map your organization the way it actually works, not the org chart. Who holds real influence, who the decision-makers listen to, and where you currently sit in that picture. You cannot navigate a room you have not honestly looked at.</p>`},

  {t:'p2', html:`
    <div class="num">Move 02</div>
    <h3>Mentor versus sponsor</h3>
    <p>A mentor talks to you. A sponsor advocates for you in the rooms where decisions get made. Most women are over-mentored and under-sponsored. This move is how you tell the difference, and how you earn a sponsor who will spend their capital on your name.</p>`},

  {t:'p3', html:`
    <div class="num">Move 03</div>
    <h3>The Mirror: know your value</h3>
    <p>Before you can ask anyone to back you, you have to be able to say what you are worth in plain, specific terms. The Mirror is the exercise that turns a vague sense of being good at your job into a value proposition you can state with evidence.</p>`},

  {t:'p4', html:`
    <div class="num">Move 04</div>
    <h3>Self-promotion without self-doubt</h3>
    <p>Self-promotion is not bragging. It is making your contribution visible to the people who decide. We cover how to claim your work in a way that feels like you, so that the room already knows what you bring before any decision is on the table.</p>`},

  {t:'p5', html:`
    <div class="num">Move 05</div>
    <h3>Avoid the blindsides</h3>
    <p>The painful surprises, the reorg you did not see coming, the colleague who got there first, are usually visible in advance if you are reading the signals. This move is about staying ahead of the politics instead of being caught by it.</p>`},

  {t:'part', cls:'part', html:`<div class="kick">Part three</div><h2>What changes when you work the politics</h2>`},

  {t:'shift', html:`
    <div class="kick">The shift</div>
    <h2>From excellent and invisible, to excellent and represented.</h2>
    <p>Nothing about your standards changes. What changes is that the right people can now picture you in the next role, someone is willing to advocate for you, and you can say why you deserve it without flinching. That is when great work finally gets the title it earned.</p>`},

  {t:'ndy', html:`
    <div class="kick">And if you are over 50</div>
    <h2>Not done yet.</h2>
    <p>Experience is not a ceiling, it is leverage, once you stop treating age as a liability. The same toolkit works, with your track record as the asset. Reposition your experience as value, build a visibility plan, and claim your power at any age.</p>`},

  {t:'why', html:`
    <div class="kick">Why listen to me</div>
    <h2>I made it to the C-suite from an entry-level role, and I have spent years helping women do the same.</h2>
    <ul>
      <li>Former CEO of a ServiceMaster company and VP of sales at national firms.</li>
      <li>Author of The Politics of Promotion and Not Done Yet.</li>
      <li>The Political Toolkit has helped hundreds of women get promoted in competitive, male-dominated industries.</li>
    </ul>`},

  {t:'recap', html:`
    <div class="kick">Your next step</div>
    <h2>You now know what the work alone was never going to tell you.</h2>
    <p>Reading the landscape, earning a sponsor, naming your value, and making your contribution visible are learnable. The women who move up are not louder or luckier. They are represented. The next move is deciding to build that on purpose.</p>`},

  {t:'cta', cls:'cta', html:`
    <div class="kick">Work with me</div>
    <h2>Build your own promotion strategy.</h2>
    <p class="lead">If you want help applying the Political Toolkit to your own situation, let's talk. In a coaching consultation we map where you are, where you want to be, and the relationships and moves that get you there.</p>
    <p class="big" style="color:var(--accent);margin-top:22px">Book a coaching consultation at bonniemarcusleadership.com</p>
    <div class="disc">This masterclass is educational. No income, role, promotion, or result is guaranteed. Outcomes vary with your situation, effort, and organization. Bonnie Marcus and Bonnie Marcus Leadership provide coaching and education, not employment or promotion decisions.</div>`}
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const d = document.createElement('section');
  d.className = 'slide ' + (s.cls||'');
  d.innerHTML = s.html + '<div class="count">'+(i+1)+' / '+S.length+'</div>';
  deck.appendChild(d);
});
const pg = document.getElementById('pg');
addEventListener('scroll',()=>{const h=document.documentElement;const p=h.scrollTop/(h.scrollHeight-h.clientHeight||1);pg.style.width=(p*100)+'%';});
</script>
</body>
</html>
