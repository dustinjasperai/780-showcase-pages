<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Animated U Masterclass — Rich Magallanes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Paytone+One&family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f0f0f;        /* brand dominant ground (brand.json 42 uses) */
    --panel:#16161a;     /* one notch up from ground */
    --rule:#2a2a30;
    --ink:#f4f1ec;
    --muted:#a7a29b;
    --accent:#fa7b00;    /* brand signature header orange (brand.json) */
    --teal:#237faa;      /* brand secondary teal (brand.json) */
    --display:'Paytone One',system-ui,sans-serif;  /* their H1 face */
    --body:'Montserrat',system-ui,sans-serif;       /* their body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 48px;margin:0 0 22px;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:var(--body);font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-size:46px;line-height:1.05;margin-bottom:18px}
  h2{font-family:var(--display);font-size:34px;line-height:1.1;margin-bottom:16px}
  .lead{font-size:20px;color:var(--ink);max-width:62ch}
  .sub{font-size:18px;color:var(--muted);max-width:60ch;margin-top:10px}
  p.body{font-size:18px;color:var(--ink);max-width:62ch;margin-top:14px}
  ul{margin:18px 0 0 0;list-style:none;max-width:62ch}
  li{font-size:18px;padding:10px 0 10px 30px;position:relative;color:var(--ink);border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:18px;width:12px;height:12px;border-radius:3px;background:var(--accent)}
  .big{font-family:var(--display);font-size:40px;line-height:1.08;color:var(--ink)}
  .big .hl{color:var(--accent)}
  .quote{font-family:var(--display);font-size:32px;line-height:1.15;color:var(--ink);max-width:24ch}
  .teal{color:var(--teal)}
  .pill{display:inline-block;font-family:var(--body);font-weight:700;font-size:13px;
    color:var(--bg);background:var(--accent);border-radius:999px;padding:6px 14px;margin-bottom:18px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;margin-top:22px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:20px}
  .card h3{font-family:var(--display);font-size:22px;color:var(--accent);margin-bottom:8px}
  .card p{font-size:15px;color:var(--muted)}
  .disc{font-size:13px;color:var(--muted);margin-top:22px;max-width:62ch;line-height:1.5}
  .cta{font-size:20px;color:var(--ink);margin-top:10px}
  .cta b{color:var(--accent)}
  .foot{font-family:var(--body);font-size:12px;color:var(--muted);position:absolute;right:26px;bottom:18px;letter-spacing:.08em}
  @media(max-width:640px){.slide{padding:34px 24px;min-height:360px}h1{font-size:34px}h2{font-size:26px}.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:'Animated U Masterclass',h:'Get the Show in Your Head Made',lead:'The inside roadmap from idea to greenlit series, from someone who sat on the other side of the table.',sub:'With Rich Magallanes · 25 years running SpongeBob, TMNT, and Dora'},
  {t:'promise',kicker:'The promise',h:'In the next hour',lead:'I am going to show you why great animated ideas die in a drawer, and the three part system I used across 25 years in the room to move an idea from your head toward a real yes.',bullets:['The one belief that separates creators who move from creators who wait','Mindset, skillset, and mechanics, and why skipping one stalls the whole project','How a show actually travels from idea to greenlight, gate by gate']},
  {t:'who',kicker:'Who this is for',h:'You have the idea. You just do not have the map.',bullets:['You are a creator, writer, or animator with a series in your head','You have pitched, or you are terrified to pitch, and are not sure which is worse','You are waiting to be discovered, picked, or given permission','You keep polishing the bible instead of moving the project']},
  {t:'trap',kicker:'The trap',h:'Talent is not what gets a show made.',lead:'The most gifted people I worked with are not the ones whose shows got on air. Talent gets you in the room. Something else gets you greenlit, and almost nobody teaches it.'},
  {t:'reframe',kicker:'The reframe',big:true,h:'<span class="hl">It is on me.</span>',lead:'I grew up on welfare with no roadmap. I learned the only thing I control is my response. I am not a product of my circumstances. I am a product of my responses. That one shift is where every career I have watched take off actually started.'},
  {t:'part',kicker:'Part one',h:'Why great ideas die in the drawer',lead:'Three quiet killers, and none of them are about talent. We are going to take them one at a time.'},
  {t:'killer',kicker:'Killer one',h:'Waiting for permission',lead:'Nobody is coming to knock on your door and tell you it is your turn. The door-knock fantasy is the single most expensive habit in this business. The people who get made are the ones who decided it was already their job before anyone agreed.'},
  {t:'killer',kicker:'Killer two',h:'Precious, not passionate',lead:'You guard the idea so tightly that you cannot take a note, bring in a partner, or hear a hard truth. Precious feels like love for the work. From across the table it looks like someone who will be impossible to produce.'},
  {t:'killer',kicker:'Killer three',h:'No mechanics',lead:'You do not know how a show actually moves from pitch to production, so you stall at the very first door and call it bad luck. The pipeline is not a mystery. It is a sequence, and it can be learned.'},
  {t:'statement',kicker:'The core problem',big:true,h:'The industry does not owe you a roadmap.',lead:'So I am going to hand you mine. It comes in three parts: mindset, skillset, and mechanics. Inspiration alone has never gotten a single show made.'},
  {t:'framework',kicker:'The framework',h:'Mindset + Skillset + Mechanics',lead:'The three parts of Animated U. Skip one and the project stalls. Together they are how an idea becomes a series.',cards:[['Mindset','It is on me. Ownership before the title, responsibility when it stalls, initiative when the door is closed.'],['Skillset','The craft that survives the room, and the person who can take a note without taking it personally.'],['Mechanics','How a show actually moves: idea, pitch, development, greenlight, production, and who decides at each gate.']]},
  {t:'pillar',kicker:'Pillar one · Mindset',h:'Ownership is the unlock',quote:'Instability becomes adaptability. Adaptability becomes bravery. Responsibility becomes freedom.',lead:'Ownership is not pressure. It is the only lever you actually hold. The creators who move take responsibility before anyone hands them the title.'},
  {t:'pillar',kicker:'Pillar two · Skillset',h:'Be passionate, not precious',lead:'Passion is what makes the work good. Precious is what makes it die in notes. Hold your idea with conviction and an open hand at the same time, because the people who can be collaborated with are the people who get to keep working.'},
  {t:'pillar',kicker:'Pillar three · Mechanics',h:'Motion beats perfection',lead:'A moving project attracts help. A perfect project sitting in a drawer attracts nothing. You do not need the bible finished. You need to understand the pipeline well enough to take the next real step toward a decision-maker.'},
  {t:'mechanics',kicker:'The mechanics, plainly',h:'How a show gets to yes',lead:'Every greenlight I have been part of moved through the same gates. Knowing them is the difference between a pitch that lands and one that confuses the room.',bullets:['Idea: the one sentence a busy executive can repeat to their boss','Pitch: built for the person across the table, not for you','Development: proving the world has more than one episode in it','Greenlight: the business case, not just the creative one','Production: protecting the vision while 100 people touch it']},
  {t:'looks',kicker:'What changes',h:'The week you stop waiting',lead:'You take the next real step this week instead of polishing for another year. You walk into the room owning the outcome, and you can hear a hard note without flinching. That creator gets a second meeting. That is where shows actually start.'},
  {t:'why',kicker:'Why me',h:'I sat on the other side of the table',lead:'I spent 25 years as a creator, showrunner, and executive. As SVP of Current Series and Production at Nickelodeon I helped run SpongeBob SquarePants, Teenage Mutant Ninja Turtles, The Fairly OddParents, and Danny Phantom, and I am Executive Producer and Showrunner on Dora. I have been the person who says yes, and the person who gets told no. I am handing you both views.'},
  {t:'cta',kicker:'Your next step',h:'Come build it with me',cta:'This is the work we do inside <b>Animated U</b>: the community, the Weekly Mind Meld, and direct consulting for serious creators ready to move. If you have a show in your head, do not leave it there.',cta2:'Join Animated U and take the next real step on your idea.',disc:'Educational content only, shared for learning purposes. No income, placement, or result is guaranteed. Results vary and depend on your own effort and circumstances.'}
];
function esc(x){return x==null?'':x}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');el.className='slide';
  let h='';
  if(s.kicker)h+='<div class="kicker">'+esc(s.kicker)+'</div>';
  if(s.pill)h+='<span class="pill">'+esc(s.pill)+'</span>';
  if(s.big)h+='<div class="big">'+esc(s.h)+'</div>';
  else if(s.h)h+='<h1>'+esc(s.h)+'</h1>';
  if(s.quote)h+='<div class="quote teal">&ldquo;'+esc(s.quote)+'&rdquo;</div>';
  if(s.lead)h+='<p class="lead">'+esc(s.lead)+'</p>';
  if(s.sub)h+='<p class="sub">'+esc(s.sub)+'</p>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+esc(b)+'</li>');h+='</ul>';}
  if(s.cards){h+='<div class="grid3">';s.cards.forEach(c=>h+='<div class="card"><h3>'+esc(c[0])+'</h3><p>'+esc(c[1])+'</p></div>');h+='</div>';}
  if(s.cta)h+='<p class="cta">'+s.cta+'</p>';
  if(s.cta2)h+='<p class="cta"><b>'+esc(s.cta2)+'</b></p>';
  if(s.disc)h+='<div class="disc">'+esc(s.disc)+'</div>';
  h+='<div class="foot">Animated U · '+(i+1)+' / '+S.length+'</div>';
  el.innerHTML=h;deck.appendChild(el);
});
</script>
</body>
</html>
