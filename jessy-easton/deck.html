<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Writing the Hard Story Without Leaving Yourself</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Spectral:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#f3efe9;
    --panel:#ffffff;
    --panel-warm:#faf7f2;
    --rule:#e4ddd2;
    --ink:#293047;
    --ink-display:#1a1f2d;
    --ink-soft:#4a5068;
    --accent:#ce8464;
  }
  html,body{height:100%;}
  body{background:var(--ink-display);font-family:'Spectral',Georgia,serif;color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  #stage{position:relative;width:100vw;height:100vh;max-width:1280px;max-height:720px;}
  .slide{position:absolute;inset:0;background:var(--bg);display:none;flex-direction:column;justify-content:center;padding:84px 96px;}
  .slide.on{display:flex;}
  .kicker{font-family:'Spectral',serif;font-style:italic;font-size:18px;color:var(--accent);letter-spacing:.02em;margin-bottom:22px;}
  .part{font-family:'Spectral',serif;font-size:14px;letter-spacing:.32em;text-transform:uppercase;color:var(--accent);margin-bottom:28px;}
  h1{font-family:'Playfair Display',serif;font-weight:700;font-size:60px;line-height:1.08;color:var(--ink-display);letter-spacing:-.01em;max-width:16ch;}
  h2{font-family:'Playfair Display',serif;font-weight:600;font-size:40px;line-height:1.15;color:var(--ink-display);max-width:20ch;margin-bottom:26px;}
  .lead{font-size:26px;line-height:1.5;color:var(--ink-soft);max-width:30ch;margin-top:30px;}
  .body{font-size:23px;line-height:1.6;color:var(--ink);max-width:34ch;}
  .body.soft{color:var(--ink-soft);}
  .big{font-family:'Playfair Display',serif;font-weight:600;font-size:46px;line-height:1.2;color:var(--ink-display);max-width:24ch;}
  ul{list-style:none;margin-top:14px;}
  li{font-size:23px;line-height:1.45;color:var(--ink);padding:14px 0 14px 34px;position:relative;border-bottom:1px solid var(--rule);max-width:34ch;}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:24px;width:14px;height:1.5px;background:var(--accent);}
  .num{font-family:'Playfair Display',serif;font-size:19px;color:var(--accent);margin-bottom:18px;}
  .quote{font-family:'Playfair Display',serif;font-weight:500;font-style:normal;font-size:44px;line-height:1.22;color:var(--ink-display);max-width:22ch;}
  .quote .mk{color:var(--accent);}
  .card{background:var(--panel-warm);border:1px solid var(--rule);border-left:3px solid var(--accent);padding:30px 34px;max-width:40ch;margin-top:26px;}
  .card .t{font-family:'Playfair Display',serif;font-size:25px;color:var(--ink-display);margin-bottom:10px;}
  .card .d{font-size:20px;line-height:1.5;color:var(--ink-soft);}
  .two{display:flex;gap:26px;margin-top:28px;flex-wrap:wrap;}
  .two .col{flex:1;min-width:240px;background:var(--panel);border:1px solid var(--rule);padding:26px 28px;}
  .two .col .h{font-family:'Spectral',serif;font-style:italic;font-size:17px;color:var(--accent);margin-bottom:12px;}
  .two .col .x{font-size:21px;line-height:1.45;color:var(--ink);}
  .cta-h{font-family:'Playfair Display',serif;font-weight:700;font-size:54px;line-height:1.1;color:var(--ink-display);max-width:18ch;}
  .cta-steps{margin-top:30px;font-size:24px;line-height:1.5;color:var(--ink);max-width:32ch;}
  .cta-steps b{color:var(--accent);font-weight:600;}
  .site{font-family:'Spectral',serif;font-style:italic;font-size:21px;color:var(--ink-soft);margin-top:30px;}
  .disclaimer{position:absolute;left:96px;right:96px;bottom:30px;font-size:13px;line-height:1.4;color:#8a8577;font-family:'Spectral',serif;}
  .credit{margin-top:34px;font-family:'Spectral',serif;font-style:italic;font-size:19px;color:var(--ink-soft);}
  #nav{position:fixed;bottom:22px;right:28px;font-family:'Spectral',serif;font-size:14px;color:#b7b0a2;z-index:10;letter-spacing:.08em;}
  #dots{position:fixed;bottom:24px;left:28px;display:flex;gap:7px;z-index:10;}
  #dots i{width:7px;height:7px;border-radius:50%;background:#555b6e;display:block;}
  #dots i.on{background:var(--accent);}
  .hint{position:fixed;top:22px;right:28px;font-family:'Spectral',serif;font-size:13px;color:#6a7084;z-index:10;}
  @media(max-width:720px){.slide{padding:48px 34px;}h1{font-size:38px;}h2{font-size:28px;}.quote,.cta-h{font-size:32px;}.lead,.body,li,.big{font-size:19px;}}
</style>
</head>
<body>
<div id="stage"></div>
<div id="dots"></div>
<div id="nav"></div>
<div class="hint">arrow keys to move</div>
<script>
const S = [
  {t:'title', kicker:'A somatic writing masterclass with Jessy Easton',
   h1:'Writing the Hard Story Without Leaving Yourself',
   lead:'How to stay with yourself on the page when the memory asks a lot of you.'},

  {t:'lead', part:'What you will leave with',
   h2:'By the end of this hour',
   list:['A way to approach a charged memory without the page slamming shut','Language for what is actually happening in your body when you write it','The first steps of a practice you can keep returning to']},

  {t:'lead', part:'Who this is for',
   h2:'For the woman carrying a story she cannot quite write',
   body:'You have the memory. You may even have pages. What you do not have is a way to stay in the room with it long enough to tell the truth.'},

  {t:'quote', quote:'You know what happened. You know it in your bones. So why does the page keep <span class="mk">closing</span>?'},

  {t:'lead', part:'The real reason', h2:'This is not writer&rsquo;s block, and it is not a craft problem',
   body:'Most of us do not struggle to write because we do not know the story. We struggle because our bodies learned that remembering and reliving were the same thing.'},

  {t:'part', part:'Part one', big:'When the nervous system senses threat, the writing does not open. It contracts.'},

  {t:'lead', h2:'So we stay on the surface',
   body:'Every time you reach for the page, another part of you reaches for protection. You stay on the skin of the story, because going deeper feels unsafe. The truth waits at the marrow, and the body will not let you travel there by force.'},

  {t:'quote', quote:'The work begins <span class="mk">before</span> the writing does.'},

  {t:'part', part:'Part two', big:'The method: you do not have to leave yourself in order to tell the truth.'},

  {t:'pillar', num:'Pillar one', h2:'Ground before you write',
   card:{t:'Begin in the body',d:'We regulate the nervous system first, slowly, so the memory can be approached from a place of enough safety that the page stays open instead of contracting.'}},

  {t:'pillar', num:'Pillar two', h2:'Notice when you have left yourself',
   card:{t:'And practice the return',d:'Charged memory pulls us out of the room. The skill is catching the moment you have gone, and finding your way back to yourself while you keep writing.'}},

  {t:'pillar', num:'Pillar three', h2:'Skin, flesh, bone, marrow',
   card:{t:'Layer by layer, not all at once',d:'Hard stories rarely unfold in one sitting. We move from the skin of the story through the flesh to the bone and finally the marrow, slowly, over time, through guided invitations.'}},

  {t:'pillar', num:'Pillar four', h2:'Close the work so it does not follow you',
   card:{t:'Leave the room on purpose',d:'We learn to end a session cleanly, so the writing stays on the page and does not trail you through the rest of your day.'}},

  {t:'lead', part:'The container', h2:'Ritual, relationship, return',
   body:'None of this is a one-time breakthrough. It is a practice you build inside a steady, intimate circle, where the same people witness your story over time and you are not carrying the work alone.'},

  {t:'part', part:'Part three', big:'What staying with yourself makes possible.'},

  {t:'two', part:'Before and after',
   cols:[{h:'White-knuckling',x:'Push harder, flood, shut the laptop, avoid the page for weeks, call it block.'},{h:'Staying in relationship',x:'Ground, write a little, notice, return, close the work, and come back tomorrow still intact.'}]},

  {t:'lead', part:'Why me', h2:'I did not learn this from a craft book',
   body:'I grew up in the Mojave Desert in a meth lab, and writing saved my life. The One Who Leaves became a Substack bestseller; my work has appeared in The Rumpus and Good River Review, and an essay was nominated for the Pushcart Prize. Everything here is how I actually write the hardest material of my life.'},

  {t:'try', part:'Try it now', h2:'A small invitation',
   body:'Feet on the floor. One slow breath. Write one true sentence about something you usually circle, then stop. Notice you are still here. That noticing is the whole practice, and it is enough for today.'},

  {t:'cta', kicker:'Where to go from here',
   ctah:'Keep writing the hard thing, in a room built for it.',
   steps:'<b>The Threshold</b> opens again in late January, a four-week somatic writing cohort for women ready to stop white-knuckling the hard story.<br><br>Or step into <b>The Inner Room</b>, the ongoing community, or explore <b>The Deep Work</b> one to one.',
   site:'jessyeaston.com',
   disclaimer:'This masterclass is for educational purposes and reflects one writer&rsquo;s practice and experience. It is not therapy or a substitute for mental health care. No particular outcome or result is guaranteed. Results vary from person to person.'},
];

const stage=document.getElementById('stage');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
function esc(s){return s||''}
S.forEach((s,i)=>{
  const d=document.createElement('div');d.className='slide';d.dataset.i=i;
  let h='';
  if(s.kicker)h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.part)h+=`<div class="part">${s.part}</div>`;
  if(s.h1)h+=`<h1>${s.h1}</h1>`;
  if(s.lead)h+=`<div class="lead">${s.lead}</div>`;
  if(s.h2)h+=`<h2>${s.h2}</h2>`;
  if(s.quote)h+=`<div class="quote">&ldquo;${s.quote}&rdquo;</div>`;
  if(s.big)h+=`<div class="big">${s.big}</div>`;
  if(s.num)h+=`<div class="num">${s.num}</div>`;
  if(s.body)h+=`<div class="body">${s.body}</div>`;
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.card)h+=`<div class="card"><div class="t">${s.card.t}</div><div class="d">${s.card.d}</div></div>`;
  if(s.cols){h+='<div class="two">';s.cols.forEach(c=>h+=`<div class="col"><div class="h">${c.h}</div><div class="x">${c.x}</div></div>`);h+='</div>';}
  if(s.ctah)h+=`<div class="cta-h">${s.ctah}</div>`;
  if(s.steps)h+=`<div class="cta-steps">${s.steps}</div>`;
  if(s.site)h+=`<div class="site">${s.site}</div>`;
  if(s.disclaimer)h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  d.innerHTML=h;stage.appendChild(d);
  const dot=document.createElement('i');dot.dataset.i=i;dots.appendChild(dot);
});
let cur=0;const slides=[...document.querySelectorAll('.slide')];const dotEls=[...document.querySelectorAll('#dots i')];
function show(n){cur=Math.max(0,Math.min(S.length-1,n));slides.forEach((s,i)=>s.classList.toggle('on',i===cur));dotEls.forEach((s,i)=>s.classList.toggle('on',i===cur));nav.textContent=(cur+1)+' / '+S.length;}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){show(cur+1);}else if(e.key==='ArrowLeft'||e.key==='PageUp'){show(cur-1);}});
stage.addEventListener('click',()=>show(cur+1));
show(0);
</script>
</body>
</html>
