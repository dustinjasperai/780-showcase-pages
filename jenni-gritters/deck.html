<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Sustainable Business — a masterclass with Jenni Gritters</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f1ec;        /* their dominant cream */
    --ink:#405154;       /* their slate teal-grey */
    --accent:#ae5737;    /* their terracotta */
    --warm:#d8a177;      /* their tan */
    --rule:#d8d4ca;
    --panel:#ffffff;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:"Figtree",system-ui,sans-serif;line-height:1.55;-webkit-font-smoothing:antialiased}
  .deck{max-width:980px;margin:0 auto;padding:28px 20px 72px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 56px;margin:18px 0;min-height:420px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 1px 0 rgba(64,81,84,.04)}
  .slide.pad{background:transparent;border:none;box-shadow:none;min-height:auto;padding:30px 10px 6px}
  h1,h2,h3{font-family:"Libre Caslon Text",Georgia,serif;font-weight:600;line-height:1.08;letter-spacing:.2px}
  .kicker{font-family:"Figtree";font-weight:600;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-size:60px}
  .sub{font-family:"Libre Caslon Text";font-style:italic;font-size:26px;color:var(--ink);opacity:.85;margin-top:16px;max-width:30ch}
  h2{font-size:42px;color:var(--ink)}
  .part h2{font-size:30px}
  .part .num{font-family:"Libre Caslon Text";font-size:120px;line-height:.8;color:var(--warm);opacity:.5}
  .lead{font-size:20px;max-width:46ch;margin-top:8px}
  .reframe h2{font-size:46px;max-width:20ch}
  .reframe .lead{margin-top:22px}
  ul{list-style:none;margin-top:26px;max-width:60ch}
  li{position:relative;padding-left:30px;margin:16px 0;font-size:18px}
  li:before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border:2px solid var(--accent);border-radius:50%}
  .frame .tag{display:inline-block;font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--panel);background:var(--accent);padding:6px 12px;border-radius:20px;margin-bottom:18px}
  .frame h2{max-width:24ch}
  blockquote{font-family:"Libre Caslon Text";font-style:italic;font-size:34px;line-height:1.2;max-width:24ch;color:var(--ink)}
  blockquote .by{display:block;font-family:"Figtree";font-style:normal;font-size:14px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-top:22px}
  .why .lead{max-width:52ch}
  .why .cred{margin-top:22px}
  .cta{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .cta h2,.cta .kicker{color:var(--bg)}
  .cta .kicker{color:var(--warm)}
  .cta .lead{color:var(--bg);opacity:.9}
  .cta .step{display:inline-block;margin-top:26px;font-weight:600;font-size:18px;border-bottom:2px solid var(--warm);padding-bottom:4px}
  .disc{margin-top:30px;font-size:12.5px;line-height:1.5;color:var(--bg);opacity:.62;max-width:62ch}
  .foot{text-align:center;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink);opacity:.5;margin-top:30px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:40px}h2{font-size:30px}.reframe h2{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',kicker:"A live masterclass with Jenni Gritters · World Builders",h:"The Sustainable Business",sub:"How to build real wealth as a creative without abandoning your nervous system."},
  {t:'who',kicker:"Who this is for",h:"You've built something real.",lead:"This is for the deeply feeling, multipassionate creative entrepreneur who has already made the work happen, and who now wants it to last without costing you your health, your rest, or yourself."},
  {t:'reframe',kicker:"The trap",h:"The hustle model works right up until your body or your margin gives out.",lead:"More launches, more hours, more output. It scales revenue and it scales depletion at exactly the same rate, so the better it works the faster it breaks."},
  {t:'reframe',kicker:"The reframe",h:"Burnout isn't a willpower problem. It's an architecture problem.",lead:"If the business only runs when you run yourself into the ground, the structure is the thing that needs redesigning, not you."},
  {t:'part',num:"01",kicker:"Part one",h:"Why sustainable businesses break"},
  {t:'list',kicker:"The three fractures",h:"Most creative businesses crack in the same three places.",list:["Revenue that only exists when you are actively launching, so the moment you stop, the money stops.","Growth forced out of season, chasing expansion while the foundation is still being built.","A calendar built around urgency instead of capacity, so rest is always the thing that gets cut first."]},
  {t:'part',num:"02",kicker:"Part two",h:"The architecture"},
  {t:'frame',tag:"Framework 1",h:"The Two Wealth Seasons",lead:"Every business is in one of two seasons, and the strategy that fits one quietly wrecks the other. Name your season first, then choose the moves that belong to it."},
  {t:'list',kicker:"Diagnose your season",h:"Stabilization, then accumulation.",list:["Stabilization: you are building infrastructure and margin, making the base steady and predictable before you add weight to it.","Accumulation: the base holds, so now you are stewarding and expanding wealth on purpose.","The costly mistake is running accumulation plays in a stabilization season, pushing for scale on a foundation that can't yet hold it."]},
  {t:'frame',tag:"Framework 2",h:"The Cash Bridge",lead:"When you are pivoting or between launches, you don't need a huge new offer to stay stable. You need a bridge built from assets you already own."},
  {t:'list',kicker:"Four ways to bridge the gap",h:"Keep the lights on without a big launch.",list:["Paid market research: audits and consults that pay you to study the exact clients you're moving toward.","Intentional expense reduction: temporary, deliberate cuts that match spending to the season you're actually in.","Alumni offerings: punch cards and bundles for the people who already know and trust your work.","Small objection-dissolving offers: a low-barrier mini-program that answers the one thing stopping people from buying the bigger thing."]},
  {t:'frame',tag:"Framework 3",h:"Capacity-based design",lead:"The last layer is the one most strategies skip. You design the business around the human running it, not the other way around."},
  {t:'list',kicker:"Build it to hold you",h:"Intentionality over urgency.",list:["Start from your real capacity, energetic and practical, and let that set the ceiling on commitments.","Treat play and rest as inputs the work depends on, not rewards you earn after.","Sequence the week so the heavy creative work lands where your energy actually is."]},
  {t:'part',num:"03",kicker:"Part three",h:"When the architecture holds"},
  {t:'frame',tag:"The outcome",h:"A business that holds.",lead:"Revenue that stays steady across seasons. Margin that makes room for rest. Offers that don't require you to burn yourself down to deliver them. The same ambition, on a foundation that can carry it."},
  {t:'quote',q:"Power and peace, wealth and integrity, ambition and rest are not opposites.",by:"Jenni Gritters · World Builders"},
  {t:'why',kicker:"Why me",h:"I have built this more than once.",lead:"I spent a decade as a journalist and editor, with work in the New York Times, the Wall Street Journal, The Guardian and the Washington Post, before burnout pushed me to build differently.",cred:"Since then I've built and run around five businesses to roughly two million dollars in revenue, become a certified coach, and written The Sustainable Solopreneur. World Builders is where I teach all of it."},
  {t:'list',kicker:"Start this week",h:"Three things you can do before you do anything else.",list:["Name your season, stabilization or accumulation, and write down which plays actually belong to it.","List the assets you already own that a cash bridge could be built from.","Find the one commitment on your calendar that ignores your capacity, and redesign it."]},
  {t:'cta',kicker:"Your next season",h:"Ready to build the architecture?",lead:"If you want to do this work inside a room of other builders, The Council is the six-month circle where we design the whole thing together, season, bridge, and structure.",step:"Apply to join The Council at theworldbuilders.co",disc:"This masterclass is educational. No income or business result is guaranteed. Results vary and depend on your own work, market, and circumstances."}
];
function esc(x){return String(x).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function li(items){return "<ul>"+items.map(function(i){return "<li>"+esc(i)+"</li>"}).join("")+"</ul>"}
function render(){
  var out="";
  S.forEach(function(s){
    if(s.t==='title'){out+='<section class="slide"><div class="kicker">'+esc(s.kicker)+'</div><h1>'+esc(s.h)+'</h1><div class="sub">'+esc(s.sub)+'</div></section>'}
    else if(s.t==='who'){out+='<section class="slide"><div class="kicker">'+esc(s.kicker)+'</div><h2>'+esc(s.h)+'</h2><p class="lead">'+esc(s.lead)+'</p></section>'}
    else if(s.t==='reframe'){out+='<section class="slide reframe"><div class="kicker">'+esc(s.kicker)+'</div><h2>'+esc(s.h)+'</h2><p class="lead">'+esc(s.lead)+'</p></section>'}
    else if(s.t==='part'){out+='<section class="slide part"><div class="num">'+esc(s.num)+'</div><div class="kicker">'+esc(s.kicker)+'</div><h2>'+esc(s.h)+'</h2></section>'}
    else if(s.t==='list'){out+='<section class="slide"><div class="kicker">'+esc(s.kicker)+'</div><h2>'+esc(s.h)+'</h2>'+li(s.list)+'</section>'}
    else if(s.t==='frame'){out+='<section class="slide frame"><span class="tag">'+esc(s.tag)+'</span><h2>'+esc(s.h)+'</h2><p class="lead">'+esc(s.lead)+'</p></section>'}
    else if(s.t==='quote'){out+='<section class="slide"><blockquote>'+esc(s.q)+'<span class="by">'+esc(s.by)+'</span></blockquote></section>'}
    else if(s.t==='why'){out+='<section class="slide why"><div class="kicker">'+esc(s.kicker)+'</div><h2>'+esc(s.h)+'</h2><p class="lead">'+esc(s.lead)+'</p><p class="lead cred">'+esc(s.cred)+'</p></section>'}
    else if(s.t==='cta'){out+='<section class="slide cta"><div class="kicker">'+esc(s.kicker)+'</div><h2>'+esc(s.h)+'</h2><p class="lead">'+esc(s.lead)+'</p><div class="step">'+esc(s.step)+'</div><p class="disc">'+esc(s.disc)+'</p></section>'}
  });
  out+='<div class="foot">World Builders · Jenni Gritters</div>';
  document.getElementById('deck').innerHTML=out;
}
render();
</script>
</body>
</html>
