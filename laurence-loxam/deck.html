<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>From Insight to Impact — The Elevation Model Masterclass | Laurence Loxam</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root{
    --bg:#f3f5f9; --panel:#ffffff; --ink:#2f2828; --ink-soft:#4a4442;
    --ink-muted:#8a807d; --rule:#e4e4df; --accent:#0056a7; --accent-2:#1863dc;
  }
  html,body{height:100%;}
  body{ font-family:'Inter',-apple-system,sans-serif; background:var(--bg); color:var(--ink);
    -webkit-font-smoothing:antialiased; overflow:hidden; }
  #stage{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide{ display:none; width:min(960px,92vw); max-height:92vh; overflow:auto; padding:56px 60px;
    background:var(--panel); border:1px solid var(--rule); border-radius:4px;
    box-shadow:0 1px 0 var(--rule); }
  .slide.active{ display:block; }
  .kicker{ font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin-bottom:22px; }
  .label{ font-size:12px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-muted); margin-bottom:14px; }
  h1{ font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:48px; line-height:1.1;
    letter-spacing:-.01em; color:var(--ink); margin-bottom:20px; }
  h2{ font-family:'Newsreader',Georgia,serif; font-weight:600; font-size:34px; line-height:1.18;
    color:var(--ink); margin-bottom:20px; letter-spacing:-.005em; }
  .big{ font-family:'Newsreader',Georgia,serif; font-weight:500; font-size:40px; line-height:1.2;
    color:var(--ink); margin-bottom:22px; letter-spacing:-.01em; }
  .sub{ font-size:21px; color:var(--ink-soft); line-height:1.55; max-width:40ch; }
  p.body{ font-size:20px; color:var(--ink-soft); line-height:1.6; margin-bottom:16px; max-width:52ch; }
  .foot{ margin-top:26px; font-size:15px; color:var(--ink-muted); font-style:italic; }
  ul{ list-style:none; margin-top:8px; }
  ul li{ font-size:19px; color:var(--ink-soft); line-height:1.5; padding:13px 0 13px 26px;
    position:relative; border-bottom:1px solid var(--rule); max-width:58ch; }
  ul li:last-child{ border-bottom:none; }
  ul li::before{ content:""; position:absolute; left:0; top:22px; width:10px; height:2px;
    background:var(--accent); }
  .section-slide h2{ font-size:44px; }
  .steps li::before{ background:var(--accent-2); }
  .disc{ margin-top:30px; padding-top:18px; border-top:1px solid var(--rule);
    font-size:13px; color:var(--ink-muted); line-height:1.5; max-width:60ch; }
  .nav{ position:fixed; bottom:18px; right:22px; font-size:12px; color:var(--ink-muted);
    font-weight:500; letter-spacing:.04em; }
  .brandline{ position:fixed; bottom:18px; left:22px; font-size:12px; color:var(--ink-muted);
    letter-spacing:.04em; }
  @media (max-width:640px){ .slide{ padding:34px 26px; } h1{ font-size:34px; } h2{ font-size:26px; }
    .big{ font-size:28px; } .sub{ font-size:18px; } p.body{ font-size:17px; } ul li{ font-size:16px; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="brandline">The Elevation Model · Loxam Consulting</div>
<div class="nav" id="nav"></div>
<script>
const S=[
  {t:'title', kicker:'A Masterclass with Laurence Loxam', h:'From Insight to Impact',
   sub:'How high achievers turn hard-won insight into consistent, visible impact, using The Elevation Model.'},
  {t:'whofor', label:'Who this is for', h:'You are already performing well',
   list:['Doctors and surgeons carrying real clinical responsibility','Lawyers and partners working under constant pressure','Founders and CEOs whose decisions set the tone for everyone','Senior professionals who are successful, and sense another level is available']},
  {t:'quote', big:'You do not need to be broken to need a coach.',
   body:'Coaching is not only for people in crisis. Often it is for people who are already successful, but sense there is another level of clarity, confidence and purpose available to them.'},
  {t:'trap', label:'The pattern', h:'The hidden cost of being too capable',
   body:'You are the one everyone depends on. So you absorb more, respond faster, and carry more. The more capable you are, the more quietly everything starts to run through you.',
   foot:'Capability is not the problem. Depending on it is.'},
  {t:'reframe', big:'Clarity is often mistaken for control.',
   body:'But control closes doors. Clarity opens them. Most high achievers do not need more information. They need to see clearly what they cannot currently see.'},
  {t:'section', label:'Part One', h:'The invisible drivers'},
  {t:'problem', h:'Behaviour drives performance. Awareness drives behaviour.',
   body:'Under pressure, the same invisible drivers shape every choice, tone and reaction. This is not about IQ. It sits beneath conscious awareness, and it runs the room long before strategy ever does.'},
  {t:'list', label:'Behavioural intelligence', h:'What usually stays hidden',
   list:['The blind spot you defend instead of examine','The urgency that has quietly become your default','The availability that looks like leadership but slowly drains it','The story about success that no longer fits who you are becoming']},
  {t:'section', label:'Part Two', h:'The Elevation Model'},
  {t:'modelintro', h:'Seven stages, from insight to impact',
   body:'High achievers arrive from different places. Some need to reconnect with what they want. Some need to see a blind spot. Some know exactly what to do and cannot yet embody it. The model meets you where you are, then moves you forward.'},
  {t:'stages', label:'The framework', h:'The seven stages',
   list:['Vision: reconnect with what you actually want','Alignment: close the gap between values and behaviour','Awareness: name the invisible drivers','Breakthrough: turn reflection into action','Pathways: choose the route that fits you','Commitment: decide, and mean it','Embodiment: make the new behaviour consistent']},
  {t:'detail', h:'Why the structure matters',
   body:'Insight without structure fades by Monday morning. Each stage holds the one before it, so a breakthrough does not evaporate under the next wave of pressure. The work is not motivational. It is behavioural, and it holds.'},
  {t:'section', label:'Part Three', h:'What changes'},
  {t:'list', label:'In practice', h:'What it looks like',
   list:['Decisions made from clarity, not from the speed of the day','Presence that does not depend on being constantly available','Communication that lands the first time, even under pressure','Ambition that still fits the person you are becoming']},
  {t:'quote', big:'In a world that rewards speed over substance, behavioural intelligence is the differentiator.',
   body:'The leaders who last are not the fastest. They are the ones who can see clearly, decide well, and hold the behaviour when the pressure returns.'},
  {t:'credibility', label:'Why me', h:'Where this comes from',
   body:'Thirty years in commercial leadership, from turning around underperforming teams to running a 300 million euro business unit with board-level accountability. An MBA in Leadership and Sustainability, and an ILM Level 7 executive coaching qualification. The Elevation Model comes from both the research and the real room.',
   foot:'Laurence Loxam, Founder, Loxam Consulting'},
  {t:'cta', label:'Your next step', h:'If this is the level you have been sensing',
   body:'The next step is a conversation, not more information.',
   list:['Start with an Executive Clarity Session: one focused 60-minute conversation to resolve a single leadership challenge','Or book a short discovery call to see whether the Performance Accelerator fits where you are headed'],
   disc:'This masterclass is educational. No income, outcome or result is guaranteed. Results vary by individual and circumstance. Nothing here is medical, legal or financial advice.'}
];
function render(){
  const st=document.getElementById('stage');
  st.innerHTML='';
  S.forEach((s,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===cur?' active':'');
    if(s.t==='section') d.className+=' section-slide';
    let html='';
    if(s.kicker) html+='<div class="kicker">'+s.kicker+'</div>';
    if(s.label) html+='<div class="label">'+s.label+'</div>';
    if(s.h) html+=(s.t==='title')?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>';
    if(s.big) html+='<div class="big">'+s.big+'</div>';
    if(s.sub) html+='<div class="sub">'+s.sub+'</div>';
    if(s.body) html+='<p class="body">'+s.body+'</p>';
    if(s.list){ const cls=(s.t==='cta')?' class="steps"':''; html+='<ul'+cls+'>'+s.list.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
    if(s.foot) html+='<div class="foot">'+s.foot+'</div>';
    if(s.disc) html+='<div class="disc">'+s.disc+'</div>';
    d.innerHTML=html;
    st.appendChild(d);
  });
  document.getElementById('nav').textContent=(cur+1)+' / '+S.length;
}
let cur=0;
function go(n){ cur=Math.max(0,Math.min(S.length-1,n)); render(); }
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' ') go(cur+1);
  if(e.key==='ArrowLeft'||e.key==='PageUp') go(cur-1);
});
document.addEventListener('click',e=>{ if(e.clientX < window.innerWidth*0.3) go(cur-1); else go(cur+1); });
render();
</script>
</body>
</html>
