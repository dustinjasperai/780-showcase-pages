<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Your Company and Your Life Are the Same Project — The Good Entrepreneur Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;700;900&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f4efe6;        /* brand warm off-white (extract_brand #f4efe6) */
    --panel:#e9e0d1;     /* brand sand (extract_brand #e9e0d1) */
    --ink:#2a251f;       /* darkened from brand brown #36302a */
    --muted:#6b6256;
    --accent:#8a5a2a;    /* bronze interpolated from sand #e9e0d1 -> brown #36302a */
    --rule:#d8ccba;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);}
  body{font-family:"Hanken Grotesk",system-ui,sans-serif;color:var(--ink);}
  .deck{max-width:1040px;margin:0 auto;padding:28px 18px 80px;}
  .slide{
    background:var(--bg);
    border-radius:4px;
    padding:62px 64px;
    margin:0 0 26px;
    min-height:540px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 0 rgba(0,0,0,.04);
  }
  .slide::before{
    content:"";position:absolute;left:64px;top:54px;width:46px;height:2px;background:var(--accent);
  }
  .eyebrow{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px;}
  h1{font-family:"Playfair Display",serif;font-weight:900;font-size:58px;line-height:1.04;letter-spacing:-.01em;}
  h2{font-family:"Playfair Display",serif;font-weight:700;font-size:40px;line-height:1.1;margin-bottom:20px;}
  .lede{font-size:22px;line-height:1.5;max-width:40ch;color:var(--ink);}
  .sub{font-size:19px;line-height:1.55;max-width:52ch;color:var(--muted);margin-top:16px;}
  p.body{font-size:19px;line-height:1.6;max-width:56ch;margin-top:14px;}
  .big{font-family:"Playfair Display",serif;font-size:46px;line-height:1.12;font-weight:700;max-width:22ch;}
  ul{list-style:none;margin-top:26px;}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 30px;position:relative;border-top:1px solid var(--panel);max-width:60ch;}
  li:first-child{border-top:none;}
  li::before{content:"";position:absolute;left:0;top:23px;width:10px;height:10px;background:var(--accent);border-radius:50%;}
  .num{font-family:"Playfair Display",serif;font-size:20px;color:var(--accent);font-weight:700;margin-bottom:14px;}
  .title-slide{background:var(--panel);}
  .title-slide h1{font-size:66px;}
  .brandline{margin-top:34px;font-size:16px;letter-spacing:.04em;color:var(--muted);}
  .brandline strong{color:var(--ink);font-weight:600;}
  .cta-slide{background:var(--ink);color:var(--bg);}
  .cta-slide::before{background:var(--accent);}
  .cta-slide h2,.cta-slide h1{color:var(--bg);font-family:"Playfair Display",serif;}
  .cta-slide .eyebrow{color:#d9a86a;}
  .cta-slide .step{font-size:21px;line-height:1.6;max-width:52ch;margin-top:10px;color:#efe7da;}
  .cta-slide .btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;padding:16px 30px;border-radius:3px;font-weight:600;font-size:18px;}
  .disclaimer{margin-top:34px;font-size:13px;line-height:1.5;color:#b9ab93;max-width:60ch;}
  .kicker{font-size:18px;color:var(--muted);margin-top:18px;max-width:54ch;line-height:1.55;}
  .q{font-family:"Playfair Display",serif;font-style:italic;font-size:30px;line-height:1.3;color:var(--ink);max-width:30ch;}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', eyebrow:'A live masterclass for founder-CEOs',
   h1:'Your Company and Your Life Are the Same Project',
   sub:'How to build a principled business and a life you are proud of, at work and at home.',
   brand:'The Good Entrepreneur &middot; with <strong>Nick Kennedy</strong>'},

  {t:'who', eyebrow:'Who this is for',
   h2:'You are winning at work. So why does home feel so far away?',
   body:'This hour is for founder-CEOs who are growing a real company and quietly paying for it in the parts of life that do not show up on a P&L. You are not burned out on ambition. You are tired of the trade you were told you had to make.'},

  {t:'hook', eyebrow:'The reframe',
   big:'You do not have a business problem. You have an integration problem.',
   kicker:'Most leaders are handed two separate projects: build the company, and somehow also have a life. Optimize one, sacrifice the other. That split is the problem, and it is a lie.'},

  {t:'part', num:'Part One', h2:'The Split', body:'We are taught to run the business with discipline and leave our personal life to whatever is left over. So the company gets the best of you and the people you love get the leftovers. The number goes up. The life goes quiet.'},

  {t:'cost', eyebrow:'What the split costs',
   h2:'The quiet bill comes due',
   list:['The wins start to feel hollow, and you cannot say why.','Decisions at work are really unresolved things from home, wearing a suit.','You keep scaling because it is the one lever you know how to pull.']},

  {t:'part', num:'Part Two', h2:'The Good Entrepreneur',
   body:'A different operating system. Twelve core principles for moving your company from chaos to order while building the personal legacy you actually want. Not balance. Integration. One life, run on purpose.'},

  {t:'pillar', num:'Principle', h2:'Positions change. Values do not.',
   body:'Most leaders anchor decisions to the situation in front of them, so the decisions wobble when the situation does. We anchor them to a short, named set of values instead. When the hard call comes, you already know the answer.'},

  {t:'pillar', num:'The Wheel of Audacity', h2:'Audacity is a skill, not a personality',
   body:'Audacity is not noise. It is the practice of acting from what matters even when the dictator in your mind says you do not belong in the room. We build it the same way across every area of your life: name the fear, take the audacious action, let it become identity.'},

  {t:'pillar', num:'The inner work', h2:'Overthrow the dictator in your mind',
   body:'There is a voice that keeps score only in revenue and never counts what it costs. Left unchallenged, it runs the company and runs your life. The work is to notice it, question it, and stop taking orders from it.'},

  {t:'pillar', num:'The legacy track', h2:'From self-authoring to self-transforming',
   body:'Early on, leadership is writing your own agenda and executing it. The next level is letting a bigger purpose and a trusted circle reshape the agenda itself. That shift is where a career becomes a legacy.'},

  {t:'week', eyebrow:'What integration looks like',
   h2:'Your calendar is a values statement',
   body:'An integrated week is not a softer week. It is a week where the hard call, the deep work, and the family dinner are all on the same calendar on purpose, because they are all the same project.'},

  {t:'part', num:'Part Three', h2:'The leader on the other side',
   body:'A founder-CEO who still grows a serious company, and comes home as someone their family recognizes. Who makes decisions from values instead of fear. Who is building something principled that will outlast the exit.'},

  {t:'why', eyebrow:'Why listen to me on this',
   h2:'I built the company. It nearly cost me the life.',
   body:'I co-founded and sold the airline RISE and have been part of more than $6B in transactions, an EY Entrepreneur of the Year and Hall of Fame inductee. I also nearly lost my marriage and my connection to my family on the way up. Everything here is 10,000 hours of coaching plus the scar tissue of learning this the hard way.'},

  {t:'truth', eyebrow:'Let me be clear',
   q:'This is not soft. Integration is the most demanding, and most profitable, discipline a leader ever takes on.'},

  {t:'practice', eyebrow:'How the work actually runs',
   h2:'Honest conversation, clarity, practice',
   list:['An honest conversation about where you actually are, at work and at home.','Clarity on what genuinely matters, named out loud and written down.','Regular practice with real accountability, so it holds when the week gets loud.']},

  {t:'cta', eyebrow:'Your next step',
   h2:'Run one life, on purpose',
   step:'If this is the project you are ready to take seriously, the next step is a single honest conversation. Book an exploratory conversation with me, and if it is a fit we will talk about whether the Kennedy Leadership Program is the right room for you.',
   btn:'Book an exploratory conversation',
   disclaimer:'This masterclass is educational. It shares principles and frameworks from The Good Entrepreneur. No specific business, financial, or personal result is guaranteed. Results vary and depend on your own circumstances and effort.'}
];

const deck = document.getElementById('deck');
for(const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='title'?' title-slide':'') + (s.t==='cta'?' cta-slide':'');
  let h = '';
  if(s.eyebrow) h += `<div class="eyebrow">${s.eyebrow}</div>`;
  if(s.num) h += `<div class="num">${s.num}</div>`;
  if(s.h1) h += `<h1>${s.h1}</h1>`;
  if(s.h2) h += `<h2>${s.h2}</h2>`;
  if(s.big) h += `<div class="big">${s.big}</div>`;
  if(s.q) h += `<div class="q">${s.q}</div>`;
  if(s.sub) h += `<div class="sub">${s.sub}</div>`;
  if(s.body) h += `<p class="body">${s.body}</p>`;
  if(s.kicker) h += `<div class="kicker">${s.kicker}</div>`;
  if(s.list){ h += '<ul>'; for(const li of s.list) h += `<li>${li}</li>`; h += '</ul>'; }
  if(s.step) h += `<div class="step">${s.step}</div>`;
  if(s.btn) h += `<div class="btn">${s.btn}</div>`;
  if(s.brand) h += `<div class="brandline">${s.brand}</div>`;
  if(s.disclaimer) h += `<div class="disclaimer">${s.disclaimer}</div>`;
  el.innerHTML = h;
  deck.appendChild(el);
}
</script>
</body>
</html>
