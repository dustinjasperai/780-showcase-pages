<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The AI-Forward, People-First Playbook — Profit Minds</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600;700&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3f8fd; --panel:#ffffff; --ink:#0a1628;
    --muted:#48586b; --accent:#3399cc; --green:#66cc33; --rule:#d7e6f3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Lora',Georgia,serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 3px rgba(10,22,40,.05)}
  .slide.title{background:linear-gradient(135deg,#0a1628 0%,#143a5c 100%);color:#eaf4fc;border:none}
  .slide.part{background:#0a1628;color:#eaf4fc;border:none}
  h1{font-family:'Poppins',sans-serif;font-weight:700;font-size:44px;line-height:1.1;letter-spacing:-.01em}
  h2{font-family:'Poppins',sans-serif;font-weight:700;font-size:32px;line-height:1.15;margin-bottom:18px}
  h3{font-family:'Poppins',sans-serif;font-weight:600;font-size:15px;letter-spacing:.14em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  .title h3{color:#8fd0f2}
  p{font-size:20px;line-height:1.5;color:var(--muted);margin-bottom:14px}
  .title p,.part p{color:#b8d4e8}
  .lead{font-size:23px;color:var(--ink)}
  .big{font-size:40px;font-family:'Poppins',sans-serif;font-weight:700;color:var(--accent);line-height:1.05}
  ul{list-style:none;margin:10px 0}
  li{font-size:20px;line-height:1.45;color:var(--ink);padding:12px 0 12px 34px;position:relative;border-bottom:1px solid var(--rule)}
  li:before{content:"";position:absolute;left:0;top:20px;width:14px;height:14px;border-radius:4px;background:var(--green)}
  .step{font-family:'Poppins',sans-serif;font-weight:700;color:var(--green);font-size:16px;letter-spacing:.1em;margin-bottom:8px}
  .kpi{display:flex;gap:40px;flex-wrap:wrap;margin-top:18px}
  .kpi div{flex:1;min-width:180px}
  .kpi .big{font-size:48px}
  .kpi span{display:block;font-size:16px;color:var(--muted);margin-top:4px}
  .pres{margin-top:30px;font-family:'Poppins',sans-serif;font-weight:600;font-size:18px;color:#eaf4fc}
  .pres span{display:block;font-weight:400;font-size:15px;color:#8fd0f2;margin-top:4px}
  .disc{font-size:14px;color:var(--muted);line-height:1.5;margin-top:22px;border-top:1px solid var(--rule);padding-top:16px}
  .cta h1{color:var(--accent)}
  .quote{font-style:italic;font-size:26px;line-height:1.4;color:var(--ink)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", cls:"slide title", html:`
    <h3>A Profit Minds Masterclass</h3>
    <h1>The AI-Forward, People-First Playbook</h1>
    <p class="lead" style="color:#dbecf8;margin-top:14px">How small business owners adopt AI without losing the plot, or their people.</p>
    <div class="pres">Dr. Steven Kirch<span>Founder, Profit Minds &middot; Profit Minds Growth System</span></div>`},

  {t:"promise", cls:"slide", html:`
    <h3>What you'll leave with</h3>
    <h2>A clear, low-risk way to put AI to work, this month.</h2>
    <ul>
      <li>Why most AI efforts stall, and the one thing that fixes it</li>
      <li>A three-step path from zero to real productivity gains</li>
      <li>How to bring your team with you instead of scaring them off</li>
      <li>The guardrails that keep AI safe, secure, and compliant</li>
    </ul>`},

  {t:"forwho", cls:"slide", html:`
    <h3>Who this is for</h3>
    <h2>You're running the business and drowning in routine work.</h2>
    <p>You know AI matters. You've maybe tried a few tools. But nothing stuck, the team shrugged, and you're back to doing the busywork yourself at 9pm.</p>
    <p class="lead">The trap: treating AI as a tool problem, when it's really a people-and-process problem.</p>`},

  {t:"reframe", cls:"slide part", html:`
    <h3 style="color:#8fd0f2">The reframe</h3>
    <h1 style="font-size:38px">"AI First" is backwards.</h1>
    <p class="lead" style="color:#dbecf8">It implies AI leads and your people adapt. That's how you lose your team. AI should move the business forward with your people at the center. That's AI-Forward, People-First.</p>`},

  {t:"part1", cls:"slide part", html:`<h3 style="color:#8fd0f2">Part One</h3><h1>Why AI stalls in most businesses</h1>`},

  {t:"problem", cls:"slide", html:`
    <h3>The core problem</h3>
    <h2>Nobody needs a 48th tool. They need to use the ones they have.</h2>
    <p>The feed is full of "47 AI tools you need" and "10x overnight." It creates noise, overwhelm, and a team that quietly opts out. The gap isn't access to AI. It's adoption.</p>`},

  {t:"tipping", cls:"slide", html:`
    <h3>The tipping point</h3>
    <h2>The AI productivity tipping point is already here.</h2>
    <p>Most owners are still waiting for the "next model" before they start. You don't have to. Real gains can show up in the first hour of training, on work your team is doing today.</p>`},

  {t:"fear", cls:"slide", html:`
    <h3>What's really holding people back</h3>
    <p class="quote">"Will AI just replace my people?"</p>
    <p style="margin-top:18px">When the message is "do your job more effectively," and it's clear you're developing your team, not replacing them, people get interested in learning fast.</p>`},

  {t:"part2", cls:"slide part", html:`<h3 style="color:#8fd0f2">Part Two</h3><h1>The AI-Forward, People-First method</h1>`},

  {t:"step1", cls:"slide", html:`
    <div class="step">STEP ONE</div>
    <h2>Identify &amp; Pilot</h2>
    <p>Examine your workflows and choose the ONE high-value area where AI will deliver results fastest. A small, low-risk pilot before any big commitment, with a result you can see in under 14 days.</p>`},

  {t:"step2", cls:"slide", html:`
    <div class="step">STEP TWO</div>
    <h2>Train Your Team</h2>
    <p>Close the capability gap by training your people in practical, role-specific AI skills, for their actual deliverables. Not a generic course. The work they already own.</p>`},

  {t:"step3", cls:"slide", html:`
    <div class="step">STEP THREE</div>
    <h2>Support &amp; Scale</h2>
    <p>As your team's confidence grows, expand into every area of the business, with a simple accountability mechanism so progress is real and nobody gets left behind.</p>`},

  {t:"praxis", cls:"slide", html:`
    <h3>The layer most people skip</h3>
    <h2>Praxis: AI you can actually trust.</h2>
    <p>Using generative AI safely, securely, ethically, and responsibly, so adoption doesn't create a security, IP, or compliance mess. Speed without guardrails is a liability.</p>`},

  {t:"part3", cls:"slide part", html:`<h3 style="color:#8fd0f2">Part Three</h3><h1>What it looks like when it works</h1>`},

  {t:"kpis", cls:"slide", html:`
    <h3>The time-back math</h3>
    <h2>AI gives owners their month back.</h2>
    <div class="kpi">
      <div><div class="big">20-40</div><span>hours saved per employee, per month</span></div>
      <div><div class="big">&lt; 14</div><span>days to a first pilot result</span></div>
      <div><div class="big">Hour 1</div><span>first productivity win in training</span></div>
    </div>`},

  {t:"firsthour", cls:"slide", html:`
    <h3>The first-hour win</h3>
    <h2>From busywork to the work only you can do.</h2>
    <p>A task that used to take an afternoon, done before lunch. A proposal turned into a full project plan in minutes. The point isn't speed for its own sake. It's getting back the work that actually grows the business.</p>`},

  {t:"hero", cls:"slide", html:`
    <h3>The opportunity</h3>
    <h2>Someone in your company will become the AI hero.</h2>
    <p>Someone gets the credit for bringing real, governed AI productivity to the team. It can happen now, because of you, or later, to you. This is a once-in-a-career window.</p>`},

  {t:"whyme", cls:"slide", html:`
    <h3>Why trust this method</h3>
    <h2>Built by a physicist and an AI engineer, not a hype channel.</h2>
    <p>Dr. Steven Kirch spent 25+ years in high tech at IBM and Intel and co-invented 10 US patents. With Suzanne Kirch, an AI engineer, Profit Minds has helped 50+ businesses adopt AI, people first, from solopreneurs to mid-market teams.</p>`},

  {t:"isit", cls:"slide", html:`
    <h3>Is this you?</h3>
    <h2>You want AI to augment your team, not replace it.</h2>
    <ul>
      <li>You're ready to pick one workflow and prove it fast</li>
      <li>You want your people leading the change, not resisting it</li>
      <li>You want it safe and compliant from day one</li>
    </ul>`},

  {t:"cta", cls:"slide cta", html:`
    <h3>Your next step</h3>
    <h1>Start with one pilot.</h1>
    <p class="lead">Book a strategy call with Profit Minds. We'll pick the one workflow where AI pays off fastest and map your AI-Forward, People-First plan.</p>
    <p style="font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink);font-size:22px;margin-top:10px">profitminds.net</p>
    <div class="disc">Educational content only. No income, role, or business result is guaranteed; outcomes vary by business, effort, and implementation. Figures shown are typical ranges reported by Profit Minds and are not a promise of results.</div>`}
];
const deck = document.getElementById('deck');
S.forEach(s => { const d = document.createElement('section'); d.className = s.cls; d.innerHTML = s.html; deck.appendChild(d); });
</script>
</body>
</html>
