<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Splitter's Playbook Masterclass | JD LSAT &amp; Admissions</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&family=Montserrat:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f4ee;
    --panel:#fffdf9;
    --navy:#12203f;
    --accent:#1b3a8f;
    --ink:#17233f;
    --ink-soft:#41496a;
    --muted:#8b8574;
    --rule:#e4e0d6;
  }
  html,body{height:100%}
  body{background:var(--navy);font-family:'Source Serif 4',Georgia,serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{position:relative;width:100vw;height:100vh;overflow:hidden}
  .slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;
    padding:8.5vh 9vw;opacity:0;transition:opacity .5s ease;pointer-events:none;background:var(--bg)}
  .slide.active{opacity:1;pointer-events:auto}
  .kicker{font-family:'Montserrat',sans-serif;font-size:1.05vw;font-weight:700;letter-spacing:.22em;
    text-transform:uppercase;color:var(--accent);margin-bottom:3.2vh}
  h1{font-family:'Source Serif 4',Georgia,serif;font-weight:600;font-size:4.4vw;line-height:1.1;
    letter-spacing:-.01em;color:var(--ink);max-width:20ch}
  .sub{font-family:'Montserrat',sans-serif;font-weight:500;font-size:1.7vw;line-height:1.5;
    color:var(--ink-soft);margin-top:3.4vh;max-width:34ch}
  .body{font-family:'Montserrat',sans-serif;font-weight:400;font-size:1.55vw;line-height:1.62;
    color:var(--ink-soft);margin-top:3.4vh;max-width:40ch}
  .brandline{font-family:'Montserrat',sans-serif;font-size:1.15vw;font-weight:600;letter-spacing:.02em;
    color:var(--accent);margin-top:5vh}
  .brandline b{font-weight:700}
  /* section slides */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Montserrat',sans-serif;font-size:1.15vw;font-weight:700;letter-spacing:.24em;
    text-transform:uppercase;color:var(--accent);margin-bottom:2.6vh}
  .t-section h1{font-size:5.2vw}
  .t-section .rule{width:8.5vw;height:4px;background:var(--accent);border-radius:3px;margin-top:4vh}
  /* dark reframe slides */
  .t-dark{background:var(--navy)}
  .t-dark h1{color:#f4f6fb;font-weight:600;font-size:4vw;max-width:24ch}
  .t-dark .kicker{color:#8fb0ee}
  /* cta */
  .t-cta{background:var(--panel)}
  .chips{display:flex;gap:1.4vw;margin-top:4.6vh;flex-wrap:wrap}
  .chip{font-family:'Montserrat',sans-serif;font-weight:600;font-size:1.3vw;color:#fff;background:var(--accent);
    border-radius:100px;padding:1.5vh 2.2vw}
  .disc{font-family:'Montserrat',sans-serif;font-size:.95vw;line-height:1.5;color:var(--muted);
    margin-top:6vh;max-width:52ch}
  /* climb motif */
  .climb{position:absolute;right:7vw;bottom:8vh;width:16vw;height:8vw;opacity:.9}
  .t-title .climb{right:8vw;bottom:10vh;width:22vw;height:11vw;opacity:1}
  .t-dark .climb path{stroke:#8fb0ee}
  .t-dark .climb circle{fill:#8fb0ee}
  /* chrome */
  #hud{position:fixed;left:0;right:0;bottom:0;display:flex;align-items:center;gap:18px;
    padding:16px 26px;z-index:20;pointer-events:none}
  #track{flex:1;height:3px;background:rgba(23,35,63,.12);border-radius:3px;overflow:hidden}
  .t-dark ~ #hud #track{background:rgba(255,255,255,.14)}
  #bar{height:100%;width:0;background:var(--accent);transition:width .5s ease}
  #count{font-family:'Montserrat',sans-serif;font-size:12px;font-weight:600;letter-spacing:.1em;color:var(--muted)}
  .nav{position:fixed;top:0;height:100vh;width:14vw;z-index:15;cursor:pointer;background:transparent;border:0}
  #prev{left:0}#next{right:0}
  #hint{position:fixed;right:26px;bottom:34px;font-family:'Montserrat',sans-serif;font-size:12px;
    letter-spacing:.08em;color:var(--muted);z-index:20;transition:opacity .4s}
  @media(max-width:760px){h1{font-size:7.4vw}.sub,.body{font-size:3.4vw}.kicker{font-size:2.6vw}
    .t-section h1{font-size:8.6vw}.chip{font-size:3vw}.disc{font-size:2.4vw}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute"><symbol id="climb" viewBox="0 0 260 130">
  <path d="M14 118 H70 V86 H126 V54 H188 V20" fill="none" stroke="#1b3a8f" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="14" cy="118" r="6" fill="#1b3a8f"/>
  <circle cx="70" cy="86" r="6" fill="#1b3a8f"/>
  <circle cx="126" cy="54" r="6" fill="#1b3a8f"/>
  <circle cx="188" cy="20" r="7.5" fill="#1b3a8f"/>
</symbol></svg>

<div id="deck"></div>
<div id="hud"><div id="track"><div id="bar"></div></div><div id="count">01 / 01</div></div>
<button id="prev" class="nav" aria-label="Previous"></button>
<button id="next" class="nav" aria-label="Next"></button>
<div id="hint">Use arrow keys &rarr;</div>

<script>
const S = [
 {t:'title',title:'The Splitter’s Playbook',sub:'How a low GPA becomes a full-ride offer, with the LSAT as your lever.',brand:true,climb:true},
 {t:'normal',k:'Who this is for',title:'You were told it was a reach.',body:'You have the drive and the goal, but a number on your transcript is holding the story back, and someone with authority already told you the schools you want are out of range.'},
 {t:'dark',title:'Your GPA is fixed. The LSAT is not, and it is the one number that can outweigh it.'},

 {t:'section',idx:'Part One',title:'Why More Hours Stopped Working'},
 {t:'normal',k:'The trap',title:'A bigger pile of practice tests is not the lever.',body:'Most applicants answer more questions and hope the score follows. Volume without a system just rehearses the same mistakes faster, and the plateau sets in.'},
 {t:'normal',k:'The real cost',title:'Unfocused hours quietly cap your score.',body:'Every week spent grinding without a diagnosis is a week the ceiling stays where it is. The problem is rarely effort. It is that the effort has no aim.'},
 {t:'dark',title:'The score does not move on volume. It moves on a system.'},

 {t:'section',idx:'Part Two',title:'The Deliberate-Practice Method'},
 {t:'normal',k:'Quality over quantity',title:'Deliberate practice beats more problems.',body:'One diagnostic, one timed test a week, and a practice log you actually review. Fewer questions, studied deeply, teach you more than a hundred rushed ones.'},
 {t:'normal',k:'Dependable techniques',title:'Techniques you can trust 100 percent of the time.',body:'The test writes answer choices designed to mislead you. Once you can name the trap on sight, you stop guessing and start choosing, on every question, under time.'},
 {t:'normal',k:'Question first',title:'Read the question before the stimulus.',body:'Knowing the task before you read means you read with purpose. The same habit, applied across logical reasoning and reading, turns a slow section into a fast one.'},
 {t:'normal',k:'Systems, habits, environment',title:'Build the system around you, not the cram.',body:'The score comes from the systems, the habits, and the environment you set up, so the studying happens the same way whether you feel like it that day or not.'},
 {t:'dark',title:'Diagnostic, one timed test a week, a practice log, and course-correction. Like an airplane heading toward a destination.'},

 {t:'section',idx:'Part Three',title:'The Splitter’s Move'},
 {t:'normal',k:'The reframe',title:'A high LSAT rewrites a low-GPA file.',body:'Admissions reads the two numbers together. A score well above a school’s median gives them a reason to look past the transcript, and it changes which schools are even in the conversation.'},
 {t:'normal',k:'Where the leverage is',title:'The score is how splitters win scholarships.',body:'A number above the median is not just an admit. It is the figure that opens merit money, because schools compete for the applicants who lift their profile.'},
 {t:'normal',k:'Why me',title:'I went 149 to 173, and turned it into full rides.',body:'A pre-law advisor called even a safety a reach. I am a Columbia and Harvard graduate who studied the way I now teach, and it earned full-tuition scholarships to Duke, Berkeley, and Georgetown, over five years of coaching applicants since.'},
 {t:'dark',title:'The advisor said even a safety was a reach. The LSAT said otherwise.'},

 {t:'section',idx:'Your next step',title:'Map Your Splitter Plan'},
 {t:'normal',k:'How I can help',title:'One conversation to build your plan.',body:'In a free consultation we look at your diagnostic, your target schools, and the gap, then lay out the deliberate-practice plan that gets you there. It is one-on-one, built around your starting point.'},
 {t:'cta',title:'Ready to turn your LSAT into your leverage?',chips:['Book a free consultation','Get your splitter study plan'],disc:'Educational content for LSAT students and law school applicants. No score, admission, or scholarship result is guaranteed. Results vary by student, starting point, and school.'},
];

const deck=document.getElementById('deck');
function climb(){return '<svg class="climb"><use href="#climb"/></svg>'}
S.forEach((s)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">JD LSAT <b>&amp; Admissions</b></div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.climb||s.t==='title') h+=climb();
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
