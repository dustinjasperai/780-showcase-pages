<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Second Mountain — A Conscious Success Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Chivo:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#faf7f2;      /* ground — brand footer #fcfaf5 / blush family */
    --panel:#ffffff;
    --ink:#474747;        /* brand charcoal headings */
    --body:#595959;       /* brand body grey */
    --clay:#9c6b4f;       /* accent — brand blush #e3d1c4 deepened for AA contrast */
    --blush:#e3d1c4;      /* brand hairline */
    --mist:#efe7df;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--cream);color:var(--body);font-family:"Chivo",sans-serif;font-weight:300;line-height:1.6;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:28px 20px 70px}
  .slide{background:var(--panel);border:1px solid var(--blush);border-radius:14px;padding:58px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide.center{align-items:center;text-align:center}
  .kicker{font-family:"Chivo",sans-serif;font-weight:600;letter-spacing:.22em;text-transform:uppercase;font-size:12px;color:var(--clay);margin-bottom:22px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--ink);font-size:58px;line-height:1.08;letter-spacing:.01em}
  h2{font-family:"Cormorant Garamond",serif;font-weight:500;color:var(--ink);font-size:40px;line-height:1.12;margin-bottom:20px}
  .lead{font-size:21px;color:var(--body);max-width:46ch}
  .center .lead{margin:0 auto}
  p.body{font-size:18px;color:var(--body);max-width:60ch;margin-top:14px}
  .big{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:30px;color:var(--clay);line-height:1.3;max-width:52ch;margin-top:8px}
  ul{list-style:none;margin-top:26px;max-width:60ch}
  ul li{position:relative;padding-left:30px;margin-bottom:17px;font-size:18px;color:var(--body)}
  ul li::before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;background:var(--clay);border-radius:50%}
  .pillar{display:flex;gap:22px;align-items:flex-start;margin-top:22px}
  .pnum{font-family:"Cormorant Garamond",serif;font-size:46px;color:var(--blush);line-height:1;min-width:58px}
  .pbody h3{font-family:"Cormorant Garamond",serif;font-weight:600;color:var(--ink);font-size:26px;margin-bottom:6px}
  .pbody p{font-size:17px;color:var(--body);max-width:56ch}
  .num{position:absolute;top:26px;right:34px;font-family:"Chivo",sans-serif;font-size:12px;letter-spacing:.18em;color:var(--blush)}
  .horizon{position:absolute;left:0;right:0;bottom:0;height:120px;pointer-events:none;opacity:.9}
  .btn{display:inline-block;margin-top:30px;background:var(--clay);color:#fff;font-family:"Chivo",sans-serif;font-weight:600;letter-spacing:.04em;font-size:16px;padding:16px 34px;border-radius:40px;text-decoration:none}
  .disc{margin-top:30px;font-size:12.5px;color:#8a8279;max-width:60ch;line-height:1.55}
  .center .disc{margin-left:auto;margin-right:auto}
  .quietmark{font-family:"Cormorant Garamond",serif;font-style:italic;color:var(--clay);font-size:22px}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:0}h1{font-size:40px}h2{font-size:30px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="mtn" viewBox="0 0 1040 120" preserveAspectRatio="none">
    <path d="M0,120 L0,86 L210,30 L340,70 L520,14 L700,66 L860,34 L1040,78 L1040,120 Z" fill="#efe7df"/>
    <path d="M0,120 L0,104 L260,64 L430,92 L620,52 L820,88 L1040,66 L1040,120 Z" fill="#e3d1c4" opacity=".7"/>
  </symbol>
</defs></svg>
<script>
/* The Conscious Success Masterclass — Emma Lloyd. Her audience, her method, her CTA. */
const S=[
  {t:'title',kicker:'A Live Masterclass with Emma Lloyd',h:'The Second Mountain',lead:'How high-achieving women leave the burnout behind and rebuild success on their own terms, without blowing up the life they worked so hard to build.',mtn:true},
  {t:'who',kicker:'Who this is for',h:'You did everything right. So why does it feel like this?',bullets:['You climbed the ladder, hit the numbers, and earned the title that comes with golden handcuffs.','From the outside it looks like success. Inside, it feels like survival.','You are exhausted, a little numb, and quietly wondering if there is another version of this.']},
  {t:'who',kicker:'Who this is for',h:'The quiet thought you keep pushing away',big:'"I built a life that looks right on paper and I cannot figure out why I want to escape it."',body:'If that sentence lands, you are exactly who this hour is for. You are not broken, and you are not ungrateful. You have just climbed a mountain that was never really yours.'},
  {t:'reframe',kicker:'The reframe',h:'Burnout is not a time-management problem.',big:'It is a nervous-system problem wearing a career costume. No new planner, morning routine, or productivity hack fixes a body stuck in survival mode.',body:'That is why the smartest women you know keep pushing harder and feeling worse. They are treating a regulation problem with a strategy solution.'},
  {t:'part',kicker:'Part One',h:'The First Mountain',lead:'The first mountain is the one you were taught to climb: proving, hustling, and fear-based motivation. It works, right up until it costs you your health, your joy, and your sense of self.'},
  {t:'cost',kicker:'Part One',h:'What the first mountain actually costs',bullets:['Decisions made from fear instead of desire, so every "yes" quietly drains you.','A body kept in fight-or-flight for so long that rest starts to feel like a threat.','A definition of success you inherited and never actually chose.']},
  {t:'cost',kicker:'Part One',h:'And the cost of waiting another year',body:'Most women do not leave the first mountain when they realize it is wrong. They leave when their body forces the decision for them: the health scare, the breakdown, the year they lose. You do not have to wait for that. There is a gentler way down, and it starts with how you are wired to respond.'},
  {t:'part',kicker:'Part Two',h:'The Conscious Success Method',lead:'A three-part path out of burnout and into work that feels as good on the inside as it looks on the outside. The order matters: we regulate the body first, then get clear, then build the plan.'},
  {t:'pillar',kicker:'Part Two · Pillar One',h:'Regulation',pillars:[['01','Regulation','Shift out of survival mode and break free of the subconscious blocks keeping you stuck. We calm the nervous system first, because no good decision gets made from fear.']]},
  {t:'pillar',kicker:'Part Two · Pillar Two',h:'Alignment',pillars:[['02','Alignment','Get clear on your values, your real gifts, and the vision you actually want, not the one you were handed. This is where the fog lifts and the direction becomes obvious.']]},
  {t:'pillar',kicker:'Part Two · Pillar Three',h:'Strategy',pillars:[['03','Strategy','Reverse-engineer a concrete transition plan with clear priorities and the next right steps. Alignment without a plan stays a dream; this is where it becomes your reality.']]},
  {t:'together',kicker:'Part Two',h:'Why this order changes everything',body:'Most career and mindset advice starts with strategy and ignores the body. So the plans are good and the follow-through falls apart. When regulation comes first, alignment gets honest and the strategy finally sticks. Same woman, completely different outcome.'},
  {t:'reframe',kicker:'Part Three',h:'The Second Mountain',big:'The second mountain is fueled by alignment, autonomy, and desire instead of proving, hustling, and fear.',body:'It is not about working less for its own sake. It is about building something, a role, a business, a life, that you do not need to escape from.'},
  {t:'look',kicker:'Part Three',h:'How the second mountain feels day to day',bullets:['You make career moves from clarity and desire, not panic and obligation.','Your energy comes back, and with it the creativity the hustle quietly buried.','You build toward a goal that is genuinely yours, and you can feel the difference.']},
  {t:'look',kicker:'Part Three',h:'For the women rebuilding into a business',body:'Many of the women I work with are leaving corporate to build something of their own. The method travels with you: regulation keeps you steady through the uncertainty, alignment shapes an offer that actually fits you, and strategy turns it into positioning, pricing, and a path to your first consistent months. Same three pillars, applied to the climb that is finally yours.'},
  {t:'why',kicker:'Why me',h:'I climbed the first mountain all the way up.',body:'I spent over a decade in tech, hit seven figures by thirty, and checked every box of the success I was supposed to want. Then I hit clinical burnout. Rebuilding taught me what no promotion did: that sustainable success has to be fueled by desire, alignment, and strategy, not fear, stress, and survival. The Conscious Success Method is the path I wish someone had handed me.',mark:'Emma Lloyd, Conscious Success'},
  {t:'together',kicker:'The invitation',h:'This is not a one-time climb',body:'Regulation, alignment, and strategy are not a weekend fix. They are a practice you build with support, in a room of women doing the same work. That is exactly what the next step is designed for.'},
  {t:'cta',kicker:'Your next step',h:'Ready to climb the second mountain?',lead:'If you are a high-achieving woman ready to leave corporate burnout behind and build what is next on your own terms, the next cohort of The Second Mountain Mastermind is where we do this work together.',cta:'Apply for The Second Mountain Mastermind',disc:'This masterclass is for educational purposes only. It shares a framework and a personal story; it is not a guarantee of any specific income, career, or business result. Outcomes vary and depend on your own circumstances, effort, and decisions.'}
];
const svgMtn='<svg class="horizon" preserveAspectRatio="none" viewBox="0 0 1040 120"><use href="#mtn"/></svg>';
function esc(x){return x}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+((s.t==='title'||s.t==='cta'||s.t==='reframe')?' center':'');
  let h='<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.kicker)h+='<div class="kicker">'+s.kicker+'</div>';
  if(s.t==='title'){h+='<h1>'+s.h+'</h1><p class="lead" style="margin-top:24px">'+s.lead+'</p>';}
  else{h+='<h2>'+s.h+'</h2>';}
  if(s.lead&&s.t!=='title')h+='<p class="lead">'+s.lead+'</p>';
  if(s.big)h+='<p class="big">'+s.big+'</p>';
  if(s.body)h+='<p class="body">'+s.body+'</p>';
  if(s.bullets){h+='<ul>';s.bullets.forEach(b=>h+='<li>'+b+'</li>');h+='</ul>';}
  if(s.pillars){s.pillars.forEach(p=>{h+='<div class="pillar"><div class="pnum">'+p[0]+'</div><div class="pbody"><h3>'+p[1]+'</h3><p>'+p[2]+'</p></div></div>';});}
  if(s.mark)h+='<p class="quietmark" style="margin-top:22px">'+s.mark+'</p>';
  if(s.cta)h+='<a class="btn" href="https://www.conscioussuccessco.com/mastermind-application">'+s.cta+'</a>';
  if(s.disc)h+='<p class="disc">'+s.disc+'</p>';
  if(s.mtn)h+=svgMtn;
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
