<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>People Buy From People | A Flooring Masterclass with Tom Cockerill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Display&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box;}
  :root{
    --bg:#faf8f3;
    --panel:#fffdf9;
    --rule:#e7e1d4;
    --ink:#14110c;
    --dim:#6f695c;
    --accent:#aa8822;
  }
  html,body{height:100%;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Poppins',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;padding:6vh 7vw 12vh;}
  .slide{display:none;width:100%;max-width:940px;animation:fade .4s ease;}
  .slide.on{display:block;}
  @keyframes fade{from{opacity:0;transform:translateY(8px);}to{opacity:1;transform:none;}}
  .kicker{font-size:12px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:22px;}
  .partno{font-family:'Libre Caslon Display',Georgia,serif;font-size:15px;color:var(--dim);letter-spacing:.05em;margin-bottom:14px;}
  h1{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,64px);line-height:1.08;letter-spacing:-.005em;}
  h2{font-family:'Libre Caslon Display',Georgia,serif;font-weight:400;font-size:clamp(28px,4.4vw,44px);line-height:1.16;}
  .em{color:var(--accent);}
  .sub{font-size:clamp(17px,2.1vw,22px);color:var(--dim);line-height:1.55;margin-top:22px;max-width:800px;}
  .lead{font-size:clamp(18px,2.3vw,25px);color:var(--ink);line-height:1.5;margin-top:20px;max-width:800px;}
  ul{list-style:none;margin-top:28px;max-width:820px;}
  li{position:relative;font-size:clamp(16px,2vw,21px);color:var(--ink);line-height:1.5;padding:14px 0 14px 40px;border-bottom:1px solid var(--rule);}
  li:last-child{border-bottom:none;}
  li::before{content:"";position:absolute;left:0;top:22px;width:15px;height:15px;border:2px solid var(--accent);}
  li b{font-weight:600;}
  .quote{font-family:'Libre Caslon Display',Georgia,serif;font-size:clamp(24px,3.6vw,40px);line-height:1.32;max-width:860px;}
  .three{display:flex;gap:24px;margin-top:36px;flex-wrap:wrap;}
  .three .c{flex:1;min-width:210px;background:var(--panel);border:1px solid var(--rule);border-top:3px solid var(--accent);padding:26px 24px;}
  .three .c .n{font-family:'Libre Caslon Display',Georgia,serif;font-size:23px;color:var(--ink);margin-bottom:8px;}
  .three .c .n span{color:var(--accent);}
  .three .c p{font-size:15px;color:var(--dim);line-height:1.55;}
  .cred{margin-top:28px;display:flex;gap:16px 34px;flex-wrap:wrap;}
  .cred div{font-size:15px;color:var(--dim);max-width:230px;}
  .cred b{display:block;font-family:'Libre Caslon Display',Georgia,serif;font-size:20px;color:var(--ink);font-weight:400;margin-bottom:2px;}
  .cta-box{margin-top:30px;background:var(--ink);color:var(--panel);display:inline-block;padding:16px 30px;font-weight:600;font-size:18px;letter-spacing:.01em;}
  .cta-box .site{color:var(--accent);}
  .disc{margin-top:32px;font-size:13px;color:var(--dim);line-height:1.55;max-width:740px;font-style:italic;}
  .keyline{width:64px;height:3px;background:var(--accent);margin:0 0 26px;}
  footer{position:fixed;left:0;right:0;bottom:0;height:46px;display:flex;justify-content:space-between;align-items:center;padding:0 7vw;font-size:12px;color:var(--dim);border-top:1px solid var(--rule);letter-spacing:.02em;background:var(--bg);z-index:2;}
  footer .brand{font-family:'Libre Caslon Display',Georgia,serif;color:var(--ink);}
  .nav{position:fixed;bottom:62px;right:7vw;display:flex;gap:8px;z-index:5;}
  .nav button{background:var(--panel);border:1px solid var(--rule);color:var(--ink);width:38px;height:32px;cursor:pointer;font-size:15px;}
  .nav button:hover{border-color:var(--accent);}
  .count{position:fixed;bottom:70px;left:7vw;font-size:12px;color:var(--dim);z-index:5;}
  @media(max-width:640px){#stage{padding:5vh 8vw 16vh;}footer{padding:0 8vw;}}
</style>
</head>
<body>
<div id="stage"></div>
<footer><span class="brand">Cockerill &amp; Co</span><span>Tom Cockerill, Flooring Business Coach</span></footer>
<div class="count"><span id="cur">1</span> / <span id="tot"></span></div>
<div class="nav"><button id="prev">&#8249;</button><button id="next">&#8250;</button></div>
<script>
const S = [
  {t:'title', k:'A live flooring masterclass', h:'People Buy <span class="em">From People</span>.', s:'Why the flooring businesses that win are not the cheapest in town, they are the ones the customer trusts in the room. Presented by Tom Cockerill, founder of Cockerill &amp; Co and host of The UK Flooring Podcast.'},
  {t:'promise', k:'What this hour gives you', h:'A way to grow that a price war <span class="em">cannot</span> take from you.', pts:['Why customers really walk out, and it is rarely the price','The questions that turn a browser into a buyer before you quote','How a memorable showroom experience protects your margin']},
  {t:'who', k:'Who this is for', h:'Flooring owners who are done <span class="em">competing on price</span>.', s:'Sole traders, retailers and showroom owners who fit brilliant floors but feel the constant pull to drop the rate to win the job. If you are ready to be chosen for how you make people feel, not just for your square metre price, this hour is for you.'},
  {t:'trap', k:'The pattern', h:'Match the cheapest quote, win the job, lose the business.', s:'It feels like the only lever you have. A customer waves a cheaper number, you shave your price to keep the sale, and you do it again next week. Every discount comes straight off your profit, and it quietly trains your whole town to see flooring as a commodity.'},
  {t:'hook', k:'The reframe', quote:'"Nobody buys a floor. They buy the confidence that the right person is handling their home."'},
  {t:'part', n:'Part One', h:'Why the race to the bottom never ends', s:'The honest problem before the method.'},
  {t:'point', k:'The surface story', h:'Your product range is <span class="em">not</span> the difference.', s:'The showroom two streets over sells the same LVT, the same carpets, the same engineered oak. When two businesses offer the same product, the customer has only one thing left to compare on, and that is price. That is the trap, and better stock will never get you out of it.'},
  {t:'point', k:'The real reason', h:'The experience is the only thing they cannot copy.', s:'What a customer actually remembers is how it felt to deal with you. Were they listened to. Did you understand the room, the family, the way they live. That feeling is the one thing a rival cannot undercut, because it is not on the price list. It is you.'},
  {t:'part', n:'Part Two', h:'The Cockerill &amp; Co method', s:'Three principles and the conversation that ties them together.'},
  {t:'point', k:'Principle one', h:'Know your <span class="em">numbers</span>.', s:'Without knowing your numbers you cannot make informed decisions. Your real gross margin, the cost of a fitting day, the true price of that discount you keep giving away. When you know the numbers, you stop selling scared, because you finally know which jobs are worth winning and which ones cost you money to take on.'},
  {t:'point', k:'Principle two, in the room', h:'The Diagnostic Questions Approach.', pts:['How is this room actually lived in, and by whom','What went wrong with the last floor you had fitted','What matters more here, the look, the wear, or the upkeep','What is the outcome you are really paying for']},
  {t:'point', k:'Why the questions win', h:'Ask first, recommend second.', s:'Most salespeople reach for a product in the first minute. When you diagnose before you prescribe, like a professional, the customer feels understood, the recommendation lands as advice rather than a pitch, and price stops being the headline. You are now the expert who gets it, not another quote to compare.'},
  {t:'point', k:'Principle three', h:'Create a <span class="em">world-class</span> experience, every time.', s:'Creating a world-class experience for your customers is a must. The follow up call, the tidy van, the fitter who respects the house, the update when a delivery slips. None of it is expensive. All of it is remembered, and it is what turns one happy customer into three referrals.'},
  {t:'three', k:'The arc of the sale', h:'Diagnose. Deliver. <span class="em">Deserve the price.</span>', cards:[['Diagnose <span>first</span>','Ask the questions that surface what the customer truly wants before a single product is mentioned.'],['Deliver the <span>experience</span>','Handle the job the way you would want your own home handled, from first hello to final follow up.'],['Deserve the <span>price</span>','When the experience is undeniable, you hold your margin instead of defending it, and referrals do your marketing.']]},
  {t:'hook', k:'The principle underneath it all', quote:'"Relentless dedication is not a slogan. It is doing the small right thing on the day you least feel like it."'},
  {t:'part', n:'Part Three', h:'Inside a real week on the shop floor', s:'How this shows up once the showroom is quiet again.'},
  {t:'point', k:'In practice', h:'Small, repeatable, <span class="em">and yours</span>.', s:'A five minute huddle so the team knows the numbers that matter this week. A diagnostic conversation with every walk in, no exceptions. One follow up call the day after a fitting. A quick review of which jobs actually made money. Nothing dramatic, everything that compounds into a business you love running.'},
  {t:'cred', k:'Why learn this from me', h:'Tom Cockerill', s:'I built and ran a flooring business for thirteen years before I chose to spend my days helping other owners do it better.', creds:[['13 years','running a flooring business of my own, not theory from the outside'],['The UK Flooring Podcast','the voice of the UK flooring industry, hundreds of hours with real owners'],['A training home in Darlington','where flooring owners come to work on the business in person'],['The National Flooring Awards','built to celebrate the best of the trade, because standards matter']]},
  {t:'recap', k:'The whole thing in one line', h:'Stop selling floors. Start selling <span class="em">being understood</span>.', s:'Know your numbers, diagnose before you recommend, and make the experience the thing people remember. That is how a flooring business grows without ever being the cheapest name in town.'},
  {t:'cta', k:'If this is the way you want to run it', h:'Let us build the business you actually <span class="em">love</span>.', s:'If you are an ambitious flooring owner ready to take action, the next step is a free, one to one Mastermind Workshop, or join Alliance, the business club built just for flooring company owners. Everything is at cockerillandco.co.uk.', cta:'Start at <span class="site">cockerillandco.co.uk</span>', disc:'This masterclass is educational. No specific business result, revenue, or income is guaranteed, and results vary from owner to owner based on your own effort, market and circumstances. Nothing here is financial, legal, or tax advice.'}
];

const stage=document.getElementById('stage');
function render(){
  stage.innerHTML='';
  S.forEach((sl,i)=>{
    const d=document.createElement('div');
    d.className='slide'+(i===0?' on':'');
    let h='';
    if(sl.k) h+=`<div class="kicker">${sl.k}</div>`;
    if(sl.n) h+=`<div class="partno">${sl.n}</div><div class="keyline"></div>`;
    if(sl.quote){ h+=`<div class="quote">${sl.quote}</div>`; }
    else if(sl.h){ h+= (sl.t==='title'||sl.t==='part'||sl.t==='recap'||sl.t==='cta') ? `<h1>${sl.h}</h1>` : `<h2>${sl.h}</h2>`; }
    if(sl.s) h+=`<p class="${sl.t==='title'?'sub':'lead'}">${sl.s}</p>`;
    if(sl.pts){ h+='<ul>'+sl.pts.map(p=>`<li>${p}</li>`).join('')+'</ul>'; }
    if(sl.cards){ h+='<div class="three">'+sl.cards.map(c=>`<div class="c"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+'</div>'; }
    if(sl.creds){ h+='<div class="cred">'+sl.creds.map(c=>`<div><b>${c[0]}</b>${c[1]}</div>`).join('')+'</div>'; }
    if(sl.cta){ h+=`<div class="cta-box">${sl.cta}</div>`; }
    if(sl.disc){ h+=`<div class="disc">${sl.disc}</div>`; }
    d.innerHTML=h;
    stage.appendChild(d);
  });
  document.getElementById('tot').textContent=S.length;
}
let cur=0;
function show(n){
  const s=document.querySelectorAll('.slide');
  if(n<0||n>=s.length)return;
  s[cur].classList.remove('on'); cur=n; s[cur].classList.add('on');
  document.getElementById('cur').textContent=cur+1;
}
render();
document.getElementById('next').onclick=()=>show(cur+1);
document.getElementById('prev').onclick=()=>show(cur-1);
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' ')show(cur+1);
  if(e.key==='ArrowLeft')show(cur-1);
});
document.getElementById('stage').addEventListener('click',e=>{
  if(e.target.closest('.nav'))return;
  show(cur+1);
});
</script>
</body>
</html>
