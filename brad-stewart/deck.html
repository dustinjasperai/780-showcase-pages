<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Freedom-First Audiology Practice · Dr. Brad Stewart</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Karla:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#ffffff; --panel:#eef2f6; --rule:#d8e0e8;
    --acc:#038dff; --idx:#038dff; --ink:#161e2a;
    --chalk:#f4f7fb; --grey:#566072; --dim:#8b96a4;
  }
  html,body{height:100%}
  body{background:#dfe5ec;font-family:'Karla',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#dfe5ec}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Karla',sans-serif;font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Poppins',sans-serif;font-weight:600;color:var(--ink);line-height:1.16;letter-spacing:-.01em}
  .t-title h1{font-size:4.1vw;max-width:90%;font-weight:700}
  .t-normal h1{font-size:3.1vw;max-width:84%}
  .t-normal .body{font-family:'Karla',sans-serif;font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:400}
  .sub{font-family:'Karla',sans-serif;font-size:1.72vw;color:var(--grey);margin-top:3.2vh;max-width:78%;line-height:1.46;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.32vw;font-weight:600;color:var(--idx);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.6vw;max-width:90%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 0%,#22304a 0%,#101825 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:86%;color:var(--chalk);font-weight:600}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#0b3a63 0%,#101825 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--chalk)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:#cfe7ff;border-radius:100px;padding:1.3vh 1.7vw;font-family:'Karla',sans-serif;font-size:1.22vw;font-weight:600}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-family:'Karla',sans-serif;font-size:.92vw;color:#9fb0c6;font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .hub-motif{position:absolute;pointer-events:none}
  .title-hub{right:7%;bottom:8%;width:24vw}
  .corner-hub{right:6%;bottom:7.5%;width:11vw;opacity:.55}
  .brandline{font-family:'Karla',sans-serif;font-size:1.28vw;color:var(--grey);margin-top:3.4vh;font-weight:500;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(22,30,42,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-family:'Karla',sans-serif;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-family:'Karla',sans-serif;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-family:'Karla',sans-serif;font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.2vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.4vw}.t-section h1{font-size:7vw}.t-dark h1{font-size:6vw}
    .t-cta h1{font-size:6.6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 21</div>
<div class="brand-foot">AudCoach · Dr. Brad Stewart</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- freedom motif: the owner (node) stepping out of the center of the practice hub -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="hub" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.6" stroke-linecap="round">
    <circle cx="96" cy="75" r="52" stroke="#038dff" opacity="0.24"/>
    <circle cx="96" cy="75" r="30" stroke="#038dff" opacity="0.16"/>
    <circle cx="96" cy="75" r="7" fill="#161e2a" stroke="none" opacity="0.30"/>
    <path d="M150 75 L212 75" stroke="#038dff" opacity="0.85"/>
    <circle cx="222" cy="75" r="8" fill="none" stroke="#038dff" stroke-width="2.8"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Freedom-First Audiology Practice',sub:'How to build a practice that grows profit while you step out of the center of everything. A live masterclass for independent audiology practice owners.',brand:true,hub:'title'},
 {t:'normal',k:'Who this is for',title:'You built a practice that helps people hear. Now it runs on you.',body:'You own an independent audiology practice and you are the best clinician in the building. Every fitting, every hard case, every decision routes back through your chair, which is exactly why the practice cannot grow past the hours you personally work.'},
 {t:'dark',title:'A practice that needs you in every appointment is a job you own, not a business you own.'},

 {t:'section',idx:'Part One',title:'The Owner Is the Bottleneck'},
 {t:'normal',k:'The center trap',title:'Everything good in your practice depends on you being there.',body:'When you are the person who converts the candidate, solves the tough fit, and keeps the standard high, the practice quietly organizes itself around your presence. That is what makes it feel unleaveable.'},
 {t:'normal',k:'Why more patients is not the fix',title:'Adding volume to a practice built around you just fills the calendar you are already trapped inside.',body:'More patients on the same model means more hours in the chair, more nights catching up, and the same ceiling. The problem was never demand. It is that the model routes everything through one person.'},
 {t:'dark',title:'More volume on the same model buys you a busier version of the same trap.'},

 {t:'section',idx:'Part Two',title:'The Freedom-First Approach'},
 {t:'normal',k:'Freedom first, profit follows',title:'Design the practice so profit rises as you step out of the center.',body:'Freedom-First flips the usual order. Instead of grinding harder for growth, you rebuild the practice so it makes more while depending on you less. Owners who do this routinely take ten or more clinic hours back a week.'},
 {t:'normal',k:'Your Dream Practice',title:'Start from the practice you actually want to own.',body:'Define it, then work backward. Your Dream Practice and Reverse Engineer Your Dream Practice name the model you are building toward, and The Mobile Model Maker turns it into concrete pricing and service decisions before you change a thing.'},
 {t:'normal',k:'Own your demand',title:'A mobile, insurance-independent model that is not at the mercy of reimbursement.',body:'When your revenue is not tied to shrinking insurance rates, you set your prices and protect your margin. The Senior Living Outreach System builds a steady stream of candidates from communities that need you, on your terms.'},
 {t:'normal',k:'The 5 Business Pillars',title:'The structure that holds a practice up without the owner at the center.',body:'Profit, patients, people, process, and the owner role. The Five Business Pillars give you a simple frame for what a practice actually needs, so growth stops meaning you personally carrying more weight.'},
 {t:'normal',k:'Systems that run without you',title:'Build the machine once, then let it run.',body:'The Simple System for Building Systems is how you hand off the day-to-day: documented, repeatable, and owned by the team instead of living in your head. This is the difference between a busy clinic and a business.'},
 {t:'dark',title:'When the practice runs on systems instead of on you, profit and your time stop competing.'},

 {t:'section',idx:'Part Three',title:'What Changes'},
 {t:'normal',k:'The owner this builds',title:'Profit up, hours back, and a practice you own instead of one that owns you.',body:'The outcome is not a lighter workload bolted onto the same stress. It is a practice with consistent candidate flow, high treatment acceptance, and a team that runs the standard you set, so stepping back does not mean stepping down.'},
 {t:'dark',title:'The goal was never a busier chair. It was a business you can step back from and still profit.'},
 {t:'normal',k:'Why Brad Stewart',title:'A method built by an owner who actually did it.',body:'From 2014 to 2021 I built, ran, and sold my own mobile audiology practice in the Dallas market, serving nearly a hundred senior-living communities and reaching seven figures in under three years before exiting. Freedom-First is the model I lived, not a theory I read.'},

 {t:'section',idx:'Your Next Step',title:'Get Your Freedom-First Roadmap'},
 {t:'normal',k:'Start with a Practice Audit',title:'One conversation to see where the practice depends on you.',body:'The free Better Business Breakthrough Practice Audit maps exactly where you are the bottleneck and the first moves that pull you out of the center, so profit and freedom start climbing together.'},
 {t:'cta',title:'Ready to step out of the center of your practice?',chips:['Book your free Practice Audit','Ask about 1:1 coaching'],disc:'Educational content for audiology practice owners. No income, profit, or practice result is guaranteed. Results vary by practice, market, and the work you put in.'},
];

const deck=document.getElementById('deck');
function hub(kind){return `<svg class="hub-motif ${kind==='title'?'title-hub':'corner-hub'}"><use href="#hub"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Freedom-First</b> Approach · Dr. Brad Stewart, AuD</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.hub) h+=hub(s.hub);
  else if(s.t==='title') h+=hub('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
