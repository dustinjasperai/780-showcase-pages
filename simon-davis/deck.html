<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Four Pillars Masterclass &middot; Simon Davis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lato:ital,wght@0,400;0,700;1,400&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#FAF6F0; --panel:#F0E9DF; --rule:#E2D6C4;
    --acc:#FF7802; --deep:#2B2D2F; --ink:#2B2D2F; --dim:#6C6F72; --paper:#FCFAF6;
  }
  html,body{height:100%}
  body{background:#EDE4D6;font-family:'Poppins',-apple-system,sans-serif;color:var(--ink);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#EDE4D6}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--acc);margin-bottom:2.4vh}
  h1{font-family:'Lato',Georgia,serif;font-weight:700;color:var(--ink);line-height:1.14;letter-spacing:-.005em}
  .t-title h1{font-size:3.9vw;max-width:88%}
  .t-normal h1{font-size:2.9vw;max-width:84%}
  .t-normal .body{font-size:1.42vw;color:#4A4642;margin-top:2.6vh;max-width:74%;line-height:1.56;font-weight:400}
  .sub{font-size:1.6vw;color:#4A4642;margin-top:3.2vh;max-width:76%;line-height:1.48;font-weight:400}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Poppins',sans-serif;font-size:1.3vw;font-weight:600;color:var(--deep);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.1vw;max-width:88%}
  .t-section .rule{width:16vw;height:3px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.4vh}
  .t-dark{background:linear-gradient(180deg,var(--deep) 0%,#17181A 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.3vw;max-width:82%;font-style:italic;color:var(--paper)}
  .t-cta{background:linear-gradient(180deg,var(--deep) 0%,#17181A 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.5vw;max-width:80%;color:var(--paper)}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--acc);color:#FBE3CC;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.88vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .t-cta .disc{color:#CFC9C2}
  .motif{position:absolute;pointer-events:none;opacity:.92}
  .title-motif{right:7%;bottom:9%;width:14vw}
  .corner-motif{right:6%;bottom:7.5%;width:6.4vw;opacity:.6}
  .brandline{font-size:1.24vw;color:#4A4642;margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(43,45,47,.1);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:6.6vw}.t-normal h1{font-size:5vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.2vw}.t-section h1{font-size:6.4vw}.t-dark h1{font-size:5.4vw}
    .t-cta h1{font-size:6vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 18</div>
<div class="brand-foot">The Profitable Fencer</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- four-pillars motif: four simple columns of equal height on a base line, tied to the Four Pillars thesis -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pillars" viewBox="0 0 200 160">
  <g fill="none" stroke="#2B2D2F" stroke-width="3">
    <line x1="10" y1="148" x2="190" y2="148" stroke-width="4" opacity="0.4" stroke-linecap="round"/>
    <rect x="24" y="60" width="26" height="88" rx="3" fill="#FF7802" opacity="0.85" stroke="none"/>
    <rect x="76" y="40" width="26" height="108" rx="3" fill="#2B2D2F" opacity="0.28" stroke="none"/>
    <rect x="128" y="72" width="26" height="76" rx="3" fill="#FF7802" opacity="0.55" stroke="none"/>
    <rect x="150" y="52" width="0" height="0" opacity="0"/>
    <rect x="152" y="50" width="26" height="98" rx="3" fill="#2B2D2F" opacity="0.18" stroke="none"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Four Pillars Masterclass',sub:'For fence contractors across Australia and New Zealand, taught by a 30-year fence builder who has coached 200+ business owners.',brand:true,arc:'title'},
 {t:'normal',k:'Who this is for',title:'You have watched every video. Nothing in the business changed.',body:'You run a fencing business, and you have picked up plenty of information along the way: quoting tips, hiring advice, pricing formulas. You still find yourself doing most of it from memory, on the fly, the same way you did five years ago.'},
 {t:'dark',title:'A fencing business with no documented systems is not a business. It is a job that owns you.'},

 {t:'section',idx:'Part One',title:'Why Fence Contractors Stay Stuck'},
 {t:'normal',k:'The information trap',title:'You do not have an information problem. You have an implementation problem.',body:'Most fencing business owners have watched dozens of videos on pricing, hiring, and quoting. Almost nothing changes, because a video is not a system you can hand to your business and actually run.'},
 {t:'normal',k:'The real gap',title:'Knowing what to do and having it documented are two different things.',body:'The businesses that get out of the owner’s head are the ones with the actual steps written down: the exact hiring sequence, the exact quoting process, the exact numbers to track. Everything else is still trial and error, at your expense.'},
 {t:'dark',title:'Implementation, not information. That is the whole difference.'},

 {t:'section',idx:'Part Two',title:'The Four Pillars, Named: Systems, Sales, Financials, Mindset'},
 {t:'normal',k:'Systems',title:'32+ documented systems, including a 10-Step Hiring Process.',body:'A named, structured process running from the job ad through to onboarding, so a new hire is never just thrown at a job site and hoped for. Paired with the Roadblock-Free Checklist, the on-ramp framework for getting the fundamentals in place.'},
 {t:'normal',k:'Sales',title:'Voice of the Customer: what your clients tell you, systematically captured.',body:'Most fencing businesses get client feedback by accident, in a text message that gets forgotten. Voice of the Customer is a named system for capturing it on purpose and using it to grow, not just to file away.'},
 {t:'normal',k:'Financials',title:'Benchmarking: your numbers, measured against the industry’s.',body:'Knowing your revenue is not the same as knowing whether it is good. Benchmarking compares your numbers against real industry figures so you can see exactly where the business is actually weak, backed by a finance calculator built specifically for Australian fencers.'},
 {t:'normal',k:'Mindset',title:'The shift from doing the work to building the business around it.',body:'Simon built his own fencing company into a multi-division operation through years of costly trial and error before naming what actually worked. The Mindset pillar is that shift, made deliberate instead of accidental.'},
 {t:'dark',title:'Four pillars. Not four more things to figure out. Four things already documented, ready to install.'},

 {t:'section',idx:'Part Three',title:'The Fencing Business Built On All Four'},
 {t:'normal',k:'Why Simon Davis',title:'30 years on the tools, then 200+ fencing businesses coached.',body:'Simon started as a fence installer in the 1990s and grew his own company into a multi-division operation before founding The Profitable Fencer. Everything taught here was learned on real jobs, with real money on the line, not from a textbook.'},

 {t:'section',idx:'Your Next Step',title:'Pick Your Level'},
 {t:'normal',k:'Foundation to Master Craftsman',title:'Start with the toolkit, or go straight to 1-on-1.',body:'Foundation gets you the templates and the Roadblock-Free Checklist. Operators Room adds the monthly group coaching call and the community. Master Craftsman is private, 1-on-1, application only, for owners ready to install all four pillars with direct support.'},
 {t:'cta',title:'Ready to build all four pillars?',chips:['Start with Foundation','Apply for Master Craftsman'],disc:'Educational content for fence contractors and tradies. No income or business result is guaranteed. Results vary by business, market, and execution.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#pillars"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">The <b>Profitable Fencer</b> &middot; Simon Davis</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.arc) h+=motif(s.arc);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
