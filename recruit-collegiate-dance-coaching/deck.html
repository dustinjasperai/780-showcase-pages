<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>How to Get Recruited onto a College Dance Team — Recruit : Collegiate Dance Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#fbf9fd; --ink:#241029; --soft:#4a3356; --muted:#8a7a92;
    --accent:#5d037d; --deep:#6f20c7; --rule:#ece4f1; --panel:#ffffff;
  }
  html,body{height:100%}
  body{font-family:'Poppins',system-ui,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
  #deck{height:100vh;width:100vw;position:relative;overflow:hidden}
  .slide{position:absolute;inset:0;display:none;flex-direction:column;justify-content:center;padding:7vh 9vw;opacity:0;transition:opacity .35s ease}
  .slide.on{display:flex;opacity:1}
  .kicker{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:28px}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(34px,6vw,70px);line-height:1.05;letter-spacing:-.01em}
  h2{font-family:'DM Serif Display',Georgia,serif;font-weight:400;font-size:clamp(28px,4.4vw,52px);line-height:1.1;margin-bottom:22px}
  .sub{font-size:clamp(17px,2.1vw,25px);color:var(--soft);font-weight:300;margin-top:26px;max-width:24ch;line-height:1.45}
  .big{font-family:'DM Serif Display',Georgia,serif;font-size:clamp(30px,5.2vw,62px);line-height:1.12;max-width:17ch;letter-spacing:-.01em}
  .big .hl{color:var(--accent)}
  p.body{font-size:clamp(16px,2vw,22px);color:var(--soft);font-weight:300;line-height:1.5;max-width:30ch;margin-top:10px}
  ul{list-style:none;margin-top:14px;max-width:34ch}
  li{font-size:clamp(16px,1.9vw,22px);color:var(--soft);font-weight:400;padding:14px 0;border-bottom:1px solid var(--rule);display:flex;gap:16px;line-height:1.4}
  li b{color:var(--ink);font-weight:600}
  li .n{font-family:'DM Serif Display',serif;color:var(--accent);font-size:1.1em;min-width:1.4em}
  .partnum{font-family:'DM Serif Display',serif;font-size:clamp(60px,12vw,150px);color:var(--deep);opacity:.18;line-height:1}
  .steprow{display:flex;align-items:baseline;gap:24px}
  .stepnum{font-family:'DM Serif Display',serif;font-size:clamp(46px,8vw,96px);color:var(--accent);line-height:.9}
  .chip{display:inline-block;background:var(--accent);color:#fff;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:600;padding:7px 16px;border-radius:999px;margin-bottom:26px;width:fit-content}
  .disc{font-size:13px;color:var(--muted);font-weight:300;margin-top:30px;max-width:48ch;line-height:1.5}
  .cta-row{margin-top:30px;font-size:clamp(18px,2.3vw,26px);color:var(--ink);font-weight:600}
  .cta-row span{color:var(--accent)}
  .foot{position:absolute;left:9vw;bottom:5vh;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:500}
  .nav{position:absolute;right:9vw;bottom:5vh;font-size:12px;color:var(--muted);font-weight:500;letter-spacing:.1em}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:start;max-width:52ch}
  .two h4{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;font-weight:600}
  .two p{font-size:clamp(15px,1.7vw,20px);color:var(--soft);font-weight:300;line-height:1.45}
  @media(max-width:640px){.two{grid-template-columns:1fr}.slide{padding:8vh 8vw}}
</style>
</head>
<body>
<div id="deck"></div>
<script>
const S=[
  {t:'title',
   kicker:"A Recruit : Collegiate Dance Coaching Masterclass",
   h:"How to Get Recruited onto a College Dance Team",
   sub:"The class-by-class roadmap for dancers who want a roster spot, not just a maybe."},

  {t:'who',
   kicker:"Who this is for",
   h:"If a college dance team is the goal, this is for you.",
   list:[
     ["Freshmen & sophomores","who want to start on the right foot instead of scrambling senior year"],
     ["Juniors","who are ready to get on college coaches' radar now"],
     ["Seniors","in the thick of auditions and decisions"],
     ["Dance parents","trying to help without knowing the playbook"]
   ]},

  {t:'big',
   kicker:"The trap",
   big:"Talent gets you noticed. It doesn't get you <span class='hl'>recruited</span>."},

  {t:'list',
   kicker:"What most families think the plan is",
   h:"The hope-and-wait plan",
   list:[
     ["“She's talented, it'll work out”","talent is the price of entry, not the plan"],
     ["“We'll figure it out senior year”","the timeline started two years earlier"],
     ["“Colleges will find her”","coaches recruit from dancers who found them first"]
   ]},

  {t:'big',
   kicker:"The reframe",
   big:"College coaches aren't looking for the best dancer. They're looking for the <span class='hl'>right recruit</span>."},

  {t:'part',num:"One",h:"Why talented dancers go unrecruited"},

  {t:'list',
   kicker:"Part One",
   h:"Three reasons it falls apart",
   list:[
     ["Started too late","the recruiting calendar moves faster than most families realize"],
     ["Invisible to the right programs","great dancing nobody in a position to recruit ever sees"],
     ["No profile a coach can act on","a highlight reel is not a recruit profile"]
   ]},

  {t:'big',
   kicker:"The core problem",
   big:"Recruiting is a process with a calendar. Most dancers find the calendar a <span class='hl'>year too late</span>."},

  {t:'part',num:"Two",h:"The Recruit Roadmap"},

  {t:'step',num:"1",kicker:"Part Two",h:"Know your timeline",
   body:"What to do freshman, sophomore, junior and senior year. Each class year has one move that matters most, and your plan changes with it."},

  {t:'step',num:"2",kicker:"Part Two",h:"Build your recruit profile",
   body:"A dance résumé and a technique reel a coach can open in seconds and actually evaluate, not a four-minute competition highlight."},

  {t:'step',num:"3",kicker:"Part Two",h:"Get on the right coaches' radar",
   body:"Find the programs that actually fit, reach the coaches directly, and do it before the roster is full. The right 20 schools beat emailing 200."},

  {t:'step',num:"4",kicker:"Part Two",h:"Prepare the audition",
   body:"Tryout combos, interviews and campus visits. Walk in knowing what each program is scoring, so audition day is execution, not a guess."},

  {t:'step',num:"5",kicker:"Part Two",h:"Choose the right fit",
   body:"Team culture, a realistic roster spot, academics and cost. The goal is a team where a dancer thrives for four years, not just an offer."},

  {t:'big',
   kicker:"The point",
   big:"You don't need to be everywhere. You need to be in front of the <span class='hl'>right programs</span>, early."},

  {t:'part',num:"Three",h:"A recruiting year that actually works"},

  {t:'two',
   kicker:"Part Three",
   h:"Hope vs. a plan",
   left:{head:"Without a plan",body:"Senior year panic. A reel sent late to a handful of schools. Auditioning blind. Hoping someone noticed."},
   right:{head:"With the roadmap",body:"A profile ready early. The right coaches already know her name. Auditions she has prepared for. Choices, not a scramble."}},

  {t:'why',
   kicker:"Why Recruit",
   h:"Mentor-matched, one dancer at a time",
   body:"Recruit : Collegiate Dance Coaching is built on individualized training, education and preparation, organized around your class year. Mentors who know the process, class-by-class guides, and the Ultimate College Directory so no family has to navigate it alone."},

  {t:'big',
   kicker:"The takeaway",
   big:"Your dream team is real. The path to it is a <span class='hl'>plan</span>, not a hope."},

  {t:'cta',
   kicker:"Your next step",
   h:"Become a Recruit",
   body:"Start with the free class guide for your graduation year, then apply to join the Recruit season and get matched with a mentor.",
   disc:"Educational masterclass only. No roster spot, scholarship, admission, or result is guaranteed. Results vary by dancer, program and effort."}
];

const deck=document.getElementById('deck');
function esc(x){return x}
function slideHTML(s){
  let inner="";
  if(s.t==='title'){
    inner=`<div class="kicker">${s.kicker}</div><h1>${s.h}</h1><div class="sub">${s.sub}</div>`;
  }else if(s.t==='who'){
    inner=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><ul>`+s.list.map(x=>`<li><b>${x[0]}</b> &nbsp;${x[1]}</li>`).join('')+`</ul>`;
  }else if(s.t==='big'){
    inner=`<div class="kicker">${s.kicker}</div><div class="big">${s.big}</div>`;
  }else if(s.t==='list'){
    inner=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><ul>`+s.list.map((x,i)=>`<li><span class="n">${i+1}</span><span><b>${x[0]}</b><br>${x[1]}</span></li>`).join('')+`</ul>`;
  }else if(s.t==='part'){
    inner=`<div class="partnum">${s.num}</div><h1>${s.h}</h1>`;
  }else if(s.t==='step'){
    inner=`<div class="kicker">${s.kicker}</div><div class="steprow"><div class="stepnum">${s.num}</div><div><h2>${s.h}</h2><p class="body">${s.body}</p></div></div>`;
  }else if(s.t==='two'){
    inner=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><div class="two"><div><h4>${s.left.head}</h4><p>${s.left.body}</p></div><div><h4>${s.right.head}</h4><p>${s.right.body}</p></div></div>`;
  }else if(s.t==='why'){
    inner=`<div class="kicker">${s.kicker}</div><h2>${s.h}</h2><p class="body" style="max-width:40ch">${s.body}</p>`;
  }else if(s.t==='cta'){
    inner=`<span class="chip">${s.kicker}</span><h1>${s.h}</h1><p class="body" style="max-width:38ch">${s.body}</p><div class="disc">${s.disc}</div>`;
  }
  return inner;
}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide'+(i===0?' on':'');
  d.innerHTML=slideHTML(s)+`<div class="foot">Recruit : Collegiate Dance Coaching</div><div class="nav">${i+1} / ${S.length}</div>`;
  deck.appendChild(d);
});
let cur=0;const slides=[...document.querySelectorAll('.slide')];
function go(n){slides[cur].classList.remove('on');cur=Math.max(0,Math.min(S.length-1,n));slides[cur].classList.add('on')}
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowRight'||e.key===' '||e.key==='PageDown'){go(cur+1);e.preventDefault()}
  if(e.key==='ArrowLeft'||e.key==='PageUp'){go(cur-1);e.preventDefault()}
  if(e.key==='Home'){go(0)} if(e.key==='End'){go(S.length-1)}
});
deck.addEventListener('click',e=>{const w=window.innerWidth;go((e.clientX> w*0.35)?cur+1:cur-1)});
</script>
</body>
</html>
