<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Beat the Passive Kraken — A Live Masterclass with Dan Lowe</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=DM+Sans:ital,wght@0,400;0,500;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F6EFE1; --panel:#FFFCF4; --rule:#E4D8C2; --ink:#1A1A1A;
    --navy:#102E47; --vermilion:#C2672E; --muted:#5B5247;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:"DM Sans",system-ui,sans-serif;line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:54px 58px;margin:0 0 26px;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--vermilion)}
  .kicker{font-family:"DM Sans";font-weight:700;letter-spacing:.14em;text-transform:uppercase;font-size:12px;color:var(--vermilion);margin-bottom:18px}
  .part-label{font-family:"DM Sans";font-weight:700;letter-spacing:.16em;text-transform:uppercase;font-size:13px;color:var(--navy);margin-bottom:10px}
  h1{font-family:"Shippori Mincho";font-weight:700;font-size:46px;line-height:1.12;color:var(--navy);margin-bottom:20px}
  h2{font-family:"Shippori Mincho";font-weight:700;font-size:33px;line-height:1.18;color:var(--navy);margin-bottom:16px}
  .sub{font-size:19px;color:var(--muted);max-width:60ch}
  .big{font-family:"Shippori Mincho";font-weight:500;font-size:30px;line-height:1.3;color:var(--ink)}
  .jp{font-family:"Shippori Mincho";color:var(--vermilion);font-weight:500}
  ul{list-style:none;margin-top:20px}
  li{position:relative;padding-left:30px;margin-bottom:14px;font-size:19px;color:var(--ink)}
  li::before{content:"";position:absolute;left:0;top:11px;width:14px;height:3px;background:var(--vermilion);border-radius:2px}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-top:26px}
  .card{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px}
  .card .n{font-family:"Shippori Mincho";font-size:22px;color:var(--vermilion);font-weight:700;margin-bottom:8px}
  .card .ch{font-weight:700;color:var(--navy);margin-bottom:6px;font-size:17px}
  .card p{font-size:15px;color:var(--muted)}
  .arc{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px;font-family:"Shippori Mincho";font-size:22px;color:var(--navy)}
  .arc span{background:var(--bg);border:1px solid var(--rule);border-radius:999px;padding:10px 20px}
  .arc .sep{color:var(--vermilion);font-weight:700}
  .disc{margin-top:26px;padding-top:18px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted);max-width:70ch}
  .cta-line{font-size:20px;color:var(--ink);margin-top:10px}
  .cta-url{font-family:"DM Sans";font-weight:700;color:var(--vermilion);font-size:20px;margin-top:14px}
  @media(max-width:640px){.slide{padding:34px 26px}h1{font-size:34px}h2{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',
  kicker:'A live masterclass with Dan Lowe, Japanese Active Learning Circle',
  h:'Beat the Passive Kraken',
  sub:'Why you studied Japanese for years and still can’t speak, and the 10-minute daily fix that finally moves it.'},

 {t:'who',
  h:'Who this is for',
  sub:'If this is you, you are in the right room:',
  list:['You lived it in Japan, maybe on JET, and you were good.',
        'You came back to the US and the language quietly went rusty.',
        'You have tried apps and flashcards, but speaking still freezes.',
        'You want your Japanese back, for work, for travel, for yourself.']},

 {t:'trap',
  big:'You were fluent in Chiba. Now you freeze ordering ramen in Boston. That is not a memory problem. It is a method problem.'},

 {t:'reframe',
  kicker:'The uncomfortable reframe',
  h:'Input that feels like work but builds nothing',
  sub:'Most Japanese study is consumption. You watch, you read, you tap through a deck, and it feels productive. But the skill you actually want, speaking, is a thing you produce. You cannot build an output skill with input alone.'},

 {t:'part',label:'Part One',h:'The three enemies that keep your Japanese stuck'},

 {t:'enemy',
  jp:'受け身クラーケン',
  h:'The Passive Kraken',
  sub:'The monster that whispers that passive study is good enough. Flashcards and apps build the illusion of progress while your speaking stays exactly where it was. The counter is recall: produce the word before you check it.'},

 {t:'enemy',
  h:'The Binge Beast',
  sub:'It coaxes you into a weekend study marathon, then a week of nothing. Intensity without consistency fades fast. The counter is the Non-Zero Daily Habit: a tiny daily minimum you never skip.'},

 {t:'enemy',
  h:'The Friction Goblin',
  sub:'The setup cost that keeps you from ever starting. I will practice once I finish building the perfect deck, and three weeks pass. The counter is removing the friction so today’s rep takes ten seconds to begin.'},

 {t:'part',label:'Part Two',h:'The method: active learning'},

 {t:'framework',
  h:'The three pillars',
  sub:'Drawn from the habits of JETs who passed JLPT N1 and N2. Not talent. Habits.',
  cards:[{n:'01',ch:'Peers',p:'Surround yourself with growth-minded Japanese learners so showing up is normal, not heroic.'},
         {n:'02',ch:'Production',p:'Actively produce the language, speaking and writing, instead of only consuming it.'},
         {n:'03',ch:'Feedback',p:'Get immediate feedback on what you produced, so errors do not calcify.'}]},

 {t:'workout',
  h:'The 10-minute workout',
  sub:'A workout program for your Japanese-learning brain. Ten minutes, every day.',
  cards:[{n:'Warm-up',ch:'3 to 5 min',p:'Light input to prime the session: a short clip, a paragraph, a few phrases.'},
         {n:'Heavy lifting',ch:'4 to 5 min',p:'Recall with no references. Say it or write it from memory. This is where skill is built.'},
         {n:'Cool-down',ch:'1 to 2 min',p:'Share your output with the community and collect feedback.'}]},

 {t:'principle',
  h:'The Non-Zero Daily Habit',
  cards:[{n:'Dose',ch:'Minimum effective dose',p:'Pick a daily minimum so small you cannot talk yourself out of it. Three minutes counts.'},
         {n:'Micro',ch:'Micro-sessions',p:'Break practice into short blocks scattered through the day instead of one dreaded block.'},
         {n:'Stack',ch:'Stack and trigger',p:'Attach a rep to something you already do, like your morning coffee, so it runs on autopilot.'}]},

 {t:'quote',
  big:'Consistency beats intensity when intensity is not consistent.'},

 {t:'part',label:'Part Three',h:'How a comeback week actually runs'},

 {t:'week',
  h:'A week of reps, not a marathon',
  list:['Monday: 10-minute workout, recall yesterday’s phrases out loud.',
        'Tuesday: micro-session at lunch, one scenario you actually use.',
        'Wednesday: post a 60-second voice note, get feedback from the Circle.',
        'Thursday: stack a rep onto your commute.',
        'Friday: review the week’s output, keep what stuck.',
        'The point is the streak, not the hero day.']},

 {t:'arc',
  h:'From rusty to ready, in a sprint',
  steps:['Baseline','Adaptation','Expansion'],
  sub:'Measure where your Japanese really is, adapt to the speaking scenarios you actually face, then expand into harder ground with a coach beside you.'},

 {t:'whyme',
  h:'Why learn this from me',
  list:['Two years on the JET Program in Kujukuri, Chiba, then fifteen years using Japanese professionally.',
        'A year at Sophia University in Tokyo, business-Japanese certification from Waseda, MBA from Babson.',
        'Former president of the New England JET Alumni Association, represented tens of thousands of US JET alumni.',
        'Visited 40 of Japan’s 47 prefectures, part of it by folding bike. I am a learning-habit nerd by temperament.']},

 {t:'recap',
  h:'Three things to take with you',
  list:['Passive input feels like progress and is not. Produce before you check.',
        'A tiny daily rep beats a weekend binge, every time.',
        'Peers plus production plus feedback is how rusty Japanese comes back.']},

 {t:'cta',
  h:'Your next rep starts today',
  cta_line:'Join the next live session and the Japanese Active Learning Circle, or start a Speaking Lab sprint and get a coach in your corner.',
  cta_url:'japanesecircle.com',
  disc:'This masterclass is educational. No specific result, outcome, or level of Japanese proficiency is guaranteed. Results vary with your effort, time, and starting point.'}
];

function card(c){return '<div class="card"><div class="n">'+c.n+'</div><div class="ch">'+c.ch+'</div><p>'+c.p+'</p></div>';}
function render(){
  var out='';
  for(var i=0;i<S.length;i++){var s=S[i];var b='';
    if(s.kicker) b+='<div class="kicker">'+s.kicker+'</div>';
    if(s.label) b+='<div class="part-label">'+s.label+'</div>';
    if(s.jp) b+='<div class="kicker jp" style="font-size:18px;letter-spacing:0">'+s.jp+'</div>';
    if(s.h) b+=(s.t==='title'?'<h1>'+s.h+'</h1>':'<h2>'+s.h+'</h2>');
    if(s.big) b+='<p class="big">'+s.big+'</p>';
    if(s.sub) b+='<p class="sub">'+s.sub+'</p>';
    if(s.list){b+='<ul>';for(var j=0;j<s.list.length;j++)b+='<li>'+s.list[j]+'</li>';b+='</ul>';}
    if(s.cards){b+='<div class="grid">';for(var k=0;k<s.cards.length;k++)b+=card(s.cards[k]);b+='</div>';}
    if(s.steps){b+='<div class="arc">';for(var a=0;a<s.steps.length;a++){b+='<span>'+s.steps[a]+'</span>';if(a<s.steps.length-1)b+='<span class="sep">then</span>';}b+='</div>';}
    if(s.cta_line) b+='<p class="cta-line">'+s.cta_line+'</p>';
    if(s.cta_url) b+='<div class="cta-url">'+s.cta_url+'</div>';
    if(s.disc) b+='<div class="disc">'+s.disc+'</div>';
    out+='<section class="slide">'+b+'</section>';
  }
  document.getElementById('deck').innerHTML=out;
}
render();
</script>
</body>
</html>
