<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Bamboo Progress Masterclass · Brian Bosley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600;6..72,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#eef0e9;          /* sage-tinted off-white — his cover's light neutral / shirt */
    --panel:#e3e6db;       /* deeper sage tint of the ground */
    --ink:#23271f;         /* warm charcoal-green — his suit */
    --ink-soft:#454c3c;
    --ink-mute:#7c8270;
    --accent:#5a6b3a;      /* deep bamboo/olive green */
    --rule:#d6dac9;
    --cream:#eef0e9;
  }
  html{-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}
  body{background:#dfe2d7;font-family:'Inter',system-ui,sans-serif;color:var(--ink)}
  .deck{max-width:1120px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);
    border-radius:20px;padding:72px 76px;margin:22px 0;min-height:560px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
    box-shadow:0 16px 40px rgba(35,39,31,.08);
  }
  .kicker{font-family:'Inter';font-size:12px;font-weight:600;letter-spacing:.17em;
    text-transform:uppercase;color:var(--accent);margin-bottom:20px}
  h1{font-family:'Newsreader','Georgia',serif;font-weight:600;
    line-height:1.12;letter-spacing:-.01em;color:var(--ink);font-size:44px}
  .sub{font-family:'Newsreader',serif;font-size:23px;font-weight:400;color:var(--ink-soft);
    margin-top:22px;line-height:1.4;max-width:26ch;font-style:italic}
  .body{font-family:'Inter';font-size:19px;line-height:1.62;color:var(--ink-soft);
    margin-top:22px;max-width:60ch}
  .mark{position:relative;display:inline;background:linear-gradient(180deg,transparent 62%,rgba(90,107,58,.24) 62%)}
  /* title slide */
  .t-title{background:var(--ink);border-color:var(--ink)}
  .t-title h1{color:var(--cream);font-size:60px;font-weight:600;max-width:20ch}
  .t-title .sub{color:#cdd3c2;font-size:24px;max-width:34ch}
  .t-title .kicker{color:#a9b98a}
  .brandline{position:absolute;left:76px;bottom:52px;font-family:'Inter';font-size:15px;
    font-weight:500;color:#b7bda9;letter-spacing:.02em}
  .brandline b{color:#a9b98a;font-weight:600}
  .roots{position:absolute;right:60px;top:56px;width:96px;height:96px;opacity:.9}
  .roots path{stroke:#a9b98a;stroke-width:2.4;fill:none;stroke-linecap:round}
  /* section dividers */
  .t-section{background:var(--panel)}
  .t-section .idx{font-family:'Inter';font-size:13px;font-weight:600;
    letter-spacing:.14em;color:var(--accent);text-transform:uppercase;margin-bottom:18px}
  .t-section h1{font-size:52px;max-width:17ch}
  .t-section .rule{width:84px;height:5px;border-radius:4px;background:var(--accent);margin-top:28px}
  /* punch slides */
  .t-dark{background:var(--ink)}
  .t-dark h1{color:var(--cream);font-size:44px;max-width:23ch;font-weight:500}
  .t-dark .accent-word{color:#a9b98a;font-style:italic}
  /* pillar cards row */
  .pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px}
  .pcard{background:#f6f7f2;border:1px solid var(--rule);border-radius:14px;padding:26px 24px}
  .pcard .n{font-family:'Newsreader',serif;font-size:15px;font-weight:700;color:var(--accent);margin-bottom:10px;letter-spacing:.04em;text-transform:uppercase}
  .pcard h3{font-family:'Newsreader',serif;font-size:23px;font-weight:600;color:var(--ink);margin-bottom:10px;line-height:1.15}
  .pcard p{font-family:'Inter';font-size:15px;line-height:1.5;color:var(--ink-soft)}
  /* cta */
  .t-cta{background:var(--ink)}
  .t-cta h1{color:var(--cream);font-size:44px;max-width:20ch}
  .chips{display:flex;gap:14px;flex-wrap:wrap;margin-top:30px}
  .chip{font-family:'Inter';font-size:16px;font-weight:600;background:#a9b98a;
    color:#23271f;padding:14px 22px;border-radius:999px}
  .disc{font-family:'Inter';font-size:12.5px;line-height:1.5;color:#9aa48c;
    margin-top:40px;max-width:72ch}
  .nav{position:fixed;right:20px;bottom:18px;font-family:'Inter';font-size:12px;
    color:var(--ink-soft);background:var(--bg);border:1px solid var(--rule);
    border-radius:999px;padding:7px 14px}
  @media(max-width:760px){
    .slide{padding:44px 30px;min-height:460px;border-radius:16px}
    h1{font-size:32px}.t-title h1{font-size:38px}.t-section h1,.t-dark h1,.t-cta h1{font-size:31px}
    .sub{font-size:18px}.body{font-size:16px}.pillars{grid-template-columns:1fr;gap:14px}
    .brandline{left:30px;bottom:26px}.roots{right:26px;top:30px;width:66px;height:66px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const S=[
 {t:'title',kicker:'A live masterclass with Brian Bosley',
  title:'The Bamboo Progress Masterclass',
  sub:'How to think, feel, and behave like a world-class performer, before the results ever show.',brand:true},

 {t:'normal',k:'Who this is for',title:'You are already good. You want to be world class.',
  body:"You lead a team, run a company, or carry a craft you care about, and by most measures you are doing well. But there is a gap between where you are and the performer you know you could be, and effort alone has stopped closing it. You do not need another goal. You need a different way of showing up."},

 {t:'dark',title:"World-class performance is not something you finally earn. It is something you choose to think, feel, and behave your way into first.",accent:'first'},

 {t:'section',idx:'Part One',title:'Why doing more stopped working'},
 {t:'normal',k:'The trap',title:'You have been working on the outside of the problem.',
  body:'More hours, more tactics, another system, one more push. It is all outer game, and the outer game has a ceiling. When you hit it, the answer you reach for is to grind harder, which is exactly the move that is no longer moving you. The lever you have not pulled is the inner one: how you think, how you feel, and how you carry yourself under pressure.'},
 {t:'normal',k:'The real cost',title:'Reacting instead of choosing.',
  body:'Under stress most people run on autopilot. The email lands, the meeting turns, the number slips, and you respond out of habit before you have decided who you want to be in that moment. That reaction, repeated a thousand times, is what quietly sets your ceiling. It is not a discipline problem. It is a state problem, and state can be trained.'},
 {t:'dark',title:'You cannot out-hustle a mindset that keeps putting you back where you started.'},

 {t:'section',idx:'Part Two',title:'The Bamboo Progress System'},
 {t:'normal',k:'The method',title:'Think, feel, and behave like a world-class performer.',
  body:'Bamboo Progress is a straightforward, logical method built on one idea: excellence starts with first choosing to think, feel, and behave like a world-class performer, and letting the results follow. Three moves make it work, and you run them on purpose instead of leaving them to your mood.'},
 {t:'pillars',k:'The three moves',title:'Think. Feel. Behave.',
  cards:[
   {n:'One',h:'Think like one',p:'World-class performers hold a different set of thoughts about pressure, setbacks, and what is possible. You learn to catch the default story and choose the one a world-class version of you would run instead.'},
   {n:'Two',h:'Feel like one',p:'State is a skill, not a mood you wait for. You practice getting your body and emotions into the place great performers operate from, so confidence and calm are things you create rather than hope for.'},
   {n:'Three',h:'Behave like one',p:'Identity shows up as action. When the thinking and the feeling are chosen, the behavior of a world-class performer stops taking willpower and starts being simply what you do next.'},
  ]},
 {t:'normal',k:'The tool',title:'The Freeze Game.',
  body:'The move that makes the triad usable in real life is a quick pause. In the moment, you freeze and ask what you are thinking, what you are feeling, and what you are doing in your body, so you can respond instead of react. It is small, it takes seconds, and it is the difference between being run by a moment and choosing who you are inside it.'},
 {t:'dark',title:'Change your state on purpose often enough, and you have changed who you are.'},

 {t:'section',idx:'Part Three',title:'The patience of the roots'},
 {t:'normal',k:'The bamboo truth',title:'Nothing, nothing, nothing, then ninety feet.',
  body:'The Chinese bamboo is planted, watered, and nourished, and for years nothing shows above the ground. Then somewhere between the fourth and fifth year it breaks through and grows about ninety feet in six to eight weeks. It was never doing nothing. It was building a root system that could hold the height that was coming. Most people quit in year three, right before the ground moves.'},
 {t:'normal',k:'Why me',title:'I have spent a career watching people break through.',
  body:'I am Brian Bosley. For more than twenty-five years I have coached leaders in multi-million-dollar companies and individual professionals as a peak performance coach, and I host The Bamboo Lab Podcast, now among the top twenty-five percent of shows in the world with listeners in forty-one countries. Strive, Love, Live is the philosophy under all of it. Bamboo Progress is how it gets built.'},
 {t:'dark',title:'The performer you want to be is already in there. This is how you choose them on purpose.',accent:'choose'},

 {t:'section',idx:'Your next step',title:'Grow your bamboo with me'},
 {t:'normal',k:'How I can help',title:'A method, a room, and a coach in your corner.',
  body:'This work goes deepest one to one, where we map Bamboo Progress to your leadership, your pressure, and the breakthrough you are building toward. For teams and groups, the same method runs as training that changes how a whole room thinks, feels, and behaves. Either way, the goal is the same: a world-class version of you that holds under load.'},
 {t:'cta',title:'Ready to build the roots your next level is standing on?',
  chips:['Work with Brian one to one','Bring Bamboo Progress to your team'],
  disc:'Educational content from Brian Bosley and The Bamboo Lab. No income, revenue, or performance result is guaranteed. Results vary by person, effort, and circumstance.'},
];

const deck=document.getElementById('deck');
const ROOTS='<svg class="roots" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 8 V44 M50 44 C40 56 36 70 30 92 M50 44 C60 56 64 70 70 92 M50 44 C48 60 46 76 46 94 M50 44 C54 60 56 76 56 94 M50 44 C34 54 24 66 14 84 M50 44 C66 54 76 66 86 84"/></svg>';
S.forEach(s=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.t==='section'){
    h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`;
  } else if(s.t==='pillars'){
    h+=`<h1>${s.title}</h1><div class="pillars">`;
    s.cards.forEach(c=>{h+=`<div class="pcard"><div class="n">${c.n}</div><h3>${c.h}</h3><p>${c.p}</p></div>`});
    h+=`</div>`;
  } else {
    let title=s.title;
    if(s.accent){title=title.replace(s.accent,`<span class="accent-word">${s.accent}</span>`);}
    h+=`<h1>${title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.chips){h+=`<div class="chips">`;s.chips.forEach(c=>h+=`<span class="chip">${c}</span>`);h+=`</div>`;}
    if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
    if(s.brand){h+=ROOTS+`<div class="brandline">The Bamboo <b>Lab</b> · Brian Bosley</div>`;}
  }
  d.innerHTML=h;
  deck.appendChild(d);
});
document.getElementById('nav').textContent=S.length+' slides · scroll';
</script>
</body>
</html>
