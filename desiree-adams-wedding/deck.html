<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Full-Service Foundations Masterclass · Desirée Adams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Prata&family=Public+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#231f20; --panel:#2c2723; --rule:#3d352f;
    --accent:#336455; --accent2:#6f8f80; --chalk:#f2ede6; --grey:#cdc4b8; --dim:#a89d8f;
  }
  html,body{height:100%}
  body{background:#000;font-family:'Public Sans',-apple-system,sans-serif;color:var(--chalk);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#000}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.2% 8.4%}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-size:1.02vw;font-weight:600;letter-spacing:.22em;text-transform:uppercase;color:var(--accent2);margin-bottom:2.4vh}
  h1{font-family:'Prata',Georgia,serif;font-weight:400;color:var(--chalk);line-height:1.16;letter-spacing:-.003em}
  .t-title h1{font-size:4.6vw}
  .t-normal h1{font-size:3.2vw;max-width:84%}
  .t-normal .body{font-size:1.5vw;color:var(--grey);margin-top:2.6vh;max-width:74%;line-height:1.55;font-weight:300}
  .sub{font-size:1.75vw;color:var(--grey);margin-top:3.2vh;max-width:76%;line-height:1.5;font-weight:300;font-style:italic}
  .t-section{align-items:flex-start}
  .t-section .idx{font-family:'Public Sans',sans-serif;font-size:1.4vw;font-weight:600;color:var(--accent2);margin-bottom:2vh;letter-spacing:.14em;text-transform:uppercase}
  .t-section h1{font-size:4.5vw;max-width:88%}
  .t-section .rule{width:16vw;height:2px;background:linear-gradient(90deg,var(--accent),transparent);margin-top:3.4vh}
  .t-dark{background:radial-gradient(120% 120% at 50% 0%,var(--panel) 0%,#171413 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.6vw;max-width:86%;font-style:italic;color:#F1EFE9}
  .t-cta{background:radial-gradient(120% 120% at 50% 100%,var(--panel) 0%,#171413 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:82%}
  .chips{display:flex;gap:1vw;margin-top:4vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1px solid var(--accent);color:#cfe3d9;border-radius:100px;padding:1.3vh 1.6vw;font-size:1.22vw;font-weight:500;text-decoration:none;display:inline-block;cursor:pointer}
  .disc{position:absolute;left:8.4%;right:8.4%;bottom:4.4vh;font-size:.92vw;color:var(--dim);font-style:italic;text-align:center;line-height:1.4}
  .t-title .disc,.t-normal .disc{text-align:left}
  .motif{position:absolute;pointer-events:none;opacity:.9}
  .title-motif{right:7.5%;bottom:8%;width:20vw}
  .corner-motif{right:6%;bottom:7.5%;width:9vw;opacity:.4}
  .brandline{font-size:1.3vw;color:var(--grey);margin-top:3.4vh;font-weight:400;letter-spacing:.02em}
  .brandline b{color:var(--accent2);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:5px;background:rgba(255,255,255,.06);z-index:20}
  .hud > i{display:block;height:100%;background:var(--accent);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.14em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.08em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:7.6vw}.t-normal h1{font-size:5.2vw}.t-normal .body{font-size:3vw}
    .sub{font-size:3.3vw}.t-section h1{font-size:6.8vw}.t-dark h1{font-size:5.8vw}
    .t-cta h1{font-size:6.8vw}.chip{font-size:2.6vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Full-Service Foundations</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- a thin traced line connecting three marks: Planning, Design, Execution -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="pillars" viewBox="0 0 260 150">
  <g fill="none" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
    <line x1="14" y1="130" x2="246" y2="130" stroke="#6f8f80" opacity="0.35"/>
    <circle cx="40" cy="100" r="7" fill="none" stroke="#336455" stroke-width="2.6"/>
    <circle cx="130" cy="66" r="7" fill="none" stroke="#336455" stroke-width="2.6"/>
    <circle cx="220" cy="32" r="7" fill="none" stroke="#336455" stroke-width="2.6"/>
    <path d="M40 100 L130 66 L220 32" stroke="#f2ede6" opacity="0.22"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Full-Service Foundations Masterclass',sub:'How to run full-service weddings on systems, not on memory.',brand:true,motif:'title'},
 {t:'normal',k:'Who this is for',title:'You say yes to full-service, then live inside every decision.',body:'You have the taste and the client trust to run full-service weddings. But without a documented system, every onboarding, every design concept, and every production timeline runs through your head first.'},
 {t:'dark',title:'Full-service does not have to mean full-time in your head.'},

 {t:'section',idx:'Part One',title:'The Full-Service Trap'},
 {t:'normal',k:'Why it gets heavier, not easier',title:'Every new full-service client adds a decision only you can make.',body:'Without a system, growth just means more onboarding calls only you can run, more design concepts only you can present, and more production timelines only you can track. The work scales, the relief never does.'},
 {t:'normal',k:'The real cost',title:'A business that lives in your head cannot be handed off.',body:'If your process is not written down, it cannot be delegated, taught, or protected when the season gets busy. You end up the bottleneck in the very business you built.'},
 {t:'dark',title:'The fix is not working harder inside full-service. It is building the system underneath it.'},

 {t:'section',idx:'Part Two',title:'The Full-Service Foundations System'},
 {t:'normal',k:'Pillar One: Planning',title:'A repeatable system for onboarding, budgeting, and vendors.',body:'A structured intake for client onboarding and communication, a clear budgeting framework, and a vendor-management process that does not depend on you remembering every detail from every past wedding.'},
 {t:'normal',k:'Pillar Two: Design',title:'A framework for concepts that sell themselves.',body:'A repeatable process for creative development, moodboarding, and design presentations, so a full-service concept lands with a client the same way whether you are fresh or five events deep into the season.'},
 {t:'normal',k:'Pillar Three: Execution',title:'The tools that carry a wedding day without you carrying it alone.',body:'Timelines, production documents, and event-day management tools built so the day runs on the plan, not on you personally holding every detail in memory.'},
 {t:'dark',title:'Planning, Design, Execution. The three parts that turn full-service from a promise into a system.'},

 {t:'section',idx:'Part Three',title:'Proven at the Highest Stakes'},
 {t:'normal',k:'The toolkit',title:'A SWOT, a progress tracker, and your own process, on paper.',body:'A business SWOT analysis to see where the gaps actually are, a progress tracker so growth is visible instead of assumed, and custom business-process spreadsheets built around how you already work.'},
 {t:'normal',k:'Built on twenty years of full-service work',title:'Tested where the stakes were highest, not in theory.',body:'These systems were built running events for presidents, royalty, and celebrities, covered by The New York Times, The Today Show, and The New Yorker. What is taught here is what actually held up under real pressure.'},
 {t:'dark',title:'The same systems behind a state dinner, built for your business.'},

 {t:'section',idx:'Your next step',title:'Build Your Full-Service Foundation'},
 {t:'normal',k:'How I can help',title:'The 90-Day Mentorship walks you through building this in your own business.',body:'Six one-on-one coaching calls, unlimited recording access, a business SWOT, a progress tracker, and custom process spreadsheets, built around your Planning, Design, and Execution systems specifically.'},
 {t:'cta',title:'Ready to build your Full-Service Foundation?',chips:[{label:'Apply for the 90-Day Mentorship',href:'https://verveeventco.com/mentorship'}],disc:'Educational content for wedding and event planning business owners. No income, revenue, or business result is guaranteed. Results vary by planner, market, and effort.'},
];

const deck=document.getElementById('deck');
function motif(kind){return `<svg class="motif ${kind==='title'?'title-motif':'corner-motif'}"><use href="#pillars"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Full-Service <b>Foundations</b> &middot; Desir&eacute;e Adams</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>typeof c==='object'?`<a class="chip" href="${c.href}" target="_blank" rel="noopener">${c.label}</a>`:`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.motif) h+=motif(s.motif);
  else if(s.t==='title') h+=motif('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
