<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fix My Insurance Agency By The Numbers — Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#e9eef5; --panel:#fbfdff; --ink:#0e1c30; --muted:#54657a;
    --accent:#1f6fb2; --gold:#c7a24a; --rule:#d6e0ec;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'IBM Plex Sans',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 56px;margin:0 0 20px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 2px rgba(14,28,48,.04)}
  h1,h2,h3,.eyebrow,.num{font-family:'Archivo',sans-serif}
  .eyebrow{font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);
    font-weight:700;margin-bottom:18px}
  h1{font-size:46px;line-height:1.05;font-weight:800;letter-spacing:-.02em}
  h2{font-size:34px;line-height:1.1;font-weight:700;letter-spacing:-.01em}
  .promise{font-size:21px;color:var(--muted);margin-top:20px;font-weight:500;max-width:34ch}
  p.body{font-size:20px;line-height:1.5;color:#283a4e;margin-top:16px;max-width:52ch}
  .lead{font-size:26px;line-height:1.3;font-weight:600;max-width:40ch}
  .divider .num{font-size:15px;letter-spacing:.2em;color:var(--gold);font-weight:700;text-transform:uppercase}
  .meta{margin-top:30px;font-size:17px;color:var(--muted);font-weight:600}
  .meta b{color:var(--ink)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px 26px;margin-top:26px}
  .grid .cell{display:flex;gap:12px;align-items:baseline;font-size:18px;color:#283a4e}
  .grid .cell .n{font-family:'Archivo';font-weight:800;color:var(--accent);font-size:17px;min-width:26px}
  .levers{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .lever{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:14px 18px;
    font-weight:600;font-size:18px}
  .lever .big{font-family:'Archivo';font-weight:800;color:var(--accent);margin-right:8px}
  .steps{margin-top:24px;counter-reset:s}
  .steps li{list-style:none;display:flex;gap:16px;align-items:flex-start;margin:10px 0;font-size:18px;color:#283a4e}
  .steps li:before{counter-increment:s;content:counter(s);font-family:'Archivo';font-weight:800;
    color:#fff;background:var(--accent);width:30px;height:30px;border-radius:50%;display:flex;
    align-items:center;justify-content:center;font-size:15px;flex:0 0 auto}
  .statrow{display:flex;gap:40px;margin-top:30px;flex-wrap:wrap}
  .stat .big{font-family:'Archivo';font-weight:800;font-size:44px;color:var(--accent);line-height:1}
  .stat .lab{font-size:16px;color:var(--muted);margin-top:6px;max-width:16ch}
  .cta h2{font-size:38px}
  .cta .step{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;
    font-family:'Archivo';font-weight:700;font-size:20px;padding:15px 30px;border-radius:10px}
  .disc{margin-top:28px;font-size:13px;color:var(--muted);max-width:60ch;line-height:1.5}
  .foot{font-size:14px;color:var(--muted);margin-top:22px}
  .kick{font-size:19px;color:var(--gold);font-family:'Archivo';font-weight:700;margin-bottom:10px}
  @media(max-width:620px){.slide{padding:34px 24px}h1{font-size:34px}h2{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
 {t:'title', eyebrow:'Inspire a Nation Business Mentoring', h1:'Fix My Insurance Agency By The Numbers',
   promise:'The 14-process operating system that runs the agency for you, instead of you running the agency.',
   meta:'A live masterclass with Dr. Billy R. Williams, PhD'},
 {t:'who', eyebrow:'Who this is for',
   lead:'For the insurance agency owner whose every task still lands on their desk, and who wants the agency to run without them in the room.'},
 {t:'trap', kick:'The trap', h2:'You became the operating system.',
   body:'Quotes, service, renewals, follow up, hiring. If you stepped away for two weeks, how much of it would stall? For most owners the honest answer is almost all of it, because the agency does not run on processes. It runs on you.'},
 {t:'reframe', kick:'The reframe',
   lead:'An agency is not a person working harder. It is 14 processes that each either run, or do not.',
   body:'Fix the processes and the agency stops needing a hero. That is the whole job.'},
 {t:'divider', num:'Part One', h2:'Why the agency needs you for everything'},
 {t:'problem', eyebrow:'Part One', h2:'Growth just means more on one desk.',
   body:'When the owner is the single point of failure, every new policy, every new hire, and every new carrier adds load to the same person. The agency cannot get bigger than the owner can personally hold. That is the ceiling.'},
 {t:'cost', eyebrow:'The cost', h2:'What it actually costs you.',
   grid:['Work backs up the moment you take a day off','Good staff leave because nothing is written down','You cannot sell the agency that only you can run','Service slips, and retention slips with it'], bullets:true},
 {t:'divider', num:'Part Two', h2:'The By The Numbers operating system'},
 {t:'processes', eyebrow:'The operating system', h2:'The 14 core agency processes.',
   body:'Every agency runs the same core processes. Most owners have never written them down, so they cannot see which ones are weak. Name them first.',
   grid:['Marketing','New business sales','Quoting','Account service','Renewals and retention','Claims support','Onboarding new clients','Cross sell and review','Staffing and roles','Training','Technology and automation','KPIs and reporting','Follow up','Referrals'], numbered:true},
 {t:'oneatatime', kick:'The method',
   lead:'You do not overhaul the agency. You fix one process at a time.',
   body:'Pick the weakest one, put a clear process in place, assign the owner, and check the result. Then move to the next. Paint by numbers, not all at once.'},
 {t:'capacity', eyebrow:'The capacity matrix', h2:'Five ways to add capacity.',
   body:'Before you hire, ask which lever the work really needs.',
   levers:['Processes','Templates','Technology','Automation','People']},
 {t:'peoplelast', kick:'The order matters', lead:'People is the last lever, not the first.',
   body:'Most owners answer every capacity problem with another hire. A process, a template, a piece of technology, or an automation is usually cheaper, faster, and does not quit. People go on top of that, not in place of it.'},
 {t:'eightsteps', eyebrow:'Putting it to work', h2:'The 8 steps to put a process into use.',
   steps:['Name the process','Find the gap','Write the simple version','Pick the tools and templates','Assign one owner','Set the deadline','Put it live','Check the result and adjust']},
 {t:'loop', eyebrow:'The weekly loop', h2:'Find it. Choose it. Assign it. Check it.',
   body:'The diagnostic loop keeps improvements from dying in a binder. Each week, find what needs attention, choose one process, assign the work with a deadline, and check the result. Small, repeatable, and it compounds.'},
 {t:'campaigns', eyebrow:'Marketing without a marketer', h2:'18 campaigns for your 6 best prospect groups.',
   body:'Three ready campaign choices for each of the six best prospect groups, drawn from the 10 respectful marketing methods. A menu to pull from, so marketing is never a blank page.',
   statrow:[['6','best prospect groups'],['3','campaigns each'],['18','starting points']]},
 {t:'divider', num:'Part Three', h2:'What a by-the-numbers agency looks like'},
 {t:'looks', eyebrow:'Part Three', h2:'What a by-the-numbers agency looks like.',
   body:'Work moves forward without every task landing on your desk. New staff ramp from written processes instead of your memory. You spend your time working on the agency, not buried inside it. And the agency is finally worth something without you in the chair.'},
 {t:'whyme', eyebrow:'Why learn this from me', h2:'Two decades, built on real agencies.',
   statrow:[['150+','partner agencies in the group'],['$1B+','a year in premium written'],['20+','years coaching and mentoring agencies']],
   foot:'The By The Numbers system is the same operating model used across the Williams Family Insurance and Investment Group.'},
 {t:'firststep', kick:'Where to start',
   lead:'Start with one useful change. Put it to work. Then build on that success.'},
 {t:'cta', eyebrow:'Your next step', h2:'Join the live class and fix your first process this week.',
   body:'Bring your agency. We will map your 14 processes, find the weakest one, and walk the 8 steps to put it into use live.',
   step:'Register for the live masterclass',
   disc:'This masterclass is for educational purposes only and is not financial, legal, or business advice. No income or result is guaranteed. Results vary from agency to agency based on your market, effort, and execution.'}
];
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const D=document.getElementById('deck');
S.forEach(s=>{
 const sl=el('div','slide'+(s.t==='divider'?' divider':'')+(s.t==='cta'?' cta':''));
 if(s.eyebrow)sl.appendChild(el('div','eyebrow',esc(s.eyebrow)));
 if(s.kick)sl.appendChild(el('div','kick',esc(s.kick)));
 if(s.num)sl.appendChild(el('div','num',esc(s.num)));
 if(s.h1)sl.appendChild(el('h1',null,esc(s.h1)));
 if(s.h2)sl.appendChild(el('h2',null,esc(s.h2)));
 if(s.promise)sl.appendChild(el('div','promise',esc(s.promise)));
 if(s.lead)sl.appendChild(el('div','lead',esc(s.lead)));
 if(s.body)sl.appendChild(el('p','body',esc(s.body)));
 if(s.grid){
   const g=el('div','grid',s.grid.map((x,i)=>{
     const n=s.numbered?(i+1):'&bull;';
     return '<div class="cell"><span class="n">'+n+'</span><span>'+esc(x)+'</span></div>';
   }).join(''));
   sl.appendChild(g);
 }
 if(s.levers)sl.appendChild(el('div','levers',s.levers.map((x,i)=>'<div class="lever"><span class="big">'+(i+1)+'</span>'+esc(x)+'</div>').join('')));
 if(s.steps)sl.appendChild(el('ul','steps',s.steps.map(x=>'<li>'+esc(x)+'</li>').join('')));
 if(s.statrow)sl.appendChild(el('div','statrow',s.statrow.map(x=>'<div class="stat"><div class="big">'+esc(x[0])+'</div><div class="lab">'+esc(x[1])+'</div></div>').join('')));
 if(s.meta)sl.appendChild(el('div','meta',esc(s.meta)));
 if(s.foot)sl.appendChild(el('div','foot',esc(s.foot)));
 if(s.step)sl.appendChild(el('div','step',esc(s.step)));
 if(s.disc)sl.appendChild(el('div','disc',esc(s.disc)));
 D.appendChild(sl);
});
</script>
</body>
</html>
