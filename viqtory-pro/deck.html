<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>vIQtory Pro: The 7 Systems of a Winning Football Program</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0c1115;        /* their dominant dark surface (brand.json, 34 uses) */
    --panel:#141b21;
    --panel2:#0f161b;
    --rule:#28323a;
    --ink:#eef3f6;
    --muted:#9fb0bc;
    --accent:#008fff;    /* their brand blue (brand.json, 16 uses) */
    --win:#81d100;       /* their lime highlight (brand.json, 4 uses) */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:'Mulish',system-ui,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:22px 18px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:52px 48px;margin:18px 0;position:relative;overflow:hidden;min-height:420px;display:flex;flex-direction:column;justify-content:center}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .kicker{font-family:'Archivo';font-weight:800;letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:16px}
  .kicker.win{color:var(--win)}
  h1{font-family:'Archivo';font-weight:900;font-size:52px;line-height:1.04;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:'Archivo';font-weight:800;font-size:34px;line-height:1.1;letter-spacing:-.01em;margin-bottom:16px}
  p{font-size:19px;color:var(--ink);margin-bottom:14px;max-width:70ch}
  p.lead{font-size:22px;color:var(--muted)}
  .muted{color:var(--muted)}
  ul{list-style:none;margin:10px 0}
  li{font-size:18px;padding:12px 0 12px 34px;border-bottom:1px solid var(--rule);position:relative;color:var(--ink)}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:6px;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px;transform:rotate(45deg)}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:12px}
  .card{background:var(--panel2);border:1px solid var(--rule);border-radius:10px;padding:20px}
  .card .n{font-family:'Archivo';font-weight:900;font-size:26px;color:var(--accent)}
  .card h3{font-family:'Archivo';font-weight:700;font-size:19px;margin:6px 0 6px}
  .card p{font-size:15px;color:var(--muted);margin:0}
  .foot{margin-top:26px;font-size:14px;color:var(--muted)}
  .tag{display:inline-block;font-family:'Archivo';font-weight:700;font-size:13px;letter-spacing:.04em;color:var(--bg);background:var(--win);padding:5px 12px;border-radius:999px;margin-bottom:18px}
  .disc{font-size:13px;color:var(--muted);border-top:1px solid var(--rule);margin-top:22px;padding-top:16px;max-width:74ch}
  .num{position:absolute;right:26px;bottom:18px;font-family:'Archivo';font-weight:800;font-size:13px;color:#3a4650;letter-spacing:.1em}
  .brandbar{font-family:'Archivo';font-weight:900;letter-spacing:.02em;font-size:15px}
  .brandbar b{color:var(--accent)}
  @media(max-width:640px){.slide{padding:34px 24px}h1{font-size:36px}h2{font-size:26px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title', html:`<div class="tag">A vIQtory Pro Masterclass</div>
   <div class="kicker">For youth &amp; high school football coaches</div>
   <h1>The 7 Systems of a Winning Football Program</h1>
   <p class="lead">Why the programs that win every fall are not the ones with the most talent. They are the ones running systems your staff can install and repeat.</p>
   <div class="foot brandbar"><b>vIQtory</b> Pro</div>`},

 {t:'who', html:`<div class="kicker">Who this is for</div>
   <h2>You coach because you love the game. Not the chaos.</h2>
   <p>You are a head coach or coordinator at the youth or high school level. Volunteer or paid, you are pouring nights and weekends into a program.</p>
   <p class="muted">And most of what is out there for coaches is either college jargon you cannot install with 14-year-olds, or a random reel of drills with no plan behind them. You are left stitching a season together on your own.</p>`},

 {t:'promise', html:`<div class="kicker">The promise</div>
   <h2>By the end of this hour</h2>
   <p>You will know the seven systems that separate the programs that win every fall from the ones that ride whatever talent walks in the door.</p>
   <ul>
    <li>The one system most staffs never build, and what it costs them by week six</li>
    <li>How to install a scheme in an order 14-year-olds can actually hold</li>
    <li>The scorecard that tells you which system to fix first</li>
   </ul>`},

 {t:'reframe', html:`<div class="kicker">The reframe</div>
   <h2>Talent wins games. Systems win seasons.</h2>
   <p>Every league has that one team stacked with athletes. Some years that is you. Most years it is not.</p>
   <p>The programs that win <span style="color:var(--win);font-weight:700">every</span> year are not out-recruiting anyone. They run the same seven systems, install them the same way, and coach them the same way whether the roster is loaded or rebuilding.</p>`},

 {t:'p1intro', html:`<div class="kicker">Part one &middot; The problem</div>
   <h2>Great coaches, no operating system</h2>
   <p>Most youth and high school staffs are full of good football minds. What they are missing is not knowledge. It is a repeatable way to turn that knowledge into a Tuesday practice, a Friday call sheet, and a player who lines up right.</p>`},

 {t:'p1talent', html:`<div class="kicker">Part one &middot; The trap</div>
   <h2>The "just get better players" trap</h2>
   <p>When a season goes sideways, the easy story is roster. Not enough size, not enough speed, kids playing two sports.</p>
   <p class="muted">But the film usually says something else: missed assignments, an install that never stuck, a practice that spent 40 minutes on something that never showed up on Friday. Those are system problems, and system problems are fixable this week.</p>`},

 {t:'p1cost', html:`<div class="kicker">Part one &middot; The cost</div>
   <h2>What a missing system actually costs</h2>
   <ul>
    <li>Practices that feel busy but do not transfer to the game</li>
    <li>An offense or defense that only half the kids understand by week six</li>
    <li>A staff that coaches seven different ways to teach the same block</li>
    <li>Talented players who never get developed because there is no plan for them</li>
   </ul>`},

 {t:'p2intro', html:`<div class="kicker">Part two &middot; The framework</div>
   <h2>The 7 Systems, and the scorecard behind them</h2>
   <p>A winning program is not one big thing. It is seven systems working together. The <b>Elite Program Scorecard</b> rates your program 1 to 5 on each one, so you know exactly which system is holding you back before you touch a drill.</p>
   <p class="muted">Here are four of the seven every staff can start installing this week.</p>`},

 {t:'systems', html:`<div class="kicker">Part two &middot; The map</div>
   <h2>Coach the systems, not the symptoms</h2>
   <div class="grid">
    <div class="card"><div class="n">01</div><h3>Practice structure</h3><p>How every minute is scripted and why.</p></div>
    <div class="card"><div class="n">02</div><h3>Scheme install</h3><p>The order concepts are taught so they stick.</p></div>
    <div class="card"><div class="n">03</div><h3>Position development</h3><p>A teaching progression for every spot.</p></div>
    <div class="card"><div class="n">04</div><h3>Game planning &amp; call sheets</h3><p>Turning the week into Friday's plan.</p></div>
   </div>
   <p class="foot muted">Plus culture, staff development, and evaluation, the three that hold the season together.</p>`},

 {t:'sysPractice', html:`<div class="kicker">System 01 &middot; Practice structure</div>
   <h2>Every minute is scripted, or it is wasted</h2>
   <p>Winning programs do not "run practice." They run a script: individual, group, team, situational, each block timed and tied to what shows up Friday.</p>
   <ul>
    <li>A practice template your whole staff runs off one page</li>
    <li>Reps allocated to what actually decides games, not what is comfortable to coach</li>
    <li>Situational periods so nothing on Friday is the first time they have seen it</li>
   </ul>`},

 {t:'sysInstall', html:`<div class="kicker">System 02 &middot; Scheme install</div>
   <h2>Install in an order kids can actually hold</h2>
   <p>The install is where most seasons are quietly lost. Too much, too fast, in the wrong order, and by week six half the roster is guessing.</p>
   <p class="muted">The system is a sequence: base concept, then the tag, then the answer to what the defense does back. Inside zone before the reads off it. Cover 3 before you ask them to pattern-match. One layer at a time.</p>`},

 {t:'sysPosition', html:`<div class="kicker">System 03 &middot; Position development</div>
   <h2>A teaching progression for every position</h2>
   <p>Talent is not developed by accident. Each position gets its own progression, from stance and first step to the reads that separate a good player from a great one.</p>
   <ul>
    <li>Quarterback mechanics and decision reads, taught in steps</li>
    <li>Receiver releases and stems that beat press coverage</li>
    <li>Line footwork and combination blocks the whole unit runs the same way</li>
   </ul>`},

 {t:'sysGameplan', html:`<div class="kicker">System 04 &middot; Game planning &amp; call sheets</div>
   <h2>The week becomes one page on Friday night</h2>
   <p>A game plan is not a feeling. It is a call sheet: your best answers to what this opponent does, organized by down, distance, and field zone, so you are never hunting for a play in the moment.</p>
   <p class="muted">When the plan is built as a system, a young coordinator calls a clean game and your best players get the ball in the spots that matter.</p>`},

 {t:'sysThree', html:`<div class="kicker">Systems 05 to 07 &middot; The glue</div>
   <h2>The three systems that hold a season together</h2>
   <div class="grid">
    <div class="card"><div class="n">05</div><h3>Culture &amp; standards</h3><p>What the program expects, said the same way every day.</p></div>
    <div class="card"><div class="n">06</div><h3>Staff development</h3><p>Every assistant coaching off the same page, not their own.</p></div>
    <div class="card"><div class="n">07</div><h3>Evaluation</h3><p>Grading players and the plan against the standard, not the scoreboard.</p></div>
    <div class="card"><div class="n">&rarr;</div><h3>The scorecard</h3><p>Rate all seven 1 to 5 and the weakest one shows itself.</p></div>
   </div>`},

 {t:'p3intro', html:`<div class="kicker">Part three &middot; Inside a vIQtory Pro program</div>
   <h2>What changes when the systems are in</h2>
   <p>You are not working more hours. You are working off a plan your whole staff shares, so the program stops depending on any one coach remembering everything.</p>`},

 {t:'p3week', html:`<div class="kicker">Part three &middot; A week in the program</div>
   <h2>From guesswork to a repeatable week</h2>
   <ul>
    <li><b>Sunday:</b> grade the film against the systems, not your gut</li>
    <li><b>Monday:</b> build the call sheet from your best answers</li>
    <li><b>Tuesday to Thursday:</b> run the scripted practice that installs it</li>
    <li><b>Friday:</b> call a clean game because everyone saw it coming in practice</li>
   </ul>`},

 {t:'whyme', html:`<div class="kicker">Why listen to us</div>
   <h2>Built with real youth &amp; high school staffs</h2>
   <p>vIQtory Sports was founded in 2016 to fix one thing: coaching resources buried in jargon that new coaches could not actually install. Since then we have worked with over 10,000 youth and high school football coaches.</p>
   <p class="muted">Everything here is what we run and teach ourselves: the same systems behind staffs that have been recognized among the best in their state. No jargon. Just what to install, in what order, and how to coach it.</p>`},

 {t:'cta', html:`<div class="kicker win">Your next step</div>
   <h2>Find the one system holding your program back</h2>
   <p>Start with the <b>Elite Program Scorecard</b> and rate your program on all seven. Then let's map the fix together.</p>
   <p style="font-family:'Archivo';font-weight:800;font-size:22px;color:var(--win)">Book your Roadmap Call with vIQtory Pro</p>
   <p class="muted">We will walk your scorecard, name the system to fix first, and show you how to install it with your staff this season.</p>
   <p class="disc">For educational purposes only. This is not a guarantee of any outcome. No income or result is guaranteed. Results vary and depend on your roster, staff, and execution. vIQtory Pro teaches the systems; how you install and coach them is up to you.</p>
   <div class="foot brandbar"><b>vIQtory</b> Pro &middot; viqtorysports.com</div>`}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide'+(s.t==='cta'?' cta':'');
  el.innerHTML=(s.html||'')+'<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  deck.appendChild(el);
});
</script>
</body>
</html>
