<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>The Strongest Year Masterclass</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0e1a2a}
#frame{width:100%;height:100%;border:0;display:block}
.nav{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;
  background:rgba(15,36,62,.85);padding:8px 14px;border-radius:30px;font-family:'Oswald',system-ui,sans-serif;z-index:9}
.nav button{background:#c9a34a;color:#0e1a2a;border:0;border-radius:20px;padding:8px 16px;font-weight:700;cursor:pointer;font-family:inherit}
.nav button:disabled{opacity:.4;cursor:default}
.nav .count{color:#f5e8bc;font-size:14px;min-width:60px;text-align:center}
</style></head>
<body>
<iframe id="frame" src="01.html"></iframe>
<div class="nav">
  <button id="prev">Prev</button>
  <div class="count"><span id="cur">1</span> / 24</div>
  <button id="next">Next</button>
</div>
<script>
var total=24,cur=1;
var f=document.getElementById('frame'),c=document.getElementById('cur'),p=document.getElementById('prev'),n=document.getElementById('next');
function go(i){cur=Math.max(1,Math.min(total,i));f.src=String(cur).padStart(2,'0')+'.html';c.textContent=cur;p.disabled=cur===1;n.disabled=cur===total;}
p.onclick=function(){go(cur-1)};n.onclick=function(){go(cur+1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
go(1);
</script>
</body></html>
