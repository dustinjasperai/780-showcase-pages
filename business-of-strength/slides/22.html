<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Slide 22</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:#0e1a2a;color:#f5e8bc;font-family:'Inter',system-ui,Arial,sans-serif;
  display:flex;align-items:center;justify-content:center;padding:6vh 8vw;position:relative;overflow:hidden}
.slide{width:100%;max-width:1000px}
.eyebrow{font-family:'Oswald';letter-spacing:.18em;text-transform:uppercase;color:#c9a34a;font-size:clamp(12px,1.6vw,16px);margin-bottom:18px}
h1{font-family:'Oswald';font-weight:700;line-height:1.02;font-size:clamp(34px,6vw,72px);letter-spacing:.01em}
h2{font-family:'Oswald';font-weight:700;line-height:1.05;font-size:clamp(28px,4.6vw,54px)}
.sub{margin-top:22px;font-size:clamp(16px,2.2vw,26px);color:#d9e0ec;max-width:820px}
p.body{margin-top:20px;font-size:clamp(16px,2.1vw,25px);line-height:1.5;color:#d9e0ec;max-width:820px}
.bar{height:6px;width:96px;background:#c9a34a;border-radius:3px;margin:0 0 28px}
.big{font-family:'Oswald';font-weight:700;color:#c9a34a;font-size:clamp(40px,8vw,96px);line-height:1}
ul{margin-top:26px;list-style:none}
li{font-family:'Oswald';font-weight:600;font-size:clamp(22px,3.4vw,40px);padding:14px 0 14px 28px;border-left:5px solid #c9a34a;margin-bottom:14px;background:linear-gradient(90deg,#0f243e,transparent)}
.tag{display:inline-block;font-family:'Oswald';letter-spacing:.14em;background:#c9a34a;color:#0e1a2a;padding:6px 14px;border-radius:4px;font-size:clamp(12px,1.5vw,15px);margin-bottom:18px}
.gapnum{font-family:'Oswald';font-weight:700;color:#33455b;font-size:clamp(90px,16vw,200px);line-height:.8;opacity:.55;position:absolute;right:6vw;top:8vh}
.proofnum{font-family:'Oswald';color:#c9a34a;font-size:clamp(20px,3vw,34px);margin:10px 0 18px}
.quote{font-size:clamp(18px,2.4vw,30px);font-style:italic;color:#f5e8bc;max-width:820px;line-height:1.4}
.gym{font-family:'Oswald';letter-spacing:.06em;text-transform:uppercase;color:#aeb8c7;font-size:clamp(14px,1.8vw,19px)}
.score-chip{display:inline-flex;gap:8px;margin-top:26px}
.score-chip span{width:38px;height:38px;border:2px solid #33455b;border-radius:6px;display:flex;align-items:center;justify-content:center;font-family:'Oswald';color:#9fb0c6}
.ctabox{margin-top:28px;display:inline-block;font-family:'Oswald';font-weight:700;background:#c9a34a;color:#0e1a2a;padding:16px 30px;border-radius:8px;font-size:clamp(18px,2.4vw,28px)}
.disc{position:absolute;bottom:3.4vh;left:8vw;right:8vw;font-size:11px;color:#6b7687;line-height:1.4}
.pageno{position:absolute;bottom:3.4vh;right:3vw;font-family:'Oswald';color:#53627a;font-size:13px}
.footer{position:absolute;bottom:3.4vh;left:8vw;font-family:'Oswald';letter-spacing:.14em;color:#53627a;font-size:12px;text-transform:uppercase}
</style></head>
<body>
<div class="slide"><div class="bar"></div><h2>The Strongest Year path</h2><p class="body">From one gap fixed to a gym that runs without you. That is the whole job: offense that fills the room, defense that keeps it full, and a team that runs it without you.</p></div>
<div class="footer">Business of Strength</div>
<div class="pageno">22 / 24</div>
</body></html>
