<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Why Not Me? - A Live Masterclass with Pamela Jean</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Lato:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf6f1; --panel:#fffdfb; --rule:#e3d8cf;
    --ink:#4c4a4b; --dim:#7a7777; --accent:#c67f7b; --accent-deep:#a75f5b;
    --display:'Cormorant Garamond',Georgia,serif; --body:'Lato',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.55;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:52px 54px;margin:22px 0;min-height:430px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(166,95,91,.04)}
  .num{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-bottom:18px}
  .k{font-size:13px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent-deep);margin-bottom:16px;font-weight:700}
  h1{font-family:var(--display);font-weight:700;font-size:62px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--display);font-weight:600;font-size:40px;line-height:1.1;margin-bottom:10px}
  .lead{font-family:var(--display);font-size:30px;line-height:1.22;color:var(--ink)}
  p.sub{font-size:19px;color:var(--dim);margin-top:18px;max-width:62ch}
  p.body{font-size:18px;color:var(--ink);margin-top:14px;max-width:64ch}
  .accent{color:var(--accent-deep)}
  .big{font-family:var(--display);font-size:46px;line-height:1.12;max-width:20ch}
  ul{margin:22px 0 0 0;list-style:none;max-width:60ch}
  ul li{position:relative;padding-left:30px;margin:14px 0;font-size:19px}
  ul li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;border-radius:50%;background:var(--accent)}
  .divider{background:linear-gradient(180deg,#fffdfb, #f6ece6);border-color:var(--rule)}
  .divider .part{font-family:var(--display);font-size:22px;color:var(--accent-deep);letter-spacing:.04em;margin-bottom:8px}
  .divider h2{font-size:52px}
  .cover{background:linear-gradient(170deg,#fffdfb 0%, #f3e4df 100%)}
  .cover h1{font-size:76px}
  .cover .tag{margin-top:26px;font-size:16px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
  .pillar .n{font-family:var(--display);font-size:30px;color:var(--accent);font-weight:700}
  .strike{text-decoration:line-through;color:var(--dim);text-decoration-color:var(--accent)}
  .disc{margin-top:26px;font-size:13px;color:var(--dim);max-width:70ch;line-height:1.5}
  .foot{margin-top:30px;font-size:14px;color:var(--dim);letter-spacing:.04em}
  @media(max-width:640px){.slide{padding:34px 26px;min-height:360px}h1{font-size:44px}.cover h1{font-size:52px}h2{font-size:32px}.divider h2{font-size:38px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"cover", cls:"cover", h:"Why Not Me?", lead:"Grow the business without losing the life behind it.", tag:"A live masterclass with Pamela Jean"},

  {t:"promise", k:"In the next 60 minutes", h:"What you will leave with", list:[
    "The one question that quietly runs every decision you make about money, time, and team",
    "A way to build that holds you with grace AND holds you to your word",
    "A picture of what a balanced next level actually looks like for you"]},

  {t:"who", k:"This is for you if", h:"You are driving hard, and wondering what it is costing you", list:[
    "You run your own business and you are good at it",
    "You keep hitting the goal and the goal keeps moving",
    "Some part of you still wonders whether the next level is really for you"],
    sub:"If that is you, you are in the right room."},

  {t:"trap", k:"The trap", h:"The question underneath the busyness", lead:"“Who am I to want this much?”",
    body:"Most driven women never say it out loud. It runs in the background while they take on more, prove more, and quietly wait for permission that never comes."},

  {t:"trap2", h:"So the usual fix makes it worse", body:"More hustle. More tactics. More hours. Each one feels like progress and each one takes a little more of the life you were building the business to have in the first place."},

  {t:"reframe", cls:"divider", part:"The reframe", h:"You do not have a strategy problem", sub:"You have a permission problem. And that is good news, because permission is something you can change today."},

  {t:"p1div", cls:"divider", part:"Part One", h:"The real problem"},

  {t:"c1", h:"Balance is treated as the reward", body:"We tell ourselves we will slow down once we scale, once we hire, once the numbers are safe. So balance becomes the prize at the finish line, and the finish line keeps moving."},

  {t:"c2", h:"But you cannot scale what you are collapsing behind", body:"A business is only ever as steady as the woman running it. When she is depleted, every decision gets harder and smaller. The life and the business are not two things. They are one system."},

  {t:"p2div", cls:"divider", part:"Part Two", h:"The Why Not Me method"},

  {t:"pil1", cls:"pillar", k:"Pillar one", h:"The question", body:"We name the belief you are actually operating under, then we trade “who am I to do this?” for “why not me?” We change the identity first, because the plan always follows the identity, never the other way around."},

  {t:"pil2", cls:"pillar", k:"Pillar two", h:"Grace and grit", body:"Two hands, not one. Grace is the self-compassion, the faith, the steadiness that lets you keep going through a hard season. Grit is the follow-through, the accountability, the doing of the work. Mindset alone drifts. Hustle alone breaks. Together they build."},

  {t:"pil3", cls:"pillar", k:"Pillar three", h:"Balanced Life, Balanced Business", body:"We coach the business and the life in the same breath, your health, your people, your purpose, your money, because that is the only version of growth that lasts. Balance is not the reward for scaling. It is how you scale."},

  {t:"fit", h:"How it fits together", list:[
    "The question changes what you believe is possible",
    "Grace and grit change what you are willing to do about it",
    "Balanced Life, Balanced Business changes how you build so it holds"]},

  {t:"p3div", cls:"divider", part:"Part Three", h:"The balanced next level"},

  {t:"look", h:"A balanced week, built on purpose", body:"Fewer decisions made from depletion. Clearer boundaries that your team can actually feel. A business that grows while the life around it gets fuller, not thinner. This is the ordinary, repeatable version of thriving, not a one-time push."},

  {t:"why", k:"Why me", h:"I have asked the question myself", body:"I am a TEDx speaker and the author of Why Not Me? The Question That Changes Everything. I have spent more than thirty years building, losing, and rebuilding, and I host A New Life Podcast for entrepreneurs and professionals. Everything here is what I actually did, not theory."},

  {t:"recap", h:"So, the three things to take with you", list:[
    "The question: why not me?",
    "The method: grace and grit, together",
    "The way to build: balanced life, balanced business"]},

  {t:"cta", cls:"cover", h:"Why not you?", lead:"If this is landing, the next step is a conversation.",
    body:"Come and tell me where you are, and we will look honestly at what a balanced next level could be for you and your business.",
    foot:"Book a clarity call with Pamela at pamelajeananewlife.com",
    disc:"Educational only. No income, revenue, role, or result is guaranteed. Outcomes vary and depend on your own circumstances, effort, and decisions. Nothing here is financial, legal, or medical advice."}
];

function esc(x){return x;}
const el=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide'+(s.cls?' '+s.cls:'');
  let h='';
  h+='<div class="num">'+(i+1)+' / '+S.length+'</div>';
  if(s.k) h+='<div class="k">'+s.k+'</div>';
  if(s.part) h+='<div class="part">'+s.part+'</div>';
  if(s.t==='cover'||s.t==='cta'){
    h+='<h1>'+s.h+'</h1>';
    if(s.lead) h+='<p class="lead" style="margin-top:20px">'+s.lead+'</p>';
    if(s.body) h+='<p class="body">'+s.body+'</p>';
    if(s.tag) h+='<div class="tag">'+s.tag+'</div>';
    if(s.foot) h+='<div class="foot">'+s.foot+'</div>';
    if(s.disc) h+='<div class="disc">'+s.disc+'</div>';
  } else {
    if(s.h) h+='<h2>'+s.h+'</h2>';
    if(s.lead) h+='<p class="lead" style="margin-top:12px">'+s.lead+'</p>';
    if(s.body) h+='<p class="body">'+s.body+'</p>';
    if(s.list){h+='<ul>';s.list.forEach(li=>h+='<li>'+li+'</li>');h+='</ul>';}
    if(s.sub) h+='<p class="sub">'+s.sub+'</p>';
  }
  d.innerHTML=h;
  el.appendChild(d);
});
</script>
</body>
</html>
