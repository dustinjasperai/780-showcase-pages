<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Marketing as Ministry — A Masterclass with Gina DeVee</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf7f3;        /* warm ivory, from her light-scheme luxury brand */
    --panel:#ffffff;
    --ink:#2a2320;       /* soft near-black body, from her #000/#333 */
    --muted:#7c7067;
    --rule:#e7dccd;      /* muted champagne, derived from gold #d2a059 */
    --accent:#ec008c;    /* her brand magenta (ranked hex, link/brand color) */
    --gold:#d2a059;      /* her champagne gold (ranked hex) */
    --serif:'Playfair Display', Georgia, serif;   /* her own display serif */
    --sans:'Open Sans', system-ui, sans-serif;    /* her own body face */
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:64px 60px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 2px 24px rgba(42,35,32,.05);position:relative}
  .slide::after{content:"";position:absolute;left:60px;right:60px;bottom:26px;height:1px;
    background:linear-gradient(90deg,var(--gold),transparent)}
  .eyebrow{font-family:var(--sans);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:22px}
  h1{font-family:var(--serif);font-weight:700;font-size:54px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:600;font-size:38px;line-height:1.14}
  .sub{font-family:var(--serif);font-style:italic;font-weight:500;font-size:23px;color:var(--muted);margin-top:20px;max-width:30ch}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);margin-top:18px;max-width:46ch}
  .part{font-family:var(--sans);font-weight:700;letter-spacing:.16em;text-transform:uppercase;
    font-size:13px;color:var(--gold);margin-bottom:18px}
  ul{list-style:none;margin-top:26px}
  li{font-size:20px;line-height:1.5;padding:14px 0 14px 34px;border-bottom:1px solid var(--rule);position:relative}
  li:last-child{border-bottom:none}
  li::before{content:"";position:absolute;left:0;top:23px;width:12px;height:12px;border-radius:50%;
    background:var(--accent)}
  .pillar{display:flex;gap:22px;align-items:flex-start;margin-top:30px}
  .pnum{font-family:var(--serif);font-size:40px;color:var(--gold);line-height:1;min-width:52px}
  .pbody h3{font-family:var(--serif);font-weight:600;font-size:27px;margin-bottom:8px}
  .pbody p{font-size:18px;line-height:1.55;color:var(--muted);max-width:52ch}
  .big{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.18;max-width:22ch}
  .statement{font-family:var(--serif);font-style:italic;font-weight:500;font-size:34px;
    line-height:1.3;max-width:24ch;color:var(--ink)}
  .statement .hl{color:var(--accent);font-style:normal;font-weight:700}
  .cta .btn{display:inline-block;margin-top:30px;background:var(--accent);color:#fff;
    font-family:var(--sans);font-weight:700;font-size:18px;padding:16px 34px;border-radius:40px;
    letter-spacing:.02em}
  .disclaimer{margin-top:34px;font-size:13px;line-height:1.5;color:var(--muted);max-width:60ch;
    border-top:1px solid var(--rule);padding-top:16px}
  .credit li::before{background:var(--gold)}
  .pagefoot{font-family:var(--sans);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--muted);position:absolute;right:60px;bottom:22px}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:440px}h1{font-size:38px}h2{font-size:28px}.statement{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title',eyebrow:'A Live Masterclass with Gina DeVee',h:'Marketing as Ministry',
   sub:'The feminine path to a fully booked, six figure coaching practice.'},

  {t:'who',eyebrow:'Who this is for',h:'You feel the call.',
   items:[
     'You know you are meant to coach, and maybe you have already started.',
     'But the income is not consistent, and growth feels like a grind.',
     'You want more clients without turning into a funnel technician or a bro marketer.']},

  {t:'statement',st:'You were told the only way to grow is <span class="hl">more</span>. More funnels. More content. More hustle. More discounting.'},

  {t:'big',eyebrow:'The real question',h:'So why does marketing your gift feel like begging?'},

  {t:'statement',st:'The problem is not you. It is the <span class="hl">model</span> you were handed.'},

  {t:'part',part:'Part One',h:'The hustle model is quietly breaking you.'},

  {t:'bullets',h:'What the masculine, hustle model costs you',
   items:[
     'Burnout from posting constantly and chasing every lead.',
     'Underselling your gift because you are afraid to charge what it is worth.',
     'Income that spikes and crashes instead of flowing steadily.',
     'A quiet resentment toward the marketing you are told you must do.']},

  {t:'statement',st:'There is a feminine way to do this. It is quieter, and it <span class="hl">works</span>.'},

  {t:'part',part:'Part Two',h:'The three pillars of a feminine coaching business.'},

  {t:'pillar',part:'Pillar One',pn:'I',name:'Marketing as Ministry',
   d:'Stop selling and start serving. When marketing becomes sacred self expression, an act of giving your wisdom, it stops feeling like pushing. You fall in love with it, and your ideal clients feel the difference.'},

  {t:'pillar',part:'Pillar Two',pn:'II',name:'Packages that sell themselves',
   d:'There are eight simple components of a coaching package that make it easy to say yes to, even if you have never created or sold one before. Get the offer right and the selling gets quiet.'},

  {t:'pillar',part:'Pillar Three',pn:'III',name:'A few dream clients',
   d:'You do not need a huge list. It takes a shockingly small number of the right, high level clients to reach six figures, clients who are ready to invest in your work and a transformation only you can give.'},

  {t:'pillar',part:'The inner work',pn:'IV',name:'The Audacity to be Queen',
   d:'None of it holds unless you believe you are worthy to receive. We rewrite the money story so earning well feels safe, and you stop putting yourself on the back burner financially.'},

  {t:'part',part:'Part Three',h:'The life on the other side of this shift.'},

  {t:'bullets',h:'The picture on the other side',
   items:[
     'A calendar full of dream clients you genuinely love serving.',
     'Premium prices you name without flinching or apologizing.',
     'Income that is consistent, not a feast or famine rollercoaster.',
     'Marketing that feels like ministry instead of a chore.']},

  {t:'bullets',cls:'credit',h:'Why learn this from me',
   items:[
     'For two decades I have guided thousands of women across 100 countries to build lucrative businesses.',
     'I hold an M.A. in clinical psychology, and I teach through spiritual and feminine principles.',
     'This is the exact approach behind The Audacity to be Queen and the Divine Living Academy.']},

  {t:'statement',st:'You do not have to have it all figured out. You just have to take the <span class="hl">first step</span>.'},

  {t:'bullets',h:'The three pillars, together',
   items:[
     'Marketing as Ministry, so clients come to you.',
     'Packages that sell themselves, so the yes is easy.',
     'A few dream clients, so six figures is simple math.']},

  {t:'cta',eyebrow:'Your next step',h:'Come build this with me.',
   sub:'Join me inside the Divine Living Academy and build your feminine coaching business the right way.',
   btn:'Join the Divine Living Academy',
   disclaimer:'This masterclass is for educational purposes only. It is not a guarantee of income or results. Your results will vary and depend on your own effort, market, and circumstances.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=document.createElement('section');
  d.className='slide '+(s.t==='cta'?'cta ':'')+(s.cls||'');
  let html='';
  if(s.eyebrow) html+='<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.part) html+='<div class="part">'+s.part+'</div>';
  if(s.t==='title'){ html+='<h1>'+s.h+'</h1><div class="sub">'+s.sub+'</div>'; }
  else if(s.t==='statement'){ html+='<div class="statement">'+s.st+'</div>'; }
  else if(s.t==='big'){ html+='<h2 class="big">'+s.h+'</h2>'; }
  else if(s.t==='part'){ html+='<h2>'+s.h+'</h2>'; }
  else if(s.t==='who'||s.t==='bullets'){ html+='<h2>'+s.h+'</h2><ul>'+s.items.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }
  else if(s.t==='pillar'){ html+='<div class="pillar"><div class="pnum">'+s.pn+'</div><div class="pbody"><h3>'+s.name+'</h3><p>'+s.d+'</p></div></div>'; }
  else if(s.t==='cta'){ html+='<h2>'+s.h+'</h2><p class="body">'+s.sub+'</p><span class="btn">'+s.btn+'</span><div class="disclaimer">'+s.disclaimer+'</div>'; }
  html+='<div class="pagefoot">Divine Living &middot; '+(i+1)+' / '+S.length+'</div>';
  d.innerHTML=html;
  deck.appendChild(d);
});
</script>
</body>
</html>
