<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Profitable Flower Farm · Roz Chandler, Field Gate Flowers</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Mulish:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f1e7; --panel:#e6e9dd; --rule:#d4d8c6;
    --acc:#b0566a; --ink:#23281f; --body:#4b5040; --dim:#8d907e; --cream:#faf7f0;
  }
  html,body{height:100%}
  body{background:#ece6d8;font-family:'Mulish',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#ece6d8}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Mulish',sans-serif;font-size:1.0vw;font-weight:700;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'Cormorant Garamond',Georgia,serif;font-weight:600;color:var(--ink);line-height:1.08;letter-spacing:.002em}
  .t-title h1{font-size:5.6vw;max-width:95%}
  .t-normal h1{font-size:3.5vw;max-width:92%}
  .t-normal .body{font-family:'Mulish',sans-serif;font-size:1.4vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.66;font-weight:400}
  .sub{font-family:'Cormorant Garamond',serif;font-size:2.15vw;color:var(--acc);margin-top:3.4vh;max-width:86%;line-height:1.34;font-weight:500;font-style:italic}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Mulish',sans-serif;font-size:1.1vw;font-weight:700;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:5.2vw;max-width:92%}
  .t-section .rule{width:14vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#232a1c 0%,#161b10 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.9vw;max-width:90%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#232a1c 0%,#161b10 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:4.1vw;max-width:88%;color:var(--cream)}
  .t-cta .body{font-family:'Mulish',sans-serif;color:#e7e6d6;font-size:1.4vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:600}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.2vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.2%;bottom:8.5%;width:16vw;opacity:.95}
  .corner-vf{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Mulish',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:600;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:700}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(35,40,31,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:600}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:700}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:9.2vw}.t-normal h1{font-size:6.0vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4.2vw}.t-section h1{font-size:8.0vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.2vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 20</div>
<div class="brand-foot">Field Gate Flowers</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- motif: a single cut stem closing on an open bloom with one leaf, drawn in dahlia rose (her cut flower, the recurring mark) -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#b0566a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <path d="M60 108 V52" opacity="0.85"/>
    <path d="M60 84 C60 74 50 68 40 70 C46 60 56 62 60 72" opacity="0.6"/>
    <circle cx="60" cy="40" r="12" opacity="0.9"/>
    <path d="M60 28 V52 M48 40 H72 M51 31 L69 49 M69 31 L51 49" opacity="0.7"/>
  </g>
  <circle cx="60" cy="40" r="4" fill="#b0566a" opacity="0.9"/>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'The Profitable Flower Farm',sub:'How flower farmers turn a cutting patch into a business that actually pays.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You can already grow the flowers. The business is the part that keeps you up at night.',body:'You have taught yourself to grow beautiful stems, and people love them. But you are underpricing, half booked, and never quite sure the numbers add up at the end of the season. The growing was never really the problem. Turning it into a living is.'},
 {t:'dark',title:'A field full of flowers you cannot sell at a profit is an expensive hobby, not a farm.'},

 {t:'section',idx:'Part One',title:'Why Growing Well Is Not Enough'},
 {t:'normal',k:'The passion trap',title:'You priced your flowers for a hobby, then tried to live on it.',body:'Most growers set prices from what feels polite to charge a neighbour, not from what the flowers and your time are actually worth. So the bouquets sell, the diary fills, and the money still does not stretch. You cannot grow your way out of a price that was too low to begin with.'},
 {t:'normal',k:'The invisibility problem',title:'The best grower in the county is no use if nobody local knows she exists.',body:'You are competing with the supermarket on price and with every other grower for the same few weddings, because your farm is a quiet secret. Being found by the right customers, at the right price, is a skill of its own, and it is not the one gardening taught you.'},
 {t:'dark',title:'You did not take on a field and a mortgage to earn less than minimum wage on your own flowers.'},

 {t:'section',idx:'Part Two',title:'The Blooming Business Method'},
 {t:'normal',k:'Pillar one, Grow for Profit',title:'Grow the crops that sell at a margin, on a plan, not just the ones you love.',body:'A profitable farm starts with a business plan and a crop plan built around what actually sells and what actually pays. Which stems earn their bed space, which are a beautiful loss, and how to grow for the markets you want instead of hoping the surplus finds a home.'},
 {t:'normal',k:'Pillar two, Price Without Apology',title:'Name a real number for your flowers, your weddings and your funerals, and hold it.',body:'This is pricing and competition done properly: bouquet and bucket prices that cover your time, and wedding and funeral proposals that quote with confidence instead of guessing low and hoping. Higher, honest prices attract better customers, and better customers are far easier to work with.'},
 {t:'normal',k:'Pillar three, Be Found',title:'Build a brand and a marketing plan so the right customers come looking for you.',body:'Ideal client clarity, a brand that looks like the farm you actually run, and a simple marketing plan across your website, email and Instagram. Not posting for the sake of it, but a system that puts your flowers in front of the brides, florists and locals most likely to buy them.'},
 {t:'normal',k:'Pillar four, Diversify the Income',title:'Stop depending on one channel and one short season.',body:'Weddings, funerals, workshops, subscriptions and semi passive income, chosen on purpose so one bad month or one lost outlet does not sink the year. A resilient flower business earns from several streams, and knows which ones are worth its time.'},
 {t:'dark',title:'The most profitable flower farm is not the one that grows the most. It is the one that sells the best.'},

 {t:'section',idx:'Part Three',title:'What a Blooming Business Looks Like'},
 {t:'normal',k:'The farm this builds',title:'Fewer stems wasted, better prices, and a diary that fills with the work you want.',body:'When you grow to a plan and price with confidence, the waste drops, the margin becomes real, and a slow week stops being a crisis. You take the weddings and the customers you actually want, and the farm starts paying you like the business it is, not the hobby it started as.'},
 {t:'dark',title:'Beautiful flowers were always the easy part. A business that pays you is the real skill.'},
 {t:'normal',k:'Why Roz',title:'Grew Field Gate Flowers over twelve years, and now teaches growers the business side.',body:'Roz Chandler has run Field Gate Flowers on the banks of the Ouse for around twelve years, hosts the weekly Cut Flower Podcast, and through Blooming Business and The Growth Club has helped hundreds of growers turn a cutting patch into a business that pays. This is the method behind all of it.'},

 {t:'section',idx:'Your Next Step',title:'Grow the Business Your Flowers Deserve'},
 {t:'normal',k:'Keep going with Roz',title:'A place to start, and a room to keep growing in.',body:'Blooming Business is where you begin: the plan, the pricing and the marketing that make a farm profitable. The Growth Club is the membership you stay in as it grows, with live support the whole way. Start where you are, and take it as far as you want.'},
 {t:'cta',title:'Ready to build a flower farm that pays?',body:'Take the next step with Field Gate Flowers.',chips:['Start with Blooming Business','Join The Growth Club'],disc:'Educational content for working and aspiring flower farmers. No income or business result is guaranteed. Results vary by farm, market and effort.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Field Gate <b>Flowers</b> · Roz Chandler</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
