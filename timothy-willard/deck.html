<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Beautiful Disruption — A Masterclass with Dr. Tim Willard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=PT+Serif:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f5efe2;
    --panel:#fbfbfb;
    --rule:#cfcdc7;
    --ink:#342e2e;
    --dim:#8a7f79;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:"PT Serif",Georgia,serif;
    line-height:1.5;
    -webkit-font-smoothing:antialiased;
  }
  .deck{max-width:960px;margin:0 auto;padding:48px 28px 120px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:64px 64px 56px;
    margin:0 0 30px;
    min-height:60vh;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .num{position:absolute;top:22px;right:28px;font-size:13px;letter-spacing:.14em;color:var(--dim);font-family:"PT Serif",serif}
  .kicker{font-family:"PT Serif",serif;font-size:14px;letter-spacing:.22em;text-transform:uppercase;color:var(--dim);margin-bottom:22px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:62px;line-height:1.04;letter-spacing:.005em}
  h2{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:44px;line-height:1.08;margin-bottom:10px}
  .sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-weight:500;font-size:28px;color:var(--ink);margin-top:20px;line-height:1.25}
  p{font-size:20px;margin-top:18px;max-width:42em}
  p.lead{font-size:22px}
  .quiet{color:var(--dim)}
  ul{list-style:none;margin-top:24px}
  li{font-size:21px;padding:14px 0;border-top:1px solid var(--rule);display:flex;gap:16px;align-items:baseline}
  li:first-child{border-top:none}
  .mark{font-family:"Cormorant Garamond",serif;font-size:26px;color:var(--ink);min-width:1.4em}
  .big{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:40px;line-height:1.18;max-width:20em}
  .pillar-name{font-family:"Cormorant Garamond",serif;font-size:50px;font-weight:600;margin-bottom:6px}
  .foot{margin-top:30px;padding-top:18px;border-top:1px solid var(--rule);font-size:16px;color:var(--dim)}
  .disc{font-size:15px;color:var(--dim);margin-top:26px;max-width:46em;line-height:1.5}
  .cta-step{font-family:"Cormorant Garamond",serif;font-size:30px;margin-top:10px}
  @media(max-width:680px){
    .slide{padding:40px 26px}
    h1{font-size:42px}h2{font-size:34px}.pillar-name{font-size:38px}.big{font-size:30px}
  }
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
   kicker:'A Live Masterclass with Dr. Tim Willard',
   title:'The Beautiful Disruption',
   sub:'How to find your true voice and write with soul in a culture built for the surface.'},

  {t:'promise',
   kicker:'What you will leave with',
   h:'One hour. Three shifts.',
   body:['By the end of this live session you will know why your best writing keeps getting flattened, the four practices that return soul to the page, and the first small habit that changes how you see before you ever write a word.'],
   note:'This is not about writing faster. It is about writing like yourself again.'},

  {t:'who',
   kicker:'Who this is for',
   h:'The writer who senses there is more.',
   list:['Essayists and newsletter writers who feel their voice thinning out',
         'Aspiring authors sitting on a book they cannot quite start',
         'Substack and online writers tired of sounding like the feed',
         'Anyone who used to love writing and wants the wonder back']},

  {t:'trap',
   kicker:'The trap',
   h:'The Surface Trap.',
   body:['You open the blank page and a quiet voice says: be useful, be quick, be clear, be safe. So you write for the scroll. You chase the trend, trim the strange parts, and post.',
         'It performs. And it sounds like everyone else.']},

  {t:'reframe',
   kicker:'The hard reframe',
   big:'Your writing is not failing because it is unclear. It is failing because there is no one inside it.'},

  {t:'part',
   kicker:'Part One',
   h:'The Veneer.',
   body:['We live in a surface society. Speed and certainty get rewarded; slowness and wonder get edited out. Writing is the first place that bargain shows up.']},

  {t:'point',
   kicker:'Part One',
   h:'What the surface costs a writer.',
   list:['Your voice flattens into the house style of the internet',
         'You produce more and feel less',
         'Readers skim you and forget you',
         'The work that is most you is the work you keep deleting']},

  {t:'point',
   kicker:'Part One',
   h:'Beauty is the thing we cut first.',
   body:['Under pressure we treat beauty as decoration, the luxury we add if there is time. It is actually the signal. Beauty is where your attention, your conviction, and your reader finally meet.'],
   note:'Beauty can change you if you let it. That is also how it changes a reader.'},

  {t:'part',
   kicker:'Part Two',
   h:'The Ways of Wonder.',
   sub:'Four practices that put soul back on the page.',
   body:['This is the method underneath The Beauty Chasers and the Writer’s Workshop. Not tricks. Disciplines of seeing.']},

  {t:'pillar',
   kicker:'Practice One',
   name:'Slow Down to See',
   body:['Wonder begins before words. Most writing is thin because the seeing was thin. We practice the lost art of reflection: looking long enough at one real thing that it starts to speak back.'],
   note:'Slow down and listen with your heart. Then write what you heard.'},

  {t:'pillar',
   kicker:'Practice Two',
   name:'Chase Beauty, Not Trends',
   body:['The trend tells you what is working this week. Beauty tells you what is true. We learn to aim your writing at what is beautiful and lasting instead of what is merely current, and to trust that readers are starving for it.']},

  {t:'pillar',
   kicker:'Practice Three',
   name:'Write the Dangerous Thing',
   body:['A surface culture wants you safe and certain. Soul shows up the moment you risk the sentence you were going to delete. We practice the beautiful disruption: saying the true, strange, tender thing on purpose.']},

  {t:'pillar',
   kicker:'Practice Four',
   name:'Hone the Message',
   body:['Soul without craft is just a diary. We take the raw, true material and shape it: finding the one idea, building the structure, and honing the message so what moved you moves a reader too.']},

  {t:'point',
   kicker:'Part Two',
   h:'The four practices, together.',
   list:['See it slowly',
         'Choose beauty over the trend',
         'Risk the dangerous, true line',
         'Shape it until it carries']},

  {t:'part',
   kicker:'Part Three',
   h:'The writing life underneath this.',
   body:['This is not a weekend high. It is a rhythm you can keep, the difference between a writer who burns out chasing the feed and one who gets deeper every year.']},

  {t:'point',
   kicker:'Part Three',
   h:'A week with wonder in it.',
   list:['A short daily reflection habit, before any drafting',
         'One real thing noticed and written down without performing',
         'A weekly piece aimed at beauty, not the algorithm',
         'A standing question: where was I most myself on the page?']},

  {t:'why',
   kicker:'Why listen to me on this',
   h:'Dr. Tim Willard.',
   body:['I spent two years in Oxford studying beauty and wonder in C.S. Lewis for a PhD in theology, and more than sixteen years in publishing as a writer, editor, and collaborator.'],
   list:['Author of The Beauty Chasers and Veneer',
         'Writer of The Beautiful Disruption',
         'Teacher of the Writer’s Workshop for writers at every stage']},

  {t:'point',
   kicker:'The honest objection',
   h:'"Will anyone actually read slow, beautiful writing?"',
   body:['More than ever. The faster and flatter the feed gets, the more a reader remembers the one voice that made them stop and feel something. Beauty is not the risky bet. Blending in is.']},

  {t:'reframe',
   kicker:'The one idea to keep',
   big:'Write from wonder, not from the surface, and your reader will finally recognize the person behind the page.'},

  {t:'invite',
   kicker:'Where this goes next',
   h:'Keep going with me.',
   body:['If this hour gave your writing its wonder back, the work from here is practice with someone in your corner. That is exactly what my Writer’s Workshop and one-on-one coaching are built to do.']},

  {t:'cta',
   kicker:'Your next step',
   h:'Come write with soul.',
   step:'Join the Writer’s Workshop, or apply to work with me one-on-one on your book or your voice.',
   site:'timothywillard.com',
   disc:'This masterclass is educational. No specific outcome, audience size, income, or publishing result is guaranteed. Results vary with each writer’s effort, craft, and circumstances.'}
];

function el(tag,cls,html){const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const d=el('section','slide');
  d.appendChild(el('div','num',String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')));
  if(s.kicker)d.appendChild(el('div','kicker',s.kicker));
  if(s.t==='title'){d.appendChild(el('h1',null,s.title));if(s.sub)d.appendChild(el('div','sub',s.sub));}
  else if(s.t==='pillar'){d.appendChild(el('div','pillar-name',s.name));}
  else if(s.big){d.appendChild(el('div','big',s.big));}
  else if(s.h){d.appendChild(el('h2',null,s.h));}
  if(s.sub && s.t!=='title')d.appendChild(el('div','sub',s.sub));
  if(s.body)s.body.forEach((p,j)=>d.appendChild(el('p',j===0?'lead':null,p)));
  if(s.list){const ul=el('ul');s.list.forEach(it=>{const li=el('li');li.appendChild(el('span','mark','—'));li.appendChild(el('span',null,it));ul.appendChild(li);});d.appendChild(ul);}
  if(s.step)d.appendChild(el('div','cta-step',s.step));
  if(s.note)d.appendChild(el('div','foot',s.note));
  if(s.site)d.appendChild(el('div','foot',s.site));
  if(s.disc)d.appendChild(el('div','disc',s.disc));
  deck.appendChild(d);
});
</script>
</body>
</html>
