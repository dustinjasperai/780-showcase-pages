<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The 10-Minute Data Audit, a live masterclass with Jeff Sauer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#16254c;
    --panel:#1d2f5c;
    --rule:rgba(255,255,255,.14);
    --ink:#eef2f8;
    --muted:#9fb0cf;
    --accent:#35a292;
    --spark:#e5de5a;
    --head:'Oswald',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  #stage{height:100vh;display:flex;align-items:center;justify-content:center;padding:5vh 6vw;position:relative}
  .slide{width:100%;max-width:1000px;background:var(--panel);border:1px solid var(--rule);border-radius:6px;
    padding:66px 78px;min-height:66vh;display:none;flex-direction:column;justify-content:center;
    box-shadow:0 24px 60px rgba(0,0,0,.34);position:relative;overflow:hidden}
  .slide.on{display:flex;animation:f .4s ease}
  @keyframes f{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  /* console tick: a short teal rule under the kicker, like a scorecard row marker */
  .kick{font-family:var(--body);font-size:13px;letter-spacing:.28em;text-transform:uppercase;
    color:var(--accent);font-weight:600;margin-bottom:26px;position:relative;padding-bottom:14px;display:inline-block}
  .kick::after{content:'';position:absolute;left:0;bottom:0;width:52px;height:3px;background:var(--accent);border-radius:2px}
  h1{font-family:var(--head);font-weight:700;font-size:60px;line-height:1.05;margin:0 0 20px;letter-spacing:.005em;color:var(--ink)}
  h2{font-family:var(--head);font-weight:600;font-size:42px;line-height:1.1;margin:0 0 20px;letter-spacing:.01em;color:var(--ink)}
  p{font-size:22px;line-height:1.55;color:var(--muted);margin:0 0 14px;max-width:52ch}
  .lead{font-size:26px;color:var(--ink);font-weight:400}
  .em{color:var(--spark);font-weight:700}
  ul{margin:20px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.4;color:var(--ink);padding:18px 0 18px 44px;position:relative;border-top:1px solid var(--rule)}
  li:first-child{border-top:none}
  li::before{content:'';position:absolute;left:0;top:24px;width:22px;height:3px;border-radius:2px;background:var(--accent)}
  li b{font-weight:700}
  li span{display:block;color:var(--muted);font-size:17px;margin-top:6px;font-weight:400}
  .big{font-family:var(--head);font-size:62px;line-height:1.08;font-weight:700;letter-spacing:.01em;color:var(--ink)}
  .strike{color:var(--muted);position:relative;opacity:.85;font-weight:600}
  .strike::after{content:'';position:absolute;left:-1%;right:-1%;top:52%;height:5px;background:var(--spark);transform:rotate(-1.4deg);border-radius:3px}
  .row{display:flex;gap:16px;margin-top:24px;flex-wrap:wrap}
  .cell{flex:1;min-width:170px;background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:22px 22px}
  .cell .n{font-family:var(--head);color:var(--accent);font-size:20px;font-weight:700;margin-bottom:10px;letter-spacing:.02em}
  .cell p{font-size:16px;margin:0;color:var(--muted)}
  .who{font-size:19px;color:var(--muted);margin-top:auto;padding-top:26px}
  .who b{color:var(--ink)}
  .disc{font-size:15px;color:var(--muted);margin-top:28px;max-width:70ch;line-height:1.45}
  .ctaline{font-size:23px;color:var(--ink);margin-top:12px;padding-left:20px;position:relative}
  .ctaline::before{content:'';position:absolute;left:0;top:14px;width:10px;height:3px;background:var(--accent);border-radius:2px}
  .ctaline b{color:var(--accent);font-weight:700}
  .pres{font-size:18px;color:var(--muted);margin-top:28px}
  .pres b{color:var(--ink);font-weight:700}
  #nav{position:fixed;bottom:20px;right:26px;font-size:13px;color:var(--muted);letter-spacing:.08em;
    font-weight:600;background:var(--panel);border:1px solid var(--rule);border-radius:100px;padding:8px 16px}
  #dots{position:fixed;bottom:22px;left:26px;display:flex;gap:7px}
  #dots i{width:7px;height:7px;border-radius:50%;background:var(--rule);display:block}
  #dots i.on{background:var(--accent);width:20px;border-radius:4px}
  .hint{position:fixed;top:18px;left:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
  @media(max-width:640px){.slide{padding:40px 26px}h1{font-size:38px}h2{font-size:28px}.big{font-size:40px}p,li{font-size:18px}}
</style>
</head>
<body>
<div class="hint">MeasureU · live masterclass sample · use arrow keys</div>
<div id="stage"><div id="slide" class="slide on"></div></div>
<div id="dots"></div>
<div id="nav"></div>
<script>
const S=[
 {t:'title',kick:'A live masterclass',h:'The 10-Minute Data Audit',p:'How to find a measurement problem every client will pay to fix, and turn it into paid work.',pres:'With <b>Jeff Sauer</b>, founder of MeasureU, teaching digital measurement since 2012'},
 {t:'promise',kick:'What you will leave with',h:'What you take away, in one live hour.',li:[['A repeatable 10-minute audit','A fast way to inspect any account and surface a concrete problem worth fixing.'],['The words that make it billable','How to say the finding so a client hears a project, not a lecture.'],['A cleaner reporting habit','A simple test for what belongs in a report and what is just noise.']]},
 {t:'audience',kick:'Who this is for',h:'You can run the tools. Getting paid for it is the hard part.',p:'Agency owners, freelance measurement consultants, and in-house analytics leads who already know GA4 and GTM, and want that skill to turn into more paid work with the clients they have.',who:'<b>The trap:</b> you deliver a clean dashboard, the client says thanks, and nothing else happens. The setup was the easy part. Selling the value of it is what nobody taught you.'},
 {t:'reframe',kick:'The reframe',big1:'Ship them a prettier dashboard.',big2:'Hand them a problem they will <span class="em">pay to fix</span>.',p:'A dashboard is a deliverable. A problem the client did not know they had is a decision, and decisions are what they fund. The same measurement skill points at both. Only one of them gets paid.'},
 {t:'stakes',kick:'The stakes',h:'Data nobody trusts is data nobody buys.',p:'When the numbers do not match the platform, or half the conversions go missing, the client quietly stops believing the report. Once trust is gone, the work looks like a cost instead of an investment, and the account is the first one cut.'},
 {t:'part',kick:'Part one',h:'Why good measurement goes unbilled.'},
 {t:'point',kick:'The core problem',h:'You are selling reports, when the client wants decisions.',p:'Most measurement work ends at the dashboard. The client scrolls it, nods, and files it. A report describes the past. A recommendation changes what they do next, and that is the thing worth paying for.'},
 {t:'point',kick:'The core problem',h:'The trust gap is invisible until the renewal.',p:'Clients rarely say the data feels off. They just lean on it less, question the invoice more, and start shopping around at renewal. By the time you hear the doubt out loud, the decision to leave is usually already made.'},
 {t:'signs',kick:'The core problem',h:'The signs your measurement is not earning its keep.',li:[['The client asks what to do with it','The numbers are right, but nobody turns them into an action.'],['Reports get longer, not clearer','Every metric gets added and none gets cut, so the point disappears.'],['You compete on price at renewal','Without a visible decision attached, the work reads as an expense.']]},
 {t:'part',kick:'Part two',h:'The system: measurement that pays.'},
 {t:'framework',kick:'The model',h:'The CLEAN Data Framework.',row:[['Collect','Capture the right data at the source, so nothing important is missing.'],['Label','Name and organize it so it is still readable months later.'],['Enhance','Fix the gaps, the bots, and the mismatches that break trust.'],['Assemble','Bring it into one view that actually agrees with itself.'],['Narrate','Tell the client what it means and what to do next.']],p:'Collect, Label, Enhance, Assemble, Narrate. Most consultants stop at Assemble and hand over a dashboard. Narrate is the step that gets funded.'},
 {t:'point',kick:'The Narrate step, up close',h:'Say the finding in the client\'s words.',p:'The client does not care about attribution windows. They care about where the money is leaking and what to do about it. Translate every number into one sentence they could repeat to their boss. That sentence is the product.'},
 {t:'point',kick:'The Q.I.A. test, up close',h:'Questions, then Information, then Action.',p:'Start from the questions the client needs answered, pull only the information that answers them, and end on the action it points to. If a number does not lead to an action, it does not belong in the report. That one rule keeps the garbage out.'},
 {t:'framework2',kick:'The audit',h:'The 10-minute audit, step by step.',li:[['Catch the bot traffic','Spot the junk sessions inflating the numbers and quietly skewing every decision.'],['Check tracking is compliant','Confirm the setup is legal and consented, so the data is safe to rely on.'],['Confirm the platforms agree','See whether the site, the ads, and the store are telling the same story.'],['Turn the finding into a conversation','Frame the biggest gap as a fix worth paying for, not a critique.']]},
 {t:'part',kick:'Part three',h:'What changes when the data earns trust.'},
 {t:'looks',kick:'The outcome',h:'The same skill, finally getting paid.',li:[['Clients act on the report','The recommendation is obvious, so the work turns into a decision.'],['Renewals stop being about price','A visible fix each quarter makes the value impossible to miss.'],['You lead with a problem, not a rate card','The audit opens the conversation, and the scope follows the finding.']]},
 {t:'whyme',kick:'Why Jeff',h:'A practitioner who did this at scale.',li:[['Teaching measurement since 2012','More than a decade turning analytics skill into work clients actually value.'],['Built and exited a marketing agency','Ran the client side, so the frameworks come from real engagements, not theory.'],['Tens of thousands of marketers trained','Through MeasureU, the newsletter, and the YouTube channel.']]},
 {t:'cta',kick:'Your next step',h:'Ready to get paid for what you already know?',ctas:['<b>Join MeasureU Pro</b> for the live calls, workshops, and instructor access that build the full measurement system.','<b>Book a 1:1 coaching session</b> if you want direct help applying the audit and the CLEAN framework to your own accounts.'],disc:'This masterclass is educational. It shares frameworks and approaches for digital measurement and analytics consulting; it is not advice for your specific business and not a guarantee of revenue, clients, income, or any particular result. Outcomes vary.'}
];

const stage=document.getElementById('slide');
const dots=document.getElementById('dots');
const nav=document.getElementById('nav');
let i=0;
S.forEach(()=>{const d=document.createElement('i');dots.appendChild(d)});
function render(){
 const s=S[i];let h='<div class="inner">';
 if(s.kick)h+=`<div class="kick">${s.kick}</div>`;
 if(s.t==='title'){h+=`<h1>${s.h}</h1><p class="lead">${s.p}</p><div class="pres">${s.pres}</div>`}
 else if(s.t==='reframe'){h+=`<div class="big"><span class="strike">${s.big1}</span></div><div class="big">${s.big2}</div><p style="margin-top:24px">${s.p}</p>`}
 else if(s.t==='part'){h+=`<h1>${s.h}</h1>`}
 else if(s.row){h+=`<h2>${s.h}</h2><div class="row">`+s.row.map(c=>`<div class="cell"><div class="n">${c[0]}</div><p>${c[1]}</p></div>`).join('')+`</div>`+(s.p?`<p style="margin-top:22px">${s.p}</p>`:'')}
 else if(s.li){h+=`<h2>${s.h}</h2><ul>`+s.li.map(x=>`<li><b>${x[0]}</b><span>${x[1]}</span></li>`).join('')+`</ul>`}
 else if(s.t==='cta'){h+=`<h2>${s.h}</h2>`+s.ctas.map(c=>`<div class="ctaline">${c}</div>`).join('')+`<div class="disc">${s.disc}</div>`}
 else{h+=`<h2>${s.h}</h2>`+(s.p?`<p class="lead" style="color:var(--muted)">${s.p}</p>`:'')+(s.who?`<div class="who">${s.who}</div>`:'')}
 h+='</div>';
 stage.innerHTML=h;
 [...dots.children].forEach((d,k)=>d.className=k===i?'on':'');
 nav.textContent=`${i+1} / ${S.length}`;
}
function go(n){i=Math.max(0,Math.min(S.length-1,n));stage.classList.remove('on');void stage.offsetWidth;stage.classList.add('on');render()}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' ')go(i+1);if(e.key==='ArrowLeft')go(i-1)});
document.addEventListener('click',e=>{if(e.clientX>window.innerWidth*0.5)go(i+1);else go(i-1)});
render();
</script>
</body>
</html>
