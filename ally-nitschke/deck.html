<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Courageous Leadership — a masterclass with Ally Nitschke, CSP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#140a12; --panel:#241320; --rule:#3a1f34; --accent:#ff4040; --ink:#f4ecef;
    --muted:#c7b4bf; --display:'Poppins',system-ui,sans-serif; --serif:'Source Serif 4',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:#0b060a;color:var(--ink);font-family:var(--serif);line-height:1.5}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:56px 56px;margin:0 0 22px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .k{font-family:var(--display);font-weight:700;letter-spacing:.18em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:46px;line-height:1.05;letter-spacing:-.02em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.01em;margin-bottom:16px}
  .sub{font-size:20px;color:var(--muted);max-width:60ch}
  .body{font-size:19px;margin-top:14px;max-width:62ch}
  .big{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.2;max-width:24ch}
  ul{list-style:none;margin-top:22px;max-width:62ch}
  li{position:relative;padding-left:30px;margin-bottom:14px;font-size:19px}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:12px;background:var(--accent);border-radius:3px}
  .num{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);
    border:1px solid var(--accent);border-radius:999px;width:34px;height:34px;display:inline-flex;
    align-items:center;justify-content:center;margin-bottom:16px}
  .quote{font-family:var(--display);font-weight:600;font-size:30px;line-height:1.25;max-width:26ch}
  .cite{margin-top:18px;color:var(--muted);font-size:17px}
  .pill{display:inline-block;font-family:var(--display);font-weight:600;font-size:14px;
    color:var(--ink);background:var(--panel);border:1px solid var(--rule);border-radius:999px;padding:6px 14px;margin:6px 6px 0 0}
  .disc{margin-top:26px;font-size:14px;color:var(--muted);max-width:66ch;border-top:1px solid var(--rule);padding-top:16px}
  .foot{position:absolute;right:28px;bottom:20px;font-family:var(--display);font-size:12px;color:var(--muted);letter-spacing:.04em}
  .cta h1{font-size:40px}
  .n{font-family:var(--display);font-weight:800;font-size:60px;color:var(--accent);line-height:1}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', k:'A LIVE MASTERCLASS', h:'Courageous Leadership', sub:'The conversations that change everything. With Ally Nitschke, CSP.'},
  {t:'promise', k:'What you will leave with', h:'Say the thing, well.', body:'In 60 minutes you will learn how to have the conversations most leaders avoid, so clarity, trust and performance stop leaking out of your team.', list:['Name what is really going on, beneath the surface','Stay calm and in control when the conversation gets hard','Turn feedback and accountability into something your people trust']},
  {t:'who', k:'Who this is for', h:'Leaders carrying the weight of the unsaid.', body:'Managers, executives and team leaders in complex, high-pressure environments who know a conversation is overdue and keep finding reasons to wait.'},
  {t:'trap', k:'The trap', h:'Avoidance feels like keeping the peace.', body:'So you soften it. You circle back. You tell yourself now is not the time. The silence feels safe, and that is exactly why it is so expensive.'},
  {t:'hook', k:'The hard truth', big:'The conversation you are avoiding is already happening. You are just not in the room for it.'},
  {t:'part', k:'Part one', h:'Leadership is a communication problem wearing a strategy costume.', body:'Most teams do not fail on the plan. They fail on the things no one was willing to say out loud while there was still time to fix them.'},
  {t:'cost', k:'The silence tax', h:'What the unsaid costs you.', list:['Unsaid feedback becomes a missed standard','A missed standard becomes resentment','Resentment becomes quiet quitting','Quiet quitting becomes the resignation you did not see coming']},
  {t:'part', k:'Part two', h:'The Courageous Leadership frame.', body:'Courage is not volume and it is not bluntness. It is awareness plus care, applied in the moment it matters. We build it across three levels.'},
  {t:'pillar', num:'1', k:'Pillar one', h:'Self-Awareness: clarity.', body:'Before the conversation, get clear. What is the real issue, what is the story you are adding, and what outcome actually serves this person and the team? Courage starts with honesty about yourself.'},
  {t:'pillar', num:'2', k:'Pillar two', h:'Team-Awareness: communication.', body:'Read what is happening beneath the surface. Create enough safety that people will tell you the truth, and enough standard that they know it matters. This is where trust is built or broken.'},
  {t:'pillar', num:'3', k:'Pillar three', h:'Organisational-Awareness: change.', body:'Scale the behaviour. When leaders model the hard conversation well, it gives everyone else permission. Courage becomes culture, not a one-off brave moment.'},
  {t:'method', k:'The method', h:'How to actually say it.', body:'A courageous conversation has a shape. When you know the shape, the fear drops and the skill takes over.', list:['Open with the real topic, not the warm-up','Name the behaviour and its impact, plainly','Get curious before you get certain','Agree the one thing that changes next']},
  {t:'move', k:'In the moment', h:'Name what is beneath the surface.', body:'Most conversations stall because people talk about the symptom. Courage is saying the real thing kindly: "Here is what I am noticing, and here is why it matters to me and to the team."'},
  {t:'move', k:'In the moment', h:'Stay in it when it gets hot.', body:'The skill is regulating yourself so you can stay present when the other person reacts. You do not have to win the moment. You have to stay in the conversation long enough to find the truth.'},
  {t:'part', k:'Part three', h:'What it looks like when it works.', body:'A team that says the thing early moves faster, trusts more and stops wasting energy managing around each other. The hard conversation up front buys back months of friction.'},
  {t:'quote', k:'Why this, why me', quote:'Twelve years on stage taught me more about leading under pressure than any theory ever did. Presence is a practice.', cite:'Ally Nitschke, CSP, Certified Speaking Professional and author of Rise of the Courageous Leader'},
  {t:'object', k:'The honest objection', h:'But what if it goes badly?', body:'It sometimes will. A conversation held with clarity and care, that lands imperfectly, still beats the silence that was quietly costing you the person. Skill lowers the risk. Avoidance guarantees the cost.'},
  {t:'act', k:'Your first move', h:'One conversation, this week.', body:'Pick the one you have been moving from Monday to Tuesday to next week. Get clear on the real issue. Open with it. You already know which one it is.'},
  {t:'recap', k:'Recap', h:'Courage is a skill you can build.', list:['Self-Awareness gives you clarity','Team-Awareness builds the trust to be honest','Organisational-Awareness turns it into culture']},
  {t:'cta', cls:'cta', k:'Work with Ally', h:'Bring Courageous Leadership to your team.', body:'If your leaders are carrying conversations they keep avoiding, let us build the skill together through a keynote, workshop or the Courageous Leadership program. Book a complimentary call at madeformore.com.au.', disc:'This masterclass is educational. No income, role, promotion, or business result is guaranteed. Outcomes vary with context, effort and circumstances.'}
];
const deck = document.getElementById('deck');
S.forEach(function(s){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let h = '';
  if(s.k) h += '<div class="k">'+s.k+'</div>';
  if(s.num) h += '<div class="num">'+s.num+'</div>';
  if(s.h) h += '<h1>'+s.h+'</h1>';
  if(s.big) h += '<div class="big">'+s.big+'</div>';
  if(s.quote) h += '<div class="quote">'+s.quote+'</div>';
  if(s.sub) h += '<div class="sub">'+s.sub+'</div>';
  if(s.body) h += '<div class="body">'+s.body+'</div>';
  if(s.list){ h += '<ul>'; s.list.forEach(function(i){ h += '<li>'+i+'</li>'; }); h += '</ul>'; }
  if(s.cite) h += '<div class="cite">'+s.cite+'</div>';
  if(s.disc) h += '<div class="disc">'+s.disc+'</div>';
  h += '<div class="foot">Courageous Leadership · Ally Nitschke, CSP</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
