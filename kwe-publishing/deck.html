<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Finish the Book You Keep Starting — a masterclass with Kim Wells Eley</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Yrsa:wght@400;500;600;700&family=Jost:wght@400;500;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f1e7; --panel:#efe7d6; --ink:#2b2118; --muted:#6b5c49;
    --accent:#d76b00; --teal:#5dbbb4; --rule:#d9ccb4;
    --serif:'Yrsa',Georgia,serif; --sans:'Jost',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--ink);color:var(--ink);font-family:var(--sans)}
  .deck{max-width:960px;margin:0 auto;padding:28px 16px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:14px;
    padding:60px 58px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;box-shadow:0 1px 0 rgba(0,0,0,.04)}
  .slide.panel{background:var(--panel)}
  .kick{font-family:var(--sans);font-weight:800;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--serif);font-weight:700;font-size:52px;line-height:1.06;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:38px;line-height:1.1;margin-bottom:14px}
  h3{font-family:var(--serif);font-weight:600;font-size:26px;line-height:1.15;margin-bottom:8px}
  p{font-size:20px;line-height:1.5;color:var(--ink);max-width:62ch;margin-top:12px}
  p.sub{color:var(--muted)}
  .lead{font-family:var(--serif);font-style:italic;font-size:30px;line-height:1.3;color:var(--ink)}
  .big{font-family:var(--serif);font-size:44px;line-height:1.12;font-weight:700}
  .accent{color:var(--accent)}
  .rule{height:3px;width:64px;background:var(--accent);border-radius:3px;margin:22px 0}
  .meta{margin-top:30px;font-size:16px;color:var(--muted);font-weight:600}
  .divider{background:var(--ink);color:var(--bg)}
  .divider h2,.divider h1{color:var(--bg)}
  .divider .kick{color:var(--teal)}
  .step{font-family:var(--serif);font-size:15px;font-weight:700;color:var(--accent);
    letter-spacing:.1em;text-transform:uppercase}
  .list{margin-top:18px}
  .row{display:flex;gap:14px;align-items:flex-start;padding:12px 0;border-top:1px solid var(--rule);
    font-size:19px;line-height:1.4}
  .row .n{font-family:var(--serif);font-weight:700;color:var(--accent);font-size:20px;min-width:30px}
  .stats{display:flex;gap:40px;flex-wrap:wrap;margin-top:26px}
  .stat .num{font-family:var(--serif);font-weight:700;font-size:46px;color:var(--accent);line-height:1}
  .stat .lab{font-size:15px;color:var(--muted);margin-top:6px;font-weight:600}
  .cta .btn{display:inline-block;margin-top:24px;background:var(--accent);color:#fff;
    font-weight:800;font-size:19px;padding:16px 30px;border-radius:10px;text-decoration:none}
  .disc{margin-top:26px;font-size:13px;color:var(--muted);max-width:66ch;line-height:1.45}
  @media(max-width:640px){.slide{padding:40px 26px;min-height:auto}h1{font-size:36px}h2{font-size:28px}.big{font-size:32px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', cls:"", html:`<div class="kick">A live masterclass for authors</div><h1>Finish the Book You Keep Starting</h1><div class="rule"></div><p class="sub">The honest path from a stuck draft to a published, read, and talked about book.</p><div class="meta">Kim Wells Eley &nbsp;&middot;&nbsp; KWE Publishing &nbsp;&middot;&nbsp; The Sociable Scribe</div>` },

  {t:'who', cls:"panel", html:`<div class="kick">Who this is for</div><h2>You have a book in you, and part of it on the page.</h2><p>You are a coach, a consultant, a speaker, or someone with a story that will not leave you alone. You started the book. Maybe more than once. It is sitting in a folder right now, somewhere around chapter three.</p><p class="sub">This hour is for the author who is not short on ideas. You are short on a way to finish.</p>` },

  {t:'trap', cls:"", html:`<div class="kick">The trap</div><h2>You did not run out of talent. You ran out of runway.</h2><p>The beginning is easy. The idea is exciting, the first pages come fast. Then life gets loud, the doubt creeps in, and the draft goes quiet. Weeks become a year.</p><p>Most books do not die at the blank page. They die in the middle.</p>` },

  {t:'reframe', cls:"divider", html:`<div class="kick">The reframe</div><h1>A finished rough draft beats a perfect book you never wrote.</h1><p style="color:var(--teal)">Done is a decision, not a talent. The authors who finish are not more gifted. They have a plan and someone keeping them on the page.</p>` },

  {t:'part1', cls:"divider", html:`<div class="kick">Part One</div><h1>Why good books stall in the messy middle</h1>` },

  {t:'problem', cls:"", html:`<div class="kick">The real problem</div><h2>Three things go missing at once.</h2><div class="list"><div class="row"><span class="n">1</span><div><strong>No plan.</strong> You started writing before you decided who the book is for and what it has to accomplish.</div></div><div class="row"><span class="n">2</span><div><strong>No accountability.</strong> Nobody is expecting your pages, so the book always loses to the urgent.</div></div><div class="row"><span class="n">3</span><div><strong>Self doubt.</strong> The quiet voice that says who am I to write this. It gets louder in the middle.</div></div></div>` },

  {t:'cost', cls:"panel", html:`<div class="kick">The cost</div><h2>The book that could open doors sits in a drafts folder.</h2><p>A finished book is the credibility, the speaking invitations, the clients, the legacy. An unfinished one is a weight you carry and apologize for. The gap between the two is not genius. It is a process and a room that keeps you writing.</p>` },

  {t:'part2', cls:"divider", html:`<div class="kick">Part Two</div><h1>The idea to published path</h1><p style="color:var(--teal)">The same five stages I have walked 150 books through.</p>` },

  {t:'stage1', cls:"", html:`<div class="step">Stage one</div><h2>Strategic planning</h2><p>Before a word of the real draft, we name three things: your <span class="accent">intention</span>, your single <span class="accent">message</span>, and your <span class="accent">ideal reader</span>. A book planned around one reader and one message is a book you can actually finish.</p>` },

  {t:'stage2', cls:"panel", html:`<div class="step">Stage two</div><h2>Idea development</h2><p>We turn the plan into an outline, and decide what the book has to do for your reader and for you. The outline is the map that makes the messy middle survivable, because you always know the next right scene or chapter.</p>` },

  {t:'stage3', cls:"", html:`<div class="step">Stage three</div><h2>Writing support and mindset</h2><p>This is where most coaching stops and most books stall. We coach the craft and the confidence together, because the doubt is part of the job. You write, you keep writing, and the voice that says you cannot gets quieter every session.</p>` },

  {t:'stage4', cls:"panel", html:`<div class="step">Stage four</div><h2>Review and editing</h2><p>Content editing for the big picture, line editing for the sentences, and a real proofread. Your draft becomes a manuscript a reader will trust and a publisher will take seriously.</p>` },

  {t:'stage5', cls:"", html:`<div class="step">Stage five</div><h2>Publish, for real</h2><p>This is the part a writing course cannot give you. I am a coach and a publisher. We take your manuscript to a professional finish, through traditional publishing with Morgan James or a self published path, with formatting, cover, and a plan to actually sell it.</p>` },

  {t:'engine', cls:"divider", html:`<div class="kick">The engine</div><h1>Writing Ragers: the room that keeps you writing</h1><p style="color:var(--teal)">Five live write ins every week. You set a written intention and a date. I check in with you every month. A finished book is the natural result of showing up, so we make showing up easy.</p>` },

  {t:'part3', cls:"divider", html:`<div class="kick">Part Three</div><h1>Where your book goes from here</h1>` },

  {t:'arc', cls:"", html:`<div class="kick">The arc</div><h2>From a line in your notes to a book on a shelf.</h2><div class="list"><div class="row"><span class="n">&bull;</span><div>A plan you believe in, built around one reader and one message.</div></div><div class="row"><span class="n">&bull;</span><div>A weekly rhythm that moves the draft forward whether or not you feel inspired.</div></div><div class="row"><span class="n">&bull;</span><div>A finished, edited manuscript, then a real published book with your name on it.</div></div></div>` },

  {t:'whyme', cls:"panel", html:`<div class="kick">Why me</div><h2>A coach who is also your publisher.</h2><div class="stats"><div class="stat"><div class="num">160+</div><div class="lab">authors coached</div></div><div class="stat"><div class="num">150+</div><div class="lab">books published</div></div><div class="stat"><div class="num">2016</div><div class="lab">publishing since</div></div></div><p class="sub">Founder of KWE Publishing, co host of The Sociable Scribe, and a Morgan James partner. I have taken authors the whole way, not just to the last page of the draft, but to a book people can buy.</p>` },

  {t:'decision', cls:"", html:`<div class="kick">The one decision</div><h2 class="big">You do not have to write it alone, and you do not have to figure out publishing on your own.</h2><p>Pick a plan, join the room, and let the finished book be the natural result of showing up.</p>` },

  {t:'cta', cls:"cta", html:`<div class="kick">Your next step</div><h2>Let's map out your book.</h2><p>Book a call with me and we will look at your idea, where the draft is stuck, and the fastest honest path to a finished, published book. Or come write with us in Writing Ragers this week.</p><a class="btn" href="https://kwepub.com">Schedule a call with Kim</a><div class="disc">Educational content only. No income, publishing outcome, sales figure, or result is guaranteed; every author's results vary with their work, their market, and their book. Timelines and stages are illustrative of the KWE Publishing coaching process.</div>` }
];
const deck = document.getElementById('deck');
S.forEach(s => {
  const el = document.createElement('section');
  el.className = 'slide ' + (s.cls || '');
  el.innerHTML = s.html;
  deck.appendChild(el);
});
</script>
</body>
</html>
