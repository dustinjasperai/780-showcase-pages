<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>ABA, Redefined · Sarah Burby, Mind Body Behavior</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f5f1eb; --panel:#ece5d8; --rule:#e0d4bf;
    --acc:#a36c29; --ink:#1a1712; --body:#4a4238; --dim:#8f8371; --cream:#faf7f1;
  }
  html,body{height:100%}
  body{background:#e9e1d3;font-family:'Inter',-apple-system,sans-serif;color:var(--body);overflow:hidden;-webkit-font-smoothing:antialiased}
  .stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#e9e1d3}
  .deck{position:relative;width:100vw;height:56.25vw;max-height:100vh;max-width:177.78vh;background:var(--bg);overflow:hidden}
  .slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .5s ease;
    display:flex;flex-direction:column;justify-content:center;padding:7.4% 8.6%;background:var(--bg)}
  .slide.active{opacity:1;visibility:visible}
  .kicker{font-family:'Inter',sans-serif;font-size:1.0vw;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--acc);margin-bottom:2.6vh}
  h1{font-family:'DM Serif Display',Georgia,serif;font-weight:400;color:var(--ink);line-height:1.12;letter-spacing:.004em}
  .t-title h1{font-size:5.0vw;max-width:92%}
  .t-normal h1{font-size:3.3vw;max-width:90%}
  .t-normal .body{font-family:'Inter',sans-serif;font-size:1.42vw;color:var(--body);margin-top:3.0vh;max-width:74%;line-height:1.62;font-weight:400}
  .sub{font-family:'DM Serif Display',serif;font-size:2.0vw;color:var(--acc);margin-top:3.4vh;max-width:82%;line-height:1.4;font-weight:400}
  .t-section{align-items:flex-start;background:var(--panel)}
  .t-section .idx{font-family:'Inter',sans-serif;font-size:1.1vw;font-weight:600;color:var(--acc);margin-bottom:2.2vh;letter-spacing:.24em;text-transform:uppercase}
  .t-section h1{font-size:4.8vw;max-width:92%}
  .t-section .rule{width:15vw;height:2px;background:linear-gradient(90deg,var(--acc),transparent);margin-top:3.6vh}
  .t-dark{background:radial-gradient(130% 130% at 50% 12%,#3a2c1e 0%,#221a12 100%);align-items:center;text-align:center}
  .t-dark h1{font-size:3.8vw;max-width:86%;color:var(--cream)}
  .t-cta{background:radial-gradient(130% 130% at 50% 100%,#3a2c1e 0%,#221a12 100%);align-items:center;text-align:center}
  .t-cta h1{font-size:3.9vw;max-width:84%;color:var(--cream)}
  .t-cta .body{font-family:'Inter',sans-serif;color:#e9ddca;font-size:1.42vw;margin-top:3vh;max-width:70%;line-height:1.6}
  .chips{display:flex;gap:1.1vw;margin-top:4.2vh;flex-wrap:wrap;justify-content:center}
  .chip{border:1.5px solid var(--acc);color:var(--cream);border-radius:100px;padding:1.4vh 1.9vw;font-size:1.15vw;font-weight:500}
  .disc{position:absolute;left:8.6%;right:8.6%;bottom:4.4vh;font-size:.86vw;color:var(--dim);text-align:center;line-height:1.45}
  .t-title .disc,.t-normal .disc{text-align:left;color:var(--dim)}
  .vf-motif{position:absolute;pointer-events:none}
  .title-vf{right:7.5%;bottom:8%;width:15vw;opacity:.9}
  .corner-vf{right:6.5%;bottom:7.5%;width:8vw;opacity:.5}
  .brandline{font-family:'Inter',sans-serif;font-size:1.15vw;color:var(--body);margin-top:3.8vh;font-weight:500;letter-spacing:.05em}
  .brandline b{color:var(--acc);font-weight:600}
  .hud{position:fixed;left:0;right:0;bottom:0;height:4px;background:rgba(26,23,18,.08);z-index:20}
  .hud > i{display:block;height:100%;background:var(--acc);width:0;transition:width .35s ease}
  .count{position:fixed;bottom:14px;right:18px;font-size:12px;letter-spacing:.16em;color:var(--dim);z-index:20;font-weight:500}
  .brand-foot{position:fixed;bottom:12px;left:18px;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);z-index:20;font-weight:600}
  .nav{position:fixed;top:0;bottom:0;width:22%;z-index:15;cursor:pointer}
  .nav.prev{left:0}.nav.next{right:0;width:78%}
  .hint{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--dim);z-index:20;letter-spacing:.1em;transition:opacity .5s}
  @media(max-width:640px){
    .kicker{font-size:2.6vw}.t-title h1{font-size:8.4vw}.t-normal h1{font-size:5.8vw}.t-normal .body{font-size:3vw}
    .sub{font-size:4vw}.t-section h1{font-size:7.6vw}.t-dark h1{font-size:6.2vw}
    .t-cta h1{font-size:7.0vw}.chip{font-size:2.8vw}.t-cta .body{font-size:3vw}
  }
</style>
</head>
<body>
<div class="stage"><div class="deck" id="deck"></div></div>
<div class="nav prev" id="prev"></div>
<div class="nav next" id="next"></div>
<div class="hud"><i id="bar"></i></div>
<div class="count" id="count">01 / 19</div>
<div class="brand-foot">Mind Body Behavior</div>
<div class="hint" id="hint">&rarr; click or arrow keys</div>

<!-- mind / body / behavior triad motif: three overlapping circles drawn in bronze -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="vf" viewBox="0 0 120 120">
  <g fill="none" stroke="#a36c29" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="60" cy="42" r="26" opacity="0.9"/>
    <circle cx="44" cy="72" r="26" opacity="0.7"/>
    <circle cx="76" cy="72" r="26" opacity="0.7"/>
  </g>
</symbol>
</defs></svg>

<script>
const S = [
 {t:'title',title:'ABA, Redefined',sub:'How behavior analysts build a credentialed health and wellness coaching career, using the science they already have.',brand:true,vf:'title'},
 {t:'normal',k:'Who this is for',title:'You trained in the science of behavior change. Right now you only get to use it one way.',body:'You are a BCBA who is genuinely good at what you do. But the field funnels almost everyone into the same lane: clinic hours, autism and developmental disabilities, insurance authorizations, and a caseload that only grows. The skill set is broad. The setting you are allowed to use it in is narrow.'},
 {t:'dark',title:'A ceiling is not the same as a calling. Most BCBAs hit the first and mistake it for the second.'},

 {t:'section',idx:'Part One',title:'Why the Clinic Feels Like the Only Door'},
 {t:'normal',k:'One setting, one story',title:'The whole field points you at the same room.',body:'Graduate programs, supervision, and job postings all assume clinic-based autism work. It is meaningful work, and it is also the only path most BCBAs are ever shown. So burnout reads as a personal failing instead of what it usually is, which is a talented clinician stuck in a single application of a very general science.'},
 {t:'normal',k:'The credential trap',title:'Leaving feels like throwing the credential away.',body:'The instinct is to start over in something unrelated. But behavior analysis is not tied to autism, it is tied to behavior, and human health is behavior change at its core. The problem was never your training. It was that no one built a legitimate, board-recognized bridge from it into anything else.'},
 {t:'dark',title:'You do not need a different skill set. You need a second place to use the one you have.'},

 {t:'section',idx:'Part Two',title:'The Bridge from Behavior Analyst to Health Coach'},
 {t:'normal',k:'The science already fits',title:'Health coaching is behavior change wearing different clothes.',body:'The tools you use every day, from functional assessment to shaping, reinforcement, and stimulus control, are exactly what move a client toward better habits and follow-through. Add Relational Frame Theory and Acceptance and Commitment work, and you have a coaching method grounded in real science, not willpower slogans.'},
 {t:'normal',k:'The credential, not just a course',title:'A board-recognized path, built for your background.',body:'This is the first and only National Board for Health and Wellness Coaching approved program made specifically for people with an ABA background. You earn 32 BCBA continuing education units, including supervision and ethics, and you finish eligible to sit the NBHWC board exam. It is a path built for your background, not another course that leads nowhere.'},
 {t:'normal',k:'Hours and a practice, not just a title',title:'Accrue supervision outside autism, then build the business around it.',body:'A dedicated supervision path lets candidates gather fieldwork hours in health and wellness rather than autism and developmental disabilities. And the Amplify framework is the exact system used to build Mind Body Behavior, so the credential becomes a practice with clients, not just a line on a resume.'},
 {t:'dark',title:'A credential opens the door. A method and a practice are what let you walk through it.'},

 {t:'section',idx:'Part Three',title:'What Changes When You Redefine the Work'},
 {t:'normal',k:'The practitioner this builds',title:'Same science, a wider life, and clients who chose you.',body:'You keep the identity you worked years to earn, and you get to apply it to people who are actively coming to you for change. The week stops being dictated by authorizations and caseload caps. You still practice behavior analysis. You just get to do it on your own terms, in a setting you designed.'},
 {t:'dark',title:'The goal was never to leave behavior analysis. It was to stop letting one setting define it.'},
 {t:'normal',k:'Why Sarah Burby',title:'A BCBA who built the bridge she could not find.',body:'Sarah is a BCBA and a National Board Certified Health and Wellness Coach, a Certified Intuitive Eating Counselor, and the founder of Mind Body Behavior. She built the first NBHWC-approved coaching program for ABA backgrounds and has guided more than 70 behavior analysts through it. This masterclass is the method behind that work.'},

 {t:'section',idx:'Your Next Step',title:'Use the Science You Already Have'},
 {t:'normal',k:'Keep going with Mind Body Behavior',title:'From the free training to the credential to a practice of your own.',body:'The path is built in stages: a free introduction to applying ABA to health coaching, the NBHWC-approved certificate with its 32 CEUs, and Amplify for building the business once the credential is in hand. You can start where you are today.'},
 {t:'cta',title:'Ready to redefine what your BCBA can do?',body:'Take the next step with Mind Body Behavior.',chips:['Start with the free training','Explore the certification'],disc:'Educational content for behavior analysts and allied professionals. Nothing here is clinical, medical, or income advice, and no specific certification, career, or earnings outcome is guaranteed. Results vary by individual, effort, and market.'},
];

const deck=document.getElementById('deck');
function vf(kind){return `<svg class="vf-motif ${kind==='title'?'title-vf':'corner-vf'}"><use href="#vf"/></svg>`}
S.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='slide t-'+s.t;
  let h='';
  if(s.k) h+=`<div class="kicker">${s.k}</div>`;
  if(s.t==='section'){ h=`<div class="idx">${s.idx}</div><h1>${s.title}</h1><div class="rule"></div>`; }
  else {
    h+=`<h1>${s.title}</h1>`;
    if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
    if(s.body) h+=`<div class="body">${s.body}</div>`;
    if(s.brand) h+=`<div class="brandline">Mind Body <b>Behavior</b> · Sarah Burby</div>`;
    if(s.chips) h+=`<div class="chips">`+s.chips.map(c=>`<div class="chip">${c}</div>`).join('')+`</div>`;
  }
  if(s.vf) h+=vf(s.vf);
  else if(s.t==='title') h+=vf('title');
  if(s.disc) h+=`<div class="disc">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});

const slides=[...document.querySelectorAll('.slide')];
let cur=0;const bar=document.getElementById('bar');const count=document.getElementById('count');const hint=document.getElementById('hint');
function pad(n){return String(n).padStart(2,'0')}
function go(n){cur=Math.max(0,Math.min(slides.length-1,n));
  slides.forEach((s,i)=>s.classList.toggle('active',i===cur));
  bar.style.width=((cur+1)/slides.length*100)+'%';
  count.textContent=pad(cur+1)+' / '+pad(slides.length);
  if(cur>0)hint.style.opacity=0;}
document.getElementById('next').onclick=()=>go(cur+1);
document.getElementById('prev').onclick=()=>go(cur-1);
document.addEventListener('keydown',e=>{
  if(['ArrowRight','ArrowDown',' ','PageDown'].includes(e.key)){e.preventDefault();go(cur+1)}
  if(['ArrowLeft','ArrowUp','PageUp'].includes(e.key)){e.preventDefault();go(cur-1)}
  if(e.key==='Home')go(0); if(e.key==='End')go(slides.length-1);
});
go(0);
</script>
</body>
</html>
