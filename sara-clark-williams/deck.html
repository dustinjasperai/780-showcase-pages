<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Find Your Sweet Spot — a masterclass with Sara Clark-Williams</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Albert+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fbf9fa;        /* warm near-white, site is light-scheme */
    --panel:#ffffff;     /* site body bg */
    --ink:#003a4e;       /* site dominant H1 color (32 uses) */
    --muted:#4d6570;     /* desaturated tint of the ink */
    --rule:#e4dde0;      /* faint warm rule */
    --accent:#ed1d7d;    /* Fab Fempreneurs signature pink (ranked hex, 15 uses) */
    --head:'Playfair Display', Georgia, serif;
    --body:'Albert Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:960px;margin:0 auto;padding:32px 20px 80px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:56px 56px 52px;margin:0 0 26px;min-height:520px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:38px;line-height:1.1;margin-bottom:6px}
  p{font-size:20px;line-height:1.5;color:var(--muted);max-width:60ch;margin-top:14px}
  .lead{font-size:23px;color:var(--ink)}
  .big{font-size:58px}
  .num{font-family:var(--head);font-size:15px;color:var(--muted);position:absolute;top:22px;right:26px;letter-spacing:.1em}
  .tag{font-family:var(--body);font-size:14px;color:var(--muted);position:absolute;top:22px;left:26px;letter-spacing:.12em;text-transform:uppercase}
  ul{margin-top:20px;list-style:none}
  li{font-size:20px;line-height:1.5;color:var(--ink);padding-left:26px;position:relative;margin-bottom:12px}
  li:before{content:"";position:absolute;left:0;top:11px;width:9px;height:9px;border-radius:50%;background:var(--accent)}
  .quad{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:26px}
  .q{border:1px solid var(--rule);border-radius:12px;padding:22px}
  .q .qh{font-family:var(--head);font-size:22px;color:var(--ink)}
  .q .qs{font-size:16px;color:var(--muted);margin-top:6px;line-height:1.45}
  .q .qn{font-family:var(--body);font-weight:700;color:var(--accent);font-size:14px;letter-spacing:.1em}
  .rule{height:3px;width:64px;background:var(--accent);border-radius:2px;margin:22px 0 0}
  .center{align-items:center;text-align:center}
  .center p{margin-left:auto;margin-right:auto}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:64ch;line-height:1.5}
  .cta-line{font-family:var(--head);font-size:30px;color:var(--ink);margin-top:8px}
  .foot{font-size:15px;color:var(--muted);margin-top:20px;letter-spacing:.02em}
  .pink{color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
/* Masterclass deck for Sara Clark-Williams. THE COACH's masterclass to HER audience.
   No paid-ads content, no sender, no external CTA. Built on her Fab 4 Sweet Spot IP. */
const S = [
  {t:'title', kick:'A free live masterclass for women entrepreneurs',
    h:'Find Your <span class="pink">Sweet Spot</span>',
    body:'The greatest results, with the greatest ease. How to grow your business in the way that fits who you are, without the guesswork and the burnout.',
    foot:'With Sara Clark-Williams, Fab Fempreneurs' },

  {t:'content', num:'02', kick:'Who this is for', h:'You are already doing the work.',
    body:'You show up. You serve your clients well. You have tried the courses, the tactics, the new offer, the new platform. And still there is a quiet question at the end of a busy week: did any of that actually move me forward?',
    body2:'This hour is for the woman who is tired of guessing, whether you are in your first couple of years or years in and ready for the next level.' },

  {t:'content', num:'03', kick:'The trap', h:'Busy is not the same as growing.',
    body:'Most women entrepreneurs do not have a work-harder problem. They have a too-many-directions problem. Effort scatters across five priorities, energy drains, and the results never match the hours.',
    lead:'More hustle will not fix a business that is out of alignment.' },

  {t:'hero', num:'04', h:'What if growth was supposed to feel like <span class="pink">ease</span>?',
    body:'Not easy. Ease. The difference between forcing a business that fights you and building one that fits you.' },

  {t:'content', tag:'Part One', num:'05', h:'The real problem is alignment.',
    body:'When your strategy, your purpose, your weekly habits, and your systems are all pulling in different directions, everything feels heavy. You can feel it as overwhelm, as procrastination, as a plateau you cannot explain.',
    body2:'The fix is not another tactic. It is finding the point where all four line up. That point is your Sweet Spot.' },

  {t:'framework', tag:'Part Two', num:'06', kick:'The framework', h:'The Fab 4 Sweet Spot.',
    body:'Four dimensions decide whether your growth feels hard or easy. When one is off, the whole business drags. When all four align, you are in your Sweet Spot.',
    quad:[
      { n:'01', qh:'Head', qs:'The right strategy for where you actually are.' },
      { n:'02', qh:'Heart', qs:'Growth aligned to who you are and the life you want.' },
      { n:'03', qh:'Habits', qs:'The few things you actually do each week.' },
      { n:'04', qh:'Hub', qs:'The systems and structure that hold it all together.' }
    ] },

  {t:'list', num:'07', kick:'Dimension one', h:'<span class="pink">Head.</span> The right strategy.',
    body:'Not the strategy that worked for a coach with a different business. The one that fits your stage, your market, and your capacity right now. Most scattering starts here, chasing a plan built for someone else.',
    bullets:['Where you truly are, honestly named','The one strategic move that matters most this quarter','Permission to stop doing the rest'] },

  {t:'list', num:'08', kick:'Dimension two', h:'<span class="pink">Heart.</span> Aligned to who you are.',
    body:'A business that ignores who you are will always feel like a fight. When your growth is built around your values and the life you actually want, motivation stops being something you have to manufacture.',
    bullets:['The impact you want to be known for','The way of working that keeps you well','The offers you are genuinely proud to sell'] },

  {t:'list', num:'09', kick:'Dimension three', h:'<span class="pink">Habits.</span> What you actually do.',
    body:'Strategy on paper changes nothing. Growth lives in the handful of things you repeat every week. Get those few right and protect them, and the results compound quietly.',
    bullets:['The weekly rhythm that moves revenue','What to stop, so the important work has room','How to keep going when motivation dips'] },

  {t:'list', num:'10', kick:'Dimension four', h:'<span class="pink">Hub.</span> The systems that hold it.',
    body:'Your Hub is the structure underneath the business: how you attract, serve, and follow up without it all living in your head. This is what lets you grow without simply adding more hours to your week.',
    bullets:['The simple systems that remove daily friction','What to keep, what to delegate, what to drop','Room to scale without burning out'] },

  {t:'hero', num:'11', h:'Four aligned. One <span class="pink">Sweet Spot</span>.',
    body:'When Head, Heart, Habits, and Hub point the same way, you stop guessing. You know the next move, and it feels light, because it fits.' },

  {t:'content', tag:'Part Three', num:'12', h:'If you are a builder.',
    body:'In your first few years, the win is not doing more. It is choosing the ONE strategy, the ONE offer, and the ONE rhythm that fit who you are, so your first real traction arrives with clarity instead of chaos.',
    lead:'Your next step is to name your Sweet Spot and protect it.' },

  {t:'content', num:'13', h:'If you are an upgrader.',
    body:'You have a solid foundation and you are ready to scale. The trap now is adding more, more offers, more platforms, more noise. The upgrade is to consolidate into your Sweet Spot so revenue grows while your week gets simpler.',
    lead:'Your next step is to subtract, then scale.' },

  {t:'list', num:'14', kick:'A week in your Sweet Spot', h:'This is what alignment feels like.',
    bullets:[
      'You start the week knowing the few things that matter, and you do them',
      'Marketing feels like sharing what you believe, not shouting into the void',
      'Clients arrive who are a genuine fit, because your offer is clear',
      'You end the week with energy left over for your life'] },

  {t:'content', num:'15', kick:'Why me', h:'I built this the hard way first.',
    body:'I left a corporate role in organizational development, grew two profitable businesses, and spent years watching brilliant women scatter their effort and burn out. The Fab 4 Sweet Spot is the pattern I found underneath the women who grew with ease instead.',
    body2:'I have used it with women in their first year and women scaling past their first solid foundation. It travels, because it starts with who you are.' },

  {t:'hero', num:'16', h:'Your business gets to fit <span class="pink">you</span>.',
    body:'Greatest results, greatest ease. That is the Sweet Spot, and it is closer than the next tactic you were about to try.' },

  {t:'cta', num:'17', kick:'Your next step', h:"Let's find your Sweet Spot together.",
    ctaLine:'Book a consultation with Sara.',
    body:'We will look at your Head, Heart, Habits, and Hub, name where you are out of alignment, and map the one next move that grows your business with ease.',
    disc:'This masterclass is for education only. It shares a framework and general strategy, not individualized business, financial, or legal advice. No specific income or results are promised or guaranteed; every business is different and outcomes vary.',
    foot:'Fab Fempreneurs · Sara Clark-Williams' }
];

function render(){
  const deck = document.getElementById('deck');
  deck.innerHTML = S.map(s => {
    const num = s.num ? `<span class="num">${s.num}</span>` : '';
    const tag = s.tag ? `<span class="tag">${s.tag}</span>` : '';
    const kick = s.kick ? `<div class="kick">${s.kick}</div>` : '';
    const foot = s.foot ? `<div class="foot">${s.foot}</div>` : '';
    if (s.t === 'title')
      return `<section class="slide center">${kick}<h1>${s.h}</h1><p class="lead">${s.body}</p><div class="rule"></div>${foot}</section>`;
    if (s.t === 'hero')
      return `<section class="slide center">${num}<h1 class="big">${s.h}</h1><p>${s.body||''}</p></section>`;
    if (s.t === 'framework'){
      const q = s.quad.map(x=>`<div class="q"><div class="qn">${x.n}</div><div class="qh">${x.qh}</div><div class="qs">${x.qs}</div></div>`).join('');
      return `<section class="slide">${tag}${num}${kick}<h2>${s.h}</h2><p>${s.body}</p><div class="quad">${q}</div></section>`;
    }
    if (s.t === 'list'){
      const b = (s.bullets||[]).map(x=>`<li>${x}</li>`).join('');
      const body = s.body ? `<p>${s.body}</p>` : '';
      return `<section class="slide">${tag}${num}${kick}<h2>${s.h}</h2>${body}<ul>${b}</ul></section>`;
    }
    if (s.t === 'cta')
      return `<section class="slide center">${num}${kick}<h2>${s.h}</h2><div class="cta-line">${s.ctaLine}</div><p>${s.body}</p><p class="disc">${s.disc}</p>${foot}</section>`;
    // default: content
    const body2 = s.body2 ? `<p>${s.body2}</p>` : '';
    const lead = s.lead ? `<p class="lead pink">${s.lead}</p>` : '';
    return `<section class="slide">${tag}${num}${kick}<h2>${s.h}</h2><p>${s.body||''}</p>${body2}${lead}</section>`;
  }).join('');
}
render();
</script>
</body>
</html>
