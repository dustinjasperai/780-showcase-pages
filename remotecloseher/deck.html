<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Feminine Close - A Remote CloseHer Masterclass</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fdfbf9;          /* warm off-white ground <- oklch(0.99 0.006 20) */
    --panel:#f4dcdc;       /* soft blush <- oklch(0.9 0.028 15), dominant surface */
    --ink:#2c211f;         /* deep espresso <- oklch(0.22 0.02 20) */
    --rule:#c9b7b3;        /* muted warm rule */
    --accent:#6e1322;      /* deep crimson/wine <- oklch(0.315 0.125 22), brand links/buttons */
    --rose:#a83048;        /* rich rose <- oklch(0.52 0.17 15) */
    --serif:'Playfair Display',Georgia,serif;
    --sans:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto}
  .slide{
    min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:8vh 7vw;position:relative;border-bottom:1px solid var(--rule);
  }
  .kicker{font-family:var(--sans);font-weight:600;letter-spacing:.22em;text-transform:uppercase;
    font-size:.72rem;color:var(--accent);margin-bottom:1.6rem}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,6vw,4.4rem);line-height:1.02;
    letter-spacing:-.01em;margin-bottom:1.4rem}
  h2{font-family:var(--serif);font-weight:600;font-size:clamp(1.9rem,4.4vw,3rem);line-height:1.08;margin-bottom:1.2rem}
  h3{font-family:var(--serif);font-weight:600;font-size:clamp(1.3rem,2.6vw,1.7rem);margin-bottom:.6rem}
  p{font-size:clamp(1.02rem,1.5vw,1.22rem);line-height:1.6;max-width:44ch;color:var(--ink)}
  p.lead{font-size:clamp(1.15rem,1.9vw,1.4rem);max-width:40ch}
  .muted{color:#6b5a56}
  .em{color:var(--accent);font-style:italic}
  .num{font-family:var(--serif);font-size:clamp(3rem,9vw,6rem);color:var(--accent);line-height:1;font-weight:700}
  ul{list-style:none;margin-top:1rem;max-width:46ch}
  li{position:relative;padding-left:1.7rem;margin-bottom:1rem;font-size:clamp(1rem,1.5vw,1.18rem);line-height:1.5}
  li:before{content:"";position:absolute;left:0;top:.55em;width:.6rem;height:.6rem;background:var(--accent);border-radius:50%}
  li b{font-weight:600}
  .panel{background:var(--panel);border-radius:14px;padding:2.2rem 2rem;margin-top:1.4rem;max-width:46ch}
  .title-slide{background:linear-gradient(160deg,var(--panel) 0%,var(--bg) 70%)}
  .title-slide h1{max-width:16ch}
  .cta{background:var(--accent);color:#fff}
  .cta .kicker{color:#f4dcdc}
  .cta h2{color:#fff}
  .cta p{color:#f7e9e9}
  .cta .btn{display:inline-block;margin-top:1.8rem;background:#fff;color:var(--accent);
    font-family:var(--sans);font-weight:600;padding:.9rem 1.8rem;border-radius:999px;font-size:1.05rem}
  .step{display:flex;align-items:baseline;gap:1.2rem}
  .step .num{font-size:clamp(2.2rem,6vw,3.4rem)}
  .disclaimer{font-size:.78rem;color:#f0d7d4;margin-top:2rem;max-width:52ch;line-height:1.5}
  .pageno{position:absolute;bottom:2.4rem;right:7vw;font-size:.72rem;letter-spacing:.15em;color:var(--rule)}
  .brandmark{position:absolute;top:2.4rem;left:7vw;font-family:var(--serif);font-style:italic;font-size:.95rem;color:var(--accent)}
  @media(max-width:640px){.slide{padding:7vh 8vw}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
 {t:'title',kicker:'A Remote CloseHer Masterclass with Naya Nicole',h1:'The Feminine Close',lead:'How women are making masculine money on the phone, without a script, a degree, or a single day of sales experience.'},

 {t:'for',kicker:'Who this is for',h2:'You were never bad at sales. You were handed the wrong idea of it.',p:'This is for the ambitious woman who wants real income from her laptop but has quietly counted herself out of "sales" because every version she has seen looked pushy, sleazy, or like it belonged to someone else.'},

 {t:'trap',kicker:'The trap',h2:'The story you have been told',list:['Sales means talking someone into something they do not want.','You need to be aggressive, thick-skinned, or a "natural."','You need a degree, a resume, or years of experience first.','So the highest-paid remote skill in the world stays off your list.']},

 {t:'reframe',kicker:'The reframe',h2:'Freezing on a call is not a skill problem. It is an identity problem.',p:'Most women who try closing do not fail because they forgot the script. They fail because some part of them does not yet believe they are allowed to ask for the money. That is fixable, and it is where we start.'},

 {t:'body',kicker:'The demand',h2:'Every online coach and course is desperate for one thing',p:'Someone calm and skilled enough to have the money conversation for them. That job is remote, it pays on performance, and there are far more offers than there are people who can actually close them. The door is wide open. Most women just were never told it was for them.'},

 {t:'part',kicker:'Part One',num:'01',h2:'Why scripts break the moment a real person answers',p:'A script assumes the call goes one way. Real buyers do not. The second someone says something the script did not plan for, a scripted closer panics and a real one gets curious.'},

 {t:'body',kicker:'Part One',h3:'Closing is a psychology game, not a memory game',p:'A high-ticket buyer is not deciding whether your offer is good. They are deciding whether they trust themselves to follow through. When you understand what is actually happening in that decision, you stop performing and start guiding.'},

 {t:'part',kicker:'Part Two - The Method',num:'02',h2:'The feminine, psychology-first way to close',p:'A framework built on psychology and neuroscience, not a script you repeat. Four pillars, in the order they actually matter.'},

 {t:'pillar',kicker:'Pillar one',num:'i',h3:'Sales identity',p:'Before the words, the self-image. We build the version of you who is calm asking for thousands of dollars, because she knows the offer is worth it and so is she.'},

 {t:'pillar',kicker:'Pillar two',num:'ii',h3:'The psychology of the decision',p:'What is really happening in a buyer\'s mind: the fears, the stories, the moment of hesitation. Read it, and you never have to push. You just have to understand.'},

 {t:'pillar',kicker:'Pillar three',num:'iii',h3:'Emotional regulation on the call',p:'The nervous system runs the call. When yours is steady, theirs settles too. We train the composure that keeps you present instead of leaking anxiety through the phone.'},

 {t:'pillar',kicker:'Pillar four',num:'iv',h3:'Listening as the close',p:'The most feminine advantage in sales is also the most underrated: real listening. The person who feels most understood is the person who says yes. This is how you make masculine money in a way that feels like you.'},

 {t:'part',kicker:'Part Three',num:'03',h2:'What it actually looks like week to week',p:'Not theory. A repeatable practice loop that turns a beginner into a paid closer.'},

 {t:'loop',kicker:'The practice loop',h3:'How the skill compounds',list:['<b>Learn the mechanic</b> - the psychology behind each stage of the call.','<b>Take live calls</b> - you start closing while you train, not after.','<b>Review the recording</b> - direct feedback on what to change next time.','<b>Repeat</b> - each call makes the next one easier, and better paid.']},

 {t:'body',kicker:'The outcome',h2:'A real skill, not a lottery ticket',p:'Remote closing pays for the value you create, from anywhere, on your schedule. It is learnable, it is portable, and once you have it, no one can take it back. That is what we are building.'},

 {t:'body',kicker:'The honest part',h2:'What this is not',list:['Not a get-rich-quick scheme, and not passive.','Not a script you memorize and pray works.','Not pushy, and not something you have to become someone else to do.','It is a skill you practice into, on real calls, with real feedback.']},

 {t:'body',kicker:'The cost of waiting',h2:'The women already in the feed had no more permission than you',p:'The academies running ads right now are enrolling beginners every week. The only difference between them and you is that they decided the skill was learnable and started. The market is not going to get less crowded by waiting.'},

 {t:'whyme',kicker:'Why me',h2:'I built this the same way I am handing it to you',p:'I am Naya Nicole. I went from no sales background to consistent high-ticket months, and then I got obsessed with how to teach it to women the way I wish someone had taught me: through psychology and identity, not scripts and pressure. That is Remote CloseHer.'},

 {t:'body',kicker:'The room you join',h3:'You are not doing this alone',list:['Direct coaching from me and my team.','Recorded-call review with real feedback.','Placement support into vetted high-ticket roles.','A community of women learning the exact same skill.']},

 {t:'cta',kicker:'Your next step',h2:'If this is the way you always suspected it could be done',p:'Then let\'s talk. Book a call or apply to work with me, and we will map out whether Remote CloseHer is the right fit for where you want to go.',btn:'Apply to work with Naya',disclaimer:'This masterclass is for educational purposes. Remote CloseHer does not promise or guarantee income or financial results. Outcomes depend on many factors unique to you, including your effort, consistency, and the market. Nothing here is a guarantee of earnings.'}
];

const deck=document.getElementById('deck');
S.forEach((s,i)=>{
  const el=document.createElement('section');
  el.className='slide '+(s.t==='title'?'title-slide':'')+(s.t==='cta'?'cta':'');
  let h='';
  h+='<div class="brandmark">Remote CloseHer</div>';
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.num && (s.t==='pillar')) h+=`<div class="step"><span class="num">${s.num}</span><div><h3>${s.h3||''}</h3>${s.p?`<p>${s.p}</p>`:''}</div></div>`;
  else {
    if(s.num) h+=`<div class="num">${s.num}</div>`;
    if(s.h1) h+=`<h1>${s.h1}</h1>`;
    if(s.h2) h+=`<h2>${s.h2}</h2>`;
    if(s.h3) h+=`<h3>${s.h3}</h3>`;
    if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
    if(s.p) h+=`<p>${s.p}</p>`;
  }
  if(s.list){h+='<ul>';s.list.forEach(x=>h+=`<li>${x}</li>`);h+='</ul>';}
  if(s.btn) h+=`<span class="btn">${s.btn}</span>`;
  if(s.disclaimer) h+=`<div class="disclaimer">${s.disclaimer}</div>`;
  h+=`<div class="pageno">${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML=h;
  deck.appendChild(el);
});
</script>
</body>
</html>
