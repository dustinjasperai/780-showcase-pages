<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lead Yourself First | IONIS Whole Person Leadership Coaching</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Raleway:wght@500;600;700;800&family=Lora:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f6f5f1; --panel:#ecebe4; --rule:#cfd4cb; --ink:#1d2721;
    --muted:#55615a; --accent:#3f7652; --dark:#1d2721;
    --display:'Raleway',system-ui,sans-serif; --body:'Lora',Georgia,serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--panel);color:var(--ink);font-family:var(--body);line-height:1.55}
  .deck{max-width:960px;margin:0 auto;padding:28px 18px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:10px;
    padding:56px 56px;margin:0 0 22px;min-height:420px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::after{content:"";position:absolute;left:56px;right:56px;bottom:40px;height:2px;
    background:var(--accent);opacity:.25}
  .slide.dark{background:var(--dark);color:var(--bg);border-color:#2b3831}
  .slide.dark .eyebrow{color:#9fc3ac}
  .slide.dark::after{background:#9fc3ac;opacity:.4}
  .eyebrow{font-family:var(--display);font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:800;font-size:52px;line-height:1.05;
    letter-spacing:-.01em;margin-bottom:16px}
  h2{font-family:var(--display);font-weight:700;font-size:34px;line-height:1.12;
    margin-bottom:14px}
  .sub{font-size:21px;color:var(--muted);max-width:44ch}
  .slide.dark .sub{color:#c6d2cb}
  p.body{font-size:19px;max-width:54ch;margin-top:10px}
  ul{list-style:none;margin-top:14px;max-width:56ch}
  li{position:relative;padding-left:26px;margin-bottom:12px;font-size:19px}
  li::before{content:"";position:absolute;left:0;top:11px;width:12px;height:2px;
    background:var(--accent)}
  .pillar-no{font-family:var(--display);font-weight:800;font-size:15px;color:var(--accent);
    letter-spacing:.14em;margin-bottom:10px}
  .stat-row{display:flex;flex-wrap:wrap;gap:34px;margin-top:22px}
  .stat b{font-family:var(--display);font-weight:800;font-size:40px;color:var(--accent);
    display:block;line-height:1}
  .stat span{font-size:15px;color:var(--muted)}
  .brandmark{font-family:var(--display);font-weight:700;letter-spacing:.22em;font-size:13px;
    color:var(--muted);position:absolute;top:30px;left:56px}
  .disclaimer{font-size:13px;color:var(--muted);margin-top:26px;max-width:60ch;font-style:italic}
  .cta-line{font-family:var(--display);font-weight:700;font-size:22px;color:var(--accent);
    margin-top:18px}
  @media(max-width:640px){.slide{padding:38px 26px;min-height:360px}h1{font-size:36px}h2{font-size:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', brand:'IONIS WHOLE PERSON LEADERSHIP', eyebrow:'A live masterclass',
    h1:'Lead Yourself First',
    sub:'The whole-person path to steady leadership presence.' },

  {t:'who', eyebrow:'Who this is for',
    h2:'For leaders carrying real weight',
    bullets:['You hold significant responsibility and influence',
      'You are navigating complexity, pressure, or constant change',
      'You want to think, reflect, and be challenged, thoughtfully',
      'You value depth and practical outcomes over quick fixes'] },

  {t:'trap', eyebrow:'The trap',
    h2:'You have added every tactic. You still lose your edge under pressure.',
    body:'More frameworks, more feedback models, more productivity systems. They help on a calm day. They do not hold when the meeting turns, the quarter slips, or the hard conversation lands on you.' },

  {t:'reframe', dark:true, eyebrow:'The reframe',
    h1:'The bottleneck is not what you know. It is how you show up when it counts.',
    sub:'Presence is trainable. That is the whole opportunity.' },

  {t:'part', eyebrow:'Part One', h2:'Why strong leaders stall' },

  {t:'content', eyebrow:'The reactivity loop',
    h2:'Pressure finds the gap first',
    body:'Under load the nervous system reacts before the leader decides. Tone sharpens, listening narrows, certainty replaces curiosity. The team reads it in seconds, and trust quietly leaks before a single bad decision is ever made.' },

  {t:'content', eyebrow:'The real gap',
    h2:'You manage everything but yourself',
    body:'Most leaders have a system for the team, the roadmap, and the numbers, and nothing for their own state. Self-regulation is treated as a personality trait rather than the one skill that makes every other skill usable under pressure.' },

  {t:'part', eyebrow:'Part Two', h2:'The Whole-Person method' },

  {t:'pillar', no:'Pillar One', h2:'Practical leadership and organizational insight',
    body:'Grounded in 25 years inside product, operations, finance, and global strategy. The work stays connected to the real decisions and politics of your organization, not leadership in the abstract.' },

  {t:'pillar', no:'Pillar Two', h2:'Emotional intelligence and relational awareness',
    body:'Reading yourself and the room with accuracy: what you are feeling, what is driving it, and what the people in front of you actually need. This is where influence and trust are built or lost.' },

  {t:'pillar', no:'Pillar Three', h2:'Mindfulness-informed presence and self-regulation',
    body:'Mindfulness-based awareness, somatic and emotional attention, and Buddhist-informed perspectives on pressure and clarity. The practical skill of staying steady, so you choose your response instead of reacting.' },

  {t:'pillar', no:'Pillar Four', h2:'Real-world application inside your organization',
    body:'Everything is worked against the live situations you are actually in this week. Insight that never leaves the session does not change how you lead on Monday. This part makes sure it does.' },

  {t:'anchor', dark:true, eyebrow:'The spine',
    h1:'Lead yourself first.',
    sub:'This is not therapy, and it is not spiritual bypassing. It is leadership growth that starts with you, because real change does, and surface-level fixes do not.' },

  {t:'part', eyebrow:'Part Three', h2:'What steady leadership looks like' },

  {t:'content', eyebrow:'Presence under pressure',
    h2:'Clear when it is hard, not just when it is easy',
    body:'You stay in the conversation when it turns. You give the hard feedback without the charge. You make the call under uncertainty and people feel steadier for being near it. That steadiness is the deliverable.' },

  {t:'content', eyebrow:'The team effect',
    h2:'Your regulation sets the room',
    body:'Trust, accountability, and alignment do not come from a new policy. They come from a leader the team can read as consistent under pressure. Lead yourself first, and the culture around you starts to settle.' },

  {t:'why', eyebrow:'Why work with IONIS',
    h2:'Grounded, credible, practical',
    body:'Lou Ionis, ICF PCC-certified executive coach. The work blends real operating experience with a disciplined whole-person approach, so it holds up with senior leaders who have heard it all.',
    stats:[['25+','years leading inside organizations'],['3,312+','coaching hours'],['106+','organizations served']] },

  {t:'recap', eyebrow:'In one line',
    h2:'Steady the leader, and the leadership follows',
    body:'Practical insight, emotional and relational awareness, mindfulness-informed presence, applied to your real work. Lead yourself first.' },

  {t:'cta', eyebrow:'Next step',
    h1:'Start a conversation',
    sub:'If this is the kind of leadership you want to build, let us talk about what whole-person coaching would look like for you.',
    ctaline:'IONIS Whole Person Leadership Coaching  ·  ioniswpc.com',
    disclaimer:'This masterclass is offered for educational purposes. Leadership outcomes vary by individual and organization, and nothing here is a guarantee of any specific result.' }
];

const deck = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.dark ? ' dark' : '');
  let html = '';
  if (s.brand) html += '<div class="brandmark">'+s.brand+'</div>';
  if (s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if (s.no) html += '<div class="pillar-no">'+s.no+'</div>';
  if (s.h1) html += '<h1>'+s.h1+'</h1>';
  if (s.h2) html += '<h2>'+s.h2+'</h2>';
  if (s.sub) html += '<div class="sub">'+s.sub+'</div>';
  if (s.body) html += '<p class="body">'+s.body+'</p>';
  if (s.bullets){ html += '<ul>'; for (const b of s.bullets) html += '<li>'+b+'</li>'; html += '</ul>'; }
  if (s.stats){ html += '<div class="stat-row">'; for (const st of s.stats) html += '<div class="stat"><b>'+st[0]+'</b><span>'+st[1]+'</span></div>'; html += '</div>'; }
  if (s.ctaline) html += '<div class="cta-line">'+s.ctaline+'</div>';
  if (s.disclaimer) html += '<div class="disclaimer">'+s.disclaimer+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
}
</script>
</body>
</html>
