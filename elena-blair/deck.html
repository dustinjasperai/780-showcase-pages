<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Lifestyle Approach to Family Photography — Elena S Blair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f3ee;      /* warm off-white paper (brand-derived light scheme) */
    --panel:#efe8df;   /* warm neutral panel */
    --rule:#d9cdbf;    /* hairline rule */
    --ink:#101010;     /* measured dominant ink */
    --accent:#b08968;  /* warm clay accent, from her "creamy skin tones" brand language */
    --muted:#6f655b;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .deck{max-width:960px;margin:0 auto;padding:48px 20px 96px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:64px 56px;
    margin:0 0 28px;
    min-height:480px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .slide::after{content:"";position:absolute;left:56px;right:56px;bottom:22px;height:1px;background:var(--rule)}
  .foot{position:absolute;left:56px;bottom:26px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .page{position:absolute;right:56px;bottom:26px;font-size:12px;letter-spacing:.14em;color:var(--muted)}
  .eyebrow{font-size:13px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:60px;line-height:1.04;letter-spacing:-.01em}
  h2{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:42px;line-height:1.08;margin-bottom:20px}
  .lede{font-family:'Cormorant Garamond',serif;font-weight:400;font-size:27px;line-height:1.4;color:var(--ink);margin-top:20px;max-width:30ch}
  p{font-size:18px;line-height:1.6;color:var(--ink);max-width:62ch;margin-top:14px}
  .big{font-family:'Cormorant Garamond',serif;font-size:40px;font-style:italic;font-weight:400;line-height:1.25;max-width:24ch;color:var(--ink)}
  ul{margin:22px 0 0 0;list-style:none;max-width:60ch}
  li{font-size:19px;line-height:1.5;padding:14px 0 14px 28px;border-top:1px solid var(--rule);position:relative}
  li:first-child{border-top:none}
  li::before{content:"";position:absolute;left:0;top:22px;width:10px;height:10px;background:var(--accent);border-radius:1px}
  li b{font-weight:600}
  .num{font-family:'Cormorant Garamond',serif;font-size:22px;color:var(--accent);font-weight:600;margin-right:10px}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:4px;padding:28px 32px;margin-top:24px;max-width:60ch}
  .cta h1{font-size:52px}
  .disc{font-size:13px;line-height:1.55;color:var(--muted);margin-top:30px;max-width:64ch}
  .kicker{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:24px;color:var(--muted);margin-top:8px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const BRAND = "Elena S Blair";
const S = [
  {t:'title', eyebrow:'A Live Masterclass', h:'The Lifestyle Approach to Family Photography',
    lede:'How to photograph a family so the images actually feel like them, and build a business you love in the process.' },

  {t:'who', eyebrow:'Who this is for', h:'You already love the work.',
    body:'You are a family or newborn photographer who knows your camera. You care about the people in front of it. But your sessions still come out looking a little stiff, a little posed, a little like everyone else, and your pricing is stuck because of it.' },

  {t:'trap', eyebrow:'The trap', big:'You were taught to arrange people. The families you want are hungry to feel something.' },

  {t:'reframe', eyebrow:'The reframe', h:'Stop posing. Start directing for connection.',
    body:'A great family photograph is not a well-arranged group. It is a real moment you created the conditions for. Once you make that shift, the work stops looking generic, and it becomes something only you can make.' },

  {t:'part', eyebrow:'Part One', h:'Why the posed session keeps you stuck' },

  {t:'list', eyebrow:'The real problem', h:'Three things a stiff session costs you',
    items:['<b>The images blend in.</b> Perfect posing looks like every other local photographer, so you compete on price.',
           '<b>The experience feels tense.</b> Families can feel when they are being arranged, and it shows in their faces.',
           '<b>You cannot charge more.</b> Generic work caps your pricing, no matter how good your gear is.'] },

  {t:'part', eyebrow:'Part Two', h:'The Lifestyle Approach, step by step' },

  {t:'list', eyebrow:'The method', h:'Direct the feeling, not the pose',
    items:['<b>Prompt, do not pose.</b> You give families something to do and react to, then you catch what happens between the instructions.',
           '<b>Follow the light and the room.</b> Work with the home and the window you have, not a formula.',
           '<b>Protect the connection.</b> Your whole job on the day is keeping the family relaxed enough to be themselves.'] },

  {t:'list', eyebrow:'The toolkit', h:'8 Family Poses That Always Work',
    body:'A repeatable starting system so you never freeze in front of a family.',
    items:['Anchor poses that work for any family size or age.',
           'Simple prompts that turn each pose into motion and real emotion.',
           'A flow that moves the session forward without a shot list hanging over you.'] },

  {t:'list', eyebrow:'The experience', h:'3 Steps to a Relaxed Family Session',
    items:['<span class="num">1</span><b>Set expectations early</b> so the family arrives calm, not braced for a performance.',
           '<span class="num">2</span><b>Open with connection</b>, not with the hardest group shot.',
           '<span class="num">3</span><b>Direct in small moments</b> and let the in-between frames be the keepers.'] },

  {t:'reframe', eyebrow:'Newborns', h:'Baby-Led Posing',
    body:'The same philosophy, in the home, with a newborn. You follow the baby and the natural light instead of a prop setup. Posed with siblings, with parents, or solo, the images stay soft, real, and unmistakably a family, not a catalogue.' },

  {t:'part', eyebrow:'Part Three', h:'What it looks like when it works' },

  {t:'panel', eyebrow:'The shift', h:'From a nice session to a signature',
    body:'When the work carries a feeling only you make, three things happen at once: clients refer you for the experience, you stop competing on price, and you finally enjoy the shoot again.',
    note:'This is the difference between a photographer who books and a photographer who is booked out.' },

  {t:'why', eyebrow:'Why I teach this', h:'I built mine from nothing.',
    body:'I was a night-shift nurse before I ever picked up a camera. I built a six-figure lifestyle photography business as a single mother of three, by learning to create from the heart and earn in a meaningful way. Everything here is the exact approach that got me there.' },

  {t:'reframe', eyebrow:'The business case', h:'Create from the heart. Earn in a meaningful way.',
    body:'Connection-first work is not the soft option. It is the premium one. It is what lets you raise your prices, shoot less, and still grow, because you are selling something no one else in your market can make.' },

  {t:'list', eyebrow:'Getting seen', h:'Compassionate Marketing',
    body:'Marketing that books clients without the salesy tactics you hate.',
    items:['What to actually post, and what to blog about.',
           'How to gather and repurpose the content you already have.',
           'How to batch and schedule it so marketing stops eating your week.'] },

  {t:'recap', eyebrow:'In one line', big:'Photograph the feeling, price for the signature, and market with heart.' },

  {t:'cta', eyebrow:'Where to go next', h:'Come build this with me.',
    body:'The Elena S Blair Mastermind is a five month group coaching program, ending in an in-person retreat, for established photographers ready to up-level their art, their pricing, and their life. If today resonated, apply to join the next cohort.',
    disc:'Educational content only. Results shown are individual experiences and are not a promise or guarantee of income or outcomes. Your results will vary based on your market, effort, and circumstances.' }
];

const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide' + (s.t==='cta' ? ' cta':'');
  let html = '';
  if(s.eyebrow) html += '<div class="eyebrow">'+s.eyebrow+'</div>';
  if(s.t==='title') html += '<h1>'+s.h+'</h1>'+(s.lede?'<div class="lede">'+s.lede+'</div>':'');
  else if(s.t==='trap'||s.t==='recap') html += '<div class="big">'+s.big+'</div>';
  else {
    if(s.h) html += '<h2>'+s.h+'</h2>';
    if(s.body) html += '<p>'+s.body+'</p>';
    if(s.items){ html += '<ul>'; s.items.forEach(it=> html += '<li>'+it+'</li>'); html += '</ul>'; }
    if(s.note) html += '<div class="panel">'+s.note+'</div>';
    if(s.disc) html += '<div class="disc">'+s.disc+'</div>';
  }
  html += '<div class="foot">'+BRAND+'</div><div class="page">'+(i+1)+' / '+S.length+'</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
