<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Stop Chatting, Start Delegating — Ronnie Parsons</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F12;
    --panel:#141A20;
    --rule:#273039;
    --accent:#36D399;
    --ink:#E8EDF2;
    --muted:#93A1AD;
    --head:'Space Grotesk', system-ui, sans-serif;
    --mono:'IBM Plex Mono', ui-monospace, monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--mono)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 22px 120px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:46px 44px;
    margin:18px 0;
    min-height:420px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
  }
  .tag{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
  .tag::before{content:"▸ "}
  .num{position:absolute;top:22px;right:26px;font-family:var(--mono);font-size:12px;color:var(--muted)}
  h1{font-family:var(--head);font-weight:700;font-size:46px;line-height:1.05;letter-spacing:-.02em;margin:14px 0}
  h2{font-family:var(--head);font-weight:700;font-size:32px;line-height:1.12;letter-spacing:-.01em;margin:10px 0 14px}
  p{font-family:var(--mono);font-size:17px;line-height:1.6;color:var(--ink);margin:8px 0;max-width:62ch}
  p.muted{color:var(--muted)}
  .big{font-family:var(--head);font-weight:500;font-size:28px;line-height:1.2;color:var(--ink)}
  ul{list-style:none;margin:12px 0}
  li{font-family:var(--mono);font-size:17px;line-height:1.55;color:var(--ink);padding:9px 0 9px 26px;position:relative;border-bottom:1px solid var(--rule)}
  li:last-child{border-bottom:none}
  li::before{content:"_";color:var(--accent);position:absolute;left:4px;top:9px}
  .strike{color:var(--muted);text-decoration:line-through}
  .acc{color:var(--accent)}
  .console{background:#0A0D10;border:1px solid var(--rule);border-radius:10px;padding:18px 20px;font-family:var(--mono);font-size:15px;color:var(--muted);margin-top:16px}
  .console .ok{color:var(--accent)}
  .stat{display:flex;gap:34px;flex-wrap:wrap;margin-top:18px}
  .stat div{font-family:var(--head)}
  .stat b{display:block;font-size:34px;color:var(--accent);font-weight:700}
  .stat span{font-family:var(--mono);font-size:13px;color:var(--muted)}
  .foot{font-family:var(--mono);font-size:12px;color:var(--muted);margin-top:22px}
  .disc{font-family:var(--mono);font-size:12px;color:var(--muted);line-height:1.5;margin-top:20px;border-top:1px solid var(--rule);padding-top:14px;max-width:70ch}
  .cta-btn{display:inline-block;margin-top:18px;font-family:var(--head);font-weight:700;font-size:18px;color:var(--bg);background:var(--accent);padding:14px 24px;border-radius:8px;text-decoration:none}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', tag:'Mighty AI Lab · Live Masterclass', h1:'Stop Chatting.<br>Start Delegating.',
    big:'How founders set up AI to actually run parts of the business, so one operator ships like a team of ten.',
    foot:'Presented live by Ronnie Parsons · Founder, Mighty AI Lab' },

  {t:'content', tag:'Who this is for', h2:'You run the whole thing. That is the problem.',
    p:'You are the founder of a business doing somewhere between a quarter and a couple of million a year. You already use AI every day.',
    list:['You use it for answers, drafts, and quick questions','You are still working nights and weekends','Every new thing the business needs still lands on you'],
    foot:'If that is you, the next 60 minutes are going to change how you work.' },

  {t:'content', tag:'The trap', h2:'You bought the subscription. You are busier than ever.',
    p:'More AI did not give you your time back. It added one more tab you have to drive. Ask, copy, paste, fix, repeat.',
    p2:'Faster answers are not the same as less work. The work is still yours.' },

  {t:'reframe', tag:'The reframe', h1:'AI did not fail you.',
    big:'You are using it as a <span class="strike">search engine</span> when it can be an <span class="acc">employee</span>.' },

  {t:'content', tag:'Part one · the core idea', h2:'Chat gives you answers. Cowork gets the work done.',
    p:'Chat changed how we get information. Cowork changes how we get work out the door.',
    list:['Chat: you ask, it answers, you do the rest','Cowork: you hand off a task, step away, and come back to a finished deliverable'],
    foot:'Everything today is about moving from the first mode to the second.' },

  {t:'content', tag:'Part one', h2:'Every task you keep is a ceiling on the business.',
    p:'The work that only you can do is the work that caps how far the company can go. Delegating it is not about doing less. It is about removing the ceiling.',
    p2:'For most founders the fastest place to delegate first is not a person. It is AI.' },

  {t:'content', tag:'The myths', h2:'Two things you do not need.',
    list:['You do not need to learn to code','You do not need to hire a team before you are ready'],
    p:'You need a system that gives AI the context, the skills, and the connections to do real work. That system is buildable in an afternoon.' },

  {t:'section', tag:'Part two · the method', h1:'The Autonomous<br>Business Blueprint',
    big:'Three layers. One system running on your machine. Built live, from your own business.' },

  {t:'content', tag:'Layer 01 · Organize', h2:'Give AI what a new hire would need.',
    p:'A new team member cannot help until they know your business. Neither can AI. Layer one sets up the context.',
    list:['Folders that mirror how your business actually runs','Context files, so AI knows your offers, clients, and standards','Your Business Playbook, the single source of truth it reads from'] },

  {t:'content', tag:'Layer 02 · Teach', h2:'Turn your repeatable work into things AI runs.',
    p:'The work you do the same way every week is the work to hand off first. You teach it once.',
    list:['Skills, your workflows captured in your voice and standards','Agents, set loose on a job with the context to finish it','Your first custom build, taken from a real task you do now'] },

  {t:'content', tag:'Layer 03 · Connect', h2:'Wire it into the tools you already use.',
    p:'A system that cannot reach your tools is still a demo. Layer three connects it to where the work lives.',
    list:['Plugins into Gmail, Slack, and Notion','Persistence, so it remembers between sessions','Your first full day with the system actually running'] },

  {t:'content', tag:'The loop', h2:'Hand off. Step away. Come back to a finished deliverable.',
    p:'Once the three layers are in place, the pattern repeats across the whole business.',
    console:['you ▸ draft the Q4 client report and file it','agent ▸ working across folders + playbook …','agent ▸ <span class="ok">DONE</span> · report in /clients/Q4'],
    foot:'That is the difference between chatting and delegating.' },

  {t:'content', tag:'Part three · the autonomous week', h2:'A week in a company of one.',
    p:'This is not hypothetical. These are the kinds of jobs founders hand off once the system is built.',
    list:['Content drafted in your voice, on schedule','Research and summaries ready before you ask','Client delivery prepped and filed','Inbox and follow-ups triaged'],
    foot:'No fabricated numbers here. The point is the category of work, not a promise.' },

  {t:'content', tag:'Proof of mechanism', h2:'One real example.',
    p:'A founder in a recent cohort rebuilt her weekly content process as a single skill. What used to take four hours every Monday now runs in under twenty minutes, in her voice, to her standards.',
    foot:'The win was not the tool. It was capturing her workflow once and handing it off.' },

  {t:'content', tag:'Why me', h2:'I run three businesses this way.',
    p:'Twenty-plus years at the intersection of design, technology, and building. Three years ago I was trapped in 60-hour weeks. So I built the system I am teaching you today.',
    stat:[['20+','years building'],['500+','founders trained'],['3','companies of one']] },

  {t:'content', tag:'The shift', h2:'Stop adding prompts. Start building the system.',
    p:'A better prompt saves you a minute. A system that delegates the work gives you back the week. You can keep chatting, or you can start delegating.',
    p2:'The founders who win the next few years are the ones who set this up now.' },

  {t:'cta', tag:'Your next step', h1:'Build it with me.',
    big:'If you want the three-layer system running in your own business, the next move is a short conversation about where to start.',
    cta:'Book a discovery session with Ronnie',
    disc:'Educational content only. Examples reflect individual experiences and are not a promise of results. No result or income is guaranteed. Results vary with your business, effort, and implementation.',
    foot:'Ronnie Parsons · Mighty AI Lab' }
];

function esc(x){return x==null?'':x}
const deck = document.getElementById('deck');
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let h = '';
  h += '<div class="num">'+String(i+1).padStart(2,'0')+' / '+String(S.length).padStart(2,'0')+'</div>';
  if(s.tag) h += '<div class="tag">'+esc(s.tag)+'</div>';
  if(s.h1) h += '<h1>'+esc(s.h1)+'</h1>';
  if(s.h2) h += '<h2>'+esc(s.h2)+'</h2>';
  if(s.big) h += '<p class="big">'+esc(s.big)+'</p>';
  if(s.p) h += '<p>'+esc(s.p)+'</p>';
  if(s.p2) h += '<p class="muted">'+esc(s.p2)+'</p>';
  if(s.list){ h += '<ul>'; s.list.forEach(x=> h += '<li>'+esc(x)+'</li>'); h += '</ul>'; }
  if(s.console){ h += '<div class="console">'; s.console.forEach(x=> h += '<div>'+esc(x)+'</div>'); h += '</div>'; }
  if(s.stat){ h += '<div class="stat">'; s.stat.forEach(x=> h += '<div><b>'+esc(x[0])+'</b><span>'+esc(x[1])+'</span></div>'); h += '</div>'; }
  if(s.cta) h += '<a class="cta-btn" href="#">'+esc(s.cta)+'</a>';
  if(s.disc) h += '<div class="disc">'+esc(s.disc)+'</div>';
  if(s.foot) h += '<div class="foot">'+esc(s.foot)+'</div>';
  el.innerHTML = h;
  deck.appendChild(el);
});
</script>
</body>
</html>
