<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Dark Side of Goal Setting — A Masterclass with Lyn Allen</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,500;0,600;0,700;1,500;1,600&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
  :root{
    --bg:#f6f1e8;      /* warm ivory ground (brand: light scheme, warm) */
    --panel:#efe7db;
    --ink:#3a2f2a;     /* from brand body #716558, deepened */
    --ink-soft:#5f5247;
    --ink-muted:#8a7d6f;
    --rule:#e2d6c6;
    --accent:#5a4a42;  /* brand ranked dominant #5a4a42 (rgb 90,74,66), x9 */
    --accent-2:#7a5a3d;
  }
  html,body{height:100%}
  body{background:#e7ddcd;font-family:'Raleway',system-ui,sans-serif;color:var(--ink);
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .stage{width:100%;max-width:960px;aspect-ratio:16/10;background:var(--bg);position:relative;
    border-radius:6px;box-shadow:0 30px 70px rgba(90,74,66,.22);overflow:hidden}
  .slide{position:absolute;inset:0;padding:74px 82px;display:none;flex-direction:column;
    justify-content:center}
  .slide.on{display:flex;animation:fade .5s ease}
  @keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .kicker{font-size:14px;font-weight:700;letter-spacing:.24em;text-transform:uppercase;
    color:var(--accent);margin-bottom:26px}
  h1{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:60px;
    line-height:1.05;letter-spacing:-.005em;color:var(--ink)}
  h2{font-family:'Spectral',Georgia,serif;font-weight:600;font-size:44px;
    line-height:1.1;color:var(--ink);margin-bottom:22px}
  .lead{font-size:23px;line-height:1.5;color:var(--ink-soft);margin-top:26px;max-width:88%}
  .em{color:var(--accent);font-style:italic}
  p.body{font-size:21px;line-height:1.6;color:var(--ink-soft);margin-top:16px;max-width:86%}
  .presenter{margin-top:40px;font-size:16px;letter-spacing:.02em;color:var(--ink-muted);line-height:1.6}
  .presenter strong{color:var(--ink);font-weight:600}
  ul{list-style:none;margin-top:26px;display:flex;flex-direction:column;gap:15px;max-width:90%}
  ul li{font-size:21px;line-height:1.45;color:var(--ink-soft);padding-left:34px;position:relative}
  ul li::before{content:'';position:absolute;left:0;top:11px;width:12px;height:12px;
    border-radius:50%;border:2px solid var(--accent)}
  ul li.hit::before{background:var(--accent)}
  .loop{margin-top:34px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;max-width:94%}
  .loop span{background:var(--panel);border:1px solid var(--rule);border-radius:100px;
    padding:12px 22px;font-size:19px;font-weight:600;color:var(--ink)}
  .loop b{color:var(--accent-2);font-size:22px}
  blockquote{font-family:'Spectral',Georgia,serif;font-size:46px;font-style:italic;
    line-height:1.2;color:var(--ink);max-width:92%}
  blockquote .a{color:var(--accent)}
  .q-attr{margin-top:28px;font-size:16px;letter-spacing:.1em;text-transform:uppercase;
    color:var(--ink-muted);font-weight:700}
  .steps{margin-top:30px;display:flex;flex-direction:column;gap:18px;max-width:90%}
  .step{display:flex;gap:20px;align-items:flex-start}
  .step .n{font-family:'Spectral',serif;font-size:34px;font-weight:700;color:var(--accent);
    line-height:1;min-width:44px}
  .step .t{font-size:21px;line-height:1.45;color:var(--ink-soft)}
  .step .t b{color:var(--ink);font-weight:600}
  .cta-box{margin-top:30px;background:var(--panel);border:1px solid var(--rule);border-radius:14px;
    padding:30px 34px;max-width:88%}
  .cta-box .step-label{font-size:22px;color:var(--ink);font-weight:600;line-height:1.5}
  .disclaimer{margin-top:26px;font-size:13px;line-height:1.6;color:var(--ink-muted);max-width:86%}
  .foot{position:absolute;left:82px;right:82px;bottom:34px;display:flex;justify-content:space-between;
    align-items:center;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-muted)}
  .foot .brand{font-weight:700;color:var(--accent)}
  .nav{position:absolute;right:26px;bottom:22px;display:flex;gap:8px;z-index:5}
  .nav button{width:40px;height:40px;border:1px solid var(--rule);background:var(--bg);
    color:var(--accent);border-radius:50%;font-size:18px;cursor:pointer;line-height:1}
  .nav button:hover{background:var(--accent);color:var(--bg)}
  .count{position:absolute;left:82px;bottom:34px;font-size:12px;color:var(--ink-muted);letter-spacing:.1em}
  @media (max-width:720px){.slide{padding:44px 40px}h1{font-size:40px}h2{font-size:32px}
    blockquote{font-size:32px}.lead{font-size:19px}.foot,.count{display:none}}
</style>
</head>
<body>
<div class="stage" id="stage"></div>
<script>
const S = [
  {t:'title', h:`<div class="kicker">A Live Masterclass</div>
    <h1>The Dark Side of<br>Goal Setting</h1>
    <div class="lead">How high-achieving women hit every goal and still end up depleted, and the one shift that changes it.</div>
    <div class="presenter"><strong>Lyn Allen</strong>, Master Certified Coach<br>The Peaceful Achiever</div>`},

  {t:'who', h:`<div class="kicker">Who this is for</div>
    <h2>You set the target. You hit it.<br>And something still feels off.</h2>
    <p class="body">You lead at a high level. You are disciplined, driven, and you deliver. From the outside it looks like it is working. Inside, you are quietly running on empty.</p>`},

  {t:'trap', h:`<div class="kicker">The trap</div>
    <h2>You did everything right.</h2>
    <p class="body">More focus. More discipline. Another goal, met. The advice was always the same: want it more, push harder. So you did. And the fuller your list of wins, the heavier it all felt.</p>`},

  {t:'reframe', h:`<blockquote>The problem was never your effort.<br>It was the goal <span class="a">underneath</span> the goal.</blockquote>
    <div class="q-attr">The dark side of goal setting</div>`},

  {t:'p1', h:`<div class="kicker">Part One</div>
    <h2>Behind every stated goal<br>lives a hidden one.</h2>
    <p class="body">The goal you wrote down looks clear. But underneath it sit drivers you never chose on purpose, and they are the ones quietly steering. Naming them is where this work begins.</p>`},

  {t:'pressures', h:`<div class="kicker">The five hidden pressures</div>
    <h2>What is really shaping the goal</h2>
    <ul>
      <li>Unspoken expectations you never agreed to out loud</li>
      <li>Internal pressure that treats rest as failure</li>
      <li>Inherited definitions of success that were never yours</li>
      <li>Old cultural narratives about what a leader has to be</li>
      <li>The quiet habit of overriding yourself</li>
    </ul>`},

  {t:'loop', h:`<div class="kicker">The cycle</div>
    <h2>Why more effort makes it worse</h2>
    <p class="body">When a goal runs on hidden pressure, effort does not resolve it. It feeds it.</p>
    <div class="loop">
      <span>Effort</span><b>&rsaquo;</b><span>Pressure</span><b>&rsaquo;</b><span>Frustration</span>
      <b>&rsaquo;</b><span>Exhaustion</span><b>&rsaquo;</b><span>Reset</span><b>&rsaquo;</b><span>Repeat</span>
    </div>`},

  {t:'cost', h:`<div class="kicker">The cost</div>
    <h2>What an unaligned goal quietly eats</h2>
    <p class="body">Goals shaped by pressure you cannot see chew big holes in three things you cannot get back: your time, your energy, and your confidence. Most high achievers pay it for years before they notice.</p>`},

  {t:'sarah', h:`<div class="kicker">A story you may recognize</div>
    <h2>Sarah came for "organization."</h2>
    <p class="body">A senior leader, out of control and overloaded, certain she just needed a better system. The system was never the problem. Underneath the busyness was a goal she had never once questioned, and once she saw it, everything downstream moved.</p>`},

  {t:'p2', h:`<div class="kicker">Part Two</div>
    <h2>The alignment check</h2>
    <p class="body">Before you commit another quarter of your life to a goal, you run it through four questions. This is the tool at the center of the work.</p>`},

  {t:'steps', h:`<div class="kicker">Is this goal actually mine?</div>
    <div class="steps">
      <div class="step"><div class="n">1</div><div class="t"><b>Whose voice set this target?</b> Yours, or a room full of people who are not in it with you.</div></div>
      <div class="step"><div class="n">2</div><div class="t"><b>What actually happens if I do not?</b> Separate the real consequence from the imagined one.</div></div>
      <div class="step"><div class="n">3</div><div class="t"><b>Am I overriding a real no?</b> The body keeps the score long before the calendar does.</div></div>
      <div class="step"><div class="n">4</div><div class="t"><b>Does this cost me my peace?</b> If the price of the win is yourself, it is the wrong win.</div></div>
    </div>`},

  {t:'peace', h:`<blockquote>Peace and achievement<br>are <span class="a">not opposites</span>.</blockquote>
    <div class="q-attr">The Peaceful Achiever</div>`},

  {t:'p3', h:`<div class="kicker">Part Three</div>
    <h2>You build capacity,<br>you do not add push.</h2>
    <p class="body">The answer to a depleting goal is not a harder version of the same effort. It is more inner capacity: the resources that let you carry real responsibility without carrying it alone or carrying it into the ground.</p>`},

  {t:'aligned', h:`<div class="kicker">What changes</div>
    <h2>When the goal is finally yours</h2>
    <ul>
      <li class="hit">You stop negotiating with a target that was never yours</li>
      <li class="hit">Your energy comes back, because you are not fighting yourself</li>
      <li class="hit">You lead from clarity instead of proving something</li>
      <li class="hit">You get to be part of the solution, not a pawn in the problem</li>
    </ul>`},

  {t:'masks', h:`<div class="kicker">Leading without masks</div>
    <h2>Resilience is not gritting harder.</h2>
    <p class="body">It is the capacity to stay yourself under pressure: to set a real priority, to hold a team without theatrics, to manage a difficult boss, and to step out of the exhaustion loop without stepping down.</p>`},

  {t:'whyme', h:`<div class="kicker">Why me</div>
    <h2>Thirty years in one chair.</h2>
    <p class="body">I am one of the early Master Certified Coaches, faculty for coach-training programs, an ICF credentialing peer reviewer, and I was named by CNN as one of America's top coaches. I have spent three decades watching high achievers set the wrong goal beautifully. This is the work that undoes it.</p>
    <div class="presenter"><strong>Lyn Allen</strong>, MCC &middot; The Peaceful Achiever</div>`},

  {t:'cta', h:`<div class="kicker">Your next chapter</div>
    <h2>Do this work in a room<br>built for it.</h2>
    <div class="cta-box"><div class="step-label">The Next Chapter Resilience Lab is a small, three-month group for women in leadership who are ready to lead without the push. If that is you, the next step is a short conversation with me about fit.</div></div>
    <p class="disclaimer">This masterclass is educational and is not therapy. No specific income, promotion, or business result is guaranteed. Results vary with each person and circumstance.</p>`}
];

const stage = document.getElementById('stage');
let i = 0;
function render(){
  stage.innerHTML = '';
  const s = S[i];
  const div = document.createElement('div');
  div.className = 'slide on';
  div.innerHTML = s.h +
    `<div class="foot"><span class="brand">The Peaceful Achiever</span><span>Lyn Allen &middot; lynallen.com</span></div>`;
  stage.appendChild(div);
  const c = document.createElement('div');
  c.className = 'count';
  c.textContent = (i+1) + ' / ' + S.length;
  stage.appendChild(c);
  const nav = document.createElement('div');
  nav.className = 'nav';
  nav.innerHTML = '<button aria-label="Previous">&lsaquo;</button><button aria-label="Next">&rsaquo;</button>';
  nav.children[0].onclick = (e)=>{e.stopPropagation();prev();};
  nav.children[1].onclick = (e)=>{e.stopPropagation();next();};
  stage.appendChild(nav);
}
function next(){ if(i<S.length-1){i++;render();} }
function prev(){ if(i>0){i--;render();} }
document.addEventListener('keydown', e=>{
  if(e.key==='ArrowRight'||e.key===' ') next();
  if(e.key==='ArrowLeft') prev();
});
stage.addEventListener('click', e=>{ if(!e.target.closest('.nav')) next(); });
render();
</script>
</body>
</html>
