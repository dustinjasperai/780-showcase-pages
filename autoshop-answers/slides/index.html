<!DOCTYPE html><html lang='en'><head><meta charset='utf-8'>
<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>The 5 Hospitality Leaks | Key2Key deck</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;background:#0a1a33;overflow:hidden;font-family:'Inter',sans-serif}
#stage{height:100%;display:flex;align-items:center;justify-content:center}
.sv{display:none;width:100%;max-width:1180px;height:88vh;border:0}
#bar{position:fixed;bottom:0;left:0;right:0;height:52px;background:#102b52;display:flex;
 align-items:center;justify-content:center;gap:24px;color:#f7f9fb;font-size:14px;letter-spacing:.05em;z-index:5}
#bar button{background:#f5bd1f;color:#0a1a33;border:0;border-radius:8px;padding:8px 18px;font-weight:700;cursor:pointer;font-family:inherit}
#count{min-width:70px;text-align:center}
</style></head><body>
<div id='stage'><iframe class='sv' data-n='1' src='01.html' style="display:block"></iframe><iframe class='sv' data-n='2' src='02.html' ></iframe><iframe class='sv' data-n='3' src='03.html' ></iframe><iframe class='sv' data-n='4' src='04.html' ></iframe><iframe class='sv' data-n='5' src='05.html' ></iframe><iframe class='sv' data-n='6' src='06.html' ></iframe><iframe class='sv' data-n='7' src='07.html' ></iframe><iframe class='sv' data-n='8' src='08.html' ></iframe><iframe class='sv' data-n='9' src='09.html' ></iframe><iframe class='sv' data-n='10' src='10.html' ></iframe><iframe class='sv' data-n='11' src='11.html' ></iframe><iframe class='sv' data-n='12' src='12.html' ></iframe><iframe class='sv' data-n='13' src='13.html' ></iframe><iframe class='sv' data-n='14' src='14.html' ></iframe><iframe class='sv' data-n='15' src='15.html' ></iframe><iframe class='sv' data-n='16' src='16.html' ></iframe><iframe class='sv' data-n='17' src='17.html' ></iframe><iframe class='sv' data-n='18' src='18.html' ></iframe><iframe class='sv' data-n='19' src='19.html' ></iframe><iframe class='sv' data-n='20' src='20.html' ></iframe><iframe class='sv' data-n='21' src='21.html' ></iframe><iframe class='sv' data-n='22' src='22.html' ></iframe><iframe class='sv' data-n='23' src='23.html' ></iframe></div>
<div id='bar'><button id='prev'>&larr; Prev</button><span id='count'>1 / 23</span><button id='next'>Next &rarr;</button>
<span style='opacity:.6'>Use the arrow keys</span></div>
<script>
var n=1,total=23,frames=document.querySelectorAll('.sv'),count=document.getElementById('count');
function show(k){if(k<1)k=1;if(k>total)k=total;n=k;frames.forEach(function(f){f.style.display=(+f.dataset.n===n)?'block':'none';});count.textContent=n+' / '+total;}
document.getElementById('next').onclick=function(){show(n+1)};
document.getElementById('prev').onclick=function(){show(n-1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key===' ')show(n+1);if(e.key==='ArrowLeft')show(n-1);});
show(1);
</script></body></html>
