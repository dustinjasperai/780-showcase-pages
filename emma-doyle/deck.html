<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leader as Coach Masterclass - Coach EM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1d1f33; --panel:#262a45; --rule:#3a3f63; --accent:#00c4cc; --ink:#f4f5fb;
    --muted:#aab0cf;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:'Inter',system-ui,sans-serif}
  .deck{max-width:960px;margin:0 auto;padding:40px 20px 80px}
  .slide{
    position:relative;background:var(--panel);border:1px solid var(--rule);
    border-radius:14px;padding:56px 56px 52px;margin:0 0 26px;min-height:480px;
    display:flex;flex-direction:column;justify-content:center;overflow:hidden;
  }
  /* court-baseline motif: a single teal rule advancing down the deck */
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--accent)}
  .eyebrow{font-family:'Sora';font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    font-size:13px;color:var(--accent);margin-bottom:18px}
  h1{font-family:'Sora';font-weight:800;font-size:46px;line-height:1.08;letter-spacing:-.01em}
  h2{font-family:'Sora';font-weight:700;font-size:34px;line-height:1.14;letter-spacing:-.01em}
  .promise{font-size:20px;color:var(--muted);margin-top:22px;max-width:40ch;line-height:1.5}
  p.body{font-size:19px;line-height:1.6;color:var(--ink);max-width:46ch;margin-top:16px}
  p.body + p.body{margin-top:14px}
  ul{margin:22px 0 0 2px;list-style:none}
  li{font-size:19px;line-height:1.5;color:var(--ink);padding:10px 0 10px 30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:19px;width:16px;height:3px;background:var(--accent);border-radius:2px}
  .big{font-family:'Sora';font-weight:800;font-size:40px;line-height:1.12;max-width:22ch}
  .kicker{font-size:17px;color:var(--muted);margin-top:20px;max-width:44ch;line-height:1.55}
  .pill{display:inline-block;font-family:'Sora';font-weight:700;font-size:14px;color:var(--bg);
    background:var(--accent);border-radius:999px;padding:6px 16px;margin-bottom:22px;width:fit-content}
  .credrow{display:flex;flex-wrap:wrap;gap:12px;margin-top:26px}
  .credrow span{font-size:15px;color:var(--ink);background:var(--bg);border:1px solid var(--rule);
    border-radius:8px;padding:10px 14px}
  .num{font-family:'Sora';font-weight:800;color:var(--accent);font-size:15px;letter-spacing:.1em}
  .foot{position:absolute;right:24px;bottom:18px;font-size:12px;color:var(--muted);font-family:'Sora';letter-spacing:.08em}
  .disc{font-size:14px;color:var(--muted);margin-top:26px;max-width:52ch;line-height:1.5}
  .cta-note{font-size:21px;color:var(--ink);margin-top:18px;max-width:44ch;line-height:1.5}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:"title", eyebrow:"A live masterclass with Coach EM",
    h:"Leader as Coach", promise:"Build the environment, and performance follows. The shift from managing the work to coaching the people who do it." },

  {t:"who", eyebrow:"Who this is for",
    h2:"For leaders whose teams work hard and still stall",
    body:["You lead people who are capable, busy, and somehow not fully owning the outcome.","You were promoted because you were great at the work. Now the work is other people, and the old playbook keeps letting you down."] },

  {t:"trap", eyebrow:"The trap",
    big:"So you manage harder.",
    kicker:"More check-ins. Clearer instructions. Tighter follow-up. And your best people get quieter, not stronger. Effort goes up. Ownership goes down." },

  {t:"reframe", eyebrow:"The reframe",
    big:"You cannot performance-manage ownership into existence.",
    kicker:"Ownership is not a behaviour you enforce. It is a response to the environment you create. Change the environment and the performance takes care of itself." },

  {t:"part", eyebrow:"Part one", num:"01", h2:"The real problem is telling, not asking" },

  {t:"content", eyebrow:"Part one",
    h2:"Advice is a ceiling",
    body:["Every time you answer the question, you train the team to bring you questions.","The faster you solve it, the smaller they get. Your expertise quietly caps the room."] },

  {t:"content", eyebrow:"Part one",
    h2:"Elite sport figured this out first",
    body:["A great coach does not play the match. They build the conditions where the athlete performs under pressure without them.","That is the lineage this method comes from, and it translates directly to how you lead a team."] },

  {t:"part", eyebrow:"Part two", num:"02", h2:"The method: environment before performance" },

  {t:"content", eyebrow:"Part two . pillar 1",
    h2:"Environment before performance",
    body:["Before you chase the result, build the psychological conditions where people can think clearly, take ownership, and perform under pressure.","Safety and challenge together. Not one or the other."] },

  {t:"content", eyebrow:"Part two . pillar 2",
    h2:"Constraints-leveraged coaching",
    body:["You do not add more rules. You design the right constraints, the conditions that make the better behaviour the natural one.","This is the art and the science of coaching working together."] },

  {t:"content", eyebrow:"Part two . pillar 3",
    h2:"The curiosity questions",
    body:["Be curious, not judgmental. A handful of well-placed questions move a person from waiting for answers to owning the next move.","You will leave with the exact questions and when to use each one."] },

  {t:"content", eyebrow:"Part two . pillar 4",
    h2:"The Way of NOW",
    body:["Coaching is not a quarterly conversation. It is how you lead in the moment, in the meeting you are already in.","Small, repeatable, and built into the week you already have."] },

  {t:"part", eyebrow:"Part three", num:"03", h2:"A week after you make the shift" },

  {t:"content", eyebrow:"Part three",
    h2:"One week in",
    body:["You ask before you tell in the first conversation that matters.","Someone solves a problem you would normally have solved for them. The room feels different, and you did less."] },

  {t:"list", eyebrow:"Part three",
    h2:"Why it holds",
    items:["Your best people stay, because they are growing, not just delivering","Decisions move closer to the work, so you are no longer the bottleneck","The culture compounds, because coaching is contagious once it starts"] },

  {t:"cred", eyebrow:"Why me",
    h2:"I have coached performance for thirty years",
    creds:["International high-performance tennis coach","Represented Australia as a world team coach","PCC with the International Coach Federation","TEDx speaker","Author, What Makes a Great Coach?","Host, The Coaching Podcast"] },

  {t:"recap", eyebrow:"The whole idea",
    big:"Manage less. Coach more.",
    kicker:"Build the environment first. Ask before you tell. Lead in the now. The performance you have been chasing shows up on its own." },

  {t:"cta", eyebrow:"Your next step",
    h2:"Bring this into your team",
    note:"If you want to build a coaching culture inside your organisation, the next step is a conversation about your people and what you want to change. That is what the Leader as Coach work is for.",
    disc:"This masterclass is educational. It shares a coaching method and real practice. It is not a guarantee of any specific business or performance result. Outcomes depend on your team, your context, and the work you put in." }
];

const deck = document.getElementById('deck');
function esc(x){return (x||'').replace(/&/g,'&amp;').replace(/</g,'&lt;')}
S.forEach((s,i)=>{
  const el = document.createElement('section');
  el.className = 'slide';
  let html = '';
  if(s.eyebrow) html += `<div class="eyebrow">${esc(s.eyebrow)}</div>`;
  if(s.t==='title'){ html += `<h1>${esc(s.h)}</h1>`; if(s.promise) html += `<div class="promise">${esc(s.promise)}</div>`; }
  else if(s.t==='part'){ if(s.num) html += `<div class="num">${esc(s.num)}</div>`; html += `<h2>${esc(s.h2)}</h2>`; }
  else if(s.t==='trap'||s.t==='reframe'||s.t==='recap'){ html += `<div class="big">${esc(s.big)}</div>`; if(s.kicker) html += `<div class="kicker">${esc(s.kicker)}</div>`; }
  else if(s.t==='list'){ html += `<h2>${esc(s.h2)}</h2><ul>${s.items.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`; }
  else if(s.t==='cred'){ html += `<h2>${esc(s.h2)}</h2><div class="credrow">${s.creds.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`; }
  else if(s.t==='cta'){ html += `<span class="pill">Leader as Coach</span><h2>${esc(s.h2)}</h2><div class="cta-note">${esc(s.note)}</div><div class="disc">${esc(s.disc)}</div>`; }
  else { if(s.h2) html += `<h2>${esc(s.h2)}</h2>`; if(s.body) html += s.body.map(b=>`<p class="body">${esc(b)}</p>`).join(''); }
  html += `<div class="foot">COACH EM . ${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</div>`;
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
