<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turn Customer Success Into a Revenue Engine | CS RevSpeak</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#faf7f4;
    --panel:#ffffff;
    --rule:#e6ded6;
    --ink:#26211d;
    --muted:#6a625b;
    --slate:#324d5c;
    --accent:#b23a35;
    --display:'Poppins',system-ui,sans-serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}
  .slide{
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:14px;
    padding:52px 56px;
    margin:0 0 22px;
    min-height:430px;
    display:flex;flex-direction:column;justify-content:center;
    position:relative;
    box-shadow:0 1px 2px rgba(38,33,29,.04);
  }
  .num{position:absolute;top:22px;right:28px;font-family:var(--display);font-size:13px;color:var(--muted);letter-spacing:.04em}
  .eyebrow{font-family:var(--display);font-weight:600;font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1.08;letter-spacing:-.01em;margin-bottom:18px}
  h2{font-family:var(--display);font-weight:600;font-size:34px;line-height:1.14;letter-spacing:-.01em;margin-bottom:16px}
  .lead{font-size:20px;line-height:1.5;color:var(--slate);max-width:46ch}
  p.body{font-size:18px;line-height:1.6;color:var(--ink);max-width:56ch;margin-bottom:14px}
  .sub{font-size:17px;color:var(--muted);margin-top:6px}
  .divider{width:46px;height:4px;background:var(--accent);border-radius:3px;margin:8px 0 26px}
  ul.points{list-style:none;margin-top:10px}
  ul.points li{font-size:18px;line-height:1.5;padding:12px 0 12px 30px;border-bottom:1px solid var(--rule);position:relative;max-width:60ch}
  ul.points li:last-child{border-bottom:none}
  ul.points li:before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;background:var(--accent);border-radius:2px}
  .steps{display:grid;grid-template-columns:40px 1fr;gap:10px 18px;margin-top:12px}
  .steps .k{font-family:var(--display);font-weight:700;color:var(--accent);font-size:20px}
  .steps .v{font-size:17px;line-height:1.45;color:var(--ink);padding-top:2px;max-width:56ch}
  .dirs{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:20px}
  .dirs .d{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:16px 12px;text-align:center}
  .dirs .d span{display:block;font-family:var(--display);font-weight:600;font-size:15px;color:var(--slate)}
  .dirs .d em{display:block;font-style:normal;font-size:12.5px;color:var(--muted);margin-top:6px;line-height:1.35}
  .positions{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:18px}
  .positions .p{border:1px solid var(--rule);border-radius:10px;padding:14px;background:var(--bg)}
  .positions .p b{font-family:var(--display);color:var(--accent);font-size:15px;display:block;margin-bottom:6px}
  .positions .p span{font-size:14px;color:var(--muted);line-height:1.4}
  .cta-box{margin-top:8px}
  .cta-list{list-style:none;margin:18px 0 0}
  .cta-list li{font-size:18px;line-height:1.5;padding:10px 0;color:var(--ink)}
  .cta-list li b{font-family:var(--display);color:var(--slate)}
  .disclaimer{font-size:12.5px;color:var(--muted);line-height:1.5;margin-top:26px;border-top:1px solid var(--rule);padding-top:16px;max-width:70ch}
  .presenter{font-family:var(--display);font-weight:600;color:var(--slate);font-size:18px;margin-top:22px}
  .title-slide{background:linear-gradient(180deg,#ffffff 0%,#f6efe8 100%)}
  @media(max-width:720px){
    .slide{padding:34px 26px;min-height:360px}
    h1{font-size:34px}h2{font-size:26px}
    .dirs,.positions{grid-template-columns:repeat(2,1fr)}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const S=[
  {t:'title',eyebrow:'A Live Masterclass for Customer Success Leaders',
   h1:'Turn Customer Success Into a Revenue Engine',
   lead:'The Value Realization Framework: how CS leaders prove value, drive renewals and expansion, and earn a seat at the revenue table.',
   presenter:'Angeline Gavino · CS RevSpeak'},

  {t:'content',eyebrow:'Who this is for',h2:'You carry a revenue number now',
   body:'This is for Directors, VPs and Heads of Customer Success and Chief Customer Officers who are being handed a revenue number without a repeatable system behind it.',
   points:['You are building, fixing and scaling the function at the same time',
           'Your team does strong work, but the exec team cannot see it',
           'Renewals feel defensive and expansion keeps stalling']},

  {t:'content',eyebrow:'The trap',h2:'Great work is no longer enough',
   body:'For years, doing excellent Customer Success work was the job. The quiet shift: effort that cannot be tied to a business outcome is invisible to the people who decide budgets.',
   sub:'When value lives only in your head and your QBR decks, it does not travel to the boardroom.'},

  {t:'content',eyebrow:'The reframe',h2:'The function that cannot prove value gets cut first',
   body:'In a tighter market, every cost center is questioned. Customer Success that reads as a support cost is the first line item on the table. Customer Success that reads as a revenue driver is protected and funded.',
   sub:'The difference is not how hard your team works. It is whether value is a system or a vibe.'},

  {t:'section',eyebrow:'Part One',h2:'Why value stays invisible',
   lead:'Value is usually treated as a feeling, not a measurable thing. The promises made during the sale evaporate the day after kickoff, and nobody re-anchors to them.'},

  {t:'content',eyebrow:'Part One',h2:'The three gaps',
   points:['The promise gap: what was sold is never written down as outcomes to deliver',
           'The proof gap: customers reach value but no one marks the moment or owns it',
           'The language gap: CS reports activity to executives who only hear revenue']},

  {t:'section',eyebrow:'Part Two',h2:'The Value Realization Framework',
   lead:'A seven step operating system that turns value from a vague word into something you map, deliver, measure and communicate, so renewals and expansion become the natural next step.'},

  {t:'content',eyebrow:'Step 2 · Promised value',h2:'Map value with the SOP Model',
   body:'Before you can deliver value, you have to name it. The SOP Model sorts every promise into three kinds so nothing gets lost between the sale and the rollout.',
   steps:[['S','Strategic value: the business outcome the customer bought (growth, retention, market position)'],
          ['O','Operational value: the process and workflow the product is meant to fix'],
          ['P','Productivity value: the time, effort and cost it is meant to save']]},

  {t:'content',eyebrow:'Step 3 · Expected value',h2:'Start with the outcome, then the baseline',
   body:'Outcome-first discovery means you agree on the result the customer wants before you talk features, and you capture a baseline on day one so progress can be measured later.',
   sub:'No baseline means no ROI story twelve months from now.'},

  {t:'content',eyebrow:'Step 4 · Guiding to value',h2:'Build proof moments into the journey',
   body:'Map the customer journey as a series of proof moments, each with a clear owner. Value realization stops being an accident and becomes something you can see coming.',
   points:['Name the moment that proves early value',
           'Assign one owner to each moment',
           'Make the moment visible to the customer when it happens']},

  {t:'content',eyebrow:'Step 5 · Communicating value',h2:'The GROW Storytelling Framework',
   body:'Executives do not remember dashboards. They remember a story. GROW turns your results into an executive summary that lands in the rooms where budgets are decided.',
   sub:'This is how CS leaders learn to speak the language of revenue.'},

  {t:'content',eyebrow:'Steps 6 and 7 · ROI and action',h2:'Quantify it, then make it repeatable',
   body:'Calculate ROI with a simple baseline to progress comparison, then turn the whole thing into a 30, 60 and 90 day roadmap your team can run without you in the room.',
   points:['ROI: baseline, current state, the delta in the customer’s own terms',
           'A 30-60-90 rollout that survives handoffs and turnover']},

  {t:'content',eyebrow:'The leadership layer',h2:'Value has to be led, in five directions',
   body:'A framework only works if the leader can run it across every arena at once. The Five Directions is how you hold all of them together.',
   dirs:[['Lead the Function','org design and operating model'],
         ['Lead Up','influence with the C-suite and board'],
         ['Lead Across','align Sales, Product and Finance'],
         ['Lead the Team','hire, develop and coach CSMs'],
         ['Lead Yourself','decisions, focus and resilience']]},

  {t:'section',eyebrow:'Part Three',h2:'What it looks like when it works',
   lead:'Renewals stop being a fight. Expansion has a path. And when the exec team asks what Customer Success is worth, you have the number and the story ready.'},

  {t:'content',eyebrow:'The test',h2:'Is your function indispensable?',
   body:'The CS Indispensability Audit places a function in one of four positions by how hard it would be to cut. Most leaders are one position lower than they think.',
   positions:[['Vulnerable','seen as a support cost, first to be cut'],
              ['Useful','liked, but not tied to revenue'],
              ['Valued','proves outcomes case by case'],
              ['Indispensable','a measured revenue driver the board protects']]},

  {t:'content',eyebrow:'Why me',h2:'Where this comes from',
   body:'I have spent 17 plus years in B2B SaaS and 11 plus in Customer Success leadership, building and scaling CS across four startups from pre-revenue to a public company, and coaching more than 100 CS leaders.',
   sub:'The Value Realization Framework and the Five Directions are the systems I use with the leaders I work with.',
   presenter:'Angeline Gavino · Founder, CS RevSpeak'},

  {t:'cta',eyebrow:'Lead your value engine',h2:'Work with me on your value engine',
   body:'If you want help putting this to work in your own organization, here is how we can go deeper together.',
   ctaList:[['1:1 CS Leadership Coaching','private sessions to roll this out in your org'],
            ['Lead2Scale','the 12 month CS leadership cohort, built on the Five Directions'],
            ['Value Realization Framework course','the full self-paced system']],
   disclaimer:'This masterclass is for educational purposes only. It shares frameworks and approaches, not guarantees. Results depend on your team, market and execution, and no specific revenue, retention or income outcome is promised or implied.'}
];

function el(tag,cls,html){var e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e;}
var app=document.getElementById('app');
S.forEach(function(s,i){
  var slide=el('div','slide'+(s.t==='title'?' title-slide':''));
  slide.appendChild(el('div','num',(i+1)+' / '+S.length));
  if(s.eyebrow)slide.appendChild(el('div','eyebrow',s.eyebrow));
  if(s.h1){slide.appendChild(el('h1',null,s.h1));}
  if(s.h2){slide.appendChild(el('h2',null,s.h2));slide.appendChild(el('div','divider'));}
  if(s.lead)slide.appendChild(el('p','lead',s.lead));
  if(s.body)slide.appendChild(el('p','body',s.body));
  if(s.steps){var g=el('div','steps');s.steps.forEach(function(r){g.appendChild(el('div','k',r[0]));g.appendChild(el('div','v',r[1]));});slide.appendChild(g);}
  if(s.points){var ul=el('ul','points');s.points.forEach(function(p){ul.appendChild(el('li',null,p));});slide.appendChild(ul);}
  if(s.dirs){var d=el('div','dirs');s.dirs.forEach(function(r){var c=el('div','d');c.appendChild(el('span',null,r[0]));c.appendChild(el('em',null,r[1]));d.appendChild(c);});slide.appendChild(d);}
  if(s.positions){var pz=el('div','positions');s.positions.forEach(function(r){var c=el('div','p');c.appendChild(el('b',null,r[0]));c.appendChild(el('span',null,r[1]));pz.appendChild(c);});slide.appendChild(pz);}
  if(s.ctaList){var ul2=el('ul','cta-list');s.ctaList.forEach(function(r){ul2.appendChild(el('li',null,'<b>'+r[0]+'</b>: '+r[1]));});slide.appendChild(ul2);}
  if(s.sub)slide.appendChild(el('p','sub',s.sub));
  if(s.presenter)slide.appendChild(el('div','presenter',s.presenter));
  if(s.disclaimer)slide.appendChild(el('div','disclaimer',s.disclaimer));
  app.appendChild(slide);
});
</script>
</body>
</html>
