<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>The Rejection-Proof Applicant - a live masterclass with Dr. Joses Ngugi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Open+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#eef4fb; --panel:#ffffff; --ink:#0c2233; --muted:#5b7186;
    --rule:#d5e2f0; --accent:#188bf6; --accent-2:#0b5cab; --soft:#dbe8f7;
    --disp:'Nunito',system-ui,sans-serif;
    --body:'Open Sans',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased}
  .deck{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
  section.slide{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;
    justify-content:center;padding:8vh 8vw;position:relative;border-bottom:1px solid var(--rule)}
  section.slide::before{content:'';position:absolute;left:8vw;top:7vh;width:58px;height:4px;
    background:var(--accent);border-radius:3px}
  .kick{font-family:var(--disp);font-size:14px;font-weight:800;letter-spacing:.22em;text-transform:uppercase;
    color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--disp);font-size:clamp(40px,6.6vw,88px);line-height:1.02;font-weight:900;letter-spacing:-.02em}
  h2{font-family:var(--disp);font-size:clamp(30px,4.6vw,60px);line-height:1.06;font-weight:800;letter-spacing:-.015em}
  .em{color:var(--accent)}
  .sub{font-size:clamp(18px,2vw,26px);line-height:1.5;color:var(--muted);margin-top:26px;max-width:44ch;font-weight:400}
  .lead{font-size:clamp(19px,2.3vw,31px);line-height:1.4;color:var(--ink);margin-top:24px;max-width:34ch;font-weight:400}
  .big{font-family:var(--disp);font-size:clamp(30px,4.8vw,62px);line-height:1.12;font-weight:800;max-width:22ch}
  .presenter{margin-top:54px;font-family:var(--disp);font-size:20px;font-weight:800;color:var(--ink)}
  .presenter span{display:block;font-family:var(--body);color:var(--muted);font-weight:500;font-size:16px;margin-top:6px;letter-spacing:.01em}
  .partno{font-family:var(--disp);font-size:clamp(64px,13vw,168px);font-weight:900;color:var(--soft);line-height:.86;letter-spacing:-.04em}
  .partlabel{font-family:var(--disp);font-size:clamp(30px,4.4vw,58px);font-weight:800;margin-top:8px;letter-spacing:-.01em}
  ul.pts{list-style:none;margin-top:34px;max-width:40ch}
  ul.pts li{position:relative;padding-left:36px;margin-bottom:22px;font-size:clamp(17px,1.9vw,23px);
    line-height:1.42;color:var(--ink)}
  ul.pts li::before{content:'';position:absolute;left:0;top:.6em;width:16px;height:3px;background:var(--accent);border-radius:2px}
  .pill-row{display:flex;align-items:baseline;gap:22px;margin-top:6px}
  .pnum{font-family:var(--disp);font-size:clamp(40px,7vw,92px);font-weight:900;color:var(--accent);line-height:1;letter-spacing:-.03em}
  .pname{font-family:var(--disp);font-size:clamp(26px,3.6vw,46px);font-weight:800;letter-spacing:-.01em}
  .ptag{font-family:var(--disp);font-size:14px;font-weight:800;letter-spacing:.2em;text-transform:uppercase;color:var(--accent-2)}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;padding:34px 36px;margin-top:30px;max-width:40ch;box-shadow:0 18px 44px rgba(12,34,51,.06)}
  .card .lead{margin-top:14px}
  .steps{display:flex;flex-direction:column;gap:16px;margin-top:34px;max-width:36ch}
  .step{display:flex;align-items:center;gap:18px;font-family:var(--disp);font-weight:700;font-size:clamp(18px,2.1vw,26px)}
  .dot{flex-shrink:0;width:14px;height:14px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 5px var(--soft)}
  .arrow{color:var(--accent);font-weight:900;font-family:var(--disp)}
  .why-stats{display:flex;flex-wrap:wrap;gap:40px;margin-top:40px}
  .stat .n{font-family:var(--disp);font-size:clamp(34px,5vw,64px);font-weight:900;color:var(--accent);line-height:1;letter-spacing:-.02em}
  .stat .l{font-size:15px;color:var(--muted);margin-top:10px;font-weight:600;letter-spacing:.02em}
  .disc{font-size:14px;color:var(--muted);margin-top:38px;max-width:52ch;line-height:1.55;font-style:italic}
  .cta-line{font-family:var(--disp);display:inline-block;margin-top:34px;padding:16px 30px;border-radius:100px;
    background:var(--accent);color:#fff;font-weight:800;font-size:clamp(18px,2vw,24px);letter-spacing:.01em}
  .nav{position:fixed;right:20px;bottom:18px;font-family:var(--disp);font-size:12px;font-weight:700;letter-spacing:.14em;
    text-transform:uppercase;color:var(--muted);background:rgba(255,255,255,.82);padding:8px 14px;border-radius:100px;border:1px solid var(--rule)}
  @media(max-width:640px){section.slide{padding:7vh 8vw}.why-stats{gap:26px}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<div class="nav" id="nav"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass', h:'The Rejection-Proof Applicant',
    sub:'How pre-PT students get accepted to physical therapy school, even after a no.',
    who:'Dr. Joses Ngugi, DPT', org:'Pre-PT Grind' },

  {t:'promise', kick:'What you will leave with', h:'One hour. Three things that change your application.',
    pts:['Exactly why strong applications still get rejected',
         'The 3 moves that make yours rejection-proof',
         'A clear next step whether you are applying or reapplying'] },

  {t:'who', kick:'Who this is for', h:'This is for you if...',
    pts:['You are applying to DPT programs this cycle or the next',
         'You have been waitlisted or rejected before',
         'Your GPA is below the number you think you need',
         'You are tired of generic "just get more hours" advice'] },

  {t:'trap', kick:'The trap', h:'You think the problem is your <span class="em">GPA</span>.',
    lead:'So you retake classes, pile on more observation hours, and apply to more schools. And the answer comes back the same.' },

  {t:'reframe', kick:'The reframe', big:'A rejection is not a verdict on you. It is a gap in your <span class="em">application strategy</span>.',
    sub:'And strategy is something you can fix before the next deadline.' },

  {t:'cost', kick:'What a lost cycle costs', h:'A "no" is not just a no.',
    lead:'It is another year, another application fee stack, and the slow belief that maybe this is not for you. That belief is the real thing we are here to stop.' },

  {t:'part', no:'01', label:'Why strong students still get rejected' },

  {t:'problem', kick:'Part one', h:'They apply like <span class="em">everyone else</span>.',
    lead:'Committees read thousands of files that blur together. The same safe personal statement, the same reach-heavy school list, a low grade left unexplained. Strong students get lost in the sameness, not beaten by the competition.' },

  {t:'myth', kick:'The 3.0 myth', h:'Below a 3.0 is not the end.',
    lead:'We have watched students with sub-3.0 GPAs get accepted, and students with high GPAs get rejected. The transcript is one input. What you do with the rest of the application is the difference.' },

  {t:'part', no:'02', label:'The Accepted System' },

  {t:'pillar', no:'1', tag:'Phase one', name:'Clarity',
    pts:['Set a real application timeline instead of scrambling at the deadline',
         'Build a school list matched to your actual profile, not a wish list',
         'Get honest about where you stand so every move after this counts'] },

  {t:'pillar', no:'2', tag:'Phase two', name:'Confidence',
    pts:['Write a personal statement that reads like a person, not a template',
         'Line up references who vouch for you, not just praise you',
         'Explain a low grade instead of hoping no one notices it',
         'Know what admissions committees actually screen for'] },

  {t:'pillar', no:'3', tag:'Phase three', name:'Control',
    pts:['Choose schools strategically, aligned to the career you want',
         'Plan for undergraduate and graduate loans before you commit',
         'Walk into decision season knowing the acceptance is survivable'] },

  {t:'recap', kick:'The system, together', h:'<span class="em">Clarity.</span> <span class="em">Confidence.</span> <span class="em">Control.</span>',
    lead:'Stop applying blind. Build an application that holds up. Say yes to the right school on your terms. Three phases, one accepted applicant.' },

  {t:'part', no:'03', label:'What an accepted applicant looks like' },

  {t:'journey', kick:'The path', h:'From stalled to accepted.',
    steps:['Stalled and unsure','Clear plan','Application that stands out','Accepted'] },

  {t:'why', kick:'Why listen to me', h:'I built this after living it.',
    lead:'I am Dr. Joses Ngugi. I earned my DPT and built Pre-PT Grind into the resource I wish I had, guiding students through the same application I once sweated over.',
    stats:[['92%','First-time acceptance rate'],['100K+','Podcast downloads'],['20K+','Students on the newsletter']],
    note:'Acceptance figures are Pre-PT Grind’s reported program results.' },

  {t:'cta', kick:'Your next step', h:'Ready to make your application rejection-proof?',
    lead:'The Accepted System is my apply-with-you program: the coaching, tools, and accountability to build an application that gets in. If you are ready, the next step is a short fit conversation.',
    button:'Apply to The Accepted System',
    disc:'This masterclass is educational. It does not guarantee admission to any program, and individual results vary based on each student’s effort, background, and circumstances.' }
];

function pts(a){ return '<ul class="pts">'+a.map(x=>'<li>'+x+'</li>').join('')+'</ul>'; }

function render(s){
  switch(s.t){
    case 'title': return `<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="sub">${s.sub}</div>
      <div class="presenter">${s.who}<span>${s.org}</span></div>`;
    case 'promise': return `<div class="kick">${s.kick}</div><h2>${s.h}</h2>${pts(s.pts)}`;
    case 'who': return `<div class="kick">${s.kick}</div><h2>${s.h}</h2>${pts(s.pts)}`;
    case 'trap': return `<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="lead">${s.lead}</div>`;
    case 'reframe': return `<div class="kick">${s.kick}</div><div class="big">${s.big}</div><div class="sub">${s.sub}</div>`;
    case 'cost': return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="lead">${s.lead}</div>`;
    case 'part': return `<div class="partno">${s.no}</div><div class="partlabel">${s.label}</div>`;
    case 'problem': return `<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="lead">${s.lead}</div>`;
    case 'myth': return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="lead">${s.lead}</div>`;
    case 'pillar': return `<div class="ptag">${s.tag}</div><div class="pill-row"><span class="pnum">${s.no}</span><span class="pname">${s.name}</span></div>${pts(s.pts)}`;
    case 'recap': return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="lead">${s.lead}</div>`;
    case 'journey': {
      const steps = s.steps.map((x,i)=>`<div class="step"><span class="dot"></span>${x}</div>`+(i<s.steps.length-1?'<div class="step"><span class="arrow" style="padding-left:5px">&darr;</span></div>':'')).join('');
      return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="steps">${steps}</div>`;
    }
    case 'why': {
      const st = s.stats.map(x=>`<div class="stat"><div class="n">${x[0]}</div><div class="l">${x[1]}</div></div>`).join('');
      return `<div class="kick">${s.kick}</div><h2>${s.h}</h2><div class="lead">${s.lead}</div><div class="why-stats">${st}</div><div class="disc">${s.note}</div>`;
    }
    case 'cta': return `<div class="kick">${s.kick}</div><h1>${s.h}</h1><div class="lead">${s.lead}</div><div><span class="cta-line">${s.button}</span></div><div class="disc">${s.disc}</div>`;
  }
  return '';
}

const deck = document.getElementById('deck');
S.forEach(s=>{ const sec=document.createElement('section'); sec.className='slide'; sec.innerHTML=render(s); deck.appendChild(sec); });

const nav = document.getElementById('nav');
const slides = [...document.querySelectorAll('.slide')];
function upd(){ let i=Math.round(deck.scrollTop/window.innerHeight); nav.textContent=(i+1)+' / '+slides.length; }
deck.addEventListener('scroll',upd); upd();
document.addEventListener('keydown',e=>{
  if(e.key==='ArrowDown'||e.key==='PageDown'||e.key===' '){e.preventDefault();deck.scrollBy({top:window.innerHeight,behavior:'smooth'});}
  if(e.key==='ArrowUp'||e.key==='PageUp'){e.preventDefault();deck.scrollBy({top:-window.innerHeight,behavior:'smooth'});}
});
</script>
</body>
</html>
