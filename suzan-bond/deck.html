<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org Debt — A Masterclass with Suzan Bond, Constellary</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e1526; --panel:#161f36; --rule:#273350;
    --ink:#f5f7fb; --muted:#aeb8cc;
    --accent:#f7a828; --accent2:#8ce0ed;
    --head:'Poppins',sans-serif; --body:'Source Sans 3',system-ui,sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#070b14;color:var(--ink);font-family:var(--body);-webkit-font-smoothing:antialiased;padding:40px 16px}
  .deck{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:30px}
  .slide{
    position:relative;background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:70px 76px;min-height:540px;display:flex;flex-direction:column;justify-content:center;
    overflow:hidden;
  }
  .slide::before{
    content:'';position:absolute;inset:0;pointer-events:none;
    background:
      radial-gradient(1px 1px at 18% 24%, var(--accent2) 50%, transparent 52%),
      radial-gradient(1px 1px at 72% 16%, var(--accent) 50%, transparent 52%),
      radial-gradient(1px 1px at 86% 62%, var(--accent2) 50%, transparent 52%),
      radial-gradient(1px 1px at 34% 78%, var(--accent) 50%, transparent 52%);
    opacity:.5;
  }
  .slide>*{position:relative;z-index:1}
  .kick{font-family:var(--head);font-weight:700;font-size:14px;letter-spacing:.24em;text-transform:uppercase;color:var(--accent);margin-bottom:26px}
  h1{font-family:var(--head);font-weight:700;font-size:58px;line-height:1.05;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:40px;line-height:1.12;letter-spacing:-.01em}
  h1 .a,h2 .a{color:var(--accent)}
  h1 .b,h2 .b{color:var(--accent2)}
  .lead{font-size:24px;line-height:1.5;color:var(--muted);margin-top:24px;max-width:40ch}
  .body{font-size:21px;line-height:1.6;color:var(--ink);margin-top:22px;max-width:52ch}
  ul{list-style:none;margin-top:30px;display:flex;flex-direction:column;gap:18px;max-width:58ch}
  li{position:relative;padding-left:40px;font-size:21px;line-height:1.45}
  li::before{content:'';position:absolute;left:0;top:9px;width:14px;height:14px;border-radius:50%;
    border:2px solid var(--accent);box-shadow:0 0 0 4px rgba(247,168,40,.12)}
  li b{color:var(--accent)}
  .grid{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 28px}
  .card .t{font-family:var(--head);font-weight:600;font-size:22px;color:var(--ink)}
  .card .d{font-size:17px;line-height:1.5;color:var(--muted);margin-top:10px}
  .two{margin-top:34px;display:grid;grid-template-columns:1fr 1fr;gap:26px}
  .two .col .h{font-family:var(--head);font-weight:600;font-size:19px;letter-spacing:.04em;margin-bottom:14px}
  .two .col.f .h{color:var(--muted)} .two .col.o .h{color:var(--accent)}
  .two .col p{font-size:19px;line-height:1.5;color:var(--muted)}
  .partnum{font-family:var(--head);font-weight:700;font-size:150px;line-height:.9;color:transparent;-webkit-text-stroke:2px var(--accent);opacity:.9}
  .companies{margin-top:28px;font-size:19px;line-height:1.9;color:var(--muted)}
  .companies b{color:var(--ink);font-weight:600}
  .disc{margin-top:30px;font-size:14px;line-height:1.5;color:#6f7b92;max-width:60ch}
  .cta-row{margin-top:30px;font-family:var(--head);font-weight:600;font-size:22px;color:var(--bg);background:var(--accent);
    display:inline-block;padding:16px 30px;border-radius:100px}
  .foot{position:absolute;bottom:26px;left:76px;right:76px;display:flex;justify-content:space-between;
    font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#5c6882;z-index:1}
  @media(max-width:720px){.slide{padding:48px 34px}h1{font-size:40px}h2{font-size:30px}.grid,.two{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title',
    kick:'A live masterclass with Suzan Bond · Constellary',
    h:'Org Debt: the hidden tax on your <span class="a">scaling org</span>.',
    lead:'Why everything feels harder than it should as you grow, and how to pay it down. From a former COO.'},

  {t:'promise',
    kick:'What you will leave with',
    h:'A new name for an <span class="a">old friction</span>.',
    items:[
      'A word for the drag you have been feeling, and why it is not your fault.',
      'A way to see where it is piling up in your own org.',
      'The first debt worth paying down, and how to start.']},

  {t:'who',
    kick:'Who this is for',
    h:'You lead at a <span class="a">scaling startup</span>.',
    body:'You are a director, a VP, a founder, or a leadership team. Your span of responsibility keeps growing. The work keeps getting heavier, and you cannot always say why.'},

  {t:'trap',
    kick:'The feeling',
    h:'The org feels like a <span class="b">collection of functions</span>.',
    body:'Decisions take three meetings. Good people step on each other. Everything runs through you. Most leaders read this as a culture problem, or quietly decide it is them.'},

  {t:'reframe',
    kick:'The reframe',
    h:'It is not a culture problem. It is <span class="a">org debt</span>.',
    lead:'Organizations accumulate debt the way engineering teams accumulate tech debt: quietly, invisibly, until it taxes every decision you make.'},

  {t:'analogy',
    kick:'Why the word matters',
    h:'Tech debt, but for <span class="a">how you run</span>.',
    body:'Nobody blames the engineer for inheriting tech debt. They name it, make it visible, and pay it down on purpose. Org debt deserves the same treatment, and almost never gets it.'},

  {t:'part', num:'01', kick:'Part one', h:'How the debt <span class="a">piles up</span>.'},

  {t:'list',
    kick:'What org debt is made of',
    h:'The debts nobody <span class="a">wrote down</span>.',
    items:[
      '<b>Decisions nobody re-made</b> when the context changed.',
      '<b>Roles that blur</b> as headcount doubles and ownership gets fuzzy.',
      '<b>Feedback loops that went quiet,</b> so leaders fly half blind.',
      '<b>The work between functions,</b> owned by no one, felt by everyone.']},

  {t:'part', num:'02', kick:'Part two', h:'Two jobs, one <span class="a">title</span>.'},

  {t:'two',
    kick:'Leadership domains',
    h:'Functional vs <span class="a">organizational</span> leadership.',
    f:{h:'FUNCTIONAL LEADERSHIP', p:'Running your function well. The skill that got you promoted. Deep, vertical, yours.'},
    o:{h:'ORGANIZATIONAL LEADERSHIP', p:'Leading across the whole org. Influence, partnership, the connective tissue between functions. A different job.'}},

  {t:'std',
    kick:'The leap',
    h:'The shift most directors <span class="b">never get coached through</span>.',
    body:'Nobody tells a strong functional leader that the next level is a different game. So they work harder at the old one. That gap is where org debt compounds fastest.'},

  {t:'list',
    kick:'The Org Debt Audit',
    h:'First, make the debt <span class="a">visible</span>.',
    body:'You cannot pay down what you cannot see. The Org Debt Audit surfaces the accumulated debts and shows you where to focus first.',
    items:[
      'Name the debts that are actually taxing performance.',
      'Rank them by drag, not by how loud they are.',
      'Pick the one or two worth paying down this quarter.']},

  {t:'std',
    kick:'Leadership Archetypes',
    h:'There is no <span class="a">one right way</span> to lead.',
    body:'Most leaders try to copy a leader they admire and wonder why it feels like a costume. The Leadership Archetypes help you lead from your natural way, and partner better across a leadership team that does not lead like you.'},

  {t:'grid',
    kick:'The leadership competencies',
    h:'The muscles org leaders <span class="a">build</span>.',
    cards:[
      {t:'Gaining influence', d:'Moving work across an org you do not control.'},
      {t:'Strong partnerships', d:'Leading peers, not just reports.'},
      {t:'Navigating conflict', d:'Turning friction into decisions.'},
      {t:'Feedback foundations', d:'Loops and rubrics so you stop flying blind.'}]},

  {t:'part', num:'03', kick:'Part three', h:'When you <span class="a">pay it down</span>.'},

  {t:'two',
    kick:'Before and after',
    h:'Same org, <span class="a">less drag</span>.',
    f:{h:'CARRYING THE DEBT', p:'Decisions stall. Leaders overlap. Everything escalates to you. Growth makes it worse.'},
    o:{h:'PAYING IT DOWN', p:'Ownership is clear. Peers lead across. Feedback flows without you. Growth gets lighter, not heavier.'}},

  {t:'team',
    kick:'For the leadership team',
    h:'A team that leads <span class="a">in partnership</span>.',
    body:'When a leadership team knows its archetypes and shares the same map of the org debt, it stops competing and starts covering for each other. That is where the biggest paydowns happen.'},

  {t:'why',
    kick:'Why listen to me',
    h:'I have been the one <span class="a">carrying it</span>.',
    body:'I am Suzan Bond, a former COO with 20+ years in tech, a certified executive coach, and the creator of Leadership Archetypes. I have led teams through acquisitions, restructures, and scaling, and I coach the leaders doing it now.',
    companies:'Worked with leaders at <b>Alloy</b>, <b>CircleCI</b>, <b>Griffin</b>, <b>Gymshark</b>, <b>Puppet</b>, <b>StackHawk</b>, and <b>Taxbit</b>.'},

  {t:'recap',
    kick:'The path',
    h:'Name it. Rank it. <span class="a">Pay it down</span>.',
    items:[
      'See the org debt the Audit surfaces.',
      'Lead the whole org, not just your function.',
      'Lead from your archetype, and build the competencies that carry you.']},

  {t:'cta',
    kick:'Your next step',
    h:'Ready to see your <span class="a">org debt</span>?',
    body:'If you want to find where the debt is piling up in your org and build the plan to pay it down, let us have a conversation.',
    cta:'Connect with Suzan at constellaryhq.com',
    disc:'This masterclass is educational. It describes an approach to organizational leadership and no specific result is guaranteed. Results vary by organization and leader.'},
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide';
  let inner = '';
  if (s.kick) inner += `<div class="kick">${s.kick}</div>`;
  if (s.t === 'part') {
    inner += `<div class="partnum">${s.num}</div><h1 style="margin-top:18px">${s.h}</h1>`;
  } else if (s.t === 'title') {
    inner += `<h1>${s.h}</h1>` + (s.lead ? `<div class="lead">${s.lead}</div>` : '');
  } else {
    inner += `<h2>${s.h}</h2>`;
  }
  if (s.lead && s.t !== 'title') inner += `<div class="lead">${s.lead}</div>`;
  if (s.body) inner += `<div class="body">${s.body}</div>`;
  if (s.items) inner += '<ul>' + s.items.map(x => `<li>${x}</li>`).join('') + '</ul>';
  if (s.cards) inner += '<div class="grid">' + s.cards.map(c => `<div class="card"><div class="t">${c.t}</div><div class="d">${c.d}</div></div>`).join('') + '</div>';
  if (s.f && s.o) inner += `<div class="two"><div class="col f"><div class="h">${s.f.h}</div><p>${s.f.p}</p></div><div class="col o"><div class="h">${s.o.h}</div><p>${s.o.p}</p></div></div>`;
  if (s.companies) inner += `<div class="companies">${s.companies}</div>`;
  if (s.cta) inner += `<div class="cta-row">${s.cta}</div>`;
  if (s.disc) inner += `<div class="disc">${s.disc}</div>`;
  inner += `<div class="foot"><span>Constellary</span><span>${String(i+1).padStart(2,'0')} / ${String(S.length).padStart(2,'0')}</span></div>`;
  el.innerHTML = inner;
  deck.appendChild(el);
});
</script>
</body>
</html>
