<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leadership at the Dinner Table, a live masterclass with Ed Clementi</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0e0c08;
    --panel:#17130c;
    --rule:#3a3222;
    --accent:#f2d68a;
    --ink:#f3eee4;
    --muted:#a6a096;
    --display:'Fraunces',Georgia,serif;
    --body:'Inter',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{max-width:1040px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:64px 60px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent);opacity:.9}
  .eyebrow{font-size:.78rem;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);font-weight:600;margin-bottom:22px}
  h1{font-family:var(--display);font-weight:700;font-size:3.2rem;line-height:1.05;letter-spacing:-.01em;margin-bottom:20px}
  h2{font-family:var(--display);font-weight:600;font-size:2.2rem;line-height:1.1;margin-bottom:18px}
  .lead{font-size:1.35rem;color:var(--ink);max-width:40ch}
  .sub{font-size:1.15rem;color:var(--muted);max-width:52ch;margin-top:10px}
  p.body{font-size:1.15rem;color:var(--ink);max-width:54ch;margin-top:14px}
  .tag{font-family:var(--display);font-size:1.1rem;color:var(--accent);margin-bottom:10px;font-weight:600}
  ul{list-style:none;margin-top:18px}
  li{font-size:1.2rem;padding:12px 0;border-top:1px solid var(--rule);display:flex;gap:16px;align-items:baseline}
  li:first-child{border-top:none}
  li .n{font-family:var(--display);color:var(--accent);font-weight:700;font-size:1.2rem;min-width:1.4em}
  li .txt{color:var(--ink)}
  li .txt b{color:var(--accent);font-weight:600}
  .big{font-family:var(--display);font-weight:700;font-size:2.7rem;line-height:1.1;max-width:22ch}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:28px;margin-top:22px}
  .col{background:var(--bg);border:1px solid var(--rule);border-radius:10px;padding:24px}
  .col h3{font-family:var(--display);font-size:1.15rem;margin-bottom:12px;color:var(--accent)}
  .col p{color:var(--muted);font-size:1.02rem}
  .foot{position:absolute;bottom:20px;right:28px;font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--rule)}
  .disclaimer{margin-top:22px;font-size:.82rem;color:var(--muted);max-width:60ch}
  .cta-line{font-size:1.3rem;color:var(--ink);margin-top:14px}
  .brandmark{font-family:var(--display);font-weight:600;color:var(--accent)}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<p class="disclaimer" style="max-width:1040px;margin:0 auto 40px;padding:0 20px">This masterclass is for educational purposes only and is not financial, legal, or career advice. No income or specific result is guaranteed. Results vary by leader and organization.</p>
<script>
const S=[
  {t:'title',eyebrow:'A live masterclass with Ed Clementi',h1:'Leadership at the Dinner Table',sub:'How to lead like a coach, at work and at home, and watch it show up on the bottom line.'},
  {t:'section',tag:'Who this is for',h2:'For senior leaders, and the people rising into it.',body:'If you run a team, a function, or a company, and you have ever felt the weight of it follow you out the door, this hour is for you.'},
  {t:'section',tag:'What we will cover',h2:'One hour, one shift.',body:'Why your strongest people disengage before they quit. The five behaviors that turn a manager into a coach. And why the way you lead at work never really stays at work.'},
  {t:'section',tag:'The trap',h2:'You learned to lead by being the smartest person in the room.',body:'It got you promoted. Then one day the job stopped being about having the answers, and started being about growing the people who do. Most leaders never make that switch.'},
  {t:'reframe',big:'Leadership doesn’t stay at the office. It comes home. And it shows up on your bottom line.'},
  {t:'section',tag:'Part One: the real problem',h2:'The manager who stopped coaching.',body:'When a leader goes hands-off, people do not say anything. They just quietly stop bringing their best. The best ones have already left in their heads long before they ever give notice.'},
  {t:'section',tag:'The invisible resignation',h2:'By the time they tell you, it is already over.',body:'Nobody schedules a meeting to say they have checked out. It shows up as a little less initiative, a little less candor, a little less of them. You were never going to see it on a dashboard.'},
  {t:'section',tag:'The cost',h2:'Disengagement is invisible until it is expensive.',body:'It leaks out as missed potential, turnover of exactly the people you cannot afford to lose, and a culture that performs for you but not with you. You feel it long before you can measure it.'},
  {t:'section',tag:'Part Two: the method',h2:'Be a coach.',body:'A coaching leader has one job: understand each person’s potential and guide them toward it. Be their biggest advocate. It runs on five behaviors, and it all starts with leading from an authentic and caring heart.'},
  {t:'list',tag:'The Coach Method',h2:'Five behaviors.',items:[
    {n:'1',b:'Listen.',txt:'Actually hear your people, not wait for your turn to talk. Understanding starts here.'},
    {n:'2',b:'Understand.',txt:'Grasp what each person is actually capable of, which is almost always more than they show you.'},
    {n:'3',b:'Inspire.',txt:'Move them past their own comfort zone, toward the version of themselves they cannot quite see yet.'},
    {n:'4',b:'Teach.',txt:'Equip them with the tools and the thinking. Do not just assign the outcome and walk away.'},
    {n:'5',b:'Guide.',txt:'Stay right there with them, showing the way, instead of saying figure it out yourself.'}
  ]},
  {t:'reframe',big:'Lead with an authentic and caring heart, and most of the rest falls into place on its own.'},
  {t:'two',tag:'The difference',h2:'Two leaders, same team.',cols:[
    {h3:'The manager',p:'That is not my job. You need to figure it out yourself. Hits the number this quarter, and loses the people who could have hit it next quarter.'},
    {h3:'The coach',p:'Teaching, guiding, showing them the way. Builds people who outgrow the role you hired them for, and trust that outlasts any one quarter.'}
  ]},
  {t:'section',tag:'Hire like a coach too',h2:'Stop hiring dumb.',body:'The same fear that makes a leader command instead of coach makes them hire safe: the credential that matches, the resume that will not get questioned. The braver move, and the better one, is to hire great humans for their potential.'},
  {t:'section',tag:'Part Three: make it real',h2:'Leadership risk, made measurable.',body:'Most leaders treat culture as a feeling. It is not. With AxioLead I help organizations see leadership the way they see every other risk: clearly, honestly, and early enough to do something about it.'},
  {t:'section',tag:'What changes',h2:'When coaching becomes how you lead.',body:'People bring you problems earlier, because it is safe to. Your best stay longer, because they are still growing. And you stop carrying the whole weight home, because you are building leaders instead of babysitting tasks.'},
  {t:'section',tag:'The part nobody teaches',h2:'It works at the dinner table too.',body:'The way you lead at work is the way you show up at home, and the reverse is just as true. Learn to coach instead of command, and it does not stop when you walk in your own door. That is the whole point.'},
  {t:'section',tag:'Why me',h2:'I spent 25 years learning this the hard way.',body:'I started as an executive assistant and rose to Managing Director and Global Head at two of the world’s largest banks. I now write The FireStarter, host the Totally Unacceptable podcast, and advise boards and C-suites on the leadership behavior that drives performance, retention, and culture.'},
  {t:'section',tag:'The one idea to keep',h2:'Your people do not need a smarter boss. They need a leader who coaches.',body:'Listen, understand, inspire, teach, guide. Five behaviors, one authentic and caring heart, and a way of leading that finally stops costing you at work and at home.'},
  {t:'cta',eyebrow:'Your next step',h1:'Let’s talk about your leadership.',ctaline:'If this landed, start a conversation with me about working together. We will look at where leadership risk is hiding in your organization and what it is quietly costing you.',brand:'The FireStarter, by Ed Clementi',disclaimer:'This masterclass is for educational purposes only and is not financial, legal, or career advice. No income or specific result is guaranteed. Results vary by leader and organization.'}
];
const deck=document.getElementById('deck');
function slide(inner,foot){return '<section class="slide">'+inner+'<span class="foot">'+foot+'</span></section>';}
let out='';
S.forEach((s,i)=>{
  let n='Ed Clementi';
  if(s.t==='title'){out+=slide('<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.h1+'</h1><p class="sub">'+s.sub+'</p>',n);}
  else if(s.t==='section'){out+=slide('<div class="tag">'+s.tag+'</div><h2>'+s.h2+'</h2><p class="body">'+s.body+'</p>',n);}
  else if(s.t==='reframe'){out+=slide('<div class="big">'+s.big+'</div>',n);}
  else if(s.t==='list'){let li=s.items.map(it=>'<li><span class="n">'+it.n+'</span><span class="txt"><b>'+it.b+'</b> '+it.txt+'</span></li>').join('');out+=slide('<div class="tag">'+s.tag+'</div><h2>'+s.h2+'</h2><ul>'+li+'</ul>',n);}
  else if(s.t==='two'){let c=s.cols.map(col=>'<div class="col"><h3>'+col.h3+'</h3><p>'+col.p+'</p></div>').join('');out+=slide('<div class="tag">'+s.tag+'</div><h2>'+s.h2+'</h2><div class="two">'+c+'</div>',n);}
  else if(s.t==='cta'){out+=slide('<div class="eyebrow">'+s.eyebrow+'</div><h1>'+s.h1+'</h1><p class="cta-line">'+s.ctaline+'</p><p class="disclaimer">'+s.disclaimer+'</p><p class="tag" style="margin-top:20px">'+s.brand+'</p>',n);}
});
deck.innerHTML=out;
</script>
</body>
</html>
