<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Healing from Affairs — A Masterclass with Anne &amp; Brian Bercht</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#fafaf8;        /* brand near-white ground (extract_brand) */
    --panel:#f3ecef;     /* faint mauve-tinted off-white (derived from accent) */
    --rule:#e4d6dd;      /* muted mauve-grey hairline */
    --ink:#2c2530;       /* soft near-black plum */
    --muted:#6f6472;     /* muted plum-grey */
    --accent:#bb6a95;    /* brand mauve-rose (extract_brand, 6 uses) */
    --head:'Cormorant Garamond',Georgia,serif;
    --body:'Montserrat',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body);line-height:1.5}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:54px 56px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin-bottom:18px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,5vw,58px);line-height:1.05;
    letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:600;font-size:clamp(28px,3.6vw,42px);line-height:1.1}
  .sub{font-family:var(--head);font-weight:500;font-size:clamp(20px,2.4vw,27px);color:var(--muted);
    margin-top:20px;font-style:italic}
  p.body{font-size:17px;color:var(--ink);margin-top:20px;max-width:62ch}
  p.lead{font-size:20px;color:var(--ink);margin-top:20px;max-width:60ch}
  .big{font-family:var(--head);font-weight:600;font-size:clamp(26px,3.2vw,38px);line-height:1.18;
    max-width:24ch}
  ul.pts{margin:24px 0 0 0;list-style:none;max-width:60ch}
  ul.pts li{position:relative;padding:12px 0 12px 30px;border-top:1px solid var(--rule);font-size:17px}
  ul.pts li:first-child{border-top:none}
  ul.pts li::before{content:"";position:absolute;left:0;top:19px;width:10px;height:10px;
    border-radius:50%;background:var(--accent)}
  .num{font-family:var(--head);font-size:15px;color:var(--accent);font-weight:600;margin-bottom:10px;
    letter-spacing:.08em}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:26px 28px;margin-top:22px}
  .strike{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--accent)}
  .accent{color:var(--accent)}
  .foot{position:absolute;right:26px;bottom:18px;font-size:11px;letter-spacing:.12em;
    text-transform:uppercase;color:var(--muted)}
  .disc{font-size:13px;color:var(--muted);margin-top:26px;max-width:66ch;line-height:1.5}
  .pagecount{text-align:center;color:var(--muted);font-size:12px;letter-spacing:.14em;
    text-transform:uppercase;margin:6px 0 30px}
  .cta-steps{margin-top:22px;display:grid;gap:12px;max-width:52ch}
  .cta-steps div{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px 20px;font-size:17px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A Beyond Affairs Masterclass', h:'How an Affair Can Become the Turning Point',
   sub:'With Anne & Brian Bercht, married 44 years, recovered from infidelity and helping couples do the same for 20+ years.'},

  {t:'promise', kick:'What this hour is for', h:'You will leave with a clear picture of the path forward.',
   pts:['Why the couples who recover strongest are not the ones who move on fastest',
        'The first steps that actually rebuild trust, and the ones that quietly make things worse',
        'What a structured recovery looks like, and where to begin yours']},

  {t:'who', kick:'Who this is for', big:'You still love them. You just do not know yet if you can trust again.',
   body:'If you are the betrayed spouse, the one who strayed, or a couple trying to decide whether there is a way back, this hour is for you. You do not have to have it figured out to begin.'},

  {t:'trap', kick:'The trap', h:'Most couples try to survive the affair.',
   body:'They want the pain to stop, so they rush to move on, bury it, or promise it will never come up again. It comes back anyway, through the triggers, the 2am questions, and the silence. Surviving is not the same as healing.'},

  {t:'reframe', kick:'A harder, truer idea', big:'Surviving the affair is not the goal. Rebuilding something stronger is.',
   body:'This is the single idea that changed everything for us. An affair, worked through honestly, can become the turning point to a marriage that is more honest, more connected, and more alive than the one you had before.'},

  {t:'part', num:'Part One', h:'The core problem: why healing stalls.'},

  {t:'myths', kick:'What slows couples down', h:'The myths about affair recovery.',
   pts:['"If we really loved each other, we would just get past this."',
        '"Talking about it keeps the wound open." (Avoiding it does.)',
        '"Time heals." (Time plus the right work heals.)',
        '"A strong marriage never would have let this happen."']},

  {t:'ninety', kick:'The most volatile phase', h:'The first 90 days after you find out.',
   body:'This is when the most damage, and the most healing, happens. The betrayed spouse needs the truth and safety. The spouse who strayed needs to understand that rebuilding trust is earned in small, repeated, concrete ways, not won back in a single conversation.'},

  {t:'part', num:'Part Two', h:'The Healing from Affairs roadmap.'},

  {t:'pillar', num:'Pillar One', h:'Honest conversations, held safely.',
   body:'The questions do not go away because you avoid them. We teach couples how to have the hard conversations in a way that moves healing forward instead of restarting the fight, so honesty stops feeling like a weapon and starts feeling like a bridge.'},

  {t:'pillar', num:'Pillar Two', h:'Rebuilding trust, step by step.',
   body:'Trust is not a switch. It is rebuilt through transparency, consistency, and small kept promises over time. We show you what earns it back and what quietly erodes it, so both of you can see progress instead of guessing at it.'},

  {t:'pillar', num:'Pillar Three', h:'A shared plan you both believe in.',
   body:'Recovery works when both people are walking the same path on purpose. We help you build a plan for your marriage that you both actually believe in, so you are rebuilding together instead of each bracing for the next blow.'},

  {t:'pillar', num:'Pillar Four', h:'A team of mentoring couples beside you.',
   body:'You are not the first couple to walk through this, and you do not have to walk it alone. The Beyond Affairs approach pairs you with mentoring couples who have come through infidelity themselves. Lived experience, not a clinical office, is what makes the difference.'},

  {t:'part', num:'Part Three', h:'What recovery actually looks like.'},

  {t:'intensive', kick:'The 3-day intensive', h:'Three days, one path forward.',
   pts:['Day one: honesty, held in a safe and structured setting',
        'Day two: the practical work of rebuilding trust',
        'Day three: a plan you both believe in, and a community that stays']},

  {t:'women', kick:'For the betrayed spouse', h:'Take your life back.',
   body:'Part of healing is reclaiming who you are. Healing past hurts, processing anger in healthy ways, and rediscovering your own identity, worth, and strength are not separate from saving the marriage. They are what make the marriage worth saving.'},

  {t:'why', kick:'Why us', h:'We have walked both sides of this.',
   body:'Brian had the affair. Anne chose to stay and rebuild. More than four decades of marriage later, and after personally coaching thousands of individuals and couples, we wrote the book, built the retreats, and founded an international support network, all on one belief: healing and transformation are possible even after profound betrayal.'},

  {t:'possible', kick:'What becomes possible', big:'The world becomes a better place when children are raised by parents who genuinely love each other.',
   body:'That is what is really at stake, and it is why this work matters. A marriage that heals does not just survive. It becomes a stronger foundation than it ever was.'},

  {t:'cta', kick:'Where to begin', h:'Take the first step today.',
   steps:['Book a call with us to talk through where you both are, with no pressure and no judgment.',
          'Together we decide whether a Healing from Affairs retreat or intensive is the right next step for you.',
          'You begin rebuilding, with a clear plan and people who have lived it beside you.'],
   disc:'Educational information only. Every marriage and situation is different; recovery outcomes vary and are not guaranteed. Beyond Affairs provides coaching and educational programs, not therapy or medical treatment.'}
];

const deck = document.getElementById('deck');
function esc(x){return x;}
S.forEach((s,i)=>{
  const el=document.createElement('section'); el.className='slide';
  let h='';
  if(s.kick) h+=`<div class="kick">${s.kick}</div>`;
  if(s.num) h+=`<div class="num">${s.num}</div>`;
  if(s.h) h+= (s.t==='title'? `<h1>${s.h}</h1>` : `<h2>${s.h}</h2>`);
  if(s.big) h+=`<div class="big">${s.big}</div>`;
  if(s.sub) h+=`<div class="sub">${s.sub}</div>`;
  if(s.lead) h+=`<p class="lead">${s.lead}</p>`;
  if(s.body) h+=`<p class="body">${s.body}</p>`;
  if(s.pts){h+='<ul class="pts">'+s.pts.map(p=>`<li>${p}</li>`).join('')+'</ul>';}
  if(s.steps){h+='<div class="cta-steps">'+s.steps.map(p=>`<div>${p}</div>`).join('')+'</div>';}
  if(s.disc) h+=`<p class="disc">${s.disc}</p>`;
  h+=`<div class="foot">Beyond Affairs &middot; Healing from Affairs</div>`;
  el.innerHTML=h; deck.appendChild(el);
});
const pc=document.createElement('div'); pc.className='pagecount';
pc.textContent=S.length+' slides'; deck.appendChild(pc);
</script>
</body>
</html>
