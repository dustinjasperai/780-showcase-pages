<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex,nofollow">
<title>The Only One in the Room: a masterclass with Niiamah Ashong</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
  :root {
    --bg: #14181f;
    --panel: #1b212b;
    --rule: #2b333f;
    --ink: #f2ede3;
    --ink-soft: #c3c9d4;
    --ink-muted: #8b93a2;
    --accent: #f2a20c;
    --accent-soft: #f7c05a;
  }
  html, body { height:100%; }
  body {
    background:var(--bg); color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
    overflow:hidden;
  }
  #stage { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  .slide {
    display:none; width:100%; max-width:960px; padding:7vh 8vw; margin:0 auto;
  }
  .slide.on { display:block; animation:fade .35s ease; }
  @keyframes fade { from{opacity:0; transform:translateY(8px);} to{opacity:1; transform:none;} }
  .kicker {
    font-size:13px; font-weight:600; letter-spacing:.16em; text-transform:uppercase;
    color:var(--accent); margin-bottom:26px;
  }
  h1 { font-family:'Sora',sans-serif; font-weight:800; font-size:clamp(32px,6vw,60px); line-height:1.05; letter-spacing:-.02em; }
  h2 { font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(26px,4.4vw,42px); line-height:1.12; letter-spacing:-.015em; }
  .sub { font-size:clamp(17px,2.3vw,22px); color:var(--ink-soft); margin-top:22px; max-width:40ch; line-height:1.5; }
  .big { font-family:'Sora',sans-serif; font-weight:700; font-size:clamp(24px,3.6vw,36px); line-height:1.2; letter-spacing:-.01em; }
  .body { font-size:clamp(16px,2.1vw,20px); color:var(--ink-soft); margin-top:20px; line-height:1.6; max-width:44ch; }
  .a { color:var(--accent); }
  ul { list-style:none; margin-top:26px; }
  li { position:relative; padding-left:30px; margin-bottom:16px; font-size:clamp(16px,2.1vw,20px); color:var(--ink-soft); line-height:1.5; max-width:46ch; }
  li::before { content:""; position:absolute; left:0; top:.6em; width:9px; height:9px; border-radius:50%; background:var(--accent); }
  .arch { display:flex; gap:18px; margin-top:30px; flex-wrap:wrap; }
  .arch .c { flex:1 1 200px; background:var(--panel); border:1px solid var(--rule); border-radius:14px; padding:22px 20px; }
  .arch .c .n { font-family:'Sora',sans-serif; font-weight:700; font-size:22px; color:var(--ink); }
  .arch .c .d { font-size:15px; color:var(--ink-muted); margin-top:8px; line-height:1.45; }
  .arch .c .t { font-size:12px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; color:var(--accent); }
  .lead { font-family:'Sora',sans-serif; font-weight:600; font-size:clamp(15px,2vw,18px); color:var(--ink-muted); margin-bottom:14px; }
  .strike { position:relative; color:var(--ink-muted); }
  .strike::after { content:""; position:absolute; left:-2%; right:-2%; top:52%; height:3px; background:var(--accent); transform:rotate(-2deg); }
  .credit { font-size:15px; color:var(--ink-muted); margin-top:26px; }
  .disclaimer { font-size:13px; color:var(--ink-muted); margin-top:30px; max-width:52ch; line-height:1.5; }
  .ctabtn { display:inline-block; margin-top:28px; background:var(--accent); color:#1a1205; font-family:'Sora',sans-serif; font-weight:700; font-size:18px; padding:15px 30px; border-radius:999px; }
  .dots { position:fixed; bottom:26px; left:0; right:0; display:flex; gap:7px; justify-content:center; }
  .dots i { width:7px; height:7px; border-radius:50%; border:1.5px solid var(--ink-muted); display:block; }
  .dots i.on { background:var(--accent); border-color:var(--accent); }
  .nav { position:fixed; bottom:20px; right:26px; font-size:13px; color:var(--ink-muted); font-weight:500; }
  .mark { display:flex; gap:9px; margin-bottom:30px; }
  .mark span { width:12px; height:12px; border-radius:50%; border:1.6px solid var(--ink-muted); }
  .mark span.f { background:var(--accent); border-color:var(--accent); }
  @media (max-width:640px){ .slide{ padding:8vh 8vw; } }
</style>
</head>
<body>
<div id="stage"></div>
<div class="dots" id="dots"></div>
<div class="nav">← → to move</div>
<script>
const S = [
  {t:'title',
    mark:true,
    kicker:"A live masterclass with Niiamah Ashong",
    h:"The Only One <span class='a'>in the Room</span>.",
    sub:"How to turn being different into the edge you lead with, instead of the thing you shrink around." },

  {t:'promise',
    kicker:"What this hour is for",
    h:"You stop editing yourself down.",
    body:"If you have spent your career as the only one like you in the room, this is the session where being different stops being a cost and starts being your advantage." },

  {t:'audience',
    kicker:"Who this is for",
    h:"The one who never quite fit the mold.",
    list:[
      "You are high-achieving and you have always been an outlier in your field.",
      "You learned early to read the room and blend in to belong.",
      "You are ready to lead as yourself, not as a smoothed-over version of you." ] },

  {t:'trap',
    kicker:"The trap",
    lead:"So you did what worked.",
    big:"You made yourself <span class='a'>easier to accept.</span>",
    body:"You softened the accent, hid the odd interests, dimmed the parts that stood out. It got you in the room. It also quietly cost you the thing that made you worth listening to." },

  {t:'reframe',
    kicker:"The reframe",
    lead:"Here is the part nobody told you.",
    big:"Your difference was never the <span class='a'>liability.</span>",
    body:"The room does not need one more person who agrees. It needs the one person who sees it differently. That has been you the whole time." },

  {t:'part',
    kicker:"Part one",
    h:"The people-pleasing tax.",
    sub:"Why fitting in quietly drains the leaders who are best at it." },

  {t:'point',
    kicker:"Part one",
    h:"What blending in actually costs.",
    list:[
      "Your judgment gets filtered through what the room wants to hear.",
      "Your energy goes to managing how you come across, not to the work.",
      "The idea only you could have brought never makes it out of your head." ] },

  {t:'point',
    kicker:"Part one",
    h:"Being liked is not the same as leading.",
    body:"Approval feels safe, so we optimize for it. But you were not put in that room to be agreeable. You were put there to move it. Those are different jobs, and only one of them is yours." },

  {t:'part',
    kicker:"Part two",
    h:"The One of the Only method.",
    sub:"My framework for turning outsider status into an operating edge." },

  {t:'archetypes',
    kicker:"Part two · name your archetype",
    h:"First, know which one you are.",
    cards:[
      { n:"Outlier", t:"One of the only", d:"The only one like you in the room. Your read is the one nobody else in the room can give." },
      { n:"Pioneer", t:"One of the first", d:"First through the door. Your job is to make a path the next ones can follow." },
      { n:"Maverick", t:"One of a kind", d:"Wired unlike anyone around you. Your difference is the whole point, not a rough edge." } ] },

  {t:'point',
    kicker:"Part two · the shift",
    h:"Difference becomes leverage.",
    body:"Once you name your archetype, the traits you used to apologize for become the reason people follow you. You stop asking how to fit in and start asking what only you can do here." },

  {t:'point',
    kicker:"Part two · the Power of NO",
    h:"Protect the one thing only you can do.",
    list:[
      "Every yes to fitting in is a no to the work that is yours.",
      "Strategic refusal is how you defend your time, focus, and identity.",
      "The Power of NO is not rejection. It is you choosing your contribution." ] },

  {t:'point',
    kicker:"Part two · put it together",
    h:"Lead from the difference.",
    body:"Your archetype tells you what you are for. The Power of NO clears the space for it. What is left is you, leading as only you can, with nothing sanded off to make it comfortable." },

  {t:'part',
    kicker:"Part three",
    h:"When the difference becomes the advantage.",
    sub:"How the room changes once you stop shrinking to fit it." },

  {t:'point',
    kicker:"Part three",
    h:"A day on the other side of it.",
    list:[
      "You say the thing the room needs, not the thing it expects.",
      "You spend your energy on your work instead of your image.",
      "People come to you precisely because you are not like the rest." ] },

  {t:'credibility',
    kicker:"Why me",
    h:"I have been the only one in a lot of rooms.",
    body:"First-generation, one of the only students of color in the gifted programs, one of the few Black actuaries in my industry. I spent years learning to blend in before I learned to lead as myself. Outlier's Edge is the method I built from that turn.",
    credit:"Niiamah Ashong · founder, Outlier's Edge" },

  {t:'recap',
    kicker:"The whole idea, in one line",
    big:"Use what makes you different to make your <span class='a'>difference.</span>",
    body:"Name your archetype. Say the Power of NO. Lead from the difference instead of hiding it." },

  {t:'cta',
    kicker:"Your next step",
    h:"Come do the work with me.",
    body:"If this is the room you have been waiting to lead from, the next step is a conversation about which Outlier's Edge path fits where you are now.",
    ctatext:"Start your Outlier's Edge journey",
    disclaimer:"This masterclass is educational. No specific outcome or result is guaranteed. Results vary based on your own effort, circumstances, and how you apply what you learn." }
];

const stage=document.getElementById('stage'), dotsEl=document.getElementById('dots');
let i=0;
function esc(s){return s;}
function render(){
  stage.innerHTML='';
  const s=S[i];
  const d=document.createElement('div'); d.className='slide on';
  let h='';
  if(s.mark) h+="<div class='mark'><span></span><span></span><span class='f'></span><span></span><span></span></div>";
  if(s.kicker) h+=`<div class='kicker'>${s.kicker}</div>`;
  if(s.lead) h+=`<div class='lead'>${s.lead}</div>`;
  if(s.h) h+=`<h1>${s.h}</h1>`;
  if(s.big) h+=`<div class='big'>${s.big}</div>`;
  if(s.sub) h+=`<div class='sub'>${s.sub}</div>`;
  if(s.cards){ h+="<div class='arch'>"; s.cards.forEach(c=>{ h+=`<div class='c'><div class='t'>${c.t}</div><div class='n'>${c.n}</div><div class='d'>${c.d}</div></div>`; }); h+="</div>"; }
  if(s.list){ h+="<ul>"; s.list.forEach(x=>{ h+=`<li>${x}</li>`; }); h+="</ul>"; }
  if(s.body) h+=`<div class='body'>${s.body}</div>`;
  if(s.credit) h+=`<div class='credit'>${s.credit}</div>`;
  if(s.ctatext) h+=`<div class='ctabtn'>${s.ctatext}</div>`;
  if(s.disclaimer) h+=`<div class='disclaimer'>${s.disclaimer}</div>`;
  d.innerHTML=h; stage.appendChild(d);
  dotsEl.innerHTML=''; S.forEach((_,k)=>{ const b=document.createElement('i'); if(k===i)b.className='on'; dotsEl.appendChild(b); });
}
function go(n){ i=Math.max(0,Math.min(S.length-1,n)); render(); }
document.addEventListener('keydown',e=>{ if(e.key==='ArrowRight'||e.key===' ')go(i+1); if(e.key==='ArrowLeft')go(i-1); });
stage.addEventListener('click',e=>{ const x=e.clientX/window.innerWidth; go(x<0.3?i-1:i+1); });
render();
</script>
</body>
</html>
