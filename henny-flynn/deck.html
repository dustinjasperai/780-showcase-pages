<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meeting Change With Self-Compassion - a live masterclass with Henny Flynn</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tenor+Sans&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f4ee;
    --panel:#ece4da;
    --ink:#36302a;
    --accent:#36302a;
    --rule:#d8ccbd;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:"Libre Baskerville",Georgia,serif;line-height:1.6}
  .deck{max-width:960px;margin:0 auto;padding:48px 24px 96px}
  .slide{
    background:var(--bg);
    border:1px solid var(--rule);
    border-radius:4px;
    padding:72px 64px;
    margin:0 0 28px;
    min-height:460px;
    display:flex;flex-direction:column;justify-content:center;
  }
  .slide.center{text-align:center;align-items:center}
  .kicker{font-family:"Libre Baskerville",serif;font-style:italic;font-size:14px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);opacity:.75;margin-bottom:22px}
  h1{font-family:"Tenor Sans",serif;font-weight:400;font-size:46px;line-height:1.14;letter-spacing:.01em;margin-bottom:20px}
  h2{font-family:"Tenor Sans",serif;font-weight:400;font-size:34px;line-height:1.2;margin-bottom:18px}
  p{font-size:18px;max-width:62ch;margin-bottom:14px}
  .lead{font-size:21px}
  .big{font-family:"Tenor Sans",serif;font-size:30px;line-height:1.3;max-width:24ch}
  .sub{font-size:16px;opacity:.72;font-style:italic}
  .n{font-family:"Tenor Sans",serif;font-size:15px;letter-spacing:.2em;color:var(--accent);opacity:.6;margin-bottom:12px}
  .card{background:var(--panel);border-radius:4px;padding:28px 30px;margin:10px 0;text-align:left;width:100%;max-width:640px}
  .card h3{font-family:"Tenor Sans",serif;font-weight:400;font-size:22px;margin-bottom:8px}
  .card p{font-size:16px;margin:0}
  ul{list-style:none;max-width:620px;margin:8px auto;text-align:left}
  li{font-size:18px;padding:10px 0 10px 24px;border-bottom:1px solid var(--rule);position:relative}
  li:before{content:"";position:absolute;left:0;top:19px;width:8px;height:8px;border:1px solid var(--accent);border-radius:50%}
  li:last-child{border-bottom:0}
  .disclaimer{font-size:12px;opacity:.6;font-style:italic;margin-top:26px;max-width:60ch}
  .mark{font-family:"Tenor Sans",serif;font-size:14px;letter-spacing:.24em;text-transform:uppercase;opacity:.5}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S=[
  {t:'title', kicker:'A live masterclass', h:'Meeting Change With Self-Compassion', p:'Why self-kindness, not willpower, is what makes change actually hold.', foot:'with Henny Flynn'},
  {t:'presenter', kicker:'Your guide', h:'Henny Flynn', p:'Coach, author and retreat host. I work with people moving through change, using the science and practice of self-compassion. Clarity. Calm. Compassion.'},
  {t:'who', kicker:'Who this hour is for', h:'You are in a season of change', li:['A transition you did not choose, or one you did','A decision you keep circling','A quiet habit of being hard on yourself when things are hard']},
  {t:'trap', kicker:'The trap', h:'You have been taught to push', p:'Set the goal. Grip harder. If it slips, grip harder still. And when that does not work, the first voice to arrive is the critical one.', lead:true},
  {t:'hook', kicker:'A different idea', h:'What if willpower was never the problem?', p:'What if the reason change keeps stalling is that we try to force it, instead of first understanding it with kindness?'},
  {t:'part', n:'Part One', h:'Why self-criticism stalls change'},
  {t:'body', kicker:'The core problem', h:'Pressure narrows you', p:'When we meet our own difficulty with judgement, the nervous system treats it as threat. We get smaller, more defensive, less able to see clearly or try something new. Criticism feels like motivation. It is mostly just noise.'},
  {t:'body', kicker:'The research', h:'Kindness widens you', p:'The science of self-compassion is plain: people who meet themselves with warmth recover faster, take more honest responsibility, and are more willing to change. Not softer. Steadier.'},
  {t:'part', n:'Part Two', h:'Compassionate self-enquiry'},
  {t:'framework', kicker:'The method', h:'Three gentle moves', cards:[
     {h:'1 - Listen',p:'Stop analysing. Notice what is actually here, in the body and the thoughts, without rushing to fix it.'},
     {h:'2 - Meet it with kindness',p:'Bring honesty, curiosity and kindness to whatever you find. The same warmth you would offer a friend.'},
     {h:'3 - Let it reveal',p:'Revelation, not transformation. You do not need fixing. You need room to see what wants to change.'}]},
  {t:'body', kicker:'Move one', h:'Listen deeply', p:'Most of us live a half-step ahead of ourselves, already solving. The first practice is simply to slow down and notice what is actually present, before deciding anything about it.'},
  {t:'body', kicker:'Move two', h:'Meet it with kindness', p:'Honesty, curiosity and kindness, together. Honesty so you see it clearly. Curiosity so you stay open. Kindness so it feels safe enough to be true.'},
  {t:'body', kicker:'Move three', h:'Revelation, not transformation', p:'This is the heart of it. You are not a project to be fixed. When you stop forcing, what needs to change tends to show itself, and change made this way holds.'},
  {t:'practice', kicker:'The daily practice', h:'Flow Journaling', p:'A short, reflective write, most days. Not a diary of events, a way to turn self-enquiry into something you can actually do on the page, and to catch the critical voice in the act.'},
  {t:'practice', kicker:'The daily rep', h:'everyday compassion', p:'Compassion is not a mood you wait for. It is a practice you build in small reps, one ordinary day at a time. That is the whole idea behind the everyday compassion book and podcast.'},
  {t:'picture', n:'Part Three', h:'What a week of this looks like', li:['A few quiet minutes to notice, before the day grips you','One honest page when something stings','Meeting the hard moment with curiosity instead of a verdict','By Friday, a little more room, and a change that is yours']},
  {t:'why', kicker:'Why this way', h:'Gentle is not the same as slow', p:'People arrive expecting self-compassion to be the soft option. It is the opposite. Meeting yourself honestly and kindly is the most direct route through change I know, which is why it sits under everything I teach.'},
  {t:'recap', kicker:'To carry with you', h:'Three moves', li:['Listen - notice what is actually here','Meet it with kindness - honesty, curiosity, warmth','Let it reveal - revelation, not transformation']},
  {t:'invite', kicker:'If this resonates', h:'There is a next step', p:'If you want to go deeper, this is the work of my programmes: Immerse, a year-long small group, and The Field, a three-month group for compassionate self-enquiry. Or we can work one to one.'},
  {t:'cta', kicker:'Take the next step', h:'Come and do this work with me', p:'Join a cohort of Immerse or The Field, or book in for one-to-one coaching at hennyflynn.co.uk. Begin where you are, with a little more kindness.', mark:'hennyflynn.co.uk', disc:'This masterclass is educational. No particular outcome or result is guaranteed. Results vary from person to person, and nothing here is a substitute for medical or psychological care.'}
];
const deck=document.getElementById('deck');
function esc(s){return s}
S.forEach(s=>{
  const d=document.createElement('section');
  d.className='slide center';
  let h='';
  if(s.n) h+=`<div class="n">${s.n}</div>`;
  if(s.kicker) h+=`<div class="kicker">${s.kicker}</div>`;
  if(s.h) h+=`<h1>${s.h}</h1>`;
  if(s.p) h+=`<p class="${s.lead?'lead':''}">${s.p}</p>`;
  if(s.li){ h+='<ul>'+s.li.map(x=>`<li>${x}</li>`).join('')+'</ul>'; }
  if(s.cards){ h+=s.cards.map(c=>`<div class="card"><h3>${c.h}</h3><p>${c.p}</p></div>`).join(''); }
  if(s.mark) h+=`<div class="mark" style="margin-top:28px">${s.mark}</div>`;
  if(s.foot) h+=`<div class="sub" style="margin-top:20px">${s.foot}</div>`;
  if(s.disc) h+=`<div class="disclaimer">${s.disc}</div>`;
  d.innerHTML=h;
  deck.appendChild(d);
});
</script>
</body>
</html>
