<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Impact and Peace: The Founder's Operating Rhythm | Benny Fisher</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Source+Sans+3:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f3eee4;      /* his dominant warm cream */
    --panel:#f6f2e8;   /* lightened cream */
    --card:#ffffff;
    --ink:#191919;     /* his near-black ink */
    --muted:#c9cacd;   /* his cool grey */
    --accent:#f6ce3d;  /* his button gold */
    --head:'Poppins', system-ui, sans-serif;
    --body:'Source Sans 3', system-ui, sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--body)}
  .deck{max-width:1040px;margin:0 auto;padding:40px 22px 80px}
  .slide{background:var(--card);border:1px solid rgba(25,25,25,0.10);border-radius:18px;
    padding:56px 54px;margin:0 0 26px;min-height:460px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide.alt{background:var(--panel)}
  .slide.dark{background:var(--ink);color:var(--bg)}
  .slide.dark .kick{color:var(--accent)}
  .rule{width:64px;height:5px;background:var(--accent);border-radius:3px;margin:0 0 22px}
  .kick{font-family:var(--head);font-weight:600;font-size:14px;letter-spacing:.14em;
    text-transform:uppercase;color:#7a6a2e;margin:0 0 16px}
  h1{font-family:var(--head);font-weight:700;font-size:clamp(34px,5vw,58px);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--head);font-weight:700;font-size:clamp(28px,4vw,44px);line-height:1.08;letter-spacing:-.01em}
  .lead{font-size:clamp(18px,2.2vw,23px);line-height:1.5;margin-top:18px;max-width:40ch}
  .big{font-family:var(--head);font-weight:700;font-size:clamp(30px,4.4vw,50px);line-height:1.12}
  .big .a{color:var(--accent)}
  p.body{font-size:18px;line-height:1.6;margin-top:14px;max-width:52ch}
  ul{list-style:none;margin-top:22px;display:flex;flex-direction:column;gap:16px;max-width:60ch}
  li{position:relative;padding-left:34px;font-size:18px;line-height:1.5}
  li::before{content:"";position:absolute;left:0;top:9px;width:16px;height:16px;border-radius:50%;
    background:var(--accent)}
  li b{font-family:var(--head);font-weight:600}
  .num{font-family:var(--head);font-weight:700;color:var(--accent);font-size:15px;letter-spacing:.12em}
  .q{font-family:var(--head);font-weight:600;font-size:clamp(24px,3.3vw,38px);line-height:1.22;max-width:22ch}
  .cite{margin-top:22px;font-size:16px;color:#5a5a5a;letter-spacing:.02em}
  .foot{position:absolute;bottom:20px;left:54px;font-size:13px;color:#9a9a9a;letter-spacing:.06em;font-family:var(--head)}
  .pagenum{position:absolute;top:22px;right:28px;font-size:13px;color:var(--muted);font-family:var(--head)}
  .disc{margin-top:26px;font-size:13.5px;line-height:1.5;color:#5a5a5a;max-width:60ch}
  .cta-steps{display:flex;flex-direction:column;gap:12px;margin-top:22px}
  .cta-steps a{color:var(--ink)}
  .pill{display:inline-block;background:var(--accent);color:var(--ink);font-family:var(--head);
    font-weight:600;padding:12px 22px;border-radius:999px;margin-top:24px;font-size:17px}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kick:'A live masterclass for founder-led owners', h:'Impact and Peace',
   sub:'The founder’s operating rhythm: how to build the business and keep yourself at the same time.', foot:'Benny Fisher · Visionary Navigator'},

  {t:'who', kick:'Who this is for',
   h:'You built something real. And you’re quietly carrying too much.',
   body:'Founder-led owners, home service and beyond, who hit the number and still feel stretched thin. Successful on paper, running on fumes underneath.'},

  {t:'trap', kick:'The trap', cls:'alt',
   big:'Every answer you’ve been sold is <span class="a">more.</span>',
   body:'More leads. More systems. More frameworks. More output. So you add another tool, and the weight on you goes up, not down.'},

  {t:'reframe', kick:'The reframe', cls:'dark',
   big:'You don’t need another framework.<br>You need to be <span class="a">seen.</span>',
   body:'Most groups offer advice. Few offer alignment. Growth that costs you yourself is not growth.'},

  {t:'section', num:'PART ONE', h:'Why success stopped feeling like success', cls:'alt'},

  {t:'point', kick:'The split most founders live in',
   h:'Impact went up. Peace went down.',
   body:'The business scaled and your life got smaller. You told yourself peace is the reward you collect after the exit. It is not. Peace deferred is peace you never take.'},

  {t:'point', kick:'The real problem',
   h:'You are carrying what the business should be holding.',
   body:'Cash lives in your head. Issues come home with you. Priorities multiply. The company runs through you, so it cannot run without you, and neither can your mind at 11pm.'},

  {t:'quote', q:'Impact in your business. Peace in your life. Built on purpose, at the same time.', cite:'The whole promise, in one line.', cls:'dark'},

  {t:'section', num:'PART TWO', h:'The operating rhythm'},

  {t:'point', kick:'The posture it runs on',
   h:'Alignment, not advice.',
   body:'Before the tactics: see the whole founder, business, life and self together. Name where you are carrying too much. Lead from faith, not fear. Everything below is how that becomes a weekly practice.'},

  {t:'pillar', num:'DISCIPLINE 01', h:'The Weekly Cash Review', cls:'alt',
   body:'Same day, same time, 13 weeks ahead. Most founders only look at cash in a crisis. You replace the quarterly panic with a calm weekly rhythm, so the number stops being a source of fear and starts being a source of clarity.'},

  {t:'pillar', num:'DISCIPLINE 02', h:'The leadership meeting that empties your plate',
   body:'Three rules. Name the real issue honestly, not diplomatically. Solve it at the right level, not on your plate. Keep fewer priorities, kept honest. The room shifts from status reporting to decisions, and you stop carrying unresolved issues home.'},

  {t:'pillar', num:'DISCIPLINE 03', h:'The alignment check', cls:'alt',
   body:'A standing question on the week: where am I out of alignment, and what am I carrying that is not mine to carry? Misalignment is the leak. Catching it weekly is how peace gets built on purpose instead of hoped for.'},

  {t:'list', kick:'What the rhythm protects',
   h:'A calm, aligned week runs on four things',
   items:['<b>Cash</b> seen weekly, 13 weeks ahead','<b>Issues</b> named and solved at the right level','<b>Priorities</b> kept few and honest','<b>You</b> checked for alignment, not just output']},

  {t:'section', num:'PART THREE', h:'When the rhythm holds', cls:'alt'},

  {t:'point', kick:'The shift',
   h:'The company stops running through you.',
   body:'Decisions happen without you in the room. Cash is boring, in the best way. You come home without the day strapped to your back. The growth continues, and so do you.'},

  {t:'bio', kick:'Why me', cls:'dark',
   h:'I built it the hard way, and lost it, and built again.',
   body:'Bankruptcy. Two felonies. Deep personal loss. Then I founded and sold one of Pittsburgh’s fastest-growing companies. I am not here with a theory. I am here because I had to learn how to hold impact and peace at the same time, or lose both.'},

  {t:'quote', q:'Most groups offer advice. Few offer alignment.', cite:'The Pond · a private founder circle', cls:'alt'},

  {t:'recap', kick:'The one thing to leave with',
   big:'Peace is not the reward after the work.<br>It is <span class="a">part of</span> the work.',
   body:'Impact and peace, built in the same week, on purpose.'},

  {t:'cta', kick:'Your next step', h:'Let’s build your rhythm.',
   body:'If this is the way you want to lead, the next step is a clarity call. We look at where you are carrying too much and what an aligned operating rhythm would look like for your company.',
   pill:'Book a clarity call · bennyfisher.com/book-a-call',
   disc:'This masterclass is educational. No specific income or result is guaranteed. Results vary from founder to founder, and depend on your own business, effort and circumstances.'}
];

const deck = document.getElementById('deck');
S.forEach((s, i) => {
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  let html = '';
  if (s.kick) html += '<div class="kick">' + s.kick + '</div>';
  if (s.num) html += '<div class="num">' + s.num + '</div>';
  html += '<div class="rule"></div>';
  if (s.h) html += (s.t === 'title' ? '<h1>' : '<h2>') + s.h + (s.t === 'title' ? '</h1>' : '</h2>');
  if (s.big) html += '<div class="big">' + s.big + '</div>';
  if (s.q) html += '<div class="q">“' + s.q + '”</div>';
  if (s.sub) html += '<p class="lead">' + s.sub + '</p>';
  if (s.body) html += '<p class="body">' + s.body + '</p>';
  if (s.items) { html += '<ul>'; s.items.forEach(x => html += '<li>' + x + '</li>'); html += '</ul>'; }
  if (s.cite) html += '<div class="cite">' + s.cite + '</div>';
  if (s.pill) html += '<div class="pill">' + s.pill + '</div>';
  if (s.disc) html += '<div class="disc">' + s.disc + '</div>';
  if (s.foot) html += '<div class="foot">' + s.foot + '</div>';
  html += '<div class="pagenum">' + (i + 1) + ' / ' + S.length + '</div>';
  el.innerHTML = html;
  deck.appendChild(el);
});
</script>
</body>
</html>
