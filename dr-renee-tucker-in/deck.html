<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Heal the Horse, Not the Symptom — An Intro to the Tucker BioKinetic Technique</title>
<!--
  Palette (from 01-deep-research.md ## Palette, brand.json via extract_brand.js):
  ground #241812 deep saddle-brown (from site #251911), panel #30221a, rule #4a3528,
  accent #F1C40F warm gold (verbatim brand.json ranked_colors), ink #F7F1E8 cream.
  Type: Cardo (serif headings) + Karla (sans body), both her own site faces.
  Motif: the MasterPoint, a single gold dot marking where the hands listen.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cardo:ital,wght@0,400;0,700;1,400&family=Karla:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ground:#241812; --panel:#30221a; --rule:#4a3528;
    --accent:#F1C40F; --ink:#F7F1E8; --muted:#c7b6a6;
    --serif:'Cardo',Georgia,serif; --sans:'Karla',system-ui,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth}
  body{background:var(--ground);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
  .deck{scroll-snap-type:y mandatory;height:100vh;overflow-y:scroll}
  .slide{scroll-snap-align:start;min-height:100vh;display:flex;flex-direction:column;justify-content:center;
    padding:8vh 9vw;position:relative;border-bottom:1px solid var(--rule)}
  .kicker{font-family:var(--sans);font-weight:700;letter-spacing:.22em;text-transform:uppercase;
    font-size:.8rem;color:var(--accent);margin-bottom:1.4rem;display:flex;align-items:center;gap:.6rem}
  .kicker::before{content:"";width:9px;height:9px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px rgba(241,196,15,.18)}
  h1{font-family:var(--serif);font-weight:700;font-size:clamp(2.4rem,6vw,4.6rem);line-height:1.04;letter-spacing:-.01em}
  h2{font-family:var(--serif);font-weight:700;font-size:clamp(1.9rem,4.2vw,3.1rem);line-height:1.1;margin-bottom:1.3rem}
  .sub{font-size:clamp(1.05rem,1.7vw,1.4rem);color:var(--muted);max-width:46ch;margin-top:1.6rem}
  .lead{font-size:clamp(1.15rem,1.9vw,1.6rem);max-width:52ch}
  .lead.big{font-family:var(--serif);font-size:clamp(1.6rem,3.2vw,2.5rem);line-height:1.25;color:var(--ink)}
  ul{list-style:none;margin-top:1.8rem;max-width:54ch}
  li{position:relative;padding-left:2rem;margin-bottom:1.15rem;font-size:clamp(1.05rem,1.6vw,1.35rem)}
  li::before{content:"";position:absolute;left:0;top:.55em;width:10px;height:10px;border-radius:50%;
    background:var(--accent)}
  li b{color:var(--accent);font-weight:700}
  .divider h1{color:var(--ink)}
  .divider .idx{font-family:var(--serif);font-style:italic;color:var(--accent);font-size:clamp(1.1rem,2vw,1.6rem);margin-bottom:.8rem}
  .panel{background:var(--panel);border:1px solid var(--rule);border-radius:14px;padding:clamp(1.6rem,3vw,2.6rem);max-width:56ch;margin-top:1.8rem}
  .stepnum{font-family:var(--serif);color:var(--accent);font-size:1.3rem;margin-right:.5rem}
  .foot{position:absolute;bottom:3.2vh;left:9vw;right:9vw;display:flex;justify-content:space-between;
    font-size:.78rem;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
  .disc{font-size:.82rem;color:var(--muted);max-width:60ch;margin-top:2rem;line-height:1.55}
  .cta-step{font-family:var(--serif);font-size:clamp(1.3rem,2.4vw,1.9rem);color:var(--accent);margin-top:1.4rem}
  @media(max-width:600px){.slide{padding:7vh 7vw}}
</style>
</head>
<body>
<div class="deck" id="deck"></div>
<script>
const S = [
  {t:'title', kicker:'An intro to the Tucker BioKinetic Technique',
    h:'Heal the Horse, Not the Symptom',
    sub:'How to find the primary cause of chronic lameness and fix it with your own hands. With Dr. Renee Tucker, DVM.'},

  {t:'agenda', kicker:'What you will leave with', h:'Three things, in the next hour',
    items:['The real reason treatments give a few good weeks and then stop working',
      'How to read a horse for the <b>primary cause</b> instead of chasing symptoms',
      'A simple Body Checkup you can run on your own horse this weekend']},

  {t:'who', kicker:'Who this is for', h:'You are in the right room if you are a',
    items:['<b>Curious horse owner</b> tired of hearing there is nothing more we can do',
      '<b>Practitioner or bodyworker</b> who wants fixes that hold instead of snapping back',
      '<b>Aspiring healer</b> looking for a horse centered career without years of vet school']},

  {t:'trap', kicker:'The trap', h:'You have already tried everything',
    lead:'Images and injections. Rest and more rest. New feed. A different saddle. One bodywork modality after another. You did the work and you spent the money.'},

  {t:'reframe', divider:false, kicker:'The pattern', h:'A few good weeks. Then it is back.',
    lead:'The soreness returns. The stiffness returns. The behavior returns. And the answers run out: it is just age, it is just behavioral, that is just how they move.'},

  {t:'bigidea', kicker:'The reframe', big:true,
    lead:'It was never just age, and you are not imagining it. The problem has a primary cause that no one has gone looking for.'},

  {t:'divider', idx:'Part One', h:'Why symptoms keep coming back'},

  {t:'content', kicker:'The symptom treadmill', h:'Treating the loud spot is not treating the cause',
    lead:'A sore hock, a dropped shoulder, a short stride: these are where the body is compensating, not where the trouble started. Treat the compensation and the body simply finds another way to protect the true cause.'},

  {t:'content', kicker:'The muscle memory myth', h:'Horses do not relapse out of habit',
    lead:'When a fix does not hold, it is not muscle memory pulling the horse back. It is an unresolved primary misalignment still sending the same signal. Fix the cause and there is nothing to relapse to.'},

  {t:'divider', idx:'Part Two', h:'The Tucker BioKinetic Technique'},

  {t:'framework', kicker:'Pillar one', h:'Primary Cause Analysis',
    lead:'Before a single hand is laid on the horse, TBT reads the clues the body is already giving: behavior, movement, the way the feet land, and the body’s asymmetry. Those clues point to the one primary cause of skeletal and energetic misalignment, instead of the ten symptoms it creates.'},

  {t:'framework', kicker:'Pillar two', h:'BioKinetic MasterPoints',
    lead:'A two handed, deep energetic touch engages specific BioKinetic MasterPoints and coaxes the bones to realign correctly. You learn how your hands can listen to the body and work with the horse’s own immune system and biomechanical feedback loops, not against them.'},

  {t:'framework', kicker:'Pillar three', h:'The alignment layers',
    items:['<b>Skeletal alignment</b> for the structure the horse stands and moves on',
      '<b>Functional alignment</b> for organs, muscles, nerves, fascia and cranial sacral flow',
      '<b>Multi layered alignment</b> for the emotional and mental holding patterns underneath']},

  {t:'content', kicker:'What this is not', h:'TBT is its own method',
    lead:'It is not reiki, Tellington touch, Masterson, acupressure, or chiropractic. It can look like them from the outside. The difference is that TBT starts from the primary cause and uses the MasterPoints to create a lasting structural change, not a temporary release.'},

  {t:'divider', idx:'Part Three', h:'Horses that move well again'},

  {t:'content', kicker:'Try it yourself', h:'The 60 second Body Checkup',
    items:['Watch how each foot lands and loads',
      'Read the body for side to side asymmetry',
      'Follow the asymmetry back to the cause, not the sore spot']},

  {t:'content', kicker:'The payoff', h:'Lasting change, not another good week',
    lead:'When the primary cause is corrected, the horse moves differently that same day and keeps moving well. Conditions written off as genetic, permanent or untreatable often turn out to be none of those things.'},

  {t:'why', kicker:'Why learn this from me', h:'Dr. Renee Tucker, DVM',
    lead:'I practiced as a traditional equine veterinarian for over thirty years, running the exams and giving the injections, until I had to admit I was managing symptoms instead of fixing horses. I developed the Tucker BioKinetic Technique to change that, wrote Where Does My Horse Hurt?, and now I teach it worldwide.'},

  {t:'cta', kicker:'Your next step', h:'Come learn the whole method',
    step:'Watch the full free training, then apply to Tucker BioKinetic University.',
    disc:'This training is educational. The Tucker BioKinetic Technique is a complementary approach and is not a substitute for veterinary diagnosis or care. Results vary from horse to horse, and no specific result is guaranteed.'}
];

const deck = document.getElementById('deck');
function esc(x){return x||''}
S.forEach((s,i)=>{
  const sec=document.createElement('section');
  sec.className='slide'+(s.t==='divider'?' divider':'');
  let html='';
  if(s.kicker) html+=`<div class="kicker">${esc(s.kicker)}</div>`;
  if(s.t==='divider'){ html+=`<div class="idx">${esc(s.idx)}</div><h1>${esc(s.h)}</h1>`; }
  else if(s.t==='title'){ html+=`<h1>${esc(s.h)}</h1><div class="sub">${esc(s.sub)}</div>`; }
  else if(s.t==='bigidea'){ html+=`<p class="lead big">${esc(s.lead)}</p>`; }
  else {
    if(s.h) html+=`<h2>${esc(s.h)}</h2>`;
    if(s.lead) html+=`<p class="lead${s.big?' big':''}">${esc(s.lead)}</p>`;
    if(s.items){ html+='<ul>'+s.items.map(x=>`<li>${x}</li>`).join('')+'</ul>'; }
    if(s.step) html+=`<div class="cta-step">${esc(s.step)}</div>`;
    if(s.disc) html+=`<p class="disc">${esc(s.disc)}</p>`;
  }
  html+=`<div class="foot"><span>Tucker BioKinetic Technique</span><span>${i+1} / ${S.length}</span></div>`;
  sec.innerHTML=html;
  deck.appendChild(sec);
});
</script>
</body>
</html>
