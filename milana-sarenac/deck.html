<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Magnetic Selling, a masterclass with Milana Sarenac</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#1a1620;      /* her dominant near-black #1e1e1e, warmed toward her lavender */
    --panel:#241e2b;
    --ink:#f6f2fa;
    --mut:#c7bcd2;
    --rule:rgba(255,255,255,0.10);
    --accent:#ecccfb;  /* harvested footer lavender, verbatim */
    --head:'Instrument Serif', Georgia, serif;
    --body:'Work Sans', system-ui, sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:#0f0c13;color:var(--ink);font-family:var(--body)}
  .wrap{max-width:960px;margin:0 auto;padding:40px 20px}
  .slide{background:var(--bg);border:1px solid var(--rule);border-radius:18px;
    padding:64px 60px;margin:22px 0;min-height:440px;display:flex;flex-direction:column;
    justify-content:center;position:relative;overflow:hidden}
  .slide::before{content:"";position:absolute;left:60px;top:46px;width:54px;height:3px;
    background:var(--accent);border-radius:2px;opacity:.9}
  .kick{font-family:var(--body);font-weight:600;letter-spacing:.14em;text-transform:uppercase;
    font-size:12px;color:var(--accent);margin:0 0 18px}
  h1{font-family:var(--head);font-weight:400;font-size:58px;line-height:1.05;margin:0 0 18px}
  h2{font-family:var(--head);font-weight:400;font-size:40px;line-height:1.1;margin:0 0 16px}
  p{font-size:20px;line-height:1.55;color:var(--mut);margin:0 0 14px;max-width:60ch}
  .lead{font-size:26px;color:var(--ink)}
  ul{margin:10px 0 0;padding:0;list-style:none}
  li{font-size:21px;line-height:1.5;color:var(--ink);padding:10px 0 10px 30px;position:relative}
  li::before{content:"";position:absolute;left:0;top:19px;width:12px;height:12px;
    background:var(--accent);border-radius:50%}
  .big{font-family:var(--head);font-size:46px;color:var(--ink);line-height:1.12}
  .accent{color:var(--accent)}
  .foot{margin-top:28px;font-size:14px;color:var(--mut)}
  .disc{font-size:14px;color:var(--mut);margin-top:22px;max-width:70ch}
  .num{font-family:var(--head);font-size:40px;color:var(--accent);margin-right:14px}
  .title-foot{font-size:16px;color:var(--mut);margin-top:30px}
</style>
</head>
<body>
<div class="wrap" id="deck"></div>
<script>
const S = [
  {t:'title', cls:'title', html:`
    <p class="kick">A live masterclass</p>
    <h1>Magnetic Selling</h1>
    <p class="lead">How to sell high-ticket without feeling salesy.</p>
    <p class="title-foot">with Milana Sarenac, founder of Empower Sales</p>`},

  {t:'promise', html:`
    <p class="kick">What you'll leave with</p>
    <h2>By the end of this hour</h2>
    <ul>
      <li>Why your offer isn't converting, and it isn't your price</li>
      <li>The exact messaging shift that makes the sale feel obvious</li>
      <li>How to sell from calm instead of scarcity</li>
      <li>One way to sell at every price point, from low-ticket to high-ticket</li>
    </ul>`},

  {t:'audience', html:`
    <p class="kick">Who this is for</p>
    <h2>The woman founder who has a real offer, and dreads selling it</h2>
    <p>You've built something good. You know it works. But every time you have to sell it,
    something in you tightens up, so you discount, you hide, you post and hope.</p>`},

  {t:'trap', html:`
    <p class="kick">The trap</p>
    <h2>So you do what feels safe</h2>
    <ul>
      <li>You lower the price before anyone even objects</li>
      <li>You add more to the offer instead of making it clearer</li>
      <li>You launch, hear crickets, and quietly blame your audience size</li>
      <li>You tell yourself you're just "not a salesy person"</li>
    </ul>`},

  {t:'reframe', cls:'reframe', html:`
    <p class="kick">The reframe</p>
    <p class="big">It was never your price. It was never your audience size.
    It's your <span class="accent">messaging</span> and your <span class="accent">energy</span>.</p>`},

  {t:'part', html:`
    <p class="kick">Part one</p>
    <h1>Why selling feels gross</h1>`},

  {t:'problem', html:`
    <h2>You learned bro-marketing</h2>
    <p>Fake scarcity. Countdown timers. Pressure. Your buyer can feel all of it, and so can you.
    That's the ick. It isn't selling that feels bad. It's that version of selling.</p>`},

  {t:'psychology', html:`
    <p class="kick">Buyer psychology</p>
    <h2>People don't buy when they're pushed</h2>
    <p>They buy when the hesitation is gone. When they understand exactly why this, why now,
    and why you. Your job is not to convince. It's to remove the doubt.</p>`},

  {t:'part', html:`
    <p class="kick">Part two</p>
    <h1>The three shifts</h1>`},

  {t:'shift', html:`
    <p class="kick"><span class="num">1</span>Magnetic Messaging</p>
    <h2>Make the sale obvious</h2>
    <p>Map why and how your buyer buys at each stage, then speak to it directly. When the
    messaging is right, you stop persuading. The right person reads it and thinks, finally.</p>`},

  {t:'shift', html:`
    <p class="kick"><span class="num">2</span>Big F Deal Energy</p>
    <h2>Sell from calm, not scarcity</h2>
    <p>Stay confident and a little detached, so sales flow toward you instead of being chased.
    Desperation repels. Grounded certainty is magnetic. This is the energetic half of selling.</p>`},

  {t:'shift', html:`
    <p class="kick"><span class="num">3</span>Sell at every price point</p>
    <h2>One set of principles, top to bottom</h2>
    <p>The same buyer psychology sells a low-ticket offer and a premium program. You don't
    become a different person to sell high-ticket. You just apply the same magnetic selling.</p>`},

  {t:'content', html:`
    <p class="kick">And your content</p>
    <h2>Likes are not the same as sales</h2>
    <p>Content that builds trust and keeps momentum through a whole launch is what turns an
    audience into buyers. The goal is not more posting. It's clearer selling, everywhere.</p>`},

  {t:'part', html:`
    <p class="kick">Part three</p>
    <h1>What changes for you</h1>`},

  {t:'after', html:`
    <h2>From here to there</h2>
    <ul>
      <li>You name your price once, calmly, and let it stand</li>
      <li>Your messaging does the convincing before you ever get on a call</li>
      <li>You sell high-ticket without a single pushy line</li>
      <li>Selling starts to feel like the best part of your business</li>
    </ul>`},

  {t:'whyme', html:`
    <p class="kick">Why me</p>
    <h2>A former lawyer who fell in love with selling</h2>
    <p>I'm Milana Sarenac, founder of Empower Sales and host of the Big Business Energy podcast.
    I've coached more than 1,000 women to sell with confidence instead of pressure. This is the
    method I teach them.</p>`},

  {t:'recap', html:`
    <p class="kick">The method</p>
    <h2>Magnetic Selling, in one line</h2>
    <p class="lead">Right messaging, grounded energy, applied at every price point, so the sale
    becomes the easy part.</p>`},

  {t:'cta', cls:'cta', html:`
    <p class="kick">Your next step</p>
    <h1>Ready to sell this way?</h1>
    <p>If you want help installing this in your business, the next step is the Magnetic
    Mastermind. Apply and we'll see if it's the right fit for where you're headed.</p>
    <p class="foot">milanasarenac.com</p>
    <p class="disc">Educational only. No income, role, or result is guaranteed, and results
    vary based on your effort, offer, and market.</p>`}
];
const root = document.getElementById('deck');
for (const s of S){
  const el = document.createElement('section');
  el.className = 'slide' + (s.cls ? ' ' + s.cls : '');
  el.innerHTML = s.html;
  root.appendChild(el);
}
</script>
</body>
</html>
